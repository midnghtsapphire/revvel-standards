# Self-host recipe for Lago (open source, AGPL-3.0) — WR #18333.
#
# Derived from the official compose file at
# https://github.com/getlago/lago/blob/main/docker-compose.yml (v1.57.0,
# fetched 2026-11-11) with these deliberate changes for a PUBLIC repository:
#   * every secret is REQUIRED from .env (`${VAR:?...}`); no vendor default
#     is carried over, so a forgotten value fails closed;
#   * api and front bind to 127.0.0.1 only; db and redis publish no host port.
#     Put a TLS reverse proxy you control in front of them;
#   * all images are pinned to exact tags (no `latest`).
#
# NOTHING here is deployed. Running it needs a host Audrey has approved
# (see HUMAN-STEPS.md). Local trial: `docker compose up` on any laptop is free.
#
# Official docs: https://doc.getlago.com/docs/guide/self-hosting/docker

volumes:
  lago_postgres_data:
  lago_redis_data:
  lago_storage_data:

x-postgres-image: &postgres-image
  image: getlago/postgres-partman:15.0-alpine
x-redis-image: &redis-image
  image: redis:7-alpine
x-backend-image: &backend-image
  image: getlago/api:v1.57.0
x-frontend-image: &frontend-image
  image: getlago/front:v1.57.0

x-lago-api-url: &lago-api-url
  LAGO_API_URL: ${LAGO_API_URL:-http://localhost:3000}
x-lago-front-url: &lago-front-url
  LAGO_FRONT_URL: ${LAGO_FRONT_URL:-http://localhost}

x-backend-environment: &backend-env
  # Compose variable references only; no password value is stored in this file.
  DATABASE_URL: postgresql://${POSTGRES_USER:-lago}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-lago}?search_path=public # ggignore
  REDIS_URL: redis://redis:6379
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?required}
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY:?required}
  LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:?required}
  LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY:?required}
  LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT:?required}
  LAGO_DISABLE_SEGMENT: ${LAGO_DISABLE_SEGMENT:-true}
  LAGO_USE_AWS_S3: "false"
  LAGO_SIDEKIQ_WEB: "false"
  LAGO_PDF_URL: http://pdf:3000
  LAGO_DISABLE_SIGNUP: ${LAGO_DISABLE_SIGNUP:-false}
  LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: ${LAGO_WEBHOOK_ALLOW_PRIVATE_URLS:-false}
  LAGO_FROM_EMAIL: ${LAGO_FROM_EMAIL:-}
  LAGO_SMTP_ADDRESS: ${LAGO_SMTP_ADDRESS:-}
  LAGO_SMTP_PORT: ${LAGO_SMTP_PORT:-587}
  LAGO_SMTP_USERNAME: ${LAGO_SMTP_USERNAME:-}
  LAGO_SMTP_PASSWORD: ${LAGO_SMTP_PASSWORD:-}

x-frontend-environment: &frontend-env
  API_URL: ${LAGO_API_URL:-http://localhost:3000}
  APP_ENV: production

services:
  db:
    <<: *postgres-image
    container_name: lago-db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-lago} -d ${POSTGRES_DB:-lago} -h localhost -p 5432
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lago}
      POSTGRES_USER: ${POSTGRES_USER:-lago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required} # ggignore
      PGDATA: /data/postgres
      PGPORT: "5432"
      POSTGRES_SCHEMA: public
    volumes:
      - lago_postgres_data:/data/postgres
    # No `ports:` on purpose. Reachable only on the compose network.

  redis:
    <<: *redis-image
    container_name: lago-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --port 6379
    volumes:
      - lago_redis_data:/data
    # No `ports:` on purpose. Reachable only on the compose network.

  migrate:
    <<: *backend-image
    container_name: lago-migrate
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: ["./scripts/migrate.sh"]
    environment:
      <<: *backend-env

  api:
    <<: *backend-image
    container_name: lago-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.api.sh"]
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 10s
      start_period: 30s
      timeout: 60s
      start_interval: 2s
    environment:
      <<: [*backend-env, *lago-api-url, *lago-front-url]
    volumes:
      - lago_storage_data:/app/storage
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000

  front:
    <<: *frontend-image
    container_name: lago-front
    restart: unless-stopped
    # Upstream runs nginx as a non-root user on a read-only root filesystem.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
        restart: true
    environment:
      <<: [*frontend-env, *lago-api-url, *lago-front-url]
    ports:
      - 127.0.0.1:${FRONT_PORT:-80}:8080

  api-worker:
    <<: *backend-image
    container_name: lago-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.worker.sh"]
    healthcheck:
      test: curl -f http://localhost:8080 || exit 1
      interval: 10s
      start_period: 30s
      timeout: 60s
      start_interval: 2s
    environment:
      <<: [*backend-env, *lago-api-url]
    volumes:
      - lago_storage_data:/app/storage

  api-clock:
    <<: *backend-image
    container_name: lago-clock
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.clock.sh"]
    environment:
      <<: [*backend-env, *lago-api-url]

  pdf:
    image: ghcr.io/getlago/lago-gotenberg:8.39
    container_name: lago-pdf
    restart: unless-stopped
