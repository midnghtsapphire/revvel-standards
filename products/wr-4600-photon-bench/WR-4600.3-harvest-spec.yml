target: 300 verified rows
rule: never emit a URL that was not returned by a live call. No exceptions.

shards:
  mechanism:    { api: eutils, term: "photobiomodulation AND (cytochrome c oxidase OR mitochondria)", n: 35 }
  human_trials: { api: ctgov_v2, term: "photobiomodulation OR low level light therapy", filter: "phase 2|3, has_results", n: 35 }
  adverse:      { api: eutils, term: "(photobiomodulation OR low level laser) AND (adverse OR burn OR injury OR complication)", n: 35 }
  preclinical:  { api: eutils, term: "photobiomodulation AND (in vitro OR rodent)", n: 25 }
  dosimetry:    { api: eutils, term: "photobiomodulation AND (fluence OR irradiance OR dosimetry)", n: 30 }
  biomarkers:   { api: eutils, term: "photobiomodulation AND (cytokine OR biomarker OR gene expression)", n: 25 }
  safety:       { api: web,    term: "IEC 62471 risk group | ICNIRP incoherent optical radiation limits", n: 20 }
  bnat_oled:    { api: crossref, term: "wearable OLED photobiomodulation textile patch", from: 2023, n: 25 }
  patents:      { api: patents_bq, cpc: "A61N5/06", from: 2021, n: 35 }
  emitters:     { api: digikey, filter: "wavelength 655-665|845-855, has_datasheet", n: 20 }
  drivers:      { api: mouser, filter: "constant current LED driver, PWM dim, >=90% eff", n: 15 }

dedup: doi || mpn || sha256(canonical_url)
gate:  each row -> {tag, claim, retrieved_at, sha256}; untagged row = defect
loop:  if shard yields < 60% of n after 3 reformulations -> escalate, do not pad
order: run `adverse` FIRST. Harm is mandatory-reportable; nulls are not
       publishable; therefore harm is better indexed. Search damage before benefit.