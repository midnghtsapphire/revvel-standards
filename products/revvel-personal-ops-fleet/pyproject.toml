[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revvel-personal-ops-fleet"
version = "0.1.0"
description = "Control plane for a hybrid personal operations agent fleet: plan, score, gate, audit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Revvel Standards / AgentOps" }]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "fastapi>=0.110", "reportlab>=4.0", "pypdf>=4.0"]

[project.scripts]
revvel-ops = "revvel_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
