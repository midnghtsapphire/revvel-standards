# DigitalOcean App Platform spec for affiliate-hub.
# Added 2026-11-11 by MarketShipper for WR #18330.
# Spec reference retrieved 2026-11-11:
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Secrets are names only. Do not put key material in this file. Set
# STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET, and
# STRIPE_PRICE_ID in the App Platform control panel (type SECRET) or supply
# them when the CircleCI job runs doctl. STRIPE_MODE stays test until Audrey
# changes it. A spec in git is not evidence the app exists.
#
# source_dir is / because dockerfile_path is relative to the repo root and
# the Dockerfile copies packages/ plus products/affiliate-hub/. DigitalOcean
# uses source_dir as the Docker build context. A product-directory context
# would hide packages/ and npm ci would fail.
# The retired spec in deploy/app.yaml stays commented.

name: affiliate-hub
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: affiliate-hub.revvel.co
    type: PRIMARY
    minimum_tls_version: "1.2"
services:
  - name: web
    github:
      repo: midnghtsapphire/revvel-standards
      branch: main
      # false so merging this branch does not make App Platform deploy on push.
      # Turning this on is only proposed on draft #18372 and needs Audrey's yes.
      deploy_on_push: false
    source_dir: /
    dockerfile_path: products/affiliate-hub/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
      port: 8080
    envs:
      - key: STRIPE_MODE
        scope: RUN_TIME
        value: test
        type: GENERAL
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://affiliate-hub.revvel.co
        type: GENERAL
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PUBLISHABLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PRICE_ID
        scope: RUN_TIME
        type: SECRET
    alerts:
      - rule: CPU_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        disabled: false
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
