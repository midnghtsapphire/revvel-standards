# Deep Research - GitHub Actions Workflow
# R&D Research Fleet v1.0.0

name: Deep Research

on:
  workflow_dispatch:
    inputs:
      query:
        description: Research question
        required: true
        type: string
      persona:
        description: Research persona
        required: false
        default: 'deep_search'
        type: choice
        options:
          - deep_search
          - market-researcher
          - technical-analyst
          - sustainability-auditor
          - patent-hunter
          - triz-specialist
          - doe-screener

permissions:
  contents: write
  issues: write

jobs:
  research:
    name: Deep R&D Research
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUERY: ${{ inputs.query }}
          PERSONA: ${{ inputs.persona }}
        run: |
          node deep-search-router.js --profile "$PERSONA" "$QUERY"

      - name: Create Research Report
        if: always()
        env:
          QUERY: ${{ inputs.query }}
        run: |
          gh issue create \
            --title "📊 Research Report: $QUERY" \
            --body "$(cat /tmp/research-results.md 2>/dev/null || echo 'Research completed')" \
            --label "research-report,auto-info"
