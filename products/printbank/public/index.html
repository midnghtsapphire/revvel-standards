<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrintBank — Vector Wall Art + Photo Sizer</title>
  <meta name="description" content="144 true-vector printable wall art SVGs. Plus: grade your own photos against 24 print sizes." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>PrintBank</h1>
    <p class="tag">True-vector wall art · client-side photo sizer</p>
  </header>
  <nav>
    <button data-tab="gallery" class="active">Gallery</button>
    <button data-tab="photos">Your Photos</button>
    <button data-tab="sizes">Size Guide</button>
  </nav>
  <main>
    <section id="gallery" class="tab active">
      <div class="controls">
        <input id="search" type="search" placeholder="Search prints…" />
        <select id="genre">
          <option value="">All genres</option>
        </select>
      </div>
      <div id="grid" class="grid"></div>
    </section>
    <section id="photos" class="tab">
      <div id="drop" class="drop">Drop a photo here or click to upload</div>
      <input id="file" type="file" accept="image/*" hidden />
      <div id="photo-report"></div>
    </section>
    <section id="sizes" class="tab">
      <table id="size-table"></table>
    </section>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-body">
      <button id="modal-close" class="close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>
  <script src="print-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
