<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintBank — Vector Wall Art + Photo Print Sizer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>PrintBank</h1>
  <nav>
    <button data-tab="gallery" class="active">Gallery</button>
    <button data-tab="photos">Your Photos</button>
    <button data-tab="sizes">Size Guide</button>
  </nav>
</header>

<main>
  <section id="gallery" class="tab active">
    <div class="controls">
      <input id="search" type="search" placeholder="Search prints…">
      <select id="genre-filter"><option value="">All genres</option></select>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="photos" class="tab">
    <div id="drop" class="drop">Drop a photo here or click to select</div>
    <input id="file" type="file" accept="image/*" hidden>
    <div id="photo-info"></div>
    <table id="photo-grades"></table>
  </section>

  <section id="sizes" class="tab">
    <table id="size-table"></table>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-body">
    <button id="modal-close">×</button>
    <div id="modal-preview"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<script src="print-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
