# DigitalOcean App Platform spec for the oAudrey front page.
# Added 2026-11-11 by MarketShipper.
# Spec reference retrieved 2026-11-11:
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# oaudrey/.do/app.yaml also names oaudrey.com and www.oaudrey.com, and that
# older spec has deploy_on_push true. This spec is the front page Audrey
# asked for. deploy_on_push stays false here. Applying both specs would
# register the same names on two apps. Audrey chooses which spec to apply.
# A spec in git is not evidence the app exists.
#
# DNS for these names is Cloudflare. Copy the records App Platform prints
# into the Cloudflare zone. Do not move the zone to DigitalOcean nameservers.
#
# source_dir is / because dockerfile_path is relative to the repo root and
# the Dockerfile copies packages/ plus this product. DigitalOcean uses
# source_dir as the Docker build context.

name: oaudrey-home
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: oaudrey.com
    type: PRIMARY
    minimum_tls_version: "1.2"
  - domain: www.oaudrey.com
    type: ALIAS
    minimum_tls_version: "1.2"
services:
  - name: web
    github:
      repo: midnghtsapphire/revvel-standards
      branch: main
      # false so merging this branch does not make App Platform deploy on push.
      deploy_on_push: false
    source_dir: /
    dockerfile_path: products/oaudrey-home/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
      port: 8080
    envs:
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://oaudrey.com
        type: GENERAL
      - key: GITHUB_READ_TOKEN
        scope: RUN_TIME
        type: SECRET
    alerts:
      - rule: CPU_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        disabled: false
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
