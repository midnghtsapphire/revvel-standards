# GoSQLX configuration for revvel-standards
# Docs: https://gosqlx.dev · standards/SQL_CODE_STANDARDS.md
# CI workflow: .github/workflows/gosqlx-lint.yml

dialect: postgresql

validate:
  strict: false
  fail-fast: false

lint:
  # Enable core style rules when lint is turned on (CLI / local).
  rules:
    - L001 # Trailing Whitespace
    - L002 # Mixed Indentation
    - L003 # Consecutive Blank Lines
    - L007 # Keyword Case Consistency (uppercase)
    - L009 # Aliasing Consistency
  max-line-length: 120
  severity: warning
  auto-fix: false

files:
  include:
    - "sql/**/*.sql"
    - "products/gosqlx-sql-linter/**/*.sql"
  exclude:
    # PL/pgSQL / CREATE FUNCTION not supported by GoSQLX v1.14 parser (E2002).
    - "schemas/**"
    - "skills/**"
    - "**/node_modules/**"
    - "**/.next/**"
