name: mabl
title: "Mabl CLI — AI-Powered Test Automation"
version: "1.0.0"
description: "Integrate the Mabl CLI into any Revvel project for AI-powered end-to-end, API, and cross-browser test automation via GitHub Actions."

metadata:
  author: "Revvel AI Engine"
  category: "Testing & Quality"
  tags:
    - mabl
    - e2e-testing
    - ai-testing
    - test-automation
    - cross-browser
    - self-healing-tests
    - github-actions
    - ci-cd
    - api-testing
    - deployment-events
  created_at: "2026-04-15"
  updated_at: "2026-04-15"

dependencies:
  skills:
    - testing
    - vault_agent     # for MABL_API_KEY and MABL_WORKSPACE_ID provisioning
    - ralph_loop      # for self-healing retry on Mabl test failure
  tools:
    - github_actions
    - nodejs          # Node.js 18+ required by the Mabl CLI
  pip_packages: []

workflow_files:
  - path: ".github/workflows/mabl.yml"
    description: "GitHub Actions workflow — triggers on PR and push to main"
  - path: "templates/cicd/mabl.yml"
    description: "Reusable template — copy to any app repo"

triggers:
  - "mabl"
  - "mabl cli"
  - "mabl tests"
  - "ai test automation"
  - "self-healing tests"
  - "cross-browser testing"
  - "deployment event"
  - "mabl test plan"
  - "mablhq"
  - "setup-mabl-cli"

implementation:
  type: "markdown_prompt"
  language: "markdown"
  content_ref: "skills/mabl/SKILL.md"

setup:
  steps:
    - step: 1
      action: "Create a Mabl account"
      url: "https://app.mabl.com"
    - step: 2
      action: "Create an application and environment in Mabl Dashboard"
      details: "Dashboard → Applications → New Application; Dashboard → Environments → New Environment"
    - step: 3
      action: "Create a test plan in Mabl Dashboard"
      details: "Dashboard → Plans → New Plan → link tests to the plan"
    - step: 4
      action: "Add MABL_API_KEY and MABL_WORKSPACE_ID to repository secrets"
      details: "Settings → Secrets and variables → Actions → New repository secret"
    - step: 5
      action: "Copy workflow template to target repo"
      command: "cp revvel-standards/templates/cicd/mabl.yml .github/workflows/mabl.yml"
    - step: 6
      action: "Set MABL_APP_ID and MABL_ENVIRONMENT_ID variables in mabl.yml"
      details: "Retrieve IDs from Mabl Dashboard URL for each resource"
    - step: 7
      action: "Verify workflow triggers on next PR or push to main"

examples:
  - description: "Set up Mabl on a new Revvel app repo"
    usage: |
      Load this skill, follow the setup steps above, add MABL_API_KEY and
      MABL_WORKSPACE_ID to GitHub Secrets, configure mabl.yml with your
      MABL_APP_ID and MABL_ENVIRONMENT_ID, then push a commit to trigger the workflow.
  - description: "Register a deployment event to trigger Mabl tests"
    usage: |
      mabl deployments create \
        --app-id $MABL_APP_ID \
        --environment-id $MABL_ENVIRONMENT_ID \
        --url https://yourapp.com
  - description: "Export test run artifacts after a failure"
    usage: |
      mabl test-runs export <TEST_RUN_ID> -f artifacts.zip

schema_version: "1.0"
