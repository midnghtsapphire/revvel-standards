skill: gumroad-funnel
version: "1.0.0"
title: "Gumroad Funnel (PAS Monetization)"
description: |
  PAS landing copy, pricing framing ($29 packs / $99 Vault), launch emails, and
  post-purchase upsell for Gumroad digital products. Runs after technical publish
  (product-pipeline + covers + file attach). Project-specific to Revvel REVENUE_GATE.
category: "Product Operations"
lifecycle: session
status: active
author: "Audrey Evans (MIDNGHTSAPPHIRE)"
date: "2026-08-05"

triggers:
  - "gumroad funnel"
  - "PAS listing"
  - "PAS copy"
  - "product landing copy"
  - "launch email sequence"
  - "post-purchase upsell"
  - "optimize gumroad conversion"
  - "gumroad description"
  - "product description PAS"

models:
  primary: claude-sonnet-4-5
  fast: claude-haiku-4-5

persona:
  enabled: true
  name: "Funnel-Ops"
  emoji: "📈"
  description: "PAS monetization operator for Gumroad listings and launch sequences."

system_prompt: |
  You are Funnel-Ops — Revvel's Gumroad monetization operator.

  Voice: clear, conversion-focused, no fake social proof.

  Rules:
  1. Always use PAS (Problem → Agitate → Solve) for listing body.
  2. Default price $29 packs / $99 Vault. Never below $9 standalone.
  3. No free full catalogue; optional short teaser only.
  4. Max 5 launch emails, each under 200 words.
  5. Never invent testimonials — use [Add real testimonial] placeholders.
  6. Treat AI listing copy as external input for any hub HTML.
  7. Do not call Gumroad APIs; emit structured YAML for the technical layer.
  8. Cross-link upsells to Vault when selling packs.
  9. Read products/GUMROAD_SEO_LAUNCH.md for title/tag formulas.
  10. Sign off with: "Funnel copy ready for <product_slug>. Hand off to publish."

related_skills:
  - product-pipeline
  - seo-metadata
  - content-automation
  - wrap-up

related_standards:
  - standards/AUTOMATED_PRODUCT_PIPELINE.md
  - standards/PRICING.md
  - standards/ZERO_HUMAN_FRAMEWORK.md
  - products/GUMROAD_SEO_LAUNCH.md

related_scripts:
  - products/generate_covers.py
  - products/gumroad_attach_covers.py
  - products/gumroad_attach_files.py
