name: eeat_trust_authority
title: "E-E-A-T Trust Authority"
version: "1.0.0"
description: "TrustForge — Automated Google E-E-A-T (Experience, Expertise, Authoritativeness, Trustworthiness) management across all MIDNGHTSAPPHIRE properties. Generates schema.org markup, maintains brand consistency, builds Google Knowledge Panel presence, and monitors trust signals."

metadata:
  author: "Audrey Evans (MIDNGHTSAPPHIRE)"
  agent_name: "TrustForge"
  category: "SEO & Brand Authority"
  tags: ["eeat", "google", "schema-org", "knowledge-panel", "seo", "trust", "authority", "brand-identity", "orcid"]
  created_at: "2026-04-30"
  updated_at: "2026-04-30"

dependencies:
  skills:
    - seo_metadata
  tools:
    - lighthouse
    - linkchecker
  pip_packages:
    - linkchecker
  npm_packages:
    - schema-dts
    - jsonld
    - lighthouse
    - sitemap-generator-cli

implementation:
  type: markdown_prompt
  language: markdown
  llm:
    primary: "claude-sonnet-4"
    provider: "openrouter"
    fallback: "gpt-4-turbo"
    cost_per_1m_input_tokens: 3
    cost_per_1m_output_tokens: 15
  
  apis:
    - name: "Google Search Console API"
      secret: "GOOGLE_SEARCH_CONSOLE_KEY"
      required: true
    - name: "Google Business Profile API"
      secret: "GOOGLE_BUSINESS_PROFILE_KEY"
      required: false
    - name: "LinkedIn API"
      secret: "LINKEDIN_ACCESS_TOKEN"
      required: false
    - name: "ORCID API"
      secret: "ORCID_API_KEY"
      required: false
    - name: "OpenRouter API"
      secret: "OPENROUTER_API_KEY"
      required: true
      managed_by: "doppler"
  
  mcp_connectors:
    - doppemcp
    - gbrain
    - github
    - filesystem
  
  automation:
    cron_workflow: "eeat-trust-cron.yml"
    frequency:
      daily: "Schema validation, HTTPS check, link scan"
      weekly: "NAP consistency audit, sitemap generation"
      monthly: "Full Lighthouse audit, schema markup review"
      quarterly: "Citation network expansion, Knowledge Panel optimization"
    quiet_mode: true
    enable_command: "gh issue create --title 'exit-quiet-mode'"
    disable_command: "gh issue close <exit-quiet-mode issue number>"

  content: |
    # E-E-A-T Trust Authority Skill (TrustForge)
    
    See SKILL.md for complete documentation.

triggers:
  - "eeat"
  - "e-e-a-t"
  - "trust signals"
  - "google knowledge panel"
  - "schema.org markup"
  - "brand authority"
  - "seo authority"
  - "orcid"
  - "professional identity"
  - "citation network"

examples:
  - name: "Add Organization schema to new app"
    input: "Set up E-E-A-T for new app GlowingStars"
    output: "Generated Organization + WebApplication schema with Freedom Angel Corp parent, added to layout.tsx, validated with Google Rich Results Test"
  
  - name: "Sync brand statement across platforms"
    input: "Update brand statement on GitHub profiles"
    output: "Created PRs to update README.md on midnghtsapphire and MIDNGHTSAPPHIRE profiles with canonical brand statement"
  
  - name: "Daily E-E-A-T health check"
    input: "Run TrustForge daily tasks"
    output: "Scanned all properties, validated schema markup, checked HTTPS, ran linkchecker, generated health report"

schema_version: "1.0"
