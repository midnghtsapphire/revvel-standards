    # MVI Contract Skill
    
    Fill out the 7-section MVI Contract before every coding session to define scope, dependencies, acceptance gates, and rollback plan.
    
    ## What Is an MVI?
    
    **MVI = Minimum Viable Increment** — the fundamental unit of work. One coding session, one complete user-observable feature, fully wired end-to-end.
    
    **Constraints**: fits 1–4 hours, delivers one complete feature, passes all acceptance gates, zero dangling TODOs that break the app.
    
    **No coding permitted until all 7 sections are filled.**
    
    ## The 7-Section MVI Contract
    
    ### Section 1: Context Check
    Read `SYSTEM_STATE.md` before writing a single line of code.
    ```
    Previous session completed: [describe what was finished]
    Current production state: [what is live and working]
    Known bugs relevant to this MVI: [from SYSTEM_STATE.md Known Bugs]
    SYSTEM_STATE.md last updated: [date]
    ```
    
    ### Section 2: Feature Definition
    ```
    Feature: [One clear sentence describing the user-observable outcome]
    User story: As a [role], I can [action], so that [outcome].
    ```
    
    ### Section 3: Dependency Map
    ```
    Database tables required: [list]
    API routes required: [list]
    Environment variables required: [list]
    External services required: [list]
    Other features that must be complete first: [list or "none"]
    ```
    
    ### Section 4: Acceptance Gates
    ```
    [ ] pnpm check — TypeScript compilation passes with zero errors
    [ ] pnpm test — All Vitest unit + integration tests pass
    [ ] pnpm test:e2e — Playwright E2E test for this feature passes
    [ ] Feature deployed to production
    [ ] Live verification: [specific URL or action to verify in browser]
    [ ] SYSTEM_STATE.md updated with new feature status
    ```
    
    ### Section 5: Out of Scope
    List everything intentionally deferred. Anything not listed is out of scope by default.
    
    ### Section 6: Files to Touch
    ```
    New files: [path/to/new-file.ts]
    Modified files: [path/to/existing-file.ts] — reason
    ```
    
    ### Section 7: Rollback Plan
    ```
    Rollback steps:
    1. git revert <commit-hash> and push
    2. Run migration rollback if applicable: pnpm db:rollback
    3. Re-deploy previous version via CI
    
    Database migrations in this MVI: [yes/no]
    Rollback risk: [low/medium/high]
    ```
    
    ## Sign-Off (End of Session)
    ```
    [ ] All acceptance gates passed
    [ ] SYSTEM_STATE.md updated
    [ ] No dangling TODOs that break functionality
    [ ] PR opened (if required)
    Agent sign-off: [name/ID] — [timestamp]
    ```
    
    ## Rules
    
    1. **No coding without a filled contract**
    2. **No skipping acceptance gates** — all must pass; if a gate cannot pass, stop and document
    3. **One feature per MVI** — split larger features into sub-MVIs
    4. **Rollback plans mandatory** for any MVI touching DB schema or deployment
    5. **SYSTEM_STATE.md must be updated** at session end — especially when things go wrong
    
    ## Template Location
    
    `templates/standards/02_MVI_CONTRACT_TEMPLATE.md` — copy to session notes at start of every coding session.
    

