name: content_automation
version: "1.0.0"
title: "Content Automation — AI-Powered Content Creation Pipeline"
description: "End-to-end AI-powered content creation: topic ideation, script generation, refinement, and multi-format publishing using OpenRouter"
category: "Content & Marketing"
tags:
  - content-automation
  - ai-content
  - content-generation
  - blog-automation
  - script-writing
  - seo-content
  - openrouter
  - topic-ideation
  - content-pipeline
  - multi-format
author: "Audrey Evans (MIDNGHTSAPPHIRE)"
created: "2026-05-02"
updated: "2026-05-02"
status: active
access: all

triggers:
  keywords:
    - "content automation"
    - "content creation"
    - "content generation"
    - "blog automation"
    - "script writing"
    - "topic ideation"
    - "content pipeline"
    - "ai content"
    - "write blog post"
    - "generate content"
    - "video script"
    - "social media content"
  labels:
    - content-automation
    - content
    - writing
    - blog
    - seo-content
    - content:draft
    - content:final
  schedule:
    - cron: "0 9 * * 0"  # Weekly Sunday 09:00 UTC
      description: "Generate weekly content ideas and calendar"

dependencies:
  required:
    - openrouter
  optional:
    - tubebuddy-api
    - vidiq-api

configuration:
  secrets:
    required:
      - OPENROUTER_API_KEY
    optional:
      - TUBEBUDDY_API_KEY
      - VIDIQ_API_KEY
  variables:
    CONTENT_TARGET_AUDIENCE:
      default: "general audience"
      description: "Target audience for content"
    CONTENT_BRAND_VOICE:
      default: "professional yet approachable"
      description: "Brand voice and tone guidelines"
    CONTENT_PRIMARY_KEYWORDS:
      default: ""
      description: "Core SEO keywords to target"
    CONTENT_AUTO_PUBLISH:
      default: "false"
      description: "Auto-commit without human review"

models:
  ideation: "anthropic/claude-opus-4"
  generation: "deepseek/deepseek-chat"
  editing: "anthropic/claude-sonnet-4.6"
  factcheck: "openai/gpt-5.4"

phases:
  - name: research
    description: "Topic ideation and validation"
    duration: "2-3 min"
  - name: outline
    description: "Structured outline generation"
    duration: "1 min"
  - name: draft
    description: "First draft generation"
    duration: "3-4 min"
  - name: refine
    description: "Fact-checking and tone refinement"
    duration: "2-3 min"
  - name: export
    description: "Multi-format conversion"
    duration: "1 min"

quality_gates:
  seo:
    - title_length: "50-60"
    - meta_description_length: "150-160"
    - keyword_density: "1-2%"
    - headings_present: true
    - internal_links_min: 2
  readability:
    - flesch_score_min: 60
    - avg_sentence_length_max: 20
    - active_voice_min: 80
  technical:
    - no_broken_links: true
    - images_optimized: true
    - valid_markup: true
    - no_spelling_errors: true

output_formats:
  - blog_html
  - video_script
  - social_thread
  - linkedin_post
  - email_newsletter

integrations:
  - name: noimosai
    purpose: "Marketing strategy and distribution"
  - name: seo-metadata
    purpose: "Technical SEO implementation"
  - name: eeat-trust-authority
    purpose: "Building author credibility"
  - name: product-pipeline
    purpose: "Auto-generate product documentation"

cost_estimate:
  blog_post: "$0.30"
  video_script: "$0.05"
  social_thread: "$0.02"
  email_newsletter: "$0.03"
  monthly_20_blogs: "$10-15"

success_metrics:
  generation_time_minutes: 15
  cost_per_piece: 0.50
  quality_score_min: 70
  seo_pass_rate: 100
  edit_time_saved_percent: 80

workflows:
  - ".github/workflows/content-automation.yml"

standards:
  - "standards/CONTENT_AUTOMATION_STANDARD.md"

documentation:
  - "skills/content-automation/SKILL.md"
  - "docs/Master_Inventory/CONTENT_STANDARD.md"
  - "docs/Master_Inventory/MARKETING_AUTOMATION_STANDARD.md"
