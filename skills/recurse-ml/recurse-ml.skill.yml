name: recurse_ml
title: RecurseML — Autonomous Code Review
version: 1.0.0
description: "Integrate RecurseML for autonomous bug detection, custom code-standards enforcement, and self-healing PR review across all Revvel projects."

metadata:
  author: "Revvel AI Engine"
  category: "Code Quality & Autonomous Review"
  tags:
    - recurse-ml
    - autonomous-review
    - bug-detection
    - code-standards
    - pr-review
    - self-healing
    - github-actions
  created_at: "2026-04-14"
  updated_at: "2026-04-14"
  trial_expires: "2026-04-28"   # 14-day trial — renew decision due by this date
  annual_cost_usd: 250
  trial_decision_gate: "docs/DARE_LOG.md"

dependencies:
  skills:
    - code_review
    - error_reporting
    - vault_agent     # for RECURSE_ML_API_KEY provisioning
  tools:
    - github_actions
  pip_packages: []

workflow_files:
  - path: ".github/workflows/recurse-ml.yml"
    description: "GitHub Actions workflow — triggers on PR and push to main"
  - path: "recurse-rules.md"
    description: "Custom RecurseML code-quality rules for MIDNGHTSAPPHIRE"
  - path: "templates/cicd/recurse-ml.yml"
    description: "Reusable template — copy to any app repo"

triggers:
  - "recurse"
  - "recurse ml"
  - "recurseml"
  - "code review automation"
  - "autonomous bug detection"
  - "pr code review"
  - "enforce code standards"
  - "self-healing review"
  - "recurse-rules"

implementation:
  type: "markdown_prompt"
  language: "markdown"
  content_ref: "skills/recurse-ml/SKILL.md"

setup:
  steps:
    - step: 1
      action: "Install RecurseML GitHub App"
      url: "https://app.recurse.ml/integrations/github"
    - step: 2
      action: "Add RECURSE_ML_API_KEY to repository secrets"
      details: "Settings → Secrets and variables → Actions → New repository secret"
    - step: 3
      action: "Copy workflow template to target repo"
      command: "cp revvel-standards/templates/cicd/recurse-ml.yml .github/workflows/recurse-ml.yml"
    - step: 4
      action: "Copy and customize recurse-rules.md"
      command: "cp revvel-standards/recurse-rules.md recurse-rules.md"
    - step: 5
      action: "Verify workflow triggers on next PR push"

trial_decision_criteria:
  renew_if:
    - "≥ 5 genuine bugs caught during trial"
    - "< 20% false positive rate on PR comments"
    - "Noticeable reduction in manual review overhead"
    - "0 workflow failures attributable to RecurseML"
    - "Custom rules successfully catching Revvel-specific patterns"

examples:
  - description: "Set up RecurseML on a new Revvel app repo"
    usage: |
      Load this skill, follow the setup steps above,
      and add RECURSE_ML_API_KEY to the repo secrets.
      RecurseML will automatically scan every PR.
  - description: "Self-healing loop: resolve a RecurseML violation"
    usage: |
      1. RecurseML posts an inline comment on the PR.
      2. Agent reads the comment (file, line, rule, fix suggestion).
      3. Agent applies the minimum fix.
      4. Agent commits and pushes — RecurseML re-scans.
      5. Repeat until clean.

schema_version: "1.0"
