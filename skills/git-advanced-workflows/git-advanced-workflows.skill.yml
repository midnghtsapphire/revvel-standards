name: git-advanced-workflows
title: "Git advanced workflows"
version: "1.0.0"
description: "Rebase, bisect, worktree, and reflog for local commits that have not been pushed."

metadata:
  author: "TriageChief"
  category: "Developer Workflow"
  tags: ["github", "git-advanced-workflows"]
  created_at: "2026-11-11"
  updated_at: "2026-11-11"
  license: "MIT"
  copyright: "Copyright (c) 2024 Seth Hobson"
  source: "https://github.com/wshobson/agents/tree/main/plugins/developer-essentials/skills/git-advanced-workflows"

triggers:
  - "rebase unpushed"
  - "git bisect"
  - "git worktree"
  - "git reflog"
  - "recover a local commit"

dependencies:
  skills: ["github-read-write-admin"]
  tools: ["git"]
  pip_packages: []

documentation:
  skill_file: "docs/skills/git-advanced-workflows/SKILL.md"
  loader: "skills/git-advanced-workflows/SKILL.md"

implementation:
  type: markdown_prompt
  language: markdown
  content: |
    Load docs/skills/git-advanced-workflows/SKILL.md and follow it.
    That file is the canonical playbook. This YAML is discovery metadata.
    Sign every write as **BotName** at the start and — BotName at the end.
    Do not delete, force-push, or print a secret.
    CircleCI lint-and-test is the check that counts. GitHub Actions runners currently do not start.
    Merge only when an assignee is set, the work is done, the pull request is not a draft,
    required checks are green on the head SHA, and you are not the author.
