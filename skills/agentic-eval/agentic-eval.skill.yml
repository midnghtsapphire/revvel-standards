name: agentic-eval
title: "Agentic evaluation"
version: "1.0.0"
description: "Evaluate an agent output against a named bar and revise the failing parts, at most three times. Model calls go through the local LLM gate."

metadata:
  author: "TriageChief"
  category: "Developer Workflow"
  tags: ["github", "agentic-eval"]
  created_at: "2026-11-11"
  updated_at: "2026-11-11"
  license: "MIT"
  copyright: "Copyright GitHub, Inc."
  source: "https://github.com/github/awesome-copilot/tree/main/skills/agentic-eval"

triggers:
  - "agentic eval"
  - "rubric"
  - "self-check loop"
  - "evaluator"
  - "refine until the test passes"

dependencies:
  skills: ["github-read-write-admin"]
  tools: ["python3"]
  pip_packages: []

documentation:
  skill_file: "docs/skills/agentic-eval/SKILL.md"
  loader: "skills/agentic-eval/SKILL.md"

implementation:
  type: markdown_prompt
  language: markdown
  content: |
    Load docs/skills/agentic-eval/SKILL.md and follow it.
    That file is the canonical playbook. This YAML is discovery metadata.
    Sign every write as **BotName** at the start and — BotName at the end.
    Do not delete, force-push, or print a secret.
    CircleCI lint-and-test is the check that counts. GitHub Actions runners currently do not start.
    Merge only when an assignee is set, the work is done, the pull request is not a draft,
    required checks are green on the head SHA, and you are not the author.
