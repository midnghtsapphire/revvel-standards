name: vault_agent
title: "Vault Agent"
version: "1.0.0"
description: "Ephemeral gatekeeper agent for provisioning and managing all secrets — API keys, OAuth tokens, database credentials, MCP connections — via HashiCorp Vault. Spawns on demand, provisions credentials with minimum privilege, stores them in Vault, and terminates. Triggers the Ralph Loop on failure."

metadata:
  author: "Audrey Evans (MIDNGHTSAPPHIRE)"
  category: "Security & Credential Management"
  tags:
    - "vault"
    - "secrets"
    - "api-keys"
    - "oauth"
    - "mcp-credentials"
    - "provisioning"
    - "gatekeeper"
    - "ralph-loop"
    - "ephemeral-agent"
  created_at: "2026-04-14"
  updated_at: "2026-04-14"

lifecycle:
  type: ephemeral
  spawn_triggers:
    - "project bootstrap"
    - "new api key needed"
    - "credential missing"
    - "token expired"
    - "mcp credential"
    - "vault provisioning"
    - "register api"
    - "register oauth"
    - "github actions secret"
  termination: "after provisioning summary is output — no lingering"

vault:
  path_convention: "revvel/apps/{APP_NAME}/{ENVIRONMENT}/{SERVICE}"
  auth_methods:
    ci: "AppRole"
    human: "OIDC"
  required_metadata:
    - "created_at"
    - "created_by"
    - "rotation_due"
  rotation_days: 90

security:
  no_secrets_to_disk: true
  no_secrets_in_logs: true
  no_secrets_in_code: true
  minimum_privilege: true
  credential_naming: "revvel-{app_name}-{environment}-{YYYY-MM-DD}"

error_handling:
  max_retries: 3
  backoff_seconds: [30, 60, 120]
  on_failure: "trigger ralph loop"
  ralph_loop_labels: ["auto-fix", "copilot", "vault-agent"]
  ralph_loop_assignee: "copilot"

dependencies:
  skills: ["security"]
  tools: ["vault", "gh", "bash"]
  workflows:
    - "templates/cicd/vault-provisioning.yml"
    - "templates/cicd/ralph-loop.yml"

implementation:
  type: markdown_prompt
  language: markdown
  skill_file: "skills/vault-agent/SKILL.md"

references:
  - path: "VAULT_AGENT_STANDARD.md"
    description: "Full standard document"
  - path: "templates/agent-factory/VAULT_AGENT_TEMPLATE.md"
    description: "Drop-in agent template"
  - path: "templates/cicd/vault-provisioning.yml"
    description: "GitHub Actions provisioning workflow"
  - path: "templates/cicd/ralph-loop.yml"
    description: "Ralph Loop CI error retry workflow"
  - path: "SECURITY_STANDARD.md"
    description: "Broader secret management policy"
  - path: "MCP_STANDARD.md"
    description: "MCP credential requirements"

schema_version: "1.0"
