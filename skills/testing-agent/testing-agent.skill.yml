skill: testing-agent
version: "1.0.0"
title: "Testing Agent (Ephemeral)"
description: |
  Ephemeral agent that designs, generates, runs, and evaluates tests for
  Revvel projects. Specializes in PromptFoo skill tests, Vitest unit tests,
  and Playwright E2E tests. Spawns on demand, terminates after task completion.
category: "Testing & Quality"
lifecycle: ephemeral
status: beta
author: "Audrey Evans (MIDNGHTSAPPHIRE)"
date: "2026-04-14"

triggers:
  - "test"
  - "testing"
  - "spec"
  - "coverage"
  - "playwright"
  - "vitest"
  - "e2e tests"
  - "unit tests"
  - "skill test"
  - "promptfoo"
  - "assertion"
  - "failing test"
  - "flaky test"
  - "test gap"
  - "missing tests"
  - "write tests"
  - "generate tests"
  - "coverage report"

models:
  primary: claude-sonnet-4-5
  fast: claude-haiku-3-5

persona:
  enabled: false

lifecycle_steps:
  - step: 1
    name: SPAWN
    trigger: "Issue or PR contains: test, write tests, coverage"
  - step: 2
    name: ASSESS
    action: "Read SKILL.md / source code / existing tests"
  - step: 3
    name: PLAN
    action: "Identify what to test: unit, integration, E2E, LLM assertion"
  - step: 4
    name: GENERATE
    action: "Write test files following TESTING_STANDARD.md"
  - step: 5
    name: VERIFY
    action: "Dry-run or syntax-check generated tests"
  - step: 6
    name: DELIVER
    action: "PR or inline diff with generated tests"
  - step: 7
    name: TERMINATE
    action: "Task complete; no persistent state retained"

testing_tools:
  skill_tests: "promptfoo"
  unit_tests: "vitest"
  e2e_tests: "playwright"
  http_mocking: "msw"
  http_mocking_note: "Never use nock or manual fetch overrides"

coverage_thresholds:
  statements: 80
  branches: 75

rules:
  - "Follow TESTING_STANDARD.md exactly"
  - "For skill tests, always use PromptFoo with claude-sonnet-4 provider"
  - "Never mock the thing being tested"
  - "Never mock Zod schemas"
  - "Use MSW for HTTP mocking"
  - "Test names must follow: 'should [behavior] when [condition]'"
  - "Set temperature: 0 for reproducible skill test results"

output_paths:
  skill_tests: "skills/<skill-name>/tests/promptfoo.yml"
  unit_tests: "<module>/<module>.test.ts"
  e2e_tests: "tests/e2e/<feature>.spec.ts"

dependencies:
  skills:
    - "testing"
  tools:
    - name: "promptfoo"
      install: "npm install -g promptfoo"
    - name: "vitest"
      install: "npm install -D vitest"
    - name: "playwright"
      install: "npm install -D @playwright/test"

tests:
  path: "skills/testing-agent/tests/promptfoo.yml"

implementation:
  type: markdown_prompt
  skill_file: "skills/testing-agent/SKILL.md"

references:
  - path: "TESTING_STANDARD.md"
    description: "Revvel testing standard"
  - path: "AGENT_FACTORY_STANDARD.md"
    description: "Agent factory — how to spawn ephemeral agents"
  - path: "skills/testing/SKILL.md"
    description: "Testing skill (human-facing guidance)"

schema_version: "1.0"
