    # Memory Pruning Skill
    
    ## Purpose
    Implement aggressive memory management with half-life strategies to prevent information bloat and maintain system efficiency.
    
    ## Key Insights from Production Experience
    - Memory files bloat rapidly without limits (200+ lines in a week)
    - Hard limits essential: 15 session log entries maximum
    - Different memory types need different retention strategies
    - Focus on mistakes, near-misses, and non-obvious discoveries
    
    ## Memory Categories and Half-Lives
    
    ### High-Value Memory (1-year retention)
    - **Repeated Mistakes**: Patterns Claude makes multiple times
    - **User Preferences**: Consistent choices and working styles  
    - **Architecture Decisions**: Long-term technical choices
    - **Critical Learnings**: Breakthrough insights and discoveries
    
    ### Medium-Value Memory (90-day retention)
    - **Project Patterns**: Recurring workflows and approaches
    - **Optimization Insights**: Performance improvements and techniques
    - **Integration Solutions**: Working solutions to complex problems
    - **Process Improvements**: Better ways of working discovered
    
    ### Short-Term Memory (7-day retention)
    - **Debugging Sessions**: Specific troubleshooting experiences
    - **Session Outcomes**: Routine completions and standard work
    - **Temporary Workarounds**: Short-term fixes and patches
    - **Context-Specific Details**: Information tied to current work
    
    ## Pruning Strategies
    
    ### Session Log Pruning
    - Maximum 15 session entries across all categories
    - Prioritize mistakes, failures, and breakthrough insights
    - Eliminate routine completions and obvious fixes
    - Focus on "what would a new teammate need to know"
    
    ### Value-Based Filtering
    - **High Priority**: Errors, failures, breakthroughs, non-obvious discoveries
    - **Medium Priority**: Optimizations, patterns, improvements, useful techniques
    - **Low Priority**: Routine work, expected outcomes, obvious solutions
    
    ### Temporal Pruning
    - Apply different retention periods based on memory category
    - Archive rather than delete medium-value expired items
    - Maintain searchable history for reference
    - Regular cleanup cycles to prevent bloat
    
    ## Pruning Workflow
    
    ### Phase 1: Categorization
    - Sort memories by value and category
    - Identify high/medium/low priority items
    - Check age and relevance of each entry
    - Mark candidates for pruning or archiving
    
    ### Phase 2: Aggressive Pruning
    - Enforce hard limits (15 session entries maximum)
    - Remove low-value and expired items
    - Archive medium-value items past retention period
    - Preserve only highest-value insights
    
    ### Phase 3: Quality Enhancement
    - Improve clarity and specificity of retained items
    - Consolidate similar or duplicate insights
    - Add context for better future understanding
    - Update retention categories based on usefulness
    
    ### Phase 4: Validation
    - Verify critical information preservation
    - Test memory effectiveness in new sessions
    - Refine pruning criteria based on results
    - Document improvements for future cycles
    
    ## Memory Quality Standards
    - Focus on non-obvious insights that took time to discover
    - Include specific examples and context
    - Prioritize information that prevents repeated work
    - Eliminate information that's easily rediscovered
    
    ## Integration Points
    - Automatic execution as part of wrap-up skill
    - Feeds into context management for session optimization
    - Supports multi-agent learning and knowledge sharing
    - Compatible with all memory storage formats
    
    ## Success Criteria
    - Memory files stay under maximum size limits
    - High-value insights preserved across sessions
    - System performance maintained through pruning
    - Knowledge quality improved through curation
    
    ## Rule
    Apply hard limits ruthlessly. Better to lose medium-value information than to degrade system performance with bloat. Focus on preventing repeated mistakes over documenting successes.

examples:
