# Generated by Revvel Testing Agent
# Source: skills/skill-forge/SKILL.md
description: "Tests for skill-forge — validates interview, file generation, and farewell behaviors"

providers:
  - id: anthropic:claude-haiku-4-5
    config:
      temperature: 0

prompts:
  - id: forge-system
    raw: |
      You are Forge — the Revvel Skill Builder. You help users create new deployable AI skills.
      Voice: creative, hands-on, encouraging. Sign messages with 🔨.
      On activation: greet as Forge, present all 10 interview questions in one numbered list.
      After interview: generate SKILL.md, .skill.yml, tests/promptfoo.yml, Windows .bat, Mac .command, README.md.
      Sign off with: "Skill built. Forge signing off. 🔨"

tests:
  # Happy path: greeting and interview presentation
  - description: "Should deliver Forge greeting and 10 interview questions on activation"
    vars:
      user_message: "build a skill"
    assert:
      - type: contains
        value: "Forge"
      - type: contains
        value: "🔨"
      - type: contains
        value: "1."
      - type: contains
        value: "10."
      - type: not-contains
        value: "error"

  # Happy path: complete interview generates all files
  - description: "Should generate file list after receiving interview answers"
    vars:
      user_message: |
        1. invoice-generator
        2. Generates formatted invoices from project data
        3. Freelancer or small business owner
        4. Manual invoicing is slow and error-prone
        5. Should not file taxes or integrate with accounting software
        6. Claude Code
        7. Sage persona
        8. No external dependencies
        9. A formatted invoice markdown file
        10. Show an error message and ask the user to re-enter the data
    assert:
      - type: contains
        value: "SKILL.md"
      - type: contains
        value: ".skill.yml"
      - type: contains
        value: "promptfoo.yml"
      - type: contains
        value: ".bat"
      - type: contains
        value: ".command"
      - type: not-contains
        value: "undefined"

  # Edge case: minimal answers
  - description: "Should handle minimal one-word answers gracefully"
    vars:
      user_message: |
        1. notes
        2. Takes notes
        3. Anyone
        4. Memory
        5. Nothing
        6. Claude Code
        7. No persona
        8. None
        9. A note file
        10. Say sorry
    assert:
      - type: not-contains
        value: "error"
      - type: not-contains
        value: "null"

  # Farewell: skill complete
  - description: "Should deliver Forge farewell when skill is built"
    vars:
      user_message: "the skill looks great, we're done"
    assert:
      - type: contains
        value: "signing off"
      - type: contains
        value: "🔨"

  # Pricing: should calculate ROI
  - description: "Should recommend a price based on time saved"
    vars:
      user_message: "how should I price this skill that saves 2 hours per week?"
    assert:
      - type: contains
        value: "$"
      - type: not-contains
        value: "error"
