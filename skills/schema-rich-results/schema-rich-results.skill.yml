name: schema_rich_results
title: "Schema Rich Results Checker"
version: "1.0.0"
description: "Validate JSON-LD structured data markup against schema.org rules and Google Rich Results eligibility. Supports Google Rich Results Test, Schema Markup Validator, Bing, and Merkle as reference validators."

metadata:
  author: "Revvel AI Engine"
  category: "SEO & Structured Data"
  tags: ["schema-org", "json-ld", "rich-results", "structured-data", "seo", "google", "validation"]
  created_at: "2026-04-30"
  updated_at: "2026-04-30"

dependencies:
  skills:
    - seo_metadata
  tools: []
  pip_packages: []
  npm_packages: []

implementation:
  type: script_and_markdown_prompt
  language: javascript
  script: "scripts/schema-rich-results-checker.js"
  tests: "tests/schema-rich-results-checker.test.js"

  content: |
    # Schema Rich Results Skill
    
    See SKILL.md for complete documentation.

triggers:
  - "schema validation"
  - "json-ld"
  - "structured data"
  - "rich results"
  - "rich snippets"
  - "schema.org"
  - "google structured data"
  - "schema markup"
  - "faqpage schema"
  - "product schema"
  - "article schema"
  - "breadcrumb schema"
  - "organization schema"

examples:
  - name: "Validate a page's JSON-LD from HTML"
    input: "Check if this page's structured data is valid"
    output: "Parsed 2 JSON-LD blocks: Organization ✅ PASS (eligible for Google Rich Results), Article ❌ FAIL (headline missing)"

  - name: "Fix FAQPage schema"
    input: "My FAQ rich results are not showing in Google"
    output: "Validated FAQPage — found: mainEntity items must have @type 'Question'. Fixed: wrapped items in Question nodes with acceptedAnswer.text."

  - name: "CI schema gate"
    input: "Block PR if structured data has errors"
    output: "Added runChecks() call to ready-for-review.yml; PR blocked with checkbox failures until schema errors are resolved"

schema_version: "1.0"
