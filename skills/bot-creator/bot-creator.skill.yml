skill: bot-creator
version: "1.0.0"
title: "Bot Creator"
description: |
  Turns a plain-language idea into a complete bot specification.
  Picks one functional category and one or two visual styles (with combo rules),
  then scaffolds bots/<bot-slug>/ with BOT.md, bot.yml, persona.yml, theme.json.
category: "Bot Creation"
lifecycle: ephemeral
status: stable
author: "Audrey Evans (MIDNGHTSAPPHIRE)"
date: "2026-04-20"

triggers:
  - "bot creator"
  - "create a bot"
  - "build a bot"
  - "new bot"
  - "design a bot"
  - "bot builder"
  - "scaffold bot"
  - "make a bot"
  - "bot spec"
  - "bot factory"
  - "glassmorphic bot"
  - "3d bot"
  - "pacman bot"
  - "bt21 bot"
  - "pretty pony bot"
  - "memelord bot"
  - "genz bot"
  - "adulting bot"
  - "weaponized bot"

models:
  primary: claude-sonnet-4-5
  fast: claude-haiku-4-5

persona: forge

# ── Functional categories ───────────────────────────────────────────────────
categories:
  adulting:      "Life-admin nudges: bills, appointments, chores, meds"
  creative:      "Writes, illustrates, memes, remixes, brainstorms"
  study:         "Explains, quizzes, flashcards, tracks a learning plan"
  coding:        "Writes, reviews, and debugs code; opens PRs"
  productivity:  "Inbox, calendar, tasks, focus timers, standups"
  social:        "Reply drafts, tone-shift, DMs, comment crafting"
  finance:       "Budget, subscriptions audit, expense categorization"
  wellness:      "Mood, journal, sleep, hydration, gentle check-ins"
  gaming:        "Game companions, lore bots, build optimizers"
  shopping:      "Deal hunters, wishlist, price drop watchers"
  weaponized:    "Aggressive debate / roast / cease-and-desist drafting (opt-in)"
  guardian:      "Safety, red-team, fact-checking, scam detection"

# ── Visual style library ────────────────────────────────────────────────────
# Each style lists its kind (dimensional | persona), a one-line feel,
# and signature design tokens the theme layer consumes.
styles:
  "1d":
    kind: dimensional
    feel: "Pure line art, single-stroke, monoline"
    tokens: { stroke: "#111111", fill: "none", thickness_px: 2 }
  "2d":
    kind: dimensional
    feel: "Flat illustration, bold shapes, no gradients"
    tokens: { surface: "flat", shadow: "hard-2-tone" }
  "3d":
    kind: dimensional
    feel: "Rendered, soft shadows, dimensional depth"
    tokens: { surface: "3d", lighting: "rim+ambient-occlusion" }
  glassmorphic:
    kind: dimensional
    feel: "Frosted translucent panels, blurred backdrops"
    tokens:
      surface: "glass"
      backdrop_blur_px: 20
      bg: "rgba(255,255,255,0.12)"
      border: "1px solid rgba(255,255,255,0.20)"
  pacman:
    kind: dimensional
    feel: "8-bit / arcade, chunky pixels, CRT scanlines"
    tokens: { surface: "pixel", grid_px: 8, effects: ["crt-scanlines"] }

  weaponized:
    kind: persona
    feel: "Tactical, matte black, hazard accents"
    tokens: { palette: ["#0a0a0a", "#ff6a00", "#e5e5e5"], type: "stencil" }
  adulting:
    kind: persona
    feel: "Soft neutrals, calm, reassuring"
    tokens: { palette: ["#e9e3d5", "#8fa58a", "#2b2b2b"], radius: "2xl", heading_family: "serif" }
  bt21:
    kind: persona
    feel: "Cute mascot, pastel, plush, big eyes"
    tokens: { palette: ["#ffd9e8", "#c7e9ff", "#fff3b0"], hero: "mascot", shadow: "plush" }
  pretty-pony:
    kind: persona
    feel: "Sparkle, rainbow gradients, cutie-marks"
    tokens: { palette: ["#ffc8dd", "#bde0fe", "#cdb4db", "#ffffb3"], effects: ["sparkles"], display_family: "script" }
  memelord:
    kind: persona
    feel: "Impact-font, deep-fried accents, reaction energy"
    tokens: { display_family: "Impact", effects: ["heavy-drop-shadow", "emoji-chaos"] }
  genz:
    kind: persona
    feel: "Y2K × gradient blur × emoji-first"
    tokens: { palette: ["gradient-chrome", "#ff7ad9", "#7af0ff"], case: "lowercase", effects: ["sticker-chaos"] }
  genx:
    kind: persona
    feel: "MTV grunge, cassette, halftone"
    tokens: { palette: ["#1a1a1a", "#d6d6d6", "#e03131"], effects: ["halftone-dots"], display_family: "ransom" }
  millennial:
    kind: persona
    feel: "Soft sans, pastel, hand-lettered, avocado vibes"
    tokens: { palette: ["#f7cac9", "#92a8a1", "#2b2b2b"], radius: "xl", body_family: "rounded-sans" }
  boomer:
    kind: persona
    feel: "Clear, high-contrast, large type, classic"
    tokens: { palette: ["#0b2545", "#fff9f0", "#b3321c"], body_family: "serif", min_body_px: 18 }

# ── Combo rules ─────────────────────────────────────────────────────────────
combo_rules:
  max_styles: 2
  separator: "×"
  allow:
    - "dimensional × persona"
    - "persona × persona (if tones compatible)"
  collapse:
    - from: "dimensional × dimensional"
      to: "higher-dimension-wins"
  forbid:
    - "three or more styles"
    - "boomer × memelord"
    - "adulting × weaponized"
  background_default: "minimal"   # per owner feedback: avoid busy dioramas by default
  background_opts: ["minimal", "scene", "diorama"]

# ── Defaults ────────────────────────────────────────────────────────────────
defaults:
  category: productivity
  style: "glassmorphic × millennial"
  tone: neutral              # chill | neutral | spicy
  background: minimal
  radius: "2xl"
  motion: calm

# ── Interview script ────────────────────────────────────────────────────────
interview:
  max_questions: 5
  questions:
    - id: audience
      prompt: "Who is this bot for — you, friends, or public?"
    - id: one_liner
      prompt: "In one sentence, what should it do?"
    - id: category
      prompt: "Pick a category (adulting, creative, study, coding, productivity, social, finance, wellness, gaming, shopping, weaponized, guardian)."
    - id: styles
      prompt: "Pick 1–2 styles from the library (e.g., `3d × bt21`)."
    - id: tone
      prompt: "Tone: chill · neutral · spicy?"

# ── Output schema (Bot Spec) ────────────────────────────────────────────────
output_schema:
  type: object
  required: [slug, name, pitch, category, style, tone, persona, system_prompt, capabilities, theme]
  properties:
    slug: { type: string, pattern: "^[a-z0-9-]+$" }
    name: { type: string }
    pitch: { type: string }
    owner: { type: string }
    category: { type: string, enum: [adulting, creative, study, coding, productivity, social, finance, wellness, gaming, shopping, weaponized, guardian] }
    style: { type: string, description: "single style slug or `a × b`" }
    tone: { type: string, enum: [chill, neutral, spicy] }
    persona:
      type: object
      required: [voice, greeting, farewell]
    system_prompt: { type: string }
    capabilities: { type: array, items: { type: string } }
    theme:
      type: object
      required: [palette, radius, surface, motion, background]
      properties:
        palette: { type: array, items: { type: string } }
        font_display: { type: string }
        font_body: { type: string }
        radius: { type: string, enum: [sm, md, lg, xl, "2xl"] }
        surface: { type: string, enum: [flat, glass, "3d", pixel] }
        motion: { type: string, enum: [calm, playful, aggressive] }
        background: { type: string, enum: [minimal, scene, diorama] }

# ── Scaffold output ─────────────────────────────────────────────────────────
scaffold:
  root: "bots/<bot-slug>/"
  files:
    - path: "BOT.md"
      purpose: "Human doc — mirrors the Bot Spec"
    - path: "bot.yml"
      purpose: "Machine config matching output_schema"
    - path: "persona.yml"
      purpose: "Persona card reusable by persona-engine"
    - path: "theme.json"
      purpose: "Design tokens consumed by the UI layer"
  registry: "bots/REGISTRY.md"

# ── Guardrails ──────────────────────────────────────────────────────────────
guardrails:
  weaponized:
    - "Never targets a real identified individual."
    - "Never produces threats, slurs, doxxing, or illegal content."
    - "Refusals are firm and short."
  accessibility:
    - "All palettes must meet WCAG AA contrast for body text."
    - "Body copy ≥ 14px; ≥ 18px for boomer style."
  privacy:
    - "Do not ingest user PII unless the category explicitly requires it."
  ownership:
    - "Generated bots belong to the repo owner per AGENTS.md."

# ── Termination ─────────────────────────────────────────────────────────────
termination_triggers:
  - "bot shipped"
  - "scaffold complete"
  - "cancel bot"
  - "never mind"
  - "stop"

system_prompt: |
  You are the Revvel Bot Creator. Your job is to turn a plain-language idea
  into a complete, scaffolded bot spec in a single session.

  Rules:
  1. Run the 5-question interview. Never ask more than 5 questions.
  2. Lock exactly one category from the `categories` map.
  3. Pick 1–2 styles from the `styles` map, applying `combo_rules`.
     If the user picks an illegal combo, explain briefly and offer the nearest legal one.
  4. Default background is `minimal`. Only enable `scene` or `diorama`
     if the user explicitly asks — busy backgrounds are intentionally dialed down.
  5. Emit a Bot Spec that validates against `output_schema`.
  6. Scaffold `bots/<bot-slug>/` with the four files listed in `scaffold.files`
     and append a row to `bots/REGISTRY.md`.
  7. Enforce `guardrails` without exception, especially for the `weaponized` category.
  8. Keep the tone of your own replies matched to the user's chosen tone.
  9. At completion, print a one-line summary: name, category, style, path.
  10. Break character only if the user seems confused. Resume after helping.

documentation:
  skill_file: "skills/bot-creator/SKILL.md"
  registry_entry: "skills/REGISTRY.md"
  index_entry: "skills/SKILLS_INDEX.yml"
