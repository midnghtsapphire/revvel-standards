name: mixpanel
title: "Mixpanel — User-Behavior Product Analytics"
version: "1.0.0"
description: "Integrate Mixpanel into any Revvel project (web, Node, mobile) for action-level user-behavior analytics — events, funnels, retention, cohorts — with PII-safe defaults and Revvel-standard event naming."

metadata:
  author: "Revvel AI Engine"
  category: "Product Analytics"
  tags:
    - mixpanel
    - product-analytics
    - user-behavior
    - events
    - funnels
    - retention
    - cohort-analysis
    - telemetry
    - mixpanel-browser
    - mixpanel-node
  created_at: "2026-04-28"
  updated_at: "2026-04-28"

dependencies:
  skills:
    - vault_agent       # for MIXPANEL_TOKEN and MIXPANEL_API_SECRET provisioning
    - security          # PII rules for event properties
    - error_reporting   # baseline 'Error Surfaced' event
  tools:
    - nodejs
  pip_packages: []
  npm_packages:
    - mixpanel-browser  # client / SPA / Next.js
    - mixpanel          # Node / worker / server

template_files:
  - path: "templates/standards/mixpanel-init.ts"
    description: "Drop-in browser + Node initializer with opt-out, DNT, and PII guardrails"
  - path: "templates/standards/mixpanel-events.md"
    description: "Event-naming standard, baseline event catalog, and PII rules"

triggers:
  - "mixpanel"
  - "integrate mixpanel"
  - "product analytics"
  - "user behavior analytics"
  - "track event"
  - "funnel analysis"
  - "retention analysis"
  - "cohort analysis"
  - "mixpanel-browser"
  - "mixpanel.track"
  - "telemetry"

implementation:
  type: "markdown_prompt"
  language: "markdown"
  content_ref: "skills/mixpanel/SKILL.md"

setup:
  steps:
    - step: 1
      action: "Create a Mixpanel project"
      url: "https://mixpanel.com"
    - step: 2
      action: "Retrieve MIXPANEL_TOKEN and MIXPANEL_API_SECRET from Project Settings → Access Keys"
      details: "Token is client-safe; API secret is server-only."
    - step: 3
      action: "Add secrets to GitHub repo and Vault"
      details: "Vault path: revvel/apps/<app>/<env>/mixpanel"
    - step: 4
      action: "Install SDK"
      command: "npm install mixpanel-browser mixpanel"
    - step: 5
      action: "Copy initializer template"
      command: "cp revvel-standards/templates/standards/mixpanel-init.ts <app>/src/lib/analytics.ts"
    - step: 6
      action: "Adopt event-naming standard from templates/standards/mixpanel-events.md"
    - step: 7
      action: "Wire opt-out / Do-Not-Track honoring (template handles this by default)"
    - step: 8
      action: "Verify events appear in Mixpanel Dashboard → Live View"

examples:
  - description: "Track a signup conversion"
    usage: |
      import { track } from '@/lib/analytics';
      track('Signup Completed', { signup_method: 'google', referrer_source: 'twitter' });
  - description: "Server-side purchase event from Stripe webhook"
    usage: |
      import Mixpanel from 'mixpanel';
      const mp = Mixpanel.init(process.env.MIXPANEL_TOKEN!);
      mp.track('Purchase Completed', {
        distinct_id: hashedUserId,
        product_slug: 'asset-donation-engine',
        amount_cents: 4900,
        currency: 'usd',
      });
  - description: "Honor a user opt-out"
    usage: |
      import { optOut, optIn } from '@/lib/analytics';
      // settings toggle
      userOptedOut ? optOut() : optIn();

pii_rules:
  hard_lines:
    - "Never send raw email, phone, full name, government ID, address, IP, or precise geolocation as a property."
    - "distinct_id must be a hashed UUID, never the raw email or login."
    - "optOut() makes track() a no-op; Do-Not-Track is treated as opt-out by default."
    - "EU traffic → set api_host: 'https://api-eu.mixpanel.com'."
    - "MIXPANEL_API_SECRET is server-only — never reference it in client code."

baseline_events:
  - name: "App Loaded"
    when: "First mount of the root component"
    required_properties: ["app_version", "platform"]
  - name: "User Signed Up"
    when: "Server confirms new account"
    required_properties: ["signup_method", "referrer_source"]
  - name: "User Logged In"
    when: "Server confirms session"
    required_properties: ["login_method"]
  - name: "User Logged Out"
    when: "User-initiated sign out"
    required_properties: []
  - name: "Feature Used"
    when: "Any non-nav user action worth tracking"
    required_properties: ["feature_name", "surface"]
  - name: "Purchase Completed"
    when: "Stripe webhook checkout.session.completed"
    required_properties: ["product_slug", "amount_cents", "currency"]
  - name: "Error Surfaced"
    when: "User saw a non-fatal error toast / page"
    required_properties: ["error_code", "surface"]

schema_version: "1.0"
