name: ada_compliance_agent
title: "ADA Compliance Agent"
version: "1.0.0"
description: "Autonomous agent for researching, learning, and enforcing ADA compliance. Monitors for new certifications, audits code for WCAG 2.2 AA/AAA compliance, and ensures all accessibility standards are met. Can run on-demand, scheduled, or 24/7 via OpenRouter."

metadata:
  author: "MIDNGHTSAPPHIRE"
  category: "Accessibility & Compliance"
  tags: 
    - "ada"
    - "wcag"
    - "accessibility"
    - "a11y"
    - "section-508"
    - "compliance-agent"
    - "autonomous"
    - "certifications"
    - "continuous-learning"
    - "screen-reader"
    - "aria"
    - "tty"
    - "openrouter-24-7"
  created_at: "2026-04-30"
  updated_at: "2026-04-30"
  lifecycle: "ephemeral-or-continuous"
  run_modes:
    - "on-demand"
    - "scheduled"
    - "continuous-24-7"

dependencies:
  skills: 
    - "accessibility"
    - "testing"
    - "code_review"
  tools:
    - "axe-core"
    - "pa11y"
    - "lighthouse"
    - "eslint-plugin-jsx-a11y"
  npm_packages:
    - "@axe-core/cli"
    - "pa11y-ci"
    - "@lhci/cli"
    - "eslint-plugin-jsx-a11y"
  pip_packages: []

triggers:
  keywords:
    - "ada"
    - "wcag"
    - "accessibility"
    - "a11y"
    - "section 508"
    - "screen reader"
    - "keyboard navigation"
    - "aria"
    - "alt text"
    - "tty"
    - "tdd"
    - "hearing impaired"
    - "disability"
    - "assistive technology"
    - "contrast"
    - "color blind"
    - "focus trap"
    - "skip nav"
    - "lighthouse accessibility"
    - "axe-core"
    - "pa11y"
    - "wave"
    - "accessibility audit"
    - "compliance check"
    - "ada certification"
    - "free ada cert"
    - "ada training"
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
    - "**/*.html"
    - "**/*.vue"
    - "**/*.svelte"
  events:
    - "pull_request"
    - "schedule"
    - "workflow_dispatch"

implementation:
  type: markdown_prompt
  language: markdown
  content: |
    # ADA Compliance Agent Skill
    
    Autonomous agent for researching, learning, and enforcing ADA (Americans with Disabilities Act) compliance across all codebases. Continuously monitors for new standards, free/paid certification courses, and ensures all code meets WCAG 2.2 AA/AAA and ADA Title III requirements.
    
    ## Role & Mission
    
    Operate as an **ADA Compliance Specialist** with combined expertise in:
    - **WCAG 2.2/2.1** — Web Content Accessibility Guidelines (AA minimum, AAA where feasible)
    - **ADA Title III** — Public accommodations and commercial facilities
    - **Section 508** — Federal accessibility standards
    - **ARIA** — Accessible Rich Internet Applications specifications
    - **Assistive Technology** — Screen readers (NVDA, JAWS, VoiceOver), keyboard navigation, TTY/TDD
    - **Accessibility Testing** — axe-core, Pa11y, Lighthouse, WAVE
    - **Continuous Learning** — Monitor for new certifications, standards updates, best practices
    
    This agent can run:
    - **On-demand** — Manual trigger for audits, code reviews, certification research
    - **Scheduled** — Nightly/weekly compliance checks via GitHub Actions
    - **24/7 via OpenRouter** — Continuous monitoring of ADA standards, new courses, vulnerability patches
    
    See full SKILL.md for complete operating protocol, certification registry, and compliance checklists.

examples:
  - task: "Run ADA compliance audit on current branch"
    command: "Load ada-compliance-agent skill and run full accessibility audit"
    expected_output: "Compliance report with violations, auto-fixes applied, issues created for manual intervention"
  
  - task: "Find free ADA certifications"
    command: "Research and list free ADA certification courses"
    expected_output: "Updated certification registry in /docs/ada-certifications.md with URLs, providers, CEU credits"
  
  - task: "Fix accessibility violations in PR"
    command: "Review PR #42 for accessibility issues and auto-fix safe violations"
    expected_output: "Commits with auto-fixes, issues for manual fixes, updated compliance checklist"

outputs:
  artifacts:
    - "/docs/ada-compliance-report-{date}.md"
    - "/docs/ada-checklist.md"
    - "/docs/ada-learnings.md"
    - "/docs/ada-certifications.md"
  github_artifacts:
    - "issues: accessibility violations requiring manual fix"
    - "prs: automated accessibility fixes"
    - "discussions: monthly compliance updates and certification recommendations"
  ci_artifacts:
    - "lighthouse-results.json"
    - "axe-results.json"
    - "pa11y-results.json"

integration:
  ralph_loop: "On CI failure, attempts auto-fix before escalation"
  accessibility_skill: "Extends base accessibility skill with autonomous capabilities"
  testing_skill: "Uses test infrastructure for running accessibility tests"
  code_review_skill: "Feeds accessibility findings into code review process"

guardrails:
  auto_fix_allowed:
    - "Adding alt text to decorative images (alt='')"
    - "Increasing color contrast (darken/lighten)"
    - "Adding aria-label to icon-only buttons"
    - "Adding for/id associations to labels"
    - "Adding role='alert' to error containers"
    - "Adding lang attribute to html element"
  
  auto_fix_forbidden:
    - "Removing interactive elements"
    - "Changing ARIA roles on complex widgets"
    - "Modifying semantic HTML structure"
    - "Adding alt text to non-decorative images (requires human judgment)"
    - "Changing focus order"
    - "Disabling animations globally"
  
  escalation_triggers:
    - "Critical WCAG violations after 3 auto-fix attempts"
    - "Third-party component violations (vendor patch required)"
    - "Design pattern violates accessibility (UX redesign needed)"
    - "All automated testing tools unavailable"

monitoring:
  metrics:
    - "lighthouse_accessibility_score"
    - "axe_core_violations_count"
    - "wcag_success_criteria_met_percentage"
    - "certifications_completed_count"
    - "auto_fix_success_rate"
    - "time_to_remediation_days"
  
  alerts:
    - "Lighthouse score drops below 90"
    - "New critical WCAG violation introduced"
    - "Automated testing tool failure"
    - "New WCAG guideline published"
    - "New free certification course available"

certification_registry:
  free_courses:
    - name: "ADA Basic Building Blocks"
      provider: "ADA National Network"
      url: "https://adabasics.org"
      credits: "CEU/CRCC"
      certificate: true
    
    - name: "ADA Employment Webcourse"
      provider: "New England ADA Center"
      url: "https://www.newenglandada.org/slideshow/disability-employment-webcourse"
      credits: "CEU/CRCC"
      certificate: true
    
    - name: "ADA Title II Tutorial"
      provider: "ADA National Network"
      url: "https://adatitle2.org"
      credits: "CEU/CRCC"
      certificate: true
    
    - name: "At Your Service: Welcoming Customers"
      provider: "West Virginia ADA Center"
      url: "https://wiawebcourse.org"
      credits: "CEU/CRCC"
      certificate: true
    
    - name: "Digital Accessibility Foundations"
      provider: "W3C WAI"
      url: "https://www.w3.org/WAI/courses/foundations-intro/"
      credits: "Optional paid cert"
      certificate: true
    
    - name: "Adaline Free Courses"
      provider: "Adaline"
      url: "https://adaline.io/courses"
      credits: "None"
      certificate: true
    
    - name: "LinkedIn Learning Free ADA Courses"
      provider: "LinkedIn"
      url: "https://www.classcentral.com/report/linkedin-learning-free-certificates/"
      credits: "None"
      certificate: true
    
    - name: "Pacific ADA Center Courses"
      provider: "Pacific ADA Center"
      url: "https://www.adapacific.org/"
      credits: "Varies"
      certificate: true

  paid_courses:
    - name: "IAAP CPACC"
      provider: "International Association of Accessibility Professionals"
      cost: "$425"
      type: "Certified Professional in Accessibility Core Competencies"
    
    - name: "IAAP WAS"
      provider: "IAAP"
      cost: "$425"
      type: "Web Accessibility Specialist"
    
    - name: "Deque University"
      provider: "Deque Systems"
      cost: "$299-$799"
      type: "Full curriculum with axe DevTools training"
    
    - name: "Section 508 Trusted Tester"
      provider: "DHS"
      cost: "Free (federal)"
      type: "Official federal testing certification"

schema_version: "1.0"
