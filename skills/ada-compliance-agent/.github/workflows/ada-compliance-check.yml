# ADA Compliance Check Workflow
#
# This workflow runs automated accessibility audits using the ADA Compliance Agent
# Can be triggered on pull requests, scheduled runs, or manually
#
# Usage:
#   1. Copy this file to your repo's .github/workflows/ directory
#   2. Install required dependencies in your package.json:
#      npm install --save-dev @axe-core/cli pa11y-ci @lhci/cli
#   3. Configure your URLs in the "urls" section below
#   4. Adjust the schedule as needed (default: nightly at 2 AM UTC)

name: ADA Compliance Check

on:
  pull_request:
    paths:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.html'
      - '**/*.vue'
      - '**/*.svelte'
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
    # Run weekly on Sundays at 2 AM UTC (certification research)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit mode'
        required: false
        default: 'full'
        type: choice
        options:
          - 'quick'
          - 'full'
          - 'certification-check'

jobs:
  accessibility-audit:
    name: ADA Compliance Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @axe-core/cli pa11y-ci @lhci/cli

      - name: Build application
        run: npm run build
        continue-on-error: true

      - name: Start development server
        run: |
          npm run dev &
          # Wait for server to be ready
          npx wait-on http://localhost:3000 --timeout 60000
        continue-on-error: false

      - name: Run axe-core accessibility scan
        id: axe
        run: |
          mkdir -p ada-reports
          axe http://localhost:3000 \
            --reporter json \
            --output ada-reports/axe-results.json \
            --exit || echo "axe_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Pa11y accessibility scan
        id: pa11y
        run: |
          # Create pa11y config if it doesn't exist
          if [ ! -f .pa11yci ]; then
            echo '{
              "defaults": {
                "standard": "WCAG2AA",
                "timeout": 10000
              },
              "urls": [
                "http://localhost:3000"
              ]
            }' > .pa11yci
          fi

          pa11y-ci \
            --json \
            > ada-reports/pa11y-results.json \
            || echo "pa11y_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Lighthouse accessibility audit
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      - name: Parse audit results
        id: parse
        run: |
          # Count critical and serious violations
          AXE_VIOLATIONS=$(jq \
            '[.violations[] | select(.impact == "critical" or .impact == "serious")] | length' \
            ada-reports/axe-results.json 2>/dev/null || echo "0")

          # Extract Lighthouse score
          LH_SCORE=$(jq '.categories.accessibility.score * 100' \
            .lighthouseci/*/lhr-*.json 2>/dev/null | head -1 || echo "0")

          echo "axe_violations=$AXE_VIOLATIONS" >> $GITHUB_OUTPUT
          echo "lighthouse_score=$LH_SCORE" >> $GITHUB_OUTPUT

          # Determine if audit passed
          if [ "$AXE_VIOLATIONS" -gt 0 ] || [ "$(echo "$LH_SCORE < 90" | bc)" -eq 1 ]; then
            echo "audit_passed=false" >> $GITHUB_OUTPUT
          else
            echo "audit_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate compliance report
        if: always()
        run: |
          mkdir -p docs
          REPORT_DATE=$(date +%Y-%m-%d)
          cat > docs/ada-compliance-report-${REPORT_DATE}.md << EOF
          # ADA Compliance Report

          **Date:** ${REPORT_DATE}
          **Workflow:** ${{ github.workflow }}
          **Trigger:** ${{ github.event_name }}
          **Branch:** ${{ github.ref_name }}

          ## Summary

          - **Lighthouse Accessibility Score:** ${{ steps.parse.outputs.lighthouse_score }}/100
          - **axe-core Critical/Serious Violations:** ${{ steps.parse.outputs.axe_violations }}
          - **Overall Status:** ${{ steps.parse.outputs.audit_passed == 'true' && '✅ PASSED' || '❌ FAILED' }}

          ## Minimum Requirements

          - Lighthouse score ≥ 90: ${{ steps.parse.outputs.lighthouse_score >= 90 && '✅' || '❌' }}
          - Zero critical/serious violations: ${{ steps.parse.outputs.axe_violations == 0 && '✅' || '❌' }}

          ## Detailed Reports

          - [Lighthouse Report](${{ steps.lighthouse.outputs.links }})
          - [axe-core Results](../ada-reports/axe-results.json)
          - [Pa11y Results](../ada-reports/pa11y-results.json)

          ## Next Steps

          ${{ steps.parse.outputs.audit_passed == 'false'
            && 'Review the detailed reports and fix the identified violations.'
            || 'Great work! All accessibility checks passed.' }}

          ---

          *Generated by ADA Compliance Agent*
          EOF

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-compliance-reports-${{ github.run_id }}
          path: |
            ada-reports/
            docs/ada-compliance-report-*.md
          retention-days: 90

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const axeViolations = ${{ steps.parse.outputs.axe_violations }};
            const lighthouseScore = ${{ steps.parse.outputs.lighthouse_score }};
            const passed = ${{ steps.parse.outputs.audit_passed }};

            const status = passed ? '✅ **PASSED**' : '❌ **FAILED**';
            const emoji = passed ? '🎉' : '⚠️';

            let comment = `## ${emoji} ADA Compliance Check ${status}\n\n`;
            comment += `### Scores\n\n`;
            comment += `- **Lighthouse Accessibility:** ${lighthouseScore}/100 ${lighthouseScore >= 90 ? '✅' : '❌'}\n`;
            comment += `- **Critical/Serious Violations:** ${axeViolations} ${axeViolations === 0 ? '✅' : '❌'}\n\n`;

            if (!passed) {
              comment += `### Action Required\n\n`;
              comment += `This PR introduces accessibility violations that must be fixed before merge.\n\n`;
              comment += `**Common auto-fixable issues:**\n`;
              comment += `- Missing alt text on images\n`;
              comment += `- Poor color contrast\n`;
              comment += `- Missing form labels\n`;
              comment += `- Missing ARIA attributes\n\n`;
              comment += `Run the ADA Compliance Agent to auto-fix safe violations:\n`;
              comment += `\`\`\`\nLoad ada-compliance-agent and fix accessibility violations\n\`\`\`\n\n`;
            } else {
              comment += `### Great Work! 🎊\n\n`;
              comment += `All accessibility checks passed. Your changes maintain ADA compliance.\n\n`;
            }

            const runUrl = `${{ github.server_url }}/${{ github.repository }}`
              + `/actions/runs/${{ github.run_id }}`;
            comment += `[View detailed reports](${runUrl})\n`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Create issue on failure or violations
        if: (failure() || steps.parse.outputs.audit_passed != 'true') && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[ADA] Scheduled compliance check failed',
              labels: ['accessibility', 'ada-compliance', 'auto-error'],
              body: `## ADA Compliance Check Failed

              The scheduled accessibility audit on \`${context.ref}\` detected violations.

              **Lighthouse Score:** ${{ steps.parse.outputs.lighthouse_score }}/100
              **Critical/Serious Violations:** ${{ steps.parse.outputs.axe_violations }}

              ### Action Required

              1. Review the [detailed reports](
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
              2. Run the ADA Compliance Agent to auto-fix safe violations
              3. Manually fix remaining issues
              4. Re-run this workflow to verify fixes

              ### Auto-Fix Command

              \`\`\`
              Load ada-compliance-agent and run full accessibility audit with auto-fix
              \`\`\`

              ---

              *This issue was created automatically by the ADA Compliance Agent.*
              `
            });

      - name: Fail workflow if violations found
        if: steps.parse.outputs.audit_passed != 'true' && github.event_name == 'pull_request'
        run: |
          echo "❌ ADA compliance check failed"
          echo "Lighthouse score: ${{ steps.parse.outputs.lighthouse_score }}/100 (minimum: 90)"
          echo "Critical/serious violations: ${{ steps.parse.outputs.axe_violations }} (maximum: 0)"
          exit 1

      - name: Check for new certifications
        if: github.event.inputs.mode == 'certification-check' || github.event_name == 'schedule'
        run: |
          echo "🎓 Checking for new ADA certification courses..."
          # This would trigger a separate process to scan certification sources
          # For now, just log the action
          echo "Certification check scheduled. See ADA Compliance Agent documentation."

      - name: Cleanup
        if: always()
        run: |
          # Stop development server
          pkill -f "npm run dev" || true

  # Optional: Certification research job (runs weekly)
  certification-research:
    name: Research ADA Certifications
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Research new certifications
        run: |
          echo "🔍 Scanning for new ADA certification courses..."
          # This would invoke the ADA Compliance Agent to scan for new courses
          # For implementation, this could call an API or scrape course sites
          echo "See ada-compliance-agent SKILL.md for certification sources"

      - name: Create discussion with findings
        uses: actions/github-script@v7
        with:
          script: |
            // Create a GitHub Discussion with certification findings
            console.log('Would create discussion with new certifications found');
