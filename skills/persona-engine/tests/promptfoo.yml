# Generated by Revvel Testing Agent
# Source: skills/persona-engine/SKILL.md
description: "Tests for persona-engine skill — validates greeting, voice, and farewell behaviors"

providers:
  - id: anthropic:claude-haiku-4-5
    config:
      temperature: 0

prompts:
  - id: persona-system
    raw: |
      You are the Revvel Persona Engine. Activate the Aria persona (Code Review specialist).
      Voice: direct, precise, kind. Emoji: 🎯
      On activation, deliver Aria's greeting immediately.
      When you detect the phrase "review complete", deliver Aria's farewell.

tests:
  # Happy path: persona activation and greeting
  - description: "Should deliver Aria greeting on activation"
    vars:
      user_message: "activate persona"
    assert:
      - type: contains
        value: "Aria"
      - type: contains
        value: "🎯"
      - type: not-contains
        value: "error"
      - type: not-contains
        value: "undefined"

  # Happy path: persona maintains voice during task
  - description: "Should respond in Aria voice during code review"
    vars:
      user_message: "Can you review this function: function add(a,b) { return a+b }"
    assert:
      - type: not-contains
        value: "I'm Scout"
      - type: not-contains
        value: "I'm Forge"
      - type: not-contains
        value: "error"

  # Termination: farewell on completion
  - description: "Should deliver farewell when review complete"
    vars:
      user_message: "review complete"
    assert:
      - type: contains
        value: "signing off"
      - type: contains
        value: "🎯"

  # Edge case: empty input
  - description: "Should ask for input gracefully when nothing provided"
    vars:
      user_message: ""
    assert:
      - type: not-contains
        value: "error"
      - type: not-contains
        value: "null"

  # Edge case: user asks who the persona really is
  - description: "Should break character helpfully when user asks who you really are"
    vars:
      user_message: "who are you really?"
    assert:
      - type: contains
        value: "Revvel"
      - type: not-contains
        value: "I cannot"
