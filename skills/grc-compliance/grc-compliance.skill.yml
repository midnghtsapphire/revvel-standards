implementation:
  type: markdown_prompt
  language: markdown
  content: |
    # GRC Compliance Skill

    Expert-level compliance guidance for ISO 27001, SOC 2, FedRAMP, GDPR, HIPAA, NIST CSF, PCI DSS, TSA Cybersecurity, and ISO 42001 AI Management System.

    See the full SKILL.md at skills/grc-compliance/SKILL.md for complete operating protocol, framework coverage, and installation instructions.

    ## Quick Install

    ```shell
    /plugin marketplace add midnghtsapphire/Claude-Skills-Governance-Risk-and-Compliance
    /plugin install iso27001@grc-skills soc2@grc-skills fedramp@grc-skills gdpr-compliance@grc-skills hipaa-compliance@grc-skills nist-csf@grc-skills pci-compliance@grc-skills tsa-compliance@grc-skills iso42001@grc-skills
    ```

examples:
  - task: "ISO 27001 gap analysis"
    command: "Load grc-compliance skill and run ISO 27001 gap analysis against our current ISMS documentation"
    expected_output: "Structured gap report covering mandatory clauses 4-10 and all Annex A controls with 🔴/🟡/🟢 status ratings and remediation roadmap"

  - task: "GDPR code audit"
    command: "Audit this API endpoint for GDPR compliance issues"
    expected_output: "Severity-graded findings (🔴/🟡/🟢) mapped to specific GDPR articles with remediation guidance"

  - task: "SOC 2 policy drafting"
    command: "Draft a SOC 2 Information Security Policy for our SaaS product"
    expected_output: "Audit-ready policy document with TSC criterion mappings, control owner, and evidence requirements"

  - task: "FedRAMP readiness assessment"
    command: "Assess our cloud platform's FedRAMP Moderate readiness"
    expected_output: "75+ item readiness checklist results across 14 security domains with prioritized remediation steps"

  - task: "HIPAA BAA template"
    command: "Generate a HIPAA Business Associate Agreement for our healthcare data processor"
    expected_output: "Complete BAA template with CFR citations, required provisions, and customization guidance"

outputs:
  artifacts:
    - "compliance gap report (per framework)"
    - "policy documents (audit-ready)"
    - "Statement of Applicability (ISO 27001)"
    - "System Security Plan (FedRAMP)"
    - "Privacy Notice / DPIA (GDPR)"
    - "Business Associate Agreement (HIPAA)"
    - "Risk register and risk treatment plan"
    - "Evidence collection checklist (SOC 2)"
    - "SAQ selection and PCI DSS scoping document"
    - "NIST CSF Organizational Profile"
    - "ISO 42001 AI System Impact Assessment"

integration:
  security_skill: "Use alongside for OWASP, secrets management, and technical security controls"
  vault_agent_skill: "Use for secrets rotation before hardening compliance scope"
  ada_compliance_agent_skill: "Complement for ADA/WCAG accessibility compliance requirements"
  tax_legal_agent_skill: "Complement for legal questions around HIPAA BAAs, GDPR DPAs, contractual obligations"

guardrails:
  disclaimer: >
    GRC skills provide expert-level guidance based on framework documentation and best practices.
    All outputs should be reviewed by qualified compliance professionals before use in formal
    audits, regulatory submissions, or legal agreements. This skill does not constitute legal advice.
  escalation_triggers:
    - "Legal determination required (seek qualified counsel)"
    - "Framework-specific certification body must validate (3PAO for FedRAMP, QSA for PCI DSS)"
    - "Jurisdiction-specific legal advice needed (GDPR DPA, state privacy laws)"
    - "Active regulatory investigation or enforcement action"

monitoring:
  metrics:
    - "frameworks_covered"
    - "gap_analysis_completeness"
    - "policy_documents_generated"
    - "compliance_score_per_framework"
  upstream_check:
    url: "https://github.com/Sushegaad/Claude-Skills-Governance-Risk-and-Compliance/releases"
    frequency: "monthly"
    action: "sync fork when new version released"

schema_version: "1.0"
