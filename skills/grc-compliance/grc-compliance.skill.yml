name: grc_compliance
title: "GRC Compliance — Governance, Risk & Compliance Claude Skills"
version: "1.0.0"
description: "Expert-level Governance, Risk, and Compliance (GRC) guidance for nine major regulatory frameworks (ISO 27001, SOC 2, FedRAMP, GDPR, HIPAA, NIST CSF, PCI DSS, TSA Cybersecurity, ISO 42001) delivered via the Claude Code plugin marketplace. Fork of Sushegaad/Claude-Skills-Governance-Risk-and-Compliance, benchmarked at 94% accuracy across 18 test cases."

