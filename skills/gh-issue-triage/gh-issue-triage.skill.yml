name: gh-issue-triage
title: "GitHub issue triage"
version: "1.0.0"
description: "Label and triage GitHub issues on the repository label allowlist. Adds labels, does not remove them, and signs every comment."

metadata:
  author: "TriageChief"
  category: "Developer Workflow"
  tags: ["github", "gh-issue-triage"]
  created_at: "2026-11-11"
  updated_at: "2026-11-11"
  license: "MIT"
  copyright: "Copyright (c) 2025 Joe Seymour"
  source: "https://github.com/poindexter12/waypoint/tree/main/workflows/skills/gh-issue-triage"

triggers:
  - "triage this issue"
  - "label this issue"
  - "issue priority"
  - "duplicate issue"
  - "needs-human"
  - "labels-allowlist"

dependencies:
  skills: ["github-read-write-admin"]
  tools: ["gh"]
  pip_packages: []

documentation:
  skill_file: "docs/skills/gh-issue-triage/SKILL.md"
  loader: "skills/gh-issue-triage/SKILL.md"

implementation:
  type: markdown_prompt
  language: markdown
  content: |
    Load docs/skills/gh-issue-triage/SKILL.md and follow it.
    That file is the canonical playbook. This YAML is discovery metadata.
    Sign every write as **BotName** at the start and — BotName at the end.
    Do not delete, force-push, or print a secret.
    CircleCI lint-and-test is the check that counts. GitHub Actions runners currently do not start.
    Do not merge from this skill. Merge gates live in docs/skills/github-read-write-admin/SKILL.md and apply only when that playbook is loaded and the task asked for the merge.
schema_version: "1.0"
