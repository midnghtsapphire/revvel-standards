examples:
  - query: "Can I get a USDA loan if my property has an inground pool?"
    answer: "Inground pools are generally NOT allowed for USDA-financed properties as they are considered luxury amenities. However, state RD offices vary. Some allow pools if permanently removed or filled in before closing. Above-ground pools are typically allowed. Contact your state USDA RD office for specific guidance."
  
  - query: "What are the USDA income limits for Colorado?"
    answer: "USDA income limits vary by county and household size. For example, El Paso County, Colorado (2026) has a limit of $103,350 for 1-4 person households and $136,450 for 5-8 person households. Check the official USDA RD website for your specific county."
  
  - query: "How do I become a loan packager?"
    answer: "1. Check your state's licensing requirements (some states require NMLS MLO license, others have no requirement). 2. Partner with USDA-approved lenders who accept packaged loans. 3. Set up a business entity (LLC or sole proprietorship). 4. Build document checklists and compliance systems. 5. Market to borrowers through real estate agents, nonprofits, and community organizations. Compensation is paid by lenders ($500-$2,500 per closed loan), not borrowers (RESPA violation)."
  
  - query: "Can Audrey and Caresse buy a home together with a USDA loan if their combined income is $130,000?"
    answer: "It depends on the county. For El Paso County, Colorado, the 2026 limit for 1-4 person households is $103,350, so they would exceed it. Workaround: Audrey could apply alone (if her income is under the limit) and add Caresse to the title later (check lender policy). Alternatively, look at counties with higher income limits or consider FHA/Conventional loans."

