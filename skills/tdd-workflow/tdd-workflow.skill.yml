name: tdd-workflow
title: "Test-first workflow"
version: "1.0.0"
description: "Write a failing test, then the code that makes it pass, in the runner the repo already uses."

metadata:
  author: "TriageChief"
  category: "Developer Workflow"
  tags: ["github", "tdd-workflow"]
  created_at: "2026-11-11"
  updated_at: "2026-11-11"
  license: "MIT"
  copyright: "Copyright (c) 2025 cfrs2005"
  source: "https://github.com/cfrs2005/claude-init/tree/main/templates/.claude/skills/tdd-workflow"

triggers:
  - "tdd"
  - "test first"
  - "test-first failing test"
  - "reproduce the bug"
  - "node:test"

dependencies:
  skills: ["github-read-write-admin"]
  tools: ["node"]
  pip_packages: []

documentation:
  skill_file: "docs/skills/tdd-workflow/SKILL.md"
  loader: "skills/tdd-workflow/SKILL.md"

implementation:
  type: markdown_prompt
  language: markdown
  content: |
    Load docs/skills/tdd-workflow/SKILL.md and follow it.
    That file is the canonical playbook. This YAML is discovery metadata.
    Sign issue bodies, pull request titles and bodies, reviews, comments, and commit messages as **BotName** at the start and — BotName at the end. Do not sign source files.
    Do not delete, force-push, or print a secret.
    CircleCI lint-and-test is the check that counts. GitHub Actions runners currently do not start.
    Do not merge from this skill. Merge gates live in docs/skills/github-read-write-admin/SKILL.md and apply only when that playbook is loaded and the task asked for the merge.
schema_version: "1.0"
