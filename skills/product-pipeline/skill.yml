  - standards/SAAS_PRODUCTS.md
  - standards/ZERO_HUMAN_FRAMEWORK.md
  - standards/PRICING.md
  - standards/CRON_SYSTEM.md
  - standards/OAUDREY_DEPLOYMENT_STANDARD.md
  - standards/MVI_CONTRACT_STANDARD.md

tests:
  path: "skills/product-pipeline/tests/promptfoo.yml"

documentation:
  skill_file: "skills/product-pipeline/SKILL.md"
  standard_file: "standards/AUTOMATED_PRODUCT_PIPELINE.md"
