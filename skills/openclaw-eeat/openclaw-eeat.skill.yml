name: openclaw-eeat
title: "OpenClaw E-E-A-T Content Distribution"
version: "1.0.0"
description: "Automated brand content distribution across high-value platforms (ORCID, Wikidata, ResearchGate, etc.) to establish E-E-A-T signals for Google Knowledge Graph and OSINT presence."

metadata:
  author: "MIDNGHTSAPPHIRE"
  category: "Content & Marketing"
  tags: ["eeat", "openclaw", "brand-distribution", "knowledge-graph", "wikidata", "orcid", "researchgate", "osint", "json-ld", "schema-org"]
  created_at: "2026-04-30"
  updated_at: "2026-04-30"
  persona: "Echo 🌐"
  lifecycle: "ephemeral"

dependencies:
  skills: ["vault-agent", "seo-metadata", "system-state", "model-router"]
  tools: ["jq", "xmllint"]
  pip_packages: []
  optional: ["n8n", "mcp"]

triggers:
  keywords:
    - "openclaw eeat"
    - "eeat agent"
    - "distribute brand content"
    - "knowledge graph"
    - "wikidata entity"
    - "orcid update"
    - "researchgate profile"
    - "brand distribution"
    - "platform content"
    - "deep web presence"
    - "osint profile"
    - "intelligence community"
    - "google knowledge panel"
    - "eeat signals"
    - "expertise signals"

platforms:
  tier1:
    - name: "ORCID"
      format: "xml"
      auto_submit: true
      api_required: true
    - name: "GitHub"
      format: "markdown"
      auto_submit: true
      api_required: true
  
  tier2:
    - name: "Wikidata"
      format: "rdf/json"
      auto_submit: false
      priority: "highest"
    - name: "ResearchGate"
      format: "form"
      auto_submit: false
    - name: "Internet Archive"
      format: "upload"
      auto_submit: false
    - name: "Crunchbase"
      format: "form/api"
      auto_submit: false
    - name: "OpenCorporates"
      format: "claim"
      auto_submit: false
    - name: "Semantic Scholar"
      format: "auto-indexed"
      auto_submit: true
      notes: "Auto-indexed from ORCID"
  
  tier3:
    - name: "MISP"
      format: "json"
      auto_submit: false
      condition: "osint_relevance"
    - name: "IntelligenceX"
      format: "form"
      auto_submit: false
      condition: "osint_relevance"
    - name: "Maltego"
      format: "json"
      auto_submit: false
      condition: "osint_relevance"
    - name: "Bellingcat"
      format: "form"
      auto_submit: false
      condition: "osint_relevance"

validation_rules:
  brand_statement:
    required_fields:
      - "name"
      - "tagline"
      - "expertise_areas"  # min: 3
      - "urls.primary"
      - "credentials"      # min: 1
  
  projects:
    required_fields:
      - "name"
      - "description"
      - "status"
      - "tech_stack"       # min: 2
      - "outcomes"         # min: 1
  
  url_checks:
    - verify_http_200: true
    - fail_gracefully: true
  
  schema_validation:
    - jsonld: "https://validator.schema.org/"
    - orcid_xml: "orcid_api_schema"
    - wikidata_json: "valid_q_codes"

output_structure:
  base_path: "skills/openclaw-eeat/output/"
  state_file: "state.json"
  summary_file: "summary.md"
  platform_dirs:
    - "orcid/"
    - "wikidata/"
    - "researchgate/"
    - "github/"
    - "archive-org/"
    - "crunchbase/"
    - "misp/"
    - "bellingcat/"

templates:
  jsonld:
    - "organization.jsonld"
    - "person.jsonld"
    - "research-project.jsonld"
  
  platform_specific:
    - "orcid-works.xml"
    - "wikidata-entity.md"
    - "researchgate-profile.md"
    - "archive-org-submission.md"
  
  osint:
    - "misp-profile.json"
    - "maltego-entity.json"
    - "bellingcat-profile.md"

implementation:
  type: markdown_prompt
  language: markdown
  workflow:
    - "Load session-start skills (system-state, vault-agent)"
    - "Read brand statement and project descriptions"
    - "Classify platforms by tier"
    - "Format content using templates"
    - "Validate schemas and URLs"
    - "Generate output files"
    - "Update state.json"
    - "Emit summary.md"

agent_instructions: |
  You are Echo 🌐 — the OpenClaw E-E-A-T content distribution specialist.
  
  Core Rules:
  1. Read brand statement and project descriptions first
  2. Classify platforms by tier (1/2/3)
  3. Use templates from templates/<platform>/
  4. Validate all schemas before writing
  5. Wikidata is highest priority (direct Google Knowledge Graph feed)
  6. Never read secret values, only check availability via vault-agent
  7. Skip platforms updated < 30 days ago with unchanged content
  8. Sign off: "🌐 Echo — E-E-A-T content distribution complete."

examples:
  - name: "Generate all platform content"
    command: "openclaw run-skill openclaw-eeat --brand brand-statement.yml --projects 'projects/*.md'"
    description: "Generate formatted content for all supported platforms"
  
  - name: "Update Tier 1 only"
    command: "openclaw run-skill openclaw-eeat --brand brand-statement.yml --tier 1 --auto-submit"
    description: "Update only ORCID and GitHub with auto-submission"
  
  - name: "Generate Wikidata entity"
    command: "openclaw run-skill openclaw-eeat --brand brand-statement.yml --platform wikidata"
    description: "Generate only Wikidata entity creation draft"

schema_version: "1.0"
