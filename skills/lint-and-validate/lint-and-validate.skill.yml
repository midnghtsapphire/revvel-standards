name: lint-and-validate
title: "Lint and validate"
version: "1.0.0"
description: "Run the linter and tests that cover the files you changed. Do not call the task done when they fail."

metadata:
  author: "TriageChief"
  category: "Developer Workflow"
  tags: ["github", "lint-and-validate"]
  created_at: "2026-11-11"
  updated_at: "2026-11-11"
  license: "MIT"
  copyright: "Copyright (c) 2026 VUDOVN"
  source: "https://github.com/vudovn/antigravity-kit/tree/main/.agent/skills/lint-and-validate"

triggers:
  - "lint"
  - "validate"
  - "typecheck"
  - "markdownlint"
  - "npm test"
  - "flake8 baseline"

dependencies:
  skills: ["github-read-write-admin"]
  tools: ["node", "python3"]
  pip_packages: []

documentation:
  skill_file: "docs/skills/lint-and-validate/SKILL.md"
  loader: "skills/lint-and-validate/SKILL.md"

implementation:
  type: markdown_prompt
  language: markdown
  content: |
    Load docs/skills/lint-and-validate/SKILL.md and follow it.
    That file is the canonical playbook. This YAML is discovery metadata.
    Sign every write as **BotName** at the start and — BotName at the end.
    Do not delete, force-push, or print a secret.
    CircleCI lint-and-test is the check that counts. GitHub Actions runners currently do not start.
    Do not merge from this skill. Merge gates live in docs/skills/github-read-write-admin/SKILL.md and apply only when that playbook is loaded and the task asked for the merge.
schema_version: "1.0"
