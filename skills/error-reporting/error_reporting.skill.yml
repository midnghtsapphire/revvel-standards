  content: |
    # Error Reporting Skill
    
    Implement three-tier error reporting (console → email → GitHub Issue) for all significant server jobs using the `monitored()` wrapper.
    
    ## Three-Tier System
    
    ```
    Tier 1 — Console (always)         → console.error with structured log
    Tier 2 — Email (severity ≥ medium) → via Resend to admin address
    Tier 3 — GitHub Issue (severity ≥ high, with cooldown) → auto-created issue
    ```
    
    ## Severity Levels
    
    | Level | Code | When to Use |
    |---|---|---|
    | `low` | 1 | Expected user errors, input validation failures, 404s |
    | `medium` | 2 | Unexpected but recoverable server errors, third-party timeouts |
    | `high` | 3 | Data integrity failures, auth errors, payment failures |
    | `critical` | 4 | System down, DB unreachable, security incidents |
    
    Default for unknown errors: `medium`. When in doubt, escalate up. `critical` always bypasses cooldown.
    
    ## The `monitored()` Wrapper (Mandatory)
    
    ```typescript
    await monitored(
      async () => {
        const records = await fetchExternalData();
        await saveToDatabase(records);
      },
      {
        jobName: 'daily-data-ingestion',
        severity: 'high',
        cooldownMinutes: 120,
        tags: ['data-pipeline'],
      }
    );
    ```
    
    The wrapper: catches all errors → logs (Tier 1) → emails if `medium`+ (Tier 2) → creates GitHub Issue if `high`+ with cooldown (Tier 3) → re-throws.
    
    ## Cooldown Rules
    
    - Default cooldown: 60 minutes per `jobName` between GitHub issues
    - `critical`: no cooldown, always fires immediately
    - Store last-fired timestamp in `error_reports.created_at` (DB)
    
    ## What Must Be Wrapped ("Significant Server Jobs")
    
    - [ ] Scheduled / cron jobs
    - [ ] Background workers and queues
    - [ ] Webhook handlers (incoming from external services)
    - [ ] Data ingestion pipelines
    - [ ] Payment processing functions (Stripe events)
    - [ ] Email sending functions
    - [ ] External API calls that mutate data
    - [ ] Database migrations
    
    **Not required**: simple CRUD route handlers (covered by global error middleware), read-only endpoints, client-side code.
    
    ## GitHub Issue Labels
    
    All auto-created issues must be labeled: `{app-name}/error`
    - `high` severity → also `priority:high`
    - `critical` severity → also `priority:critical`
    
    Pre-create the `{app-name}/error` label in the repo before deploying.
    
    ## Database Table (`error_reports`)
    
    Must exist in every app using this standard:
    
    ```sql
    CREATE TABLE error_reports (
      id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
      app_name VARCHAR(100) NOT NULL,
      job_name VARCHAR(255) NOT NULL,
      severity ENUM('low', 'medium', 'high', 'critical') NOT NULL DEFAULT 'medium',
      error_message TEXT NOT NULL,
      error_stack TEXT,
      context_json JSON,
      environment ENUM('production', 'staging', 'development') NOT NULL DEFAULT 'production',
      email_sent TINYINT(1) NOT NULL DEFAULT 0,
      github_issue_created TINYINT(1) NOT NULL DEFAULT 0,
      github_issue_url VARCHAR(500),
      created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
      INDEX idx_job_name_created (job_name, created_at)
    );
    ```
    
    ## PR Enforcement
    
    Code review must reject any PR that adds a new cron job, worker, or webhook handler without `monitored()` wrapping.
    
    ## Related Standards
    
    - `templates/cicd/auto-fix.yml` — auto-fix loop for CI failures
    - `SECURITY_STANDARD.md` — secret management for Resend API key + GitHub token
    

