  content: |
    # Mobile Testing Skill (iOS + Android — Expo / React Native)

    Apply Revvel mobile testing standards: jest-expo + @testing-library/react-native
    for unit/component and Maestro for E2E on both iOS and Android, runnable
    entirely in the cloud (EAS Build + GitHub Actions runners) with no local Xcode
    or Android Studio install required.

    For full text see `skills/mobile-testing/SKILL.md`.

    ## Stack — do NOT substitute
    - Unit + component: `jest-expo` + `@testing-library/react-native` + `@testing-library/jest-native`
    - E2E (default): Maestro (declarative YAML, one flow runs on iOS + Android)
    - E2E (alternate tier, only when grey-box internals must be asserted): Detox
    - Native build for E2E: EAS Build `--profile preview --platform ios|android`
    - iOS sim runner: GitHub Actions `macos-14`
    - Android emu runner: GitHub Actions `ubuntu-latest` + `reactivecircus/android-emulator-runner`
    - Forbidden: Appium, Calabash, separate native iOS/Android codebases,
      ejecting from Expo managed without a logged decision.

    ## Coverage thresholds (hard CI gate)
    - Statements 80%, Branches 75%, Functions 80%, Lines 80%

    ## Mandatory E2E journeys (iOS AND Android)
    - Auth: Sign Up, Sign In, Sign Out
    - Checkout: Add to Cart, Complete Purchase
    - Admin: Toggle Feature Flag
    - Accessibility: VoiceOver / TalkBack navigation

    ## Hard rules (RFC 2119 — full list in research doc)
    - MUST use jest-expo + @testing-library/react-native for unit + component.
    - MUST default to Maestro for E2E. Detox MAY be added in addition. MUST NOT adopt Appium.
    - MUST NOT require Xcode or Android Studio installed locally — EAS + GH Actions runners cover all native execution.
    - MUST NOT eject from Expo managed workflow without a logged decision in DECISIONS.md.
    - MUST match 80 / 75 / 80 / 80 coverage thresholds.
    - MUST lint app.json / app.config.ts against Expo's published schema as part of `npm test`.

    ## Workflow when activated
    1. Confirm the repo is Expo managed (`app.json` + `expo` in package.json). If bare RN, stop and escalate.
    2. Copy `templates/mobile/testing/*` into the target repo.
    3. Install deps via `npx expo install`.
    4. Add npm scripts: `test`, `test:unit`, `test:component`, `test:e2e:android`, `test:e2e:ios`, `test:ota`.
    5. Add `.github/workflows/mobile-test.yml` from the template. Required check name is `mobile-test`.
    6. Build the first `--profile preview` artifact via EAS; log the EAS build URL in the PR.
    7. Land the harness incrementally per the 8-PR rollout plan in the research doc.

