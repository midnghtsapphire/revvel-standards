name: Jules PR Reviewer

# Fleet standard jury lane. Secret: JULES_API_KEY.
# If the key is missing, publish a successful jules/review status so the lane
# is visible but non-blocking.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: jules-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Jules PR review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Verify JULES_API_KEY is configured
        run: |
          if [ -z "${JULES_API_KEY}" ]; then
            echo "::warning::JULES_API_KEY is not set — skipping Jules PR Reviewer."
          else
            echo "JULES_API_KEY is configured."
          fi

      - name: Jules PR Review
        if: ${{ env.JULES_API_KEY != '' && env.JULES_API_KEY != null }}
        uses: sanjay3290/jules-pr-reviewer@fc66a7c78b499bfa2e16235b55574e458c6551d6  # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on: blocking
          skip_drafts: true
          skip_forks: true
          bypass_label: jules-override
          status_context: jules/review

      - name: Mark Jules review status as skipped
        if: ${{ env.JULES_API_KEY == '' || env.JULES_API_KEY == null }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              core.info('No pull_request head SHA (workflow_dispatch?) — nothing to status.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'jules/review',
              description: 'Skipped: JULES_API_KEY is not configured',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
