# Device Tree — declarative Thread kinds available to the Host.
#
# The Host reads this file to know what kinds of Threads it can dispatch when
# decomposing a WR (Grid) into Blocks. This is the equivalent of a Device Tree
# in an embedded system: a static description of what hardware (Thread kinds)
# is available, so the OS (Host) does not have to hard-code them.
#
# Naming inspiration: FLAME GPU 2's formal agent specification format (see
# HANDOFF.md § Prior Art). Copyleft-safe: we borrow the *idea* of a declarative
# spec, not the code.
#
# Rules:
# - Every kind referenced by an agent-contract.yml MUST exist here.
# - Kinds are versioned by name suffix when they diverge: e.g. researcher and
#   researcher-deep are different kinds, not the same kind at v1/v2.
# - Adding a kind is a normal PR. Removing one is destructive - use the
#   allow-destroy label + owner sign-off (DEFINITION_OF_DONE rule #4).
# - The Host does not invent kinds. If a WR needs a capability not listed
#   here, the Host emits a research Block that proposes a new kind first.
#
# See also:
# - schemas/agent-contract.schema.json - the contract these Threads populate
# - .github/workflows/host.yml           - the workflow that runs the Host
# - .github/workflows/agent-fallback.yml - the dispatcher the Host calls
# - docs/AGENT_FALLBACK_PROCESS.md       - the fallback chain semantics

version: 1

# Roles map to schemas/agent-contract.schema.json $defs/block/role enum.
# Every kind belongs to exactly one role.

kinds:

  # ── Research lane ─────────────────────────────────────────────────────────
  - name: researcher
    role: research
    description: >
      General web + docs research. Uses Tavily/Perplexity via OpenRouter.
      Best for validating claims, finding FOSS alternatives, gathering
      references. Output: a research brief in the WR thread.
    default_agent: openrouter
    # WR #17775: visiting LLM / OpenRouter floor is 60m (was 30).
    default_timeout_minutes: 60

  - name: researcher-deep
    role: research
    description: >
      Long-form research with citation extraction. Uses Perplexity sonar-pro
      via .github/workflows/perplexity-research-agent.yml. Output: cited
      research doc committed to research/ or docs/research/.
    default_agent: openrouter
    default_timeout_minutes: 120

  # ── Build lane ────────────────────────────────────────────────────────────
  - name: builder
    role: build
    description: >
      Writes application code end-to-end for one Block. Must ship complete
      (no scaffolding, no TODO stubs) per DEFINITION_OF_DONE. Dispatches via
      agent-fallback.yml (OpenRouter -> OpenHands -> Cursor).
    default_agent: openrouter
    default_timeout_minutes: 60

  - name: builder-standards
    role: build
    description: >
      Writes changes to standards, workflows, or schemas in this repo only.
      Scoped to non-application code so it can run against .github/, docs/,
      standards/, schemas/, scripts/, tests/. Same fallback chain as builder.
    default_agent: openrouter
    # WR #17775: floor 60m for OpenRouter builders (was 45).
    default_timeout_minutes: 60

  - name: builder-workflow
    role: build
    description: >
      Writes or edits a .github/workflows/*.yml file. Runs workflows:validate
      before commit so the YAML never lands broken.
    default_agent: openrouter
    # WR #17775: floor 60m for OpenRouter builders (was 30).
    default_timeout_minutes: 60

  # ── Review lane ───────────────────────────────────────────────────────────
  - name: reviewer
    role: review
    description: >
      Code review on a PR. Contrarian family by default (see
      skills/openrouter-swarms/SKILL.md). Findings post as PR review comments.
      Reviewer-of-review is the Watchdog (Block 2).
    default_agent: openrouter
    # WR #17775: floor 60m for OpenRouter reviewers (was 20).
    default_timeout_minutes: 60

  - name: reviewer-security
    role: review
    description: >
      Security-focused review pass. Loads skills/security/SKILL.md.
      Runs on any PR touching auth, secrets, or user input paths.
    default_agent: openrouter
    # WR #17775: floor 60m for OpenRouter reviewers (was 25).
    default_timeout_minutes: 60

  # ── Testing lane ──────────────────────────────────────────────────────────
  - name: tester
    role: testing
    description: >
      Writes tests for changes in a PR. Prefers node --test + real code paths
      per repo TESTING.md (no mocks unless justified). Roo owns this lane
      when the FOSS route is preferred.
    default_agent: openrouter
    # WR #17775: floor 60m for OpenRouter testers (was 30).
    default_timeout_minutes: 60

  # ── Deploy lane ───────────────────────────────────────────────────────────
  - name: deployer
    role: deploy
    description: >
      Runs the ship-to-market flow on an approved artifact. Writes the live
      URL back to the README per DEFINITION_OF_DONE rule #1.
    default_agent: openrouter
    # WR #17775: floor 60m for OpenRouter deployers (was 45).
    default_timeout_minutes: 60

  # ── Docs lane ─────────────────────────────────────────────────────────────
  - name: doc-writer
    role: docs
    description: >
      Produces docs for a Block's output. Never scaffolded - writes real
      documentation of what the code does, not what it will do.
    default_agent: openrouter
    # WR #17775: floor 60m for OpenRouter doc writers (was 20).
    default_timeout_minutes: 60

  # ── Meta lane ─────────────────────────────────────────────────────────────
  - name: host-decomposer
    role: meta
    description: >
      Reserved kind used by the Host itself when it needs to run a
      sub-decomposition (e.g., re-plan mid-Grid). The Host never dispatches
      this kind to agent-fallback.yml; it runs in-process. Listed here so
      contracts can reference it for provenance.
    default_agent: openrouter
    default_timeout_minutes: 10
