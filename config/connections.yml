# ═══════════════════════════════════════════════════════════════════════════
# CONNECTIONS REGISTRY — single source of truth for every tool / API / MCP /
# CLI / agent / GitHub app in the fleet, and what each one can reach.
#
# This file is the SSOT. Human views are GENERATED from it, never hand-edited:
#   npm run connections            # -> docs/CONNECTIONS_REGISTRY.md + README block
#   npm run connections:html       # -> connections-dashboard.html (on-demand)
#   npm run connections:drift      # report repo integrations missing here
#
# So the docs can never go stale: change this file, regenerate, done.
#
# status:
#   verified   — confirmed present in this repo (.env.example key, workflow,
#                MCP server, or script) or by the maintainer
#   unverified — asserted but not yet confirmed; DO NOT treat as fact until
#                someone flips it to verified (anti-hallucination discipline)
#
# type:   agent | mcp | api | cli | library | github-action | app | model
# ═══════════════════════════════════════════════════════════════════════════

meta:
  owner: midnghtsapphire
  updated: "2026-06-13"
  # Ordered agent fallback chain. SSOT for the README "Agent Fallback System"
  # block — edit here, regenerate, never hand-write the chain in prose again.
  fallback_chain:
    - id: openrouter
      role: "first line of sight / orchestrator"
      note: "Triages every WR/PR and can route recursively to specialized agents or OpenRouter swarms."
    - id: openhands
      role: "free autonomous fallback"
      note: "Picks up when the orchestrator defers; full multi-file autonomy on a free quota."
    - id: manual
      role: "human escalation"
      note: "Applies the needs-human label with full diagnostics if agents can't resolve it."
  fallback_retired:
    - id: cursor
      note: "Removed from the chain in #14539; IDE config retained."

connections:
  # ── Coding / orchestration agents ─────────────────────────────────────────
  - id: claude
    name: Claude (this assistant)
    type: agent
    auth: key
    env: ANTHROPIC_API_KEY
    status: verified
    access: [code-gen, code-review, planning, repo-edit, pr-merge, orchestration]
    connects_to: [github, all-mcp-servers, bash, openrouter]
    used_by: [interactive-sessions, claude-code-on-web]
    note: "Drives sessions; can reach every wired MCP server + GitHub. Opus 4.8."

  - id: openrouter
    name: OpenRouter
    type: agent
    auth: key
    env: OPENROUTER_API_KEY
    status: verified
    access: [code-gen, pr-review, triage, swarms]
    connects_to: [github, anthropic, perplexity, deepseek]
    used_by: [agent-fallback.yml, openrouter-assignee.yml, ai-pr-review-openrouter.yml]
    note: "Primary coding agent. Fallback chain: OpenRouter -> OpenHands -> manual."

  - id: openhands
    name: OpenHands
    type: agent
    auth: key
    env: OPENHANDS_API_KEY
    status: verified
    access: [code-gen, issue-resolve, pr-create]
    connects_to: [github, openrouter]
    used_by: [agent-fallback.yml, openhands-resolver.yml]
    note: "Pre-paywall Devin-class agent, free quota. Now instantiated as free fallback (#14541)."

  - id: jules
    name: Jules (Google)
    type: agent
    auth: key
    env: JULES_API_KEY
    status: verified
    access: [code-gen, pr-review, coding-tasks]
    connects_to: [github]
    used_by: [jules-coding-agent.yml, jules-invoke.yml, jules-pr-reviewer.yml]
    note: "Owner says Jules has access to Roo + Gemini/Opus and may be recursive — sub-connections UNVERIFIED below."

  - id: devin
    name: Devin
    type: agent
    auth: paid
    env: DEVIN_API_KEY
    status: verified
    access: [code-gen, autonomous-tasks]
    connects_to: [github]
    used_by: []
    note: "API key present. Owner: strong at finding varied errors in one review."

  - id: cursor
    name: Cursor
    type: agent
    auth: key
    env: CURSOR_API_KEY
    status: verified
    access: [code-gen]
    connects_to: [github]
    used_by: []
    note: "Being retired from the fallback chain (#14539); IDE config retained."

  - id: copilot
    name: GitHub Copilot
    type: agent
    auth: paid
    status: verified
    access: [code-gen, pr-review, assignment]
    connects_to: [github]
    used_by: [copilot-setup-steps.yml, auto-error-handler.yml]

  - id: octopus
    name: Octopus Review
    type: app
    auth: paid
    status: verified
    access: [pr-review]
    connects_to: [github]
    used_by: [octopus-route.yml, octopus-cli.yml]
    note: "Owner: found several different error classes in a single review. Currently over monthly AI quota — needs own API keys."

  - id: bito
    name: Bito AI
    type: app
    auth: key
    env: BITO_API_KEY
    status: verified
    access: [code-review]
    connects_to: [github]
    used_by: [bito-ai.yml]

  - id: augment
    name: Augment Code
    type: app
    auth: key
    status: verified
    access: [code-review]
    connects_to: [github]
    used_by: [augment-check.yml]

  - id: vercel
    name: Vercel
    type: app
    auth: oauth
    status: verified
    access: [preview-deploys, production-deploys, hosting]
    connects_to: [github]
    used_by: [vercel-bot]
