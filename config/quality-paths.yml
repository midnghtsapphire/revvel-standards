version: 1

# One source of truth for repository quality boundaries.
zones:
  strict_source:
    include:
      - "scripts/**"
      - "tests/**"
      - "engines/**"
      - ".github/workflows/**"
      - ".github/actions/**"

  structured_docs:
    include:
      - "docs/**"
      - "skills/**"
      - "playbooks/**"
      - "standards/**"

  templates:
    include:
      - "wr/templates/**"
      - "templates/**"

  generated:
    include:
      - "docs/controller/*.json"
      - "docs/status/**"
      - "reports/**"
      - "artifacts/**"
      - "generated/**"

  raw_imports:
    include:
      - "transcripts/**"
      - "research/raw/**"
      - "claude-transcripts/**"

markdown_lint:
  exclude:
    - "node_modules/**"
    - ".git/**"
    - "wr/issues/**"
    - "wr/pending/**"
    - "transcripts/**"
    - "research/raw/**"
    - "claude-transcripts/**"
    - "docs/controller/*.json"

policy:
  generated_files_are_schema_validated: true
  generated_files_are_not_style_linted: true
  pull_requests_check_changed_files_first: true
  scheduled_full_scans_are_advisory: true
