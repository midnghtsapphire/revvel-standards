# Saved-reply registry — single source of truth for GitHub saved replies.
#
# GitHub saved replies are USER-scoped and have no public write API, so this
# file is the repo-side canonical registry. `scripts/saved-replies.js` loads
# and validates it, and `docs/SAVED_REPLIES.md` explains (click-by-click) how
# to mirror each entry into the GitHub UI at
# https://github.com/settings/replies.
#
# Schema (validated by scripts/saved-replies.js and tests/saved-replies.test.js):
#   replies: list of entries, each with:
#     key:   unique kebab-case identifier (used by the CLI: --body <key>)
#     title: the saved-reply title shown in the GitHub UI dropdown
#     body:  the exact text inserted when the saved reply is used
#     usage: when a human/agent should reach for this reply
replies:
  - key: copilot-resolve-merge-conflicts
    title: "Copilot: resolve merge conflicts"
    body: "@copilot resolve the merge conflicts in this pull request"
    usage: >-
      Post as a PR comment when a pull request has merge conflicts and you
      want the Copilot coding agent to rebase/merge and resolve them. The
      @copilot mention hands the PR to the agent; it pushes the conflict
      resolution back to the same PR branch.

  - key: owner-request-changes-before-approval
    title: "Owner: request changes before I approve"
    body: |-
      I want to approve this, but first please:
      - [ ] <specific change 1>
      - [ ] <specific change 2>

      Ping me back when done. Approval will follow.
    usage: >-
      Owner uses this on a PR they intend to approve but not yet. Faster
      than typing "please fix X and Y" freeform every time. Keeps the
      request structured so the agent knows exactly what to change.

  - key: owner-block-until-i-test
    title: "Owner: do NOT merge — I need to test first"
    body: |-
      Please do NOT merge until I have tested this myself. Deploy the
      preview URL and tag @midnghtsapphire when it is live. I will
      approve or request changes after hands-on testing.
    usage: >-
      Owner uses this on PRs that touch a new product surface or a live
      customer-facing flow. Explicit block on auto-merge for cases where
      "green CI" is not sufficient — the owner has to click through the
      real thing before ship.

  - key: hand-off-to-openrouter-review
    title: "Hand off: OpenRouter review"
    body: "@openrouter review this PR against the security template"
    usage: >-
      Route a PR to the OpenRouter review lane (Opus 4.7 → DeepSeek R1
      fallback per .github/agent-models.yml). Use when Octopus, Bito, or
      Devin have already reviewed and a second, model-diverse pass is
      wanted before merge.

  - key: hand-off-to-devin-deep-review
    title: "Hand off: Devin deep review"
    body: "/devin deep-scan this PR for logic bugs and missing edge cases"
    usage: >-
      Route a PR to Devin for a deeper multi-file logic review. Devin is
      paid per session (~ACUs) so this reply is deliberate opt-in — use
      when a review needs cross-file reasoning that stateless reviewers
      keep missing.

  - key: escalate-owner-decision-needed
    title: "Escalate: owner decision needed"
    body: |-
      @midnghtsapphire this needs a decision from you before we can proceed.

      Summary of what is blocking:
      - <point 1>
      - <point 2>

      Options as I see them:
      1. <option A — tradeoffs>
      2. <option B — tradeoffs>

      Recommended: <one of the above, with the one-sentence reason>
    usage: >-
      Any agent uses this when it hits an irreversible or ambiguous
      choice — the ones AGENTS.md says must go to the owner (spending
      money, deleting data, changing auth, or a genuinely ambiguous
      call). Never file this for a reversible decision — make an
      assumption, document it in ASSUMPTIONS.md, and keep going.

  - key: rescue-stuck-wr
    title: "Rescue: WR is stuck, diagnose"
    body: |-
      /rescue this WR appears stuck. Please:
      1. Enumerate every workflow that fired on it and its current status.
      2. List the last 5 comments and who made them.
      3. Identify the specific blocker (missing key / failed check /
         waiting for owner / silent workflow / etc.).
      4. Do NOT retry anything yet. Post the diagnostic first.

      I will decide the next step from your diagnostic.
    usage: >-
      Owner uses this on any WR that has gone quiet or looped. Forces a
      diagnostic pass BEFORE any recovery action, so the fleet does not
      thrash. Diagnostic-first is the pattern from
      standards/AUDIT_AND_SELF_HEALING_PLAYBOOK.md.

  - key: split-multi-idea-wr
    title: "Split: this WR bundles multiple ideas"
    body: |-
      This WR contains multiple independent ideas that cannot be
      atomically scored or shipped together. Splitting into separate WRs:

      - [ ] Idea 1: <one-sentence summary> → new WR
      - [ ] Idea 2: <one-sentence summary> → new WR
      - [ ] Idea 3: <one-sentence summary> → new WR

      Closing this WR as a bundle. Reopen the child WRs individually so
      the fleet can score and sequence them.
    usage: >-
      Use on WRs where a chat transcript or zip drop got dumped in as
      one WR (grok pattern, see wr/templates/work/visiting-agent.md
      known-mistakes list). Splitting is the correct response — the
      fleet cannot RICE-score a bundle.
