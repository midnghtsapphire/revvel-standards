# Revvel Code Review Fleet — persona configuration (NON-EXECUTABLE DATA)
#
# Standard: RVS-REVIEW-001 (standards/REVVEL_CODE_REVIEW_FLEET.md)
# Added:    2026-06-25  ·  Author: revvel engine-spine agent (claude-code)
#
# This file is declarative data only. It wires NOTHING: no workflow loads it yet,
# no secret is referenced, no connector is authenticated. It mirrors the personas,
# severities, routing, and connector BOM from the standard so a future, separately
# approved `review-fleet.yml` workflow can consume it directly. Editing this file
# does not change any running behavior.

version: 1
standard: RVS-REVIEW-001
status: design-non-operational

severities:
  blocking: Blocks merge until resolved or waived by a human owner.
  advisory: Does not block; recorded for follow-up.
  bom: Access/tooling/budget needed; routed to procurement/follow-up.

# Personas with blocking authority by default. Others escalate only per must_check.
default_blocking_personas:
  - security
  - no_delete_goals
  - compliance
  - syntax_final_gate

# Output contract for every finding (see Section 4 of the standard).
finding_schema:
  persona: string
  severity: blocking|advisory|bom
  scope: string
  rule: string
  summary: string
  evidence: string
  recommendation: string
  blocking: boolean
  out_of_scope: boolean
  bom: string|null

personas:
  - id: security
    title: Security reviewer
    skills: [sast-triage-semgrep, injection-analysis, token-permission-scoping, dependency-risk]
    allowed_tools: [repo-read, semgrep, github-read, local-cli-readonly]
    scope: ["scripts/**", "**/*.js", ".github/workflows/**", "product-code"]
    must_check:
      - No shell interpolation of untrusted/${{ }}/token-bearing values into run/execSync.
      - Workflow permissions are the narrowest the job needs.
      - No secret printed, committed, echoed, or newly introduced.
    must_not_do: [wire-live-paid-api, change-secret-value]
    blocking_rule: command-injection / leaked-secret / permissions-write-all

  - id: workflow
    title: Workflow reviewer
    skills: [actions-yaml, gh-cli-semantics, concurrency, token-with-fallback]
    allowed_tools: [repo-read, github-actions-read, yaml-validator, local-cli]
    scope: [".github/workflows/**"]
    must_check:
      - YAML parses; run block indentation correct.
      - gh jobs without checkout set GH_REPO/--repo.
      - gh jobs set authenticated token with PAT fallback.
      - Best-effort steps use continue-on-error, not always-green shims on real gates.
    must_not_do: [weaken-circleci-or-wr-lint-gate]
    blocking_rule: invalid-yaml / unrunnable-unattended-workflow

  - id: no_delete_goals
    title: No-delete / goals reviewer
    skills: [diff-archaeology, goal-value-detection, archive-vs-delete-judgment]
    allowed_tools: [repo-read, git-history-read]
    scope: [diff-wide]
    must_check:
      - No file/content deleted; retired content archived with who/date/why.
      - No goal value changed (10M, Phase targets, pricing).
    must_not_do: [propose-deletions, propose-goal-edits]
    blocking_rule: deletion-without-archive / goal-value-change

  - id: product_process
    title: Product / process reviewer
    skills: [self-healing-loop-literacy, scope-assessment, scaffolding-detection]
    allowed_tools: [repo-read, github-read, local-cli]
    scope: [pr-description, scope-size, product-copy, "standards/"]
    must_check:
      - Change matches a stated goal/standard; not unrequested scope creep.
      - No agent scaffolding / placeholder language shipped (AGENT_SCAFFOLDING_BAN).
    must_not_do: [expand-pr-scope]
    blocking_rule: shipped-scaffolding-or-placeholder

  - id: docs_contracts
    title: Docs / contracts reviewer
    skills: [markdownlint, cross-reference-integrity, schema-consistency]
    allowed_tools: [repo-read, markdownlint, local-cli]
    scope: ["**/*.md"]
    must_check:
      - Changed Markdown passes markdownlint-cli2 under .markdownlint.jsonc.
      - Internal links resolve; standard IDs and schemas stay consistent.
    must_not_do: [reformat-unchanged-docs]
    blocking_rule: changed-markdown-fails-ci-lint

  - id: connector
    title: Connector reviewer
    skills: [connector-auth-models, rate-limits, graceful-degradation, bom-authoring]
    allowed_tools: [repo-read, connector-read-scopes]
    scope: [integration-code-touching-external-platforms]
    must_check:
      - Each connector call degrades gracefully when access is missing (fail-soft).
      - Missing access emitted as bom finding, never a hard failure.
      - n8n and Gumloop are treated as already-paid runner capacity (operator pays ~$60/mo total); prefer them before recommending new spend.
      - Free tiers, trials, and token-limited plans are preferred next; their limits (free_tier_available, free_tier_limits, trial_available, expected_usage, token_or_credit_limit, overage_risk, upgrade_trigger) are recorded in the BOM before any paid upgrade (see docs/standards/RUNNER_TARGETS.md).
      - Any new API/subscription/tier-upgrade is an advisory subscription_upgrade_recommendation in the procurement BOM with approval_required:true (see docs/standards/RUNNER_TARGETS.md).
    must_not_do: [authenticate-live-paid-services, spend-credits, recommend-new-spend-without-bom-and-human-approval]
    blocking_rule: connector-failure-hard-breaks-loop-no-failsoft

  - id: implementation
    title: Implementation reviewer
    skills: [language-idioms, test-design, edge-case-reasoning]
    allowed_tools: [repo-read, test-runner, local-cli]
    scope: [changed-source-and-tests]
    must_check:
      - Logic correct; edge cases handled; behavior preserved when required.
      - Targeted tests exist or are run; npm test semantics respected.
    must_not_do: [demand-out-of-scope-refactors]
    blocking_rule: real-defect / failing-targeted-test

  - id: compliance
    title: Compliance reviewer
    skills: [audit-trail-literacy, licensing, data-handling-policy]
    allowed_tools: [repo-read, audit-logs-read]
    scope: [audit-logging, credential-handling, license-policy-files]
    must_check:
      - Auditability preserved (audit-log workflows still record transitions).
      - No license/compliance regression; no PII/secret handling violation.
    must_not_do: [approve-waivers]
    blocking_rule: audit-trail-or-compliance-regression

  - id: syntax_final_gate
    title: Syntax / Final Gate reviewer
    runs_last: true
    inherits_checklist: docs/CHECKLISTS/PRIMARY_CODER_CODE_REVIEW_CHECKLIST.md
    skills: [multi-language-linters, parsers, test-runner-literacy, diff-inventory]
    allowed_tools: [repo-read, local-cli-validators, "node --check", "python3 py_compile", "bash -n", markdownlint, "yaml.safe_load"]
    scope: [diff-wide]
    must_check:
      - syntax-checks (node --check, py_compile, bash -n) on changed sources.
      - yaml-validation on changed/added yml/yaml.
      - markdown-lint on changed Markdown (CI scope).
      - json-validation on changed/added json.
      - unit-smoke-tests (npm test or targeted) green, or docs-only recorded.
      - workflow-validation (GH_REPO, token-with-fallback, narrow permissions).
      - no-eval-or-user-input-shell-interpolation.
      - changed-file-inventory emitted.
      - no-delete-scan (blocking authority defers to no_delete_goals).
      - goals-preserved-scan (blocking authority defers to no_delete_goals).
      - dry-run-external-action-scan (no live paid API / secret change / irreversible action).
    must_not_do: [fix-the-code, weaken-or-stub-a-gate, run-live-paid-services]
    blocking_rule: failing-syntax-yaml-json-parse / failing-changed-markdown-lint / failing-unit-smoke-test / unrunnable-workflow / eval-or-interpolation

# PR-type -> additionally required reviewers (always-on set required on every type).
always_on: [security, no_delete_goals, compliance, syntax_final_gate]
required_by_pr_type:
  workflow_ci: [workflow]
  regulated_insurance_domain: [compliance, product_process]
  engine_spine: [implementation, workflow, product_process]
  app_deploy: [implementation, connector, security]
  docs_only: [docs_contracts]
  integration_connector: [connector, security]

# Path glob -> mechanical persona selection.
routing_by_path:
  ".github/workflows/**": [workflow]
  "scripts/**": [implementation]
  "**/*.js": [implementation]
  "**/*.ts": [implementation]
  "**/*.md": [docs_contracts]
  "integration-or-connector-code": [connector]
  "product-copy-or-standards-or-pr-scope": [product_process]

merge_recommendations:
  approve: No blocking finding open; Final Gate passed. Eligible to merge (subject to CircleCI/wr-lint).
  request_changes: One or more blocking findings open. A single blocking-authority persona can set this.
  needs_discussion: Personas conflict or an advisory has merge-relevant ambiguity. Hold for human owner.

# Read-only connector review uses; missing access becomes a bom line, never a failure.
connectors:
  github: { use: "inspect PR/checks/labels/runs", bom: "GitHub token repo:read/actions:read" }
  vercel: { use: "read deploy/build status, env var names", bom: "Vercel read token + project ID" }
  supabase: { use: "read schema/migration/RLS presence", bom: "Supabase service read key" }
  firebase: { use: "read rules/config presence", bom: "Firebase viewer credentials" }
  openrouter: { use: "verify model routing/fallback config", bom: "Funded OpenRouter account + OPENROUTER_API_KEY (read)" }
  zapier: { use: "read Zap definitions", bom: "Zapier read API key" }
  make: { use: "read scenario blueprints", bom: "Make API token (read)" }
  n8n: { use: "read workflow JSON", bom: "n8n API key + instance URL" }
  gumloop: { use: "read flow definitions", bom: "Gumloop API key" }
  browser_automation: { use: "render/check deployed page (read-only)", bom: "Headless browser (Playwright) in review env" }
  local_cli: { use: "run repo tests/linters/validators", bom: "none — always available" }

# Canned/external review apps AUGMENT personas; they never replace them. Nothing
# here is installed, funded, or authenticated by this config — adoption is a
# separate human-approved procurement step (see Section 7.3 of the standard).
external_apps_catalog:
  policy: augment-not-replace
  canned_apps:
    - { name: CodeQL, purpose: deep-sast, feeds: security, approval: repo-owner }
    - { name: Semgrep, purpose: rule-based-sast, feeds: security, approval: repo-owner }
    - { name: Trivy, purpose: dependency-cve-scan, feeds: [security, compliance], approval: lead }
    - { name: GitGuardian, purpose: secret-detection, feeds: security, approval: repo-owner }
    - { name: Vercel Agent Review, purpose: deploy-aware-ai-review, feeds: implementation, approval: repo-owner }
    - { name: Octopus, purpose: ai-pr-review, feeds: implementation, approval: repo-owner }
    - { name: Cubic, purpose: ai-pr-review, feeds: implementation, approval: repo-owner }
    - { name: BITO, purpose: ai-pr-review, feeds: implementation, approval: repo-owner }
    - { name: RecurseML, purpose: ml-regression-review, feeds: implementation, approval: repo-owner }
    - { name: Coderabbit, purpose: ai-pr-review, feeds: implementation, approval: repo-owner }

# PR-prep agents (see Section 11 of the standard). These get a PR READY to be
# judged (clear checks, fix merge posture) BEFORE the reviewer personas judge it.
# Revvel owns the PR-prep contract; a RUNNER executes a role. Jules is one possible
# runner, NOT the standard itself. NON-EXECUTABLE DATA — wires nothing.
pr_prep_agents:
  contract_owner: revvel
  runner_options: [jules, claude-code, copilot, github-actions, local-cli]
  run_mode: parallel              # A and B run concurrently; disjoint write surfaces.
  aggregate: strictest            # hold dominates ready/merge.
  additive_only: true             # no deletes, no goal changes, no paid/irreversible actions.

  # Output schema emitted by each PR-prep agent (see Section 11.3).
  output_schema:
    agent: string                 # pr-prep-ci-checks | pr-prep-merge-readiness
    pr: number
    findings: array               # Section 4 finding objects
    checks_run: array             # {name, result: pass|fixed|failing|skipped, evidence}
    files_changed: array
    external_blockers: array      # {check, reason, bom} — never PR defects
    safe_to_merge: boolean
    recommended_action: string    # A: hold|ready ; B: merge|close|split|hold
    follow_up_prs: array

  agents:
    - id: pr_prep_ci_checks
      title: PR Prep Agent A — CI / Checks Prep
      role: get-automated-checks-green-or-accounted-for
      runs_before: review-fleet
      allowed_tools: [repo-write-on-pr-branch, local-cli-validators, "node --check", "python3 py_compile", "bash -n", markdownlint, "yaml.safe_load", github-read-checks, github-rerun-safe-checks]
      must_check:
        - Validate workflow YAML + repo gotchas (GH_REPO/--repo, token-with-fallback, narrow permissions).
        - Run targeted tests and repo gate semantics (npm test, changed-Markdown markdownlint-cli2).
        - Fix in-scope mechanical failures additively on the PR branch.
        - Detect external/token failures and classify as external_blockers, not PR defects.
        - Re-run only safe (idempotent, read-only, no-spend, no-mutation) checks.
        - Produce check-status summary (pass/fixed/still-failing/external-blocker).
      must_not_do: [weaken-or-stub-a-gate, delete-code-to-silence-failure, change-goal-values, wire-paid-services, rerun-unsafe-mutating-checks, expand-scope]
      recommended_action_values: [ready, hold]
      blocking_rule: hold-while-real-in-scope-check-red; external_blockers-are-bom-not-blocking

    - id: pr_prep_merge_readiness
      title: PR Prep Agent B — Merge-Readiness Prep
      role: get-pr-metadata-and-merge-posture-ready
      runs_before: review-fleet
      allowed_tools: [repo-read, git-history-read, github-read-pr-scope-labels-reviews-mergeability, github-propose-metadata-edits]
      must_check:
        - Scope/title/body describe the change; not unrequested creep (AGENT_SCAFFOLDING_BAN).
        - No-delete / no-goal-change cross-check (RVS-PRESERVE-001, RVS-AGENT-001; blocking authority stays with no_delete_goals).
        - Conflict/superseded status (mergeable; not superseded by/superseding a sibling PR).
        - PR checklist present and satisfied (draft, linked WR/issue, validation evidence).
        - Required labels applied; required reviewers/personas for PR type requested.
        - Emit merge recommendation: merge|close|split|hold.
      must_not_do: [merge-on-own-authority, close-on-own-authority, delete-content, edit-code, change-goals]
      recommended_action_values: [merge, close, split, hold]
      blocking_rule: hold-or-request-changes-while-no-delete/goal-change/conflict/missing-required-review-open

  # When a PR is blocked, run A and B in parallel; on a superseded report, the other
  # agent verifies safe close/merge sequencing before close/merge is recommended.
  superseded_handshake:
    trigger: one-agent-reports-superseded
    verifier: the-other-agent
    verify:
      - superseding-PR-is-merged-or-strictly-ahead
      - no-unique-commits-or-content-lost (prefer archive/cherry-pick over close-with-loss, RVS-PRESERVE-001)
      - closing-this-PR-strands-no-dependent-PR
    settle_only_after_verification: [close, merge]
