# Patch into config/connections.yml — secret NAMES only
connections:
  - name: discord-release-banner
    system: discord
    trigger: release-banner-social workflow
    secret_name: DISCORD_WEBHOOK_URL
    owner: midnghtsapphire
  - name: x-twitter-release-banner
    system: x-twitter
    trigger: release-banner-social workflow
    secret_names:
      - TWITTER_CONSUMER_API_KEY
      - TWITTER_CONSUMER_API_SECRET
      - TWITTER_ACCESS_TOKEN
      - TWITTER_ACCESS_TOKEN_SECRET
    owner: midnghtsapphire
  - name: openrouter-image-lsi
    system: openrouter
    trigger: image-seo-pipeline
    secret_name: OPENROUTER_API_KEY
    owner: midnghtsapphire
  - name: gumloop-image-gen
    system: gumloop
    trigger: heavy image generation
    secret_name: GUMLOOP_API_KEY
    owner: midnghtsapphire
