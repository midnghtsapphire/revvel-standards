# Canonical Label Allowlist — midnghtsapphire/revvel-standards
# Compact form for pack land; full colors/descriptions in follow-up if desired.
# Enforcement: scripts/label-allowlist-check.mjs + .github/workflows/label-allowlist.yml

version: 1
updated: 2026-08-08
owner: midnghtsapphire
max_labels_total: 80
policy:
  prefer_over_labels:
    - GitHub Projects custom fields
    - GitHub Actions workflows + check runs
    - n8n / Make / Zapier / Gumloop automations
  never_create:
    - one-off agent names as labels
    - free-text priority without priority:pN
    - deployment-down:* per-host labels

labels:
  - name: bug
  - name: enhancement
  - name: documentation
  - name: security
  - name: dependencies
  - name: wr
  - name: research
  - name: automation
  - name: infrastructure
  - name: design
  - name: content
  - name: revenue
  - name: "priority:p0"
  - name: "priority:p1"
  - name: "priority:p2"
  - name: "priority:p3"
  - name: triage
  - name: needs-human
  - name: human-review-required
  - name: human-approved
  - name: blocked
  - name: draft
  - name: wontfix
  - name: duplicate
  - name: invalid
  - name: in-review
  - name: awaiting-approval
  - name: approved
  - name: changes-requested
  - name: auto-merge
  - name: stacker
  - name: "stacker:stacked"
  - name: "won't-merge"
  - name: checks-passing
  - name: checks-failing
  # Merge-routing labels the fleet applies in practice. These were reachable
  # only through `aliases` (status:ready-to-merge -> ready-to-merge,
  # conflicts:needs-human -> has-conflicts), but an alias whose target is not
  # itself allowlisted still resolves to a rejected label — so the strict
  # checker failed on a bare `ready-to-merge` even though automation sets it.
  - name: ready-to-merge
  - name: has-conflicts
  - name: "review:stuck"
  - name: credentials-missing
  - name: credentials-ready
  - name: ready-to-implement
  - name: secrets-missing
  - name: needs-gatekeeper
  - name: "wr:research"
  - name: "wr:code"
  - name: "wr:docs"
  - name: "wr:test"
  - name: "wr:security"
  - name: "wr:in-progress"
  - name: "wr:reset"
  - name: "formal:pass"
  - name: "formal:fail"
  - name: "formal:reaudit"
  - name: "formal:auto-wr"
  - name: auto-fix
  - name: ralph-loop
  - name: auto-error
  - name: goap-escalation
  - name: openrouter
  - name: copilot
  - name: codex
  - name: "role:orchestrator"
  - name: "role:fixer"
  - name: needs-decision
  - name: "privilege:intern"
  - name: "privilege:associate"
  - name: "privilege:senior"
  - name: "privilege:principal"
  - name: "privilege:emergency"
  - name: "area:api"
  - name: "area:ui"
  - name: "area:automation"
  - name: oaudrey
  - name: noimosai
  - name: bnat
  - name: deep-research
  - name: work-request

  # The issue lifecycle triad (#17737). These take the last three slots under
  # `max_labels_total`, deliberately:
  #
  #   - bootstrap-pr-labels.yml CREATES them, with colours and descriptions, so
  #     they are real labels rather than fleet ephemera.
  #   - Nothing canonical means "this issue is done" or "this issue went stale".
  #     Every other entry in the 19 aliased onto something that already existed;
  #     these three had nowhere to go.
  #   - issue-lifecycle.yml and wr-pr-creation.yml both read `issue:done`, so it
  #     is load-bearing, not decorative.
  #
  # The caveat that blocked this in #17737 — "issue:done is not currently
  # trustworthy as a completion signal" — was fixed in #17791: the label is now
  # only applied to an issue that actually closed, and a stale one on an open
  # issue is repaired rather than obeyed.
  #
  # The budget is now spent (80/80). The next addition must alias, use a prefix
  # rule, become a Project field, or make the case for raising the cap in
  # writing. tests/labels-allowlist-budget.test.js holds that line.
  - name: "issue:done"
  - name: "issue:in-progress"
  - name: "issue:stale"

aliases:
  "priority-p0": "priority:p0"
  "priority-p1": "priority:p1"
  "priority-p2": "priority:p2"
  "priority-p3": "priority:p3"
  "priority:high": "priority:p1"
  "good first issue": "enhancement"
  "good-first-issue": "enhancement"
  "help wanted": "needs-human"
  "feature": "enhancement"
  "@copilot": "copilot"
  "New Project": "enhancement"
  "wontfix": "wontfix"
  "won't-merge": "won't-merge"
  "awaiting-review": "in-review"
  "waiting-for-review": "awaiting-approval"
  "review-started": "in-review"
  "review-fix:in-progress": "wr:code"
  "review-fix:complete": "checks-passing"
  "review-fix:failed": "needs-human"
  "content:draft": "content"
  "content:final": "content"
  "content-automation": "automation"
  "deployment-down:soul2bowl-vercel": "auto-error"
  "deployment-down:soul2bowl-prod": "auto-error"
  "deployment-down:oaudrey": "auto-error"
  "deploy-failure": "auto-error"
  "sla:breached": "priority:p0"
  "sla:warning": "priority:p1"
  "triage:new": "triage"
  "weekly-research": "research"
  "dependabot": "dependencies"
  "conflicts:needs-human": "has-conflicts"
  "recovery:stale-wr": "wr:reset"
  "recovery:gave-up": "needs-human"
  "bito-ai": "automation"
  "mindmappr": "automation"
  # wr-pr-creation.yml copies these from the WR issue onto every WR PR, where
  # pr-governance-checks.yml runs the strict checker over the PR's labels. They
  # were never allowlisted, so every WR PR failed that gate on arrival. The
  # open-ended `research:*` lanes are handled by a prefix rule in
  # scripts/label-allowlist-check.mjs; these two are flat names, so they alias.
  "jules": "automation"
  "research-engine": "research"

  # #17737 — the remaining fleet labels, aliased rather than promoted so the
  # budget is not spent on them. `output-type:*` is handled by a prefix rule in
  # scripts/label-allowlist-check.mjs, the same way `deliver:*` is: both are
  # derived from the WR's Output Type field, so the family is open-ended.
  "lifecycle:stuck": "review:stuck"
  "wr-stuck": "review:stuck"
  "self-heal": "auto-fix"
  "self-healing": "auto-fix"
  "auto:default-fallback": "auto-fix"
  "security-fleet": "security"
  "needs-action": "needs-human"
  "biome": "automation"
  "wr:new": "triage"
  "wr:jules": "automation"
  "wr:research-complete": "research"
  # Both remain candidates for GitHub Projects fields per this file's own
  # `prefer_over_labels` policy — they are metrics, not states. Aliased for now
  # so the checker passes; promoting either to a Project field is a one-line
  # deletion here.
  "scorecard": "automation"
  "dod-gap": "needs-human"

  # Three more that #17737's list of 19 did not contain. That list was a
  # snapshot; these were live on open issues when the strict checker was run
  # over the actual label set instead. `swe-fix` and `fix-me` are the agent
  # triggers in openrouter-auto-route.yml's routing table, so they are
  # load-bearing, not ephemera.
  "swe-fix": "auto-fix"
  "fix-me": "auto-fix"
  "chore": "enhancement"

  "status:checks-failing": "checks-failing"
  "status:checks-passing": "checks-passing"
  "status:checks-pending": "in-review"
  "status:ready-to-merge": "ready-to-merge"
  "formal:structural_conflict": "formal:fail"
  "formal:duplicate_risk": "formal:fail"
  "formal:needs_reaudit": "formal:reaudit"
  "needs_reaudit": "formal:reaudit"

  "status:waiting-for-review": "awaiting-approval"

  "status:awaiting-review": "awaiting-approval"

  "status:ready-for-review": "in-review"

  "status:in-review": "in-review"

  "status:approved": "approved"

  "status:changes-requested": "changes-requested"

  "status:draft": "draft"

  "status:blocked": "blocked"

  "status:merged": "checks-passing"

  "status:open": "in-review"

  "status:closed": "wontfix"

legacy_policy: comment_and_map
