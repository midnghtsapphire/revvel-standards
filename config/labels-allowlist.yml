# Canonical Label Allowlist — midnghtsapphire/revvel-standards
# Compact form for pack land; full colors/descriptions in follow-up if desired.
# Enforcement: scripts/label-allowlist-check.mjs + .github/workflows/label-allowlist.yml

version: 1
updated: 2026-08-05
owner: midnghtsapphire
max_labels_total: 80
policy:
  prefer_over_labels:
    - GitHub Projects custom fields
    - GitHub Actions workflows + check runs
    - n8n / Make / Zapier / Gumloop automations
  never_create:
    - one-off agent names as labels
    - free-text priority without priority:pN
    - deployment-down:* per-host labels

