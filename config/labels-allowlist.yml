# Canonical Label Allowlist — midnghtsapphire/revvel-standards
# Compact form for pack land; full colors/descriptions in follow-up if desired.
# Enforcement: scripts/label-allowlist-check.mjs + .github/workflows/label-allowlist.yml

version: 1
updated: 2026-08-08
owner: midnghtsapphire
max_labels_total: 80
policy:
  prefer_over_labels:
    - GitHub Projects custom fields
    - GitHub Actions workflows + check runs
    - n8n / Make / Zapier / Gumloop automations
  never_create:
    - one-off agent names as labels
    - free-text priority without priority:pN
    - deployment-down:* per-host labels

labels:
  - name: bug
  - name: enhancement
  - name: documentation
  - name: security
  - name: dependencies
  - name: wr
  - name: research
  - name: automation
  - name: infrastructure
  - name: design
  - name: content
  - name: revenue
  - name: "priority:p0"
  - name: "priority:p1"
  - name: "priority:p2"
  - name: "priority:p3"
  - name: triage
  - name: needs-human
  - name: human-review-required
  - name: human-approved
  - name: blocked
  - name: draft
  - name: wontfix
  - name: duplicate
  - name: invalid
  - name: in-review
  - name: awaiting-approval
  - name: approved
  - name: changes-requested
  - name: auto-merge
  - name: "won't-merge"
  - name: checks-passing
  - name: checks-failing
  # Canonical lifecycle state applied by pr-check-status / pr-lifecycle /
  # pr-state-orchestrator / stuck-label-watchdog when a PR is green and
  # approved. Was applied by those workflows but missing here, so every
  # green PR failed the Governance gate on its own success label (PR #17091).
  - name: ready-to-merge
  # Conflict lifecycle label: applied by recovery-engine / stuck-pr-sweep when
  # mergeable_state is dirty, consumed by conflict-helper (fires on the label).
  # Was applied by those workflows but missing here, so any PR that ever hit a
  # conflict failed the Governance gate on its own recovery label (PR #17097).
  - name: has-conflicts
  # Reviewer-bot escape hatch: jules-pr-reviewer.yml declares
  # `bypass_label: jules-override` so a human can clear a false-positive
  # blocking verdict, but the label was never allowlisted — using the
  # documented bypass would itself turn the Governance gate red (PR #17097).
  - name: jules-override
  # Stuck-reviewer annotation applied by recovery-engine.yml when reviewers
  # have been pending for >4h. Was applied by that workflow but missing here,
  # so any PR the recovery engine tagged failed the Governance gate on its
  # own annotation label (owner audit 2026-08-09). Same class of bug as
  # `ready-to-merge` (fixed PR #17091) and `has-conflicts` (fixed PR #17097):
  # a workflow applies a label, the allowlist doesn't know it, gate fails.
  - name: "review:stuck"
  - name: credentials-missing
  - name: credentials-ready
  - name: ready-to-implement
  - name: secrets-missing
  - name: needs-gatekeeper
  - name: "wr:research"
  - name: "wr:code"
  - name: "wr:docs"
  - name: "wr:test"
  - name: "wr:security"
  - name: "wr:in-progress"
  - name: "wr:reset"
  - name: "formal:pass"
  - name: "formal:fail"
  - name: "formal:reaudit"
  - name: "formal:auto-wr"
  - name: auto-fix
  - name: ralph-loop
  - name: auto-error
  - name: goap-escalation
  - name: openrouter
  - name: copilot
  - name: codex
  - name: "role:orchestrator"
  - name: "role:fixer"
  # Ceremonial override role — grants any agent the authority to file a
  # WR for a bug it discovered but did not introduce, without violating
  # its task-scope guardrails. See standards/TRIAGE_ROLE_STANDARD.md.
  # Codifies the pattern that "out of scope" is not a valid reason to
  # ignore a bug; instead file a Triage-role WR and keep working.
  - name: "role:triage"
  - name: needs-decision
  - name: "privilege:intern"
  - name: "privilege:associate"
  - name: "privilege:senior"
  - name: "privilege:principal"
  - name: "privilege:emergency"
  - name: "area:api"
  - name: "area:ui"
  - name: "area:automation"
  - name: oaudrey
  - name: noimosai
  - name: bnat
  - name: deep-research
  - name: work-request

