[project]
name = "claude-notebook-mcp"
version = "1.0.0"
description = "MCP server for notebook cell runtime inside Claude (WR #17733)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
claude-notebook-mcp = "claude_notebook_mcp.server:main"

[project.urls]
Homepage = "https://github.com/midnghtsapphire/revvel-standards/tree/main/mcp-servers/claude-notebook-mcp"
Source = "https://github.com/jacob-bd/gemini-notebook-mcp-cli"
Issues = "https://github.com/midnghtsapphire/revvel-standards/issues/17733"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_notebook_mcp"]
