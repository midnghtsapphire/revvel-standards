[project]
name = "meilisearch-mcp"
version = "1.0.0"
description = "MCP server for MeiliSearch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "meilisearch>=0.31.0",
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
meilisearch-mcp = "meilisearch_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"