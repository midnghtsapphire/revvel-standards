[project]
name = "wr-control-plane"
version = "0.1.0"
description = "WR / PR control-plane MCP server for revvel-standards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
wr-control-plane = "wr_control_plane.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
