# Kinetic Events / Conflict Trigger Patterns
# Domain: Military operations, combat, conflict zones

keywords:
  - combat
  - firefight
  - battle
  - casualties
  - airstrike
  - bombardment
  - military operation
  - offensive
  - invasion
  - escalation
  - missile strike
  - artillery
  - drone strike
  - ceasefire violation

regex:
  - name: CASUALTY_COUNT
    pattern: (\d+)\s*(killed|dead|casualties|wounded|injured|KIA)
    score: 60
    description: Casualty numbers
  
  - name: MILITARY_UNIT
    pattern: (\d+(?:st|nd|rd|th))\s+(Brigade|Battalion|Regiment|Division|Corps)
    score: 40
    description: Military unit designation

thresholds:
  - field: fatalities
    threshold: 10
    score: 60
    scale: true
    description: Number of fatalities

geographic_hotspots:
  - name: Ukraine
    multiplier: 1.3
  - name: Gaza
    multiplier: 1.3
  - name: Syria
    multiplier: 1.2
  - name: Yemen
    multiplier: 1.2

severity_multipliers:
  chemical_weapons: 1.8
  nuclear_threat: 1.8
  civilian_massacre: 1.5
  escalation: 1.3
