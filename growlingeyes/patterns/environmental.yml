# Environmental & Natural Disaster Trigger Patterns
# Domain: Earthquakes, hurricanes, wildfires, floods, extreme weather

keywords:
  - earthquake
  - hurricane
  - typhoon
  - cyclone
  - tornado
  - wildfire
  - flood
  - tsunami
  - volcanic eruption
  - extreme heat
  - blizzard
  - drought

regex:
  - name: MAGNITUDE
    pattern: (\d+\.\d+)[Mm]\s*(magnitude|earthquake)
    score: 50
    description: Earthquake magnitude
  
  - name: HURRICANE_CATEGORY
    pattern: Category\s*([1-5])\s*(hurricane|cyclone)
    score: 60
    description: Hurricane category

thresholds:
  - field: mag
    threshold: 5.5
    score: 50
    scale: true
    description: Earthquake magnitude
  
  - field: category
    threshold: 3
    score: 70
    scale: true
    description: Hurricane category
  
  - field: temperature
    threshold: 45
    score: 65
    description: Extreme temperature (Celsius)

severity_map:
  earthquake:
    7.0: 95
    6.0: 75
    5.5: 50
  
  hurricane:
    5: 95
    4: 85
    3: 70

alert_levels:
  red: 95
  orange: 75
  yellow: 50
  green: 20
