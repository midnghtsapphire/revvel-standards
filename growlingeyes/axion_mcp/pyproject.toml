[project]
name = "axion-planetary-mcp"
version = "1.0.0"
description = "Axion Planetary MCP — SAR-to-optical foundation model server for GrowlingEyes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0",
    "numpy>=1.26.4",
    "Pillow>=10.4.0",
    "scipy>=1.13.0",
    "rasterio>=1.3.11",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.18.0",      # CPU inference
    "onnxruntime-gpu>=1.18.0",  # GPU inference (optional)
]

[project.scripts]
axion-planetary-mcp = "axion_mcp.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
