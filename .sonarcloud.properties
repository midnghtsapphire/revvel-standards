# SonarCloud Automatic Analysis settings (this project has no CI-based Sonar scan).
# artifacts/revvel-finishers/ is an intentional mirror of products/merge-prosecutor/
# and related files. Counting it as new code makes every PR that touches the mirror
# fail the duplication gate (see WR #18281, PR #18361). Files are excluded from analysis
# only; nothing is deleted or changed.
sonar.exclusions=artifacts/revvel-finishers/**
sonar.cpd.exclusions=artifacts/revvel-finishers/**
