# Qlty CLI configuration (free, local mode: no Qlty Cloud account, no token).
# Created for the advisory Semgrep CE + Qlty CircleCI jobs. See
# WR #18490.
#
# The CircleCI job `qlty-advisory` runs `qlty check --upstream <base>` so only
# files changed in the PR are checked, and it never fails the build (advisory)
# until Audrey says to gate. Generated by `qlty init`, then trimmed to a small
# plugin set so the job stays fast; add plugins with `qlty plugins enable`.
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Mirrors and imports are analysis-only exclusions; nothing is deleted.
  "artifacts/revvel-finishers/**",
  "imports/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# Small, fast plugin set. Semgrep CE already covers security patterns in its own
# job, so Qlty here covers shell, Python, Docker and workflow-file hygiene.
[[plugin]]
name = "shellcheck"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "actionlint"

[[plugin]]
name = "hadolint"
