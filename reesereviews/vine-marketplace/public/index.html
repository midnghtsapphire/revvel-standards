<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vine → Marketplace Dashboard | Reese Reviews</title>
  <style>
    /* Revvel Standards — Glassmorphism Dark UI */
    :root {
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --accent: #7c6af7;
      --accent-light: #a89cff;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --mist: rgba(255,255,255,0.55);
      --white: #f8f8ff;
      --radius: 14px;
      --blur: blur(16px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }
    /* Background gradient */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124,106,247,.18) 0%, transparent 70%),
                  radial-gradient(ellipse 60% 50% at 80% 80%, rgba(34,197,94,.1) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 24px 20px; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent-light); }
    .header-badge { background: rgba(124,106,247,.2); border: 1px solid rgba(124,106,247,.35); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: var(--accent-light); }

    /* Stats row */
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .stat-card {
      background: var(--surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
      transition: background .15s;
    }
    .stat-card:hover { background: var(--surface-hover); }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mist); margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-value.green { color: var(--success); }
    .stat-value.amber { color: var(--warn); }
    .stat-value.purple { color: var(--accent-light); }

    /* Toolbar */
    .toolbar {
      background: var(--surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
      margin-bottom: 20px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mist); }
    input[type="date"], select {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--white);
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="date"]:focus, select:focus { border-color: var(--accent); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .5; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      border: none; border-radius: 9px; padding: 9px 18px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warn { background: var(--warn); color: #000; }
    .btn-ghost { background: rgba(255,255,255,.07); color: var(--white); border: 1px solid var(--border); }
    .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 7px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* Products table */
    .card {
      background: var(--surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .card-title { font-weight: 600; font-size: 15px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--mist); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-hover); }
    .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; background: rgba(255,255,255,.07); }
    .thumb-placeholder { width: 44px; height: 44px; border-radius: 8px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }

    /* Badges */
    .badge { display: inline-block; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 600; }
    .badge-vine { background: rgba(168,156,255,.2); color: var(--accent-light); border: 1px solid rgba(168,156,255,.3); }
    .badge-listed { background: rgba(34,197,94,.15); color: var(--success); border: 1px solid rgba(34,197,94,.25); }
    .badge-sold { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid rgba(245,158,11,.25); }
    .badge-new { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid rgba(239,68,68,.25); }
    .badge-stale { background: rgba(239,68,68,.15); color: #f97316; border: 1px solid rgba(249,115,22,.3); }

    /* Checkbox */
    .cb-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

    /* Row actions */
    .row-actions { display: flex; gap: 6px; align-items: center; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(30,30,40,.95); border: 1px solid var(--border);
      backdrop-filter: var(--blur);
      border-radius: 12px; padding: 12px 20px;
      font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      z-index: 999; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* Loading overlay */
    .loading { opacity: .5; pointer-events: none; }

    /* Log pane */
    #log-pane {
      background: rgba(0,0,0,.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      color: var(--mist);
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 20px;
      display: none;
    }
    #log-pane.visible { display: block; }
    .log-line { padding: 1px 0; line-height: 1.6; }
    .log-ok { color: var(--success); }
    .log-err { color: var(--danger); }
    .log-info { color: var(--accent-light); }

    /* Empty state */
    .empty { text-align: center; padding: 48px 20px; color: var(--mist); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Vine → <span>Marketplace</span></div>
    <div class="header-badge" id="status-badge">Loading…</div>
  </header>

  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat-card"><div class="stat-label">Total Products</div><div class="stat-value purple" id="s-total">—</div></div>
    <div class="stat-card"><div class="stat-label">Pending List</div><div class="stat-value amber" id="s-pending">—</div></div>
    <div class="stat-card"><div class="stat-label">Active Listings</div><div class="stat-value" id="s-listed">—</div></div>
    <div class="stat-card"><div class="stat-label">Sold</div><div class="stat-value green" id="s-sold">—</div></div>
    <div class="stat-card"><div class="stat-label">Stale (Repost)</div><div class="stat-value amber" id="s-stale">—</div></div>
    <div class="stat-card"><div class="stat-label">Vine Items</div><div class="stat-value purple" id="s-vine">—</div></div>
    <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value green" id="s-revenue">—</div></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="field">
      <label>From</label>
      <input type="date" id="date-since">
    </div>
    <div class="field">
      <label>To</label>
      <input type="date" id="date-before">
    </div>
    <div class="field">
      <label>Status</label>
      <select id="filter-status">
        <option value="">All</option>
        <option value="unlisted">Unlisted</option>
        <option value="listed">Listed (Active)</option>
        <option value="sold">Sold</option>
        <option value="stale">Stale (Needs Repost)</option>
      </select>
    </div>
    <button class="btn btn-ghost" onclick="loadProducts()">🔍 Filter</button>
    <div style="flex:1"></div>
    <button class="btn btn-ghost" onclick="fetchEmails()" id="btn-fetch">📬 Fetch Emails</button>
    <button class="btn btn-warn" onclick="repostStale()" id="btn-repost">🔄 Repost Stale</button>
    <button class="btn btn-primary" onclick="postSelected()" id="btn-post">🚀 Post to Marketplace</button>
  </div>

  <!-- Log pane -->
  <div id="log-pane"></div>

  <!-- Products table -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Products</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <label class="cb-wrap" style="font-size:12px;color:var(--mist);">
          <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)"> Select all
        </label>
        <span id="selected-count" style="font-size:12px;color:var(--mist);"></span>
      </div>
    </div>
    <div class="table-wrap">
      <table id="products-table">
        <thead>
          <tr>
            <th></th>
            <th>Image</th>
            <th>Product</th>
            <th>Type</th>
            <th>Cost Basis</th>
            <th>List Price</th>
            <th>Status</th>
            <th>Received</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="products-body">
          <tr><td colspan="9"><div class="empty"><div class="empty-icon">⏳</div>Loading products…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '/api';
let allProducts = [];
let selectedOrders = new Set();

// ── Utilities ──────────────────────────────────────────────────────────────

function toast(msg, duration = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function log(msg, cls = '') {
  const pane = document.getElementById('log-pane');
  pane.classList.add('visible');
  const line = document.createElement('div');
  line.className = 'log-line ' + cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  pane.appendChild(line);
  pane.scrollTop = pane.scrollHeight;
}

function fmtUSD(n) {
  if (n == null) return '—';
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
}

function statusBadge(p) {
  if (p.sold) return '<span class="badge badge-sold">Sold</span>';
  if (p.listed && (p.repostCount > 0 || isStale(p))) return '<span class="badge badge-stale">Stale</span>';
  if (p.listed) return '<span class="badge badge-listed">Listed</span>';
  return '<span class="badge badge-new">Unlisted</span>';
}

function isStale(p) {
  if (!p.listed || p.sold) return false;
  const stale = parseInt(window.REPOST_STALE_DAYS || 7);
  const cutoff = Date.now() - stale * 86400000;
  const last = p.lastRepostAt || p.listedAt;
  return !last || new Date(last).getTime() < cutoff;
}

function pricePreview(p) {
  const isVine = p.isVine;
  const basis = isVine ? (p.vineTaxValue || p.paidPrice || 0) : (p.paidPrice || 0);
  const listing = Math.max(basis * 0.8, 1);
  return listing.toFixed(2);
}

// ── Data loading ──────────────────────────────────────────────────────────

async function loadSummary() {
  try {
    const r = await fetch(`${API}/summary`);
    const s = await r.json();
    document.getElementById('s-total').textContent = s.totalProducts;
    document.getElementById('s-pending').textContent = s.pendingListing;
    document.getElementById('s-listed').textContent = s.totalListed;
    document.getElementById('s-sold').textContent = s.totalSold;
    document.getElementById('s-stale').textContent = s.staleListings;
    document.getElementById('s-vine').textContent = s.totalVine;
    document.getElementById('s-revenue').textContent = fmtUSD(s.totalRevenue);
    document.getElementById('status-badge').textContent = '● Live';
    document.getElementById('status-badge').style.color = 'var(--success)';
  } catch (e) {
    document.getElementById('status-badge').textContent = '● Offline';
    document.getElementById('status-badge').style.color = 'var(--danger)';
  }
}

async function loadProducts() {
  const since = document.getElementById('date-since').value;
  const before = document.getElementById('date-before').value;
  const status = document.getElementById('filter-status').value;

  let url = `${API}/products?`;
  if (since) url += `since=${since}&`;
  if (before) url += `before=${before}&`;
  if (status) url += `status=${status}&`;

  try {
    const r = await fetch(url);
    const data = await r.json();
    allProducts = data.products;
    renderTable(allProducts);
    selectedOrders.clear();
    updateSelectedCount();
  } catch (e) {
    toast('Failed to load products: ' + e.message);
  }
}

function renderTable(products) {
  const tbody = document.getElementById('products-body');
  if (!products.length) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty"><div class="empty-icon">📭</div>No products found</div></td></tr>';
    return;
  }

  tbody.innerHTML = products.map((p) => {
    const listPrice = p.listingPrice ?? pricePreview(p);
    const basis = p.isVine ? (p.vineTaxValue || p.paidPrice) : p.paidPrice;
    const imgCell = p.imageUrl
      ? `<img class="thumb" src="${escHtml(p.imageUrl)}" alt="" loading="lazy">`
      : `<div class="thumb-placeholder">📦</div>`;
    const vineTag = p.isVine ? '<span class="badge badge-vine">Vine</span> ' : '';
    const checked = selectedOrders.has(p.orderId) ? 'checked' : '';
    const disableSelect = p.sold || p.listed ? 'disabled' : '';

    return `<tr>
      <td><input type="checkbox" ${checked} ${disableSelect} onchange="toggleSelect('${escHtml(p.orderId)}', this.checked)"></td>
      <td>${imgCell}</td>
      <td style="max-width:280px;word-break:break-word;">${vineTag}${escHtml(p.productTitle)}<br><small style="color:var(--mist)">${escHtml(p.orderId)}</small></td>
      <td>${p.isVine ? '<span class="badge badge-vine">Vine</span>' : 'Paid'}</td>
      <td>${fmtUSD(basis)}</td>
      <td>${fmtUSD(parseFloat(listPrice))}</td>
      <td>${statusBadge(p)}</td>
      <td>${fmtDate(p.receivedAt)}</td>
      <td>
        <div class="row-actions">
          ${!p.listed && !p.sold ? `<button class="btn btn-primary btn-sm" onclick="postOne('${escHtml(p.orderId)}')">Post</button>` : ''}
          ${p.listed && !p.sold ? `<button class="btn btn-warn btn-sm" onclick="repostOne('${escHtml(p.orderId)}')">Repost</button>` : ''}
          ${p.listed && !p.sold ? `<button class="btn btn-success btn-sm" onclick="markSold('${escHtml(p.orderId)}')">Sold ✓</button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Actions ────────────────────────────────────────────────────────────────

async function fetchEmails() {
  const btn = document.getElementById('btn-fetch');
  btn.disabled = true;
  log('Fetching Amazon emails…', 'log-info');
  try {
    const since = document.getElementById('date-since').value;
    const before = document.getElementById('date-before').value;
    const r = await fetch(`${API}/fetch`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ since: since || null, before: before || null }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    log(`✅ Ingested ${data.ingested} new products`, 'log-ok');
    toast(`Fetched ${data.ingested} new products`);
    await loadSummary();
    await loadProducts();
  } catch (e) {
    log('❌ ' + e.message, 'log-err');
    toast('Fetch failed: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function postSelected() {
  const selected = [...selectedOrders];
  if (selected.length === 0) {
    toast('Select products to post, or use "Post All Unlisted"');
    return;
  }
  const btn = document.getElementById('btn-post');
  btn.disabled = true;
  log(`Posting ${selected.length} products…`, 'log-info');
  try {
    const r = await fetch(`${API}/post`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderIds: selected }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const ok = data.results.filter((x) => x.status === 'listed').length;
    const err = data.results.filter((x) => x.status === 'error').length;
    data.results.forEach((r) => {
      if (r.status === 'listed') log(`✅ Listed: ${r.orderId}`, 'log-ok');
      else if (r.status === 'error') log(`❌ Error: ${r.orderId} — ${r.error}`, 'log-err');
    });
    toast(`Posted ${ok}${err > 0 ? `, ${err} failed` : ''}`);
    selectedOrders.clear();
    await loadSummary();
    await loadProducts();
  } catch (e) {
    log('❌ ' + e.message, 'log-err');
    toast('Post failed: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function postOne(orderId) {
  log(`Posting ${orderId}…`, 'log-info');
  try {
    const r = await fetch(`${API}/post`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderIds: [orderId] }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const res = data.results[0];
    if (res.status === 'listed') {
      log(`✅ Listed: ${orderId}`, 'log-ok');
      toast('Posted to Marketplace!');
    } else {
      throw new Error(res.error || res.status);
    }
    await loadSummary();
    await loadProducts();
  } catch (e) {
    log('❌ ' + e.message, 'log-err');
    toast('Error: ' + e.message);
  }
}

async function repostOne(orderId) {
  log(`Reposting ${orderId}…`, 'log-info');
  try {
    const r = await fetch(`${API}/repost`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderIds: [orderId] }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    toast('Reposted!');
    await loadSummary();
    await loadProducts();
  } catch (e) {
    log('❌ ' + e.message, 'log-err');
    toast('Error: ' + e.message);
  }
}

async function repostStale() {
  const btn = document.getElementById('btn-repost');
  btn.disabled = true;
  log('Reposting stale listings…', 'log-info');
  try {
    const r = await fetch(`${API}/repost`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const ok = data.results.filter((x) => x.status === 'reposted').length;
    log(`✅ Reposted ${ok} listings`, 'log-ok');
    toast(`Reposted ${ok} stale listings`);
    await loadSummary();
    await loadProducts();
  } catch (e) {
    log('❌ ' + e.message, 'log-err');
    toast('Repost failed: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function markSold(orderId) {
  const price = prompt('Enter sale price (leave blank to use listing price):');
  if (price === null) return; // cancelled
  try {
    const r = await fetch(`${API}/products/${encodeURIComponent(orderId)}/sold`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ soldPrice: price ? parseFloat(price) : undefined }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    log(`✅ Marked sold: ${orderId}`, 'log-ok');
    toast('Marked as sold!');
    await loadSummary();
    await loadProducts();
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

// ── Selection ─────────────────────────────────────────────────────────────

function toggleSelect(orderId, checked) {
  if (checked) selectedOrders.add(orderId);
  else selectedOrders.delete(orderId);
  updateSelectedCount();
}

function toggleSelectAll(cb) {
  const rows = document.querySelectorAll('#products-body input[type="checkbox"]:not(:disabled)');
  rows.forEach((r) => {
    r.checked = cb.checked;
    const orderId = r.closest('tr').querySelector('small')?.textContent;
    if (orderId) {
      if (cb.checked) selectedOrders.add(orderId);
      else selectedOrders.delete(orderId);
    }
  });
  updateSelectedCount();
}

function updateSelectedCount() {
  const el = document.getElementById('selected-count');
  el.textContent = selectedOrders.size > 0 ? `${selectedOrders.size} selected` : '';
}

// ── Init ──────────────────────────────────────────────────────────────────

(async function init() {
  // Set default date range to last 30 days
  const now = new Date();
  const since = new Date(now);
  since.setDate(since.getDate() - 30);
  document.getElementById('date-since').value = since.toISOString().split('T')[0];
  document.getElementById('date-before').value = now.toISOString().split('T')[0];

  await loadSummary();
  await loadProducts();

  // Auto-refresh summary every 60s
  setInterval(loadSummary, 60000);
})();
</script>
</body>
</html>
