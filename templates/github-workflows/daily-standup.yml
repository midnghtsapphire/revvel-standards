name: Daily Standup

on:
  schedule:
    - cron: '0 14 * * 1-5'  # Weekdays 9 AM UTC
  workflow_dispatch:

jobs:
  standup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get open PRs
        id: prs
        run: |
          echo "::group::Open PRs"
          gh pr list --state open --limit 10 --json number,title,author,url
          echo "::group::"

      - name: Get recent commits
        id: commits
        run: |
          echo "::group::Recent Commits"
          git log --oneline -10
          echo "::group::"

      - name: Get issues
        id: issues
        run: |
          echo "::group::Open Issues"
          gh issue list --state open --limit 5
          echo "::group::"

      - name: Generate standup report
        run: |
          cat << STANDUP > standup.md
          # Daily Standup - $(date +%Y-%m-%d)

          ## Recent Activity
          ### Commits
          $(git log --oneline -5)

          ## Open PRs
          - 

          ## Issues
          - 

          ## Today's Focus
          - [ ] Review open PRs
          - [ ] Check for blockers
          STANDUP

      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"Daily standup ready: https://github.com/$GITHUB_REPOSITORY/blob/main/standup.md\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Upload standup
        uses: actions/upload-artifact@v4
        with:
          name: standup
          path: standup.md
