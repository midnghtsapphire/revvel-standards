# Maestro flow — Auth: Sign In (mandatory journey)
#
# Reference flow for the "Auth: Sign In" mandatory E2E journey defined in
# standards/MOBILE_TESTING.md. Runs identically on iOS simulator and Android
# emulator via `maestro test tests/e2e/maestro/auth/sign-in.yaml`.
#
# Substitutions to make in your app:
#   [BUNDLE_ID]    — your iOS bundle identifier / Android package
#                    (e.g., com.revvel.sessiono)
#   email-input    — replace with your real testID/accessibilityLabel
#   password-input — replace with your real testID/accessibilityLabel
#   sign-in-button — replace with your real testID/accessibilityLabel
#
# Test credentials come from Maestro env vars (passed by the CI workflow):
#   TEST_EMAIL, TEST_PASSWORD
appId: "[BUNDLE_ID]"
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn:
    id: "email-input"
- inputText: "${TEST_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${TEST_PASSWORD}"
- tapOn:
    id: "sign-in-button"
# Wait up to 15s for the post-login screen to render.
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 15000
# Accessibility smoke check — VoiceOver / TalkBack must be able to read
# the welcome heading.
- assertVisible:
    text: "Welcome"
