# Business Central AI Code Reviewer
#
# Marketplace: https://github.com/marketplace/actions/business-central-ai-code-reviewer
# Action repo: https://github.com/ACSG-BizApps/bc-ai-reviewer
#
# BC-specific AL code review action. Collects the PR diff and relevant BC
# artifacts (app.json, permission sets, markdown docs), sends a structured
# prompt to the LLM provider of choice, and posts an inline + summary
# review. Only useful for Business Central AL projects.
#
# Secrets required: OPENROUTER_API_KEY (or AZURE_OPENAI_KEY / OPENAI_API_KEY
# depending on the provider chosen in MODELS_BLOCK).
#
# Copy this file to: .github/workflows/bc-ai-code-reviewer.yml

name: BC AI Code Reviewer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: BC AI code review
    # Only run on PR events, or on `/review` comments on a PR.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    concurrency:
      group: bc-ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping BC AI review."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi

      - name: Checkout
        if: env.OPENROUTER_API_KEY != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run BC AI Code Review
        if: env.OPENROUTER_API_KEY != ''
        uses: ACSG-BizApps/bc-ai-reviewer@main
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MODELS_BLOCK: |
            models:
              - name: OpenRouter — Gemini 2.5 Flash
                provider: openai
                model: google/gemini-2.5-flash
                apiBase: https://openrouter.ai/api/v1
                apiKey: ${{ secrets.OPENROUTER_API_KEY }}
                roles: [chat, edit, apply]
          MAX_COMMENTS: 20
          AUTO_DETECT_APPS: true
          INCLUDE_APP_PERMISSIONS: true
          INCLUDE_APP_MARKDOWN: true
          INCLUDE_PATTERNS: "**/*.al,**/*.json"
