# Mabl AI-Powered Test Automation Workflow
# Triggers on every PR and push to main.
# The Mabl CLI registers a deployment event, which triggers the linked test plan
# in the Mabl cloud. Tests run cross-browser in parallel and results are reported
# back to GitHub Actions. Artifacts (screenshots, HAR) are uploaded on failure.
#
# SETUP:
#   1. Create a Mabl account: https://app.mabl.com
#   2. Create an Application and Environment in the Mabl Dashboard.
#   3. Create a test plan and link it to your Application + Environment.
#   4. Add repository secrets:
#        MABL_API_KEY       — Mabl Dashboard → Settings → API Keys → Create Key
#        MABL_WORKSPACE_ID  — visible in Mabl Dashboard URL: app.mabl.com/workspaces/<ID>
#   5. Set MABL_APP_ID and MABL_ENVIRONMENT_ID in the env block below.
#      Retrieve from Mabl Dashboard URLs for each resource.

name: Mabl — AI-Powered Test Automation

# CONFIGURE: Adjust the app ID and environment ID to match your Mabl workspace.
env:
  MABL_APP_ID: ""          # Set to your Mabl application ID
  MABL_ENVIRONMENT_ID: ""  # Set to your Mabl environment ID (e.g., staging)

on:
  push:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment_id:
        description: "Mabl environment ID to target (overrides MABL_ENVIRONMENT_ID)"
        required: false
      app_url:
        description: "Application URL to register with the deployment event"
        required: false

concurrency:
  group: mabl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mabl-tests:
    name: Mabl E2E & API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write         # Required to post check run results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Mabl CLI
        uses: mablhq/setup-mabl-cli@v1.5
        with:
          workspace-id: ${{ secrets.MABL_WORKSPACE_ID }}
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}

      - name: Verify Mabl CLI installation
        run: |
          echo "======================================================"
          echo "  Mabl CLI — AI-Powered Test Automation"
          echo "======================================================"
          echo ""
          echo "Repository : ${{ github.repository }}"
          echo "Ref        : ${{ github.ref }}"
          echo "SHA        : ${{ github.sha }}"
          echo "Event      : ${{ github.event_name }}"
          echo ""

          # Verify required secrets are set before proceeding.
          if [ -z "${{ secrets.MABL_API_KEY }}" ]; then
            echo "⚠️  MABL_API_KEY secret is not set."
            echo "   Add it under Settings → Secrets and variables → Actions."
            echo "   See: https://help.mabl.com/docs/mabl-cli"
            echo ""
            echo "   Skipping Mabl tests (no credentials)."
            exit 0
          fi

          if [ -z "${{ secrets.MABL_WORKSPACE_ID }}" ]; then
            echo "⚠️  MABL_WORKSPACE_ID secret is not set."
            echo "   Add it under Settings → Secrets and variables → Actions."
            echo "   See: https://help.mabl.com/docs/mabl-cli"
            echo ""
            echo "   Skipping Mabl tests (no workspace)."
            exit 0
          fi

          mabl --version
          echo ""
          echo "✅ Mabl CLI ready."

      - name: Register deployment event and run tests
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
        run: |
          # Resolve environment ID: prefer workflow_dispatch input, fall back to env var.
          ENVIRONMENT_ID="${{ github.event.inputs.environment_id }}"
          if [ -z "$ENVIRONMENT_ID" ]; then
            ENVIRONMENT_ID="${MABL_ENVIRONMENT_ID}"
          fi

          # Resolve app URL: prefer workflow_dispatch input, fall back to empty (Mabl uses configured URL).
          APP_URL="${{ github.event.inputs.app_url }}"

          # Build the deployment create command.
          DEPLOY_CMD="mabl deployments create --app-id ${MABL_APP_ID} --environment-id ${ENVIRONMENT_ID}"
          if [ -n "$APP_URL" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --url ${APP_URL}"
          fi

          echo "Registering Mabl deployment event…"
          echo "  App ID      : ${MABL_APP_ID}"
          echo "  Env ID      : ${ENVIRONMENT_ID}"
          [ -n "$APP_URL" ] && echo "  URL         : ${APP_URL}"
          echo ""

          # Run deployment — this triggers the linked Mabl test plan and waits for results.
          # Exit code reflects test outcome: 0 = all passed, 1 = one or more failures.
          $DEPLOY_CMD

      - name: Export test run artifacts on failure
        if: failure()
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
        run: |
          echo "Tests failed — exporting artifacts…"
          # Fetch the most recent test run for this workspace and export screenshots + HAR.
          LATEST_RUN=$(mabl test-runs list --limit 1 --output json 2>/dev/null | python3 -c "
          import sys, json
          runs = json.load(sys.stdin)
          if runs:
              print(runs[0].get('id', ''))
          " 2>/dev/null || echo "")

          if [ -n "$LATEST_RUN" ]; then
            echo "Exporting artifacts for test run: $LATEST_RUN"
            mabl test-runs export "$LATEST_RUN" -f mabl-artifacts.zip || true
          else
            echo "No test run ID found — skipping artifact export."
          fi

      - name: Upload Mabl artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mabl-artifacts-${{ github.run_id }}
          path: mabl-artifacts.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Mabl summary to step summary
        if: always()
        run: |
          echo "## 🤖 Mabl AI Test Automation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| App ID | \`${MABL_APP_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment ID | \`${MABL_ENVIRONMENT_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_For full test results, visit the [Mabl Dashboard](https://app.mabl.com)._" >> $GITHUB_STEP_SUMMARY
