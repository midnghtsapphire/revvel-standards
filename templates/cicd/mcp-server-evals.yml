# MCP Server Evals
#
# Marketplace: https://github.com/marketplace/actions/mcp-server-evals
# Action repo: https://github.com/mcp-use/eval-action
#
# Runs LLM-as-judge evaluations against any MCP server using cases defined
# in `evals/eval_cases.yaml`. Works with stdio and remote MCP servers; the
# judge + models under test are routed via OpenRouter.
#
# Only applicable to repos that ship an MCP server. See the action README
# for the `eval_cases.yaml` schema.
#
# Secrets required: OPENROUTER_API_KEY
# Copy this file to: .github/workflows/mcp-server-evals.yml

name: MCP Server Evals

on:
  pull_request:
    paths:
      - "evals/**"
      - "src/**"
      - "mcp_server/**"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "src/**"
      - "mcp_server/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mcp-server-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: MCP server evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping MCP evals."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi

      - name: Checkout
        if: env.OPENROUTER_API_KEY != ''
        uses: actions/checkout@v4

      # Repos using Python-based MCP servers typically want these:
      - name: Setup Python
        if: env.OPENROUTER_API_KEY != '' && hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run MCP evals
        if: env.OPENROUTER_API_KEY != '' && hashFiles('evals/eval_cases.yaml') != ''
        id: evals
        uses: mcp-use/eval-action@v1.4
        with:
          # Edit this per-repo; the stub below assumes a Python stdio server.
          server_config: |
            {
              "command": "python",
              "args": ["-m", "mcp_server", "--transport", "stdio"]
            }
          eval_cases: evals/eval_cases.yaml
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Post sticky PR comment with report
        if: >-
          always() &&
          env.OPENROUTER_API_KEY != '' &&
          github.event_name == 'pull_request' &&
          steps.evals.outputs.report_md != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mcp-evals
          path: ${{ steps.evals.outputs.report_md }}

      - name: Append report to run summary
        if: always() && env.OPENROUTER_API_KEY != '' && steps.evals.outputs.report_md != ''
        run: cat "${{ steps.evals.outputs.report_md }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval artifacts
        if: always() && env.OPENROUTER_API_KEY != '' && steps.evals.outputs.results_json != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            ${{ steps.evals.outputs.results_json }}
            ${{ steps.evals.outputs.report_md }}
          retention-days: 30
