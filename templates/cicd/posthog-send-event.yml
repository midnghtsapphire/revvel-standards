name: PostHog Send Event

# Send custom events to PostHog from GitHub Actions (e.g., CI completion, deployment success).
#
# Why: Track CI/CD pipeline events in PostHog to correlate build/deployment activity
# with product metrics. For example, track when CI completes, when deployments succeed,
# or when specific workflows run.
#
# Required secrets:
#   POSTHOG_API_KEY  — PostHog Project API Key (Settings → API Keys → Project API Key)
#
# Optional repo variables (Settings → Variables → Actions):
#   POSTHOG_ENABLED  — "true" (default) or "false" to disable without removing
#
# See: skills/posthog/SKILL.md, templates/standards/posthog-events.md

on:
  workflow_call:
    inputs:
      event_name:
        description: "Event name to send to PostHog (snake_case)"
        type: string
        required: true
      properties:
        description: "JSON string of event properties"
        type: string
        required: false
        default: "{}"
    secrets:
      POSTHOG_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      event_name:
        description: "Event name to send to PostHog (snake_case)"
        type: string
        required: true
        default: "ci_completed"
      properties:
        description: "JSON string of event properties (e.g., {\"status\":\"success\"})"
        type: string
        required: false
        default: "{}"

permissions:
  contents: read

jobs:
  send-event:
    name: Send event to PostHog
    runs-on: ubuntu-latest
    steps:
      - name: Verify configuration
        id: verify
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED }}
        run: |
          enabled="${POSTHOG_ENABLED:-true}"
          if [ "${enabled}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::POSTHOG_ENABLED=${enabled} — skipping event."
            exit 0
          fi
          if [ -z "${POSTHOG_API_KEY}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::POSTHOG_API_KEY is not set. Skipping. See skills/posthog/SKILL.md."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build event payload
        if: steps.verify.outputs.skip != 'true'
        id: payload
        uses: actions/github-script@v8
        env:
          EVENT_NAME: ${{ inputs.event_name }}
          PROPERTIES_JSON: ${{ inputs.properties }}
        with:
          script: |
            const eventName = process.env.EVENT_NAME || 'ci_completed';
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            
            // Parse custom properties (if valid JSON)
            let customProps = {};
            try {
              customProps = JSON.parse(process.env.PROPERTIES_JSON || '{}');
            } catch (err) {
              core.warning(`Failed to parse properties JSON: ${err.message}`);
            }

            // Merge with default GitHub context properties
            const properties = {
              ...customProps,
              repo,
              workflow: context.workflow,
              run_id: context.runId,
              run_number: context.runNumber,
              github_event: context.eventName,
              ref: context.ref || null,
              sha: context.sha || null,
              actor: context.actor || null,
            };

            core.setOutput('event_name', eventName);
            core.setOutput('properties_json', JSON.stringify(properties));
            core.summary
              .addHeading('PostHog event')
              .addRaw(`Event name: \`${eventName}\``).addBreak()
              .addRaw(`Repo: \`${repo}\``).addBreak()
              .addCodeBlock(JSON.stringify({ event: eventName, properties }, null, 2), 'json');
            await core.summary.write();

      - name: Send event to PostHog
        if: steps.verify.outputs.skip != 'true'
        uses: daun/posthog-event-action@v1
        with:
          api-key: ${{ secrets.POSTHOG_API_KEY }}
          event: ${{ steps.payload.outputs.event_name }}
          properties: ${{ steps.payload.outputs.properties_json }}
          # Optional: for EU cloud, uncomment:
          # host: https://eu.posthog.com
          # Optional: for self-hosted, set your host:
          # host: https://posthog.your-domain.com

      - name: Summary
        if: steps.verify.outputs.skip != 'true'
        run: |
          echo "✅ Sent event to PostHog:"
          echo "   Event: ${{ steps.payload.outputs.event_name }}"
          echo "   Properties: ${{ steps.payload.outputs.properties_json }}"
