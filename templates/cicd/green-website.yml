# Copy to .github/workflows/green-website.yml in every public web app repo.
# Add <!-- CARBON-STATS --> to README.md where the generated card should appear.

name: Website green-o-meter

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - app/**
      - pages/**
      - src/**
      - public/**
      - .github/workflows/green-website.yml
  schedule:
    - cron: 17 9 * * 1
  workflow_dispatch:
    inputs:
      url:
        description: URL to measure. Defaults to vars.GREEN_WEBSITE_URL or GitHub Pages.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: green-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  green-website:
    name: Report website carbon data
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'docs: update green website report')
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve target URL
        id: target
        env:
          DISPATCH_URL: ${{ github.event.inputs.url || '' }}
          CONFIGURED_URL: ${{ vars.GREEN_WEBSITE_URL || '' }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_URL}" ]; then
            url="${DISPATCH_URL}"
          elif [ -n "${CONFIGURED_URL}" ]; then
            url="${CONFIGURED_URL}"
          else
            url="${GITHUB_PAGES_URL}"
          fi
          if ! printf '%s' "${url}" | grep -Eq '^https?://'; then
            echo "::error::Green website URL must start with http:// or https://"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Verify README carbon marker
        run: |
          set -euo pipefail
          if ! grep -Eq '<!-- CARBON-STATS -->|!\[carbon consumption of this project\]\(https://green-action\.vercel\.app/api/card\?p=' README.md; then
            echo "::error::README.md must contain <!-- CARBON-STATS --> or the generated green-action card."
            exit 1
          fi

      - name: green-website
        uses: filiptronicek/green-action@v1.0.2
        env:
          URL: ${{ steps.target.outputs.url }}

      - name: Commit green website report
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md carbon
          if git diff --cached --quiet; then
            echo "No green website report changes to commit."
            exit 0
          fi
          git commit -m "docs: update green website report"
          git pull --rebase origin main
          git push origin HEAD:main
    timeout-minutes: 15

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
