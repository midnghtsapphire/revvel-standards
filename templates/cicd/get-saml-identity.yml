# Copy to .github/workflows/get-saml-identity.yml in your app repo
#
# Resolves a GitHub username to its SAML/SSO corporate email identity.
# Useful for PR author notifications, SSO enforcement checks, and audit logging.
#
# Required secret: ORG_ADMIN_TOKEN
#   A GitHub PAT or App installation token with `admin:org` scope.
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#
# See SSO_SAML_STANDARD.md for full context and Clerk/app-level SSO setup.

name: Resolve SAML Identity

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  resolve-saml-identity:
    name: Resolve PR Author SAML Identity
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # Queries GitHub's GraphQL SAML mapping directly. This replaces
      # gagoar/get-saml-identity-action@0.9.0, whose only tag never shipped its
      # dist/ bundle and therefore failed every run with
      # "File not found: .../dist/index.js".
      - name: Get SAML identity for PR author
        id: saml
        uses: actions/github-script@v8
        env:
          TARGET_USERNAME: ${{ github.actor }}
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const username = process.env.TARGET_USERNAME;
            const result = await github.graphql(
              `query($org: String!, $login: String!) {
                organization(login: $org) {
                  samlIdentityProvider {
                    externalIdentities(first: 1, login: $login) {
                      nodes { samlIdentity { nameId } }
                    }
                  }
                }
              }`,
              { org: context.repo.owner, login: username }
            );
            const provider = result.organization && result.organization.samlIdentityProvider;
            const node = provider && provider.externalIdentities.nodes[0];
            const identity = (node && node.samlIdentity && node.samlIdentity.nameId) || '';
            core.setOutput('identity', identity);

      - name: Fail if no SSO identity found
        if: ${{ steps.saml.outputs.identity == '' }}
        run: |
          echo "::error::No SAML/SSO identity found for GitHub user '${{ github.actor }}'."
          echo "::error::Ensure the user has authenticated via SSO in the '${{ github.repository_owner }}' organization."
          exit 1

      - name: Log resolved identity
        env:
          IDENTITY: ${{ steps.saml.outputs.identity }}
        run: |
          echo "GitHub user : ${{ github.actor }}"
          echo "SSO email   : ${IDENTITY}"

      - name: Comment identity on PR
        uses: actions/github-script@v8
        env:
          TARGET_USERNAME: ${{ github.actor }}
          IDENTITY: ${{ steps.saml.outputs.identity }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔐 **SAML Identity Verified**\n\n| Field | Value |\n|---|---|\n| GitHub user | \`${process.env.TARGET_USERNAME}\` |\n| SSO email | \`${process.env.IDENTITY}\` |`
            })
