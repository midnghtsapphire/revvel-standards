# AI Code Reviewer Pro
#
# Marketplace: https://github.com/marketplace/actions/ai-code-reviewer-pro
# Action repo: https://github.com/VIVAAN-DHAWAN/ai-code-reviewer
#
# Automatically reviews pull requests using an LLM (OpenAI, Anthropic,
# OpenRouter, or Ollama) and posts targeted INLINE comments on changed
# lines plus a summary report. Configured here to use OpenRouter.
#
# Add `[skip-review]` to the PR title to bypass.
#
# Secrets required: OPENROUTER_API_KEY
# Copy this file to: .github/workflows/ai-code-reviewer-pro.yml

name: AI Code Reviewer Pro

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-code-reviewer-pro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI code review (OpenRouter)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.title, '[skip-review]'))
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping AI Code Reviewer Pro."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi

      - name: Checkout
        if: env.OPENROUTER_API_KEY != ''
        uses: actions/checkout@v4

      - name: AI Code Reviewer Pro
        if: env.OPENROUTER_API_KEY != ''
        uses: VIVAAN-DHAWAN/ai-code-reviewer@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_provider: openrouter
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Best-value default from the action's README; override as needed.
          model: google/gemini-2.5-flash
          review_level: full
          max_files: 10
