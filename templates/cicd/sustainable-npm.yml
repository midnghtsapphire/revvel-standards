# sustainable-npm
#
# Marketplace: https://github.com/marketplace/actions/sustainable-npm
# Action repo: https://github.com/lowlydba/sustainable-npm
#
# Sets npm defaults that reduce unnecessary network requests and log noise,
# while keeping `ignore-scripts` disabled here so the template is safer to drop
# into existing projects that rely on install hooks.
#
# Secrets required: none
# Copy this file to: .github/workflows/sustainable-npm.yml

name: Sustainable npm CI

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "**/package-lock.json"
      - ".npmrc"
      - "**/.npmrc"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "**/package-lock.json"
      - ".npmrc"
      - "**/.npmrc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sustainable-npm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-ci:
    name: Install with sustainable npm defaults
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply sustainable npm defaults
        uses: lowlydba/sustainable-npm@v3.0.0
        with:
          audit: "false"
          fund: "false"
          progress: "false"
          update-notifier: "false"
          prefer-offline: "true"
          loglevel: "warn"
          ignore-scripts: "false"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json found. Replace this example step with your package-manager install command."
          fi

      - name: Run tests if present
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "::warning::No package.json found. Replace this example step with your project validation commands."
          fi
