# Eco CI Energy Estimation
#
# Marketplace: https://github.com/marketplace/actions/eco-ci-energy-estimation
# Action repo: https://github.com/green-coding-solutions/eco-ci-energy-estimation
#
# Estimates the energy used by Linux GitHub-hosted runners while your CI job
# executes. This template wraps a simple Node.js example workload; replace the
# example install/test commands with your real build or test steps as needed.
#
# Secrets required: none by default
# Optional secrets: GMT_API_TOKEN, CO2_GRID_INTENSITY_API_TOKEN
# Copy this file to: .github/workflows/eco-ci-energy-estimation.yml

name: Eco CI Energy Estimation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eco-ci-energy-estimation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  estimate:
    name: Estimate CI energy use
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start Eco CI measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: start-measurement
          branch: ${{ github.head_ref || github.ref_name }}
          send-data: true
          gmt-api-token: ${{ secrets.GMT_API_TOKEN }}
          co2-grid-intensity-api-token: ${{ secrets.CO2_GRID_INTENSITY_API_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Measure checkout step
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: checkout

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json found. Replace this example step with your real workload."
          fi

      - name: Measure install step
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: install

      - name: Run tests if present
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "::warning::No package.json found. Replace this example step with your real workload."
          fi

      - name: Measure test step
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: test

      - name: Display energy results
        if: always()
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: display-results
          pr-comment: true
          json-output: true

      - name: Upload Eco CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-ci-data
          path: /tmp/eco-ci
          if-no-files-found: ignore
          retention-days: 14
