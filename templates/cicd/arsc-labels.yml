# Copy to .github/workflows/arsc-labels.yml in your app repo.
# No additional secrets required — works out of the box with GITHUB_TOKEN.
#
# What this workflow does:
#   1. MANUAL (workflow_dispatch): Operator can add, remove, set, or clear
#      labels on any open issue or PR by supplying the object number,
#      operation, and optional label list.
#   2. AUTO-LABEL NEW ISSUES: When an issue is opened without labels it
#      receives the `triage` label so it appears in the project Backlog.
#   3. AUTO-LABEL DRAFT PRs: Draft pull requests receive the `draft` label
#      automatically so the project board can filter them.
#   4. AUTO-CLEAR DRAFT LABEL: When a draft PR is marked Ready for Review
#      the `draft` label is removed.
#
# Setup:
#   cp templates/cicd/arsc-labels.yml .github/workflows/arsc-labels.yml
#
# Local github-script implementation replaced `wagner-cotta/arsc-label@v1.0`
# in WR #14884 after the third-party action audit flagged it as stale.

name: ARSC Labels

on:
  # ── Manual trigger ─────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      object-id:
        description: "Issue or Pull Request number"
        required: true
        type: string
      operation:
        description: "Label operation to perform"
        required: true
        type: choice
        options:
          - add
          - remove
          - set
          - clear
      labels:
        description: "Comma-separated label names (not required for 'clear')"
        required: false
        type: string

  # ── Event-driven triggers ───────────────────────────────────────────────────
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Manual label management via workflow_dispatch
  # ────────────────────────────────────────────────────────────────────────────
  manual-label:
    name: Manual Label Operation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Manage Labels (ARSC)
        id: manage-labels
        uses: actions/github-script@v9.0.0
        env:
          OBJECT_ID: ${{ github.event.inputs['object-id'] }}
          OPERATION: ${{ github.event.inputs.operation }}
          LABELS: ${{ github.event.inputs.labels || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.OBJECT_ID);
            const operation = process.env.OPERATION;
            const labels = (process.env.LABELS || '')
              .split(',')
              .map((label) => label.trim())
              .filter(Boolean);

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              throw new Error(`Invalid object-id: ${process.env.OBJECT_ID}`);
            }

            let response;
            switch (operation) {
              case 'add':
                if (labels.length === 0) throw new Error('labels input is required for add');
                response = await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/labels', {
                  owner,
                  repo,
                  issue_number,
                  labels,
                });
                break;
              case 'remove': {
                if (labels.length === 0) throw new Error('labels input is required for remove');
                const removed = [];
                const missing = [];
                for (const name of labels) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                    removed.push(name);
                  } catch (error) {
                    if (error.status === 404) {
                      missing.push(name);
                      continue;
                    }
                    throw error;
                  }
                }
                response = { data: { removed, missing } };
                break;
              }
              case 'set':
                if (labels.length === 0) throw new Error('labels input is required for set');
                response = await github.request('PUT /repos/{owner}/{repo}/issues/{issue_number}/labels', {
                  owner,
                  repo,
                  issue_number,
                  labels,
                });
                break;
              case 'clear':
                response = await github.request('DELETE /repos/{owner}/{repo}/issues/{issue_number}/labels', {
                  owner,
                  repo,
                  issue_number,
                });
                break;
              default:
                throw new Error(`Unsupported operation: ${operation}`);
            }

            core.setOutput('response', JSON.stringify(response.data ?? { status: response.status }));

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Auto-label new issues with `triage`
  # ────────────────────────────────────────────────────────────────────────────
  triage-new-issue:
    name: Apply Triage Label to New Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'

    steps:
      - name: Ensure `triage` label exists
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'triage',
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'triage',
                  color: 'e4e669',
                  description: 'Needs triage — newly opened issue awaiting classification',
                });
                core.info('Created label: triage');
              }
            }

      - name: Add `triage` label to new issue
        if: toJSON(github.event.issue.labels) == '[]'
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['triage'],
            });

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3 — Auto-label draft PRs and remove `draft` on promotion
  # ────────────────────────────────────────────────────────────────────────────
  draft-pr-label:
    name: Manage Draft Label on Pull Requests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Ensure `draft` label exists
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'draft',
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'draft',
                  color: 'cccccc',
                  description: 'Pull request is still a draft',
                });
                core.info('Created label: draft');
              }
            }

      - name: Add `draft` label when PR is opened as draft
        if: github.event.action == 'opened' && github.event.pull_request.draft == true
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['draft'],
            });

      - name: Remove `draft` label when PR is marked Ready for Review
        if: github.event.action == 'ready_for_review'
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'draft',
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info('`draft` label already absent');
            }
