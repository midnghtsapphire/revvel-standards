# Copy to .github/workflows/vault-provisioning.yml
# Replace OWNER_USERNAME with your GitHub username
# Required secrets: VAULT_ADDR, VAULT_ROLE_ID, VAULT_SECRET_ID

name: Vault Agent — Credential Provisioning

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name (kebab-case, e.g. mind-mappr)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - staging
          - dev
      services:
        description: "Comma-separated services to provision (e.g. openai,stripe,database)"
        required: true
        type: string
      action:
        description: "Action to perform"
        required: true
        default: "provision"
        type: choice
        options:
          - provision
          - rotate
          - check
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      environment:
        required: true
        type: string
        default: "prod"
      services:
        required: true
        type: string
      action:
        required: false
        type: string
        default: "provision"

jobs:
  vault-agent:
    name: "Vault Agent — ${{ inputs.action }} [${{ inputs.app_name }}/${{ inputs.environment }}]"
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      secrets: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vault CLI
        run: |
          VAULT_VERSION="1.17.0"
          curl -fsSL "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" -o vault.zip
          unzip vault.zip -d /usr/local/bin
          rm vault.zip
          vault version

      - name: Authenticate to Vault (AppRole)
        id: vault-auth
        run: |
          export VAULT_ADDR="${{ secrets.VAULT_ADDR }}"
          VAULT_TOKEN=$(vault write -field=token auth/approle/login \
            role_id="${{ secrets.VAULT_ROLE_ID }}" \
            secret_id="${{ secrets.VAULT_SECRET_ID }}")
          echo "VAULT_TOKEN=$VAULT_TOKEN" >> "$GITHUB_ENV"
          echo "VAULT_ADDR=${{ secrets.VAULT_ADDR }}" >> "$GITHUB_ENV"
          echo "vault-authenticated=true" >> "$GITHUB_OUTPUT"
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}

      - name: Parse services list
        id: parse-services
        run: |
          SERVICES="${{ inputs.services }}"
          echo "services_array=${SERVICES}" >> "$GITHUB_OUTPUT"
          echo "Services to process: $SERVICES"

      - name: Check credential status (all services)
        id: check-status
        run: |
          APP="${{ inputs.app_name }}"
          ENV="${{ inputs.environment }}"
          SERVICES="${{ inputs.services }}"
          MISSING_SERVICES=""
          EXPIRING_SERVICES=""
          NOW_TS=$(date +%s)
          WARN_THRESHOLD=$((7 * 24 * 3600))  # 7 days in seconds

          IFS=',' read -ra SERVICE_LIST <<< "$SERVICES"
          for SERVICE in "${SERVICE_LIST[@]}"; do
            SERVICE=$(echo "$SERVICE" | tr -d ' ')
            VAULT_PATH="revvel/apps/${APP}/${ENV}/${SERVICE}"
            echo "Checking: $VAULT_PATH"

            if vault kv get "$VAULT_PATH" > /dev/null 2>&1; then
              ROTATION_DUE=$(vault kv get -field=rotation_due "$VAULT_PATH" 2>/dev/null || echo "")
              if [ -n "$ROTATION_DUE" ]; then
                ROTATION_TS=$(date -d "$ROTATION_DUE" +%s 2>/dev/null || echo "0")
                DAYS_LEFT=$(( (ROTATION_TS - NOW_TS) / 86400 ))
                if [ "$DAYS_LEFT" -le 7 ] && [ "$DAYS_LEFT" -ge 0 ]; then
                  echo "⚠️  $SERVICE: expires in $DAYS_LEFT days (rotation_due: $ROTATION_DUE)"
                  EXPIRING_SERVICES="$EXPIRING_SERVICES,$SERVICE"
                elif [ "$DAYS_LEFT" -lt 0 ]; then
                  echo "🔴 $SERVICE: EXPIRED ($ROTATION_DUE)"
                  MISSING_SERVICES="$MISSING_SERVICES,$SERVICE"
                else
                  echo "✅ $SERVICE: valid (rotation_due: $ROTATION_DUE, days left: $DAYS_LEFT)"
                fi
              else
                echo "✅ $SERVICE: exists (no rotation_due metadata)"
              fi
            else
              echo "❌ $SERVICE: NOT FOUND in vault"
              MISSING_SERVICES="$MISSING_SERVICES,$SERVICE"
            fi
          done

          MISSING_SERVICES="${MISSING_SERVICES#,}"
          EXPIRING_SERVICES="${EXPIRING_SERVICES#,}"
          echo "missing_services=${MISSING_SERVICES}" >> "$GITHUB_OUTPUT"
          echo "expiring_services=${EXPIRING_SERVICES}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Missing: ${MISSING_SERVICES:-none}"
          echo "Expiring: ${EXPIRING_SERVICES:-none}"
        env:
          VAULT_ADDR: ${{ env.VAULT_ADDR }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: Log provisioning attempt to DARE Log
        if: steps.check-status.outputs.missing_services != '' || inputs.action == 'rotate'
        run: |
          APP="${{ inputs.app_name }}"
          ENV="${{ inputs.environment }}"
          MISSING="${{ steps.check-status.outputs.missing_services }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "---" >> DARE_LOG.md || true
          echo "## Vault Agent Provisioning — $DATE" >> DARE_LOG.md || true
          echo "- **App:** $APP | **Env:** $ENV" >> DARE_LOG.md || true
          echo "- **Action:** ${{ inputs.action }}" >> DARE_LOG.md || true
          echo "- **Services (missing):** ${MISSING:-none}" >> DARE_LOG.md || true
          echo "- **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> DARE_LOG.md || true
          echo "⚠️  Credentials requiring provisioning logged. Vault paths stored — NO secret values in this log."

      - name: Create GitHub issue for missing credentials (Ralph Loop trigger)
        if: steps.check-status.outputs.missing_services != ''
        id: create-issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const app = '${{ inputs.app_name }}';
            const env = '${{ inputs.environment }}';
            const missing = '${{ steps.check-status.outputs.missing_services }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString();

            // Ensure labels exist
            const labels = [
              { name: 'auto-fix', color: '0075ca', description: 'Created by auto-fix workflow' },
              { name: 'copilot', color: '7057ff', description: 'Assigned to Copilot for fixing' },
              { name: 'vault-agent', color: 'e4e669', description: 'Vault Agent provisioning required' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ...label,
                  });
                }
              }
            }

            const missingList = missing.split(',').map(s => `- \`revvel/apps/${app}/${env}/${s.trim()}\``).join('\n');

            const body = [
              '## Vault Agent — Credential Provisioning Required',
              '',
              `**App:** \`${app}\` | **Environment:** \`${env}\``,
              `**Timestamp:** ${timestamp}`,
              `**Provisioning Run:** [View logs](${runUrl})`,
              '',
              '---',
              '',
              '## Missing or Expired Credentials',
              '',
              missingList,
              '',
              '---',
              '',
              '## Instructions for @copilot',
              '',
              '1. For each missing vault path above:',
              '   - Identify the service and the credential type needed',
              '   - Log in to the service dashboard (credentials in `docs/droplet_access.md` or ask Audrey)',
              '   - Create a new API key / token with **minimum required permissions**',
              '   - Name it: `revvel-' + app + '-' + env + '-' + timestamp.slice(0, 10) + '`',  // .slice(0,10) extracts YYYY-MM-DD date from ISO timestamp
              '2. Store in vault:',
              '   ```bash',
              '   vault kv put <vault-path> <key>="<value>" \\',
              '     created_at="' + timestamp + '" \\',
              '     created_by="vault-agent" \\',
              '     rotation_due="$(date -u -d \'+90 days\' +%Y-%m-%dT%H:%M:%SZ)"',
              '   ```',
              '3. Push to GitHub Actions Secrets (if needed by CI):',
              '   ```bash',
              '   gh secret set {SECRET_NAME} --body "<value>" --repo ${{ github.repository }}',
              '   ```',
              '4. Add variable name (NOT value) to `.env.example`',
              '5. Open a PR referencing this issue',
              '',
              'Do NOT close this issue manually. It auto-closes when the fix PR is merged.',
              '',
              '---',
              '_Created automatically by `vault-provisioning.yml` (Vault Agent)._',
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Vault Agent] Missing credentials: ${missing} — ${app}/${env}`,
              body,
              labels: ['auto-fix', 'copilot', 'vault-agent'],
              assignees: [context.repo.owner],
            });

            core.setOutput('issue_number', issue.data.number);
            core.setOutput('issue_url', issue.data.html_url);
            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);

      - name: Summarize results
        if: always()
        run: |
          APP="${{ inputs.app_name }}"
          ENV="${{ inputs.environment }}"
          MISSING="${{ steps.check-status.outputs.missing_services }}"
          EXPIRING="${{ steps.check-status.outputs.expiring_services }}"
          ISSUE="${{ steps.create-issue.outputs.issue_number }}"

          echo ""
          echo "## Vault Agent Provisioning Summary"
          echo "App: $APP | Env: $ENV | Action: ${{ inputs.action }}"
          echo ""
          if [ -z "$MISSING" ] && [ -z "$EXPIRING" ]; then
            echo "✅ All credentials are valid. No action required."
          else
            [ -n "$MISSING" ] && echo "❌ Missing/expired: $MISSING"
            [ -n "$EXPIRING" ] && echo "⚠️  Expiring soon: $EXPIRING"
            [ -n "$ISSUE" ] && echo "📋 Ralph Loop triggered — GitHub Issue #$ISSUE created for @copilot"
          fi
          echo ""
          echo "Agent terminated."
