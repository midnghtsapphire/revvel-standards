# Copy to .github/workflows/run-human-testing-api.yml in your app repo.
#
# Revvel Human Testing API — App Repo Template
#
# Triggers 5 parallel S.H.I.F.T. AI test agents against your deployed app
# and synthesizes their findings into a structured human behavioral test
# report. The report is committed to the repository and optionally surfaced
# as a GitHub Issue for team review.
#
# SETUP:
#   1. Add GitHub Secret: OPENROUTER_API_KEY
#      (Settings → Secrets and variables → Actions → New repository secret)
#   2. Set the LIVE_URL variable below to your production URL.
#   3. Optionally add GitHub App secrets: APP_ID, APP_PRIVATE_KEY
#      (see GITHUB_APP_INTEGRATION_STANDARD.md in revvel-standards)
#   4. Add the run-human-testing-api.js script to your repo:
#      curl -sL https://raw.githubusercontent.com/midnghtsapphire/revvel-standards/main/scripts/run-human-testing-api.js > scripts/run-human-testing-api.js
#
# See: https://github.com/midnghtsapphire/revvel-standards/blob/main/TESTING_STANDARD.md

name: Human Testing API

# CONFIGURE: Change APP_NAME and default target_url to match your application
env:
  APP_NAME: "[APP_NAME]"

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to test"
        required: true
        default: "https://YOUR_APP_DOMAIN.com"
        # CONFIGURE: Change default to your production URL
        type: string
      app_name:
        description: "Human-readable application name"
        required: true
        default: "[APP_NAME]"
        # CONFIGURE: Change default to your app name
        type: string
      output_file:
        description: "Output file path for the test report"
        required: true
        default: "docs/human-test-report.md"
        type: string
      test_scenarios:
        description: "Scenarios to test (comma-separated, or 'all')"
        required: false
        default: "all"
        type: string
      create_issue:
        description: "Create a GitHub Issue summarizing findings?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: human-testing-api-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  human-testing:
    name: Run Human Testing API
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Human Testing API script
        run: |
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/midnghtsapphire/revvel-standards/main/scripts/run-human-testing-api.js \
            -o scripts/run-human-testing-api.js
        # CONFIGURE: If you have already copied the script into your repo, remove this step.

      - name: Run Human Testing API
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_URL: ${{ inputs.target_url }}
          APP_NAME: ${{ inputs.app_name }}
          OUTPUT_FILE: ${{ inputs.output_file }}
          TEST_SCENARIOS: ${{ inputs.test_scenarios }}
        run: node scripts/run-human-testing-api.js

      - name: Commit test report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "revvel-automation[bot]"
          git config user.email "revvel-automation[bot]@users.noreply.github.com"
          git add "${{ inputs.output_file }}"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "test: add human testing report for ${{ inputs.app_name }}"
            git push
            echo "Test report committed and pushed."
          fi

      - name: Create summary issue
        if: ${{ inputs.create_issue == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Human Testing Complete: ${{ inputs.app_name }}" \
            --label "testing" \
            --body "## Human Testing API Report

          The Revvel Human Testing API has completed a S.H.I.F.T. behavioral evaluation of:

          **Application:** ${{ inputs.app_name }}
          **Target URL:** ${{ inputs.target_url }}
          **Scenarios Tested:** ${{ inputs.test_scenarios }}

          **Test report:** [\`${{ inputs.output_file }}\`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/${{ inputs.output_file }})

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---

          Review the test report for:
          - **Critical Blockers** (P0) — must fix before production
          - **S.H.I.F.T. Compliance** — behavioral validation findings
          - **Accessibility** — neuro-inclusive design issues
          - **Performance Budget** — Lighthouse threshold compliance

          Create follow-up issues for each P0 blocker identified."
