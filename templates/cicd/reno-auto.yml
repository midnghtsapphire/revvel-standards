# Reno Auto — AI-generated release notes for pull requests
#
# Action repo: https://github.com/vblagoje/reno-auto
#
# Automatically generates reno-style release notes when a new PR is opened.
# Uses the secure pull_request_target approach so forks can safely open PRs
# without exposing secrets. The generated note is posted as a PR comment for
# the author to review and commit.
#
# Required secret: OPENAI_API_KEY
#   → GitHub → Settings → Secrets and variables → Actions → New repository secret
#   → Obtain your key at: https://platform.openai.com/api-keys
#
# Copy this file to: .github/workflows/reno-auto.yml

name: Reno Auto Release Notes

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  release-note:
    name: Generate reno release note
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Verify OPENAI_API_KEY is configured
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY is not set — skipping reno-auto. Add it under Settings → Secrets → Actions."
          else
            echo "OPENAI_API_KEY is configured."
          fi

      - name: Generate Release Note for this PR
        if: env.OPENAI_API_KEY != ''
        uses: vblagoje/reno-auto@v1
        id: reno-auto-step
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

      - name: Post release note as PR comment
        if: env.OPENAI_API_KEY != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 📝 Reno Release Note

            We use [Reno release notes](https://docs.openstack.org/reno/latest/) to describe code changes. Follow these steps:

            1. Install reno via `pip install reno` (only once per virtual environment)
            2. Run this command from the project root:
            ```
            reno new ${{ steps.reno-auto-step.outputs.file-name }}
            ```
            3. Paste the following release note text into the generated file in `releasenotes/notes`:
            ```
            ${{ steps.reno-auto-step.outputs.note }}
            ```
            4. Review the note, adjust if needed, save, commit, and push.
