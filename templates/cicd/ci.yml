# Copy to .github/workflows/ci.yml in your app repo
# Replace APP_NAME, adjust test commands if needed

name: CI

# CONFIGURE: Change APP_NAME to your application name
env:
  APP_NAME: "[APP_NAME]"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: TypeScript + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check
        # CONFIGURE: Change 'pnpm check' if your project uses a different command
        # e.g., 'pnpm tsc --noEmit' or 'pnpm typecheck'

      - name: Run unit tests
        run: pnpm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test
        # CONFIGURE: Change 'pnpm test' if your project uses a different command
        # e.g., 'pnpm vitest run' or 'pnpm test:unit'

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: typecheck-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # CONFIGURE: Add any build-time env vars your app needs
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test
          # CONFIGURE: Add runtime env vars your E2E tests need
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # BASE_URL: http://localhost:3000
        # CONFIGURE: Change 'pnpm test:e2e' if your project uses a different command
        # e.g., 'pnpm playwright test' or 'npx playwright test'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
