# ============================================================
# REVVEL STANDARD CI/CD PIPELINE — GitHub Actions
# ============================================================
# MANDATORY for every Revvel/MIDNGHTSAPPHIRE app deployed to
# a DigitalOcean Droplet via PM2 + Nginx.
#
# HOW TO USE:
#   1. Copy this file to your repo at:
#        .github/workflows/deploy.yml
#   2. Replace ALL occurrences of:
#        YOUR_APP_NAME    → your PM2 process name (e.g., growlingeyes)
#        YOUR_DROPLET_IP  → your droplet's IP address
#        YOUR_APP_DIR     → your app's directory on the droplet
#   3. Add SSH_PRIVATE_KEY to your repo's GitHub Actions secrets:
#        GitHub → Repo → Settings → Secrets → Actions → New secret
#        Name: SSH_PRIVATE_KEY
#        Value: contents of your deploy private key
#   4. Commit and push — every push to main auto-deploys.
# ============================================================

name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "YOUR_APP_NAME"
  DROPLET_IP: "YOUR_DROPLET_IP"
  APP_DIR: "/var/www/YOUR_APP_DIR"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with corepack
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Upload build to droplet via rsync
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/index.js dist/public/ package.json pnpm-lock.yaml \
            root@${{ env.DROPLET_IP }}:${{ env.APP_DIR }}/

      - name: Restart PM2 on droplet
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            set -e
            cd ${{ env.APP_DIR }}
            pm2 restart ${{ env.APP_NAME }} --update-env
            sleep 3
            pm2 status
            echo 'Deploy complete'
          "
