# Copy to .github/workflows/deploy-cordova.yml in your app repo
# See templates/mobile/CORDOVA_STANDARD.md for full activation instructions
# This workflow is inactive until platform accounts and signing keys are set up

name: Deploy Cordova (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to build and deploy"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - both
      track:
        description: "Android Play Store track (ignored for iOS)"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  # ── Android Cordova Build ──────────────────────────────────────────────────
  deploy-cordova-android:
    name: Build and Deploy Cordova Android
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java (required for Cordova Android)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # TODO: Activate when Google Play Developer account is ready ($25 one-time)
      # See templates/mobile/CORDOVA_STANDARD.md — "Android Deployment"
      - name: Placeholder — Android deployment not yet active
        run: |
          echo "⚠️  Cordova Android deployment not yet configured."
          echo "To activate this workflow:"
          echo "  1. Create Google Play Developer account (\$25 one-time)"
          echo "  2. Install Cordova CLI: npm install -g cordova"
          echo "  3. Add the Android platform: cordova platform add android"
          echo "  4. Generate signing keystore (see CORDOVA_STANDARD.md)"
          echo "  5. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD secrets"
          echo "  6. Add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret"
          echo "  7. Replace this step with the TODO steps below"
          echo "See templates/mobile/CORDOVA_STANDARD.md for full instructions"
        # TODO: Replace with actual Cordova + Fastlane steps when accounts are ready:
