  # ── iOS Cordova Build ──────────────────────────────────────────────────────
  deploy-cordova-ios:
    name: Build and Deploy Cordova iOS
    runs-on: macos-latest
    if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # TODO: Activate when Apple Developer account is ready ($99/year)
      # See templates/mobile/CORDOVA_STANDARD.md — "iOS Deployment"
      - name: Placeholder — iOS deployment not yet active
