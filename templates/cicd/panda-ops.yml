# Copy to .github/workflows/panda-ops.yml in your app repo.
#
# PandaOps AI PR Review — automatically reviews every pull request using
# OpenAI and posts inline feedback and a summary comment to the PR.
#
# Required secret: OPENAI_API_KEY
#   → GitHub → Settings → Secrets and variables → Actions → New repository secret
#   → Obtain your key at: https://platform.openai.com/api-keys
#
# No other configuration required — the workflow uses GITHUB_TOKEN for
# posting comments and reads the PR diff automatically.

name: PandaOps AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: PandaOps AI PR Review
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: PandaOps AI PR Review
        uses: omnedia/panda-ops@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          # Focus on errors and warnings; skip grammar nits
          ai_focus_errors: true
          ai_focus_warn: true
          ai_focus_tips: true
          ai_focus_notes: false
          ai_focus_grammar: false
          # Set fail_on_warnings: true to block merges when warnings are found
          fail_on_warnings: false
          max_comments: 25
