# Copy to .github/workflows/mergify-merge-queue-labels-copier.yml in your app repo.
# No configuration required beyond setting the `labels` and `additional-labels` inputs.
#
# What this workflow does:
#   When Mergify creates a merge-queue PR (a temporary PR used during the merge process),
#   it does not automatically copy labels from the source PR. This workflow listens for
#   new PRs opened by Mergify and copies the specified labels so that CI jobs that gate
#   on labels (e.g., Docker-based checks) continue to run correctly inside the queue.
#
# Inputs to customise per-project:
#   labels            — Comma-separated list of labels to copy from the source PR to the
#                       merge-queue PR. Update to match the labels your CI checks rely on.
#   additional-labels — Extra labels to apply to every merge-queue PR (useful for board
#                       automation or filtering). "merge-queue-pr" is the Revvel standard.
#
# No secrets required — the workflow uses github.token throughout.

name: Mergify Merge-Queue Labels Copier

on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  pull-requests: write

jobs:
  mergify-merge-queue-labels-copier:
    name: Copy Labels to Merge-Queue PR
    runs-on: ubuntu-latest
    # Only run for PRs opened by Mergify (merge-queue branches)
    if: startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')

    steps:
      - name: Copy labels to merge-queue PR
        uses: Mergifyio/gha-mergify-merge-queue-labels-copier@v6
        with:
          # Labels to copy from the source PR — update to match your CI requirements
          labels: docker
          # Additional labels added to every merge-queue PR
          additional-labels: merge-queue-pr
          token: ${{ github.token }}
