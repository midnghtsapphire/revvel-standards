name: Prompt Evaluation

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'promptfooconfig*.yaml'
      - '.github/workflows/prompt-eval.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Pass PR title/body via env to avoid unsafe shell interpolation
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Discover prompt configs
        id: discover
        run: |
          configs=$(ls promptfooconfig*.yaml 2>/dev/null || true)
          if [ -z "$configs" ]; then
            echo "No promptfoo configs found."
            echo "configs=" >> "$GITHUB_OUTPUT"
          else
            echo "configs<<EOF" >> "$GITHUB_OUTPUT"
            echo "$configs" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Run prompt evaluations
        if: steps.discover.outputs.configs != ''
        run: |
          set -euo pipefail
          mkdir -p eval-results
          # Safely log PR metadata via env, never inline ${{ }} into shell
          printf 'Evaluating PR #%s\n' "${PR_NUMBER:-unknown}"
          printf 'Title: %s\n' "${PR_TITLE:-}"

          # Iterate configs and write per-config result files to avoid overwrite
          while IFS= read -r config; do
            [ -z "$config" ] && continue
            base=$(basename "$config" .yaml)
            out="eval-results/${base}.results.json"
            echo "Running promptfoo eval for $config -> $out"
            promptfoo eval \
              --config "$config" \
              --output "$out" \
              --no-progress-bar
          done <<< "${{ steps.discover.outputs.configs }}"

          # Merge per-config result files into a single results.json
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = 'eval-results';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.results.json'));
            const merged = { configs: {} };
            for (const f of files) {
              try {
                merged.configs[f] = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
              } catch (e) {
                merged.configs[f] = { error: String(e) };
              }
            }
            fs.writeFileSync(path.join(dir, 'results.json'), JSON.stringify(merged, null, 2));
          "

      - name: Upload evaluation results
        if: steps.discover.outputs.configs != ''
        uses: actions/upload-artifact@v4
        with:
          name: prompt-eval-results
          path: eval-results/
          if-no-files-found: ignore

      - name: Comment results on PR
        if: steps.discover.outputs.configs != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'eval-results/results.json';
            if (!fs.existsSync(path)) return;
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const summary = Object.keys(data.configs || {}).map(k => `- \`${k}\``).join('\n');
            const body = `### 🧪 Prompt Evaluation Results\n\nEvaluated configs:\n${summary}\n\nDownload the \`prompt-eval-results\` artifact for full details.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

# Default model recommendations (use valid IDs):
#   - anthropic:claude-3.7-sonnet
#   - openai:gpt-4o
# Note: Avoid invented IDs like claude-sonnet-4-5-20255112.
