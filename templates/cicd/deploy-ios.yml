name: Deploy iOS (App Store)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "App Store Connect environment"
        required: true
        default: "testflight"
        type: choice
        options:
          - testflight
          - app-store

jobs:
  deploy-ios:
