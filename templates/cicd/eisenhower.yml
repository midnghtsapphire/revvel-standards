# Copy to .github/workflows/eisenhower.yml in your app repo.
#
# Eisenhower Priority Labeler — deterministic, template-driven priority
# labeling based on the Eisenhower Matrix (Impact × Urgency).
#
# Source action: https://github.com/GeekZoneHQ/eisenhower
# Methodology:   Eisenhower Matrix (attributed to U.S. President Dwight D.
#                Eisenhower; popularised in Stephen Covey's "7 Habits").
#
# Label mapping (set by the action):
#   Impact: High + Urgency: Now   →  P1   (Do first)
#   Impact: High + Urgency: Later →  P2   (Schedule)
#   Impact: Low  + Urgency: Now   →  P3   (Delegate)
#   Impact: Low  + Urgency: Later →  P4   (Eliminate / backlog)
#   Missing / unparseable fields  →  P?   (needs human triage)
#
# Requires:
#   - An issue form that includes the "Impact" and "Urgency" dropdowns.
#     See: templates/cicd/eisenhower-issue-template.yml
#   - Repository secret `GH_ACCESS_TOKEN` — a PAT (or bot token) with
#     `repo` / `issues: write` scope. The default `GITHUB_TOKEN` also works
#     if you prefer; pass it as `GH_ACCESS_TOKEN` in the `env:` block below.

name: Eisenhower Priority Labeler

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label:
    name: Label issue by Eisenhower Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Prioritize issue with Geek.Zone Eisenhower
        # Pinned to a specific commit SHA (v-latest as of 2023-07-26) per the
        # Revvel security standard — avoid tracking a mutable branch.
        # To bump: review upstream commits and update both the SHA and the
        # trailing comment.
        uses: GeekZoneHQ/eisenhower@25222276fd5661d7a30042f6db2c3159ffabfb6d # main @ 2023-07-26
        env:
          # Use a dedicated bot PAT if you want label activity attributed to
          # a bot account; otherwise GITHUB_TOKEN is sufficient.
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ISSUE_NUMBER: ${{ github.event.issue.number }}
