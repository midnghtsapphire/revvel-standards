# Copy to .github/workflows/google-cloud-identity-verify.yml
#
# Verifies Google Cloud Identity or Workforce Identity Federation configuration
# Runs weekly and on-demand to ensure identity setup remains valid
#
# Required secrets:
#   GCP_WIF_SERVICE_ACCOUNT_EMAIL - Service account email for Workload Identity Federation
#   GCP_WORKLOAD_IDENTITY_PROVIDER - Workload Identity Provider resource name
#
# Required variables (non-secret):
#   GCP_PROJECT_ID - Google Cloud project ID (use vars, not secrets, so it displays in summaries)
#
# Service account permissions needed:
#   - iam.workforcePools.viewer
#   - serviceusage.services.list
#
# See docs/Master_Inventory/GOOGLE_CLOUD_IDENTITY_STANDARD.md for full context

name: Google Cloud Identity Verification

on:
  # Run weekly on Mondays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      workforce_pool_id:
        description: 'Workforce Pool ID to verify (optional, will discover if not provided)'
        required: false
        type: string
      check_scim:
        description: 'Check SCIM provisioning status'
        required: false
        type: boolean
        default: true

jobs:
  verify-identity-config:
    name: Verify Identity Configuration
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation OIDC token exchange
      issues: write  # To create issues if verification fails
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      
      - name: Verify required APIs are enabled
        id: check-apis
        run: |
          echo "Checking required APIs..."
          
          REQUIRED_APIS=(
            "iam.googleapis.com"
            "cloudidentity.googleapis.com"
            "iamcredentials.googleapis.com"
            "sts.googleapis.com"
          )
          
          MISSING_APIS=()
          
          for api in "${REQUIRED_APIS[@]}"; do
            if gcloud services list --enabled --filter="name:$api" --format="value(name)" | grep -q "$api"; then
              echo "✅ $api is enabled"
            else
              echo "❌ $api is NOT enabled"
              MISSING_APIS+=("$api")
            fi
          done
          
          if [ ${#MISSING_APIS[@]} -gt 0 ]; then
            echo "missing_apis=${MISSING_APIS[*]}" >> $GITHUB_OUTPUT
            echo "apis_status=failed" >> $GITHUB_OUTPUT
            echo "::error::Missing APIs: ${MISSING_APIS[*]}"
            exit 1
          else
            echo "apis_status=success" >> $GITHUB_OUTPUT
            echo "All required APIs are enabled"
          fi
      
      - name: Discover Workforce Identity Pools
        id: discover-pools
        run: |
          echo "Discovering workforce identity pools..."
          
          POOLS=$(gcloud iam workforce-pools list --location=global --format="value(name)" 2>/dev/null || echo "")
          
          if [ -z "$POOLS" ]; then
            echo "pool_count=0" >> $GITHUB_OUTPUT
            echo "⚠️ No workforce identity pools found"
            echo "This may be expected if using Cloud Identity instead of Workforce Identity Federation"
          else
            POOL_COUNT=$(echo "$POOLS" | wc -l)
            echo "pool_count=$POOL_COUNT" >> $GITHUB_OUTPUT
            echo "pools<<EOF" >> $GITHUB_OUTPUT
            echo "$POOLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            echo "Found $POOL_COUNT workforce identity pool(s):"
            echo "$POOLS"
          fi
      
      - name: Verify Workforce Pool Configuration
        id: verify-pools
        if: steps.discover-pools.outputs.pool_count > 0
        env:
          POOLS: ${{ steps.discover-pools.outputs.pools }}
          INPUT_POOL_ID: ${{ github.event.inputs.workforce_pool_id }}
        run: |
          POOL_ID="$INPUT_POOL_ID"
          
          if [ -n "$POOL_ID" ]; then
            # Verify specific pool
            echo "Verifying specified pool: $POOL_ID"
          else
            # Use first discovered pool
            POOL_NAME=$(echo "$POOLS" | head -n 1)
            POOL_ID=$(basename "$POOL_NAME")
            echo "Verifying first discovered pool: $POOL_ID"
          fi
          
          # Get pool details
          POOL_INFO=$(gcloud iam workforce-pools describe "$POOL_ID" --location=global --format=json)
          
          echo "Pool Details:"
          echo "$POOL_INFO" | jq -r '
            "Name: \(.name)",
            "Display Name: \(.displayName)",
            "Description: \(.description)",
            "State: \(.state)"
          '
          
          # Check pool state
          POOL_STATE=$(echo "$POOL_INFO" | jq -r '.state')
          if [ "$POOL_STATE" != "ACTIVE" ]; then
            echo "::error::Workforce pool is not ACTIVE (state: $POOL_STATE)"
            echo "pool_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "pool_id=$POOL_ID" >> $GITHUB_OUTPUT
          echo "pool_status=success" >> $GITHUB_OUTPUT
      
      - name: Verify Providers Configuration
        id: verify-providers
        if: steps.verify-pools.outputs.pool_status == 'success'
        env:
          POOL_ID: ${{ steps.verify-pools.outputs.pool_id }}
        run: |
          echo "Discovering providers for pool: $POOL_ID"
          
          PROVIDERS=$(gcloud iam workforce-pools providers list \
            --workforce-pool="$POOL_ID" \
            --location=global \
            --format="value(name)")
          
          if [ -z "$PROVIDERS" ]; then
            echo "::error::No providers found for workforce pool $POOL_ID"
            echo "providers_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          PROVIDER_COUNT=$(echo "$PROVIDERS" | wc -l)
          echo "Found $PROVIDER_COUNT provider(s)"
          
          # Verify each provider
          FAILED_PROVIDERS=()
          
          while IFS= read -r provider_name; do
            PROVIDER_ID=$(basename "$provider_name")
            echo ""
            echo "Verifying provider: $PROVIDER_ID"
            
            PROVIDER_INFO=$(gcloud iam workforce-pools providers describe "$PROVIDER_ID" \
              --workforce-pool="$POOL_ID" \
              --location=global \
              --format=json)
            
            echo "Provider Details:"
            echo "$PROVIDER_INFO" | jq -r '
              "  Display Name: \(.displayName)",
              "  State: \(.state)",
              "  Type: \(if .oidc then "OIDC" elif .saml then "SAML" else "Unknown" end)"
            '
            
            # Check provider state
            PROVIDER_STATE=$(echo "$PROVIDER_INFO" | jq -r '.state')
            if [ "$PROVIDER_STATE" != "ACTIVE" ]; then
              echo "::warning::Provider $PROVIDER_ID is not ACTIVE (state: $PROVIDER_STATE)"
              FAILED_PROVIDERS+=("$PROVIDER_ID")
            fi
            
            # Check attribute mappings
            echo "Attribute Mappings:"
            echo "$PROVIDER_INFO" | jq -r '.attributeMapping | to_entries[] | "  \(.key) = \(.value)"'
            
            # Verify google.subject mapping exists
            if ! echo "$PROVIDER_INFO" | jq -e '.attributeMapping."google.subject"' > /dev/null; then
              echo "::error::Provider $PROVIDER_ID is missing required 'google.subject' attribute mapping"
              FAILED_PROVIDERS+=("$PROVIDER_ID")
            fi
            
          done <<< "$PROVIDERS"
          
          if [ ${#FAILED_PROVIDERS[@]} -gt 0 ]; then
            echo "failed_providers=${FAILED_PROVIDERS[*]}" >> $GITHUB_OUTPUT
            echo "providers_status=failed" >> $GITHUB_OUTPUT
            echo "::error::Provider verification failed for: ${FAILED_PROVIDERS[*]}"
            exit 1
          else
            echo "providers_status=success" >> $GITHUB_OUTPUT
            echo "✅ All providers are properly configured"
          fi
      
      - name: Check SCIM Provisioning Status
        id: check-scim
        if: |
          github.event.inputs.check_scim != 'false' &&
          steps.verify-providers.outputs.providers_status == 'success'
        continue-on-error: true
        env:
          POOL_ID: ${{ steps.verify-pools.outputs.pool_id }}
        run: |
          PROVIDERS=$(gcloud iam workforce-pools providers list \
            --workforce-pool="$POOL_ID" \
            --location=global \
            --format="value(name)")
          
          echo "Checking SCIM provisioning status..."
          
          SCIM_ENABLED=false
          
          while IFS= read -r provider_name; do
            PROVIDER_ID=$(basename "$provider_name")
            
            SCIM_STATUS=$(gcloud iam workforce-pools providers describe "$PROVIDER_ID" \
              --workforce-pool="$POOL_ID" \
              --location=global \
              --format="value(scim.status)" 2>/dev/null || echo "NOT_CONFIGURED")
            
            if [ "$SCIM_STATUS" != "NOT_CONFIGURED" ] && [ -n "$SCIM_STATUS" ]; then
              echo "Provider $PROVIDER_ID: SCIM status = $SCIM_STATUS"
              SCIM_ENABLED=true
            else
              echo "Provider $PROVIDER_ID: SCIM not configured"
            fi
          done <<< "$PROVIDERS"
          
          if [ "$SCIM_ENABLED" = true ]; then
            echo "scim_status=enabled" >> $GITHUB_OUTPUT
            echo "✅ SCIM provisioning is enabled"
          else
            echo "scim_status=not_enabled" >> $GITHUB_OUTPUT
            echo "ℹ️ SCIM provisioning is not enabled (may be expected for small group sets)"
          fi
      
      - name: Create issue on verification failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🔴 Google Cloud Identity Configuration Verification Failed';
            
            // Check if an open issue already exists to avoid spam
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'infrastructure,identity,auto-error',
              per_page: 100
            });
            
            const existingIssue = existingIssues.data.find(issue => 
              issue.title === title
            );
            
            const body = [
              '## Google Cloud Identity Configuration Verification Failed',
              '',
              `**Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              `**Trigger:** ${{ github.event_name }}`,
              `**Date:** ${new Date().toISOString()}`,
              '',
              '### Failed Checks',
              '',
              '${{ steps.check-apis.outputs.apis_status }}' === 'failed' ? '- ❌ Required APIs are not enabled' : '',
              '${{ steps.verify-pools.outputs.pool_status }}' === 'failed' ? '- ❌ Workforce pool verification failed' : '',
              '${{ steps.verify-providers.outputs.providers_status }}' === 'failed' ? '- ❌ Provider verification failed' : '',
              '',
              '### Details',
              '',
              '**APIs Status:** ${{ steps.check-apis.outputs.apis_status || 'unknown' }}',
              '**Pool Status:** ${{ steps.verify-pools.outputs.pool_status || 'unknown' }}',
              '**Providers Status:** ${{ steps.verify-providers.outputs.providers_status || 'unknown' }}',
              '',
              '### Action Required',
              '',
              'Review the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed error messages.',
              '',
              'Refer to the [Google Cloud Identity Standard](https://github.com/midnghtsapphire/revvel-standards/blob/main/docs/Master_Inventory/GOOGLE_CLOUD_IDENTITY_STANDARD.md) for troubleshooting guidance.',
              '',
              '---',
              '',
              '*This issue was created automatically by the Google Cloud Identity verification workflow.*'
            ].filter(Boolean).join('\n');
            
            if (existingIssue) {
              // Update existing issue with a new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['infrastructure', 'identity', 'auto-error']
              });
              console.log('Created new issue');
            }
      
      - name: Summary
        if: always()
        run: |
          echo "## Google Cloud Identity Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ vars.GCP_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Required APIs | ${{ steps.check-apis.outputs.apis_status == 'success' && '✅ Enabled' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workforce Pools | ${{ steps.discover-pools.outputs.pool_count || '0' }} found |" >> $GITHUB_STEP_SUMMARY
          echo "| Pool Configuration | ${{ steps.verify-pools.outputs.pool_status == 'success' && '✅ Valid' || (steps.discover-pools.outputs.pool_count == '0' && 'N/A' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Provider Configuration | ${{ steps.verify-providers.outputs.providers_status == 'success' && '✅ Valid' || (steps.discover-pools.outputs.pool_count == '0' && 'N/A' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCIM Provisioning | ${{ steps.check-scim.outputs.scim_status == 'enabled' && '✅ Enabled' || (steps.check-scim.outputs.scim_status == 'not_enabled' && 'ℹ️ Not Enabled' || 'N/A') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [Google Cloud Identity Standard](docs/Master_Inventory/GOOGLE_CLOUD_IDENTITY_STANDARD.md) for more information." >> $GITHUB_STEP_SUMMARY
