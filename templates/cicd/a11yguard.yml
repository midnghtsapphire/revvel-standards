# a11yGuard Accessibility Audit
#
# Marketplace: https://github.com/marketplace/actions/a11yguard-accessibility-automation
# Action repo: https://github.com/a11ywatch/github-actions
#
# Runs an accessibility audit against a preview or production URL and posts PR
# results back to GitHub. Provide the target URL via workflow_dispatch input or
# repository variable/secret `A11YGUARD_WEBSITE_URL`.
#
# Secrets required: none for local mode
# Optional secrets: A11YWATCH_TOKEN, COMPUTER_VISION_ENDPOINT, COMPUTER_VISION_SUBSCRIPTION_KEY
# Copy this file to: .github/workflows/a11yguard.yml

name: a11yGuard Accessibility Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      website_url:
        description: "Preview or production URL to scan (https://...)"
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: a11yguard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEBSITE_URL: ${{ github.event.inputs.website_url || vars.A11YGUARD_WEBSITE_URL || secrets.A11YGUARD_WEBSITE_URL }}
    steps:
      - name: Verify website URL is configured
        run: |
          if [ -z "${WEBSITE_URL}" ]; then
            echo "::warning::Set workflow_dispatch input website_url or repository variable/secret A11YGUARD_WEBSITE_URL to run a11yGuard."
          else
            echo "Scanning ${WEBSITE_URL}"
          fi

      - name: Checkout code
        if: env.WEBSITE_URL != ''
        uses: actions/checkout@v4

      - name: Run a11yGuard
        if: env.WEBSITE_URL != ''
        uses: a11ywatch/github-actions@v2.1.10
        with:
          WEBSITE_URL: ${{ env.WEBSITE_URL }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A11YWATCH_TOKEN: ${{ secrets.A11YWATCH_TOKEN }}
          COMPUTER_VISION_ENDPOINT: ${{ secrets.COMPUTER_VISION_ENDPOINT }}
          COMPUTER_VISION_SUBSCRIPTION_KEY: ${{ secrets.COMPUTER_VISION_SUBSCRIPTION_KEY }}
          SITE_WIDE: "true"
          SITEMAP: "true"
          LIST: "true"
          UPLOAD: "true"
          FAIL_ERRORS_COUNT: "0"
