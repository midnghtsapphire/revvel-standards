# Android Resource Translator
#
# Marketplace: https://github.com/marketplace/actions/android-resource-translator
# Action repo: https://github.com/duartebarbosadev/AndroidResourceTranslator
#
# Scans `strings.xml` files under `app/src/main/res` (or equivalent) and
# translates missing strings via an OpenRouter model, then opens a PR with
# the new translations. Only useful for Android app repos.
#
# Secrets required: OPENROUTER_API_KEY
# Copy this file to: .github/workflows/android-resource-translator.yml

name: Android Resource Translator

on:
  push:
    branches: [main]
    paths:
      - "**/values/strings.xml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-resource-translator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    name: Translate Android strings.xml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping translation."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi

      - name: Checkout
        if: env.OPENROUTER_API_KEY != ''
        uses: actions/checkout@v4

      - name: Translate strings.xml
        if: env.OPENROUTER_API_KEY != ''
        id: translate
        uses: duartebarbosadev/AndroidResourceTranslator@v2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Save translation report for PR body
        if: env.OPENROUTER_API_KEY != ''
        run: |
          cat <<'EOF' > "${{ runner.temp }}/translation_report.md"
          ${{ steps.translate.outputs.translation_report }}
          EOF

      - name: Create Pull Request
        if: env.OPENROUTER_API_KEY != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-translate
          commit-message: "chore(i18n): auto-translated Android string resources"
          title: "chore(i18n): auto-translated Android string resources"
          body-path: ${{ runner.temp }}/translation_report.md
          labels: "translation, automated pr"
