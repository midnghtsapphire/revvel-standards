# CircleCI + OpenRouter Failure Helper
#
# Copy this file to: .circleci/config.yml
#
# Purpose:
# - Run your normal CircleCI build/test pipeline
# - If a step fails, send the tail of the CI log to OpenRouter for a concise
#   root-cause + fix suggestion block
#
# Required env var in CircleCI project settings:
# - OPENROUTER_API_KEY
#
# Notes:
# - This is the CircleCI equivalent of `ai-ci-failure-helper.yml`.
# - Missing OPENROUTER_API_KEY is treated as a warning; the job still fails for
#   the original CI reason, not because AI analysis is unavailable.

version: 2.1

jobs:
  build-test-and-diagnose:
    docker:
      - image: cimg/node:20.11
    environment:
      OPENROUTER_MODEL: x-ai/grok-4.1-fast:free
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Run CI checks
          command: |
            set -o pipefail
            pnpm run ci 2>&1 | tee /tmp/ci-main.log
      - run:
          name: OpenRouter CI failure analysis
          when: on_fail
          command: |
            if [ -z "${OPENROUTER_API_KEY}" ]; then
              echo "WARNING: OPENROUTER_API_KEY is not set. Skipping OpenRouter CI analysis."
              exit 0
            fi

            LOG_TAIL="$(tail -n 200 /tmp/ci-main.log 2>/dev/null || echo 'No CI log captured.')"

            python3 - <<'PY'
            import json
            import os
            import urllib.request

            log_tail = os.environ.get("LOG_TAIL", "No CI log captured.")
            model = os.environ.get("OPENROUTER_MODEL", "x-ai/grok-4.1-fast:free")
            api_key = os.environ["OPENROUTER_API_KEY"]

            payload = {
                "model": model,
                "messages": [
                    {
                        "role": "system",
                        "content": (
                            "You are a senior CI engineer. Given CircleCI failure logs, "
                            "return a concise root cause and concrete fix steps."
                        ),
                    },
                    {
                        "role": "user",
                        "content": (
                            "Analyze this CircleCI failure log tail and provide:\n"
                            "1) likely root cause\n2) immediate fix\n3) prevention step\n\n"
                            f"{log_tail}"
                        ),
                    },
                ],
            }

            req = urllib.request.Request(
                "https://openrouter.ai/api/v1/chat/completions",
                data=json.dumps(payload).encode("utf-8"),
                headers={
                    "Authorization": f"Bearer {api_key}",
                    "Content-Type": "application/json",
                },
                method="POST",
            )

            try:
                with urllib.request.urlopen(req, timeout=30) as res:
                    body = json.loads(res.read().decode("utf-8"))
            except Exception as err:
                print(f"OpenRouter request failed: {err}")
                raise SystemExit(0)

            choices = body.get("choices") or []
            message = (choices[0].get("message") or {}).get("content") if choices else None
            if not message:
                print("OpenRouter returned no diagnostic message.")
                raise SystemExit(0)

            print("\n--- OpenRouter CI Failure Analysis ---\n")
            print(message)
            print("\n--- End OpenRouter Analysis ---\n")
            PY

workflows:
  ci:
    jobs:
      - build-test-and-diagnose
