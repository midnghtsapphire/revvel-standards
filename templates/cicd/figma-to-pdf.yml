# Figma to PDF Export Workflow
#
# Exports Figma designs to PDF for client delivery.
# Triggers on workflow_dispatch or when WR has sellable-pdf output type.
#
# Required secret: FIGMA_API_KEY
#   → Get from Figma Settings → Personal Access Tokens
#
# Optional: OPENROUTER_API_KEY for AI descriptions

name: Figma to PDF Export

on:
  workflow_dispatch:
    inputs:
      figma_file_url:
        type: string
        description: "Figma file URL or file key"
        required: true
      pages:
        type: string
        description: "Page names to export (comma-separated)"
        required: false
        default: ""
      output_name:
        type: string
        description: "Output filename (without .pdf)"
        required: false
        default: "export"
  repository_dispatch:
    types: [figma-export]
  pull_request:
    paths:
      - '.github/workflows/figma-to-pdf.yml'
  issue_comment:
    types: [created]
    if: 'contains(github.event.comment.body, "/figma-pdf")'

permissions:
  contents: write
  pull-requests: write

env:
  FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}

jobs:
  export:
    name: Export Figma to PDF
    runs-on: ubuntu-latest
    if: env.FIGMA_API_KEY != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract file key
        id: parse
        run: |
          INPUT="${{ github.events.figma_file_url }}"
          # Extract file key from URL or use directly
          FILE_KEY=$(echo "$INPUT" | grep -oE '[a-zA-Z0-9]{10,}' | head -1)
          echo "file_key=$FILE_KEY" >> $GITHUB_OUTPUT
          echo "pages=${{ github.events.pages }}" >> $GITHUB_OUTPUT
          echo "output=${{ github.events.output_name }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Figma CLI
        run: npm install -g @figma/figma-cli

      - name: Export PDF via Figma API
        env:
          FILE_KEY: ${{ steps.parse.outputs.file_key }}
        run: |
          mkdir -p exports
          
          # Try Figma CLI first
          npx @figma/figma-cli export "$FILE_KEY" \
            --format pdf \
            --scale 2 \
            --output exports/ \
            || echo "CLI export failed, trying API..."
          
          # Fallback: use Figma REST API
          curl -s -H "X-Figma-Token: $FIGMA_API_KEY" \
            "https://api.figma.com/v1/files/$FILE_KEY" \
            > figma-response.json
          
          # Check if response has export settings
          if [ -f figma-response.json ]; then
            echo "Figma file retrieved, using REST export..."
          fi

      - name: Create PDF from images
        if: false
        run: |
          # Install PDF tools
          pip install reportlab pillow
          
          # Convert exported images to PDF
          python3 - <<'PY'
          import os
          from reportlab.lib.pagesizes import letter
          from reportlab.pdfgen import canvas
          from PIL import Image

          output = "${{ steps.parse.outputs.output }}"
          images = sorted([f for f in os.listdir('exports') if f.endswith('.png')])

          pdf = f"exports/{output or 'figma-export'}.pdf"
          c = canvas.Canvas(pdf, pagesize=letter)
          w, h = letter

          for img in images:
              img_path = f"exports/{img}"
              try:
                  c.drawImage(img_path, 0, 0, width=w, height=h)
                  c.showPage()
              except Exception as e:
                  print(f"Skipping {img}: {e}")

          c.save()
          print(f"Created: {pdf}")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: figma-pdf-export
          path: exports/
          retention-days: 30

      - name: Create PR with PDF
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Create a branch, commit PDF, open PR
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          git checkout -b figma-export/$(date +%Y%m%d)
          git add exports/
          git commit -m "chore: Figma PDF export"
          git push -u origin figma-export/$(date +%Y%m%d)
          
          gh pr create \
            --title "Figma PDF Export" \
            --body "Automated PDF export from Figma" \
            --base main

      - name: Report success
        if: always()
        run: |
          echo "## Figma Export Complete" >> $GITHUB_STEP_SUMMARY
          echo "✅ PDF exported successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  no-api:
    name: Missing API Key
    runs-on: ubuntu-latest
    if: env.FIGMA_API_KEY == ''
    steps:
      - name: Inform user
        run: |
          echo "## ⚠️ FIGMA_API_KEY Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please add FIGMA_API_KEY to repository secrets." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Get it from: Figma → Settings → Personal Access Tokens" >> $GITHUB_STEP_SUMMARY
          exit 1