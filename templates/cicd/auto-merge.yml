# Copy to .github/workflows/auto-merge.yml in your app repo.
# No configuration required — works out of the box with GITHUB_TOKEN.
#
# What this workflow does:
#   1. ENABLE AUTO-MERGE: When the `auto-merge` label is applied to a PR, GitHub's
#      native pull request auto-merge is enabled. The PR will be squash-merged
#      automatically once all required status checks pass and all required reviewers
#      have approved.
#   2. DISABLE AUTO-MERGE: When the `auto-merge` label is removed OR the
#      `won't-merge` label is applied, auto-merge is disabled so a human can
#      intervene without race conditions.
#
# Prerequisites (configure once per repo):
#   Branch protection on `main` must require:
#     • At least 1 approved review
#     • Status checks to pass before merging
#   Without these rules GitHub rejects enablePullRequestAutoMerge and the job fails.
#   Go to: Settings → Branches → Add rule for 'main'
#
# Usage in practice:
#   • Copilot / automation adds `auto-merge` → PR merges when CI + review done
#   • Human adds `won't-merge` → blocks any pending auto-merge
#   • Reviewer removes `won't-merge`, re-adds `auto-merge` → re-enables
#
# Setup:
#   cp templates/cicd/auto-merge.yml .github/workflows/auto-merge.yml

name: Auto-Merge on Approval

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Enable auto-merge when `auto-merge` label is applied
  # ────────────────────────────────────────────────────────────────────────────
  enable-auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'labeled' &&
      github.event.label.name == 'auto-merge'

    steps:
      - name: Enable pull request auto-merge (squash)
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr     = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);

            // Safety check: don't enable if 'won't-merge' is also present
            if (labels.includes("won't-merge")) {
              core.warning(
                `PR #${pr.number} has both 'auto-merge' and 'won\\'t-merge' labels. ` +
                `Auto-merge NOT enabled — remove 'won\\'t-merge' first.`
              );
              return;
            }

            try {
              await github.graphql(`
                mutation($prId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $prId
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number title }
                  }
                }
              `, { prId: pr.node_id });

              core.notice(
                `✅ Auto-merge ENABLED on PR #${pr.number} — ` +
                `will merge once required checks pass and approvals are in.`
              );
            } catch (e) {
              // Provide a clear, actionable error message
              if (e.message?.includes('auto merge is not allowed')) {
                core.error(
                  `Auto-merge is not allowed for PR #${pr.number}. ` +
                  `Branch protection rules may not be configured. ` +
                  `Go to Settings → Branches and enable required status checks + required reviews on 'main'.`
                );
              } else {
                core.error(`Failed to enable auto-merge on PR #${pr.number}: ${e.message}`);
              }
              throw e;
            }

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Disable auto-merge when `auto-merge` is removed OR `won't-merge` added
  # ────────────────────────────────────────────────────────────────────────────
  disable-auto-merge:
    name: Disable Auto-Merge
    runs-on: ubuntu-latest
    if: |
      (github.event.action == 'unlabeled' && github.event.label.name == 'auto-merge') ||
      (github.event.action == 'labeled'   && github.event.label.name == 'won''t-merge')

    steps:
      - name: Disable pull request auto-merge
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            try {
              await github.graphql(`
                mutation($prId: ID!) {
                  disablePullRequestAutoMerge(input: { pullRequestId: $prId }) {
                    pullRequest { number title }
                  }
                }
              `, { prId: pr.node_id });

              const reason = context.payload.label.name === "won't-merge"
                ? `'won\\'t-merge' label applied`
                : `'auto-merge' label removed`;

              core.notice(
                `⏸️  Auto-merge DISABLED on PR #${pr.number} (${reason}).`
              );
            } catch (e) {
              // If auto-merge was never enabled, the mutation will error — ignore quietly
              if (e.message?.includes('pull request does not have auto merge enabled')) {
                core.info(`PR #${pr.number} did not have auto-merge enabled — nothing to disable.`);
              } else {
                core.warning(`Could not disable auto-merge on PR #${pr.number}: ${e.message}`);
              }
            }
