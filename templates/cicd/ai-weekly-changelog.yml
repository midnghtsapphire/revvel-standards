# Weekly Changelog via OpenRouter
#
# Marketplace: https://github.com/marketplace/actions/weekly-changelog-via-openrouter
# Action repo: https://github.com/fridzema/ai-weekly-changelog-action
#
# Generates a weekly changelog from git commits using an AI model via
# OpenRouter and commits the update to `CHANGELOG.md`.
#
# Secrets required: OPENROUTER_API_KEY
# Copy this file to: .github/workflows/ai-weekly-changelog.yml

name: AI Weekly Changelog

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * MON"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days to look back for commits (1-365)"
        type: string
        required: false
        default: "7"
      model:
        description: "OpenRouter model ID"
        type: string
        required: false
        default: "openai/gpt-5-mini"
      language:
        description: "Output language"
        type: choice
        required: false
        default: "English"
        options:
          - English
          - Dutch
          - German
          - French
          - Spanish
      extended:
        description: "Extended analysis (file changes, statistics)"
        type: boolean
        required: false
        default: false
      force:
        description: "Force update existing week entry"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Preview without committing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ai-weekly-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Generate weekly changelog
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set. See docs/OPENROUTER_ASSIGNEE_PROCESS.md."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi

      - name: Generate Weekly Changelog
        if: env.OPENROUTER_API_KEY != ''
        uses: fridzema/ai-weekly-changelog-action@v1
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          days_back: ${{ inputs.days_back || '7' }}
          model: ${{ inputs.model || 'openai/gpt-5-mini' }}
          language: ${{ inputs.language || 'English' }}
          extended: ${{ inputs.extended || false }}
          force: ${{ inputs.force || false }}
          dry_run: ${{ inputs.dry_run || false }}
