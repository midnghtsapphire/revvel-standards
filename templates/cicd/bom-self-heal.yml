# BOM Self-Healing Workflow Template
# Generated by Revvel Standards — Universal BOM List
# Version: 1.0.0
# Date: 2026-04-14
#
# PURPOSE: Autonomous BOM self-evaluation that runs on every deployment and 
# on a weekly schedule. Identifies P0/P1 gaps and creates GitHub Issues.
#
# PREREQUISITES:
# - ANTHROPIC_API_KEY secret must be set in repository settings
# - GITHUB_TOKEN is automatically provided by GitHub Actions
#
# SETUP: Copy to .github/workflows/bom-self-heal.yml in each project repo.

name: BOM Self-Healing Audit

on:
  # Run after every deployment
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  # Run weekly on Monday mornings
  schedule:
    - cron: '0 9 * * 1'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      depth:
        description: 'Audit depth (quick = Haiku, full = Sonnet, deep = Opus)'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - full
          - deep

env:
  BOM_FILE: docs/${{ github.event.repository.name }}/BOM.md
  MASTER_BOM: docs/_MASTER_BOM.md

jobs:
  bom-quick-audit:
    name: Quick BOM Status Check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.depth == 'quick')
    steps:
      - uses: actions/checkout@v4

      - name: Check for P0 gaps in BOM
        run: |
          echo "=== BOM Self-Heal: Quick Audit ==="
          echo "Date: $(date -u +"%Y-%m-%d %H:%M UTC")"
          echo ""
          
          # Check for common P0 indicators in BOM files
          P0_COUNT=$(grep -r "❌ Not Provisioned\|❌ Not purchased" docs/*/BOM.md 2>/dev/null | grep -c "P0" || true)
          MISSING_KEYS=$(grep -r "SENTRY_DSN\|ANTHROPIC_API_KEY\|FCM" docs/*/BOM.md 2>/dev/null | grep -c "Not Provisioned" || true)
          
          echo "P0 items not provisioned: $P0_COUNT"
          echo "Missing critical API keys: $MISSING_KEYS"
          
          if [ "$P0_COUNT" -gt "0" ] || [ "$MISSING_KEYS" -gt "0" ]; then
            echo "::warning::BOM has P0 gaps — run full audit for details"
          else
            echo "BOM appears healthy — no P0 gaps detected"
          fi

      - name: Verify uptime monitor references
        run: |
          # Check if UptimeRobot is configured (basic check)
          if ! grep -r "UptimeRobot\|uptimerobot" docs/*/BOM.md 2>/dev/null | grep -q "✅"; then
            echo "::warning::No active uptime monitoring found in project BOMs"
          fi

  bom-full-audit:
    name: Full BOM Audit (Weekly)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.depth == 'full')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate Master BOM
        run: bash scripts/sync-bom.sh

      - name: Check for BOM drift (uncommitted changes)
        id: bom-drift
        run: |
          if git diff --quiet docs/_MASTER_BOM.md; then
            echo "drift=false" >> $GITHUB_OUTPUT
            echo "Master BOM is up-to-date"
          else
            echo "drift=true" >> $GITHUB_OUTPUT
            echo "::warning::Master BOM has drifted from individual project BOMs"
            git diff docs/_MASTER_BOM.md
          fi

      - name: Commit updated Master BOM (if drifted)
        if: steps.bom-drift.outputs.drift == 'true'
        run: |
          git config --local user.email "copilot@revvel.io"
          git config --local user.name "Revvel BOM Agent"
          git add docs/_MASTER_BOM.md
          git commit -m "chore(bom): auto-sync master BOM $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Count outstanding P0 items
        id: p0-count
        run: |
          P0_ITEMS=$(grep -r "| P0 |" docs/*/BOM.md 2>/dev/null | grep "❌" | wc -l || echo "0")
          echo "count=$P0_ITEMS" >> $GITHUB_OUTPUT
          echo "Outstanding P0 BOM items: $P0_ITEMS"

      - name: Create GitHub Issue for P0 gaps
        if: steps.p0-count.outputs.count > 0
        uses: actions/github-script@v8
        with:
          script: |
            const p0Count = ${{ steps.p0-count.outputs.count }};
            
            // Check if there's already an open issue for BOM P0 gaps
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'bom-purchase',
              state: 'open'
            });
            
            const existingIssue = issues.data.find(i => 
              i.title.includes('BOM P0 Gaps') && 
              new Date(i.created_at) > new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
            );
            
            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              return;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[BOM Self-Heal] ${p0Count} P0 gaps detected — ${new Date().toISOString().slice(0, 10)}`,
              body: `## BOM Self-Healing Audit Found P0 Gaps
            
            **Date:** ${new Date().toISOString().slice(0, 10)}
            **P0 Items Outstanding:** ${p0Count}
            
            The weekly BOM Self-Healing audit has detected ${p0Count} P0-priority items that are not yet provisioned or purchased.
            
            ### Action Required
            
            1. Review \`docs/_MASTER_BOM.md\` for all outstanding P0 items
            2. Review each project's \`BOM.md\` for specifics
            3. Provision or purchase each item
            4. Update the BOM status from ❌ to ✅
            
            ### Reference
            - [Master BOM](docs/_MASTER_BOM.md)
            - [API Registry](docs/Universal-BOM_List/API_REGISTRY_BOM.md)
            - [Self-Healing BOM Template](docs/Universal-BOM_List/SELF_HEALING_BOM_TEMPLATE.md)
            
            *This issue was created automatically by the BOM Self-Healing workflow.*`,
              labels: ['bom-purchase', 'enhancement'],
              assignees: ['midnghtsapphire']
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bom-deep-audit:
    name: Deep BOM Audit (Claude-Powered)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.depth == 'deep'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude BOM Audit
        run: |
          echo "=== Deep BOM Audit via Claude Sonnet ==="
          
          # Collect all BOM files
          BOM_CONTENT=$(find docs -name "BOM.md" -exec cat {} \; 2>/dev/null | head -5000)
          
          # Prepare audit prompt
          PROMPT="You are the Revvel BOM Self-Healing Agent. Review the following Bill of Materials files from the Revvel Standards repository and provide:
          1. A list of P0/P1 gaps that need immediate attention
          2. Any APIs or tools that appear to be missing based on the projects described
          3. Any cost-saving recommendations
          4. Any deprecated services that should be replaced
          
          Be concise and actionable. Format as a markdown list.
          
          BOM FILES:
          $BOM_CONTENT"
          
          # Note: In production, wire ANTHROPIC_API_KEY here
          echo "Claude audit would run here with ANTHROPIC_API_KEY"
          echo "Prompt prepared — wire API key to enable full autonomous audit"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
