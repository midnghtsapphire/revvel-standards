# Copy to .github/workflows/ralph-loop.yml
# Replace OWNER_USERNAME with your GitHub username
#
# The Ralph Loop is a self-healing CI error-retry mechanism.
# When any CI workflow fails, this workflow:
#   1. Detects the failure and captures structured context
#   2. Creates a GitHub Issue labeled `auto-fix` + `copilot` for @copilot to resolve
#   3. After @copilot merges a fix PR, re-triggers the original CI workflow
#   4. If CI fails again, creates a new issue with full history (up to max_retries)
#   5. After max_retries, escalates with `needs-human` label
#
# Pair with auto-fix.yml for simpler single-pass use cases.

name: Ralph Loop — Self-Healing CI Retry

on:
  workflow_run:
    # IMPORTANT: These names must exactly match the `name:` field of the workflows
    # you want the Ralph Loop to monitor. Update this list to match your repo's
    # actual workflow names (found at the top of each .github/workflows/*.yml file).
    workflows:
      - "CI"
      - "Security Scan"
      - "Vault Agent — Credential Provisioning"
    types:
      - completed

env:
  MAX_RETRIES: "5"
  LOOP_LABEL: "ralph-loop"
  FIX_LABEL: "auto-fix"
  COPILOT_LABEL: "copilot"
  HUMAN_LABEL: "needs-human"
  VAULT_LABEL: "vault-agent"

jobs:
  ralph-loop:
    name: Ralph Loop — Evaluate and Route
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      issues: write
      contents: read
      actions: read

    steps:
      - name: Gather failure context
        id: gather-context
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowRun = context.payload.workflow_run;
            const runId = workflowRun.id;
            const runUrl = workflowRun.html_url;
            const branch = workflowRun.head_branch;
            const commit = workflowRun.head_sha.substring(0, 8);
            const workflowName = workflowRun.name;
            const triggeredEvent = workflowRun.event;

            // Get failed jobs
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const failedJobs = jobs.data.jobs
              .filter(job => job.conclusion === 'failure')
              .map(job => ({ name: job.name, id: job.id, url: job.html_url }));

            const failedJobNames = failedJobs.map(j => j.name).join(', ');

            core.setOutput('run_id', String(runId));
            core.setOutput('run_url', runUrl);
            core.setOutput('branch', branch);
            core.setOutput('commit', commit);
            core.setOutput('workflow_name', workflowName);
            core.setOutput('failed_jobs', failedJobNames);
            core.setOutput('triggered_event', triggeredEvent);

            console.log(`Workflow: ${workflowName}`);
            console.log(`Branch: ${branch} | Commit: ${commit}`);
            console.log(`Failed jobs: ${failedJobNames}`);
            return failedJobs;

      - name: Ensure all Ralph Loop labels exist
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = [
              { name: 'ralph-loop',   color: 'ff6b35', description: 'Managed by the Ralph Loop self-healing workflow' },
              { name: 'auto-fix',     color: '0075ca', description: 'Created by auto-fix workflow' },
              { name: 'copilot',      color: '7057ff', description: 'Assigned to Copilot for fixing' },
              { name: 'needs-human',  color: 'd93f0b', description: 'Escalated — requires human intervention' },
              { name: 'vault-agent',  color: 'e4e669', description: 'Vault Agent provisioning required' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ...label,
                  });
                }
              }
            }

      - name: Check for existing open Ralph Loop issue (dedup)
        id: check-existing
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ steps.gather-context.outputs.branch }}';
            const workflowName = '${{ steps.gather-context.outputs.workflow_name }}';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ralph-loop',
              per_page: 50,
            });

            // Find existing issue for same branch + workflow
            const existing = issues.data.find(issue =>
              issue.title.includes(workflowName) &&
              issue.title.includes(branch)
            );

            if (existing) {
              // Count retries by looking at the ralph-loop label in comments
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                per_page: 100,
              });
              const retryCount = comments.data.filter(c =>
                c.body.includes('Ralph Loop retry')
              ).length;

              core.setOutput('existing_issue', String(existing.number));
              core.setOutput('retry_count', String(retryCount));
              core.setOutput('issue_url', existing.html_url);
              console.log(`Found existing issue #${existing.number} (retry ${retryCount})`);
            } else {
              core.setOutput('existing_issue', '');
              core.setOutput('retry_count', '0');
              core.setOutput('issue_url', '');
              console.log('No existing issue found — will create new one.');
            }

      - name: Determine escalation status
        id: escalation
        run: |
          RETRIES="${{ steps.check-existing.outputs.retry_count }}"
          MAX="${{ env.MAX_RETRIES }}"
          if [ "$RETRIES" -ge "$MAX" ]; then
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            echo "🚨 Max retries ($MAX) reached — escalating to human"
          else
            echo "escalate=false" >> "$GITHUB_OUTPUT"
            echo "Retry $RETRIES of $MAX"
          fi

      - name: Create new Ralph Loop issue (first failure)
        if: steps.check-existing.outputs.existing_issue == ''
        id: create-issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = '${{ steps.gather-context.outputs.run_url }}';
            const branch = '${{ steps.gather-context.outputs.branch }}';
            const commit = '${{ steps.gather-context.outputs.commit }}';
            const failedJobs = '${{ steps.gather-context.outputs.failed_jobs }}';
            const workflowName = '${{ steps.gather-context.outputs.workflow_name }}';
            const maxRetries = '${{ env.MAX_RETRIES }}';
            const timestamp = new Date().toISOString();

            const body = [
              '## CI Failure — Ralph Loop Activated',
              '',
              `**Workflow:** ${workflowName}`,
              `**Branch:** \`${branch}\``,
              `**Commit:** \`${commit}\``,
              `**Failed Jobs:** ${failedJobs}`,
              `**Run:** [View full logs](${runUrl})`,
              `**Timestamp:** ${timestamp}`,
              `**Retry:** 0 of ${maxRetries}`,
              '',
              '---',
              '',
              '## Instructions for @copilot',
              '',
              '1. **Read the full CI logs** at the link above.',
              '2. **Identify the root cause** of the failure in the failed jobs: ' + failedJobs,
              '3. **Fix the issue** following the MVI Contract standard (`skills/mvi-contract/SKILL.md`).',
              '4. **Open a PR** targeting `' + branch + '` with:',
              '   - A clear description of what failed and what was fixed',
              '   - All acceptance gates passing (TypeScript check, unit tests, E2E tests)',
              '5. **Reference this issue** in the PR description with `Fixes #[issue-number]`.',
              '',
              '> ⚠️  **If the failure is a missing credential or vault error:**  ',
              '> Trigger `vault-provisioning.yml` first, then fix the code.',
              '',
              'Do NOT close this issue manually. It auto-closes when the fix PR is merged and CI passes.',
              '',
              `The Ralph Loop will retry up to ${maxRetries} times. After that, a human must intervene.`,
              '',
              '---',
              '_This issue was created automatically by the Ralph Loop (`ralph-loop.yml`)._',
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Ralph Loop] ${workflowName} failed — ${branch}@${commit}`,
              body,
              labels: ['ralph-loop', 'auto-fix', 'copilot'],
              assignees: [context.repo.owner],
            });

            core.setOutput('issue_number', String(issue.data.number));
            console.log(`Created Ralph Loop issue #${issue.data.number}`);

      - name: Add retry comment to existing issue
        if: steps.check-existing.outputs.existing_issue != '' && steps.escalation.outputs.escalate == 'false'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt('${{ steps.check-existing.outputs.existing_issue }}');
            const retryCount = parseInt('${{ steps.check-existing.outputs.retry_count }}') + 1;
            const maxRetries = parseInt('${{ env.MAX_RETRIES }}');
            const runUrl = '${{ steps.gather-context.outputs.run_url }}';
            const commit = '${{ steps.gather-context.outputs.commit }}';
            const failedJobs = '${{ steps.gather-context.outputs.failed_jobs }}';
            const timestamp = new Date().toISOString();

            const body = [
              `## Ralph Loop retry ${retryCount} of ${maxRetries} — ${timestamp}`,
              '',
              `The previous fix attempt did not resolve the failure.`,
              '',
              `**New failure:** [View logs](${runUrl})`,
              `**Commit:** \`${commit}\``,
              `**Failed Jobs:** ${failedJobs}`,
              '',
              `@copilot — please re-examine the logs and try again. ${maxRetries - retryCount} retries remaining before human escalation.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
            console.log(`Added retry comment to issue #${issueNumber}`);

      - name: Escalate to human after max retries
        if: steps.check-existing.outputs.existing_issue != '' && steps.escalation.outputs.escalate == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt('${{ steps.check-existing.outputs.existing_issue }}');
            const runUrl = '${{ steps.gather-context.outputs.run_url }}';
            const maxRetries = '${{ env.MAX_RETRIES }}';
            const timestamp = new Date().toISOString();

            // Add escalation comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `## 🚨 Ralph Loop Escalation — ${timestamp}`,
                '',
                `The Ralph Loop has exhausted all ${maxRetries} retries without a successful fix.`,
                '',
                `**This issue now requires human intervention.**`,
                '',
                `[Latest failure logs](${runUrl})`,
                '',
                'Please review the full history of this issue, examine the CI logs, and fix the root cause manually.',
                '',
                '_The Ralph Loop has paused retries for this failure._',
              ].join('\n'),
            });

            // Remove copilot label, add needs-human
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'copilot',
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['needs-human'],
            });

            console.log(`Escalated issue #${issueNumber} to human (max retries reached)`);

      - name: Summary
        if: always()
        run: |
          echo "## Ralph Loop Summary"
          echo "Workflow: ${{ steps.gather-context.outputs.workflow_name }}"
          echo "Branch: ${{ steps.gather-context.outputs.branch }}"
          echo "Commit: ${{ steps.gather-context.outputs.commit }}"
          echo "Failed jobs: ${{ steps.gather-context.outputs.failed_jobs }}"
          echo ""
          if [ -n "${{ steps.create-issue.outputs.issue_number }}" ]; then
            echo "✅ Created new Ralph Loop issue #${{ steps.create-issue.outputs.issue_number }}"
          elif [ "${{ steps.escalation.outputs.escalate }}" = "true" ]; then
            echo "🚨 Escalated to human — max retries reached"
          else
            echo "🔁 Added retry comment to issue #${{ steps.check-existing.outputs.existing_issue }}"
          fi
