# Copy to .github/dependabot.yml in your app repo
# Replace OWNER_USERNAME with your GitHub username
# See DEPENDABOT_STANDARD.md for full documentation

version: 2

updates:
  # ── npm / pnpm / yarn ──────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "OWNER_USERNAME"                    # CONFIGURE: replace with your GitHub username
    reviewers:
      - "OWNER_USERNAME"                    # CONFIGURE: replace with your GitHub username
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Group patch and minor updates into a single PR per type — reduces PR noise
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Major version bumps always require manual review — never auto-merged
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # ── Docker ─────────────────────────────────────────────────────────────────
  # Uncomment if your project uses Docker
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
