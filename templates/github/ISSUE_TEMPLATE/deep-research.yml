name: 🔬 Deep Research (Universal)
description: Use for any issue — everything gets deep-researched before execution.
title: "[Deep Research] "
labels: ["deep-research", "triage", "triage:new"]
body:
  - type: markdown
    attributes:
      value: |
        ## Deep Research — default path

        Every issue uses this template so a research swarm can:
        - validate assumptions
        - find current best tools / patterns
        - cross-check sources across regions and ecosystems

        After research, convert findings into a concrete, testable MVI.

  - type: textarea
    id: request
    attributes:
      label: What you want (plain language is fine)
      description: Describe the outcome you want. The research team will rewrite this into an MVI contract.
      placeholder: |
        e.g. "Bug: login fails on iOS when returning from background."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / constraints
      description: Links, screenshots, logs, deadlines, stack, budget limits, risk tolerance.
      placeholder: |
        - repo: …
        - environment: …
        - related issues/PRs: …
        - constraints: …
    validations:
      required: false

  - type: textarea
    id: research-scope
    attributes:
      label: Research scope (defaults)
      description: Edit if needed. Keep it broad when risk is high.
      value: |
        - [x] Cross-check results across multiple ecosystems (GitHub, GitLab, Bitbucket, Gitee).
        - [x] Check non-US sources where relevant.
        - [x] Prefer primary sources (docs, specs, code, changelogs) over reviews.
        - [x] Assess trust: provenance, incentives, independent confirmations.
        - [x] Capture findings in journal + open follow-up issues/projects when warranted.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (optional)
      description: If you already know how we’ll verify success, list it.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: false

