name: OpenHands System WR (Quick / Internal)
description: Lightweight WR for low-risk, internal, or agent-driven work. The auto-classifier fills routing fields from your description.
title: "[WR] "
labels:
  - work-request
  - weekly-research
  - wr:in-progress
  - deep-research
  - openrouter
  - role:orchestrator
  - quick
  - OpenHands
body:
  - type: markdown
    attributes:
      value: |
        ## OpenHands System WR

        Lightweight intake for low-risk, internal, or agent-driven work.
        Use this when the heavy `Work Request` form (the first card in the
        chooser) would be overkill — e.g. small internal scripts, follow-up
        fixes, agent-routed automation tasks.

        Title-only intake is allowed. If you only have a title, submit it and let
        research / the orchestrator fill the routing fields from there.
        Every routing dropdown can be inferred by
        [`wr-auto-classify.yml`](../workflows/wr-auto-classify.yml).

  - type: dropdown
    id: output_type
    attributes:
      label: Output Type (optional)
      description: What are you asking OpenHands to create or change?
      options:
        - production-app
        - desktop-tool
        - sellable-pdf
        - technical-documentation
        - client-code-task
        - project-management-doc
        - internal-script-automation
        - cli-product
        - mcp-product
        - api-product
        - invention-flow
    validations:
      required: false

  - type: dropdown
    id: research_mode
    attributes:
      label: Research Mode
      description: How aggressively should current tools, APIs, competitors, and workflows be researched? Leave on 'auto-classify' to let the agent decide.
      options:
        - auto-classify
        - standard
        - deepresearch
    validations:
      required: false

  - type: dropdown
    id: delivery_mode
    attributes:
      label: Delivery Mode
      description: How should OpenHands handle the output? Leave on 'auto-classify' to let the agent decide.
      options:
        - auto-classify
        - build-direct
        - build-with-brief-options
        - proposal-first
    validations:
      required: false

  - type: dropdown
    id: iteration_mode
    attributes:
      label: Iteration Mode
      description: How should iteration be handled? Leave on 'auto-classify' to let the agent decide.
      options:
        - auto-classify
        - single-pass
        - multi-iteration
    validations:
      required: false

  - type: dropdown
    id: lifecycle_mode
    attributes:
      label: Lifecycle Mode
      description: Is this net-new work, a refresh, or just an audit? Leave on 'auto-classify' to let the agent decide.
      options:
        - auto-classify
        - new-build
        - refresh-existing
        - audit-only
    validations:
      required: false

  - type: dropdown
    id: commercial_mode
    attributes:
      label: Commercial Mode
      description: How should this be thought of commercially? Leave on 'auto-classify' to let the agent decide.
      options:
        - auto-classify
        - digital-product
        - saas-app
        - api-usage
        - license
        - client-billable
        - internal-only
    validations:
      required: false

  - type: dropdown
    id: deployment_target
    attributes:
      label: Deployment Target
      description: Where should this end up running or being delivered? Leave on 'auto-classify' to let the agent decide.
      options:
        - auto-classify
        - none
        - vercel
        - desktop-env
        - client-env
        - docs-only
        - package-manager
        - api-host
    validations:
      required: false

  - type: dropdown
    id: launch_priority
    attributes:
      label: Launch Priority
      description: How important is launch speed for this request? Leave on 'auto-classify' to let the agent decide based on urgency cues in your description.
      options:
        - auto-classify
        - low
        - medium
        - high
        - urgent
    validations:
      required: false

  - type: textarea
    id: high_level_goal
    attributes:
      label: High-Level Goal
      description: What are you actually trying to achieve?
      placeholder: |
        Example:
        Refresh an MCP I built 6 months ago, check if it is still commercially viable,
        and only rebuild it if the market and tooling still support it.
    validations:
      required: false

  - type: textarea
    id: problem_to_solve
    attributes:
      label: Problem To Solve
      description: What pain/problem/user need is this addressing? Optional — the classifier will infer from High-Level Goal if blank.
      placeholder: |
        Describe the real user pain, who has it, and what happens if it is not solved.
    validations:
      required: false

  - type: textarea
    id: success_definition
    attributes:
      label: Success Definition
      description: What would make this worth doing? Optional — the classifier will infer from High-Level Goal if blank.
      placeholder: |
        Example:
        A shippable CLI with strong install UX, differentiated value, and a realistic path to paid adoption.
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and Must-Haves
      description: Any hard constraints on tools, budget, hosting, stack, legal, or timeline?
      placeholder: |
        Example:
        Prefer FOSS or low-cost tools, avoid paid APIs unless justified, keep trust/audit trail in GitHub.
    validations:
      required: false

  - type: textarea
    id: existing_assets
    attributes:
      label: Existing Assets / Repos / Links
      description: What already exists that should be reused, audited, or refreshed?
      placeholder: |
        Include repo paths, docs, live URLs, packages, APIs, MCPs, PDFs, old notes, or prior experiments.
    validations:
      required: false

  - type: textarea
    id: cutting_edge_notes
    attributes:
      label: Cutting-Edge Notes
      description: Optional notes on how aggressively to look for the newest options.
      placeholder: |
        Example:
        If there is a new 2025–2026 API, agent framework, or MCP pattern that materially improves this, surface it.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### After implementation — PR and continuation

        Permanent for **every** WR type (including this quick/internal form): when the
        work is implemented, the run must not stop at the issue.

        - **Open one PR** that contains the full required bundle (not a partial patch).
        - **Continue the loop:** reset the routing labels (remove `wr:code`) and let the
          PR lifecycle / review / merge workflows carry it forward automatically.
        - **If it stalls,** add `wr:reset` to force a fresh WR PR/artifact pass
          (`wr-pr-creation.yml`) instead of leaving the issue parked.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Confirm the intended operating behavior. Permanent for every WR type.
      options:
        - label: This WR defines a bundled outcome, not just a minimum acceptable patch.
        - label: Explicitly requested secondary items should not be silently deferred.
        - label: If the PR is partial, the blocker must be documented.
        - label: The PR should reflect the WR's required bundle and definition of done.
        - label: After implementation, open a PR and continue the loop (reset routing labels / trigger downstream workflows) instead of stopping at the issue.
