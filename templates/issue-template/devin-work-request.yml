name: Devin Work Request
description: Research, score, route, and build only when appropriate.
title: "[WR] "
labels:
  - work-request
  - devin
body:
  - type: markdown
    attributes:
      value: |
        ## Devin Work Request
        This form is the intake layer for revvel-standards.

        Rules:
        - Deepresearch means research deeply, not auto-build.
        - Output Type is the hard constraint on the deliverable.
        - Every request should be researched and scored before implementation.
        - Weak ideas should be held or archived instead of built.

  - type: dropdown
    id: output_type
    attributes:
      label: Output Type
      description: What is the primary deliverable?
      options:
        - production-app
        - desktop-tool
        - sellable-pdf
        - technical-documentation
        - client-code-task
        - project-management-doc
        - internal-script-automation
        - cli-product
        - mcp-product
        - api-product
        - invention-flow
    validations:
      required: true

  - type: dropdown
    id: research_mode
    attributes:
      label: Research Mode
      description: How aggressively should current tools, APIs, competitors, and workflows be researched?
      options:
        - standard
        - deepresearch
    validations:
      required: true

  - type: dropdown
    id: delivery_mode
    attributes:
      label: Delivery Mode
      description: How should Devin handle the output?
      options:
        - build-direct
        - build-with-brief-options
        - proposal-first
    validations:
      required: true

  - type: dropdown
    id: iteration_mode
    attributes:
      label: Iteration Mode
      description: How should iteration be handled?
      options:
        - single-pass
        - multi-iteration
    validations:
      required: true

  - type: dropdown
    id: lifecycle_mode
    attributes:
      label: Lifecycle Mode
      description: Is this net-new work, a refresh, or just an audit?
      options:
        - new-build
        - refresh-existing
        - audit-only
    validations:
      required: true

  - type: dropdown
    id: commercial_mode
    attributes:
      label: Commercial Mode
      description: How should this be thought of commercially?
      options:
        - digital-product
        - saas-app
        - api-usage
        - license
        - client-billable
        - internal-only
    validations:
      required: true

  - type: dropdown
    id: deployment_target
    attributes:
      label: Deployment Target
      description: Where should this end up running or being delivered?
      options:
        - none
        - vercel
        - desktop-env
        - client-env
        - docs-only
        - package-manager
        - api-host
    validations:
      required: true

  - type: dropdown
    id: launch_priority
    attributes:
      label: Launch Priority
      description: How important is launch speed for this request?
      options:
        - low
        - medium
        - high
        - urgent
    validations:
      required: true

  - type: textarea
    id: high_level_goal
    attributes:
      label: High-Level Goal
      description: What are you actually trying to achieve?
      placeholder: |
        Example:
        Refresh an MCP I built 6 months ago, check if it is still commercially viable,
        and only rebuild it if the market and tooling still support it.
    validations:
      required: true

  - type: textarea
    id: problem_to_solve
    attributes:
      label: Problem To Solve
      description: What pain/problem/user need is this addressing?
      placeholder: |
        Describe the real user pain, who has it, and what happens if it is not solved.
    validations:
      required: true

  - type: textarea
    id: success_definition
    attributes:
      label: Success Definition
      description: What would make this worth doing?
      placeholder: |
        Example:
        A shippable CLI with strong install UX, differentiated value, and a realistic path to paid adoption.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and Must-Haves
      description: Any hard constraints on tools, budget, hosting, stack, legal, or timeline?
      placeholder: |
        Example:
        Prefer FOSS or low-cost tools, avoid paid APIs unless justified, keep trust/audit trail in GitHub.
    validations:
      required: false

  - type: textarea
    id: existing_assets
    attributes:
      label: Existing Assets / Repos / Links
      description: What already exists that should be reused, audited, or refreshed?
      placeholder: |
        Include repo paths, docs, live URLs, packages, APIs, MCPs, PDFs, old notes, or prior experiments.
    validations:
      required: false

  - type: textarea
    id: cutting_edge_notes
    attributes:
      label: Cutting-Edge Notes
      description: Optional notes on how aggressively to look for the newest options.
      placeholder: |
        Example:
        If there is a new 2025–2026 API, agent framework, or MCP pattern that materially improves this, surface it.
    validations:
      required: false

  - type: checkboxes
    id: execution_acknowledgements
    attributes:
      label: Execution Acknowledgements
      description: Confirm the operating rules for this request.
      options:
        - label: I want research and viability scoring before implementation.
        - label: Deepresearch should not automatically trigger a build.
        - label: If this idea scores poorly, hold or archive it instead of building it.
        - label: Output Type should remain the hard constraint unless I explicitly change it.
