description: "Tests for [skill-name] skill"

providers:
  - id: anthropic:claude-haiku-4-5
    config:
      temperature: 0

prompts:
  - id: skill-system
    raw: |
      [Paste the skill's system prompt here]

tests:
  # Happy path: typical use case
  - description: "Should handle typical use case successfully"
    vars:
      user_message: "[typical user input]"
    assert:
      - type: contains
        value: "[expected output fragment]"
      - type: not-contains
        value: "error"
      - type: not-contains
        value: "undefined"

  # Edge case: empty input
  - description: "Should handle empty input gracefully"
    vars:
      user_message: ""
    assert:
      - type: not-contains
        value: "error"
      - type: not-contains
        value: "null"

  # Error handling: invalid input
  - description: "Should handle invalid input without crashing"
    vars:
      user_message: "[invalid or unexpected input]"
    assert:
      - type: not-contains
        value: "undefined"
      - type: not-contains
        value: "null"
