skill: [skill-name]
version: "1.0.0"
title: "[Skill Title]"
description: |
  [One-sentence description of what this skill does.]
category: "[Category]"
lifecycle: ephemeral
status: beta
author: "[Author Name]"
date: "[DATE]"

triggers:
  - "[keyword1]"
  - "[keyword2]"
  - "[keyword3]"

models:
  primary: claude-sonnet-4-5
  fast: claude-haiku-4-5

persona:
  enabled: false
  # Set to true and configure if this skill uses a persona
  # name: "Scout"
  # file: persona.yml

system_prompt: |
  [Complete system prompt for this skill. Include all rules, behaviors,
  and constraints. This is what the AI reads before every interaction
  in this skill session.]

tests:
  path: "skills/[skill-name]/tests/promptfoo.yml"

documentation:
  skill_file: "skills/[skill-name]/SKILL.md"
