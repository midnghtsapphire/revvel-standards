[project]
name = "[app_name]-mcp"
version = "0.1.0"
description = "[APP_NAME] MCP Server — built with FastMCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
"[app_name]-mcp" = "mcp_server.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
