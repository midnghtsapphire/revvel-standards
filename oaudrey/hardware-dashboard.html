<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>oAudrey — Hardware Selection</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<header class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
  <h1 class="text-xl font-semibold">Hardware Selection</h1>
  <a href="index.html" class="text-sm text-sky-400 hover:underline">← Hub</a>
</header>
<main class="px-6 py-8 max-w-6xl mx-auto">
  <section class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
    <article class="rounded-xl bg-slate-900 p-5 border border-slate-800">
      <h2 class="text-lg font-semibold">CPU Fallback</h2>
      <p class="text-slate-400 text-sm mt-1">Batch inference, low-cost dev loops.</p>
      <p class="mt-3 text-emerald-400 text-sm">$0.01–$0.10 / hr</p>
    </article>
    <article class="rounded-xl bg-slate-900 p-5 border border-slate-800">
      <h2 class="text-lg font-semibold">T4 / L4 GPU</h2>
      <p class="text-slate-400 text-sm mt-1">Real-time inference, small training.</p>
      <p class="mt-3 text-emerald-400 text-sm">$0.35–$0.80 / hr</p>
    </article>
    <article class="rounded-xl bg-slate-900 p-5 border border-slate-800">
      <h2 class="text-lg font-semibold">A100 / H100</h2>
      <p class="text-slate-400 text-sm mt-1">Large model training, reserved capacity.</p>
      <p class="mt-3 text-emerald-400 text-sm">$2.00–$8.00 / hr</p>
    </article>
  </section>

  <section class="mt-8 rounded-xl bg-slate-900 p-5 border border-slate-800">
    <h2 class="text-lg font-semibold mb-2">JIT Provisioning Status</h2>
    <pre id="status" class="text-xs text-slate-300 whitespace-pre-wrap">Detecting…</pre>
  </section>
</main>
<script>
  // Purely client-side placeholder; real dashboard would fetch from an API.
  const el = document.getElementById('status');
  el.textContent = JSON.stringify({
    device: 'cpu',
    name: 'cpu-fallback',
    memory_mb: 0,
    note: 'GPU probe runs server-side via cuda_mlops_wrapper.py'
  }, null, 2);
</script>
</body>
</html>
