<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hardware Selection — oAudrey</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div class="max-w-6xl mx-auto p-6">
  <header class="mb-8">
    <h1 class="text-3xl font-bold">Hardware Selection Dashboard</h1>
    <p class="text-slate-400 mt-1">JIT compute planner — pick the cheapest tier that fits the workload.</p>
  </header>

  <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800">
      <h2 class="text-xl font-semibold mb-4">Workload</h2>
      <label class="block text-sm text-slate-400 mb-1">Memory required (GB)</label>
      <input id="mem" type="number" value="12" min="0" step="1"
        class="w-full bg-slate-800 rounded-lg px-3 py-2 mb-4 border border-slate-700" />
      <label class="block text-sm text-slate-400 mb-1">Latency SLO (ms)</label>
      <input id="lat" type="number" value="200" min="1" step="1"
        class="w-full bg-slate-800 rounded-lg px-3 py-2 mb-4 border border-slate-700" />
      <button id="go" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-lg py-2 font-semibold">
        Recommend Hardware
      </button>
    </div>

    <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800">
      <h2 class="text-xl font-semibold mb-4">Recommendation</h2>
      <div id="out" class="space-y-2 text-sm">
        <p class="text-slate-400">Enter workload and click recommend.</p>
      </div>
    </div>
  </section>

  <section class="mt-8 bg-slate-900 rounded-2xl p-6 border border-slate-800">
    <h2 class="text-xl font-semibold mb-4">Price Table (USD / hour, approx)</h2>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-center">
      <div class="bg-slate-800 rounded-lg p-3"><div class="text-xs text-slate-400">CPU</div><div class="font-bold">$0.05</div></div>
      <div class="bg-slate-800 rounded-lg p-3"><div class="text-xs text-slate-400">T4</div><div class="font-bold">$0.35</div></div>
      <div class="bg-slate-800 rounded-lg p-3"><div class="text-xs text-slate-400">A10</div><div class="font-bold">$0.75</div></div>
      <div class="bg-slate-800 rounded-lg p-3"><div class="text-xs text-slate-400">A100</div><div class="font-bold">$1.90</div></div>
      <div class="bg-slate-800 rounded-lg p-3"><div class="text-xs text-slate-400">H100</div><div class="font-bold">$3.50</div></div>
    </div>
  </section>
</div>

<script>
const PRICES = { cpu: 0.05, t4: 0.35, a10: 0.75, a100: 1.90, h100: 3.50 };
function selectHardware(gb, ms) {
  if (gb <= 1 && ms >= 1000) return 'cpu';
  if (gb <= 14) return 't4';
  if (gb <= 22) return 'a10';
  if (gb <= 78) return 'a100';
  return 'h100';
}
document.getElementById('go').addEventListener('click', () => {
  const gb = parseFloat(document.getElementById('mem').value) || 0;
  const ms = parseInt(document.getElementById('lat').value) || 1;
  const tier = selectHardware(gb, ms);
  const price = PRICES[tier];
  const out = document.getElementById('out');
  out.innerHTML = `
    <div class="flex justify-between"><span class="text-slate-400">Tier</span><span class="font-bold uppercase">${tier}</span></div>
    <div class="flex justify-between"><span class="text-slate-400">Hourly</span><span>$${price.toFixed(2)}</span></div>
    <div class="flex justify-between"><span class="text-slate-400">Daily (24h)</span><span>$${(price*24).toFixed(2)}</span></div>
    <div class="flex justify-between"><span class="text-slate-400">Monthly (730h)</span><span>$${(price*730).toFixed(2)}</span></div>
  `;
});
</script>
</body>
</html>
