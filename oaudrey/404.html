<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found · oAudrey</title>
    <meta name="robots" content="noindex" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              void: "#0B0F1A",
              carbon: "#121828",
              steel: "#1E2638",
              mist: "#8A93A6",
              ice: "#E7ECF5",
              iris: "#7C5CFF",
              cyan: "#3DDCFF",
              gold: "#F7C948",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ['"JetBrains Mono"', "ui-monospace", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: #0b0f1a;
        color: #e7ecf5;
        -webkit-font-smoothing: antialiased;
      }
      .aurora {
        background:
          radial-gradient(
            900px 500px at 20% 20%,
            rgba(124, 92, 255, 0.3),
            transparent 60%
          ),
          radial-gradient(
            700px 400px at 80% 30%,
            rgba(61, 220, 255, 0.2),
            transparent 60%
          );
      }
    </style>
  </head>
  <body
    class="font-sans text-ice min-h-screen flex flex-col items-center justify-center relative overflow-hidden"
  >
    <div class="absolute inset-0 aurora" aria-hidden="true"></div>
    <main class="relative z-10 text-center px-6 py-20">
      <div
        class="font-mono text-[11px] uppercase tracking-widest text-mist mb-4"
      >
        // 404 — Not Found
      </div>
      <p
        class="font-black text-[120px] leading-none bg-gradient-to-r from-iris via-cyan to-iris bg-clip-text text-transparent select-none"
        role="presentation"
      >
        404
      </p>
      <h1 class="mt-4 text-3xl md:text-5xl font-extrabold tracking-tight">
        Page not found.
      </h1>
      <p class="mt-4 text-mist max-w-md mx-auto">
        The page you're looking for doesn't exist or has moved. Head back to the
        hub.
      </p>
      <a
        href="/"
        class="mt-8 inline-flex items-center bg-gradient-to-r from-iris to-cyan px-6 py-4 font-mono text-xs font-bold uppercase tracking-widest text-void hover:opacity-90"
      >
        ← Back to oAudrey Hub
      </a>
    </main>
  </body>
</html>
