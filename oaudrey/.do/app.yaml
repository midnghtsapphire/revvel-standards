name: oaudrey-hub
region: nyc

# oAudrey Hub — static landing site for Freedom Angel Corp
# Deployed via GitHub Actions (deploy-oaudrey.yml) using doctl.
# Domain: oaudrey.com (Cloudflare DNS → App Platform ingress)
# 2026-11-11 MarketShipper: the line above previously said Namecheap DNS to
# DigitalOcean nameservers. Audrey said DNS for her domains is on Cloudflare.
# The pre-change sentence is in git history.

static_sites:
  - name: oaudrey-landing
    github:
      repo: midnghtsapphire/revvel-standards
      branch: main
      deploy_on_push: true
    source_dir: /oaudrey
    output_dir: /
    index_document: index.html
    error_document: 404.html
    routes:
      - path: /
    envs:
      - key: ENVIRONMENT
        value: production
        scope: RUN_AND_BUILD_TIME

  - name: fieldwork-landing
    github:
      repo: midnghtsapphire/revvel-standards
      branch: main
      deploy_on_push: true
    source_dir: /fieldwork
    output_dir: /
    index_document: index.html
    error_document: 404.html
    routes:
      - path: /

  - name: audit-landing
    github:
      repo: midnghtsapphire/revvel-standards
      branch: main
      deploy_on_push: true
    source_dir: /oaudrey/audit
    output_dir: /
    index_document: index.html
    error_document: 404.html
    routes:
      - path: /

# Custom domains — declaring these here means `doctl apps create/update` registers
# them automatically, removing the need for a manual step in the DO dashboard.
# DNS (Cloudflare) must point to the App Platform ingress
# 2026-11-11 MarketShipper: the line above previously said Namecheap. Audrey
# said DNS for her domains is on Cloudflare. Do not move the zone to
# DigitalOcean nameservers. The pre-change sentence is in git history.
# before these domains become active. The `.github/workflows/sync-oaudrey-dns.yml`
# workflow handles that automatically after a successful deploy if registrar
# credentials are provisioned.
# See: standards/OAUDREY_DEPLOYMENT_STANDARD.md
domains:
  - domain: oaudrey.com
    type: PRIMARY
  - domain: www.oaudrey.com
    type: ALIAS
  - domain: fieldwork.oaudrey.com
    type: ALIAS
  - domain: audit.oaudrey.com
    type: ALIAS
