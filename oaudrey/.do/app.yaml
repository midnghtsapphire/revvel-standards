name: oaudrey-hub
region: nyc

# oAudrey Hub — static landing site for Freedom Angel Corp
# Deployed via GitHub Actions (deploy-oaudrey.yml) using doctl.
# Domain: oaudrey.com (Namecheap DNS → DigitalOcean nameservers)

static_sites:
  - name: oaudrey-landing
    github:
      repo: midnghtsapphire/revvel-standards
      branch: main
      deploy_on_push: true
    source_dir: /oaudrey
    output_dir: /
    index_document: index.html
    error_document: 404.html
    routes:
      - path: /
    envs:
      - key: ENVIRONMENT
        value: production
        scope: RUN_AND_BUILD_TIME

  - name: fieldwork-landing
    github:
      repo: midnghtsapphire/revvel-standards
      branch: main
      deploy_on_push: true
    source_dir: /fieldwork
    output_dir: /
    index_document: index.html
    error_document: 404.html
    routes:
      - path: /fieldwork

# Domain configuration
# After deploying, point your Namecheap domain to DigitalOcean nameservers:
#   ns1.digitalocean.com
#   ns2.digitalocean.com
#   ns3.digitalocean.com
# Then add the domain in the DigitalOcean App Platform dashboard.
# See: standards/OAUDREY_DEPLOYMENT_STANDARD.md
