<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Connector Matrix</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;margin:1.5rem;color:#111}
  h1{margin:0 0 .25rem}
  .meta{color:#666;margin-bottom:1rem}
  .controls{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  input,select{padding:.4rem .5rem;font:inherit;border:1px solid #ccc;border-radius:6px}
  table{border-collapse:collapse;width:100%}
  th,td{border-bottom:1px solid #eee;padding:.4rem .55rem;text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:#fafafa;cursor:pointer}
  code{background:#f4f4f4;padding:.1rem .3rem;border-radius:4px}
  .a{color:#138000;font-weight:600}.d{color:#0b5cad;font-weight:600}.u{color:#b06b00;font-weight:600}
  .stale{background:#fff7e0}
</style>
</head>
<body>
<h1>Connector Matrix</h1>
<div class="meta">Generated from <code>data/connectors/seed.sql</code> by <code>scripts/connectors-db.js</code>. Do not edit by hand.</div>
<div class="controls">
  <input id="q" placeholder="filter by app, plan, connection, workaround" size="36"/>
  <select id="tier"><option value="">all plan sources</option><option>audrey-confirmed</option><option>doc-verified</option><option>unverified</option></select>
  <select id="status"><option value="">all statuses</option><option>connected-working</option><option>connected</option><option>available</option><option>unverified</option></select>
  <label><input type="checkbox" id="stale"/> stale records only</label>
  <span id="count" class="meta"></span>
</div>
<table id="t"><thead><tr>
  <th data-k="app">App</th><th data-k="plan">Plan tier</th><th data-k="status">Status</th>
  <th>Connects to</th><th>Free workaround</th><th>Sources</th>
</tr></thead><tbody></tbody></table>
<script>
const DATA = [{"id":"circleci","app":"CircleCI","plan":"Performance (Audrey-confirmed, 2026-11-14). Official: 30,000 credits a month, then 15 USD per 25,000","tier_source":"audrey-confirmed","status":"connected-working","status_text":"connected and working. GitHub, Gitar and Slack per Audrey. Projects: revvel-standards, reese-reviews, amazon-books, forensicfinders. linear-a has none","connects":"GitHub (GitHub App), Gitar, Slack (Slack app), n8n (n8n node), Sonar (SonarQube Cloud) (SonarQube orb), Railway (deploy jobs), DigitalOcean (deploy jobs)","workaround":"Self-hosted runner: 20 concurrent tasks on Performance, no per-minute charge, so CARESSE can stand in for the billing-locked Actions minutes. Schedule triggers stand in for Actions cron","sources":[{"label":"CircleCI pricing","url":"https://circleci.com/pricing/"},{"label":"runner overview","url":"https://circleci.com/docs/runner/runner-overview/"}],"stale":true,"stale_note":"The older TOOL_COST_INDEX row says free tier, 6,000 build minutes a month. Performance is Audrey's word."},{"id":"circleci-slack","app":"CircleCI to Slack","plan":"Part of the CircleCI org (doc-verified). The docs state no separate fee","tier_source":"doc-verified","status":"connected-working","status_text":"connected and working. Audrey, 2026-11-14","connects":"Slack (workspace)","workaround":"The app posts workflow results and lets you approve or cancel on-hold workflows from Slack. The docs do not describe starting a pipeline from Slack. To start one, post to the pipeline trigger API from n8n or a small custom Slack app","sources":[{"label":"CircleCI Slack integration","url":"https://circleci.com/docs/guides/integration/slack-integration/"},{"label":"trigger a workflow via API v2","url":"https://support.circleci.com/en/articles/15091118-how-to-trigger-a-workflow-via-circleci-api-v2"}],"stale":false,"stale_note":""},{"id":"gitar","app":"Gitar","plan":"A higher membership she associates with Sonar (unverified). Audrey's word is a higher membership. Official tiers: Core, Pro, Enterprise. Exact tier unverified","tier_source":"unverified","status":"connected-working","status_text":"connected and working. CircleCI connected and working (Audrey); others available","connects":"GitHub, CircleCI, Linear, Slack, Jira, Plane, YouTrack","workaround":"Keep deterministic checks in CircleCI jobs and use Gitar only for judgment calls. Scope settings limit what it processes","sources":[{"label":"Gitar plans","url":"https://docs.gitar.ai/account-billing/plans"},{"label":"connect CircleCI","url":"https://docs.gitar.ai/connecting-ci/circleci"}],"stale":false,"stale_note":""},{"id":"sonarqube-cloud","app":"Sonar (SonarQube Cloud)","plan":"Unverified whether a separate subscription exists (unverified). Gitar is now a Sonar product but a Gitar plan is not documented as including SonarQube. Official Free: 50k lines of private code, 5 members","tier_source":"unverified","status":"unverified","status_text":"unverified. Checks have been seen on PRs","connects":"GitHub, CircleCI (orb), Slack (Free, Team, Enterprise), Jira (Team, Enterprise)","workaround":"The free plan covers small private repos. Unlimited for public repos","sources":[{"label":"SonarQube Cloud plans","url":"https://docs.sonarsource.com/sonarqube-cloud/administering-sonarcloud/managing-subscription/subscription-plans"},{"label":"Slack","url":"https://docs.sonarsource.com/sonarqube-cloud/administering-sonarcloud/integrations/setup"}],"stale":false,"stale_note":""},{"id":"cubic","app":"Cubic","plan":"Team (Audrey-confirmed, 2026-11-14). Official: 30 USD per developer a month, billed yearly","tier_source":"audrey-confirmed","status":"connected-working","status_text":"connected and working. As a GitHub reviewer and installed in Notion. Seat and line usage unverified","connects":"GitHub (GitHub App), Linear, Jira, Asana, GitHub Issues, Confluence, Notion","workaround":"Free for public repos. Linear and Notion context in reviews replaces a separate requirements-check tool","sources":[{"label":"cubic integrations","url":"https://docs.cubic.dev/integrations/overview"},{"label":"cubic pricing","url":"https://www.cubic.dev/pricing-plans"}],"stale":false,"stale_note":""},{"id":"chunk","app":"Chunk","plan":"CircleCI beta, on Free, Performance and Scale (Audrey-confirmed, 2026-11-14). Audrey says she has it. It is CircleCI's, not Cubic's","tier_source":"audrey-confirmed","status":"available","status_text":"available. Org setup unverified","connects":"CircleCI, GitHub","workaround":"No extra fee during beta. Uses credits and model tokens, and becomes paid at general availability","sources":[{"label":"Chunk overview","url":"https://circleci.com/docs/guides/toolkit/chunk-setup-and-overview/"}],"stale":false,"stale_note":""},{"id":"bito","app":"Bito","plan":"Paid on 2026-11-11, plan and amount unknown (unverified). Audrey says she paid. Official: Team 12 to 15 USD, Professional 20 to 25 USD per seat a month","tier_source":"unverified","status":"connected","status_text":"connected. GitHub App, `bito-ai.yml`. Plan unverified","connects":"GitHub, GitLab, Bitbucket, VS Code and JetBrains, Jira (Professional), Confluence (Professional), Google Docs (Professional)","workaround":"Same job as Gitar and Cubic. Free plan gives PR summaries","sources":[{"label":"Bito plans","url":"https://docs.bito.ai/help/billing-and-plans/overview"},{"label":"Bito features","url":"https://docs.bito.ai/ai-code-reviews-in-git/key-features"}],"stale":true,"stale_note":"The older TOOL_COST_INDEX row says CUT 2026-07-08 (D006), 0 USD. Audrey paid on 2026-11-11. The cut and the payment are not reconciled."},{"id":"notion","app":"Notion","plan":"Unknown (unverified). One member, one teamspace, no plan field readable","tier_source":"unverified","status":"connected","status_text":"connected. MCP connected. Bots installed: Composio, cubic, DEVIN_BRIDGE, Notion MCP","connects":"Slack, Linear (previews), Cubic, GitHub (sync, Business only), n8n, Notion MCP","workaround":"Notion AI connectors for Slack, GitHub and Linear need Business or Enterprise. n8n or the Notion API does the same on a free plan","sources":[{"label":"Notion pricing","url":"https://www.notion.com/pricing"},{"label":"AI connectors","url":"https://www.notion.com/help/notion-ai-connectors"}],"stale":true,"stale_note":"TOOLS_CATALOG row 68 says Free or 8 USD per user a month. Notion Plus is 10 USD per member a month."},{"id":"n8n","app":"n8n","plan":"Community, self-hosted, free. Lab on Audrey's computer, localhost only (unverified). Conflict: docs/standards/RUNNER_TARGETS.md says the operator pays about 60 USD a month for n8n and Gumloop together. Which is right is unconfirmed","tier_source":"unverified","status":"unverified","status_text":"unverified. Trial lab only","connects":"Slack (built-in node), GitHub (built-in node), Linear (built-in node), Notion (built-in node, with trigger), CircleCI (built-in node: get, get many, trigger)","workaround":"Replaces Zapier tasks and Notion's Business-only GitHub sync. Notion webhooks need a public HTTPS endpoint","sources":[{"label":"n8n CircleCI","url":"https://docs.n8n.io/integrations/builtin/credentials/circleci"},{"label":"n8n Slack","url":"https://docs.n8n.io/integrations/builtin/app-nodes/n8n-nodes-base.slack"}],"stale":true,"stale_note":"Free self-hosted Community row conflicts with RUNNER_TARGETS.md (about 60 USD a month, n8n plus Gumloop)."},{"id":"slack","app":"Slack","plan":"Unknown (oaudrey workspace) (unverified)","tier_source":"unverified","status":"connected-working","status_text":"connected and working. For CircleCI (Audrey) and MergeMe","connects":"CircleCI (app), MergeMe, Linear, Notion, Sonar (SonarQube Cloud), Gitar (Pro), Zapier, n8n","workaround":"The CircleCI docs state no fee for the Slack app and SonarQube Slack is on its Free plan. Linear Slack intake is Business","sources":[{"label":"Linear Slack","url":"https://linear.app/docs/slack"}],"stale":false,"stale_note":""},{"id":"github","app":"GitHub","plan":"Personal account behaves as Free (HTTP 403 on private-repo protection). Freedom-Angel-Corp is on the free plan with 1 seat (doc-verified, 2026-11-14). Read-only GitHub API, 2026-11-14","tier_source":"doc-verified","status":"connected-working","status_text":"connected and working","connects":"Everything above","workaround":"Self-hosted runners are free. Private repos cannot enforce merge gates without a paid plan","sources":[{"label":"GitHub plans","url":"https://docs.github.com/en/get-started/learning-about-github/githubs-plans"}],"stale":true,"stale_note":"docs/STACK.md says GitHub Enterprise (Freedom-Angel-Corp). The API reported the free plan with 1 seat."},{"id":"linear","app":"Linear","plan":"Unknown (workspace RisingAloha) (unverified). Free plan includes integrations, API and MCP","tier_source":"unverified","status":"connected","status_text":"connected. MCP connected","connects":"GitHub, Slack, Notion (previews), Zapier, Gitar, Cubic","workaround":"Free covers 250 issues and 2 teams","sources":[{"label":"Linear pricing","url":"https://linear.app/pricing"},{"label":"Linear integrations","url":"https://linear.app/integrations"}],"stale":false,"stale_note":""},{"id":"zapier","app":"Zapier","plan":"Unknown (unverified). Free: 100 tasks a month, two-step Zaps","tier_source":"unverified","status":"available","status_text":"available. MCP connected","connects":"9,000 plus apps, Linear (triggers and actions), GitHub (triggers polled every 15 minutes on Free)","workaround":"n8n replaces it once the 100 tasks run out","sources":[{"label":"Zapier pricing","url":"https://zapier.com/pricing"},{"label":"Linear to Zapier","url":"https://linear.app/docs/zapier"}],"stale":false,"stale_note":""},{"id":"higgins","app":"Higgins","plan":"Unknown (unverified). Audrey's name for an app; the product has not been identified. Another agent guessed Higgsfield, which is a guess","tier_source":"unverified","status":"unverified","status_text":"unverified","connects":"Audrey says she added it next to Gitar with CircleCI API work done","workaround":"None until Audrey names it","sources":[{"label":"Audrey, 2026-11-14","url":null}],"stale":false,"stale_note":""},{"id":"gumloop","app":"Gumloop","plan":"Unknown (unverified). docs/standards/RUNNER_TARGETS.md says the operator pays about 60 USD a month for n8n and Gumloop together. That is a repo statement, not checked against a bill","tier_source":"unverified","status":"unverified","status_text":"unverified. Listed as a runner target in the repo","connects":"—","workaround":"None recorded. RUNNER_TARGETS.md treats it as already-paid capacity","sources":[{"label":"docs/standards/RUNNER_TARGETS.md","url":null}],"stale":false,"stale_note":""}];
const tbody = document.querySelector('#t tbody');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sortK = 'app', asc = true;
function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const tier = document.getElementById('tier').value, st = document.getElementById('status').value;
  const staleOnly = document.getElementById('stale').checked;
  const rows = DATA.filter((d) => (!q || JSON.stringify(d).toLowerCase().includes(q)) &&
    (!tier || d.tier_source === tier) && (!st || d.status === st) && (!staleOnly || d.stale));
  rows.sort((a, b) => String(a[sortK] || '').localeCompare(String(b[sortK] || '')) * (asc ? 1 : -1));
  tbody.innerHTML = rows.map((d) => '<tr class="' + (d.stale ? 'stale' : '') + '">' +
    '<td><b>' + esc(d.app) + '</b>' + (d.stale ? '<br><small>stale record: ' + esc(d.stale_note) + '</small>' : '') + '</td>' +
    '<td>' + esc(d.plan) + '</td>' +
    '<td class="' + (d.status.startsWith('connected') ? 'a' : d.status === 'available' ? 'd' : 'u') + '">' + esc(d.status_text) + '</td>' +
    '<td>' + esc(d.connects) + '</td><td>' + esc(d.workaround) + '</td>' +
    '<td>' + d.sources.map((s) => s.url ? '<a href="' + esc(s.url) + '">' + esc(s.label) + '</a>' : esc(s.label)).join(', ') + '</td></tr>').join('');
  document.getElementById('count').textContent = rows.length + ' / ' + DATA.length + ' shown';
}
document.querySelectorAll('th[data-k]').forEach((th) => th.onclick = () => { const k = th.dataset.k; asc = sortK === k ? !asc : true; sortK = k; render(); });
['q', 'tier', 'status', 'stale'].forEach((id) => document.getElementById(id).addEventListener('input', render));
render();
</script>
</body>
</html>
