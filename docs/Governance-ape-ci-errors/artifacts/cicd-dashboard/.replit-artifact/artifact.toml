kind = "web"
previewPath = "/"
title = "CI/CD Governance Dashboard"
version = "1.0.0"
id = "artifacts/cicd-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25221

[services.development]
run = "pnpm --filter @workspace/cicd-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cicd-dashboard", "run", "build" ]
publicDir = "artifacts/cicd-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25221"
BASE_PATH = "/"
