# Live Deployment Registry — source of truth for each app's clickable test link.
#
# Definition of Done #1: every app ships a live URL, surfaced in its README
# under "## Live Deployment". This file feeds scripts/app_artifact_auditor.py
# and scripts/biome/inspector.js (HTTP 2xx = testable-live).
#
# Primary live surface is GitHub Pages (credit-free, always-on via static.yml).
# Vercel remains optional: when a VERCEL_TOKEN secret is present AND the
# production deployment returns 2xx, scripts/vercel_sync.py may refresh
# base_url / per-app live_url. A disabled Vercel project (HTTP 402
# DEPLOYMENT_DISABLED) must never clobber this working base_url.
#
# Fill in live_url only for standalone deployments. Leave "" to derive
# <base_url>/docs/<app>/ (preferred for docs-served apps).

# Static docs site: each app is reachable at <base_url>/docs/<app>/.
deployment:
  project: revvel-standards
  base_url: "https://midnghtsapphire.github.io/revvel-standards"

apps:
  affiliate-hub:          { path: products/affiliate-hub,          type: web, live_url: "" }
  ai-video-toolkit:       { path: products/ai-video-toolkit,       type: web, live_url: "" }
  cli-engine:             { path: products/cli-engine,             type: web, live_url: "" }
  creator-payout-tracker: { path: products/creator-payout-tracker, type: web, live_url: "" }
  graphify-evaluator:     { path: products/graphify-evaluator,     type: web, live_url: "" }
  life-insurance-lead-engine: { path: products/life-insurance-lead-engine, type: api, live_url: "" }
  life-insurance-lead-saas:   { path: products/life-insurance-lead-saas,   type: web, live_url: "" }
  music-video-creator:    { path: products/music-video-creator,    type: web, live_url: "" }
  openmythos:             { path: products/openmythos,             type: web, live_url: "" }
  prompt-generation-app:  { path: products/prompt-generation-app,  type: web, live_url: "" }
  revvel-skill-runner:    { path: products/revvel-skill-runner,    type: web, live_url: "" }
  screen-recorder-finder: { path: products/screen-recorder-finder, type: web, live_url: "" }
  ugc-review-generator:   { path: products/ugc-review-generator,   type: web, live_url: "" }
  caspian-channel-console: { path: products/caspian-channel-console, type: web, live_url: "" }
  coldtrace:              { path: coldtrace,                        type: web, live_url: "" }
  fieldwork:              { path: fieldwork,                        type: web, live_url: "" }
  osint-hub:              { path: osint-hub,                        type: web, live_url: "" }
  oaudrey:                { path: oaudrey,                          type: web, live_url: "" }
  reesereviews:           { path: reesereviews,                     type: web, live_url: "" }
  # External repo — record kept here; code lives in its own repo.
  sessiono:               { path: external, repo: midnghtsapphire/sessiono, type: web, live_url: "" }
