# Music Video Manifest Template
# Copy this file to docs/videos-music/<project-slug>/manifest.yml
# Keep all fields truthful. Never fill in a URL or status that has not been verified.

project:
  id: ""                          # unique slug, e.g. "bulletproof-love"
  title: ""                       # human-readable title
  artist: ""
  album: ""
  catalog_number: ""

# ── Inputs ──────────────────────────────────────────────────────────────────
inputs:
  wav_file: ""                    # relative path or storage URI to .wav file
  wav_exists: false               # true only if file is confirmed present
  avatar_file: ""                 # relative path or storage URI to avatar image
  avatar_exists: false
  additional_assets: []

# ── Provider ─────────────────────────────────────────────────────────────────
provider:
  name: ""                        # HeyGen | Runway | Luma | D-ID | Wav2Lip | SadTalker
  foss: false
  cost_model: ""                  # free | per-call | subscription | usage-based
  est_cost_per_run: ""
  api_key_secret: ""              # name of the environment variable holding the key
  endpoint: ""
  job_submission_method: ""       # POST | GraphQL | SDK

# ── Execution ─────────────────────────────────────────────────────────────────
execution:
  provider_job_id: ""             # filled only after job is submitted and ID returned
  submitted_at_utc: ""
  polling_interval_seconds: 30
  max_poll_attempts: 60
  last_polled_at_utc: ""

# ── Artifact ─────────────────────────────────────────────────────────────────
artifact:
  artifact_uri: ""                # storage URI where MP4 will be / is written
  video_exists: false             # true ONLY when MP4 is confirmed present at artifact_uri
  format: "mp4"
  duration_seconds: null
  file_size_bytes: null
  verified_artifact_checksum: ""
  created_at_utc: ""

# ── Publication ───────────────────────────────────────────────────────────────
publication:
  website_url: ""                 # target site, e.g. https://meetaudreyevans.com
  target_path: ""                 # path on the target site, e.g. /videos/bulletproof-love
  canonical_video_url: ""         # full public URL — blank until verified
  publish_status: "unpublished"   # unpublished | published | verified
  published_at_utc: ""

# ── Verification ──────────────────────────────────────────────────────────────
verification:
  verified_at_utc: ""             # timestamp of last successful live URL check
  http_status_at_verification: null
  verified_by: ""                 # "automated" | "human:<name>"

# ── Status ────────────────────────────────────────────────────────────────────
status:
  render_status: "draft"
  # Valid values:
  #   draft
  #   requirements_collected
  #   dependencies_identified
  #   backend_wiring_pending
  #   backend_wired
  #   execution_requested
  #   processing
  #   artifact_created
  #   stored
  #   published
  #   verified
  #   indexed
  #   failed

  failed_at_stage: ""             # stage name if render_status is "failed"
  failure_class: ""               # missing_secret | connectivity | auth_error |
                                  # rate_limit | provider_error | artifact_missing |
                                  # publish_failed | verification_failed | unknown
  failure_reason: ""              # exact error message

# ── Orchestration ─────────────────────────────────────────────────────────────
orchestration:
  last_run_id: ""
  last_run_at_utc: ""
  total_runs: 0
  models_used: []                 # list of OpenRouter model IDs used in last run
  total_token_cost_usd: ""

# ── Source of Truth ───────────────────────────────────────────────────────────
source_of_truth:
  manifest_last_updated_utc: ""
  readme_last_updated_utc: ""
  changelog_entry: ""
  catalog_indexed: false
