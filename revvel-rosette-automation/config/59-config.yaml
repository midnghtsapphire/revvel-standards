# Core Configuration
# Main settings for Revvel Rosette Automation

application:
  name: "Revvel Rosette Automation"
  version: "1.0.0"
  environment: "${ENVIRONMENT:-production}"
  debug: false
  
# GitHub integration
github:
  organization: "midnghtsapphire"
  default_repo: "revvel-standards"
  api_token: "${GITHUB_TOKEN}"
  api_url: "https://api.github.com"
  
  # Automation settings
  automation:
    auto_assign_issues: true
    auto_label: true
    auto_create_branches: true
    auto_pr_review: true
    
  # Gatekeeper integration
  gatekeeper:
    enabled: true
    watch_labels:
      - "needs-secrets"
      - "wr:auto"
      - "wr:code"
    provision_on_issue_open: true
    provision_on_pr_open: true

# Doppler integration
doppler:
  enabled: true
  api_token: "${DOPPLER_TOKEN}"
  project: "revvel-standards"
  config: "prd"
  
# Trello integration
trello:
  enabled: true
  api_key: "${TRELLO_API_KEY}"
  token: "${TRELLO_TOKEN}"
  board_id: "${TRELLO_BOARD_ID}"
  
  # Five-step workflow lists
  lists:
    todo: "${TRELLO_LIST_TODO}"
    in_progress: "${TRELLO_LIST_IN_PROGRESS}"
    review: "${TRELLO_LIST_REVIEW}"
    testing: "${TRELLO_LIST_TESTING}"
    done: "${TRELLO_LIST_DONE}"
    
  # Automation rules
  automation:
    sync_from_github: true
    sync_interval_minutes: 30
    auto_move_cards: true
    notify_on_completion: true

# Queue management
queue:
  enabled: true
  file_path: "./queue.txt"
  max_queue_size: 1000
  process_interval_seconds: 60
  retry_max_attempts: 3
  retry_delay_seconds: 300
  
# Scheduler settings
scheduler:
  enabled: true
  timezone: "America/New_York"
  
  jobs:
    - name: "daily_automation"
      schedule: "0 3 * * *"  # 3 AM daily
      command: "./scripts/cronjob.sh"
      enabled: true
      
    - name: "health_check"
      schedule: "0 * * * *"  # Every hour
      command: "python src/selfheal.py --check"
      enabled: true
      
    - name: "security_audit"
      schedule: "0 0 * * 0"  # Weekly on Sunday
      command: "python src/security.py --audit"
      enabled: true
      
    - name: "metrics_report"
      schedule: "0 0 1 * *"  # Monthly on 1st
      command: "python src/metrics.py --report monthly"
      enabled: true

# Monitoring and alerting
monitoring:
  enabled: true
  
  metrics:
    enabled: true
    port: 9090
    endpoint: "/metrics"
    
  alerts:
    github_issues: true
    email: false
    slack: false
    
  health_check:
    enabled: true
    interval_seconds: 300
    timeout_seconds: 30

# Security settings
security:
  credential_rotation:
    enabled: true
    interval_days: 90
    notify_before_days: 14
    
  audit_logging:
    enabled: true
    log_all_api_calls: true
    log_secret_access: true
    retention_days: 365
    
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_size: 10
