# Vault Warden Configuration
# HashiCorp Vault integration settings

vault:
  enabled: true
  address: "${VAULT_ADDR:-http://127.0.0.1:8200}"
  namespace: "${VAULT_NAMESPACE:-admin}"
  
  # Authentication
  auth:
    method: token  # token, approle, kubernetes, github
    token: "${VAULT_TOKEN}"
    # For AppRole auth:
    # role_id: "${VAULT_ROLE_ID}"
    # secret_id: "${VAULT_SECRET_ID}"

  # KV Secrets Engine
  kv:
    version: 2
    mount_path: "secret"
    
  # Paths for different secret types
  paths:
    credentials: "secret/data/revvel-standards/credentials"
    api_keys: "secret/data/revvel-standards/api-keys"
    github: "secret/data/revvel-standards/github"
    trello: "secret/data/revvel-standards/trello"
    doppler: "secret/data/revvel-standards/doppler"

  # Auto-rotation settings
  rotation:
    enabled: true
    interval_days: 90
    notify_before_days: 7
    
  # Audit logging
  audit:
    enabled: true
    log_path: "/var/log/vault-audit.log"

# Warden settings (monitoring/alerting)
warden:
  enabled: true
  check_interval_minutes: 60
  
  alerts:
    expiring_credentials:
      enabled: true
      threshold_days: 14
      
    failed_auth:
      enabled: true
      threshold_attempts: 3
      
    unseal_required:
      enabled: true
      
  notifications:
    github_issues: true
    email: true
    slack: false
