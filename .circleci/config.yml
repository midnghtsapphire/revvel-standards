# CircleCI Configuration for Revvel Standards
#
# Single purpose: a REAL lint + test gate (markdownlint + node --test).
# GitHub Actions owns everything else (AI PR review, CI-failure diagnosis,
# ready-for-review automation), so the old OpenRouter `pr-review` job was
# removed — it duplicated the GitHub Actions OpenRouter review and only ever
# ran when OPENROUTER_API_KEY was set in CircleCI.
#
# Cursor agent tier retired 2026-06-13; this file is unrelated to that.
#
# Pipeline ownership: ORBIT 🪐 (skills/circleci-expert/SKILL.md) — the fleet's
# CircleCI persona. Governance: standards/CIRCLECI_INTEGRATION_STANDARD.md.
# Validate locally before pushing: `circleci config validate` then eyeball
# `circleci config process .circleci/config.yml` (expands the node orb).

version: 2.1

orbs:
  node: circleci/node@5.1.0

executors:
  node-executor:
    docker:
      - image: cimg/node:22.11
  # Next 15's build needs require(esm) (Node >= 22.12); 22.11 dies with
  # ERR_REQUIRE_ESM in magic-string (CircleCI build 23308, WR #18342).
  node-next-executor:
    docker:
      - image: cimg/node:22.14

jobs:
  lint-and-test:
    executor: node-executor
    steps:
      - checkout
      # Fail fast with a clear message before the node orb's `npm ci`.
      # CircleCI job 11069 (issue #16904) died at "Installing NPM packages"
      # with EUSAGE because package.json had a duplicate "c8" key that
      # desynced the lockfile (last-key-wins → ^10.1.3 vs lock c8@12.0.0).
      # This gate uses only node built-ins so it can run pre-install.
      - run:
          name: Check package.json / lockfile integrity
          command: node scripts/check-package-integrity.js
      - node/install-packages:
          pkg-manager: npm
      # Real gate, scoped to changed Markdown so it enforces standards on new
      # work without drowning in the repo's large pre-existing lint backlog.
      - run:
          name: Lint changed Markdown (markdownlint)
          command: bash .circleci/scripts/lint-changed-markdown.sh
      # `npm test` spawns `python3 -m flake8` through
      # scripts/flake8-baseline-gate.js, and this job was red on EVERY PR —
      # including docs-only ones (#17744, #17747) that never touch Python. The
      # same commits ran `npm test` green on GitHub Actions, which is what made
      # the failure look like a flake rather than a missing dependency.
      #
      # cimg/node DOES ship python3; what it lacks is `ensurepip`, so both
      # `python3 -m venv` and the gate's own `pip install --user` fallback are
      # dead on arrival. The script installs python3-venv, then builds a venv
      # (not `pip install --user`: Ubuntu images from 24.04 mark the system
      # interpreter externally-managed under PEP 668). Prepending the venv to
      # PATH via BASH_ENV is what makes the gate's bare `python3` resolve in
      # later steps. WR #17746.
      - run:
          name: Provide Python + flake8 (required by the baseline gate)
          command: bash .circleci/scripts/install-python-flake8.sh
      # Tests run for real — a failure fails the job (no "|| echo" swallowing).
      - run:
          name: Run tests (node --test + shell)
          command: bash .circleci/scripts/run-tests.sh

  # Smoke-validate the agent-fleet registries: the persona registry must parse
  # and resolve, and the machine-readable skills index must be valid YAML.
  # Added by ORBIT — these files drive the persona comment trigger, so a broken
  # edit here silently kills every /persona summon. No npm ci needed: uses only
  # node built-ins plus a one-shot npx fetch.
  validate-registries:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Persona registry parses and resolves ORBIT
          command: |
            node --check scripts/openrouter-personas.js
            node -e "
              const { getPersona } = require('./scripts/openrouter-personas');
              const p = getPersona('orbit');
              if (p.handle !== 'orbit') throw new Error('orbit persona missing');
              console.log('persona ok:', p.emoji, p.name, '—', p.role);
            "
      - run:
          name: Skills index is valid YAML
          # js-yaml pinned so this gate is reproducible (no floating npx fetch).
          command: npx --yes js-yaml@4.1.0 skills/SKILLS_INDEX.yml > /dev/null && echo "SKILLS_INDEX.yml ok"

  # VEINS monitoring snapshot — answers the three standing questions about the
  # external V.E.I.N.S. self-healing engine: what is it changing, how frequently,
  # and are the proposals doing anything? Runs on every push; never fails the
  # pipeline (exit code swallowed with || true) — this is an observer, not a
  # gate. Output is stored as a CircleCI artifact for trend tracking.
  # Scripts: scripts/veins-snapshot.js, scripts/veins-tracker.js,
  #          scripts/veins-state-log.js
  # Doc: docs/VEINS_MONITORING_REPORT.md
  veins-monitor:
    executor: node-executor
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: VEINS Activity Snapshot (human-readable)
          command: node scripts/veins-snapshot.js || true
      - run:
          name: VEINS Activity Snapshot (JSON artifact)
          command: |
            mkdir -p /tmp/veins-artifacts
            node scripts/veins-snapshot.js --json \
              > /tmp/veins-artifacts/veins-snapshot.json || true
      # Append a compact summary row to docs/veins-history.jsonl and store it as
      # an artifact alongside veins-snapshot.json. The JSONL in-repo is the
      # committed baseline; this artifact shows the per-build cumulative history
      # (baseline + current row) so trends are readable across build artifacts.
      - run:
          name: VEINS State Log (trend tracking)
          command: |
            node scripts/veins-state-log.js \
              > /tmp/veins-artifacts/veins-state-log.txt || true
            cp docs/veins-history.jsonl \
              /tmp/veins-artifacts/veins-history.jsonl || true
      - store_artifacts:
          path: /tmp/veins-artifacts
          destination: veins-monitor

  # Deploy to Railway on main-branch merges after lint-and-test passes.
  # Division of labor: CircleCI = test gate; this job is the bridge to the
  # Railway deploy target that GitHub Actions (ship-to-market.yml) also uses.
  #
  # Human setup required (one-time):
  #   1. Get a Railway token: https://railway.app/account/tokens
  #   2. Add RAILWAY_TOKEN to CircleCI project env vars:
  #      app.circleci.com → Project Settings → Environment Variables
  #   3. Also add RAILWAY_TOKEN to GitHub Actions secrets for ship-to-market.yml.
  #
  # If RAILWAY_TOKEN is absent the step exits 0 with a clear "SKIPPED" message
  # so the rest of the main pipeline is not blocked. Once the token is set, a
  # failed railway deploy exits non-zero and fails the job (RVS-VERIFY-001:
  # exit codes reflect the postcondition, not process completion).
  deploy-railway:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Deploy to Railway
          command: |
            if [[ -z "$RAILWAY_TOKEN" ]]; then
              echo "============================================================"
              echo "SKIPPED — RAILWAY_TOKEN not set in CircleCI project env vars."
              echo "To activate: app.circleci.com → Project Settings"
              echo "             → Environment Variables → Add RAILWAY_TOKEN"
              echo "Get a token: https://railway.app/account/tokens"
              echo "============================================================"
              exit 0
            fi
            # npx, not npm install -g: cimg/node's global prefix is root-owned,
            # so `npm install -g` dies EACCES for the circleci user. npx stages
            # the CLI under the user-writable ~/.npm cache instead.
            #
            # The project must be linked explicitly: bare `railway up` opens an
            # interactive "link a project" prompt, which hangs a CI step until
            # the 10-minute no-output timeout kills it. Defaults below are the
            # lucky-light project already wired to this repo's Railway GitHub
            # integration (IDs are public in the commit status target_url);
            # override via CircleCI env vars if the target ever changes.
            PROJECT_ID="${RAILWAY_PROJECT_ID:-fda5db73-50e3-4a67-8b53-4e723630af43}"
            SERVICE_ID="${RAILWAY_SERVICE_ID:-90cbc6dc-4cb2-4ae9-a631-48748455c970}"
            npx --yes @railway/cli link --project "$PROJECT_ID" --service "$SERVICE_ID"
            # `timeout` is the hang guard: any future prompt fails in 5 minutes
            # instead of burning the full 10-minute no-output window.
            timeout 300 npx --yes @railway/cli up --detach
            echo "Deploy triggered. Check https://railway.app for service status."

  # DigitalOcean App Platform updates. Not part of pr-workflow. A merge can
  # create or update apps once DIGITALOCEAN_ACCESS_TOKEN is set. Audrey must
  # approve that before this leaves draft. Added 2026-11-11 by MarketShipper.
  affiliate-hub-do-deploy:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Update DigitalOcean app affiliate-hub when the token is set
          no_output_timeout: 15m
          command: bash .circleci/scripts/do-app-update.sh affiliate-hub

  ai-video-toolkit-do-deploy:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Update DigitalOcean app ai-video-toolkit when the token is set
          no_output_timeout: 15m
          command: bash .circleci/scripts/do-app-update.sh ai-video-toolkit

  screen-recorder-finder-do-deploy:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Update DigitalOcean app screen-recorder-finder when the token is set
          no_output_timeout: 15m
          command: bash .circleci/scripts/do-app-update.sh screen-recorder-finder

  # WR #18342: AG-UI streaming + session-resume demo kit. Zero dependencies,
  # so there is nothing to install: node built-ins only. Runs the kit's own
  # tests (stream event order, second-device resume, page load < 2 s, 7:1
  # contrast). Also runnable by hand: `cd products/halo-demo-stream && npm test`.
  demo-kit-test:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: halo-demo-stream tests
          command: cd products/halo-demo-stream && npm test

  # WR #18342 moved affiliate-hub's catalogue into app/lib/programs.mjs; this
  # proves the product still builds. Lockfile-pinned install, no scripts.
  affiliate-hub-build:
    executor: node-next-executor
    steps:
      - checkout
      - run:
          name: affiliate-hub npm ci
          command: cd products/affiliate-hub && npm ci --ignore-scripts
      - run:
          name: affiliate-hub next build
          command: cd products/affiliate-hub && npx next build

  # RVS-AGENT-001 gate: validates that no tracked files are silently deleted
  # and that every REVVEL-DISABLED block in changed files has all required
  # metadata fields (AGENT, MODEL, WR, DATE, STATUS).
  # See standards/COMMENT-DONT-DELETE.md and .circleci/scripts/check-archival-policy.sh.
  policy-check:
    executor: node-executor
    steps:
      - checkout
      - run:
          # Fetch enough history for an accurate merge-base diff.
          # 200 commits covers virtually all branches in this repo.
          name: Fetch origin/main for merge-base diff
          command: git fetch origin main --depth=200
      - run:
          name: RVS-AGENT-001 archival policy check
          command: bash .circleci/scripts/check-archival-policy.sh
          # ALLOW_DESTROY is deliberately NOT set here.
          #
          # It used to be hardcoded "false", with a comment saying the
          # allow-destroy label "is not available in CircleCI context". The
          # label is reachable — CIRCLE_PULL_REQUEST carries the PR URL — and
          # hardcoding it meant RVS-AGENT-001's sanctioned human ratification
          # path had a required check that could never turn green (#17829).
          #
          # The script resolves it now, and fails CLOSED when it cannot: an
          # unreadable label is not permission. Setting it here again would
          # restore the deadlock, so leave it to the script.

  # Product image gate for screen-recorder-finder. Builds the Dockerfile, runs the server
  # tests, and requests /health inside the container. Unrelated diffs exit 0
  # from product-diff.sh. The DigitalOcean job runs only on main and does
  # nothing when DIGITALOCEAN_ACCESS_TOKEN is unset. A green skip is not a
  # live site. Added 2026-11-11 by MarketShipper for WR #18332.
  # 2026-11-11 MarketShipper: merged onto main 3d6ae9a8. That comment described
  # an earlier draft. This file still has no DigitalOcean create/update job.
  screen-recorder-finder-image:
    executor: node-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build screen-recorder-finder image, test it, and request /health
          no_output_timeout: 20m
          command: bash .circleci/scripts/product-image-gate.sh screen-recorder-finder

  # Product image gate for ai-video-toolkit. Builds the Dockerfile, runs the server
  # tests, and requests /health inside the container. Unrelated diffs exit 0
  # from product-diff.sh. The DigitalOcean job runs only on main and does
  # nothing when DIGITALOCEAN_ACCESS_TOKEN is unset. A green skip is not a
  # live site. Added 2026-11-11 by MarketShipper for WR #18331.
  # 2026-11-11 MarketShipper: merged onto main 419abfa9. That comment described
  # an earlier draft. This file still has no DigitalOcean create/update job.
  ai-video-toolkit-image:
    executor: node-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build ai-video-toolkit image, test it, and request /health
          no_output_timeout: 20m
          command: bash .circleci/scripts/product-image-gate.sh ai-video-toolkit

  # Product image gate. Builds the Dockerfile, runs the server tests, and
  # requests /health inside the container. Unrelated diffs exit 0 from
  # product-diff.sh. This file does not create or update a DigitalOcean app.
  # Added 2026-11-11 by MarketShipper for WR #18330.
  affiliate-hub-image:
    executor: node-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build affiliate-hub image, test it, and request /health
          no_output_timeout: 20m
          command: bash .circleci/scripts/product-image-gate.sh affiliate-hub

  # Front page image gate. Builds products/oaudrey-home and requests /health
  # inside the container. This file does not create or update a DigitalOcean app.
  # Added 2026-11-11 by MarketShipper. deploy_on_push stays false in the spec.
  oaudrey-home-image:
    executor: node-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build oaudrey-home image, test it, and request /health
          no_output_timeout: 20m
          command: bash .circleci/scripts/product-image-gate.sh oaudrey-home
  # WR #18334 — build the GOAP agent-as-FTE PDF and the static landing page,
  # then require HTTP 200 from a local server. This job does not deploy, send
  # mail, or contact a prospect. The PDF it stores is the CircleCI artifact.
  agent-as-fte:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Build sales PDF and landing page, then require HTTP 200
          command: bash .circleci/scripts/build-agent-fte.sh
      - store_artifacts:
          path: /tmp/agent-fte-artifacts
          destination: agent-as-fte

workflows:
  version: 2

  # Run on every PR (non-main branches).
  pr-workflow:
    jobs:
      - lint-and-test:
          filters:
            branches:
              ignore: main
      - validate-registries:
          filters:
            branches:
              ignore: main
      - policy-check:
          filters:
            branches:
              ignore: main
      - veins-monitor:
          filters:
            branches:
              ignore: main
      - agent-as-fte:
          filters:
            branches:
              ignore: main
      - demo-kit-test:
          filters:
            branches:
              ignore: main
      - affiliate-hub-build:
          filters:
            branches:
              ignore: main
      - screen-recorder-finder-image:
          filters:
            branches:
              ignore: main
      - ai-video-toolkit-image:
          filters:
            branches:
              ignore: main
      - affiliate-hub-image:
          filters:
            branches:
              ignore: main
      - oaudrey-home-image:
          filters:
            branches:
              ignore: main

  # Run on main.
  main-workflow:
    jobs:
      - lint-and-test:
          filters:
            branches:
              only: main
      - validate-registries:
          filters:
            branches:
              only: main
      - policy-check:
          filters:
            branches:
              only: main
      - veins-monitor:
          filters:
            branches:
              only: main
      - agent-as-fte:
          filters:
            branches:
              only: main
      - demo-kit-test:
          filters:
            branches:
              only: main
      - affiliate-hub-build:
          filters:
            branches:
              only: main
      # deploy-railway runs only on main, only after the test gate is green.
      # Skips silently if RAILWAY_TOKEN is not set in CircleCI project env vars.
      - deploy-railway:
          requires:
            - lint-and-test
          filters:
            branches:
              only: main
      # App Platform writes. Draft until Audrey approves. These jobs are not
      # in pr-workflow, so opening the PR does not create an app. They run
      # only on main, and do-app-update.sh still no-ops without
      # DIGITALOCEAN_ACCESS_TOKEN. Added 2026-11-11 by MarketShipper.
      # deploy_on_push: true
      # Needs Audrey's yes. The product specs on #18366, #18368, and #18369
      # set deploy_on_push to false so those merges do not auto-deploy.
      # Do not flip it here until she says yes. Do not mark this draft ready.
      - affiliate-hub-do-deploy:
          filters:
            branches:
              only: main
      - ai-video-toolkit-do-deploy:
          filters:
            branches:
              only: main
      - screen-recorder-finder-do-deploy:
      - screen-recorder-finder-image:
          filters:
            branches:
              only: main
      - ai-video-toolkit-image:
          filters:
            branches:
              only: main
      - affiliate-hub-image:
          filters:
            branches:
              only: main
      - oaudrey-home-image:
          filters:
            branches:
              only: main
