# Weekly github-free-toolkit report: Git-Master, 2026-11-19, WR midnghtsapphire/revvel-standards#18494.
# Follows the pattern of .circleci/scheduled-generators.yml (WR #18488, PR #18489).
#
# WHY A SEPARATE FILE (not .circleci/config.yml): a scheduled pipeline starts every
# workflow in the config it runs, and `main-workflow` (with the deploy jobs) has no
# `when:` guard. This file holds only the weekly report, so a scheduled run of it
# cannot start main-workflow, pr-workflow or any deploy job. Register it in CircleCI
# as its OWN pipeline (Project Settings > Project Setup > Create pipeline, config
# path `.circleci/toolkit-weekly-report.yml`) with a schedule trigger ONLY and no
# push or pull request trigger.
#
# As a second guard, the workflow below runs only when the pipeline parameter
# `toolkit_report` is `weekly`. A push, PR or any other trigger leaves it at its
# default `none`, so nothing runs.
#
# Secret sets up (this file creates none of it):
#   1. CircleCI context `github-free-toolkit` holding GH_TOKEN, a read-only GitHub
#      token (the tools only read PRs and repository metadata).
#   2. The pipeline above, and one weekly schedule trigger on the default branch
#      with the pipeline parameter `toolkit_report` = `weekly`.
#
# The job is read-only. It writes only to the job log and to CircleCI artifacts.
# This repository is public, so the job sets TOOLKIT_PUBLIC_ONLY=true to keep
# private repositories out of the log and artifacts.

version: 2.1

parameters:
  toolkit_report:
    description: >-
      Set to `weekly` by the schedule trigger. `none` (default) runs nothing.
    type: enum
    enum: [none, weekly]
    default: none

jobs:
  # Weekly read-only report: stale PRs, unassigned PRs, repos missing a README,
  # license or description. Meant to run from the scheduled pipeline described
  # at the top of this file. Output goes to the job log and
  # to CircleCI artifacts under toolkit-report/. It writes nothing to GitHub.
  # The job fails only if a tool cannot run at all (exit code 2, for example a
  # bad or missing GH_TOKEN), so a broken token is noticed. Finding stale or
  # unassigned PRs is not a failure.
  # TOOLKIT_OWNER is the account to scan. TOOLKIT_PUBLIC_ONLY=true keeps private
  # repositories out of the log and artifacts (use it where the project is public).
  toolkit-weekly-report:
    docker:
      - image: cimg/node:22.11
    environment:
      TOOLKIT_SHA: 2b7fcd8004f4a6f21703bba10dab4ef52204a276
      GH_CLI_VERSION: 2.63.2
      TOOLKIT_OWNER: midnghtsapphire
      TOOLKIT_PUBLIC_ONLY: "true"
    steps:
      - run:
          name: Fetch the toolkit (pinned) and the gh CLI
          command: |
            [ -n "${GH_TOKEN:-}" ] || { echo "GH_TOKEN is missing. Attach the github-free-toolkit context."; exit 1; }
            git clone --quiet https://github.com/midnghtsapphire/github-free-toolkit /tmp/github-free-toolkit
            git -C /tmp/github-free-toolkit checkout --quiet "$TOOLKIT_SHA"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
            echo 'export PATH="/tmp/gh_'"${GH_CLI_VERSION}"'_linux_amd64/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Run stale-prs, unassigned-prs and repo-inventory
          command: |
            set +e
            T=/tmp/github-free-toolkit/cli
            OUT=/tmp/toolkit-report
            mkdir -p "$OUT"
            # Public project: only report on public repositories.
            PUBLIC_FLAG=""
            if [ "$TOOLKIT_PUBLIC_ONLY" = "true" ]; then
              PUBLIC_FLAG="--public-only"
              gh repo list "$TOOLKIT_OWNER" --visibility public --limit 1000 --json nameWithOwner \
                --jq '.[].nameWithOwner' > /tmp/public-repos.txt
            fi
            # Keeps only rows whose repository is in /tmp/public-repos.txt (no-op when not public-only).
            keep_public() {
              if [ "$TOOLKIT_PUBLIC_ONLY" != "true" ]; then cat; return; fi
              node -e '
                const fs = require("fs");
                const ok = new Set(fs.readFileSync("/tmp/public-repos.txt", "utf8").split("\n").filter(Boolean));
                const rows = JSON.parse(fs.readFileSync(0, "utf8")).filter((r) => ok.has(r.repository));
                console.log(JSON.stringify(rows, null, 2));'
            }
            rc=0
            node "$T/stale-prs/bin/stale-prs.js" --owner "$TOOLKIT_OWNER" --days 14 --json | keep_public > "$OUT/stale-prs.json"
            [ "${PIPESTATUS[0]}" -ne 2 ] || rc=2
            node "$T/unassigned-prs/bin/unassigned-prs.js" --owner "$TOOLKIT_OWNER" --json | keep_public > "$OUT/unassigned-prs.json"
            [ "${PIPESTATUS[0]}" -ne 2 ] || rc=2
            node "$T/repo-inventory/bin/repo-inventory.js" --owner "$TOOLKIT_OWNER" $PUBLIC_FLAG --json > "$OUT/repo-inventory.json"
            [ "${PIPESTATUS[0]}" -ne 2 ] || rc=2
            echo "stale PRs (14+ days idle): $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).length)' "$OUT/stale-prs.json")"
            echo "unassigned PRs:            $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).length)' "$OUT/unassigned-prs.json")"
            echo "repos with a gap:          $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).length)' "$OUT/repo-inventory.json")"
            echo "Full results are in the toolkit-report artifacts."
            exit $rc
      - store_artifacts:
          path: /tmp/toolkit-report
          destination: toolkit-report

workflows:
  # Weekly fleet report. Runs only for a schedule trigger that sets
  # `toolkit_report` to `weekly`.
  toolkit-weekly-report:
    when:
      equal: [weekly, << pipeline.parameters.toolkit_report >>]
    jobs:
      - toolkit-weekly-report:
          context: github-free-toolkit
