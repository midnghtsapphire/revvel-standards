# Known bot branch prefixes for scripts/check_handoff.sh (AGENTS.md S7).
# Format: <branch-prefix> <bot>   (bot = the lowercase folder name under handoffs/)
# A PR from a branch that starts with a prefix listed here FAILS the handoff check
# when it changes anything outside handoffs/ and no handoffs/<bot>/YYYY-MM-DD.md
# dated today or yesterday (America/Denver) exists. Any other branch only gets a warning.
# Append a line when a new bot gets a branch prefix. Do not remove a line.
triage/ triagechief
proofy/ proofy
balls/ balls
mech/ mechsensorforge
sensecrew/ sensecrew
