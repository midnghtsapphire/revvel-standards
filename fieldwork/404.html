<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page Not Found · FieldWork</title>
  <meta name="robots" content="noindex" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:      '#111418',
            graphite: '#4A4F55',
            concrete: '#F5F5F5',
            rule:     '#E5E5E5',
            safety:   '#FF5733',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          borderRadius: { none: '0', DEFAULT: '0', sm: '0', md: '0', lg: '0', xl: '0', '2xl': '0', '3xl': '0', full: '0' },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #ffffff; color: #111418; -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { border-radius: 0 !important; }
    .blueprint-grid {
      background-image:
        linear-gradient(to right, rgba(17,20,24,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17,20,24,0.06) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="font-sans text-ink min-h-screen flex flex-col">

  <!-- TOP NAV -->
  <header class="border-b border-ink">
    <div class="mx-auto max-w-[1440px] px-6 md:px-20">
      <div class="flex items-center justify-between py-5">
        <a href="/" class="flex items-center gap-3">
          <span aria-hidden="true" class="inline-block h-4 w-4 bg-ink"></span>
          <span class="font-black tracking-tighter text-xl">FIELDWORK</span>
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 blueprint-grid flex items-center justify-center px-6 py-20">
    <div class="text-center max-w-lg">
      <div class="font-mono text-[11px] uppercase tracking-widest text-graphite mb-4">// 404 — Not Found</div>
      <p class="font-black text-[120px] leading-none text-ink select-none" role="presentation">404</p>
      <h1 class="mt-4 text-3xl md:text-4xl font-extrabold tracking-tight">Page not found.</h1>
      <p class="mt-4 text-graphite max-w-sm mx-auto">
        The page you're looking for doesn't exist or has moved. Head back to FieldWork.
      </p>
      <a href="/"
         class="mt-8 inline-flex items-center bg-ink px-6 py-4 font-mono text-xs font-bold uppercase tracking-widest text-white hover:opacity-80">
        ← Back to FieldWork
      </a>
    </div>
  </main>

</body>
</html>
