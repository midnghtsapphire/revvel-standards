<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0f14; --card:#121821; --fg:#e6edf3; --muted:#8b949e; --accent:#3fb950; --warn:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 24px; border-bottom: 1px solid #1f2733; }
  h1 { margin:0 0 4px; font-size: 22px; }
  .sub { color:var(--muted); font-size: 14px; }
  main { padding: 24px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); }
  .card { background:var(--card); border:1px solid #1f2733; border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 8px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .metric { font-size: 26px; font-weight:600; }
  ul { margin:8px 0 0; padding-left:18px; }
  li { margin: 4px 0; }
  .phase { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #1f2733; }
  .phase:last-child { border-bottom:none; }
  .bar { height:8px; background:#1f2733; border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar > span { display:block; height:100%; background:var(--accent); width:0%; }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Prime Directive: $10k/month → $10M in 3 years</h1>
  <div class="sub" id="updated">Loading…</div>
</header>
<main id="grid">
  <div class="card">
    <h2>Current MRR</h2>
    <div class="metric" id="mrr">—</div>
    <div class="bar"><span id="mrrBar"></span></div>
    <div class="sub" id="mrrSub"></div>
  </div>
  <div class="card">
    <h2>Phases</h2>
    <div id="phases"></div>
  </div>
  <div class="card">
    <h2>Focus Areas</h2>
    <ul id="focus"></ul>
  </div>
  <div class="card">
    <h2>Automation</h2>
    <div id="automation"></div>
  </div>
</main>
<footer>Generated data only — no logic changes. See WR-02, audit-2026-08-05.</footer>
<script>
fetch('dashboard-data.json', {cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent = 'Updated ' + d.updated_at;
  const mrr = d.revenue.current_mrr_usd, tgt = d.revenue.target_mrr_usd;
  document.getElementById('mrr').textContent = '$' + mrr.toLocaleString() + ' / $' + tgt.toLocaleString();
  const pct = Math.min(100, d.revenue.progress_pct || (tgt ? (mrr/tgt)*100 : 0));
  document.getElementById('mrrBar').style.width = pct + '%';
  document.getElementById('mrrSub').textContent = pct.toFixed(1) + '% to Phase 1 target';
  document.getElementById('phases').innerHTML = d.mission.phases.map(p =>
    `<div class="phase"><span>${p.name} — ${p.target}</span><span class="sub">${p.window}</span></div>`
  ).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f =>
    `<li><strong>${f.name}</strong> — <span class="sub">${f.description}</span></li>`
  ).join('');
  document.getElementById('automation').innerHTML =
    `<div>Agent: <strong>${d.automation.agent}</strong></div>` +
    `<div class="sub">Chain: ${d.automation.fallback_chain.join(' → ')}</div>` +
    `<div class="sub">Last run: ${d.automation.last_run}</div>`;
}).catch(e=>{
  document.getElementById('updated').textContent = 'Failed to load dashboard-data.json';
});
</script>
</body>
</html>
