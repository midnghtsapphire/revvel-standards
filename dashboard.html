<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Dashboard — $10M in 3 Years</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117; color: #c9d1d9; margin: 0; padding: 2rem; }
    h1 { color: #58a6ff; margin: 0 0 .25rem; }
    .sub { color: #8b949e; margin-bottom: 2rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
    .card h3 { margin: 0 0 .5rem; color: #f0f6fc; font-size: 1rem; }
    .metric { font-size: 1.75rem; font-weight: 600; color: #3fb950; }
    .phase { display: flex; justify-content: space-between; padding: .5rem 0; border-bottom: 1px solid #21262d; }
    .phase:last-child { border-bottom: 0; }
    .status-active { color: #3fb950; }
    .status-pending { color: #8b949e; }
    footer { margin-top: 2rem; color: #6e7681; font-size: .85rem; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>$10M in 3 Years</h1>
  <p class="sub">Prime directive: $10k/month → $10M total by year 3</p>

  <div class="grid">
    <div class="card">
      <h3>Current MRR</h3>
      <div class="metric" id="mrr">$0</div>
    </div>
    <div class="card">
      <h3>Total Revenue</h3>
      <div class="metric" id="total">$0</div>
    </div>
    <div class="card">
      <h3>Products Shipped</h3>
      <div class="metric" id="products">0</div>
    </div>
    <div class="card">
      <h3>Active Customers</h3>
      <div class="metric" id="customers">0</div>
    </div>
  </div>

  <h2 style="margin-top:2rem;color:#f0f6fc">Phases</h2>
  <div class="card" id="phases"></div>

  <h2 style="margin-top:2rem;color:#f0f6fc">Focus Areas</h2>
  <div class="grid" id="focus"></div>

  <footer>
    Data source: <a href="dashboard-data.json">dashboard-data.json</a> ·
    Updated <span id="updated">—</span> ·
    Automated via OpenRouter → OpenHands → manual (free-tier)
  </footer>

  <script>
    fetch('dashboard-data.json').then(r => r.json()).then(d => {
      document.getElementById('mrr').textContent = '$' + d.metrics.current_mrr.toLocaleString();
      document.getElementById('total').textContent = '$' + d.metrics.total_revenue.toLocaleString();
      document.getElementById('products').textContent = d.metrics.products_shipped;
      document.getElementById('customers').textContent = d.metrics.active_customers;
      document.getElementById('updated').textContent = d.updated_at;

      const phases = document.getElementById('phases');
      d.phases.forEach(p => {
        const target = p.target_mrr ? '$' + p.target_mrr.toLocaleString() + '/mo'
                                    : '$' + p.target_total.toLocaleString() + ' total';
        phases.insertAdjacentHTML('beforeend',
          `<div class="phase"><span>Phase ${p.id} — ${p.name} (${p.months})</span>` +
          `<span class="status-${p.status}">${target} · ${p.status}</span></div>`);
      });

      const focus = document.getElementById('focus');
      d.focus_areas.forEach(f => {
        focus.insertAdjacentHTML('beforeend',
          `<div class="card"><h3>${f.name}</h3><p style="margin:0;color:#8b949e">${f.description}</p></div>`);
      });
    }).catch(e => {
      document.body.insertAdjacentHTML('beforeend',
        `<p style="color:#f85149">Failed to load dashboard-data.json: ${e}</p>`);
    });
  </script>
</body>
</html>
