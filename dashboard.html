<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard — $10M in 3 Years</title>
<style>
  :root {
    --bg:#0b0f14; --fg:#e6edf3; --muted:#8b949e;
    --accent:#39d353; --card:#161b22; --border:#30363d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--fg);line-height:1.5}
  header{padding:2rem 1.5rem;border-bottom:1px solid var(--border)}
  h1{margin:0 0 .25rem;font-size:1.75rem}
  .sub{color:var(--muted);font-size:.95rem}
  main{max-width:1100px;margin:0 auto;padding:1.5rem}
  .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem}
  .card h3{margin:0 0 .5rem;font-size:1rem}
  .card .val{font-size:1.5rem;font-weight:600;color:var(--accent)}
  .card .desc{color:var(--muted);font-size:.85rem;margin-top:.25rem}
  .phase-active{border-color:var(--accent)}
  .badge{display:inline-block;padding:.15rem .5rem;border-radius:12px;font-size:.75rem;
         background:var(--border);color:var(--muted)}
  .badge.active{background:var(--accent);color:#000}
  section{margin-top:2rem}
  section h2{border-bottom:1px solid var(--border);padding-bottom:.5rem;font-size:1.25rem}
  footer{padding:1.5rem;text-align:center;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1>🎯 $10M in 3 Years</h1>
  <div class="sub">Prime Directive: $10k/month → $10M total by year 3</div>
</header>
<main>
  <section>
    <h2>Phases</h2>
    <div class="grid" id="phases"></div>
  </section>
  <section>
    <h2>Focus Areas</h2>
    <div class="grid" id="focus"></div>
  </section>
  <section>
    <h2>Metrics</h2>
    <div class="grid" id="metrics"></div>
  </section>
</main>
<footer>Automated refresh · generated data only · WR-02 audit-2026-08-05</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const p=document.getElementById('phases');
  d.phases.forEach(ph=>{
    const el=document.createElement('div');
    el.className='card'+(ph.status==='active'?' phase-active':'');
    el.innerHTML=`<h3>Phase ${ph.id} <span class="badge ${ph.status==='active'?'active':''}">${ph.status}</span></h3>
      <div class="val">${ph.target}</div><div class="desc">${ph.window}</div>`;
    p.appendChild(el);
  });
  const f=document.getElementById('focus');
  d.focus_areas.forEach(a=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<h3>${a.name}</h3><div class="desc">${a.description}</div>`;
    f.appendChild(el);
  });
  const m=document.getElementById('metrics');
  const labels={mrr:'MRR',total_revenue:'Total Revenue',active_products:'Active Products',customers:'Customers'};
  Object.entries(d.metrics).forEach(([k,v])=>{
    const el=document.createElement('div');
    el.className='card';
    const isMoney=k==='mrr'||k==='total_revenue';
    el.innerHTML=`<h3>${labels[k]||k}</h3><div class="val">${isMoney?'$':''}${v.toLocaleString()}</div>`;
    m.appendChild(el);
  });
}).catch(e=>{document.querySelector('main').innerHTML='<p>Failed to load dashboard-data.json</p>';});
</script>
</body>
</html>
