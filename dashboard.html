<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b949e; --accent:#2ea043; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:14px; }
  main { padding:24px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .card h2 { margin:0 0 8px; font-size:14px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.5px; }
  .kpi { font-size:28px; font-weight:600; }
  .phases { padding:0 24px 24px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:14px; }
  th { color:var(--muted); font-weight:500; background:#0d1117; }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:12px; }
  .badge.active { background:rgba(46,160,70,.15); color:var(--accent); }
  .badge.pending { background:rgba(139,148,158,.15); color:var(--muted); }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime Directive: $10k/month → $10M in 3 years</div>
</header>
<main id="kpis"></main>
<section class="phases">
  <table>
    <thead><tr><th>Phase</th><th>Name</th><th>Target</th><th>Window</th><th>Status</th></tr></thead>
    <tbody id="phases-body"></tbody>
  </table>
</section>
<footer>
  <span id="generated"></span> · audit-2026-08-05 (WR-02) · generated data only
</footer>
<script>
(async () => {
  try {
    const res = await fetch('dashboard-data.json', { cache: 'no-store' });
    const data = await res.json();
    const m = data.metrics || {};
    const cards = [
      { label: 'MRR', value: '$' + (m.mrr||0).toLocaleString() },
      { label: 'Total Revenue', value: '$' + (m.total_revenue||0).toLocaleString() },
      { label: 'Active Products', value: m.active_products||0 },
      { label: 'Backers', value: m.backers||0 }
    ];
    document.getElementById('kpis').innerHTML = cards.map(c =>
      `<div class="card"><h2>${c.label}</h2><div class="kpi">${c.value}</div></div>`
    ).join('');
    const phases = (data.mission && data.mission.phases) || [];
    document.getElementById('phases-body').innerHTML = phases.map(p => {
      const target = p.target_mrr ? '$' + p.target_mrr.toLocaleString() + '/mo'
                    : p.target_total ? '$' + p.target_total.toLocaleString() + ' total' : '—';
      return `<tr><td>${p.id}</td><td>${p.name}</td><td>${target}</td><td>${p.window}</td><td><span class="badge ${p.status}">${p.status}</span></td></tr>`;
    }).join('');
    document.getElementById('generated').textContent = 'Generated: ' + (data.generated_at || 'n/a');
  } catch (e) {
    document.getElementById('kpis').innerHTML = '<div class="card"><h2>Error</h2><div class="kpi">Failed to load</div></div>';
  }
})();
</script>
</body>
</html>
