<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0b0d10;color:#e6e6e6;padding:2rem}
  h1{margin:0 0 .25rem;font-size:1.6rem}
  .sub{color:#8aa;margin-bottom:1.5rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
  .card{background:#151a20;border:1px solid #232a33;border-radius:10px;padding:1rem}
  .card h3{margin:0 0 .5rem;font-size:1rem;color:#9ecbff}
  .badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.75rem;background:#233;color:#8fd}
  .badge.pending{background:#332;color:#fd8}
  footer{margin-top:2rem;color:#667;font-size:.8rem}
</style>
</head>
<body>
<h1>Prime Directive: $10k/month &rarr; $10M in 3 years</h1>
<div class="sub">Automated dashboard &middot; updated 2026-08-05</div>

<h2>Phases</h2>
<div class="grid" id="phases"></div>

<h2>Focus Areas</h2>
<div class="grid" id="focus"></div>

<footer>Generated data only. Fallback chain: OpenRouter &rarr; OpenHands &rarr; manual.</footer>

<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const p=document.getElementById('phases');
  d.phases.forEach(ph=>{
    const el=document.createElement('div');el.className='card';
    el.innerHTML=`<h3>${ph.name}</h3><div>${ph.target}</div><div class="sub">${ph.window}</div><span class="badge ${ph.status}">${ph.status}</span>`;
    p.appendChild(el);
  });
  const f=document.getElementById('focus');
  d.focus_areas.forEach(a=>{
    const el=document.createElement('div');el.className='card';
    el.innerHTML=`<h3>${a.name}</h3><div class="sub">priority ${a.priority}</div>`;
    f.appendChild(el);
  });
}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<p style="color:#f88">Failed to load dashboard-data.json</p>');});
</script>
</body>
</html>
