<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard — $10M Mission</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0b0d10; color:#e6edf3; margin:0; padding:2rem; }
  h1 { margin:0 0 .25rem; font-size:1.5rem; }
  .sub { color:#8b949e; margin-bottom:1.5rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:.95rem; color:#c9d1d9; }
  .big { font-size:1.6rem; font-weight:600; color:#3fb950; }
  .row { display:flex; justify-content:space-between; padding:.25rem 0; border-bottom:1px solid #21262d; font-size:.9rem; }
  .row:last-child { border-bottom:none; }
  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:.75rem; }
  .active { background:#238636; color:#fff; }
  .pending { background:#30363d; color:#8b949e; }
  footer { margin-top:2rem; color:#6e7681; font-size:.8rem; }
</style>
</head>
<body>
<h1>🎯 Mission: $10k/month → $10M in 3 Years</h1>
<div class="sub" id="updated">Loading…</div>

<div class="grid">
  <div class="card">
    <h3>Current MRR</h3>
    <div class="big" id="mrr">—</div>
    <div class="sub" id="mrrTarget"></div>
  </div>
  <div class="card">
    <h3>Phase Progress</h3>
    <div id="phases"></div>
  </div>
  <div class="card">
    <h3>Focus Areas</h3>
    <div id="focus"></div>
  </div>
  <div class="card">
    <h3>Automation</h3>
    <div id="automation"></div>
  </div>
</div>

<footer>Auto-generated. Data source: <code>dashboard-data.json</code></footer>

<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent = 'Updated ' + d.updated + ' · Phase ' + d.phase;
  document.getElementById('mrr').textContent = '$' + (d.metrics.mrr_current||0).toLocaleString();
  document.getElementById('mrrTarget').textContent = 'Target: $' + d.metrics.mrr_target.toLocaleString() + ' (' + d.metrics.progress_pct + '%)';
  document.getElementById('phases').innerHTML = d.phases.map(p =>
    `<div class="row"><span>P${p.id}: ${p.target}</span><span class="badge ${p.status}">${p.status}</span></div>`
  ).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f =>
    `<div class="row"><span>${f.name}</span><span>#${f.priority}</span></div>`
  ).join('');
  const a = d.automation;
  document.getElementById('automation').innerHTML =
    `<div class="row"><span>Agent</span><span>${a.agent}</span></div>` +
    `<div class="row"><span>Fallback</span><span>${a.fallback_chain.join(' → ')}</span></div>` +
    `<div class="row"><span>Last issue</span><span>#${a.last_issue}</span></div>`;
}).catch(e=>{ document.getElementById('updated').textContent='Error loading data: '+e; });
</script>
</body>
</html>
