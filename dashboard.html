<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b98a5; --acc:#2ea043; --warn:#d29922; --card:#161b22; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 24px; border-bottom: 1px solid #21262d; }
  h1 { margin:0 0 4px; font-size: 22px; }
  .muted { color: var(--muted); font-size: 13px; }
  main { padding: 20px; display:grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 16px; }
  .card { background:var(--card); border:1px solid #21262d; border-radius:8px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .kv { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #21262d; }
  .kv:last-child { border-bottom:none; }
  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; }
  .badge.active { background:#238636; color:#fff; }
  .badge.pending { background:#30363d; color:var(--muted); }
  .bar { height:8px; background:#21262d; border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar > span { display:block; height:100%; background:var(--acc); width:0%; }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; border-top:1px solid #21262d; }
</style>
</head>
<body>
<header>
  <h1>🚀 Prime Directive: $10k/mo → $10M in 3 years</h1>
  <div class="muted" id="updated">Loading…</div>
</header>
<main id="root"></main>
<footer>Auto-generated dashboard. Data source: <code>dashboard-data.json</code></footer>
<script>
async function load() {
  const res = await fetch('dashboard-data.json', { cache: 'no-store' });
  const d = await res.json();
  document.getElementById('updated').textContent = 'Updated: ' + d.updated_at;
  const root = document.getElementById('root');

  const mission = document.createElement('section');
  mission.className = 'card';
  mission.innerHTML = '<h2>Mission Phases</h2>' + d.mission.phases.map(p =>
    `<div class="kv"><span>Phase ${p.phase} · ${p.window}</span><span>${p.target} <span class="badge ${p.status}">${p.status}</span></span></div>`
  ).join('');
  root.appendChild(mission);

  const focus = document.createElement('section');
  focus.className = 'card';
  focus.innerHTML = '<h2>Focus Areas</h2>' + d.focus_areas.map(f =>
    `<div class="kv"><span>#${f.priority} ${f.name}</span><span class="badge ${f.status}">${f.status}</span></div>`
  ).join('');
  root.appendChild(focus);

  const m = d.metrics;
  const pct = Math.min(100, Math.round((m.mrr_usd / m.target_mrr_usd) * 100));
  const metrics = document.createElement('section');
  metrics.className = 'card';
  metrics.innerHTML = `<h2>Revenue Metrics</h2>
    <div class="kv"><span>MRR</span><span>$${m.mrr_usd.toLocaleString()}</span></div>
    <div class="kv"><span>Target MRR</span><span>$${m.target_mrr_usd.toLocaleString()}</span></div>
    <div class="kv"><span>Total Revenue</span><span>$${m.total_revenue_usd.toLocaleString()}</span></div>
    <div class="muted" style="margin-top:12px">Progress to Phase 1: ${pct}%</div>
    <div class="bar"><span style="width:${pct}%"></span></div>`;
  root.appendChild(metrics);

  const auto = document.createElement('section');
  auto.className = 'card';
  auto.innerHTML = `<h2>Automation</h2>
    <div class="kv"><span>Agent</span><span>${d.automation.agent}</span></div>
    <div class="kv"><span>Fallback Chain</span><span>${d.automation.fallback_chain.join(' → ')}</span></div>
    <div class="kv"><span>Last Run</span><span>${d.automation.last_run}</span></div>
    <div class="kv"><span>Closed Issues</span><span>${d.automation.closed_issues.length}</span></div>`;
  root.appendChild(auto);
}
load().catch(e => { document.getElementById('root').innerHTML = '<div class="card">Failed to load dashboard: ' + e + '</div>'; });
</script>
</body>
</html>
