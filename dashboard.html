<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b1020; --card:#121a33; --fg:#e6ecff; --muted:#93a0c9; --accent:#5eead4; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 2rem; text-align:center; border-bottom:1px solid #1e2a4f; }
  h1 { margin:0 0 .5rem; font-size:1.6rem; }
  .sub { color:var(--muted); }
  main { max-width: 1100px; margin:0 auto; padding: 1.5rem; }
  .grid { display:grid; gap:1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card { background:var(--card); border:1px solid #1e2a4f; border-radius: 12px; padding: 1rem 1.1rem; }
  .card h3 { margin:.1rem 0 .4rem; font-size:.95rem; color:var(--muted); font-weight:600; letter-spacing:.02em; }
  .card .val { font-size:1.4rem; font-weight:700; color:var(--accent); }
  section { margin-top: 2rem; }
  section h2 { font-size:1.1rem; color:var(--muted); text-transform: uppercase; letter-spacing:.08em; }
  ul.phases { list-style:none; padding:0; display:grid; gap:.5rem; }
  ul.phases li { background:var(--card); padding:.75rem 1rem; border-radius:10px; border-left:4px solid #334; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  ul.phases li.active { border-left-color: var(--accent); }
  footer { text-align:center; padding:2rem; color:var(--muted); font-size:.85rem; }
  code { background:#0b122a; padding:.15rem .4rem; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="sub">$10k/month → $10M in 3 years</div>
</header>
<main>
  <div class="grid">
    <div class="card"><h3>Current MRR</h3><div class="val" id="mrr">$0</div></div>
    <div class="card"><h3>Total Revenue</h3><div class="val" id="total">$0</div></div>
    <div class="card"><h3>Active Products</h3><div class="val" id="products">0</div></div>
    <div class="card"><h3>GitHub Sponsors</h3><div class="val" id="sponsors">0</div></div>
  </div>

  <section>
    <h2>Phases</h2>
    <ul class="phases" id="phases"></ul>
  </section>

  <section>
    <h2>Focus Areas</h2>
    <ul class="phases" id="focus"></ul>
  </section>
</main>
<footer>
  Data: <code>dashboard-data.json</code> · Audit ref: <span id="audit">–</span>
</footer>
<script>
fetch('dashboard-data.json', {cache:'no-store'})
  .then(r => r.json())
  .then(d => {
    const m = d.metrics || {};
    document.getElementById('mrr').textContent = '$' + (m.current_mrr||0).toLocaleString();
    document.getElementById('total').textContent = '$' + (m.total_revenue||0).toLocaleString();
    document.getElementById('products').textContent = m.active_products||0;
    document.getElementById('sponsors').textContent = m.github_sponsors||0;

    const phases = document.getElementById('phases');
    (d.phases||[]).forEach(p => {
      const li = document.createElement('li');
      if (p.status === 'active') li.classList.add('active');
      const target = p.target_mrr ? ('$'+p.target_mrr.toLocaleString()+'/mo') : ('$'+(p.target_total||0).toLocaleString()+' total');
      li.innerHTML = `<span><strong>Phase ${p.id}: ${p.name}</strong> <span style="color:var(--muted)">· months ${p.months}</span></span><span>${target} · ${p.status}</span>`;
      phases.appendChild(li);
    });

    const focus = document.getElementById('focus');
    (d.focus_areas||[]).forEach(f => {
      const li = document.createElement('li');
      li.innerHTML = `<span><strong>${f.name}</strong> <span style="color:var(--muted)">· ${f.description}</span></span><span>priority ${f.priority}</span>`;
      focus.appendChild(li);
    });

    if (d.audit) document.getElementById('audit').textContent = d.audit.ref + ' (' + d.audit.ruleset + ')';
  })
  .catch(e => { document.getElementById('audit').textContent = 'load error'; });
</script>
</body>
</html>
