<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10k/mo → $10M/3yr</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b949e; --accent:#3fb950; --warn:#d29922; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 6px; font-size:22px; }
  .sub { color:var(--muted); font-size:14px; }
  main { padding:24px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .phase { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); }
  .phase:last-child { border-bottom:0; }
  .badge { padding:2px 8px; border-radius:12px; font-size:11px; }
  .active { background:rgba(63,185,80,.15); color:var(--accent); }
  .pending { background:rgba(139,148,158,.15); color:var(--muted); }
  .metric { font-size:28px; font-weight:600; }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); }
  code { background:#0d1117; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime directive: <strong>$10k/month → $10M in 3 years</strong> · Updated <span id="updated">—</span></div>
</header>
<main>
  <section class="card">
    <h2>Phases</h2>
    <div id="phases"></div>
  </section>
  <section class="card">
    <h2>Focus Areas</h2>
    <div id="focus"></div>
  </section>
  <section class="card">
    <h2>MRR</h2>
    <div class="metric" id="mrr">$0</div>
    <div class="sub">Target phase 1: $10,000</div>
  </section>
  <section class="card">
    <h2>Total Revenue</h2>
    <div class="metric" id="total">$0</div>
    <div class="sub">Target: $10,000,000</div>
  </section>
</main>
<footer>
  Source: <code>dashboard-data.json</code> · Automated refresh (audit-2026-08-05) · WR-02 PR-based update
</footer>
<script>
fetch('dashboard-data.json', {cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent = d.updated_at;
  const money = n => '$' + Number(n||0).toLocaleString();
  document.getElementById('mrr').textContent = money(d.metrics.mrr);
  document.getElementById('total').textContent = money(d.metrics.total_revenue);
  const p = document.getElementById('phases');
  d.mission.phases.forEach(ph=>{
    const t = ph.target_mrr ? money(ph.target_mrr)+'/mo' : money(ph.target_total)+' total';
    p.insertAdjacentHTML('beforeend', `<div class="phase"><span>P${ph.id} · ${ph.name} <span class="sub">(${ph.window})</span></span><span><span class="sub">${t}</span> <span class="badge ${ph.status}">${ph.status}</span></span></div>`);
  });
  const f = document.getElementById('focus');
  d.focus_areas.forEach(a=>{
    f.insertAdjacentHTML('beforeend', `<div class="phase"><span>#${a.priority} ${a.name}</span><span class="sub">${a.description}</span></div>`);
  });
}).catch(e=>{ document.getElementById('updated').textContent = 'error loading data'; });
</script>
</body>
</html>
