<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10k/mo → $10M</title>
<style>
  :root { --bg:#0b1020; --fg:#e6edf3; --muted:#8b949e; --accent:#3fb950; --card:#111827; --border:#1f2937; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:14px; }
  main { padding:24px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 8px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .kpi { font-size:26px; font-weight:600; }
  .accent { color:var(--accent); }
  ul { margin:0; padding-left:18px; }
  li { margin:4px 0; }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); }
  code { background:#0f172a; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="sub">PRIME DIRECTIVE: <span class="accent">$10k/month → $10M in 3 years</span></div>
</header>
<main id="app">
  <div class="card"><h2>Current Phase</h2><div class="kpi" id="phase">—</div><div class="sub" id="phase-window"></div></div>
  <div class="card"><h2>MRR</h2><div class="kpi" id="mrr">$0</div><div class="sub">Target: <span id="mrr-target">—</span></div></div>
  <div class="card"><h2>Total Revenue</h2><div class="kpi" id="total">$0</div><div class="sub">Goal: $10,000,000</div></div>
  <div class="card"><h2>Focus Areas</h2><ul id="focus"></ul></div>
  <div class="card"><h2>Automation</h2><div id="automation" class="sub"></div></div>
  <div class="card"><h2>Roadmap</h2><ul id="phases"></ul></div>
</main>
<footer>Generated data only — no logic changes. See <code>dashboard-data.json</code>.</footer>
<script>
fetch('dashboard-data.json', {cache:'no-store'}).then(r=>r.json()).then(d=>{
  const fmt = n => '$' + Number(n||0).toLocaleString('en-US');
  document.getElementById('phase').textContent = d.phase.label;
  document.getElementById('phase-window').textContent = 'Updated ' + d.updated;
  document.getElementById('mrr').textContent = fmt(d.revenue.mrr_usd);
  document.getElementById('mrr-target').textContent = fmt(d.phase.target_mrr_usd);
  document.getElementById('total').textContent = fmt(d.revenue.total_usd);
  document.getElementById('focus').innerHTML = d.focus_areas.map(f=>`<li><b>${f.name}</b> — ${f.description}</li>`).join('');
  document.getElementById('automation').innerHTML = `Agent: <b>${d.automation.agent}</b><br/>Fallback: ${d.automation.fallback_chain.join(' → ')}<br/>Tier: ${d.automation.tier}`;
  document.getElementById('phases').innerHTML = d.phases.map(p=>`<li>Phase ${p.id}: <b>${p.label}</b> (${p.window})</li>`).join('');
}).catch(e=>{
  document.getElementById('app').innerHTML = '<div class="card">Failed to load dashboard-data.json</div>';
});
</script>
</body>
</html>
