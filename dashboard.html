<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b949e; --accent:#2ea043; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:2rem 1.5rem; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 .25rem; font-size:1.75rem; }
  .sub { color:var(--muted); }
  main { padding:1.5rem; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:1rem; }
  .target { font-size:1.4rem; font-weight:700; color:var(--accent); }
  .status { display:inline-block; padding:.15rem .5rem; border-radius:999px; font-size:.75rem; background:#21262d; color:var(--muted); margin-top:.5rem; }
  .status.active { background:#0f5323; color:#7ee787; }
  section { margin-top:2rem; }
  ul { padding-left:1.25rem; }
  footer { padding:1rem 1.5rem; color:var(--muted); font-size:.85rem; border-top:1px solid var(--border); margin-top:2rem; }
</style>
</head>
<body>
<header>
  <h1>Mission: $10M in 3 Years</h1>
  <div class="sub">Prime Directive: $10k/month → $10M total by year 3</div>
</header>
<main>
  <section>
    <h2>Phases</h2>
    <div class="grid" id="phases"></div>
  </section>
  <section>
    <h2>Focus Areas</h2>
    <div class="grid" id="focus"></div>
  </section>
</main>
<footer id="foot">Loading dashboard-data.json…</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const p = document.getElementById('phases');
  p.innerHTML = d.phases.map(x=>`<div class="card"><h3>Phase ${x.phase}</h3><div class="target">${x.target}</div><div class="sub">${x.window}</div><span class="status ${x.status}">${x.status}</span></div>`).join('');
  const f = document.getElementById('focus');
  f.innerHTML = d.focus_areas.map(x=>`<div class="card"><h3>${x.name}</h3><div class="sub">${x.description}</div></div>`).join('');
  document.getElementById('foot').textContent = `Generated by ${d.generated_by} • agent: ${d.automation.agent} • ${d.notes}`;
}).catch(e=>{document.getElementById('foot').textContent='Failed to load data: '+e;});
</script>
</body>
</html>
