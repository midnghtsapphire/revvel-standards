<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Dashboard — $10k → $10M</title>
<style>
  :root{--bg:#0b0f14;--fg:#e6edf3;--muted:#8b98a5;--accent:#3fb950;--card:#161b22;--border:#30363d}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:2rem;max-width:1100px;margin:auto}
  h1{margin:0 0 .25rem;font-size:1.6rem}
  .sub{color:var(--muted);margin-bottom:1.5rem}
  .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem}
  .card h2{margin:0 0 .5rem;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .metric{font-size:1.75rem;font-weight:600;color:var(--accent)}
  .phase{border-left:3px solid var(--border);padding:.5rem .75rem;margin:.25rem 0}
  .phase.active{border-left-color:var(--accent);background:rgba(63,185,80,.08)}
  .phase .r{color:var(--muted);font-size:.85rem}
  footer{margin-top:2rem;color:var(--muted);font-size:.8rem}
  a{color:var(--accent)}
</style>
</head>
<body>
  <h1>🚀 Mission Dashboard</h1>
  <div class="sub" id="mission">$10k/month → $10M in 3 years</div>

  <div class="grid">
    <div class="card"><h2>Current MRR</h2><div class="metric" id="mrr">$0</div></div>
    <div class="card"><h2>Total Revenue</h2><div class="metric" id="total">$0</div></div>
    <div class="card"><h2>Products Shipped</h2><div class="metric" id="products">0</div></div>
    <div class="card"><h2>Active Customers</h2><div class="metric" id="customers">0</div></div>
  </div>

  <div class="card" style="margin-top:1rem">
    <h2>Phases</h2>
    <div id="phases"></div>
  </div>

  <div class="card" style="margin-top:1rem">
    <h2>Focus Areas</h2>
    <ul id="focus"></ul>
  </div>

  <footer>
    Last updated: <span id="updated">—</span> · Agent: <span id="agent">—</span>
  </footer>

<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('mission').textContent=d.mission;
  document.getElementById('mrr').textContent='$'+d.metrics.mrr.toLocaleString();
  document.getElementById('total').textContent='$'+d.metrics.total_revenue.toLocaleString();
  document.getElementById('products').textContent=d.metrics.products_shipped;
  document.getElementById('customers').textContent=d.metrics.active_customers;
  document.getElementById('updated').textContent=d.updated;
  document.getElementById('agent').textContent=d.automation.agent+' → '+d.automation.fallback_chain.join(' → ');
  document.getElementById('phases').innerHTML=d.phases.map(p=>{
    const active=p.id===d.phase.current?' active':'';
    const tgt=p.target_mrr?('$'+p.target_mrr.toLocaleString()+'/mo'):('$'+p.target_total.toLocaleString()+' total');
    return `<div class="phase${active}"><strong>Phase ${p.id}: ${p.name}</strong> — ${tgt}<div class="r">${p.range}</div></div>`;
  }).join('');
  document.getElementById('focus').innerHTML=d.focus_areas.map(f=>`<li><strong>${f.name}</strong> — ${f.desc}</li>`).join('');
}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<p style="color:#f85149">Failed to load dashboard-data.json</p>')});
</script>
</body>
</html>
