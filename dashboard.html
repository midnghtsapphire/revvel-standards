<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b949e; --accent:#2ea043; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 2rem 1.5rem; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 .25rem; font-size:1.6rem; }
  .sub { color: var(--muted); font-size:.95rem; }
  main { padding: 1.5rem; display:grid; gap:1rem; max-width:1100px; margin: 0 auto; }
  .grid { display:grid; gap:1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:1rem; }
  .kpi { font-size:1.6rem; font-weight:600; }
  .muted { color: var(--muted); font-size:.85rem; }
  .status-active { color: var(--accent); font-weight:600; }
  .status-pending { color: var(--muted); }
  ul { padding-left: 1.1rem; margin:.25rem 0; }
  code { background:#0d1117; padding:.1rem .35rem; border-radius:4px; border:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime Directive: $10k/month → $10M total in 3 years</div>
</header>
<main>
  <section class="card">
    <h3>Current Phase</h3>
    <div class="kpi" id="phase">Phase 1 — $10k/month</div>
    <div class="muted" id="updated"></div>
  </section>

  <section class="grid" id="phases"></section>

  <section class="card">
    <h3>Focus Areas</h3>
    <ul id="focus"></ul>
  </section>

  <section class="grid" id="metrics"></section>

  <section class="card">
    <h3>Automation</h3>
    <div class="muted">Agent: <code id="agent"></code> · Fallback: <span id="fallback"></span></div>
  </section>
</main>
<script>
fetch('dashboard-data.json').then(r => r.json()).then(d => {
  document.getElementById('updated').textContent = 'Updated: ' + d.updated;
  const active = d.phases.find(p => p.status === 'active') || d.phases[0];
  document.getElementById('phase').textContent = 'Phase ' + active.id + ' — ' + active.target;

  const phases = document.getElementById('phases');
  d.phases.forEach(p => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = '<h3>Phase ' + p.id + '</h3>' +
      '<div class="kpi">' + p.target + '</div>' +
      '<div class="muted">' + p.window + '</div>' +
      '<div class="status-' + p.status + '">' + p.status + '</div>';
    phases.appendChild(el);
  });

  const focus = document.getElementById('focus');
  d.focus.forEach(f => {
    const li = document.createElement('li');
    li.innerHTML = '<strong>' + f.name + '</strong> — <span class="muted">' + f.description + '</span>';
    focus.appendChild(li);
  });

  const metrics = document.getElementById('metrics');
  const m = d.metrics;
  const items = [
    ['MRR', '$' + m.mrr.toLocaleString()],
    ['Total Revenue', '$' + m.total_revenue.toLocaleString()],
    ['Products Shipped', m.products_shipped],
    ['Customers', m.customers]
  ];
  items.forEach(([k,v]) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = '<h3>' + k + '</h3><div class="kpi">' + v + '</div>';
    metrics.appendChild(el);
  });

  document.getElementById('agent').textContent = d.automation.agent;
  document.getElementById('fallback').textContent = d.automation.fallback.join(' → ');
}).catch(e => {
  document.getElementById('updated').textContent = 'Error loading data: ' + e.message;
});
</script>
</body>
</html>
