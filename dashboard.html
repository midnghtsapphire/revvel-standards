<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;background:#0b1020;color:#e6edf7;margin:0;padding:2rem;}
  h1{margin:0 0 .25rem 0;font-size:1.5rem}
  .sub{color:#8fa3c7;margin-bottom:1.5rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
  .card{background:#151b30;border:1px solid #22304d;border-radius:10px;padding:1rem}
  .card h3{margin:.1rem 0 .4rem 0;font-size:1rem;color:#9ecbff}
  .badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.75rem}
  .active{background:#1f5f3a;color:#c8f7d4}
  .pending{background:#3a3a1f;color:#f7ecc8}
  .foot{margin-top:1.5rem;color:#8fa3c7;font-size:.85rem}
  code{background:#0f1428;padding:.1rem .3rem;border-radius:4px}
</style>
</head>
<body>
<h1>Mission: $10k/month → $10M in 3 Years</h1>
<div class="sub">Automated dashboard · updated 2026-08-05</div>
<div class="grid" id="phases"></div>
<div class="foot">Focus: <code>polar.sh</code> · <code>osint-tools</code> · <code>automated-product-pipeline</code></div>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const g=document.getElementById('phases');
  d.phases.forEach(p=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<h3>Phase ${p.id}</h3><div><strong>${p.target}</strong></div><div class="sub">${p.window}</div><span class="badge ${p.status}">${p.status}</span>`;
    g.appendChild(el);
  });
}).catch(()=>{});
</script>
</body>
</html>
