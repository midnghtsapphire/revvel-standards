<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard — $10k/mo → $10M in 3 Years</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0b1020; color:#e6edf3; margin:0; padding:2rem; }
  h1 { margin:0 0 .25rem; font-size:1.6rem; }
  .sub { color:#8b949e; margin-bottom:1.5rem; }
  .grid { display:grid; gap:1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
  .card { background:#161b2c; border:1px solid #22283b; border-radius:10px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:1rem; }
  .status { display:inline-block; padding:.15rem .5rem; border-radius:999px; font-size:.75rem; }
  .active { background:#1f6feb; color:#fff; }
  .pending { background:#30363d; color:#c9d1d9; }
  ul { padding-left:1.1rem; margin:.25rem 0; }
  footer { margin-top:2rem; color:#8b949e; font-size:.8rem; }
</style>
</head>
<body>
<h1>Mission Dashboard</h1>
<div class="sub">Prime directive: <strong>$10k/month → $10M in 3 years</strong></div>

<h2>Phases</h2>
<div class="grid" id="phases"></div>

<h2 style="margin-top:2rem">Focus Areas</h2>
<div class="grid" id="focus"></div>

<footer>
  Automated refresh (data-only). Fallback chain: OpenRouter → OpenHands → manual.
  Last updated: <span id="updated">—</span>.
</footer>

<script>
fetch('dashboard-data.json', {cache:'no-store'})
  .then(r => r.json())
  .then(d => {
    document.getElementById('updated').textContent = d.updated;
    document.getElementById('phases').innerHTML = d.mission.phases.map(p => `
      <div class="card">
        <h3>Phase ${p.id} <span class="status ${p.status}">${p.status}</span></h3>
        <div><strong>${p.target}</strong></div>
        <div class="sub">${p.window}</div>
      </div>`).join('');
    document.getElementById('focus').innerHTML = d.focus_areas.map(f => `
      <div class="card">
        <h3>${f.name}</h3>
        <div class="sub">Priority ${f.priority}</div>
        <div>${f.description}</div>
      </div>`).join('');
  })
  .catch(e => {
    document.getElementById('phases').textContent = 'Failed to load dashboard-data.json';
  });
</script>
</body>
</html>
