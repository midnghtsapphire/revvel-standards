<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard — $10k → $10M</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0b0f14; --card:#121821; --fg:#e6edf3; --muted:#8b949e; --acc:#39d353; --warn:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px; border-bottom:1px solid #1f2630; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:13px; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid #1f2630; border-radius:10px; padding:16px; }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .card .val { font-size:26px; font-weight:700; }
  .phase { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #1f2630; }
  .phase:last-child { border-bottom:0; }
  .status { font-size:12px; padding:2px 8px; border-radius:12px; }
  .status.active { background:var(--acc); color:#000; }
  .status.pending { background:#1f2630; color:var(--muted); }
  .bar { height:8px; background:#1f2630; border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; background:var(--acc); width:0%; }
  section { margin-top:24px; }
  h2 { font-size:16px; margin:0 0 12px; }
  footer { padding:24px; text-align:center; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🎯 Mission Dashboard</h1>
  <div class="sub">Prime Directive: $10k/month → $10M in 3 years</div>
</header>
<main>
  <div class="grid">
    <div class="card"><h3>Current MRR</h3><div class="val" id="mrr">$0</div></div>
    <div class="card"><h3>Target MRR</h3><div class="val" id="target">$10,000</div></div>
    <div class="card"><h3>Month</h3><div class="val" id="month">1</div></div>
    <div class="card"><h3>Progress</h3><div class="val" id="pct">0%</div><div class="bar"><i id="bar"></i></div></div>
  </div>

  <section>
    <h2>Phases</h2>
    <div class="card" id="phases"></div>
  </section>

  <section>
    <h2>Focus Areas</h2>
    <div class="grid" id="focus"></div>
  </section>
</main>
<footer>Auto-generated • <span id="ts"></span></footer>

<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const fmt = n => '$' + n.toLocaleString();
  document.getElementById('mrr').textContent = fmt(d.metrics.current_mrr);
  document.getElementById('target').textContent = fmt(d.metrics.target_mrr);
  document.getElementById('month').textContent = d.metrics.month;
  document.getElementById('pct').textContent = d.metrics.progress_pct + '%';
  document.getElementById('bar').style.width = d.metrics.progress_pct + '%';
  document.getElementById('ts').textContent = d.generated_at;
  document.getElementById('phases').innerHTML = d.phases.map(p =>
    `<div class="phase"><span><strong>Phase ${p.id}</strong> — ${p.name} (m ${p.months})</span>`+
    `<span class="status ${p.status}">${p.status}</span></div>`
  ).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f =>
    `<div class="card"><h3>#${f.priority} ${f.name}</h3><div>${f.description}</div></div>`
  ).join('');
}).catch(e=>{ document.querySelector('main').innerHTML = '<div class="card">Failed to load dashboard-data.json</div>'; });
</script>
</body>
</html>
