<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 2rem; max-width: 960px; }
  h1 { margin-bottom: 0.25rem; }
  .sub { color: #666; margin-bottom: 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 1rem; }
  .card { border: 1px solid #ccc4; border-radius: 8px; padding: 1rem; background: #fff1; }
  .card h3 { margin: 0 0 0.5rem; font-size: 1rem; }
  .kpi { font-size: 1.5rem; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ccc4; }
  code { background: #8881; padding: 0.1rem 0.3rem; border-radius: 3px; }
</style>
</head>
<body>
<h1>Project Dashboard</h1>
<div class="sub">Prime directive: <strong>$10k/month &rarr; $10M in 3 years</strong></div>

<div class="grid">
  <div class="card"><h3>Current Phase</h3><div class="kpi" id="phase">1</div></div>
  <div class="card"><h3>MRR</h3><div class="kpi" id="mrr">$0</div></div>
  <div class="card"><h3>Total Revenue</h3><div class="kpi" id="total">$0</div></div>
  <div class="card"><h3>Updated</h3><div id="updated">—</div></div>
</div>

<h2>Phases</h2>
<table id="phases"><thead><tr><th>Phase</th><th>Target</th><th>Months</th></tr></thead><tbody></tbody></table>

<h2>Focus Areas</h2>
<table id="focus"><thead><tr><th>#</th><th>Name</th><th>Status</th></tr></thead><tbody></tbody></table>

<script>
fetch('dashboard-data.json').then(r => r.json()).then(d => {
  document.getElementById('phase').textContent = d.current.phase;
  document.getElementById('mrr').textContent = '$' + d.current.mrr.toLocaleString();
  document.getElementById('total').textContent = '$' + d.current.total_revenue.toLocaleString();
  document.getElementById('updated').textContent = d.updated;
  const pb = document.querySelector('#phases tbody');
  d.mission.phases.forEach(p => {
    const tgt = p.target_mrr ? '$' + p.target_mrr.toLocaleString() + '/mo' : '$' + p.target_total.toLocaleString() + ' total';
    pb.insertAdjacentHTML('beforeend', `<tr><td>${p.phase}</td><td>${tgt}</td><td>${p.months}</td></tr>`);
  });
  const fb = document.querySelector('#focus tbody');
  d.focus_areas.sort((a,b)=>a.priority-b.priority).forEach(f => {
    fb.insertAdjacentHTML('beforeend', `<tr><td>${f.priority}</td><td>${f.name}</td><td>${f.status}</td></tr>`);
  });
}).catch(e => {
  document.body.insertAdjacentHTML('beforeend', '<p style="color:red">Failed to load dashboard-data.json: ' + e + '</p>');
});
</script>
</body>
</html>
