<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard</title>
<style>
  :root { --bg:#0b1020; --card:#141a2e; --fg:#e8ecf7; --muted:#93a0c2; --accent:#6ee7b7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px; border-bottom:1px solid #1f2745; }
  h1 { margin:0 0 6px; font-size:22px; }
  .muted { color:var(--muted); font-size:13px; }
  main { padding:24px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .card { background:var(--card); border:1px solid #1f2745; border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 8px; font-size:15px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; }
  ul { margin:0; padding-left:18px; }
  li { margin:4px 0; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; background:#1f2745; color:var(--muted); margin-left:6px; }
  .pill.active { background:#134e3a; color:var(--accent); }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; border-top:1px solid #1f2745; }
</style>
</head>
<body>
<header>
  <h1>Prime Directive: $10k/month → $10M in 3 years</h1>
  <div class="muted" id="updated">Loading…</div>
</header>
<main id="grid"></main>
<footer>Automated dashboard refresh · generated data only</footer>
<script>
fetch('dashboard-data.json', {cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent = 'Updated: ' + d.updated_at;
  const grid = document.getElementById('grid');

  const phases = document.createElement('div');
  phases.className = 'card';
  phases.innerHTML = '<h2>Phases</h2><ul>' + d.mission.phases.map(p =>
    `<li>${p.name}: ${p.target} <span class="muted">(${p.window})</span><span class="pill ${p.status==='active'?'active':''}">${p.status}</span></li>`
  ).join('') + '</ul>';
  grid.appendChild(phases);

  const focus = document.createElement('div');
  focus.className = 'card';
  focus.innerHTML = '<h2>Focus Areas</h2><ul>' + d.focus_areas.map(f =>
    `<li><strong>${f.name}</strong> — <span class="muted">${f.description}</span></li>`
  ).join('') + '</ul>';
  grid.appendChild(focus);

  const auto = document.createElement('div');
  auto.className = 'card';
  auto.innerHTML = `<h2>Automation</h2>
    <div>Agent: <strong>${d.automation.agent}</strong></div>
    <div class="muted">Fallback: ${d.automation.fallback_chain.join(' → ')}</div>
    <div class="muted" style="margin-top:8px">Last batch: ${d.automation.last_batch_issues.length} issues</div>`;
  grid.appendChild(auto);
}).catch(e=>{
  document.getElementById('updated').textContent = 'Failed to load dashboard-data.json';
});
</script>
</body>
</html>
