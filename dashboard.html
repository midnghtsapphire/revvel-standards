<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mission Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --accent:#3fb950; --muted:#8b949e; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--fg); padding:2rem; }
  h1 { margin:0 0 .25rem; font-size:1.75rem; }
  .sub { color:var(--muted); margin-bottom:2rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; margin-bottom:2rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:.9rem; text-transform:uppercase; color:var(--muted); letter-spacing:.05em; }
  .card .val { font-size:1.5rem; font-weight:600; }
  .status-active { color:var(--accent); }
  .status-pending { color:var(--muted); }
  .phase { display:flex; justify-content:space-between; padding:.5rem 0; border-bottom:1px solid var(--border); }
  .phase:last-child { border-bottom:none; }
  .focus { display:flex; align-items:center; gap:.75rem; padding:.5rem 0; }
  .focus .num { background:var(--accent); color:var(--bg); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; }
  footer { color:var(--muted); font-size:.8rem; margin-top:2rem; }
</style>
</head>
<body>
<h1>🎯 Mission: $10k/month → $10M in 3 Years</h1>
<p class="sub">Auto-generated dashboard · Last update: <span id="updated">2026-08-05</span></p>

<div class="grid">
  <div class="card"><h3>MRR</h3><div class="val" id="mrr">$0</div></div>
  <div class="card"><h3>Total Revenue</h3><div class="val" id="revenue">$0</div></div>
  <div class="card"><h3>Products Shipped</h3><div class="val" id="products">0</div></div>
  <div class="card"><h3>Customers</h3><div class="val" id="customers">0</div></div>
</div>

<div class="card">
  <h3>Phases</h3>
  <div id="phases"></div>
</div>

<div class="card" style="margin-top:1rem;">
  <h3>Focus Areas</h3>
  <div id="focus"></div>
</div>

<footer>Automated via OpenRouter → OpenHands → manual · free-tier pipeline</footer>

<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent = d.updated;
  document.getElementById('mrr').textContent = '$'+d.metrics.mrr.toLocaleString();
  document.getElementById('revenue').textContent = '$'+d.metrics.total_revenue.toLocaleString();
  document.getElementById('products').textContent = d.metrics.products_shipped;
  document.getElementById('customers').textContent = d.metrics.customers;
  document.getElementById('phases').innerHTML = d.phases.map(p=>
    `<div class="phase"><span><strong>${p.name}</strong> — ${p.target} (mo ${p.months})</span><span class="status-${p.status}">${p.status}</span></div>`
  ).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f=>
    `<div class="focus"><span class="num">${f.priority}</span><span><strong>${f.name}</strong> — ${f.description}</span></div>`
  ).join('');
}).catch(e=>console.error(e));
</script>
</body>
</html>
