<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b98a5; --accent:#22d3ee; --ok:#22c55e; --warn:#f59e0b; --card:#111823; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px; border-bottom:1px solid #1f2a37; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:13px; }
  main { padding:24px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background:var(--card); border:1px solid #1f2a37; border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 10px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .kpi { font-size:26px; font-weight:700; }
  .phase { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #1f2a37; font-size:14px; }
  .phase:last-child { border-bottom:none; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#1f2a37; color:var(--muted); }
  .badge.ok { background:rgba(34,197,94,.15); color:var(--ok); }
  .badge.warn { background:rgba(245,158,11,.15); color:var(--warn); }
  ul { margin:0; padding-left:18px; }
  li { margin:4px 0; font-size:14px; }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; border-top:1px solid #1f2a37; }
  code { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard — <span style="color:var(--accent)">$10M in 3 Years</span></h1>
  <div class="sub">Prime Directive: $10k/month → $10M total. Auto-refreshed from <code>dashboard-data.json</code>.</div>
</header>
<main id="root">Loading…</main>
<footer id="foot">—</footer>
<script>
fetch('dashboard-data.json', {cache:'no-store'}).then(r=>r.json()).then(d=>{
  const root = document.getElementById('root');
  const phaseBadge = s => s==='in_progress' ? '<span class="badge warn">in progress</span>'
                    : s==='done' ? '<span class="badge ok">done</span>'
                    : '<span class="badge">pending</span>';
  const phases = d.mission.phases.map(p =>
    `<div class="phase"><span><strong>Phase ${p.id}</strong> · ${p.target} <span class="sub">(${p.window})</span></span>${phaseBadge(p.status)}</div>`
  ).join('');
  const focus = d.focus_areas.map(f => `<li><strong>${f.name}</strong> — <span class="sub">${f.description}</span></li>`).join('');
  root.innerHTML = `
    <section class="card"><h2>MRR</h2><div class="kpi">$${(d.metrics.mrr_usd||0).toLocaleString()}</div><div class="sub">Target Phase 1: $10,000</div></section>
    <section class="card"><h2>Cumulative Revenue</h2><div class="kpi">$${(d.metrics.cumulative_revenue_usd||0).toLocaleString()}</div><div class="sub">Goal: $10,000,000</div></section>
    <section class="card"><h2>Active Products</h2><div class="kpi">${d.metrics.active_products}</div><div class="sub">Automation-built</div></section>
    <section class="card"><h2>Issues Processed (batch)</h2><div class="kpi">${d.metrics.open_issues_processed}</div><div class="sub">Agent: ${d.automation.agent}</div></section>
    <section class="card" style="grid-column: 1 / -1"><h2>Phases</h2>${phases}</section>
    <section class="card" style="grid-column: 1 / -1"><h2>Focus Areas</h2><ul>${focus}</ul></section>
  `;
  document.getElementById('foot').textContent =
    `Updated ${d.updated} · Fallback: ${d.automation.fallback_chain.join(' → ')} · Ruleset ${d.audit.ruleset} (${d.audit.audit_id})`;
}).catch(e=>{
  document.getElementById('root').textContent = 'Failed to load dashboard-data.json: ' + e;
});
</script>
</body>
</html>
