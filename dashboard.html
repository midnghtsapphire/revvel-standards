<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0f17; --fg:#e6edf3; --muted:#8b949e; --accent:#3fb950; --warn:#d29922; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:2rem; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 .5rem; font-size:1.75rem; }
  .subtitle { color:var(--muted); }
  main { padding:2rem; max-width:1200px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; margin-bottom:2rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1.25rem; }
  .card h3 { margin:0 0 .5rem; font-size:.85rem; text-transform:uppercase; color:var(--muted); letter-spacing:.05em; }
  .card .value { font-size:1.5rem; font-weight:600; }
  .phase { display:flex; justify-content:space-between; align-items:center; padding:.75rem 0; border-bottom:1px solid var(--border); }
  .phase:last-child { border-bottom:none; }
  .status { padding:.15rem .6rem; border-radius:12px; font-size:.75rem; text-transform:uppercase; }
  .status.active { background:var(--accent); color:#000; }
  .status.pending { background:var(--border); color:var(--muted); }
  footer { padding:1rem 2rem; color:var(--muted); font-size:.8rem; text-align:center; border-top:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Mission: $10M in 3 Years</h1>
  <div class="subtitle">Prime directive: $10k/month → $10M total</div>
</header>
<main>
  <div class="grid">
    <div class="card"><h3>Current MRR</h3><div class="value" id="mrr">$0</div></div>
    <div class="card"><h3>Pipeline</h3><div class="value" id="pipeline">0</div></div>
    <div class="card"><h3>Active Products</h3><div class="value" id="products">0</div></div>
    <div class="card"><h3>Progress</h3><div class="value" id="progress">0%</div></div>
  </div>
  <div class="card">
    <h3>Phases</h3>
    <div id="phases"></div>
  </div>
</main>
<footer>Generated data only — refreshed <span id="ts"></span></footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('mrr').textContent = '$' + (d.metrics.current_mrr||0).toLocaleString();
  document.getElementById('pipeline').textContent = d.metrics.pipeline_count||0;
  document.getElementById('products').textContent = d.metrics.active_products||0;
  document.getElementById('progress').textContent = (d.metrics.progress_pct||0) + '%';
  document.getElementById('ts').textContent = d.generated_at;
  const p = document.getElementById('phases');
  d.phases.forEach(x=>{
    const target = x.target_mrr ? '$'+x.target_mrr.toLocaleString()+'/mo' : '$'+x.target_total.toLocaleString()+' total';
    p.insertAdjacentHTML('beforeend',
      `<div class="phase"><div><strong>Phase ${x.id}: ${x.name}</strong><br><span style="color:var(--muted);font-size:.85rem">${x.window} • ${target}</span></div><span class="status ${x.status}">${x.status}</span></div>`);
  });
}).catch(e=>console.error(e));
</script>
</body>
</html>
