<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b1020; --fg:#e6edf3; --accent:#5eead4; --muted:#94a3b8; --card:#111827; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:2rem; text-align:center; border-bottom:1px solid #1f2937; }
  h1 { margin:0 0 .5rem; font-size:1.75rem; }
  .subtitle { color:var(--muted); }
  main { max-width:1100px; margin:0 auto; padding:2rem 1rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
  .card { background:var(--card); border:1px solid #1f2937; border-radius:12px; padding:1.25rem; }
  .card h3 { margin:0 0 .5rem; font-size:.85rem; text-transform:uppercase; color:var(--muted); letter-spacing:.05em; }
  .card .value { font-size:1.5rem; font-weight:600; color:var(--accent); }
  .phases { margin-top:2rem; }
  .phase { display:flex; justify-content:space-between; padding:.75rem 1rem; border:1px solid #1f2937; border-radius:8px; margin-bottom:.5rem; background:var(--card); }
  .phase.active { border-color:var(--accent); }
  .status { font-size:.75rem; color:var(--muted); text-transform:uppercase; }
  .status.active { color:var(--accent); }
  footer { text-align:center; padding:1.5rem; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="subtitle">Prime Directive: $10k/month → $10M in 3 years</div>
</header>
<main>
  <section class="grid" id="metrics">
    <div class="card"><h3>Current MRR</h3><div class="value" id="mrr">$0</div></div>
    <div class="card"><h3>Total Revenue</h3><div class="value" id="total">$0</div></div>
    <div class="card"><h3>Active Products</h3><div class="value" id="products">0</div></div>
    <div class="card"><h3>Open Issues</h3><div class="value" id="issues">0</div></div>
  </section>
  <section class="phases" id="phases"></section>
</main>
<footer>
  <div id="generated">Generated: —</div>
  <div>Focus: POLAR.SH · OSINT · Automated Pipeline</div>
</footer>
<script>
fetch('dashboard-data.json').then(r => r.json()).then(d => {
  document.getElementById('mrr').textContent = '$' + (d.metrics.current_mrr || 0).toLocaleString();
  document.getElementById('total').textContent = '$' + (d.metrics.total_revenue || 0).toLocaleString();
  document.getElementById('products').textContent = d.metrics.active_products || 0;
  document.getElementById('issues').textContent = d.metrics.open_issues || 0;
  document.getElementById('generated').textContent = 'Generated: ' + d.generated_at;
  const phases = document.getElementById('phases');
  (d.mission.phases || []).forEach(p => {
    const el = document.createElement('div');
    el.className = 'phase' + (p.status === 'active' ? ' active' : '');
    const target = p.target_mrr ? '$' + p.target_mrr.toLocaleString() + '/mo' : '$' + p.target_total.toLocaleString() + ' total';
    el.innerHTML = '<div><strong>Phase ' + p.phase + '</strong> — ' + target + ' <span style="color:#94a3b8">(month ' + p.months + ')</span></div><div class="status ' + p.status + '">' + p.status + '</div>';
    phases.appendChild(el);
  });
}).catch(e => { document.getElementById('generated').textContent = 'Error loading data: ' + e.message; });
</script>
</body>
</html>
