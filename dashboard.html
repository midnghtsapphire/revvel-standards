<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mission Dashboard — $10k/mo → $10M</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 2rem; background:#0b0f14; color:#e6edf3; }
  h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
  .sub { color:#8b949e; margin-bottom: 1.5rem; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .card { background:#151b23; border:1px solid #222b36; border-radius: 10px; padding: 1rem 1.1rem; }
  .card h3 { margin: 0 0 .5rem; font-size: 0.95rem; color:#8b949e; text-transform: uppercase; letter-spacing: .04em; }
  .val { font-size: 1.4rem; font-weight: 700; }
  .phase { display:flex; justify-content: space-between; padding: .4rem 0; border-bottom: 1px dashed #222b36; }
  .phase:last-child { border-bottom: none; }
  .status { font-size: .75rem; padding: .1rem .5rem; border-radius: 999px; }
  .active { background:#1f6feb33; color:#79c0ff; }
  .pending { background:#30363d; color:#8b949e; }
  footer { margin-top: 2rem; color:#6e7681; font-size:.85rem; }
  a { color:#79c0ff; }
</style>
</head>
<body>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime directive: <strong>$10k/month → $10M in 3 years</strong> · Updated <span id="updated">—</span></div>

  <div class="grid">
    <div class="card"><h3>MRR</h3><div class="val" id="mrr">—</div><div class="sub">Target: <span id="mrrTarget">—</span></div></div>
    <div class="card"><h3>Total Revenue</h3><div class="val" id="total">—</div><div class="sub">Target: <span id="totalTarget">—</span></div></div>
    <div class="card"><h3>Active Products</h3><div class="val" id="products">—</div></div>
    <div class="card"><h3>Issues Resolved</h3><div class="val" id="issues">—</div></div>
  </div>

  <div class="card" style="margin-top:1rem">
    <h3>Phases</h3>
    <div id="phases"></div>
  </div>

  <div class="card" style="margin-top:1rem">
    <h3>Focus Areas</h3>
    <div id="focus"></div>
  </div>

  <footer>Data source: <a href="./dashboard-data.json">dashboard-data.json</a></footer>

<script>
const fmtUSD = n => new Intl.NumberFormat('en-US', {style:'currency', currency:'USD', maximumFractionDigits:0}).format(n||0);
fetch('./dashboard-data.json', {cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent = d.updated || '—';
  document.getElementById('mrr').textContent = fmtUSD(d.metrics.mrr_usd);
  document.getElementById('mrrTarget').textContent = fmtUSD(d.metrics.mrr_target_usd);
  document.getElementById('total').textContent = fmtUSD(d.metrics.total_revenue_usd);
  document.getElementById('totalTarget').textContent = fmtUSD(d.metrics.total_target_usd);
  document.getElementById('products').textContent = d.metrics.active_products;
  document.getElementById('issues').textContent = d.metrics.open_issues_resolved;
  document.getElementById('phases').innerHTML = d.phases.map(p =>
    `<div class="phase"><span><strong>${p.name}</strong> · ${p.target} <span class="sub">(${p.window})</span></span><span class="status ${p.status}">${p.status}</span></div>`
  ).join('');
  document.getElementById('focus').innerHTML = d.focus.map(f =>
    `<div class="phase"><span><strong>${f.name}</strong></span><span class="sub">${f.desc}</span></div>`
  ).join('');
}).catch(e=>{ document.body.insertAdjacentHTML('beforeend', `<pre style="color:#f85149">${e}</pre>`); });
</script>
</body>
</html>
