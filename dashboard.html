<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Project Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#0b0f14; color:#e6edf3; margin:0; padding:2rem; }
  h1 { margin:0 0 .25rem; }
  .sub { color:#8b949e; margin-bottom:1.5rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:1rem; color:#58a6ff; }
  .status { display:inline-block; padding:.125rem .5rem; border-radius:999px; font-size:.75rem; }
  .active { background:#238636; }
  .pending { background:#30363d; color:#8b949e; }
  footer { margin-top:2rem; color:#6e7681; font-size:.8rem; }
</style>
</head>
<body>
<h1>$10k/month → $10M in 3 Years</h1>
<p class="sub">Automated dashboard · updated 2026-08-05</p>
<div class="grid" id="phases"></div>
<footer>Focus: polar.sh · OSINT · automated product pipeline</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const el=document.getElementById('phases');
  el.innerHTML=d.phases.map(p=>`<div class="card"><h3>Phase ${p.id}</h3><div><strong>${p.target}</strong></div><div class="sub">${p.window}</div><span class="status ${p.status}">${p.status}</span></div>`).join('');
}).catch(()=>{});
</script>
</body>
</html>
