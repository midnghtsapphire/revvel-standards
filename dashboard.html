<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b1020; --fg:#e6edf3; --muted:#9aa5b1; --accent:#4ade80; --card:#131a2e; --border:#1f2a44; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:2rem 1.5rem 1rem; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 .25rem; font-size:1.6rem; }
  .sub { color:var(--muted); font-size:.95rem; }
  main { padding:1.5rem; max-width:1100px; margin:0 auto; display:grid; gap:1.25rem; }
  .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1rem 1.1rem; }
  .card h3 { margin:0 0 .5rem; font-size:1rem; color:var(--muted); font-weight:600; }
  .target { font-size:1.35rem; font-weight:700; }
  .status { display:inline-block; margin-top:.5rem; padding:.15rem .55rem; border-radius:999px; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; }
  .status.in_progress { background:rgba(74,222,128,.15); color:var(--accent); }
  .status.pending { background:rgba(154,165,177,.15); color:var(--muted); }
  ul.focus { list-style:none; padding:0; margin:0; }
  ul.focus li { padding:.6rem 0; border-bottom:1px solid var(--border); }
  ul.focus li:last-child { border-bottom:none; }
  .name { font-weight:600; }
  .desc { color:var(--muted); font-size:.9rem; }
  footer { padding:1rem 1.5rem 2rem; color:var(--muted); font-size:.8rem; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Project Dashboard</h1>
  <div class="sub">Prime Directive: <strong>$10k/month → $10M in 3 years</strong></div>
</header>
<main>
  <section>
    <h2 style="margin:0 0 .75rem;font-size:1.1rem;">Phase Roadmap</h2>
    <div class="grid" id="phases"></div>
  </section>
  <section>
    <h2 style="margin:0 0 .75rem;font-size:1.1rem;">Focus Areas</h2>
    <div class="card">
      <ul class="focus" id="focus"></ul>
    </div>
  </section>
  <section>
    <div class="card">
      <h3>Automation</h3>
      <div>Agent: <strong id="agent">openrouter</strong></div>
      <div class="desc" id="chain"></div>
    </div>
  </section>
</main>
<footer>
  <span id="updated"></span> · Generated data only; no logic changes.
</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const phases = document.getElementById('phases');
  d.mission.phases.forEach(p=>{
    const el = document.createElement('div');
    el.className='card';
    el.innerHTML = `<h3>Phase ${p.id} · ${p.window}</h3>
      <div class="target">${p.target}</div>
      <span class="status ${p.status}">${p.status.replace('_',' ')}</span>`;
    phases.appendChild(el);
  });
  const focus = document.getElementById('focus');
  d.focus_areas.forEach(f=>{
    const li = document.createElement('li');
    li.innerHTML = `<div class="name">${f.name}</div><div class="desc">${f.description}</div>`;
    focus.appendChild(li);
  });
  document.getElementById('agent').textContent = d.automation.agent;
  document.getElementById('chain').textContent = 'Fallback: ' + d.automation.fallback_chain.join(' → ');
  document.getElementById('updated').textContent = 'Updated ' + d.updated;
}).catch(e=>{
  document.querySelector('main').innerHTML = '<div class="card">Failed to load dashboard-data.json</div>';
});
</script>
</body>
</html>
