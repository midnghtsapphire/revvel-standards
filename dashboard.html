<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0f14; --panel:#121821; --accent:#4ade80; --muted:#8b95a5; --text:#e6edf3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding: 2rem; border-bottom: 1px solid #1f2937; }
  h1 { margin:0 0 .5rem; font-size:1.5rem; }
  .mission { color: var(--accent); font-weight:600; }
  main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin-bottom:2rem; }
  .card { background: var(--panel); border:1px solid #1f2937; border-radius:8px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:.9rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .card .value { font-size:1.4rem; font-weight:700; }
  .card .sub { color: var(--muted); font-size:.85rem; margin-top:.25rem; }
  .status-active { color: var(--accent); }
  .status-pending { color: #f59e0b; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:.5rem 0; border-bottom:1px solid #1f2937; }
  li:last-child { border-bottom:none; }
  footer { padding:1rem 2rem; color:var(--muted); font-size:.85rem; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="mission">PRIME DIRECTIVE: $10k/month → $10M in 3 years</div>
</header>
<main>
  <section>
    <h2>Phases</h2>
    <div class="grid" id="phases"></div>
  </section>
  <section>
    <h2>Focus Areas</h2>
    <div class="grid" id="focus"></div>
  </section>
  <section>
    <h2>Metrics</h2>
    <div class="grid" id="metrics"></div>
  </section>
</main>
<footer>
  <span id="generated"></span> · Automated by OpenRouter agent
</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(data=>{
  const phases = document.getElementById('phases');
  data.phases.forEach(p=>{
    const el = document.createElement('div');
    el.className='card';
    el.innerHTML = `<h3>Phase ${p.phase}</h3><div class="value">${p.target}</div><div class="sub">${p.window}</div><div class="status-${p.status}">● ${p.status}</div>`;
    phases.appendChild(el);
  });
  const focus = document.getElementById('focus');
  data.focus_areas.forEach(f=>{
    const el = document.createElement('div');
    el.className='card';
    el.innerHTML = `<h3>${f.name}</h3><div class="sub">${f.description}</div>`;
    focus.appendChild(el);
  });
  const metrics = document.getElementById('metrics');
  const m = data.metrics;
  const items = [
    ['MRR', '$'+m.mrr_usd.toLocaleString()],
    ['Total Revenue', '$'+m.total_revenue_usd.toLocaleString()],
    ['Active Products', m.active_products],
    ['Open Issues', m.open_issues]
  ];
  items.forEach(([k,v])=>{
    const el = document.createElement('div');
    el.className='card';
    el.innerHTML = `<h3>${k}</h3><div class="value">${v}</div>`;
    metrics.appendChild(el);
  });
  document.getElementById('generated').textContent = 'Generated ' + data.generated_at;
}).catch(e=>{
  document.getElementById('generated').textContent = 'Data load failed: '+e.message;
});
</script>
</body>
</html>
