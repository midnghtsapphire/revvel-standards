<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mission Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0f17;color:#e6edf3;margin:0;padding:2rem;}
  h1{margin:0 0 .25rem;font-size:1.5rem;}
  .sub{color:#8b949e;margin-bottom:1.5rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1rem;}
  .card h2{margin:0 0 .5rem;font-size:1rem;color:#58a6ff;}
  .target{font-size:1.25rem;font-weight:700;}
  .status{display:inline-block;margin-top:.5rem;padding:.15rem .5rem;border-radius:999px;font-size:.75rem;}
  .active{background:#238636;color:#fff;}
  .pending{background:#30363d;color:#8b949e;}
  footer{margin-top:2rem;color:#6e7681;font-size:.8rem;}
</style>
</head>
<body>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime directive: $10k/month → $10M in 3 years</div>
  <div class="grid" id="phases"></div>
  <footer>Auto-generated · <span id="ts"></span></footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('ts').textContent=d.updated;
  document.getElementById('phases').innerHTML=d.phases.map(p=>`
    <div class="card">
      <h2>${p.name}</h2>
      <div class="target">${p.target}</div>
      <div class="sub">${p.window}</div>
      <span class="status ${p.status}">${p.status}</span>
    </div>`).join('');
});
</script>
</body>
</html>
