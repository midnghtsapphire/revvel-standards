<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0d10; --fg:#e6edf3; --muted:#8b949e; --accent:#2ea043; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:2rem; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 .25rem; font-size:1.75rem; }
  .sub { color:var(--muted); font-size:.9rem; }
  main { max-width:1100px; margin:0 auto; padding:2rem; display:grid; gap:1.5rem; }
  .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1.25rem; }
  .card h2 { margin:0 0 .5rem; font-size:1rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .value { font-size:1.5rem; font-weight:600; }
  .bar { background:var(--border); height:8px; border-radius:4px; overflow:hidden; margin-top:.5rem; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:.5rem 0; border-bottom:1px solid var(--border); }
  li:last-child { border:0; }
  .tag { display:inline-block; padding:.15rem .5rem; border-radius:4px; font-size:.75rem; background:var(--border); color:var(--muted); }
  .tag.active { background:var(--accent); color:#000; }
  footer { padding:1.5rem 2rem; color:var(--muted); font-size:.8rem; border-top:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime Directive: $10k/month → $10M in 3 years</div>
</header>
<main>
  <div class="grid">
    <div class="card"><h2>Current MRR</h2><div class="value" id="mrr">$0</div></div>
    <div class="card"><h2>Target MRR</h2><div class="value" id="tgt">$10,000</div></div>
    <div class="card"><h2>Progress</h2><div class="value" id="pct">0%</div><div class="bar"><span id="barfill" style="width:0%"></span></div></div>
    <div class="card"><h2>Runway</h2><div class="value" id="run">36 mo</div></div>
  </div>
  <div class="card">
    <h2>Phases</h2>
    <ul id="phases"></ul>
  </div>
  <div class="card">
    <h2>Focus Areas</h2>
    <ul id="focus"></ul>
  </div>
</main>
<footer>Auto-generated · <span id="ts"></span></footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const fmt = n => '$'+n.toLocaleString();
  document.getElementById('mrr').textContent = fmt(d.metrics.current_mrr);
  document.getElementById('tgt').textContent = fmt(d.metrics.target_mrr);
  document.getElementById('pct').textContent = d.metrics.progress_pct+'%';
  document.getElementById('barfill').style.width = d.metrics.progress_pct+'%';
  document.getElementById('run').textContent = d.metrics.runway_months+' mo';
  document.getElementById('ts').textContent = d.updated_at;
  document.getElementById('phases').innerHTML = d.phases.map(p=>
    `<li><strong>Phase ${p.id}: ${p.name}</strong> — ${p.window} <span class="tag ${p.status==='active'?'active':''}">${p.status}</span></li>`
  ).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f=>
    `<li><strong>${f.name}</strong> — ${f.description}</li>`
  ).join('');
});
</script>
</body>
</html>
