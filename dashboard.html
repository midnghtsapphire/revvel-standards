<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mission Dashboard — $10k/mo → $10M</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0b1020; color:#e6e9f2; margin:0; padding:2rem; }
  h1 { margin:0 0 .25rem; font-size:1.6rem; }
  .sub { color:#8892b0; margin-bottom:1.5rem; }
  .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .card { background:#131a2e; border:1px solid #1f2a44; border-radius:10px; padding:1rem; }
  .card h2 { margin:0 0 .5rem; font-size:1rem; color:#7dd3fc; }
  .kpi { font-size:1.4rem; font-weight:600; }
  .muted { color:#8892b0; font-size:.85rem; }
  .status-active { color:#4ade80; }
  .status-pending { color:#fbbf24; }
  ul { padding-left:1.1rem; margin:.25rem 0; }
  code { background:#0b1020; padding:1px 6px; border-radius:4px; }
  footer { margin-top:2rem; color:#8892b0; font-size:.8rem; }
</style>
</head>
<body>
<h1>Mission Dashboard</h1>
<div class="sub">Prime directive: <strong>$10k/month → $10M in 3 years</strong></div>

<div class="grid">
  <div class="card">
    <h2>Current MRR</h2>
    <div class="kpi" id="mrr">$0</div>
    <div class="muted">Target: $10,000</div>
  </div>
  <div class="card">
    <h2>Cumulative Revenue</h2>
    <div class="kpi" id="cum">$0</div>
    <div class="muted">Target: $10,000,000</div>
  </div>
  <div class="card">
    <h2>Automation</h2>
    <div class="kpi">OpenRouter</div>
    <div class="muted">Fallback: OpenHands → manual</div>
  </div>
</div>

<h2 style="margin-top:2rem">Phases</h2>
<div class="grid" id="phases"></div>

<h2 style="margin-top:2rem">Focus Areas</h2>
<div class="grid" id="focus"></div>

<footer>
  Data: <code>dashboard-data.json</code> · Generated 2026-08-05
</footer>

<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('mrr').textContent = '$' + d.revenue.current_mrr_usd.toLocaleString();
  document.getElementById('cum').textContent = '$' + d.revenue.cumulative_usd.toLocaleString();
  const p = document.getElementById('phases');
  d.phases.forEach(x=>{
    const el = document.createElement('div');
    el.className='card';
    el.innerHTML = `<h2>${x.name}</h2><div class="kpi">${x.target}</div><div class="muted">${x.window}</div><div class="status-${x.status}">● ${x.status}</div>`;
    p.appendChild(el);
  });
  const f = document.getElementById('focus');
  d.focus_areas.forEach(x=>{
    const el = document.createElement('div');
    el.className='card';
    el.innerHTML = `<h2>${x.name}</h2><div class="muted">${x.description}</div>`;
    f.appendChild(el);
  });
}).catch(e=>{
  document.body.insertAdjacentHTML('beforeend','<p style="color:#f87171">Failed to load dashboard-data.json</p>');
});
</script>
</body>
</html>
