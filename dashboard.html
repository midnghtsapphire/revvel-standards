<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Project Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; background:#0b0f17; color:#e6edf3; margin:0; padding:2rem; }
  h1 { margin-top:0; }
  .mission { color:#7ee787; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin-top:1.5rem; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:1rem; }
  .status-active { color:#7ee787; }
  .status-pending { color:#8b949e; }
  .tag { display:inline-block; background:#21262d; padding:.15rem .5rem; border-radius:4px; font-size:.8rem; margin-right:.25rem; }
  footer { margin-top:2rem; color:#8b949e; font-size:.85rem; }
</style>
</head>
<body>
<h1>Project Dashboard</h1>
<p class="mission">Mission: $10k/month → $10M in 3 years</p>
<div id="phases" class="grid"></div>
<h2>Focus Areas</h2>
<div id="focus"></div>
<footer>
  Automated refresh — generated data only. See WR-02, audit-2026-08-05.
</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('phases').innerHTML = d.phases.map(p=>`
    <div class="card">
      <h3>Phase ${p.id}</h3>
      <div><strong>${p.target}</strong></div>
      <div>${p.window}</div>
      <div class="status-${p.status}">● ${p.status}</div>
    </div>`).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f=>`<span class="tag">${f}</span>`).join('');
}).catch(e=>{
  document.getElementById('phases').textContent = 'Unable to load dashboard-data.json';
});
</script>
</body>
</html>
