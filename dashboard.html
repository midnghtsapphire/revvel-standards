<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{color-scheme:dark}
  body{font-family:system-ui,sans-serif;background:#0b0d10;color:#e6e6e6;margin:0;padding:2rem;max-width:960px;margin:auto}
  h1{margin:0 0 .25rem;font-size:1.5rem}
  .sub{color:#8aa;margin-bottom:1.5rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
  .card{background:#141821;border:1px solid #222;border-radius:10px;padding:1rem}
  .card h3{margin:0 0 .5rem;font-size:.9rem;color:#8aa;text-transform:uppercase;letter-spacing:.05em}
  .card .v{font-size:1.4rem;font-weight:600}
  .active{border-color:#3a8}
  .badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.75rem;background:#223;color:#8ac}
  .badge.active{background:#052;color:#8fc}
  footer{margin-top:2rem;color:#556;font-size:.8rem}
</style>
</head>
<body>
<h1>Mission: $10k/month → $10M in 3 years</h1>
<div class="sub">Auto-generated dashboard · updated <span id="ts">—</span></div>
<div class="grid" id="phases"></div>
<h2 style="margin-top:2rem;font-size:1.1rem">Focus areas</h2>
<div class="grid" id="focus"></div>
<footer>Generated data only · no logic changes · WR-02 compliant.</footer>
<script>
fetch('dashboard-data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('ts').textContent=d.updated;
  const p=document.getElementById('phases');
  d.phases.forEach(x=>{
    const el=document.createElement('div');
    el.className='card'+(x.status==='active'?' active':'');
    el.innerHTML=`<h3>Phase ${x.id} <span class="badge ${x.status==='active'?'active':''}">${x.status}</span></h3><div class="v">${x.target}</div><div class="sub">${x.window}</div>`;
    p.appendChild(el);
  });
  const f=document.getElementById('focus');
  d.focus.forEach(x=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<h3>Focus</h3><div class="v">${x}</div>`;
    f.appendChild(el);
  });
}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<pre>'+e+'</pre>')});
</script>
</body>
</html>
