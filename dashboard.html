<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>$10M in 3 Years — Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0b0f14;--fg:#e6edf3;--muted:#7d8590;--accent:#2ea043;--card:#161b22;--border:#30363d}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);padding:24px;max-width:1100px;margin:0 auto}
  h1{margin:0 0 4px;font-size:28px}
  .subtitle{color:var(--muted);margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
  .card h3{margin:0 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .metric{font-size:24px;font-weight:600}
  .phase{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .phase.active{border-color:var(--accent)}
  .badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;text-transform:uppercase}
  .badge.pending{background:#484f58}
  .bar{height:8px;background:#21262d;border-radius:4px;overflow:hidden;margin-top:8px}
  .fill{height:100%;background:var(--accent);width:0%}
  footer{color:var(--muted);font-size:12px;margin-top:32px;text-align:center}
</style>
</head>
<body>
  <h1>💰 $10k/mo → $10M in 3 Years</h1>
  <p class="subtitle">Prime Directive Dashboard · <span id="ts"></span></p>

  <div class="grid">
    <div class="card"><h3>Current MRR</h3><div class="metric" id="mrr">$0</div></div>
    <div class="card"><h3>Target MRR</h3><div class="metric" id="tgt">$10,000</div></div>
    <div class="card"><h3>Total Revenue</h3><div class="metric" id="rev">$0</div></div>
    <div class="card"><h3>3-Year Target</h3><div class="metric">$10,000,000</div></div>
  </div>

  <h2>Phases</h2>
  <div id="phases"></div>

  <h2>Focus Areas</h2>
  <div id="focus" class="grid"></div>

  <footer>Automated update · Agent: openrouter · Free-tier fallback chain</footer>

<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('ts').textContent = 'Updated ' + d.generated_at;
  document.getElementById('mrr').textContent = '$' + d.metrics.current_mrr.toLocaleString();
  document.getElementById('tgt').textContent = '$' + d.metrics.target_mrr.toLocaleString();
  document.getElementById('rev').textContent = '$' + d.metrics.total_revenue.toLocaleString();
  const ph = document.getElementById('phases');
  d.phases.forEach(p=>{
    const t = p.target_mrr ? '$'+p.target_mrr.toLocaleString()+'/mo' : '$'+p.target_total.toLocaleString()+' total';
    ph.innerHTML += `<div class="phase ${p.status}"><div><strong>Phase ${p.id}: ${p.name}</strong><br><span style="color:#7d8590">Months ${p.months} · ${t}</span></div><span class="badge ${p.status}">${p.status}</span></div>`;
  });
  const f = document.getElementById('focus');
  d.focus_areas.forEach(a=>{
    f.innerHTML += `<div class="card"><h3>#${a.priority} ${a.name}</h3><div>${a.description}</div></div>`;
  });
}).catch(e=>{document.body.innerHTML+='<p style="color:#f85149">Failed to load data</p>'});
</script>
</body>
</html>
