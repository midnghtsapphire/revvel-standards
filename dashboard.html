<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0d10; --fg:#e6e6e6; --muted:#9aa3ad; --accent:#4ade80; --card:#14181d; --border:#22282f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 24px; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding: 24px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .card h2 { font-size:14px; margin:0 0 8px; color:var(--muted); text-transform: uppercase; letter-spacing:.05em; }
  .metric { font-size: 22px; font-weight:600; color: var(--accent); }
  ul { margin:8px 0 0; padding-left:18px; }
  li { margin: 4px 0; }
  footer { padding: 16px 24px; color: var(--muted); font-size:12px; border-top:1px solid var(--border); }
  code { background:#1b2027; padding:1px 6px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>Project Dashboard</h1>
  <div class="sub">Prime directive: <strong>$10k/month → $10M in 3 years</strong></div>
</header>
<main id="grid">
  <div class="card"><h2>Loading…</h2><div class="sub">Fetching dashboard-data.json</div></div>
</main>
<footer>Auto-generated. Source: <code>dashboard-data.json</code></footer>
<script>
(async () => {
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('dashboard-data.json', { cache: 'no-store' });
    const data = await res.json();
    const phases = (data.mission?.phases || []).map(p => `<li>Phase ${p.phase}: <strong>${p.target}</strong> <span class="sub">(${p.window})</span></li>`).join('');
    const focus = (data.focus_areas || []).map(f => `<li><strong>${f.name}</strong> — <span class="sub">${f.desc}</span></li>`).join('');
    const m = data.metrics || {};
    grid.innerHTML = `
      <div class="card"><h2>MRR</h2><div class="metric">$${(m.mrr_usd||0).toLocaleString()}</div></div>
      <div class="card"><h2>Total Revenue</h2><div class="metric">$${(m.total_revenue_usd||0).toLocaleString()}</div></div>
      <div class="card"><h2>Active Products</h2><div class="metric">${m.active_products||0}</div></div>
      <div class="card"><h2>Open Issues</h2><div class="metric">${m.open_issues||0}</div></div>
      <div class="card"><h2>Phases</h2><ul>${phases}</ul></div>
      <div class="card"><h2>Focus Areas</h2><ul>${focus}</ul></div>
      <div class="card"><h2>Updated</h2><div class="sub">${data.updated_at||'n/a'}</div></div>
    `;
  } catch (e) {
    grid.innerHTML = `<div class="card"><h2>Error</h2><div class="sub">${String(e)}</div></div>`;
  }
})();
</script>
</body>
</html>
