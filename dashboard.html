<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>$10M Mission Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #0b0f17;
    --panel: #131a26;
    --accent: #4ade80;
    --accent-dim: #22c55e;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --border: #1f2937;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
  .subtitle { color: var(--muted); margin-bottom: 2rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .card h2 { margin: 0 0 .75rem; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .metric { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .phase-list, .focus-list { list-style: none; padding: 0; margin: 0; }
  .phase-list li, .focus-list li {
    padding: .5rem 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .phase-list li:last-child, .focus-list li:last-child { border: 0; }
  .badge {
    background: var(--accent-dim);
    color: #062010;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: .75rem;
    font-weight: 600;
  }
  footer { color: var(--muted); font-size: .85rem; margin-top: 2rem; }
</style>
</head>
<body>
  <h1>🎯 $10M Mission Dashboard</h1>
  <div class="subtitle">Prime directive: $10k/month → $10M in 3 years</div>

  <div class="grid">
    <div class="card">
      <h2>Current MRR</h2>
      <div class="metric" id="mrr">$0</div>
    </div>
    <div class="card">
      <h2>Total Revenue</h2>
      <div class="metric" id="total">$0</div>
    </div>
    <div class="card">
      <h2>Products Shipped</h2>
      <div class="metric" id="products">0</div>
    </div>
    <div class="card">
      <h2>Active Customers</h2>
      <div class="metric" id="customers">0</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Phase Roadmap</h2>
      <ul class="phase-list" id="roadmap"></ul>
    </div>
    <div class="card">
      <h2>Focus Areas</h2>
      <ul class="focus-list" id="focus"></ul>
    </div>
  </div>

  <footer>
    <div>Last updated: <span id="updated">—</span></div>
    <div>Agent: <span id="agent">—</span></div>
  </footer>

<script>
fetch('dashboard-data.json')
  .then(r => r.json())
  .then(d => {
    document.getElementById('mrr').textContent = '$' + (d.metrics.mrr).toLocaleString();
    document.getElementById('total').textContent = '$' + (d.metrics.total_revenue).toLocaleString();
    document.getElementById('products').textContent = d.metrics.products_shipped;
    document.getElementById('customers').textContent = d.metrics.active_customers;
    document.getElementById('updated').textContent = d.generated_at;
    document.getElementById('agent').textContent = d.automation.agent;

    const roadmap = document.getElementById('roadmap');
    d.roadmap.forEach(p => {
      const li = document.createElement('li');
      const target = p.mrr_target ? '$' + p.mrr_target.toLocaleString() + '/mo' : '$' + p.total_target.toLocaleString() + ' total';
      li.innerHTML = '<span>Phase ' + p.phase + ' · Month ' + p.months + '</span><span class="badge">' + target + '</span>';
      if (p.phase === d.phase.current) li.style.background = 'rgba(74,222,128,0.08)';
      roadmap.appendChild(li);
    });

    const focus = document.getElementById('focus');
    d.focus_areas.forEach(f => {
      const li = document.createElement('li');
      li.innerHTML = '<span><strong>' + f.name + '</strong> — ' + f.description + '</span><span class="badge">P' + f.priority + '</span>';
      focus.appendChild(li);
    });
  })
  .catch(err => {
    document.body.innerHTML += '<div style="color:#f87171">Failed to load dashboard-data.json: ' + err + '</div>';
  });
</script>
</body>
</html>
