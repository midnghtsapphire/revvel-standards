<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard — $10M in 3y</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0b0f14;--fg:#e6edf3;--muted:#8b949e;--accent:#3fb950;--card:#161b22;--border:#30363d}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:2rem;border-bottom:1px solid var(--border)}
  h1{margin:0 0 .25rem;font-size:1.5rem}
  .muted{color:var(--muted)}
  main{padding:2rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem}
  .card h2{margin:0 0 .5rem;font-size:1rem}
  .status{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.75rem}
  .status.active{background:rgba(63,185,80,.15);color:var(--accent)}
  .status.pending{background:rgba(139,148,158,.15);color:var(--muted)}
  footer{padding:1rem 2rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <h1>Mission: $10k/month → $10M in 3 years</h1>
  <div class="muted" id="updated">Loading…</div>
</header>
<main id="phases"></main>
<footer>Automated dashboard refresh · openrouter agent · WR-02 audit-2026-08-05</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent='Updated: '+d.updated;
  const m=document.getElementById('phases');
  d.phases.forEach(p=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<h2>Phase ${p.id}: ${p.target}</h2>
      <div class="muted">${p.window}</div>
      <div style="margin-top:.5rem"><span class="status ${p.status}">${p.status}</span></div>`;
    m.appendChild(el);
  });
  const f=document.createElement('div');
  f.className='card';
  f.innerHTML='<h2>Focus areas</h2><ul style="margin:.25rem 0 0;padding-left:1.1rem">'+d.focus.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  m.appendChild(f);
}).catch(e=>{document.getElementById('updated').textContent='Error loading data';});
</script>
</body>
</html>
