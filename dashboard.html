<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b1020; --fg:#e6edf3; --muted:#9aa4b2; --accent:#4ade80; --card:#131a2e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 2rem 1.5rem 1rem; border-bottom: 1px solid #1f2937; }
  h1 { margin:0; font-size:1.6rem; }
  .sub { color:var(--muted); margin-top:.25rem; font-size:.95rem; }
  main { display:grid; gap:1rem; padding:1.5rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid #1f2937; border-radius:10px; padding:1.1rem; }
  .card h2 { margin:0 0 .6rem; font-size:1rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .metric { font-size:1.8rem; font-weight:700; color:var(--accent); }
  ul { margin:.4rem 0 0; padding-left:1.1rem; }
  li { margin:.25rem 0; }
  .phase { display:flex; justify-content:space-between; padding:.4rem 0; border-bottom:1px dashed #24304a; }
  .phase:last-child { border-bottom:none; }
  .status-active { color:var(--accent); }
  .status-pending { color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:1.5rem; }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard: $10M in 3 Years</h1>
  <div class="sub">Prime directive: Start at $10k/month → Scale to $10M total by year 3</div>
</header>
<main>
  <section class="card">
    <h2>Current MRR</h2>
    <div class="metric" id="mrr">$0</div>
    <div class="sub">Target Phase 1: $10,000/mo</div>
  </section>
  <section class="card">
    <h2>Progress</h2>
    <div class="metric" id="progress">0%</div>
    <div class="sub"><span id="remaining">36</span> months remaining</div>
  </section>
  <section class="card">
    <h2>Phases</h2>
    <div id="phases"></div>
  </section>
  <section class="card">
    <h2>Focus Areas</h2>
    <ul id="focus"></ul>
  </section>
</main>
<footer>Generated 2026-08-05 · Automated (openrouter)</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('mrr').textContent = '$' + (d.metrics.current_mrr||0).toLocaleString();
  document.getElementById('progress').textContent = (d.metrics.progress_pct||0) + '%';
  document.getElementById('remaining').textContent = d.metrics.months_remaining;
  document.getElementById('phases').innerHTML = d.phases.map(p =>
    `<div class="phase"><span>Phase ${p.id}: ${p.name}</span><span class="status-${p.status}">${p.status}</span></div>`
  ).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f =>
    `<li><strong>${f.name}</strong> — ${f.description}</li>`
  ).join('');
}).catch(()=>{});
</script>
</body>
</html>
