<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard — $10M/3y</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0b0d10;--fg:#e6edf3;--mut:#8b949e;--acc:#3fb950;--warn:#d29922}
  body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:24px;border-bottom:1px solid #21262d}
  h1{margin:0;font-size:22px}
  .sub{color:var(--mut);font-size:13px;margin-top:4px}
  main{padding:24px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:16px}
  .card h2{margin:0 0 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .val{font-size:20px;font-weight:600}
  .status-in-progress{color:var(--warn)}
  .status-pending{color:var(--mut)}
  .status-done{color:var(--acc)}
  footer{padding:16px 24px;color:var(--mut);font-size:12px;border-top:1px solid #21262d}
</style>
</head>
<body>
<header>
  <h1>Mission: $10k/month → $10M in 3 years</h1>
  <div class="sub">Auto-generated dashboard — data in <code>dashboard-data.json</code></div>
</header>
<main id="phases"></main>
<footer>Ruleset WR-02 · audit-2026-08-05 · agent: openrouter</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const m=document.getElementById('phases');
  d.phases.forEach(p=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<h2>Phase ${p.id} — ${p.window}</h2>
      <div class="val">${p.target}</div>
      <div class="status-${p.status}">● ${p.status}</div>`;
    m.appendChild(el);
  });
  const focus=document.createElement('div');
  focus.className='card';
  focus.innerHTML=`<h2>Focus Areas</h2><div class="val">${d.focus.join(', ')}</div>`;
  m.appendChild(focus);
}).catch(e=>{document.getElementById('phases').textContent='Failed to load data: '+e});
</script>
</body>
</html>
