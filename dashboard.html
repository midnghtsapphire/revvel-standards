<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0b1020; color:#e6edf3; margin:0; padding:2rem; }
  h1 { margin:0 0 .25rem; font-size:1.6rem; }
  .sub { color:#94a3b8; margin-bottom:1.5rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
  .card { background:#111a33; border:1px solid #1f2a4a; border-radius:10px; padding:1rem; }
  .card h3 { margin:0 0 .5rem; font-size:.95rem; color:#a5b4fc; }
  .badge { display:inline-block; padding:.15rem .5rem; border-radius:999px; font-size:.75rem; background:#1e293b; color:#cbd5e1; }
  .badge.active { background:#064e3b; color:#a7f3d0; }
  .badge.pending { background:#3b0764; color:#e9d5ff; }
  footer { margin-top:2rem; color:#64748b; font-size:.8rem; }
</style>
</head>
<body>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime Directive: $10k/month → $10M in 3 years</div>
  <div class="grid" id="phases"></div>
  <h2 style="margin-top:2rem;font-size:1.1rem;">Focus Areas</h2>
  <div class="grid" id="focus"></div>
  <footer>Auto-generated. See <code>dashboard-data.json</code>.</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const p=document.getElementById('phases');
  d.phases.forEach(x=>{
    p.insertAdjacentHTML('beforeend',`<div class="card"><h3>Phase ${x.id}</h3><div><strong>${x.target}</strong></div><div class="sub">${x.window}</div><span class="badge ${x.status}">${x.status}</span></div>`);
  });
  const f=document.getElementById('focus');
  d.focus_areas.forEach(x=>{
    f.insertAdjacentHTML('beforeend',`<div class="card"><h3>${x.name}</h3><div>${x.description}</div></div>`);
  });
}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<p>Failed to load data.</p>');});
</script>
</body>
</html>
