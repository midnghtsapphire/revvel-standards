<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0f14; --panel:#121821; --fg:#e6edf3; --muted:#8b98a5; --accent:#3fb950; --warn:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 24px; border-bottom:1px solid #21262d; }
  h1 { margin:0 0 6px; font-size:22px; }
  .sub { color:var(--muted); font-size:14px; }
  main { padding:24px; display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid #21262d; border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 10px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .metric { font-size:28px; font-weight:700; }
  ul { margin:8px 0 0; padding-left:18px; }
  li { margin:4px 0; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; background:#21262d; color:var(--muted); margin-left:6px; }
  .badge.active { background: rgba(63,185,80,.15); color: var(--accent); }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; border-top:1px solid #21262d; }
</style>
</head>
<body>
<header>
  <h1>Project Dashboard</h1>
  <div class="sub">Prime Directive: <strong>$10k/month → $10M in 3 years</strong></div>
</header>
<main id="grid">
  <div class="card"><h2>Loading…</h2></div>
</main>
<footer>Auto-generated from <code>dashboard-data.json</code>.</footer>
<script>
fetch('dashboard-data.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(d => {
    const g = document.getElementById('grid');
    const phases = d.mission.phases.map(p => {
      const cls = p.status === 'in_progress' ? 'badge active' : 'badge';
      return `<li>Phase ${p.id}: <strong>${p.target}</strong> <span class="sub">(${p.window})</span> <span class="${cls}">${p.status}</span></li>`;
    }).join('');
    const focus = d.focus_areas.map(f => `<li><strong>${f.name}</strong> — <span class="sub">${f.description}</span></li>`).join('');
    g.innerHTML = `
      <div class="card"><h2>MRR</h2><div class="metric">$${d.metrics.mrr_usd.toLocaleString()}</div></div>
      <div class="card"><h2>Total Revenue</h2><div class="metric">$${d.metrics.total_revenue_usd.toLocaleString()}</div></div>
      <div class="card"><h2>Active Products</h2><div class="metric">${d.metrics.active_products}</div></div>
      <div class="card"><h2>Issues Batched</h2><div class="metric">${d.metrics.open_issues_batched}</div></div>
      <div class="card" style="grid-column: 1 / -1;"><h2>Mission Phases</h2><ul>${phases}</ul></div>
      <div class="card" style="grid-column: 1 / -1;"><h2>Focus Areas</h2><ul>${focus}</ul></div>
      <div class="card" style="grid-column: 1 / -1;"><h2>Updated</h2><div class="sub">${d.updated}</div></div>
    `;
  })
  .catch(e => {
    document.getElementById('grid').innerHTML = `<div class="card"><h2>Error</h2><div>${e}</div></div>`;
  });
</script>
</body>
</html>
