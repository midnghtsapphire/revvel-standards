<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Dashboard — $10k → $10M</title>
<style>
  :root { --bg:#0b0d10; --fg:#e6edf3; --muted:#8b949e; --accent:#3fb950; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 2rem; border-bottom: 1px solid var(--border); }
  h1 { margin: 0 0 .5rem 0; font-size: 1.6rem; }
  .directive { color: var(--accent); font-weight: 600; }
  main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  .card h3 { margin: 0 0 .5rem 0; font-size: 1rem; }
  .muted { color: var(--muted); font-size: .875rem; }
  .status { display:inline-block; padding:.15rem .5rem; border-radius:12px; font-size:.75rem; text-transform: uppercase; }
  .status.in_progress { background: #1f6feb33; color:#58a6ff; }
  .status.pending { background:#484f5833; color:#8b949e; }
  section { margin-top: 2rem; }
  ul { padding-left: 1.2rem; }
  footer { padding: 1rem 2rem; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Project Dashboard</h1>
  <div class="directive">PRIME DIRECTIVE: $10k/month → $10M in 3 years</div>
  <div class="muted" id="updated">Updated: 2026-08-05</div>
</header>
<main>
  <section>
    <h2>Phases</h2>
    <div class="grid" id="phases"></div>
  </section>
  <section>
    <h2>Focus Areas</h2>
    <div class="grid" id="focus"></div>
  </section>
  <section>
    <h2>Agents</h2>
    <div class="card">
      <div><strong>Primary:</strong> <span id="primary"></span></div>
      <div><strong>Fallback:</strong> <span id="fallback"></span></div>
      <div><strong>Tier:</strong> <span id="tier"></span></div>
    </div>
  </section>
  <section>
    <h2>Recently Closed Issues</h2>
    <ul id="closed"></ul>
  </section>
</main>
<footer id="notes"></footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent = 'Updated: ' + d.updated_at;
  const phases = document.getElementById('phases');
  d.phases.forEach(p => {
    const tgt = p.target_mrr_usd ? '$'+p.target_mrr_usd.toLocaleString()+'/mo' : '$'+p.target_total_usd.toLocaleString()+' total';
    phases.innerHTML += `<div class="card"><h3>Phase ${p.id}</h3><div>${tgt}</div><div class="muted">${p.window}</div><span class="status ${p.status}">${p.status.replace('_',' ')}</span></div>`;
  });
  const focus = document.getElementById('focus');
  d.focus_areas.forEach(f => {
    focus.innerHTML += `<div class="card"><h3>${f.name}</h3><div class="muted">${f.description}</div></div>`;
  });
  document.getElementById('primary').textContent = d.agents.primary;
  document.getElementById('fallback').textContent = d.agents.fallback_chain.join(' → ');
  document.getElementById('tier').textContent = d.agents.tier;
  const closed = document.getElementById('closed');
  d.closed_issues.forEach(n => { closed.innerHTML += `<li>#${n}</li>`; });
  document.getElementById('notes').textContent = d.notes;
}).catch(e => {
  document.getElementById('notes').textContent = 'Failed to load dashboard-data.json: ' + e;
});
</script>
</body>
</html>
