<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#0b0f17; color:#e6edf3; margin:0; padding:2rem; }
  h1 { margin:0 0 .25rem; font-size:1.6rem; }
  .sub { color:#8b949e; margin-bottom:1.5rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1rem; }
  .card h2 { font-size:.9rem; margin:0 0 .5rem; color:#8b949e; text-transform:uppercase; letter-spacing:.05em; }
  .card .val { font-size:1.4rem; font-weight:600; }
  .active { color:#3fb950; }
  .pending { color:#d29922; }
  ul { padding-left:1.2rem; }
  footer { margin-top:2rem; color:#8b949e; font-size:.85rem; }
</style>
</head>
<body>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime Directive: $10k/month → $10M total by year 3</div>
  <div class="grid" id="phases"></div>
  <h2 style="margin-top:2rem">Focus Areas</h2>
  <ul id="focus"></ul>
  <footer id="meta"></footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('phases').innerHTML = d.phases.map(p=>`
    <div class="card">
      <h2>Phase ${p.id} — ${p.window}</h2>
      <div class="val">${p.target}</div>
      <div class="${p.status}">${p.status}</div>
    </div>`).join('');
  document.getElementById('focus').innerHTML = d.focus.map(f=>`<li><b>${f.name}</b> — ${f.role}</li>`).join('');
  document.getElementById('meta').textContent = `Updated ${d.updated} · agent=${d.automation.agent} · batch=${d.automation.closes_range}`;
}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<pre>'+e+'</pre>');});
</script>
</body>
</html>
