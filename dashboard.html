<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;margin:2rem;background:#0d1117;color:#c9d1d9}
  h1{color:#58a6ff}
  .phase{border:1px solid #30363d;padding:1rem;margin:.5rem 0;border-radius:6px}
  .active{border-color:#3fb950;background:#0d2818}
  .pending{opacity:.6}
  code{background:#161b22;padding:.2rem .4rem;border-radius:3px}
</style>
</head>
<body>
<h1>Mission: $10k/month → $10M in 3 years</h1>
<p>Data source: <code>dashboard-data.json</code></p>
<div id="phases"></div>
<h2>Focus Areas</h2>
<ul>
  <li>Polar.sh — GitHub funding platform</li>
  <li>OSINT tools</li>
  <li>Automated product pipeline</li>
</ul>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('phases').innerHTML = d.phases.map(p=>
    `<div class="phase ${p.status}"><strong>Phase ${p.id}:</strong> ${p.target} <em>(${p.window})</em> — ${p.status}</div>`
  ).join('');
});
</script>
</body>
</html>
