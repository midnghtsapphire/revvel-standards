<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0b1020; --fg:#e6edf3; --muted:#8b95a7; --accent:#4ade80; --card:#131a2e; --border:#1f2a44; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px 32px; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 4px; font-size:22px; }
  .muted { color:var(--muted); font-size:14px; }
  main { padding:24px 32px; display:grid; gap:20px; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .metric { font-size:28px; font-weight:600; }
  .phase { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:14px; }
  .phase:last-child { border-bottom:none; }
  .status-active { color:var(--accent); font-weight:600; }
  .status-pending { color:var(--muted); }
  footer { padding:16px 32px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Project Dashboard</h1>
  <div class="muted">Prime directive: <strong>$10k/month → $10M in 3 years</strong></div>
</header>
<main id="app">
  <div class="card"><h2>Loading…</h2></div>
</main>
<footer id="foot">Auto-generated.</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const app = document.getElementById('app');
  const m = d.metrics || {};
  const phases = (d.phases||[]).map(p=>`<div class="phase"><span>Phase ${p.id}: ${p.target} <span class="muted">(${p.window})</span></span><span class="status-${p.status}">${p.status}</span></div>`).join('');
  const focus = (d.focus_areas||[]).map(f=>`<div class="phase"><span>${f.name}</span><span class="muted">${f.description}</span></div>`).join('');
  app.innerHTML = `
    <div class="card"><h2>MRR</h2><div class="metric">$${(m.mrr_usd||0).toLocaleString()}</div></div>
    <div class="card"><h2>Total Revenue</h2><div class="metric">$${(m.total_revenue_usd||0).toLocaleString()}</div></div>
    <div class="card"><h2>Active Products</h2><div class="metric">${m.active_products||0}</div></div>
    <div class="card"><h2>Sponsors</h2><div class="metric">${m.sponsors||0}</div></div>
    <div class="card" style="grid-column:1/-1"><h2>Phases</h2>${phases}</div>
    <div class="card" style="grid-column:1/-1"><h2>Focus Areas</h2>${focus}</div>
  `;
  document.getElementById('foot').textContent = 'Generated at ' + d.generated_at + ' — ' + (d.notes||'');
}).catch(e=>{
  document.getElementById('app').innerHTML = '<div class="card"><h2>Error</h2><div>'+e+'</div></div>';
});
</script>
</body>
</html>
