<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prime Directive Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg:#0d1117; --fg:#c9d1d9; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --card:#161b22; }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; margin:0; padding:2rem; }
  h1 { color:var(--accent); margin-top:0; }
  .directive { font-size:1.2rem; color:var(--ok); margin-bottom:2rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin-bottom:2rem; }
  .card { background:var(--card); border:1px solid #30363d; border-radius:8px; padding:1.25rem; }
  .card h3 { margin:0 0 .5rem; color:var(--accent); }
  .status-active { color:var(--ok); font-weight:bold; }
  .status-pending { color:var(--warn); }
  .metric { font-size:2rem; font-weight:bold; color:var(--fg); }
  .label { font-size:.85rem; opacity:.7; text-transform:uppercase; }
  footer { opacity:.6; font-size:.85rem; margin-top:2rem; }
</style>
</head>
<body>
<h1>🎯 Prime Directive Dashboard</h1>
<div class="directive">$10k/month → $10M in 3 years</div>

<h2>Phases</h2>
<div class="grid" id="phases"></div>

<h2>Focus Areas</h2>
<div class="grid" id="focus"></div>

<h2>Metrics</h2>
<div class="grid" id="metrics"></div>

<footer>Generated: <span id="gen"></span> · Agent: openrouter · Fallback: OpenRouter → OpenHands → manual</footer>

<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  document.getElementById('gen').textContent = d.generated_at;
  document.getElementById('phases').innerHTML = d.phases.map(p=>`
    <div class="card">
      <h3>Phase ${p.phase}</h3>
      <div class="metric">$${(p.target_mrr||p.target_total).toLocaleString()}</div>
      <div class="label">${p.target_mrr?'MRR target':'total target'} · months ${p.months}</div>
      <div class="status-${p.status}">${p.status.toUpperCase()}</div>
    </div>`).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f=>`
    <div class="card">
      <h3>${f.name}</h3>
      <div>${f.description}</div>
      <div class="label">priority ${f.priority}</div>
    </div>`).join('');
  const m = d.metrics;
  document.getElementById('metrics').innerHTML = `
    <div class="card"><div class="label">Current MRR</div><div class="metric">$${m.current_mrr.toLocaleString()}</div></div>
    <div class="card"><div class="label">Total Revenue</div><div class="metric">$${m.total_revenue.toLocaleString()}</div></div>
    <div class="card"><div class="label">Active Products</div><div class="metric">${m.active_products}</div></div>
    <div class="card"><div class="label">Issues Batched</div><div class="metric">${d.automation.issues_batched}</div></div>`;
}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<p style="color:#f85149">Failed to load dashboard-data.json</p>');});
</script>
</body>
</html>
