<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mission Dashboard — $10k → $10M</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{--bg:#0b0f14;--fg:#e6edf3;--muted:#8b949e;--accent:#2ea043;--card:#161b22;--border:#30363d}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:24px;border-bottom:1px solid var(--border)}
  h1{margin:0 0 4px;font-size:22px}
  .muted{color:var(--muted)}
  main{padding:24px;max-width:1000px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#21262d;color:var(--muted)}
  .badge.active{background:var(--accent);color:#fff}
  .focus{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .focus span{background:#21262d;border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:13px}
  footer{padding:16px 24px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:24px}
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="muted">Prime directive: $10k/month → $10M in 3 years</div>
</header>
<main>
  <section id="phases">
    <h2>Phases</h2>
    <div class="grid" id="phase-grid"></div>
  </section>
  <section>
    <h2>Focus areas</h2>
    <div class="focus" id="focus"></div>
  </section>
</main>
<footer>
  <span id="updated">Loading…</span> · Generated data only, no logic changes.
</footer>
<script>
fetch('dashboard-data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent='Updated: '+d.updated;
  const g=document.getElementById('phase-grid');
  d.phases.forEach(p=>{
    const el=document.createElement('div');el.className='card';
    el.innerHTML='<div class="badge '+(p.status==='active'?'active':'')+'">Phase '+p.id+' · '+p.status+'</div>'+
      '<h3 style="margin:8px 0 4px">'+p.target+'</h3>'+
      '<div class="muted">'+p.window+'</div>';
    g.appendChild(el);
  });
  const f=document.getElementById('focus');
  d.focus.forEach(x=>{const s=document.createElement('span');s.textContent=x;f.appendChild(s);});
}).catch(e=>{document.getElementById('updated').textContent='Error loading data';});
</script>
</body>
</html>
