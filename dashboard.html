<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b98a5; --accent:#3fb950; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 2rem 1.5rem 1rem; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 .25rem; font-size:1.5rem; }
  .sub { color:var(--muted); font-size:.9rem; }
  main { padding: 1.5rem; display:grid; gap:1rem; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:1rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; }
  .card h2 { margin:0 0 .5rem; font-size:1rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .val { font-size:1.5rem; font-weight:600; }
  .phase { display:flex; justify-content:space-between; padding:.5rem 0; border-bottom:1px dashed var(--border); }
  .phase:last-child { border-bottom:none; }
  .badge { padding:.15rem .5rem; border-radius:4px; font-size:.75rem; }
  .active { background:var(--accent); color:#000; }
  .pending { background:#30363d; color:var(--muted); }
  ul { padding-left:1.2rem; margin:.25rem 0; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:1rem; }
</style>
</head>
<body>
<header>
  <h1>🎯 Mission: $10M in 3 Years</h1>
  <div class="sub">Prime Directive: $10k/month → $10M total by year 3</div>
</header>
<main>
  <div class="grid">
    <div class="card"><h2>Current MRR</h2><div class="val" id="mrr">$0</div></div>
    <div class="card"><h2>Total Revenue</h2><div class="val" id="total">$0</div></div>
    <div class="card"><h2>Customers</h2><div class="val" id="customers">0</div></div>
    <div class="card"><h2>Products Shipped</h2><div class="val" id="products">0</div></div>
  </div>
  <div class="card">
    <h2>Phases</h2>
    <div id="phases"></div>
  </div>
  <div class="card">
    <h2>Focus Areas</h2>
    <ul id="focus"></ul>
  </div>
</main>
<footer>Auto-generated from dashboard-data.json</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const fmt = n => '$' + n.toLocaleString();
  document.getElementById('mrr').textContent = fmt(d.metrics.mrr);
  document.getElementById('total').textContent = fmt(d.metrics.total_revenue);
  document.getElementById('customers').textContent = d.metrics.customers;
  document.getElementById('products').textContent = d.metrics.products_shipped;
  document.getElementById('phases').innerHTML = d.phases.map(p => {
    const target = p.target_mrr ? fmt(p.target_mrr) + '/mo' : fmt(p.target_total) + ' total';
    return `<div class="phase"><span>Phase ${p.id}: ${p.name} — ${target} (${p.window})</span><span class="badge ${p.status}">${p.status}</span></div>`;
  }).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f => `<li><strong>${f.name}</strong> — ${f.description}</li>`).join('');
}).catch(e => { document.body.innerHTML += '<p style="color:#f85149;padding:1rem">Failed to load dashboard-data.json: '+e+'</p>'; });
</script>
</body>
</html>
