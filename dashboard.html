<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mission Dashboard — $10k → $10M</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b949e; --accent:#39d353; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:24px 32px; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:14px; }
  main { padding:24px 32px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .card h2 { margin:0 0 8px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .val { font-size:24px; font-weight:600; }
  .phase { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .phase:last-child { border-bottom:0; }
  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; background:#21262d; color:var(--muted); }
  .badge.active { background:var(--accent); color:#0b0f14; }
  footer { padding:16px 32px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="sub">PRIME DIRECTIVE: $10k/month → $10M in 3 years</div>
</header>
<main>
  <div class="card">
    <h2>Current MRR</h2>
    <div class="val" id="mrr">$0</div>
  </div>
  <div class="card">
    <h2>Total Revenue</h2>
    <div class="val" id="total">$0</div>
  </div>
  <div class="card">
    <h2>Active Products</h2>
    <div class="val" id="products">0</div>
  </div>
  <div class="card">
    <h2>Pipeline Items</h2>
    <div class="val" id="pipeline">0</div>
  </div>
  <div class="card" style="grid-column:1/-1">
    <h2>Phases</h2>
    <div id="phases"></div>
  </div>
  <div class="card" style="grid-column:1/-1">
    <h2>Focus Areas</h2>
    <div id="focus"></div>
  </div>
</main>
<footer id="foot">Loading…</footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const fmt = n => '$' + n.toLocaleString();
  document.getElementById('mrr').textContent = fmt(d.metrics.mrr);
  document.getElementById('total').textContent = fmt(d.metrics.total_revenue);
  document.getElementById('products').textContent = d.metrics.active_products;
  document.getElementById('pipeline').textContent = d.metrics.pipeline_items;
  document.getElementById('phases').innerHTML = d.mission.phases.map(p => {
    const goal = p.target_mrr ? fmt(p.target_mrr)+'/mo' : fmt(p.target_total)+' total';
    return `<div class="phase"><span>Phase ${p.id} — ${p.window}</span><span>${goal} <span class="badge ${p.status==='active'?'active':''}">${p.status}</span></span></div>`;
  }).join('');
  document.getElementById('focus').innerHTML = d.focus_areas.map(f =>
    `<div class="phase"><span>#${f.priority} ${f.name}</span><span class="badge">${f.category}</span></div>`
  ).join('');
  document.getElementById('foot').textContent = 'Updated ' + d.updated + ' · agent: ' + d.automation.agent + ' · ' + d.audit.rule + '/' + d.audit.ref;
}).catch(e => {
  document.getElementById('foot').textContent = 'Failed to load dashboard-data.json: ' + e;
});
</script>
</body>
</html>
