<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Project Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root { --bg:#0d1117; --fg:#c9d1d9; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--fg); padding:2rem; }
  h1 { color:var(--accent); margin-top:0; }
  .directive { background:var(--card); border:1px solid var(--accent); padding:1rem 1.5rem; border-radius:8px; margin-bottom:1.5rem; font-size:1.1rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; margin-bottom:2rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem 1.25rem; }
  .card h3 { margin:0 0 .5rem; color:var(--accent); font-size:.95rem; text-transform:uppercase; letter-spacing:.05em; }
  .card .val { font-size:1.4rem; font-weight:600; }
  .status-active { color:var(--ok); }
  .status-pending { color:var(--warn); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  th, td { padding:.65rem 1rem; text-align:left; border-bottom:1px solid var(--border); }
  th { background:#1c2129; color:var(--accent); font-size:.85rem; text-transform:uppercase; }
  tr:last-child td { border-bottom:none; }
  footer { margin-top:2rem; font-size:.8rem; color:#8b949e; }
  .bar { background:#21262d; height:8px; border-radius:4px; overflow:hidden; margin-top:.5rem; }
  .bar > span { display:block; height:100%; background:var(--ok); }
</style>
</head>
<body>
  <h1>Project Dashboard</h1>
  <div class="directive"><strong>PRIME DIRECTIVE:</strong> $10k/month → $10M total in 3 years</div>

  <div class="grid" id="metrics"></div>

  <h2>Phases</h2>
  <table id="phases">
    <thead><tr><th>#</th><th>Name</th><th>Target</th><th>Months</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2 style="margin-top:2rem">Focus Areas</h2>
  <table id="focus">
    <thead><tr><th>Priority</th><th>Name</th><th>Description</th></tr></thead>
    <tbody></tbody>
  </table>

  <footer id="footer">Loading…</footer>

<script>
fetch('dashboard-data.json').then(r => r.json()).then(d => {
  const m = d.metrics;
  const pct = m.target_mrr ? Math.min(100, (m.current_mrr / m.target_mrr) * 100) : 0;
  document.getElementById('metrics').innerHTML = `
    <div class="card"><h3>Current MRR</h3><div class="val">$${m.current_mrr.toLocaleString()}</div></div>
    <div class="card"><h3>Target MRR</h3><div class="val">$${m.target_mrr.toLocaleString()}</div></div>
    <div class="card"><h3>Progress</h3><div class="val">${pct.toFixed(1)}%</div><div class="bar"><span style="width:${pct}%"></span></div></div>
    <div class="card"><h3>Agent</h3><div class="val">${d.automation.agent}</div></div>
  `;
  document.querySelector('#phases tbody').innerHTML = d.phases.map(p => `
    <tr><td>${p.id}</td><td>${p.name}</td><td>${p.target_mrr ? '$'+p.target_mrr.toLocaleString()+'/mo' : '$'+p.target_total.toLocaleString()+' total'}</td><td>${p.months}</td><td class="status-${p.status}">${p.status}</td></tr>
  `).join('');
  document.querySelector('#focus tbody').innerHTML = d.focus_areas.map(f => `
    <tr><td>${f.priority}</td><td>${f.name}</td><td>${f.description}</td></tr>
  `).join('');
  document.getElementById('footer').textContent = `Generated at ${d.generated_at} · Fallback: ${d.automation.fallback_chain.join(' → ')}`;
}).catch(e => {
  document.getElementById('footer').textContent = 'Failed to load dashboard-data.json: ' + e;
});
</script>
</body>
</html>
