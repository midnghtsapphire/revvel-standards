<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mission Dashboard — $10M in 3 Years</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;background:#0b0f14;color:#e6edf3;margin:0;padding:2rem;}
  h1{margin:0 0 .25rem;font-size:1.6rem;}
  .sub{color:#8b949e;margin-bottom:1.5rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1rem;}
  .card h3{margin:0 0 .5rem;font-size:.95rem;color:#7ee787;}
  .val{font-size:1.4rem;font-weight:600;}
  .status-active{color:#7ee787;}
  .status-pending{color:#8b949e;}
  footer{margin-top:2rem;color:#6e7681;font-size:.8rem;}
</style>
</head>
<body>
<h1>Mission Dashboard</h1>
<div class="sub">Prime Directive: $10k/month → $10M in 3 years</div>
<div class="grid" id="cards"></div>
<footer>Auto-generated. Data source: <code>dashboard-data.json</code></footer>
<script>
fetch('dashboard-data.json').then(r=>r.json()).then(d=>{
  const el=document.getElementById('cards');
  const cards=[
    {t:'Current MRR',v:'$'+d.revenue.current_mrr.toLocaleString()},
    {t:'Target MRR',v:'$'+d.revenue.target_mrr.toLocaleString()},
    {t:'Total Revenue',v:'$'+d.revenue.total.toLocaleString()},
    {t:'Goal',v:'$'+d.revenue.goal.toLocaleString()},
    {t:'Updated',v:d.updated},
    {t:'Agent',v:d.automation.agent}
  ];
  cards.forEach(c=>{el.innerHTML+=`<div class="card"><h3>${c.t}</h3><div class="val">${c.v}</div></div>`;});
  d.phases.forEach(p=>{el.innerHTML+=`<div class="card"><h3>Phase ${p.id} (${p.months})</h3><div class="val">${p.target}</div><div class="status-${p.status}">${p.status}</div></div>`;});
});
</script>
</body>
</html>
