<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Dashboard — $10M in 3 Years</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b949e; --accent:#3fb950; --warn:#d29922; --card:#161b22; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 24px; border-bottom: 1px solid var(--border); }
  h1 { margin:0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding: 24px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background: var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .kpi { font-size: 28px; font-weight:600; }
  .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .row:last-child { border-bottom:none; }
  .status-active { color: var(--accent); }
  .status-pending { color: var(--warn); }
  footer { padding: 16px 24px; color: var(--muted); font-size: 12px; border-top:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Mission Dashboard</h1>
  <div class="sub">Prime directive: $10k/month → $10M in 3 years</div>
</header>
<main id="root">Loading…</main>
<footer id="foot">Loading data…</footer>
<script>
fetch('dashboard-data.json', {cache:'no-store'})
  .then(r => r.json())
  .then(d => {
    const root = document.getElementById('root');
    const m = d.metrics || {};
    const phases = (d.phases||[]).map(p => `
      <div class="row">
        <span>Phase ${p.id}: ${p.name} <small class="sub">(${p.window})</small></span>
        <span class="status-${p.status}">${p.target_mrr ? '$'+p.target_mrr.toLocaleString()+'/mo' : '$'+(p.target_total||0).toLocaleString()+' total'}</span>
      </div>`).join('');
    const focus = (d.focus_areas||[]).map(f => `<div class="row"><span>#${f.priority} ${f.name}</span><span class="sub">${f.key}</span></div>`).join('');
    root.innerHTML = `
      <div class="card"><h2>Current MRR</h2><div class="kpi">$${(m.current_mrr||0).toLocaleString()}</div></div>
      <div class="card"><h2>Total Revenue</h2><div class="kpi">$${(m.total_revenue||0).toLocaleString()}</div></div>
      <div class="card"><h2>Active Products</h2><div class="kpi">${m.active_products||0}</div></div>
      <div class="card"><h2>Issues Processed</h2><div class="kpi">${m.open_issues_processed||0}</div></div>
      <div class="card" style="grid-column: 1 / -1;"><h2>Phases</h2>${phases}</div>
      <div class="card" style="grid-column: 1 / -1;"><h2>Focus Areas</h2>${focus}</div>
    `;
    document.getElementById('foot').textContent = 'Generated ' + d.generated_at + ' · ' + (d.notes||'');
  })
  .catch(e => {
    document.getElementById('root').textContent = 'Failed to load dashboard-data.json';
    document.getElementById('foot').textContent = String(e);
  });
</script>
</body>
</html>
