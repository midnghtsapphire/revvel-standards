version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: coldtrace
      POSTGRES_PASSWORD: coldtrace
      POSTGRES_DB: coldtrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # `api` and `frontend` are intentionally disabled until their
  # build contexts and Dockerfiles are added to the repository.
  # Re-enable these services once `./backend/Dockerfile` and
  # `./frontend/Dockerfile` (and the corresponding directories) exist.
volumes:
  pgdata:
  tmp_data:
