# Create Issue Branch — configuration
#
# Used by both:
#   • The GitHub Marketplace App (github.com/marketplace/create-issue-branch)
#   • The GitHub Action defined in .github/workflows/create-issue-branch.yml
#
# App docs: https://github.com/robvanderleek/create-issue-branch
# Mode: "immediate" — a branch is created as soon as an issue is opened.
# This matches the Revvel workflow where every issue drives a code change.

mode: immediate

# ── Branch naming ────────────────────────────────────────────────────────────
# Branches are lowercase, dash-separated, and include both the issue number
# and a sanitised version of the issue title.
# Example: issue-42-add-stripe-webhook
#
# gitReplaceChars is a conservative sanitisation list for generated branch names.
# It covers characters that are disallowed or problematic in git refs, plus
# additional punctuation we replace to keep names predictable and shell-friendly.
# This is intentionally broader than the exact `git-check-ref-format` rules.
# For example, `/` and `@` are only invalid in certain ref patterns, while
# characters like `#`, `|`, `&`, `;`, `<`, `>`, `` ` ``, `$`, `%`, `+`, `=`,
# and `,` are replaced here as an extra safety/usability measure.

branchName: 'issue-${issue.number}-${issue.title,}'
gitSafeReplacementChar: '-'
# Note: Period (.) is included even though it's only invalid at the END of refs
# This is intentional to prevent any edge cases with trailing periods
# File extensions in branch names are preserved in the middle (e.g., config-yaml)
gitReplaceChars: "'\"()[]{}!?/:@~^*\\#|&;<>`$%+=.,"

# ── Label-based prefixes ──────────────────────────────────────────────────────
# Maps standard GitHub labels to conventional branch prefixes so the history
# is easy to read and tooling (auto-changelog, etc.) can classify commits.

branches:
  - label: bug
    prefix: bugfix/
  - label: enhancement
    prefix: feature/
  - label: documentation
    prefix: docs/
  - label: good-first-issue
    prefix: feature/
  - label: security
    prefix: hotfix/
  - label: dependencies
    prefix: chore/
  # Fallback — issues with no matching label get a plain "issue/" prefix
  - label: '*'
    prefix: issue/

# ── Source branch ─────────────────────────────────────────────────────────────
# All issue branches are cut from `main`.
defaultBranch: main

# ── Auto-link & lifecycle ─────────────────────────────────────────────────────
# Automatically closes the issue when a PR that references it is merged,
# and deletes the issue branch once the PR is merged to keep the repo tidy.
autoLinkIssue: true
autoCloseIssue: true
autoDeleteBranch: true

# ── Notifications ─────────────────────────────────────────────────────────────
# Comment on the issue once the branch has been created so contributors know
# where to push their work.
silent: false
