# Dependabot config for revvel-standards.
#
# CLAUDE.md #8 ("Pin third-party GitHub Actions to a full commit SHA") calls
# for Dependabot on the github-actions ecosystem so pinned SHAs get refreshed
# automatically instead of drifting. Also covers root-level npm tooling
# (markdownlint-cli2, yaml, tests) so those pins don't rot either.
#
# ---------------------------------------------------------------------------
# FORMAL PATH A — split-deps-per-directory (WR #16950 / PR #16791)
# ---------------------------------------------------------------------------
# Formal dual-path verification chose path A over path B (dependabot-group-bump)
# with structural_conflict when a single npm_and_yarn group spanned 10 dirs.
#
# HARD RULES (enforced by scripts/check-dependabot-split-deps.js + tests):
#   1. Every updates[] entry uses exactly one `directory:` key.
#      NEVER use `directories:` (plural) — that opens cross-directory PRs.
#   2. Group names are unique and directory-scoped
#      (e.g. root-tooling-patch-minor, affiliate-hub-patch-minor).
#      NEVER reuse a group name across directories.
#   3. NEVER name a group npm_and_yarn / npm-and-yarn (Dependabot multi-dir
#      default pattern that produced PR #16791).
#   4. Within a single directory, grouping patch+minor is fine and preferred
#      to cut noise. Majors stay ungrouped + ignored for human review.
#
# Per-product npm blocks below match the directories that appeared in the
# rejected #16791 group bump so future updates open as one PR per directory.
# ---------------------------------------------------------------------------

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    # 7-day cooldown blocks Dependabot from opening a bump PR the moment a
    # new version publishes — a compromised release is usually yanked or
    # flagged within days, so waiting a week trims most supply-chain risk.
    cooldown:
      default-days: 7
    groups:
      github-actions-patch-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      root-tooling-patch-minor:
        update-types:
          - "minor"
          - "patch"
    # Major bumps to root tooling always go through a human review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- Product / docs directories (one entry each; unique group names) ----
