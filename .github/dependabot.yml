# Dependabot config for revvel-standards.
#
# CLAUDE.md #8 ("Pin third-party GitHub Actions to a full commit SHA") calls
# for Dependabot on the github-actions ecosystem so pinned SHAs get refreshed
# automatically instead of drifting. Also covers root-level npm tooling
# (markdownlint-cli2, yaml, tests) so those pins don't rot either.
#
# Not enabling: pip (product-scoped, not root), docker (none used at root),
# and per-product npm entries (each product/*/ has its own package-lock; add
# a per-directory block only when a product actually needs auto-updates).

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    # 7-day cooldown blocks Dependabot from opening a bump PR the moment a
    # new version publishes — a compromised release is usually yanked or
    # flagged within days, so waiting a week trims most supply-chain risk.
    cooldown:
      default-days: 7
    groups:
      github-actions-patch-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      root-tooling-patch-minor:
        update-types:
          - "minor"
          - "patch"
    # Major bumps to root tooling always go through a human review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
