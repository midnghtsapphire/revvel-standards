# Revvel Standard Label Definitions
#
# This file is the canonical source of truth for labels across ALL Revvel repositories.
# The `sync-labels.yml` workflow reads this file and ensures every label exists in the repo.
#
# Usage:
#   • Automatically synced by `.github/workflows/sync-labels.yml` on push to main
#   • Run manually: Actions → Sync Standard Labels → Run workflow
#   • Copy to any app repo alongside `templates/cicd/sync-labels.yml`
#
# Label design conventions:
#   • Colors from GitHub's recommended palette where possible
#   • Each label has a short, clear description (≤ 50 chars)

labels:

  # ── Triage / Type ─────────────────────────────────────────────────────────────
  - name: bug
    color: "d73a4a"
    description: "Something isn't working"

  - name: enhancement
    color: "a2eeef"
    description: "New feature or request"

  - name: triage
    color: "e4e669"
    description: "Needs triage — newly opened issue awaiting classification"

  # ── Triage sub-states (visibility into where in the triage process an item is)
  - name: "triage:new"
    color: "fef2c0"
    description: "Triage stage — freshly opened, not yet looked at"

  - name: "triage:in-progress"
    color: "f9d71c"
    description: "Triage stage — a triager is actively classifying"

  - name: "triage:needs-info"
    color: "e4e669"
    description: "Triage stage — waiting on reporter for more info"

  - name: "triage:classified"
    color: "c2e0c6"
    description: "Triage stage — labelled & routed, ready for owner"

  - name: "triage:escalated"
    color: "d93f0b"
    description: "Triage stage — escalated beyond default triager"

  - name: documentation
    color: "0075ca"
    description: "Documentation only"

  - name: security
    color: "cc0000"
    description: "Security vulnerability or concern"

  - name: design
    color: "7057ff"
    description: "Design/brand work needed"

  - name: dependencies
    color: "0075ca"
    description: "Dependency updates (Dependabot, etc.)"

  - name: good-first-issue
    color: "7057ff"
    description: "Good for newcomers"

  - name: bom-purchase
    color: "ffd700"
    description: "Requires a purchase (links to BOM.md)"

  # ── Priority ─────────────────────────────────────────────────────────────────
  - name: "priority-p0"
    color: "b60205"
    description: "Critical priority — drop everything"

  - name: "priority-p1"
    color: "d93f0b"
    description: "High priority — next up"

  - name: "priority-p2"
    color: "fbca04"
    description: "Medium priority — normal queue"

  - name: "priority-p3"
    color: "0e8a16"
    description: "Low priority — backlog"

  # ── Lifecycle / State ─────────────────────────────────────────────────────────
  - name: in-review
    color: "fbca04"
    description: "Linked PR is open and ready for review"

  - name: blocked
    color: "e4e669"
    description: "Blocked by external dependency"

  # ── PR Lifecycle (managed by pr-lifecycle.yml) ─────────────────────────────────
  - name: awaiting-review
    color: "0075ca"
    description: "Waiting for reviewer feedback"

  - name: checks-failing
    color: "d73a4a"
    description: "CI checks are failing"

  - name: checks-passing
    color: "a2eeef"
    description: "All CI checks pass"

  - name: ready-to-merge
    color: "008672"
    description: "Approved + checks pass — ready to merge"

  # ── Issue Lifecycle (managed by issue-lifecycle.yml) ──────────────────────────
  - name: "issue:in-progress"
    color: "0075ca"
    description: "Issue has a linked PR in progress"

  - name: "issue:done"
    color: "0e8a16"
    description: "Issue resolved — linked PR merged"

  - name: "issue:stale"
    color: "e4e669"
    description: "No activity for 7+ days — needs attention"

  - name: "lifecycle:stuck"
    color: "d93f0b"
    description: "Label watchdog detected a stuck state"

  # ── Third-Party / External Contributions ──────────────────────────────────────
  - name: third-party
    color: "bfdadc"
    description: "PR from forked repository - external contributor"
  
  - name: external-contributor
    color: "7057ff"
    description: "Contribution from outside the organization"

  - name: wontfix
    color: "ffffff"
    description: "This will not be worked on"

  # ── PR Review Status ──────────────────────────────────────────────────────────
  - name: "awaiting-approval"
    color: "fbca04"
    description: "PR is awaiting review and approval"

  - name: "awaiting-review"
    color: "0075ca"
    description: "PR is ready and awaiting reviewer"

  - name: "changes-requested"
    color: "d93f0b"
    description: "PR has changes requested by reviewers"

  - name: "approved"
    color: "0e8a16"
    description: "PR has been approved by reviewers"

  - name: "review-started"
    color: "0075ca"
    description: "PR review has been initiated"

  # ── PR Review Request Handling ────────────────────────────────────────────────
  - name: "review-fix:in-progress"
    color: "fbca04"
    description: "OpenRouter is analyzing and fixing review feedback"

  - name: "review-fix:complete"
    color: "0e8a16"
    description: "OpenRouter has addressed all review feedback"

  - name: "review-fix:failed"
    color: "d93f0b"
    description: "OpenRouter could not automatically fix review issues"

  # ── Merge Control ─────────────────────────────────────────────────────────────
  - name: auto-merge
    color: "0e8a16"
    description: "Merge automatically once approved and CI passes"

  - name: "won't-merge"
    color: "b60205"
    description: "Block auto-merge — human review required"

  # ── Automation Control (Quiet Mode gate) ──────────────────────────────────────
  - name: operations
    color: "1d76db"
    description: "Operational control issue (e.g. quiet-mode gate)"

  - name: automation-control
    color: "6f42c1"
    description: "Controls scheduled automation state (exit-quiet-mode gate)"

  # ── Automation / Routing ──────────────────────────────────────────────────────
  - name: auto-fix
    color: "0075ca"
    description: "Created by auto-fix / Ralph Loop workflow"

  - name: copilot
    color: "7057ff"
    description: "Assigned to GitHub Copilot for fixing"

  - name: ralph-loop
    color: "ff6b35"
    description: "Managed by the Ralph Loop self-healing workflow"

  - name: openrouter
    color: "6f42c1"
    description: "Routed to the OpenRouter orchestrator (first line of sight)"

  - name: agent-fallback
    color: "6f42c1"
    description: "Route issue or PR to the OpenRouter → Cursor → OpenHands fallback chain"

  # ── OpenRouter instantiation lifecycle (visibility into the instantiate dance)
  - name: "openrouter:instantiating"
    color: "fbca04"
    description: "OpenRouter instantiation in progress — API ping pending"

  - name: "openrouter:instantiated"
    color: "0e8a16"
    description: "OpenRouter instantiated — API key verified, 👍 live"

  - name: "openrouter:instantiation-failed"
    color: "b60205"
    description: "OpenRouter instantiation failed — see tracking issue for captured error"

  - name: "openrouter:needs-key"
    color: "d93f0b"
    description: "OPENROUTER_API_KEY not configured — cannot instantiate"

  - name: "openrouter:ralph-escalated"
    color: "ff6b35"
    description: "Instantiation unresolved > 24h — Ralph loop escalated to humans"

  - name: "openrouter:triage-failed"
    color: "b60205"
    description: "OpenRouter triage run failed — see failure comment for captured error"

  - name: needs-human
    color: "d93f0b"
    description: "Escalated — requires human intervention"

  - name: needs-action
    color: "fbca04"
    description: "Requires immediate action — auto-route to OpenRouter"

  # ── Credential / Secret Provisioning ──────────────────────────────────────
  - name: credentials-missing
    color: "d93f0b"
    description: "Issue blocked — missing API keys/secrets/credentials"

  - name: credentials-ready
    color: "0e8a16"
    description: "All required credentials provisioned and available"

  - name: desktop-access-required
    color: "fbca04"
    description: "Requires desktop agent with file system/keychain access"

  - name: vault-agent
    color: "e4e669"
    description: "Vault Agent credential provisioning required"

  - name: flexina
    color: "9b59b6"
    description: "Route to Flexina desktop automation agent"

  - name: codex
    color: "5319e7"
    description: "Routed to Codex (via OpenRouter) for code execution"

  - name: jules
    color: "4285f4"
    description: "Routed to Google Jules for deep-research and authoring"

  - name: deep-research
    color: "0e8a16"
    description: "Requires deep research before execution"

  - name: proof-of-life
    color: "2ea44f"
    description: "Proof-of-life run — app-review revvel-standards-run"

  - name: "role:orchestrator"
    color: "6f42c1"
    description: "OpenRouter agent is acting as orchestrator on this item"

  - name: "role:fixer"
    color: "ff6b35"
    description: "OpenRouter agent is acting as fixer on this item"

  # ── Graphite (PR stacking + merge queue) ────────────────────────────────────
  # See docs/GRAPHITE_INTEGRATION.md for rationale and rollout.
  - name: graphite
    color: "8b5cf6"
    description: "Managed by the Graphite PR-stacking app / merge queue"

  - name: "graphite:stacked"
    color: "a78bfa"
