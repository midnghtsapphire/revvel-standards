# Repository label definitions, synced by sync-labels.yml.
#
# Each entry: { name, color (hex without #), description, axis }.
# `axis` is the one-namespace-per-axis taxonomy enforced by
# scripts/label-inventory.js (see docs/AGENT_MONITORING_STANDARD.md).

labels:
  # ── Work-request lifecycle (axis: wr) ──────────────────────────────────────
  - name: "work-request"
    color: 0e8a16
    description: Tracked work request (WR) issue.
    axis: wr
  - name: "auto-generated-followup"
    color: fbca04
    description: >-
      WR issue auto-generated by the Follow-up Checkbox Router from a checked
      "- [x] Follow-up:" item on a source PR/issue.
    axis: wr
  - name: "WR"
    color: 0e8a16
    description: Work request marker applied to auto-generated diagnostic WRs.
    axis: wr
  - name: "wr:in-progress"
    color: 1d76db
    description: WR is actively being worked by an agent.
    axis: wr
  - name: "wr:reset"
    color: d93f0b
    description: One-shot signal to reset WR retrigger state; stripped after use.
    axis: wr
  - name: "wr:retrigger-attempts-1"
    color: fbca04
    description: WR PR-creation retrigger attempt 1 of 3.
    axis: wr
  - name: "wr:retrigger-attempts-2"
    color: fbca04
    description: WR PR-creation retrigger attempt 2 of 3.
    axis: wr
  - name: "wr:retrigger-attempts-3"
    color: fbca04
    description: WR PR-creation retrigger attempt 3 of 3.
    axis: wr
  - name: "wr-stuck"
    color: b60205
    description: WR has stalled and needs recovery by the stuck-detection sweep.
    axis: wr
  - name: "quick"
    color: c5def5
    description: Quick-intake WR routed through the OpenHands quick template.
    axis: wr

  # ── Research lane (axis: research) ─────────────────────────────────────────
  - name: "weekly-research"
    color: 5319e7
    description: Weekly-research WR intake handled by weekly-research.yml.
    axis: research
  - name: "deep-research"
    color: 5319e7
    description: WR requiring a deep-research pass before delivery.
    axis: research

  # ── Fleet ownership (axis: fleet) ──────────────────────────────────────────
  - name: "openrouter"
    color: 0052cc
    description: Work routed through the OpenRouter model fleet.
    axis: fleet
  - name: "openrouter:needs-key"
    color: d93f0b
    description: OpenRouter routing blocked pending an API key.
    axis: fleet
  - name: "openrouter:triage-failed"
    color: b60205
    description: OpenRouter triage attempt failed and needs human review.
    axis: fleet
  - name: "OpenHands"
    color: 0052cc
    description: Work owned by the OpenHands agent lane.
    axis: fleet

  # ── Agent role (axis: role) ────────────────────────────────────────────────
  - name: "role:orchestrator"
    color: 006b75
    description: Orchestrator-role work within the agent fleet.
    axis: role

  # ── Operations / automation health (axis: ops) ─────────────────────────────
  - name: "auto-fix"
    color: 0e8a16
    description: Eligible for automated self-healing fixes.
    axis: ops
  - name: "auto-error"
    color: b60205
    description: Automated agent health-check failure.
    axis: ops
  - name: "auto-diagnosed"
    color: fbca04
    description: WR auto-opened by the daily diagnostic audit.
    axis: ops

  # ── Issue lifecycle / escalation (axis: lifecycle) ─────────────────────────
  - name: "needs-human"
    color: b60205
    description: Requires human attention; automation cannot proceed safely.
    axis: lifecycle
  - name: "lifecycle:stuck"
    color: d93f0b
    description: Issue has stalled in its lifecycle and needs escalation.
    axis: lifecycle

  # ── PR review / merge lifecycle (axis: review) ─────────────────────────────
  - name: "needs-review"
    color: fbca04
    description: Awaiting review before it can proceed.
    axis: review
  - name: "bito-ai"
    color: 1d76db
    description: Bito AI code-review integration marker.
    axis: review
  - name: "bito-ai:review"
    color: 1d76db
    description: Bito AI review requested on this PR.
    axis: review
  - name: "bito-ai:changes-needed"
    color: d93f0b
    description: Bito AI review found changes needed.
    axis: review
  - name: "stacker"
    color: f97316
    description: Touched by stacker-bot (stacked PR tooling).
    axis: review
  - name: "stacker:stacked"
    color: ea580c
    description: PR is part of a multi-PR stack managed by stacker-bot.
    axis: review
