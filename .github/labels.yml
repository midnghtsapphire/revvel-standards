  - name: seo
    color: "3DDCFF"
    description: "SEO task — handled by NoimosAI SEO agent"

  - name: content
    color: "F7C948"
    description: "Content creation task — handled by NoimosAI content agent"

  - name: content-automation
    color: "00D4AA"
