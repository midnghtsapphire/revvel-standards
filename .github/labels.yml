# Repository label definitions, synced by sync-labels.yml.
#
# Each entry: { name, color (hex without #), description }.

- name: work-request
  color: 0e8a16
  description: Tracked work request (WR) issue.

- name: auto-generated-followup
  color: fbca04
  description: >-
    WR issue auto-generated by the Follow-up Checkbox Router from a checked
    "- [x] Follow-up:" item on a source PR/issue.

- name: needs-human
  color: d73a49
  description: Requires manual human review or intervention.

- name: auto-error
  color: eb6e40
  description: Automatically detected error or failure requiring investigation.
