# Agent Models Configuration
# Defines routing profiles for different agent types
# Used by workflows to reference models without hardcoding names
#
# HOUSE RULES (2026-07-08, owner decision after fleet A/B tests):
# - Everything routes through OpenRouter where possible (one place, one bill).
# - The Opus twins (Claude Opus 5 primary / 4.8 fallback) beat
#   openrouter/auto "fusion" in our own tests — pin them, don't use auto.
#   (2026-08-21: twins rolled forward 4.8/4.7 -> 5/4.8. Opus 5 is a drop-in
#   at Opus 4.8's exact price, $5/$25 per MTok, same 1M context. The pattern
#   is unchanged — current Opus primary, one version back as the fallback.)
# - DO NOT route to Claude Sonnet models: in our testing Sonnet repeatedly
#   refused/violated repo operating rules. Do not reintroduce as a fallback.
# - Claude Fable 5 owns the reasoning lane; Gemini owns the vision lane.
#   (DeepSeek R1 held the reasoning lane until 2026-07-10; it remains the
#   review-profile fallback.)
# - Model IDs follow OpenRouter's vendor/model convention; verify new IDs at
#   https://openrouter.ai/models before adding. Fallback chains absorb a bad
#   primary — never ship a profile with no fallback.
# - OPUS 5 GOTCHAS (why a lane may misbehave after the 2026-08-21 roll-forward):
#   1. Thinking is ON by default. On Opus 4.8/4.7, omitting the thinking param
#      meant no thinking; on Opus 5 it runs adaptive. max_tokens caps thinking
#      PLUS response text, so a profile whose max_tokens was sized tightly
#      around a no-thinking answer can now truncate mid-response. If a lane
#      starts returning cut-off output, raise max_tokens first.
#   2. Disabling thinking is capped at effort "high". Sending
#      thinking={"type":"disabled"} with effort xhigh/max returns HTTP 400,
#      and it is validated per request — a later call that raises effort fails
#      even though earlier ones in the same conversation passed.
#   Neither applies to the Gemini, Perplexity, DeepSeek or GPT lanes below.

profiles:
  # === ORCHESTRATOR ===
  # General work rides the Opus twins. (Not strategy:auto — see house rules.)
  orchestrator:
    description: "Opus twins for general orchestration — Opus 5 with Opus 4.8 fallback"
    provider: openrouter
    primary: "anthropic/claude-opus-5"
    fallback: "anthropic/claude-opus-4.8"
    max_tokens: 15000
    temperature: 0.4

  # === TASK-SPECIFIC PROFILES ===

  # Code patch profile - explicit task-routed coding profile
  code_patch:
    description: "Best coder — Opus 5, twin 4.8 fallback"
    provider: openrouter
    primary: "anthropic/claude-opus-5"
    fallback: "anthropic/claude-opus-4.8"
    max_tokens: 20000
    temperature: 0.4
    use_for: ["code", "file-edit", "refactor", "implement"]

  # Backward-compatible alias for older workflow references
  best_coder:
    description: "Alias of code_patch for legacy workflow compatibility"
    provider: openrouter
    primary: "anthropic/claude-opus-5"
    fallback: "anthropic/claude-opus-4.8"
    max_tokens: 20000
    temperature: 0.4
    use_for: ["code", "file-edit", "refactor", "implement"]

  # Deep reasoning - Fable 5 owns this lane
  # Owner decision 2026-07-10 (NOT re-litigated here): twins for execution,
  # Fable 5 for reasoning. Only the fallback rolls forward with the twins.
  # Fallback stays on the current Opus twin so the lane keeps working if the
  # Fable ID ever goes bad. Fable 5 is Mythos-class (above Opus), $10/$50 per
  # MTok vs Opus 5's $5/$25 — reserve the lane for genuinely hard reasoning;
  # routine work stays on the twins. On the Anthropic API direct (no
  # OpenRouter), the IDs are claude-fable-5 / claude-opus-5.
  # 2026-08-21: anthropic/claude-fable-5 and anthropic/claude-opus-5 were both
  # confirmed present in GET https://openrouter.ai/api/v1/models, so the
  # "unreachable, verify later" caveat from the 2026-07-10 change is now
  # discharged. Fable 5 also requires 30-day data retention — it is NOT
  # available to zero-data-retention orgs, which fail with a 400 on every
  # request regardless of payload. Check org retention before debugging a body.
  reasoning:
    description: "Hard reasoning, planning, hard debugging, math — Claude Fable 5, Opus 5 fallback"
    provider: openrouter
    primary: "anthropic/claude-fable-5"
    fallback: "anthropic/claude-opus-5"
    max_tokens: 16000
    temperature: 0.3
    use_for: ["reason", "plan", "hard-debug", "math", "analysis", "architecture"]

  # Vision - anything with pixels goes here
  vision:
    description: "Images, screenshots, OCR, diagrams, PDF pages — Gemini 2.5 Pro"
    provider: openrouter
    primary: "google/gemini-2.5-pro"
    fallback: "google/gemini-2.5-flash"
    max_tokens: 12000
    temperature: 0.3
    use_for: ["image", "screenshot", "ocr", "diagram", "vision", "multimodal", "pdf-image"]

  # Image GENERATION - creating/editing pixels (not understanding them; that's `vision`)
  # Used by the marketplace relisting pipeline (scripts/marketplace-relist.js) for
  # image-to-image "casual photo" staging conditioned on real product photos.
  # Catalog of alternatives: docs/OPENROUTER_IMAGE_MODELS.md
  image_gen:
    description: "Image generation / image-to-image editing — Gemini 2.5 Flash Image, GPT Image 1 fallback"
    provider: openrouter
    primary: "google/gemini-2.5-flash-image"
    fallback: "openai/gpt-image-1"
    max_tokens: 8000
    temperature: 0.6
    use_for: ["image-gen", "image-to-image", "product-staging", "creative-render", "thumbnail"]
    # Per-batch spend cap (USD). Pipelines MUST stop requesting new images once
    # the estimated batch spend reaches this cap (override via
    # IMAGE_GEN_BATCH_SPEND_CAP_USD env; see scripts/marketplace-relist.js).
    batch_spend_cap_usd: 1.00

  # Best researcher - web-grounded with citations
  # (Perplexity direct today; sonar models also exist on OpenRouter as
  #  perplexity/sonar-pro if we ever consolidate keys fully.)
  research:
    description: "Deep research using Perplexity Sonar for web-grounded answers"
    provider: perplexity
    primary: "sonar-pro"
    fallback: "sonar-deep-research"
    max_tokens: 10000
    temperature: 0.4

  # Review profile - the OTHER twin reviews, so coder and reviewer differ.
  # Coder moved to Opus 5 on 2026-08-21, so the reviewer moves to Opus 4.8 to
  # keep that separation. If you ever set both to the same ID you lose the
  # independent second opinion this profile exists for.
  review:
    description: "PR/code review — Opus 4.8 (deliberately not the coding twin), DeepSeek R1 fallback"
    provider: openrouter
    primary: "anthropic/claude-opus-4.8"
    fallback: "deepseek/deepseek-r1"
    max_tokens: 8000
    temperature: 0.2
    use_for: ["review", "pr-review", "code-review"]

  # Backward-compatible alias for older workflow references
  best_reviewer:
    description: "Alias of review profile for legacy workflow compatibility"
    provider: openrouter
    primary: "anthropic/claude-opus-4.8"
    fallback: "deepseek/deepseek-r1"
    max_tokens: 8000
    temperature: 0.2
    use_for: ["review", "pr-review", "code-review"]

  # Triage - quick classification, cheap
  triage:
    description: "Quick issue classification and routing - cheap model with tight output budget"
    provider: openrouter
    primary: "openai/gpt-4o-mini"
    fallback: "anthropic/claude-haiku-4.5"
    max_tokens: 1500
    temperature: 0.3
    use_for: ["triage", "classify", "route", "label"]

  # Cheap summary - lightweight tasks only
  cheap_summary:
    description: "Quick summaries and simple responses"
    provider: openrouter
    primary: "deepseek/deepseek-chat"
    fallback: "openai/gpt-4o-mini"
    max_tokens: 2000
    temperature: 0.1
    use_for: ["summarize", "simple", "quick"]

  # Jules - Google's CI Fixer agent
  jules:
    description: "Jules coding agent with CI Fixer - PR creation and CI self-repair"
    provider: google-jules
    enabled: true
    max_tokens: 15000

  # Devin - AI coding agent for code review and implementation
  devin:
    description: "Devin AI coding agent - for code review and implementation tasks"
    provider: devin
    enabled: ${{ vars.DEVIN_ENABLED || 'false' }}
    max_tokens: 20000
    use_for: ["code-review", "implementation", "debug", "refactor"]

  # CircleCI - CI/CD pipeline agent
  circleci:
    description: "CircleCI agent for CI/CD tasks"
    provider: circleci
    enabled: ${{ vars.CIRCLECI_ENABLED || 'false' }}
    use_for: ["ci-cd", "deploy", "test"]

# === ROUTING TREE ===
# For ANY type of job, walk top-down; first match wins; every leaf is a
# profile above. Workflows, routers, and the Agent Creator dashboard should
# consult this tree instead of inventing their own mapping.
routing_tree:
  - when: "job GENERATES or edits images (image-to-image, product staging, creative renders)"
    profile: image_gen
  - when: "job involves images, screenshots, diagrams, OCR, or PDF pages as pixels"
    profile: vision
  - when: "job needs deep reasoning: planning, hard debugging, math, architecture"
    profile: reasoning
  - when: "job writes or edits code (implement, refactor, file-edit)"
    profile: code_patch
  - when: "job reviews code or PRs"
    profile: review
  - when: "job needs web-grounded research with citations"
    profile: research
  - when: "job classifies, labels, or routes incoming work"
    profile: triage
  - when: "job is a quick summary or trivial transform"
    profile: cheap_summary
  - when: "job needs CI self-repair with PR creation"
    profile: jules
  - default: orchestrator

# Models that must NOT be routed to (house rule — see header):
denylist:
  # Pattern covers BOTH naming schemes: new-style claude-sonnet-4 AND
  # old-style claude-3.5-sonnet. The original "anthropic/claude-sonnet-*"
  # pattern missed the old style, which is exactly how a denylisted model
  # survived in the fleet-controller's fallback chain until 2026-07-10.
  - pattern: "anthropic/*sonnet*"
    reason: "Sonnet family refused/violated repo operating rules in fleet testing (2026-07)."
  - pattern: "openrouter/auto"
    reason: "Opus twins beat auto/fusion routing in fleet A/B tests (2026-07)."
  - pattern: "openrouter/fusion"
    reason: "Separate router (parallel multi-model fusion, not an auto alias) — Opus twins beat it in fleet A/B tests (2026-07), same rationale as openrouter/auto."

# For GitHub Actions usage:
#   - ${{ fromJson(inputs.model_profile || 'orchestrator') }}

# Model selection helpers for GitHub Actions
env:
  DEFAULT_TIMEOUT_MINUTES: 30
  MAX_RERUNS: 1
  # Set FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' for Node.js 24
