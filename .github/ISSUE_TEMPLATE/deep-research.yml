name: 🔬 Deep Research (Universal)
description: Use for any issue — everything gets deep-researched before execution.
title: "[Deep Research] "
labels: ["deep-research", "jules", "triage", "triage:new"]
body:
  - type: markdown
    attributes:
      value: |
        ## Deep Research — default path

        Every issue uses this template so a research swarm can validate assumptions,
        find current best tools/patterns, and cross-check sources.

        After research, convert findings into a concrete, testable MVI.

  - type: textarea
    id: request
    attributes:
      label: What you want (plain language is fine)
      description: Describe the outcome you want. The research team will rewrite this into an MVI contract.
      placeholder: |
        e.g. "I want a way to click New Issue and have Jules help me write it."
    validations:
      required: true

  - type: textarea
    id: research-scope
    attributes:
      label: Research scope (defaults)
      description: Edit if needed. Keep it broad when risk is high.
      value: |
        - [x] Cross-check results across multiple ecosystems (GitHub, GitLab, Bitbucket, Gitee).
        - [x] Check non-US sources where relevant.
        - [x] Prefer primary sources (docs, specs, code, changelogs) over reviews.
        - [x] Assess trust: provenance, incentives, independent confirmations.
        - [x] Capture findings in journal + open follow-up issues/projects when warranted.
    validations:
      required: false

  - type: textarea
    id: other_refs
    attributes:
      label: Other references (example sites, docs, prior art)
      description: Paste URLs, repo paths, or notes Jules should study. Leave blank if none.
      placeholder: |
        - https://example.com/some-reference
        - path/to/related/file.md
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (optional — Jules will draft these if blank)
      description: How we'll know this is done. Jules will propose an MVI contract if you leave this empty.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: false

