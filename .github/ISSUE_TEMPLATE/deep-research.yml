name: 🔬 Deep-Research Request (Jules)
description: Ask Google Jules to deep-research best functionality & method, then refine this request before any code changes.
title: "[Jules] "
labels: ["jules", "google-labs-jules", "triage", "triage:new"]
body:
  - type: markdown
    attributes:
      value: |
        ## 👋 Hi Audrey — Jules will take this one.

        This template is pre-scoped so you don't have to retype the boilerplate
        every time. Fill in **What you want** in your own words — Jules will
        read the scope below, do the deep research, and rewrite your request
        into a clear, system-design-quality spec *before* any code is written.

        When you submit, @google-labs-jules is mentioned in the body so Jules
        is pulled in automatically. The `jules` label routes this through the
        standards review process.

  - type: textarea
    id: request
    attributes:
      label: What you want (plain language is fine — Jules will refine it)
      description: Describe the outcome you want. Don't worry about structure; that's Jules's job.
      placeholder: |
        e.g. "I want a way to click New Issue and have Jules help me write it."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope for Jules's deep research
      description: These are the defaults — all pre-checked. Uncheck any that don't apply, or add extras. (Pre-filled because GitHub Issue Forms `checkboxes` don't support default-selected options.)
      value: |
        - [x] Review all of **midnghtsapphire/revvel-standards** (this repo — AGENTS.md, skills/, standards/, templates/, .github/).
        - [x] Cross-reference other repos in the **midnghtsapphire** org for consistency.
        - [x] Check the **skills vault** (`skills/REGISTRY.md`) for relevant skills to load before acting.
        - [x] Check **recurse-rules.md** and **docs/AGENTS.md** for repo-wide rules.
        - [x] Confirm the change honors the **Prime Directive** (ship working, tested code — not plans).
    validations:
      required: false

  - type: textarea
    id: other_refs
    attributes:
      label: Other references (example sites, docs, prior art)
      description: Paste URLs, repo paths, or notes Jules should study. Leave blank if none.
      placeholder: |
        - https://example.com/some-reference
        - path/to/related/file.md
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (optional — Jules will draft these if blank)
      description: How we'll know this is done. Jules will propose an MVI contract if you leave this empty.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ### 🤖 Jules — your turn

        @google-labs-jules please:

        1. **Deep-research** the scope checked above before writing anything.
        2. **Rewrite the request** section into a clear problem statement with
           concrete acceptance criteria (follow the MVI-contract skill).
        3. **Propose the system design** — files to touch, standards to apply,
           tests to add — and post it as the first comment on this issue.
        4. **Wait for Audrey's 👍** before implementing, unless the change is
           clearly trivial.

        Follow `docs/AGENTS.md` and any skills triggered by this request.
