name: Work Request (WR)
description: Submit a new work request. The system generates everything else.
title: "[WR] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Work Request
        > Form-driven, not label-driven. Every field is a contractual commitment.
        > Blank fields are not allowed (D013). The system will auto-fill missing fields.
        > See `UPREV_METHOD.md` and `WR_RESEARCH_MANDATE.md` for methodology.

  - type: dropdown
    id: wr_class
    attributes:
      label: WR Class
      description: What kind of work is this?
      options:
        - bug
        - style
        - docs
        - product
        - research
        - infrastructure
        - compliance
        - security
      default: 0
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Business impact and urgency
      options:
        - P0 — Revenue-blocking or security-critical
        - P1 — High value, time-sensitive
        - P2 — Standard work, queue normally
        - P3 — Nice-to-have, backlog
      default: 2
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Which area of the system?
      options:
        - agent-system
        - automation
        - ci-cd
        - distribution
        - docs
        - frontend
        - infrastructure
        - intelligence-layer
        - marketplace
        - mobile
        - monitoring
        - osint
        - payments
        - product-pipeline
        - research
        - security
        - standards
        - other
      default: 0
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: WR Title
      description: Clear, outcome-oriented title. What will be true after this ships?
      placeholder: "e.g., Add Stripe payment processing with webhook verification"
    validations:
      required: true

  - type: textarea
    id: issue_context
    attributes:
      label: Issue Context
      description: What triggered this WR? Link to bug, user request, or strategic goal.
      placeholder: |
        - Bug report: #12345
        - User request: "Customers can't pay with Apple Pay"
        - Strategic: Q3 OKR — increase checkout conversion by 15%
    validations:
      required: true

  - type: textarea
    id: background_motivation
    attributes:
      label: Background & Motivation
      description: Why is this work needed? What's the underlying problem or opportunity?
      placeholder: |
        Current checkout only supports credit cards. 23% of cart abandonments
        are on mobile devices where users prefer Apple Pay / Google Pay.
        Competitor X added wallet payments and saw 18% conversion lift.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in, what's out, boundaries with other WRs. Be specific.
      placeholder: |
        ## In Scope
        - Apple Pay integration (Stripe Payment Request Button)
        - Google Pay integration
        - Webhook verification and idempotency
        - Checkout UI updates for wallet options
        - Tests for all payment flows
        - Docs update (README + API reference)

        ## Out of Scope
        - Buy Now Pay Later (separate WR)
        - Cryptocurrency payments (separate WR)
        - Subscription billing (separate WR)
    validations:
      required: true

  - type: textarea
    id: research_findings
    attributes:
      label: Research Findings
      description: Summary of research. Tiered findings (A1/A2/B2/B3). Required before build.
      placeholder: |
        ## A1 — Proven (>95%)
        - Stripe Payment Request Button supports Apple Pay and Google Pay
          (Source: stripe.com/docs/payments/payment-request-button)
        - Webhook signature verification prevents replay attacks
          (Source: stripe.com/docs/webhooks/signatures)

        ## A2 — Established (80-95%)
        - Mobile wallet payments increase conversion 15-25% in e-commerce
          (Source: Baymard Institute 2024, n=4,200 sites)

        ## B2 — Emerging (60-80%)
        - Passkey authentication reduces checkout friction further
          (Source: FIDO Alliance whitepaper, 2023)

        ## B3 — Speculative (<60%)
        - None identified
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Approach / Design Sketch
      description: Proposed implementation. Alternatives considered. Why this approach?
      placeholder: |
        ## Proposed Approach
        1. Add Stripe Payment Request Button to checkout page
        2. Implement webhook endpoint with signature verification
        3. Add idempotency key handling for duplicate events
        4. Update checkout UI to show wallet options on supported devices
        5. Add integration tests for full payment flow

        ## Alternatives Considered
        - Braintree: Lower market share, fewer docs (rejected)
        - Adyen: Enterprise pricing, overkill for current volume (rejected)
        - Custom wallet integration: Too complex, high maintenance (rejected)
    validations:
      required: true

  - type: textarea
    id: artifact_requirements
    attributes:
      label: Artifact Requirements
      description: What artifacts must this WR produce? Check all that apply.
      value: |
        - [ ] Code (implementation)
        - [ ] Tests (unit + integration)
        - [ ] Docs (README, API reference, inline comments)
        - [ ] Monitoring (metrics, alerts, logs)
        - [ ] Ops (deployment notes, rollback plan, runbook)
        - [ ] Skills (SKILL.md for agent reuse)
        - [ ] MCP manifest (if agent-facing)
        - [ ] OpenAPI spec (if API change)
        - [ ] PDF / booklet (if user-facing product)
        - [ ] Other: ___
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Measurable criteria for "done." Each must be verifiable.
      placeholder: |
        - [ ] Apple Pay button appears on checkout for Safari/iOS users
        - [ ] Google Pay button appears on checkout for Chrome/Android users
        - [ ] Payment completes end-to-end in test environment
        - [ ] Webhook signature verification rejects invalid signatures
        - [ ] Idempotency prevents duplicate charge on retry
        - [ ] All new code has >80% test coverage
        - [ ] README updated with wallet payment setup instructions
        - [ ] No regressions in existing payment flows (credit card still works)
    validations:
      required: true

  - type: textarea
    id: risks_mitigations
    attributes:
      label: Risks & Mitigations
      description: Known risks, fragile files touched, rollback plan.
      placeholder: |
        | Risk | Likelihood | Impact | Mitigation |
        |------|-----------|--------|------------|
        | Webhook endpoint DDoS | Low | High | Rate limiting + signature verification |
        | Apple Pay cert expiry | Medium | High | Calendar reminder + monitoring alert |
        | Checkout UI regression | Medium | Medium | Visual regression tests + manual QA |
        | Payment flow breakage | Low | Critical | Feature flag + instant rollback |
    validations:
      required: true

  - type: textarea
    id: competitor_intelligence
    attributes:
      label: Competitor & Pricing Intelligence
      description: Required for product-class WRs. Actual prices, not vague labels.
      placeholder: |
        | Competitor | Price | Wallet Support | Gap | Our Advantage |
        |------------|-------|---------------|-----|---------------|
        | Competitor X | $99/mo | Apple Pay only | No Google Pay | We support both |
        | Competitor Y | $49/mo | None | No mobile wallets | First-mover advantage |
    validations:
      required: false

  - type: textarea
    id: sem_seo
    attributes:
      label: SEM / SEO Analysis
      description: Required for product-class WRs. Discoverability analysis.
      placeholder: |
        ## Primary Keywords
        - "accept apple pay on website"
        - "google pay integration"
        - "mobile wallet checkout"

        ## Content Gaps
        - Most tutorials only cover Stripe Checkout, not Payment Request Button
        - Few guides cover webhook security best practices
        - Opportunity: comprehensive guide with security checklist
    validations:
      required: false

  - type: dropdown
    id: checkpoint_gated
    attributes:
      label: Checkpoint-Gated Grid
      description: Is this WR too large for one PR? Decompose into Blocks (D011).
      options:
        - "No — single PR, complete deliverable"
        - "Yes — decomposed into Blocks, owner reviews between each"
      default: 0
    validations:
      required: true

  - type: textarea
    id: blocks
    attributes:
      label: Blocks (if checkpoint-gated)
      description: Ordered list of atomic, complete PRs. Each Block ships independently.
      placeholder: |
        ## Block 1: Backend — Webhook endpoint + verification
        - Stripe webhook endpoint
        - Signature verification
        - Idempotency handling
        - Tests + docs

        ## Block 2: Frontend — Wallet button integration
        - Payment Request Button component
        - Device detection (Apple Pay vs Google Pay)
        - Checkout UI updates
        - Tests + docs

        ## Block 3: Ops — Monitoring + rollout
        - Metrics and alerts
        - Feature flag
        - Rollback runbook
        - Production verification
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: What must be true before this WR can start?
      placeholder: |
        - [ ] Stripe account configured (production keys)
        - [ ] Apple Pay merchant verification complete
        - [ ] Google Pay merchant ID registered
        - [ ] WR #12345 (checkout refactor) merged
    validations:
      required: false

  - type: input
    id: estimated_effort
    attributes:
      label: Estimated Effort
      description: Rough estimate. The system will refine this.
      placeholder: "e.g., 3-5 days, 2-3 PRs"
    validations:
      required: false

  - type: textarea
    id: learnings
    attributes:
      label: Learnings — What & Why
      description: Filled post-completion. What was learned and why it matters.
      placeholder: |
        ## Filled by completing agent
        - What: ___
        - Why: ___
        - Source PR: #NNNNN
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Agent Instructions:**
        1. Read `UPREV_METHOD.md` before starting.
        2. Read `WR_RESEARCH_MANDATE.md` — research first, build second.
        3. Read `AGENT_BUILD_PROMPT.md` for execution standards.
        4. All changes through draft PR. Never merge your own PR.
        5. Update `learnings.md` with TM-NNNN format on completion.
        6. Follow `WRITE_AS_YOU_GO_STANDARD.md` — update LEDGER, CHANGELOG, Library in same commit.
