name: Bug Report
description: Report a bug quickly. Deep research is still applied automatically.
title: "[Bug] "
labels: ["bug", "triage", "triage:new", "deep-research"]
body:
  - type: markdown
    attributes:
      value: |
        ## Report a Bug

        Use this template for things that are **broken right now**.

        You only need to fill out the basics. The same deep-research workflow
        runs automatically to:
        - check for known upstream issues / regressions
        - find newly released tools or patches
        - cross-check sources and trust signals

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: |
        e.g. "The AI PR review workflow posts a 404 error comment instead of a review."
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Open a PR against main
        2. Wait for the AI PR Review workflow to run
        3. See the error comment posted by the bot
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
      placeholder: |
        The AI PR Review should post a code review comment with findings.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages or screenshots.
      placeholder: |
        The bot posted "No response from OpenRouter: 404 Not Found"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is this?
      options:
        - "P0 — Production is down / data loss"
        - "P1 — Major feature broken, no workaround"
        - "P2 — Feature broken but has workaround"
        - "P3 — Minor / cosmetic"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Error logs, screenshots, links to failing CI runs, related issues/PRs.
      placeholder: |
        - Link to failing workflow run: https://github.com/...
        - Related issue: #123
    validations:
      required: false
