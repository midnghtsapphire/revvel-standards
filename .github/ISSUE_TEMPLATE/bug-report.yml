name: 🐞 Bug Report
description: Something is broken. Jules will triage and propose a fix.
title: "[Bug] "
labels: ["bug", "jules", "triage", "triage:new"]
body:
  - type: markdown
    attributes:
      value: |
        Report a bug. Jules will reproduce, root-cause against
        **midnghtsapphire/revvel-standards**, and propose a minimal fix.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: Short description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (repo / branch / commit / OS, if relevant)
      placeholder: |
        - Repo: midnghtsapphire/revvel-standards
        - Branch / commit: main @ <sha>
        - OS / runtime: …
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or links
      render: shell
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        @google-labs-jules please reproduce this against
        **midnghtsapphire/revvel-standards**, identify the root cause,
        and propose the smallest possible fix (with a test) as the first
        comment on this issue before implementing.
