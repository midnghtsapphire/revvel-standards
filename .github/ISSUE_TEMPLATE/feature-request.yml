name: ✨ Feature Request
description: Propose a new feature or enhancement. Jules will refine the spec before coding starts.
title: "[Feature] "
labels: ["enhancement", "jules", "triage", "triage:new"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you want. Jules will review, deep-research
        precedents in **midnghtsapphire/revvel-standards**, and propose a
        system design before any code is written.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What's painful or missing today?
      placeholder: Today I have to … which is slow/error-prone/confusing because …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (rough is fine — Jules will refine it)
      placeholder: I'd like …
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.
      placeholder: Also considered … but …
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Default research scope
      options:
        - label: Review all of **midnghtsapphire/revvel-standards** for existing patterns before proposing new ones.
          required: false
        - label: Check the **skills vault** and **templates/** for reusable building blocks.
          required: false
        - label: Confirm the change follows conventional-commit + PR-template conventions.
          required: false

  - type: markdown
    attributes:
      value: |
        ---

        @google-labs-jules please research the scope above, refine this
        proposal into a concrete spec with acceptance criteria, and post the
        system design as the first comment on this issue before implementing.
