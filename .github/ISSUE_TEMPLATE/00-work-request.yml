name: Work Request
description: Request scoped work with explicit bundled expectations, output type, and anti-under-scoping rules.
title: "[WR] "
labels:
  - work-request
  - weekly-research
  - wr:in-progress
  - deep-research
  - openrouter
  - role:orchestrator
body:
  - type: markdown
    attributes:
      value: |
        ## Work Request

        Use this form to define the full intended scope AND how the system should treat it.

        Important:
        - **Title-only intake is allowed.** If you only have a title, submit it and let research / the orchestrator infer the rest.
        - **Output Type** below controls what you are asking for (app, CLI, API, PDF, docs, invention, etc.) when you choose to fill it in.
        - When Output Type is **sellable-pdf**, use **PDF pipeline batch** (Not applicable / Autocreate 3 / Autocreate 20).
          The full playbook is **form-driven** from those fields (`workflows/PDF_WR_PLAYBOOK.md`); do not rely on hand-picked labels for routing.
        - This form should describe the complete operational unit, not the smallest acceptable patch.
        - If documentation, discoverability, reminders, and a bug fix belong together, list them together here.
        - The PR should mirror this request and must not silently omit explicitly requested items.

  - type: dropdown
    id: output_type
    attributes:
      label: Output Type (required)
      description: What are you asking to create or change?
      options:
        - production-app
        - desktop-tool
        - sellable-pdf
        - technical-documentation
        - client-code-task
        - project-management-doc
        - internal-script-automation
        - cli-product
        - mcp-product
        - api-product
        - invention-flow
    validations:
      required: true

  - type: dropdown
    id: pdf_pipeline_batch
    attributes:
      label: PDF pipeline batch
      description: >
        Only applies when Output Type is sellable-pdf: how many AI-generated product concepts or outline
        variants to produce before you pick one to ship (your external Make/n8n/Zapier/Gumloop flow should read this
        count from the issue body — see workflows/PDF_WR_PLAYBOOK.md). For every other output type, choose Not applicable.
      options:
        - Not applicable
        - Autocreate 3
        - Autocreate 20
    validations:
      required: false

  - type: dropdown
    id: research_mode
    attributes:
      label: Research Mode
      description: How aggressively should the system research tools, APIs, competitors, and workflows?
      options:
        - standard
        - deepresearch
    validations:
      required: false

  - type: dropdown
    id: delivery_mode
    attributes:
      label: Delivery Mode
      description: How should the output be delivered?
      options:
        - build-direct
        - build-with-brief-options
        - proposal-first
    validations:
      required: false

  - type: dropdown
    id: lifecycle_mode
    attributes:
      label: Lifecycle Mode
      description: Is this new work, a refresh, or just an audit?
      options:
        - new-build
        - refresh-existing
        - audit-only
    validations:
      required: false

  - type: dropdown
    id: commercial_mode
    attributes:
      label: Commercial Mode
      description: How should this be thought of commercially?
      options:
        - digital-product
        - saas-app
        - api-usage
        - license
        - client-billable
        - internal-only
    validations:
      required: false

  - type: dropdown
    id: decision_team
    attributes:
      label: Assign To / Decision Team
      description: >
        Who should own this WR? Leave on 'orchestrator' for the normal routing.
        Choose 'dragnet-team' to summon the DRAGNET decision team (PLATO → MEDUSA →
        COUNTER → JUDGE → DARWIN, see docs/DRAGNET_TEAM.md): it instantiates the team,
        deduplicates against open WR/PRs, and drives a permanent-fix WR + PR together
        — the same behavior as commenting `/dragnet` on the issue.
      options:
        - orchestrator
        - dragnet-team
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### Scope and completeness

        The sections below define the bundled work for this WR. They should describe the full operational unit, not just the minimum patch.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the requested work.
      placeholder: Add discoverability layers, REMINDERS.md scaffold, and dual-trigger bug fix for PDF workflow.
    validations:
      required: false

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be true after this work is done?
      placeholder: |
        Example:
        The repo should include the PDF in a durable location, surface it through multiple discoverability paths,
        add lightweight reminders scaffolding, and fix the dual-trigger bug in the same PR.
    validations:
      required: false

  - type: textarea
    id: required_bundle
    attributes:
      label: Required Bundle
      description: List everything that must be included in the same PR unless there is a hard blocker.
      placeholder: |
        - Primary fix or feature
        - README or reference-table updates
        - Top-of-doc callout / cross-link
        - Knowledge note or docs update
        - REMINDERS.md / runbook scaffold
        - Validation / tests / smoke-check
    validations:
      required: false

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: What makes this WR complete?
      placeholder: |
        This work is complete only if:
        - the functional change is implemented
        - the discoverability updates are included
        - any referenced docs/knowledge files are updated
        - reminders/runbook scaffolding is included if requested
        - validation notes are included
    validations:
      required: false

  - type: textarea
    id: do_not_under_scope
    attributes:
      label: Do Not Under-Scope
      description: State what must not be silently deferred or dropped.
      placeholder: |
        Do not treat README/docs/reminders/discoverability as optional if they are explicitly part of this WR.
        Do not split these into another PR unless there is a hard blocker.
    validations:
      required: false

  - type: textarea
    id: explicit_exclusions
    attributes:
      label: Explicit Exclusions
      description: What is intentionally out of scope for this WR?
      placeholder: |
        - No new UI redesign
        - No deployment automation changes
        - No unrelated refactors
    validations:
      required: false

  - type: dropdown
    id: delivery_shape
    attributes:
      label: Delivery Shape
      description: What should the implementation packaging look like?
      options:
        - One PR
        - One PR preferred, split only if blocked
        - Proposal first
        - Multiple PRs intentionally planned
        - Explodable sellable ZIP (unpacks into repo folders)
    validations:
      required: false

  - type: textarea
    id: sellable_artifact_bundle
    attributes:
      label: Sellable Artifact Bundle
      description: >
        For sellable products: list everything the buyer receives, packaged as an explodable ZIP that
        unpacks into the correct repo folders on import. Call out all necessary files, prompts, skills,
        LLMs/models, tools, MCP servers, CLI entrypoints, tokens/secrets templates, and a BOM (bill of
        materials) list.
      placeholder: |
        Deliver as an explodable ZIP that unpacks into the right folders, containing:
        - /agents, /docs, /scripts, /config folders that explode into place
        - Prompts, skills, and agent definitions
        - LLM/model + tool + MCP + CLI wiring
        - env.template for tokens/secrets (no real secrets committed)
        - BOM.list (bill of materials) for compute, DB, integrations, runtime
        - README with install / setup guide
    validations:
      required: false

  - type: textarea
    id: purchase_validation
    attributes:
      label: Purchase Validation (functions-as-purchased)
      description: >
        How will we rigorously prove the artifact functions exactly as a paying customer would receive it?
        Describe the tests to run and include a URL / instructions to exercise it before marking done.
      placeholder: |
        - Unzip the delivered bundle into a clean repo and confirm it explodes into the expected folders
        - Follow the README as a buyer would; run the documented setup end to end
        - Run the included test suite / smoke checks and confirm they pass
        - Provide a URL (or exact commands) to reproduce a working run before completing as done
    validations:
      required: false

  - type: input
    id: expected_scope
    attributes:
      label: Expected Scope
      description: Roughly how big should this be?
      placeholder: "~6 files, one coherent follow-up PR"
    validations:
      required: false

  - type: textarea
    id: validation_expectations
    attributes:
      label: Validation Expectations
      description: How should the implementer prove this works?
      placeholder: |
        - Manual verification notes
        - Existing tests pass
        - Smoke-check docs links
        - Confirm trigger behavior no longer duplicates
    validations:
      required: false

  - type: textarea
    id: blocker_rule
    attributes:
      label: Blocker Rule
      description: What should happen if one part cannot be completed?
      placeholder: |
        If blocked on any required item:
        1. explain the blocker,
        2. still complete all unblocked required items,
        3. document deferred work explicitly,
        4. do not silently omit scope.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### After implementation — PR and continuation

        This is the long-form Work Request contract. When the work is implemented, the run must not stop at the issue:

        - **Open one PR** that contains the full required bundle (not a partial patch).
        - **Continue the loop:** reset the routing labels (remove `wr:code`) and let the
          PR lifecycle / review / merge workflows carry it forward automatically.
        - **If it stalls,** add `wr:reset` to force a fresh WR PR/artifact pass
          (`wr-pr-creation.yml`) instead of leaving the issue parked.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Confirm the intended operating behavior. Permanent for every WR type (full form, OpenHands quick form, and markdown WR templates).
      options:
        - label: This WR defines a bundled outcome, not just a minimum acceptable patch.
        - label: Explicitly requested secondary items should not be silently deferred.
        - label: If the PR is partial, the blocker must be documented.
        - label: The PR should reflect the WR's required bundle and definition of done.
        - label: After implementation, open a PR and continue the loop (reset routing labels / trigger downstream workflows) instead of stopping at the issue.
