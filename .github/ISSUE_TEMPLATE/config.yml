# Issue template picker configuration for midnghtsapphire/revvel-standards.
#
# Audrey's rule (2026-04): **one template to rule them all.** Every work
# request (WR), bug, feature, or idea goes through the Deep-Research (Jules)
# template so Jules is always auto-assigned (via the `jules` label + the
# `@google-labs-jules` mention in the body) and auto-invoked by
# `.github/workflows/jules-invoke.yml` on `issues: [opened, reopened]`.
#
# The other files in this directory (`daily-decision.md`, `exit-quiet-mode.md`,
# `urgent-compliance.md`) are **operational** templates consumed by the
# triage-cron / migration-cron / compliance-watcher workflows — they are not
# intended as day-to-day user entry points.
#
# Keep `blank_issues_enabled: true` so power users / automation can still open
# a blank issue; the Deep-Research template is the recommended default for
# every WR.

blank_issues_enabled: true
contact_links:
  - name: 📚 Universal Agent Instructions (AGENTS.md)
    url: https://github.com/midnghtsapphire/revvel-standards/blob/main/docs/AGENTS.md
    about: Read the repo-wide rules that every agent (including Jules) follows before filing structured work.
