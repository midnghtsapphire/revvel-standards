name: Update Project Dashboard
on:
  schedule:
    - cron: 0 */4 * * *
  workflow_dispatch: null
  push:
    branches:
      - main
    paths:
      - docs/_MASTER_INVENTORY.md
      - docs/_MASTER_BOM.md
      - docs/PROJECTS_TO_SHIP.md
      - docs/PROJECT_CATALOG.md
      - "**/README.md"
      - scripts/aggregate-project-dashboard.js
permissions:
  contents: write
jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Generate dashboard
        run: node scripts/aggregate-project-dashboard.js
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet dashboard.html dashboard-data.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push dashboard updates
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard.html dashboard-data.json
          git commit -m "chore: update project dashboard [skip ci]"
          git push
      - name: Deploy to GitHub Pages (optional)
        if: steps.check_changes.outputs.changes == 'true'
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          exclude_assets: .github,node_modules,tests
      - name: Summary
        run: |
          echo "### 📊 Dashboard Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard has been regenerated with latest project data." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View Dashboard:** [dashboard.html](https://midnghtsapphire.github.io/revvel-standards/dashboard.html)" >> $GITHUB_STEP_SUMMARY
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
