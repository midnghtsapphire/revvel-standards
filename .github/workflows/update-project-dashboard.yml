name: Update Project Dashboard
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: 0 */4 * * *
  workflow_dispatch: null
  push:
    branches:
      - main
    paths:
      - docs/_MASTER_INVENTORY.md
      - docs/_MASTER_BOM.md
      - docs/PROJECTS_TO_SHIP.md
      - docs/PROJECT_CATALOG.md
      - "**/README.md"
      - scripts/aggregate-project-dashboard.js
permissions:
  contents: write
  pull-requests: write
jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # WR-02 (audit-2026-08-05): default GITHUB_TOKEN cannot push to main under
          # the "main" ruleset (rule type `pull_request` — "Changes must be
          # made through a pull request"). This has failed 100% of scheduled
          # runs since at least 2026-07-21 (git push rejected with GH013),
          # which is why dashboard-data.json / state.json were stuck on
          # 2026-06-14 data for 7+ weeks. ADMIN_GITHUB_TOKEN is the repo's
          # existing bypass-actor pattern for this exact class of problem
          # (already used by the gh-pages step below and by patch-agent.yml).
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Generate dashboard
        run: node scripts/aggregate-project-dashboard.js
      - name: Refresh state.json from dashboard-data.json
        # WR-03 (audit-2026-08-05): scripts/populate-state.js existed with a --check
        # mode built specifically for CI but had never been invoked by any
        # workflow, so state.json silently drifted from dashboard-data.json.
        run: node scripts/populate-state.js
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet dashboard.html dashboard-data.json state.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push dashboard updates
        if: steps.check_changes.outputs.changes == 'true'
        id: commit_push
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard.html dashboard-data.json state.json
          git commit -m "chore: update project dashboard [skip ci]"
          # Primary path: ADMIN_GITHUB_TOKEN is a ruleset bypass actor, so a
          # direct push to main should succeed exactly like it did before the
          # "main" ruleset's `pull_request` rule started rejecting the
          # default GITHUB_TOKEN's pushes (see WR-02, audit-2026-08-05).
          if git push; then
            echo "pushed_directly=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Direct push to main was rejected (branch ruleset) — falling back to a PR so data is never lost."
          echo "pushed_directly=false" >> "$GITHUB_OUTPUT"
          BRANCH="auto/dashboard-data-refresh"
          git branch -f "$BRANCH"
          git push -f origin "$BRANCH"
          gh pr create \
            --title "chore: update project dashboard (automated)" \
            --body "Automated dashboard-data.json / dashboard.html refresh. Direct push to main was rejected by the branch ruleset — see WR-02, audit-2026-08-05. Safe to merge: generated data only, no logic changes." \
            --base main \
            --head "$BRANCH" \
            --label "automated" 2>&1 || echo "PR may already exist for $BRANCH — it now carries the latest data."
      - name: Deploy to GitHub Pages (optional)
        if: steps.check_changes.outputs.changes == 'true'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          exclude_assets: .github,node_modules,tests
      - name: Summary
        run: |
          echo "### 📊 Dashboard Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard has been regenerated with latest project data." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View Dashboard:** [dashboard.html](https://midnghtsapphire.github.io/revvel-standards/dashboard.html)" >> $GITHUB_STEP_SUMMARY
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
