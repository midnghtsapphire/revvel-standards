name: PR Check Status Automation
on:
  check_suite:
    types:
      - completed
  # ─────────────────────────────────────────────────────────────────────────
  # DISABLED TRIGGER: workflow_run
  # Who: Claude (controller-auditor)  When: 2026-06-17
  # Why: GitHub rejected this whole file as "Invalid workflow file"
  #      (startup_failure, 0s, no jobs) on EVERY push, because the
  #      `workflow_run` event requires a `workflows:` list and it was missing.
  #      That invalidated the entire workflow — including the check_suite job.
  # What: Commented out the workflow_run trigger. The `check_suite: completed`
  #       trigger already updates PR status labels with fuller logic, so no
  #       behaviour is lost. The `workflow-run-status` job below is now dormant
  #       (its `if: github.event_name == 'workflow_run'` can never match) and is
  #       kept for history.
  # Re-enable: add `workflows: [<workflow names>]` under workflow_run.
  # NOTE: Keeping for history — do not delete.
  # ─────────────────────────────────────────────────────────────────────────
  # workflow_run:
  #   workflows: ["<list required>"]
  #   types:
  #     - completed
  #   branches:
  #     - main
concurrency:
  group: pr-check-status-${{ github.event.check_suite.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number || 'unknown' }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  check-suite-status:
    name: Update Status from Check Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'check_suite'
    steps:
      # 2026-07-10 rate-limit fix (Claude): this workflow fires on EVERY completed
      # check suite (dozens per push in a 166-workflow repo) and used to do 3
      # label-existence reads, 2 blind label removals, adds, and a brand-NEW
      # comment each time — ~15 duplicate "CI Checks Passing" comments landed on
      # a single PR and the installation's API quota was exhausted (confirmed
      # 403 "API rate limit exceeded for installation" killing other workflows,
      # e.g. AI PR review on #15623). Now: ONE read, label writes only on real
      # state transitions, and ONE sticky comment updated in place — a repeat
      # suite conclusion costs 2 reads and 0 writes. The ensure-labels step was
      # dropped: the labels already exist and issues.addLabels auto-creates
      # missing ones anyway.
      - name: Update PR status based on check suite
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const suite = context.payload.check_suite;
            const conclusion = suite.conclusion;
            const prs = suite.pull_requests || [];

            if (!prs || prs.length === 0) {
              core.info('No PRs associated with this check suite');
              return;
            }

            const MARKER = '<!-- pr-check-status:sticky -->';
            const { owner, repo } = context.repo;

            for (const pr of prs) {
              const prNumber = pr.number;
              // timed_out / startup_failure / action_required / stale must
              // clear a stale checks-passing or ready-to-merge state (cubic
              // P1 on #15623). 'cancelled' is deliberately a no-op: with
              // cancel-in-progress concurrency, cancellations are routine
              // supersessions and mapping them to failing would flap the
              // labels on every rapid push.
              const desired =
                conclusion === 'success' || conclusion === 'neutral' ? 'passing'
                : ['failure', 'timed_out', 'action_required', 'startup_failure', 'stale'].includes(conclusion) ? 'failing'
                : null;
              if (!desired) {
                core.info(`PR #${prNumber}: conclusion ${conclusion} — no action`);
                continue;
              }
              core.info(`Processing PR #${prNumber}, conclusion: ${conclusion} -> ${desired}`);

              // ONE read of current labels; every write below is conditional on
              // an actual state transition.
              const { data: prLabels } = await github.rest.issues.listLabelsOnIssue({
                owner, repo, issue_number: prNumber,
              });
              const names = prLabels.map((l) => l.name);
              const approved = names.includes('approved');

              if (desired === 'passing') {
                if (names.includes('checks-failing')) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'checks-failing' });
                  } catch (e) { /* already gone */ }
                }
                if (!names.includes('checks-passing')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['checks-passing'] });
                }
                if (approved && !names.includes('ready-to-merge')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['ready-to-merge'] });
                  core.info(`PR #${prNumber} is now ready to merge!`);
                }
              } else {
                if (names.includes('checks-passing')) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'checks-passing' });
                  } catch (e) { /* already gone */ }
                }
                if (!names.includes('checks-failing')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['checks-failing'] });
                }
                if (names.includes('ready-to-merge')) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'ready-to-merge' });
                  } catch (e) { /* already gone */ }
                }
              }

              // Sticky status comment: update the ONE marked comment in place;
              // create it only the first time; write nothing when unchanged.
              const body = desired === 'passing'
                ? `${MARKER}\n✅ **CI Checks Passing** — All checks have passed.${approved ? ' This PR is now ready to merge!' : ''}`
                : `${MARKER}\n❌ **CI Checks Failed** — One or more checks failed. Please review the [check results](${suite.html_url}) and push a fix.`;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));
              if (existing && existing.body === body) {
                core.info(`PR #${prNumber}: sticky status unchanged — no write`);
              } else if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }
    timeout-minutes: 30
  workflow-run-status:
    name: Update Status from Workflow Run
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    steps:
      - name: Update PR status based on workflow run
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion;
            const prs = run.pull_requests || [];

            if (!prs || prs.length === 0) {
              core.info('No PRs associated with this workflow run');
              return;
            }

            for (const pr of prs) {
              const prNumber = pr.number;
              core.info(`Processing PR #${prNumber} from workflow run, conclusion: ${conclusion}`);

              if (conclusion === 'success') {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['checks-passing'],
                });
              } else if (conclusion === 'failure') {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['checks-failing'],
                });
              }
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
