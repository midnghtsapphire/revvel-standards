name: PR Check Status Automation
on:
  check_suite:
    types:
      - completed
  # ─────────────────────────────────────────────────────────────────────────
  # DISABLED TRIGGER: workflow_run
  # Who: Claude (controller-auditor)  When: 2026-06-17
  # Why: GitHub rejected this whole file as "Invalid workflow file"
  #      (startup_failure, 0s, no jobs) on EVERY push, because the
  #      `workflow_run` event requires a `workflows:` list and it was missing.
  #      That invalidated the entire workflow — including the check_suite job.
  # What: Commented out the workflow_run trigger. The `check_suite: completed`
  #       trigger already updates PR status labels with fuller logic, so no
  #       behaviour is lost. The `workflow-run-status` job below is now dormant
  #       (its `if: github.event_name == 'workflow_run'` can never match) and is
  #       kept for history.
  # Re-enable: add `workflows: [<workflow names>]` under workflow_run.
  # NOTE: Keeping for history — do not delete.
  # ─────────────────────────────────────────────────────────────────────────
  # workflow_run:
  #   workflows: ["<list required>"]
  #   types:
  #     - completed
  #   branches:
  #     - main
concurrency:
  group: pr-check-status-${{ github.event.check_suite.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number || 'unknown' }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  # ---------------------------------------------------------------------------
  # METAL Scripts-as-CI (oaudrey governance/METAL principles #1/#3/#8): logic
  # lives in scripts/ci/*.js — versioned, runnable anywhere. These jobs are thin
  # invokers. runs-on: self-hosted (CARESSE) — immune to the GitHub-hosted
  # billing lock; shell: cmd because CARESSE's PowerShell execution policy
  # blocks runner temp scripts (PSSecurityException).
  # ---------------------------------------------------------------------------
  check-suite-status:
    name: Update Status from Check Suite
    runs-on: self-hosted
    if: github.event_name == 'check_suite'
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      # 2026-07-10 rate-limit fix (Claude): this workflow fires on EVERY completed
      # check suite (dozens per push in a 166-workflow repo) and used to do 3
      # label-existence reads, 2 blind label removals, adds, and a brand-NEW
      # comment each time — ~15 duplicate "CI Checks Passing" comments landed on
      # a single PR and the installation's API quota was exhausted (confirmed
      # 403 "API rate limit exceeded for installation" killing other workflows,
      # e.g. AI PR review on #15623). Now: ONE read, label writes only on real
      # state transitions, and ONE sticky comment updated in place — a repeat
      # suite conclusion costs 2 reads and 0 writes. The ensure-labels step was
      # dropped: the labels already exist and issues.addLabels auto-creates
      # missing ones anyway.
      - name: Update PR status based on check suite
        shell: cmd
        run: node scripts/ci/pr-check-status.js check-suite
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
  workflow-run-status:
    name: Update Status from Workflow Run
    runs-on: self-hosted
    if: github.event_name == 'workflow_run'
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: Update PR status based on workflow run
        shell: cmd
        run: node scripts/ci/pr-check-status.js workflow-run
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
