name: Needs Action Router — Auto-Assign to OpenRouter
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue/PR number to route
        required: true
        type: number
      dry_run:
        description: Dry run (log what would be changed without making changes)
        required: false
        type: boolean
        default: false
permissions:
  issues: write
  pull-requests: write
  contents: read
concurrency:
  group: needs-action-router-${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.issue_number }}
  cancel-in-progress: false
jobs:
  route-needs-action:
    name: Route needs-action item to OpenRouter
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue/PR number and check label
        id: resolve
        uses: actions/github-script@v9.0.0
        with:
          script: |
            // Get issue/PR number from event or workflow_dispatch input
            const issueNumber = context.payload.issue?.number || 
                                context.payload.pull_request?.number || 
                                parseInt(context.payload.inputs?.issue_number);
            const itemKind = context.payload.issue ? 'issue' : 
                            context.payload.pull_request ? 'pull_request' : 
                            'issue';  // Default to issue for workflow_dispatch
            const displayKind = itemKind === 'pull_request' ? 'pull request' : 'issue';
            const dryRun = context.payload.inputs?.dry_run === 'true' || context.payload.inputs?.dry_run === true;

            if (!issueNumber) {
              core.notice('No issue/PR number found; skipping.');
              core.setOutput('skip', 'true');
              return;
            }

            core.info(`Processing ${displayKind} #${issueNumber} (dry_run: ${dryRun})`);

            // Get the item details
            let item = { labels: [] }; try { const { data } = itemKind === 'issue' ? await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber }) : await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: issueNumber }); item = data; } catch (e) { console.log(`⚠️ error getting item: ${e.message}`); core.setOutput('skip', 'true'); return; }

            const labels = (item.labels || []).map(l => typeof l === 'string' ? l : l.name);

            // Check if needs-action label is present
            if (!labels.includes('needs-action')) {
              core.notice(`${displayKind} #${issueNumber} does not have 'needs-action' label; skipping.`);
              core.setOutput('skip', 'true');
              return;
            }

            // Check if already assigned
            const assignees = item.assignees || [];
            if (assignees.length > 0) {
              core.notice(`${displayKind} #${issueNumber} already has assignee(s): ${assignees.map(a => a.login).join(', ')}`);
              core.notice('Will still apply routing labels and remove needs-action label');
            }

            // Check if already has openrouter label
            const hasOpenRouter = labels.includes('openrouter');

            core.setOutput('skip', 'false');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('item_kind', itemKind);
            core.setOutput('display_kind', displayKind);
            core.setOutput('dry_run', String(dryRun));
            core.setOutput('has_openrouter', String(hasOpenRouter));
            core.setOutput('has_assignee', String(assignees.length > 0));
      - name: Assign to Copilot (OpenRouter orchestrator)
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.has_assignee != 'true' && steps.resolve.outputs.dry_run != 'true'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          ITEM_KIND: ${{ steps.resolve.outputs.item_kind }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER || '', 10);
            const itemKind = process.env.ITEM_KIND || '';

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: ['Copilot'],
              });
              core.info(`✅ Assigned ${itemKind} #${issueNumber} to @Copilot`);
            } catch (error) {
              core.warning(`Could not assign to @Copilot: ${error.message}`);
              core.warning('This is non-fatal; routing labels will still be applied');
            }
      - name: Apply routing labels
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.dry_run != 'true'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          HAS_OPENROUTER: ${{ steps.resolve.outputs.has_openrouter }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER || '', 10);
            const hasOpenRouter = process.env.HAS_OPENROUTER === 'true';

            const routingLabels = [
              'openrouter',
              'auto-fix',
              'copilot',
              'role:orchestrator'
            ];

            // Only add labels that aren't already present
            const labelsToAdd = hasOpenRouter 
              ? routingLabels.filter(l => l !== 'openrouter')
              : routingLabels;

            if (labelsToAdd.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: labelsToAdd,
                });
                core.info(`✅ Applied routing labels: ${labelsToAdd.join(', ')}`);
              } catch (error) {
                core.error(`Failed to apply labels: ${error.message}`);
                throw error;
              }
            } else {
              core.info('All routing labels already present');
            }
      - name: Remove needs-action label
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.dry_run != 'true'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER || '', 10);

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'needs-action',
              });
              core.info('✅ Removed needs-action label (routing complete)');
            } catch (error) {
              // Label might have been removed already by another process
              core.notice(`Could not remove needs-action label: ${error.message}`);
            }
      - name: Post routing comment
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.dry_run != 'true'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          DISPLAY_KIND: ${{ steps.resolve.outputs.display_kind }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER || '', 10);
            const displayKind = process.env.DISPLAY_KIND || '';

            // Check if we've already posted a routing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const hasRoutingComment = comments.data.some(c => 
              c.user.type === 'Bot' && 
              c.body.includes('🤖 Needs Action → Routed to OpenRouter')
            );

            if (hasRoutingComment) {
              core.info('Routing comment already exists; skipping duplicate');
              return;
            }

            const comment = [
              '## 🤖 Needs Action → Routed to OpenRouter',
              '',
              `This ${displayKind} was flagged as **needs-action** and has been automatically routed to the OpenRouter orchestrator for immediate processing.`,
              '',
              '### What happens next:',
              '',
              '1. **OpenRouter triage** — Analyzes scope and requirements',
              '2. **Agent assignment** — Routes to appropriate specialist agent(s)',
              '3. **Execution** — Automated implementation or research',
              '4. **Verification** — Testing and validation',
              '5. **Completion** — Updates status and removes blocking labels',
              '',
              '### Routing labels applied:',
              '',
              '- `openrouter` — First line of sight for the orchestrator',
              '- `auto-fix` — Eligible for automated fixes',
              '- `copilot` — Tracked by the Ralph Loop',
              '- `role:orchestrator` — Primary role assignment',
              '',
              '### How this works:',
              '',
              '**OpenRouter** is not a GitHub user — it\'s a service that routes work through the `OPENROUTER_API_KEY` secret. The GitHub assignee `@Copilot` represents the orchestrator in the UI as your "first line of sight." All automation in this repository routes through OpenRouter, not the paid GitHub Copilot service.',
              '',
              '### References:',
              '',
              '- **Process:** [`docs/OPENROUTER_ASSIGNEE_PROCESS.md`](../blob/main/docs/OPENROUTER_ASSIGNEE_PROCESS.md)',
              '- **Skills:** [`skills/openrouter-swarms/SKILL.md`](../blob/main/skills/openrouter-swarms/SKILL.md)',
              '- **Workflow:** [`.github/workflows/needs-action-router.yml`](../blob/main/.github/workflows/needs-action-router.yml)',
              '',
              '---',
              '',
              '*Automated by the Needs Action Router workflow. Remove the `openrouter` label to opt out of automated processing.*'
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
              core.info('✅ Posted routing comment');
            } catch (error) {
              core.warning(`Could not post comment: ${error.message}`);
            }
      - name: Log dry run results
        if: steps.resolve.outputs.dry_run == 'true' && steps.resolve.outputs.skip != 'true'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          DISPLAY_KIND: ${{ steps.resolve.outputs.display_kind }}
        with:
          script: |
            const issueNumber = process.env.ISSUE_NUMBER || '';
            const displayKind = process.env.DISPLAY_KIND || '';

            core.notice('═══════════════════════════════════════════════════════');
            core.notice('DRY RUN — No changes were made');
            core.notice('═══════════════════════════════════════════════════════');
            core.notice(`Would route ${displayKind} #${issueNumber} to OpenRouter:`);
            core.notice('  - Assign to @Copilot');
            core.notice('  - Add labels: openrouter, auto-fix, copilot, role:orchestrator');
            core.notice('  - Remove label: needs-action');
            core.notice('  - Post routing comment');
            core.notice('═══════════════════════════════════════════════════════');
      - name: Summary
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          DISPLAY_KIND: ${{ steps.resolve.outputs.display_kind }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        with:
          script: |
            const issueNumber = process.env.ISSUE_NUMBER || '';
            const displayKind = process.env.DISPLAY_KIND || '';
            const dryRun = process.env.DRY_RUN === 'true';

            const summary = [
              '# Needs Action Router Results',
              '',
              dryRun ? '**Mode:** Dry Run (no changes made)' : '**Mode:** Live',
              '',
              `**${displayKind.charAt(0).toUpperCase() + displayKind.slice(1)}:** #${issueNumber}`,
              '',
              '## Actions Taken:',
              '',
              dryRun ? '- ℹ️ Would assign to @Copilot' : '- ✅ Assigned to @Copilot',
              dryRun ? '- ℹ️ Would apply routing labels' : '- ✅ Applied routing labels (openrouter, auto-fix, copilot, role:orchestrator)',
              dryRun ? '- ℹ️ Would remove needs-action label' : '- ✅ Removed needs-action label',
              dryRun ? '- ℹ️ Would post routing comment' : '- ✅ Posted routing comment',
              '',
              '## Next Steps:',
              '',
              '- OpenRouter triage will analyze the item',
              '- Appropriate specialist agent(s) will be assigned',
              '- Automated processing will begin',
              '',
              '---',
              '',
              '*For more information, see [docs/OPENROUTER_ASSIGNEE_PROCESS.md](../blob/main/docs/OPENROUTER_ASSIGNEE_PROCESS.md)*'
            ].join('\n');

            await core.summary.addRaw(summary).write();
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
