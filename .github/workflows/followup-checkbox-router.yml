name: Follow-up Checkbox Router

on:
  pull_request:
    types: [edited]
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  route-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run if the body actually changed (skip title-only edits, etc.).
    if: ${{ github.event.changes.body != null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Route newly-checked follow-ups to WR issues
        uses: actions/github-script@v9
        env:
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { findNewlyCheckedFollowUps } = require(
              process.env.GITHUB_WORKSPACE + '/scripts/checkbox-diff.js'
            );

            const isPR = !!context.payload.pull_request;
            const source = isPR ? context.payload.pull_request : context.payload.issue;
            if (!source) {
              core.info('No pull_request/issue payload; nothing to do.');
              return;
            }

            const oldBody = context.payload.changes && context.payload.changes.body
              ? context.payload.changes.body.from
              : null;
            const newBody = source.body || '';

            const newlyChecked = findNewlyCheckedFollowUps(oldBody, newBody);
            if (!newlyChecked.length) {
              core.info('No newly-checked follow-up items detected.');
              return;
            }
            core.info(`Detected ${newlyChecked.length} newly-checked follow-up(s).`);

            const sourceNumber = source.number;
            const sourceUrl = source.html_url;
            const sourceKind = isPR ? 'PR' : 'issue';

            // Detect chained ancestry: does the source body contain "sourced from #N"?
            const chainMatch = /sourced from #(\d+)/i.exec(newBody);
            const chainedFrom = chainMatch ? chainMatch[1] : null;

            // Load WR templates from the repo.
            const wrDir = path.join(process.env.GITHUB_WORKSPACE, 'wr');
            let tmplBasic = '';
            let tmplFull = '';
            try {
              tmplBasic = fs.readFileSync(path.join(wrDir, 'WR_TEMPLATE_BASIC.md'), 'utf8');
            } catch (e) {
              core.warning('WR_TEMPLATE_BASIC.md not found; using fallback.');
              tmplBasic = '# [WR] {TITLE}\n\n## Issue Context\n{ISSUE_CONTEXT}\n\n## Learnings — What & Why\n{LEARNINGS}\n';
            }
            try {
              tmplFull = fs.readFileSync(path.join(wrDir, 'WR_TEMPLATE_FULL.md'), 'utf8');
            } catch (e) {
              core.warning('WR_TEMPLATE_FULL.md not found; using fallback.');
              tmplFull = '# [WR] {TITLE}\n\n## Issue Context\n{ISSUE_CONTEXT}\n\n## Learnings — What & Why\n{LEARNINGS}\n';
            }

            // Classify BASIC vs FULL: length > 180 chars or multi-clause phrasing => FULL.
            function classify(desc) {
              if (!desc) return 'BASIC';
              if (desc.length > 180) return 'FULL';
              if (/[;:]\s/.test(desc)) return 'FULL';
              if (/\b(then|also)\b/i.test(desc)) return 'FULL';
              return 'BASIC';
            }

            function renderTemplate(tmpl, tokens) {
              let out = tmpl;
              for (const [k, v] of Object.entries(tokens)) {
                out = out.split('{' + k + '}').join(v);
              }
              return out;
            }

            function truncateTitle(s, max = 72) {
              const oneLine = String(s).replace(/\s+/g, ' ').trim();
              if (oneLine.length <= max) return oneLine;
              return oneLine.slice(0, max - 1).trimEnd() + '…';
            }

            const created = [];
            for (const item of newlyChecked) {
              const kind = classify(item.description);
              const tmpl = kind === 'FULL' ? tmplFull : tmplBasic;
              const title = `[WR] Follow-up from #${sourceNumber}: ${truncateTitle(item.description)}`;

              const issueContext = [
                `This work request was auto-generated from a checked follow-up checklist item on ${sourceKind} #${sourceNumber}.`,
                '',
                `**Source:** ${sourceUrl}`,
                '',
                `**Follow-up description:**`,
                '',
                `> ${item.description}`,
              ].join('\n');

              const learningsLines = [
                `Auto-generated from a follow-up commitment on ${sourceKind} #${sourceNumber} (${sourceUrl}).`,
                '',
                `Original follow-up text: "${item.description}"`,
              ];
              if (chainedFrom) {
                learningsLines.push('');
                learningsLines.push(`Note: this is a chained follow-up — the source ${sourceKind} itself was sourced from #${chainedFrom}.`);
              }
              const learnings = learningsLines.join('\n');

              const body = renderTemplate(tmpl, {
                TITLE: title.replace(/^\[WR\]\s*/, ''),
                ISSUE_CONTEXT: issueContext,
                LEARNINGS: learnings,
              });

              try {
                const { data: created_issue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['work-request', 'auto-generated-followup'],
                  assignees: ['oaudrey'],
                });
                created.push(created_issue);
                core.info(`Created WR issue #${created_issue.number} for follow-up: ${item.description}`);
              } catch (err) {
                core.warning(`Failed to create WR issue for "${item.description}": ${err.message}`);
              }
            }

            if (created.length) {
              const lines = [
                `🤖 The following follow-up item${created.length === 1 ? ' was' : 's were'} routed to tracked WR issue${created.length === 1 ? '' : 's'}:`,
                '',
                ...created.map((c) => `- #${c.number} — ${c.title}`),
              ];
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: sourceNumber,
                  body: lines.join('\n'),
                });
              } catch (err) {
                core.warning(`Failed to post back-link comment on #${sourceNumber}: ${err.message}`);
              }
            }
