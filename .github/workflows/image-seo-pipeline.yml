name: Image SEO Pipeline
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node scripts/image-seo-build-pack.mjs
