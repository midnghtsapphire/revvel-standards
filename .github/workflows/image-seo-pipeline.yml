# MIDNGHTSAPPHIRE — headless image SEO pack automation
name: image-seo-pipeline

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      topic:
        description: Topic / subject
        required: true
        default: multi-surface automation kits
      primary_keyword:
        description: Primary keyword
        required: true
        default: automation asset generator
      kind:
        description: Image kind
        required: true
        default: og

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: ""

      - name: Write brief
        env:
          TOPIC: ${{ github.event.inputs.topic || 'multi-surface automation kits' }}
          KEYWORD: ${{ github.event.inputs.primary_keyword || 'automation asset generator' }}
          KIND: ${{ github.event.inputs.kind || 'og' }}
        run: |
          mkdir -p artifacts/image-automation
          node -e "
            const fs=require('fs');
            fs.writeFileSync('artifacts/image-automation/brief.json', JSON.stringify({
              topic: process.env.TOPIC,
              primaryKeyword: process.env.KEYWORD,
              kind: process.env.KIND,
              brand: 'MIDNGHTSAPPHIRE',
              pinnedLsi: []
            }, null, 2));
          "

      - name: Build image_creation/v1 pack (headless)
        run: node scripts/image-seo-build-pack.mjs --brief artifacts/image-automation/brief.json --out artifacts/image-automation/package.json

      - name: Upload pack artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: image-creation-pack
          path: artifacts/image-automation/
          retention-days: 1

      - name: Open draft PR with pack
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(image-seo): automated image_creation/v1 pack"
          title: "[automation] Image SEO pack — human review"
          body: |
            Automated image creation SEO package (`midnghtsapphire.image_creation/v1`).
            Headless builder only — no manual studio path.
            **Do not merge without review.**
          branch: automation/image-seo-pack-${{ github.run_id }}
          draft: true
