name: BITO AI — Code Review
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review (workflow_dispatch only)
        required: false
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: bito-ai-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    name: BITO AI code review
    if: |-
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, '[skip-bito]')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (startsWith(github.event.comment.body, '/review') ||
         startsWith(github.event.comment.body, '/explain'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Verify BITO secrets are configured
        env:
          BITO_ACCESS_KEY: ${{ secrets.BITO_ACCESS_KEY }}
          GIT_ACCESS_TOKEN: ${{ secrets.GIT_ACCESS_TOKEN }}
        run: |
          MISSING=()
          [ -z "${BITO_ACCESS_KEY}" ] && MISSING+=("BITO_ACCESS_KEY")
          [ -z "${GIT_ACCESS_TOKEN}" ] && MISSING+=("GIT_ACCESS_TOKEN")
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::warning::BITO AI review skipped — missing secrets: ${MISSING[*]}"
            echo "BITO_KEY_MISSING=true" >> "$GITHUB_ENV"
            echo "BITO_MISSING_SECRETS=${MISSING[*]}" >> "$GITHUB_ENV"
          else
            echo "BITO secrets verified."
            echo "BITO_KEY_MISSING=false" >> "$GITHUB_ENV"
          fi
      - name: Resolve PR context
        id: pr
        if: env.BITO_KEY_MISSING == 'false'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let prNumber, prUrl;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prUrl = context.payload.pull_request.html_url;
            } else if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
              prUrl = context.payload.issue.pull_request.html_url;
            } else {
              // workflow_dispatch — read from event payload, NOT core.getInput().
              // core.getInput() reads INPUT_* env vars set by the step's `with:`
              // block; for workflow-level dispatch inputs the canonical access
              // is `context.payload.inputs.<name>` (matches the rest of the repo,
              // e.g. wr-pr-creation.yml:62, weekly-research.yml:56).
              prNumber = parseInt(context.payload.inputs?.pr_number || '0', 10);
              if (!prNumber) {
                core.setFailed('workflow_dispatch requires pr_number input.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              prUrl = pr.html_url;
            }
            core.setOutput('number', prNumber);
            core.setOutput('url', prUrl);
      - name: Apply bito-ai label
        if: env.BITO_KEY_MISSING == 'false' && steps.pr.outputs.number != ''
        uses: actions/github-script@v9.0.0
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.pr.outputs.number }}', 10),
              labels: ['bito-ai'],
            });
      - name: Set Options Environment Variable
        if: env.BITO_KEY_MISSING == 'false'
        run: |
          GIT_DOMAIN_OPTION=""
          if [[ -n "${{ vars.GIT_DOMAIN }}" ]]; then
            GIT_DOMAIN_OPTION=" --git.domain=${{ vars.GIT_DOMAIN }}"
          fi
          STATIC_ANALYSIS_TOOL_OPTION=""
          if [[ -n "${{ vars.STATIC_ANALYSIS_TOOL }}" ]]; then
            STATIC_ANALYSIS_TOOL_OPTION=" --static_analysis_tool=${{ vars.STATIC_ANALYSIS_TOOL }}"
          fi
          REVIEW_SCOPE_OPTION=""
          if [[ -n "${{ vars.REVIEW_SCOPE }}" ]]; then
            REVIEW_SCOPE_OPTION=" --review_scope=${{ vars.REVIEW_SCOPE }}"
          fi
          EXCLUDE_BRANCHES_OPTION=""
          if [[ -n "${{ vars.EXCLUDE_BRANCHES }}" ]]; then
            EXCLUDE_BRANCHES_OPTION=" --exclude_branches=${{ vars.EXCLUDE_BRANCHES }}"
          fi
          EXCLUDE_FILES_OPTION=""
          if [[ -n "${{ vars.EXCLUDE_FILES }}" ]]; then
            EXCLUDE_FILES_OPTION=" --exclude_files=${{ vars.EXCLUDE_FILES }}"
          fi
          EXCLUDE_DRAFT_PR_OPTION=""
          if [[ -n "${{ vars.EXCLUDE_DRAFT_PR }}" ]]; then
            EXCLUDE_DRAFT_PR_OPTION=" --exclude_draft_pr=${{ vars.EXCLUDE_DRAFT_PR }}"
          fi
          # The bee.path / bee.actn_dir args are container-internal; do not change.
          echo "OPTIONS=--static_analysis.fb_infer.enabled=True --code_feedback=True --dependency_check.enabled=False --bee.path=/automation-platform --bee.actn_dir=/automation-platform/default_bito_ad/bito_modules --git.access_token=${{ secrets.GIT_ACCESS_TOKEN }} --bito_cli.bito.access_key=${{ secrets.BITO_ACCESS_KEY }}${GIT_DOMAIN_OPTION}${STATIC_ANALYSIS_TOOL_OPTION}${REVIEW_SCOPE_OPTION}${EXCLUDE_BRANCHES_OPTION}${EXCLUDE_FILES_OPTION}${EXCLUDE_DRAFT_PR_OPTION}" >> "$GITHUB_ENV"
      - name: BITO Code Review — PR
        id: bito_review_pr
        if: env.BITO_KEY_MISSING == 'false' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: gitbito/codereviewagent@main
        continue-on-error: true
        with:
          pr: ${{ steps.pr.outputs.url }}
          command: review
          options: ${{ env.OPTIONS }}
      - name: BITO Code Review — Issue Comment
        id: bito_review_comment
        if: env.BITO_KEY_MISSING == 'false' && github.event_name == 'issue_comment'
        uses: gitbito/codereviewagent@main
        continue-on-error: true
        with:
          pr: ${{ steps.pr.outputs.url }}
          command: ${{ github.event.comment.body }}
          options: ${{ env.OPTIONS }}
      - name: Update review labels
        if: env.BITO_KEY_MISSING == 'false' && steps.pr.outputs.number != ''
        uses: actions/github-script@v9.0.0
        continue-on-error: true
        env:
          BITO_OUTCOME_PR: ${{ steps.bito_review_pr.outcome }}
          BITO_OUTCOME_COMMENT: ${{ steps.bito_review_comment.outcome }}
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}', 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Use whichever step actually ran. GitHub Actions reports
            // `${{ steps.<id>.outcome }}` as one of: success | failure |
            // cancelled | skipped (or empty string when the step never
            // existed). Pick the first concrete success/failure value so
            // the OR-chain doesn't short-circuit on a literal 'skipped'.
            const candidates = [
              process.env.BITO_OUTCOME_PR,
              process.env.BITO_OUTCOME_COMMENT,
            ];
            const outcome =
              candidates.find(o => o === 'success' || o === 'failure') ||
              'skipped';

            const labelsToAdd = ['bito-ai:review'];
            if (outcome === 'success') {
              labelsToAdd.push('awaiting-approval');
            }

            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber,
                labels: labelsToAdd,
              });
              core.info(`Applied labels: ${labelsToAdd.join(', ')}`);
            } catch (e) {
              core.notice(`Could not apply review labels: ${e.message}`);
            }

            // If BITO succeeded, clear any stale changes-needed label.
            if (outcome === 'success') {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber,
                  name: 'bito-ai:changes-needed',
                });
              } catch (_) { /* not present */ }
            }
      - name: Notify — BITO secrets not configured
        if: env.BITO_KEY_MISSING == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        continue-on-error: true
        env:
          MISSING: ${{ env.BITO_MISSING_SECRETS }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const alreadyPosted = comments.data.some(c =>
              c.body && c.body.includes('BITO AI review skipped') && c.user.type === 'Bot'
            );
            if (alreadyPosted) return;
            const missing = (process.env.MISSING || '').trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                '⚠️ **BITO AI review skipped** — missing secrets: `' + missing + '`',
                '',
                'BITO requires **two** secrets to run:',
                '1. `BITO_ACCESS_KEY` — get from [bito.ai](https://bito.ai) → Settings → Access Keys.',
                '2. `GIT_ACCESS_TOKEN` — a GitHub **classic** PAT with `repo` scope. ',
                '   (BITO does not currently support fine-grained tokens.)',
                '',
                'Add both at: Settings → Secrets and variables → Actions → New repository secret.',
                '',
                '> _See [`standards/BITO_AI_INTEGRATION_STANDARD.md`](../../standards/BITO_AI_INTEGRATION_STANDARD.md) for full setup. This skip is non-blocking — the rest of the PR pipeline continues normally._',
              ].join('\n'),
            });
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
