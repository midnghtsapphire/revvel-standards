# =============================================================================
# BITO AI CODE REVIEW WORKFLOW
# =============================================================================
#
# PURPOSE:
#   BITO AI is an agentic code review platform with PERSISTENT REPOSITORY MEMORY.
#   Unlike stateless diff analyzers, BITO indexes the entire codebase ONCE and
#   maintains up-to-date knowledge across every review. This gives it context
#   that other AI reviewers lack.
#
# WHY @main?
#   The bito-ai.yml uses `gitbito/codereviewagent@main` because:
#   1. BITO is a fast-moving product - they push updates frequently
#   2. The @main tag always points to the latest stable release
#   3. This means you get new features/fixes automatically
#
#   RISK: @main can change unexpectedly and break workflows
#   RECOMMENDATION: Pin to a specific version once BITO stabilizes
#   Example when ready: uses: gitbito/codereviewagent@v1.2.3
#
# SECRET SOURCES (ORDER OF PRECEDENCE):
#   1. DOPPLER (if configured) - via dopplerhq/secrets-fetch-action
#      - Project: revvel-standards, Config: prd
#      - Secrets: BITO_ACCESS_KEY, GIT_ACCESS_TOKEN
#   2. GITHUB_SECRETS (fallback) - if Doppler is not set up
#      - Set in: Settings → Secrets → Actions
#      - Same secrets: BITO_ACCESS_KEY, GIT_ACCESS_TOKEN
#
#   WHY THE FALLBACK?
#   Doppler has been dropping BITO secrets unexpectedly.
#   The workflow gracefully skips if secrets are missing.
#   You can re-enable Doppler by adding dopplerhq/secrets-fetch-action step.
#
# REQUIRED SECRETS:
#   1. BITO_ACCESS_KEY - from bito.ai → Settings → Access Keys
#   2. GIT_ACCESS_TOKEN - GitHub PAT with repo scope
#
# IF MISSING:
#   - Workflow skips gracefully
#   - Posts comment on PR explaining what's needed
#   - Does NOT fail the PR
#
# =============================================================================

name: BITO AI — Code Review

# ── CUT 2026-07-08 (D006) ─────────────────────────────────────────────────────
# Bito has been removed from the active review fleet. Zero unique catches in the
# 50-PR sample (BITO_ACCESS_KEY was absent → silent no-op). The OpenRouter lane
# (ai-pr-review-openrouter.yml) covers the same signal at ~API cost only.
# Auto-triggers commented out; kept for on-demand / audit runs.
# See: DECISIONS.md D006, docs/TOOL_COST_INDEX.md, wr/issues/issue-15517-*.md
# ──────────────────────────────────────────────────────────────────────────────

on:
  # pull_request:
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  #     - ready_for_review
  # issue_comment:
  #   types:
  #     - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bito-ai-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # JOB: bito-review
  # ===========================================================================
  bito-review:
    name: BITO AI Code Review
    # Skip on drafts, skip if [skip-bito] in title
    if: |-
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, '[skip-bito]')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (startsWith(github.event.comment.body, '/review') ||
         startsWith(github.event.comment.body, '/explain'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # -------------------------------------------------------------------------
      # OPTIONAL: Enable Doppler (currently disabled - secrets dropped)
      # Uncomment this section and comment out "Verify BITO secrets" to re-enable
      # -------------------------------------------------------------------------
      # - name: Fetch secrets from Doppler
      #   if: false  # Set to true to enable Doppler
      #   uses: dopplerhq/secrets-fetch-action@v2.0.0
      #   with:
      #     doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #   env:
      #     DOPPLER_PROJECT: revvel-standards
      #     DOPPLER_CONFIG: prd

      # -------------------------------------------------------------------------
      # STEP: Verify secrets
      # BITO_ACCESS_KEY and GIT_ACCESS_TOKEN are required
      # Falls back to GitHub Secrets if Doppler is not configured
      # -------------------------------------------------------------------------
      - name: Verify BITO secrets are configured
        id: verify-secrets
        env:
          BITO_ACCESS_KEY: ${{ secrets.BITO_ACCESS_KEY }}
          GIT_ACCESS_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || github.token }}
        run: |
          echo "=========================================="
          echo "BITO AI Secret Verification"
          echo "=========================================="
          echo ""
          
          MISSING=()
          if [ -z "${BITO_ACCESS_KEY}" ]; then
            echo "❌ BITO_ACCESS_KEY: MISSING"
            MISSING+=("BITO_ACCESS_KEY")
          else
            echo "✅ BITO_ACCESS_KEY: configured (${#BITO_ACCESS_KEY} chars)"
          fi
          
          if [ -z "${GIT_ACCESS_TOKEN}" ]; then
            echo "❌ GIT_ACCESS_TOKEN: MISSING"
            MISSING+=("GIT_ACCESS_TOKEN")
          else
            echo "✅ GIT_ACCESS_TOKEN: configured (${#GIT_ACCESS_TOKEN} chars)"
          fi
          
          echo ""
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "⚠️  BITO review will be SKIPPED"
            echo "MISSING_SECRETS=${MISSING[*]}" >> $GITHUB_ENV
            echo "BITO_SKIP=true" >> $GITHUB_ENV
          else
            echo "✅ All BITO secrets verified!"
            echo "BITO_SKIP=false" >> $GITHUB_ENV
          fi
          echo "=========================================="

      # -------------------------------------------------------------------------
      # STEP: Resolve PR context
      - name: BITO Code Review (issue comment)
        if: env.BITO_SKIP == 'false' && github.event_name == 'issue_comment'
        uses: gitbito/codereviewagent@main
        continue-on-error: true
        with:
          pr: ${{ steps.pr-context.outputs.url }}
          command: ${{ github.event.comment.body }}
          options: ${{ env.OPTIONS }}
      - name: Resolve PR context
        id: pr-context
        if: env.BITO_SKIP == 'false'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let prNumber, prUrl, prTitle;
            
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prUrl = context.payload.pull_request.html_url;
              prTitle = context.payload.pull_request.title;
            } else if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
              prUrl = context.payload.issue.pull_request.html_url;
              prTitle = context.payload.issue.title;
            } else {
              // workflow_dispatch
              prNumber = parseInt(context.payload.inputs?.pr_number || '0', 10);
              if (!prNumber) {
                core.setFailed('workflow_dispatch requires pr_number input.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              prUrl = pr.html_url;
              prTitle = pr.title;
            }
            
            core.setOutput('number', prNumber);
            core.setOutput('url', prUrl);
            core.setOutput('title', prTitle);
            core.setOutput('body', context.payload.pull_request?.body || context.payload.issue?.body || '');

      # -------------------------------------------------------------------------
      # STEP: Build BITO options
      # -------------------------------------------------------------------------
      - name: Build BITO options
        if: env.BITO_SKIP == 'false'
        run: |
          # Build options string for BITO
          OPTIONS="--static_analysis.fb_infer.enabled=True"
          OPTIONS+=" --code_feedback=True"
          OPTIONS+=" --dependency_check.enabled=False"
          OPTIONS+=" --bee.path=/automation-platform"
          OPTIONS+=" --bee.actn_dir=/automation-platform/default_bito_ad/bito_modules"
          OPTIONS+=" --git.access_token=${{ secrets.ADMIN_GITHUB_TOKEN || github.token }}"
          OPTIONS+=" --bito_cli.bito.access_key=${{ secrets.BITO_ACCESS_KEY }}"
          
          # Optional configurations from repo variables
          if [[ -n "${{ vars.GIT_DOMAIN }}" ]]; then
            OPTIONS+=" --git.domain=${{ vars.GIT_DOMAIN }}"
          fi
          if [[ -n "${{ vars.EXCLUDE_FILES }}" ]]; then
            OPTIONS+=" --exclude_files=${{ vars.EXCLUDE_FILES }}"
          fi
          
          echo "OPTIONS=$OPTIONS" >> $GITHUB_ENV
          echo "✅ BITO options built"

      # -------------------------------------------------------------------------
      # STEP: Run BITO Code Review
      # ⚠️  NOTE: Using @main - see documentation at top of file
      # -------------------------------------------------------------------------
      - name: Run BITO Code Review
        id: bito-review
        if: env.BITO_SKIP == 'false'
        uses: gitbito/codereviewagent@main
        continue-on-error: true
        with:
          pr: ${{ steps.pr-context.outputs.url }}
          command: review
          options: ${{ env.OPTIONS }}

      # -------------------------------------------------------------------------
      # STEP: Update labels based on outcome
      # -------------------------------------------------------------------------
      - name: Update labels
        if: env.BITO_SKIP == 'false' && steps.pr-context.outputs.number != ''
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-context.outputs.number }}', 10);
            const outcome = '${{ steps.bito-review.outcome }}';
            
            const labels = ['bito-ai', 'bito-ai:review'];
            if (outcome === 'success') {
              labels.push('awaiting-approval');
            } else {
              labels.push('bito-ai:changes-needed');
            }
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: labels,
            });

      # -------------------------------------------------------------------------
      # STEP: Notify if skipped
      # -------------------------------------------------------------------------
      - name: Notify if secrets missing
        if: env.BITO_SKIP == 'true'
        run: |
          echo "=========================================="
          echo "⚠️  BITO AI REVIEW SKIPPED"
          echo "=========================================="
          echo ""
          echo "Missing secrets: ${{ env.MISSING_SECRETS }}"
          echo ""
          echo "To enable BITO AI:"
          echo "1. Go to: Settings → Secrets and variables → Actions"
          echo "2. Add BITO_ACCESS_KEY (from bito.ai → Settings)"
          echo "3. Add GIT_ACCESS_TOKEN (GitHub PAT with repo scope)"
          echo ""
          echo "📖 See: standards/BITO_AI_INTEGRATION_STANDARD.md"
      - name: Notify if secrets missing
        if: env.BITO_SKIP == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        continue-on-error: true
        env:
          MISSING: ${{ env.MISSING_SECRETS }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 100,
            });
            if (comments.data.some(c => c.body && c.body.includes('BITO AI review skipped') && c.user.type === 'Bot')) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber,
              body: `⚠️ **BITO AI review skipped** — missing secrets: \`${process.env.MISSING}\`\n\nSee \`standards/BITO_AI_INTEGRATION_STANDARD.md\`.`,
            });

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"