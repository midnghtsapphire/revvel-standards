name: scheduled-market-evaluator

on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Run market evaluator
        run: |
          python products/ai-architecture-framework/market_evaluator.py market-evaluator-report.json
      - name: Run tests
        run: |
          python products/ai-architecture-framework/tests/test_harness.py
      - name: Upload report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: market-evaluator-report
          path: market-evaluator-report.json
