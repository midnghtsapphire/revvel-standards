name: automate-gumroad-artifacts

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Run tests
        run: |
          python -m unittest products/ai-architecture-framework/tests/test_harness.py -v

      - name: Run market evaluator (mock)
        run: |
          python products/ai-architecture-framework/market_evaluator.py

      - name: Upload audit logs
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: always()
        with:
          name: market-evaluator-audit
          path: .sandbox/market-evaluator/
          if-no-files-found: ignore
