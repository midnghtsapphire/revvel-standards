name: automate-gumroad-artifacts

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-market-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: |
          python -m unittest products/ai-architecture-framework/tests/test_harness.py -v

      - name: Execute market evaluator (mock Stripe/Gumroad)
        run: |
          python products/ai-architecture-framework/market_evaluator.py

      - name: Upload run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-evaluator-run
          path: .sandbox/ai-arch/market_run.jsonl
          if-no-files-found: warn
