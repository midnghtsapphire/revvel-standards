name: automate-gumroad-artifacts

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run market evaluator
        working-directory: products/ai-architecture-framework
        env:
          MARKET_OUT_DIR: ${{ github.workspace }}/.sandbox/market
        run: |
          python market_evaluator.py

      - name: Run tests
        working-directory: products/ai-architecture-framework
        run: |
          python tests/test_harness.py

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-evaluation
          path: .sandbox/market/latest.json
          if-no-files-found: warn
