name: automate-gumroad-artifacts

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Run market evaluator (mocked)
        run: python products/ai-architecture-framework/market_evaluator.py

      - name: Run unit tests
        run: python -m unittest products/ai-architecture-framework/tests/test_harness.py
