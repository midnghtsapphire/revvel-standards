name: Credential Gatekeeper

# Scans issue bodies for credential/secret requirements and generates a
# Bill of Materials (BOM) checklist. Adds a label indicating whether all
# required credentials are provisioned or if some are missing.
#
# Trigger: When an issue is labeled 'ready-to-implement' or on demand.
#
# Integrates with:
#   - docs/SECRETS_MANAGEMENT.md (known secrets matrix)
#   - Doppler (if DOPPLER_TOKEN is set, checks Doppler for provisioned secrets)
#   - GitGuardian (existing leak detection — complementary)

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to scan"
        type: number
        required: true

permissions:
  issues: write
  contents: read

jobs:
  scan:
    name: Generate credential BOM
    runs-on: ubuntu-latest
    # Run on every newly opened/reopened issue, on the ready-to-implement
    # label transition, and on manual dispatch. Other label changes are
    # ignored to avoid duplicate comments.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'issues' && github.event.action == 'reopened') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-implement')
    outputs:
      required_secrets: ${{ steps.scan.outputs.required_secrets }}
      issue_number: ${{ steps.scan.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan issue for credential requirements
        id: scan
        uses: actions/github-script@v8
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!issueNumber) {
              core.warning('No issue number provided. Skipping.');
              return;
            }
            core.setOutput('issue_number', String(issueNumber));

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const body = (issue.title + '\n' + (issue.body || '')).toLowerCase();

            // ── Credential detection patterns ──────────────────────────
            // Each pattern maps keywords found in issue text to the
            // secret(s) that would be needed to implement the feature.
            const CREDENTIAL_PATTERNS = [
              {
                keywords: ['openrouter', 'llm', 'ai review', 'ai triage', 'ai pr', 'claude', 'gpt', 'ai-powered'],
                secret: 'OPENROUTER_API_KEY',
                description: 'OpenRouter LLM API key for AI-powered features',
                doppler_name: 'OPENROUTER_API_KEY',
              },
              {
                keywords: ['jules', 'google jules', 'deep research', 'deep-research'],
                secret: 'JULES_API_KEY',
                description: 'Google Jules agent API key',
                doppler_name: 'JULES_API_KEY',
              },
              {
                keywords: ['openai', 'panda-ops', 'pandaops', 'gpt-4', 'chatgpt'],
                secret: 'OPENAI_API_KEY',
                description: 'OpenAI API key (used by PandaOps)',
                doppler_name: 'OPENAI_API_KEY',
              },
              {
                keywords: ['recurseml', 'recurse-ml', 'code review bot'],
                secret: 'RECURSE_ML_API_KEY',
                description: 'RecurseML code review API key',
                doppler_name: 'RECURSE_ML_API_KEY',
              },
              {
                keywords: ['admin token', 'elevated permissions', 'fork audit', 'saml', 'sso', 'project board'],
                secret: 'ADMIN_GITHUB_TOKEN',
                description: 'Fine-grained PAT with elevated repo/org permissions',
                doppler_name: 'ADMIN_GITHUB_TOKEN',
              },
              {
                keywords: ['draft pr', 'ready for review', 'promote draft'],
                secret: 'READY_FOR_REVIEW_TOKEN',
                description: 'Fine-grained PAT for promoting draft PRs',
                doppler_name: 'READY_FOR_REVIEW_TOKEN',
              },
              {
                keywords: ['github app', 'app installation', 'app-based auth'],
                secret: 'APP_ID',
                description: 'GitHub App ID for app-based authentication',
                doppler_name: 'APP_ID',
                also_requires: ['APP_PRIVATE_KEY'],
              },
              {
                keywords: ['mabl', 'e2e test', 'end-to-end test', 'browser test'],
                secret: 'MABL_API_KEY',
                description: 'mabl testing platform API key',
                doppler_name: 'MABL_API_KEY',
              },
              {
                keywords: ['gist', 'mirror', 'backup', 'durability'],
                secret: 'MIRROR_GIST_TOKEN',
                description: 'PAT with gist scope for durability mirror',
                doppler_name: 'MIRROR_GIST_TOKEN',
                also_requires: ['MIRROR_GIST_ID'],
              },
              {
                keywords: ['doppler', 'secrets sync', 'secret management'],
                secret: 'DOPPLER_TOKEN',
                description: 'Doppler service token for secrets sync',
                doppler_name: 'DOPPLER_TOKEN',
              },
              {
                keywords: ['stripe', 'payment', 'billing', 'subscription', 'checkout'],
                secret: 'STRIPE_SECRET_KEY',
                description: 'Stripe API secret key for payment processing',
                doppler_name: 'STRIPE_SECRET_KEY',
              },
              {
                keywords: ['supabase', 'database', 'postgres', 'auth provider'],
                secret: 'SUPABASE_SERVICE_ROLE_KEY',
                description: 'Supabase service role key for backend operations',
                doppler_name: 'SUPABASE_SERVICE_ROLE_KEY',
              },
              {
                keywords: ['vercel', 'deployment', 'preview deploy'],
                secret: 'VERCEL_TOKEN',
                description: 'Vercel deployment token',
                doppler_name: 'VERCEL_TOKEN',
              },
              {
                keywords: ['digitalocean', 'digital ocean', 'doctl', 'app platform', 'droplet', 'do deploy', 'oaudrey'],
                secret: 'DIGITALOCEAN_API_TOKEN',
                description: 'DigitalOcean personal access token for App Platform deployments and DNS',
                doppler_name: 'DIGITALOCEAN_API_TOKEN',
              },
              {
                keywords: ['namecheap', 'dns record', 'domain dns', 'oaudrey.com', 'subdomain setup'],
                secret: 'NAMECHEAP_API_KEY',
                description: 'Namecheap API key for automated DNS record management',
                doppler_name: 'NAMECHEAP_API_KEY',
                also_requires: ['NAMECHEAP_USERNAME'],
              },
              {
                keywords: ['resend', 'transactional email', 'email alert', 'send email'],
                secret: 'RESEND_API_KEY',
                description: 'Resend transactional email API key',
                doppler_name: 'RESEND_API_KEY',
              },
            ];

            // ── Scan for matches ───────────────────────────────────────
            const requiredSecrets = new Map();

            for (const pattern of CREDENTIAL_PATTERNS) {
              if (pattern.keywords.some(kw => body.includes(kw))) {
                requiredSecrets.set(pattern.secret, pattern);
                if (pattern.also_requires) {
                  for (const extra of pattern.also_requires) {
                    const extraPattern = CREDENTIAL_PATTERNS.find(p => p.secret === extra);
                    if (extraPattern) {
                      requiredSecrets.set(extra, extraPattern);
                    } else {
                      requiredSecrets.set(extra, {
                        secret: extra,
                        description: `Required alongside ${pattern.secret}`,
                        doppler_name: extra,
                      });
                    }
                  }
                }
              }
            }

            if (requiredSecrets.size === 0) {
              core.info('No credential requirements detected in this issue.');
              core.setOutput('required_secrets', '');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  '## Credential Gatekeeper',
                  '',
                  'No credential requirements detected in this issue. ' +
                  'If this implementation does require secrets, add them manually to the checklist below.',
                  '',
                  '**Status:** No credentials needed',
                ].join('\n'),
              });

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['credentials-ready'],
                });
              } catch (err) {
                core.warning(`Could not add label: ${err.message}`);
              }
              return;
            }

            // ── Check which secrets are configured ─────────────────────
            // We check GitHub repo secrets by attempting to reference them.
            // Since we can't read secret values, we rely on the secrets
            // matrix in SECRETS_MANAGEMENT.md and Doppler (if available).
            const hasDoppler = !!process.env.DOPPLER_TOKEN;

            // ── Build BOM comment ──────────────────────────────────────
            const rows = [];
            for (const [name, pattern] of requiredSecrets) {
              rows.push(
                `| \`${name}\` | ${pattern.description} | Verify in Doppler or repo settings |`
              );
            }

            const bomComment = [
              '## Credential Gatekeeper — Bill of Materials',
              '',
              `Found **${requiredSecrets.size}** credential(s) required for this implementation:`,
              '',
              '| Secret | Purpose | Status |',
              '|---|---|---|',
              ...rows,
              '',
              '### Next Steps',
              '',
              hasDoppler
                ? '1. Open [Doppler dashboard](https://dashboard.doppler.com) and verify these secrets are provisioned'
                : '1. Add secrets to **Doppler** (recommended) or GitHub repo settings',
              '2. Once all secrets are provisioned, remove the `credentials-missing` label and add `credentials-ready`',
              '3. Implementation can proceed once `credentials-ready` is applied',
              '',
              '### How to provision via Doppler',
              '',
              '```bash',
              '# Install Doppler CLI (if not already installed)',
              'curl -Ls https://cli.doppler.com/install.sh | sh',
              '',
              '# Login and select project',
              'doppler login',
              'doppler setup',
              '',
              '# Set secrets',
              ...Array.from(requiredSecrets.keys()).map(s => `doppler secrets set ${s} --value "YOUR_VALUE_HERE"`),
              '```',
              '',
              `_Scanned by Credential Gatekeeper at ${new Date().toISOString().split('T')[0]}_`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: bomComment,
            });

            // ── Apply label ────────────────────────────────────────────
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['credentials-missing'],
              });
            } catch (err) {
              core.warning(`Could not add label: ${err.message}`);
            }

            core.info(`BOM generated: ${requiredSecrets.size} credential(s) required.`);
            core.setOutput('required_secrets', Array.from(requiredSecrets.keys()).join(','));
            core.summary.addHeading('Credential Gatekeeper BOM');
            core.summary.addTable([
              [{data: 'Secret', header: true}, {data: 'Purpose', header: true}],
              ...Array.from(requiredSecrets.entries()).map(([name, p]) => [name, p.description]),
            ]);
            await core.summary.write();

  auto-provision:
    name: Auto-provision missing secrets via Doppler
    needs: scan
    runs-on: ubuntu-latest
    if: needs.scan.outputs.required_secrets != ''
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync required secrets from Doppler → GitHub repo secrets
        id: sync
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # GH_TOKEN must have `secrets: write` on the target repo. The
          # default GITHUB_TOKEN cannot write Actions secrets, so we
          # prefer ADMIN_GITHUB_TOKEN (a fine-grained PAT with that
          # scope). If it is absent the fallback to GITHUB_TOKEN will
          # surface as per-secret `❌` rows in the result comment, which
          # is the signal to provision ADMIN_GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          REQUIRED_SECRETS: ${{ needs.scan.outputs.required_secrets }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::warning::DOPPLER_TOKEN not configured — skipping auto-provision."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x scripts/gatekeeper-sync.sh
          ./scripts/gatekeeper-sync.sh \
            --secrets "$REQUIRED_SECRETS" \
            --repo "$GITHUB_REPOSITORY" \
            --json > /tmp/gatekeeper-sync.json
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "summary_file=/tmp/gatekeeper-sync.json" >> "$GITHUB_OUTPUT"
          cat /tmp/gatekeeper-sync.json

      - name: Comment auto-provision result on the issue
        if: always() && steps.sync.outputs.skipped == 'false'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ needs.scan.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!issueNumber) return;

            let result;
            try {
              const lines = fs.readFileSync('/tmp/gatekeeper-sync.json', 'utf8').trim().split('\n').filter(Boolean);
              result = JSON.parse(lines[lines.length - 1]);
            } catch (e) {
              core.warning(`Could not read sync summary: ${e.message}`);
              return;
            }

            const synced  = result.synced  || [];
            const missing = result.missing_in_doppler || [];
            const failed  = result.failed  || [];

            const rows = [
              ...synced .map(s => `| \`${s}\` | ✅ synced from Doppler → repo secrets |`),
              ...missing.map(s => `| \`${s}\` | ⚠️ not present in Doppler — add via \`doppler secrets set ${s} --value "<value>"\` |`),
              ...failed .map(s => `| \`${s}\` | ❌ \`gh secret set\` failed — check \`ADMIN_GITHUB_TOKEN\` scopes |`),
            ];

            const allReady = missing.length === 0 && failed.length === 0 && synced.length > 0;

            const body = [
              '## Credential Gatekeeper — Auto-provision Result',
              '',
              `Project: \`${result.project}\` · Config: \`${result.config}\` · Repo: \`${result.repo}\``,
              '',
              '| Secret | Result |',
              '|---|---|',
              ...rows,
              '',
              allReady
                ? '**Status:** ✅ all required credentials are now provisioned. Implementation can proceed.'
                : '**Status:** ⚠️ some credentials still need attention — see rows marked ⚠️ / ❌ above.',
              '',
              `_Auto-provisioned by Credential Gatekeeper at ${new Date().toISOString()}_`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

            if (allReady) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'credentials-missing',
                });
              } catch (e) { /* label may not be present */ }
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['credentials-ready'],
                });
              } catch (e) { core.warning(`Could not add credentials-ready: ${e.message}`); }
            }
