name: Credential Gatekeeper
on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to scan
        type: number
        required: true
concurrency:
  group: credential-gatekeeper-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
permissions:
  issues: write
  contents: read
jobs:
  scan:
    name: Generate credential BOM
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'opened') || (github.event_name == 'issues' && github.event.action == 'reopened') || (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready-to-implement')
    outputs:
      required_secrets: ${{ steps.scan.outputs.required_secrets }}
      issue_number: ${{ steps.scan.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan issue for credential requirements
        id: scan
        uses: actions/github-script@v9.0.0
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!issueNumber) {
              core.warning('No issue number provided. Skipping.');
              return;
            }
            core.setOutput('issue_number', String(issueNumber));

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const body = (issue.title + '\n' + (issue.body || '')).toLowerCase();

            // ── Credential detection patterns ──────────────────────────
            const CREDENTIAL_PATTERNS = [
              {
                keywords: ['openrouter', 'llm', 'ai review', 'ai triage', 'ai pr', 'claude', 'gpt', 'ai-powered'],
                secret: 'OPENROUTER_API_KEY',
                description: 'OpenRouter LLM API key for AI-powered features',
                doppler_name: 'OPENROUTER_API_KEY',
              },
              // Perplexity research is intentionally no-key. The
              // perplexity-research-agent workflow installs
              // helallao/perplexity-ai and uses anonymous web/Labs access, so
              // market-research keywords must not create a PERPLEXITY_API_KEY
              // blocker.
              {
                keywords: ['jules', 'google jules', 'deep-research'],
                secret: 'JULES_API_KEY',
                description: 'Google Jules agent API key',
                doppler_name: 'JULES_API_KEY',
              },
              {
                keywords: ['openai', 'panda-ops', 'pandaops', 'gpt-4', 'chatgpt', 'codex'],
                secret: 'OPENAI_API_KEY',
                description: 'OpenAI API key (used by PandaOps and Codex)',
                doppler_name: 'OPENAI_API_KEY',
              },
              {
                keywords: ['recurseml', 'recurse-ml', 'code review bot'],
                secret: 'RECURSE_ML_API_KEY',
                description: 'RecurseML code review API key',
                doppler_name: 'RECURSE_ML_API_KEY',
              },
              {
                keywords: ['admin token', 'elevated permissions', 'fork audit', 'saml', 'sso', 'project board'],
                secret: 'ADMIN_GITHUB_TOKEN',
                description: 'Fine-grained PAT with elevated repo/org permissions',
                doppler_name: 'ADMIN_GITHUB_TOKEN',
              },
              {
                keywords: ['draft pr', 'ready for review', 'promote draft'],
                secret: 'READY_FOR_REVIEW_TOKEN',
                description: 'Fine-grained PAT for promoting draft PRs',
                doppler_name: 'READY_FOR_REVIEW_TOKEN',
              },
              {
                keywords: ['github app', 'app installation', 'app-based auth'],
                secret: 'APP_ID',
                description: 'GitHub App ID for app-based authentication',
                doppler_name: 'APP_ID',
                also_requires: ['APP_PRIVATE_KEY'],
              },
              // PAUSED 2026-05-27 with mabl.yml — uncomment block to re-enable.
              /*
              {
                keywords: ['mabl', 'e2e test', 'end-to-end test', 'browser test'],
                secret: 'MABL_API_KEY',
                description: 'mabl testing platform API key',
                doppler_name: 'MABL_API_KEY',
              },
              */
              {
                keywords: ['gist', 'mirror', 'backup', 'durability'],
                secret: 'MIRROR_GIST_TOKEN',
                description: 'PAT with gist scope for durability mirror',
                doppler_name: 'MIRROR_GIST_TOKEN',
                also_requires: ['MIRROR_GIST_ID'],
              },
              {
                keywords: ['doppler', 'secrets sync', 'secret management'],
                secret: 'DOPPLER_TOKEN',
                description: 'Doppler service token for secrets sync',
                doppler_name: 'DOPPLER_TOKEN',
              },
              {
                keywords: ['stripe', 'payment', 'billing', 'subscription', 'checkout'],
                secret: 'STRIPE_SECRET_KEY',
                description: 'Stripe API secret key for payment processing',
                doppler_name: 'STRIPE_SECRET_KEY',
              },
              {
                keywords: ['supabase', 'database', 'postgres', 'auth provider'],
                secret: 'SUPABASE_SERVICE_ROLE_KEY',
                description: 'Supabase service role key for backend operations',
                doppler_name: 'SUPABASE_SERVICE_ROLE_KEY',
              },
              {
                keywords: ['vercel', 'deployment', 'preview deploy'],
                secret: 'VERCEL_TOKEN',
                description: 'Vercel deployment token',
                doppler_name: 'VERCEL_TOKEN',
              },
              {
                keywords: ['railway', 'railway deploy', 'railway.app'],
                secret: 'RAILWAY_TOKEN',
                description: 'Railway deployment token for API/backend services',
                doppler_name: 'RAILWAY_TOKEN',
                signup_url: 'https://railway.app/account/tokens',
                auto_acquirable: true,
              },
              {
                keywords: ['digitalocean', 'digital ocean', 'doctl', 'app platform', 'droplet', 'do deploy', 'oaudrey'],
                secret: 'DIGITALOCEAN_API_TOKEN',
                description: 'DigitalOcean personal access token for App Platform deployments and DNS',
                doppler_name: 'DIGITALOCEAN_API_TOKEN',
              },
              {
                keywords: ['namecheap', 'dns record', 'domain dns', 'oaudrey.com', 'subdomain setup'],
                secret: 'NAMECHEAP_API_KEY',
                description: 'Namecheap API key for automated DNS record management',
                doppler_name: 'NAMECHEAP_API_KEY',
                also_requires: ['NAMECHEAP_USERNAME'],
              },
              {
                keywords: ['godaddy', 'go daddy', 'godaddy api'],
                secret: 'GODADDY_API_KEY',
                description: 'GoDaddy API key for automated DNS record management',
                doppler_name: 'GODADDY_API_KEY',
                also_requires: ['GODADDY_API_SECRET'],
              },
              {
                keywords: ['porkbun', 'porkbun api'],
                secret: 'PORKBUN_API_KEY',
                description: 'Porkbun API key for automated DNS record management',
                doppler_name: 'PORKBUN_API_KEY',
                also_requires: ['PORKBUN_SECRET_API_KEY'],
              },
              {
                keywords: ['resend', 'transactional email', 'email alert', 'send email'],
                secret: 'RESEND_API_KEY',
                description: 'Resend transactional email API key',
                doppler_name: 'RESEND_API_KEY',
              },
              // ── MARKETING / LAUNCH CHANNELS ──────────────────────────
              {
                keywords: [
                  'product hunt', 'producthunt', 'ph launch', 'ph post',
                  'ship to market', 'launch post',
                ],
                secret: 'PRODUCT_HUNT_API_TOKEN',
                description: 'Product Hunt API token for automated launch posts',
                doppler_name: 'PRODUCT_HUNT_API_TOKEN',
                signup_url: 'https://api.producthunt.com/v2/docs',
                auto_acquirable: true,
              },
              {
                keywords: [
                  'reddit', 'subreddit', 'reddit post', 'reddit launch',
                  'ship to market',
                ],
                secret: 'REDDIT_CLIENT_ID',
                description: 'Reddit API client ID for automated posts',
                doppler_name: 'REDDIT_CLIENT_ID',
                also_requires: ['REDDIT_CLIENT_SECRET', 'REDDIT_REFRESH_TOKEN'],
                signup_url: 'https://www.reddit.com/prefs/apps',
                auto_acquirable: true,
              },
              {
                keywords: ['npm', 'npm publish', 'npm package', 'cli publish', 'deliver:cli'],
                secret: 'NPM_TOKEN',
                description: 'npm automation token for publishing CLI packages',
                doppler_name: 'NPM_TOKEN',
                signup_url: 'https://www.npmjs.com/settings/~/tokens',
                auto_acquirable: true,
              },
              {
                keywords: ['twitter', 'x.com', 'tweet', 'x post', 'launch tweet'],
                secret: 'TWITTER_BEARER_TOKEN',
                description: 'Twitter/X API bearer token for launch posts',
                doppler_name: 'TWITTER_BEARER_TOKEN',
                also_requires: ['TWITTER_API_KEY', 'TWITTER_API_SECRET', 'TWITTER_ACCESS_TOKEN', 'TWITTER_ACCESS_SECRET'],
                signup_url: 'https://developer.twitter.com/en/portal/dashboard',
              },
              {
                keywords: ['amplitude', 'analytics', 'metrics', 'event tracking', 'metrics-monitor'],
                secret: 'AMPLITUDE_API_KEY',
                description: 'Amplitude analytics API key for event tracking and metrics monitor',
                doppler_name: 'AMPLITUDE_API_KEY',
              },
              // ── E-E-A-T / SEO ──────────────────────────────────────
              {
                keywords: ['e-e-a-t', 'eeat', 'trustforge', 'google search console', 'search console', 'schema markup', 'seo automation'],
                secret: 'GOOGLE_SEARCH_CONSOLE_KEY',
                description: 'Google Search Console API key for E-E-A-T automation',
                doppler_name: 'GOOGLE_SEARCH_CONSOLE_KEY',
              },
              {
                keywords: ['google business profile', 'google my business', 'business profile api', 'knowledge panel'],
                secret: 'GOOGLE_BUSINESS_PROFILE_KEY',
                description: 'Google Business Profile API key for E-E-A-T automation',
                doppler_name: 'GOOGLE_BUSINESS_PROFILE_KEY',
              },
              {
                keywords: ['linkedin api', 'linkedin profile sync', 'linkedin automation', 'linkedin post'],
                secret: 'LINKEDIN_ACCESS_TOKEN',
                description: 'LinkedIn API access token for profile sync and launch posts',
                doppler_name: 'LINKEDIN_ACCESS_TOKEN',
              },
              {
                keywords: ['orcid', 'orcid api', 'research profile', 'publication sync'],
                secret: 'ORCID_API_KEY',
                description: 'ORCID API key for publication and profile sync',
                doppler_name: 'ORCID_API_KEY',
              },
            ];

            // ── Scan for matches ───────────────────────────────────────
            const requiredSecrets = new Map();

            for (const pattern of CREDENTIAL_PATTERNS) {
              if (pattern.keywords.some(kw => body.includes(kw))) {
                requiredSecrets.set(pattern.secret, pattern);
                if (pattern.also_requires) {
                  for (const extra of pattern.also_requires) {
                    const extraPattern = CREDENTIAL_PATTERNS.find(p => p.secret === extra);
                    if (extraPattern) {
                      requiredSecrets.set(extra, extraPattern);
                    } else {
                      requiredSecrets.set(extra, {
                        secret: extra,
                        description: `Required alongside ${pattern.secret}`,
                        doppler_name: extra,
                      });
                    }
                  }
                }
              }
            }

            if (requiredSecrets.size === 0) {
              core.info('No credential requirements detected in this issue.');
              core.setOutput('required_secrets', '');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  '## Credential Gatekeeper',
                  '',
                  'No credential requirements detected in this issue. ' +
                  'If this implementation does require secrets, add them manually to the checklist below.',
                  '',
                  '**Status:** No credentials needed',
                ].join('\n'),
              });

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['credentials-ready'],
                });
              } catch (err) {
                core.warning(`Could not add label: ${err.message}`);
              }
              return;
            }

            // ── Check which secrets are configured ─────────────────────
            const hasDoppler = !!process.env.DOPPLER_TOKEN;

            // ── Build BOM comment ──────────────────────────────────────
            const rows = [];
            for (const [name, pattern] of requiredSecrets) {
              const signupNote = pattern.signup_url
                ? ` — [Get it here](${pattern.signup_url})`
                : '';
              const autoNote = pattern.auto_acquirable
                ? ' 🤖 auto-acquirable via browser MCP'
                : '';
              rows.push(
                `| \`${name}\` | ${pattern.description}${signupNote}${autoNote} | Verify in Doppler or repo settings |`
              );
            }

            const bomComment = [
              '## Credential Gatekeeper — Bill of Materials',
              '',
              `Found **${requiredSecrets.size}** credential(s) required for this implementation:`,
              '',
              '| Secret | Purpose | Status |',
              '|---|---|---|',
              ...rows,
              '',
              '> 🤖 Secrets marked **auto-acquirable** can be fetched automatically via browser MCP (Claude Desktop / Codex) or via Gumloop session cookies. All others require manual provisioning.',
              '',
              '### Next Steps',
              '',
              hasDoppler
                ? '1. Open [Doppler dashboard](https://dashboard.doppler.com) and verify these secrets are provisioned'
                : '1. Add secrets to **Doppler** (recommended) or GitHub repo settings',
              '2. Once all secrets are provisioned, remove the `credentials-missing` label and add `credentials-ready`',
              '3. Implementation can proceed once `credentials-ready` is applied',
              '',
              '### How to provision via Doppler',
              '',
              '```bash',
              '# Install Doppler CLI (if not already installed)',
              'curl -Ls https://cli.doppler.com/install.sh | sh',
              '',
              '# Login and select project',
              'doppler login',
              'doppler setup',
              '',
              '# Set secrets',
              ...Array.from(requiredSecrets.keys()).map(s => `doppler secrets set ${s} --value "YOUR_VALUE_HERE"`),
              '```',
              '',
              `_Scanned by Credential Gatekeeper at ${new Date().toISOString().split('T')[0]}_`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: bomComment,
            });

            // ── Apply label ────────────────────────────────────────────
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['credentials-missing'],
              });
            } catch (err) {
              core.warning(`Could not add label: ${err.message}`);
            }

            core.info(`BOM generated: ${requiredSecrets.size} credential(s) required.`);
            core.setOutput('required_secrets', Array.from(requiredSecrets.keys()).join(','));
            core.summary.addHeading('Credential Gatekeeper BOM');
            core.summary.addTable([
              [{data: 'Secret', header: true}, {data: 'Purpose', header: true}, {data: 'Auto-acquirable', header: true}],
              ...Array.from(requiredSecrets.entries()).map(([name, p]) => [
                name,
                p.description,
                p.auto_acquirable ? '🤖 Yes' : 'Manual',
              ]),
            ]);
            await core.summary.write();
    timeout-minutes: 30
  auto-provision:
    name: Auto-provision missing secrets via backup sources
    needs: scan
    runs-on: ubuntu-latest
    if: needs.scan.outputs.required_secrets != ''
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Sync required secrets from backup sources → GitHub repo secrets
        id: sync
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          REQUIRED_SECRETS: ${{ needs.scan.outputs.required_secrets }}
          CREDENTIAL_BACKUP_JSON: ${{ secrets.CREDENTIAL_BACKUP_JSON }}
          CREDENTIAL_BACKUP_SOPS_FILE: ${{ vars.CREDENTIAL_BACKUP_SOPS_FILE }}
          CREDENTIAL_BACKUP_PASS_PREFIX: ${{ vars.CREDENTIAL_BACKUP_PASS_PREFIX }}
          CREDENTIAL_BACKUP_BW_PREFIX: ${{ vars.CREDENTIAL_BACKUP_BW_PREFIX }}
          BW_SESSION: ${{ secrets.BW_SESSION }}
          CREDENTIAL_BACKUP_1PASSWORD_TEMPLATE: ${{ vars.CREDENTIAL_BACKUP_1PASSWORD_TEMPLATE }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR || secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/gatekeeper-sync.sh
          ./scripts/gatekeeper-sync.sh \
            --secrets "$REQUIRED_SECRETS" \
            --repo "$GITHUB_REPOSITORY" \
            --json > /tmp/gatekeeper-sync.json
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "summary_file=/tmp/gatekeeper-sync.json" >> "$GITHUB_OUTPUT"
          cat /tmp/gatekeeper-sync.json
      - name: Auto-provision via browser MCP (Gumloop/Chrome session cookies)
        id: browser-mcp
        if: always() && steps.sync.outputs.skipped == 'false'
        env:
          GUMLOOP_API_KEY: ${{ secrets.GUMLOOP_API_KEY }}
          CHROME_DEVTOOLS_MCP_PATH: ${{ vars.CHROME_DEVTOOLS_MCP_PATH }}
          CHROME_DEBUG_PORT: ${{ vars.CHROME_DEBUG_PORT || '9222' }}
        run: |
          set -euo pipefail
          
          # Check if browser MCP is configured
          if [[ -z "$GUMLOOP_API_KEY" && -z "$CHROME_DEVTOOLS_MCP_PATH" ]]; then
            echo "Browser MCP not configured (no GUMLOOP_API_KEY or CHROME_DEVTOOLS_MCP_PATH) — skipping browser extraction"
            echo "browser_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "=== Browser MCP Auto-provision ==="
          
          # Extract session cookies from Gumloop or Chrome DevTools
          if [[ -n "$GUMLOOP_API_KEY" ]]; then
            echo "Gumloop session extraction not yet implemented"
            # Future: Use Gumloop API to retrieve authenticated session cookies
            # and extract API keys from session storage
          fi
          
          if [[ -n "$CHROME_DEVTOOLS_MCP_PATH" ]]; then
            echo "Chrome DevTools MCP extraction not yet implemented"
            # Future: Use chrome-devtools-mcp to extract credentials from
            # authenticated browser sessions (localStorage, sessionStorage, cookies)
            # Requires Chrome running with --remote-debugging-port
          fi
          
          echo "browser_skipped=false" >> "$GITHUB_OUTPUT"
          echo "browser_note=Browser MCP auto-provision placeholder — implement extraction logic" >> "$GITHUB_OUTPUT"
      - name: Comment auto-provision result on the issue
        if: always() && steps.sync.outputs.skipped == 'false'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ needs.scan.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!issueNumber) return;

            let result;
            try {
              const lines = fs.readFileSync('/tmp/gatekeeper-sync.json', 'utf8').trim().split('\n').filter(Boolean);
              result = JSON.parse(lines[lines.length - 1]);
            } catch (e) {
              core.warning(`Could not read sync summary: ${e.message}`);
              return;
            }

            const synced = result.synced || [];
            const alreadyPresent = result.already_present || [];
            const missing = result.missing || result.missing_in_doppler || [];
            const failed = result.failed || [];
            const sources = result.sources || {};

            const rows = [
              ...synced.map(s => `| \`${s}\` | ✅ synced from ${sources[s] || 'backup source'} → repo secrets |`),
              ...alreadyPresent.map(s => `| \`${s}\` | ✅ already present in GitHub Actions secrets |`),
              ...missing.map(s => `| \`${s}\` | ⚠️ not found in configured backup sources — add to GitHub secrets, Doppler, JSON/SOPS, pass, Bitwarden, 1Password, Infisical, or Vault |`),
              ...failed.map(s => `| \`${s}\` | ❌ \`gh secret set\` failed from ${sources[s] || 'resolved source'} — check \`ADMIN_GITHUB_TOKEN\` scopes |`),
            ];

            const allReady = missing.length === 0 && failed.length === 0 && (synced.length + alreadyPresent.length) > 0;

            const body = [
              '## Credential Gatekeeper — Auto-provision Result',
              '',
              `Project: \`${result.project}\` · Config: \`${result.config}\` · Repo: \`${result.repo}\``,
              '',
              '| Secret | Result |',
              '|---|---|',
              ...rows,
              '',
              allReady
                ? '**Status:** ✅ all required credentials are now provisioned or already present. Implementation can proceed.'
                : '**Status:** ⚠️ some credentials still need attention — see rows marked ⚠️ / ❌ above.',
              '',
              `_Auto-provisioned by Credential Gatekeeper at ${new Date().toISOString()}_`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

            if (allReady) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'credentials-missing',
                });
              } catch (e) { /* label may not be present */ }
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['credentials-ready'],
                });
              } catch (e) { core.warning(`Could not add credentials-ready: ${e.message}`); }
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
