name: Gumroad Covers

on:
  workflow_dispatch:
  push:
    paths:
      - "products/covers/**"
      - "products/generate_covers.py"
      - "products/gumroad_attach_covers.py"

jobs:
  generate-and-attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install Pillow requests

      - name: Generate SEO covers
        run: python products/generate_covers.py

      - name: Commit covers if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products/covers/*.jpg
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No cover changes"
          else
            git commit -m "chore(covers): regenerate SEO product covers"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for jsDelivr to index commit
        if: steps.commit.outputs.changed == 'true' || true
        run: sleep 15

      - name: Attach covers to Gumroad
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          if [ -z "$GUMROAD_ACCESS_TOKEN" ]; then
            echo "GUMROAD_ACCESS_TOKEN secret not set — skip attach"
            exit 0
          fi
          REF="${{ steps.commit.outputs.sha }}"
          if [ -z "$REF" ]; then REF="main"; fi
          python products/gumroad_attach_covers.py --all --ref "$REF"
