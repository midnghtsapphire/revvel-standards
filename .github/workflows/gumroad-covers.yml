name: Gumroad Covers

on:
  workflow_dispatch:
  # Only fire for pushes landing on main. Pushes to the automation branch
  # (created by peter-evans/create-pull-request below) would otherwise loop:
  # workflow → PR → auto-push to branch → workflow → PR to itself.
  push:
    branches: [main]
    paths:
      - "products/covers/**"
      - "products/generate_covers.py"
      - "products/gumroad_attach_covers.py"

# Least-privilege at workflow level; the PR job elevates only what it needs.
permissions:
  contents: read

jobs:
  generate-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `contents: write` + `pull-requests: write` are needed only by the
    # create-pull-request step below. The main branch is protected by a
    # ruleset that rejects direct pushes ("Changes must be made through a
    # pull request"), so this workflow must open a PR instead of pushing.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --no-cache-dir Pillow==11.0.0 requests==2.32.3

      - name: Generate SEO covers
        run: python products/generate_covers.py

      - name: Open PR with regenerated covers (main is protected)
        id: cr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # Always target main; this workflow can be dispatched from any branch
          # (or during a dry-run on a feature branch) but the covers themselves
          # need to land on main so jsDelivr can serve them.
          base: main
          commit-message: "chore(covers): regenerate SEO product covers"
          title: "chore(covers): regenerate SEO product covers"
          body: |
            Auto-generated by `.github/workflows/gumroad-covers.yml`.

            Regenerates `products/covers/cover-*.jpg` via `products/generate_covers.py`
            so jsDelivr can serve current cover art to Gumroad
            (`gumroad_attach_covers.py`).

            The workflow cannot push directly to `main` — the branch ruleset
            requires all changes to arrive via pull request.
          branch: automation/gumroad-covers
          delete-branch: true
          add-paths: products/covers/*.jpg
          labels: automation,covers,gumroad

      - name: Attach covers to Gumroad
        # Only attach when covers actually changed (PR created or updated).
        # pull-request-operation is 'none' when the branch exists but this run
        # made no new commits, so gating on number alone would re-attach unchanged
        # images on every rerun of the workflow.
        # Pin the CDN ref to that PR's head so Gumroad fetches the exact bytes
        # this run produced, not whatever is on `main` right now.
        if: steps.cr.outputs.pull-request-operation == 'created' || steps.cr.outputs.pull-request-operation == 'updated'
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          REF: ${{ steps.cr.outputs.pull-request-head-sha }}
        run: |
          if [ -z "$GUMROAD_ACCESS_TOKEN" ]; then
            echo "GUMROAD_ACCESS_TOKEN secret not set — skip attach"
            exit 0
          fi
          # Give jsDelivr a moment to index the new commit before Gumroad pulls.
          sleep 15
          python products/gumroad_attach_covers.py --all --ref "$REF"
