# Markdown lint — markdownlint-cli2 (David Anson). Single markdown gate for the repo.
# Replaced the @lint-md action 2026-07-16: it was a duplicate linter with conflicting rules.
# Config: .markdownlint.jsonc
name: Lint Markdown (markdownlint-cli2)

on:
  pull_request:
    paths: ["**/*.md"]
  push:
    branches: [main]
    paths: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.git/**
            !dist/**
            !vendor/**
            !wr/issues/**
            !docs/agents/claude/transcripts/**
          config: .markdownlint.jsonc
          fix: false
