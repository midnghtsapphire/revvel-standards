name: Lint Markdown (markdownlint-cli2)

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.git/**
            !dist/**
            !vendor/**
            !wr/issues/**
            !docs/agents/claude/transcripts/**
          config: .markdownlint.yaml
          fix: false
