# Markdown lint — nosborn/github-action-markdown-cli (markdownlint-cli).
# Single markdown style gate for the repo on PR/push.
# Config: .markdownlint.yaml + .markdownlintignore
# Local equivalent: npm run lint (markdownlint-cli2 with .markdownlint.jsonc)
name: Lint Markdown (markdownlint-cli)

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".markdownlint.yaml"
      - ".markdownlint.jsonc"
      - ".markdownlintignore"
      - ".github/workflows/lint-md.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".markdownlint.yaml"
      - ".markdownlint.jsonc"
      - ".markdownlintignore"
      - ".github/workflows/lint-md.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # nosborn/github-action-markdown-cli@v3.5.0 — pin full commit SHA
      # (CLAUDE.md gotcha #8). Annotated tag v3.5.0 → 508d6cef...
      - name: markdownlint-cli
        uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # v3.5.0
        with:
          files: .
          config_file: .markdownlint.yaml
          dot: true
          ignore_path: .markdownlintignore
