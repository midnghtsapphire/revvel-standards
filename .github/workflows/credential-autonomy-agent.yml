name: Credential Autonomy Agent
# Self-healing credential agent - handles everything autonomously
# No human intervention needed

on:
  schedule:
    - cron: '15 * * * *'  # Every hour at :15 (offset from guardian)
  workflow_dispatch:  # Manual trigger
    inputs:
      action:
        description: Action to perform
        type: choice
        options:
          - audit
          - restore
          - cleanup
          - refresh
          - full
        default: full
      dry_run:
        description: Dry run
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  issues: write
  discussions: write

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  autonomy:
    name: 🤖 Credential Autonomy
    runs-on: ubuntu-latest
    outputs:
      actions_taken: ${{ steps.autonomy.outputs.actions_taken }}
      status: ${{ steps.autonomy.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/credential-autonomy-agent.js
            scripts/credential-backup-harness.js

      - name: Run Autonomy Agent
        id: autonomy
        env:
          ACTION: ${{ github.event.inputs.action || 'full' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CREDENTIAL_BACKUP_JSON: ${{ secrets.CREDENTIAL_BACKUP_JSON }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/credential-autonomy-agent.js
          node scripts/credential-autonomy-agent.js --action "${ACTION}" --dry-run "${DRY_RUN}"

      - name: Post summary comment
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const status = '${{ steps.autonomy.outputs.status }}';
            const actions = '${{ steps.autonomy.outputs.actions_taken }}';
            
            const emoji = status === 'success' ? '✅' : status === 'warning' ? '⚠️' : '❌';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} Credential Autonomy Agent Complete

**Action:** ${{ github.event.inputs.action || 'full' }}
**Status:** ${status}

**Actions Taken:** ${actions || 'None'}

_Run time: ${new Date().toISOString()}_`
            });

  # If autonomy agent fails, create issue and try self-heal
  heal-on-failure:
    name: 🔧 Self-Heal on Failure
    needs: autonomy
    if: needs.autonomy.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose and self-heal
        run: |
          echo "🔧 Self-healing initiated..."
          
          # Try to fix common issues
          chmod +x scripts/credential-autonomy-agent.js
          
          # Retry with more verbose output
          node scripts/credential-autonomy-agent.js --action audit --dry-run false 2>&1 || true
          
          # If still failing, note the issue
          echo "Self-heal attempted. Check logs above."

      - name: Create issue if persistent failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: existing } = await github.rest.issues.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['credential-autonomy', 'auto-error']
            });
            
            if (existing.length === 0) {
              await github.rest.issues.create({
                title: '[AUTO] Credential Autonomy Agent Failed - Needs Review',
                body: `## 🤖 Credential Agent Failure

The autonomous credential agent failed repeatedly.

**Last Run:** ${new Date().toISOString()}

### Diagnostic Info:
- CREDENTIAL_BACKUP_JSON set: ${process.env.CREDENTIAL_BACKUP_JSON ? 'Yes' : 'NO ⚠️'}
- GH_TOKEN available: ${process.env.GH_TOKEN ? 'Yes' : 'NO ⚠️'}

### Possible Causes:
1. CREDENTIAL_BACKUP_JSON secret missing or empty
2. Backup JSON malformed (not valid JSON)
3. GitHub API rate limiting
4. Required secrets not in backup

### Immediate Actions:
1. Verify CREDENTIAL_BACKUP_JSON has valid JSON
2. Check all required credentials are in the backup
3. Run manually with --dry-run false to see detailed errors

---
_Auto-generated by Credential Autonomy Agent_`,
                labels: ['credential-autonomy', 'auto-error', 'needs-human']
              });
            }