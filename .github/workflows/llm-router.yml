name: 🔄 LLM Router with Perplexity No-Key Fallback

description: >
  Central LLM routing that tries OpenRouter first, falls back to
  Perplexity No-Key (free, no API key required) when credits exhausted.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Test prompt
        required: true
        type: string
      model_preference:
        description: Model preference (coding, general, research)
        required: false
        type: string
        default: general
  workflow_call:

jobs:
  route:
    name: Route LLM Call
    runs-on: ubuntu-latest
    outputs:
      response: ${{ steps.openrouter.outputs.response || steps.perplexity.outputs.response || 'null' }}
      model_used: ${{ steps.openrouter.outputs.model_used || steps.perplexity.outputs.model_used || 'none' }}
      success: ${{ steps.openrouter.outputs.success || steps.perplexity.outputs.success || 'false' }}
    steps:
      - name: Check OpenRouter credits
        id: check_credits
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          RESPONSE=$(curl -s -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"google/gemma-2-27b-it:free","messages":[{"role":"user","content":"hi"}],"max_tokens":5}' 2>&1)
          
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error.type')
            if [[ "$ERROR" == "insufficient_quota" ]] || [[ "$ERROR" == "rate_limit_exceeded" ]]; then
              echo "status=exhausted" >> $GITHUB_OUTPUT
            else
              echo "status=error" >> $GITHUB_OUTPUT
            fi
          else
            echo "status=available" >> $GITHUB_OUTPUT
          fi

      - name: Try OpenRouter
        id: openrouter
        if: steps.check_credits.outputs.status == 'available'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: ${{ inputs.prompt || 'Hello' }}
          MODEL_PREF: ${{ inputs.model_preference || 'general' }}
        run: |
          case "$MODEL_PREF" in
            coding) MODEL="qwen/qwen3-coder:free" ;;
            research) MODEL="nousresearch/hermes-3-llama-3.1-405b:free" ;;
            *) MODEL="google/gemma-4-31b-it:free" ;;
          esac
          
          echo "Using model: $MODEL"
          
          RESPONSE=$(curl -s -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"$PROMPT\"}],\"max_tokens\":4000}" 2>&1)
          
          if echo "$RESPONSE" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
            echo "response=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' | jq -Rs .)" >> $GITHUB_OUTPUT
            echo "model_used=$MODEL" >> $GITHUB_OUTPUT
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "response=OpenRouter failed" >> $GITHUB_OUTPUT
            echo "model_used=openrouter" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Perplexity No-Key
        if: steps.check_credits.outputs.status != 'available' || steps.openrouter.outputs.success == 'false'
        run: |
          pip3 install --quiet "perplexity-api @ git+https://github.com/helallao/perplexity-ai.git@main"

      - name: Try Perplexity No-Key
        id: perplexity
        if: steps.check_credits.outputs.status != 'available' || steps.openrouter.outputs.success == 'false'
        env:
          PROMPT: ${{ inputs.prompt || 'Hello' }}
          MODEL_PREF: ${{ inputs.model_preference || 'general' }}
        run: |
          if [[ "$MODEL_PREF" == "research" ]]; then MODEL="sonar-deep-research"
          elif [[ "$MODEL_PREF" == "coding" ]]; then MODEL="sonar-pro"
          else MODEL="sonar"
          fi
          
          echo "Using Perplexity No-Key with model: $MODEL"
          
          cat > /tmp/perplexity_call.py << 'PYEOF'
import sys
try:
    from perplexityai import LabsClient
    import asyncio
    async def main():
        client = LabsClient()
        try:
            result = await client.achat(
                messages=[{"role": "user", "content": sys.argv[1]}],
                model=sys.argv[2], max_tokens=4000)
            print(result.content[0].text if hasattr(result, 'content') else str(result))
        except:
            result = await client.search(query=sys.argv[1], mode="auto", model=sys.argv[2])
            print(str(result))
    asyncio.run(main())
except Exception as e:
    print(f"ERROR: {str(e)}", file=sys.stderr)
    sys.exit(1)
PYEOF
          
          python3 /tmp/perplexity_call.py "$PROMPT" "$MODEL" > /tmp/response.txt 2>&1
          
          if [ $? -eq 0 ]; then
            echo "response=$(cat /tmp/response.txt | jq -Rs .)" >> $GITHUB_OUTPUT
            echo "model_used=perplexity-no-key" >> $GITHUB_OUTPUT
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "response=Perplexity No-Key failed" >> $GITHUB_OUTPUT
            echo "model_used=perplexity-no-key" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "=========================================="
          echo "LLM Router Result"
          echo "=========================================="
          echo "OpenRouter Status: ${{ steps.check_credits.outputs.status }}"
          echo "Success: ${{ steps.openrouter.outputs.success || steps.perplexity.outputs.success || 'unknown' }}"
          echo "Model Used: ${{ steps.openrouter.outputs.model_used || steps.perplexity.outputs.model_used || 'none' }}"
