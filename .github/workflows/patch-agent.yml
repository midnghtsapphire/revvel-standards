name: Patch Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run patch agent
        run: |
          echo "Running patch agent for #${{ inputs.issue_number }}"
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply fixes and open PR
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="patch/issue-${{ inputs.issue_number }}"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: patch agent changes for #${{ inputs.issue_number }}"
          git push -u origin "$BRANCH" || true
          gh pr create --title "patch: fixes for #${{ inputs.issue_number }}" \
            --body "Closes #${{ inputs.issue_number }}" \
            --base main --head "$BRANCH" || true
          ISSUE=${{ inputs.issue_number }}
          BRANCH="patch/issue-${ISSUE}"
          git config user.name "patch-agent[bot]"
          git config user.email "patch-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p .patch-agent
          echo "Patch run for #${ISSUE} at $(date -u +%FT%TZ)" > ".patch-agent/issue-${ISSUE}.md"
          git add ".patch-agent/issue-${ISSUE}.md"
          git commit -m "chore(patch-agent): stub for #${ISSUE}"
          git push origin "$BRANCH"
          gh pr create \
            --title "fix: patch for #${ISSUE}" \
            --body "Closes #${ISSUE}" \
            --head "$BRANCH" \
            --base main
