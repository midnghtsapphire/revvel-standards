name: Patch Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "patch-agent[bot]"
          git config user.email "patch-agent@users.noreply.github.com"

      - name: Create branch and apply patch
        id: branch
        run: |
          BRANCH="patch/issue-${{ inputs.issue_number }}-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "# Patch for #${{ inputs.issue_number }}" >> .patch-log
          git add -A
          git commit -m "chore(patch): fix for #${{ inputs.issue_number }}" || echo "No changes"
          git push origin "$BRANCH" || echo "Nothing to push"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Apply fixes and open PR
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "[patch] fix for issue #${{ inputs.issue_number }}" \
            --body "Automated patch for #${{ inputs.issue_number }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --base main || echo "PR create failed"
