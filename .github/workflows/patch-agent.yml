name: Patch Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run patch agent
        run: |
          echo "Running patch agent for #${{ inputs.issue_number }}"

      - name: Apply fixes and open PR
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="patch/issue-${{ inputs.issue_number }}"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: patch agent changes for #${{ inputs.issue_number }}"
          git push -u origin "$BRANCH" || true
          gh pr create --title "patch: fixes for #${{ inputs.issue_number }}" \
            --body "Closes #${{ inputs.issue_number }}" \
            --base main --head "$BRANCH" || true
