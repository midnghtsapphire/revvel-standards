# OWNER: midnghtsapphire | TICKET: #17248
#
# The whole of its "work" was:
#
#   mkdir -p .patch-agent
#   echo "Patch run for #${ISSUE_NUM} at $(date -u +%FT%TZ)" > ".patch-agent/issue-${ISSUE_NUM}.md"
#   git add -A
#   git commit -m "chore(patch-agent): scaffold changes for #${ISSUE_NUM}" || echo "No changes"
#   git push -u origin "$BRANCH" || true
#   gh pr create --body "Closes #${ISSUE_NUM}" ... || echo "PR may already exist"
#
# Merging such a PR would auto-close a real issue having changed nothing but a
# timestamp file. It was never dispatched — no `patch-agent/*` branches exist —
# so unlike jules-coding-agent.yml it left no debris. That is luck, not design.
#
# It was reachable only by workflow_dispatch, which is why it never fired on its
# own; jules-coding-agent.yml had the same body wired to `issue_comment` and did
# leave stub branches behind.
#
# Guarded by tests/no-workflow-fakes-closing-issues.test.js, which asserts the
# shape rather than the filename: no live workflow step may open a PR whose body
# claims `Closes #N`, commit something it calls a stub, or build a git ref from
# an unguarded input.
#
# Minimal inert stub below keeps this file a valid workflow (automation-doctor
# requires every workflow file to parse with a jobs section). No automatic
# triggers; the job is if:false and can never run.
#
# If a patch agent is wanted, wire a real one and let it earn the `Closes #N`.
name: Patch Agent (disabled)
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: false
    steps:
      - name: Disabled
        run: |
          echo "This workflow is disabled: it never called an agent."
          exit 1
