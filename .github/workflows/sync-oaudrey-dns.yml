name: Sync oAudrey DNS records
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Force a specific registrar (otherwise auto-detected)
        type: choice
        required: false
        default: auto
        options:
          - auto
          - namecheap
          - godaddy
          - porkbun
      dry_run:
        description: Build + log the API requests but don't call them
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows:
      - Deploy oAudrey Hub → DigitalOcean App Platform
    types:
      - completed
permissions:
  contents: read
  issues: write
jobs:
  sync:
    name: Sync DNS via registrar API
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --omit=optional
      - name: Detect registrar credentials
        id: detect
        env:
          FORCE_PROVIDER: ${{ github.event.inputs.provider || 'auto' }}
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_API_KEY: ${{ secrets.PORKBUN_SECRET_API_KEY }}
        run: |
          set -e
          provider=$(node -e "
            const { detectProvider } = require('./scripts/sync-dns-records.js');
            const force = process.env.FORCE_PROVIDER;
            const p = (force && force !== 'auto') ? force : detectProvider(process.env);
            if (!p) { console.error('no-provider'); process.exit(0); }
            console.log(p);
          ")
          if [ -z "$provider" ] || [ "$provider" = "no-provider" ]; then
            echo "::warning::No registrar credentials provisioned — skipping DNS sync. Run the Credential Gatekeeper to surface what's missing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Detected provider: $provider"
            echo "provider=$provider" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install doctl
        if: steps.detect.outputs.skip != 'true'
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
      - name: Resolve App Platform ingress hostname
        if: steps.detect.outputs.skip != 'true'
        id: ingress
        run: |
          set -e
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header 2>/dev/null \
            | awk '$2 == "oaudrey-hub" { print $1; exit }' \
            || true)
          if [ -z "$APP_ID" ]; then
            echo "::error::Could not find DO App Platform app 'oaudrey-hub'. Deploy it first via deploy-oaudrey.yml."
            exit 1
          fi
          INGRESS=$(doctl apps get "$APP_ID" --format DefaultIngress --no-header 2>/dev/null \
            | sed -E 's#https?://##' \
            | sed 's:/*$::')
          if [ -z "$INGRESS" ]; then
            echo "::error::App Platform ingress hostname is empty — has the first deploy completed?"
            exit 1
          fi
          echo "Resolved APP_TARGET: $INGRESS"
          echo "app_target=$INGRESS" >> "$GITHUB_OUTPUT"
      - name: Resolve GoDaddy apex target IP
        if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.provider == 'godaddy'
        id: ingress_ip
        run: |
          set -e
          INGRESS_HOST='${{ steps.ingress.outputs.app_target }}'
          APP_TARGET_IP=$(getent ahostsv4 "$INGRESS_HOST" | awk 'NR == 1 { print $1; exit }')
          if [ -z "$APP_TARGET_IP" ]; then
            echo "::error::Could not resolve IPv4 address for GoDaddy apex target: $INGRESS_HOST"
            exit 1
          fi
          echo "Resolved GoDaddy APP_TARGET IP: $APP_TARGET_IP"
          echo "app_target_ip=$APP_TARGET_IP" >> "$GITHUB_OUTPUT"
      - name: Sync DNS records
        if: steps.detect.outputs.skip != 'true'
        env:
          DNS_PROVIDER: ${{ steps.detect.outputs.provider }}
          APP_TARGET: ${{ steps.detect.outputs.provider == 'godaddy' && steps.ingress_ip.outputs.app_target_ip || steps.ingress.outputs.app_target }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_CLIENT_IP }}
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_API_KEY: ${{ secrets.PORKBUN_SECRET_API_KEY }}
        run: node scripts/sync-dns-records.js
      - name: Post-sync summary
        if: success() && steps.detect.outputs.skip != 'true'
        run: |
          echo "## oAudrey DNS Sync ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Provider | \`${{ steps.detect.outputs.provider }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| App target | \`${{ steps.ingress.outputs.app_target }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Records file | \`oaudrey/dns-records.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hub URL | https://oaudrey.com |" >> "$GITHUB_STEP_SUMMARY"
      - name: Open issue on failure
        if: failure() && steps.detect.outputs.skip != 'true'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 oAudrey DNS sync FAILED — ${new Date().toISOString().split('T')[0]}`,
              body: [
                '## oAudrey DNS Sync Failure',
                '',
                `**Triggered by:** \`${context.eventName}\``,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### Next steps',
                '1. Check the run log above for the registrar error response',
                '2. Verify the provider credentials are still valid (Credential Gatekeeper)',
                '3. Confirm the App Platform ingress is resolvable (`doctl apps get`)',
                '4. See `standards/OAUDREY_DEPLOYMENT_STANDARD.md` for full troubleshooting guide',
              ].join('\n'),
              labels: ['deploy-failure', 'oaudrey'],
            });
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
