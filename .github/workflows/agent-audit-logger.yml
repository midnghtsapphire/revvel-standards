name: Agent Audit Logger
on:
  # Triggers trimmed 2026-06-13 — previously fired on every label/assign/
  # comment-edit event, which (combined with the per-event commit to main
  # below) produced constant push contention and a flood of
  # "chore: log agent action [skip ci]" commits and failure issues. Only
  # the meaningful, low-frequency state transitions are logged now.
  issues:
    types:
      - opened
      - closed
  pull_request_review:
    types:
      - submitted
  issue_comment:
    types:
      - created
  # Cron paused 2026-06-02 — was firing hourly and filing a new
  # "[FAILURE] Agent Audit Logger failed" issue per failure with no
  # backoff or dedup, creating ~1k duplicate issues. Re-enable only
  # after the root failure is fixed AND dedup is in place.
  # schedule:
  #   - cron: 0 * * * *
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform
        required: true
        type: choice
        options:
          - log_analysis
          - health_check
          - token_report
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
concurrency:
  group: agent-audit-logger
  cancel-in-progress: false
jobs:
  log-agent-action:
    runs-on: ubuntu-latest
    if: |-
      github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && !(github.event_name == 'issues' &&
        github.event.issue.user.login == 'github-actions[bot]' &&
        (startsWith(github.event.issue.title, '[FAILURE]') ||
         startsWith(github.event.issue.title, '[ALERT]'))) &&
      !(github.event_name == 'issue_comment' &&
        github.event.issue.user.login == 'github-actions[bot]' &&
        (startsWith(github.event.issue.title, '[FAILURE]') ||
         startsWith(github.event.issue.title, '[ALERT]')))
    steps:
      # Best-effort checkout. The audit entry is never committed to main (it is
      # written to the job summary and uploaded as an artifact below), so the
      # only thing this checkout buys us is the previously-committed audit.jsonl
      # for prev_hash chaining. Guard it so a misconfigured optional
      # ADMIN_GITHUB_TOKEN (set-but-invalid: expired/wrong-scope -> 401) cannot
      # hard-fail and turn an otherwise-green PR red. The token expression only
      # falls back to GITHUB_TOKEN when ADMIN_GITHUB_TOKEN is the empty string;
      # continue-on-error covers the set-but-invalid case. Downstream steps
      # re-create the log dir/file, and github-script uses the auto-provided
      # GITHUB_TOKEN for API calls regardless of this checkout's outcome.
      - name: Checkout main
        id: checkout_main
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || github.token }}
      # Fallback checkout using the always-valid default GITHUB_TOKEN, only if the
      # admin-token checkout above failed. Preserves audit/chain behavior when the
      # admin token is misconfigured, without wiring any new credentials.
      - name: Checkout main (fallback)
        if: steps.checkout_main.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ github.token }}
      - name: Set up audit log directory
        run: |
          mkdir -p logs/agent-audit
          touch logs/agent-audit/audit.jsonl
      - name: Log agent action
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            // Determine agent/actor
            let actor = context.actor;
            let agentType = 'human';

            if (actor.includes('[bot]') || actor === 'github-actions[bot]') {
              agentType = 'bot';
            }

            // Get previous hash for chain integrity
            let prevHash = '0000000000000000';
            const logPath = 'logs/agent-audit/audit.jsonl';

            try {
              if (fs.existsSync(logPath)) {
                const lines = fs.readFileSync(logPath, 'utf8').trim().split('\n').filter(l => l);
                if (lines.length > 0) {
                  const lastEntry = JSON.parse(lines[lines.length - 1]);
                  prevHash = lastEntry.entry_hash || prevHash;
                }
              }
            } catch (e) {
              console.log('Starting new audit chain');
            }

            // Build audit entry
            const entry = {
              timestamp: new Date().toISOString(),
              event_type: context.eventName,
              action: context.payload.action || 'N/A',
              actor: actor,
              agent_type: agentType,
              resource_type: context.payload.issue ? 'issue' : context.payload.pull_request ? 'pull_request' : 'other',
              resource_number: context.payload.issue?.number || context.payload.pull_request?.number || null,
              resource_title: context.payload.issue?.title || context.payload.pull_request?.title || null,
              workflow_name: context.workflow || null,
              prev_hash: prevHash,
              labels: context.payload.issue?.labels?.map(l => l.name) || context.payload.pull_request?.labels?.map(l => l.name) || [],
              assignees: context.payload.issue?.assignees?.map(a => a.login) || context.payload.pull_request?.assignees?.map(a => a.login) || [],
              repository: context.repo.repo,
            };

            // Calculate entry hash for chain integrity
            const entryStr = JSON.stringify(entry, null, 0);
            entry.entry_hash = crypto.createHash('sha256').update(entryStr).digest('hex');

            // Append to log
            fs.appendFileSync(logPath, JSON.stringify(entry) + '\n');

            console.log('✅ Audit entry logged:', entry.entry_hash.substring(0, 8));
      # Persist the audit entry WITHOUT committing to main. Pushing to main on
      # every event caused constant rebase/branch-protection failures and a
      # flood of "chore: log agent action [skip ci]" commits. The entry is
      # written to the job summary and uploaded as a retained artifact instead.
      - name: Persist audit entry
        if: always()
        run: |
          # Runs with if: always(), so it may execute even when an earlier step
          # (e.g. checkout) failed and the "Set up audit log directory" step was
          # skipped. Re-ensure the dir/file exist and guard the tail so a missing
          # or empty log never turns this best-effort logging job red.
          mkdir -p logs/agent-audit
          touch logs/agent-audit/audit.jsonl
          {
            echo "## Audit Log Entry"
            echo ""
            echo "Logged for this run (not committed to \`main\`)."
            echo ""
            echo '```jsonl'
            if [ -s logs/agent-audit/audit.jsonl ]; then
              tail -1 logs/agent-audit/audit.jsonl
            else
              echo "(no audit entry written this run)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit entry artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-audit-${{ github.run_id }}
          path: logs/agent-audit/audit.jsonl
          if-no-files-found: ignore
          retention-days: 90
    timeout-minutes: 30
  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'health_check')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Analyze agent health
        uses: actions/github-script@v9.0.0
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            console.log('🔍 Analyzing agent health...');

            // Check for incomplete work indicators
            const problems = [];

            // 1. Check for TODO/placeholder language in recent commits
            const { execSync } = require('child_process');
            try {
              const recentDiff = execSync('git log --since="24 hours ago" -p --grep="TODO\\|FIXME\\|scaffold\\|placeholder\\|Phase 1" -i', {encoding: 'utf8'});
              if (recentDiff.includes('TODO') || recentDiff.includes('scaffold') || recentDiff.includes('placeholder')) {
                problems.push({
                  type: 'scaffolding_language',
                  severity: 'high',
                  message: 'Recent commits contain scaffolding language (TODO, placeholder, etc.)',
                  action: 'Review recent PRs and complete incomplete work'
                });
              }
            } catch (e) {
              // No matches found - good!
            }

            // 2. Check for stalled PRs
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const stalledPRs = prs.filter(pr => {
              const daysSinceUpdate = (Date.now() - new Date(pr.updated_at)) / (1000 * 60 * 60 * 24);
              return daysSinceUpdate > 2 && !pr.draft;
            });

            if (stalledPRs.length > 0) {
              problems.push({
                type: 'stalled_prs',
                severity: 'medium',
                count: stalledPRs.length,
                message: `${stalledPRs.length} PRs have not been updated in 2+ days`,
                action: 'Review and complete or close stalled PRs',
                prs: stalledPRs.map(pr => `#${pr.number}: ${pr.title}`)
              });
            }

            // 3. Check for failed workflow runs
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'failure',
              per_page: 20
            });

            const recentFailures = runs.workflow_runs.filter(run => {
              const hoursSinceFailure = (Date.now() - new Date(run.updated_at)) / (1000 * 60 * 60);
              return hoursSinceFailure < 24;
            });

            if (recentFailures.length > 3) {
              problems.push({
                type: 'workflow_failures',
                severity: 'high',
                count: recentFailures.length,
                message: `${recentFailures.length} workflow failures in last 24 hours`,
                action: 'Investigate and fix failing workflows',
                workflows: recentFailures.slice(0, 5).map(r => `${r.name} (#${r.run_number})`)
              });
            }

            // 4. Check audit log for issues
            const auditPath = 'logs/agent-audit/audit.jsonl';
            if (fs.existsSync(auditPath)) {
              const lines = fs.readFileSync(auditPath, 'utf8').trim().split('\n').filter(l => l);
              const last24h = lines.filter(line => {
                const entry = JSON.parse(line);
                const hoursSince = (Date.now() - new Date(entry.timestamp)) / (1000 * 60 * 60);
                return hoursSince < 24;
              });
              
              console.log(`📊 Agent activity (last 24h): ${last24h.length} events`);
              
              // Count bot vs human actions
              const botActions = last24h.filter(l => JSON.parse(l).agent_type === 'bot').length;
              const humanActions = last24h.filter(l => JSON.parse(l).agent_type === 'human').length;
              
              console.log(`🤖 Bot actions: ${botActions}`);
              console.log(`👤 Human actions: ${humanActions}`);
              
              if (botActions === 0 && humanActions > 0) {
                problems.push({
                  type: 'no_bot_activity',
                  severity: 'medium',
                  message: 'No bot activity detected in last 24 hours despite human activity',
                  action: 'Check if automation is functioning correctly'
                });
              }
            }

            // Report results
            if (problems.length === 0) {
              console.log('✅ All agent health checks passed');
              return;
            }

            console.log(`⚠️ Found ${problems.length} health issues`);

            // Create issue if critical problems found
            const criticalProblems = problems.filter(p => p.severity === 'high');
            if (criticalProblems.length > 0) {
              const body = [
                '## 🚨 Agent Health Alert',
                '',
                'The automated agent health check detected critical issues:',
                '',
                ...problems.map(p => {
                  let section = `### ${p.type.replace(/_/g, ' ').toUpperCase()} (${p.severity})`;
                  section += `\n\n${p.message}`;
                  section += `\n\n**Action Required:** ${p.action}`;
                  if (p.prs) section += `\n\n**Affected PRs:**\n${p.prs.map(pr => `- ${pr}`).join('\n')}`;
                  if (p.workflows) section += `\n\n**Failed Workflows:**\n${p.workflows.map(w => `- ${w}`).join('\n')}`;
                  return section;
                }).join('\n\n'),
                '',
                '---',
                `*Generated by agent-audit-logger.yml at ${new Date().toISOString()}*`
              ].join('\n');
              
              // Check if there's already an open health alert issue
              const { data: existingIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'agent-health-alert',
                per_page: 1
              });
              
              if (existingIssues.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '[ALERT] Agent Health Check Failed',
                  body: body,
                  labels: ['agent-health-alert', 'auto-error', 'needs-fix']
                });
                console.log('✅ Health alert issue created');
              } else {
                // Update existing issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssues[0].number,
                  body: `## Updated Health Check Results\n\n${body}`
                });
                console.log('✅ Existing health alert issue updated');
              }
            }
    timeout-minutes: 30
  token-usage-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'token_report'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Analyze OpenRouter usage
        uses: actions/github-script@v9.0.0
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          script: |
            const https = require('https');

            if (!process.env.OPENROUTER_API_KEY) {
              console.log('⚠️ OPENROUTER_API_KEY not configured, skipping token report');
              return;
            }

            console.log('📊 Fetching OpenRouter usage statistics...');

            // Note: This is a placeholder - actual OpenRouter API endpoint for usage may vary
            // Check OpenRouter docs for correct endpoint
            const options = {
              hostname: 'openrouter.ai',
              path: '/api/v1/auth/key',
              method: 'GET',
              headers: {
                'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}`,
              }
            };

            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', (chunk) => { data += chunk; });
              res.on('end', () => {
                try {
                  const result = JSON.parse(data);
                  console.log('OpenRouter API Key Info:', JSON.stringify(result, null, 2));
                  
                  // Log to audit trail
                  const fs = require('fs');
                  const entry = {
                    timestamp: new Date().toISOString(),
                    event: 'TOKEN_USAGE_CHECK',
                    data: result
                  };
                  
                  const dir = 'logs/agent-audit';
                  if (!fs.existsSync(dir)) {
                    fs.mkdirSync(dir, { recursive: true });
                  }
                  
                  fs.appendFileSync(`${dir}/token-usage.jsonl`, JSON.stringify(entry) + '\n');
                  console.log('✅ Token usage logged');
                } catch (e) {
                  console.error('❌ Failed to parse OpenRouter response:', e.message);
                  console.error('Response data:', data.substring(0, 500));
                }
              });
            });

            req.on('error', (e) => {
              console.error('❌ OpenRouter request failed:', e.message);
            });

            req.end();
    timeout-minutes: 60
  log-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'log_analysis'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Analyze audit logs
        run: |
          echo "📊 Audit Log Analysis"
          echo "===================="

          if [[ ! -f logs/agent-audit/audit.jsonl ]]; then
            echo "⚠️ No audit log found"
            exit 0
          fi

          echo ""
          echo "📈 Summary Statistics:"
          echo "Total entries: $(wc -l < logs/agent-audit/audit.jsonl)"
          echo ""

          echo "🤖 Agent Activity (last 100 entries):"
          tail -100 logs/agent-audit/audit.jsonl | jq -r '.actor' | sort | uniq -c | sort -rn
          echo ""

          echo "📋 Event Types (last 100 entries):"
          tail -100 logs/agent-audit/audit.jsonl | jq -r '.event_type' | sort | uniq -c | sort -rn
          echo ""

          echo "🏷️ Most Active Resources (last 100 entries):"
          tail -100 logs/agent-audit/audit.jsonl | jq -r 'select(.resource_number != null) | "#\(.resource_number): \(.resource_title)"' | head -10
          echo ""

          echo "⏰ Activity Timeline (last 24 hours):"
          tail -1000 logs/agent-audit/audit.jsonl | jq -r 'select(.timestamp > (now - 86400 | todate)) | "\(.timestamp) | \(.actor) | \(.event_type) | \(.resource_type) #\(.resource_number // "N/A")"' | tail -20
          echo ""

          echo "✅ Analysis complete. Review logs/agent-audit/audit.jsonl for full details."
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
