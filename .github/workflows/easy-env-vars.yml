# Easy Env Vars — briantist/ezenv@v1.0.0 integration (WR #15863)
#
# Sets persistent environment variables from a multi-line NAME=value block.
# Variables are processed in order so later values can reference earlier ones
# with bash-style parameter expansion (${VAR:-default}, $VAR, $(pwd)).
#
# Security controls (WR "Do Not Under-Scope"):
#   1. Pre-validation via products/easy-env-vars/lib/validate-cli.js rejects
#      malformed names, circular references, and shell metacharacters that
#      would be dangerous under the upstream action's bash `eval`.
#   2. The third-party action is pinned to the full v1.0.0 commit SHA — never
#      a floating tag — per docs/THIRD_PARTY_ACTION_AUDIT.md.
#   3. workflow_dispatch only by default so env payloads are intentional.
#      Optional repository_dispatch for automation with the same validation.
#   4. continue-on-error is NOT set on validation — a bad block fails the job
#      before ezenv runs. When individual earlier assignments fail inside the
#      parser, later safe assignments still resolve (continueOnError default).
#
# Upstream: https://github.com/briantist/ezenv (MIT, v1.0.0)
# Pinned SHA: f38d123244576d2065059c68a02ab332fc682199
# Disposition: accepted single-author action — see scripts/audit-third-party-actions.sh
#
# If validation fails: inspect the "Validate env block" step log for
# [error] lines (malformed / injection / circular). Fix the block and re-run.
# If ezenv itself fails after a green validation: check GITHUB_ENV is writable
# and the runner shell is bash.
name: Easy Env Vars

on:
  workflow_dispatch:
    inputs:
      env_block:
        description: Multi-line NAME=value definitions (bash expansion supported)
        required: true
        default: |
          SOME_FLAG=1
          THIS_GREETING=hello
          WITH_SPACES=a value with spaces
          THAT_VALUE=${THIS_GREETING:-hi} ${LOCATION:-world}
          ABS_SUBDIR=$(pwd)/test
        type: string
      seed_env:
        description: Optional prior GITHUB_ENV seed lines (NAME=value, one per line)
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      env_block:
        description: Multi-line NAME=value definitions
        required: true
        type: string
      seed_env:
        description: Optional prior GITHUB_ENV seed lines
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: easy-env-vars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  easy-env-vars:
    name: Validate and set env vars
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Seed prior environment (optional)
        if: ${{ inputs.seed_env != '' }}
        shell: bash
        env:
          SEED_ENV: ${{ inputs.seed_env }}
        run: |
          set -euo pipefail
          # Write seed lines through the same validator so seeds cannot smuggle injection.
          printf '%s\n' "$SEED_ENV" | node products/easy-env-vars/lib/validate-cli.js --stdin --write-github-env

      - name: Validate env block (pre-ezenv gate)
        id: validate
        shell: bash
        env:
          EASY_ENV_BLOCK: ${{ inputs.env_block }}
        run: |
          set -euo pipefail
          node products/easy-env-vars/lib/validate-cli.js --env-var EASY_ENV_BLOCK --json | tee /tmp/easy-env-vars.json
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Easy Env Vars (briantist/ezenv@v1.0.0)
        # Pinned to the v1.0.0 tag commit. Do not float on @v1 / @main.
        uses: briantist/ezenv@f38d123244576d2065059c68a02ab332fc682199
        with:
          env: ${{ inputs.env_block }}

      - name: Prove variables are available to subsequent steps
        shell: bash
        env:
          EASY_ENV_BLOCK: ${{ inputs.env_block }}
        run: |
          set -euo pipefail
          # Re-resolve expected values with the safe parser and compare to the
          # process environment after ezenv wrote GITHUB_ENV.
          mapfile -t NAMES < <(node -e '
            const { parseEnvBlock } = require("./products/easy-env-vars/lib/parse-env.js");
            const r = parseEnvBlock(process.env.EASY_ENV_BLOCK || "");
            if (!r.ok) { console.error(JSON.stringify(r.findings, null, 2)); process.exit(1); }
            for (const [k, v] of Object.entries(r.resolved)) {
              console.log(k + "=" + v);
            }
          ')
          failures=0
          for pair in "${NAMES[@]}"; do
            name="${pair%%=*}"
            expected="${pair#*=}"
            actual="${!name-}"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Mismatch for $name: expected='$expected' actual='$actual'"
              failures=$((failures + 1))
            else
              echo "OK $name=$actual"
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "::error::$failures variable(s) did not match after ezenv"
            exit 1
          fi

      - name: Job summary
        if: always()
        shell: bash
        env:
          EASY_ENV_BLOCK: ${{ inputs.env_block }}
          # Through the environment, not interpolated into the script body:
          # template expansion is text substitution done before the shell runs,
          # so a ref crafted to contain shell metacharacters would execute
          # (zizmor template-injection).
          RUN_ACTOR: ${{ github.actor }}
          RUN_REF: ${{ github.ref }}
        run: |
          {
            echo "## Easy Env Vars (WR #15863)"
            echo ""
            echo "- Action: \`briantist/ezenv@v1.0.0\`"
            echo "- Pinned SHA: \`f38d123244576d2065059c68a02ab332fc682199\`"
            echo "- Pre-validation: products/easy-env-vars/lib/validate-cli.js"
            echo "- Actor: \`$RUN_ACTOR\`"
            echo "- Ref: \`$RUN_REF\`"
            echo ""
            echo "### Input block"
            echo '```'
            printf '%s\n' "$EASY_ENV_BLOCK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
