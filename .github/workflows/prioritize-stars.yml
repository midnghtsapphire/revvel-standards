name: Prioritize Starred Repositories

on:
  # Hourly cadence moved to hourly-growth-prioritizer.yml (prioritize_and_optimize.py).
  # Keep manual dispatch for the legacy checkpointed prioritize_stars.py path.
  workflow_dispatch:

# Prevents concurrent execution runs from stomping state
concurrency:
  group: prioritize-stars-job
  cancel-in-progress: true

jobs:
  prioritize:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        # actions/checkout v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'httpx==0.28.1'

      - name: Run Prioritization Script
        env:
          # Prefer a fine-grained PAT (read:user stars) for the 5k/hr budget.
          # Falls back to the job token when GH_PAT is unset.
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/prioritize_stars.py --limit 250

      - name: Commit & Push Updated Priority List
        # stefanzweifel/git-auto-commit-action v5.1.0
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: "chore: update prioritized stars index [skip ci]"
          file_pattern: "PRIORITIZED_STARS.md prioritized_stars.json stars_state.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
