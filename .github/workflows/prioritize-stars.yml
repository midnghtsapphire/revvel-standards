name: Prioritize Starred Repositories

on:
  # Hourly cadence moved to hourly-growth-prioritizer.yml (prioritize_and_optimize.py).
  # Keep manual dispatch for the legacy checkpointed prioritize_stars.py path.
  workflow_dispatch:

# Prevents concurrent execution runs from stomping state
concurrency:
  group: prioritize-stars-job
  cancel-in-progress: true

jobs:
  prioritize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'httpx==0.28.1'

      - name: Run Prioritization Script
        env:
          # Requires the starring user's fine-grained PAT; the workflow job token
          # can only read the bot account's stars.
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "::error::Missing GH_PAT. Add a fine-grained PAT with read access to the target account's starred repositories."
            exit 1
          fi
          python scripts/prioritize_stars.py --limit 250

      - name: Commit & Push Updated Priority List
        # stefanzweifel/git-auto-commit-action v5.1.0
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: "chore: update prioritized stars index [skip ci]"
          file_pattern: "PRIORITIZED_STARS.md prioritized_stars.json stars_state.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
