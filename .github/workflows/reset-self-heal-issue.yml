name: 🔄 Reset Self-Heal Issue

# `description:` is not a workflow-level key — GitHub ignores it and
# actionlint rejects it (#17742). Kept as a comment, which is where this
# text was always going to be read from anyway.
# Reset a self-heal issue for reprocessing by removing and re-adding
# the self-heal labels, then dispatching openrouter-assignee.yml AND
# openrouter-triage.yml for that issue_number. Comments only claim what
# was actually dispatched (WR #17736).

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to reset
        required: true
        type: string

permissions:
  issues: write
  actions: write

jobs:
  reset-issue:
    name: Reset Issue #${{ inputs.issue_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate issue exists
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              core.setOutput('exists', 'true');
              core.setOutput('title', issue.title);
              console.log(`Found issue #${issueNumber}: ${issue.title}`);
            } catch (error) {
              core.setOutput('exists', 'false');
              core.error(`Issue #${issueNumber} not found`);
              process.exit(1);
            }

      - name: Get current labels
        if: steps.validate.outputs.exists == 'true'
        id: get-labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labels = issue.labels.map(l => l.name);
            console.log('Current labels:', labels.join(', '));
            core.setOutput('labels', JSON.stringify(labels));

      - name: Remove self-heal labels
        if: steps.validate.outputs.exists == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const SELF_HEAL_LABELS = ['auto-fix', 'ralph-loop', 'scorecard'];
            
            for (const label of SELF_HEAL_LABELS) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: label,
              }).catch(err => { if (err.status !== 404) throw err; });
              console.log(`Removed label: ${label}`);
            }

      - name: Add self-heal labels back
        if: steps.validate.outputs.exists == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const SELF_HEAL_LABELS = ['auto-fix', 'ralph-loop', 'scorecard'];
            
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: SELF_HEAL_LABELS,
              });
              console.log(`Added labels: ${SELF_HEAL_LABELS.join(', ')}`);
            } catch (error) {
              core.error(`Failed to add labels: ${error.message}`);
              throw error;
            }

      # Dispatch BOTH the assignee router and the triage cascade for this
      # specific issue. Assignee alone is first-line-of-sight routing and used
      # to be a no-op for already-labelled items; triage is what posts a real
      # analysis comment (WR #17736). Each dispatch is tracked independently so
      # the comment never claims a trigger that did not fire.
      # issue_number arrives via env: (not `${{ }}` in the run body) so a quote
      # in the input cannot break out of the shell string (#17644 ratchet).
      - name: Trigger OpenRouter recovery workflows
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        if: steps.validate.outputs.exists == 'true'
        run: |
          set +e
          assignee_ok=false
          triage_ok=false

          echo "Triggering openrouter-assignee.yml for issue #${ISSUE_NUMBER}..."
          if gh workflow run openrouter-assignee.yml \
            --repo "${{ github.repository }}" \
            --field dry_run=false \
            --field "issue_number=${ISSUE_NUMBER}"; then
            assignee_ok=true
            echo "✅ openrouter-assignee.yml dispatched for #${ISSUE_NUMBER}"
          else
            echo "❌ Failed to dispatch openrouter-assignee.yml"
          fi

          echo "Triggering openrouter-triage.yml for issue #${ISSUE_NUMBER}..."
          if gh workflow run openrouter-triage.yml \
            --repo "${{ github.repository }}" \
            --field "issue_number=${ISSUE_NUMBER}"; then
            triage_ok=true
            echo "✅ openrouter-triage.yml dispatched for #${ISSUE_NUMBER}"
          else
            echo "❌ Failed to dispatch openrouter-triage.yml"
          fi

          echo "assignee_success=${assignee_ok}" >> "$GITHUB_OUTPUT"
          echo "triage_success=${triage_ok}" >> "$GITHUB_OUTPUT"

          if [ "$assignee_ok" = true ] && [ "$triage_ok" = true ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post reset comment
        if: always() && steps.validate.outputs.exists == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TRIGGER_SUCCESS: ${{ steps.trigger.outputs.success }}
          ASSIGNEE_SUCCESS: ${{ steps.trigger.outputs.assignee_success }}
          TRIAGE_SUCCESS: ${{ steps.trigger.outputs.triage_success }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const triggerSuccess = process.env.TRIGGER_SUCCESS === 'true';
            const assigneeSuccess = process.env.ASSIGNEE_SUCCESS === 'true';
            const triageSuccess = process.env.TRIAGE_SUCCESS === 'true';
            const stamp = new Date().toISOString();

            const assigneeLine = assigneeSuccess
              ? '- Dispatched `openrouter-assignee.yml` for this issue (force re-route even if `openrouter` label present)'
              : '- ⚠️ **Failed** to dispatch `openrouter-assignee.yml`';
            const triageLine = triageSuccess
              ? '- Dispatched `openrouter-triage.yml` for this issue (produces the triage comment)'
              : '- ⚠️ **Failed** to dispatch `openrouter-triage.yml`';

            if (triggerSuccess) {
              const resetComment = [
                '## 🔄 Self-Heal Issue Reset',
                '',
                'This issue has been reset for reprocessing.',
                '',
                '**Actions taken:**',
                '- Removed self-heal labels: `auto-fix`, `ralph-loop`, `scorecard`',
                '- Re-added self-heal labels',
                assigneeLine,
                triageLine,
                '',
                '**What this guarantees:** the two downstream workflows were *dispatched* for this issue number. It does **not** guarantee triage succeeds (that depends on API keys/credits and the issue content). Watch the Actions runs and the next triage comment on this issue.',
                '',
                `_Reset by \`reset-self-heal-issue\` workflow — ${stamp}_`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: resetComment,
              });
              console.log('Posted success reset comment (dispatch confirmed)');
            } else {
              const errorComment = [
                '## ❌ Self-Heal Issue Reset Incomplete',
                '',
                'Label reset ran, but one or more downstream recovery dispatches failed.',
                '',
                '**Actions taken:**',
                '- Removed self-heal labels: `auto-fix`, `ralph-loop`, `scorecard`',
                '- Re-added self-heal labels',
                assigneeLine,
                triageLine,
                '',
                'Adding `needs-human` label for manual inspection. Re-run this workflow after checking Actions permissions (`actions: write`) and that both target workflows exist on the default branch.',
                '',
                `_Reset by \`reset-self-heal-issue\` workflow — ${stamp}_`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: errorComment,
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-human'],
              });
              console.log('Posted error comment and added needs-human label');
              core.setFailed('One or more recovery workflow dispatches failed');
            }

      - name: Summary
        if: always() && steps.validate.outputs.exists == 'true'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.validate.outputs.title }}
          TRIGGER_SUCCESS: ${{ steps.trigger.outputs.success }}
          ASSIGNEE_SUCCESS: ${{ steps.trigger.outputs.assignee_success }}
          TRIAGE_SUCCESS: ${{ steps.trigger.outputs.triage_success }}
        run: |
          echo "=========================================="
          echo "Issue #${ISSUE_NUMBER} reset report"
          echo "=========================================="
          echo ""
          echo "Issue: ${ISSUE_TITLE}"
          echo "Assignee dispatch: ${ASSIGNEE_SUCCESS:-unknown}"
          echo "Triage dispatch:   ${TRIAGE_SUCCESS:-unknown}"
          echo ""
          if [ "${TRIGGER_SUCCESS}" = "true" ]; then
            echo "Both recovery workflows were dispatched for this issue."
          else
            echo "Reset did NOT fully succeed — see the issue comment and needs-human label."
            exit 1
          fi