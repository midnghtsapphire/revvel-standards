name: Agent Command Window CI

on:
  pull_request:
    paths:
      - .github/agent-router.json
      - .github/scripts/agent-command-router.mjs
      - .github/tests/agent-command-router.test.mjs
      - .github/workflows/agent-command-window.yml
      - .github/workflows/agent-command-window-ci.yml
      - .github/workflows/agent-request-delivery.yml
      - scripts/audrey-gitar-bridge/**
      - .github/workflows/audrey-bridge.yml
      - .github/workflows/audrey-facebook-publish.yml
      - .github/workflows/audit-review-events.yml
      - .github/workflows/wr-pr-creation.yml
  push:
    branches: [main]
    paths:
      - .github/agent-router.json
      - .github/scripts/agent-command-router.mjs
      - .github/tests/agent-command-router.test.mjs
      - .github/workflows/agent-command-window.yml
      - .github/workflows/agent-command-window-ci.yml
      - .github/workflows/agent-request-delivery.yml
      - scripts/audrey-gitar-bridge/**
      - .github/workflows/audrey-bridge.yml
      - .github/workflows/audrey-facebook-publish.yml
      - .github/workflows/audit-review-events.yml
      - .github/workflows/wr-pr-creation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-router:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Test agent aliases, routing, authorization, and status state
        run: node --test .github/tests/agent-command-router.test.mjs

  # 2026-11-14: additive offline coverage; no credentials or network transport.
  test-audrey-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed repository changes for offline tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test request provenance, WR opt-outs, relay and publication safety
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/audrey-gitar-bridge/tests -v
