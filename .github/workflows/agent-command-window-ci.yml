name: Agent Command Window CI

on:
  pull_request:
    paths:
      - .github/agent-router.json
      - .github/scripts/agent-command-router.mjs
      - .github/tests/agent-command-router.test.mjs
      - .github/workflows/agent-command-window.yml
      - .github/workflows/agent-command-window-ci.yml
      - .github/workflows/agent-request-delivery.yml
  push:
    branches: [main]
    paths:
      - .github/agent-router.json
      - .github/scripts/agent-command-router.mjs
      - .github/tests/agent-command-router.test.mjs
      - .github/workflows/agent-command-window.yml
      - .github/workflows/agent-command-window-ci.yml
      - .github/workflows/agent-request-delivery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-router:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Test agent aliases, routing, authorization, and status state
        run: node --test .github/tests/agent-command-router.test.mjs
