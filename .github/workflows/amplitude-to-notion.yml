name: Amplitude → Notion Agent
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: 7 13 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: If 'true', log the Notion payload but do not POST.
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
permissions:
  contents: read
concurrency:
  group: amplitude-to-notion-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  sync:
    name: Sync Amplitude snapshot to Notion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run Amplitude → Notion agent
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
          AMPLITUDE_CHART_ID: ${{ vars.AMPLITUDE_CHART_ID }}
          AMPLITUDE_REGION: ${{ vars.AMPLITUDE_REGION }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_AMPLITUDE_DATABASE_ID: ${{ secrets.NOTION_AMPLITUDE_DATABASE_ID }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/amplitude-to-notion.js
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
