name: Workflow Action-Ref Auditor
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: workflow-action-ref-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    name: "Audit uses: refs across all workflows"
    runs-on: ubuntu-latest
    outputs:
      broken_count: ${{ steps.audit.outputs.broken_count }}
      broken_refs: ${{ steps.audit.outputs.broken_refs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit workflow action references
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # Extract every `uses: owner/repo@ref` from workflow YAML files.
          # Skip:
          #   - lines that start with `#` (commented-out)
          #   - `./` local action paths
          #   - `docker://` image refs
          #
          # CANDIDATES is everything left after those three exclusions. It is
          # deliberately NOT filtered to legal owner/repo names.
          # `-n` prints a line number and `-h` suppresses the filename, so the
          # old pipeline's `sed 's/^[^:]+:[0-9]+:\s*//'` — which expects
          # `path:line:` — matched nothing, and every candidate arrived still
          # carrying `87:        uses: `. The legal-name filter then discarded
          # ALL of them: this audit reported "✅ All 0 action refs resolved" on
          # every run and had never validated a single ref (#17832).
          #
          # Keep the filename (`-E -n`, no `-h`) so the prefix is the shape the
          # sed expects, strip the two prefixes separately, and drop the
          # trailing `# v1.2.3` comment that SHA-pinned refs carry.
          mapfile -t CANDIDATES < <(
            grep -REn '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^#[:space:]]+' \
              .github/workflows/ .github/actions/ 2>/dev/null \
              | sed -E 's/^[^:]+:[0-9]+://' \
              | sed -E 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//' \
              | tr -d '"' | tr -d "'" \
              | sed -E 's/[[:space:]]+#.*$//' \
              | grep -vE '^(\./|docker:\/\/|#)' \
              | sort -u
          )

          # This step used to end its extraction with
          #
          #     | grep -E '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@'
          #
          # which kept only refs whose owner/repo are legal GitHub names — and
          # so DROPPED, before validation, the most broken kind of ref there
          # is: one that is not even a legal name. Two refs containing CJK
          # characters sat in social-media-automation.yml failing every merged
          # PR at "Prepare all required actions", and this audit reported
          # "✅ All N action refs resolved" the whole time, because N was the
          # count it could parse presented as the count that exists (#17832).
          #
          # A ref this step cannot parse is now a FINDING, not a line to skip.
          BROKEN=()
          REFS=()
          for candidate in "${CANDIDATES[@]}"; do
            if [[ "${candidate}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@ ]]; then
              REFS+=("${candidate}")
            else
              BROKEN+=("${candidate}")
              echo "::error::Unparseable action ref: ${candidate} — not a legal owner/repo@ref. The runner resolves every step's action before any \`if:\` is evaluated, so this fails the job even when the step would be skipped."
            fi
          done

          echo "Discovered ${#CANDIDATES[@]} unique action refs (${#REFS[@]} parseable, ${#BROKEN[@]} unparseable)."
          for full_ref in "${REFS[@]}"; do
            owner_repo="${full_ref%@*}"
            ref="${full_ref#*@}"
            # Strip subdirectory paths like `actions/cache/restore@v4` → `actions/cache`.
            owner="${owner_repo%%/*}"
            repo_with_path="${owner_repo#*/}"
            repo="${repo_with_path%%/*}"

            # Resolve via GitHub API. A ref can be a tag, branch, OR commit SHA.
            # Try in that order; first 2xx wins.
            ok=0
            for endpoint in "git/refs/tags/${ref}" "git/refs/heads/${ref}" "commits/${ref}"; do
              status=$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${owner}/${repo}/${endpoint}")
              if [ "${status}" = "200" ]; then
                ok=1
                break
              fi
            done

            if [ "${ok}" -ne 1 ]; then
              BROKEN+=("${full_ref}")
              echo "::error::Broken action ref: ${full_ref} (https://github.com/${owner}/${repo})"
            fi
          done

          {
            echo "broken_count=${#BROKEN[@]}"
            if [ "${#BROKEN[@]}" -gt 0 ]; then
              # Multi-line output via heredoc.
              echo "broken_refs<<EOF"
              printf '%s\n' "${BROKEN[@]}"
              echo "EOF"
            else
              echo "broken_refs="
            fi
          } >> "$GITHUB_OUTPUT"

          if [ "${#BROKEN[@]}" -gt 0 ]; then
            echo ""
            echo "❌ ${#BROKEN[@]} broken action ref(s) found."
            exit 1
          fi
          echo "✅ All ${#CANDIDATES[@]} action refs parsed and resolved."
      - name: Detect unpinned (non-SHA) action refs
        id: sha-pin-audit
        run: |
          set -uo pipefail

          # Find every uses: ref that is NOT already pinned to a 40-char commit SHA.
          # This catches mutable tags (@v4, @v1.2.1, @main, etc.) that can be
          # silently re-pointed to a different commit — a supply-chain risk.
          mapfile -t UNPINNED < <(
            grep -RhnE '^\s*-?\s*uses:\s*[^#[:space:]]+' .github/workflows/ .github/actions/ 2>/dev/null \
              | sed -E 's/^([^:]+:[0-9]+):\s*/\1 /' \
              | grep -vE '^\s*#' \
              | grep -E '^[^ ]+ -?\s*uses:\s*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@' \
              | awk '{
                  for (i=1;i<=NF;i++) {
                    if ($i ~ /uses:/) { ref=$(i+1); break }
                  }
                  if (ref !~ /@[a-f0-9]{40}/) print ref
                }' \
              | tr -d '"' | tr -d "'" \
              | grep -vE '^(\./|docker:\/\/)' \
              | sort -u
          )

          if [ "${#UNPINNED[@]}" -eq 0 ]; then
            echo "✅ All action refs are pinned to a full commit SHA."
          else
            echo "⚠️ ${#UNPINNED[@]} action ref(s) are NOT pinned to a commit SHA:"
            printf '  - %s\n' "${UNPINNED[@]}"
            echo ""
            echo "Pin each ref to its full commit SHA and add the tag as a comment, e.g.:"
            echo "  uses: actions/checkout@v4"
          fi

          {
            echo "unpinned_count=${#UNPINNED[@]}"
            if [ "${#UNPINNED[@]}" -gt 0 ]; then
              echo "unpinned_refs<<EOF"
              printf '%s\n' "${UNPINNED[@]}"
              echo "EOF"
            else
              echo "unpinned_refs="
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Open / update tracking issue (scheduled or main-branch run)
        if: |
          failure() &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/github-script@v9.0.0
        env:
          BROKEN_REFS: ${{ steps.audit.outputs.broken_refs }}
        with:
          script: |
            const broken = (process.env.BROKEN_REFS || '').trim();
            if (!broken) return;
            const lines = broken.split('\n').filter(Boolean);

            const title = `[AUTO-ERROR] Workflow action-ref auditor found ${lines.length} broken ref(s)`;
            const body = [
              '## Broken action references detected',
              '',
              'The [Workflow Action-Ref Auditor](.github/workflows/workflow-action-ref-audit.yml) found `uses:` lines that point to refs which no longer resolve on GitHub. Any workflow job that contains one of these refs will fail at "Set up job" before any step runs — including safety/skip steps.',
              '',
              '### Broken refs',
              '',
              ...lines.map(r => `- \`${r}\``),
              '',
              '### How to fix',
              '',
              '1. Visit each ref above and check what tags / branches the upstream repo actually publishes.',
              '2. Pin to a real published tag (preferred) or branch.',
              '3. If the upstream repo was renamed/deleted, find a maintained fork or replace the action.',
              '4. After fixing, re-run this workflow via `workflow_dispatch` to confirm.',
              '',
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_This issue is opened automatically by `.github/workflows/workflow-action-ref-audit.yml`. It will be updated rather than re-created on subsequent failures._',
            ].join('\n');

            // Reuse a single tracking issue so we don't spam.
            const labels = ['auto-error', 'workflow-broken-ref', 'priority-p0'];
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-broken-ref',
              per_page: 5,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body,
              });
              core.notice(`Updated existing tracking issue #${issue.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.notice(`Opened tracking issue #${created.data.number}.`);
            }
      - name: Close tracking issue when audit is clean
        if: |
          success() &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/github-script@v9.0.0
        continue-on-error: true
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-broken-ref',
              per_page: 5,
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Auditor run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) is clean. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.notice(`Closed tracking issue #${issue.number}.`);
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
