name: PR Lifecycle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  check_suite:
    types: [completed]
  workflow_run:
    # Allowlist of workflows whose completion should re-trigger PR check-state
    # aggregation. Matched verbatim, case-sensitive, against each workflow's
    # `name:` field (NOT its filename).
    #
    # Criterion for inclusion: the workflow is triggered by pull_request /
    # pull_request_target / push (i.e. runs against a PR's own commits) AND
    # represents real CI/validation signal (tests, lint, build, security scan,
    # policy/gate check, doc-freshness) whose pass/fail should affect the PR's
    # ready-to-merge labels.
    #
    # Deliberately excluded: label/comment/routing bots, advisory-only review
    # bots that never gate the PR, on-demand external-review CLI wrappers,
    # deploy/mirror/telemetry workflows, energy/a11y measurement steps that
    # run with `continue-on-error: true` throughout, and pr-state-orchestrator
    # (a sibling label-consumer, not a check producer).
    #
    # NOTE FOR FUTURE WORKFLOW AUTHORS: if you add a new PR-triggered
    # CI/validation workflow whose pass/fail should affect PR ready-to-merge
    # labels, add its `name:` here too. Otherwise its completion will not
    # re-trigger check-state aggregation (the PR will still be re-evaluated
    # on its next `pull_request` event or whenever any other allow-listed
    # workflow completes on the same SHA, since check-state re-aggregates
    # ALL check suites for the SHA via listSuitesForRef() — so missing an
    # entry here only delays the label update rather than losing signal).
    #
    # Rationale: replacing this with `["*"]` fanned out to every one of the
    # repo's 166+ workflows (scheduled crons, issue-comment routers, label
    # watchdogs, deploys, telemetry — none of which touch PR check state)
    # and exhausted the shared GitHub App installation's 5,000 req/h API
    # rate-limit budget on 2026-07-13. See PR #15892 / issue #15887.
    workflows:
      - "Agent Fingerprint Gate"
      - "Anti-Scaffolding Enforcer"
      - "Auditor Controller"
      - "ChaosMender"
      - "CI Error Prevention Tests"
      - "CodeQL"
      - "Connections Registry"
      - "Cypress E2E — life-insurance-lead-engine"
      - "Docs Freshness Check"
      - "Fix-WR Gate"
      - "No-Destroy Guard"
      - "No Root Junk"
      - "SAML SSO Registration"
      - "SEO + A11y Guard"
      - "Secrets Map"
      - "Semgrep SAST"
      - "Intelligent Code Quality Scanner"
      - "Template Sync Check"
      - "Test BITO AI Integration"
      - "Trivy"
      - "Verify Security Fix"
      - "Workflow Action-Ref Auditor"
      - "WR Lint"
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-lifecycle-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  pr-state:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Update PR state labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            core.info(`PR #${pr.number} action=${context.payload.action} draft=${pr.draft} state=${pr.state}`);

  check-state:
    if: github.event_name == 'check_suite' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate check state for head SHA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const headSha = context.payload.workflow_run?.head_sha
              || context.payload.check_suite?.head_sha;
            if (!headSha) {
              core.info('No head SHA on payload; nothing to do.');
              return;
            }
            core.info(`Aggregating check state for ${headSha}`);

            // Rate-limit guard: bail early if remaining budget is low.
            // See issue #15887 for context.
            try {
              const { data: rl } = await github.rest.rateLimit.get();
              const remaining = rl?.resources?.core?.remaining ?? 0;
              if (remaining < 100) {
                core.warning(`Core API budget low (${remaining} remaining); skipping aggregation.`);
                return;
              }
            } catch (e) {
              core.warning(`rateLimit.get failed: ${e.message}`);
            }

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const matching = prs.filter(p => p.head.sha === headSha);
            if (matching.length === 0) {
              core.info('No open PRs match this head SHA.');
              return;
            }

            const { data: suites } = await github.rest.checks.listSuitesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            core.info(`Found ${suites.total_count} check suites for ${matching.length} PR(s).`);
