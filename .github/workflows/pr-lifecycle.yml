name: PR Lifecycle - check-state

on:
  workflow_run:
    workflows:
      - "CI"
      - "CodeQL"
      - "Intelligent Code Quality Scanner"
      - "Lint Markdown (lint-md)"
      - "Security Scan"
      - "Super-Linter"
      - "Tests"
      - "Validate Workflows"
    types:
      - completed

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  check-state:
    # Scoped allowlist above (workflow_run.workflows) — never use "*" here.
    # Inclusion criteria: workflow must run on `pull_request` and produce
    # meaningful check/validation signal for PR gating. Keep alphabetized
    # (case-insensitive). Enforced by tests/workflow-yaml-validation.test.js.
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Report triggering workflow
        run: |
          echo "Triggered by: ${{ github.event.workflow_run.name }}"
          echo "Conclusion:   ${{ github.event.workflow_run.conclusion }}"
          echo "Head branch:  ${{ github.event.workflow_run.head_branch }}"
          echo "Head SHA:     ${{ github.event.workflow_run.head_sha }}"
