name: PR Lifecycle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  check_suite:
    types: [completed]
  # NOTE: workflow_run's `workflows:` filter matches the `name:` field of a
  # workflow (verbatim, case-sensitive) — NOT the filename. Keep this list in
  # sync with the `name:` of any PR-triggered CI/validation workflow whose
  # pass/fail should affect PR ready-to-merge labels.
  #
  # Criterion for inclusion: workflow is triggered by pull_request /
  # pull_request_target / push (i.e. actually runs against a PR's own commits)
  # AND represents real CI/validation signal (tests, lint, build, security
  # scans, policy/gate checks, doc-freshness).
  #
  # Deliberately EXCLUDED: label/comment/routing bots, advisory-only review
  # bots that never gate the PR, on-demand external-review CLI wrappers,
  # deploy/mirror/telemetry workflows, energy/a11y measurement steps that run
  # with continue-on-error throughout, and sibling label-consumers (not check
  # producers).
  #
  # If you add a new PR-triggered CI/validation workflow whose pass/fail should
  # affect PR ready-to-merge labels, add its `name:` here too. Previously this
  # was `["*"]`, which fanned out to every one of the repo's 166+ workflows on
  # every completion — burning the shared GitHub App's 5,000 req/h rate-limit
  # budget for zero benefit. See #15887 / #15892.
  #
  # Note: workflow_run is required (cannot be replaced by check_suite) because
  # per GitHub docs, check_suite does not fire for check suites created by
  # GitHub Actions itself — it only fires for external, non-Actions
  # check-reporting integrations.
  workflow_run:
    # Scoped allowlist (2026-07-13, post rate-limit-exhaustion incident — see
    # PR #15887 for the related check-state hardening). `workflows: ["*"]`
    # re-fired this job on EVERY one of the repo's 166+ workflows completing
    # — including purely internal routers, schedulers, deploys, and telemetry
    # that never touch a PR's check state — burning a pulls.list() +
    # checks.listSuitesForRef() call each time regardless of relevance. That
    # wildcard fan-out was the dominant amplifier that pinned the shared
    # GitHub App's hourly rate-limit budget at zero for a full hour.
    #
    # check_suite (above) does NOT make this redundant: GitHub suppresses
    # check_suite events for suites created by GitHub Actions itself
    # (anti-recursion guard — see "Events that trigger workflows" docs), so
    # workflow_run is the ONLY signal this job gets for GitHub
    # Actions-native workflow completions. check_suite only fires for
    # external/non-Actions check-reporting integrations, so it stays as a
    # secondary trigger for any future non-Actions check provider.
    #
    # Listed below: every workflow that (a) is triggered by pull_request,
    # pull_request_target, or push — i.e. runs against a PR's own commits —
    # AND (b) represents real CI/validation signal (tests, lint, build,
    # security scans, policy/gate checks, doc-freshness) whose pass/fail
    # should affect ready-to-merge labels. Deliberately excludes label/
    # comment/routing bots, deploy, mirror, and telemetry workflows that
    # trigger on pull_request but never validate the PR's own code.
    #
    # IMPORTANT: if you add a new PR-triggered CI/validation workflow whose
    # pass/fail should affect PR ready-to-merge labels, add its `name:`
    # value here too — this filter matches by the workflow's `name:` field
    # verbatim (case-sensitive), NOT by filename, and a mismatch means the
    # trigger silently never fires for it. Keep this list case-insensitively
    # alphabetical — tests/workflow-yaml-validation.test.js enforces both
    # that ordering and that every entry still matches a real workflow name.
    workflows:
      - "Agent Fingerprint Gate"
      - "Anti-Scaffolding Enforcer"
      - "Auditor Controller"
      - "ChaosMender"
      - "CI Error Prevention Tests"
      - "CodeQL"
      - "Connections Registry"
      - "Cypress E2E — life-insurance-lead-engine"
      - "Docs Freshness Check"
      - "Fix-WR Gate"
      - "Intelligent Code Quality Scanner"
      - "Lint Markdown (markdownlint-cli)"
      - "No Root Junk"
      - "No-Destroy Guard"
      - "Semgrep SAST"
      - "SEO + A11y Guard"
      - "Super-Linter"
      - "Template Sync Check"
      - "Test BITO AI Integration"
      - "Trivy"
      - "Verify Security Fix"
      - "Workflow Action-Ref Auditor"
      - "WR Lint"
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-lifecycle-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # METAL Scripts-as-CI (oaudrey governance/METAL principles #1/#3/#8): logic
  # lives in scripts/ci/*.js — versioned, runnable anywhere. These jobs are thin
  # invokers. runs-on: self-hosted (CARESSE) — immune to the GitHub-hosted
  # billing lock; shell: cmd because CARESSE's PowerShell execution policy
  # blocks runner temp scripts (PSSecurityException).
  # ---------------------------------------------------------------------------
  pr-state:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: Update PR state labels
        shell: cmd
        run: node scripts/ci/pr-lifecycle.js pr-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-state:
    if: github.event_name == 'check_suite' || github.event_name == 'workflow_run'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: Re-aggregate check state for head SHA
        shell: cmd
        run: node scripts/ci/pr-lifecycle.js check-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
