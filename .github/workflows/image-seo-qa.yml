name: image-seo-qa

on:
  pull_request:
    paths:
      - "**/*.webp"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "public/**"
      - "assets/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Filename slug check
        env:
          GITHUB_BASE_REF: "${{ github.base_ref }}"
        run: |
          set -e
          bad=0
          base_ref="$GITHUB_BASE_REF"
          git fetch origin "$base_ref" --depth=1 || true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            b=$(basename "$f")
            if echo "$b" | grep -Eiq '^(IMG_|DSC_|Screenshot|image)([_.-]|$)'; then
              echo "::error file=$f::Non-SEO filename: $b"
              bad=1
            fi
          done < <(git diff --name-only "origin/${base_ref}...HEAD" 2>/dev/null | grep -E '\.(webp|png|jpe?g)$' || true)
          exit $bad
