# PR gate: reject non-SEO image filenames (IMG_, DSC_, Screenshot, image.*)
name: image-seo-qa

on:
  pull_request:
    paths:
      - "**/*.webp"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "public/**"
      - "assets/**"
      - "scripts/image-seo-filename-qa.mjs"
      - "scripts/image-seo-build-pack.mjs"

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ""

      - name: Filename slug check
        env:
          GITHUB_BASE_REF: "${{ github.base_ref }}"
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref" --depth=1 || true
          mapfile -t files < <(git diff --name-only "origin/${base_ref}...HEAD" 2>/dev/null | grep -E '\.(webp|png|jpe?g)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No image files changed — QA pass"
            exit 0
          fi
          # Quote array expansion (CLAUDE.md gotcha #5 / SC2128)
          node scripts/image-seo-filename-qa.mjs "${files[@]}"
