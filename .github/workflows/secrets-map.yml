# Regenerates docs/SECRETS_MAP.md (secret NAMES/locations only — never values)
# whenever the workflows change, so the map can never drift from what the fleet
# actually consumes. Companion to connections-registry.yml; generator is
# scripts/secrets-map.js. See docs/SECRETS_MANAGEMENT.md for the single write
# path (GitHub Actions repository secrets — Doppler is decommissioned).
name: Secrets Map

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - scripts/secrets-map.js
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/secrets-map.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Freshness check (PRs — fail if a stale map was committed)
        if: github.event_name == 'pull_request'
        run: node scripts/secrets-map.js --check
      - name: Regenerate map
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/secrets-map.js
      - name: Commit refreshed map (main only)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/SECRETS_MAP.md
          if git diff --cached --quiet; then
            echo "Secrets map already fresh."
          else
            git commit -m "chore(secrets): regenerate SECRETS_MAP.md [skip ci]"
            # Retry with backoff — other automation pushes to main constantly.
            for i in 1 2 3 4; do git push && break || { git pull --rebase; sleep $((2**i)); }; done
          fi
