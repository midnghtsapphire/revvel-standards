name: UI Creation Engine

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      business:
        description: 'Business name'
        required: true
        type: string
      industry:
        description: 'Industry type'
        required: true
        type: string
      location:
        description: 'Geographic location'
        required: true
        type: string
      services:
        description: 'Services offered'
        required: false
        type: string
      platform:
        description: 'Platform type (website, mobile-app, web-app)'
        required: false
        type: string
        default: 'website'
      issue_number:
        description: 'Issue number to update with results'
        required: false
        type: number

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  ui-creation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues' && github.event.label.name == 'ui-creation') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@copilot ui-engine'))))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse issue or use workflow inputs
        id: parse
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            
            let business, industry, location, services, platform, issueNumber;
            
            if (context.eventName === 'workflow_dispatch') {
              business = '${{ inputs.business }}';
              industry = '${{ inputs.industry }}';
              location = '${{ inputs.location }}';
              services = '${{ inputs.services }}' || '';
              platform = '${{ inputs.platform }}' || 'website';
              issueNumber = '${{ inputs.issue_number }}' || '';
            } else {
              issueNumber = context.issue.number;
              const issueBody = context.payload.issue?.body || '';
              
              // Parse fields from issue body (expecting structured format)
              const businessMatch = issueBody.match(/Business:\s*(.+)/);
              const industryMatch = issueBody.match(/Industry:\s*(.+)/);
              const locationMatch = issueBody.match(/Location:\s*(.+)/);
              const servicesMatch = issueBody.match(/Services:\s*(.+)/);
              const platformMatch = issueBody.match(/Platform:\s*(.+)/);
              
              business = businessMatch ? businessMatch[1].trim() : '';
              industry = industryMatch ? industryMatch[1].trim() : '';
              location = locationMatch ? locationMatch[1].trim() : '';
              services = servicesMatch ? servicesMatch[1].trim() : '';
              platform = platformMatch ? platformMatch[1].trim() : 'website';
            }
            
            // Sanitize inputs (alphanumeric, spaces, dashes, commas, dots only)
            const sanitize = (str) => str.replace(/[^a-zA-Z0-9 ,.-]/g, '');
            
            business = sanitize(business);
            industry = sanitize(industry);
            location = sanitize(location);
            services = sanitize(services);
            platform = sanitize(platform);
            
            // Set outputs
            core.setOutput('business', business);
            core.setOutput('industry', industry);
            core.setOutput('location', location);
            core.setOutput('services', services);
            core.setOutput('platform', platform);
            core.setOutput('issue_number', issueNumber);
            
            console.log('Parsed inputs:');
            console.log(`  Business: ${business}`);
            console.log(`  Industry: ${industry}`);
            console.log(`  Location: ${location}`);
            console.log(`  Services: ${services}`);
            console.log(`  Platform: ${platform}`);
            console.log(`  Issue: ${issueNumber}`);

      - name: Run UI Creation Engine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ui-creation-output
          
          node scripts/ui-creation-engine.js \
            --business="${{ steps.parse.outputs.business }}" \
            --industry="${{ steps.parse.outputs.industry }}" \
            --location="${{ steps.parse.outputs.location }}" \
            --services="${{ steps.parse.outputs.services }}" \
            --platform="${{ steps.parse.outputs.platform }}" \
            --output="./ui-creation-output"

      - name: Upload output as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-creation-output
          path: ui-creation-output/
          retention-days: 30

      - name: Create summary comment
        if: steps.parse.outputs.issue_number != ''
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const issueNumber = ${{ steps.parse.outputs.issue_number }};
            
            // Read the README from output
            const readmePath = './ui-creation-output/README.md';
            let summary = '';
            
            if (fs.existsSync(readmePath)) {
              summary = fs.readFileSync(readmePath, 'utf8');
            } else {
              summary = '⚠️ UI Creation Engine completed but README not found.';
            }
            
            // Read competitive analysis summary
            const analysisPath = './ui-creation-output/research/competitive-analysis.md';
            let analysisPreview = '';
            
            if (fs.existsSync(analysisPath)) {
              const analysis = fs.readFileSync(analysisPath, 'utf8');
              const lines = analysis.split('\n').slice(0, 30);
              analysisPreview = lines.join('\n');
              analysisPreview += '\n\n[See full analysis in artifacts]';
            }
            
            const comment = `## 🎨 UI Creation Engine Complete
            
            The UI Creation Engine has finished analyzing the competitive landscape and generating recommendations.
            
            ### Output Summary
            
            ${summary}
            
            ### Competitive Analysis Preview
            
            ${analysisPreview}
            
            ---
            
            **📁 Download Full Output**: See the "ui-creation-output" artifact in the [Actions run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            
            **Next Steps**:
            1. Download and review the artifacts
            2. Review competitive analysis in \`research/competitive-analysis.md\`
            3. Implement UI recommendations from \`design/ui-recommendations.md\`
            4. Apply SEO metadata from \`seo/metadata.md\`
            5. Optimize images using \`images/optimization-plan.md\`
            
            🎨 **Pixel signing off**`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

      - name: Label issue as complete
        if: steps.parse.outputs.issue_number != '' && github.event_name == 'issues'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.parse.outputs.issue_number }},
              labels: ['ui-creation-complete']
            });
