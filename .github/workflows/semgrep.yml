name: Semgrep SAST
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 15 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.161.0
    if: (github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - name: Mark workspace safe (avoid 'dubious ownership' from container UID mismatch)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run Semgrep scan (OSS rule packs)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/github-actions \
            --config=p/dockerfile \
            --config=p/yaml \
            --sarif --sarif-output=semgrep.sarif \
            --metrics=off \
            --no-error \
            || true  # don't fail the job; we surface findings via SARIF
      - name: Upload SARIF to GitHub Code Scanning
        if: hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3.35.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Semgrep blocking gate (ERROR severity, diff-aware)
        # 2026-05-21 (Claude): the SARIF upload above is advisory; this step
        # blocks on high-severity security + secret findings that the PR
        # INTRODUCES. It is diff-aware (--baseline-commit) so the existing
        # backlog across the repo does not block unrelated PRs — only
        # ERROR-severity findings new to the branch fail the job. Runs on PRs
        # only (push/schedule have no base to diff against).
        if: github.event_name == 'pull_request'
        run: |
          semgrep scan \
            --config=p/secrets \
            --config=p/security-audit \
            --severity=ERROR \
            --error \
            --metrics=off \
            --baseline-commit "${{ github.event.pull_request.base.sha }}"
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
