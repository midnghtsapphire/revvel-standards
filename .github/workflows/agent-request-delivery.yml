name: Agent Request Delivery

on:
  repository_dispatch:
    types: [agent_requested]

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deliver request to the agent gateway
        env:
          AGENT: ${{ github.event.client_payload.agent }}
          GATEWAY_TOKEN: ${{ secrets.REVVEL_AGENT_GATEWAY_TOKEN }}
          GATEWAY_URL: ${{ secrets.REVVEL_AGENT_GATEWAY_URL }}
          GH_API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.client_payload.number }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
        shell: bash
        run: |
          set -uo pipefail

          post_status() {
            local status="$1"
            local summary="$2"
            local body

            body="$(jq -n \
              --arg agent "$AGENT" \
              --arg number "$NUMBER" \
              --arg request_id "$REQUEST_ID" \
              --arg status "$status" \
              --arg summary "$summary" \
              '{
                event_type: "agent_status",
                client_payload: {
                  agent: $agent,
                  number: ($number | tonumber),
                  request_id: $request_id,
                  status: $status,
                  summary: $summary
                }
              }')"

            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --data "$body" \
              "$GH_API_URL/repos/$REPOSITORY/dispatches"
          }

          if [[ -z "$GATEWAY_URL" ]]; then
            post_status "needs-adapter" "Trigger received; the central agent gateway has not been connected yet."
            exit 0
          fi

          headers=(
            --header "Content-Type: application/json"
            --header "X-Revvel-Request-ID: $REQUEST_ID"
          )
          if [[ -n "$GATEWAY_TOKEN" ]]; then
            headers+=(--header "Authorization: Bearer $GATEWAY_TOKEN")
          fi

          http_code="$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "${headers[@]}" \
            --data "$REQUEST_JSON" \
            "$GATEWAY_URL")"

          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            post_status "delivered" "The request was delivered to the $AGENT adapter."
            exit 0
          fi

          post_status "failed" "The $AGENT adapter returned HTTP $http_code."
          exit 1
