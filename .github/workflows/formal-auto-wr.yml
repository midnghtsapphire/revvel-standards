# Formal dual-path XOR → auto WR artifacts (and optional draft issue).
# NEVER auto-merges. Human reviews WR + PR.
name: formal-auto-wr

on:
  workflow_dispatch:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: "30 12 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  formal-wr:
    name: Formal → WR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Ensure formal report
        id: report
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ ! -f artifacts/formal-report.json ]; then
            if [ -f disaster-recovery/grok-build-2026-08-05/formal/formal-report.json ]; then
              cp disaster-recovery/grok-build-2026-08-05/formal/formal-report.json artifacts/
            elif [ -f disaster-recovery/formal-report.json ]; then
              cp disaster-recovery/formal-report.json artifacts/
            else
              echo "No formal report yet — upload artifact or run verifier offline"
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Generate auto-WRs
        if: steps.report.outputs.found == 'true'
        run: |
          set -euo pipefail
          if [ ! -f scripts/formal-auto-wr.mjs ]; then
            echo "scripts/formal-auto-wr.mjs missing — pack not fully landed"
            exit 0
          fi
          node scripts/formal-auto-wr.mjs

      - name: Upload WR artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: formal-auto-wrs
          path: wr/pending/formal/
          if-no-files-found: ignore

      # Optional: open draft issues for fail/needs_reaudit — still human-owned.
      # Requires allowlisted labels only.
      - name: Open draft WRs as issues (opt-in)
        if: steps.report.outputs.found == 'true' && env.FORMAL_OPEN_ISSUES == 'true'
        env:
          FORMAL_OPEN_ISSUES: ${{ vars.FORMAL_OPEN_ISSUES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Placeholder: fleet may wire this to wr-field-filler / wr-pr-creation.
          # Default OFF so formal never floods Issues without explicit enable.
          echo "FORMAL_OPEN_ISSUES not enabled (default). Artifacts only."
