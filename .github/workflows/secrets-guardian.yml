name: Secrets Guardian

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for missing/exposed secrets
        run: |
          echo "Running secrets guardian scan..."
          # placeholder scan; fails fast if guardian detects a problem
          exit 0

  alert-on-failure:
    needs: guardian
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: File guardian-failure alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Secrets Guardian failure';
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'guardian-failure',
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Alert issue already open; skipping create.');
              return;
            }
            await github.rest.issues.create({
              owner, repo,
              title,
              body: `Secrets Guardian workflow failed in run ${context.runId}.`,
              labels: ['guardian-failure'],
            });
