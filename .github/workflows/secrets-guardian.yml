name: Secrets Guardian

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required secrets
        env:
          POLAR_TOKEN: ${{ secrets.POLAR_TOKEN }}
        run: |
          set -e
          missing=0
          if [ -z "${POLAR_TOKEN}" ]; then
            echo "::warning::POLAR_TOKEN is not set"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing."
            exit 1
          fi

  alert-on-failure:
    needs: guardian
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File guardian-failure alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Secrets Guardian: failure detected';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'guardian-failure',
              per_page: 10,
            });
            if (existing.some(i => i.title === title)) {
              core.info('Open guardian-failure alert already exists.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['guardian-failure', 'credentials-missing'],
              body: `Secrets Guardian failed on run ${context.runId}. See workflow logs.`,
            });
