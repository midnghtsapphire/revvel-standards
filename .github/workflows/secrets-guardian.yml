name: Secrets Guardian

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for exposed secrets
        run: |
          set -euo pipefail
          if grep -rEn 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
              --include='*.js' --include='*.ts' --include='*.py' --include='*.yml' \
              --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::Potential secrets detected"
            exit 1
          fi
          echo "No exposed secrets detected"

  alert-on-failure:
    needs: guardian
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: File guardian-failure alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[secrets-guardian] scan failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'secrets-guardian-alert',
              state: 'open',
              per_page: 10,
            });
            if (existing.some(i => i.title === title)) {
              core.info('Existing guardian alert issue found; skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Secrets guardian scan failed on run ${context.runId}.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['secrets-guardian-alert', 'automated'],
            });
