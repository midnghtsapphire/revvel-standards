name: Secrets Guardian

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for exposed secrets
        run: |
          echo "Running secrets guardian scan..."
          if grep -rEn 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----' \
            --include='*.py' --include='*.js' --include='*.ts' \
            --include='*.json' --include='*.yml' --include='*.yaml' \
            . 2>/dev/null; then
            echo "Potential secret found"
            exit 1
          fi

  alert-on-failure:
    needs: guardian
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File guardian failure alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Secrets Guardian failure detected';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'secrets-guardian-alert',
            });
            if (existing.some(i => i.title === title)) {
              core.info('Alert issue already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Secrets Guardian failed on run ${context.runId}. Investigate immediately.`,
              labels: ['secrets-guardian-alert', 'security'],
            });
