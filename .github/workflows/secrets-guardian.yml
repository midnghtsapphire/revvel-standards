name: Secrets Guardian
# Self-healing guardian - auto-restores deleted secrets from backup
# Run hourly to prevent secrets from going missing

on:
  schedule:
    - cron: '18 * * * *'  # Every hour (staggered off :00 to reduce runner bursts)
  workflow_dispatch:  # Manual trigger
    inputs:
      dry_run:
        description: Dry run (no changes)
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  guardian:
    name: 🔒 Secrets Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      restored: ${{ steps.scan.outputs.restored }}
      missing: ${{ steps.scan.outputs.missing }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify required secrets
        env:
          POLAR_TOKEN: ${{ secrets.POLAR_TOKEN }}
        run: |
          set -e
          missing=0
          if [ -z "${POLAR_TOKEN}" ]; then
            echo "::warning::POLAR_TOKEN is not set"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing."
            exit 1
          fi
        with:
          sparse-checkout: |
            scripts/credential-backup-harness.js
            scripts/secrets-guardian.sh

      - name: Scan and restore secrets
        id: scan
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          CREDENTIAL_BACKUP_JSON: ${{ secrets.CREDENTIAL_BACKUP_JSON }}
          # The default GITHUB_TOKEN does NOT have the repo Secrets API scope,
          # so `gh secret list`/`gh secret set` in secrets-guardian.sh would
          # fail on the very first call and the hourly recovery could never
          # succeed. Use the repo-standard ADMIN_GITHUB_TOKEN-with-fallback
          # (CLAUDE.md gotcha #2) which does carry that scope.
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/secrets-guardian.sh
          # The script parses its first positional arg as DRY_RUN
          # (DRY_RUN="${1:-true}"); pass the raw value, NOT a --dry-run flag,
          # otherwise DRY_RUN becomes "--dry-run" (!= "true") and the script
          # silently runs in LIVE mode.
          ./scripts/secrets-guardian.sh "$DRY_RUN"
        continue-on-error: true

      - name: Report status
        id: run
        if: always()
        run: |
          # Use .outcome (true pre-continue-on-error result), NOT .conclusion —
          # continue-on-error: true rewrites .conclusion to "success", so
          # checking .conclusion would never detect a real failure.
          if [ "${{ steps.scan.outcome }}" == "failure" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "❌ Guardian failed - check logs"
            exit 1
          fi
          echo "status=ok" >> "$GITHUB_OUTPUT"
          
          RESTORED="${{ steps.scan.outputs.restored }}"
          MISSING="${{ steps.scan.outputs.missing }}"
          
          if [ -n "$RESTORED" ] && [ "$RESTORED" != "" ]; then
            echo "🔄 Restored secrets: $RESTORED"
          fi
          
          if [ -n "$MISSING" ] && [ "$MISSING" != "" ]; then
            echo "⚠️ Missing from backup (not restored): $MISSING"
          fi
          
          if [ -z "$RESTORED" ] && [ -z "$MISSING" ]; then
            echo "✅ All secrets intact"
          fi

# Alert on repeated failures
  alert-on-failure:
    name: 🚨 Alert on Guardian Failure
    needs: guardian
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # issues: write is required here (not granted at workflow level) because this job
    # calls github.rest.issues.list / github.rest.issues.create to file the alert issue
    # when the guardian fails. Without it, the failure-alert path itself 403s silently.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create issue if guardian keeps failing
        if: github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Secrets Guardian: failure detected';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'guardian-failure',
              per_page: 10,
            });
            if (existing.some(i => i.title === title)) {
              core.info('Open guardian-failure alert already exists.');
              return;
            // Check if we already have a recent guardian failure issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'secrets-guardian,auto-error'
            });
            
            if (issues.length === 0) {
              // Create alert issue
              await github.rest.issues.create({
                title: '[AUTO-ALERT] Secrets Guardian Failed - Immediate Action Required',
                body: [
                  `## 🔴 Secrets Guardian Failure`,
                  ``,
                  `The Secrets Guardian failed to restore missing secrets.`,
                  ``,
                  `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/secrets-guardian.yml`,
                  ``,
                  `### Required Actions:`,
                  `1. Check CREDENTIAL_BACKUP_JSON in GitHub Secrets`,
                  `2. Verify all credentials are present`,
                  `3. Manually restore if needed`,
                  ``,
                  `---`,
                  `_This issue auto-closes when guardian succeeds_`,
                ].join('\n'),
                labels: ['secrets-guardian', 'auto-error', 'needs-human']
              });
            }

# Auto-close the alert issue once the guardian succeeds again, so the
# "_This issue auto-closes when guardian succeeds_" promise in the alert body
# is actually kept (previously nothing ever closed it).
  close-on-success:
    name: ✅ Close guardian alerts on success
    needs: guardian
    if: success() && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # issues: write is required here (not granted at workflow level) to close
    # the alert issue that alert-on-failure opens. Mirrors the recovery-close
    # pattern in deployment-health-check.yml.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Close open Secrets Guardian alert issues
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['guardian-failure', 'credentials-missing'],
              body: `Secrets Guardian failed on run ${context.runId}. See workflow logs.`,
              state: 'open',
              labels: 'secrets-guardian,auto-error',
            });

            if (issues.length === 0) {
              core.info('No open Secrets Guardian alert issues to close.');
              return;
            }

            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ **Secrets Guardian recovered** — a subsequent run completed successfully with no missing secrets. Closing this alert automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed guardian alert issue #${issue.number}`);
            }