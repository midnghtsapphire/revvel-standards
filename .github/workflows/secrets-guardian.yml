name: Secrets Guardian
# Self-healing guardian - auto-restores deleted secrets from backup
# Run hourly to prevent secrets from going missing

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Manual trigger
    inputs:
      dry_run:
        description: Dry run (no changes)
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  guardian:
    name: 🔒 Secrets Guardian
    runs-on: ubuntu-latest
    outputs:
      restored: ${{ steps.scan.outputs.restored }}
      missing: ${{ steps.scan.outputs.missing }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/credential-backup-harness.js
            scripts/secrets-guardian.sh

      - name: Scan and restore secrets
        id: scan
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          CREDENTIAL_BACKUP_JSON: ${{ secrets.CREDENTIAL_BACKUP_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/secrets-guardian.sh
          ./scripts/secrets-guardian.sh --dry-run "$DRY_RUN"
        continue-on-error: true

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.scan.conclusion }}" == "failure" ]; then
            echo "❌ Guardian failed - check logs"
            exit 1
          fi
          
          RESTORED="${{ steps.scan.outputs.restored }}"
          MISSING="${{ steps.scan.outputs.missing }}"
          
          if [ -n "$RESTORED" ] && [ "$RESTORED" != "" ]; then
            echo "🔄 Restored secrets: $RESTORED"
          fi
          
          if [ -n "$MISSING" ] && [ "$MISSING" != "" ]; then
            echo "⚠️ Missing from backup (not restored): $MISSING"
          fi
          
          if [ -z "$RESTORED" ] && [ -z "$MISSING" ]; then
            echo "✅ All secrets intact"
          fi

# Alert on repeated failures
  alert-on-failure:
    name: 🚨 Alert on Guardian Failure
    needs: guardian
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create issue if guardian keeps failing
        if: github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // Check if we already have a recent guardian failure issue
            const { data: issues } = await github.rest.issues.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['secrets-guardian', 'auto-error']
            });
            
            if (issues.length === 0) {
              // Create alert issue
              await github.rest.issues.create({
                title: '[AUTO-ALERT] Secrets Guardian Failed - Immediate Action Required',
                body: [
                  `## 🔴 Secrets Guardian Failure`,
                  ``,
                  `The Secrets Guardian failed to restore missing secrets.`,
                  ``,
                  `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/secrets-guardian.yml`,
                  ``,
                  `### Required Actions:`,
                  `1. Check CREDENTIAL_BACKUP_JSON in GitHub Secrets`,
                  `2. Verify all credentials are present`,
                  `3. Manually restore if needed`,
                  ``,
                  `---`,
                  `_This issue auto-closes when guardian succeeds_`,
                ].join('\n'),
                labels: ['secrets-guardian', 'auto-error', 'needs-human']
              });
            }