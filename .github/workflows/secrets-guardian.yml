name: Secrets Guardian

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets present
        env:
          POLAR_TOKEN: ${{ secrets.POLAR_TOKEN }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: |
          missing=0
          if [ -z "${POLAR_TOKEN:-}" ]; then
            echo "::warning::POLAR_TOKEN missing"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Run secrets guardian checks
        run: |
          echo "Running secrets guardian audit..."

  alert-on-failure:
    needs: guardian
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: File guardian-failure alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Secrets Guardian: audit failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'secrets-guardian',
              per_page: 20,
            });
            if (existing.some(i => i.title === title)) {
              core.info('Existing guardian-failure issue already open; skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Secrets Guardian audit failed in run ${context.runId}. Investigate ASAP.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['secrets-guardian', 'urgent'],
            });
