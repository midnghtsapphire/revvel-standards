name: Daily News Briefing
on:
  schedule:
    - cron: '0 6 * * *' # 6am UTC daily (must be 5 fields; 3-field cron makes GitHub reject the workflow)

# Least privilege: checkout + local script only; no GitHub write APIs.
permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headlines
        run: |
          curl "https://newsapi.org/v2/top-headlines?country=us&apiKey=${{ secrets.NEWS_API_KEY }}" > headlines.json
      - name: Process & post
        run: python scripts/process_news.py
