name: Daily News Briefing
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: '0 6 * * *' # 6am UTC daily (must be 5 fields; 3-field cron makes GitHub reject the workflow)
  workflow_dispatch:
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Fetch headlines
        run: |
          curl "https://newsapi.org/v2/top-headlines?country=us&apiKey=${{ secrets.NEWS_API_KEY }}" > headlines.json
      - name: Process & post
        run: python scripts/process_news.py
