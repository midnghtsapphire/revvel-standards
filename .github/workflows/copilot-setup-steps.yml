name: Copilot Setup Steps

# Run automatically when this file or root dependency files change to validate setup steps,
# and allow manual testing via the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  # Job MUST be named `copilot-setup-steps` to be picked up by Copilot cloud agent.
  copilot-setup-steps:
    name: Install root tooling for revvel-standards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure local main ref exists for diff-based tooling
        # The Copilot cloud agent's engine runs `git diff ... main` to compute
        # changed paths; its checkout is a single-ref clone with no local
        # `main`, so that dies with "fatal: ambiguous argument 'main'" and
        # cancels the run. Materialize the ref up front (idempotent — a no-op
        # when the checkout is already on main).
        run: |
          git fetch origin main --depth=200 || true
          git rev-parse --verify --quiet main >/dev/null \
            || git branch main origin/main \
            || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci
