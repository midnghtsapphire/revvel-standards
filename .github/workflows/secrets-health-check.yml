name: Secrets Health Check

# Reports which workflow secrets are configured vs. missing.
# Never exposes secret values — only checks if they are set.
# Run manually or on a weekly schedule.

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check secret availability
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECURSE_ML_API_KEY: ${{ secrets.RECURSE_ML_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          READY_FOR_REVIEW_TOKEN: ${{ secrets.READY_FOR_REVIEW_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
          MIRROR_GIST_ID: ${{ secrets.MIRROR_GIST_ID }}
          MIRROR_GIST_TOKEN: ${{ secrets.MIRROR_GIST_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          echo "## Secrets Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          MISSING=0

          check_secret() {
            local name="$1"
            local value="${!name}"
            if [ -n "$value" ]; then
              echo "| \`$name\` | ✅ Configured |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$name\` | ❌ **NOT SET** |" >> "$GITHUB_STEP_SUMMARY"
              MISSING=$((MISSING + 1))
            fi
          }

          check_secret "OPENROUTER_API_KEY"
          check_secret "JULES_API_KEY"
          check_secret "OPENAI_API_KEY"
          check_secret "RECURSE_ML_API_KEY"
          check_secret "ADMIN_GITHUB_TOKEN"
          check_secret "READY_FOR_REVIEW_TOKEN"
          check_secret "APP_ID"
          check_secret "APP_PRIVATE_KEY"
          check_secret "MABL_API_KEY"
          check_secret "MIRROR_GIST_ID"
          check_secret "MIRROR_GIST_TOKEN"
          check_secret "VERCEL_TOKEN"
          check_secret "DIGITALOCEAN_API_TOKEN"
          check_secret "DOPPLER_TOKEN"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MISSING" -gt 0 ]; then
            echo "⚠️ **$MISSING secret(s) are not configured.** Workflows that depend on them will fail or degrade." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "To restore missing secrets, provision them in [Doppler](https://dashboard.doppler.com) then run the **Doppler Secrets Sync** workflow, or set them directly in **repo Settings → Secrets and variables → Actions**." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **All secrets are configured.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "_Checked at $(date -u '+%Y-%m-%d %H:%M UTC'). See docs/SECRETS_MANAGEMENT.md for the full workflow-to-secret matrix._" >> "$GITHUB_STEP_SUMMARY"

          # Exit non-zero so the Actions UI marks this run as failed when secrets
          # are missing — ::error:: ensures the annotation is clearly a failure, not
          # just an informational warning.
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING required secret(s) are not configured. See the job summary for details and restore them via Doppler or repo Settings → Secrets."
            exit 1
          fi
