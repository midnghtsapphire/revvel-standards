name: Secrets Health Check

# Reports which workflow secrets are configured vs. missing.
# Never exposes secret values — only checks if they are set.
# Run manually or on a weekly schedule.

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check secret availability
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECURSE_ML_API_KEY: ${{ secrets.RECURSE_ML_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          READY_FOR_REVIEW_TOKEN: ${{ secrets.READY_FOR_REVIEW_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
          MIRROR_GIST_ID: ${{ secrets.MIRROR_GIST_ID }}
          MIRROR_GIST_TOKEN: ${{ secrets.MIRROR_GIST_TOKEN }}
        run: |
          echo "## Secrets Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          check_secret() {
            local name="$1"
            local value="${!name}"
            if [ -n "$value" ]; then
              echo "| \`$name\` | Configured |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$name\` | **NOT SET** |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          check_secret "OPENROUTER_API_KEY"
          check_secret "JULES_API_KEY"
          check_secret "OPENAI_API_KEY"
          check_secret "RECURSE_ML_API_KEY"
          check_secret "ADMIN_GITHUB_TOKEN"
          check_secret "READY_FOR_REVIEW_TOKEN"
          check_secret "APP_ID"
          check_secret "APP_PRIVATE_KEY"
          check_secret "MABL_API_KEY"
          check_secret "MIRROR_GIST_ID"
          check_secret "MIRROR_GIST_TOKEN"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Checked at $(date -u '+%Y-%m-%d %H:%M UTC'). See docs/SECRETS_MANAGEMENT.md for the full workflow-to-secret matrix._" >> "$GITHUB_STEP_SUMMARY"
