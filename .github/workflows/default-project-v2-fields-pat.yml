name: Set default Project v2 fields for new issues using PAT

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to backfill or re-run defaults for"
        required: false
        type: string

permissions:
  contents: read
  issues: read

jobs:
  preflight:
    name: Check Project v2 PAT credentials
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - id: check
        env:
          PAT: ${{ secrets.PROJECTS_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${PAT}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "Classic PAT configured (PROJECTS_PAT)."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROJECTS_PAT not configured; skipping PAT default-field setter."
          fi

  set-project-defaults:
    name: Add issue to Project v2 and set default fields
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' || needs.preflight.outputs.has_creds == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.PROJECTS_PAT }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          set -euo pipefail

          missing=0

          for var_name in \
            GH_TOKEN \
            PROJECT_ID
          do
            if [ -z "${!var_name}" ]; then
              echo "Missing required secret or variable: ${var_name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Resolve issue node ID
        id: issue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "ISSUE_NUMBER is required for workflow_dispatch runs."
            exit 1
          fi

          ISSUE_ID="$(
            gh api graphql \
              -f owner="${REPO%/*}" \
              -f name="${REPO#*/}" \
              -F number="${ISSUE_NUMBER}" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    issue(number: $number) {
                      id
                      title
                    }
                  }
                }
              ' \
              --jq '.data.repository.issue.id'
          )"

          if [ -z "${ISSUE_ID}" ] || [ "${ISSUE_ID}" = "null" ]; then
            echo "Could not resolve issue node ID for issue #${ISSUE_NUMBER}."
            exit 1
          fi

          echo "issue_id=${ISSUE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Add issue to project or get existing project item
        id: project-item
        env:
          ISSUE_ID: ${{ steps.issue.outputs.issue_id }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            gh api graphql \
              -f project="${PROJECT_ID}" \
              -f content="${ISSUE_ID}" \
              -f query='
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {
                    projectId: $project
                    contentId: $content
                  }) {
                    item {
                      id
                    }
                  }
                }
              ' 2>&1
          )" || true

          ITEM_ID="$(printf '%s' "${RESPONSE}" | jq -r '.data.addProjectV2ItemById.item.id // empty' 2>/dev/null || true)"

          if [ -z "${ITEM_ID}" ]; then
            echo "addProjectV2ItemById did not return an item. The issue may already be in the project."
            echo "${RESPONSE}"
            echo "Looking up the existing item by issue content ID..."

            ITEM_ID="$(
              gh api graphql \
                -f issue="${ISSUE_ID}" \
                -f query='
                  query($issue: ID!) {
                    node(id: $issue) {
                      ... on Issue {
                        projectItems(first: 50) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                ' \
                --jq ".data.node.projectItems.nodes[] | select(.project.id == \"${PROJECT_ID}\") | .id" \
              | head -n 1
            )"
          fi

          if [ -z "${ITEM_ID}" ] || [ "${ITEM_ID}" = "null" ]; then
            echo "Could not add or find the Project v2 item for this issue."
            exit 1
          fi

          echo "item_id=${ITEM_ID}" >> "${GITHUB_OUTPUT}"

      - name: Set default Project v2 fields
        uses: actions/github-script@v7
        env:
          ITEM_ID: ${{ steps.project-item.outputs.item_id }}
        with:
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const script = require('./.github/scripts/set-project-fields.js');
            await script({ github, context, core });
