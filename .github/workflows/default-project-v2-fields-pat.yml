name: Set default Project v2 fields for new issues using PAT
on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number to backfill or re-run defaults for
        required: false
        type: string
permissions:
  contents: read
  issues: read
jobs:
  preflight:
    name: Check Project v2 PAT credentials
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - id: check
        env:
          PAT: ${{ secrets.PROJECTS_PAT }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          PRIORITY_FIELD_ID: ${{ vars.PRIORITY_FIELD_ID }}
          STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
          RESEARCH_MODE_FIELD_ID: ${{ vars.RESEARCH_MODE_FIELD_ID }}
          PRIORITY_MEDIUM_OPTION_ID: ${{ vars.PRIORITY_MEDIUM_OPTION_ID }}
          STATUS_INBOX_OPTION_ID: ${{ vars.STATUS_INBOX_OPTION_ID }}
          RESEARCH_MODE_STANDARD_OPTION_ID: ${{ vars.RESEARCH_MODE_STANDARD_OPTION_ID }}
        run: |
          set -euo pipefail
          # Graceful degradation (fail over, don't dead-end): setting default
          # Project v2 fields is OPTIONAL polish. If the PAT or ANY required
          # Project field/option ID isn't configured, SKIP cleanly — never hard-fail
          # a new-issue event over optional project automation. We list exactly what
          # is missing so a human can wire it up later (repo Settings → Secrets and
          # variables → Actions). Previously a missing var made the setter exit 1 on
          # every opened issue.
          missing=""
          [ -z "${PAT}" ] && missing="${missing} PROJECTS_PAT(secret)"
          for v in PROJECT_ID PRIORITY_FIELD_ID STATUS_FIELD_ID RESEARCH_MODE_FIELD_ID \
                   PRIORITY_MEDIUM_OPTION_ID STATUS_INBOX_OPTION_ID RESEARCH_MODE_STANDARD_OPTION_ID; do
            [ -z "${!v}" ] && missing="${missing} ${v}(var)"
          done
          if [ -n "${missing}" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PAT default-field setter — not fully configured. Missing:${missing}. Configure these to enable; ignore to keep it disabled."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "PROJECTS_PAT + all Project v2 field/option IDs configured."
          fi
  set-project-defaults:
    name: Add issue to Project v2 and set default fields
    needs: preflight
    # Run only when fully configured (preflight verified PAT + all field/option
    # IDs). Manual workflow_dispatch no longer bypasses this — without the IDs the
    # job cannot do anything but fail, so it skips cleanly instead.
    if: ${{ needs.preflight.outputs.has_creds == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_PAT }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PRIORITY_FIELD_ID: ${{ vars.PRIORITY_FIELD_ID }}
      STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
      RESEARCH_MODE_FIELD_ID: ${{ vars.RESEARCH_MODE_FIELD_ID }}
      PRIORITY_MEDIUM_OPTION_ID: ${{ vars.PRIORITY_MEDIUM_OPTION_ID }}
      STATUS_INBOX_OPTION_ID: ${{ vars.STATUS_INBOX_OPTION_ID }}
      RESEARCH_MODE_STANDARD_OPTION_ID: ${{ vars.RESEARCH_MODE_STANDARD_OPTION_ID }}
    steps:
      - name: Resolve issue node ID
        id: issue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "ISSUE_NUMBER is required for workflow_dispatch runs."
            exit 1
          fi

          ISSUE_ID="$(
            gh api graphql \
              -f owner="${REPO%/*}" \
              -f name="${REPO#*/}" \
              -F number="${ISSUE_NUMBER}" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    issue(number: $number) {
                      id
                      title
                    }
                  }
                }
              ' \
              --jq '.data.repository.issue.id'
          )"

          if [ -z "${ISSUE_ID}" ] || [ "${ISSUE_ID}" = "null" ]; then
            echo "Could not resolve issue node ID for issue #${ISSUE_NUMBER}."
            exit 1
          fi

          echo "issue_id=${ISSUE_ID}" >> "${GITHUB_OUTPUT}"
      - name: Add issue to project or get existing project item
        id: project-item
        env:
          ISSUE_ID: ${{ steps.issue.outputs.issue_id }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            gh api graphql \
              -f project="${PROJECT_ID}" \
              -f content="${ISSUE_ID}" \
              -f query='
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {
                    projectId: $project
                    contentId: $content
                  }) {
                    item {
                      id
                    }
                  }
                }
              ' 2>&1
          )" || true

          ITEM_ID="$(printf '%s' "${RESPONSE}" | jq -r '.data.addProjectV2ItemById.item.id // empty' 2>/dev/null || true)"

          if [ -z "${ITEM_ID}" ]; then
            echo "addProjectV2ItemById did not return an item. The issue may already be in the project."
            echo "${RESPONSE}"
            echo "Looking up the existing item by issue content ID..."

            ITEM_ID="$(
              gh api graphql \
                -f issue="${ISSUE_ID}" \
                -f query='
                  query($issue: ID!) {
                    node(id: $issue) {
                      ... on Issue {
                        projectItems(first: 50) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                ' \
                --jq ".data.node.projectItems.nodes[] | select(.project.id == \"${PROJECT_ID}\") | .id" \
              | head -n 1
            )"
          fi

          if [ -z "${ITEM_ID}" ] || [ "${ITEM_ID}" = "null" ]; then
            echo "Could not add or find the Project v2 item for this issue."
            exit 1
          fi

          echo "item_id=${ITEM_ID}" >> "${GITHUB_OUTPUT}"
      - name: Set default Project v2 fields
        env:
          ITEM_ID: ${{ steps.project-item.outputs.item_id }}
        run: |
          set -euo pipefail

          gh api graphql \
            -f project="${PROJECT_ID}" \
            -f item="${ITEM_ID}" \
            -f priority_field="${PRIORITY_FIELD_ID}" \
            -f priority_value="${PRIORITY_MEDIUM_OPTION_ID}" \
            -f status_field="${STATUS_FIELD_ID}" \
            -f status_value="${STATUS_INBOX_OPTION_ID}" \
            -f research_mode_field="${RESEARCH_MODE_FIELD_ID}" \
            -f research_mode_value="${RESEARCH_MODE_STANDARD_OPTION_ID}" \
            -f query='
              mutation(
                $project: ID!
                $item: ID!
                $priority_field: ID!
                $priority_value: String!
                $status_field: ID!
                $status_value: String!
                $research_mode_field: ID!
                $research_mode_value: String!
              ) {
                set_priority: updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $priority_field
                  value: { singleSelectOptionId: $priority_value }
                }) {
                  projectV2Item { id }
                }

                set_status: updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $status_field
                  value: { singleSelectOptionId: $status_value }
                }) {
                  projectV2Item { id }
                }

                set_research_mode: updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $research_mode_field
                  value: { singleSelectOptionId: $research_mode_value }
                }) {
                  projectV2Item { id }
                }
              }
            ' \
            --silent
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
