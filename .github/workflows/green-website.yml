#
# Local Website Carbon fetch replaces abandoned `filiptronicek/green-action`
# (stale release + removed node12 runtime, WR #14884) so green reporting stays
# on maintained first-party actions.
name: Website green-o-meter

on:
  # QUIET THE FLEET 2026-08-21: the push trigger is disabled too. The COST
  # FREEZE below already cut this workflow's cron, but `docs/**` is a very wide
  # path filter, so ordinary doc commits kept waking it. Preserved commented,
  # not deleted (RVS-AGENT-001).
  push:
    branches:
      - main
    paths:
      - README.md
      - index.html
      - oaudrey/**
      - docs/**
      - .github/workflows/green-website.yml
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: 17 9 * * 1
  workflow_dispatch:
    inputs:
      url:
        description: URL to measure. Defaults to vars.GREEN_WEBSITE_URL or GitHub Pages.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: green-website-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_GREEN_WEBSITE_URL: https://midnghtsapphire.github.io/revvel-standards/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  green-website:
    name: Report website carbon data
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, 'docs: update green website report')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target URL
        id: target
        env:
          DISPATCH_URL: ${{ github.event.inputs.url || '' }}
          CONFIGURED_URL: ${{ vars.GREEN_WEBSITE_URL || '' }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_URL}" ]; then
            url="${DISPATCH_URL}"
          elif [ -n "${CONFIGURED_URL}" ]; then
            url="${CONFIGURED_URL}"
          else
            url="${DEFAULT_GREEN_WEBSITE_URL}"
          fi
          if ! printf '%s' "${url}" | grep -Eq '^https?://'; then
            echo "::error::Green website URL must start with http:// or https://"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Verify README carbon marker
        run: |
          set -euo pipefail
          if ! grep -Eq '<!-- CARBON-STATS -->|!\[carbon consumption of this project\]\(https://green-action\.vercel\.app/api/card\?p=' README.md; then
            echo "::error::README.md must contain <!-- CARBON-STATS --> or the generated green-action card."
            exit 1
          fi

      - name: green-website
        uses: actions/github-script@v9.0.0
        env:
          URL: ${{ steps.target.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const targetUrl = process.env.URL;
            if (!targetUrl) {
              throw new Error('URL env was not provided');
            }

            const response = await fetch(`https://api.websitecarbon.com/site?url=${encodeURIComponent(targetUrl)}`);
            if (!response.ok) {
              throw new Error(`Website Carbon API request failed: ${response.status} ${response.statusText}`);
            }

            const carbonData = await response.json();
            const cleanerThan = Math.round((Number(carbonData.cleanerThan) || 0) * 100);
            const badge = `![carbon consumption of this project](https://green-action.vercel.app/api/card?p=${cleanerThan}&type=percent)`;
            const badgePattern = /!\[carbon consumption of this project\]\(https:\/\/green-action\.vercel\.app\/api\/card\?p=\d{1,3}(?:&type=(?:percent|grams))?\)/;
            const readmePath = 'README.md';
            const carbonPath = 'carbon';

            let readme = fs.readFileSync(readmePath, 'utf8');
            if (readme.includes('<!-- CARBON-STATS -->')) {
              readme = readme.replace('<!-- CARBON-STATS -->', badge);
            } else if (badgePattern.test(readme)) {
              readme = readme.replace(badgePattern, badge);
            } else {
              throw new Error('README.md is missing the carbon marker or generated badge');
            }

            fs.writeFileSync(readmePath, readme);
            fs.writeFileSync(carbonPath, `${JSON.stringify(carbonData, null, 2)}\n`);
            core.info(`Cleaner-than score for ${targetUrl}: ${cleanerThan}`);

      - name: Upload carbon artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: carbon
          path: carbon

      - name: Commit green website report
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md carbon
          if git diff --cached --quiet; then
            echo "No green website report changes to commit."
            exit 0
          fi
          git commit -m "docs: update green website report"
          git pull --rebase origin main
          git push origin HEAD:main
    timeout-minutes: 15
