# dprint style gate — https://dprint.dev / dprint/check@v2.3
# Runs on Linux only (avoids Windows CRLF false positives from git autocrlf).
# Config: dprint.json (auto-discovered; config-path set explicitly for clarity).
name: dprint check

concurrency:
  group: dprint-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: dprint-check-action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `if: runner.os == 'Linux'` here: the `runner` context is not available
    # in a job-level `if`, so actionlint rejected it (#17742) — and the guard was
    # redundant regardless, since `runs-on: ubuntu-latest` above already pins the
    # platform. If this job ever gains a matrix, gate on `matrix.os` instead,
    # which IS available here.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: dprint-check-action
        # Pin third-party action to full SHA (CLAUDE.md gotcha #8). Tag: v2.3
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6
        with:
          config-path: dprint.json
