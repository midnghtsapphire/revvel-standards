name: Duplicate WR and PR Detector

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  detect-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for duplicate issues or PRs
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const isPR = context.eventName === 'pull_request_target';
            const payload = isPR ? context.payload.pull_request : context.payload.issue;

            // Skip for bot accounts to prevent infinite loops
            if (payload.user.login.includes('bot') || payload.user.type === 'Bot') {
              console.log('Skipping duplicate check for bot user');
              return;
            }

            const title = payload.title || '';
            const currentNumber = payload.number;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            // Clean the title for searching (remove common prefixes like [WR], feat:, fix:, etc.)
            let searchTitle = title.replace(/\[.*?\]/g, '').replace(/^(feat|fix|docs|chore|style|refactor|test|perf)(\(.*?\))?:/i, '').trim();

            // Escape quotes
            searchTitle = searchTitle.replace(/"/g, '\\"');

            if (!searchTitle || searchTitle.length < 5) {
              console.log('Title too short for meaningful duplicate detection');
              return;
            }

            console.log(`Checking for duplicates with similar title: "${searchTitle}"`);

            // Search query for open issues/PRs in the same repo with matching text in title
            const query = `repo:${repoOwner}/${repoName} is:open in:title ${searchTitle}`;

            try {
              const searchResult = await github.rest.search.issuesAndPullRequests({
                q: query,
                per_page: 5
              });

              if (searchResult.data && searchResult.data.items && searchResult.data.items.length > 0) {
                const duplicates = searchResult.data.items.filter(item => item.number !== currentNumber);

                if (duplicates.length > 0) {
                  console.log(`Found ${duplicates.length} potential duplicate(s)`);

                  // Construct comment body
                  const duplicateLinks = duplicates.map(dup => `- #${dup.number} (${dup.title})`).join('\n');
                  const commentBody = `👋 **Potential Duplicate Detected**\n\nThis ${isPR ? 'pull request' : 'issue'} appears to be a duplicate of or very similar to the following existing items:\n\n${duplicateLinks}\n\nPlease review the items above to ensure we are not overwriting or duplicating existing work (e.g. logos, glassmorphic UI features, etc.).`;

                  // Add comment
                  if (isPR) {
                    await github.rest.issues.createComment({
                      owner: repoOwner,
                      repo: repoName,
                      issue_number: currentNumber,
                      body: commentBody
                    });
                  } else {
                    await github.rest.issues.createComment({
                      owner: repoOwner,
                      repo: repoName,
                      issue_number: currentNumber,
                      body: commentBody
                    });
                  }

                  // Add label
                  await github.rest.issues.addLabels({
                    owner: repoOwner,
                    repo: repoName,
                    issue_number: currentNumber,
                    labels: ['duplicate']
                  });

                  console.log('Added comment and label successfully');
                } else {
                  console.log('No duplicates found (only matched current item)');
                }
              } else {
                console.log('No duplicates found in search results');
              }
            } catch (error) {
              console.error('Error querying GitHub search API:', error);
              // Gracefully handle rate limits or 403s without failing the workflow
              console.log('::warning::Duplicate detection failed due to API error. Proceeding anyway.');
            }
