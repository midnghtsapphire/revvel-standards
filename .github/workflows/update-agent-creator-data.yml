name: Update Agent Creator Data

# Regenerates agent-creator-data.{json,js} (consumed by agent-creator.html)
# whenever any of its source-of-truth registries change on main.

on:
  push:
    branches: [main]
    paths:
      - skills/SKILLS_INDEX.yml
      - skills/agentic-workflow-fleet/FLEET.yml
      - .github/agent-models.yml
      - .github/agent-prompts.yml
      - scripts/openrouter-personas.js
      - scripts/build-agent-creator-data.js
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: agent-creator-data
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT fallback so the data-refresh push can cascade to the Pages
          # deploy workflow (the default GITHUB_TOKEN cannot trigger it).
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build agent creator data
        # Lane config (#17868): this script reaches routedChat through the
        # persona registry, so it needs somewhere for the cascade to go.
        env:
          LMSTUDIO_ENDPOINT: ${{ secrets.LMSTUDIO_ENDPOINT }}
          LMSTUDIO_API_KEY: ${{ secrets.LMSTUDIO_API_KEY }}
          LMSTUDIO_MODEL: ${{ vars.LMSTUDIO_MODEL }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          REVVEL_LLM_ALLOW_CLOUD: ${{ vars.REVVEL_LLM_ALLOW_CLOUD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/build-agent-creator-data.js

      - name: Commit refreshed data if changed
        run: |
          if git diff --quiet -- agent-creator-data.json agent-creator-data.js; then
            echo "Agent creator data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-creator-data.json agent-creator-data.js
          git commit -m "chore(agent-creator): refresh agent catalog data"
          git push
