name: oAudrey — Post-Deploy Retro & Gap Analysis
on:
  workflow_run:
    workflows:
      - Deploy oAudrey Hub → DigitalOcean App Platform
    types:
      - completed
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: Skip live health checks (use when domain not yet pointed)
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  retro:
    name: oAudrey Retro & Gap Analysis
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
      - name: DNS check — oaudrey.com
        id: dns-main
        if: ${{ !inputs.skip_health_check }}
        run: |
          RESOLVED=$(dig +short oaudrey.com 2>/dev/null | head -1 || true)
          echo "resolved=${RESOLVED}" >> "$GITHUB_OUTPUT"
          if [ -n "$RESOLVED" ]; then
            echo "::notice::oaudrey.com resolves to: $RESOLVED"
          else
            echo "::warning::oaudrey.com DNS does not resolve — Namecheap nameservers may not be pointed to DigitalOcean yet"
          fi
      - name: DNS check — fieldwork.oaudrey.com
        id: dns-fieldwork
        if: ${{ !inputs.skip_health_check }}
        run: |
          RESOLVED=$(dig +short fieldwork.oaudrey.com 2>/dev/null | head -1 || true)
          echo "resolved=${RESOLVED}" >> "$GITHUB_OUTPUT"
          if [ -n "$RESOLVED" ]; then
            echo "::notice::fieldwork.oaudrey.com resolves to: $RESOLVED"
          else
            echo "::warning::fieldwork.oaudrey.com DNS does not resolve"
          fi
      - name: Health check — oaudrey.com
        id: health-main
        if: ${{ !inputs.skip_health_check }}
        run: |
          # curl's `-w "%{http_code}"` already emits `000` on connection/DNS/timeout
          # failures, so we MUST NOT append a second `|| echo "000"` — doing so
          # concatenates to `000000` and produces nonsense status codes in the
          # retro report. Use `|| true` to keep the step from failing and let
          # `-w` be the single source of truth for the status string.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://oaudrey.com 2>/dev/null || true)
          STATUS=${STATUS:-000}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "::notice::oaudrey.com is live (HTTP $STATUS) ✅"
          else
            echo "::warning::oaudrey.com returned HTTP $STATUS — may be DNS propagation or deployment issue"
          fi
      - name: Health check — fieldwork.oaudrey.com
        id: health-fieldwork
        if: ${{ !inputs.skip_health_check }}
        run: |
          # See note in the oaudrey.com step above: do not duplicate `000` via
          # `|| echo "000"`; rely on curl's `-w "%{http_code}"` which already
          # prints `000` for failed transfers.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://fieldwork.oaudrey.com 2>/dev/null || true)
          STATUS=${STATUS:-000}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "::notice::fieldwork.oaudrey.com is live (HTTP $STATUS) ✅"
          else
            echo "::warning::fieldwork.oaudrey.com returned HTTP $STATUS"
          fi
      - name: Gap analysis — products in README vs tabs in index.html
        id: gap-analysis
        run: |
          # NOTE: The tab button text extraction below depends on the HTML structure remaining
          # consistent (role="tab" buttons with text content on the same line). If the HTML is
          # reformatted significantly, update this grep pattern to match.
          TABS=$(grep -oP 'role="tab"[^>]*>\s*\K[^<]+' oaudrey/index.html | sed 's/&amp;/\&/g' | tr -d '\n ')
          echo "tabs_found=$TABS" >> "$GITHUB_OUTPUT"

          # Check for 404.html (graceful error page)
          if [ -f "oaudrey/404.html" ]; then
            echo "has_404=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_404=false" >> "$GITHUB_OUTPUT"
          fi

          # Check for app spec
          if [ -f "oaudrey/.do/app.yaml" ]; then
            echo "has_app_spec=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app_spec=false" >> "$GITHUB_OUTPUT"
          fi

          # Count product tab panels
          PANEL_COUNT=$(grep -c 'role="tabpanel"' oaudrey/index.html || echo "0")
          echo "panel_count=$PANEL_COUNT" >> "$GITHUB_OUTPUT"
      - name: Generate retrospective report
        id: retro-report
        uses: actions/github-script@v9.0.0
        env:
          HEALTH_MAIN_STATUS: ${{ steps.health-main.outputs.status }}
          HEALTH_FIELDWORK_STATUS: ${{ steps.health-fieldwork.outputs.status }}
          DNS_MAIN_RESOLVED: ${{ steps.dns-main.outputs.resolved }}
          DNS_FIELDWORK_RESOLVED: ${{ steps.dns-fieldwork.outputs.resolved }}
          GAP_ANALYSIS_HAS_404: ${{ steps.gap-analysis.outputs.has_404 }}
          GAP_ANALYSIS_HAS_APP_SPEC: ${{ steps.gap-analysis.outputs.has_app_spec }}
          GAP_ANALYSIS_PANEL_COUNT: ${{ steps.gap-analysis.outputs.panel_count }}
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Health check results
            const mainStatus = (process.env.HEALTH_MAIN_STATUS || '') || 'skipped';
            const fieldworkStatus = (process.env.HEALTH_FIELDWORK_STATUS || '') || 'skipped';

            const healthOk = (s) => s === '200' || s === '301' || s === '302' || s === 'skipped';
            const mainOk = healthOk(mainStatus);
            const fieldworkOk = healthOk(fieldworkStatus);

            // DNS resolution results
            const mainDns = (process.env.DNS_MAIN_RESOLVED || '') || '';
            const fieldworkDns = (process.env.DNS_FIELDWORK_RESOLVED || '') || '';

            // Gap analysis
            const has404 = (process.env.GAP_ANALYSIS_HAS_404 || '') === 'true';
            const hasAppSpec = (process.env.GAP_ANALYSIS_HAS_APP_SPEC || '') === 'true';
            const panelCount = parseInt((process.env.GAP_ANALYSIS_PANEL_COUNT || '')) || 0;

            // Determine what's good vs needs work
            const good = [];
            const needsWork = [];
            const gaps = [];

            if (mainOk && mainStatus !== 'skipped') good.push('`oaudrey.com` is live and responding');
            else if (mainStatus !== 'skipped') {
              const dnsNote = mainDns ? ` — DNS resolves to \`${mainDns}\`` : ' — DNS does not resolve (check Namecheap nameservers → DigitalOcean)';
              needsWork.push('`oaudrey.com` is not responding (HTTP ' + mainStatus + ')' + dnsNote);
            }

            if (fieldworkOk && fieldworkStatus !== 'skipped') good.push('`fieldwork.oaudrey.com` is live');
            else if (fieldworkStatus !== 'skipped') {
              const dnsNote = fieldworkDns ? ` — DNS resolves to \`${fieldworkDns}\`` : ' — DNS does not resolve';
              needsWork.push('`fieldwork.oaudrey.com` is not responding (HTTP ' + fieldworkStatus + ')' + dnsNote);
            }

            if (has404) good.push('`404.html` error page exists');
            else gaps.push('Missing `oaudrey/404.html` — add a branded error page');

            if (hasAppSpec) good.push('DO App Platform spec (`oaudrey/.do/app.yaml`) is committed');
            else gaps.push('Missing `oaudrey/.do/app.yaml` — deployment spec not committed');

            if (panelCount >= 5) good.push(`${panelCount} product tab panels are defined`);
            else gaps.push(`Only ${panelCount} product tab panels found — expected ≥5`);

            // Standards gaps
            const standardsGaps = [
              !has404 && '- [ ] Add `oaudrey/404.html`',
              !hasAppSpec && '- [ ] Commit `oaudrey/.do/app.yaml`',
              panelCount < 5 && '- [ ] Add missing product tabs to `oaudrey/index.html`',
            ].filter(Boolean);

            // Emit infra-setup steps if both sites are down with no DNS
            const bothDown = (mainStatus === '000' && !mainDns) && (fieldworkStatus === '000' && !fieldworkDns);
            const infraSteps = bothDown ? [
              '',
              '### 🚀 Infrastructure Setup Required',
              'Both sites are unreachable because the DigitalOcean App Platform has not been deployed yet. Complete these steps in order:',
              '',
              '1. **Set `DIGITALOCEAN_API_TOKEN`** in GitHub repo secrets (DO Dashboard → API → Personal Access Tokens)',
              '2. **Run `deploy-oaudrey.yml`** manually via `workflow_dispatch`',
              '3. **Add custom domains** in DO App Platform Dashboard → App → Settings → Domains: `oaudrey.com`, `fieldwork.oaudrey.com`',
              '4. **Point Namecheap nameservers** to `ns1.digitalocean.com`, `ns2.digitalocean.com`, `ns3.digitalocean.com`',
              '5. **Re-run this retro** once DNS propagates — expect HTTP 200/301/302',
              '',
              '> See `standards/OAUDREY_DEPLOYMENT_STANDARD.md` for the full setup guide.',
            ] : [];

            const body = [
              `## oAudrey Retro — ${date}`,
              '',
              `> Auto-generated by [\`oaudrey-retro.yml\`](${runUrl})`,
              '',
              '### ✅ What Went Well',
              good.length > 0 ? good.map(g => `- ${g}`).join('\n') : '- _(nothing to report — health checks may have been skipped)_',
              '',
              '### ⚠️ Needs Work',
              needsWork.length > 0 ? needsWork.map(w => `- ${w}`).join('\n') : '- _(none — all checks passed)_',
              '',
              '### 🔍 Gaps Found',
              gaps.length > 0 ? gaps.map(g => `- ${g}`).join('\n') : '- _(no gaps detected)_',
              '',
              '### 📋 Standards Checklist',
              standardsGaps.length > 0
                ? standardsGaps.join('\n')
                : '- [x] All standards checks passed',
              ...infraSteps,
              '',
              '---',
              '',
              '**Next action:** Address any ⚠️ and 🔍 items above. ' +
              'Completed improvements should be documented in `standards/OAUDREY_DEPLOYMENT_STANDARD.md`.',
            ].join('\n');

            // Only open an issue if there are gaps or failures
            if (gaps.length > 0 || needsWork.length > 0) {
              // Deduplication: search for an existing open retro issue before
              // creating a new one.  If one is already open, add a comment so
              // the single issue becomes the running status thread instead of
              // accumulating one clone per week.
              const searchResult = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:retro label:oaudrey`,
              });

              if (searchResult.data.total_count > 0) {
                const existing = searchResult.data.items[0];
                const commentBody = [
                  `### oAudrey Retro Update — ${date}`,
                  '',
                  '> Still open. Same issues detected on this run.',
                  '',
                  '**⚠️ Needs Work (still)**',
                  ...needsWork.map(w => `- ${w}`),
                  ...(gaps.length > 0 ? ['', '**🔍 Gaps (still)**', ...gaps.map(g => `- ${g}`)] : []),
                  '',
                  '_This is an automated status update. No new issue was opened because this one is still open._',
                  '_Once the infrastructure actions below are completed and `oaudrey-retro.yml` is re-run successfully, this issue will close automatically._',
                ].join('\n');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: commentBody,
                });
                core.notice(`Retro: existing open issue #${existing.number} updated with new status comment.`);
                core.setOutput('issue_url', existing.html_url);
              } else {
                // Add `needs-human` when the failures are infrastructure-related
                // (health-check failures / DNS issues) so the OpenRouter automation
                // does not treat this as an auto-fixable ticket and endlessly cycle.
                const issueLabels = ['retro', 'oaudrey'];
                if (needsWork.length > 0) issueLabels.push('needs-human');
                const { data: issue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `oAudrey retro — ${date} — ${gaps.length + needsWork.length} item(s) need attention`,
                  body,
                  labels: issueLabels,
                });
                core.notice(`Retro issue created: ${issue.html_url}`);
                core.setOutput('issue_url', issue.html_url);
              }
            } else {
              // All checks passed — close any open retro issue automatically
              const searchResult = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:retro label:oaudrey`,
              });
              if (searchResult.data.total_count > 0) {
                const existing = searchResult.data.items[0];
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `### ✅ oAudrey Retro — ${date} — All checks passed\n\nAll health checks returned HTTP 200/301/302 and no gaps were found. Closing this issue.\n\n_Auto-closed by \`oaudrey-retro.yml\`._`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.notice(`Retro issue #${existing.number} auto-closed — all checks passed.`);
              } else {
                core.notice('oAudrey retro: all checks passed — no issue opened.');
              }
            }

            // Always write to step summary
            await core.summary.addRaw(body).write();
      - name: Update SHIP_STATUS.md with retro timestamp
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          if grep -q "oAudrey hub" SHIP_STATUS.md; then
            echo "::notice::oAudrey hub entry found in SHIP_STATUS.md — retro ran on $DATE"
          fi
          # Note: SHIP_STATUS.md is updated manually after retro findings are addressed.
          # The retro issue (opened above) tracks what needs to change.
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
