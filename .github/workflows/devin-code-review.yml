# =============================================================================
# DEVIN CODE REVIEW WORKFLOW
# =============================================================================
#
# PURPOSE:
#   Wires the reusable Devin Action (aaronsteers/devin-action) into the repo.
#   Devin.ai code-review sessions can be started from GitHub Actions.
#   Operational notes live in docs/agent-stack/DEVIN_OBSERVATIONS.md.
#
# TRIGGER LANES (all opt-in — Devin is a PAID surface, ~$80/mo + ACUs):
#   1. Slash command — comment `/devin <extra instructions>` on any PR/issue.
#   2. Label — add the `devin-review` label to a non-draft PR.
#   3. Manual — workflow_dispatch with a pr_number input.
#   There is deliberately NO automatic pull_request open/sync trigger: Devin
#   costs ACUs per session, so every session must be explicit opt-in.
#
# REQUIRED CONFIGURATION:
#   * DEVIN_API_KEY (repo secret) — Devin v3 service-user token
#   * DEVIN_ORG_ID (repo variable) — Devin organization ID
#
# VERSION PINNING:
#   aaronsteers/devin-action is pinned to a full commit SHA, never @main.
#
# =============================================================================

name: Devin Code Review

on:
  issue_comment:
    types:
      - created
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR (or issue) number Devin should review"
        required: true
        type: string
      prompt_text:
        description: "Extra instructions to append to the review prompt"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: devin-code-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  devin-review:
    name: Devin Code Review Session
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.label.name == 'devin-review' &&
        github.event.pull_request.draft == false
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        ) &&
        startsWith(github.event.comment.body, '/devin')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify Devin credentials are configured
        id: verify-secrets
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
        run: |
          echo "=========================================="
          echo "Devin credential verification"
          echo "=========================================="

          MISSING=()
          if [ -z "${DEVIN_API_KEY}" ]; then
            echo "❌ DEVIN_API_KEY (repo secret): MISSING"
            MISSING+=("DEVIN_API_KEY")
          else
            echo "✅ DEVIN_API_KEY: configured (${#DEVIN_API_KEY} chars)"
          fi

          if [ -z "${DEVIN_ORG_ID}" ]; then
            echo "❌ DEVIN_ORG_ID (repo variable): MISSING"
            MISSING+=("DEVIN_ORG_ID")
          else
            echo "✅ DEVIN_ORG_ID: configured"
          fi

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo ""
            echo "⚠️  Devin review will be SKIPPED — set the missing value(s)"
            echo "    in Settings → Secrets and variables → Actions."
            echo "DEVIN_SKIP=true" >> "$GITHUB_ENV"
          else
            echo "✅ All Devin credentials verified"
            echo "DEVIN_SKIP=false" >> "$GITHUB_ENV"
          fi
          echo "=========================================="

      - name: Create Devin session (slash command)
        if: env.DEVIN_SKIP == 'false' && github.event_name == 'issue_comment'
        uses: aaronsteers/devin-action@6836af14bc904e8eff8e4f2b35eac4c428fc5f34 # v1
        with:
          comment-id: ${{ github.event.comment.id }}
          issue-number: ${{ github.event.issue.number }}
          prompt-text: >-
            Review the code changes in this repository context. Report concrete
            defects with file/line references, grade findings by severity, and
            post your findings back as a comment.
          devin-token: ${{ secrets.DEVIN_API_KEY }}
          org-id: ${{ vars.DEVIN_ORG_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          start-message: "🤖 Starting Devin code-review session…"
          max-acu-limit: 10
          tags: |
            code-review
            slash-command

      - name: Create Devin session (label / manual dispatch)
        if: env.DEVIN_SKIP == 'false' && github.event_name != 'issue_comment'
        uses: aaronsteers/devin-action@6836af14bc904e8eff8e4f2b35eac4c428fc5f34 # v1
        with:
          issue-number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          prompt-text: >-
            Perform a code review of pull request
            #${{ github.event.pull_request.number || github.event.inputs.pr_number }}
            in ${{ github.repository }}. Report concrete defects with file/line
            references, grade findings by severity, and post your findings back
            as a comment on the pull request.
            ${{ github.event.inputs.prompt_text || '' }}
          devin-token: ${{ secrets.DEVIN_API_KEY }}
          org-id: ${{ vars.DEVIN_ORG_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          start-message: "🤖 Starting Devin code-review session…"
          max-acu-limit: 10
          tags: |
            code-review
            devin-review-label
