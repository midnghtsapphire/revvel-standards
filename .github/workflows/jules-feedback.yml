name: Send Feedback to Jules
on:
  pull_request_review:
    types:
      - submitted
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: jules-feedback-${{ github.event.pull_request.number }}-${{ github.event.review.id }}
  cancel-in-progress: false
jobs:
  send-feedback:
    name: Send review feedback to Jules
    runs-on: ubuntu-latest
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      FEEDBACK_USERS: ${{ vars.JULES_FEEDBACK_USERS }}
    steps:
      - name: Verify JULES_API_KEY and feedback allow-list are configured
        run: |
          if [ -z "${JULES_API_KEY}" ]; then
            echo "::warning::JULES_API_KEY is not set — skipping Send Feedback to Jules."
          else
            echo "JULES_API_KEY is configured."
          fi
          if [ -z "${FEEDBACK_USERS}" ]; then
            echo "::warning::JULES_FEEDBACK_USERS repo variable is not set — no reviewers will be allowed through."
          else
            echo "FEEDBACK_USERS is configured."
          fi
      - name: Send Feedback
        if: env.JULES_API_KEY != '' && env.FEEDBACK_USERS != ''
        uses: BeksOmega/jules-comms@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          feedback_users: ${{ env.FEEDBACK_USERS }}
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
