name: Research Engine Orchestrator
on:
  # `labeled` and `issue_comment` triggers removed: sibling automation tags
  # every WR issue with ~6 routing labels and posts bot comments constantly,
  # which re-ran this orchestrator on a loop (each completion then triggered
  # stuck-wr-detector → wr-pr-creation retries → [AUTO-ERROR] storms). Research
  # now runs once per new issue, or deliberately via workflow_dispatch.
  issues:
    types:
      - opened
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to research
        required: false
        type: string
      pr_number:
        description: PR number to request code-review agents on
        required: false
        type: string
      research_query:
        description: Direct research query when no issue is supplied
        required: false
        type: string
      research_depth:
        description: Research depth
        required: false
        default: deep_search
        type: choice
        options:
          - deep_search
          - standard
          - triangulated
          - swarm
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
# The concurrency group is split by event/action so that label-churn on a WR
# issue (sibling workflows tag it with ~6 routing labels right after `opened`)
# does NOT share a lane with — and therefore cannot cancel — the meaningful
# `opened` / `workflow_dispatch` / `issue_comment` run that actually performs
# research and dispatches PR creation. Previously every labeled event piled into
# `research-engine-<issue>` and, because runs sit pending under heavy queue load,
# each new labeled run cancelled the still-pending research run.
concurrency:
  group: research-engine-${{ github.event.issue.number || github.event.inputs.issue_number || github.event.inputs.research_query || github.run_id }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: false
jobs:
  route:
    name: Decide whether research engine should run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      issue_number: ${{ steps.decide.outputs.issue_number }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      research_query: ${{ steps.decide.outputs.research_query }}
      research_depth: ${{ steps.decide.outputs.research_depth }}
    steps:
      - name: Decide route
        id: decide
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const dispatch = context.eventName === 'workflow_dispatch';
            const issue = context.payload.issue;
            const isIssueComment = context.eventName === 'issue_comment';
            const isPullRequestComment = Boolean(issue?.pull_request);
            const inputs = context.payload.inputs || {};
            const commentBody = context.payload.comment?.body || '';
            const issueNumber = inputs.issue_number || issue?.number || '';
            const prNumber = inputs.pr_number || '';
            const title = issue?.title || inputs.research_query || '';
            const labels = (issue?.labels || []).map(label => typeof label === 'string' ? label : label.name);
            const triggerLabels = new Set([
              'research-engine',
              'weekly-research',
              'deep-research',
              'marketing',
              'seo',
              'competitor-research',
              'audience-research',
              'chatter-research',
              'wr:research',
            ]);
            const labelTriggered = labels.some(label => triggerLabels.has(label));
            const titleTriggered = /^\[WR\]/i.test(title) || /research|marketing|seo|competitor|audience|chatter/i.test(title);
            const hasAgentMention = /@copilot|@cursoragent|@openhands-agent|@imgbotapp/i.test(commentBody);
            const hasResearchIntent = /research engine|deep research|create a product|ship to market|implement|research|wr/i.test(commentBody);
            const commentTriggered = hasResearchIntent && (hasAgentMention || /research engine|deep research|wr/i.test(commentBody));
            // On a `labeled` event only a *specific* trigger label should start
            // a research run. Otherwise every sibling workflow that tags a WR
            // issue (work-request, weekly-research, openrouter, area:*,
            // priority:* …) re-fires a full research run. Title matching still
            // applies to opened/reopened so a fresh `[WR]` issue still triggers.
            const isLabeledEvent = context.eventName === 'issues' && context.payload.action === 'labeled';
            const issueEventTriggered = isLabeledEvent ? labelTriggered : (labelTriggered || titleTriggered);
            const issueCommentTriggered = isIssueComment && !isPullRequestComment && (commentTriggered || issueEventTriggered);
            // Never let a bot-authored event (re)start a research run — bot
            // comments/labels triggering this engine is the main runaway-loop
            // source. Human dispatch (workflow_dispatch) is always allowed.
            const isBot = context.payload.sender?.type === 'Bot';
            const shouldRun = dispatch || (!isBot && (issueCommentTriggered || (!isIssueComment && issueEventTriggered)));
            const querySource = isIssueComment ? commentBody : title;
            core.setOutput('should_run', shouldRun ? 'true' : 'false');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('research_query', inputs.research_query || querySource || '');
            core.setOutput('research_depth', inputs.research_depth || 'deep_search');
    timeout-minutes: 15
  research:
    name: Run layered research engine
    needs: route
    if: needs.route.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run research engine
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
          PR_NUMBER: ${{ needs.route.outputs.pr_number }}
          RESEARCH_QUERY: ${{ needs.route.outputs.research_query }}
          RESEARCH_DEPTH: ${{ needs.route.outputs.research_depth }}
          OUTPUT_FILE: docs/research-engine/run-${{ github.run_id }}.md
        run: node scripts/research-engine.js
      - name: Dispatch WR PR creation workflow
        if: needs.route.outputs.issue_number != ''
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
        with:
          script: |
            const issueNumber = (process.env.ISSUE_NUMBER || '').trim();
            const workflowId = 'wr-pr-creation.yml';
            const dispatchTime = Date.now();
            const MATCH_WINDOW_MS = 120000; // Account for API/listing clock skew around dispatch time.
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            // Retry the dispatch on rate-limit (403/429) instead of crashing.
            // Incident (issue #15673, run 29130339627): an unhandled 403
            // "API rate limit exceeded" here meant the WR PR was NEVER
            // dispatched, no completion label landed, and the WR sat at
            // wr:in-progress in the stuck-wr-detector dead zone. The token
            // bucket usually refills within minutes under burst load, so
            // spaced retries recover most transient rate-limit failures.
            // If every attempt fails we setFailed with a pointer to the
            // manual re-dispatch command — never throw unhandled.
            const RETRY_DELAYS_MS = [30000, 60000, 120000, 240000];
            let dispatched = false;
            let lastError = null;
            for (let attempt = 0; attempt <= RETRY_DELAYS_MS.length; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowId,
                  ref: 'main',
                  inputs: {
                    issue_number: issueNumber,
                  },
                });
                dispatched = true;
                core.info(`Dispatched ${workflowId} for issue #${issueNumber} (attempt ${attempt + 1})`);
                break;
              } catch (error) {
                lastError = error;
                const status = error.status || 0;
                const retriable = status === 403 || status === 429 || status >= 500;
                if (!retriable || attempt === RETRY_DELAYS_MS.length) {
                  break;
                }
                core.warning(
                  `Dispatch attempt ${attempt + 1} failed with HTTP ${status} (${error.message}). ` +
                  `Retrying in ${RETRY_DELAYS_MS[attempt] / 1000}s...`
                );
                await sleep(RETRY_DELAYS_MS[attempt]);
              }
            }

            if (!dispatched) {
              core.setFailed(
                `Could not dispatch ${workflowId} for issue #${issueNumber} after retries: ` +
                `${lastError ? lastError.message : 'unknown error'}. ` +
                `Re-dispatch manually with: gh workflow run ${workflowId} --repo ${context.repo.owner}/${context.repo.repo} -f issue_number=${issueNumber}`
              );
              return;
            }
            const delays = [5000, 10000, 20000, 30000];
            let foundRun = null;

            for (const delay of delays) {
              await sleep(delay);
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                event: 'workflow_dispatch',
                per_page: 20,
              });

              foundRun = (data.workflow_runs || []).find((run) => {
                const created = new Date(run.created_at || 0).getTime();
                return Number.isFinite(created) && created >= (dispatchTime - MATCH_WINDOW_MS);
              });

              if (foundRun) {
                core.info(`Confirmed WR PR workflow run #${foundRun.run_number}: ${foundRun.html_url}`);
                break;
              }
            }

            if (!foundRun) {
              core.warning(
                `Dispatched ${workflowId} for issue #${issueNumber} but could not confirm a started run yet. ` +
                `Check: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/${workflowId}`
              );
            }
      - name: Commit research packet
        # Best-effort archival only: repository rules may reject direct pushes to
        # main, but that must never block the WR handoff to wr-pr-creation.yml.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "revvel-automation[bot]"
          git config user.email "revvel-automation[bot]@users.noreply.github.com"
          git add docs/research-engine
          if git diff --staged --quiet; then
            echo "No research packet changes to commit."
          else
            git commit -m "research: add research engine packet"
            git push
          fi
    timeout-minutes: 60
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
