name: Stale Docs Check
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: 0 11 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  check:
    name: Check for stale documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find stale docs
        run: |
          STALE_DAYS=30
          CUTOFF=$(date -d "-${STALE_DAYS} days" +%s 2>/dev/null || date -v-${STALE_DAYS}d +%s)
          STALE_COUNT=0

          echo "## Stale Documentation Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Files not updated in the last ${STALE_DAYS} days:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Last Updated | Days Stale |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # Check key state docs that tend to go stale
          TRACKED_DOCS=(
            "docs/SPRINT_STATE.md"
            "docs/PROJECT_CATALOG.md"
            "docs/REPO_TODO_LIST.md"
          )

          for doc in "${TRACKED_DOCS[@]}"; do
            if [ -f "$doc" ]; then
              LAST_COMMIT=$(git log -1 --format=%ct -- "$doc" 2>/dev/null || echo 0)
              if [ "$LAST_COMMIT" -lt "$CUTOFF" ]; then
                LAST_DATE=$(git log -1 --format=%ci -- "$doc" | cut -d' ' -f1)
                DAYS_AGO=$(( ($(date +%s) - LAST_COMMIT) / 86400 ))
                echo "| \`$doc\` | $LAST_DATE | ${DAYS_AGO}d |" >> "$GITHUB_STEP_SUMMARY"
                STALE_COUNT=$((STALE_COUNT + 1))
              fi
            fi
          done

          if [ "$STALE_COUNT" -eq 0 ]; then
            echo "| _(none)_ | — | — |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Checked at $(date -u '+%Y-%m-%d %H:%M UTC'). Threshold: ${STALE_DAYS} days._" >> "$GITHUB_STEP_SUMMARY"

          if [ "$STALE_COUNT" -gt 0 ]; then
            echo "::warning::${STALE_COUNT} tracked doc(s) are stale (not updated in ${STALE_DAYS}+ days)."
          fi
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
