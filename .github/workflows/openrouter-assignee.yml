name: OpenRouter Assignee — First Line of Sight

# Attempts to assign all new issues and PRs to @oaudrey (the GitHub-visible
# alias for the OpenRouter / oAudrey orchestrator)
# as the first line of sight. This follows the Automation Routing Policy: all
# automation routes through OpenRouter via OPENROUTER_API_KEY. Runs on:
#   1. Every new issue/PR opened or reopened
#   2. Hourly cron sweep to catch anything that was missed
#   3. Manual workflow_dispatch for testing/dry-run
#
# The workflow applies routing labels (openrouter, auto-fix, copilot,
# role:orchestrator) and posts a first-line-of-sight comment that points
# reviewers and auditors at the OPENROUTER_API_KEY, relevant skills, and this
# process documentation.
#
# Reference: docs/OPENROUTER_ASSIGNEE_PROCESS.md

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log what would be changed without making changes)"
        required: false
        type: boolean
        default: false
      issue_number:
        description: "Target issue number (for targeted dispatch from reset workflows)"
        required: false
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: openrouter-assignee-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || 'cron-sweep' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  route-new:
    name: Route new issue/PR to OpenRouter
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve issue/PR number
        id: resolve
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = context.payload.inputs?.issue_number || context.payload.issue?.number || context.payload.pull_request?.number;

            // For workflow_dispatch, we must fetch the item to determine if it's an issue or PR.
            // Since we only reset issues in practice, we default to 'issue' if inputs.issue_number is used,
            // or we could check the payload. We will determine it via API.
            // Wait, we can just use the github.rest.issues API. Both issues and PRs can be fetched via issues API.
            // But let's just make it 'issue' for workflow_dispatch for now, since it only supports issue_number.
            const isPullRequest = !!context.payload.pull_request;
            const itemKind = isPullRequest ? 'pull_request' : 'issue';
            const displayKind = isPullRequest ? 'pull request' : 'issue';

            if (!issueNumber) {
              core.notice('No issue/PR number found; skipping.');
              core.setOutput('skip', 'true');
              return;
            }

            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('item_kind', itemKind);
            core.setOutput('display_kind', displayKind);
            core.setOutput('skip', 'false');

            core.info(`Routing ${displayKind} #${issueNumber} to OpenRouter`);

      - name: Check if already routed
        id: check
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/github-script@v9.0.0
        env:
          RESOLVE_ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          RESOLVE_ITEM_KIND: ${{ steps.resolve.outputs.item_kind }}
        with:
          script: |
            const issueNumber = parseInt((process.env.RESOLVE_ISSUE_NUMBER || ''));
            const itemKind = (process.env.RESOLVE_ITEM_KIND || '');
            let item;

            try {
              const res = itemKind === 'issue'
                ? await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                  })
                : await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: issueNumber,
                  });
              item = res.data;
            } catch (e) {
              core.warning(`Failed to fetch item metadata: ${e.message}`);
              core.setOutput('skip', 'true');
              return;
            }

            const labels = (item.labels || []).map(l => typeof l === 'string' ? l : l.name);

            // Skip if already has openrouter label (sole idempotency key)
            if (labels.includes('openrouter')) {
              core.notice(`${itemKind} #${issueNumber} already has openrouter label`);
              core.setOutput('skip', 'true');
              return;
            }

            // Skip if has no-triage label
            if (labels.includes('no-triage')) {
              core.notice(`${itemKind} #${issueNumber} has no-triage label; skipping`);
              core.setOutput('skip', 'true');
              return;
            }

            core.setOutput('skip', 'false');

      - name: Apply routing labels
        if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        uses: actions/github-script@v9.0.0
        env:
          RESOLVE_ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt((process.env.RESOLVE_ISSUE_NUMBER || ''));
            const labelsToAdd = ['openrouter', 'auto-fix', 'copilot', 'role:orchestrator'];

            for (const label of labelsToAdd) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label],
                });
                core.info(`✅ Added label: ${label}`);
              } catch (error) {
                core.notice(`Could not add label "${label}" (ok if missing): ${error.message}`);
              }
            }

      - name: Assign to oAudrey orchestrator
        id: assign
        if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        uses: actions/github-script@v9.0.0
        env:
          RESOLVE_ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt((process.env.RESOLVE_ISSUE_NUMBER || ''));

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: ['oaudrey'],
              });
              core.info(`✅ Assigned @oaudrey to #${issueNumber}`);
              core.setOutput('assigned', 'true');
            } catch (error) {
              core.notice(`Could not assign @oaudrey to #${issueNumber} (non-fatal): ${error.message}`);
              core.setOutput('assigned', 'false');
            }

      - name: Post first-line-of-sight comment
        if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        uses: actions/github-script@v9.0.0
        env:
          HAS_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          RESOLVE_ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          RESOLVE_DISPLAY_KIND: ${{ steps.resolve.outputs.display_kind }}
          ASSIGN_ASSIGNED: ${{ steps.assign.outputs.assigned }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt((process.env.RESOLVE_ISSUE_NUMBER || ''));
            const displayKind = (process.env.RESOLVE_DISPLAY_KIND || '');
            const hasApiKey = process.env.HAS_API_KEY === 'true';
            const apiKeyStatus = hasApiKey
              ? '🟢 Configured'
              : '⚠️ Not configured — set OPENROUTER_API_KEY in Actions secrets';

            const assignSucceeded = (process.env.ASSIGN_ASSIGNED || '') === 'true';
            const assigneeLine = assignSucceeded
              ? '- ✅ Assignee: `@oaudrey` (GitHub-visible oAudrey/OpenRouter orchestrator)'
              : '- ⚠️ Assignee: `@oaudrey` — assignment attempted but failed (labels still applied; routing is finalized)';
            const assignedText = assignSucceeded
              ? `This ${displayKind} has been automatically assigned to **@oaudrey** — the OpenRouter / oAudrey orchestrator.`
              : `This ${displayKind} has been routed to the OpenRouter / oAudrey orchestrator. **Note:** @oaudrey assignment failed (non-fatal) — routing labels are applied and this item will not be re-routed. Assignment will not be retried automatically.`;

            const comment = [
              '🤖 **OpenRouter First Line of Sight**',
              '',
              assignedText,
              '',
              '**Routing applied:**',
              assigneeLine,
              '- ✅ Labels: `openrouter`, `auto-fix`, `copilot`, `role:orchestrator`',
              '',
              `**OpenRouter API:** ${apiKeyStatus}`,
              '',
              '**What happens next:**',
              `1. OpenRouter triage will analyze this ${displayKind}`,
              '2. Appropriate labels and priority will be assigned',
              '3. The orchestrator will coordinate work or route to specialized agents',
              '4. If the orchestrator cannot complete the task, it will apply `needs-human` label',
              '',
              '**For reviewers/auditors:**',
              `- Process documentation: [docs/OPENROUTER_ASSIGNEE_PROCESS.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/OPENROUTER_ASSIGNEE_PROCESS.md)`,
              `- OpenRouter orchestrator skill: [skills/openrouter-swarms/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/skills/openrouter-swarms/SKILL.md)`,
              `- Ralph self-healing loop: [skills/ralph-loop/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/skills/ralph-loop/SKILL.md)`,
              '',
              '_Automated by `.github/workflows/openrouter-assignee.yml` — runs 24/7 on event triggers + hourly cron sweep_'
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
              core.info(`✅ Posted first-line-of-sight comment on #${issueNumber}`);
            } catch (error) {
              core.notice(`Could not post first-line-of-sight comment (ok if missing): ${error.message}`);
              core.notice(`Could not post first-line-of-sight comment on #${issueNumber} (non-fatal): ${error.message}`);
            }

  ralph-cron-sweep:
    name: Hourly cron sweep — catch missed items
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (!github.event.inputs.issue_number || github.event.inputs.issue_number == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Determine if dry run
        id: dry-run-check
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN MODE — will not make changes"
          fi

      - name: Discover unrouted open issues and PRs
        id: discover
        uses: actions/github-script@v9.0.0
        env:
          HAS_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          DRY_RUN_CHECK_DRY_RUN: ${{ steps.dry-run-check.outputs.dry_run }}
        with:
          script: |
            const isDryRun = (process.env.DRY_RUN_CHECK_DRY_RUN || '') === 'true';
            const hasApiKey = process.env.HAS_API_KEY === 'true';

            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const toRoute = [];
            const alreadyRouted = [];
            const noTriageLabel = [];

            for (const item of items) {
              const itemNumber = item.number;
              const itemKind = item.pull_request ? 'PR' : 'Issue';
              const labels = (item.labels || []).map(l => typeof l === 'string' ? l : l.name);

              // openrouter label is the sole idempotency key — no assignee check
              if (labels.includes('openrouter')) {
                alreadyRouted.push(`${itemKind} #${itemNumber}`);
                continue;
              }

              if (labels.includes('no-triage')) {
                noTriageLabel.push(`${itemKind} #${itemNumber}`);
                continue;
              }

              toRoute.push({ number: itemNumber, kind: itemKind, title: item.title });
            }

            core.info(`📊 Sweep Summary:`);
            core.info(`  Total open items: ${items.length}`);
            core.info(`  To route: ${toRoute.length}`);
            core.info(`  Already routed: ${alreadyRouted.length}`);
            core.info(`  No-triage label: ${noTriageLabel.length}`);

            if (toRoute.length > 0) {
              core.info(`\n🎯 Items to route:`);
              for (const item of toRoute) {
                core.info(`  ${item.kind} #${item.number}: ${item.title}`);
              }
            }

            core.setOutput('count', String(toRoute.length));
            core.setOutput('total_open', String(items.length));
            core.setOutput('already_routed', String(alreadyRouted.length));

            await core.summary
              .addHeading('OpenRouter Assignee — Cron Sweep')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Count', header: true}],
                ['Total open items', String(items.length)],
                ['Items to route', String(toRoute.length)],
                ['Already routed', String(alreadyRouted.length)],
                ['No-triage label', String(noTriageLabel.length)],
                ['Dry run?', isDryRun ? 'Yes' : 'No'],
                ['OPENROUTER_API_KEY', hasApiKey ? 'Configured' : 'Not configured'],
              ])
              .write();

      - name: Route discovered items
        if: steps.discover.outputs.count != '0'
        uses: actions/github-script@v9.0.0
        env:
          HAS_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          DRY_RUN_CHECK_DRY_RUN: ${{ steps.dry-run-check.outputs.dry_run }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const isDryRun = (process.env.DRY_RUN_CHECK_DRY_RUN || '') === 'true';
            const hasApiKey = process.env.HAS_API_KEY === 'true';
            const apiKeyStatus = hasApiKey
              ? '🟢 Configured'
              : '⚠️ Not configured — set OPENROUTER_API_KEY in Actions secrets';

            // Recompute routing candidates via paginate — avoids "argument list too long"
            // on large backlogs when passing JSON through step env outputs.
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const toRoute = items
              .filter((item) => {
                const labels = (item.labels || []).map(l => typeof l === 'string' ? l : l.name);
                return !labels.includes('openrouter') && !labels.includes('no-triage');
              })
              .map((item) => ({
                number: item.number,
                kind: item.pull_request ? 'PR' : 'Issue',
                title: item.title,
              }));

            core.info(`\n🚀 Starting routing ${isDryRun ? '(DRY RUN)' : ''}...`);

            for (const item of toRoute) {
              core.info(`\n📍 Routing ${item.kind} #${item.number}: ${item.title}`);

              if (isDryRun) {
                core.info(`  [DRY RUN] Would add labels: openrouter, auto-fix, copilot, role:orchestrator`);
                core.info(`  [DRY RUN] Would assign @oaudrey`);
                core.info(`  [DRY RUN] Would post first-line-of-sight comment`);
                continue;
              }

              try {
                // Apply labels first — openrouter label is the idempotency key.
                // Even if assignment fails, next sweep will skip this item.
                const labelsToAdd = ['openrouter', 'auto-fix', 'copilot', 'role:orchestrator'];
                for (const label of labelsToAdd) {
                  try {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: item.number,
                      labels: [label],
                    });
                  } catch (error) {
                    core.notice(`  Could not add label "${label}": ${error.message}`);
                  }
                }
                core.info(`  ✅ Applied routing labels`);

                // Assign to oAudrey (non-fatal — label already guarantees idempotency)
                let assignSucceeded = false;
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: item.number,
                    assignees: ['oaudrey'],
                  });
                  assignSucceeded = true;
                  core.info(`  ✅ Assigned @oaudrey`);
                } catch (error) {
                  core.notice(`  Could not assign @oaudrey (non-fatal): ${error.message}`);
                }

                const displayKind = item.kind === 'PR' ? 'pull request' : 'issue';
                const assigneeLine = assignSucceeded
                  ? '- ✅ Assignee: `@oaudrey` (GitHub-visible oAudrey/OpenRouter orchestrator)'
                  : '- ⚠️ Assignee: `@oaudrey` — assignment attempted but failed (labels still applied; routing is finalized)';
                const assignedText = assignSucceeded
                  ? `This ${displayKind} has been automatically assigned to **@oaudrey** — the OpenRouter / oAudrey orchestrator.`
                  : `This ${displayKind} has been routed to the OpenRouter / oAudrey orchestrator. **Note:** @oaudrey assignment failed (non-fatal) — routing labels are applied and this item will not be re-routed. Assignment will not be retried automatically.`;
                const comment = [
                  '🤖 **OpenRouter First Line of Sight** (cron sweep)',
                  '',
                  assignedText,
                  '',
                  '**Routing applied:**',
                  assigneeLine,
                  '- ✅ Labels: `openrouter`, `auto-fix`, `copilot`, `role:orchestrator`',
                  '',
                  `**OpenRouter API:** ${apiKeyStatus}`,
                  '',
                  '**What happens next:**',
                  `1. OpenRouter triage will analyze this ${displayKind}`,
                  '2. Appropriate labels and priority will be assigned',
                  '3. The orchestrator will coordinate work or route to specialized agents',
                  '4. If the orchestrator cannot complete the task, it will apply `needs-human` label',
                  '',
                  '**For reviewers/auditors:**',
                  `- Process documentation: [docs/OPENROUTER_ASSIGNEE_PROCESS.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/OPENROUTER_ASSIGNEE_PROCESS.md)`,
                  `- OpenRouter orchestrator skill: [skills/openrouter-swarms/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/skills/openrouter-swarms/SKILL.md)`,
                  `- Ralph self-healing loop: [skills/ralph-loop/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/skills/ralph-loop/SKILL.md)`,
                  '',
                  '_Automated by `.github/workflows/openrouter-assignee.yml` — 24/7 cron sweep (picked up by hourly run)_'
                ].join('\n');

                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: item.number,
                    body: comment,
                  });
                  core.info(`  ✅ Posted first-line-of-sight comment`);
                } catch (error) {
                  core.notice(`Could not post first-line-of-sight comment (ok if missing): ${error.message}`);
                }

              } catch (error) {
                core.error(`  ❌ Error routing ${item.kind} #${item.number}: ${error.message}`);
              }
            }

            core.info(`\n✅ Cron sweep complete ${isDryRun ? '(DRY RUN)' : ''}`);
