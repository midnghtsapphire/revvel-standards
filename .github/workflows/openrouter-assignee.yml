name: OpenRouter Assignee — First Line of Sight

# Makes the OpenRouter-backed orchestrator the first line of sight on every
# issue and pull request in this repository, and runs a 24/7 Ralph-style cron
# sweep that keeps untriaged work routed automatically.
#
# Because "OpenRouter" is a service (not a GitHub user), the GitHub-visible
# assignee is `Copilot` — the OpenRouter-routed orchestrator (see
# skills/openrouter-swarms/SKILL.md). The `openrouter` label + a first-line-
# of-sight comment supply the routing signal the orchestrator consumes.
#
# Secret:   OPENROUTER_API_KEY  (Vault path: revvel/shared/llm/openrouter)
# Doc:      docs/OPENROUTER_ASSIGNEE_PROCESS.md
# Related:  .github/workflows/ralph-loop.yml  (CI-failure loop on PRs)
#           .github/workflows/issue-automation.yml  (template / dedup triage)

on:
  issues:
    types: [opened, reopened]
  # `pull_request_target` (not `pull_request`) so the job has write permissions
  # even for PRs opened from forks — routing needs to assign + label + comment.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  schedule:
    # Hourly sweep — the 24/7 Ralph loop. Edit here or override per repo by
    # forking this workflow; keep cadence aligned with your OpenRouter budget.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log actions without assigning / labelling"
        type: boolean
        default: false

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: openrouter-assignee-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || 'cron' }}
  cancel-in-progress: false

jobs:
  # ─── Immediate: new issue or PR ──────────────────────────────────────────────
  route-new:
    name: Route new issue or PR
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Verify OPENROUTER_API_KEY and ADMIN_GITHUB_TOKEN are configured
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set. Routing will still tag Copilot, but the OpenRouter orchestrator will not be able to process this item until the secret is added. See docs/OPENROUTER_ASSIGNEE_PROCESS.md."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi
          if [ -z "${ADMIN_GITHUB_TOKEN}" ]; then
            echo "::notice::ADMIN_GITHUB_TOKEN is not set. Using the default GITHUB_TOKEN for routing."
          else
            echo "ADMIN_GITHUB_TOKEN is configured."
          fi

      - name: Assign OpenRouter orchestrator + label + comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const issue_number =
              context.payload.issue?.number ||
              context.payload.pull_request?.number;
            if (!issue_number) {
              core.info('No issue / PR number in payload — skipping.');
              return;
            }

            const isPR = !!context.payload.pull_request;
            const kind = isPR ? 'pull request' : 'issue';
            const hasKey = !!process.env.OPENROUTER_API_KEY;
            const hasAdmin = !!process.env.ADMIN_GITHUB_TOKEN;
            const existingLabels = (
              context.payload.issue?.labels ||
              context.payload.pull_request?.labels ||
              []
            ).map(label => typeof label === 'string' ? label : label.name);
            const hasFixerRole = existingLabels.includes('role:fixer');

            // Build a fallback Octokit authenticated with GITHUB_TOKEN so that
            // when ADMIN_GITHUB_TOKEN is present but under-scoped (returns 403
            // "Resource not accessible by personal access token") we can still
            // route the item — GITHUB_TOKEN has issues:write + pull-requests:write
            // granted via this workflow's `permissions:` block.
            const gh = require('@actions/github');
            const fallbackToken = process.env.FALLBACK_GITHUB_TOKEN;
            const fallbackOctokit =
              fallbackToken && fallbackToken !== process.env.ADMIN_GITHUB_TOKEN
                ? gh.getOctokit(fallbackToken)
                : null;

            async function withFallback(label, fn) {
              try {
                return await fn(github);
              } catch (err) {
                const permError = err.status === 403 || err.status === 404;
                if (fallbackOctokit && permError) {
                  core.info(
                    `${label}: primary token returned ${err.status}; retrying with GITHUB_TOKEN.`
                  );
                  try {
                    return await fn(fallbackOctokit);
                  } catch (err2) {
                    core.warning(`${label} (fallback): ${err2.message}`);
                    return null;
                  }
                }
                core.warning(`${label}: ${err.message}`);
                return null;
              }
            }

            // 1) Assign Copilot (the OpenRouter-routed orchestrator).
            await withFallback(
              `Could not assign Copilot to #${issue_number}`,
              (octokit) =>
                octokit.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  assignees: ['Copilot'],
                })
            );
            core.info(`Routed ${kind} #${issue_number} to Copilot (best-effort).`);

            // 2) Apply routing labels (best-effort).
            const routingLabels = ['openrouter', 'auto-fix', 'copilot'];
            if (!hasFixerRole) routingLabels.push('role:orchestrator');
            for (const label of routingLabels) {
              await withFallback(
                `Could not add label "${label}" (ok if missing)`,
                (octokit) =>
                  octokit.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    labels: [label],
                  })
              );
            }

            // 3) Post the first-line-of-sight comment.
            const body =
              `🤖 **OpenRouter Orchestrator — First Line of Sight**\n\n` +
              `This ${kind} has been routed to the OpenRouter-backed orchestrator ` +
              `(GitHub assignee: \`@Copilot\`) as the first line of sight.\n\n` +
              `- Secret: \`OPENROUTER_API_KEY\` ${hasKey ? '✅ configured' : '⚠️ **not configured** — add it in repo Settings → Secrets'}\n` +
              `- Admin token: \`ADMIN_GITHUB_TOKEN\` ${hasAdmin ? '✅ configured' : '⚠️ not configured — using \`GITHUB_TOKEN\`'}\n` +
              `- Role label: ${hasFixerRole ? '\`role:fixer\` (pre-existing)' : '\`role:orchestrator\` (default)'}\n` +
              `- Skill: \`skills/openrouter-swarms/SKILL.md\`\n` +
              `- Loop: \`skills/ralph-loop/SKILL.md\` (24/7 cron sweep enabled)\n` +
              `- Docs: \`docs/OPENROUTER_ASSIGNEE_PROCESS.md\`\n\n` +
              `The orchestrator will pick this up autonomously. If it stalls, ` +
              `add the \`needs-human\` label to flag for manual attention.`;
            await withFallback(
              'Could not post routing comment',
              (octokit) =>
                octokit.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body,
                })
            );
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          FALLBACK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 24/7 Ralph cron sweep ───────────────────────────────────────────────────
  ralph-cron-sweep:
    name: Ralph cron sweep (24/7)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Sweep open issues / PRs with no assignee
        uses: actions/github-script@v8
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          FALLBACK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            const hasKey = !!process.env.OPENROUTER_API_KEY;
            const hasAdmin = !!process.env.ADMIN_GITHUB_TOKEN;

            // Build a fallback Octokit authenticated with GITHUB_TOKEN so we
            // gracefully recover when ADMIN_GITHUB_TOKEN is set but missing the
            // required scopes (surfaces as 403 "Resource not accessible by
            // personal access token").
            const gh = require('@actions/github');
            const fallbackToken = process.env.FALLBACK_GITHUB_TOKEN;
            const fallbackOctokit =
              fallbackToken && fallbackToken !== process.env.ADMIN_GITHUB_TOKEN
                ? gh.getOctokit(fallbackToken)
                : null;

            async function withFallback(label, fn) {
              try {
                return await fn(github);
              } catch (err) {
                const permError = err.status === 403 || err.status === 404;
                if (fallbackOctokit && permError) {
                  core.info(
                    `${label}: primary token returned ${err.status}; retrying with GITHUB_TOKEN.`
                  );
                  try {
                    return await fn(fallbackOctokit);
                  } catch (err2) {
                    core.warning(`${label} (fallback): ${err2.message}`);
                    return null;
                  }
                }
                core.info(`${label}: ${err.message}`);
                return null;
              }
            }

            // Pull open issues (includes PRs — filter afterwards via pull_request field).
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            let routed = 0;
            let skipped = 0;

              for (const item of items) {
              // Skip anything already assigned — the orchestrator (or a human) owns it.
              if (item.assignees && item.assignees.length > 0) { skipped++; continue; }
              // Skip items already tagged as escalated.
              const labelNames = (item.labels || []).map(l => typeof l === 'string' ? l : l.name);
              // if (labelNames.includes('needs-human') || labelNames.includes('blocked')) { skipped++; continue; }
              // Skip items already routed by a previous sweep.
              if (labelNames.includes('openrouter')) { skipped++; continue; }

              const isPR = !!item.pull_request;
              const kind = isPR ? 'pull request' : 'issue';

              if (dryRun) {
                core.info(`[dry-run] would route ${kind} #${item.number}: ${item.title}`);
                routed++;
                continue;
              }

              await withFallback(
                `Could not assign Copilot to #${item.number}`,
                (octokit) =>
                  octokit.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: item.number,
                    assignees: ['Copilot'],
                  })
              );

              const routingLabels = ['openrouter', 'auto-fix', 'copilot'];
              if (!labelNames.includes('role:fixer')) routingLabels.push('role:orchestrator');
              for (const label of routingLabels) {
                await withFallback(
                  `Could not add label "${label}" to #${item.number}`,
                  (octokit) =>
                    octokit.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: item.number,
                      labels: [label],
                    })
                );
              }

              await withFallback(
                `Could not post sweep comment to #${item.number}`,
                (octokit) =>
                  octokit.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: item.number,
                    body:
                      `🔁 **Ralph cron sweep — 24/7**\n\n` +
                      `This ${kind} was unassigned at sweep time and has been routed to ` +
                      `the OpenRouter orchestrator (\`@Copilot\`).\n\n` +
                      `- \`OPENROUTER_API_KEY\`: ${hasKey ? '✅ configured' : '⚠️ not configured'}\n` +
                      `- \`ADMIN_GITHUB_TOKEN\`: ${hasAdmin ? '✅ configured' : '⚠️ not configured (using GITHUB_TOKEN)'}\n` +
                      `- See \`docs/OPENROUTER_ASSIGNEE_PROCESS.md\` to tune the cron cadence.`,
                  })
              );

              routed++;
            }

            core.info(`Ralph cron sweep complete. routed=${routed} skipped=${skipped} total=${items.length} dryRun=${dryRun}`);
            core.summary
              .addHeading('Ralph cron sweep')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Routed', String(routed)],
                ['Skipped', String(skipped)],
                ['Total open', String(items.length)],
                ['Dry run', String(dryRun)],
                ['OPENROUTER_API_KEY', hasKey ? 'configured' : 'missing'],
                ['ADMIN_GITHUB_TOKEN', hasAdmin ? 'configured' : 'missing'],
              ])
              .write();
