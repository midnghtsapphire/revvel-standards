name: OpenRouter Assignee — First Line of Sight

# Automatically assigns all new issues and PRs to @Copilot (a GitHub user account
# representing the OpenRouter orchestrator, NOT the paid GitHub Copilot service)
# as the first line of sight. This follows the Automation Routing Policy: all
# automation routes through OpenRouter via OPENROUTER_API_KEY. Runs on:
#   1. Every new issue/PR opened or reopened
#   2. Hourly cron sweep to catch anything that was missed
#   3. Manual workflow_dispatch for testing/dry-run
#
# The workflow applies routing labels (openrouter, auto-fix, copilot,
# role:orchestrator) and posts a first-line-of-sight comment that points
# reviewers and auditors at the OPENROUTER_API_KEY, relevant skills, and this
# process documentation.
#
# Reference: docs/OPENROUTER_ASSIGNEE_PROCESS.md

on:
  # OpenHands-RESTRUCTURE 2026-05-04: `issues` live trigger disabled — was racing
  # with openrouter-coder, jules-invoke, openrouter-triage, priority-router
  # on every new issue (5+ workflows fighting for first comment). The hourly
  # cron sweep still picks up anything missed and assigns @Copilot, so
  # orchestrator first-line-of-sight remains intact.
  # issues:
  #   types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: "0 * * * *"  # Every hour, top of the hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log what would be changed without making changes)"
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: openrouter-assignee-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || 'cron-sweep' }}
  cancel-in-progress: false

jobs:
  route-new:
    name: Route new issue/PR to OpenRouter
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue/PR number
        id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            const itemKind = context.payload.issue ? 'issue' : 'pull_request';
            const displayKind = context.payload.issue ? 'issue' : 'pull request';
            
            if (!issueNumber) {
              core.notice('No issue/PR number found; skipping.');
              core.setOutput('skip', 'true');
              return;
            }
            
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('item_kind', itemKind);
            core.setOutput('display_kind', displayKind);
            core.setOutput('skip', 'false');
            
            core.info(`Routing ${displayKind} #${issueNumber} to OpenRouter`);

      - name: Check if already assigned or routed
        id: check
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = parseInt('${{ steps.resolve.outputs.issue_number }}');
            const itemKind = '${{ steps.resolve.outputs.item_kind }}';
            
            // Get the issue/PR details
            const { data: item } = itemKind === 'issue' 
              ? await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                })
              : await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                });
            
            const assignees = item.assignees || [];
            const labels = (item.labels || []).map(l => typeof l === 'string' ? l : l.name);
            
            // Skip if already has assignee
            if (assignees.length > 0) {
              core.notice(`${itemKind} #${issueNumber} already has assignee(s): ${assignees.map(a => a.login).join(', ')}`);
              core.setOutput('skip', 'true');
              return;
            }
            
            // Skip if already has openrouter label (already routed)
            if (labels.includes('openrouter')) {
              core.notice(`${itemKind} #${issueNumber} already has openrouter label`);
              core.setOutput('skip', 'true');
              return;
            }
            
            // Skip if has no-triage label
            if (labels.includes('no-triage')) {
              core.notice(`${itemKind} #${issueNumber} has no-triage label; skipping`);
              core.setOutput('skip', 'true');
              return;
            }
            
            core.setOutput('skip', 'false');

      - name: Assign to Copilot orchestrator
        if: steps.resolve.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt('${{ steps.resolve.outputs.issue_number }}');
            
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: ['Copilot'],
            });
            core.info(`✅ Assigned @Copilot to #${issueNumber}`);

      - name: Apply routing labels
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = parseInt('${{ steps.resolve.outputs.issue_number }}');
            const labelsToAdd = ['openrouter', 'auto-fix', 'copilot', 'role:orchestrator'];
            
            for (const label of labelsToAdd) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label],
                });
                core.info(`✅ Added label: ${label}`);
              } catch (error) {
                core.notice(`Could not add label "${label}" (ok if missing): ${error.message}`);
              }
            }

      - name: Post first-line-of-sight comment
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v8
        env:
          HAS_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        with:
          script: |
            const issueNumber = parseInt('${{ steps.resolve.outputs.issue_number }}');
            const displayKind = '${{ steps.resolve.outputs.display_kind }}';
            const hasApiKey = process.env.HAS_API_KEY === 'true';
            const apiKeyStatus = hasApiKey 
              ? '🟢 Configured' 
              : '⚠️ Not configured — set OPENROUTER_API_KEY in Actions secrets';
            
            const comment = [
              '🤖 **OpenRouter First Line of Sight**',
              '',
              `This ${displayKind} has been automatically assigned to **@Copilot** — the OpenRouter orchestrator.`,
              '',
              '**Routing applied:**',
              '- ✅ Assignee: `@Copilot` (GitHub-visible orchestrator)',
              '- ✅ Labels: `openrouter`, `auto-fix`, `copilot`, `role:orchestrator`',
              '',
              `**OpenRouter API:** ${apiKeyStatus}`,
              '',
              '**What happens next:**',
              `1. OpenRouter triage will analyze this ${displayKind}`,
              '2. Appropriate labels and priority will be assigned',
              '3. The orchestrator will coordinate work or route to specialized agents',
              '4. If the orchestrator cannot complete the task, it will apply `needs-human` label',
              '',
              '**For reviewers/auditors:**',
              `- Process documentation: [docs/OPENROUTER_ASSIGNEE_PROCESS.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/OPENROUTER_ASSIGNEE_PROCESS.md)`,
              `- OpenRouter orchestrator skill: [skills/openrouter-swarms/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/skills/openrouter-swarms/SKILL.md)`,
              `- Ralph self-healing loop: [skills/ralph-loop/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/skills/ralph-loop/SKILL.md)`,
              '',
              '_Automated by `.github/workflows/openrouter-assignee.yml` — runs 24/7 on event triggers + hourly cron sweep_'
            ].join('\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment,
            });
            
            core.info(`✅ Posted first-line-of-sight comment on #${issueNumber}`);

  # Hourly cron sweep job
  # Named 'ralph-cron-sweep' following the Ralph self-healing pattern (see skills/ralph-loop/SKILL.md)
  # for consistency with other continuous monitoring jobs in the repo.
  ralph-cron-sweep:
    name: Hourly cron sweep — catch missed items
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Determine if dry run
        id: dry-run-check
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN MODE — will not make changes"
          fi

      - name: Discover unrouted open issues and PRs
        id: discover
        uses: actions/github-script@v8
        env:
          HAS_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        with:
          script: |
            const isDryRun = '${{ steps.dry-run-check.outputs.dry_run }}' === 'true';
            const hasApiKey = process.env.HAS_API_KEY === 'true';
            
            // Fetch all open issues (includes PRs)
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            
            const toRoute = [];
            const alreadyRouted = [];
            const hasAssignee = [];
            const noTriageLabel = [];
            
            for (const item of items) {
              const itemNumber = item.number;
              const itemKind = item.pull_request ? 'PR' : 'Issue';
              const assignees = item.assignees || [];
              const labels = (item.labels || []).map(l => typeof l === 'string' ? l : l.name);
              
              // Skip if already has assignee
              if (assignees.length > 0) {
                hasAssignee.push(`${itemKind} #${itemNumber}`);
                continue;
              }
              
              // Skip if already routed
              if (labels.includes('openrouter')) {
                alreadyRouted.push(`${itemKind} #${itemNumber}`);
                continue;
              }
              
              // Skip if has no-triage label
              if (labels.includes('no-triage')) {
                noTriageLabel.push(`${itemKind} #${itemNumber}`);
                continue;
              }
              
              // This one needs routing
              toRoute.push({
                number: itemNumber,
                kind: itemKind,
                title: item.title,
              });
            }
            
            // Log summary
            core.info(`📊 Sweep Summary:`);
            core.info(`  Total open items: ${items.length}`);
            core.info(`  To route: ${toRoute.length}`);
            core.info(`  Already routed: ${alreadyRouted.length}`);
            core.info(`  Has assignee: ${hasAssignee.length}`);
            core.info(`  No-triage label: ${noTriageLabel.length}`);
            
            if (toRoute.length > 0) {
              core.info(`\n🎯 Items to route:`);
              for (const item of toRoute) {
                core.info(`  ${item.kind} #${item.number}: ${item.title}`);
              }
            }
            
            core.setOutput('to_route', JSON.stringify(toRoute));
            core.setOutput('count', String(toRoute.length));
            core.setOutput('total_open', String(items.length));
            core.setOutput('already_routed', String(alreadyRouted.length));
            core.setOutput('has_assignee', String(hasAssignee.length));
            
            // Write summary
            await core.summary
              .addHeading('OpenRouter Assignee — Cron Sweep')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Count', header: true}],
                ['Total open items', String(items.length)],
                ['Items to route', String(toRoute.length)],
                ['Already routed', String(alreadyRouted.length)],
                ['Has assignee', String(hasAssignee.length)],
                ['No-triage label', String(noTriageLabel.length)],
                ['Dry run?', isDryRun ? 'Yes' : 'No'],
                ['OPENROUTER_API_KEY', hasApiKey ? 'Configured' : 'Not configured'],
              ])
              .write();

      - name: Route discovered items
        if: steps.discover.outputs.count != '0'
        uses: actions/github-script@v8
        env:
          HAS_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          TO_ROUTE_JSON: ${{ steps.discover.outputs.to_route }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const isDryRun = '${{ steps.dry-run-check.outputs.dry_run }}' === 'true';
            const toRoute = JSON.parse(process.env.TO_ROUTE_JSON || '[]');
            const hasApiKey = process.env.HAS_API_KEY === 'true';
            const apiKeyStatus = hasApiKey 
              ? '🟢 Configured' 
              : '⚠️ Not configured — set OPENROUTER_API_KEY in Actions secrets';
            
            core.info(`\n🚀 Starting routing ${isDryRun ? '(DRY RUN)' : ''}...`);
            
            for (const item of toRoute) {
              core.info(`\n📍 Routing ${item.kind} #${item.number}: ${item.title}`);
              
              if (isDryRun) {
                core.info(`  [DRY RUN] Would assign @Copilot`);
                core.info(`  [DRY RUN] Would add labels: openrouter, auto-fix, copilot, role:orchestrator`);
                core.info(`  [DRY RUN] Would post first-line-of-sight comment`);
                continue;
              }
              
              try {
                // Assign to Copilot
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  assignees: ['Copilot'],
                });
                core.info(`  ✅ Assigned @Copilot`);
                
                // Apply labels
                const labelsToAdd = ['openrouter', 'auto-fix', 'copilot', 'role:orchestrator'];
                for (const label of labelsToAdd) {
                  try {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: item.number,
                      labels: [label],
                    });
                  } catch (error) {
                    core.notice(`  Could not add label "${label}": ${error.message}`);
                  }
                }
                core.info(`  ✅ Applied routing labels`);
                
                // Post comment
                const displayKind = item.kind === 'PR' ? 'pull request' : 'issue';
                const comment = [
                  '🤖 **OpenRouter First Line of Sight** (cron sweep)',
                  '',
                  `This ${displayKind} has been automatically assigned to **@Copilot** — the OpenRouter orchestrator.`,
                  '',
                  '**Routing applied:**',
                  '- ✅ Assignee: `@Copilot` (GitHub-visible orchestrator)',
                  '- ✅ Labels: `openrouter`, `auto-fix`, `copilot`, `role:orchestrator`',
                  '',
                  `**OpenRouter API:** ${apiKeyStatus}`,
                  '',
                  '**What happens next:**',
                  `1. OpenRouter triage will analyze this ${displayKind}`,
                  '2. Appropriate labels and priority will be assigned',
                  '3. The orchestrator will coordinate work or route to specialized agents',
                  '4. If the orchestrator cannot complete the task, it will apply `needs-human` label',
                  '',
                  '**For reviewers/auditors:**',
                  `- Process documentation: [docs/OPENROUTER_ASSIGNEE_PROCESS.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/OPENROUTER_ASSIGNEE_PROCESS.md)`,
                  `- OpenRouter orchestrator skill: [skills/openrouter-swarms/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/skills/openrouter-swarms/SKILL.md)`,
                  `- Ralph self-healing loop: [skills/ralph-loop/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/skills/ralph-loop/SKILL.md)`,
                  '',
                  '_Automated by `.github/workflows/openrouter-assignee.yml` — 24/7 cron sweep (picked up by hourly run)_'
                ].join('\n');
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  body: comment,
                });
                core.info(`  ✅ Posted first-line-of-sight comment`);
                
              } catch (error) {
                core.error(`  ❌ Error routing ${item.kind} #${item.number}: ${error.message}`);
              }
            }
            
            core.info(`\n✅ Cron sweep complete ${isDryRun ? '(DRY RUN)' : ''}`);
