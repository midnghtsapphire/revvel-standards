name: OpenRouter Auto-Route
on:
  issues:
    types:
      - opened
      - reopened
      - edited
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to route
        required: true
        type: number
permissions:
  contents: read
  issues: write
concurrency:
  group: openrouter-auto-route-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false
jobs:
  auto-route:
    name: Apply agent-trigger labels based on Output Type
    runs-on: ubuntu-latest
    if: |-
      (github.event_name == 'workflow_dispatch') || (github.event_name == 'issues' &&
       github.event.issue.user.login != 'github-actions[bot]' &&
       !startsWith(github.event.issue.title, '[FAILURE]') &&
       !startsWith(github.event.issue.title, '[ALERT]') &&
       (startsWith(github.event.issue.title, '[WR]') ||
        contains(github.event.issue.title, '#tools') ||
        contains(github.event.issue.title, '#tool') ||
        contains(github.event.issue.title, '#app')))
        contains(github.event.issue.title, '#app') ||
        contains(github.event.issue.title, '#apps') ||
        contains(github.event.issue.title, '#tool') ||
        contains(github.event.issue.title, '#tools') ||
        contains(github.event.issue.title, '#pdf') ||
        contains(github.event.issue.title, '#api') ||
        contains(github.event.issue.title, '#cli') ||
        contains(github.event.issue.title, '#mcp') ||
        contains(github.event.issue.title, '#doc') ||
        contains(github.event.issue.title, '#docs')))
        (contains(github.event.issue.labels.*.name, 'wr:new') &&
         contains(github.event.issue.labels.*.name, 'openrouter'))))
        contains(github.event.issue.labels.*.name, 'work-request') ||
        contains(github.event.issue.labels.*.name, 'weekly-research')))
    steps:
      - name: Parse Output Type and apply agent labels
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber =
              context.payload.issue?.number ||
              parseInt(context.payload.inputs?.issue_number || '0', 10);
            if (!issueNumber) {
              core.notice('No issue number found; nothing to route.');
              return;
            }

            let issue;
            try {
              const res = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issue = res.data;
            } catch (e) {
              core.warning(`Failed to get issue: ${e.message}`);
              return;
            }

            const title = issue.title || '';
            const body = issue.body || '';
            const title = issue.title || '';
            const existingLabels = (issue.labels || []).map(
              l => typeof l === 'string' ? l : l.name
            );

            const inferTitleOutputType = (title) => {
              const normalizedTitle = String(title || '').toLowerCase();
              if (/(?:^|[^a-z0-9])#apps?\b/.test(normalizedTitle)) return 'production-app';
              if (/(?:^|[^a-z0-9])#tools?\b/.test(normalizedTitle)) return 'desktop-tool';
              if (/(?:^|[^a-z0-9])#pdf\b/.test(normalizedTitle)) return 'sellable-pdf';
              if (/(?:^|[^a-z0-9])#api\b/.test(normalizedTitle)) return 'api-product';
              if (/(?:^|[^a-z0-9])#cli\b/.test(normalizedTitle)) return 'cli-product';
              if (/(?:^|[^a-z0-9])#mcp\b/.test(normalizedTitle)) return 'mcp-product';
              if (/(?:^|[^a-z0-9])#docs?\b/.test(normalizedTitle)) return 'technical-documentation';
              return '';
            };

            // Match the `### Output Type (required)` form section — tolerant of
            // trailing parenthetical annotations and case (matches the same
            // regex pattern as `wr-auto-classify.yml`).
            const sectionRegex =
              /(?:^|\s)###\s+Output Type[^\n]*\n+([^\n#]+)/im;
            const inferOutputTypeFromTitle = (value) => {
              if (/#(?:tool|tools)\b/i.test(value)) return 'desktop-tool';
              if (/#(?:app|apps)\b/i.test(value)) return 'production-app';
              return null;
            };

            const m = body.match(sectionRegex);
            const titleTag = (issue.title || '').match(/#(tool|tools|app)\b/i)?.[1]?.toLowerCase() || '';
            const inferredFromTitle =
              titleTag === 'tool' || titleTag === 'tools'
                ? 'desktop-tool'
                : titleTag === 'app'
                  ? 'production-app'
                  : '';
            const outputType = ((m?.[1] || '').trim().toLowerCase() || inferredFromTitle);
            if (!outputType) {
              core.info('No Output Type section or title route tag found — skipping route.');
            const outputType = (m?.[1] || '').trim().toLowerCase() || inferTitleOutputType(issue.title);
            if (!outputType) {
              core.info('No Output Type section found in issue body — skipping route.');
            const outputType = (
              m?.[1]?.trim().toLowerCase() ||
              inferOutputTypeFromTitle(title) ||
              ''
            );
            if (!outputType) {
              core.info('No Output Type section or route tags found — skipping route.');
            const title = issue.title || '';
            const titleHasAppTag = /#apps?\b/i.test(title);
            const titleHasToolTag = /#tools?\b/i.test(title);
            const inferredFromTitle =
              titleHasAppTag ? 'production-app' :
              titleHasToolTag ? 'desktop-tool' :
              '';

            const outputType = (m?.[1] || inferredFromTitle || '').trim().toLowerCase();
            if (!outputType) {
              core.info('No Output Type section or title route tag found — skipping route.');
            const outputTypeLabel = existingLabels.find(label =>
              label.startsWith('output-type:')
            );
            const inferTitleOutputType = (issueTitle) => {
              const tagMatches = Array.from(
                (issueTitle || '').matchAll(
                  /(?:^|\s)#(app|api|cli|mcp|pdf|doc|docs|tool|tools)(?=\s|$)/gi
                )
              ).map(m => m[1].toLowerCase());

              if (tagMatches.length === 0) {
                return '';
              }

              const tagMap = {
                app: 'production-app',
                api: 'api-product',
                mcp: 'mcp-product',
                cli: 'cli-product',
                pdf: 'sellable-pdf',
                docs: 'technical-documentation',
                doc: 'technical-documentation',
                tools: 'internal-script-automation',
                tool: 'internal-script-automation',
              };

              // Prefer product-shaped tags over generic tool tags when multiple tags are present.
              const priority = ['app', 'api', 'mcp', 'cli', 'pdf', 'docs', 'doc', 'tools', 'tool'];
              const found = new Set(tagMatches);
              for (const tag of priority) {
                if (found.has(tag)) {
                  return tagMap[tag] || '';
                }
              }
              return '';
            };
            const outputType =
              (m && m[1].trim().toLowerCase()) ||
              (outputTypeLabel && outputTypeLabel.slice('output-type:'.length).trim().toLowerCase()) ||
              inferTitleOutputType(title);
            if (!outputType) {
              core.info('No Output Type found in issue body, labels, or title tags — skipping route.');
              return;
            }
            core.info(`Parsed Output Type: "${outputType}"`);

            // Routing table — mode → list of agent-trigger labels.
            const routingTable = {
              'cli-product':                   ['swe-fix'],
              'api-product':                   ['swe-fix'],
              'mcp-product':                   ['swe-fix'],
              'production-app':                ['swe-fix'],
              'desktop-tool':                  ['swe-fix', 'bito-ai'],
              'invention-flow':                ['swe-fix', 'bito-ai'],
              'sellable-pdf':                  ['noimosai', 'fix-me'],
              'technical-documentation':       ['noimosai', 'fix-me'],
              'project-management-doc':        ['noimosai', 'fix-me'],
              'client-code-task':              ['fix-me'],
              'internal-script-automation':    ['fix-me'],
            };

            const agentLabels = routingTable[outputType] || [];

            // Always-on: BITO reviews every WR's resulting PR (idempotent).
            const labelsToApply = Array.from(
              new Set([...agentLabels, 'bito-ai'])
            ).filter(l => !existingLabels.includes(l));

            if (labelsToApply.length === 0) {
              core.info('All routing labels already present — nothing to do.');
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: labelsToApply,
              });
              core.info(`Applied labels: ${labelsToApply.join(', ')}`);
            } catch (e) {
              // Label may not exist in the repo. Don't fail the workflow —
              // log and let the user create the label manually.
              core.warning(
                `Failed to apply some labels (${labelsToApply.join(', ')}): ${e.message}. ` +
                `If a label doesn't exist, create it via Settings → Labels.`
              );
            }

            // Surface the routing decision in the run summary so it's visible
            // without checking the issue's label timeline.
            await core.summary
              .addHeading('Auto-routed WR')
              .addRaw(`Issue: #${issueNumber}\n\n`)
              .addRaw(`Output Type: \`${outputType}\`\n\n`)
              .addRaw(`Labels applied: ${labelsToApply.length ? labelsToApply.map(l => `\`${l}\``).join(', ') : '_(none — all already present)_'}\n`)
              .write();
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
