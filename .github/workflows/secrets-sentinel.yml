name: Secrets Sentinel — Daily Auto-Heal
on:
  # Cron paused 2026-06-02 — was creating duplicate
  # "🔐 Secrets Sentinel — N critical secret(s) missing" issues
  # daily on the same false-positive signal as
  # secret-persistence-guard.yml. Re-enable AFTER secret state
  # is reconciled and dedup is added.
  # schedule:
  #   - cron: 0 5 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would happen without writing any secrets
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
jobs:
  sentinel:
    name: Audit & auto-heal critical secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit critical secrets
        id: audit
        env:
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          declare -a MISSING=()

          check_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "  ❌ $name — NOT SET"
              MISSING+=("$name")
            else
              echo "  ✅ $name — configured"
            fi
          }

          echo "=== Critical Secrets Audit — $(date -u '+%Y-%m-%d %H:%M UTC') ==="
          check_secret "DIGITALOCEAN_API_TOKEN"
          check_secret "DOPPLER_TOKEN"
          check_secret "ADMIN_GITHUB_TOKEN"
          check_secret "NAMECHEAP_API_KEY"
          check_secret "OPENROUTER_API_KEY"

          echo ""
          echo "Result: ${#MISSING[@]} missing, $((5 - ${#MISSING[@]})) configured"

          echo "missing_count=${#MISSING[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#MISSING[@]}" -gt 0 ]; then
            # Write CSV of missing names for downstream steps
            MISSING_CSV=$(IFS=','; echo "${MISSING[*]}")
            echo "missing_list=${MISSING_CSV}" >> "$GITHUB_OUTPUT"
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing_list=" >> "$GITHUB_OUTPUT"
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Auto-heal via credential backup sources
        id: heal
        if: steps.audit.outputs.has_missing == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MISSING: ${{ steps.audit.outputs.missing_list }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          CREDENTIAL_BACKUP_JSON: ${{ secrets.CREDENTIAL_BACKUP_JSON }}
          CREDENTIAL_BACKUP_SOPS_FILE: ${{ vars.CREDENTIAL_BACKUP_SOPS_FILE }}
          CREDENTIAL_BACKUP_PASS_PREFIX: ${{ vars.CREDENTIAL_BACKUP_PASS_PREFIX }}
          CREDENTIAL_BACKUP_BW_PREFIX: ${{ vars.CREDENTIAL_BACKUP_BW_PREFIX }}
          BW_SESSION: ${{ secrets.BW_SESSION }}
          CREDENTIAL_BACKUP_1PASSWORD_TEMPLATE: ${{ vars.CREDENTIAL_BACKUP_1PASSWORD_TEMPLATE }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR || secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          set -euo pipefail

          # DOPPLER DISABLED — per WRs requesting Doppler be removed: the
          # gatekeeper-sync.sh fallback path tries Doppler first. Until
          # the sync script is rewritten to skip Doppler, short-circuit
          # the heal step entirely. The tracker still surfaces missing
          # secrets in the issue body; only the auto-write to GitHub
          # is gated. Re-enable by removing this block.
          echo "::notice::Auto-heal disabled — Doppler removal in progress. Add missing secrets manually."
          echo '{"synced":[],"skipped":[],"failed":[]}' > /tmp/sentinel-heal.json
          echo "heal_attempted=false" >> "$GITHUB_OUTPUT"
          echo "heal_succeeded=false" >> "$GITHUB_OUTPUT"
          exit 0

          chmod +x scripts/gatekeeper-sync.sh

          SYNC_EXIT=0
          # Keep stderr separate so JSON stdout isn't polluted by error messages
          ./scripts/gatekeeper-sync.sh \
            --secrets "$MISSING" \
            --repo "$GITHUB_REPOSITORY" \
            --json > /tmp/sentinel-heal.json 2>/tmp/sentinel-heal.err || SYNC_EXIT=$?

          echo "heal_attempted=true" >> "$GITHUB_OUTPUT"
          echo "=== Heal result (exit $SYNC_EXIT) ==="
          cat /tmp/sentinel-heal.json || true
          if [ -s /tmp/sentinel-heal.err ]; then
            echo "=== Heal stderr ==="
            cat /tmp/sentinel-heal.err || true
          fi

          # Validate JSON and check if any secrets were actually synced
          if [ "$SYNC_EXIT" -eq 0 ] \
            && [ -s /tmp/sentinel-heal.json ] \
            && jq -e 'type == "object" and (.synced | type) == "array" and (.synced | length) > 0' \
                 /tmp/sentinel-heal.json > /dev/null 2>&1; then
            echo "heal_succeeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "heal_succeeded=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update tracking issue
        if: steps.audit.outputs.has_missing == 'true'
        uses: actions/github-script@v9.0.0
        env:
          MISSING_LIST: ${{ steps.audit.outputs.missing_list }}
          MISSING_COUNT: ${{ steps.audit.outputs.missing_count }}
          HEAL_ATTEMPTED: ${{ steps.heal.outputs.heal_attempted || 'false' }}
          HEAL_SUCCEEDED: ${{ steps.heal.outputs.heal_succeeded || 'false' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const missing = (process.env.MISSING_LIST || '').split(',').filter(Boolean);
            const healAttempted = process.env.HEAL_ATTEMPTED === 'true';
            const healSucceeded = process.env.HEAL_SUCCEEDED === 'true';
            const today = new Date().toISOString().split('T')[0];

            // Avoid opening duplicate issues — search across all open issues by
            // title. The previous label-only filter missed duplicates created via
            // the labels-not-provisioned fallback path (unlabeled issues), which
            // is why dozens of identical sentinel issues piled up.
            const { data: allOpen } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = allOpen.filter(
              (i) => !i.pull_request && i.title.startsWith('🔐 Secrets Sentinel')
            );

            const body = [
              '## 🔐 Secrets Sentinel — Missing Credentials Detected',
              '',
              `**Date:** ${today}`,
              `**Run:** [View workflow run](${process.env.RUN_URL})`,
              '',
              '### Missing Secrets',
              '',
              ...missing.map(s => `- \`${s}\``),
              '',
              healSucceeded
                ? [
                    '### ✅ Auto-heal succeeded',
                    '',
                    'The sentinel synced the missing secrets from configured backup sources back to the repo.',
                    'Check the run log for per-secret `✅ synced` rows.',
                  ].join('\n')
                : healAttempted
                  ? [
                      '### ⚠️ Auto-heal attempted but incomplete',
                      '',
                      'The sentinel invoked `scripts/gatekeeper-sync.sh` but not all secrets were restored.',
                      'Check the run log for per-secret `⚠️ missing` / `❌ failed` rows.',
                      '',
                      'If secrets are still missing:',
                      '- `⚠️` rows → add the value to GitHub secrets, Doppler, JSON/SOPS, pass, Bitwarden, 1Password, Infisical, or Vault',
                      '- `❌` rows → `ADMIN_GITHUB_TOKEN` lacks `secrets:write` scope; regenerate the PAT',
                    ].join('\n')
                  : [
                      '### Auto-heal not possible',
                      '',
                      '`scripts/gatekeeper-sync.sh` was not attempted. Check the workflow logs and ensure `ADMIN_GITHUB_TOKEN` or `GITHUB_TOKEN` is available.',
                    ].join('\n'),
              '',
              '### Bootstrap steps (one-time)',
              '',
              '```bash',
              '# 1. Set at least one writable token and one backup source',
              'gh secret set ADMIN_GITHUB_TOKEN      --repo midnghtsapphire/revvel-standards',
              'gh secret set CREDENTIAL_BACKUP_JSON  --repo midnghtsapphire/revvel-standards',
              '# Optional fallback source: gh secret set DOPPLER_TOKEN --repo midnghtsapphire/revvel-standards',
              '',
              '# 2. Trigger the sentinel manually to immediately restore the rest',
              'gh workflow run secrets-sentinel.yml --repo midnghtsapphire/revvel-standards',
              '```',
              '',
              '### Why this keeps happening',
              '',
              'GitHub fine-grained PATs expire (30-day default, 1-year max). When',
              '`ADMIN_GITHUB_TOKEN` expires, the Credential Gatekeeper can no longer',
              'write secrets back to the repo. Keep at least one backup source',
              '(for example `CREDENTIAL_BACKUP_JSON`, SOPS, Vault, or Doppler) current',
              'and rotate `ADMIN_GITHUB_TOKEN` before its expiry.',
              '',
              `_Auto-detected by Secrets Sentinel at ${new Date().toISOString()}_`,
            ].join('\n');

            if (existing.length > 0) {
              // Append a dated comment rather than flooding with new issues.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: [
                  `**${today} update** — still missing: ${missing.map(s => `\`${s}\``).join(', ')}`,
                  healSucceeded ? 'Auto-heal succeeded — secrets restored from configured backup sources.' :
                    healAttempted ? 'Auto-heal attempted but incomplete — check the run log.' :
                      'Auto-heal skipped — check the workflow logs for the gatekeeper sync failure.',
                  `[Run log](${process.env.RUN_URL})`,
                ].join('  \n'),
              });
              core.notice(`Updated existing sentinel issue #${existing[0].number}`);
            } else {
              // Try with labels first; fall back to no labels if 422 (labels not provisioned yet)
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🔐 Secrets Sentinel — ${missing.length} critical secret(s) missing`,
                  body,
                  labels: ['secrets-missing', 'oaudrey'],
                }));
              } catch (labelErr) {
                if (labelErr.status === 422) {
                  core.warning('One or more labels (secrets-missing, oaudrey) are not provisioned yet — creating issue without labels. Run sync-labels.yml to provision them.');
                  ({ data: issue } = await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `🔐 Secrets Sentinel — ${missing.length} critical secret(s) missing`,
                    body,
                  }));
                } else {
                  throw labelErr;
                }
              }
              core.notice(`Opened sentinel issue: ${issue.html_url}`);
            }
      - name: Write step summary
        if: always()
        env:
          HAS_MISSING: ${{ steps.audit.outputs.has_missing }}
          MISSING_LIST: ${{ steps.audit.outputs.missing_list }}
          MISSING_COUNT: ${{ steps.audit.outputs.missing_count || '0' }}
          HEAL_ATTEMPTED: ${{ steps.heal.outputs.heal_attempted || 'false' }}
          HEAL_SUCCEEDED: ${{ steps.heal.outputs.heal_succeeded || 'false' }}
        run: |
          {
            echo "## Secrets Sentinel — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ "${HAS_MISSING}" = "true" ]; then
              echo "| Status | Details |"
              echo "|---|---|"
              echo "| ⚠️ Missing secrets | \`${MISSING_LIST}\` |"
              if [ "${HEAL_SUCCEEDED}" = "true" ]; then
                echo "| ✅ Auto-heal | Succeeded — secrets restored from Doppler |"
              elif [ "${HEAL_ATTEMPTED}" = "true" ]; then
                echo "| ⚠️ Auto-heal | Attempted but incomplete — check log |"
              else
                echo "| ❌ Auto-heal | Skipped — no Doppler token set (DOPPLER_AGENT_TOKEN / DOPPLER_TOKEN / DOPPLER_LOCAL_TOKEN / DOPPLER_API_KEY / DOPPLER_AGENT_ODIC / DOPPLER_CIRCLECI_OIDC) |"
              fi
            else
              echo "| ✅ All critical secrets configured | — |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 60
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
