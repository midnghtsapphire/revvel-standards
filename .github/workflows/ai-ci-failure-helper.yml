name: AI CI Failure Helper
on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: Workflow run ID to analyze (defaults to this run)
        type: string
        required: false
permissions:
  actions: read
  contents: read
  pull-requests: write
concurrency:
  group: ai-ci-failure-helper-${{ github.event.inputs.workflow_run_id || github.run_id }}
  cancel-in-progress: false
jobs:
  ai-helper:
    name: AI failure helper
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping AI CI Failure Helper."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi
      - name: AI failure helper
        # Spend gate (#17850): this third-party action calls a paid LLM provider
        # with the key handed to it below, so the spend is real even though no
        # openrouter.ai URL appears in this file. Runs only when the repository
        # variable REVVEL_LLM_ALLOW_CLOUD is "1". See docs/LOCAL_LLM_SETUP.md.
        if: (env.OPENROUTER_API_KEY != '') && vars.REVVEL_LLM_ALLOW_CLOUD == '1'
        # v0.13 was never released upstream — the newest tag is v0.12, so this
        # ref has always 404'd and the step has never run (#17832). Pinned to
        # the SHA v0.12 points at, per CLAUDE.md gotcha #8.
        uses: maxlim0/actions-progci-fail@f1396fcd6c6b999fadb3386ba1a2258e8525e885 # v0.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: anthropic/claude-sonnet-4
          max_log_lines: 200
          prompt_template: |
            Workflow {{WORKFLOW_NAME}} failed at job {{JOB_NAME}},
            step {{STEP_NAME}}.
            Last log lines:
            {{LOG}}
            Explain the likely root cause and suggest concrete fixes.
            Keep the explanation under 200 words.
    timeout-minutes: 45
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
