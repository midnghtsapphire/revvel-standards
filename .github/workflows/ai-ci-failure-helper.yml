name: AI CI Failure Helper
on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: Workflow run ID to analyze (defaults to this run)
        type: string
        required: false
permissions:
  actions: read
  contents: read
  pull-requests: write
concurrency:
  group: ai-ci-failure-helper-${{ github.event.inputs.workflow_run_id || github.run_id }}
  cancel-in-progress: false
jobs:
  ai-helper:
    name: AI failure helper
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping AI CI Failure Helper."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi
      - name: AI failure helper
        if: env.OPENROUTER_API_KEY != ''
        uses: maxlim0/actions-progci-fail@v0.13
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: openai/gpt-4o
          max_log_lines: 200
          prompt_template: |
            Workflow {{WORKFLOW_NAME}} failed at job {{JOB_NAME}},
            step {{STEP_NAME}}.
            Last log lines:
            {{LOG}}
            Explain the likely root cause and suggest concrete fixes.
            Keep the explanation under 200 words.
    timeout-minutes: 45
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
