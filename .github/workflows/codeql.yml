name: CodeQL

# ── IMPORTANT ──────────────────────────────────────────────────────────────────
# GitHub's built-in "default setup" for code scanning MUST be disabled before
# this advanced workflow can upload SARIF successfully.
#
# How to disable it:
#   Settings → Security → Code scanning → Default setup → Disable
#
# Running both simultaneously causes:
#   "Code Scanning could not process the submitted SARIF file:
#    CodeQL analyses from advanced configurations cannot be processed
#    when the default setup is enabled."
#
# If you cannot disable default setup, the analyze step below is configured with
# continue-on-error: true so the SARIF upload failure does not block PRs.
# ───────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: read

# Security scan workflows must not cancel in-progress runs to avoid
# leaving the repository in an unscanned state.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        language: ['actions']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        # continue-on-error prevents SARIF upload failures (e.g. default-setup
        # conflict) from blocking the PR. Security findings are still surfaced
        # in the Security tab when the upload succeeds.
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
