name: ai-architecture-evaluator

on:
  schedule:
    # Daily at 13:00 UTC — 3 TEST products/run, 7 runs/wk keeps cadence covered.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Run tests
        run: |
          python -m unittest products/ai-architecture-framework/tests/test_harness.py

      - name: Run market evaluator
        working-directory: products/ai-architecture-framework
        run: |
          python market_evaluator.py | tee ../../market-plan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: market-plan
          path: market-plan.json
