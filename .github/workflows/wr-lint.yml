name: WR Lint
on:
  pull_request:
    paths: ["wr/issues/**.md"]
  push:
    paths: ["wr/issues/**.md"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: "20" }
      - name: Lint changed WR files
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref || 'main' }}...HEAD -- 'wr/issues/*.md' 2>/dev/null || echo "wr/issues/*.md")
          [ -z "$files" ] && { echo "no WR files changed"; exit 0; }
          node wr/scripts/wr-lint.mjs $files
