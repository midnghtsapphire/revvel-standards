name: WR Lint
on:
  pull_request:
    paths: ["wr/issues/**.md"]
  push:
    paths: ["wr/issues/**.md"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: "20" }
      - name: Lint changed WR files
        env:
          # Use event-payload SHAs on PRs for determinism (per Copilot /
          # Devin review on #14227). On push events the base SHA isn't
          # available, so fall back to `${{ github.event.before }}`.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            files=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- 'wr/issues/*.md' 2>&1) || files=""
          else
            files=""
          fi
          if [ -z "$files" ]; then
            echo "no WR files changed (or diff unavailable); skipping lint"
            exit 0
          fi
          node wr/scripts/wr-lint.mjs $files
