name: mabl Automated Tests

# ── PAUSED 2026-05-27 — Mabl replaced by Keploy ───────────────────────────────
# Kept (commented) so this can be re-enabled in one edit if Mabl is ever needed
# again for cloud-managed E2E browser tests. Per revvel-standards convention:
# every tool we evaluated gets a record of what it did + what we liked + what
# we didn't, so future-us doesn't re-litigate the same decision.
#
# ── What this workflow did ────────────────────────────────────────────────────
# - On push to main/release/** + every PR, installed @mablhq/mabl-cli and
#   called `mabl tests run` against the Mabl cloud account.
# - Test plans were configured in the Mabl dashboard (NOT in this repo); the
#   CLI only TRIGGERS them. If no plans existed with matching labels, the CLI
#   ran and nothing actually executed → silent no-op.
# - Since MABL_API_KEY went missing it short-circuited at the key check
#   ("⚠️ MABL_API_KEY secret is not set"), so it's been a full no-op recently.
#
# ── What we liked ─────────────────────────────────────────────────────────────
# - Hands-off cloud-managed E2E (no Playwright code to maintain in-repo).
# - Visual recorder + dataflow tests in the dashboard.
# - Cross-browser without our own grid.
#
# ── What we didn't like ───────────────────────────────────────────────────────
# - Test plans live in Mabl's dashboard, NOT in this repo → invisible to the
#   pipeline, the agents, code review, and audit. Can't reuse or version-
#   control the test logic from code.
# - Required a paid MABL_API_KEY that kept expiring / going missing → cascade
#   into the Secrets Sentinel spam.
# - In practice, "we never saw it run much" — either no plans were configured,
#   or it no-op'd silently when the key was absent.
#
# ── Replaced by ───────────────────────────────────────────────────────────────
# - **Keploy** GitHub App (https://github.com/apps/keploy) — AI-generated,
#   validated unit + API tests written directly into PRs. Code-level, visible,
#   no external dashboard for test logic, no paid key needed for the basic tier.
# - For genuine browser E2E (login flows, multi-step journeys), add Playwright
#   in the affected app rather than a paid cloud runner.
#
# ── To re-enable Mabl ─────────────────────────────────────────────────────────
# Uncomment the push: / pull_request: blocks below, set MABL_API_KEY in repo
# secrets, and configure plans in the Mabl dashboard with matching labels.
# ──────────────────────────────────────────────────────────────────────────────

on:
  # push:
  #   branches:
  #     - main
  #     - release/**
  # pull_request:
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  workflow_dispatch:
    inputs:
      app-url:
        description: Override app URL for this run (optional)
        required: false
        type: string
      plan-labels:
        description: Comma-separated mabl plan labels to run (optional, e.g. smoke-test)
        required: false
        type: string
      continue-on-failure:
        description: Continue workflow even if mabl tests fail?
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: mabl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mabl-tests:
    name: mabl Automated Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install mabl CLI
        run: npm install -g @mablhq/mabl-cli
      - name: Verify MABL_API_KEY is configured
        run: |
          if [ -z "${{ secrets.MABL_API_KEY }}" ]; then
            echo "⚠️  MABL_API_KEY secret is not set."
            echo "   1. Log in to https://app.mabl.com/workspaces/BsQPWJHcAYbKHlKpH1TWtA-w/settings/apis"
            echo "   2. Create a 'CI/CD Integration' API key"
            echo "   3. Add it to GitHub: Settings → Secrets and variables → Actions → New repository secret"
            echo "      Name: MABL_API_KEY"
            echo "   Skipping mabl run (no credentials)."
            exit 0
          fi
          echo "✅ MABL_API_KEY is set — proceeding with mabl test run."
      - name: Run mabl tests
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          # Build optional flags
          FLAGS=""
          if [ -n "${{ vars.MABL_APPLICATION_ID }}" ]; then
            FLAGS="$FLAGS --application-id ${{ vars.MABL_APPLICATION_ID }}"
          fi
          if [ -n "${{ vars.MABL_ENVIRONMENT_ID }}" ]; then
            FLAGS="$FLAGS --environment-id ${{ vars.MABL_ENVIRONMENT_ID }}"
          fi
          if [ -n "${{ inputs.app-url }}" ]; then
            FLAGS="$FLAGS --app-url ${{ inputs.app-url }}"
          fi
          if [ -n "${{ inputs.plan-labels }}" ]; then
            FLAGS="$FLAGS --plan-labels ${{ inputs.plan-labels }}"
          fi
          if [ "${{ inputs.continue-on-failure }}" = "true" ]; then
            FLAGS="$FLAGS --continue-on-failure"
          fi

          echo "Running: mabl deployments create $FLAGS"
          mabl deployments create $FLAGS 2>&1 | tee /tmp/mabl-output.txt
      - name: Post mabl summary
        if: always()
        run: |
          echo "## 🧪 mabl Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/mabl-output.txt ]; then
            echo "### CLI Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/mabl-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Full results: [mabl Dashboard](https://app.mabl.com/workspaces/BsQPWJHcAYbKHlKpH1TWtA-w/agents/tasks)_" >> $GITHUB_STEP_SUMMARY
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
