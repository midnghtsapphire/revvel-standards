name: mabl Automated Tests
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      app-url:
        description: Override app URL for this run (optional)
        required: false
        type: string
      plan-labels:
        description: Comma-separated mabl plan labels to run (optional, e.g. smoke-test)
        required: false
        type: string
      continue-on-failure:
        description: Continue workflow even if mabl tests fail?
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
concurrency:
  group: mabl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mabl-tests:
    name: mabl Automated Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.1.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mabl CLI
        run: npm install -g @mablhq/mabl-cli
      - name: Verify MABL_API_KEY is configured
        run: |
          if [ -z "${{ secrets.MABL_API_KEY }}" ]; then
            echo "⚠️  MABL_API_KEY secret is not set."
            echo "   1. Log in to https://app.mabl.com/workspaces/BsQPWJHcAYbKHlKpH1TWtA-w/settings/apis"
            echo "   2. Create a 'CI/CD Integration' API key"
            echo "   3. Add it to GitHub: Settings → Secrets and variables → Actions → New repository secret"
            echo "      Name: MABL_API_KEY"
            echo "   Skipping mabl run (no credentials)."
            exit 0
          fi
          echo "✅ MABL_API_KEY is set — proceeding with mabl test run."
      - name: Run mabl tests
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          # Build optional flags
          FLAGS=""
          if [ -n "${{ vars.MABL_APPLICATION_ID }}" ]; then
            FLAGS="$FLAGS --application-id ${{ vars.MABL_APPLICATION_ID }}"
          fi
          if [ -n "${{ vars.MABL_ENVIRONMENT_ID }}" ]; then
            FLAGS="$FLAGS --environment-id ${{ vars.MABL_ENVIRONMENT_ID }}"
          fi
          if [ -n "${{ inputs.app-url }}" ]; then
            FLAGS="$FLAGS --app-url ${{ inputs.app-url }}"
          fi
          if [ -n "${{ inputs.plan-labels }}" ]; then
            FLAGS="$FLAGS --plan-labels ${{ inputs.plan-labels }}"
          fi
          if [ "${{ inputs.continue-on-failure }}" = "true" ]; then
            FLAGS="$FLAGS --continue-on-failure"
          fi

          echo "Running: mabl deployments create $FLAGS"
          mabl deployments create $FLAGS 2>&1 | tee /tmp/mabl-output.txt
      - name: Post mabl summary
        if: always()
        run: |
          echo "## 🧪 mabl Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/mabl-output.txt ]; then
            echo "### CLI Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/mabl-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Full results: [mabl Dashboard](https://app.mabl.com/workspaces/BsQPWJHcAYbKHlKpH1TWtA-w/agents/tasks)_" >> $GITHUB_STEP_SUMMARY
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
