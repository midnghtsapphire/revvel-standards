name: RecurseML — Autonomous Code Review

# ── RESTORED 2026-08-19 (D014, reverses D007) ─────────────────────────────────
# CUT 2026-07-08 by D007 on the rationale "RECURSE_ML_API_KEY absent → no results
# posted; zero unique catches". That measured THIS workflow lane, which without
# the secret could not post anything by construction. The RecurseML GitHub App
# posts its `recurseml/analysis` check independently of this file and never
# needed that secret — it stayed installed and kept reporting through the whole
# cut, so the 50-PR sample never covered the App's real output. Two delivery
# mechanisms were conflated and the measured one was not the running one.
# Auto-triggers restored below. The scan step still no-ops safely (exit 0) when
# the key is absent, so this is safe regardless of secret state.
# See: DECISIONS.md D014 (and D007 for the original cut).
# ──────────────────────────────────────────────────────────────────────────────

on:
  # Restored by D014 — these are the exact triggers D007 commented out.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - release/**
      - hotfix/**
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch or SHA to scan
        required: false
        default: main

permissions:
  contents: read
concurrency:
  group: recurse-ml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recurse-ml-review:
    name: RecurseML Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run RecurseML Analysis
        env:
          RECURSE_ML_API_KEY: ${{ secrets.RECURSE_ML_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "======================================================"
          echo "  RecurseML — Autonomous Bug Detection + Code Review"
          echo "======================================================"
          echo ""
          echo "Repository : ${{ github.repository }}"
          echo "Ref        : ${{ github.ref }}"
          echo "SHA        : ${{ github.sha }}"
          echo "Event      : ${{ github.event_name }}"
          echo ""

          # Verify the API key secret is set before proceeding.
          if [ -z "$RECURSE_ML_API_KEY" ]; then
            echo "⚠️  RECURSE_ML_API_KEY secret is not set."
            echo "   Add it under Settings → Secrets and variables → Actions."
            echo "   See: https://app.recurse.ml/integrations/github"
            echo ""
            echo "   Skipping RecurseML scan (no credentials)."
            exit 0
          fi

          echo "✅ RECURSE_ML_API_KEY found — submitting scan request…"
          echo ""

          # Determine the diff target for PR vs push events.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            PR_NUMBER=""
          fi

          # Build the JSON payload for the RecurseML Scan API.
          PAYLOAD=$(cat <<EOF
          {
            "repository": "${{ github.repository }}",
            "base_sha": "${BASE_SHA}",
            "head_sha": "${HEAD_SHA}",
            "pr_number": "${PR_NUMBER}",
            "branch": "${{ github.ref_name }}",
            "rules_file": "recurse-rules.md",
            "post_pr_comments": true,
            "fail_on_critical": true
          }
          EOF
          )

          echo "Payload:"
          echo "$PAYLOAD" | python3 -m json.tool

          # Submit the scan to RecurseML API.
          HTTP_STATUS=$(curl -s -o /tmp/recurse-response.json -w "%{http_code}" \
            -X POST "https://api.recurse.ml/v1/scan" \
            -H "Authorization: Bearer ${RECURSE_ML_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo ""
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/recurse-response.json | python3 -m json.tool 2>/dev/null || cat /tmp/recurse-response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo ""
            echo "✅ RecurseML scan submitted successfully."
          else
            echo ""
            echo "❌ RecurseML API returned HTTP $HTTP_STATUS."
            echo "   Check your RECURSE_ML_API_KEY and RecurseML dashboard."
            exit 1
          fi
      - name: Post RecurseML Summary to Step Summary
        if: always()
        run: |
          echo "## 🤖 RecurseML Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rules File | \`recurse-rules.md\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/recurse-response.json ]; then
            echo "### API Response" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat /tmp/recurse-response.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_For full findings, visit the [RecurseML Dashboard](https://app.recurse.ml)._" >> $GITHUB_STEP_SUMMARY
    timeout-minutes: 30

  # Backup reviewer: if the primary RecurseML scan fails (API error, outage,
  # missing/invalid key), fall back to an OpenRouter multi-model review so the
  # change still gets an autonomous review instead of going unreviewed.
  openrouter-fallback:
    name: OpenRouter Backup Review (RecurseML failed)
    needs: recurse-ml-review
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: OpenRouter backup code review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "RecurseML failed — running OpenRouter backup review."

          # Resolve a base ref to diff against (push: event.before; otherwise HEAD~1).
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
          fi

          if [ -n "$BASE" ]; then
            git diff "$BASE" "${{ github.sha }}" > /tmp/review-diff.txt 2>/dev/null || true
          else
            git show "${{ github.sha }}" > /tmp/review-diff.txt 2>/dev/null || true
          fi

          node scripts/openrouter-backup-review.js /tmp/review-diff.txt
    timeout-minutes: 15

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
