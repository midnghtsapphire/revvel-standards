# RecurseML Autonomous Code Quality Workflow
# Triggers on every PR and push to main.
# RecurseML analyzes code for bugs, enforces recurse-rules.md, and posts review comments on PRs.
#
# SETUP:
#   1. Install the RecurseML GitHub App: https://app.recurse.ml/integrations/github
#   2. Add your RecurseML API key as a repository secret: RECURSE_ML_API_KEY
#      (Settings → Secrets and variables → Actions → New repository secret)
#   3. The `recurse-rules.md` file at the repo root defines custom code standards.

name: RecurseML — Autonomous Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch or SHA to scan"
        required: false
        default: "main"

concurrency:
  group: recurse-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recurse-ml-review:
    name: RecurseML Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required to post inline PR review comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run RecurseML Analysis
        env:
          RECURSE_ML_API_KEY: ${{ secrets.RECURSE_ML_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "======================================================"
          echo "  RecurseML — Autonomous Bug Detection + Code Review"
          echo "======================================================"
          echo ""
          echo "Repository : ${{ github.repository }}"
          echo "Ref        : ${{ github.ref }}"
          echo "SHA        : ${{ github.sha }}"
          echo "Event      : ${{ github.event_name }}"
          echo ""

          # Verify the API key secret is set before proceeding.
          if [ -z "$RECURSE_ML_API_KEY" ]; then
            echo "⚠️  RECURSE_ML_API_KEY secret is not set."
            echo "   Add it under Settings → Secrets and variables → Actions."
            echo "   See: https://app.recurse.ml/integrations/github"
            echo ""
            echo "   Skipping RecurseML scan (no credentials)."
            exit 0
          fi

          echo "✅ RECURSE_ML_API_KEY found — submitting scan request…"
          echo ""

          # Determine the diff target for PR vs push events.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            PR_NUMBER=""
          fi

          # Build the JSON payload for the RecurseML Scan API.
          PAYLOAD=$(cat <<EOF
          {
            "repository": "${{ github.repository }}",
            "base_sha": "${BASE_SHA}",
            "head_sha": "${HEAD_SHA}",
            "pr_number": "${PR_NUMBER}",
            "branch": "${{ github.ref_name }}",
            "rules_file": "recurse-rules.md",
            "post_pr_comments": true,
            "fail_on_critical": true
          }
          EOF
          )

          echo "Payload:"
          echo "$PAYLOAD" | python3 -m json.tool

          # Submit the scan to RecurseML API.
          HTTP_STATUS=$(curl -s -o /tmp/recurse-response.json -w "%{http_code}" \
            -X POST "https://api.recurse.ml/v1/scan" \
            -H "Authorization: Bearer ${RECURSE_ML_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo ""
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/recurse-response.json | python3 -m json.tool 2>/dev/null || cat /tmp/recurse-response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo ""
            echo "✅ RecurseML scan submitted successfully."
          else
            echo ""
            echo "❌ RecurseML API returned HTTP $HTTP_STATUS."
            echo "   Check your RECURSE_ML_API_KEY and RecurseML dashboard."
            exit 1
          fi

      - name: Post RecurseML Summary to Step Summary
        if: always()
        run: |
          echo "## 🤖 RecurseML Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rules File | \`recurse-rules.md\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/recurse-response.json ]; then
            echo "### API Response" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat /tmp/recurse-response.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_For full findings, visit the [RecurseML Dashboard](https://app.recurse.ml)._" >> $GITHUB_STEP_SUMMARY
