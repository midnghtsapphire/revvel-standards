name: OpenRouter Instantiation Check
on:
  workflow_dispatch:
    inputs:
      force_escalate:
        description: Force Ralph escalation even if < 24h old
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .env.example
      - .github/workflows/openrouter-instantiation-check.yml
permissions:
  issues: write
  contents: read
concurrency:
  group: openrouter-instantiation-check
  cancel-in-progress: false
jobs:
  probe:
    name: Probe OpenRouter and update tracking issue
    runs-on: ubuntu-latest
    steps:
      - name: Probe OpenRouter and update tracking issue
        uses: actions/github-script@v9.0.0
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          FORCE_ESCALATE: ${{ github.event.inputs.force_escalate || 'false' }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const TRACKING_TITLE = 'OpenRouter Instantiation Status';
            const ESCALATE_AFTER_MS = 24 * 60 * 60 * 1000; // 24 hours
            const forceEscalate = process.env.FORCE_ESCALATE === 'true';
            const hasKey = !!process.env.OPENROUTER_API_KEY;
            const hasAdmin = !!process.env.ADMIN_GITHUB_TOKEN;

            // ── Best-effort helper ────────────────────────────────────────
            async function tryApi(label, fn) {
              try { return await fn(); }
              catch (err) {
                core.warning(`${label}: ${err.message}`);
                return null;
              }
            }

            // removeLabel does NOT go through tryApi.
            //
            // tryApi is a blanket best-effort wrapper: it warns and returns
            // null for any error. That is right for "create the tracking
            // issue if you can", and wrong for a label removal, where a 404
            // means the label is already absent — the end state we wanted —
            // and a 401/403 means it is STILL THERE. Swallowing both leaves
            // this workflow announcing a lifecycle it did not set, with the
            // previous lifecycle label still on the issue alongside the new
            // one (ChaosMender LABEL-RACE-001).
            async function removeLabelIfPresent(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            // ── 1. Find or create the single tracking issue ───────────────
            const { data: searchResults } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TRACKING_TITLE}"`,
              per_page: 5,
            });
            let tracking = searchResults.items.find(i => i.title === TRACKING_TITLE);

            if (!tracking) {
              const created = await tryApi('Create tracking issue', () =>
                github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: TRACKING_TITLE,
                  body:
                    `This issue is auto-maintained by ` +
                    `\`.github/workflows/openrouter-instantiation-check.yml\`.\n\n` +
                    `It tracks whether the OpenRouter orchestrator is ` +
                    `instantiated (i.e. \`OPENROUTER_API_KEY\` is set and the ` +
                    `OpenRouter API responds). Each run updates the labels ` +
                    `and posts a status comment. A 👍 reaction on the latest ` +
                    `status comment means OpenRouter is live.\n\n` +
                    `See \`docs/OPENROUTER_INSTANTIATION_CHECK.md\` for details.`,
                  labels: ['openrouter', 'openrouter:instantiating'],
                })
              );
              if (!created) {
                core.setFailed('Could not create the OpenRouter tracking issue.');
                return;
              }
              tracking = created.data;
              core.info(`Created tracking issue #${tracking.number}`);
            } else {
              core.info(`Using existing tracking issue #${tracking.number}`);
            }

            const issue_number = tracking.number;
            const currentLabels = (tracking.labels || []).map(
              l => typeof l === 'string' ? l : l.name
            );

            // ── Label helpers ─────────────────────────────────────────────
            const LIFECYCLE = [
              'openrouter:instantiating',
              'openrouter:instantiated',
              'openrouter:instantiation-failed',
              'openrouter:needs-key',
            ];
            async function setLifecycle(target) {
              for (const l of LIFECYCLE) {
                if (l === target) continue;
                await removeLabelIfPresent(l);
              }
              await tryApi(`add label ${target}`, () =>
                github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  labels: [target],
                })
              );
            }

            // Mark "instantiating" up front so the UI reflects we're probing.
            await setLifecycle('openrouter:instantiating');

            // ── 2. Probe OpenRouter ───────────────────────────────────────
            let status = 'unknown';
            let ok = false;
            let detail = '';
            if (!hasKey) {
              status = 'needs-key';
              detail =
                'OPENROUTER_API_KEY is **not set** in this repo\'s Actions secrets. ' +
                'Add it under Settings → Secrets and variables → Actions.';
            } else {
              try {
                const res = await fetch('https://openrouter.ai/api/v1/models', {
                  method: 'GET',
                  headers: {
                    'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}`,
                    'HTTP-Referer': `https://github.com/${context.repo.owner}/${context.repo.repo}`,
                    'X-Title': 'revvel-standards instantiation-check',
                  },
                });
                const text = await res.text();
                if (res.ok) {
                  ok = true;
                  status = 'instantiated';
                  // Try to surface a model count as a "thumbs up" data point.
                  let modelCount = 'unknown';
                  try {
                    const parsed = JSON.parse(text);
                    if (Array.isArray(parsed?.data)) modelCount = String(parsed.data.length);
                  } catch (_) { /* body wasn't JSON — fine */ }
                  detail = `HTTP ${res.status} — OpenRouter reachable, ${modelCount} models advertised.`;
                } else {
                  status = 'instantiation-failed';
                  detail =
                    `HTTP ${res.status} ${res.statusText}. ` +
                    `Response body (truncated):\n\n` +
                    '```\n' + text.slice(0, 600) + (text.length > 600 ? '\n…(truncated)' : '') + '\n```';
                }
              } catch (err) {
                status = 'instantiation-failed';
                detail = `Network / runtime error contacting OpenRouter: \`${err.message}\``;
              }
            }

            // ── 3. Update lifecycle label to reflect the result ───────────
            const targetLabel =
              status === 'instantiated' ? 'openrouter:instantiated' :
              status === 'needs-key'    ? 'openrouter:needs-key'    :
                                          'openrouter:instantiation-failed';
            await setLifecycle(targetLabel);

            // ── 4. Post the status comment ────────────────────────────────
            const nowIso = new Date().toISOString();
            const header = ok
              ? '👍 **OpenRouter instantiated**'
              : status === 'needs-key'
                ? '⚠️ **OpenRouter cannot instantiate — missing key**'
                : '❌ **OpenRouter instantiation failed**';
            const body =
              `${header}\n\n` +
              `- Checked at: \`${nowIso}\`\n` +
              `- Label: \`${targetLabel}\`\n` +
              `- \`OPENROUTER_API_KEY\`: ${hasKey ? '✅ configured' : '⚠️ not configured'}\n` +
              `- \`ADMIN_GITHUB_TOKEN\`: ${hasAdmin ? '✅ configured' : '⚠️ not configured (using GITHUB_TOKEN)'}\n\n` +
              `**Detail:** ${detail}\n\n` +
              (ok
                ? `_Next check: ~24h (cron \`17 6 * * *\`). Run on demand from the Actions tab if you need a fresh probe._`
                : `_If this stays broken for more than 24 hours the Ralph loop will escalate ` +
                  `this issue to \`needs-human\` and ping the repo owner._`);

            const comment = await tryApi('Post status comment', () =>
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              })
            );

            // React 👍 on the comment for the thumbs-up signal the issue requested.
            if (ok && comment?.data?.id) {
              await tryApi('React 👍 on status comment', () =>
                github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.data.id,
                  content: '+1',
                })
              );
            }

            // ── 5. Ralph loop: escalate if unresolved > 24h ───────────────
            if (!ok) {
              // Look at the last successful comment to decide "how long has this been broken?".
              const allComments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });
              const lastOk = [...allComments].reverse().find(c =>
                c.body && c.body.includes('👍 **OpenRouter instantiated**')
              );
              const baseline = lastOk ? new Date(lastOk.created_at).getTime() : new Date(tracking.created_at).getTime();
              const brokenForMs = Date.now() - baseline;
              const shouldEscalate = forceEscalate || brokenForMs > ESCALATE_AFTER_MS;

              core.info(`broken for ${Math.round(brokenForMs / 3600000)}h, threshold=${ESCALATE_AFTER_MS / 3600000}h, escalate=${shouldEscalate}`);

              if (shouldEscalate && !currentLabels.includes('openrouter:ralph-escalated')) {
                for (const l of ['openrouter:ralph-escalated', 'needs-human']) {
                  await tryApi(`add label ${l}`, () =>
                    github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number,
                      labels: [l],
                    })
                  );
                }
                await tryApi('Post Ralph escalation comment', () =>
                  github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    body:
                      `🚨 **Ralph loop escalation — OpenRouter instantiation unresolved**\n\n` +
                      `OpenRouter has been in a \`${targetLabel}\` state for ` +
                      `**more than 24 hours**. Calling in the heavy hitters.\n\n` +
                      `@midnghtsapphire please investigate: rotate the key, check ` +
                      `OpenRouter status, or dismiss this escalation by re-running ` +
                      `the probe once the root cause is fixed.\n\n` +
                      `- Last successful probe: ${lastOk ? `\`${lastOk.created_at}\`` : '_never_'}\n` +
                      `- Current detail: ${detail}`,
                  })
                );
              }
            } else {
              // Success → clear the escalation labels so the signal stays honest.
              for (const l of ['openrouter:ralph-escalated', 'needs-human']) {
                if (currentLabels.includes(l)) {
                  await removeLabelIfPresent(l);
                }
              }
            }

            // ── 6. Run summary ────────────────────────────────────────────
            core.summary
              .addHeading('OpenRouter Instantiation Check')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['Tracking issue', `#${issue_number}`],
                ['Status', status],
                ['Lifecycle label', targetLabel],
                ['OPENROUTER_API_KEY', hasKey ? 'configured' : 'missing'],
                ['ADMIN_GITHUB_TOKEN', hasAdmin ? 'configured' : 'missing'],
                ['Detail', detail.replace(/\n/g, ' ').slice(0, 300)],
              ])
              .write();

            if (!ok && status !== 'needs-key') {
              // Surface the failure in the workflow run UI — but do not fail
              // on `needs-key` since that's an operator action, not a bug.
              core.setFailed(`OpenRouter probe failed: ${detail.split('\n')[0]}`);
            }
    timeout-minutes: 60
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
