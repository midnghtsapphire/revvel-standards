name: Ready for Review Automation
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
concurrency:
  group: ready-for-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
jobs:
  promote-draft:
    name: Promote Draft PR When CI Passes
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == true &&
      (github.event.action == 'synchronize' || github.event.action == 'reopened')
    steps:
      - name: Check all CI status checks for this commit
        id: check-status
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            // Job names that belong to this workflow — exclude them from the
            // external-check evaluation so we never block on ourselves.
            const SELF_JOB_NAMES = new Set([
              'Promote Draft PR When CI Passes',
              'Label Linked Issues as In-Review',
              'Remove In-Review Label on PR Close',
            ]);
            const ALLOWED_CONCLUSIONS = new Set(['success', 'skipped', 'neutral']);

            // Poll until all external checks complete or we time out.
            const INITIAL_WAIT_MS  = 15_000;   // 15 s — let checks register first
            const POLL_INTERVAL_MS = 30_000;   // re-check every 30 s
            const MAX_WAIT_MS      = 8 * 60 * 1000; // 8 minutes — give up after this

            await new Promise(r => setTimeout(r, INITIAL_WAIT_MS));

            let elapsed = INITIAL_WAIT_MS;

            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
                per_page: 100,
              });

              const runs = data.check_runs.filter(r => !SELF_JOB_NAMES.has(r.name));
              core.info(`[${elapsed / 1000}s] Found ${runs.length} external check run(s):`);
              runs.forEach(r => core.info(`  • ${r.name}: ${r.status} / ${r.conclusion}`));

              if (runs.length === 0) {
                // No external CI configured — safe to promote immediately.
                core.info('No external check runs found — auto-promoting.');
                core.setOutput('all_passed', 'true');
                return true;
              }

              const allDone = runs.every(r => r.status === 'completed');

              if (allDone) {
                const allPassed = runs.every(r => ALLOWED_CONCLUSIONS.has(r.conclusion));
                if (!allPassed) {
                  const failed = runs.filter(r => !ALLOWED_CONCLUSIONS.has(r.conclusion));
                  failed.forEach(r => core.warning(`  ✗ ${r.name}: ${r.conclusion}`));
                }
                core.setOutput('all_passed', allPassed ? 'true' : 'false');
                return allPassed;
              }

              if (elapsed >= MAX_WAIT_MS) {
                const pending = runs.filter(r => r.status !== 'completed');
                core.warning(`Timed out after ${MAX_WAIT_MS / 1000}s. Still pending:`);
                pending.forEach(r => core.warning(`  • ${r.name}`));
                core.setOutput('all_passed', 'false');
                return false;
              }

              const pendingCount = runs.filter(r => r.status !== 'completed').length;
              core.info(`Waiting for ${pendingCount} check(s) to finish... (${elapsed / 1000}s elapsed)`);
              await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
              elapsed += POLL_INTERVAL_MS;
            }
      - name: Convert draft PR to Ready for Review
        if: steps.check-status.outputs.all_passed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.READY_FOR_REVIEW_TOKEN != '' && secrets.READY_FOR_REVIEW_TOKEN || secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || github.token }}
          script: |
            await github.graphql(`
              mutation($prId: ID!) {
                markPullRequestReadyForReview(input: { pullRequestId: $prId }) {
                  pullRequest { number title isDraft }
                }
              }
            `, { prId: context.payload.pull_request.node_id });

            core.notice(
              `✅ PR #${context.payload.pull_request.number} — all CI checks passed. ` +
              `Promoted from Draft to Ready for Review.`
            );
    timeout-minutes: 30
  label-linked-issues:
    name: Label Linked Issues as In-Review
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'opened' && github.event.pull_request.draft == false)
      )
    steps:
      - name: Ensure `in-review` label exists
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'in-review',
              });
            } catch (e) {
              if (e.status === 404) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: 'in-review',
                    color: 'fbca04',
                    description: 'Linked PR is open and ready for review',
                  });
                  core.info('Created label: in-review');
                } catch (ce) {
                  core.warning(`Failed to create label: ${ce.message}`);
                }
              } else {
                core.warning(`Failed to get label: ${e.message}`);
              }
            }
      - name: Find linked issues and apply `in-review` label
        id: find-issues
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const body  = context.payload.pull_request.body  || '';
            const title = context.payload.pull_request.title || '';
            const text  = `${title}\n${body}`;

            // ── 1. Match closing keywords in PR title / body ─────────────────
            // Match: Closes #N, Fixes #N, Resolves #N (all common variants)
            const pattern = /(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s+#(\d+)/gi;
            const matches = [...text.matchAll(pattern)];
            const issueNumberSet = new Set(matches.map(m => parseInt(m[1])));

            // ── 2. Parse branch name for issue/<N>- pattern ───────────────────
            // Covers branches created by the create-issue-branch action using
            // the label-based prefixes defined in .github/issue-branch.yml:
            //   issue/69-i-need-the-issue-to-close-...   (fallback prefix)
            //   feature/69-some-title                    (enhancement)
            //   bugfix/69-some-title                     (bug)
            //   docs/69-some-title                       (documentation)
            //   hotfix/69-some-title                     (security)
            //   chore/69-some-title                      (dependencies)
            const branchPattern = /^(?:issue|feature|bugfix|docs|hotfix|chore)\/(\d+)-/;
            const branchMatch = (context.payload.pull_request.head.ref || '').match(branchPattern);
            if (branchMatch) {
              issueNumberSet.add(parseInt(branchMatch[1], 10));
            }

            const issueNumbers = [...issueNumberSet];

            if (issueNumbers.length === 0) {
              core.info('No linked issues found in PR title, body, or branch name.');
              core.setOutput('issue_list', '');
              return;
            }

            core.info(`Linked issue(s): ${issueNumbers.join(', ')}`);
            core.setOutput('issue_list', issueNumbers.join(','));

            for (const num of issueNumbers) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  labels: ['in-review'],
                });
                core.info(`  • Added 'in-review' to issue #${num}`);
              } catch (e) {
                core.warning(`  • Could not label issue #${num}: ${e.message}`);
              }
            }
      - name: Check out repository (base ref, for scanner script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Post review-readiness checklist comment on PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { scanDiff, renderCheckboxLine } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/pr-review-scan.js`
            );

            // ── Fetch changed files (paginated) so the scanner can look
            //    at the added lines of the diff.
            let files = [];
            try {
              files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                }
              );
            } catch (e) {
              core.warning(`Failed to fetch PR files: ${e.message}`);
            }

            const { checks } = scanDiff(files);

            const issueList = '${{ steps.find-issues.outputs.issue_list }}';
            const closesAutoChecked = issueList ? '- [x]' : '- [ ]';
            const linkedSection = issueList
              ? `\n\n**Linked issue(s):** ${issueList.split(',').map(n => `#${n.trim()}`).join(', ')} — labeled \`in-review\` ✅`
              : '';

            const body = [
              '## 🟡 Ready for Review — AI Reviewer Handoff',
              '',
              'This PR is now open for review. The AI reviewer fleet is taking over the checklist below.',
              'Human approval is still required at the end, but each bot should work its assigned section first.',
              '',
              'Items marked `[x]` were verified automatically by scanning the PR diff; items marked `⚠️` failed an automated check and need attention; items left as `[ ]` still need a reviewer (bot or human) to confirm.',
              '',
              '### 🤖 Reviewer roster (invoked automatically)',
              '',
              '| Bot | Trigger | Owns |',
              '| --- | --- | --- |',
              '| **oAudrey · Triager** 🧠 — _sorts the inbox and decides next step_ (us) via `scripts/openrouter-personas.js` [handle: oaudrey, alias: triager] | `/oaudrey` or `/triager` | **First line of sight** — Triage owner / orchestration verdict |',
              '| **The Professor · Citer** 🎓 — _answers with sourced facts_ (us) via `scripts/openrouter-personas.js` [handle: professor, alias: citer, model: perplexity/sonar-pro] | `/professor` or `/citer` | Research-citations checklist section |',
              '| **MindMappr · Spotter** 🗺️ — _turns fuzzy ideas into structured maps_ (us) via `scripts/openrouter-personas.js` [handle: mindmappr, alias: spotter] | `/mindmappr` or `/spotter` | Ideation & coverage-gap checklist section |',
              '| **Coder · Fixer** 🛠️ — _applies the actual code fix_ (us) via `scripts/openrouter-personas.js` [handle: coder, alias: fixer] | `/coder` or `/fixer` | Implements diagnoses from Devin / Octopus / Copilot into a real patch |',
              '| **ORBIT · Pipeline Commander** 🪐 — _CircleCI expert: wires, validates, tunes pipelines CLI-first_ (us) via `scripts/openrouter-personas.js` [handle: orbit, alias: circleci] | `/orbit` or `/circleci` | `.circleci/config.yml` correctness, pipeline tuning, orb/policy work (playbook: `skills/circleci-expert/SKILL.md`) |',
              '| **OCTO · Reviewmaster** 🐙 — _Octopus Review expert: limits, index hygiene, model routing_ (us) via `scripts/openrouter-personas.js` [handle: octo, alias: octopus] | `/octo` or `/octopus` | Octopus Review operations: usage-limit lanes, `octopus repo index`, `@octp/cli`, OpenRouter/self-host routing (playbook: `skills/octopus-expert/SKILL.md`) |',
              '| **MENDER · Test Healer** 🧪 — _Mabl expert: pause guardian, credit-free run lanes, reactivation gate_ (us) via `scripts/openrouter-personas.js` [handle: mender, alias: mabl] | `/mender` or `/mabl` | Mabl questions + the PAUSED-tool decision lane (playbook: `skills/mabl-expert/SKILL.md`; Mabl paused 2026-05-27, replaced by Keploy) |',
              '| **RadioChaser · Standby** 📻 — _backup orchestrator when oAudrey is down_ (us, GOAP support) | `/radiochaser` or `/standby` | GOAP-support fallback when oAudrey is unavailable |',
              '| **CodeRabbit** (CodeRabbit Inc.) via `github.com/apps/coderabbitai` | `@coderabbitai review` | Line-by-line diff review, style, anti-patterns |',
              '| **Jules** (Google) via `BeksOmega/jules-action@v1.0.0` (invoke), `BeksOmega/jules-comms@v1.0.0` (feedback), `BeksOmega/jules-publish@v1.0.0` (publish) | auto on PR | Blocking-severity verdict on `jules/review` status. Note: `sanjay3290/jules-pr-reviewer@v1.0.0` was a 4th lane, silenced in #13974 — broken. |',
              '| **PandaOps** via `panda-ops.yml` | auto on PR | Full-diff AI reasoning, inline feedback |',
              '| **OpenRouter** (OpenRouter Inc.) via `ai-pr-review-openrouter.yml` | auto on PR | Diff summary via OpenRouter model |',
              '| **Octopus Review** (octopus-review-bot) via the GitHub App + `@octp/cli` | auto on PR | AI PR analysis (codebase-aware). Findings auto-route to coder via `octopus-route.yml`. |',
              '| **Copilot** (GitHub) via `github.com/apps/copilot` | `@copilot` mention below | Code Quality checklist section |',
              '| **Roo** | `roo` mention below | Testing checklist section |',
              '| **Antigravity** | `antigravity` mention below | Standards checklist section |',
              '',
              '_Any additional reviewer apps onboarded later should be added to the table above and assigned a section._',
              '',
              '### Invocation commands',
              '',
              '@coderabbitai review',
              '',
              'oaudrey (alias: triager) — please verify the **Triage** section below (first line of sight).',
              '@copilot — please verify the **Code Quality** section below.',
              'roo — please verify the **Testing** section below.',
              'professor (alias: citer) — please verify the **Research / Citations** section below.',
              'mindmappr (alias: spotter) — please verify the **Ideation & Coverage** section below.',
              'coder (alias: fixer) — apply the diagnosed fix and report which files you changed.',
              'antigravity — please verify the **Standards** section below.',
              'radiochaser — fallback if `oaudrey` is unreachable; otherwise no-op.',
              '',
              'Each bot: tick the boxes you have verified, and leave a comment explaining anything you cannot confirm.',
              '',
              '### Triage  _(owner: oaudrey)_',
              '- [ ] Scope matches the linked WR / issue acceptance criteria',
              '- [ ] No scope-creep beyond what was requested',
              '- [ ] Correct routing label is on the PR (`wr:code` / `wr:research` / `wr:jules` / `octopus-review`)',
              '',
              '### Code Quality  _(owner: @copilot)_',
              renderCheckboxLine('No hardcoded secrets or credentials', checks.secrets),
              '- [ ] All new API routes have input validation (Zod or equivalent)',
              '- [ ] All new API routes have auth / authorisation checks',
              renderCheckboxLine('No raw SQL with user-supplied values', checks.rawSql),
              renderCheckboxLine('No `console.log` leaking sensitive data', checks.consoleLog),
              renderCheckboxLine('No `eval()`, `Function()`, or dynamic `require()`', checks.dangerousEval),
              '',
              '### Testing  _(owner: roo)_',
              '- [ ] Tests written for new functionality',
              '- [ ] Coverage thresholds maintained (80% statements/functions/lines, 75% branches)',
              '- [ ] All CI checks passing',
              '',
              '### Research / Citations  _(owner: professor)_',
              '- [ ] Any factual claim added to docs has a citation or source link',
              '- [ ] No fabricated references (broken links, non-existent files)',
              '- [ ] Tool / library versions cited match what `package.json` / workflows pin',
              '',
              '### Ideation & Coverage  _(owner: mindmappr)_',
              '- [ ] Diff addresses the root cause, not just the surface symptom',
              '- [ ] Adjacent affected areas considered (other workflows, docs, tests)',
              '- [ ] No obvious missing follow-up (recurrence guard / standard addition)',
              '',
              '### Standards  _(owner: antigravity)_',
              '- [ ] Follows `MASTER_APP_TEMPLATE.md` conventions',
              '- [ ] Coderabbit comments addressed',
              `${closesAutoChecked} PR description references the linked issue(s) with \`Closes #N\``,
              linkedSection,
              '',
              '---',
              '_This comment was posted automatically by the Ready for Review Automation workflow._',
              '_Reviewer bots that are not yet installed in this repo will silently no-op; add them via their GitHub App / Action when available._',
            ].join('\n');

            try { await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            }); } catch (e) { core.warning(`Failed to create comment: ${e.message}`); }
    timeout-minutes: 15
  unlabel-on-close:
    name: Remove In-Review Label on PR Close
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    steps:
      - name: Remove `in-review` label from linked issues
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const body  = context.payload.pull_request.body  || '';
            const title = context.payload.pull_request.title || '';
            const text  = `${title}\n${body}`;

            // ── 1. Match closing keywords in PR title / body ─────────────────
            const pattern = /(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s+#(\d+)/gi;
            const matches = [...text.matchAll(pattern)];
            const issueNumberSet = new Set(matches.map(m => parseInt(m[1])));

            // ── 2. Parse branch name for issue/<N>- pattern ───────────────────
            const branchPattern = /^(?:issue|feature|bugfix|docs|hotfix|chore)\/(\d+)-/;
            const branchMatch = (context.payload.pull_request.head.ref || '').match(branchPattern);
            if (branchMatch) {
              issueNumberSet.add(parseInt(branchMatch[1], 10));
            }

            const issueNumbers = [...issueNumberSet];

            if (issueNumbers.length === 0) {
              core.info('No linked issues found — nothing to clean up.');
              return;
            }

            for (const num of issueNumbers) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  name: 'in-review',
                }).catch(err => { if (err.status !== 404) throw err; });
                core.info(`  • Removed 'in-review' from issue #${num}`);
              } catch (e) {
                // 404 = label was not present; ignore silently
                if (e.status !== 404) {
                  core.warning(`  • Could not remove label from issue #${num}: ${e.message}`);
                }
              }
            }
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
