name: Credential Label Router
on:
  issues:
    types:
      - labeled
      - reopened
  schedule:
    - cron: 0 * * * *
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to route
        required: true
        type: number
permissions:
  issues: write
  contents: read
concurrency:
  group: credential-router-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false
jobs:
  route:
    name: Route credentials-missing issue
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.label.name == 'credentials-missing') || (github.event_name == 'issues' && github.event.action == 'reopened')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check if issue has credentials-missing label
        id: check
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!issueNumber) {
              core.notice('No issue number provided');
              core.setOutput('needs_routing', 'false');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
            const hasCredentialsMissing = labels.includes('credentials-missing');
            const hasCredentialsReady = labels.includes('credentials-ready');
            const alreadyRouted = labels.includes('vault-agent') ||
                                  labels.includes('agent-hq') ||
                                  labels.includes('desktop-access-required') ||
                                  labels.includes('needs-human');

            core.info(`Issue #${issueNumber} labels: ${labels.join(', ')}`);
            core.info(`Has credentials-missing: ${hasCredentialsMissing}`);
            core.info(`Has credentials-ready: ${hasCredentialsReady}`);
            core.info(`Already routed: ${alreadyRouted}`);

            if (hasCredentialsReady) {
              core.notice('Issue already has credentials-ready label. Skipping routing.');
              core.setOutput('needs_routing', 'false');
              return;
            }

            if (!hasCredentialsMissing) {
              core.notice('Issue does not have credentials-missing label. Skipping routing.');
              core.setOutput('needs_routing', 'false');
              return;
            }

            if (alreadyRouted) {
              core.notice('Issue already routed to an agent. Checking if stuck...');
              core.setOutput('needs_routing', 'false');
              core.setOutput('check_stale', 'true');
              core.setOutput('issue_number', String(issueNumber));
              return;
            }

            core.setOutput('needs_routing', 'true');
            core.setOutput('issue_number', String(issueNumber));
      - name: Trigger Agent HQ API
        id: trigger-agent-hq
        if: steps.check.outputs.needs_routing == 'true' && env.AGENT_HQ_TOKEN != ''
        env:
          AGENT_HQ_TOKEN: ${{ secrets.AGENT_HQ_TOKEN }}
          AGENT_HQ_URL: ${{ secrets.AGENT_HQ_URL || 'https://agent-hq.revvel.co' }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        run: |
          # Get issue details
          ISSUE_DATA=$(gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER)
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')

          # Trigger Agent HQ desktop agent
          RESPONSE=$(curl -X POST "$AGENT_HQ_URL/api/trigger" \
            -H "Authorization: Bearer $AGENT_HQ_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"issueNumber\": \"$ISSUE_NUMBER\",
              \"issueTitle\": $(echo "$ISSUE_TITLE" | jq -Rs .),
              \"issueBody\": $(echo "$ISSUE_BODY" | jq -Rs .),
              \"repository\": \"${{ github.repository }}\",
              \"task\": \"credential-provisioning\",
              \"agentType\": \"desktop-agent\",
              \"workflow\": \"credential-label-router\"
            }" -w "%{http_code}" -o /tmp/agent-hq-response.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            echo "agent_hq_success=true" >> "$GITHUB_OUTPUT"
            # Add agent-hq and desktop-access-required labels
            gh issue edit $ISSUE_NUMBER --add-label "agent-hq,desktop-access-required"
            echo "✅ Successfully routed to Agent HQ"
          else
            echo "agent_hq_success=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Agent HQ routing failed with HTTP $HTTP_CODE"
            cat /tmp/agent-hq-response.json || true
          fi
      - name: Post Agent HQ routing comment
        if: steps.trigger-agent-hq.outputs.agent_hq_success == 'true'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);

            const routingComment = `🤖 **Agent HQ Desktop Agent Triggered**

            This issue has been routed to **Agent HQ** for desktop-based credential retrieval.

            **What happens next:**
            1. A desktop agent with file system access will attempt to retrieve the required credentials
            2. Credentials will be securely provisioned to Doppler or GitHub Actions secrets
            3. The \`credentials-missing\` label will be automatically removed once all credentials are available
            4. The \`credentials-ready\` label will be applied when provisioning is complete

            **Estimated time:** 5-15 minutes (depending on credential complexity)

            ⏱️ **Auto-escalation:** If this is taking longer than expected, the issue will be automatically escalated to \`needs-human\` after **6 hours** (reduced from 24h for faster response).

            _Routed by \`.github/workflows/credential-label-router.yml\`_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: routingComment,
            });
      - name: Route to Vault Agent (fallback)
        if: steps.check.outputs.needs_routing == 'true'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          AGENT_HQ_SUCCESS: ${{ steps.trigger-agent-hq.outputs.agent_hq_success || 'false' }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const agentHqSuccess = process.env.AGENT_HQ_SUCCESS === 'true';

            if (agentHqSuccess) {
              core.notice('Already routed to Agent HQ. Skipping Vault Agent routing.');
              return;
            }

            // Add vault-agent label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['vault-agent'],
              });
              core.info('Added vault-agent label');
            } catch (error) {
              core.warning(`Could not add vault-agent label: ${error.message}`);
            }

            // Post routing comment
            const routingComment = `🔐 **Vault Agent Routing**

            This issue requires credential provisioning. The **Vault Agent** skill has been assigned.

            **Provisioning Options:**

            ### Option 1: Automated Provisioning (Recommended)
            If you have access to the credential sources, run:
            \`\`\`bash
            # Install Doppler CLI
            curl -Ls https://cli.doppler.com/install.sh | sh

            # Login and select project
            doppler login
            doppler setup

            # Set the required secrets (see Credential Gatekeeper comment above)
            doppler secrets set SECRET_NAME --value "YOUR_VALUE_HERE"
            \`\`\`

            Once secrets are in Doppler, the \`credential-gatekeeper.yml\` workflow will automatically sync them to GitHub Actions secrets.

            ### Option 2: Manual GitHub Secrets
            If Doppler is not available, add secrets directly to GitHub:
            1. Go to **Settings** → **Secrets and variables** → **Actions**
            2. Click **New repository secret**
            3. Add each required secret from the Credential Gatekeeper comment above

            ### Option 3: Desktop Agent with File System Access
            If credentials are stored locally (Vault CLI, OS keychain, env files):
            - **Flexina**: If you have Flexina desktop agent configured, add the \`flexina\` label
            - **Agent HQ**: If you have Agent HQ configured, it will automatically trigger on the next cron sweep
            - **BITO CLI**: Run \`bito secret get SECRET_NAME\` to retrieve from local vault


            **When credentials are ready:**
            1. Remove the \`credentials-missing\` label
            2. Add the \`credentials-ready\` label
            3. Implementation can proceed

            **Need help?**
            - Read: \`docs/SECRETS_MANAGEMENT.md\`
            - Read: \`skills/vault-agent/SKILL.md\`
            - Or add the \`needs-human\` label for manual assistance


            ⏱️ **Auto-escalation:** _If this issue remains blocked for more than **6 hours** (reduced from 24h), it will be automatically escalated to \`needs-human\`._

            _Routed by \`.github/workflows/credential-label-router.yml\`_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: routingComment,
            });

            core.info(`Posted routing comment on issue #${issueNumber}`);
      - name: Check for stale credential routing
        if: steps.check.outputs.check_stale == 'true'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            // Find when credentials-missing label was applied (not issue.updated_at)
            const timeline = await github.rest.issues.listEventsForTimeline({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const labelEvents = timeline.data
              .filter(e => e.event === 'labeled' && e.label?.name === 'credentials-missing')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (labelEvents.length === 0) {
              core.notice(`Issue #${issueNumber} does not have credentials-missing label event. Skipping.`);
              return;
            }

            const labeledAt = new Date(labelEvents[0].created_at);
            const now = new Date();
            const hoursSinceLabeled = (now - labeledAt) / (1000 * 60 * 60);

            core.info(`Issue #${issueNumber} has had credentials-missing label for ${hoursSinceLabeled.toFixed(1)} hours`);

            // REDUCED TIMEOUT: 6 hours since label was applied
            if (hoursSinceLabeled > 6) {
              core.warning(`Issue #${issueNumber} has had credentials-missing for over 6 hours. Escalating...`);

              // Add needs-human label
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['needs-human'],
                });
              } catch (error) {
                core.warning(`Could not add needs-human label: ${error.message}`);
              }

              // Post escalation comment
              const escalationComment = `⚠️ **Credential Provisioning Stuck — Escalated to Human**

            This issue has been labeled \`credentials-missing\` for over **6 hours** without resolution (reduced from 24h for faster response).

            **Current labels:** ${(issue.labels || []).map(l => typeof l === 'string' ? l : l.name).join(', ')}

            **Possible reasons:**
            - Credentials are stored in a location not accessible to automated agents
            - Doppler project not configured or credentials not in Doppler
            - GitHub Actions secrets not provisioned
            - Desktop agent (Agent HQ, Flexina) not configured or not accessible
            - 2FA or manual approval required at credential source

            **Next steps:**
            1. A human with the necessary access needs to manually provision the credentials
            2. Follow the instructions in the Vault Agent routing comment above
            3. Once all credentials are provisioned, remove \`credentials-missing\` and add \`credentials-ready\`

            **For faster resolution in the future:**
            - Configure Doppler integration (see \`docs/SECRETS_MANAGEMENT.md\`)
            - Set up Agent HQ for desktop-based credential retrieval
            - Document credential sources in the repo's \`BOM.md\`


            _Auto-escalated by \`.github/workflows/credential-label-router.yml\` after 6+ hours without resolution._`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: escalationComment,
              });

              core.info(`Escalated issue #${issueNumber} to needs-human`);
            } else {
              core.notice(`Issue #${issueNumber} has had credentials-missing for ${hoursSinceLabeled.toFixed(1)}h. Will escalate after 6h.`);
            }
    timeout-minutes: 30
  sweep-stale:
    name: Sweep for stale credential issues
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Find stale credential issues
        uses: actions/github-script@v8
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'credentials-missing',
              per_page: 100,
            });

            core.info(`Found ${issues.length} open issues with credentials-missing label`);

            for (const issue of issues) {
              const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);

              // Skip if already escalated
              if (labels.includes('needs-human')) {
                continue;
              }

              // Find when credentials-missing label was applied
              const timeline = await github.rest.issues.listEventsForTimeline({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });

              const labelEvents = timeline.data
                .filter(e => e.event === 'labeled' && e.label?.name === 'credentials-missing')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (labelEvents.length === 0) {
                continue;
              }

              const labeledAt = new Date(labelEvents[0].created_at);
              const now = new Date();
              const hoursSinceLabeled = (now - labeledAt) / (1000 * 60 * 60);

              // REDUCED TIMEOUT: 6 hours since label was applied
              if (hoursSinceLabeled > 6) {
                core.warning(`Issue #${issue.number} has had credentials-missing for ${hoursSinceLabeled.toFixed(1)} hours. Triggering escalation...`);

                // Trigger the main workflow for this issue
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'credential-label-router.yml',
                  ref: context.ref,
                  inputs: {
                    issue_number: String(issue.number),
                  },
                });
              }
            }
    timeout-minutes: 45
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
