name: Credential Label Router

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  route:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Route credentials-missing labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = (issue.labels || []).map(l => l.name);
            if (!labels.includes('credentials-missing')) return;
            core.info(`Routing issue #${issue.number} for credentials-missing`);

  sweep-stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      actions: write
    steps:
      - name: Sweep stale credentials-missing issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'credentials-missing', per_page: 100,
            });
            for (const issue of issues) {
              core.info(`Re-dispatching routing for stale issue #${issue.number}`);
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'credential-label-router.yml',
                  ref: context.ref.replace('refs/heads/', ''),
                });
              } catch (e) {
                core.warning(`Failed to dispatch for #${issue.number}: ${e.message}`);
              }
            }
