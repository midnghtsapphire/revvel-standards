name: Credential Label Router

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to route'
        required: false

permissions:
  issues: write
  contents: read

jobs:
  route:
    if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Route credential-missing issues
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number
              || parseInt(context.payload.inputs?.issue_number, 10);
            if (!issueNumber) {
              core.info('No issue number to route; skipping.');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            if (!labels.includes('credentials-missing')) {
              core.info('Not a credentials-missing issue; skipping.');
              return;
            }
            core.info(`Routed issue #${issueNumber}`);

  sweep-stale:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      actions: write
    steps:
      - name: Sweep stale credentials-missing issues
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'credentials-missing',
              per_page: 100,
            });
            for (const issue of issues) {
              const ageHours = (Date.now() - new Date(issue.updated_at).getTime()) / 3600000;
              if (ageHours < 24) continue;
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'credential-label-router.yml',
                  ref: context.ref.replace('refs/heads/', ''),
                  inputs: { issue_number: String(issue.number) },
                });
                core.info(`Re-triggered routing for #${issue.number}`);
              } catch (err) {
                core.warning(`Failed to re-trigger #${issue.number}: ${err.message}`);
              }
            }
