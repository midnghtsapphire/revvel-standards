name: Doppler Secrets Sync

# Syncs secrets from Doppler to GitHub Actions repository secrets.
# Run manually after adding or rotating secrets in Doppler.
#
# Prerequisites:
#   1. A Doppler project with an environment (e.g., "github")
#   2. DOPPLER_TOKEN secret set in this repo (Doppler service token)
#
# Setup instructions: docs/SECRETS_MANAGEMENT.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show which secrets would be synced without writing them"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync Doppler → GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Check for DOPPLER_TOKEN
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::error::DOPPLER_TOKEN is not configured. Set it in repo settings first."
            echo "See docs/SECRETS_MANAGEMENT.md for setup instructions."
            exit 1
          fi

      - name: Install Doppler CLI
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Fetch and display secret names (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          echo "## Doppler Secrets (Dry Run)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The following secrets are available in Doppler and would be synced:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          doppler secrets --only-names | while read -r name; do
            echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Run again with dry_run=false to sync these to GitHub Actions secrets._" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync secrets to GitHub
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          SYNCED=0

          echo "## Doppler Secrets Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # Fetch secrets as JSON and iterate
          doppler secrets download --no-file --format json | \
            jq -r 'to_entries[] | select(.key != "DOPPLER_TOKEN" and .key != "DOPPLER_PROJECT" and .key != "DOPPLER_ENVIRONMENT" and .key != "DOPPLER_CONFIG") | .key' | \
            while read -r name; do
              VALUE=$(doppler secrets get "$name" --plain 2>/dev/null)
              if [ -n "$VALUE" ]; then
                gh secret set "$name" --repo "$REPO" --body "$VALUE" 2>/dev/null && \
                  echo "| \`$name\` | Synced |" >> "$GITHUB_STEP_SUMMARY" || \
                  echo "| \`$name\` | **Failed** |" >> "$GITHUB_STEP_SUMMARY"
                SYNCED=$((SYNCED + 1))
              fi
            done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Synced at $(date -u '+%Y-%m-%d %H:%M UTC')_" >> "$GITHUB_STEP_SUMMARY"
