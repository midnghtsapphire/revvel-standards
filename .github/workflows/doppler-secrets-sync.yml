name: Doppler Secrets Sync
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  verify:
    name: Verify Doppler connection
    runs-on: ubuntu-latest
    steps:
      - name: Check for DOPPLER_TOKEN
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
        run: |
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::error::None of DOPPLER_AGENT_TOKEN, DOPPLER_TOKEN, DOPPLER_LOCAL_TOKEN, DOPPLER_API_KEY, DOPPLER_AGENT_ODIC, or DOPPLER_CIRCLECI_OIDC is configured. See docs/SECRETS_MANAGEMENT.md for setup."
            exit 1
          fi
          echo "DOPPLER_TOKEN is configured."
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4.0.1
      - name: List available secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
        run: |
          echo "## Doppler Secrets Inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          doppler secrets --only-names | while read -r name; do
            echo "| \`$name\` | Configured |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Verified at $(date -u '+%Y-%m-%d %H:%M UTC')_" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Using Doppler in workflows" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo '- name: Fetch secrets from Doppler' >> "$GITHUB_STEP_SUMMARY"
          echo '  uses: dopplerhq/secrets-fetch-action@v2.0.0.0.0 >> "$GITHUB_STEP_SUMMARY"
          echo '  with:' >> "$GITHUB_STEP_SUMMARY"
          echo '    doppler-token: \${{ secrets.DOPPLER_TOKEN }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
