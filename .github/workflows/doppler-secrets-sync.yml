name: Doppler Secrets Sync

# Verifies Doppler connectivity and lists available secrets.
# For runtime secret injection, workflows should use dopplerhq/secrets-fetch-action
# directly (see docs/SECRETS_MANAGEMENT.md for examples).
#
# This workflow is a diagnostic/verification tool — run it to confirm
# Doppler is properly connected and see which secrets are available.
#
# Prerequisites:
#   1. Doppler GitHub App installed (Settings → Integrations → GitHub)
#   2. DOPPLER_TOKEN secret set in this repo (Doppler service token)
#
# Setup instructions: docs/SECRETS_MANAGEMENT.md

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Doppler connection
    runs-on: ubuntu-latest
    steps:
      - name: Check for DOPPLER_TOKEN
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC }}
        run: |
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::error::None of DOPPLER_TOKEN, DOPPLER_LOCAL_TOKEN, DOPPLER_API_KEY, or DOPPLER_AGENT_ODIC is configured. See docs/SECRETS_MANAGEMENT.md for setup."
            exit 1
          fi
          echo "DOPPLER_TOKEN is configured."

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: List available secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC }}
        run: |
          echo "## Doppler Secrets Inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          doppler secrets --only-names | while read -r name; do
            echo "| \`$name\` | Configured |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Verified at $(date -u '+%Y-%m-%d %H:%M UTC')_" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Using Doppler in workflows" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo '- name: Fetch secrets from Doppler' >> "$GITHUB_STEP_SUMMARY"
          echo '  uses: dopplerhq/secrets-fetch-action@v2' >> "$GITHUB_STEP_SUMMARY"
          echo '  with:' >> "$GITHUB_STEP_SUMMARY"
          echo '    doppler-token: \${{ secrets.DOPPLER_TOKEN }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
