name: Blue Ocean SAR source health

# Every six hours, probe each satellite and terrain data source used by
# docs/blue-ocean-sar, check the content each one returns, choose working
# mirrors and derive timeouts (opendata/source_health.py). The run goes red
# when a required source has no healthy mirror, and GitHub then notifies the
# repository owner. The chosen configuration is uploaded as an artifact; the
# live-run workflow makes the same choice at the start of every run.
# Scheduled runs only happen from the default branch.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: blue-ocean-sar-source-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Unit tests for the prober
        working-directory: docs/blue-ocean-sar/opendata
        run: python -m unittest test_source_health

      - name: Probe sources and select mirrors
        working-directory: docs/blue-ocean-sar/opendata
        run: |
          mkdir -p "$GITHUB_WORKSPACE/health"
          python source_health.py --samples 3 \
            --out "$GITHUB_WORKSPACE/health/source_health.json" \
            --config-out "$GITHUB_WORKSPACE/health/download_config.json" \
            --summary-md "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-health-${{ github.run_id }}
          path: health
          retention-days: 14
