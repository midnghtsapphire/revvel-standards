name: Agent Fallback Workflow

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string
      prefer_agent:
        description: 'Preferred agent (OpenRouter, Devin)'
        required: false
        default: 'OpenRouter'
        type: choice
        options:
          - OpenRouter
          - Devin
  issues:
    types: [opened, labeled]

jobs:
  health-check:
    runs-on: ubuntu-latest
    outputs:
      openrouter_available: ${{ steps.check-openrouter.outputs.available }}
      devin_available: ${{ steps.check-devin.outputs.available }}
    steps:
      - name: Check OpenRouter availability
        id: check-openrouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Devin availability
        id: check-devin
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
        run: |
          if [ -n "$DEVIN_API_KEY" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

  openrouter-agent:
    needs: health-check
    if: needs.health-check.outputs.openrouter_available == 'true' && (github.event.inputs.prefer_agent == 'OpenRouter' || github.event.inputs.prefer_agent == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OpenRouter agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          if [ -f scripts/call-openrouter-api.sh ]; then
            bash scripts/call-openrouter-api.sh
          else
            echo "OpenRouter script not found; skipping."
          fi

  devin-agent:
    needs: health-check
    if: needs.health-check.outputs.devin_available == 'true' && github.event.inputs.prefer_agent == 'Devin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Devin agent
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          if [ -f scripts/call-devin-api.sh ]; then
            bash scripts/call-devin-api.sh
          else
            echo "ERROR: scripts/call-devin-api.sh not found"
            exit 1
          fi
