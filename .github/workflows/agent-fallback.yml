name: Agent Fallback

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string
      prefer_agent:
        description: 'Preferred agent (OpenRouter, Devin, manual)'
        required: false
        default: 'OpenRouter'
        type: string
  issues:
    types: [opened, labeled]

jobs:
  health_check:
    name: Health Check - Agent Availability
    runs-on: ubuntu-latest
    outputs:
      openrouter_available: ${{ steps.check.outputs.openrouter_available }}
      devin_available: ${{ steps.check.outputs.devin_available }}
    steps:
      - name: Check agent availability
        id: check
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "openrouter_available=true" >> $GITHUB_OUTPUT
          else
            echo "openrouter_available=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.DEVIN_API_KEY }}" ]; then
            echo "devin_available=true" >> $GITHUB_OUTPUT
          else
            echo "devin_available=false" >> $GITHUB_OUTPUT
          fi

  openrouter_lane:
    name: OpenRouter Agent Lane
    needs: health_check
    if: needs.health_check.outputs.openrouter_available == 'true' && (inputs.prefer_agent == 'OpenRouter' || inputs.prefer_agent == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invoke OpenRouter agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if [ -f scripts/call-openrouter-api.sh ]; then
            bash scripts/call-openrouter-api.sh
          else
            echo "OpenRouter script not found; skipping"
          fi

  devin_lane:
    name: Devin Agent Lane (Fallback)
    needs: [health_check, openrouter_lane]
    if: always() && needs.health_check.outputs.devin_available == 'true' && (inputs.prefer_agent == 'Devin' || needs.openrouter_lane.result == 'failure' || needs.openrouter_lane.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invoke Devin API
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scripts/call-devin-api.sh ]; then
            bash scripts/call-devin-api.sh
          else
            echo "ERROR: scripts/call-devin-api.sh not found"
            exit 1
          fi

  manual_fallback:
    name: Manual Fallback Notification
    needs: [openrouter_lane, devin_lane]
    if: always() && needs.openrouter_lane.result != 'success' && needs.devin_lane.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Notify manual intervention required
        run: |
          echo "All automated agent lanes failed or were skipped."
          echo "Manual intervention required for issue #${{ inputs.issue_number }}"
