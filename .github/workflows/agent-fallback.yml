name: Agent Fallback

# 2026-07-25 owner-directive: quiet-mode gating removed 2026-08-08 per DECISIONS.md D017.
# Original quiet-mode disablement (PR #16805) archived here for RVS-PRESERVE-001 audit trail:
#   who: owner  when: 2026-07-25  why: reduce ~80 machine PRs/night, ~$400/week OpenRouter spend
# Exit-quiet-mode restoration (this file): DECISIONS.md D017, gated by open issue #17099.

on:
  issues:
    types: [opened, reopened, labeled]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-fallback-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run agent fallback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/agent-fallback.js || echo "fallback completed with warnings"

      - name: Remove in-progress label on failure
        if: failure() && github.event.issue.number
        uses: actions/github-script@v7
        with:
          script: |
            // LABEL-RACE-001: swallow 404 when label already removed by concurrent run
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              name: 'agent:in-progress'
            }).catch(err => {
              if (err.status !== 404) throw err;
            });
