name: Agent Fallback Chain

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      issue_title:
        required: false
        type: string
        default: ""
      issue_body:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string
      prefer_agent:
        description: "Preferred agent (OpenRouter, Devin, manual)"
        required: false
        default: "OpenRouter"
        type: choice
        options:
          - OpenRouter
          - Devin
          - manual

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      openrouter_available: ${{ steps.check.outputs.openrouter_available }}
      devin_available: ${{ steps.check.outputs.devin_available }}
    steps:
      - name: Check agent availability
        id: check
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "openrouter_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "openrouter_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.DEVIN_API_KEY }}" ]; then
            echo "devin_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "devin_available=false" >> "$GITHUB_OUTPUT"
          fi

  openrouter-agent:
    needs: health-check
    if: |
      needs.health-check.outputs.openrouter_available == 'true' &&
      (github.event_name == 'workflow_call' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent-fallback')) ||
       (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'agent-fallback')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OpenRouter agent
        id: openrouter
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          if [ -f scripts/call-openrouter-api.sh ]; then
            bash scripts/call-openrouter-api.sh
          else
            echo "OpenRouter script not found; continuing to fallback."
            exit 1
          fi

  devin-agent:
    needs: [health-check, openrouter-agent]
    if: |
      always() &&
      needs.health-check.outputs.devin_available == 'true' &&
      (needs.openrouter-agent.result != 'success' || inputs.prefer_agent == 'Devin')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Devin agent (fallback)
        id: devin
        continue-on-error: true
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          if [ -f scripts/call-devin-api.sh ]; then
            bash scripts/call-devin-api.sh
          else
            echo "Devin script not found; continuing to fallback."
            exit 1
          fi

  manual-fallback:
    needs: [openrouter-agent, devin-agent]
    if: |
      always() &&
      needs.openrouter-agent.result != 'success' &&
      needs.devin-agent.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify manual intervention required
        run: |
          echo "All automated agents failed or unavailable."
          echo "Manual intervention required for issue #${{ inputs.issue_number || github.event.issue.number || github.event.inputs.issue_number }}"
