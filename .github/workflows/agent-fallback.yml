# Agent Fallback Workflow
#
# Provides fallback agent execution when the primary agent path is unavailable
# or fails. Supports OpenRouter -> OpenHands -> manual fallback chain.
#
# QUIET-MODE HISTORY (2026-07-25): Triggers were disabled by PR #16805 to reduce
# noise (~80 machine PRs/night, ~$400/week OpenRouter). Per DECISIONS.md D017
# (2026-08-08, owner directive "no more quiet mode"), triggers restored to
# pre-#16805 state. Issue #17099 is the standing Quiet Mode gate signal per
# wr/specs/01-quiet-mode.md — do NOT close it.
# ARCHIVE (RVS-PRESERVE-001): prior quiet-mode-only trigger was
# `on: { workflow_dispatch: {} }` (author: quiet-mode-agent, 2026-07-25).

name: Agent Fallback

on:
  issues:
    types: [opened, reopened, labeled]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_call:
    inputs:
      issue_number:
        required: false
        type: string
      agent:
        required: false
        type: string
        default: openrouter
  workflow_dispatch:
    inputs:
      issue_number:
        required: false
        type: string
      agent:
        required: false
        type: string
        default: openrouter

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-fallback-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run agent fallback chain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          AGENT: ${{ inputs.agent || 'openrouter' }}
        run: |
          if [ -f scripts/agent-fallback.js ]; then
            node scripts/agent-fallback.js || echo "::warning::agent fallback exited non-zero"
          else
            echo "::notice::scripts/agent-fallback.js not present; skipping"
          fi
