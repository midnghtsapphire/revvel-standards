name: Agent Fallback

on:
  workflow_dispatch:
    inputs:
      prefer_agent:
        description: 'Preferred agent to invoke (Devin, Claude, Codex)'
        required: false
        default: 'Devin'
        type: choice
        options:
          - Devin
          - Claude
          - Codex
      task:
        description: 'Task description for the agent'
        required: true
        type: string
      issue_number:
        description: 'Optional issue number for context'
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  health-check:
    name: Agent Health Check
    runs-on: ubuntu-latest
    outputs:
      devin_available: ${{ steps.check.outputs.devin_available }}
      claude_available: ${{ steps.check.outputs.claude_available }}
      codex_available: ${{ steps.check.outputs.codex_available }}
    steps:
      - name: Check agent availability
        id: check
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          if [ -n "${DEVIN_API_KEY:-}" ]; then
            echo "devin_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "devin_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "claude_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "claude_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "codex_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "codex_available=false" >> "$GITHUB_OUTPUT"
          fi

  devin-lane:
    name: Devin Agent Lane
    needs: health-check
    if: needs.health-check.outputs.devin_available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.prefer_agent == 'Devin')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Invoke Devin API
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          TASK: ${{ inputs.task }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          bash scripts/call-devin-api.sh
