name: Agent Fallback Lane

on:
  workflow_dispatch:
    inputs:
      prefer_agent:
        description: 'Preferred agent to invoke (Devin, Claude, Copilot)'
        required: false
        default: 'Devin'
        type: choice
        options:
          - Devin
          - Claude
          - Copilot
      issue_number:
        description: 'Issue number to process'
        required: false
        type: string
      task_description:
        description: 'Task description for the agent'
        required: false
        type: string
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  health-check:
    name: Agent Health Check
    runs-on: ubuntu-latest
    outputs:
      devin_available: ${{ steps.check-devin.outputs.available }}
      claude_available: ${{ steps.check-claude.outputs.available }}
      copilot_available: ${{ steps.check-copilot.outputs.available }}
    steps:
      - name: Check Devin availability
        id: check-devin
        run: |
          if [ -n "${{ secrets.DEVIN_API_KEY }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "✅ Devin API key is configured"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Devin API key is not configured"
          fi

      - name: Check Claude availability
        id: check-claude
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "✅ Anthropic API key is configured"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Anthropic API key is not configured"
          fi

      - name: Check Copilot availability
        id: check-copilot
        run: |
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "✅ GitHub token is configured"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ GitHub token is not configured"
          fi

  invoke-devin:
    name: Invoke Devin Agent
    needs: health-check
    runs-on: ubuntu-latest
    if: |
      needs.health-check.outputs.devin_available == 'true' &&
      (inputs.prefer_agent == 'Devin' || inputs.prefer_agent == '' || inputs.prefer_agent == null)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Invoke Devin API
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TASK_DESCRIPTION: ${{ inputs.task_description }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/call-devin-api.sh
          scripts/call-devin-api.sh

  invoke-claude:
    name: Invoke Claude Agent (Fallback)
    needs: health-check
    runs-on: ubuntu-latest
    if: |
      needs.health-check.outputs.claude_available == 'true' &&
      inputs.prefer_agent == 'Claude'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Invoke Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TASK_DESCRIPTION: ${{ inputs.task_description }}
          REPO: ${{ github.repository }}
        run: |
          echo "Claude fallback lane not yet implemented"

  invoke-copilot:
    name: Invoke Copilot Agent (Fallback)
    needs: health-check
    runs-on: ubuntu-latest
    if: |
      needs.health-check.outputs.copilot_available == 'true' &&
      inputs.prefer_agent == 'Copilot'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Invoke Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TASK_DESCRIPTION: ${{ inputs.task_description }}
          REPO: ${{ github.repository }}
        run: |
          echo "Copilot fallback lane not yet implemented"
