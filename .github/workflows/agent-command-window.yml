name: Agent Command Window

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [agent_status]

concurrency:
  group: agent-command-window-${{ github.event.issue.number || github.event.client_payload.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  route-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Read the trusted router from the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Route the command and update the window
        env:
          AGENT_ROUTER_CONFIG: .github/agent-router.json
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/agent-command-router.mjs
