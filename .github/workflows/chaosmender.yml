# ChaosMender — Error Pattern Sentinel
# Inspired by Netflix Chaos Monkey. Instead of randomly killing services to
# test resilience, ChaosMender proactively scans for KNOWN failure patterns
# from config/error-ledger.json BEFORE they cause incidents.
#
# When unguarded patterns are detected:
#   - Reports exact file + line number + known fix from the ledger
#   - Files a [SELF-HEAL] GitHub issue so the self-healing loop picks it up
#
# Runs:
#   - On every PR that touches workflows or scripts (prevention gate)
#   - Daily at 06:00 UTC (background detection sweep)
#   - On workflow_dispatch (manual trigger)

name: ChaosMender

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'config/error-ledger.json'
  workflow_dispatch:
    inputs:
      file_issues:
        description: 'File GitHub issues for findings (true/false)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  scan:
    name: Scan for known error patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR-scope step can diff against the base commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compute PR changed files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # SHAs (not free text) — safe to shell out. Fall back to HEAD~1 if the
          # base commit isn't reachable for any reason.
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || git diff --name-only HEAD~1 HEAD)"
          {
            echo 'files<<CHAOS_EOF'
            echo "$CHANGED"
            echo 'CHAOS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run ChaosMender scan
        id: scan
        # On PRs: scan ONLY the files this PR changed (gate the diff, not the
        # whole-repo baseline). The daily scheduled run scans everything and
        # files issues so the self-healing loop can track/auto-remediate the
        # pre-existing baseline.
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/chaosmender.js --changed-only
          elif [[ "${{ github.event.inputs.file_issues }}" == "false" ]]; then
            node scripts/chaosmender.js
          else
            node scripts/chaosmender.js --file-issues
          fi
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHAOSMENDER_CHANGED_FILES: ${{ steps.changed.outputs.files }}

      - name: Annotate PR with findings
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            // Best-effort annotation — a comment-post permission error (e.g. 403
            // on a restricted token) must NOT crash the job or mask the real
            // scan result (CLAUDE.md gotcha #2). The scan step's exit code is the
            // source of truth.
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '## ⚡ ChaosMender detected known error patterns',
                  '',
                  'This PR changes files that trigger patterns in `config/error-ledger.json`.',
                  'See the [ChaosMender job log](' +
                    context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                    '/actions/runs/' + context.runId + ') for exact locations and fixes.',
                  '',
                  'Apply the listed fix before merging to prevent a production incident.',
                ].join('\n'),
              });
            } catch (err) {
              core.warning('Could not post ChaosMender annotation: ' + err.message);
            }
