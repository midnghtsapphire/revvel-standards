name: Issue Lifecycle Automation
on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened
      - closed
      - reopened
permissions:
  pull-requests: read
  issues: write
  contents: read
jobs:
  on-issue-opened:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;

            // Skip if issue already has a type label (bug, enhancement, etc.)
            const existingLabels = issue.labels.map(l => l.name);
            const typeLabels = ['bug', 'enhancement', 'documentation', 'security', 'design', 'dependencies'];
            const hasType = existingLabels.some(l => typeLabels.includes(l));

            if (!hasType) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['triage'] });
            }
    timeout-minutes: 30
  on-pr-issue-link:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const body = pr.body || '';

            // Extract linked issue numbers from PR body (Closes #N, Fixes #N, Resolves #N)
            const closingPattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const linkedIssues = [];
            let match;
            while ((match = closingPattern.exec(body)) !== null) {
              linkedIssues.push(parseInt(match[1], 10));
            }

            if (linkedIssues.length === 0) return;

            for (const issueNumber of linkedIssues) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                if (issue.pull_request) continue; // skip if it's actually a PR

                if (action === 'opened' || action === 'reopened') {
                  // PR opened/reopened → issue is in progress
                  for (const label of ['triage', 'issue:stale', 'issue:done']) {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label })
                      .catch((err) => { if (err.status !== 404) throw err; });
                  }
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['issue:in-progress'] });

                } else if (action === 'closed' && pr.merged) {
                  // PR merged → issue is done, but only if it actually closed.
                  //
                  // This used to label unconditionally, and that made the label
                  // a lie whenever GitHub did not close the issue — a PR merged
                  // to a non-default branch, or a `Closes #N` that never
                  // registered. wr-pr-creation.yml then refused to open any
                  // further WR PR for it, so the issue was open, undelivered
                  // and unreachable (#17750).
                  //
                  // `issue:done` now means what it says: the issue is closed.
                  // If the state has not propagated yet, the label is simply
                  // not applied — a missing label is recoverable, a false one
                  // was not.
                  for (const label of ['triage', 'issue:in-progress', 'issue:stale', 'lifecycle:stuck']) {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label })
                      .catch((err) => { if (err.status !== 404) throw err; });
                  }
                  const { data: after } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                  if (after.state === 'closed') {
                    await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['issue:done'] });
                  } else {
                    core.warning(
                      `PR #${pr.number} merged claiming to close #${issueNumber}, but that issue is still open. ` +
                      'Not applying issue:done — the label would assert a delivery that did not happen.'
                    );
                  }

                } else if (action === 'closed' && !pr.merged) {
                  // PR closed without merge → only revert if no other open PRs link to this issue
                  const { data: openPRs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
                  const otherLinked = openPRs.some(p => {
                    if (p.number === pr.number) return false;
                    const b = p.body || '';
                    const re = new RegExp(`(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${issueNumber}\\b`, 'i');
                    return re.test(b);
                  });
                  if (!otherLinked) {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'issue:in-progress' })
                      .catch((err) => { if (err.status !== 404) throw err; });
                    await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['triage'] });
                  }
                }
              } catch(e) {
                core.warning(`Could not process issue #${issueNumber}: ${e.message}`);
              }
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
