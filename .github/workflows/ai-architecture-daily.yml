name: AI Architecture · Daily Market Eval

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run tests
        run: python products/ai-architecture-framework/tests/test_harness.py
      - name: Evaluate market (3 products)
        run: |
          mkdir -p artifacts
          python products/ai-architecture-framework/market_evaluator.py --count 3 --out artifacts/market.json
      - name: Upload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-manifest
          path: artifacts/market.json
