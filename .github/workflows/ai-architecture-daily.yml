name: AI Architecture Daily Market Evaluation

on:
  schedule:
    - cron: '0 13 * * *'  # 13:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Run tests
        run: |
          cd products/ai-architecture-framework
          python -m unittest tests/test_harness.py -v

      - name: Run market evaluator
        run: |
          cd products/ai-architecture-framework
          python market_evaluator.py

      - name: Upload report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: market-evaluator-report
          path: products/ai-architecture-framework/reports/*.json
          if-no-files-found: warn
