# Lint GitHub Actions workflow YAML with rethab/actions-lint@v1.0.0.
# Catches reusable-workflow input/secret mistakes, missing action versions,
# and parser-level YAML issues before they fail at runtime.
#
# Scope notes (WR-15860):
# - rethab/actions-lint accepts exactly one `files` path per invocation, so we
#   discover the file list and fan out via matrix.
# - Legacy workflows that trip the 2022 parser/rules (vars.* context, secrets
#   used outside workflow_call, etc.) live in .github/actions-lint-exclude.txt.
#   New workflow files must pass and must not be added to that exclude list.
# - Node 16 runtime is forced onto Node 24 via FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
#   (same pattern as trusted-bot-auto-approve / stuck-label-watchdog).
name: Actions Lint

on:
  # No `paths` filter on pull_request: the `actions-lint` gate job is meant to
  # be a required status check, and a path-filtered trigger would never report
  # on PRs that don't touch workflows — deadlocking their merges. The lint is
  # cheap; run it on every PR so the required check always reports.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actions-lint-exclude.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.list.outputs.files }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build lint matrix (respect exclude list)
        id: list
        shell: bash
        run: |
          set -euo pipefail

          EXCLUDE_FILE=".github/actions-lint-exclude.txt"
          declare -A EXCLUDE=()
          if [[ -f "$EXCLUDE_FILE" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              # Strip comments and whitespace.
              line="${line%%#*}"
              line="$(echo "$line" | xargs)"
              [[ -z "$line" ]] && continue
              EXCLUDE["$line"]=1
            done < "$EXCLUDE_FILE"
          fi

          files=()
          shopt -s nullglob
          for path in .github/workflows/*.yml .github/workflows/*.yaml; do
            base="$(basename "$path")"
            if [[ -n "${EXCLUDE[$base]+x}" ]]; then
              echo "exclude: $path"
              continue
            fi
            files+=("$path")
          done

          count="${#files[@]}"
          echo "Linting ${count} workflow file(s)."

          if [[ "$count" -eq 0 ]]; then
            echo "files=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No workflow files left to lint after excludes."
            exit 0
          fi

          # Compact JSON array for matrix.file
          json="["
          first=1
          for f in "${files[@]}"; do
            if [[ "$first" -eq 1 ]]; then
              first=0
            else
              json+=","
            fi
            json+="\"${f}\""
          done
          json+="]"

          {
            echo "files<<EOF"
            echo "$json"
            echo "EOF"
            echo "count=${count}"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint ${{ matrix.file }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # rethab/actions-lint@v1.0.0 ships a node16 action; force modern runtime.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        file: ${{ fromJson(needs.discover.outputs.files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify target exists
        shell: bash
        env:
          TARGET_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          if [[ ! -f "$TARGET_FILE" ]]; then
            echo "::error::Workflow file missing: $TARGET_FILE"
            exit 1
          fi
          echo "Linting $TARGET_FILE"

      - name: actions-lint
        # Pin to full commit SHA (CLAUDE.md gotcha #8 / supply-chain policy).
        # Tag v1.0.0 → c449a3994b36a467abb90c24a1c0d5c30b6db0d4
        uses: rethab/actions-lint@c449a3994b36a467abb90c24a1c0d5c30b6db0d4 # v1.0.0
        with:
          files: ${{ matrix.file }}

  # Gate job so branch protection can require a single stable check name
  # even though the matrix expands/contracts with the exclude list.
  actions-lint:
    name: actions-lint
    needs: [discover, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce lint outcome
        shell: bash
        run: |
          set -euo pipefail
          discover_count="${{ needs.discover.outputs.count }}"
          lint_result="${{ needs.lint.result }}"
          discover_result="${{ needs.discover.result }}"

          echo "discover=${discover_result} count=${discover_count} lint=${lint_result}"

          if [[ "$discover_result" != "success" ]]; then
            echo "::error::Discover job failed."
            exit 1
          fi

          # No files to lint (everything excluded) is a soft pass with warning
          # already emitted upstream — still green so empty matrices don't
          # wedge required checks.
          if [[ "${discover_count}" == "0" ]]; then
            echo "No files to lint; treating as success."
            exit 0
          fi

          if [[ "$lint_result" != "success" ]]; then
            echo "::error::One or more workflow files failed actions-lint."
            exit 1
          fi

          echo "All targeted workflow files passed actions-lint."
