# Lint GitHub Actions workflow YAML with actionlint (rhysd/actionlint).
#
# ── LINTER REPLACED 2026-08-19 (WR #17734) ───────────────────────────────────
# Previously rethab/actions-lint@v1.0.0, a 2022-era linter that had been
# failing on EVERY run on main for days while it was configured as a required
# check. Its failures were false positives, not defects. Two representative
# cases:
#
#   auto-branch-update.yml:44
#     Secret "AGENT_PR_TOKEN || secrets.GITHUB_TOKEN" is not declared
#     -> it parsed the whole `${{ secrets.A || secrets.B }}` expression as one
#        secret name; it does not understand the `||` fallback operator. That
#        fallback is the pattern CLAUDE.md gotcha #3 actually mandates.
#
#   bernstein-orchestrator.yml:101-104
#     Secret "ANTHROPIC_API_KEY" is not declared
#     -> it treats `secrets.*` in non-workflow_call workflows as undeclared,
#        a limitation the old exclude-list header documented in its own words.
#
# It also could not resolve `choice`-typed inputs (see #17644), which is why
# four attempts to route agent-dispatcher.yml through `env:` were blocked.
#
# To keep the gate green, 150 of 227 workflow files had been excluded from
# linting entirely — so the required check covered a third of the surface and
# still failed. actionlint parses all 227 and reports 14 genuine findings.
#
# Docs already named actionlint as the intended tool before this change:
# standards/CLI_MCP_AUTOMATION.md, docs/TEST_HARNESS_RESEARCH.md §4.2, and
# docs/AUTOMATION_AUDIT.md ("Fixing it needs the linter replaced").
#
# Scope note: shellcheck/pyflakes integration is deliberately disabled here so
# this gate covers workflow syntax, expressions and contexts. Shell linting is
# a separate concern (super-linter.yml, .pre-commit-hooks). This is strictly
# more coverage than the old gate, not less.
# ──────────────────────────────────────────────────────────────────────────────
name: Actions Lint

on:
  # No `paths` filter on pull_request: the `actions-lint` gate job is meant to
  # be a required status check, and a path-filtered trigger would never report
  # on PRs that don't touch workflows — deadlocking their merges. The lint is
  # cheap; run it on every PR so the required check always reports.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actions-lint-exclude.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the linter by version AND verify the download by checksum, so a
  # compromised or swapped release cannot silently execute here
  # (CLAUDE.md gotcha #8 — pin third-party tooling, not floating tags).
  ACTIONLINT_VERSION: "1.7.7"
  ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"

jobs:
  # Single stable job name so branch protection can require one check.
  # This replaces the previous discover + 200-way matrix + gate arrangement:
  # actionlint lints every file in one invocation, so the fan-out bought
  # nothing but ~215 check runs of noise on every pull request.
  actions-lint:
    name: actions-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint (pinned + checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"

          curl -fsSL --retry 3 --retry-delay 2 -o "$tarball" "$url"

          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -

          tar xzf "$tarball" actionlint
          chmod +x actionlint
          ./actionlint --version

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail

          EXCLUDE_FILE=".github/actions-lint-exclude.txt"
          declare -A EXCLUDE=()
          if [[ -f "$EXCLUDE_FILE" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"
              # Trim with parameter expansion, not `xargs`. xargs parses its
              # input as shell words: it strips quotes, eats backslashes, and
              # dies on an unmatched quote. A filename like `it's.yml` would
              # abort the whole read loop, silently emptying the exclude map.
              line="${line#"${line%%[![:space:]]*}"}"   # leading
              line="${line%"${line##*[![:space:]]}"}"   # trailing
              [[ -z "$line" ]] && continue
              EXCLUDE["$line"]=1
            done < "$EXCLUDE_FILE"
          fi

          files=()
          skipped=0
          shopt -s nullglob
          for path in .github/workflows/*.yml .github/workflows/*.yaml; do
            base="$(basename "$path")"
            if [[ -n "${EXCLUDE[$base]+x}" ]]; then
              skipped=$((skipped + 1))
              continue
            fi
            files+=("$path")
          done

          echo "Linting ${#files[@]} workflow file(s); ${skipped} on the known-issues ratchet."

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No workflow files left to lint — the ratchet has swallowed the gate."
            exit 1
          fi

          # Quote the array expansion (CLAUDE.md gotcha #5 / SC2128).
          ./actionlint -shellcheck= -pyflakes= "${files[@]}"

          echo "All linted workflow files passed actionlint."
