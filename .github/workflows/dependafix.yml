# DependaFix AI Remediation
#
# Automatically fixes breaking syntax changes introduced by Dependabot
# dependency upgrades. When a Dependabot PR build fails, this workflow
# captures build logs, uses the DependaFix agent (powered by Google
# Antigravity / Gemini) to analyze and patch deprecated syntax, then
# commits the fix back to the Dependabot branch.
#
# Security posture (deny-by-default):
#   - Only triggers on branches authored by dependabot[bot]
#   - Never runs on or writes directly to main / release branches
#   - File system access is workspace-constrained
#   - The patch must pass the repo's existing CI checks before merge
#
# See: https://github.com/harishrsk/breaking-change-remediation

name: DependaFix AI Remediation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  fix-build:
    name: DependaFix — auto-remediate breaking dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Only run on Dependabot PRs — never on human-authored branches
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Test Build
        id: build
        run: npm run build > error_log.txt 2>&1
        continue-on-error: true

      # If the build failed, trigger the self-healing agent
      - name: DependaFix AI Remediation
        if: steps.build.outcome == 'failure'
        uses: harishrsk/breaking-change-remediation@v1.0.0
        with:
          error-log: error_log.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Push Remediation Commit
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "fix(deps): auto-remediate breaking dependency changes"
            git push --force-with-lease
          fi
