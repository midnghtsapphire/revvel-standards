name: Proposal Prosecution
on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to prosecute'
        required: true
      issue_id:
        description: Issue number
        required: false

permissions:
  contents: read
  # issues: write is required because the prosecute job calls
  # github.rest.issues.createComment to post prosecution findings. This workflow only
  # triggers on `issues: labeled` (label == 'proposal') or workflow_dispatch with an
  # issue id, so the comment target is always an issue, never a PR — pull-requests:
  # write is not needed. Without issues: write, the comment post 403s silently.
  issues: write

jobs:
  prosecute:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'proposal')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Post prosecution findings
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number
              || parseInt(context.payload.inputs?.issue_number, 10);
            if (!issueNumber) {
              core.setFailed('No issue number available.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `## Proposal Prosecution`,
                ``,
                `Automated review filed by run ${context.runId}.`,
                `See: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
    if: |
      (github.event.label.name == 'proposal') ||
      (github.event.inputs.issue_id != '')
    runs-on: ubuntu-latest
    steps:
      - name: Run prosecution
        id: prosecute
        env:
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
        run: |
          echo "## Proposal Prosecution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running adversarial review..." >> $GITHUB_STEP_SUMMARY

          # This would call OpenRouter with Claude Sonnet
          echo "prosecution=$ISSUE_TITLE" >> $GITHUB_OUTPUT
      - name: Post findings
        if: steps.prosecute.outputs.prosecution != ''
        uses: actions/github-script@v9.0.0
        env:
          # For workflow_dispatch, context.issue.number is undefined — fall
          # back to the dispatch input. For issues events it comes from the
          # payload as normal.
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_id }}
        with:
          script: |
            const body = `## 🔍 Prosecution Findings
            \n
            Adversarial review complete.
            \n
            **Findings:** Review complete - see comments above.
            \n
            ---
            *Auto-generated by Proposal Prosecution*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: body
            });
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
