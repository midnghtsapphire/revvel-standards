name: Proposal Prosecution

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to prosecute'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  prosecute:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'proposal'
    runs-on: ubuntu-latest
    steps:
      - name: Post prosecution findings
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? parseInt(context.payload.inputs.issue_number, 10)
              : context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `**Prosecution findings**\n\nThis proposal is under automated review. Findings will be posted here.`,
            });
