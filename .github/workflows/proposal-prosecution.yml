name: Proposal Prosecution

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to prosecute'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  prosecute:
    if: github.event_name == 'workflow_dispatch' || (github.event.label && github.event.label.name == 'proposal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post prosecution findings
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? parseInt('${{ github.event.inputs.issue_number }}', 10)
              : context.payload.issue.number;
            if (!issueNumber) {
              core.setFailed('No issue number resolved');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## Proposal Prosecution\n\nAutomated review posted by run ${context.runId}.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
