name: Proposal Prosecution

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to prosecute'
        required: true

permissions:
  contents: read
  issues: write

jobs:
  prosecute:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'proposal')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Post prosecution findings
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number
              || parseInt(context.payload.inputs?.issue_number, 10);
            if (!issueNumber) {
              core.setFailed('No issue number available.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `## Proposal Prosecution`,
                ``,
                `Automated review filed by run ${context.runId}.`,
                `See: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
