name: Secret Persistence Guard
on:
  schedule:
    - cron: 0 * * * *
  workflow_dispatch:
    inputs:
      force_recovery:
        description: Force recovery attempt for all missing secrets
        type: boolean
        default: false
  repository_dispatch:
    types:
      - secret-delete
permissions:
  issues: write
  contents: write
jobs:
  protect-critical-secrets:
    name: Protect critical secrets from deletion
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'secret-delete'
    steps:
      - name: Check if secret is protected
        id: check
        env:
          SECRET_NAME: ${{ github.event.client_payload.secret_name }}
        run: |
          # List of critical secrets that should NEVER be deleted
          PROTECTED_SECRETS=(
            "OPENROUTER_API_KEY"
            "DOPPLER_TOKEN"
            "ADMIN_GITHUB_TOKEN"
            "GITHUB_TOKEN"
          )

          IS_PROTECTED=false
          for protected in "${PROTECTED_SECRETS[@]}"; do
            if [ "$SECRET_NAME" = "$protected" ]; then
              IS_PROTECTED=true
              break
            fi
          done

          echo "is_protected=$IS_PROTECTED" >> "$GITHUB_OUTPUT"
          echo "secret_name=$SECRET_NAME" >> "$GITHUB_OUTPUT"
      - name: Block deletion of protected secret
        if: steps.check.outputs.is_protected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_NAME: ${{ steps.check.outputs.secret_name }}
        run: |
          echo "::error::BLOCKED: Cannot delete protected secret: $SECRET_NAME"

          # Create alert issue
          ISSUE_BODY=$(cat <<EOF
          ## 🚨 PROTECTED SECRET DELETION ATTEMPT BLOCKED

          **Secret:** \`$SECRET_NAME\`
          **Action:** Deletion attempt
          **Status:** ❌ BLOCKED
          **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ### Why This Happened

          This secret is marked as **CRITICAL** and protected from deletion by the Secret Persistence Guard.

          Protected secrets include:
          - \`OPENROUTER_API_KEY\` — Core AI routing
          - \`DOPPLER_TOKEN\` — Secret management
          - \`ADMIN_GITHUB_TOKEN\` — Elevated permissions
          - \`GITHUB_TOKEN\` — GitHub API access

          ### Required Action

          If you need to delete this secret:
          1. Review why it's protected in \`.github/workflows/secret-persistence-guard.yml\`
          2. If deletion is truly necessary, remove it from the PROTECTED_SECRETS list
          3. Document the reason in this issue
          4. Get approval from @midnghtsapphire
          5. Re-attempt deletion

          **DO NOT delete protected secrets unless absolutely necessary.**

          ---
          _Blocked by Secret Persistence Guard_
          EOF
          )

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Blocked Protected Secret Deletion: $SECRET_NAME" \
            --body "$ISSUE_BODY" \
            --label "security,auto-error,needs-human" \
            --assignee "midnghtsapphire"

          exit 1
    timeout-minutes: 30
  monitor-secret-health:
    name: Monitor secret availability
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      missing_secrets: ${{ steps.check.outputs.missing_secrets }}
      has_missing: ${{ steps.check.outputs.has_missing }}
    steps:
      - name: Check all critical secrets
        id: check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
        run: |
          MISSING=()

          check_secret() {
            local name="$1"
            local value="${!name}"
            if [ -z "$value" ]; then
              MISSING+=("$name")
              echo "❌ $name: MISSING"
            else
              echo "✅ $name: Present"
            fi
          }

          echo "## Secret Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          check_secret "OPENROUTER_API_KEY"
          check_secret "JULES_API_KEY"
          check_secret "OPENAI_API_KEY"
          check_secret "ADMIN_GITHUB_TOKEN"
          check_secret "DOPPLER_TOKEN"
          check_secret "APP_ID"
          check_secret "APP_PRIVATE_KEY"
          check_secret "MABL_API_KEY"

          # Save missing secrets
          if [ ${#MISSING[@]} -gt 0 ]; then
            MISSING_JSON=$(printf '%s\n' "${MISSING[@]}" | jq -R . | jq -s .)
            echo "missing_secrets=$MISSING_JSON" >> "$GITHUB_OUTPUT"
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **${#MISSING[@]} secret(s) are missing**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "missing_secrets=[]" >> "$GITHUB_OUTPUT"
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **All critical secrets are present**" >> "$GITHUB_STEP_SUMMARY"
          fi
    timeout-minutes: 15
  auto-recover:
    name: Auto-recover missing secrets
    needs: monitor-secret-health
    runs-on: ubuntu-latest
    if: needs.monitor-secret-health.outputs.has_missing == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Attempt recovery from Doppler
        id: recover
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MISSING_SECRETS: ${{ needs.monitor-secret-health.outputs.missing_secrets }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::warning::None of DOPPLER_AGENT_TOKEN, DOPPLER_TOKEN, DOPPLER_LOCAL_TOKEN, DOPPLER_API_KEY, DOPPLER_AGENT_ODIC, or DOPPLER_CIRCLECI_OIDC is available - cannot auto-recover"
            echo "recovered=[]" >> "$GITHUB_OUTPUT"
            echo "failed=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RECOVERED=()
          FAILED=()

          # Parse missing secrets array
          SECRETS=$(echo "$MISSING_SECRETS" | jq -r '.[]')

          for SECRET_NAME in $SECRETS; do
            echo "Attempting to recover: $SECRET_NAME"
            
            # Try to fetch from Doppler
            VALUE=$(curl -s \
              -G "https://api.doppler.com/v3/configs/config/secret" \
              --data-urlencode "project=revvel-standards" \
              --data-urlencode "config=prd" \
              --data-urlencode "name=$SECRET_NAME" \
              -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
              | jq -r '.value.computed // empty')
            
            if [ -n "$VALUE" ]; then
              # Sync to GitHub
              if gh secret set "$SECRET_NAME" --body "$VALUE" --repo "${{ github.repository }}"; then
                echo "✅ Recovered: $SECRET_NAME"
                RECOVERED+=("$SECRET_NAME")
              else
                echo "❌ Failed to sync: $SECRET_NAME"
                FAILED+=("$SECRET_NAME")
              fi
            else
              echo "⚠️ Not in Doppler: $SECRET_NAME"
              FAILED+=("$SECRET_NAME")
            fi
          done

          RECOVERED_JSON=$(printf '%s\n' "${RECOVERED[@]}" | jq -R . | jq -s . || echo '[]')
          FAILED_JSON=$(printf '%s\n' "${FAILED[@]}" | jq -R . | jq -s . || echo '[]')

          echo "recovered=$RECOVERED_JSON" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED_JSON" >> "$GITHUB_OUTPUT"

          echo "## Recovery Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovered: ${#RECOVERED[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: ${#FAILED[@]}" >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 30
  escalate:
    name: Escalate unrecoverable secrets
    needs:
      - monitor-secret-health
      - auto-recover
    runs-on: ubuntu-latest
    if: always() && needs.auto-recover.outputs.failed != '[]'
    steps:
      - name: Create escalation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SECRETS: ${{ needs.auto-recover.outputs.failed }}
          RECOVERED_SECRETS: ${{ needs.auto-recover.outputs.recovered }}
        run: |
          FAILED_LIST=$(echo "$FAILED_SECRETS" | jq -r '.[]' | sed 's/^/- `/' | sed 's/$/`/')
          RECOVERED_LIST=$(echo "$RECOVERED_SECRETS" | jq -r '.[]' | sed 's/^/- `/' | sed 's/$/`/' || echo "- None")

          ISSUE_BODY=$(cat <<EOF
          ## 🚨 SECRET PERSISTENCE ALERT: Auto-Recovery Failed

          **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Workflow:** [Secret Persistence Guard](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Missing Secrets Detected

          The Secret Persistence Guard detected missing secrets and attempted automatic recovery.

          **Auto-recovered:**
          $RECOVERED_LIST

          **Still missing (MANUAL ACTION REQUIRED):**
          $FAILED_LIST

          ### Why Secrets Go Missing

          1. **Manual deletion** via GitHub UI or API
          2. **Doppler not synced** or DOPPLER_TOKEN expired
          3. **Secret rotation failure** left gap
          4. **Repository settings reset** (rare)

          ### Required Action

          For each missing secret:

          1. **Check Doppler:**
             \`\`\`bash
             doppler secrets get <SECRET_NAME> --project revvel-standards --config prd
             \`\`\`

          2. **If in Doppler, sync to GitHub:**
             \`\`\`bash
             gh secret set <SECRET_NAME> --repo midnghtsapphire/revvel-standards
             \`\`\`

          3. **If NOT in Doppler:**
             - Regenerate the secret at the provider (OpenRouter, Jules, etc.)
             - Add to Doppler: \`doppler secrets set <SECRET_NAME> --value "<value>"\`
             - Sync to GitHub: \`gh secret set <SECRET_NAME>\`

          4. **Update docs/SECRETS_MANAGEMENT.md** if secret requirements changed

          ### Prevention

          - ✅ Secret Persistence Guard now active (blocks critical deletions)
          - ✅ Hourly monitoring enabled
          - ✅ Auto-recovery from Doppler enabled
          - ✅ This issue auto-escalates on failure

          **Next check:** In 1 hour (every hour at :00)

          ---
          _Auto-escalated by Secret Persistence Guard_
          EOF
          )

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Secrets Missing: Manual Recovery Required" \
            --body "$ISSUE_BODY" \
            --label "security,needs-human,goap,priority-p0" \
            --assignee "midnghtsapphire"
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
