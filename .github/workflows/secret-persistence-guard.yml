name: Secret Persistence Guard
on:
  # Cron paused 2026-06-02 — was overwriting freshly-set tokens with
  # stale Doppler values (and filing "🚨 Secrets Missing" issues on
  # every false-positive). Re-enable ONLY after Doppler is confirmed
  # in sync with the current GitHub secret values, otherwise the
  # auto-recover loop rotates good tokens back to expired ones.
  # schedule:
  #   - cron: 0 * * * *
  workflow_dispatch:
    inputs:
      force_recovery:
        description: Force recovery attempt for all missing secrets
        type: boolean
        default: false
  repository_dispatch:
    types:
      - secret-delete
permissions:
  issues: write
  contents: write
jobs:
  protect-critical-secrets:
    name: Protect critical secrets from deletion
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'secret-delete'
    steps:
      - name: Check if secret is protected
        id: check
        env:
          SECRET_NAME: ${{ github.event.client_payload.secret_name }}
        run: |
          # List of critical secrets that should NEVER be deleted
          PROTECTED_SECRETS=(
            "OPENROUTER_API_KEY"
            "DOPPLER_TOKEN"
            "ADMIN_GITHUB_TOKEN"
            "GITHUB_TOKEN"
          )

          IS_PROTECTED=false
          for protected in "${PROTECTED_SECRETS[@]}"; do
            if [ "$SECRET_NAME" = "$protected" ]; then
              IS_PROTECTED=true
              break
            fi
          done

          echo "is_protected=$IS_PROTECTED" >> "$GITHUB_OUTPUT"
          echo "secret_name=$SECRET_NAME" >> "$GITHUB_OUTPUT"
      - name: Block deletion of protected secret
        if: steps.check.outputs.is_protected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_NAME: ${{ steps.check.outputs.secret_name }}
        run: |
          echo "::error::BLOCKED: Cannot delete protected secret: $SECRET_NAME"

          # Create alert issue
          ISSUE_BODY=$(cat <<EOF
          ## 🚨 PROTECTED SECRET DELETION ATTEMPT BLOCKED

          **Secret:** \`$SECRET_NAME\`
          **Action:** Deletion attempt
          **Status:** ❌ BLOCKED
          **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ### Why This Happened

          This secret is marked as **CRITICAL** and protected from deletion by the Secret Persistence Guard.

          Protected secrets include:
          - \`OPENROUTER_API_KEY\` — Core AI routing
          - \`DOPPLER_TOKEN\` — Secret management
          - \`ADMIN_GITHUB_TOKEN\` — Elevated permissions
          - \`GITHUB_TOKEN\` — GitHub API access

          ### Required Action

          If you need to delete this secret:
          1. Review why it's protected in \`.github/workflows/secret-persistence-guard.yml\`
          2. If deletion is truly necessary, remove it from the PROTECTED_SECRETS list
          3. Document the reason in this issue
          4. Get approval from @midnghtsapphire
          5. Re-attempt deletion

          **DO NOT delete protected secrets unless absolutely necessary.**

          ---
          _Blocked by Secret Persistence Guard_
          EOF
          )

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Blocked Protected Secret Deletion: $SECRET_NAME" \
            --body "$ISSUE_BODY" \
            --label "security,auto-error,needs-human" \
            --assignee "midnghtsapphire"

          exit 1
    timeout-minutes: 30
  monitor-secret-health:
    name: Monitor secret availability
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      missing_secrets: ${{ steps.check.outputs.missing_secrets }}
      has_missing: ${{ steps.check.outputs.has_missing }}
    steps:
      - name: Check all critical secrets
        id: check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          # MABL_API_KEY: ${{ secrets.MABL_API_KEY }}  # PAUSED 2026-05-27 with mabl.yml — uncomment to re-enable.
        run: |
          MISSING=()

          check_secret() {
            local name="$1"
            local value="${!name}"
            if [ -z "$value" ]; then
              MISSING+=("$name")
              echo "❌ $name: MISSING"
            else
              echo "✅ $name: Present"
            fi
          }

          echo "## Secret Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          check_secret "OPENROUTER_API_KEY"
          check_secret "JULES_API_KEY"
          check_secret "OPENAI_API_KEY"
          check_secret "ADMIN_GITHUB_TOKEN"
          check_secret "DOPPLER_TOKEN"
          check_secret "APP_ID"
          check_secret "APP_PRIVATE_KEY"
          # check_secret "MABL_API_KEY"  # PAUSED 2026-05-27 with mabl.yml — uncomment to re-enable.

          # Save missing secrets (compact single-line JSON to avoid $GITHUB_OUTPUT multiline issues)
          FORCE_RECOVERY="${{ github.event.inputs.force_recovery }}"
          if [ "$FORCE_RECOVERY" == "true" ]; then
            ALL_SECRETS=(
              "OPENROUTER_API_KEY"
              "JULES_API_KEY"
              "OPENAI_API_KEY"
              "ADMIN_GITHUB_TOKEN"
              "DOPPLER_TOKEN"
              "APP_ID"
              "APP_PRIVATE_KEY"
            )
            MISSING_JSON=$(printf '%s\n' "${ALL_SECRETS[@]}" | jq -R . | jq -sc .)
            echo "missing_secrets=$MISSING_JSON" >> "$GITHUB_OUTPUT"
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Force recovery requested: treating all ${#ALL_SECRETS[@]} secrets as missing**" >> "$GITHUB_STEP_SUMMARY"
          elif [ ${#MISSING[@]} -gt 0 ]; then
            MISSING_JSON=$(printf '%s\n' "${MISSING[@]}" | jq -R . | jq -sc .)
            echo "missing_secrets=$MISSING_JSON" >> "$GITHUB_OUTPUT"
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **${#MISSING[@]} secret(s) are missing**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "missing_secrets=[]" >> "$GITHUB_OUTPUT"
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **All critical secrets are present**" >> "$GITHUB_STEP_SUMMARY"
          fi
    timeout-minutes: 15
  auto-recover:
    name: Auto-recover missing secrets
    needs: monitor-secret-health
    runs-on: ubuntu-latest
    if: needs.monitor-secret-health.outputs.has_missing == 'true' || github.event.inputs.force_recovery == 'true'
    outputs:
      recovered: ${{ steps.recover.outputs.recovered }}
      failed: ${{ steps.recover.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - name: Attempt recovery from Doppler then GitHub backup harness
        id: recover
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AGENT_TOKEN || secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC || secrets.DOPPLER_CIRCLECI_OIDC }}
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MISSING_SECRETS: ${{ needs.monitor-secret-health.outputs.missing_secrets }}
          CREDENTIAL_BACKUP_JSON: ${{ secrets.CREDENTIAL_BACKUP_JSON }}
          CREDENTIAL_BACKUP_SOPS_FILE: ${{ vars.CREDENTIAL_BACKUP_SOPS_FILE }}
          CREDENTIAL_BACKUP_PASS_PREFIX: ${{ vars.CREDENTIAL_BACKUP_PASS_PREFIX }}
          CREDENTIAL_BACKUP_BW_PREFIX: ${{ vars.CREDENTIAL_BACKUP_BW_PREFIX }}
          BW_SESSION: ${{ secrets.BW_SESSION }}
          CREDENTIAL_BACKUP_1PASSWORD_TEMPLATE: ${{ vars.CREDENTIAL_BACKUP_1PASSWORD_TEMPLATE }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR || secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          RECOVERED=()
          FAILED=()

          # Parse missing secrets array (compact single-line JSON written by monitor job)
          SECRETS=$(echo "$MISSING_SECRETS" | jq -r '.[]')

          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "🔑 Attempting Doppler recovery..."
            for SECRET_NAME in $SECRETS; do
              echo "Attempting to recover from Doppler: $SECRET_NAME"

              VALUE=""
              if RESPONSE=$(curl -sS -w '\n%{http_code}' \
                -G "https://api.doppler.com/v3/configs/config/secret" \
                --data-urlencode "project=revvel-standards" \
                --data-urlencode "config=prd" \
                --data-urlencode "name=$SECRET_NAME" \
                -H "Authorization: Bearer ${DOPPLER_TOKEN}"); then
                HTTP_BODY=$(printf '%s' "$RESPONSE" | sed '$d')
                HTTP_STATUS=$(printf '%s' "$RESPONSE" | tail -n 1)

                if [ "$HTTP_STATUS" = "200" ]; then
                  if VALUE=$(printf '%s' "$HTTP_BODY" | jq -r '.value.computed // empty' 2>/dev/null); then
                    :
                  else
                    echo "⚠️ Doppler returned non-JSON or unexpected JSON for $SECRET_NAME; treating as missing"
                    VALUE=""
                  fi
                else
                  echo "⚠️ Doppler returned HTTP $HTTP_STATUS for $SECRET_NAME; treating as missing"
                fi
              else
                echo "⚠️ Doppler request failed for $SECRET_NAME; treating as missing"
              fi

              if [ -n "$VALUE" ]; then
                if gh secret set "$SECRET_NAME" --body "$VALUE" --repo "${{ github.repository }}"; then
                  echo "✅ Recovered from Doppler: $SECRET_NAME"
                  RECOVERED+=("$SECRET_NAME")
                else
                  echo "❌ Failed to sync to GitHub: $SECRET_NAME"
                  FAILED+=("$SECRET_NAME")
                fi
              else
                echo "⚠️ Not in Doppler: $SECRET_NAME"
                FAILED+=("$SECRET_NAME")
              fi
            done
          else
            echo "::warning::No Doppler token available — skipping Doppler recovery"
            for SECRET_NAME in $SECRETS; do
              FAILED+=("$SECRET_NAME")
            done
          fi

          # For secrets still missing, attempt recovery via credential backup harness
          # (supports CREDENTIAL_BACKUP_JSON and other GitHub-stored backup sources)
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "🔄 Attempting backup harness recovery for: ${FAILED[*]}"
            FAILED_CSV=$(IFS=','; echo "${FAILED[*]}")

            HARNESS_EXIT=0
            node scripts/credential-backup-harness.js \
              --secrets "$FAILED_CSV" \
              --repo "${{ github.repository }}" \
              --json > /tmp/harness-out.json 2>/tmp/harness-err.txt || HARNESS_EXIT=$?

            if [ -s /tmp/harness-err.txt ]; then
              echo "=== Harness stderr ==="
              cat /tmp/harness-err.txt
            fi

            if [ "$HARNESS_EXIT" -eq 0 ] && [ -s /tmp/harness-out.json ]; then
              cat /tmp/harness-out.json
              # Check which secrets were actually synced by the harness
              HARNESS_SYNCED=""
              if ! HARNESS_SYNCED=$(jq -r '.synced[]? // empty' /tmp/harness-out.json 2>/tmp/harness-jq.err); then
                echo "::warning::Failed to parse harness JSON output — check /tmp/harness-out.json"
                cat /tmp/harness-jq.err || true
              fi
              STILL_FAILED=()
              for SECRET_NAME in "${FAILED[@]}"; do
                if echo "$HARNESS_SYNCED" | grep -qx "$SECRET_NAME"; then
                  echo "✅ Recovered via backup harness: $SECRET_NAME"
                  RECOVERED+=("$SECRET_NAME")
                else
                  STILL_FAILED+=("$SECRET_NAME")
                fi
              done
              FAILED=("${STILL_FAILED[@]}")
            else
              echo "::warning::Credential backup harness did not recover any secrets (exit code: $HARNESS_EXIT)"
            fi
          fi

          # Compact single-line JSON to avoid $GITHUB_OUTPUT multiline issues
          RECOVERED_JSON=$([ ${#RECOVERED[@]} -gt 0 ] && printf '%s\n' "${RECOVERED[@]}" | jq -R . | jq -sc . || echo '[]')
          FAILED_JSON=$([ ${#FAILED[@]} -gt 0 ] && printf '%s\n' "${FAILED[@]}" | jq -R . | jq -sc . || echo '[]')

          echo "recovered=$RECOVERED_JSON" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED_JSON" >> "$GITHUB_OUTPUT"

          echo "## Recovery Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovered: ${#RECOVERED[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: ${#FAILED[@]}" >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 30
  escalate:
    name: Escalate unrecoverable secrets
    needs:
      - monitor-secret-health
      - auto-recover
    runs-on: ubuntu-latest
    if: always() && needs.auto-recover.result != 'skipped' && needs.auto-recover.outputs.failed != '[]'
    steps:
      - name: Check for existing open escalation issue
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "security,goap" \
            --search "Secrets Missing: Manual Recovery Required" \
            --limit 1 \
            --json number -q '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "::notice::Existing open issue #$EXISTING found — skipping duplicate creation"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update existing escalation issue
        if: steps.dedup.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SECRETS: ${{ needs.auto-recover.outputs.failed }}
          RECOVERED_SECRETS: ${{ needs.auto-recover.outputs.recovered }}
        run: |
          if [ -z "$FAILED_SECRETS" ] || [ "$FAILED_SECRETS" = "[]" ]; then
            echo "::notice::No failed secrets data — skipping issue update"
            exit 0
          fi
          FAILED_LIST=$(echo "$FAILED_SECRETS" | jq -r '.[]' | sed 's/^/- `/' | sed 's/$/`/')
          RECOVERED_LIST=$(echo "$RECOVERED_SECRETS" | jq -r '.[]' | sed 's/^/- `/' | sed 's/$/`/')
          [ -z "$RECOVERED_LIST" ] && RECOVERED_LIST="- None"

          gh issue comment "${{ steps.dedup.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body "## Recurrence — $(date -u +%Y-%m-%dT%H:%M:%SZ)

          **Workflow run:** [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          **Auto-recovered:**
          $RECOVERED_LIST

          **Still missing (MANUAL ACTION REQUIRED):**
          $FAILED_LIST

          _Updated by secret-persistence-guard.yml_"
      - name: Create escalation issue
        if: steps.dedup.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SECRETS: ${{ needs.auto-recover.outputs.failed }}
          RECOVERED_SECRETS: ${{ needs.auto-recover.outputs.recovered }}
        run: |
          if [ -z "$FAILED_SECRETS" ] || [ "$FAILED_SECRETS" = "[]" ]; then
            echo "::notice::No failed secrets data — skipping issue creation"
            exit 0
          fi
          FAILED_LIST=$(echo "$FAILED_SECRETS" | jq -r '.[]' | sed 's/^/- `/' | sed 's/$/`/')
          RECOVERED_LIST=$(echo "$RECOVERED_SECRETS" | jq -r '.[]' | sed 's/^/- `/' | sed 's/$/`/')
          [ -z "$RECOVERED_LIST" ] && RECOVERED_LIST="- None"

          ISSUE_BODY=$(cat <<EOF
          ## 🚨 SECRET PERSISTENCE ALERT: Auto-Recovery Failed

          **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Workflow:** [Secret Persistence Guard](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Missing Secrets Detected

          The Secret Persistence Guard detected missing secrets and attempted automatic recovery.

          **Auto-recovered:**
          $RECOVERED_LIST

          **Still missing (MANUAL ACTION REQUIRED):**
          $FAILED_LIST

          ### Why Secrets Go Missing

          1. **Manual deletion** via GitHub UI or API
          2. **Doppler not synced** or DOPPLER_TOKEN expired
          3. **Secret rotation failure** left gap
          4. **Repository settings reset** (rare)

          ### Required Action

          For each missing secret:

          1. **Check Doppler:**
             \`\`\`bash
             doppler secrets get <SECRET_NAME> --project revvel-standards --config prd
             \`\`\`

          2. **If in Doppler, sync to GitHub:**
             \`\`\`bash
             gh secret set <SECRET_NAME> --repo midnghtsapphire/revvel-standards
             \`\`\`

          3. **If Doppler is unavailable — use the GitHub backup harness:**
            \`\`\`bash
            # Option A: Set CREDENTIAL_BACKUP_JSON secret in GitHub and re-run:
            # Store a JSON object of key→value pairs as the CREDENTIAL_BACKUP_JSON secret,
            # then trigger the guard to auto-recover:
            gh workflow run secret-persistence-guard.yml --repo midnghtsapphire/revvel-standards

            # Option B: Set the secret directly from GitHub:
            gh secret set <SECRET_NAME> --repo midnghtsapphire/revvel-standards
            \`\`\`

          4. **If NOT in any backup source:**
            - Regenerate the secret at the provider (OpenRouter, Jules, etc.)
            - Add to Doppler: \`doppler secrets set <SECRET_NAME> --value "<value>"\`
            - Or add to the \`CREDENTIAL_BACKUP_JSON\` GitHub secret (JSON object)
            - Sync to GitHub: \`gh secret set <SECRET_NAME>\`

          5. **Update docs/SECRETS_MANAGEMENT.md** if secret requirements changed

          ### Prevention

          - ✅ Secret Persistence Guard now active (blocks critical deletions)
          - ⏸️ Hourly monitoring **paused** — run \`workflow_dispatch\` manually to re-check
          - ✅ Auto-recovery from Doppler + credential backup harness enabled
          - ✅ Fallback: set \`CREDENTIAL_BACKUP_JSON\` GitHub secret for Doppler-free recovery
          - ✅ This issue auto-escalates on failure

          **Next check:** Manual — run this workflow via \`workflow_dispatch\`

          ---
          _Auto-escalated by Secret Persistence Guard_
          EOF
          )

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Secrets Missing: Manual Recovery Required" \
            --body "$ISSUE_BODY" \
            --label "security,needs-human,goap,priority-p0" \
            --assignee "midnghtsapphire"
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
