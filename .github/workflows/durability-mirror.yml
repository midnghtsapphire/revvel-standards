name: durability-mirror
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: 0 2 * * 0
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build repository archive
        run: |
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          tar -czf "revvel-standards-${ts}.tar.gz" .
          sha256sum "revvel-standards-${ts}.tar.gz" > mirror-checksum.txt
          ls -lah "revvel-standards-${ts}.tar.gz" mirror-checksum.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: durability-mirror
          path: |
            revvel-standards-*.tar.gz
            mirror-checksum.txt
          retention-days: 90
      - name: Optional gist mirror
        env:
          GH_TOKEN: ${{ secrets.MIRROR_GIST_TOKEN }}
          MIRROR_GIST_ID: ${{ secrets.MIRROR_GIST_ID }}
        run: |
          # `secrets` context is not allowed in step `if:` (it invalidates the
          # whole workflow file), so guard in-shell instead.
          if [ -z "$GH_TOKEN" ]; then
            echo "MIRROR_GIST_TOKEN missing; skipping gist sync"
            exit 0
          fi
          if [ -z "$MIRROR_GIST_ID" ]; then
            echo "MIRROR_GIST_ID missing; skipping gist sync"
            exit 0
          fi
          stamp="$(date -u +%F)"
          summary="Durability mirror created ${stamp} UTC"
          checksum="$(cat mirror-checksum.txt)"
          gh api --method PATCH "/gists/${MIRROR_GIST_ID}" \
            -f "description=Revvel durability mirror ${stamp}" \
            -f "files[mirror-status.md][content]=${summary}\n\n${checksum}"
      - name: Optional S3 upload
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Same in-shell guard pattern: `secrets` is not usable in step `if:`.
          if [ -z "$S3_BUCKET" ]; then
            echo "S3_BUCKET not configured; skipping S3 upload"
            exit 0
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "aws CLI not available; skipping S3 upload"
            exit 0
          fi
          file="$(find . -maxdepth 1 -name 'revvel-standards-*.tar.gz' -print | head -n1)"
          aws s3 cp "$file" "s3://${S3_BUCKET}/${file}"
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
