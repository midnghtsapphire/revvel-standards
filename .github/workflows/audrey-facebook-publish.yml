name: Audrey Facebook publication

on:
  repository_dispatch:
    types: [audrey-publication-ready]
  workflow_dispatch:
    inputs:
      draft_comment_id:
        description: Signed Facebook draft comment ID; review exact message before approval
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

# Serializes publishers to protect the persistent pending/receipt ledger.
# 2026-11-14: actionlint 1.7.7 compatibility: one running/one pending run;
# newer pending runs may replace older ones. Drafts stay in PR comments and
# require manual workflow_dispatch requeue. This is NOT a lossless queue.
# Standalone newer-platform alternative retained as history (inactive here):
# Queue up to 100 pending runs; over-capacity drafts remain in their PRs and
# can be resumed with workflow_dispatch. This is a bounded, not lossless queue.
concurrency:
  group: audrey-facebook-${{ github.repository }}
  # 2026-11-14 alternative only after a separately approved lint/platform update:
  # queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.ENABLE_AUDREY_BRIDGE == 'true' && vars.FACEBOOK_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      draft_id: ${{ steps.payload.outputs.draft_id }}
      approval_digest: ${{ steps.payload.outputs.approval_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prepare exact message and destination for review
        id: payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          GITAR_LOGINS: ${{ vars.GITAR_LOGINS || 'gitar-bot[bot],gitar-bot' }}
          INPUT_DRAFT_ID: ${{ inputs.draft_comment_id || github.event.client_payload.draft_comment_id }}
        run: |
          python3 scripts/audrey-gitar-bridge/audrey_bridge.py prepare --draft-id "$INPUT_DRAFT_ID" --output publication.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('publication.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('draft_id=' + str(int(payload['draft_comment_id'])) + '\n')
              f.write('approval_digest=' + payload['approval_digest'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Exact Facebook publication payload\n\n')
              f.write('Read the JSON message and numeric Page ID below, then approve or reject the protected `facebook-publication` job.\n\n')
              f.write('```json\n' + json.dumps(payload, ensure_ascii=False, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audrey-publication-payload
          path: publication.json
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED SETUP: configure this environment with required reviewers,
    # prevent self-review where available, and put the Page token only here.
    # Merely naming an environment does NOT create an approval protection rule.
    environment: facebook-publication
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish only the approved unchanged summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          APPROVED_FACEBOOK_PAGE_ID: ${{ vars.APPROVED_FACEBOOK_PAGE_ID }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PUBLISH_ENABLED: ${{ vars.FACEBOOK_PUBLISH_ENABLED }}
          GITAR_LOGINS: ${{ vars.GITAR_LOGINS || 'gitar-bot[bot],gitar-bot' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRAFT_ID: ${{ needs.prepare.outputs.draft_id }}
          APPROVAL_DIGEST: ${{ needs.prepare.outputs.approval_digest }}
        run: python3 scripts/audrey-gitar-bridge/audrey_bridge.py --apply publish --draft-id "$DRAFT_ID" --approval-digest "$APPROVAL_DIGEST"
