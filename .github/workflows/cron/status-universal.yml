# Universal Status Monitor - Apply to ALL repos
# Add as reusable workflow or copy to each repo

name: Universal Status Monitor

on:
  schedule:
    # Run every hour - customize per repo
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Sites to check (comma-separated)'
        required: false
        default: ''
      create_issue:
        description: 'Create issue on failure?'
        required: false
        default: 'true'

jobs:
  check-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check sites
        id: check
        env:
          TARGETS: ${{ github.event.inputs.targets || 'SITES' }}
        shell: bash
        run: |
          # Default sites per repo - customize in each repo
          DEFAULT_SITES="
            meetaudreyevans.com,https://meetaudreyevans.com
            github-pages,https://midnghtsapphire.github.io/${{ github.event.repository.name }}/
          "
          
          SITES="${TARGETS:-$DEFAULT_SITES}"
          FAILED=""
          
          while IFS=',' read -r name url; do
            [ -z "$name" ] && continue
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            if [ "$status" != "200" ] && [ "$status" != "301" ]; then
              FAILED="$FAILED| $name ($url): HTTP $status"
            fi
          done <<< "$SITES"
          
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "results=$SITES" >> $GITHUB_OUTPUT
      
      - name: Create Issue on Failure
        if: env.failed != '' && github.event.inputs.create_issue != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ⚠️ Status Alert
            \n
            ${{ env.failed }}
            \n
            **Time:** ${new Date().toISOString()}
            **Repo:** ${{ github.repository }}
            \n
            ---
            *Auto-generated by Universal Status Monitor*`;
            
            github.rest.createIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[AUTO] Status Alert',
              body: body,
              labels: ['status', 'automated', 'monitor']
            })
      
      - name: Summary
        run: |
          echo "## Status Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.failed }}" ]; then
            echo "⚠️ Issues found:" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.failed }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All systems operational" >> $GITHUB_STEP_SUMMARY
          fi
