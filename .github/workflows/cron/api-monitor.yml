# API Monitor - Checks API endpoints

name: API Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 min
  workflow_dispatch:

# Least privilege: external HTTP probes only; no repo contents or write APIs.
permissions:
  contents: read

jobs:
  check-apis:
    runs-on: ubuntu-latest
    steps:
      - name: Check APIs
        run: |
          APIs="
            https://api.github.com
            https://openrouter.ai/api/v1
          "
          
          FAILED=""
          for url in $APIs; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            if [ "$status" = "000" ]; then
              FAILED="${FAILED}"$'\n'"- $url: TIMEOUT"
            fi
          done
          
          if [ -n "$FAILED" ]; then
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
          fi
      
      - name: Report
        run: echo "API check complete"
