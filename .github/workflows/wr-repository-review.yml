name: WR Repository Review Automation

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository name to create WR for'
        required: true
        type: string
      mode:
        description: 'Generation mode'
        required: false
        type: choice
        default: 'single'
        options:
          - single
          - p0
          - p1
          - all

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-wr-issue:
    name: Detect WR Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && contains(github.event.issue.title, '[WR]')
    outputs:
      should_process: ${{ steps.check.outputs.should_process }}
    steps:
      - name: Check if WR issue
        id: check
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$ISSUE_TITLE" =~ ^\[WR\] ]]; then
            echo "should_process=true" >> $GITHUB_OUTPUT
          else
            echo "should_process=false" >> $GITHUB_OUTPUT
          fi

      - name: Label WR issue
        if: steps.check.outputs.should_process == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['weekly-research', 'wr:in-progress', 'deep-research']
            });

      - name: Post WR welcome comment
        if: steps.check.outputs.should_process == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🔍 Weekly Research (WR) Initiated
            
            This issue has been identified as a Weekly Research task and will follow the comprehensive review process defined in \`/docs/WEEKLY_RESEARCH_PROCESS.md\`.
            
            ### Research Checklist
            
            - [ ] **Repository Discovery** - Analyze current state
            - [ ] **Deep Web Research** - Market analysis & opportunities
            - [ ] **revvel-standards Requirements** - Apply AGENTS.md principles
            - [ ] **Redevelopment & Redesign** - Fix errors, enhance features
            - [ ] **Deployment Verification** - Vercel deployment & UI testing
            - [ ] **Documentation** - Add TEST and Deployment sections
            - [ ] **Findings & Recommendations** - Complete WR document
            
            ### Automation Status
            
            - [x] Labels applied: \`weekly-research\`, \`wr:in-progress\`, \`deep-research\`
            - [ ] WR generation in progress
            - [ ] Research findings will be posted here
            - [ ] Implementation tasks will be created
            
            ---
            
            **Tracked in:** [WR_TRACKER.md](/wr/WR_TRACKER.md)  
            **Template:** [WR_TEMPLATE.md](/wr/WR_TEMPLATE.md)  
            **Process:** [WEEKLY_RESEARCH_PROCESS.md](/docs/WEEKLY_RESEARCH_PROCESS.md)
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  generate-wr:
    name: Generate WR Document
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.title, '[WR]'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Determine repositories to process
        id: repos
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_MODE: ${{ inputs.mode }}
          WORKFLOW_REPO: ${{ inputs.repository }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            MODE="$WORKFLOW_MODE"
            REPO="$WORKFLOW_REPO"
            
            case "$MODE" in
              "single")
                echo "repos=$REPO" >> $GITHUB_OUTPUT
                ;;
              "p0")
                echo "repos=neurooz affiliate-marketing-system WEBSITE-FACTORY-API WEBSITE-FACTORY-GENERATOR premolt" >> $GITHUB_OUTPUT
                ;;
              "p1")
                echo "repos=Meetaudreyevans code-review-mcp-server Lifehub MCP-AUTH MCP-AFFILIATE" >> $GITHUB_OUTPUT
                ;;
              "all")
                echo "Processing all repos not yet supported in workflow"
                exit 1
                ;;
            esac
          else
            # Extract repo name from issue title - using environment variable to prevent code injection
            REPO=$(echo "$ISSUE_TITLE" | sed -n 's/.*\[WR\].*\[\([^]]*\)\].*/\1/p' | tr -d ' ')
            if [[ -z "$REPO" ]]; then
              echo "Could not extract repository name from issue title"
              echo "repos=" >> $GITHUB_OUTPUT
            else
              echo "repos=$REPO" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate WRs
        env:
          REPOS_TO_PROCESS: ${{ steps.repos.outputs.repos }}
        run: |
          if [[ -z "$REPOS_TO_PROCESS" ]]; then
            echo "No repositories to process"
            exit 0
          fi
          
          cd wr/scripts
          chmod +x *.sh
          
          for repo in $REPOS_TO_PROCESS; do
            echo "Generating WR for: $repo"
            echo "y" | bash generate-wr.sh "$repo" || echo "Failed to generate WR for $repo"
          done

      - name: Update WR Tracker
        run: |
          cd wr/scripts
          bash update-tracker.sh

      - name: Create Pull Request
        env:
          REPOS_PROCESSED: ${{ steps.repos.outputs.repos }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs: Generate WRs for repository review
            
            - Generated WR documents following revvel-standards
            - Updated WR_TRACKER.md with current status
            - Ready for review and implementation
          branch: wr-generation-${{ github.run_number }}
          title: 'docs: Weekly Research (WR) - Repository Reviews'
          body: |
            ## WR Generation Summary
            
            This PR contains newly generated Weekly Research (WR) documents for midnghtsapphire repositories.
            
            ### Repositories Processed
            
            ${{ env.REPOS_PROCESSED }}
            
            ### What's Included
            
            - 📋 WR documents in `/wr/repos/`
            - 📊 Updated `WR_TRACKER.md` with current statistics
            - ✅ Following revvel-standards WR template
            
            ### Next Steps
            
            1. Review WR findings and recommendations
            2. Create implementation issues for P0/P1 actions
            3. Deploy repositories to Vercel as recommended
            4. Implement monetization strategies
            
            ### Related
            
            - Template: `/wr/WR_TEMPLATE.md`
            - Tracker: `/wr/WR_TRACKER.md`
            - Process: `/docs/WEEKLY_RESEARCH_PROCESS.md`
            
            ---
            
            **Generated by:** WR Repository Review Automation  
            **Run:** ${{ github.run_number }}  
            **Date:** ${{ github.event.repository.updated_at || github.event.repository.pushed_at }}

          labels: |
            weekly-research
            documentation
            wr:complete
          assignees: midnghtsapphire

      - name: Post completion comment
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ WR generation complete! A pull request with the findings will be created shortly.'
            });
            
            // Update labels
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'wr:in-progress'
            }).catch(() => {});
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['wr:complete']
            });
