name: Markdown Lint Advisory

# Formatting must never push surprise commits into a contributor's branch.
# This workflow is now manual and read-only. It reports what would change;
# maintainers may then run `npm run lint:fix` deliberately in a dedicated PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-lint-advisory
  cancel-in-progress: true

jobs:
  check:
    name: Check Markdown without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Markdown lint
        run: npm run lint

      - name: Explain remediation
        if: failure()
        run: |
          {
            echo "## Markdown lint findings"
            echo
            echo "This workflow is advisory and does not rewrite branches."
            echo "Create a dedicated formatting PR and run:"
            echo
            echo '```bash'
            echo 'npm ci'
            echo 'npm run lint:fix'
            echo 'npm run verify'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
