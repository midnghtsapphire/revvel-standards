# WR DISPATCHER — routes labeled issues to the right agent backend.
# Docs: standards/WR_DISPATCHER.md (read this before editing).
name: wr-dispatcher

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to dispatch"
        required: true
        type: number
      route:
        description: "Force a route (leave empty to auto-detect from labels)"
        required: false
        type: choice
        options: ["", "manus", "roo"]

permissions:
  issues: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch WR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          FORCED_ROUTE: ${{ inputs.route }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          REPO: ${{ github.repository }}
        run: node scripts/wr_dispatch.mjs
