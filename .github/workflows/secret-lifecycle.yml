name: Secret Lifecycle Manager

on:
  repository_dispatch:
    types:
      - secret-create
      - secret-rotate
      - secret-delete

jobs:
  manage-secret:
    name: Manage Doppler Secret
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Validate payload
        id: validate
        run: |
          ACTION="${{ github.event.action }}"
          SECRET_NAME="${{ github.event.client_payload.secret_name }}"
          PROJECT="${{ github.event.client_payload.project }}"
          CONFIG="${{ github.event.client_payload.config }}"
          ISSUE_NUMBER="${{ github.event.client_payload.issue_number }}"

          if [ -z "$SECRET_NAME" ]; then
            echo "::error::secret_name is required in client_payload"
            exit 1
          fi

          if [ "$ACTION" = "secret-create" ] || [ "$ACTION" = "secret-rotate" ]; then
            SECRET_VALUE="${{ github.event.client_payload.secret_value }}"
            if [ -z "$SECRET_VALUE" ]; then
              echo "::error::secret_value is required for ${ACTION}"
              exit 1
            fi
          fi

          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"
          echo "secret_name=${SECRET_NAME}" >> "$GITHUB_OUTPUT"
          echo "project=${PROJECT:-revvel-standards}" >> "$GITHUB_OUTPUT"
          echo "config=${CONFIG:-prd}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create secret
        if: github.event.action == 'secret-create'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SECRET_VALUE: ${{ github.event.client_payload.secret_value }}
        run: |
          PROJECT="${{ steps.validate.outputs.project }}"
          CONFIG="${{ steps.validate.outputs.config }}"
          SECRET_NAME="${{ steps.validate.outputs.secret_name }}"

          PAYLOAD=$(jq -n --arg name "$SECRET_NAME" --arg value "$SECRET_VALUE" \
            '{"name": $name, "value": $value}')

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "https://api.doppler.com/v3/projects/${PROJECT}/configs/${CONFIG}/secrets" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 30)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Doppler API returned HTTP ${HTTP_CODE}: $(cat "$RESPONSE_FILE")"
            exit 1
          fi
          echo "Secret created successfully (HTTP ${HTTP_CODE})"

      - name: Rotate secret
        if: github.event.action == 'secret-rotate'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SECRET_VALUE: ${{ github.event.client_payload.secret_value }}
        run: |
          PROJECT="${{ steps.validate.outputs.project }}"
          CONFIG="${{ steps.validate.outputs.config }}"
          SECRET_NAME="${{ steps.validate.outputs.secret_name }}"

          PAYLOAD=$(jq -n --arg name "$SECRET_NAME" --arg value "$SECRET_VALUE" \
            '{"name": $name, "value": $value}')

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "https://api.doppler.com/v3/projects/${PROJECT}/configs/${CONFIG}/secrets" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 30)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Doppler API returned HTTP ${HTTP_CODE}: $(cat "$RESPONSE_FILE")"
            exit 1
          fi
          echo "Secret rotated successfully (HTTP ${HTTP_CODE})"

      - name: Delete secret
        if: github.event.action == 'secret-delete'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          PROJECT="${{ steps.validate.outputs.project }}"
          CONFIG="${{ steps.validate.outputs.config }}"
          SECRET_NAME="${{ steps.validate.outputs.secret_name }}"

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X DELETE "https://api.doppler.com/v3/projects/${PROJECT}/configs/${CONFIG}/secrets/${SECRET_NAME}" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            --max-time 30)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Doppler API returned HTTP ${HTTP_CODE}: $(cat "$RESPONSE_FILE")"
            exit 1
          fi
          echo "Secret deleted successfully (HTTP ${HTTP_CODE})"

      - name: Notify GitHub issue
        if: steps.validate.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTION="${{ steps.validate.outputs.action }}"
          SECRET_NAME="${{ steps.validate.outputs.secret_name }}"
          PROJECT="${{ steps.validate.outputs.project }}"
          CONFIG="${{ steps.validate.outputs.config }}"
          ISSUE_NUMBER="${{ steps.validate.outputs.issue_number }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY=$(printf '## Secret Lifecycle Update\n\n**Action:** `%s`\n**Secret:** `%s`\n**Project:** `%s`\n**Config:** `%s`\n**Status:** :white_check_mark: Success\n**Run:** [View workflow run](%s)' \
            "${ACTION}" "${SECRET_NAME}" "${PROJECT}" "${CONFIG}" "${RUN_URL}")

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="${BODY}"