---
name: Secret Lifecycle Manager

on:
  repository_dispatch:
    types:
      - secret-create
      - secret-rotate
      - secret-delete

jobs:
  manage-secret:
    name: Manage Doppler Secret
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Validate payload
        id: validate
        env:
          ACTION: ${{ github.event.action }}
          SECRET_NAME: ${{ github.event.client_payload.secret_name }}
          PROJECT: ${{ github.event.client_payload.project }}
          CONFIG: ${{ github.event.client_payload.config }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
        run: |
          if [ -z "$SECRET_NAME" ]; then
            echo "::error::secret_name is required in client_payload"
            exit 1
          fi

          if ! echo "$SECRET_NAME" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$'; then
            echo "::error::secret_name contains invalid characters"
            exit 1
          fi

          if [ -n "$PROJECT" ] && ! echo "$PROJECT" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "::error::project contains invalid characters"
            exit 1
          fi

          if [ -n "$CONFIG" ] && ! echo "$CONFIG" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "::error::config contains invalid characters"
            exit 1
          fi

          if [ -n "$ISSUE_NUMBER" ] && ! echo "$ISSUE_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::issue_number must be a positive integer"
            exit 1
          fi

          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"
          echo "secret_name=${SECRET_NAME}" >> "$GITHUB_OUTPUT"
          echo "project=${PROJECT:-revvel-standards}" >> "$GITHUB_OUTPUT"
          echo "config=${CONFIG:-prd}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create secret
        if: github.event.action == 'secret-create'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SECRET_VALUE: ${{ github.event.client_payload.secret_value }}
          SECRET_NAME: ${{ steps.validate.outputs.secret_name }}
          PROJECT: ${{ steps.validate.outputs.project }}
          CONFIG: ${{ steps.validate.outputs.config }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "::error::secret_value is required for secret-create"
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg project "$PROJECT" \
            --arg config "$CONFIG" \
            --arg name "$SECRET_NAME" \
            --arg value "$SECRET_VALUE" \
            '{"project": $project, "config": $config, "secrets": {($name): $value}}')

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "https://api.doppler.com/v3/configs/config/secrets" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 30)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            ERROR_MSG=$(jq -r \
              '.messages // .message // "Unknown error"' \
              "$RESPONSE_FILE" 2>/dev/null || echo "Unknown error")
            echo "::error::Doppler API error HTTP ${HTTP_CODE}: ${ERROR_MSG}"
            exit 1
          fi
          echo "Secret created successfully (HTTP ${HTTP_CODE})"

      - name: Rotate secret
        if: github.event.action == 'secret-rotate'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SECRET_VALUE: ${{ github.event.client_payload.secret_value }}
          SECRET_NAME: ${{ steps.validate.outputs.secret_name }}
          PROJECT: ${{ steps.validate.outputs.project }}
          CONFIG: ${{ steps.validate.outputs.config }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "::error::secret_value is required for secret-rotate"
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg project "$PROJECT" \
            --arg config "$CONFIG" \
            --arg name "$SECRET_NAME" \
            --arg value "$SECRET_VALUE" \
            '{"project": $project, "config": $config, "secrets": {($name): $value}}')

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "https://api.doppler.com/v3/configs/config/secrets" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 30)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            ERROR_MSG=$(jq -r \
              '.messages // .message // "Unknown error"' \
              "$RESPONSE_FILE" 2>/dev/null || echo "Unknown error")
            echo "::error::Doppler API error HTTP ${HTTP_CODE}: ${ERROR_MSG}"
            exit 1
          fi
          echo "Secret rotated successfully (HTTP ${HTTP_CODE})"

      - name: Delete secret
        if: github.event.action == 'secret-delete'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SECRET_NAME: ${{ steps.validate.outputs.secret_name }}
          PROJECT: ${{ steps.validate.outputs.project }}
          CONFIG: ${{ steps.validate.outputs.config }}
        run: |
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X DELETE -G "https://api.doppler.com/v3/configs/config/secret" \
            --data-urlencode "project=${PROJECT}" \
            --data-urlencode "config=${CONFIG}" \
            --data-urlencode "name=${SECRET_NAME}" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            --max-time 30)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            ERROR_MSG=$(jq -r \
              '.messages // .message // "Unknown error"' \
              "$RESPONSE_FILE" 2>/dev/null || echo "Unknown error")
            echo "::error::Doppler API error HTTP ${HTTP_CODE}: ${ERROR_MSG}"
            exit 1
          fi
          echo "Secret deleted successfully (HTTP ${HTTP_CODE})"

      - name: Notify GitHub issue
        if: steps.validate.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ steps.validate.outputs.action }}
          SECRET_NAME: ${{ steps.validate.outputs.secret_name }}
          PROJECT: ${{ steps.validate.outputs.project }}
          CONFIG: ${{ steps.validate.outputs.config }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n%s' \
            '## Secret Lifecycle Update' \
            "**Action:** \`${ACTION}\`" \
            "**Secret:** \`${SECRET_NAME}\`" \
            "**Project:** \`${PROJECT}\`" \
            "**Config:** \`${CONFIG}\`" \
            '**Status:** :white_check_mark: Success' \
            "**Run:** [View workflow run](${RUN_URL})") #
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -f body="${BODY}"
