{
  "name": "Secret Lifecycle Manager",
  "nodes": [
    {
      "parameters": {
        "httpMethod": "POST",
        "path": "secret-request",
        "responseMode": "onReceived",
        "options": {}
      },
      "id": "webhook-trigger",
      "name": "Webhook Trigger",
      "type": "n8n-nodes-base.webhook",
      "typeVersion": 1,
      "position": [250, 300]
    },
    {
      "parameters": {
        "operation": "switch",
        "data1": "={{ $json.action }}",
        "data2": "",
        "dataType": "string",
        "rules": {
          "rules": [
            {
              "value2": "create",
              "operation": "equals"
            },
            {
              "value2": "rotate",
              "operation": "equals"
            },
            {
              "value2": "delete",
              "operation": "equals"
            }
          ]
        },
        "fallbackOutput": "keep"
      },
      "id": "action-router",
      "name": "Route by Action",
      "type": "n8n-nodes-base.switch",
      "typeVersion": 1,
      "position": [450, 300]
    },
    {
      "parameters": {
        "url": "https://api.doppler.com/v3/projects/{{ $json.project }}/configs/{{ $json.config }}/secrets",
        "method": "POST",
        "sendBody": true,
        "bodyParameters": {
          "parameters": [
            {
              "name": "name",
              "value": "={{ $json.secret_name }}"
            },
            {
              "name": "value",
              "value": "={{ $json.secret_value }}"
            }
          ]
        },
        "options": {
          "timeout": 30000
        },
        "authentication": "genericCredentialType",
        "genericAuthType": "httpHeaderAuth"
      },
      "id": "doppler-create",
      "name": "Create Secret",
      "type": "n8n-nodes-base.httpRequest",
      "typeVersion": 3,
      "position": [650, 150]
    },
    {
      "parameters": {
        "url": "https://api.doppler.com/v3/projects/{{ $json.project }}/configs/{{ $json.config }}/secrets/{{ $json.secret_name }}",
        "method": "DELETE",
        "options": {
          "timeout": 30000
        },
        "authentication": "genericCredentialType",
        "genericAuthType": "httpHeaderAuth"
      },
      "id": "doppler-delete",
      "name": "Delete Secret",
      "type": "n8n-nodes-base.httpRequest",
      "typeVersion": 3,
      "position": [650, 450]
    },
    {
      "parameters": {
        "url": "https://api.github.com/repos/midnghtsapphire/revvel-standards/issues/{{ $json.issue_number }}/comments",
        "method": "POST",
        "sendBody": true,
        "bodyParameters": {
          "parameters": [
            {
              "name": "body",
              "value": "## Secret Management\n\n**Action:** {{ $json.action }}\n**Secret:** {{ $json.secret_name }}\n**Status:** {{ $json.status }}"
            }
          ]
        },
        "options": {},
        "authentication": "genericCredentialType",
        "genericAuthType": "httpHeaderAuth"
      },
      "id": "github-comment",
      "name": "Notify GitHub",
      "type": "n8n-nodes-base.httpRequest",
      "typeVersion": 3,
      "position": [850, 300]
    }
  ],
  "connections": {
    "Webhook Trigger": {
      "main": [[{"node": "Route by Action", "type": "main", "index": 0}]]
    },
    "Route by Action": {
      "main": [
        [{"node": "Create Secret", "type": "main", "index": 0}],
        [{"node": "Create Secret", "type": "main", "index": 0}],
        [{"node": "Delete Secret", "type": "main", "index": 0}]
      ]
    },
    "Create Secret": {
      "main": [[{"node": "Notify GitHub", "type": "main", "index": 0}]]
    },
    "Delete Secret": {
      "main": [[{"node": "Notify GitHub", "type": "main", "index": 0}]]
    }
  }
}