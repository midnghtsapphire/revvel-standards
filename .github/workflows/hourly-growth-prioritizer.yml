# Hourly Star Growth & Prioritization Engine
# Runs prioritize_and_optimize.py to refresh PRIORITIZED_STARS.md.
# Topic mutation is opt-in via ENABLE_TOPIC_UPDATES (default false).

name: Hourly Star Growth & Prioritization Engine

on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   # Every hour on the hour
  #   - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-star-growth
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-growth-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prefer PAT when present so scheduled commits can land reliably
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # Deliberate: the "Commit Updated Index & Optimizations" step below
          # uses stefanzweifel/git-auto-commit-action, which pushes with the
          # credentials checkout persists. Setting this false would silently
          # stop the hourly commits. Accepted rather than fixed — flagged by
          # zizmor as credential persistence, and true here by necessity.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Execute Hourly Engine
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Opt-in topic writes — leave false unless GH_PAT can admin topics safely
          ENABLE_TOPIC_UPDATES: ${{ vars.ENABLE_TOPIC_UPDATES || 'false' }}
          STAR_MAGNET_TOPIC_SCOPE: ${{ vars.STAR_MAGNET_TOPIC_SCOPE || 'current' }}
        run: |
          python prioritize_and_optimize.py

      - name: Commit Updated Index & Optimizations
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.0.1
        with:
          commit_message: "auto: star priority & discoverability update [skip ci]"
          file_pattern: "PRIORITIZED_STARS.md stars_state.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
