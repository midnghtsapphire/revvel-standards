name: Fork-Audit Bot
on:
  schedule:
    - cron: 15 13 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log intended actions without creating issues
        type: boolean
        default: false
      config_path:
        description: Path to candidates config (relative to repo root)
        type: string
        default: fork-audit/candidates.json
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: fork-audit-bot
  cancel-in-progress: false
jobs:
  audit:
    name: Audit candidate repos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run fork-audit bot
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          SELF_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/fork-audit-bot.js "${{ inputs.config_path }}" | tee -a "$GITHUB_STEP_SUMMARY"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
