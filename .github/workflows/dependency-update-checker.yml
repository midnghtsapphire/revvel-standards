name: Dependency & Version Update Checker
on:
  workflow_dispatch: null
permissions:
  issues: write
  contents: read
  actions: read
jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const fs = require('fs');
            const path = require('path');
            let report = [];

            // ─── 1. SCAN GITHUB ACTIONS VERSIONS ─────────────────────
            report.push('## GitHub Actions Updates\n');
            const workflowDir = '.github/workflows';
            let actionsFound = new Map();

            try {
              const files = fs.readdirSync(workflowDir);
              for (const file of files) {
                if (!file.endsWith('.yml') && !file.endsWith('.yaml')) continue;
                const content = fs.readFileSync(path.join(workflowDir, file), 'utf8');
                const actionPattern = /uses:\s+([^@\s]+)@(v?\d+[^\s]*)/g;
                let match;
                while ((match = actionPattern.exec(content)) !== null) {
                  const [, action, version] = match;
                  if (!actionsFound.has(action)) {
                    actionsFound.set(action, { version, files: [file] });
                  } else {
                    const existing = actionsFound.get(action);
                    existing.files.push(file);
                    if (existing.version !== version && !existing.mixedVersions) {
                      existing.mixedVersions = [existing.version, version];
                    } else if (existing.mixedVersions && !existing.mixedVersions.includes(version)) {
                      existing.mixedVersions.push(version);
                    }
                  }
                }
              }
            } catch(e) {
              report.push('_Could not scan workflow directory._\n');
            }

            let actionsNeedUpdate = 0;
            for (const [action, info] of actionsFound) {
              try {
                const [actionOwner, actionRepo] = action.split('/');
                if (!actionOwner || !actionRepo) continue;
                const { data: releases } = await github.rest.repos.listReleases({
                  owner: actionOwner, repo: actionRepo, per_page: 1,
                });
                if (releases.length > 0) {
                  const latest = releases[0].tag_name;
                  const currentMajor = info.version.replace(/^v/, '').split('.')[0];
                  const latestMajor = latest.replace(/^v/, '').split('.')[0];
                  if (info.version !== latest || info.mixedVersions) {
                    const emoji = currentMajor !== latestMajor ? '🔴' : '🟡';
                    const versionStr = info.mixedVersions
                      ? `mixed versions: \`${info.mixedVersions.join('`, `')}\``
                      : `using \`${info.version}\``;
                    report.push(`${emoji} \`${action}\`: ${versionStr}, latest \`${latest}\` (in: ${info.files.join(', ')})`);
                    actionsNeedUpdate++;
                  }
                }
              } catch(e) {
                // Skip actions we can't check (private, rate-limited, etc.)
              }
            }

            if (actionsNeedUpdate === 0) {
              report.push('All GitHub Actions are up to date.\n');
            }

            // ─── 2. CHECK NPM DEPENDENCIES ───────────────────────────
            report.push('\n## npm Dependencies\n');
            try {
              const pkgPath = 'package.json';
              if (fs.existsSync(pkgPath)) {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                const allDeps = { ...pkg.dependencies, ...pkg.devDependencies };
                const depCount = Object.keys(allDeps).length;
                report.push(`Found ${depCount} dependencies in package.json.`);
                report.push('_Run \`npm outdated\` or \`npx npm-check-updates\` locally for detailed version info._\n');
              } else {
                report.push('_No package.json found — skipping npm check._\n');
              }
            } catch(e) {
              report.push('_Error reading package.json._\n');
            }

            // ─── 3. CHECK GITHUB APPS ────────────────────────────────
            report.push('\n## Installed GitHub Apps\n');
            try {
              const { data } = await github.request('GET /repos/{owner}/{repo}/installation', { owner, repo });
              report.push(`- This repo's GitHub App installation ID: **${data.id}** (app: ${data.app_slug || data.app_id})`);
            } catch(e) {
              // Fallback: list known apps from workflow bot comments
              report.push('_GitHub Apps list requires admin token. Known apps from CI:_');
              report.push('- **lang-ci[bot]** — Language CI checks');
              report.push('- **vercel[bot]** — Preview deployments');
              report.push('- **devin-ai-integration[bot]** — Devin code review');
              report.push('- _Run `gh api /repos/{owner}/{repo}/installations` with admin token for full list._');
            }

            // ─── 4. SUGGESTED TOOLS & EXTENSIONS ─────────────────────
            report.push('\n## Recommended Tools to Evaluate\n');
            report.push('These are popular GitHub Apps and extensions worth evaluating:\n');
            report.push('- [Renovate](https://github.com/apps/renovate) — Automated dependency update PRs');
            report.push('- [Socket Security](https://github.com/apps/socket-security) — Supply chain attack detection');
            report.push('- [CodeQL](https://github.com/features/security/code) — Semantic code analysis');
            report.push('- [Mergify](https://github.com/apps/mergify) — Auto-merge rules and queue');
            report.push('- [GitHub Copilot](https://github.com/features/copilot) — AI pair programmer');

            // ─── CREATE OR UPDATE ISSUE ──────────────────────────────
            const title = `[AUTO] Weekly Dependency & Version Update Report — ${new Date().toISOString().split('T')[0]}`;
            const body = report.join('\n');

            // Check for existing open report issue
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'dependencies',
              per_page: 5,
            });
            const existing = existingIssues.find(i => i.title.startsWith('[AUTO] Weekly Dependency'));

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['dependencies', 'triage'],
              });
              core.info('Created new dependency update report issue.');
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
