name: AI Research Module
on:
  workflow_dispatch:
    inputs:
      question:
        description: Research question to investigate
        required: true
        type: string
      output_file:
        description: Output file path (e.g., docs/MY_RESEARCH.md)
        required: true
        default: docs/research-output.md
        type: string
      create_issue:
        description: Create a GitHub Issue summarizing findings?
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      max_models_per_agent:
        description: OpenRouter consensus models per research agent
        required: false
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
concurrency:
  group: research-module-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  research:
    name: Run AI Research Module
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.1.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Verify OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Cannot proceed with AI research."
            exit 1
          else
            echo "OPENROUTER_API_KEY is configured."
          fi
      - name: Run Research Module
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          QUESTION: ${{ inputs.question }}
          OUTPUT_FILE: ${{ inputs.output_file }}
          RESEARCH_MAX_MODELS_PER_AGENT: ${{ inputs.max_models_per_agent }}
        run: node scripts/research-engine.js
      - name: Commit research document
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "revvel-automation[bot]"
          git config user.email "revvel-automation[bot]@users.noreply.github.com"
          git add "${{ inputs.output_file }}"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "research: add ${{ inputs.output_file }}"
            git push
            echo "Research document committed and pushed."
          fi
      - name: Create summary issue
        if: ${{ inputs.create_issue == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Research Complete: ${{ inputs.question }}" \
            --label "New Project,deep-research,research:reviewed,research:fix-committed" \
            --body "## Research Findings

          The AI Research Module has completed research on:

          **Question:** ${{ inputs.question }}

          **Output document:** [\`${{ inputs.output_file }}\`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/${{ inputs.output_file }})

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Engine layers completed:**
          - Retrieval readiness check (Tavily / Firecrawl / Perplexity when configured)
          - OpenRouter multi-model consensus agents
          - Marketing, SEO, competitors, audience, and chatter agents
          - Code-review-style research review agents
          - Automatic review-fix rewrite committed to the research document

          ---

          Review the research document and create follow-up issues for any actionable items.
          Label follow-up issues with \`New Project\` as appropriate."
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
