name: PandaOps AI PR Review
on:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: panda-ops-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    name: PandaOps AI PR Review
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: PandaOps AI PR Review
        # Spend gate (#17850): this third-party action calls a paid LLM provider
        # with the key handed to it below, so the spend is real even though no
        # openrouter.ai URL appears in this file. Runs only when the repository
        # variable REVVEL_LLM_ALLOW_CLOUD is "1". See docs/LOCAL_LLM_SETUP.md.
        if: vars.REVVEL_LLM_ALLOW_CLOUD == '1'
        uses: omnedia/panda-ops@v1
        with:
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          ai_focus_errors: true
          ai_focus_warn: true
          ai_focus_tips: true
          ai_focus_notes: false
          ai_focus_grammar: false
          fail_on_warnings: false
          max_comments: 25
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
