name: PandaOps AI PR Review
on:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: panda-ops-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    name: PandaOps AI PR Review
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: PandaOps AI PR Review
        uses: omnedia/panda-ops@v1
        with:
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          ai_focus_errors: true
          ai_focus_warn: true
          ai_focus_tips: true
          ai_focus_notes: false
          ai_focus_grammar: false
          fail_on_warnings: false
          max_comments: 25
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
