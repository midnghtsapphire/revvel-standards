#
# Local github-script label management replaces abandoned
# `wagner-cotta/arsc-label@v1.0` (single-maintainer, one-day history, WR
# #14884) so this workflow no longer depends on third-party checkout + pip.
name: ARSC Labels
on:
  workflow_dispatch:
    inputs:
      object-id:
        description: Issue or Pull Request number
        required: true
        type: string
      operation:
        description: Label operation to perform
        required: true
        type: choice
        options:
          - add
          - remove
          - set
          - clear
      labels:
        description: Comma-separated label names (not required for 'clear')
        required: false
        type: string
  issues:
    types:
      - opened
permissions:
  issues: write
  pull-requests: write
jobs:
  manual-label:
    name: Manual Label Operation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Manage Labels (ARSC)
        id: manage-labels
        uses: actions/github-script@v9.0.0
        env:
          OBJECT_ID: ${{ github.event.inputs['object-id'] }}
          OPERATION: ${{ github.event.inputs.operation }}
          LABELS: ${{ github.event.inputs.labels || '' }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.OBJECT_ID);
            const operation = process.env.OPERATION;
            const labels = (process.env.LABELS || '')
              .split(',')
              .map((label) => label.trim())
              .filter(Boolean);

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              throw new Error(`Invalid object-id: ${process.env.OBJECT_ID}`);
            }

            let response;
            switch (operation) {
              case 'add':
                if (labels.length === 0) throw new Error('labels input is required for add');
                response = await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/labels', {
                  owner,
                  repo,
                  issue_number,
                  labels,
                });
                break;
              case 'remove': {
                if (labels.length === 0) throw new Error('labels input is required for remove');
                const removed = [];
                const missing = [];
                for (const name of labels) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                    removed.push(name);
                  } catch (error) {
                    if (error.status === 404) {
                      missing.push(name);
                      continue;
                    }
                    throw error;
                  }
                }
                response = { data: { removed, missing } };
                break;
              }
              case 'set':
                if (labels.length === 0) throw new Error('labels input is required for set');
                response = await github.request('PUT /repos/{owner}/{repo}/issues/{issue_number}/labels', {
                  owner,
                  repo,
                  issue_number,
                  labels,
                });
                break;
              case 'clear':
                response = await github.request('DELETE /repos/{owner}/{repo}/issues/{issue_number}/labels', {
                  owner,
                  repo,
                  issue_number,
                });
                break;
              default:
                throw new Error(`Unsupported operation: ${operation}`);
            }

            core.setOutput('response', JSON.stringify(response.data ?? { status: response.status }));
    timeout-minutes: 15
  triage-new-issue:
    name: Apply Triage Label to New Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Ensure `triage` label exists
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'triage',
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'triage',
                  color: 'e4e669',
                  description: 'Needs triage — newly opened issue awaiting classification',
                });
                core.info('Created label: triage');
              }
            }
      - name: Add `triage` label to new issue
        if: toJSON(github.event.issue.labels) == '[]'
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['triage'],
            });
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
