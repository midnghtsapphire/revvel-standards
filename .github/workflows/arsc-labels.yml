name: ARSC Labels
on:
  workflow_dispatch:
    inputs:
      object-id:
        description: Issue or Pull Request number
        required: true
        type: string
      operation:
        description: Label operation to perform
        required: true
        type: choice
        options:
          - add
          - remove
          - set
          - clear
      labels:
        description: Comma-separated label names (not required for 'clear')
        required: false
        type: string
  issues:
    types:
      - opened
permissions:
  issues: write
  pull-requests: write
jobs:
  manual-label:
    name: Manual Label Operation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Manage Labels (ARSC)
        uses: wagner-cotta/arsc-label@v1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          object-id: ${{ github.event.inputs['object-id'] }}
          operation: ${{ github.event.inputs.operation }}
          labels: ${{ github.event.inputs.labels }}
    timeout-minutes: 15
  triage-new-issue:
    name: Apply Triage Label to New Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Ensure `triage` label exists
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'triage',
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'triage',
                  color: 'e4e669',
                  description: 'Needs triage — newly opened issue awaiting classification',
                });
                core.info('Created label: triage');
              }
            }
      - name: Add `triage` label to new issue
        if: toJSON(github.event.issue.labels) == '[]'
        uses: wagner-cotta/arsc-label@v1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          object-id: ${{ github.event.issue.number }}
          operation: add
          labels: triage
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
