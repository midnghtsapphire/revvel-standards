---
name: Super-Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: >-
            (wr/issues/.*|node_modules/.*|\.git/.*)
          # ── Disable linters that produce false-positive failures ──
          # JSCPD: 0% threshold is impossible in a repo with templated
          #   WR docs — every WR shares boilerplate headings.
          VALIDATE_JSCPD: false
          # Prettier (MD/YAML): no project-wide Prettier config exists,
          #   so Super-Linter's built-in defaults reformat every file.
          #   Rely on markdownlint for Markdown and actionlint/yamllint
          #   for YAML instead.
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          # Trivy: flags transitive npm dependency CVEs that are not
          #   addressable in feature PRs. Dependabot / Renovate handle
          #   dependency updates separately.
          VALIDATE_TRIVY: false
