name: Fleet Controller

# Grid-level scheduler over orchestrator workflows. Runtime observations remain
# available in the job summary/artifacts; the repository is updated only when
# durable controller state or semantic monitor content actually changes.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      preempt:
        description: 'Actually cancel stalled/runaway runs (true) or dry-run (false)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: fleet-controller
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  CONTROLLER_PREEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.preempt == false && '0' || '1' }}

jobs:
  schedule-grid:
    name: Scan + preempt orchestrators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fleet controller
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CONTROLLER_PREEMPT: ${{ env.CONTROLLER_PREEMPT }}
        run: node scripts/controller/controller.js

      - name: Stage durable or semantic changes only
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          # Durable reassignment state is always eligible for persistence.
          git add docs/controller/controller-state.json

          # Monitor feeds contain generated_at. Ignore timestamp-only changes.
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const files = [
            'docs/controller/controller-status.json',
            'docs/controller/controller-stop.json',
            'docs/controller/controller-ingestion.json',
          ];

          function semantic(value) {
            if (Array.isArray(value)) return value.map(semantic);
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.entries(value)
                  .filter(([key]) => key !== 'generated_at')
                  .map(([key, child]) => [key, semantic(child)])
              );
            }
            return value;
          }

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const current = semantic(JSON.parse(fs.readFileSync(file, 'utf8')));
            let previous = null;
            try {
              previous = semantic(JSON.parse(execFileSync('git', ['show', `HEAD:${file}`], { encoding: 'utf8' })));
            } catch (_) {
              // New file: persist it.
            }
            if (JSON.stringify(current) !== JSON.stringify(previous)) {
              execFileSync('git', ['add', file]);
              console.log(`semantic change: ${file}`);
            } else {
              console.log(`timestamp-only/unchanged: ${file}`);
            }
          }
          NODE

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No durable or semantic controller change." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Controller changes to persist"
              echo '```text'
              git diff --cached --stat
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit controller state
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remember what we staged: if branch protection rejects the direct
          # push below, these are the files we replay through the Contents API.
          STAGED_FILES=$(git diff --cached --name-only)

          git commit -m "chore(controller): persist semantic fleet state"

          # Rebase onto any concurrent bot commit (biome feeds land every few
          # minutes) so a stale HEAD doesn't turn into a spurious push failure.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true

          # main enforces "changes via pull request" (GH013) for the default
          # GITHUB_TOKEN used by checkout, so the direct push is expected to be
          # rejected unless ADMIN_GITHUB_TOKEN is wired into git. Fall back to
          # the Contents API with GH_TOKEN (the admin token, which is on the
          # ruleset bypass list) — the same proven lane biome-inspector and
          # biome-sheaf use to persist their feeds. If it fails, check that
          # secrets.ADMIN_GITHUB_TOKEN exists and its owner can bypass the
          # main-branch ruleset.
          git push && echo "controller state pushed to ${GITHUB_REF_NAME}" || {
            echo "::warning::Direct push blocked by branch protection — retrying via Contents API"
            for f in $STAGED_FILES; do
              [ -f "$f" ] || continue
              existing_sha=$(gh api "repos/${GH_REPO}/contents/${f}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)
              b64=$(base64 "$f" | tr -d '\n')
              args=(--field "message=chore(controller): persist semantic fleet state [skip ci]" --field "content=${b64}" --field "branch=${GITHUB_REF_NAME}")
              [ -n "$existing_sha" ] && args+=(--field "sha=${existing_sha}")
              gh api "repos/${GH_REPO}/contents/${f}" -X PUT "${args[@]}" > /dev/null \
                && echo "  ✓ updated ${f} via API" \
                || { echo "::error::API update failed for ${f} — controller state not persisted"; exit 1; }
            done
          }
