name: Fleet Controller

# Grid-level scheduler over orchestrator workflows. Runtime observations remain
# available in the job summary/artifacts; the repository is updated only when
# durable controller state or semantic monitor content actually changes.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      preempt:
        description: 'Actually cancel stalled/runaway runs (true) or dry-run (false)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  # Needed by peter-evans/create-pull-request when falling back to GITHUB_TOKEN.
  pull-requests: write

concurrency:
  group: fleet-controller
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  CONTROLLER_PREEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.preempt == false && '0' || '1' }}

jobs:
  schedule-grid:
    name: Scan + preempt orchestrators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fleet controller
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CONTROLLER_PREEMPT: ${{ env.CONTROLLER_PREEMPT }}
        run: node scripts/controller/controller.js

      - name: Stage durable or semantic changes only
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          # Durable reassignment state is always eligible for persistence.
          git add docs/controller/controller-state.json

          # Monitor feeds contain generated_at. Ignore timestamp-only changes.
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const files = [
            'docs/controller/controller-status.json',
            'docs/controller/controller-stop.json',
            'docs/controller/controller-ingestion.json',
          ];

          function semantic(value) {
            if (Array.isArray(value)) return value.map(semantic);
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.entries(value)
                  .filter(([key]) => key !== 'generated_at')
                  .map(([key, child]) => [key, semantic(child)])
              );
            }
            return value;
          }

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const current = semantic(JSON.parse(fs.readFileSync(file, 'utf8')));
            let previous = null;
            try {
              previous = semantic(JSON.parse(execFileSync('git', ['show', `HEAD:${file}`], { encoding: 'utf8' })));
            } catch (_) {
              // New file: persist it.
            }
            if (JSON.stringify(current) !== JSON.stringify(previous)) {
              execFileSync('git', ['add', file]);
              console.log(`semantic change: ${file}`);
            } else {
              console.log(`timestamp-only/unchanged: ${file}`);
            }
          }
          NODE

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No durable or semantic controller change." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Controller changes to persist"
              echo '```text'
              git diff --cached --stat
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Drop timestamp-only working-tree edits (e.g. generated_at churn in
            # controller-ingestion.json) so the PR action below only commits the
            # staged semantic changes. `git checkout -- .` restores the working
            # tree from the index, which keeps staged content intact.
            git checkout -- .
          fi

      # Branch protection on main requires changes to land via pull request
      # (direct `git push` is rejected with GH013), so persist controller state
      # through a rolling PR on a fixed branch. Reusing the same branch means
      # subsequent runs update one open PR instead of spamming new ones.
      - name: Open or update controller-state PR
        if: steps.stage.outputs.changed == 'true'
        id: state_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(controller): persist semantic fleet state"
          title: "chore(controller): persist semantic fleet state"
          body: |
            Automated fleet-controller state sync.

            This PR persists durable reassignment state and semantically changed
            monitor feeds under `docs/controller/`. It is updated in place by the
            Fleet Controller workflow on each run with new state; direct pushes to
            `main` are blocked by branch protection.

            *Run ID: ${{ github.run_id }}*
          branch: fleet-controller/state-sync
          base: main
          delete-branch: true

      # Best-effort: let the PR land on its own once required checks pass. If
      # auto-merge is disabled on the repo this fails harmlessly — the PR simply
      # waits for a human merge, and the next controller run refreshes it.
      - name: Enable auto-merge on controller-state PR
        if: steps.stage.outputs.changed == 'true' && steps.state_pr.outputs.pull-request-number != ''
        continue-on-error: true
        run: gh pr merge --auto --squash "${{ steps.state_pr.outputs.pull-request-number }}"
