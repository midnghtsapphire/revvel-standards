name: Fleet Controller

# Grid-level scheduler over orchestrator workflows. Runtime observations remain
# available in the job summary/artifacts; the repository is updated only when
# durable controller state or semantic monitor content actually changes.
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      preempt:
        description: 'Actually cancel stalled/runaway runs (true) or dry-run (false)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  # Needed by peter-evans/create-pull-request in the state-PR fallback lane.
  pull-requests: write

concurrency:
  group: fleet-controller
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  CONTROLLER_PREEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.preempt == false && '0' || '1' }}

jobs:
  schedule-grid:
    name: Scan + preempt orchestrators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The state-PR fallback needs a PAT / app-installation token. Pull requests
      # authored by the default GITHUB_TOKEN never start the required
      # `pull_request` checks (CLAUDE.md recurring gotcha #3), so such a PR could
      # never merge and controller state would stall forever — hence no
      # GITHUB_TOKEN fallback here. Empty means "fallback unavailable".
      STATE_PR_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.AGENT_PR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # create-pull-request supplies its own Authorization header; leaving the
          # checkout credential in http.extraheader sends two and git 400s.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # If a previous run's state PR is still unmerged, `main` does not yet carry
      # the newest scoreboard, and the controller would recompute from stale
      # state — repeating the same cut/relaunch decisions and defeating
      # convergence. Seed the durable state file from the pending branch so
      # successive runs build on the latest state even before it lands.
      - name: Seed durable state from pending state-sync branch
        shell: bash
        run: |
          set -euo pipefail
          branch=fleet-controller/state-sync
          state=docs/controller/controller-state.json
          if git fetch --depth=1 origin "$branch" 2>/dev/null; then
            if git cat-file -e "FETCH_HEAD:$state" 2>/dev/null; then
              git show "FETCH_HEAD:$state" > "$state"
              echo "seeded $state from pending $branch"
            fi
          else
            echo "no pending $branch — using state from the base checkout"
          fi

      - name: Run fleet controller
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CONTROLLER_PREEMPT: ${{ env.CONTROLLER_PREEMPT }}
        run: node scripts/controller/controller.js

      - name: Stage durable or semantic changes only
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          # Durable reassignment state is always eligible for persistence.
          git add docs/controller/controller-state.json

          # Monitor feeds contain generated_at. Ignore timestamp-only changes.
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const files = [
            'docs/controller/controller-status.json',
            'docs/controller/controller-stop.json',
            'docs/controller/controller-ingestion.json',
          ];

          function semantic(value) {
            if (Array.isArray(value)) return value.map(semantic);
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.entries(value)
                  .filter(([key]) => key !== 'generated_at')
                  .map(([key, child]) => [key, semantic(child)])
              );
            }
            return value;
          }

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const current = semantic(JSON.parse(fs.readFileSync(file, 'utf8')));
            let previous = null;
            try {
              previous = semantic(JSON.parse(execFileSync('git', ['show', `HEAD:${file}`], { encoding: 'utf8' })));
            } catch (_) {
              // New file: persist it.
            }
            if (JSON.stringify(current) !== JSON.stringify(previous)) {
              execFileSync('git', ['add', file]);
              console.log(`semantic change: ${file}`);
            } else {
              console.log(`timestamp-only/unchanged: ${file}`);
            }
          }
          NODE

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No durable or semantic controller change." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Controller changes to persist"
              echo '```text'
              git diff --cached --stat
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Drop timestamp-only working-tree edits (e.g. generated_at churn in
          # controller-ingestion.json) so nothing downstream commits them.
          # `git checkout -- .` restores the working tree from the index, which
          # keeps staged content intact. Unconditional on purpose: leaving the
          # churn behind on the changed=false path would let any future step
          # pick it up.
          git checkout -- .

      # Primary lane: direct push, falling back to the Contents API with the
      # admin token (which is on the main-branch ruleset bypass list). Marked
      # non-fatal so the state-PR lane below can still save the state when this
      # repository has no bypass-capable token; the guard step at the end turns a
      # "nothing persisted at all" outcome back into a job failure.
      - name: Commit controller state
        id: persist
        if: steps.stage.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remember what we staged: if branch protection rejects the direct
          # push below, these are the files we replay through the Contents API.
          STAGED_FILES=$(git diff --cached --name-only)

          git commit -m "chore(controller): persist semantic fleet state"

          # Rebase onto any concurrent bot commit (biome feeds land every few
          # minutes) so a stale HEAD doesn't turn into a spurious push failure.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true

          # main enforces "changes via pull request" (GH013) for the default
          # GITHUB_TOKEN used by checkout, so the direct push is expected to be
          # rejected unless ADMIN_GITHUB_TOKEN is wired into git. Fall back to
          # the Contents API with GH_TOKEN (the admin token, which is on the
          # ruleset bypass list) — the same proven lane biome-inspector and
          # biome-sheaf use to persist their feeds. If it fails, check that
          # secrets.ADMIN_GITHUB_TOKEN exists and its owner can bypass the
          # main-branch ruleset.
          git push && echo "controller state pushed to ${GITHUB_REF_NAME}" || {
            echo "::warning::Direct push blocked by branch protection — retrying via Contents API"
            for f in $STAGED_FILES; do
              [ -f "$f" ] || continue
              existing_sha=$(gh api "repos/${GH_REPO}/contents/${f}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)
              b64=$(base64 "$f" | tr -d '\n')
              args=(--field "message=chore(controller): persist semantic fleet state [skip ci]" --field "content=${b64}" --field "branch=${GITHUB_REF_NAME}")
              [ -n "$existing_sha" ] && args+=(--field "sha=${existing_sha}")
              gh api "repos/${GH_REPO}/contents/${f}" -X PUT "${args[@]}" > /dev/null \
                && echo "  ✓ updated ${f} via API" \
                || { echo "::error::API update failed for ${f} — controller state not persisted"; exit 1; }
            done
          }

      # Fallback lane: when neither the push nor the Contents API can write to a
      # protected `main` (GH013), persist the same files through a rolling PR on
      # a fixed branch. Reusing one branch means the 15-minute cron updates a
      # single open PR instead of spamming a new one per run.
      - name: Open or update controller-state PR
        if: steps.stage.outputs.changed == 'true' && steps.persist.outcome == 'failure' && env.STATE_PR_TOKEN != ''
        id: state_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.STATE_PR_TOKEN }}
          # Restrict the commit to the controller's own state files. Without this
          # the action commits everything in the tree, so any future artifact the
          # controller happens to emit (logs, new feeds) would silently ride along.
          add-paths: docs/controller/*.json
          commit-message: "chore(controller): persist semantic fleet state"
          title: "chore(controller): persist semantic fleet state"
          body: |
            Automated fleet-controller state sync.

            This PR persists durable reassignment state and semantically changed
            monitor feeds under `docs/controller/`. It is updated in place by the
            Fleet Controller workflow on each run with new state; direct pushes to
            `main` are blocked by branch protection.

            *Run ID: ${{ github.run_id }}*
          branch: fleet-controller/state-sync
          base: main
          delete-branch: true

      # Best-effort: let the PR land on its own once required checks pass. If
      # auto-merge is disabled on the repo this fails harmlessly — the PR simply
      # waits for a human merge, and the next controller run refreshes it.
      - name: Enable auto-merge on controller-state PR
        if: steps.state_pr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          # Read through env instead of inline `${{ }}` in `run:` so the value is
          # never expanded into the shell as code (zizmor template-injection).
          PR_NUMBER: ${{ steps.state_pr.outputs.pull-request-number }}
          GH_TOKEN: ${{ env.STATE_PR_TOKEN }}
        run: gh pr merge --auto --squash "$PR_NUMBER"

      # Both lanes failed (or the fallback was unavailable): state is only in the
      # runner's filesystem and will be lost. Fail loudly rather than reporting a
      # green run that silently dropped the scoreboard.
      - name: Verify controller state was persisted
        if: steps.stage.outputs.changed == 'true' && steps.persist.outcome == 'failure' && steps.state_pr.outcome != 'success'
        run: |
          echo "::error::Controller state was not persisted. The direct push and the Contents API fallback both failed, and the state-PR fallback needs a bypass-capable PAT in secrets.ADMIN_GITHUB_TOKEN or secrets.AGENT_PR_TOKEN — the default GITHUB_TOKEN cannot be used because its pull requests never start the required checks."
          exit 1
