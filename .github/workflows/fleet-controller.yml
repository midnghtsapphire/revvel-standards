name: Fleet Controller

# Grid-level scheduler over orchestrator workflows. Runtime observations remain
# available in the job summary/artifacts; the repository is updated only when
# durable controller state or semantic monitor content actually changes.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      preempt:
        description: 'Actually cancel stalled/runaway runs (true) or dry-run (false)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  pull-requests: write # gh pr create / merge for the state-sync PR

concurrency:
  group: fleet-controller
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  CONTROLLER_PREEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.preempt == false && '0' || '1' }}

jobs:
  schedule-grid:
    name: Scan + preempt orchestrators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fleet controller
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CONTROLLER_PREEMPT: ${{ env.CONTROLLER_PREEMPT }}
        run: node scripts/controller/controller.js

      - name: Stage durable or semantic changes only
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          # Durable reassignment state is always eligible for persistence.
          git add docs/controller/controller-state.json

          # Monitor feeds contain generated_at. Ignore timestamp-only changes.
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const files = [
            'docs/controller/controller-status.json',
            'docs/controller/controller-stop.json',
            'docs/controller/controller-ingestion.json',
          ];

          function semantic(value) {
            if (Array.isArray(value)) return value.map(semantic);
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.entries(value)
                  .filter(([key]) => key !== 'generated_at')
                  .map(([key, child]) => [key, semantic(child)])
              );
            }
            return value;
          }

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const current = semantic(JSON.parse(fs.readFileSync(file, 'utf8')));
            let previous = null;
            try {
              previous = semantic(JSON.parse(execFileSync('git', ['show', `HEAD:${file}`], { encoding: 'utf8' })));
            } catch (_) {
              // New file: persist it.
            }
            if (JSON.stringify(current) !== JSON.stringify(previous)) {
              execFileSync('git', ['add', file]);
              console.log(`semantic change: ${file}`);
            } else {
              console.log(`timestamp-only/unchanged: ${file}`);
            }
          }
          NODE

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No durable or semantic controller change." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Controller changes to persist"
              echo '```text'
              git diff --cached --stat
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # main is protected by a repository ruleset ("Changes must be made
      # through a pull request" + required status checks), so a direct
      # `git push` to main is always rejected with GH013. Persist state via a
      # dedicated sync branch + PR instead. The branch is force-pushed each
      # run: controller state is a snapshot, so the newest run always wins,
      # and any already-open sync PR simply gets refreshed by the push.
      - name: Commit and open state-sync PR
        if: steps.stage.outputs.changed == 'true'
        env:
          SYNC_BRANCH: fleet-controller/state-sync
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(controller): persist semantic fleet state"
          git push --force origin "HEAD:refs/heads/${SYNC_BRANCH}"

          # Reuse the open sync PR if one exists; otherwise create it.
          # If it fails to open (e.g. race with a just-merged PR), surface the
          # error — exit code must reflect whether the state actually has a
          # merge path, not just that the push finished.
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Sync PR #$EXISTING already open; branch updated." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create \
              --title "chore(controller): persist semantic fleet state" \
              --body "Automated fleet-controller state sync. Latest run: ${RUN_URL}. Direct pushes to main are blocked by repository rules, so durable controller state lands through this PR." \
              --base main \
              --head "$SYNC_BRANCH"
          fi

          # Best-effort auto-merge so the snapshot lands once required checks
          # pass. Fails when auto-merge is disabled repo-wide — that's fine,
          # the PR still exists for manual merge.
          gh pr merge "$SYNC_BRANCH" --auto --squash || \
            echo "Auto-merge unavailable; merge the sync PR manually." >> "$GITHUB_STEP_SUMMARY"
