# Agent Dispatcher
# Dispatches the correct agent based on issue labels
# Reads prompts from .github/agent-prompts.yml

name: Agent Dispatcher

on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: false
        type: number
      agent:
        description: Agent to dispatch
        required: false
        type: choice
        options:
          - perplexity
          - jules
          - openrouter
          - triage

permissions:
  issues: write
  contents: read

# Dedup concurrent dispatcher runs for the same issue. Without this, a fresh
# Octopus issue triggers TWO routes: once on `issues: opened` (label
# octopus-review matches), then again on `issues: labeled` when
# octopus-route.yml adds `wr:code` to the same issue. The group keys on the
# issue number + dispatch-event so both runs collapse to one openrouter-coder
# trigger. cancel-in-progress is false so a run already mid-dispatch finishes
# rather than being killed and re-queued (idempotency lives downstream).
concurrency:
  group: agent-dispatcher-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

env:
  # PAT-with-fallback so `gh workflow run` can cascade-trigger the downstream
  # agent workflows (the default GITHUB_TOKEN cannot trigger other workflows).
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  # gh infers the repo from the local git remote; this job has no checkout, so
  # set GH_REPO explicitly or every gh call fails with "not a git repository".
  GH_REPO: ${{ github.repository }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 30
    steps:
      - name: Determine agent to dispatch
        id: determine
        env:
          # zizmor template-injection fix (PR #17091): expression values reach
          # the shell via env vars instead of ${{ }} interpolation inside run.
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          DISPATCH_AGENT: ${{ inputs.agent }}
          # Not an injection vector (system-controlled enum), routed through
          # env anyway for consistency with the zizmor fix above (Jules nit).
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Read agent-prompts.yml to get triggers
          echo "Looking for label triggers..."

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_AGENT" ]; then
            echo "agent=$DISPATCH_AGENT" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check issue labels
          LABELS=",${ISSUE_LABELS},"
          
          # Belt-and-suspenders: route octopus-review[bot] issues to openrouter
          # even if the octopus-route.yml translator hasn't applied wr:code yet.
          # The translator runs in parallel with this dispatcher on issue:opened;
          # when the translator later adds wr:code, GitHub re-fires this
          # workflow with `labeled` action AND the original `octopus-review`
          # label is still present. With `octopus-review` ordered BEFORE
          # `wr:code` below, both events hit the same case, so the workflow-
          # level concurrency group (added above) dedups them into a single
          # openrouter-coder dispatch instead of two. Per oAudrey diagnosis on
          # PR #14068.
          # REVVEL-DISABLED | AGENT: claude-code | MODEL: claude-5 | WR: #17091 | DATE: 2026-08-08 | STATUS: REPLACED
          # REASON: original un-anchored patterns let wr:research-complete false-match *wr:research*;
          # replaced below with comma-anchored patterns + an explicit research-complete -> code-lane branch.
          # case "$LABELS" in
          #   *wr:research*)
          #     echo "agent=perplexity" >> $GITHUB_OUTPUT
          #     ;;
          #   *wr:jules*)
          #     echo "agent=jules" >> $GITHUB_OUTPUT
          #     ;;
          #   *octopus-review*)
          #     echo "agent=openrouter" >> $GITHUB_OUTPUT
          #     ;;
          #   *wr:code*)
          #     echo "agent=openrouter" >> $GITHUB_OUTPUT
          #     ;;
          #   *lifecycle:stuck*)
          #     echo "agent=perplexity" >> $GITHUB_OUTPUT
          #     ;;
          #   *)
          #     echo "agent=triage" >> $GITHUB_OUTPUT
          #     ;;
          # esac
          # REVVEL-DISABLED-END
          case "$LABELS" in
            *,wr:code,*|*,octopus-review,*)
              # Matched FIRST so an issue carrying BOTH wr:research-complete
              # and wr:code still dispatches the coder — wr:code is the
              # human/gate approval signal and must win (Jules review,
              # PR #17091).
              echo "agent=openrouter" >> $GITHUB_OUTPUT
              ;;
            *,wr:research-complete,*)
              # Spec-to-action bridge (issue #15507) runs through the Spec
              # Approval Gate: spec-approval-gate.yml owns this label (it adds
              # needs-spec-approval and asks the owner), and openrouter-coder
              # fires ONLY on human-applied spec-approved or wr:code
              # (demand-driven activation, 2026-07-25). Dispatching a coder
              # here would bypass that owner-approval gate (flagged by PR
              # review on #17091). Matched before wr:research so completed
              # research no longer misroutes into another research pass —
              # this branch is an intentional no-op.
              echo "agent=none" >> $GITHUB_OUTPUT
              ;;
            *,wr:research,*|*,lifecycle:stuck,*)
              echo "agent=perplexity" >> $GITHUB_OUTPUT
              ;;
            *,wr:jules,*)
              echo "agent=jules" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "agent=triage" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Load prompt for agent
        id: prompt
        run: |
          # Load prompt from agent-prompts.yml
          # This is simplified - real implementation would parse YAML
          
          case "${{ steps.determine.outputs.agent }}" in
            perplexity)
              echo "prompt<<EOF" >> $GITHUB_ENV
              echo "You are the Revvel Standards research agent." >> $GITHUB_ENV
              echo "" >> $GITHUB_ENV
              echo "Research this GitHub issue and produce a WR handoff." >> $GITHUB_ENV
              echo "" >> $GITHUB_ENV
              echo "Output format:" >> $GITHUB_ENV
              echo "## Diagnosis" >> $GITHUB_ENV
              echo "## Files Likely Involved" >> $GITHUB_ENV
              echo "## Implementation Plan" >> $GITHUB_ENV
              echo "## Code Agent Handoff" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              ;;
            jules)
              echo "prompt<<EOF" >> $GITHUB_ENV
              echo "You are the Revvel Standards Jules coding agent." >> $GITHUB_ENV
              echo "" >> $GITHUB_ENV
              echo "Create a branch, implement the fix, open a PR." >> $GITHUB_ENV
              echo "" >> $GITHUB_ENV
              echo "PR title: [WR] summary" >> $GITHUB_ENV
              echo "PR body: Issue link, files changed, tests run" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              ;;
            openrouter)
              echo "prompt<<EOF" >> $GITHUB_ENV
              echo "You are the Revvel Standards coding agent." >> $GITHUB_ENV
              echo "" >> $GITHUB_ENV
              echo "Create a PR with the fix for this issue." >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              ;;
            triage)
              echo "prompt<<EOF" >> $GITHUB_ENV
              echo "You are the Revvel Standards triage agent." >> $GITHUB_ENV
              echo "" >> $GITHUB_ENV
              echo "Classify this issue: area, priority, type, labels" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              ;;
          esac

      - name: Dispatch to agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          AGENT: ${{ steps.determine.outputs.agent }}
          PROMPT: ${{ env.prompt }}
        run: |
          echo "Dispatching $AGENT for issue #$ISSUE_NUMBER..."
          
          case "$AGENT" in
            perplexity)
              # Trigger Perplexity workflow
              gh workflow run perplexity-research-agent.yml -f issue_number=$ISSUE_NUMBER -f prompt="$PROMPT"
              ;;
            jules)
              # Trigger Jules - uses your JULES_TOKEN
              gh workflow run jules-coding-agent.yml -f issue_number=$ISSUE_NUMBER -f prompt="$PROMPT"
              ;;
            openrouter)
              # Trigger OpenRouter coder
              gh workflow run openrouter-coder.yml -f issue_number=$ISSUE_NUMBER -f prompt="$PROMPT"
              ;;
            triage)
              # Trigger OpenRouter triage
              gh workflow run openrouter-triage.yml -f issue_number=$ISSUE_NUMBER -f prompt="$PROMPT"
              ;;
          esac

      - name: Update labels
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          AGENT: ${{ steps.determine.outputs.agent }}
          PROMPT: ${{ env.prompt }}
        run: |
          case "$AGENT" in
            perplexity)
              gh issue edit "$ISSUE_NUMBER" \
                --remove-label "wr:new" \
                --add-label "wr:research" 2>/dev/null || true
              ;;
            jules)
              gh issue edit "$ISSUE_NUMBER" \
                --add-label "wr:jules" 2>/dev/null || true
              ;;
            openrouter)
              gh issue edit "$ISSUE_NUMBER" \
                --add-label "wr:code" 2>/dev/null || true
              ;;
            triage)
              gh issue edit "$ISSUE_NUMBER" \
                --add-label "openrouter" 2>/dev/null || true
              ;;
          esac

      - name: Report
        run: |
          echo "## Agent Dispatch Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Agent: ${{ steps.determine.outputs.agent }}" >> $GITHUB_STEP_SUMMARY
          echo "Issue: ${{ github.event.issue.number || inputs.issue_number }}" >> $GITHUB_STEP_SUMMARY