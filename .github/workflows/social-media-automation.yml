name: Social Media Automation
on:
  # QUIET THE FLEET 2026-08-21: this fired on EVERY closed PR with no further
  # condition. With ~674 PRs opened in three weeks — nearly all machine-authored
  # — closing the backlog would have posted to social accounts once per PR.
  # Preserved commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # pull_request:
  #   types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post_to_social_media:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PR Metadata and Format Posts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        id: format_posts
        run: |
          # Source the reusable formatting script
          # It outputs securely to GITHUB_OUTPUT
          ./scripts/social_post_formatter.sh

      - name: Dry Run Logging
        env:
          TW: ${{ steps.format_posts.outputs.twitter_post }}
          LI: ${{ steps.format_posts.outputs.linkedin_post }}
          FB: ${{ steps.format_posts.outputs.facebook_post }}
        run: |
          echo "--- DRY RUN OUTPUT ---"
          echo "Twitter: $TW"
          echo "LinkedIn: $LI"
          echo "Facebook: $FB"
          echo "----------------------"

