# Organization README Badge Generator
# Issue: #16201
# Action: joshjohanning/organization-readme-badge-generator@v2.0.3
#
# Generates shields.io markdown badges (repo count + recent PR activity) for a
# GitHub *organization* and injects them between markers in README.md.
#
# Configuration (required before the job does real work):
#   - Repository variable ORG_README_BADGES_ORG = the org login to query, OR
#   - workflow_dispatch input `organization`
#
# midnghtsapphire is a user account, not an org. The upstream GraphQL query is
# organization(login:...), so leave ORG_README_BADGES_ORG unset until badges
# should target a real org (e.g. after Freedom Angel Corps migration). When
# unset, the job exits 0 with a notice instead of failing the schedule.
#
# Fallback if the action or GraphQL call fails: re-run via workflow_dispatch
# with an explicit organization input, confirm the GITHUB_TOKEN can read the
# org, and check upstream releases at
# https://github.com/joshjohanning/organization-readme-badge-generator/releases

name: Organization README Badge Generator

on:
  schedule:
    # Daily 07:00 UTC — matches upstream sample cadence.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      organization:
        description: GitHub organization login (overrides vars.ORG_README_BADGES_ORG)
        required: false
        type: string
      days:
        description: Window in days for PR-created / PR-merged stats
        required: false
        default: '30'
        type: string

permissions:
  contents: write

concurrency:
  group: organization-readme-badges
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-badges:
    name: Generate organization README badges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Default GITHUB_TOKEN on purpose: badge-only docs commits must not
          # fan out a full CI storm on main (CLAUDE.md gotcha #3). Use
          # secrets.AGENT_PR_TOKEN only if a downstream workflow must run.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve organization
        id: org
        env:
          INPUT_ORG: ${{ github.event.inputs.organization || '' }}
          CONFIGURED_ORG: ${{ vars.ORG_README_BADGES_ORG || '' }}
        run: |
          set -euo pipefail
          org="${INPUT_ORG:-}"
          if [ -z "${org}" ]; then
            org="${CONFIGURED_ORG:-}"
          fi
          if [ -z "${org}" ]; then
            echo "::notice::No organization configured. Set repository variable ORG_README_BADGES_ORG or pass workflow_dispatch input 'organization'. Skipping badge generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Basic login hygiene — GraphQL org login is alphanumeric / hyphen.
          if ! printf '%s' "${org}" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'; then
            echo "::error::Invalid organization login: ${org}"
            exit 1
          fi
          echo "organization=${org}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # secrets.A || secrets.B is not a real fallback in Actions expressions —
      # an unset secret becomes "" and the right-hand side is never used. Pick
      # the token in the shell and export it for the next step instead.
      - name: Resolve badge API token
        if: steps.org.outputs.skip != 'true'
        env:
          ORG_TOKEN: ${{ secrets.ORG_README_BADGES_TOKEN }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ORG_TOKEN}" ]; then
            echo "BADGE_API_TOKEN=${ORG_TOKEN}" >> "$GITHUB_ENV"
          else
            echo "BADGE_API_TOKEN=${DEFAULT_TOKEN}" >> "$GITHUB_ENV"
          fi

      - name: GitHub Organization Readme Badge Generator
        if: steps.org.outputs.skip != 'true'
        id: organization-readme-badge-generator
        uses: joshjohanning/organization-readme-badge-generator@55eed124ca46c09a654d886a98413c5bfc6c3803 # v2.0.3
        with:
          organization: ${{ steps.org.outputs.organization }}
          # BADGE_API_TOKEN is ORG_README_BADGES_TOKEN when set, else GITHUB_TOKEN.
          # GITHUB_TOKEN is enough for public org stats; set the optional secret
          # for private orgs that the default token cannot read.
          token: ${{ env.BADGE_API_TOKEN }}
          days: ${{ github.event.inputs.days || '30' }}
          color: blue
          label_color: '555'

      - name: Write badges to job summary
        if: steps.org.outputs.skip != 'true'
        env:
          BADGES: ${{ steps.organization-readme-badge-generator.outputs.badges }}
          ORG: ${{ steps.org.outputs.organization }}
        run: |
          set -euo pipefail
          {
            echo "### Organization README badges (\`${ORG}\`)"
            echo ""
            # BADGES is already markdown image syntax from the action.
            printf '%s\n' "${BADGES}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update README badge markers
        if: steps.org.outputs.skip != 'true'
        id: write
        env:
          BADGES: ${{ steps.organization-readme-badge-generator.outputs.badges }}
        run: |
          set -euo pipefail
          # Node replaces the marker window without shell-interpolating badge
          # markdown into a perl -e string (newlines / $ / / would break that).
          node <<'NODE'
          const fs = require('fs');
          const readmePath = 'README.md';
          const start = '<!-- start organization badges -->';
          const end = '<!-- end organization badges -->';
          const badges = process.env.BADGES || '';
          const text = fs.readFileSync(readmePath, 'utf8');
          const startIdx = text.indexOf(start);
          const endIdx = text.indexOf(end);
          if (startIdx < 0 || endIdx < 0 || endIdx < startIdx) {
            console.error(`README.md must contain ${start} before ${end}`);
            process.exit(1);
          }
          const before = text;
          const next =
            text.slice(0, startIdx + start.length) +
            '\n' +
            badges +
            '\n' +
            text.slice(endIdx);
          fs.writeFileSync(readmePath, next);
          const changed = before !== next;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          console.log(changed ? 'Badge markers updated.' : 'No badge content changes.');
          NODE

      - name: Commit organization readme badges
        # Only push from the default branch so a manual dispatch on a feature
        # branch cannot rewrite main. Schedule always runs on the default ref.
        if: >
          steps.org.outputs.skip != 'true'
          && steps.write.outputs.changed == 'true'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if git diff --cached --quiet; then
            echo "No organization badge changes to commit."
            exit 0
          fi
          # [skip ci] keeps badge-only docs commits from re-entering the CI fan-out.
          git commit -m "docs: update organization readme badges [skip ci]"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
