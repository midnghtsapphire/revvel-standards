name: ai-architecture-eval

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run tests
        run: python products/ai-architecture-framework/tests/test_harness.py
      - name: Schedule mock products
        run: python products/ai-architecture-framework/market_evaluator.py
      - name: Probe compute lease
        run: python products/ai-architecture-framework/cuda_mlops_wrapper.py
