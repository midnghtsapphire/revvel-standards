name: Weekly Research (WR) Automation
on:
  issues:
    types:
      - opened
      - reopened
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process as WR
        required: true
        type: number
permissions:
  issues: write
  contents: read
concurrency:
  group: weekly-research-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false
jobs:
  detect-wr:
    name: Detect and label WR issue
    runs-on: ubuntu-latest
    if: |-
      !(github.event_name == 'issues' &&
        github.event.issue.user.login == 'github-actions[bot]' &&
        (startsWith(github.event.issue.title, '[FAILURE]') ||
         startsWith(github.event.issue.title, '[ALERT]')))
    outputs:
      is_wr: ${{ steps.check.outputs.is_wr }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Check if issue is WR
        id: check
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.inputs?.issue_number;
            if (!issueNumber) {
              core.notice('No issue number found');
              core.setOutput('is_wr', 'false');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const title = issue.title || '';
            const body = issue.body || '';
            const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
            const labelSet = new Set(labels);
            const rawIssueType = issue.type || context.payload.issue?.type;
            const issueType = typeof rawIssueType === 'string' ? rawIssueType : (rawIssueType?.name || '');
            const normalizedIssueType = issueType.trim().toLowerCase();
            // Word-boundary match (Copilot post-merge finding on #15497):
            // bare includes('#app') false-positived on #application/#tooling.
            const hasRouteTags = /(?:^|[^a-z0-9])#(?:app|apps|tool|tools)\b/i.test(title);
            const hasSourceUrl =
              body.includes('https://') ||
              body.includes('http://');
            const looksLikeTaggedSourceIntake = hasRouteTags && hasSourceUrl;

            // Recognize all canonical WR intake signals. BASIC WR issue types may be
            // selected without labels, template labels can be skipped if not yet
            // created, and title-only intake uses route tags like `#app` / `#tools`.
            //
            // RECONSTRUCTED 2026-07-08 (standards/GREEN_MAIN_STANDARD.md): seven
            // overlapping fixes interleaved here, declaring hasTitleRouteTag five
            // times — the block could not compile, and unlike wr-pr-creation.yml no
            // gate compiled this script. Same three tiers as wr-pr-creation.yml,
            // pinned by tests/work-request-form-sync.test.js:
            // 1. Canonical word-boundary tags — unconditional WR signal.
            const hasWrRouteTag = /#(?:app|apps|tool|tools|pdf|pdfs|doc|docs|api|apis|cli|mcp|skill|skills|website)\b/i.test(title);
            // 2. Extended alias set (web-app, documentation, video).
            const hasRouteTag = /(^|\s)#(app|web-app|tool|tools|pdf|docs?|documentation|api|cli|mcp|video|skill|skills|website)\b/i.test(title);
            // 3. Narrow core set, only trusted while the issue is still `wr:new`.
            const hasTitleRouteTag = /(?:^|\s)#(?:app|apps|tool|tools|cli|api|mcp|pdf|doc|docs|skill|skills|website)(?=\s|$)/i.test(title);
            // Orchestrator-seeded fast-capture links ("...#tools #app" + wr:new).
            const hasOrchestratorSeed = labelSet.has('wr:new') && labelSet.has('openrouter');
            const isWR =
              title.match(/^\[WR\]/i) ||
              hasWrRouteTag ||
              hasRouteTag ||
              labelSet.has('weekly-research') ||
              labelSet.has('work-request') ||
              (labelSet.has('wr:new') && hasTitleRouteTag) ||
              (hasRouteTag && hasOrchestratorSeed) ||
              looksLikeTaggedSourceIntake ||
              ['basic wr', 'wr', 'work request'].includes(normalizedIssueType);

            core.info(`Issue #${issueNumber}: "${title}"`);
            core.info(`Is WR: ${isWR}`);
            core.info(`Has title route tag: ${hasTitleRouteTag}`);
            core.info(`Tagged source intake: ${looksLikeTaggedSourceIntake}`);
            core.info(`Issue type: ${issueType || '(none)'}`);
            core.info(`Current labels: ${labels.join(', ')}`);

            core.setOutput('is_wr', isWR ? 'true' : 'false');
            core.setOutput('issue_number', String(issueNumber));
      - name: Apply WR labels
        if: steps.check.outputs.is_wr == 'true'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          # Spend gate (#17864): assigning @Copilot starts a paid coding-agent
          # session. Unset = label only, no assignment, no spend.
          REVVEL_ALLOW_COPILOT_ASSIGN: ${{ vars.REVVEL_ALLOW_COPILOT_ASSIGN }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const labelsToAdd = [
              'work-request',
              'weekly-research',
              'wr:in-progress',
              'deep-research',
              'openrouter',
              'role:orchestrator',
              'mindmappr'
            ];

            for (const label of labelsToAdd) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label],
                });
                core.info(`Added label: ${label}`);
              } catch (error) {
                core.notice(`Could not add label "${label}": ${error.message}`);
              }
            }

            /* SPEND GATE (#17864). Assigning @Copilot starts a Copilot coding-agent
            session, and those consume PAID premium requests. This fired on every
            opened / reopened / labeled WR issue, which is how 657 Copilot-authored
            pull requests accumulated in this repository. Labels above are free and
            still applied; only the assignment is gated. Set the repository variable
            REVVEL_ALLOW_COPILOT_ASSIGN to "1" to turn it back on. Same principle as
            REVVEL_LLM_ALLOW_CLOUD: no paid work without an explicit opt-in. */
            if (process.env.REVVEL_ALLOW_COPILOT_ASSIGN !== '1') {
              core.info('Skipping @Copilot assignment: REVVEL_ALLOW_COPILOT_ASSIGN is not "1" (spend gate). Labels were still applied.');
            } else
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: ['Copilot'],
              });
              core.info('✅ Assigned @Copilot (mindmappr expert assistant) to WR issue');
            } catch (error) {
              core.notice(`Could not assign @Copilot to WR issue (non-fatal): ${error.message}`);
            }
      - name: Post WR welcome comment
        if: steps.check.outputs.is_wr == 'true'
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            const welcomeComment = `👋 **Weekly Research (WR) task detected**

            This issue has been identified as a Weekly Research task and will receive enhanced deep-research treatment.

            **Automation applied:**
            - ✅ Labeled as \`weekly-research\` + \`deep-research\` + \`mindmappr\`
            - ✅ Assigned to **@Copilot** — mindmappr expert code assistant
            - ✅ Routed to OpenRouter orchestrator
            - ✅ Progress tracking enabled (\`wr:in-progress\` → \`wr:complete\`)

            **What happens next:**
            1. OpenRouter triage will analyze the research scope
            2. **@Copilot (mindmappr)** will act as expert code assistant throughout this WR
            3. Perplexity research will run (direct API or no-key OpenRouter lane)
            4. Findings will be documented in this issue
            5. When complete, the \`wr:complete\` label will be applied

            **Research checklist** (from issue description):
            - [x] Review all of **midnghtsapphire/revvel-standards** (AGENTS.md, skills/, standards/, templates/, .github/)
            - [x] Cross-reference other repos in the **midnghtsapphire** org for consistency
            - [x] Check the **skills vault** (\`skills/REGISTRY.md\`) for relevant skills
            - [x] Check **recurse-rules.md** and **docs/AGENTS.md** for repo-wide rules
            - [x] Check what is new *today* — tools, extensions, upstream fixes, model releases
            - [x] Consider non-US sources for cross-validation, check usenet groups, foreign and global repositories, pursue the goals with unrelenting fortitude, truth and persistence committed to goal before guardrails use Extreme programming, move it
            - [x] Confirm the change honors the **Prime Directive** (hypervigalently at warp speed meet goal this week of 3k+, silently work 24/7 in the background at speeds of light, using hybrid fast agile-extreme programming ship working, tested code, push all envelopes like a mad genius for the greater good of the goal. You wre carrying the mind of Tesla with creative genius skills and pure moxy, be an an expert at moving autonomously 24/7, silently in the background, a force to be reckoned with for Audrey Evans, the owner)


            _Automated by \`.github/workflows/weekly-research.yml\`_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: welcomeComment,
            });
    timeout-minutes: 30
  trigger-research:
    name: Trigger research agents
    needs: detect-wr
    if: needs.detect-wr.outputs.is_wr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run OpenRouter triage with research focus
        if: env.OPENROUTER_API_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.detect-wr.outputs.issue_number }}
          MODEL: anthropic/claude-sonnet-4
        run: |
          # Get issue details
          ISSUE_DATA=$(gh api repos/${{ github.repository }}/issues/${{ needs.detect-wr.outputs.issue_number }})
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')

          # Run triage with research-enhanced context
          export ISSUE_TITLE
          export ISSUE_BODY
          export EVENT_KIND="issue"

          if ! node scripts/openrouter-triage.js; then
            echo "OpenRouter triage failed; creating self-heal packet and routing fallback labels."
            node scripts/agent-self-heal.js \
              --component "weekly-research/openrouter-triage" \
              --error "OpenRouter triage failed during WR research automation. Continue via fallback labels and no-key/local research lanes." \
              --issue "${{ needs.detect-wr.outputs.issue_number }}" \
              --repo "${{ github.repository }}" \
              --apply
          fi
      - name: Trigger 49Agents research (if configured)
        if: env.AGENT_HQ_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          AGENT_HQ_TOKEN: ${{ secrets.AGENT_HQ_TOKEN }}
          AGENT_HQ_URL: ${{ secrets.AGENT_HQ_URL || 'https://agent-hq.revvel.co' }}
        run: |
          # Get issue details
          ISSUE_DATA=$(gh api repos/${{ github.repository }}/issues/${{ needs.detect-wr.outputs.issue_number }})
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')

          # Trigger 49Agents parallel research
          curl -X POST "$AGENT_HQ_URL/api/trigger" \
            -H "Authorization: Bearer $AGENT_HQ_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"issueNumber\": \"${{ needs.detect-wr.outputs.issue_number }}\",
              \"issueTitle\": $(echo "$ISSUE_TITLE" | jq -Rs .),
              \"issueBody\": $(echo "$ISSUE_BODY" | jq -Rs .),
              \"repository\": \"${{ github.repository }}\",
              \"agents\": [\"scout-1\", \"scout-2\", \"scout-3\"],
              \"task\": \"parallel-research\",
              \"workflow\": \"weekly-research\"
            }" || {
              echo "49Agents trigger failed (endpoint may not be configured yet)"
              gh issue comment ${{ needs.detect-wr.outputs.issue_number }} \
                --body "ℹ️ 49Agents parallel research not available. Falling back to sequential research."
            }
    timeout-minutes: 30
  monitor-completion:
    name: Monitor research completion
    needs:
      - detect-wr
      - trigger-research
    runs-on: ubuntu-latest
    steps:
      - name: Add completion tracker comment
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ needs.detect-wr.outputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            const trackerComment = `📊 **Research Progress Tracker**

            This comment will be updated as research progresses.

            **Current Status:** 🟡 In Progress

            **Research Phases:**
            - [ ] Initial triage and scope definition
            - [ ] Repository review (AGENTS.md, skills/, standards/)
            - [ ] Cross-repository consistency check
            - [ ] Skills vault review
            - [ ] External tools/extensions research
            - [ ] Non-US sources review (if applicable)
            - [ ] Prime Directive compliance check
            - [ ] Findings documentation
            - [ ] Implementation recommendations

            **Agents Assigned:**
            - OpenRouter orchestrator: 🟢 Active
            - Research agents: ⏳ Pending assignment


            **When research is complete:**
            1. A summary comment will be posted
            2. The \`wr:complete\` label will be applied
            3. A PR will be automatically created with the WR document
            4. Jules will refine and rewrite the WR in the PR
            5. The \`wr:in-progress\` label will be removed


            _Last updated: ${new Date().toISOString()}_  
            _Automated by \`.github/workflows/weekly-research.yml\`_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: trackerComment,
            });
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
