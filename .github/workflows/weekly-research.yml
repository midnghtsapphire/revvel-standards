name: Weekly Research (WR) Automation

# Automatically routes and processes [WR] prefixed issues through a specialized
# research pipeline. WR issues receive enhanced deep-research treatment with
# parallel agent coordination and structured findings documentation.
#
# Workflow:
#   1. Detect [WR] prefix in issue title
#   2. Apply weekly-research label + routing labels
#   3. Trigger OpenRouter triage with research-focused prompt
#   4. Optionally trigger 49Agents parallel research (if configured)
#   5. Track progress with wr:in-progress / wr:complete labels
#   6. Ensure findings are documented
#
# Docs: docs/WEEKLY_RESEARCH_PROCESS.md

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process as WR"
        required: true
        type: number

permissions:
  issues: write
  contents: read

concurrency:
  group: weekly-research-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  detect-wr:
    name: Detect and label WR issue
    runs-on: ubuntu-latest
    outputs:
      is_wr: ${{ steps.check.outputs.is_wr }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Check if issue is WR
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.inputs?.issue_number;
            if (!issueNumber) {
              core.notice('No issue number found');
              core.setOutput('is_wr', 'false');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const title = issue.title || '';
            const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
            
            // Check if title starts with [WR] or if weekly-research label is already applied
            const isWR = title.match(/^\[WR\]/i) || labels.includes('weekly-research');
            
            core.info(`Issue #${issueNumber}: "${title}"`);
            core.info(`Is WR: ${isWR}`);
            core.info(`Current labels: ${labels.join(', ')}`);
            
            core.setOutput('is_wr', isWR ? 'true' : 'false');
            core.setOutput('issue_number', String(issueNumber));

      - name: Apply WR labels
        if: steps.check.outputs.is_wr == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = ${{ steps.check.outputs.issue_number }};
            const labelsToAdd = [
              'weekly-research',
              'wr:in-progress',
              'deep-research',
              'openrouter',
              'role:orchestrator'
            ];

            for (const label of labelsToAdd) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label],
                });
                core.info(`Added label: ${label}`);
              } catch (error) {
                core.notice(`Could not add label "${label}": ${error.message}`);
              }
            }

      - name: Post WR welcome comment
        if: steps.check.outputs.is_wr == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = ${{ steps.check.outputs.issue_number }};

            const welcomeComment = `👋 **Weekly Research (WR) task detected**

            This issue has been identified as a Weekly Research task and will receive enhanced deep-research treatment.

            **Automation applied:**
            - ✅ Labeled as \`weekly-research\` + \`deep-research\`
            - ✅ Routed to OpenRouter orchestrator
            - ✅ Progress tracking enabled (\`wr:in-progress\` → \`wr:complete\`)

            **What happens next:**
            1. OpenRouter triage will analyze the research scope
            2. Research agents will be assigned based on the task requirements
            3. Findings will be documented in this issue
            4. When complete, the \`wr:complete\` label will be applied

            **Research checklist** (from issue description):
            - [x] Review all of **midnghtsapphire/revvel-standards** (AGENTS.md, skills/, standards/, templates/, .github/)
            - [x] Cross-reference other repos in the **midnghtsapphire** org for consistency
            - [x] Check the **skills vault** (\`skills/REGISTRY.md\`) for relevant skills
            - [x] Check **recurse-rules.md** and **docs/AGENTS.md** for repo-wide rules
            - [x] Check what is new *today* — tools, extensions, upstream fixes, model releases
            - [x] Consider non-US sources for cross-validation
            - [x] Confirm the change honors the **Prime Directive** (ship working, tested code)


            _Automated by \`.github/workflows/weekly-research.yml\`_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: welcomeComment,
            });

  trigger-research:
    name: Trigger research agents
    needs: detect-wr
    if: needs.detect-wr.outputs.is_wr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenRouter triage with research focus
        if: env.OPENROUTER_API_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.detect-wr.outputs.issue_number }}
          MODEL: anthropic/claude-sonnet-4
        run: |
          # Get issue details
          ISSUE_DATA=$(gh api repos/${{ github.repository }}/issues/${{ needs.detect-wr.outputs.issue_number }})
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')
          
          # Run triage with research-enhanced context
          export ISSUE_TITLE
          export ISSUE_BODY
          export EVENT_KIND="issue"
          
          node scripts/openrouter-triage.js || {
            echo "OpenRouter triage failed, but continuing..."
            gh issue comment ${{ needs.detect-wr.outputs.issue_number }} \
              --body "⚠️ OpenRouter triage encountered an error. Manual research coordination may be needed."
          }

      - name: Trigger 49Agents research (if configured)
        if: env.AGENT_HQ_TOKEN != ''
        env:
          AGENT_HQ_TOKEN: ${{ secrets.AGENT_HQ_TOKEN }}
          AGENT_HQ_URL: ${{ secrets.AGENT_HQ_URL || 'https://agent-hq.revvel.co' }}
        run: |
          # Get issue details
          ISSUE_DATA=$(gh api repos/${{ github.repository }}/issues/${{ needs.detect-wr.outputs.issue_number }})
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')
          
          # Trigger 49Agents parallel research
          curl -X POST "$AGENT_HQ_URL/api/trigger" \
            -H "Authorization: Bearer $AGENT_HQ_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"issueNumber\": \"${{ needs.detect-wr.outputs.issue_number }}\",
              \"issueTitle\": $(echo "$ISSUE_TITLE" | jq -Rs .),
              \"issueBody\": $(echo "$ISSUE_BODY" | jq -Rs .),
              \"repository\": \"${{ github.repository }}\",
              \"agents\": [\"scout-1\", \"scout-2\", \"scout-3\"],
              \"task\": \"parallel-research\",
              \"workflow\": \"weekly-research\"
            }" || {
              echo "49Agents trigger failed (endpoint may not be configured yet)"
              gh issue comment ${{ needs.detect-wr.outputs.issue_number }} \
                --body "ℹ️ 49Agents parallel research not available. Falling back to sequential research."
            }

  monitor-completion:
    name: Monitor research completion
    needs: [detect-wr, trigger-research]
    runs-on: ubuntu-latest
    steps:
      - name: Add completion tracker comment
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = ${{ needs.detect-wr.outputs.issue_number }};
            
            const trackerComment = `📊 **Research Progress Tracker**

            This comment will be updated as research progresses.

            **Current Status:** 🟡 In Progress

            **Research Phases:**
            - [ ] Initial triage and scope definition
            - [ ] Repository review (AGENTS.md, skills/, standards/)
            - [ ] Cross-repository consistency check
            - [ ] Skills vault review
            - [ ] External tools/extensions research
            - [ ] Non-US sources review (if applicable)
            - [ ] Prime Directive compliance check
            - [ ] Findings documentation
            - [ ] Implementation recommendations

            **Agents Assigned:**
            - OpenRouter orchestrator: 🟢 Active
            - Research agents: ⏳ Pending assignment


            **When research is complete:**
            1. A summary comment will be posted
            2. The \`wr:complete\` label will be applied
            3. The \`wr:in-progress\` label will be removed


            _Last updated: ${new Date().toISOString()}_  
            _Automated by \`.github/workflows/weekly-research.yml\`_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: trackerComment,
            });
