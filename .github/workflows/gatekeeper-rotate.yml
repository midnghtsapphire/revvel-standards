name: Gatekeeper — Secret Rotation Check

# Runs weekly to check for overdue or upcoming secret rotations.
# Creates issues for secrets that need manual rotation.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'check'
        type: choice
        options:
          - check
          - execute

permissions:
  issues: write
  contents: read

jobs:
  rotate-check:
    name: Check rotation schedule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for overdue rotations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'check' }}"
          bash scripts/gatekeeper-rotate.sh "--${MODE}" --warn-days 7
