name: Gatekeeper — Secret Rotation Check
on:
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: false
        default: check
        type: choice
        options:
          - check
          - execute
permissions:
  issues: write
  contents: read
jobs:
  rotate-check:
    name: Check rotation schedule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for overdue rotations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: >
          # On scheduled runs INPUT_MODE is empty — default to execute (create
          issues).

          # On manual dispatch INPUT_MODE is set by the user (check or execute).

          MODE="${INPUT_MODE:-execute}"

          bash scripts/gatekeeper-rotate.sh "--${MODE}" --warn-days 7
    timeout-minutes: 30
