name: Greenfield UI Agent Audit & Health Logger

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-audit-logger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-audit-and-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.3
        with:
          node-version: "20"

      - name: Log Agent UI Audit Action
        run: |
          echo "=== GREENFIELD UI AGENT AUDIT LOG ==="
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit SHA: ${{ github.sha }}"

      # Hard gate, not a warning: the validator exits non-zero on any schema,
      # color, or dimension violation (CLAUDE.md gotcha #6 — exit codes must
      # reflect the true postcondition). If this step fails, run
      # `node scripts/validate-design-tokens.js` locally for the same
      # deterministic violation list; no network access or API keys involved.
      - name: Validate Design Tokens
        run: node scripts/validate-design-tokens.js

      # Publish the generated design-to-code handoff artifacts (CSS custom
      # properties + Tailwind theme.extend fragment) to the job summary so
      # product teams can copy them straight from the run without re-running
      # the generator locally.
      - name: Report Token & UI Build Telemetry
        run: |
          {
            echo "## Greenfield UI token telemetry"
            echo ""
            echo "### CSS custom properties"
            echo '```css'
            node scripts/validate-design-tokens.js --emit-css
            echo '```'
            echo ""
            echo "### Tailwind theme.extend fragment"
            echo '```json'
            node scripts/validate-design-tokens.js --emit-tailwind
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
