name: Greenfield UI Agent Audit & Health Logger

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ui-audit-and-health:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Log Agent UI Audit Action
        run: |
          echo "=== GREENFIELD UI AGENT AUDIT LOG ==="
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Validate Design Tokens
        run: |
          set -euo pipefail
          # A file-existence check is not validation: it passes on a token file
          # that is empty, malformed, or missing every group the consumers read
          # (CLAUDE.md gotcha 6 — assert, do not comment). Run the real
          # validator and let its exit code gate the job.
          #
          # packages/style-dictionary/tokens/tokens.json is the canonical
          # source; the root tokens.json is a legacy artifact. Validate both so
          # neither silently drifts.
          # Two token files in two different formats:
          #   tokens.json                                  {$schema,name,version,tokens}
          #   packages/style-dictionary/tokens/tokens.json {color,spacing,radii}
          # scripts/validate-design-tokens.js is written for the first (see its
          # header). Running it against the Style Dictionary source reports
          # bogus "missing name/version/tokens" errors, so it is not applied
          # there.
          pkg_tokens="packages/style-dictionary/tokens/tokens.json"
          if [ ! -f "$pkg_tokens" ]; then
            echo "::error::canonical token source $pkg_tokens is missing"
            exit 1
          fi
          # Presence-only for the Style Dictionary source: no schema validator
          # for that format exists in this repo yet. Stated plainly rather than
          # dressed up as verification — see the gap noted in the PR.
          echo "::notice::$pkg_tokens present (format not schema-validated — no validator for Style Dictionary format yet)"

          if [ -f "tokens.json" ]; then
            node scripts/validate-design-tokens.js tokens.json
          else
            echo "::error::tokens.json is missing — the design-token gate has nothing to validate"
            exit 1
          fi

      - name: Report Token & UI Build Telemetry
        run: |
          echo "Logging UI generation step metrics and token usage for audit retention."
