name: Jules PR Comment
on:
  pull_request:
    types:
      - opened
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to post the Jules summary on
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: jules-pr-comment-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true
jobs:
  comment:
    name: Post Jules session summary
    runs-on: ubuntu-latest
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Verify JULES_API_KEY is configured
        run: |
          if [ -z "${JULES_API_KEY}" ]; then
            echo "::warning::JULES_API_KEY is not set — skipping Jules PR Comment."
          else
            echo "JULES_API_KEY is configured."
          fi
      - name: Checkout
        if: env.JULES_API_KEY != ''
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Post Jules Comment
        if: env.JULES_API_KEY != ''
        uses: BeksOmega/jules-publish@v1.0.0
        continue-on-error: true
        with:
          pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          pr_description: ${{ github.event.pull_request.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
