name: Stuck WR Detector & Auto-Healer
on:
  # ── PREVIOUS APPROACH (kept for the record, intentionally not removed) ──────
  # Originally this healer relied ONLY on the cron sweep below. That routine was
  # added back when OpenRouter was live and many agents worked in PARALLEL on
  # the same WRs at once — label churn and racing runs meant a WR could get its
  # PR-creation run cancelled/skipped, so a periodic sweep was the safety net
  # that caught those errors. It worked, but it leaned on two fragile things:
  #   1. label *timing* — a WR is only "ready" once research:complete lands, and
  #      the event that set it could race the sweep; and
  #   2. GitHub's schedule — which is throttled under load (observed ~50–70 min
  #      between */30 runs), so a just-completed WR could sit ~1h with no PR
  #      (this is exactly what stranded WR #14545).
  #
  # ── NEW APPROACH (why it's better) ─────────────────────────────────────────
  # We still keep the cron as a backstop, but we no longer DEPEND on it for
  # timeliness, and we no longer depend on label-churn events for timing. The
  # `workflow_run` trigger fires the sweep the moment research actually
  # completes, so a ready WR with no PR is healed within minutes regardless of
  # how badly GitHub is throttling cron. Labels (research:complete/wr:complete)
  # are still used — but only as a *completion signal* (a state marker), never
  # as the timing mechanism. That's the "don't rely on labels" point: relying on
  # a label to EXIST is fine; relying on label-event timing + a throttled cron
  # is what burned us.
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: ["Research Engine Orchestrator"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: Only consider WRs created within the last N hours (default 168 = 7 days).
        required: false
        type: number
        default: 168
      dry_run:
        description: If true, log what would be done but don't retrigger or escalate.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write
concurrency:
  group: stuck-wr-detector
  cancel-in-progress: false
jobs:
  scan:
    name: Scan & heal stuck Work Requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect stuck WRs and heal
        uses: actions/github-script@v9.0.0
        env:
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || 168 }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        with:
          script: |
            const path = require('path');
            const {
              findAssociatedPr,
              getIssueBaseTitle,
              DEFAULT_MIN_STUCK_AGE_MS,
            } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'stuck-wr-detector.js'));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const maxAgeMs = parseInt(process.env.MAX_AGE_HOURS, 10) * 3600 * 1000;
            const dryRun = process.env.DRY_RUN === 'true';
            const cutoff = Date.now() - maxAgeMs;
            // PREVIOUS: const minStuckAgeMs = 15 * 60 * 1000;  // 15 minutes
            // The 15-min grace made sense when the cron was the only sweeper —
            // give the parallel-agent path time to win before re-triggering.
            // But combined with throttled cron it left a ~1h dead zone (#14545).
            // Now that `workflow_run` sweeps right after research completes, a
            // 5-min grace is plenty of headroom for the normal path to win the
            // race first, and the dead zone is gone. Threshold is a shared SSOT
            // in scripts/stuck-wr-detector.js so the script and workflow agree.
            const minStuckAgeMs = DEFAULT_MIN_STUCK_AGE_MS;  // 5 min

            core.info(`Scanning open work-request issues younger than ${process.env.MAX_AGE_HOURS}h.`);
            core.info(`Dry-run mode: ${dryRun}`);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo,
              state: 'open',
              labels: 'work-request',
              per_page: 100,
            });
            core.info(`Found ${issues.length} open work-request issues.`);

            const stuck = [];
            for (const issue of issues) {
              if (issue.pull_request) continue;  // already a PR, not an issue
              const labelNames = new Set((issue.labels || []).map(l => typeof l === 'string' ? l : l.name));
              if (labelNames.has('duplicate')) {
                core.info(`#${issue.number}: duplicate issue; skipping stuck-WR retries.`);
                continue;
              }
              const readyForWrPr =
                labelNames.has('wr:complete') ||
                labelNames.has('research:complete');
              if (!readyForWrPr) {
                core.info(`#${issue.number}: WR not ready for PR creation (missing wr:complete/research:complete).`);
                continue;
              }
              const ageMs = Date.now() - new Date(issue.created_at).getTime();
              if (ageMs < minStuckAgeMs) continue;     // give it time to run normally
              if (ageMs > maxAgeMs) continue;          // ignore ancient WRs

              // Look for an associated PR using deterministic workflow signals:
              // the issue-specific branch name, a body reference to this issue,
              // or the PR number posted by wr-pr-creation.yml on the issue.
              const baseTitle = getIssueBaseTitle(issue);
              if (!baseTitle) continue;
              const associatedPr = await findAssociatedPr({ github, owner, repo, issue, core });
              if (associatedPr) {
                core.info(`#${issue.number}: PR exists (${associatedPr.html_url || associatedPr.url}); not stuck.`);
                continue;
              }

              stuck.push(issue);
            }

            core.info(`Identified ${stuck.length} stuck WR(s).`);
            if (stuck.length === 0) return;

            // Helpers -------------------------------------------------------
            function attemptCount(issue) {
              const m = (issue.labels || [])
                .map(l => (typeof l === 'string' ? l : l.name))
                .find(n => n && n.startsWith('wr:retrigger-attempts-'));
              return m ? parseInt(m.replace('wr:retrigger-attempts-', ''), 10) || 0 : 0;
            }
            async function setAttemptLabel(issue, n) {
              for (const lbl of issue.labels || []) {
                const name = typeof lbl === 'string' ? lbl : lbl.name;
                if (name && name.startsWith('wr:retrigger-attempts-')) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: issue.number, name,
                    });
                  } catch (_) { /* ignore 404 */ }
                }
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number,
                labels: [`wr:retrigger-attempts-${n}`],
              });
            }
            async function addLabelsBestEffort(issueNumber, labels) {
              if (!labels || labels.length === 0) return;
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber, labels,
                });
                core.info(`#${issueNumber}: added labels ${labels.join(', ')}`);
                return;
              } catch (error) {
                core.notice(`#${issueNumber}: bulk label add failed, retrying per-label: ${error.message}`);
              }
              for (const label of labels) {
                try {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: issueNumber, labels: [label],
                  });
                  core.info(`#${issueNumber}: added label ${label}`);
                } catch (error) {
                  core.notice(`#${issueNumber}: could not add label "${label}": ${error.message}`);
                }
              }
            }
            async function dispatchWorkflowBestEffort(workflowId, inputs = {}) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: workflowId,
                  ref: 'main',
                  inputs,
                });
                core.notice(`Dispatched ${workflowId}${inputs.issue_number ? ` for #${inputs.issue_number}` : ''}.`);
                return true;
              } catch (error) {
                core.warning(`Could not dispatch ${workflowId}: ${error.message}`);
                return false;
              }
            }
            async function upsertEscalationComment(issueNumber, body) {
              const marker = `<!-- stuck-wr-agent-escalation:${issueNumber} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issueNumber, per_page: 100,
              });
              const existing = comments.find(comment => comment.body && comment.body.includes(marker));
              const markedBody = `${marker}\n${body}`;

              if (existing) {
                try {
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: existing.id, body: markedBody,
                  });
                } catch (error) {
                  core.warning(`#${issueNumber}: failed to update escalation comment: ${error.message}`);
                }
                return;
              }

              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber, body: markedBody,
                });
              } catch (error) {
                core.warning(`#${issueNumber}: failed to create escalation comment: ${error.message}`);
              }
            }

            const MAX_ATTEMPTS = 3;
            for (const issue of stuck) {
              const attempts = attemptCount(issue);
              core.info(`#${issue.number}: stuck (attempts=${attempts}).`);
              if (dryRun) {
                core.info(`  [dry-run] would ${attempts < MAX_ATTEMPTS ? 'retrigger' : 'escalate'}.`);
                continue;
              }

              if (attempts < MAX_ATTEMPTS) {
                // Retrigger wr-pr-creation via workflow_dispatch.
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo,
                    workflow_id: 'wr-pr-creation.yml',
                    ref: 'main',
                    inputs: { issue_number: String(issue.number) },
                  });
                  await setAttemptLabel(issue, attempts + 1);
                  
                  // Poll for workflow run with exponential backoff (5s, 10s, 20s, 30s - 40s capped at 30s)
                  let workflowStarted = false;
                  let statusNote = '';
                  
                  for (let attempt = 0; attempt < 4; attempt++) {
                    const delay = Math.min(5000 * Math.pow(2, attempt), 30000);  // 5s, 10s, 20s, 30s (40s capped)
                    await new Promise(resolve => setTimeout(resolve, delay));
                    
                    // Check if workflow run was created for this specific issue
                    const recentRuns = await github.rest.actions.listWorkflowRuns({
                      owner, repo,
                      workflow_id: 'wr-pr-creation.yml',
                      per_page: 10,
                    });
                    
                    const justTriggered = recentRuns.data.workflow_runs.find(run => {
                      const runAge = Date.now() - new Date(run.created_at).getTime();
                      return runAge < 60000;  // Within last minute
                    });
                    
                    if (justTriggered) {
                      workflowStarted = true;
                      statusNote = `\n\n**Workflow Status:** Started (run #${justTriggered.run_number}, status: ${justTriggered.status})`;
                      core.info(`Workflow detected after ${delay/1000}s`);
                      break;
                    }
                    
                    if (attempt < 3) {
                      core.info(`Workflow not detected, checking again in ${delay/1000}s...`);
                    }
                  }
                  
                  if (!workflowStarted) {
                    statusNote = '\n\n**⚠️ Warning:** No workflow run detected within 60 seconds. The workflow may have failed to start due to:\n- Invalid workflow syntax\n- Missing permissions\n- GitHub Actions API issues';
                  }
                  
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issue.number,
                    body: [
                      `🔁 **Stuck-WR auto-healer:** retriggering WR PR Creation (attempt ${attempts + 1}/${MAX_ATTEMPTS}).`,
                      ``,
                      `This issue has the \`work-request\` label but no associated PR was found. The detector dispatched \`.github/workflows/wr-pr-creation.yml\` against this issue.`,
                      statusNote,
                      ``,
                      `If after ${MAX_ATTEMPTS} retriggers no PR appears, the detector will escalate by opening a tracking issue with diagnostic info.`,
                      ``,
                      `_See [\`stuck-wr-detector.yml\`](.github/workflows/stuck-wr-detector.yml) for behavior._`,
                    ].join('\n'),
                  });
                  core.notice(`Retriggered WR PR creation on #${issue.number} (attempt ${attempts + 1}).`);
                } catch (e) {
                  core.error(`Failed to retrigger #${issue.number}: ${e.message}`);
                }
              } else {
                // Escalate.
                const trackingTitle = `[AUTO-ERROR] WR #${issue.number} stuck after ${MAX_ATTEMPTS} retriggers — no PR created`;
                const originalComments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: issue.number, per_page: 100, sort: 'created', direction: 'desc',
                });
                const recentFailureComments = originalComments
                  .filter(comment => comment.body && comment.body.includes('WR PR Creation Failed'))
                  .slice(0, 3)
                  .reverse()
                  .map(comment => {
                    const runMatch = comment.body.match(/actions\/runs\/(\d+)/);
                    const runId = runMatch ? runMatch[1] : 'unknown';
                    return `- ${comment.created_at}: WR PR Creation failed (run ${runId})`;
                  });
                const failureEvidence = recentFailureComments.length
                  ? recentFailureComments.join('\n')
                  : '- No failure notification comments were found on the original issue.';

                const trackingBody = [
                  `## Stuck Work Request`,
                  ``,
                  `Issue: #${issue.number} — ${issue.title}`,
                  `Created: ${issue.created_at}`,
                  `Age: ${Math.round((Date.now() - new Date(issue.created_at).getTime()) / 3600000)}h`,
                  `Labels: ${(issue.labels || []).map(l => typeof l === 'string' ? l : l.name).join(', ')}`,
                  ``,
                  `### What was tried`,
                  ``,
                  `The stuck-WR detector dispatched \`wr-pr-creation.yml\` on this issue ${MAX_ATTEMPTS} times via \`workflow_dispatch\`, but no PR was created.`,
                  ``,
                  `### Recent failure evidence`,
                  ``,
                  failureEvidence,
                  ``,
                  `### Likely root causes (in order)`,
                  ``,
                  `1. **WR template path drift** — \`wr-pr-creation.yml\` must point at an existing template such as \`wr/WR_TEMPLATE_FULL.md\`.`,
                  `2. **Branch or PR creation collision** — a retry may be reusing an existing branch after a partial failure.`,
                  `3. **Missing required secret or GitHub permission** — \`JULES_API_KEY\`, pull-request write, or contents write.`,
                  `4. **Required-Bundle / classifier parsing error** — check \`wr-auto-classify\` logs for the issue.`,
                  ``,
                  `### Automatic handling now routed`,
                  ``,
                  `This tracking issue is labelled for agent troubleshooting: \`agent-fallback\`, \`auto-fix\`, and \`triage:new\`.`,
                  `The detector also dispatches \`agent-fallback.yml\` with \`prefer_agent=openrouter\` so OpenRouter can diagnose and patch the automation failure.`,
                  ``,
                  `### Manual fallback if automation cannot patch it`,
                  ``,
                  `- Open the [latest \`WR PR Creation\` runs](${context.serverUrl}/${owner}/${repo}/actions/workflows/wr-pr-creation.yml) and inspect the failed step.`,
                  `- The detector keeps the exhausted retry label to prevent retry-loop resets and re-dispatches \`wr-pr-creation.yml\` once so fixed WRs can recover.`,
                  ``,
                  `_Opened automatically by [\`stuck-wr-detector.yml\`](.github/workflows/stuck-wr-detector.yml). Closes when issue #${issue.number} gets a PR._`,
                ].join('\n');

                // Reuse one tracking issue per stuck WR.
                const search = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${repo} is:issue is:open label:auto-error label:wr-stuck "WR #${issue.number} stuck" in:title`,
                  per_page: 1,
                });
                let trackingIssueNumber;
                if (search.data.items.length > 0) {
                  await github.rest.issues.update({
                    owner, repo,
                    issue_number: search.data.items[0].number,
                    title: trackingTitle,
                    body: trackingBody,
                  });
                  trackingIssueNumber = search.data.items[0].number;
                  core.notice(`Updated tracking issue #${trackingIssueNumber}.`);
                } else {
                  const created = await github.rest.issues.create({
                    owner, repo,
                    title: trackingTitle,
                    body: trackingBody,
                    labels: ['auto-error', 'wr-stuck', 'priority-p0'],
                  });
                  trackingIssueNumber = created.data.number;
                  core.notice(`Opened tracking issue #${trackingIssueNumber} for stuck WR #${issue.number}.`);
                }

                if (trackingIssueNumber) {
                  await addLabelsBestEffort(trackingIssueNumber, [
                    'auto-error',
                    'wr-stuck',
                    'priority-p0',
                    'triage:new',
                    'agent-fallback',
                    'auto-fix',
                  ]);
                }

                await addLabelsBestEffort(issue.number, [
                  'wr-stuck',
                  'needs-action',
                  'agent-fallback',
                  'auto-fix',
                ]);

                const agentDispatchOk = trackingIssueNumber
                  ? await dispatchWorkflowBestEffort('agent-fallback.yml', {
                      issue_number: String(trackingIssueNumber),
                      prefer_agent: 'openrouter',
                    })
                  : false;
                const triageDispatchOk = await dispatchWorkflowBestEffort('openrouter-triage.yml');
                const wrRetryDispatchOk = await dispatchWorkflowBestEffort('wr-pr-creation.yml', {
                  issue_number: String(issue.number),
                });

                await upsertEscalationComment(issue.number, [
                  `🧯 **Stuck-WR escalated to agent troubleshooting**`,
                  ``,
                  `The detector exhausted ${MAX_ATTEMPTS}/${MAX_ATTEMPTS} WR PR Creation retriggers and found no associated PR.`,
                  trackingIssueNumber ? `**Tracking issue:** #${trackingIssueNumber}` : `**Tracking issue:** unavailable; issue creation/update failed.`,
                  ``,
                  `**Automatic routing performed:**`,
                  `- Added \`wr-stuck\`, \`needs-action\`, \`agent-fallback\`, and \`auto-fix\` to this WR issue where labels exist.`,
                  `- Routed the tracking issue to \`agent-fallback.yml\` with OpenRouter preferred: ${agentDispatchOk ? 'dispatched' : 'dispatch failed or unavailable'}.`,
                  `- Nudged \`openrouter-triage.yml\`: ${triageDispatchOk ? 'dispatched' : 'dispatch failed or unavailable'}.`,
                  `- Kept the exhausted retry label to avoid infinite retry loops and re-dispatched \`wr-pr-creation.yml\`: ${wrRetryDispatchOk ? 'dispatched' : 'dispatch failed or unavailable'}.`,
                  ``,
                  `If this retry still fails, the detector will keep the issue in escalated handling and continue updating the troubleshooting issue.`,
                  ``,
                  `_Automated by \`.github/workflows/stuck-wr-detector.yml\`._`,
                ].join('\n'));
              }
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
