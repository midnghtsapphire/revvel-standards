name: WR-4600 Watchtower

on:
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grounding gate (self-test)
        run: python tools/harvest.py --self-test

      - name: Harvest
        id: harvest
        run: |
          mkdir -p snapshots
          python tools/harvest.py --out snapshots/ | tee harvest-out.json
          echo "hits=$(python -c 'import json;print(json.load(open(\"harvest-out.json\"))[\"triage_hits\"])')" >> $GITHUB_OUTPUT

      - name: Commit snapshot (quiet days included)
        run: |
          git config user.name  "watchtower-bot"
          git config user.email "watchtower-bot@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "no snapshot delta"
          else
            git commit -m "chore(watchtower): daily snapshot"
            git push
          fi

      - name: Summon triage issue (only on HARM/FLICKER/OCULAR)
        if: steps.harvest.outputs.hits != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = JSON.parse(fs.readFileSync('harvest-out.json','utf8'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[watchtower] ${out.triage_hits} HARM/FLICKER/OCULAR row(s) — ${new Date().toISOString().slice(0,10)}`,
              body:  `Snapshot: \`${out.snapshot}\`\n\nTriage taxonomy: HARM / FLICKER / OCULAR.\n\nSee snapshot JSON for row-level detail.`,
              labels: ['watchtower','triage']
            });
