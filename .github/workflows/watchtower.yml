name: WR-4600 Watchtower
# Daily PBM literature/adverse-event harvest for the Photon Bench.
# Reports DELTA, not "breakthrough". A quiet day is a success and still commits
# a snapshot — proving you looked and found nothing is the point of a monitor.
# An issue is summoned ONLY on a HARM/FLICKER/OCULAR row, never on a schedule.
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: "17 6 * * *"   # 06:17 UTC — off-peak, dodges the :00 stampede
  workflow_dispatch:
    inputs:
      shard:
        description: Run a single shard (e.g. adverse); blank runs all due shards
        type: string
        default: ""
      all:
        description: Run every shard, ignoring cadence
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: watchtower
  cancel-in-progress: false
jobs:
  harvest:
    name: Harvest and snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to a full commit SHA (blanket policy). persist-credentials:false
      # so no token is written to .git/config; the push below authenticates
      # explicitly with GITHUB_TOKEN via env (never interpolated into the shell).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # ubuntu-latest ships Python 3.12; harvest.py is stdlib-only, so no
      # setup-python action (avoids an unpinned third-party reference).
      - name: Self-test the harvester (grounding gate — no network)
        run: python3 tools/harvest.py --self-test
      - name: Run harvest
        id: run
        # Inputs routed through env, never interpolated into the shell body
        # (zizmor template-injection: untrusted ${{ }} must not reach `run:`).
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          INPUT_ALL: ${{ github.event.inputs.all }}
          INPUT_SHARD: ${{ github.event.inputs.shard }}
        run: |
          if [ "$INPUT_ALL" = "true" ]; then
            SUMMARY=$(python3 tools/harvest.py --all | tail -1)
          elif [ -n "$INPUT_SHARD" ]; then
            SUMMARY=$(python3 tools/harvest.py --shard "$INPUT_SHARD" | tail -1)
          else
            SUMMARY=$(python3 tools/harvest.py | tail -1)
          fi
          {
            echo "summary=$SUMMARY"
            echo "flagged=$(printf '%s' "$SUMMARY" | python3 -c 'import sys,json; print(json.load(sys.stdin)["flagged"])')"
          } >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit snapshot (quiet days included)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "wr4600-watchtower[bot]"
          git config user.email "watchtower@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "No snapshot change to commit."
          else
            git commit -m "chore(watchtower): daily snapshot [skip ci]"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"
          fi
      # Summon a triage issue ONLY on a HARM/FLICKER/OCULAR row, via the
      # pre-installed gh CLI (no third-party action to pin). The label is
      # ensured first so a missing label can't fail the step.
      - name: Summon — open ONE triage issue only on a flagged row
        if: steps.run.outputs.flagged != '0' && steps.run.outputs.flagged != ''
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          FLAGGED: ${{ steps.run.outputs.flagged }}
        run: |
          gh label create watchtower --color 5319e7 --description "WR-4600 Watchtower summons" 2>/dev/null || true
          gh issue create \
            --title "Watchtower: ${FLAGGED} flagged row(s)" \
            --label watchtower --label triage \
            --body "The Watchtower flagged **${FLAGGED}** row(s) touching a veto class (HARM / FLICKER / OCULAR). These are summonses, not verdicts — a regex noticed a word; a human decides. See \`data/latest.json\` -> \`flagged\` for the rows and their live URLs."
