# SELF-HEALING AGENT
# - Deeply researches current state
# - Identifies broken areas
# - Implements fixes automatically
# - Logs healing process

name: Self-Healing Agent

on:
  # Run daily to check system health
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  # Can be manually triggered
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # self-heal job re-labels stuck issues + files healing journal
  actions: write       # self-heal job re-runs failed workflow runs
  pull-requests: write # update-main job adds auto-merge label to qualifying PRs

env:
  # Without this, every `gh` call runs unauthenticated and fails. Prefer the
  # ADMIN PAT (so healing actions can cascade to downstream workflows) and fall
  # back to the built-in token.
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  # No job here runs actions/checkout, so gh has no local git remote to infer
  # the repo from. GH_REPO targets every gh command at the right repo and
  # avoids "fatal: not a git repository".
  GH_REPO: ${{ github.repository }}

jobs:
  # PHASE 1: RESEARCH - Deep dive into system state
  research-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      broken_areas: ${{ steps.scan.outputs.broken }}
      system_health: ${{ steps.health.outputs.status }}
    steps:
      - name: Check GitHub Actions status
        id: actions
        run: |
          # Get recent workflow runs
          gh api repos/midnghtsapphire/revvel-standards/actions/runs \
            --jq '.workflow_runs[:10] | .[] | {name: .name, status: .status, conclusion: .conclusion}' 2>/dev/null > /tmp/actions.json
          
          FAILED=0
          while read -r line; do
            if echo "$line" | grep -q '"failure"'; then
              FAILED=$((FAILED+1))
            fi
          done < /tmp/actions.json
          
          echo "failed_count=$FAILED" >> $GITHUB_OUTPUT
          echo "Total recent runs: $(wc -l < /tmp/actions.json)"

      - name: Check for stuck issues
        id: stuck
        run: |
          STUCK=$(gh api repos/midnghtsapphire/revvel-standards/issues \
            --state open --jq '.[] | select(.labels[].name | contains("stuck") or contains("checking")) | .number' 2>/dev/null | wc -w)
          
          echo "stuck_count=$STUCK" >> $GITHUB_OUTPUT
          echo "Found $STUCK stuck issues"

      - name: Check agent health
        id: agents
        run: |
          # Check if key workflows exist
          WORKFLOWS=(
            "agent-dispatcher"
            "issue-state-machine"
            "stuck-check-watchdog"
            "api-rate-limit-handler"
          )
          
          MISSING=()
          for wf in "${WORKFLOWS[@]}"; do
            if ! gh api repos/midnghtsapphire/revvel-standards/actions/workflows \
              --jq ".workflows[] | select(.name | contains(\"$wf\"))" 2>/dev/null | grep -q .; then
              MISSING+=("$wf")
            fi
          done
          
          if [[ ${#MISSING[@]} -eq 0 ]]; then
            echo "agent_workflows=healthy" >> $GITHUB_OUTPUT
          else
            echo "agent_workflows=missing: ${MISSING[*]}" >> $GITHUB_OUTPUT
          fi

      - name: Scan for broken areas
        id: scan
        run: |
          BROKEN=()
          
          ACTIONS_FAILED=${{ steps.actions.outputs.failed_count }}
          if [[ "$ACTIONS_FAILED" -gt 3 ]]; then
            BROKEN+=("GitHub Actions: $ACTIONS_FAILED recent failures")
          fi
          
          STUCK=${{ steps.stuck.outputs.stuck_count }}
          if [[ "$STUCK" -gt 5 ]]; then
            BROKEN+=("Stuck issues: $STUCK open")
          fi
          
          AGENTS=${{ steps.agents.outputs.agent_workflows }}
          if ! echo "$AGENTS" | grep -q "healthy"; then
            BROKEN+=("Missing workflows: $AGENTS")
          fi
          
          echo "broken=$(printf '; ' "${BROKEN[@]}")" >> $GITHUB_OUTPUT

      - name: Compile system health
        id: health
        run: |
          BROKEN="${{ steps.scan.outputs.broken }}"
          if [[ -z "$BROKEN" ]] || [[ "$BROKEN" == "" ]]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "✅ System healthy - no action needed"
          else
            echo "status=needs-healing" >> $GITHUB_OUTPUT
            echo "⚠️ System needs healing:"
            echo "$BROKEN"
          fi

  # PHASE 2: SELF-HEAL - Implement fixes
  self-heal:
    needs: research-state
    if: needs.research-state.outputs.system_health == 'needs-healing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Heal stuck issues
        run: |
          BROKEN="${{ needs.research-state.outputs.broken }}"
          
          if echo "$BROKEN" | grep -q "Stuck issues"; then
            echo "=== HEALING STUCK ISSUES ==="
            # Label stuck issues for human review
            gh api repos/midnghtsapphire/revvel-standards/issues \
              --state open --jq '.[] | select(.labels[].name | contains("wr:checking")) | .number' | while read -r num; do
              gh api repos/midnghtsapphire/revvel-standards/issues/$num/labels \
                -X DELETE -d '{"labels":["wr:check-failed"]}' 2>/dev/null
              echo "Labeled issue #$num as check-failed"
            done
          fi

      - name: Heal failed workflows
        run: |
          if echo "${{ needs.research-state.outputs.broken }}" | grep -q "GitHub Actions"; then
            echo "=== HEALING FAILED WORKFLOWS ==="
            # Re-run failed workflows
            gh api repos/midnghtsapphire/revvel-standards/actions/runs \
              --jq '.workflow_runs[] | select(.conclusion == "failure") | .id' | head -3 | while read -r id; do
              gh api repos/midnghtsapphire/revvel-standards/actions/runs/$id/rerun \
                -X POST 2>/dev/null && echo "Re-ran run #$id"
            done
          fi

      - name: Log healing
        run: |
          echo "=== SELF-HEALING LOG ==="
          echo "Time: $(date)"
          echo "Broken areas: ${{ needs.research-state.outputs.broken }}"
          echo "Actions taken: Labeled stuck issues, re-ran failed workflows"

          BODY=$(cat <<EOF
          ## Healing Report

          **Time:** $(date)
          **System was:** ${{ needs.research-state.outputs.system_health }}
          **Issues found:** ${{ needs.research-state.outputs.broken }}

          ### Actions Taken
          1. Labeled stuck issues as check-failed
          2. Re-ran failed workflows

          ### Next Steps
          - Monitor for 1 hour
          - If still failing, escalate to human

          This issue auto-closes in 24 hours.
          EOF
          )

          # Create healing journal entry
          gh issue create \
            --title "[SELF-HEAL] System healing completed" \
            --body "$BODY" \
            --label "self-healing,automation" 2>/dev/null || echo "No new issue created"

  # PHASE 3: UPDATE MAIN — advance approved+green PRs by enabling auto-merge
  # Runs independently of PHASE 2 (does not require needs-healing condition).
  # Playbook: docs/playbooks/branch-update-guide.md
  # Manual-processes ref: docs/playbooks/wr-manual-processes.md (§14)
  update-main:
    # Run after research-state so we know system health, but always attempt the
    # update pass — PR advancement should happen even when the system is healthy.
    needs: research-state
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Advance approved and green PRs toward main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            // ---------------------------------------------------------------
            // WHAT THIS DOES
            // Lists all open, non-draft PRs. For each one it checks:
            //   1. At least one approving review.
            //   2. All required commit status checks are passing (green).
            //   3. The PR does not carry a "won't-merge" label.
            //   4. The PR is not in draft state.
            // Qualifying PRs get the "auto-merge" label added, which triggers
            // auto-merge.yml to squash-merge them into main.
            //
            // GOOD: zero-click merges for approved backlog, consistent squash.
            // RISK: merges PRs you forgot to hold — always use "won't-merge" on
            //       PRs you are not ready to land.
            //
            // Full trade-off discussion: docs/playbooks/branch-update-guide.md
            // ---------------------------------------------------------------

            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Fetch all open PRs (paginated to catch repos with many PRs).
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            let advanced = 0;
            let skipped  = 0;

            for (const pr of prs) {
              const num    = pr.number;
              const labels = pr.labels.map(l => l.name);

              // Skip drafts — they cannot be auto-merged.
              if (pr.draft) {
                core.info(`PR #${num}: SKIP — draft`);
                skipped++;
                continue;
              }

              // Skip PRs explicitly held back.
              if (labels.includes("won't-merge")) {
                core.info(`PR #${num}: SKIP — "won't-merge" label present`);
                skipped++;
                continue;
              }

              // Already queued — don't add the label twice.
              if (labels.includes('auto-merge')) {
                core.info(`PR #${num}: SKIP — already has "auto-merge" label`);
                skipped++;
                continue;
              }

              // Check for at least one approving review.
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: num,
              });
              const approved = reviews.some(r => r.state === 'APPROVED');
              if (!approved) {
                core.info(`PR #${num}: SKIP — no approving review`);
                skipped++;
                continue;
              }

              // Check that no changes have been requested since the last approval.
              const changesRequested = reviews.some(r => r.state === 'CHANGES_REQUESTED');
              if (changesRequested) {
                core.info(`PR #${num}: SKIP — changes requested`);
                skipped++;
                continue;
              }

              // Check combined commit status for the head SHA.
              const sha = pr.head.sha;
              const { data: statusData } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: sha,
              });

              // Also check check-runs (GitHub Actions show up here).
              const checkRuns = await github.paginate(
                github.rest.checks.listForRef,
                { owner, repo, ref: sha, per_page: 100 }
              );

              // A PR is "green" when:
              //  - combined commit status is "success" or "pending" (no explicit failures), AND
              //  - no check-run is in a failed/action_required/cancelled/timed_out state.
              const combinedOk = ['success', 'pending'].includes(statusData.state);
              const badRuns = checkRuns.filter(
                r => r.status === 'completed' &&
                     ['failure', 'action_required', 'cancelled', 'timed_out'].includes(r.conclusion)
              );

              if (!combinedOk || badRuns.length > 0) {
                core.info(
                  `PR #${num}: SKIP — CI not green ` +
                  `(combined=${statusData.state}, failed_runs=${badRuns.length})`
                );
                skipped++;
                continue;
              }

              // Check for merge conflicts.
              const { data: prDetail } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: num,
              });
              if (prDetail.mergeable === false) {
                core.warning(
                  `PR #${num}: SKIP — conflicts with main. ` +
                  `See docs/playbooks/branch-update-guide.md to resolve.`
                );
                skipped++;
                continue;
              }

              // All checks passed — add auto-merge label.
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: num,
                  labels: ['auto-merge'],
                });
                core.notice(
                  `PR #${num} ("${pr.title}"): ✅ Added "auto-merge" label — ` +
                  `will squash-merge once branch protection allows.`
                );
                advanced++;
              } catch (err) {
                core.warning(`PR #${num}: Could not add label — ${err.message}`);
              }
            }

            core.notice(
              `update-main complete: ${advanced} PR(s) advanced, ` +
              `${skipped} skipped. ` +
              `See docs/playbooks/branch-update-guide.md for trade-offs.`
            );
