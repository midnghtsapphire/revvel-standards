# =============================================================================
# MARKDOWN IMAGE ALT-TEXT CHECKER (WR #16270)
# =============================================================================
#
# PURPOSE:
#   Flag markdown images that ship without inline alt-text (`![](url)` instead
#   of `![descriptive alt](url)`). Alt-text is required for accessibility and
#   helps SEO.
#
# TWO LANES:
#   1. Local gate (authoritative) — scripts/markdown-image-alt-text-checker.js
#      walks the checkout, skips generated noise (transcripts, wr/issues, …),
#      and fails the job on empty-alt images. Fast enough for every PR.
#   2. Marketplace action — ruthtxh/markdown-image-alt-text-checker@v1, pinned
#      to the v1 commit SHA. The action walks the full git tree via the GitHub
#      API, which is too heavy for this monorepo on every PR, so it only runs
#      on workflow_dispatch (manual / scheduled-style audits). Optional Azure
#      Computer Vision inputs can be filled later for alt-text suggestions.
#
# THIRD-PARTY RISK:
#   ruthtxh/* is a single-author publisher; last release was 2023-04-21 and the
#   action still declares runs.using: node16. We pin the full commit SHA, force
#   Node 24 via FORCE_JAVASCRIPT_ACTIONS_TO_NODE24, and keep the local script as
#   the PR-blocking gate so an abandoned upstream cannot stick a required check
#   (lesson from sanjay3290/jules-pr-reviewer — docs/THIRD_PARTY_ACTION_AUDIT.md).
#
# REQUIRED PERMISSIONS:
#   contents: read   — checkout + (marketplace) tree/content API reads
#   checks: write    — marketplace action posts a check-run with annotations
#
# OPTIONAL SECRETS (Azure Computer Vision suggestions — not required):
#   AZURE_COMPUTER_VISION_KEY
#   AZURE_COMPUTER_VISION_ENDPOINT  (e.g. https://NAME.cognitiveservices.azure.com)
#
# =============================================================================

name: Markdown Image Alt-text Checker

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/markdown-image-alt-text-checker.js"
      - ".github/workflows/markdown-image-alt-text-checker.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/markdown-image-alt-text-checker.js"
      - ".github/workflows/markdown-image-alt-text-checker.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: markdown-image-alt-text-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Marketplace action still declares node16; force the supported runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check markdown image alt-text
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # Pin full SHA (CLAUDE.md gotcha #8). Comment keeps the human tag.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Authoritative gate for PRs/pushes. Emits ::warning annotations on hits.
      - name: Local markdown image alt-text scan
        run: node scripts/markdown-image-alt-text-checker.js

      # Marketplace action from the WR. Manual-only so the API tree walk does not
      # thrash this monorepo on every markdown PR. SHA pin = v1 tag
      # (a30c7afd02e2af7048f4e84f06e2f422052e2153).
      - name: Markdown Image Alt-text Checker
        if: github.event_name == 'workflow_dispatch'
        uses: ruthtxh/markdown-image-alt-text-checker@a30c7afd02e2af7048f4e84f06e2f422052e2153 # v1
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          sha: ${{ github.sha }}
          key: ${{ secrets.AZURE_COMPUTER_VISION_KEY }}
          endpoint: ${{ secrets.AZURE_COMPUTER_VISION_ENDPOINT }}
