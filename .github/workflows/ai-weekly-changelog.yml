name: AI Weekly Changelog
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: 0 6 * * MON
  workflow_dispatch:
    inputs:
      days_back:
        description: Days to look back for commits (1-365)
        type: string
        required: false
        default: "7"
      model:
        description: OpenRouter model ID
        type: string
        required: false
        default: openai/gpt-5-mini
      language:
        description: Output language
        type: choice
        required: false
        default: English
        options:
          - English
          - Dutch
          - German
          - French
          - Spanish
      extended:
        description: Extended analysis (file changes, statistics)
        type: boolean
        required: false
        default: false
      force:
        description: Force update existing week entry
        type: boolean
        required: false
        default: false
      dry_run:
        description: Preview without committing
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: ai-weekly-changelog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changelog:
    name: Generate weekly changelog
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set. See docs/OPENROUTER_ASSIGNEE_PROCESS.md."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi
      - name: Generate Weekly Changelog
        if: env.OPENROUTER_API_KEY != ''
        uses: fridzema/ai-weekly-changelog-action@0.1.3
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          days_back: ${{ inputs.days_back || '7' }}
          model: ${{ inputs.model || 'openai/gpt-5-mini' }}
          language: ${{ inputs.language || 'English' }}
          extended: ${{ inputs.extended || false }}
          force: ${{ inputs.force || false }}
          dry_run: ${{ inputs.dry_run || false }}
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
