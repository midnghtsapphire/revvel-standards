name: Flow Chart Sync

on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "**.yml"
      - docs/**
      - scripts/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (print changes without writing files)
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write  # required because flow-chart sync commits regenerated diagrams
concurrency:
  group: flow-chart-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    name: Sync Flow Charts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run flow chart sync script
        env:
          REPO_ROOT: ${{ github.workspace }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/sync-flow-charts.js
      - name: Commit and push updated flow charts
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "revvel-automation[bot]"
          git config user.email "revvel-automation[bot]@users.noreply.github.com"

          git add "docs/Master Revvel-Standards Flow Charts/"

          if git diff --staged --quiet; then
            echo "✅ Flow charts already up-to-date — nothing to commit."
            exit 0
          fi

          git commit -m "chore: auto-sync flow charts [skip ci]"
          changed_files="$(git diff --cached --name-only)"

          # Another commit may have landed on main while this workflow was
          # running. Rebase onto the latest remote and retry the push so the
          # auto-sync commit is never rejected as non-fast-forward, which
          # previously caused changes to silently pile up behind main.
          # GITHUB_REF_NAME is always set by Actions; fail fast if not to
          # avoid silently pushing to the wrong branch.
          branch="${GITHUB_REF_NAME:?GITHUB_REF_NAME is not set}"
          attempts=5
          for i in $(seq 1 "$attempts"); do
            git fetch origin "$branch"
            # Rebase our single auto-sync commit onto the latest remote tip.
            if ! git rebase "origin/$branch"; then
              echo "❌ Rebase onto origin/$branch failed (attempt $i/$attempts); aborting rebase."
              git rebase --abort || true
              if [ "$i" -eq "$attempts" ]; then
                echo "❌ Giving up after $attempts attempts."
                exit 1
              fi
              sleep $((i * 2))
              continue
            fi

            if git push origin "HEAD:$branch"; then
              echo "✅ Flow charts updated and pushed (attempt $i/$attempts)."
              exit 0
            fi

            echo "⚠️  Push rejected (attempt $i/$attempts); remote moved — retrying after rebase."
            sleep $((i * 2))
          done

          echo "::warning::Direct push blocked after $attempts attempts — retrying via Contents API"
          printf '%s\n' "$changed_files" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            encoded_path=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$f")
            existing_sha=$(gh api "repos/${GH_REPO}/contents/${encoded_path}" --jq '.sha' 2>/dev/null || true)
            b64=$(base64 "$f" | tr -d '\n')
            args=(--field "message=chore: auto-sync flow charts [skip ci]" --field "content=${b64}")
            [ -n "$existing_sha" ] && args+=(--field "sha=${existing_sha}")
            gh api "repos/${GH_REPO}/contents/${encoded_path}" -X PUT "${args[@]}" \
              && echo "  ✓ updated ${f} via API" \
              || { echo "::error::API update failed for ${f}"; exit 1; }
          done
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
