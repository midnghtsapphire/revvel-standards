# =============================================================================
# XAI REVIEW WORKFLOW (WR #16875)
# =============================================================================
#
# PURPOSE:
#   Wires the GitHub Marketplace action "XAI Review"
#   (https://github.com/marketplace/actions/xai-review → Nikita-Filonov/ai-review)
#   into this repo as an opt-in AI PR reviewer that rides the existing
#   OPENROUTER_API_KEY. No new vendor secret is required.
#
#   XAI Review posts inline comments, context reviews, and/or a summary
#   review (depending on the chosen command) directly on the PR. It is
#   complementary to ai-pr-review-openrouter.yml (sticky summary comment)
#   and does NOT replace human review.
#
# TRIGGER LANES (all opt-in — avoid auto-noise on every PR sync):
#   1. Slash command — comment `/xai-review` (or `/xai-review run-summary`)
#      on a PR. Optional trailing token selects the review command.
#   2. Label — add the `xai-review` label to a non-draft PR.
#   3. Manual — workflow_dispatch with pull-request-number + review-command.
#   There is deliberately NO automatic pull_request open/sync trigger:
#   CODE_REVIEW_WORKFLOW_STATUS.md already cut multi-bot auto-noise, and
#   this action does a full-history checkout + Python install per run.
#
# REQUIRED CONFIGURATION:
#   * OPENROUTER_API_KEY (repo secret) — shared OpenRouter key
#     (Vault path revvel/shared/llm/openrouter). Soft-skips when missing.
#
# VERSION PINNING:
#   Nikita-Filonov/ai-review is a single-author action, so per
#   docs/THIRD_PARTY_ACTION_AUDIT.md it is pinned to a full commit SHA
#   (v0.71.0 = 52a2012d13644cfb7bf91b96d8d2373e07a4137e) and listed in
#   ACCEPTED_SINGLE_AUTHOR_ACTIONS in scripts/audit-third-party-actions.sh.
#   Bump the SHA deliberately; never float on @main or a mutable tag.
#
# IF MISSING:
#   The verify step soft-skips the whole job (Bito/Devin-style gate): the
#   workflow stays green, logs exactly which value is missing, and never
#   fails the PR. If reviews "aren't posting", check the secret AND the
#   OpenRouter balance at https://openrouter.ai/credits first.
#
# =============================================================================

name: XAI Review

on:
  issue_comment:
    types:
      - created
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "PR number to review"
        required: true
        type: string
      review-command:
        description: "Review mode"
        required: true
        type: choice
        default: run-summary
        options:
          - run
          - run-inline
          - run-context
          - run-summary
          - run-inline-reply
          - run-summary-reply
          - clear-inline
          - clear-summary

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: xai-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull-request-number || github.run_id }}
  cancel-in-progress: true

jobs:
  xai-review:
    name: XAI Review
    # Lane gates:
    #   * workflow_dispatch — always allowed (human pressed the button).
    #   * pull_request      — only the `xai-review` label on non-draft PRs.
    #   * issue_comment     — only human `/xai-review` comments on PRs.
    #     Bot guard prevents feedback loops if the reviewer bot replies
    #     with a string that starts with `/xai-review`.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.label.name == 'xai-review' &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.title, '[skip-review]')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.type != 'Bot' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        ) &&
        startsWith(github.event.comment.body, '/xai-review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      # -----------------------------------------------------------------------
      # STEP: Verify OPENROUTER_API_KEY (soft-skip gate)
      # -----------------------------------------------------------------------
      - name: Verify OPENROUTER_API_KEY is configured
        id: verify-secrets
        run: |
          echo "=========================================="
          echo "XAI Review credential verification"
          echo "=========================================="
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping XAI Review."
            echo "    Set it in Settings → Secrets and variables → Actions"
            echo "    (Vault path: revvel/shared/llm/openrouter)."
            echo "XAI_SKIP=true" >> "$GITHUB_ENV"
          else
            echo "✅ OPENROUTER_API_KEY: configured (${#OPENROUTER_API_KEY} chars)"
            echo "XAI_SKIP=false" >> "$GITHUB_ENV"
          fi
          echo "=========================================="

      # -----------------------------------------------------------------------
      # STEP: Resolve PR number + review command without interpolating
      # untrusted free text into a shell script (CLAUDE.md gotcha #4).
      # Only the leading token after `/xai-review` is accepted as a command,
      # and only if it matches the allowlist below.
      # -----------------------------------------------------------------------
      - name: Resolve review target
        if: env.XAI_SKIP == 'false'
        id: target
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ALLOWED = new Set([
              'run',
              'run-inline',
              'run-context',
              'run-summary',
              'run-inline-reply',
              'run-summary-reply',
              'clear-inline',
              'clear-summary',
            ]);
            let prNumber = null;
            let command = 'run-summary';

            if (context.eventName === 'workflow_dispatch') {
              prNumber = String(context.payload.inputs['pull-request-number'] || '').trim();
              command = String(context.payload.inputs['review-command'] || 'run-summary').trim();
            } else if (context.eventName === 'pull_request') {
              prNumber = String(context.payload.pull_request.number);
            } else if (context.eventName === 'issue_comment') {
              prNumber = String(context.payload.issue.number);
              const body = String(context.payload.comment.body || '');
              // "/xai-review" or "/xai-review run-inline ..." — first token only.
              const parts = body.trim().split(/\s+/);
              if (parts.length >= 2 && ALLOWED.has(parts[1])) {
                command = parts[1];
              }
            }

            if (!prNumber || !/^\d+$/.test(prNumber)) {
              core.setFailed(`Invalid PR number: ${JSON.stringify(prNumber)}`);
              return;
            }
            if (!ALLOWED.has(command)) {
              core.setFailed(`Invalid review command: ${JSON.stringify(command)}`);
              return;
            }

            core.setOutput('pr_number', prNumber);
            core.setOutput('review_command', command);
            core.info(`XAI Review target: PR #${prNumber} command=${command}`);

      - name: Checkout repository
        if: env.XAI_SKIP == 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so ai-review can diff base..head correctly.
          fetch-depth: 0

      - name: Run XAI Review
        if: env.XAI_SKIP == 'false'
        # continue-on-error: advisory reviewer must never block the PR.
        continue-on-error: true
        uses: Nikita-Filonov/ai-review@52a2012d13644cfb7bf91b96d8d2373e07a4137e # v0.71.0
        with:
          review-command: ${{ steps.target.outputs.review_command }}
        env:
          # Do not load PR-controlled configuration files into this secret-bearing step.
          AI_REVIEW_CONFIG_FILE_YAML: ${{ runner.temp }}/xai-review-disabled.yaml
          AI_REVIEW_CONFIG_FILE_JSON: ${{ runner.temp }}/xai-review-disabled.json
          AI_REVIEW_CONFIG_FILE_ENV: ${{ runner.temp }}/xai-review-disabled.env
          # --- LLM via OpenRouter (shared secret) ---
          LLM__PROVIDER: OPENROUTER
          LLM__META__MODEL: google/gemini-2.5-flash
          LLM__META__MAX_TOKENS: "8000"
          LLM__META__TEMPERATURE: "0.2"
          LLM__HTTP_CLIENT__API_URL: https://openrouter.ai/api/v1
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

          # --- GitHub VCS ---
          VCS__PROVIDER: GITHUB
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ steps.target.outputs.pr_number }}
          # Prefer ADMIN_GITHUB_TOKEN (own rate-limit bucket) when present.
          VCS__HTTP_CLIENT__API_URL: https://api.github.com
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
