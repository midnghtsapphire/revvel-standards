name: Jules Coding Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to work on'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  jules-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Jules agent
        run: |
          echo "Running Jules coding agent for issue #${{ inputs.issue_number }}"
          # Agent logic would go here

      - name: Create PR
        run: |
          BRANCH="jules/issue-${{ inputs.issue_number }}"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git config user.name "jules-bot"
          git config user.email "jules-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: jules agent changes for #${{ inputs.issue_number }}"
          git push -u origin "$BRANCH" || true
          gh pr create --title "jules: fixes for #${{ inputs.issue_number }}" \
            --body "Closes #${{ inputs.issue_number }}" \
            --base main --head "$BRANCH" || true
          gh issue edit "${{ inputs.issue_number }}" --add-label "wr:pr-open" || true
