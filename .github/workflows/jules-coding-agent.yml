name: Jules Coding Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  jules-agent:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.label.name, 'jules')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/jules'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm ci

      - name: Create branch and stub commit
        id: branch
        run: |
          ISSUE=${{ steps.issue.outputs.number }}
          BRANCH="jules/issue-${ISSUE}"
          git config user.name "jules-agent[bot]"
          git config user.email "jules-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p .jules
          echo "Working on issue #${ISSUE} at $(date -u +%FT%TZ)" > ".jules/issue-${ISSUE}.md"
          git add ".jules/issue-${ISSUE}.md"
          git commit -m "chore(jules): stub for #${ISSUE}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Open PR
        run: |
          ISSUE=${{ steps.issue.outputs.number }}
          gh pr create \
            --title "chore(jules): work on #${ISSUE}" \
            --body "Closes #${ISSUE}" \
            --head "${{ steps.branch.outputs.branch }}" \
            --base main || echo "PR may already exist"

      - name: Label issue
        run: |
          gh issue edit ${{ steps.issue.outputs.number }} --add-label "wr:pr-open" || true
