# REVVEL-DISABLED | AGENT: claude-code | MODEL: not-recorded | WR: #17248 | DATE: 2026-08-18 | STATUS: REPLACED | REASON: Never called Jules. It ran an `echo` and a `# Agent logic would go here` comment, then committed a one-line timestamp file, opened a PR titled "Closes #N", and labelled the issue `wr:pr-open` — manufacturing tracker state for work that was never done. Real Jules integration already exists in jules-invoke.yml via BeksOmega/jules-action. Disabled per RVS-AGENT-001 (comment, don't delete).
# OWNER: midnghtsapphire | TICKET: #17248
#
# WHY THIS WAS DANGEROUS, not merely useless:
#
#   1. It fired on `issue_comment` for ANY comment containing "/jules", so a
#      passing mention in discussion was enough to trigger it.
#   2. Its "agent" step was:
#        run: |
#          echo "Running Jules coding agent for issue #..."
#          # Agent logic would go here
#   3. It then wrote `.jules/issue-N.md` containing only a timestamp, committed
#      it as "chore(jules): stub for #N", opened a PR whose body read
#      "Closes #N", and added `wr:pr-open` to the issue. Merging such a PR
#      would auto-close a real issue having changed nothing.
#   4. A second, duplicate PR-creating path in the same job used `git add -A`
#      and swallowed every failure with `|| true`.
#   5. `inputs.issue_number` was interpolated without a guard, so a dispatch
#      with no input produced the branch `jules/issue-` — which exists on the
#      remote, alongside stub branches jules/issue-17456 and jules/issue-17537.
#
# No stub PR was ever merged (no `.jules/` files reached main), so no issue was
# falsely auto-closed. The two stub branches remain and can be deleted.
#
# This is the same defect family as `npm test || true` (#17704), ChaosMender's
# empty scope (#17708), and the blank [AUTO-FALLBACK] issues (#17710): an
# artifact that reports success without doing the work.
#
# Minimal inert stub below keeps this file a valid workflow (automation-doctor
# requires every workflow file to parse with a jobs section). No automatic
# triggers; the job is if:false and can never run.
#
# TO ACTUALLY RUN JULES: use .github/workflows/jules-invoke.yml, which calls
# BeksOmega/jules-action@v1.0.0. Do not re-enable this file.
name: Jules Coding Agent (disabled)
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: false
    steps:
      - name: Disabled
        run: |
          echo "This workflow is disabled. Use jules-invoke.yml for real Jules runs."
          exit 1
