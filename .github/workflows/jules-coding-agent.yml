name: Jules Coding Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  jules-agent:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/jules'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "num=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        run: |
          git config user.name "jules-coding-agent[bot]"
          git config user.email "jules-agent@users.noreply.github.com"

      - name: Create branch
        id: branch
        run: |
          BRANCH="jules/issue-${{ steps.issue.outputs.num }}-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run Jules agent
        run: |
          echo "Jules agent processing issue #${{ steps.issue.outputs.num }}"
          # Placeholder for actual jules agent invocation
          echo "# Jules processed issue #${{ steps.issue.outputs.num }}" >> .jules-log
          git add -A
          git commit -m "chore(jules): process issue #${{ steps.issue.outputs.num }}" || echo "No changes"

      - name: Push branch
        run: git push origin "${{ steps.branch.outputs.name }}" || echo "Nothing to push"

      - name: Open PR
        run: |
          gh pr create \
            --title "[jules] fix for issue #${{ steps.issue.outputs.num }}" \
            --body "Automated PR from jules-coding-agent for #${{ steps.issue.outputs.num }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --base main || echo "PR create failed or nothing to open"

      - name: Label issue
        run: |
          gh issue edit "${{ steps.issue.outputs.num }}" --add-label "wr:pr-open" || true
