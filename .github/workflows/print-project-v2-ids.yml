name: Print Project v2 field and option IDs
on:
  workflow_dispatch:
    inputs:
      owner_type:
        description: Project owner type
        required: true
        default: organization
        type: choice
        options:
          - organization
          - user
      owner:
        description: GitHub organization or username that owns the project
        required: true
        type: string
      project_number:
        description: Project number from the Project URL, e.g. /projects/5
        required: true
        type: string
permissions:
  contents: read
jobs:
  print-project-ids:
    name: Print Project v2 IDs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.PROJECTS_APP_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
      - name: Query Project v2 data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER_TYPE: ${{ inputs.owner_type }}
          OWNER: ${{ inputs.owner }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
        run: |
          set -euo pipefail

          if [ "${OWNER_TYPE}" = "organization" ]; then
            gh api graphql \
              -f owner="${OWNER}" \
              -F number="${PROJECT_NUMBER}" \
              -f query='
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id
                      title
                      fields(first: 100) {
                        nodes {
                          ... on ProjectV2Field {
                            id
                            name
                            dataType
                          }
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            dataType
                            options {
                              id
                              name
                            }
                          }
                          ... on ProjectV2IterationField {
                            id
                            name
                            dataType
                            configuration {
                              iterations {
                                id
                                title
                                startDate
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              ' > project_data.json
          elif [ "${OWNER_TYPE}" = "user" ]; then
            gh api graphql \
              -f owner="${OWNER}" \
              -F number="${PROJECT_NUMBER}" \
              -f query='
                query($owner: String!, $number: Int!) {
                  user(login: $owner) {
                    projectV2(number: $number) {
                      id
                      title
                      fields(first: 100) {
                        nodes {
                          ... on ProjectV2Field {
                            id
                            name
                            dataType
                          }
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            dataType
                            options {
                              id
                              name
                            }
                          }
                          ... on ProjectV2IterationField {
                            id
                            name
                            dataType
                            configuration {
                              iterations {
                                id
                                title
                                startDate
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              ' > project_data.json
          else
            echo "owner_type must be either organization or user."
            exit 1
          fi
      - name: Print copy/paste variables
        env:
          OWNER_TYPE: ${{ inputs.owner_type }}
        run: |
          set -euo pipefail

          if [ "${OWNER_TYPE}" = "organization" ]; then
            PROJECT_PATH='.data.organization.projectV2'
          else
            PROJECT_PATH='.data.user.projectV2'
          fi

          PROJECT_ID="$(jq -r "${PROJECT_PATH}.id" project_data.json)"
          PROJECT_TITLE="$(jq -r "${PROJECT_PATH}.title" project_data.json)"

          if [ -z "${PROJECT_ID}" ] || [ "${PROJECT_ID}" = "null" ]; then
            echo "Could not find Project v2. Check owner, owner_type, project_number, and token permissions."
            cat project_data.json
            exit 1
          fi

          {
            echo "## Project"
            echo
            echo "PROJECT_ID=${PROJECT_ID}"
            echo "PROJECT_TITLE=${PROJECT_TITLE}"
            echo
            echo "## Fields"
            echo
            jq -r "${PROJECT_PATH}.fields.nodes[] |
              select(.id != null) |
              \"FIELD name=\\\"\\(.name)\\\" type=\\\"\\(.dataType // \"unknown\")\\\" id=\\\"\\(.id)\\\"\"" project_data.json
            echo
            echo "## Single-select options"
            echo
            jq -r "${PROJECT_PATH}.fields.nodes[] |
              select(.options != null) |
              . as \$field |
              \$field.options[] |
              \"OPTION field=\\\"\\(\$field.name)\\\" option=\\\"\\(.name)\\\" id=\\\"\\(.id)\\\"\"" project_data.json
            echo
            echo "## Iterations"
            echo
            jq -r "${PROJECT_PATH}.fields.nodes[] |
              select(.configuration.iterations != null) |
              . as \$field |
              \$field.configuration.iterations[] |
              \"ITERATION field=\\\"\\(\$field.name)\\\" title=\\\"\\(.title)\\\" start=\\\"\\(.startDate)\\\" id=\\\"\\(.id)\\\"\"" project_data.json
          } | tee project-v2-ids.txt

          echo
          echo "Saved readable output to project-v2-ids.txt"
      - name: Upload Project v2 ID report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: project-v2-ids
          path: |
            project-v2-ids.txt
            project_data.json
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
