# Perplexity Research Agent
# Uses Perplexity for research and web-grounded issue diagnosis

name: Perplexity Research Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to research
        required: false
        type: number
      skip_labels:
        description: Skip label check
        required: false
        type: boolean
        default: false
      prompt:
        description: Custom research prompt
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 20
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       (github.event.label.name == 'wr:research' || github.event.label.name == 'lifecycle:stuck'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install no-key Perplexity bridge
        run: |
          python3 -m pip install --user "perplexity-api @ git+https://github.com/helallao/perplexity-ai.git@main"

      - name: Research issue with Perplexity (no-key)
        id: research
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
          # 2026-05-21 (Claude): removed the direct Perplexity key env — this
          # lane is keyless (helallao bridge) with OpenRouter as the free
          # backup. See docs/PERPLEXITY_NO_KEY_INTEGRATION.md
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Lane config (#17868): without these routedChat has nowhere to go —
          # Layer 0 resolves to the runner's own loopback and the paid lane is
          # refused by the spend gate. See docs/LOCAL_LLM_SETUP.md.
          LMSTUDIO_ENDPOINT: ${{ secrets.LMSTUDIO_ENDPOINT }}
          LMSTUDIO_API_KEY: ${{ secrets.LMSTUDIO_API_KEY }}
          LMSTUDIO_MODEL: ${{ vars.LMSTUDIO_MODEL }}
          REVVEL_LLM_ALLOW_CLOUD: ${{ vars.REVVEL_LLM_ALLOW_CLOUD }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          node scripts/perplexity-research-issue.js

      - name: Comment research results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          # Move to next state
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "wr:research" \
            --add-label "wr:research-complete" \
            --add-label "wr:jules" 2>/dev/null || true

      - name: Report success/failure
        run: |
          if [ -f /tmp/perplexity-research.md ]; then
            echo "## Research Complete" >> $GITHUB_STEP_SUMMARY
            cat /tmp/perplexity-research.md >> $GITHUB_STEP_SUMMARY
          fi
