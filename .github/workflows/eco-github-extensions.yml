# ECO-RUN 2026-11-19 (Decipherer, WR eco-run-20261119): this workflow is KEPT
# unchanged (never delete) but cannot run on GitHub today: every job fails
# before step 1 with "not started because your account is locked due to a
# billing issue". The live path is CircleCI: jobs `eco-energy` and
# `eco-website-carbon` in .circleci/config.yml. Root cause, the extra defects
# found in this file, and how to re-enable it: docs/ECO_RUN.md.
# Defects that would remain even with billing fixed: (1) the ecoinfra job passes
# `file:` but the action reads `plan-file`, and ./state.json is a dashboard
# summary, not a Terraform plan; (2) the "sustainable npm" step only sets npm
# config and never runs an install, so the measurement after it measures nothing;
# (3) eco-ci defaults to send-data=true (posts repo, branch, commit, CPU model to
# metrics.green-coding.io).
name: Eco Github Extensions

concurrency:
  group: eco-github-extensions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: start-measurement
        continue-on-error: true

      - name: 'Checkout repository'
        uses: actions/checkout@v7

      - name: Checkout Repo Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: 'repo checkout'
        continue-on-error: true

      - name: Run sustainable npm install
        uses: lowlydba/sustainable-npm@v4.0.0

      - name: sustainable npm measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: 'sustainable npm'
        continue-on-error: true

      - name: Show Energy Results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: display-results
        continue-on-error: true

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7

      - name: Run accessibility check
        uses: zachkklein/WCAG_PR_Checker@v2
        with:
          APP_DIR: '.'
          # Static site is served from the repository root, not a public/ build
          # directory. Point the checker at '.' so it scans the real index.html
          # (with title/lang/zoomable viewport) instead of a placeholder page.
          BUILD_DIR: '.'
          URLS: '/'
        continue-on-error: true

  ecoinfra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7

      - name: Check Eco Infra emissions
        uses: eco-infra/ecoinfra-action@v1.4.0
        with:
          token: ${{ secrets.ECOINFRA_TOKEN }}
          project-name: 'eco-github-extensions'
          file: './state.json'
        continue-on-error: true
