# This workflow integrates a collection of open source static analysis tools
# with GitHub code scanning. For documentation, or to provide feedback, visit
# https://github.com/github/ossar-action
name: OSSAR

# RETIRED 2026-08-20 (DECISIONS.md D015, WR #17748). Automatic triggers are
# off; the workflow is kept, runnable on demand, per RVS-AGENT-001.
#
# OSSAR reported failure on EVERY pull request. The scan itself found nothing —
# its own summary line was `Active results: 0` — and the job failed only because
# one of its two tools never launched:
#
#   [Error] ToolLauncherNotFoundException: ...bandit_runner.exe
#   [Error] Win32Exception: ... The filename or extension is too long.
#   [Error] BreakException: Guardian detected one or more breaking results.
#
# The launcher path is 130 characters, half of Windows' 260-char MAX_PATH, so
# path length is NOT the cause and enabling long paths would change nothing.
# Win32 error 206 also fires when the COMMAND LINE exceeds its ~32KB limit,
# which is what a per-file argument list over a repo this size produces.
#
# Moving the job to ubuntu-latest is not available either: github/ossar-action
# is Windows-only, as the comment on `runs-on` below has said since this file
# was generated from GitHub's template.
#
# Retiring it costs no coverage. OSSAR ran ESLint and bandit; both lanes are
# already covered on Linux by checks that are green:
#   - codeql.yml   — matrix includes `python` (bandit's lane, added WR #15693)
#                    and `javascript-typescript` (ESLint's lane)
#   - semgrep.yml  — p/security-audit, p/secrets, p/owasp-top-ten, p/cwe-top-25
#
# What this fixes is not a scan gap but a signal one: a permanently-red security
# check is indistinguishable from one that just started failing for a real
# reason, so every always-red check raises the cost of noticing the one that
# matters. Guarded by tests/ossar-retired.test.js, which fails if the replacement
# coverage disappears.
#
# To re-enable: restore the push/pull_request/schedule triggers below AND record
# the reversal in DECISIONS.md. Do not re-enable without fixing the launcher.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  OSSAR-Scan:
    timeout-minutes: 45
    # OSSAR runs on windows-latest.
    # ubuntu-latest and macos-latest support coming soon
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Ensure a compatible version of dotnet is installed.
    # The [Microsoft Security Code Analysis CLI](https://aka.ms/mscadocs) is built with dotnet v3.1.201.
    # A version greater than or equal to v3.1.201 of dotnet must be installed on the agent in order to run this action.
    # GitHub hosted runners already have a compatible version of dotnet installed and this step may be skipped.
    # For self-hosted runners, ensure dotnet version 3.1.201 or later is installed by including this action:
    # - name: Install .NET
    #   uses: actions/setup-dotnet@v4
    #   with:
    #     dotnet-version: '3.1.x'

      # Run open source static analysis tools
    - name: Run OSSAR
      uses: github/ossar-action@v1
      id: ossar

      # Upload results to the Security tab
    - name: Upload OSSAR results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.ossar.outputs.sarifFile }}
