name: Ship Status Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Post weekly Ship Status digest
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ship Status Digest — ${today}`,
              body: `Weekly ship status digest generated by automated audit.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              body: 'Weekly automated ship status audit digest.',
              labels: ['ship-status', 'digest'],
            });
