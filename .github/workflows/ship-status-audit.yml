name: Ship Status Audit

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post weekly Ship Status digest
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const week = `${now.getUTCFullYear()}-W${String(Math.ceil(((now - new Date(Date.UTC(now.getUTCFullYear(),0,1))) / 86400000 + new Date(Date.UTC(now.getUTCFullYear(),0,1)).getUTCDay()+1)/7)).padStart(2,'0')}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ship-status] Weekly digest ${week}`,
              body: `Automated Ship Status digest for ${week}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ship-status', 'automated'],
            });
