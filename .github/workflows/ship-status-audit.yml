name: Ship Status Audit
on:
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Parse SHIP_STATUS.md
        id: parse
        run: |
          echo "## Ship Status Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for stale items (>30, >60, >90 days)
          if [ -f SHIP_STATUS.md ]; then
            echo "✅ SHIP_STATUS.md found"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ SHIP_STATUS.md missing - creating issue"
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Create digest issue
        uses: actions/github-script@v9.0.0
        if: always()
        with:
          script: |
            const fs = require('fs');
            let body = `## 📊 Ship Status Audit

Weekly digest of all active workstreams.

**Checked:** ${new Date().toISOString()}

---

*Auto-generated by Ship Status Audit*`;

            // Include SHIP_STATUS.md content if it exists
            try {
              const content = fs.readFileSync('SHIP_STATUS.md', 'utf8');
              if (content.length > 0) {
                body += `\n\n## Current Status\n\n${content.slice(0, 5000)}`;
              }
            } catch (e) {
              // SHIP_STATUS.md doesn't exist
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[AUDIT] Ship Status Weekly Digest',
              body: body,
              labels: ['audit', 'automated']
            })
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
