name: Octopus Issue Router

# ── Octopus Review → routable WR translator ──────────────────────────────────
# Problem: octopus-review[bot] files issues with labels (wr:new, octopus-review,
# topical labels) that the existing agent-dispatcher.yml does NOT recognize.
# Octopus issues hit dispatcher's default `triage` case which has no
# downstream action, so they sit stuck.
#
# Fix: when octopus-review[bot] opens an issue, translate its labels into the
# vocabulary the dispatcher + wr-auto-classify already understand:
#   - Add `work-request` label (so wr-auto-classify.yml picks it up)
#   - Add `wr:code` label (so agent-dispatcher.yml routes to openrouter)
#   - Prefix `[WR]` to title if missing (so wr-auto-classify's title gate fires)
#
# A separate edit to agent-dispatcher.yml adds an `octopus-review` label case
# as belt-and-suspenders — if this translator ever misses, the dispatcher
# still routes correctly on the originating `octopus-review` label.
#
# Manual backfill: workflow_dispatch with `backfill: true` re-labels every
# open issue authored by octopus-review[bot]. Use sparingly — kicks off
# downstream coder runs.
# ──────────────────────────────────────────────────────────────────────────────

# DISABLED TRIGGER 2026-08-21 (D016): issues
# Owner cut this lane during the cost freeze. Triggers are commented, not
# deleted (RVS-AGENT-001) — re-enable by uncommenting the block below.
#
# IMPORTANT, and the exact mistake D007 made: commenting this file does NOT
# stop the octopus-review[bot] App commenting on PRs. That is a GitHub App and it
# reports independently of any workflow here. Removing its check requires
# uninstalling or reconfiguring the App in repository settings — see #17872.
on:
#  issues:
#    # `opened` covers newly-filed Octopus issues. `labeled` is the recovery
#    # hook the recovery-engine uses to re-translate issues that missed the
#    # original opened-event window (the original engine labeled them
#    # `has-conflicts` which did NOTHING here — fixed in this PR).
#    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      backfill:
        description: "If true, re-label every open octopus-review[bot] issue (use sparingly)"
        type: boolean
        required: false
        default: false
      rate_limit_minutes:
        description: "Minutes to sleep between issues during backfill (0 = burst). Use 5–15 to drip-feed costs."
        type: number
        required: false
        default: 0
      max_issues:
        description: "Maximum issues to process in this run (safety cap)"
        type: number
        required: false
        default: 100

permissions:
  issues: write
  contents: read

concurrency:
  group: octopus-route-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  route-single:
    name: Translate labels on an Octopus issue (opened or recovery-labeled)
    # Fires on:
    #   - issues: opened   when Octopus files something new
    #   - issues: labeled  when a maintainer (or future external token-holder)
    #                      applies `recovery:translate-me`. NB: workflows
    #                      using the default GITHUB_TOKEN CANNOT trigger this
    #                      path due to GitHub's anti-recursion rule —
    #                      recovery-engine.yml therefore translates inline
    #                      under its own token instead of cascading through
    #                      this trigger (per Copilot review on PR #14107).
    if: |-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'octopus-review[bot]' &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' && github.event.label.name == 'recovery:translate-me'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Translate labels + ensure [WR] title prefix
        uses: actions/github-script@v9.0.0
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const currentLabels = (issue.labels || [])
              .map(l => typeof l === 'string' ? l : l.name);
            const labelsToAdd = ['work-request', 'wr:code']
              .filter(l => !currentLabels.includes(l));

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: labelsToAdd,
              });
              core.info(`Added labels to #${issueNumber}: ${labelsToAdd.join(', ')}`);
            } else {
              core.info(`#${issueNumber} already had work-request + wr:code; nothing to add.`);
            }

            // Prefix [WR] if not already present. Truncate the body so the
            // total title stays <=256 chars (GitHub's issue-title cap).
            const title = issue.title || '';
            if (!/^\[WR\]/i.test(title)) {
              const PREFIX = '[WR] ';
              const maxBodyLen = 256 - PREFIX.length;
              const body = title.length > maxBodyLen ? title.slice(0, maxBodyLen) : title;
              const newTitle = `${PREFIX}${body}`;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                title: newTitle,
              });
              core.info(`Prefixed title with [WR]: ${newTitle}`);
            }

            core.summary
              .addHeading('Octopus issue routed', 3)
              .addRaw(`Issue: #${issueNumber}`)
              .addRaw(`Added labels: \`${labelsToAdd.join('`, `') || '(none — already present)'}\``)
              .write();

  backfill:
    name: Backfill — re-label every open Octopus issue
    if: |-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.backfill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Walk open octopus-review[bot] issues
        uses: actions/github-script@v9.0.0
        env:
          RATE_LIMIT_MINUTES: ${{ github.event.inputs.rate_limit_minutes || '0' }}
          MAX_ISSUES: ${{ github.event.inputs.max_issues || '100' }}
        with:
          script: |
            // Per Copilot review on PR #14107:
            //   (1) Use Number.isFinite to avoid `0 || default` swallowing
            //       an explicit max_issues=0 (the previous `|| 100` would
            //       turn 0 into 100).
            //   (2) Cap rateLimitMinutes * maxIssues to a safe job budget
            //       so a drip-feed run can't hit GitHub's 6h timeout and
            //       leave the queue half-translated with no resume.
            const rawRate = Number.parseInt(process.env.RATE_LIMIT_MINUTES, 10);
            const rateLimitMinutes = Number.isFinite(rawRate) ? Math.max(0, rawRate) : 0;
            const rawMax = Number.parseInt(process.env.MAX_ISSUES, 10);
            const maxIssues = Number.isFinite(rawMax) ? Math.max(0, rawMax) : 100;

            const SAFE_JOB_BUDGET_MIN = 300; // 5h — leaves headroom under the 6h cap.
            const plannedMinutes = rateLimitMinutes * Math.max(maxIssues - 1, 0);
            if (plannedMinutes > SAFE_JOB_BUDGET_MIN) {
              core.setFailed(
                `rate_limit_minutes (${rateLimitMinutes}) × (max_issues - 1) = ${plannedMinutes} min ` +
                `exceeds the safe job budget of ${SAFE_JOB_BUDGET_MIN} min. ` +
                `Lower max_issues or rate_limit_minutes, or split across multiple dispatches.`
              );
              return;
            }

            if (maxIssues === 0) {
              core.notice('max_issues=0 — nothing to do.');
              return;
            }

            const iter = github.paginate.iterator(
              github.rest.search.issuesAndPullRequests,
              {
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open author:app/octopus-review`,
                per_page: 100,
              }
            );

            let translated = 0;
            let skipped = 0;
            let processed = 0;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for await (const { data } of iter) {
              for (const issue of data.items) {
                if (processed >= maxIssues) break;
                processed++;

                const labels = (issue.labels || [])
                  .map(l => typeof l === 'string' ? l : l.name);

                const toAdd = ['work-request', 'wr:code']
                  .filter(l => !labels.includes(l));

                if (toAdd.length > 0) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: toAdd,
                  });
                }

                if (!/^\[WR\]/i.test(issue.title || '')) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    title: `[WR] ${issue.title}`.slice(0, 256),
                  });
                }

                if (toAdd.length > 0) {
                  core.info(`#${issue.number}: added ${toAdd.join(', ')} (${processed}/${maxIssues})`);
                  translated++;
                  // Drip-feed: pause between issues so downstream
                  // openrouter-coder runs spread out. Don't sleep after the
                  // last issue or when we're already at the cap — pointless
                  // runner-minute burn (per Copilot review on PR #14107).
                  if (rateLimitMinutes > 0 && processed < maxIssues) {
                    core.info(`Sleeping ${rateLimitMinutes} min before next issue...`);
                    await sleep(rateLimitMinutes * 60 * 1000);
                  }
                } else {
                  core.info(`#${issue.number}: already labeled (${processed}/${maxIssues})`);
                  skipped++;
                }
              }
              if (processed >= maxIssues) break;
            }

            core.summary
              .addHeading('Octopus backfill complete', 3)
              .addRaw(`Translated: ${translated}`)
              .addRaw(`Skipped (already labeled): ${skipped}`)
              .write();
