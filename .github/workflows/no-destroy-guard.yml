name: No-Destroy Guard

# Fails a PR that deletes existing apps/products or strips large amounts of code
# from protected paths (the failure that wiped two finished apps under a PR that
# claimed to "add a research WR"). Override an intentional removal with the
# `allow-destroy` label. See scripts/no-destroy-guard.js.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Block destructive diffs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOW_DESTROY: ${{ contains(github.event.pull_request.labels.*.name, 'allow-destroy') }}
        run: node scripts/no-destroy-guard.js
