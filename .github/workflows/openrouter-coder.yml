name: OpenRouter Coder

# Demand-driven activation (2026-07-25): the coder fires ONLY when a human
# applies `spec-approved` (via the Spec Approval Gate) or `wr:code`. The
# issue_comment trigger was removed — bots posting "Research Findings:"
# comments used to start builds with no human approval, which is how the
# fleet ran away. See docs/DEFINITION_OF_DONE.md two-phase pipeline.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string
      prompt:
        description: 'Optional dispatch prompt from agent-dispatcher'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  code:
    if: |
      (github.event_name == 'issues' && (github.event.label.name == 'wr:code' || github.event.label.name == 'spec-approved')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # create-pull-request supplies its own Authorization header; leaving the
          # checkout credential in http.extraheader sends two and git 400s.
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve issue context
        id: ctx
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let number;
            if (context.eventName === 'workflow_dispatch') {
              number = parseInt(context.payload.inputs.issue_number, 10);
            } else if (context.eventName === 'issue_comment') {
              number = context.payload.issue.number;
            } else {
              number = context.payload.issue.number;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            // Guard: reject PRs (GitHub fires issues/issue_comment events for PRs too)
            // and reject closed/merged issues to prevent duplicate work on already-landed changes.
            if (issue.pull_request) {
              core.warning(`Target #${number} is a pull request, not an issue. Skipping.`);
              core.setOutput('skip', 'true');
              core.setOutput('skip_reason', 'target is a pull request');
              return;
            }
            if (issue.state !== 'open') {
              core.warning(`Target issue #${number} is not open (state=${issue.state}). Skipping.`);
              core.setOutput('skip', 'true');
              core.setOutput('skip_reason', `issue state is ${issue.state}`);
              return;
            }
            core.setOutput('skip', 'false');
            core.setOutput('issue_number', String(number));
            core.setOutput('issue_title', issue.title || '');
            core.setOutput('issue_body', issue.body || '');

      - name: Set up Python
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.ctx.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run OpenRouter coder
        # Spend gate (#17850): this step bills OpenRouter. It runs only when the
        # repository variable REVVEL_LLM_ALLOW_CLOUD is set to "1". Unset = skip,
        # so an idle repo cannot spend. See docs/LOCAL_LLM_SETUP.md.
        if: steps.ctx.outputs.skip != 'true' && vars.REVVEL_LLM_ALLOW_CLOUD == '1'
        env:
          REVVEL_LLM_ALLOW_CLOUD: ${{ vars.REVVEL_LLM_ALLOW_CLOUD }}
          WR_MODEL: ${{ vars.WR_MODEL || 'anthropic/claude-opus-4.7' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.ctx.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.ctx.outputs.issue_body }}
        run: |
          set -euo pipefail
          test -f .github/scripts/openrouter_coder.py
          python .github/scripts/openrouter_coder.py --output-path /tmp/openrouter-coder-result.json
          test -s /tmp/openrouter-coder-result.json

      - name: Create Pull Request
        if: steps.ctx.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "apply openrouter changes for #${{ steps.ctx.outputs.issue_number }}"
          title: "[openrouter] apply openrouter changes for #${{ steps.ctx.outputs.issue_number }}"
          body: |
            Automated code changes for issue #${{ steps.ctx.outputs.issue_number }}.

            **Agent used:** openrouter
            **Fallback chain:** OpenRouter → OpenHands (opt-in)
          branch: openrouter/issue-${{ steps.ctx.outputs.issue_number }}
          delete-branch: true

      - name: Comment on skip
        if: steps.ctx.outputs.skip == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v9.0.0
        env:
          SKIP_REASON: ${{ steps.ctx.outputs.skip_reason }}
        with:
          script: |
            core.notice(`Skipped openrouter-coder: ${process.env.SKIP_REASON || ''}`);
