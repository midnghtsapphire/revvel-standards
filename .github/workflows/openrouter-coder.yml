name: OpenRouter Coder

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  code:
    if: >
      (github.event_name == 'issues' && (contains(github.event.label.name, 'wr:code') || contains(github.event.label.name, 'spec-approved'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'Research Findings:')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve issue context
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            let issueNumber;
            if (context.eventName === 'workflow_dispatch') {
              issueNumber = parseInt(context.payload.inputs.issue_number, 10);
            } else if (context.eventName === 'issue_comment') {
              issueNumber = context.payload.issue.number;
            } else {
              issueNumber = context.payload.issue.number;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            // Guard: reject pull requests and closed/merged issues.
            // GitHub fires `issues` and `issue_comment` events for PRs too
            // (labeling a PR via the Issues API, commenting on a PR thread).
            // Without this guard we re-implement already-merged PRs and open
            // duplicate coder PRs on top of landed work.
            if (issue.pull_request) {
              core.warning(`Target #${issueNumber} is a pull request, not an issue. Skipping.`);
              core.setOutput('skip', 'true');
              core.setOutput('reason', 'target_is_pull_request');
              return;
            }
            if (issue.state !== 'open') {
              core.warning(`Target issue #${issueNumber} is not open (state=${issue.state}). Skipping.`);
              core.setOutput('skip', 'true');
              core.setOutput('reason', 'issue_not_open');
              return;
            }

            core.setOutput('skip', 'false');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', issue.title || '');
            core.setOutput('issue_body', issue.body || '');

      - name: Set up Python
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.ctx.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Invoke OpenRouter agent
        if: steps.ctx.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.ctx.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.ctx.outputs.issue_body }}
        run: |
          python scripts/openrouter_coder.py || echo "Agent invocation failed; continuing."

      - name: Create pull request
        if: steps.ctx.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: openrouter/issue-${{ steps.ctx.outputs.issue_number }}
          title: "[openrouter] apply openrouter changes for #${{ steps.ctx.outputs.issue_number }}"
          body: |
            Automated code changes for issue #${{ steps.ctx.outputs.issue_number }}.

            **Agent used:** openrouter
            **Fallback chain:** OpenRouter → OpenHands (opt-in)
          commit-message: "feat: apply openrouter changes for #${{ steps.ctx.outputs.issue_number }}"

      - name: Comment on issue
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.ctx.outputs.issue_number }}', 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'OpenRouter coder has completed processing. See PR for changes.'
            });
