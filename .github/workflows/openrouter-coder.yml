name: OpenRouter Coder

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  code:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (contains(github.event.label.name, 'wr:code') || contains(github.event.label.name, 'spec-approved'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'Research Findings:'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve issue context
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            let issueNumber;
            if (context.eventName === 'workflow_dispatch') {
              issueNumber = parseInt(context.payload.inputs.issue_number, 10);
            } else if (context.eventName === 'issue_comment' || context.eventName === 'issues') {
              issueNumber = context.payload.issue.number;
            }
            if (!issueNumber) {
              core.setOutput('skip', 'true');
              core.setOutput('reason', 'no-issue-number');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            // Guard: reject pull requests and closed/merged targets.
            // GitHub fires `issues.labeled` and `issue_comment.created` for PRs too;
            // dispatching a coding agent against an already-merged PR produces
            // duplicate PRs on top of already-landed work (see repo incident 2026-07-13).
            if (issue.pull_request) {
              core.info(`Skipping #${issueNumber}: target is a pull request, not an issue.`);
              core.setOutput('skip', 'true');
              core.setOutput('reason', 'is-pull-request');
              return;
            }
            if (issue.state !== 'open') {
              core.info(`Skipping #${issueNumber}: issue state is '${issue.state}', not 'open'.`);
              core.setOutput('skip', 'true');
              core.setOutput('reason', `state-${issue.state}`);
              return;
            }
            core.setOutput('skip', 'false');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', issue.title || '');
            core.setOutput('issue_body', issue.body || '');

      - name: Log skip decision
        if: steps.ctx.outputs.skip == 'true'
        run: |
          echo "::notice::Skipping openrouter-coder run — reason: ${{ steps.ctx.outputs.reason }}"

      - name: Setup Node
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.ctx.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run OpenRouter coder
        if: steps.ctx.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.ctx.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.ctx.outputs.issue_body }}
        run: |
          python scripts/openrouter_coder.py || echo "OpenRouter coder finished with non-zero (non-fatal)."

      - name: Create PR
        if: steps.ctx.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
        run: |
          git config user.name "openrouter-coder[bot]"
          git config user.email "openrouter-coder@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="openrouter/issue-${ISSUE_NUMBER}-$(date +%s)"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "feat: apply openrouter changes for #${ISSUE_NUMBER}"
            git push origin "$BRANCH"
            gh pr create \
              --title "[openrouter] apply openrouter changes for #${ISSUE_NUMBER}" \
              --body "Automated code changes for issue #${ISSUE_NUMBER}." \
              --head "$BRANCH" \
              --base main || true
          else
            echo "No changes to commit."
          fi
