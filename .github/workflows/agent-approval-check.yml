# name: Agent Approval Check
# 
# # Merge-side gate for agent-authored PRs (owner-approved 2026-11-04).
# # Spec: midnghtsapphire/revvel-metal-findings lanes/04-spec-to-code/agent-approval-check.md
# #
# # SAFETY (pull_request_target):
# #   - Runs the workflow from the BASE branch. This file NEVER checks out or
# #     executes PR head code: there is no actions/checkout step at all.
# #   - The pinned action only reads PR metadata via the API and posts one
# #     commit status (`agent-approval-check`) plus one sticky PR comment.
# #   - Fail-closed: any error leaves the status non-success.
# #   - Approvals are bound to the exact head SHA (`/approve <head-sha>`);
# #     any new push makes earlier approvals stale (single-use per SHA).
# #   - Bot approvals (TRUSTED_BOTS from trusted-bot-auto-approve.yml) never count.
# #
# # Manual run: Actions → Agent Approval Check → Run workflow (pr_number),
# # or scripts/agent-approval-check-manual.sh <pr_number>.
