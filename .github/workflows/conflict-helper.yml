name: conflict-helper

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run against'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  # Gate: only run on comment events if the body matches /resolve[-conflicts]
  # AND the commenter is privileged. Skip cleanly otherwise.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "pr_number=$PR_NUMBER_PR" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "pr_number=$DISPATCH_PR" >> "$GITHUB_OUTPUT"
              ;;
            issue_comment)
              if [ "$IS_PR_COMMENT" != "true" ]; then
                echo "Not a PR comment; skipping."
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              body_trimmed="$(echo "$COMMENT_BODY" | head -n1 | tr -d '[:space:]')"
              if [ "$body_trimmed" != "/resolve-conflicts" ] && [ "$body_trimmed" != "/resolve" ]; then
                echo "Comment does not match slash-command; skipping."
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              case "$COMMENT_AUTHOR_ASSOC" in
                OWNER|MEMBER|COLLABORATOR)
                  echo "should_run=true" >> "$GITHUB_OUTPUT"
                  echo "pr_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "Commenter association $COMMENT_AUTHOR_ASSOC not privileged; skipping."
                  echo "should_run=false" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  resolve:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR context
        id: ctx
        run: |
          set -euo pipefail
          data="$(gh pr view "$PR_NUMBER" --json number,headRefName,baseRefName,headRepositoryOwner,headRepository,mergeable,mergeStateStatus,files)"
          echo "$data" > pr.json
          head_branch=$(jq -r '.headRefName' pr.json)
          base_branch=$(jq -r '.baseRefName' pr.json)
          mergeable=$(jq -r '.mergeable' pr.json)
          echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "mergeable=$mergeable" >> "$GITHUB_OUTPUT"

      - name: Phase 1 — annotate sticky comment
        id: annotate
        run: |
          set -euo pipefail
          MARKER="<!-- conflict-helper:sticky -->"
          mergeable="${{ steps.ctx.outputs.mergeable }}"
          head_branch="${{ steps.ctx.outputs.head_branch }}"
          base_branch="${{ steps.ctx.outputs.base_branch }}"
          {
            echo "$MARKER"
            echo "### Conflict Helper — status"
            echo
            echo "- Mergeable: \`$mergeable\`"
            echo "- Head: \`$head_branch\`"
            echo "- Base: \`$base_branch\`"
            echo "- Run: [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > body.md
          # Find and update or create sticky
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1 || true)
          if [ -n "${existing:-}" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$(cat body.md)" >/dev/null
            echo "comment_id=$existing" >> "$GITHUB_OUTPUT"
          else
            new_id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(cat body.md)" --jq .id)
            echo "comment_id=$new_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 2 — mechanical resolver
        id: mech
        if: steps.ctx.outputs.mergeable == 'CONFLICTING'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "conflict-helper[bot]"
          git config user.email "conflict-helper@users.noreply.github.com"
          head_branch="${{ steps.ctx.outputs.head_branch }}"
          base_branch="${{ steps.ctx.outputs.base_branch }}"
          git fetch origin "$head_branch" "$base_branch"
          git checkout "$head_branch"
          # Attempt merge; the resolver script (if present) handles patterns.
          if git merge --no-commit --no-ff "origin/$base_branch"; then
            echo "No conflicts after merge attempt."
            git merge --abort || true
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # For now, we can only claim resolution for the trivial no-op case.
          # Real pattern matching lives in a follow-up; surrender cleanly.
          git merge --abort || true
          echo "exit_code=1" >> "$GITHUB_OUTPUT"
          echo "resolved=false" >> "$GITHUB_OUTPUT"

      - name: Phase 3 — dispatch Jules
        id: jules
        if: steps.ctx.outputs.mergeable == 'CONFLICTING' && steps.mech.outputs.resolved != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # PRs and issues share GitHub's number space; jules-coding-agent.yml
          # declares its input as issue_number, so pass PR_NUMBER there.
          if gh workflow run jules-coding-agent.yml -f issue_number="$PR_NUMBER"; then
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure outcome labels exist
        run: |
          set -euo pipefail
          for label in "conflicts:auto-resolved:0e8a16" "conflicts:needs-jules:fbca04" "conflicts:needs-human:d93f0b"; do
            name="${label%:*}"
            color="${label##*:}"
            gh api -X POST "repos/$GITHUB_REPOSITORY/labels" -f name="$name" -f color="$color" >/dev/null 2>&1 || true
          done

      - name: Apply outcome label and update sticky comment
        env:
          MERGEABLE: ${{ steps.ctx.outputs.mergeable }}
          MECH_RESOLVED: ${{ steps.mech.outputs.resolved }}
          MECH_EXIT: ${{ steps.mech.outputs.exit_code }}
          JULES_DISPATCHED: ${{ steps.jules.outputs.dispatched }}
          HEAD_BRANCH: ${{ steps.ctx.outputs.head_branch }}
          COMMENT_ID: ${{ steps.annotate.outputs.comment_id }}
        run: |
          set -euo pipefail
          MARKER="<!-- conflict-helper:sticky -->"

          if [ "$MERGEABLE" != "CONFLICTING" ]; then
            decision="no-conflict"
            emoji="✅"
            summary="**No conflicts.** PR is mergeable; nothing to do."
            job="Wait for CI, then merge."
            label=""
          elif [ "$MECH_RESOLVED" = "true" ]; then
            decision="resolved"
            emoji="✅"
            summary="**Auto-resolved.** Mechanical patterns matched every conflict; a follow-up commit was pushed to \`$HEAD_BRANCH\`."
            job="Wait for CI to finish, then merge. Nothing to review beyond the auto-commit."
            label="conflicts:auto-resolved"
          elif [ "$JULES_DISPATCHED" = "true" ]; then
            decision="handed-to-jules"
            emoji="🟡"
            summary="**Handed to Jules.** Non-trivial conflicts were dispatched to \`jules-coding-agent.yml\`."
            job="Wait for Jules to push a resolution commit or open a follow-up PR."
            label="conflicts:needs-jules"
          else
            decision="needs-human"
            emoji="🔴"
            summary="**Surrendered.** No mechanical pattern matched and Jules dispatch is unavailable or errored."
            job="Resolve conflicts manually, then push to \`$HEAD_BRANCH\`."
            label="conflicts:needs-human"
          fi

          # Apply outcome label (and remove the other two)
          if [ -n "$label" ]; then
            for other in conflicts:auto-resolved conflicts:needs-jules conflicts:needs-human; do
              if [ "$other" != "$label" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$other" >/dev/null 2>&1 || true
              fi
            done
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=$label" >/dev/null 2>&1 || true
          fi

          {
            echo "$MARKER"
            echo "### Conflict Helper — outcome"
            echo
            echo "$emoji $summary"
            echo
            echo "**Your job:** $job"
            echo
            echo "<details><summary>Phase details</summary>"
            echo
            echo "- Phase 2 (mechanical) exit code: \`${MECH_EXIT:-not-attempted}\`"
            echo "- Phase 3 (Jules) dispatched: \`${JULES_DISPATCHED:-not-attempted}\`"
            echo "- Phase decision: \`$decision\`"
            echo "- Run: [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo "</details>"
            echo
            echo "---"
            echo
            echo "- Mergeable: \`$MERGEABLE\`"
            echo "- Head: \`$HEAD_BRANCH\`"
          } > body.md

          if [ -n "${COMMENT_ID:-}" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$(cat body.md)" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(cat body.md)" >/dev/null
          fi
