name: Conflict Helper

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  resolve:
    # Run on PR events, workflow_dispatch, OR an issue_comment that is a /resolve slash-command on a PR
    # authored by someone with write access.
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/resolve-conflicts') || contains(github.event.comment.body, '/resolve')) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              PR_NUMBER="${{ github.event.pull_request.number }}"
              ;;
            issue_comment)
              PR_NUMBER="${{ github.event.issue.number }}"
              ;;
            workflow_dispatch)
              PR_NUMBER="${{ inputs.pr_number }}"
              ;;
          esac
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Fetch PR metadata (head ref, base ref, head sha) so all triggers can act uniformly.
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          HEAD_REF=$(echo "$PR_JSON" | jq -r .head.ref)
          BASE_REF=$(echo "$PR_JSON" | jq -r .base.ref)
          HEAD_SHA=$(echo "$PR_JSON" | jq -r .head.sha)
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Acknowledge slash-command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -H "Accept: application/vnd.github+json" \
            -f content='rocket' || true

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Phase 1 — Annotate conflicts
        id: phase1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          # Attempt merge to surface conflicts without committing.
          if git merge --no-commit --no-ff "origin/$BASE_REF" 2>/dev/null; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            git merge --abort 2>/dev/null || true
          else
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            CONFLICTED=$(git diff --name-only --diff-filter=U || true)
            echo "conflicted_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CONFLICTED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            git merge --abort 2>/dev/null || true
          fi

      - name: Phase 2 — Mechanical resolve
        id: phase2
        if: steps.phase1.outputs.has_conflicts == 'true'
        env:
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
        continue-on-error: true
        run: |
          set +e
          git fetch origin "$BASE_REF"
          git merge --no-commit --no-ff "origin/$BASE_REF"
          MERGE_EXIT=$?

          # Mechanical patterns: additive-only blocks (both sides added distinct lines) get unioned.
          RESOLVED_ANY=0
          for f in $(git diff --name-only --diff-filter=U); do
            # Very conservative: if the file has only <<<<<<<//=======//>>>>>>> markers with additive content,
            # union both sides. Anything more complex is left alone.
            python3 - "$f" <<'PY'
import sys, re, pathlib
p = pathlib.Path(sys.argv[1])
text = p.read_text(errors='replace')
pattern = re.compile(
    r'<{7} [^\n]*\n(?P<ours>.*?)={7}\n(?P<theirs>.*?)>{7} [^\n]*\n',
    re.DOTALL,
)
def repl(m):
    ours = m.group('ours')
    theirs = m.group('theirs')
    # Only auto-union if neither side is empty and they don't contain nested markers.
    if '<<<<<<<' in ours or '<<<<<<<' in theirs:
        return m.group(0)
    return ours + theirs
new = pattern.sub(repl, text)
if new != text and '<<<<<<<' not in new:
    p.write_text(new)
    print('RESOLVED')
else:
    print('SKIP')
PY
            if [ $? -eq 0 ]; then
              if ! grep -q '<<<<<<<' "$f" 2>/dev/null; then
                git add "$f"
                RESOLVED_ANY=1
              fi
            fi
          done

          REMAINING=$(git diff --name-only --diff-filter=U | wc -l | tr -d ' ')
          if [ "$REMAINING" = "0" ] && [ "$RESOLVED_ANY" = "1" ]; then
            git commit -m "chore(conflicts): auto-resolve mechanical conflicts"
            git push origin HEAD
            echo "resolved=true" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            git merge --abort 2>/dev/null || true
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "exit_code=$MERGE_EXIT" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 3 — Dispatch Jules
        id: phase3
        if: steps.phase1.outputs.has_conflicts == 'true' && steps.phase2.outputs.resolved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        continue-on-error: true
        run: |
          set +e
          # jules-coding-agent.yml declares its input as `issue_number`, not `pr_number`.
          # PRs and issues share GitHub's number space so passing PR_NUMBER as issue_number
          # is the semantically correct call.
          if gh workflow run jules-coding-agent.yml -f issue_number="$PR_NUMBER" 2>/dev/null; then
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply outcome label
        if: steps.phase1.outputs.has_conflicts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          RESOLVED: ${{ steps.phase2.outputs.resolved }}
          DISPATCHED: ${{ steps.phase3.outputs.dispatched }}
        run: |
          set -euo pipefail
          # Ensure labels exist (idempotent).
          for L in 'conflicts:auto-resolved:0e8a16' 'conflicts:needs-jules:fbca04' 'conflicts:needs-human:d93f0b'; do
            NAME="${L%:*}"
            COLOR="${L##*:}"
            gh api "repos/${{ github.repository }}/labels" -f name="$NAME" -f color="$COLOR" 2>/dev/null || \
              gh api -X PATCH "repos/${{ github.repository }}/labels/$NAME" -f new_name="$NAME" -f color="$COLOR" 2>/dev/null || true
          done

          # Clear prior outcome labels.
          for L in conflicts:auto-resolved conflicts:needs-jules conflicts:needs-human; do
            gh api -X DELETE "repos/${{ github.repository }}/issues/$PR_NUMBER/labels/$L" 2>/dev/null || true
          done

          if [ "$RESOLVED" = "true" ]; then
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" -f "labels[]=conflicts:auto-resolved"
          elif [ "$DISPATCHED" = "true" ]; then
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" -f "labels[]=conflicts:needs-jules"
          else
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" -f "labels[]=conflicts:needs-human"
          fi

      - name: Update sticky comment with outcome
        if: always() && steps.ctx.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
          HAS_CONFLICTS: ${{ steps.phase1.outputs.has_conflicts }}
          RESOLVED: ${{ steps.phase2.outputs.resolved }}
          PHASE2_EXIT: ${{ steps.phase2.outputs.exit_code }}
          DISPATCHED: ${{ steps.phase3.outputs.dispatched }}
        run: |
          set -euo pipefail
          MARKER='<!-- conflict-helper:sticky -->'

          if [ "$HAS_CONFLICTS" != "true" ]; then
            OUTCOME_EMOJI='✅'
            OUTCOME_LINE='**No conflicts detected.**'
            NEXT_STEP='Nothing to do.'
            DECISION='no-conflicts'
          elif [ "$RESOLVED" = "true" ]; then
            OUTCOME_EMOJI='✅'
            OUTCOME_LINE="**Auto-resolved.** Mechanical patterns matched every conflict; a follow-up commit was pushed to \`$HEAD_REF\`."
            NEXT_STEP='wait for CI to finish, then merge. Nothing to review beyond the auto-commit.'
            DECISION='resolved'
          elif [ "$DISPATCHED" = "true" ]; then
            OUTCOME_EMOJI='🟡'
            OUTCOME_LINE='**Handed off to Jules.** Mechanical resolver could not match all conflicts; the Jules coding agent has been dispatched.'
            NEXT_STEP='wait for Jules to push a follow-up commit or open a suggestion PR.'
            DECISION='needs-jules'
          else
            OUTCOME_EMOJI='🔴'
            OUTCOME_LINE='**Surrendered.** Mechanical resolver failed and Jules dispatch was not attempted or failed.'
            NEXT_STEP='resolve the conflicts manually, or re-run with `/resolve-conflicts` after fixing.'
            DECISION='needs-human'
          fi

          DISPATCHED_DISPLAY="${DISPATCHED:-not-attempted}"
          PHASE2_EXIT_DISPLAY="${PHASE2_EXIT:-n/a}"

          BODY=$(cat <<EOF
$MARKER
### Conflict Helper — outcome

$OUTCOME_EMOJI $OUTCOME_LINE

**Your job:** $NEXT_STEP

<details><summary>Phase details</summary>

- Phase 1 (annotate) has_conflicts: \`${HAS_CONFLICTS:-false}\`
- Phase 2 (mechanical) exit code: \`$PHASE2_EXIT_DISPLAY\`
- Phase 3 (Jules) dispatched: \`$DISPATCHED_DISPLAY\`
- Phase decision: \`$DECISION\`

</details>

---

_Trigger \`/resolve-conflicts\` (or \`/resolve\`) as a PR comment to re-run this workflow._
EOF
)

          # Find and update or create sticky comment.
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            | jq -r --arg m "$MARKER" '.[] | select(.body | startswith($m)) | .id' | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi
