name: Conflict Helper

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  resolve:
    # Run on PR events, manual dispatch, or /resolve[-conflicts] slash-command from trusted users
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/resolve-conflicts') || contains(github.event.comment.body, '/resolve')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              PR_NUMBER="${{ github.event.pull_request.number }}"
              ;;
            issue_comment)
              PR_NUMBER="${{ github.event.issue.number }}"
              ;;
            workflow_dispatch)
              PR_NUMBER="${{ inputs.pr_number }}"
              ;;
          esac
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 1 — annotate conflicts
        id: phase1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge origin/main --no-commit --no-ff || true
          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          echo "conflicts<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONFLICTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          git merge --abort 2>/dev/null || true

      - name: Phase 2 — mechanical auto-resolve
        id: phase2
        if: steps.phase1.outputs.conflicts != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "conflict-helper[bot]"
          git config user.email "conflict-helper@users.noreply.github.com"
          git fetch origin main
          # Attempt merge with union strategy for common mechanical patterns
          if git merge origin/main --no-edit -X theirs; then
            git push origin HEAD
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort 2>/dev/null || true
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Phase 3 — dispatch Jules
        id: phase3
        if: steps.phase1.outputs.conflicts != '' && steps.phase2.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          set -euo pipefail
          # FIX: jules-coding-agent.yml declares input as `issue_number`, not `pr_number`.
          # PRs and issues share GitHub's number space, so this is semantically correct.
          if gh workflow run jules-coding-agent.yml -f issue_number="$PR_NUMBER"; then
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Apply outcome label & sticky comment
        if: always() && steps.phase1.outputs.conflicts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
          PHASE2_OUTCOME: ${{ steps.phase2.outcome }}
          PHASE3_OUTCOME: ${{ steps.phase3.outcome }}
          PHASE3_DISPATCHED: ${{ steps.phase3.outputs.dispatched || 'not-attempted' }}
        run: |
          set -euo pipefail

          # Ensure labels exist (idempotent)
          for label in "conflicts:auto-resolved:0e8a16" "conflicts:needs-jules:fbca04" "conflicts:needs-human:d93f0b"; do
            name="${label%:*}"
            color="${label##*:}"
            gh label create "$name" --color "$color" 2>/dev/null || true
          done

          # Remove all outcome labels first
          for l in conflicts:auto-resolved conflicts:needs-jules conflicts:needs-human; do
            gh pr edit "$PR_NUMBER" --remove-label "$l" 2>/dev/null || true
          done

          if [ "$PHASE2_OUTCOME" = "success" ]; then
            OUTCOME_LABEL="conflicts:auto-resolved"
            OUTCOME_EMOJI="✅"
            OUTCOME_TITLE="Auto-resolved."
            OUTCOME_BODY="Mechanical patterns matched every conflict; a follow-up commit was pushed to \`$HEAD_REF\`."
            OUTCOME_JOB="wait for CI to finish, then merge. Nothing to review beyond the auto-commit."
            DECISION="resolved"
          elif [ "$PHASE3_DISPATCHED" = "true" ]; then
            OUTCOME_LABEL="conflicts:needs-jules"
            OUTCOME_EMOJI="🟡"
            OUTCOME_TITLE="Handed to Jules."
            OUTCOME_BODY="Mechanical resolver couldn't handle it. Jules coding agent has been dispatched."
            OUTCOME_JOB="wait for Jules to push a resolution commit. Approve the summary when it lands."
            DECISION="dispatched-to-jules"
          else
            OUTCOME_LABEL="conflicts:needs-human"
            OUTCOME_EMOJI="🔴"
            OUTCOME_TITLE="Surrendered."
            OUTCOME_BODY="Neither mechanical resolution nor Jules dispatch succeeded."
            OUTCOME_JOB="resolve conflicts manually. Post \`/resolve-conflicts\` to retry."
            DECISION="needs-human"
          fi

          gh pr edit "$PR_NUMBER" --add-label "$OUTCOME_LABEL"

          BODY=$(cat <<EOF
          <!-- conflict-helper-sticky -->
          ### Conflict Helper — outcome

          $OUTCOME_EMOJI **$OUTCOME_TITLE** $OUTCOME_BODY

          **Your job:** $OUTCOME_JOB

          <details><summary>Phase details</summary>

          - Phase 2 (mechanical) outcome: \`$PHASE2_OUTCOME\`
          - Phase 3 (Jules) dispatched: \`$PHASE3_DISPATCHED\`
          - Phase decision: \`$DECISION\`
          - Head ref: \`$HEAD_REF\`

          </details>

          ---

          _Trigger \`/resolve-conflicts\` (or \`/resolve\`) as a PR comment to re-run this workflow._
          EOF
          )

          # Update or create sticky comment
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- conflict-helper-sticky -->")) | .id' | head -n1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
              -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
