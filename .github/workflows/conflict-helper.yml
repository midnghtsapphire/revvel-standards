name: Conflict Helper

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  resolve:
    # Run on PR events, or on issue_comment when it's a PR comment containing /resolve or /resolve-conflicts
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/resolve-conflicts') || contains(github.event.comment.body, '/resolve')) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: prctx
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else {
              prNumber = context.payload.issue.number;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('mergeable', pr.mergeable === null ? 'unknown' : String(pr.mergeable));

      - name: Ensure outcome labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'conflicts:auto-resolved', color: '0e8a16', description: 'Mechanical resolver fixed all conflicts.' },
              { name: 'conflicts:needs-jules',   color: 'fbca04', description: 'Handed to Jules coding agent.' },
              { name: 'conflicts:needs-human',   color: 'b60205', description: 'Workflow surrendered; human required.' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l.name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...l });
                }
              }
            }

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.prctx.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "conflict-helper[bot]"
          git config user.email "conflict-helper@users.noreply.github.com"

      - name: Phase 1 — Detect conflicts
        id: detect
        run: |
          set +e
          git fetch origin "${{ steps.prctx.outputs.base_ref }}"
          git merge --no-commit --no-ff "origin/${{ steps.prctx.outputs.base_ref }}" > merge.log 2>&1
          MERGE_EXIT=$?
          if [ $MERGE_EXIT -eq 0 ]; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            git merge --abort 2>/dev/null || true
          else
            CONFLICTED=$(git diff --name-only --diff-filter=U || true)
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            {
              echo "conflicted_files<<EOF"
              echo "$CONFLICTED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 2 — Mechanical auto-resolve
        id: mech
        if: steps.detect.outputs.has_conflicts == 'true'
        run: |
          set +e
          RESOLVED_ALL=1
          for f in $(git diff --name-only --diff-filter=U); do
            if grep -q '^<<<<<<<' "$f"; then
              # Very conservative mechanical strategy:
              # For package.json-style version bumps and additive blocks, prefer incoming (base) side merged
              # with ours. We attempt a naive union merge; if any conflict markers remain, we mark unresolved.
              python3 - "$f" <<'PY'
import sys, re
p = sys.argv[1]
try:
    s = open(p, 'r', encoding='utf-8', errors='replace').read()
except Exception:
    sys.exit(0)
pat = re.compile(r'<{7} [^\n]*\n(.*?)\n={7}\n(.*?)\n>{7} [^\n]*\n', re.DOTALL)
def merge(m):
    ours, theirs = m.group(1), m.group(2)
    # If identical, keep one.
    if ours == theirs:
        return ours + '\n'
    # Union merge: concatenate unique lines preserving order.
    seen = set()
    out = []
    for line in (ours + '\n' + theirs).splitlines():
        if line not in seen:
            seen.add(line)
            out.append(line)
    return '\n'.join(out) + '\n'
new = pat.sub(merge, s)
open(p, 'w', encoding='utf-8').write(new)
PY
              if grep -q '^<<<<<<<' "$f"; then
                RESOLVED_ALL=0
              else
                git add "$f"
              fi
            fi
          done
          if [ $RESOLVED_ALL -eq 1 ]; then
            git commit -m "chore(conflict-helper): auto-resolve mechanical conflicts" || true
            git push origin HEAD:"${{ steps.prctx.outputs.head_ref }}" || true
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 3 — Dispatch Jules
        id: jules
        if: steps.detect.outputs.has_conflicts == 'true' && steps.mech.outputs.resolved != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.prctx.outputs.pr_number }}
        run: |
          set +e
          # FIX: jules-coding-agent.yml declares its input as `issue_number`, not `pr_number`.
          # PRs and issues share GitHub's number space; this is the semantically correct call.
          gh workflow run jules-coding-agent.yml -f issue_number="$PR_NUMBER"
          DISPATCH_EXIT=$?
          if [ $DISPATCH_EXIT -eq 0 ]; then
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine outcome & apply labels + sticky comment
        if: always()
        uses: actions/github-script@v7
        env:
          HAS_CONFLICTS: ${{ steps.detect.outputs.has_conflicts }}
          MECH_RESOLVED: ${{ steps.mech.outputs.resolved }}
          MECH_EXIT: ${{ steps.mech.outputs.exit_code }}
          JULES_DISPATCHED: ${{ steps.jules.outputs.dispatched }}
          HEAD_REF: ${{ steps.prctx.outputs.head_ref }}
          PR_NUMBER: ${{ steps.prctx.outputs.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const hasConflicts = process.env.HAS_CONFLICTS === 'true';
            const mechResolved = process.env.MECH_RESOLVED === 'true';
            const mechExit = process.env.MECH_EXIT || 'n/a';
            const julesDispatched = process.env.JULES_DISPATCHED || 'not-attempted';
            const headRef = process.env.HEAD_REF;

            let outcome, emoji, statusLine, yourJob, outcomeLabel;
            if (!hasConflicts) {
              outcome = 'clean';
              emoji = '✅';
              statusLine = `**No conflicts detected.** \`${headRef}\` merges cleanly.`;
              yourJob = 'Nothing. Proceed with normal review.';
              outcomeLabel = null;
            } else if (mechResolved) {
              outcome = 'resolved';
              emoji = '✅';
              statusLine = `**Auto-resolved.** Mechanical patterns matched every conflict; a follow-up commit was pushed to \`${headRef}\`.`;
              yourJob = 'Wait for CI to finish, then merge. Review the auto-commit if you want.';
              outcomeLabel = 'conflicts:auto-resolved';
            } else if (julesDispatched === 'true') {
              outcome = 'needs-jules';
              emoji = '🟡';
              statusLine = `**Handed to Jules.** Mechanical resolver couldn't handle it; dispatched \`jules-coding-agent.yml\` with \`issue_number=${prNumber}\`.`;
              yourJob = 'Wait for Jules to open a follow-up. If nothing arrives, run `/resolve-conflicts` again or resolve manually.';
              outcomeLabel = 'conflicts:needs-jules';
            } else {
              outcome = 'needs-human';
              emoji = '🔴';
              statusLine = `**Surrendered.** Neither the mechanical resolver nor the Jules dispatch succeeded.`;
              yourJob = 'Resolve conflicts locally: `git fetch origin && git checkout ' + headRef + ' && git merge origin/main`, fix, push.';
              outcomeLabel = 'conflicts:needs-human';
            }

            // Apply/rotate outcome labels
            const allOutcomeLabels = ['conflicts:auto-resolved', 'conflicts:needs-jules', 'conflicts:needs-human'];
            for (const l of allOutcomeLabels) {
              if (l === outcomeLabel) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, name: l,
                });
              } catch (e) { /* not present, ignore */ }
            }
            if (outcomeLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, labels: [outcomeLabel],
              });
            }

            const marker = '<!-- conflict-helper:sticky -->';
            const body = [
              marker,
              '### Conflict Helper — outcome',
              '',
              `${emoji} ${statusLine}`,
              '',
              `**Your job:** ${yourJob}`,
              '',
              '<details><summary>Phase details</summary>',
              '',
              `- Phase 1 (detect) conflicts: \`${hasConflicts}\``,
              `- Phase 2 (mechanical) exit code: \`${mechExit}\``,
              `- Phase 2 resolved everything: \`${mechResolved}\``,
              `- Phase 3 (Jules) dispatched: \`${julesDispatched}\``,
              `- Phase decision: \`${outcome}\``,
              '',
              '</details>',
              '',
              '<sub>Trigger a re-run anytime by commenting `/resolve-conflicts` (or `/resolve`).</sub>',
            ].join('\n');

            // Find existing sticky
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
            }
