name: Conflict Helper

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/resolve-conflicts') ||
        contains(github.event.comment.body, '/resolve')) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    steps:
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              PR_NUMBER="${{ github.event.pull_request.number }}"
              ;;
            issue_comment)
              PR_NUMBER="${{ github.event.issue.number }}"
              ;;
            workflow_dispatch)
              PR_NUMBER="${{ inputs.pr_number }}"
              ;;
          esac
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 1 — annotate
        id: phase1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          echo "phase1_status=ok" >> "$GITHUB_OUTPUT"

      - name: Phase 2 — mechanical auto-resolve
        id: phase2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          set +e
          git config user.name "conflict-helper[bot]"
          git config user.email "conflict-helper@users.noreply.github.com"

          BASE=$(gh pr view "$PR_NUMBER" --json baseRefName -q .baseRefName)
          git fetch origin "$BASE"
          git merge "origin/$BASE" --no-edit
          MERGE_EXIT=$?

          if [ $MERGE_EXIT -eq 0 ]; then
            echo "phase2_exit=0" >> "$GITHUB_OUTPUT"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
            git push origin HEAD:"${{ steps.ctx.outputs.head_ref }}" || true
            exit 0
          fi

          # Attempt trivial resolution: version bumps + additive blocks
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          RESOLVED_ALL=true
          for f in $CONFLICTS; do
            # naive: prefer incoming for lockfiles/version files
            case "$f" in
              *package-lock.json|*yarn.lock|*Cargo.lock|*poetry.lock|*.lock)
                git checkout --theirs "$f" && git add "$f" || RESOLVED_ALL=false
                ;;
              *)
                RESOLVED_ALL=false
                ;;
            esac
          done

          if [ "$RESOLVED_ALL" = "true" ] && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
            git commit -m "chore: auto-resolve mechanical conflicts"
            git push origin HEAD:"${{ steps.ctx.outputs.head_ref }}" || true
            echo "phase2_exit=0" >> "$GITHUB_OUTPUT"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "phase2_exit=1" >> "$GITHUB_OUTPUT"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 3 — dispatch Jules
        id: phase3
        if: steps.phase2.outputs.resolved != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          set +e
          if gh workflow list --json name -q '.[].name' | grep -q '^jules-coding-agent'; then
            gh workflow run jules-coding-agent.yml -f issue_number="$PR_NUMBER"
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine outcome & label
        id: outcome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          PHASE2_RESOLVED: ${{ steps.phase2.outputs.resolved }}
          PHASE3_DISPATCHED: ${{ steps.phase3.outputs.dispatched }}
        run: |
          set -euo pipefail

          # Ensure labels exist
          for lbl in "conflicts:auto-resolved" "conflicts:needs-jules" "conflicts:needs-human"; do
            gh label create "$lbl" --color "ededed" 2>/dev/null || true
          done

          # Remove prior outcome labels
          for lbl in "conflicts:auto-resolved" "conflicts:needs-jules" "conflicts:needs-human"; do
            gh pr edit "$PR_NUMBER" --remove-label "$lbl" 2>/dev/null || true
          done

          if [ "${PHASE2_RESOLVED:-false}" = "true" ]; then
            OUTCOME="resolved"
            LABEL="conflicts:auto-resolved"
            EMOJI="✅"
            HEADLINE="**Auto-resolved.** Mechanical patterns matched every conflict; a follow-up commit was pushed to \`${{ steps.ctx.outputs.head_ref }}\`."
            NEXT_JOB="wait for CI to finish, then merge. Nothing to review beyond the auto-commit."
            P3_STATE="not-attempted"
          elif [ "${PHASE3_DISPATCHED:-false}" = "true" ]; then
            OUTCOME="needs-jules"
            LABEL="conflicts:needs-jules"
            EMOJI="🟡"
            HEADLINE="**Handed to Jules.** Mechanical resolver couldn't handle this; the Jules coding agent has been dispatched."
            NEXT_JOB="wait for Jules to push a commit or open a follow-up PR. If nothing happens within a reasonable window, treat as needs-human."
            P3_STATE="dispatched"
          else
            OUTCOME="needs-human"
            LABEL="conflicts:needs-human"
            EMOJI="🔴"
            HEADLINE="**Surrendered.** Neither the mechanical resolver nor Jules could handle this PR."
            NEXT_JOB="resolve conflicts manually. See \`docs/CONFLICT_RESOLUTION_STANDARD.md\` §11."
            P3_STATE="unavailable"
          fi

          gh pr edit "$PR_NUMBER" --add-label "$LABEL"

          {
            echo "outcome=$OUTCOME"
            echo "label=$LABEL"
            echo "emoji=$EMOJI"
            echo "p3_state=$P3_STATE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "headline<<EOF"
            echo "$HEADLINE"
            echo "EOF"
            echo "next_job<<EOF"
            echo "$NEXT_JOB"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: |
          set -euo pipefail
          MARKER="<!-- conflict-helper-sticky -->"
          P2_EXIT="${{ steps.phase2.outputs.phase2_exit || 'skipped' }}"
          P3_STATE="${{ steps.outcome.outputs.p3_state }}"
          DECISION="${{ steps.outcome.outputs.outcome }}"

          BODY=$(cat <<EOF
$MARKER
### Conflict Helper — outcome

${{ steps.outcome.outputs.emoji }} ${{ steps.outcome.outputs.headline }}

**Your job:** ${{ steps.outcome.outputs.next_job }}

<details><summary>Phase details</summary>

- Phase 2 (mechanical) exit code: \`$P2_EXIT\`
- Phase 3 (Jules) dispatched: \`$P3_STATE\`
- Phase decision: \`$DECISION\`
- Triggered by: \`${{ github.event_name }}\`
- Run: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

</details>

<sub>Post \`/resolve-conflicts\` (or \`/resolve\`) as a comment to re-run this workflow on demand.</sub>
EOF
)

          # Find existing sticky comment
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" \
              -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
