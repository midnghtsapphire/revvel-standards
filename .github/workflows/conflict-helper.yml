name: Merge Conflict Helper

# ── Four-lane conflict resolver: annotate → mechanical → Jules → human ─────
# When a PR shows conflicts, the GitHub web UI offers "current / incoming /
# both" but never explains which PR introduced each side and forces the
# owner to click every hunk. That is unmanageable at repo scale.
#
# This workflow runs the four-lane resolver from
# `docs/CONFLICT_RESOLUTION_STANDARD.md`:
#
#   Phase 1 — Annotate: identify conflicted hunks, walk `git blame` on
#             each side, resolve blame back to a PR + author, post a
#             sticky comment naming who introduced what.
#   Phase 2 — Mechanical auto-resolve: run
#             `scripts/auto-resolve-mechanical-conflicts.js` against the
#             conflicted tree. Handles version bumps and additive blocks
#             deterministically. If it fully resolves, commits and pushes
#             back to the PR branch as a single audit-trail commit.
#   Phase 3 — Jules hand-off: for anything the mechanical script left
#             ambiguous, apply label `conflicts:needs-jules` and dispatch
#             `jules-coding-agent.yml` with the PR number as
#             `issue_number` (PRs and issues share a number space on
#             GitHub, so passing the PR number as `issue_number` is
#             correct and is what jules-coding-agent.yml expects).
#   Phase 4 — Human: if Jules also surrenders (`conflicts:needs-human`
#             label), the owner takes over.
#
# The outcome-summary step at the end updates the sticky comment with a
# clear "here is what I did, here is what you need to do" block so the
# owner never has to guess whether the workflow ran.
#
# Trigger surface:
#   - Automatic: on pull_request events, only when GitHub reports
#     `mergeable_state: dirty` OR the PR carries the `has-conflicts` label.
#   - Manual: post `/resolve-conflicts` (or `/resolve` for short) as a
#     comment on a conflicted PR. This is the "kick it and see" lever for
#     when the owner wants a fresh run.
# ────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to resolve conflicts on'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  gate:
    name: Gate (slash-command or PR event)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "pr_number=$PR_NUMBER_EVENT" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "pr_number=$PR_NUMBER_INPUT" >> "$GITHUB_OUTPUT"
              ;;
            issue_comment)
              if [ "$IS_PR_COMMENT" != "true" ]; then
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Match /resolve or /resolve-conflicts at start of a line
              if ! echo "$COMMENT_BODY" | grep -qE '^/resolve(-conflicts)?[[:space:]]*$'; then
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Gate to trusted roles
              case "$COMMENT_AUTHOR_ASSOC" in
                OWNER|MEMBER|COLLABORATOR)
                  echo "should_run=true" >> "$GITHUB_OUTPUT"
                  echo "pr_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "Rejecting slash-command from author_association=$COMMENT_AUTHOR_ASSOC"
                  echo "should_run=false" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  resolve:
    name: Attempt conflict resolution
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve PR context
        id: pr
        run: |
          set -euo pipefail
          data=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}")
          head_ref=$(echo "$data" | jq -r .head.ref)
          head_sha=$(echo "$data" | jq -r .head.sha)
          head_repo=$(echo "$data" | jq -r .head.repo.full_name)
          base_ref=$(echo "$data" | jq -r .base.ref)
          mergeable=$(echo "$data" | jq -r .mergeable)
          echo "head_ref=$head_ref"     >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha"     >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo"   >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref"     >> "$GITHUB_OUTPUT"
          echo "mergeable=$mergeable"   >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_ref }}
          persist-credentials: false

concurrency:
  # PR number lives on `pull_request` events; on `issue_comment` events it
  # is `github.event.issue.number` (PRs are addressable as issues). Fall
  # through so both event types share the same lock.
  group: >-
    conflict-helper-${{
      github.event.pull_request.number ||
      github.event.issue.number
    }}
  cancel-in-progress: true

  analyze:
    name: Run conflict resolver (annotate → mechanical → Jules)
    runs-on: ubuntu-latest
    # Fire on: (a) PRs GitHub reports as `dirty`, (b) PRs carrying the
    # `has-conflicts` label, or (c) an `/resolve-conflicts` (or `/resolve`)
    # comment on a PR. The comment lane is the manual "kick it now" lever
    # for the owner and is gated on the actor being a repo collaborator so
    # a random commenter cannot dispatch the workflow.
    if: |-
      (github.event_name == 'pull_request' && (
        github.event.pull_request.mergeable_state == 'dirty' ||
        contains(github.event.pull_request.labels.*.name, 'has-conflicts')
      )) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (
         contains(github.event.comment.body, '/resolve-conflicts') ||
         contains(github.event.comment.body, '/resolve')
       ) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    steps:
      # `pull_request` events already carry PR head SHA + number in the
      # event payload. `issue_comment` events do not, so resolve them.
      - name: Resolve PR context (works for both event types)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          ISSUE_FROM_EVENT: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            PR_NUMBER="$PR_FROM_EVENT"
          else
            PR_NUMBER="$ISSUE_FROM_EVENT"
          fi
          # Fetch head SHA + head ref from the API so downstream steps have
          # them regardless of trigger event.
          data="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")"
          head_sha="$(printf '%s' "$data" | jq -r '.head.sha')"
          head_ref="$(printf '%s' "$data" | jq -r '.head.ref')"
          base_sha="$(printf '%s' "$data" | jq -r '.base.sha')"
          base_ref="$(printf '%s' "$data" | jq -r '.base.ref')"
          echo "pr_number=$PR_NUMBER"    >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha"       >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref"       >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha"       >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref"       >> "$GITHUB_OUTPUT"

      - name: Check out PR with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
      - name: Detect conflicts and analyze each hunk
        id: analyze
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "conflict-helper[bot]"
          git config user.email "conflict-helper@users.noreply.github.com"

      - name: Phase 1 — Detect conflicts against base
        id: phase1
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF":refs/remotes/origin/"$BASE_REF"
          if git merge --no-commit --no-ff "origin/$BASE_REF"; then
            git merge --abort || true
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflicted_files=$files" >> "$GITHUB_OUTPUT"
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      - name: Phase 2 — Mechanical auto-resolve
        id: phase2
        if: steps.phase1.outputs.has_conflicts == 'true'
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        continue-on-error: true
        run: |
          set +e
          git merge --no-ff --no-commit "origin/$BASE_REF"
          # Very conservative auto-resolve: prefer ours for lockfiles, theirs for CHANGELOG additive blocks
          resolved_any=0
          for f in $(git diff --name-only --diff-filter=U); do
            case "$f" in
              package-lock.json|pnpm-lock.yaml|yarn.lock|poetry.lock|Cargo.lock)
                git checkout --ours -- "$f" && git add "$f" && resolved_any=1 ;;
              CHANGELOG.md|CHANGELOG)
                git checkout --theirs -- "$f" && git add "$f" && resolved_any=1 ;;
            esac
          done
          remaining=$(git diff --name-only --diff-filter=U | wc -l | tr -d ' ')
          if [ "$remaining" = "0" ] && [ "$resolved_any" = "1" ]; then
            git commit -m "chore(conflict-helper): auto-resolve mechanical conflicts"
            git push origin HEAD:"${{ steps.pr.outputs.head_ref }}"
            echo "outcome=resolved" >> "$GITHUB_OUTPUT"
            exit 0
          else
            git merge --abort || true
            echo "outcome=surrendered" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Phase 3 — Dispatch Jules if mechanical failed
        id: phase3
        if: steps.phase1.outputs.has_conflicts == 'true' && steps.phase2.outputs.outcome != 'resolved'
        continue-on-error: true
        run: |
          set -euo pipefail
          # PRs and issues share the same number space; jules-coding-agent expects issue_number.
          if gh workflow run jules-coding-agent.yml -f issue_number="$PR_NUMBER"; then
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Compute outcome + labels
        id: outcome
        env:
          HAS_CONFLICTS: ${{ steps.phase1.outputs.has_conflicts }}
          PHASE2_OUTCOME: ${{ steps.phase2.outputs.outcome }}
          PHASE3_DISPATCHED: ${{ steps.phase3.outputs.dispatched }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          if [ "$HAS_CONFLICTS" != "true" ]; then
            emoji="✅"
            label="conflicts:auto-resolved"
            headline="**No conflicts detected.** Nothing to do."
            job="Nothing. Merge when CI is green."
            phase_decision="no-conflicts"
          elif [ "$PHASE2_OUTCOME" = "resolved" ]; then
            emoji="✅"
            label="conflicts:auto-resolved"
            headline="**Auto-resolved.** Mechanical patterns matched every conflict; a follow-up commit was pushed to \`$HEAD_REF\`."
            job="Wait for CI to finish, then merge. Nothing to review beyond the auto-commit."
            phase_decision="resolved"
          elif [ "$PHASE3_DISPATCHED" = "true" ]; then
            emoji="🟡"
            label="conflicts:needs-jules"
            headline="**Handed off to Jules.** Mechanical resolver couldn't handle it; Jules workflow dispatched."
            job="Wait for Jules to push a commit. If nothing happens within ~15 min, add \`/resolve\` or apply \`conflicts:needs-human\`."
            phase_decision="jules-dispatched"
          else
            emoji="🔴"
            label="conflicts:needs-human"
            headline="**Surrendered.** Neither the mechanical resolver nor Jules dispatch succeeded."
            job="Rebase or merge \`base\` locally and resolve by hand."
            phase_decision="needs-human"
          fi
          echo "emoji=$emoji"                 >> "$GITHUB_OUTPUT"
          echo "label=$label"                 >> "$GITHUB_OUTPUT"
          echo "phase_decision=$phase_decision" >> "$GITHUB_OUTPUT"
          {
            echo "headline<<EOF"
            echo "$headline"
            echo "EOF"
            echo "job<<EOF"
            echo "$job"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure outcome labels exist
        run: |
          set -euo pipefail
          for l in "conflicts:auto-resolved:0e8a16" "conflicts:needs-jules:fbca04" "conflicts:needs-human:b60205"; do
            name="${l%:*}"
            color="${l##*:}"
            gh label create "$name" --color "$color" --repo "${{ github.repository }}" >/dev/null 2>&1 || true
          done

      - name: Apply outcome label (and clear siblings)
        env:
          LABEL: ${{ steps.outcome.outputs.label }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          for l in conflicts:auto-resolved conflicts:needs-jules conflicts:needs-human; do
            if [ "$l" != "$LABEL" ]; then
              gh pr edit "$PR_NUMBER" --remove-label "$l" --repo "${{ github.repository }}" >/dev/null 2>&1 || true
            fi
          done
          gh pr edit "$PR_NUMBER" --add-label "$LABEL" --repo "${{ github.repository }}"

      - name: Upsert sticky outcome comment
        env:
          EMOJI: ${{ steps.outcome.outputs.emoji }}
          HEADLINE: ${{ steps.outcome.outputs.headline }}
          JOB: ${{ steps.outcome.outputs.job }}
          PHASE2_OUTCOME: ${{ steps.phase2.outputs.outcome }}
          PHASE3_DISPATCHED: ${{ steps.phase3.outputs.dispatched }}
          PHASE_DECISION: ${{ steps.outcome.outputs.phase_decision }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          marker="<!-- conflict-helper:sticky -->"
          p2="${PHASE2_OUTCOME:-not-attempted}"
          p3="${PHASE3_DISPATCHED:-not-attempted}"

          # Indent EOF contents to fix YAML parser issue
          body=$(cat <<EOF
          $marker
          ### Conflict Helper — outcome

          $EMOJI $HEADLINE

          **Your job:** $JOB

          <details><summary>Phase details</summary>

          - Phase 2 (mechanical) outcome: \`$p2\`
          - Phase 3 (Jules) dispatched: \`$p3\`
          - Phase decision: \`$PHASE_DECISION\`
          - Run: [$GITHUB_RUN_ID](https://github.com/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID)

          </details>

          <sub>Trigger a retry by commenting \`/resolve\` on this PR.</sub>
          EOF
          )

          # Strip leading indentation
          body=$(echo "$body" | sed 's/^[ \t]*//')

          existing=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
      # If anything stayed ambiguous, abort the merge (cleans the worktree)
      # and hand off to Jules via the existing jules-coding-agent.yml lane.
      # Explicitly NOT Copilot (per-PR cost adds up); NOT Bito (review-only,
      # can't push fixes); NOT openrouter-triage (that's the Ralph Loop
      # CI-fixer, separate concern). Jules is the right tool: coding agent,
      # already paid for via the existing API key, pushes commits directly.
      - name: Hand leftovers to Jules (NOT Copilot, NOT Bito)
        id: jules
        if: |-
          steps.analyze.outputs.has_conflicts == 'true' &&
          steps.resolve.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          git merge --abort 2>/dev/null || true
          gh issue edit "$PR_NUMBER" --add-label "conflicts:needs-jules" || true
          # Trigger Jules on this PR. The Jules workflow expects an issue or
          # PR number; we pass the PR. If the lane is paused / key missing,
          # the run will no-op gracefully per jules-coding-agent.yml's own
          # missing-secret behavior.
          # jules-coding-agent.yml declares its input as issue_number. PRs
          # and issues share GitHub number space, so passing the PR number
          # as issue_number is what jules-coding-agent.yml actually expects
          # — the previous `-f pr_number=...` call was silently discarded
          # because Jules never declared that input, leaving the PR stuck
          # with `conflicts:needs-jules` and no downstream action.
          if gh workflow run jules-coding-agent.yml -f issue_number="$PR_NUMBER" 2>/dev/null; then
            echo "jules_dispatched=true"  >> "$GITHUB_OUTPUT"
          else
            echo "jules_dispatched=false" >> "$GITHUB_OUTPUT"
            echo "::warning::jules-coding-agent.yml dispatch failed — check that the workflow exists on the default branch and its issue_number input is intact"
          fi

      # Compose the outcome block — the "here is what I did / what YOU
      # need to do" summary. Prepended above the Phase-1 provenance table
      # in the sticky comment so the owner sees the actionable status
      # first, without scrolling.
      - name: Build outcome summary
        id: outcome
        if: steps.analyze.outputs.has_conflicts == 'true'
        env:
          RESOLVE_EXIT: ${{ steps.resolve.outputs.exit_code }}
          JULES_DISPATCHED: ${{ steps.jules.outputs.jules_dispatched }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          # Three outcome buckets:
          #   0 = mechanical resolver fixed everything, commit pushed
          #   2 = leftovers — Jules dispatched (or dispatch failed, still needs a human)
          #   other = script error, no push, human takes over
          if [[ "$RESOLVE_EXIT" == "0" ]]; then
            phase="resolved"
            label="conflicts:auto-resolved"
            headline="✅ **Auto-resolved.** Mechanical patterns matched every conflict; a follow-up commit was pushed to \`$HEAD_REF\`."
            action="**Your job:** wait for CI to finish, then merge. Nothing to review beyond the auto-commit."
          elif [[ "$RESOLVE_EXIT" == "2" ]]; then
            if [[ "$JULES_DISPATCHED" == "true" ]]; then
              phase="jules"
              label="conflicts:needs-jules"
              headline="🟡 **Handed to Jules.** The mechanical resolver could not decide every hunk. \`jules-coding-agent.yml\` has been dispatched with \`issue_number=$PR_NUMBER\`."
              action="**Your job:** wait for Jules to push its resolution commit. If Jules also surrenders, the workflow will label the PR \`conflicts:needs-human\` — that means it is your turn."
            else
              phase="human"
              label="conflicts:needs-human"
              headline="🔴 **Needs a human.** Mechanical resolver could not decide, and the Jules dispatch failed."
              action="**Your job:** resolve manually, or comment \`/resolve-conflicts\` to retry after Jules is repaired."
            fi
          else
            phase="human"
            label="conflicts:needs-human"
            headline="🔴 **Mechanical resolver errored** (exit code $RESOLVE_EXIT). No commit pushed; worktree cleaned up."
            action="**Your job:** resolve manually, or comment \`/resolve-conflicts\` to retry."
          fi
          {
            printf '### Conflict Helper — outcome\n\n'
            printf '%s\n\n' "$headline"
            printf '%s\n\n' "$action"
            printf '<details><summary>Phase details</summary>\n\n'
            printf '- **Phase 2** (mechanical) exit code: `%s`\n' "$RESOLVE_EXIT"
            printf '- **Phase 3** (Jules) dispatched: `%s`\n' "${JULES_DISPATCHED:-not-attempted}"
            printf '- **Phase decision:** `%s`\n' "$phase"
            printf '\n</details>\n\n'
            printf '---\n\n'
          } > "$RUNNER_TEMP/outcome.md"
          echo "outcome_file=$RUNNER_TEMP/outcome.md" >> "$GITHUB_OUTPUT"
          echo "label=$label"                          >> "$GITHUB_OUTPUT"

      - name: Apply outcome label
        if: steps.analyze.outputs.has_conflicts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          LABEL: ${{ steps.outcome.outputs.label }}
        run: |
          # Best-effort label apply. Owner uses these to filter the PR
          # list into "auto-fixed, ready to merge" vs "needs me" buckets.
          # Missing-label failures are non-fatal — this is a nudge, not a gate.
          gh issue edit "$PR_NUMBER" --add-label "$LABEL" 2>/dev/null || \
            echo "::warning::could not apply label '$LABEL' — may not exist yet in the repo. Create it once and re-run."

      - name: Post / update sticky comment
        if: steps.analyze.outputs.has_conflicts == 'true'
        uses: actions/github-script@v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REPORT_FILE: ${{ steps.analyze.outputs.report_file }}
          OUTCOME_FILE: ${{ steps.outcome.outputs.outcome_file }}
        with:
          script: |
            const fs = require('fs');
            const outcome = fs.readFileSync(process.env.OUTCOME_FILE, 'utf8');
            const report  = fs.readFileSync(process.env.REPORT_FILE,  'utf8');
            const marker  = '<!-- conflict-helper:sticky -->';
            // Outcome block first (so the owner sees status without scrolling),
            // then the Phase-1 provenance table below.
            const body = `${marker}\n${outcome}${report}`;
            const prNumber = Number(process.env.PR_NUMBER);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated existing conflict-helper comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info('Posted new conflict-helper comment.');
            }
    timeout-minutes: 10
