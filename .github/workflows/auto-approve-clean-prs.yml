name: Auto-Approve Clean PRs

# 2026-07-25 owner-directive: quiet-mode gating removed 2026-08-08 per DECISIONS.md D017.
# Original quiet-mode disablement (PR #16805) archived here for RVS-PRESERVE-001 audit trail:
#   who: owner  when: 2026-07-25  why: reduce ~80 machine PRs/night, ~$400/week OpenRouter spend
# Exit-quiet-mode restoration (this file): DECISIONS.md D017, gated by open issue #17099.

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate'
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-approve-${{ github.event.pull_request.number || github.event.check_suite.id || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'auto-approve') ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Evaluate and approve clean PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: node scripts/auto-approve-clean-prs.js || echo "auto-approve completed with warnings"
