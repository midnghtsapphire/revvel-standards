# Auto-Approve Clean PRs
#
# Auto-approves PRs that pass all clean-PR heuristics (green CI, trusted author,
# scoped changes). Human review still gates merge for non-trusted authors.
#
# QUIET-MODE HISTORY (2026-07-25): Triggers were disabled by PR #16805 (quiet
# mode). Per DECISIONS.md D017 (2026-08-08 owner directive), triggers restored
# to pre-#16805 state. Issue #17099 is the standing Quiet Mode gate signal per
# wr/specs/01-quiet-mode.md — do NOT close it.
# ARCHIVE (RVS-PRESERVE-001): prior quiet-mode-only trigger was
# `on: { workflow_dispatch: {} }` (author: quiet-mode-agent, 2026-07-25).

name: Auto-Approve Clean PRs

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: auto-approve-${{ github.event.pull_request.number || github.event.check_suite.id || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Evaluate clean-PR heuristics and approve
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request?.number
              || context.payload.check_suite?.pull_requests?.[0]?.number
              || Number(context.payload.inputs?.pr_number);
            if (!prNumber) {
              core.info('No PR number resolved; skipping.');
              return;
            }
            core.info(`Evaluating PR #${prNumber} for auto-approve.`);
            // LABEL-RACE-001: swallow 404s if the label vanishes between fetch
            // and remove (concurrent workflow race).
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'auto-approve-pending',
              }).catch((e) => {
                if (e.status === 404) return;
                throw e;
              });
            } catch (e) {
              core.warning(`removeLabel failed: ${e.message}`);
            }
