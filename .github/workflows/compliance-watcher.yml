name: Compliance Watcher

# Owner-directed disable (2026-07-25): daily schedule removed.
# The tax compliance checker's only live output was filing
# `[COMPLIANCE] Tax calendar …` issues from a hardcoded list of 10 tax
# deadlines; entries in wr/cron/COMPLIANCE_WATCHER.md carry no parseable
# dates. Keeping workflow_dispatch for deliberate one-off runs.
on:
  workflow_dispatch:

jobs:
  check-compliance:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check tax deadlines
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date();
            const deadlines = [
              { date: '01-15', name: 'Q4 Estimated Tax Payment', type: 'federal' },
              { date: '01-31', name: '1099-NEC Filing Deadline', type: 'federal' },
              { date: '03-15', name: 'S-Corp/Partnership Tax Return', type: 'federal' },
              { date: '04-15', name: 'Q1 Estimated Tax + Personal Return', type: 'federal' },
              { date: '06-15', name: 'Q2 Estimated Tax Payment', type: 'federal' },
              { date: '09-15', name: 'Q3 Estimated Tax Payment', type: 'federal' },
              { date: '10-15', name: 'Extended Personal Return Deadline', type: 'federal' },
              { date: '12-31', name: 'Year-End Tax Planning Deadline', type: 'federal' },
              { date: '04-30', name: 'CA Q1 Sales Tax', type: 'state' },
              { date: '07-31', name: 'CA Q2 Sales Tax', type: 'state' }
            ];

            const warningDays = [30, 14, 7, 1];

            for (const deadline of deadlines) {
              const [month, day] = deadline.date.split('-').map(Number);
              const deadlineDate = new Date(today.getFullYear(), month - 1, day);

              if (deadlineDate < today) {
                deadlineDate.setFullYear(today.getFullYear() + 1);
              }

              const daysUntil = Math.ceil((deadlineDate - today) / (1000 * 60 * 60 * 24));

              if (warningDays.includes(daysUntil)) {
                const title = `[COMPLIANCE] Tax calendar: ${deadline.name} in ${daysUntil} days`;
                const body = `## Upcoming Tax Deadline\n\n**Deadline:** ${deadline.name}\n**Date:** ${deadlineDate.toDateString()}\n**Days remaining:** ${daysUntil}\n**Type:** ${deadline.type}\n\n### Action Required\n- [ ] Review financial records\n- [ ] Prepare required forms\n- [ ] File with appropriate authority\n- [ ] Retain confirmation\n\n### Reference\nSee wr/cron/COMPLIANCE_WATCHER.md for full compliance calendar.`;

                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['compliance', 'tax', daysUntil <= 7 ? 'urgent-compliance' : 'compliance-warning']
                });
              }
            }
