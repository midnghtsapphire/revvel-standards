name: Project Board Sync
on:
  issues:
    types:
      - opened
      - labeled
      - unlabeled
      - closed
      - reopened
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - closed
      - reopened
permissions:
  issues: read
  pull-requests: read
# Serialize per issue/PR so rapid label toggles from other automation don't
# spawn concurrent board-sync runs for the same item.
concurrency:
  group: project-board-sync-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  sync:
    name: Sync to project board
    runs-on: ubuntu-latest
    env:
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
    steps:
      - name: Check for ADMIN_GITHUB_TOKEN
        run: |
          if [ -z "${ADMIN_GITHUB_TOKEN}" ]; then
            echo "::warning::ADMIN_GITHUB_TOKEN is not set — skipping project board sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        id: check
      - name: Sync item to project board
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          script: |
            // ── Configuration ──────────────────────────────────────────
            // Set this to your GitHub Projects v2 board number.
            // Find it in the project URL: github.com/orgs/ORG/projects/N
            const PROJECT_NUMBER = 1;
            const ORG = context.repo.owner;

            // Map labels to project board status field values.
            // Adjust these to match the column names in your project board.
            const LABEL_TO_STATUS = {
              'triage':      'Triage',
              'in-progress': 'In Progress',
              'in-review':   'In Review',
            };

            // ── Determine the content node ID ──────────────────────────
            const isIssue = !!context.payload.issue;
            const item = isIssue ? context.payload.issue : context.payload.pull_request;
            const contentId = item.node_id;
            const labels = (item.labels || []).map(l => l.name);
            const isClosed = item.state === 'closed';

            core.info(`Processing ${isIssue ? 'issue' : 'PR'} #${item.number}: labels=[${labels}], closed=${isClosed}`);

            // ── Find the project ───────────────────────────────────────
            const projectQuery = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let project;
            try {
              const result = await github.graphql(projectQuery, { org: ORG, number: PROJECT_NUMBER });
              project = result.organization.projectV2;
            } catch (err) {
              core.warning(`Could not find project #${PROJECT_NUMBER} for org ${ORG}: ${err.message}. Skipping.`);
              return;
            }

            if (!project) {
              core.warning(`Project #${PROJECT_NUMBER} not found. Skipping.`);
              return;
            }

            // ── Add item to project ────────────────────────────────────
            const addMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `;

            let itemId;
            try {
              const addResult = await github.graphql(addMutation, {
                projectId: project.id,
                contentId: contentId,
              });
              itemId = addResult.addProjectV2ItemById.item.id;
              core.info(`Added/found item in project: ${itemId}`);
            } catch (err) {
              core.warning(`Failed to add item to project: ${err.message}`);
              return;
            }

            // ── Determine target status ────────────────────────────────
            let targetStatus = 'Triage';
            if (isClosed) {
              targetStatus = 'Done';
            } else {
              for (const [label, status] of Object.entries(LABEL_TO_STATUS)) {
                if (labels.includes(label)) {
                  targetStatus = status;
                }
              }
            }

            // ── Find the Status field and option ───────────────────────
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            if (!statusField) {
              core.warning('No "Status" field found on the project board. Skipping status update.');
              return;
            }

            const option = statusField.options.find(o => o.name === targetStatus);
            if (!option) {
              core.warning(`Status option "${targetStatus}" not found. Available: ${statusField.options.map(o => o.name).join(', ')}`);
              return;
            }

            // ── Update the status ──────────────────────────────────────
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            try {
              await github.graphql(updateMutation, {
                projectId: project.id,
                itemId: itemId,
                fieldId: statusField.id,
                optionId: option.id,
              });
              core.info(`Set status to "${targetStatus}" for item ${itemId}`);
            } catch (err) {
              core.warning(`Failed to update status: ${err.message}`);
            }
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
