name: Ralph Loop — Self-Healing CI
on:
  check_suite:
    types:
      - completed
permissions:
  pull-requests: write
  issues: write
  contents: read
jobs:
  ralph-trigger:
    name: Ralph Loop — Trigger Fix
    runs-on: ubuntu-latest
    if: github.event.check_suite.conclusion == 'failure'
    steps:
      - name: Find matching open PR
        id: find-pr
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const head_sha =
              context.payload.check_suite?.head_sha ||
              context.payload.workflow_run?.head_sha;

            if (!head_sha) {
              console.log('No head_sha found — skipping');
              return null;
            }

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const pr = prs.find(p => p.head.sha === head_sha);
            if (!pr) {
              console.log(`No open PR found for sha: ${head_sha}`);
              return null;
            }

            console.log(`Found PR #${pr.number}: ${pr.title}`);
            return pr.number;
      - name: Count existing Ralph Loop attempts
        id: count-attempts
        if: steps.find-pr.outputs.result != 'null'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr_number = parseInt('${{ steps.find-pr.outputs.result }}');
            let comments = []; try { const { data } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              per_page: 100,
            }); comments = data; } catch (e) { console.log(`⚠️ error getting comments: ${e.message}`); }
            const count = comments.filter(c =>
              c.body.includes('🔄 **Ralph Loop**')
            ).length;
            console.log(`Ralph Loop has fired ${count} time(s) on PR #${pr_number}`);
            return count;
      - name: Post Ralph Loop fix request
        if: |
          steps.find-pr.outputs.result != 'null' &&
          fromJSON(steps.count-attempts.outputs.result) < 5
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr_number = parseInt('${{ steps.find-pr.outputs.result }}');
            const attempt   = parseInt('${{ steps.count-attempts.outputs.result }}') + 1;
            const workflow  =
              context.payload.check_suite?.app?.name ||
              context.payload.workflow_run?.name ||
              'CI';
            const conclusion =
              context.payload.check_suite?.conclusion ||
              context.payload.workflow_run?.conclusion ||
              'failure';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body:
                `🔄 **Ralph Loop** — Attempt ${attempt}/5\n\n` +
                `The \`${workflow}\` check finished with status: \`${conclusion}\`.\n\n` +
                `OpenRouter triage (\`openrouter-triage.yml\`) will pick this up and:\n` +
                `1. Read the CI failure output\n` +
                `2. Identify the root cause\n` +
                `3. Make the **minimum** change required to fix it\n` +
                `4. Push a single commit: \`fix: [description] (ralph-loop attempt ${attempt})\`\n\n` +
                `> ⛔ This PR is blocked from merging until all CI checks pass.`,
            });

            // Add blocking labels
            const labels = ['won\'t-merge', 'auto-fix', 'copilot'];
            for (const label of labels) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr_number,
                  labels: [label],
                });
              } catch (err) {
                // Label may not exist in this repo — skip
                console.log(`Could not add label "${label}": ${err.message}`);
              }
            }

            // Routing is handled by .github/workflows/openrouter-triage.yml
            // via OpenRouter API (see docs/OPENROUTER_TRIAGE_PROCESS.md); do
            // not assign @Copilot / copilot-swe-agent here.
      - name: Escalate to human (max retries exceeded)
        if: |
          steps.find-pr.outputs.result != 'null' &&
          fromJSON(steps.count-attempts.outputs.result) >= 5
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr_number = parseInt('${{ steps.find-pr.outputs.result }}');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body:
                `⚠️ **Ralph Loop — Escalation Required**\n\n` +
                `This PR has failed **5 consecutive** auto-fix attempts. ` +
                `Automated recovery has been exhausted.\n\n` +
                `@midnghtsapphire Please review this PR manually.`,
            });

            // Swap labels to human-review state
            for (const label of ['won\'t-merge', 'auto-fix']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr_number,
                  name: label,
                });
              } catch (err) {
                // The label already being absent is the desired end state, so a
                // 404 is success (CLAUDE.md gotcha #1). Anything else — 401, 403
                // on a restricted token, a 5xx — means the block may still be in
                // place, and must not be reported as removed (gotcha #6).
                if (err.status !== 404) throw err;
              }
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                labels: ['needs-human', 'blocked'],
              });
            } catch (err) {
              console.log(`Could not add escalation labels: ${err.message}`);
            }
    timeout-minutes: 30
  ralph-unblock:
    name: Ralph Loop — Unblock on Pass
    runs-on: ubuntu-latest
    if: |
      github.event.check_suite.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find matching open PR
        id: find-pr
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const head_sha =
              context.payload.check_suite?.head_sha ||
              context.payload.workflow_run?.head_sha;

            if (!head_sha) return null;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const pr = prs.find(p => p.head.sha === head_sha);
            return pr?.number ?? null;
      - name: Remove won't-merge label on CI pass
        if: steps.find-pr.outputs.result != 'null'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr_number = parseInt('${{ steps.find-pr.outputs.result }}');

            // Fetch current labels
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
            });

            const labelNames = pr.labels.map(l => l.name);

            // Only act if the Ralph Loop was managing this PR
            if (!labelNames.includes('auto-fix') && !labelNames.includes("won't-merge")) {
              console.log('PR has no Ralph Loop labels — skipping');
              return;
            }

            // This job is triggered by ONE check_suite completing successfully.
            // A single green suite is not "all checks passed": this repo runs
            // ~109 check runs across many suites on a commit, so acting on one
            // suite's conclusion removes a merge block while other suites are
            // still red. Observed on PR #17701 at 03:11:08 UTC, where this
            // workflow posted "All checks passed! Merge block removed" in the
            // same second that pr-check-status.yml correctly posted "CI Checks
            // Failed" for the same commit.
            //
            // Same defect pr-check-status.yml carried until #17691; this is the
            // same aggregation, and it matters more here because this workflow
            // ACTS on the verdict rather than only reporting it.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = pr.head.sha;
            const FAILING = ['failure', 'timed_out', 'cancelled', 'action_required'];

            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref, per_page: 100,
            });
            // Skip this workflow's own check run — it is necessarily still in
            // progress right here and would otherwise read as "not finished".
            const selfPrefix = `/actions/runs/${context.runId}/`;
            const others = runs.filter((r) => !(r.details_url || '').includes(selfPrefix));

            const failed = others.filter(
              (r) => r.status === 'completed' && FAILING.includes(r.conclusion)
            );
            if (failed.length > 0) {
              console.log(
                `Not unblocking: ${failed.length} check run(s) failing on ${ref} — ` +
                  failed.slice(0, 5).map((r) => r.name).join(', ')
              );
              return;
            }

            // Commit statuses are a separate surface from check runs, and are
            // where CircleCI and Vercel report. Reading only check runs is what
            // let "Account is blocked" sit under a green banner.
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
              owner, repo, ref,
            });
            if (combined.state === 'failure' || combined.state === 'error') {
              console.log(`Not unblocking: combined commit status is ${combined.state} on ${ref}`);
              return;
            }

            // Anything still running means we cannot yet claim success.
            const pending = others.filter((r) => r.status !== 'completed');
            if (pending.length > 0) {
              console.log(`Not unblocking: ${pending.length} check run(s) still in progress on ${ref}`);
              return;
            }
            if (combined.total_count > 0 && combined.state === 'pending') {
              console.log(`Not unblocking: combined commit status still pending on ${ref}`);
              return;
            }

            // Remove blocking labels
            for (const label of ["won't-merge", 'auto-fix']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr_number,
                  name: label,
                });
              } catch (err) {
                // The label already being absent is the desired end state, so a
                // 404 is success (CLAUDE.md gotcha #1). Anything else — 401, 403
                // on a restricted token, a 5xx — means the block may still be in
                // place, and must not be reported as removed (gotcha #6).
                if (err.status !== 404) throw err;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: `✅ **Ralph Loop — merge block removed**\n\nVerified on \`${ref.slice(0, 7)}\`: every check run completed without failure, and the combined commit status is not failing. Blocking labels cleared.`,
            });
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
