name: Neon Preview Branch

# Creates a per-PR Neon Postgres branch on open/reopen/synchronize and deletes
# it when the PR closes.
#
# Requires:
#   - vars.NEON_PROJECT_ID   (repository variable)
#   - secrets.NEON_API_KEY   (repository secret)
#
# Fork and Dependabot PRs are skipped on purpose: `pull_request` runs from those
# sources do not receive repository secrets, so provisioning would fail with an
# empty NEON_API_KEY on every run. If preview databases are ever needed for
# forks, route provisioning through a separate `pull_request_target` workflow
# that reviews the head ref before granting secret access.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  # Deliberately no cancel-in-progress: a `closed` run must not cancel an
  # in-flight create run, otherwise the branch is created after cleanup ran and
  # leaks until its expiry date.
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    # Trusted-source gate for the whole workflow: every other job needs this
    # one, so a skip here skips the rest instead of scheduling jobs that are
    # guaranteed to fail without secrets.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    outputs:
      neon_branch: ${{ steps.neon_branch.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Neon branch names are derived here (not inline in each job) so create
      # and delete always agree on the exact same name. Head refs routinely
      # contain slashes, uppercase and very long segments (`feat/Some-Long/Ref`),
      # so the ref is slugified and truncated before use.
      - name: Compute Neon branch name
        id: neon_branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          slug=$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-zA-Z0-9' '-' \
            | sed -e 's/--*/-/g' -e 's/^-//' -e 's/-$//' \
            | cut -c1-20)
          slug=${slug%-}
          echo "name=pr-${PR_NUMBER}-${slug}" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: github.event.action != 'closed'
    outputs:
      db_url: ${{ steps.create_neon_branch.outputs.db_url }}
      db_url_pooled: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      # Neon returns HTTP 422 when asked to create a branch that already exists.
      # We therefore probe first and skip the create action on reruns. The probe
      # must scan every page itself instead of using Neon `search=`: branch names
      # here contain slashes (`preview/pr-...`), and the search filter can miss
      # those names even though a later create call rejects them as duplicates.
      # On `synchronize` events the branch already exists from the `opened` run.
      # Attempting to create it again returns HTTP 422 and fails the job.
      # This step checks the Neon API first so the create step can be skipped
      # when the branch is already present (idempotent upsert pattern).
      - name: Check whether Neon branch already exists
        id: check_branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH: ${{ needs.setup.outputs.neon_branch }}
        run: |
          set -euo pipefail
          api_host="${NEON_API_HOST:-https://console.neon.tech/api/v2}"
          page=$(mktemp)
          trap 'rm -f "$page"' EXIT

          urlencode() {
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }

          cursor=""
          found=false

          while true; do
            url="${api_host}/projects/$(urlencode "$NEON_PROJECT_ID")/branches?limit=100&search=$(urlencode "$NEON_BRANCH")"
            url="${api_host}/projects/$(urlencode "$NEON_PROJECT_ID")/branches?limit=100&search=$(urlencode "$NEON_BRANCH")"
            if [ -n "$cursor" ]; then
              url="${url}&cursor=$(urlencode "$cursor")"
            fi

            # CLAUDE.md gotcha #4: the key goes in via a curl config file on
            # stdin (printf is a builtin), never in argv where ps can read it.
            # CLAUDE.md gotcha #4: secret on stdin via curl config file, never in argv.
            status=$(printf 'header = "Authorization: Bearer %s"\n' "$NEON_API_KEY" \
              | curl --silent --show-error --config - \
                  -H "Accept: application/json" \
                  -o "$page" -w '%{http_code}' \
                  "$url") || {
              echo "::error::Neon API request failed for project ${NEON_PROJECT_ID}"
              exit 1
            }

            if [ "$status" != "200" ]; then
              echo "::error::Neon API returned HTTP ${status} while listing branches for project ${NEON_PROJECT_ID}"
              echo "::error::Neon API returned HTTP ${status} while listing branches"
              exit 1
            fi

            if ! jq -e '.branches | arrays' "$page" > /dev/null 2>&1; then
              echo "::error::Neon API returned a malformed response (missing branches array)"
              exit 1
            fi

            if jq -e --arg name "$NEON_BRANCH" 'any(.branches[]; .name == $name)' "$page" > /dev/null; then
              found=true
              break
            fi

            next=$(jq -r '.pagination.next // empty' "$page")
            count=$(jq '.branches | length' "$page")
            if [ -z "$next" ] || [ "$count" -eq 0 ] || [ "$next" = "$cursor" ]; then
              break
            fi
            cursor="$next"
          done

          if [ "$found" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Neon branch ${NEON_BRANCH} already exists; skipping creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Neon Branch
        id: create_neon_branch
        if: steps.check_branch.outputs.exists != 'true'
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ needs.setup.outputs.neon_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

# The step above creates a new Neon branch.
# You may want to do something with the new branch, such as run migrations, run tests
# on it, or send the connection details to a hosting platform environment.
# The branch DATABASE_URL is available to you via:
# "${{ steps.create_neon_branch.outputs.db_url_pooled }}".
# It's important you don't log the DATABASE_URL as output as it contains a username and
# password for your database.
# For example, you can uncomment the lines below to run a database migration command:
#      - name: Run Migrations
#        run: npm run db:migrate
#        env:
#          # to use pooled connection
#          DATABASE_URL: "${{ steps.create_neon_branch.outputs.db_url_pooled }}"
#          # OR to use unpooled connection
#          # DATABASE_URL: "${{ steps.create_neon_branch.outputs.db_url }}"

# Following the step above, which runs database migrations, you may want to check
# for schema changes in your database. We recommend using the following action to
# post a comment to your pull request with the schema diff. For this action to work,
# you also need to give permissions to the workflow job to be able to post comments
# and read your repository contents. Add the following permissions to this job
# (the workflow-level default is contents: read only):
#
#    permissions:
#      contents: read
#      pull-requests: write
#
# You can also check out https://github.com/neondatabase/schema-diff-action for more
# information on how to use the schema diff action.
# You can uncomment the lines below to enable the schema diff action.
#      - name: Post Schema Diff Comment to PR
#        uses: neondatabase/schema-diff-action@80cfa8521628e890015b60f5291a7738926617dc # v1
#        with:
#          project_id: ${{ vars.NEON_PROJECT_ID }}
#          compare_branch: ${{ needs.setup.outputs.neon_branch }}
#          api_key: ${{ secrets.NEON_API_KEY }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A PR can stay open past the 14-day expiry, in which case Neon already
      # deleted the branch. delete-branch-action shells out to
      # `neonctl branches delete` unconditionally and fails on a missing branch,
      # which would turn routine cleanup into a red check on every such PR. So
      # look the branch up first (following every page of the paginated listing)
      # and only skip the not-found case — a non-200 from the API (bad key,
      # outage) still fails the job.
      #
      # The check is embedded inline (curl + jq) rather than kept in a repo
      # script: a script would need a checkout, and on a closed-but-unmerged PR
      # neither the head (possibly deleted) nor the base (never had the file)
      # reliably resolves it — leaving the preview branch undeleted.
      # tests/neon-branch-workflow.test.js extracts this very block and runs it
      # against a stub Neon API, so the tested code is the code that runs.
      - name: Check whether the Neon branch still exists
        id: check_branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH: ${{ needs.setup.outputs.neon_branch }}
        run: |
          set -euo pipefail
          api_host="${NEON_API_HOST:-https://console.neon.tech/api/v2}"
          page=$(mktemp)
          trap 'rm -f "$page"' EXIT

          urlencode() {
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }

          cursor=""
          found=false

          while true; do
            url="${api_host}/projects/$(urlencode "$NEON_PROJECT_ID")/branches?limit=100&search=$(urlencode "$NEON_BRANCH")"
            if [ -n "$cursor" ]; then
              url="${url}&cursor=$(urlencode "$cursor")"
            fi

            # CLAUDE.md gotcha #4: the key goes in via a curl config file on
            # stdin (printf is a builtin), never in argv where ps can read it.
            status=$(printf 'header = "Authorization: Bearer %s"\n' "$NEON_API_KEY" \
              | curl --silent --show-error --config - \
                  -H "Accept: application/json" \
                  -o "$page" -w '%{http_code}' \
                  "$url") || {
              echo "::error::Neon API request failed for project ${NEON_PROJECT_ID}"
              exit 1
            }

            if [ "$status" != "200" ]; then
              echo "::error::Neon API returned HTTP ${status} while listing branches for project ${NEON_PROJECT_ID}"
              exit 1
            fi

            # A 200 with a missing "branches" key is a malformed payload: treating
            # it as "branch absent" would skip a delete that was needed.
            if ! jq -e '.branches | arrays' "$page" > /dev/null 2>&1; then
              echo "::error::Neon API returned a malformed response (missing branches array)"
              exit 1
            fi

            if jq -e --arg name "$NEON_BRANCH" 'any(.branches[]; .name == $name)' "$page" > /dev/null; then
              found=true
              break
            fi

            next=$(jq -r '.pagination.next // empty' "$page")
            count=$(jq '.branches | length' "$page")
            # Stop on the last page, an empty page, or a cursor that repeats
            # itself (which would otherwise spin forever).
            if [ -z "$next" ] || [ "$count" -eq 0 ] || [ "$next" = "$cursor" ]; then
              break
            fi
            cursor="$next"
          done

          if [ "$found" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Neon branch ${NEON_BRANCH} not found (already expired or deleted); nothing to clean up"
          fi
      - name: Delete Neon Branch
        if: steps.check_branch.outputs.exists == 'true'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ needs.setup.outputs.neon_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
