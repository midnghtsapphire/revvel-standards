name: Sync Standard Labels
on:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
  workflow_dispatch:
permissions:
  issues: write
jobs:
  sync-labels:
    name: Sync Labels from Canonical Definition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Sync labels
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const yaml = fs.readFileSync('.github/labels.yml', 'utf8');
            const LABELS = [];
            let current = null;
            for (const rawLine of yaml.split(/\r?\n/)) {
              const line = rawLine.trim();
              const name = line.match(/^-\s+name:\s+"?([^"]+?)"?\s*$/);
              if (name) {
                if (current?.name) LABELS.push(current);
                current = { name: name[1] };
                continue;
              }
              if (!current) continue;
              const color = line.match(/^color:\s+"?([^"]+?)"?\s*$/);
              if (color) {
                current.color = color[1].replace(/^#/, '');
                continue;
              }
              const description = line.match(/^description:\s+"?(.+?)"?\s*$/);
              if (description) {
                current.description = description[1].replace(/\\"/g, '"');
              }
            }
            if (current?.name) LABELS.push(current);
            if (LABELS.length === 0) {
              core.setFailed('No labels found in .github/labels.yml');
              return;
            }

            // Fetch existing labels (paginated — repos can have 100+)
            let existing = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                per_page: 100,
                page,
              });
              existing = existing.concat(data);
              if (data.length < 100) break;
              page++;
            }
            const existingMap = Object.fromEntries(existing.map(l => [l.name, l]));

            let created = 0;
            let updated = 0;
            let skipped = 0;

            for (const def of LABELS) {
              const { name, color, description } = def;

              if (existingMap[name]) {
                const cur = existingMap[name];
                if (cur.color !== color || cur.description !== description) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    name,
                    color,
                    description,
                  });
                  core.info(`  ✏️  Updated  : ${name}`);
                  updated++;
                } else {
                  core.info(`  ✅ OK       : ${name}`);
                  skipped++;
                }
              } else {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name,
                  color,
                  description,
                });
                core.info(`  ➕ Created  : ${name}`);
                created++;
              }
            }

            core.notice(
              `Label sync complete — created: ${created}, updated: ${updated}, already correct: ${skipped}`
            );
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
