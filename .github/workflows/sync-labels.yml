# Sync Standard Labels
#
# Ensures every Revvel standard label exists in this repository with the
# correct color and description. Safe to run repeatedly — creates missing
# labels and updates changed ones, but NEVER deletes existing labels.
#
# Triggers:
#   • Push to main when labels.yml changes (keeps labels in sync automatically)
#   • workflow_dispatch — run manually from the Actions tab at any time
#
# The canonical label definitions live in .github/labels.yml (documentation).
# The workflow maintains its own inline copy so it is fully self-contained.

name: Sync Standard Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync-labels:
    name: Sync Labels from Canonical Definition
    runs-on: ubuntu-latest

    steps:
      - name: Sync labels
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // ── Canonical Revvel label definitions ────────────────────────────
            // Keep in sync with .github/labels.yml
            const LABELS = [
              // Triage / Type
              { name: 'bug',               color: 'd73a4a', description: "Something isn't working" },
              { name: 'enhancement',       color: 'a2eeef', description: 'New feature or request' },
              { name: 'documentation',     color: '0075ca', description: 'Documentation only' },
              { name: 'security',          color: 'cc0000', description: 'Security vulnerability or concern' },
              { name: 'design',            color: '7057ff', description: 'Design/brand work needed' },
              { name: 'dependencies',      color: '0075ca', description: 'Dependency updates (Dependabot, etc.)' },
              { name: 'good-first-issue',  color: '7057ff', description: 'Good for newcomers' },
              { name: 'bom-purchase',      color: 'ffd700', description: 'Requires a purchase (links to BOM.md)' },
              // Lifecycle / State
              { name: 'in-review',         color: 'fbca04', description: 'Linked PR is open and ready for review' },
              { name: 'blocked',           color: 'e4e669', description: 'Blocked by external dependency' },
              { name: 'wontfix',           color: 'ffffff', description: 'This will not be worked on' },
              // PR Lifecycle (managed by pr-lifecycle.yml)
              { name: 'draft',             color: '6e7681', description: 'Work in progress, not ready for review' },
              { name: 'awaiting-review',   color: '0075ca', description: 'Waiting for reviewer feedback' },
              { name: 'checks-failing',    color: 'd73a4a', description: 'CI checks are failing' },
              { name: 'checks-passing',    color: 'a2eeef', description: 'All CI checks pass' },
              { name: 'ready-to-merge',    color: '008672', description: 'Approved + checks pass — ready to merge' },
              // Third-Party / External Contributions
              { name: 'third-party',       color: 'bfdadc', description: 'PR from forked repository - external contributor' },
              { name: 'external-contributor', color: '7057ff', description: 'Contribution from outside the organization' },
              // Agent Quality & Monitoring
              { name: 'scaffolding-detected', color: 'd93f0b', description: 'PR contains scaffolding language - requires completion' },
              { name: 'needs-completion', color: 'fbca04', description: 'Work is incomplete - finish implementation' },
              { name: 'agent-health-alert', color: 'd73a4a', description: 'Agent health check detected issues' },
              // PR Review Status
              { name: 'awaiting-approval', color: 'fbca04', description: 'PR is awaiting review and approval' },
              { name: 'changes-requested', color: 'd93f0b', description: 'PR has changes requested by reviewers' },
              { name: 'approved',          color: '0e8a16', description: 'PR has been approved by reviewers' },
              { name: 'review-started',    color: '0075ca', description: 'PR review has been initiated' },
              { name: 'review-fix:in-progress', color: 'fbca04', description: 'OpenRouter is analyzing and fixing review feedback' },
              { name: 'review-fix:complete', color: '0e8a16', description: 'OpenRouter has addressed all review feedback' },
              { name: 'review-fix:failed', color: 'd93f0b', description: 'OpenRouter could not automatically fix review issues' },
              // Merge Control
              { name: 'auto-merge',        color: '0e8a16', description: 'Merge automatically once approved and CI passes' },
              { name: "won't-merge",       color: 'b60205', description: "Block auto-merge — human review required" },
              // Automation Control (Quiet Mode gate)
              { name: 'operations',          color: '1d76db', description: 'Operational control issue (e.g. quiet-mode gate)' },
              { name: 'automation-control',  color: '6f42c1', description: 'Controls scheduled automation state (exit-quiet-mode gate)' },
              // Automation / Routing
              { name: 'auto-fix',          color: '0075ca', description: 'Created by auto-fix / Ralph Loop workflow' },
              { name: 'copilot',           color: '7057ff', description: 'Assigned to GitHub Copilot for fixing' },
              { name: 'ralph-loop',        color: 'ff6b35', description: 'Managed by the Ralph Loop self-healing workflow' },
              { name: 'openrouter',        color: '6f42c1', description: 'Routed to the OpenRouter orchestrator (first line of sight)' },
              { name: 'needs-human',       color: 'd93f0b', description: 'Escalated — requires human intervention' },
              { name: 'needs-action',      color: 'fbca04', description: 'Requires immediate action — auto-route to OpenRouter' },
              { name: 'vault-agent',       color: 'e4e669', description: 'Vault Agent credential provisioning required' },
              { name: 'codex',             color: '5319e7', description: 'Routed to Codex (via OpenRouter) for code execution' },
              { name: 'jules',             color: '4285f4', description: 'Routed to Google Jules for deep-research and authoring' },
              { name: 'deep-research',     color: '0e8a16', description: 'Requires deep research before execution' },
              { name: 'weekly-research',   color: '0075ca', description: 'Weekly Research (WR) task — enhanced deep-dive investigation' },
              { name: 'wr:in-progress',    color: 'fbca04', description: 'WR research in progress' },
              { name: 'wr:complete',       color: '0e8a16', description: 'WR research completed' },
              { name: 'proof-of-life',     color: '2ea44f', description: 'Proof-of-life run — app-review revvel-standards-run' },
              { name: 'role:orchestrator', color: '6f42c1', description: 'OpenRouter agent is acting as orchestrator on this item' },
              { name: 'role:fixer',        color: 'ff6b35', description: 'OpenRouter agent is acting as fixer on this item' },
              // oAudrey Hub
              { name: 'oaudrey',             color: '7C5CFF', description: 'oAudrey hub landing page or subdomain work' },
              { name: 'deploy-failure',      color: 'd73a4a', description: 'Production deployment failure — needs immediate attention' },
              { name: 'retro',               color: '0075ca', description: 'Post-deploy retrospective or gap analysis finding' },
              // Secrets / Credentials
              { name: 'secrets-missing',         color: 'b60205', description: 'One or more required secrets are absent — auto-heal pending' },
              { name: 'credentials-ready',       color: '0e8a16', description: 'All required credentials are provisioned' },
              { name: 'credentials-missing',     color: 'd93f0b', description: 'One or more required credentials are missing' },
              { name: 'goap-escalation',         color: 'b60205', description: 'GOAP escalation — requires human intervention after auto-retry failure' },
              // Content & Marketing
              { name: 'content',                 color: 'F7C948', description: 'Content creation task — handled by NoimosAI content agent' },
              { name: 'content-automation',      color: '00D4AA', description: 'Trigger content automation pipeline' },
              { name: 'writing',                 color: 'FF69B4', description: 'Writing/copywriting task' },
              { name: 'blog',                    color: '7B68EE', description: 'Blog post creation' },
              { name: 'seo-content',             color: '3DDCFF', description: 'SEO-focused content' },
              { name: 'content:draft',           color: 'FFA500', description: 'Content draft stage, needs review' },
              { name: 'content:final',           color: '00FF00', description: 'Content final, ready to publish' },
              { name: 'auto-error',              color: 'd73a4a', description: 'Auto-created error issue from workflow failure' },
              // Marketing / NoimosAI
              { name: 'noimosai',            color: '7C5CFF', description: 'Route to NoimosAI autonomous marketing team' },
              { name: 'marketing',           color: 'FF6B6B', description: 'Marketing task — auto-routed to NoimosAI' },
              { name: 'seo',                 color: '3DDCFF', description: 'SEO task — handled by NoimosAI SEO agent' },
              { name: 'affiliate',           color: '4CAF50', description: 'Affiliate link / revenue task — handled by NoimosAI affiliate agent' },
            ];

            // Fetch existing labels (paginated — repos can have 100+)
            let existing = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                per_page: 100,
                page,
              });
              existing = existing.concat(data);
              if (data.length < 100) break;
              page++;
            }
            const existingMap = Object.fromEntries(existing.map(l => [l.name, l]));

            let created = 0;
            let updated = 0;
            let skipped = 0;

            for (const def of LABELS) {
              const { name, color, description } = def;

              if (existingMap[name]) {
                const cur = existingMap[name];
                if (cur.color !== color || cur.description !== description) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    name,
                    color,
                    description,
                  });
                  core.info(`  ✏️  Updated  : ${name}`);
                  updated++;
                } else {
                  core.info(`  ✅ OK       : ${name}`);
                  skipped++;
                }
              } else {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name,
                  color,
                  description,
                });
                core.info(`  ➕ Created  : ${name}`);
                created++;
              }
            }

            core.notice(
              `Label sync complete — created: ${created}, updated: ${updated}, already correct: ${skipped}`
            );
