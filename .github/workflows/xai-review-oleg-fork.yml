# XAI Review — oleg fork
#
# Marketplace: https://github.com/marketplace/actions/xai-review-oleg-fork
# Action repo: https://github.com/HomeBake/ai-review
# PyPI:        https://pypi.org/project/xai-review-oleg-fork/
#
# Multi-mode AI code review (inline / context / summary / reply) with native
# OpenRouter support. Posts review comments on the target pull request.
#
# Add `[skip-review]` to the PR title to bypass the automatic PR trigger.
#
# Secrets required: OPENROUTER_API_KEY
# Template source: templates/cicd/xai-review-oleg-fork.yml

name: XAI Review (oleg fork)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review-command:
        description: "Review mode to run"
        type: choice
        default: run-summary
        required: true
        options:
          - run
          - run-inline
          - run-context
          - run-summary
          - run-inline-reply
          - run-summary-reply
          - clear-inline
          - clear-summary
      pull-request-number:
        description: "Pull request number (required for workflow_dispatch)"
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: xai-review-oleg-fork-${{ github.event.pull_request.number || inputs.pull-request-number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: XAI Review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.title, '[skip-review]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping XAI Review (oleg fork)."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi

      - name: Checkout
        if: env.OPENROUTER_API_KEY != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the action can diff base…head correctly.
          fetch-depth: 0

      - name: Run XAI Review (oleg fork)
        if: env.OPENROUTER_API_KEY != ''
        # Advisory reviewer — never hard-fail the PR on transient LLM / API issues.
        continue-on-error: true
        # Pin to the v1.2.4 tag commit (HomeBake/ai-review).
        # action.yml installs xai-review-oleg-fork==1.2.4 from PyPI.
        uses: HomeBake/ai-review@de103eb5948eef1a54717d43992d8cfb156677ba # v1.2.4
        with:
          # Auto PRs default to summary-only (cheaper / less noisy). Manual
          # dispatch can pick inline/context/reply/full via the input above.
          review-command: ${{ inputs.review-command || 'run-summary' }}
        env:
          # --- LLM (OpenRouter) ---
          LLM__PROVIDER: "OPENROUTER"
          # Cheap default; override via repo variables if spend allows.
          LLM__META__MODEL: "google/gemini-2.5-flash"
          LLM__META__MAX_TOKENS: "8000"
          LLM__META__TEMPERATURE: "0.2"
          LLM__HTTP_CLIENT__API_URL: "https://openrouter.ai/api/v1"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

          # --- GitHub VCS ---
          VCS__PROVIDER: "GITHUB"
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number || inputs.pull-request-number }}
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          # Prefer ADMIN_GITHUB_TOKEN when present (separate rate-limit bucket).
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

          # Keep concurrent LLM / comment posts modest to avoid 429s.
          CORE__CONCURRENCY: "5"
