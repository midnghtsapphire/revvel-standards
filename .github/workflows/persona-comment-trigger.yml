name: Persona Comment Trigger

# Summon a persona on demand from an issue/PR comment:
#   /professor <task> | /oaudrey ... | /mindmappr ... | /openrouter ...
#   /dragnet <error or product req> | /scaffold <req> | /builder <req> | /product-build <req>
#   /orbit <circleci task> | /circleci ... | /circle-ci ...
#   /octo <octopus review task> | /octopus ...
#   /🎓 ... | /🧠 ... | /🗺️ ... | /🔀 ... | /🕵️ ... | /🛠️ ... | /🪐 ... | /⭕ ... | /🐙 ...
#   /mender <mabl task> | /mabl ...
#   /🎓 ... | /🧠 ... | /🗺️ ... | /🔀 ... | /🕵️ ... | /🛠️ ... | /🪐 ... | /⭕ ... | /🐙 ... | /🧪 ...
#   /persona <name> <task>
# Triggers use a leading slash, NOT "@name": GitHub turns "@name" into a mention
# of the real user account with that username and emails them, so "@professor"
# spammed a stranger on every comment. The slash form notifies no one.
# The Professor (no-key Perplexity research) is the headline lane.
# DRAGNET handles both ERROR MODE (bugs/failures) and SCAFFOLD MODE (new product from
# screenshots/Reddit/social signals). Use /scaffold or /builder to invoke SCAFFOLD MODE
# directly. ORBIT is the CircleCI pipeline commander (wire-in, validate, tune, orbs,
# policy — playbook: skills/circleci-expert/SKILL.md).
# See scripts/openrouter-personas.js and docs/OPENROUTER_ASSIGNEE_PROCESS.md.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read
  # actions: write — DRAGNET's research lane dispatches research-engine.yml
  # (gh workflow run) so the Ralph search loop can fill every WR field; the
  # default token cannot create workflow_dispatch runs without this.
  actions: write

concurrency:
  group: persona-comment-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  summon-persona:
    name: Summon persona from comment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip bot comments (avoid loops) and only run when a persona trigger is present.
    if: >-
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/professor') ||
       contains(github.event.comment.body, '/oaudrey') ||
       contains(github.event.comment.body, '/mindmappr') ||
       contains(github.event.comment.body, '/openrouter') ||
       contains(github.event.comment.body, '/dragnet') ||
       contains(github.event.comment.body, '/scaffold') ||
       contains(github.event.comment.body, '/builder') ||
       contains(github.event.comment.body, '/product-build') ||
       contains(github.event.comment.body, '/orbit') ||
       contains(github.event.comment.body, '/circleci') ||
       contains(github.event.comment.body, '/circle-ci') ||
       contains(github.event.comment.body, '/🪐') ||
       contains(github.event.comment.body, '/⭕') ||
       contains(github.event.comment.body, '/octo') ||
       contains(github.event.comment.body, '/🐙') ||
       contains(github.event.comment.body, '/octopus') ||
       contains(github.event.comment.body, '/🐙') ||
       contains(github.event.comment.body, '/mabl') ||
       contains(github.event.comment.body, '/🧪') ||
       contains(github.event.comment.body, '/🎓') ||
       contains(github.event.comment.body, '/🧠') ||
       contains(github.event.comment.body, '/🗺️') ||
       contains(github.event.comment.body, '/🗺') ||
       contains(github.event.comment.body, '/🔀') ||
       contains(github.event.comment.body, '/🕵️') ||
       contains(github.event.comment.body, '/🕵') ||
       contains(github.event.comment.body, '/🔎') ||
       contains(github.event.comment.body, '/🛠️') ||
       contains(github.event.comment.body, '/🛠') ||
       contains(github.event.comment.body, '/persona'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install no-key Perplexity bridge
        # Layer 2 of the routedChat cascade is the helallao/perplexity-ai
        # Python package (scripts/perplexity-no-key-bridge.js), not the official
        # API — that one needs a key. Without this install the lane cannot run
        # on a runner, and with LM Studio unreachable from CI the persona has
        # no free lane left. Same step perplexity-research-agent.yml uses.
        # Non-fatal: a failed install must degrade to the next lane, not kill
        # the job, so the persona still answers if a paid lane is enabled.
        continue-on-error: true
        run: |
          python3 -m pip install --user \
            "perplexity-api @ git+https://github.com/helallao/perplexity-ai.git@main"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Summon persona and reply
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Layer 0/2/1 lane config (#17868). Without these the cascade in
          # routedChat has nothing to reach: LM Studio resolves to the runner's
          # own 127.0.0.1 (never the operator's laptop), and OpenRouter is
          # refused because the spend gate variable is absent. Set
          # LMSTUDIO_ENDPOINT to a reachable URL (a tunnel to the operator's
          # machine) to keep this lane free; REVVEL_LLM_ALLOW_CLOUD must be "1"
          # before anything bills.
          LMSTUDIO_ENDPOINT: ${{ secrets.LMSTUDIO_ENDPOINT }}
          LMSTUDIO_API_KEY: ${{ secrets.LMSTUDIO_API_KEY }}
          LMSTUDIO_MODEL: ${{ vars.LMSTUDIO_MODEL }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          REVVEL_LLM_ALLOW_CLOUD: ${{ vars.REVVEL_LLM_ALLOW_CLOUD }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY not set — persona reply skipped (no-key bridge handles The Professor; other personas need the key)."
          fi
          node scripts/persona-comment-runner.js
