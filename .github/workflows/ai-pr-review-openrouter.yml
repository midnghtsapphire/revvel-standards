# AI PR Review via OpenRouter
#
# Marketplace: https://github.com/marketplace/actions/ai-pr-review-via-openrouter
# Action repo: https://github.com/maxlim0/AI-PR-Reviewer
#
# Analyzes the pull-request diff with an OpenRouter model and posts/updates a
# single PR comment with findings.
#
# Secrets required: OPENROUTER_API_KEY (GITHUB_TOKEN is provided automatically)
# Copy this file to: .github/workflows/ai-pr-review-openrouter.yml

name: AI PR Review (OpenRouter)

# OpenHands-RESTRUCTURE 2026-05-04 (Audrey ask: "one of the many agents needs to be
# assigned to my review portion, and really do the work of reviewing"):
# BITO AI is now the sole assigned PR reviewer (see bito-ai.yml). This OpenRouter
# reviewer is kept as a manual fallback only — re-enable the `pull_request`
# trigger if BITO is unavailable. Six bots reviewing the same PR was generating
# noise, not signal.

on:
  # # DISABLED — see header. BITO AI is the assigned reviewer.
  # pull_request:
  #   types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-openrouter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR review
    # Skip drafts and PRs whose title explicitly opts out.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.title, '[skip-review]'))
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping AI PR review."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi

      - name: AI PR Review
        if: env.OPENROUTER_API_KEY != ''
        uses: maxlim0/AI-PR-Reviewer@0b958782fcd8f3b1b4a94b3fd506f51a989055cd # v0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Switched to Claude Sonnet 4 for reliability — the previous
          # x-ai/grok-4.1-fast slug was returning 404s after the free tier
          # was retired. Claude Sonnet 4 is already used by openrouter-triage.
          model: "anthropic/claude-sonnet-4"
          prompt_template: |
            Analyze the next diff, flag problems if any, and describe them
            briefly. Keep it under 200 words:
            {{DIFF}}
