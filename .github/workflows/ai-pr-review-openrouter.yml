name: AI PR Review (OpenRouter)
on:
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ai-pr-review-openrouter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: AI PR review
    if: |-
      github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.title, '[skip-review]'))
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Verify OPENROUTER_API_KEY is configured
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — skipping AI PR review."
          else
            echo "OPENROUTER_API_KEY is configured."
          fi
      - name: AI PR Review
        if: env.OPENROUTER_API_KEY != ''
        uses: maxlim0/AI-PR-Reviewer@0b958782fcd8f3b1b4a94b3fd506f51a989055cd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: anthropic/claude-sonnet-4
          prompt_template: |
            Analyze the next diff, flag problems if any, and describe them
            briefly. Keep it under 200 words:
            {{DIFF}}
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
