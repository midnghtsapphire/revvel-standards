name: Sandbox Guardrail
# When a PR is opened by a bot or a visiting agent (any author matching the
# known-visiting-agent list), verify their `.sandbox/<agent>/` folder exists
# and post a friendly onboarding comment if not. Also nudge them to add a
# session log entry for this PR.
#
# This is an INFORMATIONAL guardrail — it never blocks a merge. Its job is
# to make sure a new visiting agent literally cannot miss the sandbox
# onboarding step, per `standards/VISITING_AGENT_SANDBOX_STANDARD.md` and
# `.sandbox/README.md`.
#
# Fleet members (@midnghtsapphire, humans, CODEOWNERS-listed accounts) are
# skipped — they are not "visiting" agents.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sandbox-guardrail-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-sandbox:
    name: Check visiting agent sandbox onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Determine agent identity from PR author
        id: identity
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          # Normalize the author login into a stable sandbox agent-name.
          # Any GitHub App bot ends in "[bot]" which is stripped; the
          # canonical mapping table below covers the agents we currently
          # know. Unknown bots default to their stripped login.
          #
          # If you are adding a new agent to the fleet, add its mapping
          # here so the sandbox path resolves correctly.
          case "$AUTHOR" in
            openhands-agent|openhands-ai-integration|openhands-ai-integration\[bot\]) agent=openhands ;;
            copilot-swe-agent|copilot-swe-agent\[bot\])                                agent=copilot-swe-agent ;;
            copilot-pull-request-reviewer\[bot\])                                       agent=copilot ;;
            google-labs-jules\[bot\])                                                   agent=jules ;;
            cubic-dev-ai\[bot\])                                                        agent=cubic ;;
            octopus-review\[bot\])                                                      agent=octopus ;;
            recurse-ml\[bot\])                                                          agent=recurse ;;
            bito-code-review\[bot\]|bito-ai\[bot\])                                     agent=bito ;;
            devin-ai-integration\[bot\])                                                agent=devin ;;
            cursoragent|cursor-agent\[bot\])                                            agent=cursor ;;
            *)
              stripped="${AUTHOR%\[bot\]}"
              agent="$(printf '%s' "$stripped" | tr '[:upper:]' '[:lower:]')"
              ;;
          esac
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "author_type=$AUTHOR_TYPE" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"

      - name: Skip if PR author is a fleet member (human owner / CODEOWNERS)
        id: skip
        env:
          AUTHOR: ${{ steps.identity.outputs.author }}
          AUTHOR_TYPE: ${{ steps.identity.outputs.author_type }}
        run: |
          # Skip humans by default — this workflow is for visiting agents.
          # If a human PR needs the sandbox comment anyway, they can trigger
          # it manually by running scripts/sandbox-bootstrap.sh locally.
          if [[ "$AUTHOR_TYPE" != "Bot" ]] && [[ "$AUTHOR" != "openhands-agent" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR author '$AUTHOR' is not a visiting agent (type=$AUTHOR_TYPE) — skipping guardrail."
            exit 0
          fi
          # Skip fleet member bots that have first-class homes elsewhere.
          # dependabot / renovate / github-actions / vercel are infrastructure,
          # not visiting agents doing code work.
          case "$AUTHOR" in
            dependabot\[bot\]|renovate\[bot\]|github-actions\[bot\]|vercel\[bot\]|github-advanced-security\[bot\])
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::PR author '$AUTHOR' is fleet infrastructure — skipping guardrail."
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check whether .sandbox/<agent>/ exists
        if: steps.skip.outputs.skip != 'true'
        id: sandbox
        env:
          AGENT: ${{ steps.identity.outputs.agent }}
        run: |
          if [[ -d ".sandbox/$AGENT" ]] && [[ -f ".sandbox/$AGENT/AGENT.md" ]]; then
            echo "state=onboarded" >> "$GITHUB_OUTPUT"
            echo "::notice::Sandbox exists: .sandbox/$AGENT/"
          elif [[ -d ".sandbox/$AGENT" ]]; then
            echo "state=partial" >> "$GITHUB_OUTPUT"
            echo "::warning::.sandbox/$AGENT/ exists but AGENT.md is missing."
          else
            echo "state=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::.sandbox/$AGENT/ does not exist yet."
          fi

      - name: Post onboarding comment if sandbox is missing or partial
        if: steps.skip.outputs.skip != 'true' && steps.sandbox.outputs.state != 'onboarded'
        uses: actions/github-script@v7
        env:
          AGENT: ${{ steps.identity.outputs.agent }}
          AUTHOR: ${{ steps.identity.outputs.author }}
          STATE: ${{ steps.sandbox.outputs.state }}
        with:
          script: |
            const agent = process.env.AGENT;
            const author = process.env.AUTHOR;
            const state = process.env.STATE;
            const marker = '<!-- sandbox-guardrail-comment -->';

            // Idempotency — do not double-post on synchronize/re-open.
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const already = existing.data.find(c => (c.body || '').includes(marker));
            if (already) {
              core.info('Guardrail comment already posted — skipping.');
              return;
            }

            const body = [
              marker,
              `## 👋 Welcome, \`${author}\` — sandbox onboarding needed`,
              '',
              `This appears to be your first PR on this repo. Per`,
              `[\`standards/VISITING_AGENT_SANDBOX_STANDARD.md\`](../blob/main/standards/VISITING_AGENT_SANDBOX_STANDARD.md),`,
              `every visiting agent must have a \`.sandbox/<name>/\` folder so`,
              `your session data survives credit / timeout blackouts and future`,
              `agents can learn from what you did.`,
              '',
              `**Current status:** \`.sandbox/${agent}/\` is **${state}** (expected: fully onboarded).`,
              '',
              '### One command to fix it',
              '',
              '```bash',
              `bash scripts/sandbox-bootstrap.sh ${agent}`,
              '```',
              '',
              'That command:',
              '',
              `1. Creates \`.sandbox/${agent}/\` with the full canonical tree`,
              '   (`sessions/ memory/ thoughts/ scripts/ api-calls/ cli/ mcp/`',
              '   `tools/ skills/ artifacts/`)',
              `2. Writes a starter \`AGENT.md\` (fill in the placeholders)`,
              `3. Opens today's session log at`,
              `   \`.sandbox/${agent}/sessions/<UTC-timestamp>-session.md\``,
              '4. Prints your exact next steps',
              '',
              'It is idempotent — safe to re-run — and never overwrites existing files.',
              '',
              '### Then, before your next commit',
              '',
              'Read these three mandatory standards:',
              '',
              '- [`standards/VISITING_AGENT_SANDBOX_STANDARD.md`](../blob/main/standards/VISITING_AGENT_SANDBOX_STANDARD.md) — how to use the sandbox',
              '- [`standards/OUT_OF_SCOPE_AUTO_WR_STANDARD.md`](../blob/main/standards/OUT_OF_SCOPE_AUTO_WR_STANDARD.md) — "not my bug" is banned without a filed WR',
              '- [`standards/TRIAGE_ROLE_STANDARD.md`](../blob/main/standards/TRIAGE_ROLE_STANDARD.md) — your override authority to file that WR',
              '',
              'These are the rules; the bootstrap is the mechanism.',
              '',
              '### What this comment is NOT',
              '',
              'This does **not block** your PR. It is a nudge. If your work is truly',
              `a one-line docs fix that does not warrant a sandbox, ignore this — but`,
              'if you are doing real code work here, please bootstrap so the fleet',
              'can learn from your session.',
              '',
              '---',
              '',
              `_Posted by \`.github/workflows/sandbox-guardrail.yml\`. If the agent-name`,
              `mapping is wrong for \`${author}\`, add a case to that workflow's`,
              `Determine agent identity step and re-run._`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info(`Posted sandbox onboarding comment for agent '${agent}'.`);
