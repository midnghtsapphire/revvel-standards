name: Stale Branch Cleanup

# Deletes remote branches whose PRs have been merged or closed for 7+ days.
# Protects main and any branch matching a configurable pattern.
# Runs weekly on Sunday at 06:00 UTC; can also be triggered manually.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log branches that would be deleted without deleting them"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete stale branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged/closed branches
        uses: actions/github-script@v8
        with:
          script: |
            const dryRun = '${{ github.event.inputs.dry_run }}' === 'true';
            const PROTECTED = new Set(['main', 'master', 'develop', 'production']);
            const STALE_DAYS = 7;
            const now = Date.now();

            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            let deleted = 0;
            let skipped = 0;

            for (const branch of branches) {
              if (PROTECTED.has(branch.name)) {
                core.info(`SKIP (protected): ${branch.name}`);
                skipped++;
                continue;
              }

              // Check if this branch has a merged or closed PR
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch.name}`,
                state: 'all',
                per_page: 5,
              });

              const closedPR = prs.find(pr =>
                pr.state === 'closed' &&
                pr.closed_at &&
                (now - new Date(pr.closed_at).getTime()) > STALE_DAYS * 86400000
              );

              if (!closedPR) {
                core.info(`SKIP (no stale closed PR): ${branch.name}`);
                skipped++;
                continue;
              }

              if (dryRun) {
                core.info(`DRY RUN — would delete: ${branch.name} (PR #${closedPR.number} closed ${closedPR.closed_at})`);
              } else {
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${branch.name}`,
                  });
                  core.info(`DELETED: ${branch.name} (PR #${closedPR.number})`);
                  deleted++;
                } catch (err) {
                  core.warning(`Failed to delete ${branch.name}: ${err.message}`);
                }
              }
            }

            core.summary.addHeading('Stale Branch Cleanup');
            core.summary.addTable([
              [{data: 'Metric', header: true}, {data: 'Count', header: true}],
              ['Deleted', String(deleted)],
              ['Skipped', String(skipped)],
              ['Dry run', dryRun ? 'Yes' : 'No'],
            ]);
            await core.summary.write();
