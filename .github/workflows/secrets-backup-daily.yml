name: Secrets Presence Ledger

# REPLACED 2026-07-08 (see wr/pending/12-secrets-sanity.md).
# The previous "Backup Secrets" version was unsafe AND broken:
#   - it wrote secret VALUES into secret-backups/*.json and pushed to main —
#     and this repo's root deploys to the public web (Pages static.yml +
#     Vercel), so a successful run would have published live tokens, which
#     secret scanning then auto-revokes ("something keeps deleting my
#     secrets" is exactly what that looks like);
#   - only GH_TOKEN was mapped into env, so every other value it "backed up"
#     was an empty string — zero commits ever landed in secret-backups/;
#   - its issue step carried interleaved duplicate flags (merge mangle) and
#     verify-protection printed the first 8 chars of each key into CI logs.
# This version stores NO values. It records presence + a peppered
# fingerprint per critical secret, so the ledger shows exactly WHEN a
# secret vanished or was rotated, and files one labeled issue per
# newly-missing secret.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  ledger:
    name: Update secrets presence ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Update presence ledger (names + fingerprints only, never values)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          PROJECTS_PAT: ${{ secrets.PROJECTS_PAT }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import datetime
          import hashlib
          import json
          import os

          NAMES = [
              "OPENROUTER_API_KEY",
              "ADMIN_GITHUB_TOKEN",
              # DOPPLER_TOKEN stays listed until the six DOPPLER_* secrets are
              # deleted (after 7 quiet ledger days — decommission step 5/6 in
              # issue #15516). Remove it from this list AT THE SAME TIME the
              # secret is deleted, or the ledger files a false
              # SECRET-MISSING issue forever.
              "DOPPLER_TOKEN",
              "DIGITALOCEAN_API_TOKEN",
              "NAMECHEAP_API_KEY",
              "PROJECTS_PAT",
              "PERPLEXITY_API_KEY",
          ]
          PATH = "docs/secrets-ledger.json"
          try:
              ledger = json.load(open(PATH))
          except Exception:
              ledger = {}

          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          missing = []
          for name in NAMES:
              value = os.environ.get(name, "")
              entry = ledger.get(name, {})
              if value:
                  # Peppered fingerprint: detects rotation without exposing
                  # anything recoverable from a high-entropy token.
                  fp = hashlib.sha256(f"revvel-ledger:{name}:{value}".encode()).hexdigest()[:12]
                  if entry.get("fingerprint") and entry["fingerprint"] != fp:
                      entry["last_rotated"] = now
                  entry.update({"present": True, "fingerprint": fp, "last_seen": now})
                  entry.pop("first_missing", None)
              else:
                  if entry.get("present", True):
                      entry["first_missing"] = now
                  entry["present"] = False
                  missing.append(name)
              ledger[name] = entry

          json.dump(ledger, open(PATH, "w"), indent=2, sort_keys=True)
          with open("/tmp/missing-secrets.txt", "w") as f:
              f.write("\n".join(missing))
          print("missing:", ", ".join(missing) if missing else "none")
          PYEOF

      - name: Commit ledger if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/secrets-ledger.json
          if git diff --cached --quiet; then
            echo "Ledger unchanged"
          else
            git commit -m "chore(secrets): update presence ledger"
            git push
          fi

      - name: File one issue per newly-missing secret
        run: |
          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue
            TITLE="[SECRET-MISSING] $NAME is gone from repo secrets"
            EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)"
            if [ -z "$EXISTING" ]; then
              gh issue create \
                --title "$TITLE" \
                --label "auto-fix" \
                --body "The secrets presence ledger detected that \`$NAME\` is missing from this repo's Actions secrets as of this run. Prime suspect: the Doppler GitHub sync integration removing secrets that are not in the Doppler config (see wr/pending/12-secrets-sanity.md). Timeline is in docs/secrets-ledger.json (first_missing / last_seen). Restore the secret, then decide its single write path."
            else
              echo "Issue already open for $NAME (#$EXISTING)"
            fi
          done < /tmp/missing-secrets.txt
