name: Backup Secrets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write
  issues: write

jobs:
  backup-secrets:
    name: Backup critical secrets to protected location
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup directory
        run: mkdir -p secret-backups

      - name: Backup secrets to protected file
        id: backup
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          BACKUP_FILE="secret-backups/backup-$(date +%Y%m%d-%H%M%S).json"
          
          # Critical secrets to backup
          {
            echo "{"
            echo '  "OPENROUTER_API_KEY": "'"$OPENROUTER_API_KEY"'",'
            echo '  "ADMIN_GITHUB_TOKEN": "'"$ADMIN_GITHUB_TOKEN"'",'
            echo '  "DOPPLER_TOKEN": "'"$DOPPLER_TOKEN"'",'
            echo '  "DIGITALOCEAN_API_TOKEN": "'"$DIGITALOCEAN_API_TOKEN"'",'
            echo '  "NAMECHEAP_API_KEY": "'"$NAMECHEAP_API_KEY"'"
            echo "}"
          } > "$BACKUP_FILE"
          
          echo "Backup created: $BACKUP_FILE"
          ls -la "$BACKUP_FILE"

      - name: Commit and push backup
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add secret-backups/
          git diff --cached --quiet || git commit -m "backup: secrets $(date +%Y%m%d)"
          git push origin main 2>/dev/null || echo "Push skipped (may need force)"

      - name: Create backup issue
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🔐 Secret Backup Completed - $(date +%Y-%m-%d)" \
            --body "## Secret Backup Completed

**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

Backup file created in \`secret-backups/\` directory.

This backup protects against:
- Doppler sync clearing secrets when token is missing
- Workflow failures overwriting secrets with empty values
- Accidental secret deletion

Run \`secrets-sentinel.yml\` manually to check current status." \
            --label "backup,auto-info"

  verify-protection:
    name: Verify secret protection status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check critical secrets
        run: |
          echo "=== Critical Secrets Status ==="
          
          check() {
            local name=$1
            local env_val="${!name:-}"
            if [ -n "$env_val" ]; then
              echo "✅ $name: SET ($(echo $env_val | cut -c1-8)...)"
            else
              echo "❌ $name: MISSING"
            fi
          }
          
          check OPENROUTER_API_KEY
          check ADMIN_GITHUB_TOKEN
          check DOPPLER_TOKEN
          check DIGITALOCEAN_API_TOKEN
          check NAMECHEAP_API_KEY
