name: Auto-Error Handler & Self-Healing
on:
  workflow_dispatch:
    inputs:
      error_type:
        description: Type of error
        required: true
        type: choice
        options:
          - openrouter
          - ci_failure
          - test_failure
          - build_failure
          - deploy_failure
          - api_timeout
          - dependency_failure
          - other
      error_message:
        description: Error message
        required: true
      error_context:
        description: Full error context (logs, stack trace)
        required: false
      attempted_fixes:
        description: Fixes already attempted (JSON array)
        required: false
      workflow_run_id:
        description: Related workflow run ID
        required: false
  workflow_call:
    inputs:
      error_type:
        required: true
        type: string
      error_message:
        required: true
        type: string
      error_context:
        required: false
        type: string
      attempted_fixes:
        required: false
        type: string
      workflow_run_id:
        required: false
        type: string
permissions:
  issues: write
  contents: read
  actions: read
jobs:
  capture-and-create-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      recovery_needed: ${{ steps.analyze.outputs.recovery_needed }}
      # `create_issue` calls core.setOutput('issue_url', ...) but the job never
      # exported it, so the summary line in `attempt-recovery` read
      # `needs.capture-and-create-issue.outputs.issue_url` and printed
      # "View issue: " with nothing after it (#17742).
      issue_url: ${{ steps.create_issue.outputs.issue_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Analyze error
        id: analyze
        env:
          ERROR_TYPE: ${{ inputs.error_type }}
        run: |
          # Determine labels
          LABELS="auto-error,needs-fix,$ERROR_TYPE"

          # Determine if auto-recovery should be attempted
          RECOVERY_NEEDED="true"
          if [[ "$ERROR_TYPE" == "openrouter" ]] || [[ "$ERROR_TYPE" == "api_timeout" ]]; then
            LABELS="$LABELS,ralph-loop,auto-fix"
          fi

          # Determine assignee
          ASSIGNEE="copilot"
          if [[ "$ERROR_TYPE" == "deploy_failure" ]]; then
            ASSIGNEE="midnghtsapphire"
            RECOVERY_NEEDED="false"
          fi

          echo "labels=$LABELS" >> $GITHUB_OUTPUT
          echo "assignee=$ASSIGNEE" >> $GITHUB_OUTPUT
          echo "recovery_needed=$RECOVERY_NEEDED" >> $GITHUB_OUTPUT
      - name: Gather additional context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
        run: |
          # Get workflow logs if run ID provided
          if [[ -n "$WORKFLOW_RUN_ID" ]]; then
            gh run view "$WORKFLOW_RUN_ID" --log > workflow_logs.txt || true
            LOGS=$(head -n 100 workflow_logs.txt)
          else
            LOGS="No workflow logs available"
          fi

          # Get recent commits
          RECENT_COMMITS=$(git log --oneline -5)

          # Get current branch
          BRANCH=$(git branch --show-current)

          # Save to outputs
          echo "logs<<EOF" >> $GITHUB_OUTPUT
          echo "$LOGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$RECENT_COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
      - name: Create error issue
        id: create_issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_ERROR_TYPE: ${{ inputs.error_type }}
          INPUT_ERROR_MESSAGE: ${{ inputs.error_message }}
          INPUT_ERROR_CONTEXT: ${{ inputs.error_context }}
          INPUT_ATTEMPTED_FIXES: ${{ inputs.attempted_fixes }}
          INPUT_WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
          ANALYZE_LABELS: ${{ steps.analyze.outputs.labels }}
          ANALYZE_ASSIGNEE: ${{ steps.analyze.outputs.assignee }}
          CONTEXT_LOGS: ${{ steps.context.outputs.logs }}
          CONTEXT_COMMITS: ${{ steps.context.outputs.commits }}
          CONTEXT_BRANCH: ${{ steps.context.outputs.branch }}
        with:
          script: |
            const errorType = process.env.INPUT_ERROR_TYPE || '';
            const errorMessage = process.env.INPUT_ERROR_MESSAGE || '';
            const errorContext = process.env.INPUT_ERROR_CONTEXT || '';
            const attemptedFixes = process.env.INPUT_ATTEMPTED_FIXES || '[]';
            const workflowRunId = process.env.INPUT_WORKFLOW_RUN_ID || '';
            const labels = (process.env.ANALYZE_LABELS || '').split(',').filter(Boolean);
            const assignee = process.env.ANALYZE_ASSIGNEE || '';
            const logs = process.env.CONTEXT_LOGS || '';
            const commits = process.env.CONTEXT_COMMITS || '';
            const branch = process.env.CONTEXT_BRANCH || '';

            // Parse attempted fixes
            let fixes = [];
            try {
              fixes = JSON.parse(attemptedFixes);
            } catch (e) {
              fixes = attemptedFixes ? [attemptedFixes] : [];
            }

            // Build issue body
            let body = `## Auto-Generated Error Report\n\n`;
            body += `**Error Type:** \`${errorType}\`\n`;
            body += `**Branch:** \`${branch}\`\n`;
            body += `**Timestamp:** ${new Date().toISOString()}\n\n`;

            body += `### Error Message\n\n`;
            body += `\`\`\`\n${errorMessage}\n\`\`\`\n\n`;

            if (errorContext) {
              body += `### Error Context\n\n`;
              body += `<details>\n<summary>Full context (click to expand)</summary>\n\n`;
              body += `\`\`\`\n${errorContext.substring(0, 5000)}\n\`\`\`\n\n`;
              body += `</details>\n\n`;
            }

            if (workflowRunId) {
              body += `### Related Workflow\n\n`;
              body += `- Run ID: ${workflowRunId}\n`;
              body += `- [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${workflowRunId})\n\n`;
            }

            if (fixes.length > 0) {
              body += `### Attempted Fixes\n\n`;
              fixes.forEach((fix, i) => {
                body += `${i + 1}. ${fix}\n`;
              });
              body += `\n`;
            }

            if (logs && logs !== 'No workflow logs available') {
              body += `### Recent Workflow Logs\n\n`;
              body += `<details>\n<summary>Last 100 lines (click to expand)</summary>\n\n`;
              body += `\`\`\`\n${logs.substring(0, 3000)}\n\`\`\`\n\n`;
              body += `</details>\n\n`;
            }

            body += `### Recent Commits\n\n`;
            body += `\`\`\`\n${commits}\n\`\`\`\n\n`;

            body += `---\n\n`;
            body += `### Recovery Protocol\n\n`;
            body += `This error was automatically detected by the self-healing system. `;

            if (labels.includes('ralph-loop')) {
              body += `@${assignee} will attempt automatic recovery. If recovery fails after 3 attempts, this will be escalated to @midnghtsapphire.\n\n`;
            } else {
              body += `@${assignee} should investigate and implement a fix.\n\n`;
            }

            body += `**Required Actions:**\n`;
            body += `1. Analyze the error and root cause\n`;
            body += `2. Research 3+ alternative solutions\n`;
            body += `3. Implement the best solution\n`;
            body += `4. Document the fix in error handlers\n`;
            body += `5. Update learnings.md with error pattern and solution\n`;
            body += `6. Close this issue when fixed\n\n`;

            body += `**Reference:** See [AGENTS.md](docs/AGENTS.md#agent-autonomy--obsessive-self-sufficiency) for autonomy protocol.\n`;

            // Create the issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AUTO-ERROR] ${errorType}: ${errorMessage.substring(0, 80)}${errorMessage.length > 80 ? '...' : ''}`,
              body: body,
              labels: labels,
              assignees: [assignee]
            });

            console.log(`Created issue #${issue.data.number}`);
            core.setOutput('issue_number', issue.data.number);
            core.setOutput('issue_url', issue.data.html_url);

            return issue.data.number;
      - name: Comment on related PR if exists
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CREATED_ISSUE_NUMBER: ${{ steps.create_issue.outputs.issue_number }}
          CREATED_ISSUE_URL: ${{ steps.create_issue.outputs.issue_url }}
        with:
          script: |
            const issueNumber = process.env.CREATED_ISSUE_NUMBER || '';
            const issueUrl = process.env.CREATED_ISSUE_URL || '';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚨 **Automatic error detected**\n\nAn error was encountered and automatically logged: ${issueUrl}\n\nThe self-healing system will attempt recovery. If recovery fails, this will be escalated.`
            });
    timeout-minutes: 30
  attempt-recovery:
    needs: capture-and-create-issue
    if: needs.capture-and-create-issue.outputs.recovery_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Attempt recovery for OpenRouter errors
        if: inputs.error_type == 'openrouter'
        run: |
          echo "Attempting OpenRouter recovery..."

          # Try alternative models
          MODELS=(
            "anthropic/claude-sonnet-4"
            "anthropic/claude-3.5-sonnet"
            "openai/gpt-4-turbo-preview"
          )

          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"
            # Attempt to call with alternative model
            # This would be implemented based on the specific script
            # For now, just document the attempt
            echo "Recovery attempt with $MODEL" >> recovery_log.txt
          done
      - name: Attempt recovery for API timeouts
        if: inputs.error_type == 'api_timeout'
        run: |
          echo "Implementing exponential backoff retry..."

          # Try with increasing timeouts
          for ATTEMPT in 1 2 3; do
            TIMEOUT=$((10 * ATTEMPT * ATTEMPT))
            echo "Attempt $ATTEMPT with ${TIMEOUT}s timeout"
            # Actual retry logic would go here
            echo "Retry attempt $ATTEMPT with ${TIMEOUT}s timeout" >> recovery_log.txt
          done
      - name: Attempt recovery for CI failures
        if: inputs.error_type == 'ci_failure'
        env:
          ERROR_MESSAGE: ${{ inputs.error_message }}
        run: |
          echo "Analyzing CI failure patterns..."

          # Check for common CI issues
          if grep -q "ENOSPC" <<< "$ERROR_MESSAGE"; then
            echo "Disk space issue detected - cleaning up"
            # Clean npm cache, remove temp files, etc.
            npm cache clean --force || true
            docker system prune -af || true
          fi

          if grep -q "timeout" <<< "$ERROR_MESSAGE"; then
            echo "Timeout issue - suggesting increased timeout values"
          fi

          echo "CI recovery attempts logged" >> recovery_log.txt
      - name: Upload recovery log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-log
          path: recovery_log.txt
          retention-days: 30
      - name: Comment recovery results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ needs.capture-and-create-issue.outputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const fs = require('fs');

            let recoveryLog = 'No recovery log available';
            try {
              recoveryLog = fs.readFileSync('recovery_log.txt', 'utf8');
            } catch (e) {
              console.log('Could not read recovery log');
            }

            const body = `### Automatic Recovery Attempt\n\n` +
              `Recovery protocol executed at ${new Date().toISOString()}\n\n` +
              `**Recovery Log:**\n\`\`\`\n${recoveryLog}\n\`\`\`\n\n` +
              `If this resolves the issue, please verify and close. Otherwise, manual intervention required.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
    timeout-minutes: 30
  notify-completion:
    needs:
      - capture-and-create-issue
      - attempt-recovery
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          ERROR_TYPE: ${{ inputs.error_type }}
          ISSUE_NUMBER: ${{ needs.capture-and-create-issue.outputs.issue_number }}
          RECOVERY_NEEDED: ${{ needs.capture-and-create-issue.outputs.recovery_needed }}
          ISSUE_URL: ${{ needs.capture-and-create-issue.outputs.issue_url }}
        run: |
          echo "## Auto-Error Handler Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Error Type:** $ERROR_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "- **Issue Created:** #$ISSUE_NUMBER" >> $GITHUB_STEP_SUMMARY
          echo "- **Recovery Attempted:** $RECOVERY_NEEDED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View issue: $ISSUE_URL" >> $GITHUB_STEP_SUMMARY
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
