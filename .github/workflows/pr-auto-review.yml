name: PR Auto Review via OpenRouter

# Automated PR code review submission when PR needs review
#
# What this workflow does:
#   1. Triggers when PR has "awaiting-approval" label (needs review)
#   2. Calls OpenRouter to perform automated code review
#   3. Creates review comments on specific lines
#   4. Submits a formal GitHub review (APPROVE, COMMENT, or REQUEST_CHANGES)
#
# This complements pr-review-request-handler.yml which handles "changes requested" scenarios.
# This workflow proactively SUBMITS reviews when a PR needs one.
#
# Automation Routing Policy: Uses OpenRouter via OPENROUTER_API_KEY (not GitHub Copilot)
#
# Related workflows:
#   • pr-review-status.yml — Applies review status labels
#   • pr-review-request-handler.yml — Handles changes-requested reviews
#   • openrouter-triage.yml — General issue/PR triage
#
# Documentation: docs/PR_AUTO_REVIEW_AUTOMATION.md

on:
  pull_request:
    types: [labeled, opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Serialize runs per PR to avoid duplicate reviews or race conditions
concurrency:
  group: pr-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-review:
    name: Submit Automated Review
    runs-on: ubuntu-latest
    # Only run when:
    # 1. PR has "awaiting-approval" label, OR
    # 2. PR is opened/ready for review and doesn't have any review labels yet
    # 3. PR is from same repository (not from untrusted fork)
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'awaiting-approval') ||
        (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize'))
      )

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set. Automated review will be skipped."
            exit 0
          else
            echo "OPENROUTER_API_KEY is configured."
          fi

      - name: Check if PR needs review
        id: check-needs-review
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;
            
            // Security: Validate PR is from same repository (not fork)
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.notice('Skipping auto-review - PR is from untrusted fork');
              core.setOutput('needs_review', 'false');
              return;
            }
            
            // Cost management: Check PR size before proceeding
            const { data: prDetails } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            
            const additions = prDetails.additions || 0;
            const deletions = prDetails.deletions || 0;
            const totalChanges = additions + deletions;
            const changedFiles = prDetails.changed_files || 0;
            
            // Skip extremely large PRs to prevent excessive API costs
            const MAX_CHANGES = 5000;
            const MAX_FILES = 100;
            
            if (totalChanges > MAX_CHANGES) {
              core.warning(`PR has ${totalChanges} changes (>${MAX_CHANGES}). Skipping auto-review to control costs.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ **Automated Review Skipped**\n\nThis PR has ${totalChanges} lines changed, which exceeds the ${MAX_CHANGES} line limit for automated reviews. Please request human review or split into smaller PRs.`
              });
              core.setOutput('needs_review', 'false');
              return;
            }
            
            if (changedFiles > MAX_FILES) {
              core.warning(`PR has ${changedFiles} files (>${MAX_FILES}). Skipping auto-review to control costs.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ **Automated Review Skipped**\n\nThis PR changes ${changedFiles} files, which exceeds the ${MAX_FILES} file limit for automated reviews. Please request human review or split into smaller PRs.`
              });
              core.setOutput('needs_review', 'false');
              return;
            }
            
            // Check if PR has awaiting-approval label or no review labels
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const labelNames = labels.map(l => l.name);
            const hasNoTriage = labelNames.includes('no-triage');
            const hasAwaitingApproval = labelNames.includes('awaiting-approval');
            const hasAnyReviewStatus = labelNames.some(l => 
              ['changes-requested', 'approved', 'review-started'].includes(l)
            );

            if (hasNoTriage) {
              core.notice('Skipping auto-review due to no-triage label');
              core.setOutput('needs_review', 'false');
              return;
            }

            // Check if there are already reviews from humans
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const hasHumanReview = reviews.some(r => 
              r.user.type !== 'Bot' && 
              ['APPROVED', 'CHANGES_REQUESTED'].includes(r.state)
            );

            if (hasHumanReview) {
              core.notice('Skipping auto-review - human review already exists');
              core.setOutput('needs_review', 'false');
              return;
            }

            // Check if bot has already submitted a review for this commit
            const currentSha = pr.head.sha;
            const hasBotReview = reviews.some(r => 
              r.user.login === 'github-actions[bot]' &&
              r.commit_id === currentSha
            );

            if (hasBotReview) {
              core.notice('Bot has already reviewed this commit');
              core.setOutput('needs_review', 'false');
              return;
            }

            if (hasAwaitingApproval || (!hasAnyReviewStatus && !hasHumanReview)) {
              core.notice('PR needs automated review');
              core.setOutput('needs_review', 'true');
            } else {
              core.notice('PR does not need automated review');
              core.setOutput('needs_review', 'false');
            }

      - name: Run OpenRouter auto-review
        if: steps.check-needs-review.outputs.needs_review == 'true'
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MODEL: anthropic/claude-sonnet-4
          MAX_DIFF_SIZE: 30000
          MAX_FILES_TO_FETCH: 100
        run: node scripts/pr-auto-review.js
