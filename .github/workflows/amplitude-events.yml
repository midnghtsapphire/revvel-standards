name: Amplitude — Repo Event Telemetry
on:
  issues:
    types:
      - opened
      - closed
      - reopened
  pull_request:
    types:
      - opened
      - closed
      - reopened
      - ready_for_review
  release:
    types:
      - published
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      event_type:
        description: Event name to send (verification ping)
        type: string
        required: false
        default: amplitude_workflow_verify
permissions:
  contents: read
concurrency:
  group: amplitude-events-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.release.id || github.run_id }}
  cancel-in-progress: false
jobs:
  send:
    name: Send event to Amplitude
    runs-on: ubuntu-latest
    steps:
      - name: Verify configuration
        id: verify
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_ENABLED: ${{ vars.AMPLITUDE_ENABLED }}
          AMPLITUDE_REGION: ${{ vars.AMPLITUDE_REGION }}
        run: |
          enabled="${AMPLITUDE_ENABLED:-true}"
          region="${AMPLITUDE_REGION:-us}"
          if [ "${enabled}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::AMPLITUDE_ENABLED=${enabled} — skipping send."
            exit 0
          fi
          if [ -z "${AMPLITUDE_API_KEY}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::AMPLITUDE_API_KEY is not set. Skipping. See standards/AMPLITUDE_INTEGRATION_STANDARD.md."
            exit 0
          fi
          case "${region}" in
            eu) endpoint="https://api.eu.amplitude.com/2/httpapi" ;;
            us|"") endpoint="https://api2.amplitude.com/2/httpapi" ;;
            *)
              echo "::warning::Unknown AMPLITUDE_REGION='${region}', defaulting to 'us'."
              endpoint="https://api2.amplitude.com/2/httpapi"
              ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "endpoint=${endpoint}" >> "$GITHUB_OUTPUT"
          echo "region=${region}" >> "$GITHUB_OUTPUT"
      - name: Build event payload
        if: steps.verify.outputs.skip != 'true'
        id: payload
        uses: actions/github-script@v9.0.0
        env:
          DISPATCH_EVENT_TYPE: ${{ github.event.inputs.event_type }}
        with:
          script: |
            const e = context.eventName;
            const p = context.payload || {};
            const repo = `${context.repo.owner}/${context.repo.repo}`;

            // Map GitHub event → Amplitude event_type + properties.
            let eventType = `gh_${e}`;
            const props = {
              repo,
              workflow: context.workflow,
              run_id: context.runId,
              github_event: e,
              github_action: p.action || null,
              ref: context.ref || null,
              sha: context.sha || null,
              actor: context.actor || null,
            };

            if (e === 'issues' && p.issue) {
              eventType = `gh_issue_${p.action}`;
              props.issue_number = p.issue.number;
              props.issue_title = p.issue.title;
              props.issue_labels = (p.issue.labels || []).map(l => l.name);
              props.issue_state = p.issue.state;
            } else if (e === 'pull_request' && p.pull_request) {
              const pr = p.pull_request;
              eventType = pr.merged && p.action === 'closed'
                ? 'gh_pr_merged'
                : `gh_pr_${p.action}`;
              props.pr_number = pr.number;
              props.pr_title = pr.title;
              props.pr_state = pr.state;
              props.pr_merged = !!pr.merged;
              props.pr_draft = !!pr.draft;
              props.pr_labels = (pr.labels || []).map(l => l.name);
              props.pr_base = pr.base && pr.base.ref;
              props.pr_head = pr.head && pr.head.ref;
              props.pr_additions = pr.additions;
              props.pr_deletions = pr.deletions;
              props.pr_changed_files = pr.changed_files;
            } else if (e === 'release' && p.release) {
              eventType = 'gh_release_published';
              props.release_tag = p.release.tag_name;
              props.release_name = p.release.name;
              props.release_prerelease = !!p.release.prerelease;
            } else if (e === 'push') {
              eventType = 'gh_push_main';
              props.commit_count = (p.commits || []).length;
              props.head_commit_message = p.head_commit && p.head_commit.message;
              props.pusher = p.pusher && p.pusher.name;
            } else if (e === 'workflow_dispatch') {
              eventType = process.env.DISPATCH_EVENT_TYPE || 'amplitude_workflow_verify';
            }

            // Stable per-repo user_id so Amplitude can group by repo.
            const userId = `gh:${repo}`;
            const insertId = `${context.runId}-${context.runNumber}-${e}`;

            const event = {
              user_id: userId,
              event_type: eventType,
              time: Date.now(),
              insert_id: insertId,
              event_properties: props,
              user_properties: { repo, org: context.repo.owner },
              app_version: context.sha || undefined,
              platform: 'github-actions',
            };

            core.setOutput('event_type', eventType);
            core.setOutput('event_json', JSON.stringify(event));
            core.summary
              .addHeading('Amplitude event')
              .addRaw(`Event type: \`${eventType}\``).addBreak()
              .addRaw(`Repo: \`${repo}\``).addBreak()
              .addCodeBlock(JSON.stringify(event, null, 2), 'json');
            await core.summary.write();
      - name: POST event to Amplitude HTTP V2
        if: steps.verify.outputs.skip != 'true'
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_ENDPOINT: ${{ steps.verify.outputs.endpoint }}
          EVENT_JSON: ${{ steps.payload.outputs.event_json }}
        run: |
          set -euo pipefail
          # Wrap the single event in the V2 envelope and let jq inject the API
          # key safely (no shell-quoting risk, no key in the process table).
          body="$(
            EVENT_JSON="${EVENT_JSON}" AMPLITUDE_API_KEY="${AMPLITUDE_API_KEY}" \
              jq -n '{api_key: env.AMPLITUDE_API_KEY, events: [(env.EVENT_JSON | fromjson)]}'
          )"
          # Send and capture HTTP status; fail loudly on non-2xx.
          http_code="$(
            printf '%s' "${body}" | curl -sS -o /tmp/amplitude.out -w '%{http_code}' \
              -X POST "${AMPLITUDE_ENDPOINT}" \
              -H 'Content-Type: application/json' \
              --data-binary @-
          )"
          echo "Amplitude response (${http_code}):"
          cat /tmp/amplitude.out || true
          echo
          case "${http_code}" in
            2*) echo "✅ Sent to Amplitude (HTTP ${http_code})." ;;
            *)  echo "::error::Amplitude rejected the event (HTTP ${http_code})."; exit 1 ;;
          esac
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
