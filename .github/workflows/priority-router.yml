name: Priority Router — Issues & PRs
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - closed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log routing decisions without applying changes
        type: boolean
        default: false
      use_openrouter:
        description: Use OpenRouter when OPENROUTER_API_KEY is configured
        type: boolean
        default: true
# Serialize per issue/PR so rapid label toggles don't spawn concurrent runs
# that race on the same priority labels. Schedule/dispatch runs key on run_id
# (no cancellation). Cancels only superseded runs for the same target.
concurrency:
  group: priority-router-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true
permissions:
  issues: write
  pull-requests: write
  contents: read
env:
  PRIORITY_LABELS: priority-p0,priority-p1,priority-p2,priority-p3
  PRIORITY_DEFINITIONS:
    '[{"name":"priority-p0","color":"b60205","description":"Critical
    priority — drop
    everything"},{"name":"priority-p1","color":"d93f0b","description":"High
    priority — next
    up"},{"name":"priority-p2","color":"fbca04","description":"Medium priority —
    normal queue"},{"name":"priority-p3","color":"0e8a16","description":"Low
    priority — backlog"}]'
jobs:
  route-priority:
    name: Route priority
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Route priority for issues and PRs
        uses: actions/github-script@v9.0.0
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          USE_OPENROUTER: ${{ github.event.inputs.use_openrouter || 'true' }}
          REVVEL_LLM_ALLOW_CLOUD: ${{ vars.REVVEL_LLM_ALLOW_CLOUD }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: >
            const DEFAULT_PRIORITY_LABELS = ['priority-p0', 'priority-p1',
            'priority-p2', 'priority-p3'];

            const DEFAULT_PRIORITY_DEFINITIONS = [
              { name: 'priority-p0', color: 'b60205', description: 'Critical priority — drop everything' },
              { name: 'priority-p1', color: 'd93f0b', description: 'High priority — next up' },
              { name: 'priority-p2', color: 'fbca04', description: 'Medium priority — normal queue' },
              { name: 'priority-p3', color: '0e8a16', description: 'Low priority — backlog' },
            ];


            const PRIORITY_LABELS = (process.env.PRIORITY_LABELS ||
            DEFAULT_PRIORITY_LABELS.join(','))
              .split(',')
              .map((label) => label.trim())
              .filter(Boolean);


            let PRIORITY_DEFINITIONS = DEFAULT_PRIORITY_DEFINITIONS;

            if (process.env.PRIORITY_DEFINITIONS) {
              try {
                const parsed = JSON.parse(process.env.PRIORITY_DEFINITIONS);
                if (Array.isArray(parsed) && parsed.length > 0) {
                  PRIORITY_DEFINITIONS = parsed;
                } else {
                  core.warning('PRIORITY_DEFINITIONS is empty or invalid. Using defaults.');
                }
              } catch (e) {
                core.warning(`Failed to parse PRIORITY_DEFINITIONS. Using defaults. ${e.message}`);
              }
            }

            const dryRun = process.env.DRY_RUN === 'true';

            // Spend gate (#17850): the LLM branch bills OpenRouter, so it needs an
            // explicit opt-in. The rest of this step — routing and labelling — is
            // free and still runs, which is why the gate is here rather than an
            // `if:` on the whole step.
            const cloudAllowed = process.env.REVVEL_LLM_ALLOW_CLOUD === '1';
            const useOpenRouter = process.env.USE_OPENROUTER === 'true' &&
            !!process.env.OPENROUTER_API_KEY && cloudAllowed;


            const normalizePriority = (value) => {
              if (!value) return null;
              const v = String(value).toLowerCase();
              if (v.includes('p0')) return 'priority-p0';
              if (v.includes('p1')) return 'priority-p1';
              if (v.includes('p2')) return 'priority-p2';
              if (v.includes('p3')) return 'priority-p3';
              return null;
            };


            const fallbackPriority = (labels, text) => {
              const labelSet = new Set(labels);
              const lower = text.toLowerCase();
              if (labelSet.has('security') || /security|vuln|cve|credential|breach/.test(lower)) return 'priority-p0';
              if (labelSet.has('bug') || /bug|error|fail|broken|crash|regression/.test(lower)) return 'priority-p1';
              if (labelSet.has('documentation') || /docs|documentation|readme/.test(lower)) return 'priority-p3';
              if (labelSet.has('enhancement') || /feature|enhancement|improve/.test(lower)) return 'priority-p2';
              return 'priority-p2';
            };


            const ensureLabelExists = async (name) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (e) {
                if (e.status === 404) {
                  const def = PRIORITY_DEFINITIONS.find((d) => d.name === name);
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ...(def || {
                        name,
                        color: 'cfd3d7',
                        description: `Auto-created priority label: ${name}`,
                      }),
                    });
                  } catch (createErr) {
                    core.notice(`Could not create label "${name}": ${createErr.message}`);
                  }
                  return;
                }
                core.notice(`Could not ensure label "${name}": ${e.message}`);
              }
            };


            const ensurePriorityLabels = async () => {
              for (const name of PRIORITY_LABELS) {
                await ensureLabelExists(name);
              }
            };


            const fetchOpenRouterPriority = async (item, labels) => {
              if (!useOpenRouter) return null;
              const body = (item.body || '').slice(0, 2000);
              const payload = {
                model: 'anthropic/claude-sonnet-4',
                messages: [
                  {
                    role: 'system',
                    content:
                      'You are a GitHub issue triage bot. ' +
                      'Classify the work item priority and respond ONLY with JSON: ' +
                      '{"priority":"p0|p1|p2|p3","reason":"short reason"}',
                  },
                  {
                    role: 'user',
                    content: [
                      `Title: ${item.title}`,
                      `Type: ${item.pull_request ? 'pull request' : 'issue'}`,
                      `Labels: ${labels.join(', ') || 'none'}`,
                      `Body: ${body || 'none'}`,
                    ].join('\n'),
                  },
                ],
              };

              try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${process.env.OPENROUTER_API_KEY}`,
                    'Content-Type': 'application/json',
                    'X-Title': 'Revvel Priority Router',
                  },
                  body: JSON.stringify(payload),
                });

                if (!response.ok) {
                  core.warning(`OpenRouter returned ${response.status}. Falling back.`);
                  return null;
                }

                const data = await response.json();
                const content = data?.choices?.[0]?.message?.content?.trim() || '';
                let parsed;
                try {
                  parsed = JSON.parse(content);
                } catch (_) {
                  const match = content.match(/p[0-3]/i);
                  return normalizePriority(match ? match[0] : null);
                }
                return normalizePriority(parsed?.priority);
              } catch (e) {
                core.warning(`OpenRouter request failed: ${e.message}`);
                return null;
              }
            };


            const routeItem = async (item) => {
              if (!item) return false;
              if (item.state && item.state !== 'open') return false;
              const labels = (item.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
              if (labels.includes('needs-human') || labels.includes('blocked')) {
                return false;
              }

              const text = `${item.title}\n${item.body || ''}`;
              const openRouterPriority = await fetchOpenRouterPriority(item, labels);
              const priorityLabel = openRouterPriority || fallbackPriority(labels, text);
              const existingPriority = labels.filter((label) => PRIORITY_LABELS.includes(label));

              if (existingPriority.length === 1 && existingPriority[0] === priorityLabel) {
                return false;
              }

              if (dryRun) {
                core.info(`[dry-run] Would set ${priorityLabel} on #${item.number}.`);
                return true;
              }

              for (const label of existingPriority) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: item.number,
                    name: label,
                  });
                } catch (e) {
                  // This branch used to `core.notice` a non-404 and carry on —
                  // a notice is not a control. Re-throw it.
                  if (e.status !== 404) throw e;
                }
              }

              await ensureLabelExists(priorityLabel);

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  labels: [priorityLabel],
                });
                core.info(`Set ${priorityLabel} on #${item.number}.`);
              } catch (e) {
                core.notice(`Could not add label "${priorityLabel}": ${e.message}`);
              }

              return true;
            };


            const runSingle = async () => {
              const item = context.payload.issue || context.payload.pull_request;
              if (!item) {
                core.info('No issue or pull request found in payload.');
                return;
              }
              const updated = await routeItem(item);
              if (!updated) {
                core.info(`No priority change needed for #${item.number}.`);
              }
            };


            const runSweep = async () => {
              let items = [];
              try {
                items = await github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100,
                });
              } catch (e) {
                core.warning(`paginate listForRepo error: ${e.message}`);
                return;
              }

              let routed = 0;
              let skipped = 0;

              for (const item of items) {
                const updated = await routeItem(item);
                if (updated) {
                  routed++;
                } else {
                  skipped++;
                }
              }

              core.summary
                .addHeading('Priority router sweep')
                .addTable([
                  [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                  ['Routed', String(routed)],
                  ['Skipped', String(skipped)],
                  ['Total open', String(items.length)],
                  ['Dry run', String(dryRun)],
                  ['OPENROUTER_API_KEY', useOpenRouter ? 'configured' : 'missing/disabled'],
                ])
                .write();
            };


            const isForkPr =
              context.eventName === 'pull_request_target' &&
              context.payload.pull_request &&
              context.payload.pull_request.head.repo.full_name !==
                `${context.repo.owner}/${context.repo.repo}`;

            if (isForkPr) {
              // Add visible feedback for fork PRs that are being skipped
              const prNumber = context.payload.pull_request.number;
              const forkRepo = context.payload.pull_request.head.repo.full_name;
              
              core.info(`Detected fork PR #${prNumber} from ${forkRepo}. Adding third-party label and comment.`);
              
              // Check if we've already commented on this PR
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              
              const botCommentExists = comments.data.some(comment => 
                comment.user.type === 'Bot' && 
                comment.body.includes('Third-Party Pull Request Detected')
              );
              
              if (botCommentExists) {
                core.info(`Fork PR comment already exists for #${prNumber}. Skipping duplicate.`);
                return;
              }
              
              // Add third-party label for visibility
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['third-party', 'external-contributor'],
                });
              } catch (error) {
                core.warning(`Could not add third-party labels: ${error.message}`);
              }
              
              // Post informative comment
              const comment = [
                '👋 **Third-Party Pull Request Detected**',
                '',
                `This PR originates from a forked repository (\`${forkRepo}\`), not the main \`${context.repo.owner}/${context.repo.repo}\` repository.`,
                '',
                '**What this means:**',
                '- ✅ Your PR is welcome! We appreciate external contributions.',
                '- ⚠️ Automated priority routing is skipped for security (fork PRs can\'t access secrets)',
                '- 👁️ A maintainer will manually review and assign priority labels',
                '- 🔐 Security workflows run in a restricted mode',
                '',
                '**Next steps:**',
                '1. A maintainer will review your PR within 24-48 hours',
                '2. They will manually apply appropriate priority and routing labels',
                '3. Standard review process will proceed once labels are applied',
                '',
                `Thank you for contributing to ${context.repo.repo}! 🎉`,
                '',
                '_This is an automated message from `.github/workflows/priority-router.yml`_'
              ].join('\n');
              
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: comment,
                });
              } catch (error) {
                core.warning(`Could not post fork PR comment: ${error.message}`);
              }
              
              core.info('Skipping forked pull request event.');
              return;
            }


            const action = context.payload.action;

            const eventName = context.eventName;

            const sweepActions = new Set(['opened', 'reopened', 'closed']);

            const singleActions = new Set(['edited', 'labeled', 'unlabeled',
            'ready_for_review']);


            const shouldSweep =
              eventName === 'schedule' ||
              eventName === 'workflow_dispatch' ||
              (eventName === 'issues' && sweepActions.has(action)) ||
              (eventName === 'pull_request_target' && sweepActions.has(action));

            const shouldSingle =
              (eventName === 'issues' && singleActions.has(action)) ||
              (eventName === 'pull_request_target' && singleActions.has(action));

            await ensurePriorityLabels();


            if (shouldSweep) {
              await runSweep();
            } else if (shouldSingle) {
              await runSingle();
            } else {
              core.info('No priority routing action required.');
            }
    timeout-minutes: 30
