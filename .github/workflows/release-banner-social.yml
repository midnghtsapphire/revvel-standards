# Release → banner SEO pack → Discord (optional) / WR on failure
# Secrets: names only in config/connections.image-automation.yml
name: release-banner-social

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag override
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: release-banner-social
  cancel-in-progress: false

jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ""

      - name: Build release banner SEO pack
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || 'dev' }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          mkdir -p artifacts/image-automation
          node -e "
            const fs=require('fs');
            const tag=process.env.TAG;
            const repo=process.env.REPO;
            fs.writeFileSync('artifacts/image-automation/brief.json', JSON.stringify({
              topic: 'GitHub release ' + tag + ' announcement for ' + repo,
              primaryKeyword: 'github release banner',
              kind: 'release_banner',
              product: repo,
              secondaryKeywords: 'changelog, release notes, discord, open source',
              pinnedLsi: ['release notes', 'changelog announcement', 'discord release webhook'],
              pageUrl: process.env.SERVER + '/' + repo + '/releases/tag/' + tag
            }, null, 2));
          "
          node scripts/image-seo-build-pack.mjs \
            --brief artifacts/image-automation/brief.json \
            --out artifacts/image-automation/release-pack.json
          node -e "
            const p=require('./artifacts/image-automation/release-pack.json');
            if (p.human_gate && p.human_gate.auto_merge !== false) {
              console.error('auto_merge must be false');
              process.exit(1);
            }
            console.log('pack ok', p.seo.filename);
          "

      - name: Upload SEO pack
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-banner-pack
          path: artifacts/image-automation/
          retention-days: 1

      # Optional: only fires when the secret name listed in
      # config/connections.image-automation.yml is present. Never put the value in git.
      #
      # `secrets` is not available in a step-level `if` (#17742). Rather than
      # hoisting the webhook to a job-level `env` — which would put the secret in
      # scope for every step in the job — the presence check is computed here and
      # the value stays scoped to the single step that uses it.
      - name: Check for Discord webhook
        id: discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          # Emits only a boolean. The value itself is never echoed.
          if [ -n "${DISCORD_WEBHOOK_URL}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord (optional)
        if: steps.discord.outputs.configured == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          MSG=$(node -e "const p=require('./artifacts/image-automation/release-pack.json'); process.stdout.write('Release banner pack ready: ' + p.seo.filename + ' — ' + p.seo.altText)")
          PAYLOAD=$(node -e 'process.stdout.write(JSON.stringify({ content: process.argv[1] }))' "$MSG")
          curl -sS -H 'Content-Type: application/json' -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" || true

      - name: Open WR on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[WR] Release banner automation failed — ${{ github.repository }}" \
            --body "release-banner-social workflow failed (run ${{ github.run_id }}). Human review required. Labels intent: work-request, needs-human, automation, formal:auto-wr." \
            --label "work-request" --label "needs-human" --label "auto-error" || true
