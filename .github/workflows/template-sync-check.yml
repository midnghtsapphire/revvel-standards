name: Template Sync Check

# Ensures `.github/ISSUE_TEMPLATE/` (active) and `templates/issue-template/`
# (portable) stay identical for the canonical WR template. Triggered on any
# push that touches either location.
#
# DEVIN-RESTRUCTURE 2026-05-05 (PR #13338): the canonical filename moved from
# `issue.yml` to `00-devin-work-request.yml` so the WR form sorts first in the
# New Issue chooser. The legacy `issue.yml` mirror was deleted at the same
# time.

on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/00-devin-work-request.yml'
      - '.github/ISSUE_TEMPLATE/config.yml'
      - 'templates/issue-template/00-devin-work-request.yml'
      - 'templates/issue-template/config.yml'
  push:
    branches:
      - main
    paths:
      - '.github/ISSUE_TEMPLATE/00-devin-work-request.yml'
      - '.github/ISSUE_TEMPLATE/config.yml'
      - 'templates/issue-template/00-devin-work-request.yml'
      - 'templates/issue-template/config.yml'

permissions:
  contents: read

jobs:
  check-sync:
    name: Verify template files are in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare 00-devin-work-request.yml files
        run: |
          echo "Comparing .github/ISSUE_TEMPLATE/00-devin-work-request.yml with templates/issue-template/00-devin-work-request.yml..."
          if ! diff -u .github/ISSUE_TEMPLATE/00-devin-work-request.yml templates/issue-template/00-devin-work-request.yml; then
            echo "❌ ERROR: 00-devin-work-request.yml files are out of sync!"
            echo ""
            echo "The active template (.github/ISSUE_TEMPLATE/00-devin-work-request.yml) and the portable"
            echo "copy (templates/issue-template/00-devin-work-request.yml) must be identical."
            echo ""
            echo "To fix: Copy the desired version to both locations and commit both files."
            exit 1
          else
            echo "✅ 00-devin-work-request.yml files are in sync"
          fi

      - name: Compare config.yml files
        run: |
          echo "Comparing .github/ISSUE_TEMPLATE/config.yml with templates/issue-template/config.yml..."
          if ! diff -u .github/ISSUE_TEMPLATE/config.yml templates/issue-template/config.yml; then
            echo "❌ ERROR: config.yml files are out of sync!"
            echo ""
            echo "The active config (.github/ISSUE_TEMPLATE/config.yml) and the portable"
            echo "copy (templates/issue-template/config.yml) must be identical."
            echo ""
            echo "To fix: Copy the desired version to both locations and commit both files."
            exit 1
          else
            echo "✅ config.yml files are in sync"
          fi

      - name: Success
        run: |
          echo "✅ All template files are in sync!"
          echo ""
          echo "Active templates:"
          echo "  - .github/ISSUE_TEMPLATE/00-devin-work-request.yml"
          echo "  - .github/ISSUE_TEMPLATE/config.yml"
          echo ""
          echo "Portable copies (for installing in other repos):"
          echo "  - templates/issue-template/00-devin-work-request.yml"
          echo "  - templates/issue-template/config.yml"
