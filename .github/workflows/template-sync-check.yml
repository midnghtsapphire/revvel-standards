name: Template Sync Check
on:
  pull_request:
    paths:
      - .github/ISSUE_TEMPLATE/00-work-request.yml
      - .github/ISSUE_TEMPLATE/10-openhands-system-wr.yml
      - .github/ISSUE_TEMPLATE/config.yml
      - templates/issue-template/00-work-request.yml
      - templates/issue-template/10-openhands-system-wr.yml
      - templates/issue-template/config.yml
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/00-work-request.yml
      - .github/ISSUE_TEMPLATE/10-openhands-system-wr.yml
      - .github/ISSUE_TEMPLATE/config.yml
      - templates/issue-template/00-work-request.yml
      - templates/issue-template/10-openhands-system-wr.yml
      - templates/issue-template/config.yml
permissions:
  contents: read
jobs:
  check-sync:
    name: Verify template files are in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compare 00-work-request.yml files
        run: |
          echo "Comparing .github/ISSUE_TEMPLATE/00-work-request.yml with templates/issue-template/00-work-request.yml..."
          if ! diff -u .github/ISSUE_TEMPLATE/00-work-request.yml templates/issue-template/00-work-request.yml; then
            echo "ERROR: 00-work-request.yml files are out of sync!"
            echo ""
            echo "The active template (.github/ISSUE_TEMPLATE/00-work-request.yml) and the portable"
            echo "copy (templates/issue-template/00-work-request.yml) must be identical."
            echo ""
            echo "To fix: Copy the desired version to both locations and commit both files."
            exit 1
          else
            echo "00-work-request.yml files are in sync"
          fi
      - name: Compare 10-openhands-system-wr.yml files
        run: |
          echo "Comparing .github/ISSUE_TEMPLATE/10-openhands-system-wr.yml with templates/issue-template/10-openhands-system-wr.yml..."
          if ! diff -u .github/ISSUE_TEMPLATE/10-openhands-system-wr.yml templates/issue-template/10-openhands-system-wr.yml; then
            echo "ERROR: 10-openhands-system-wr.yml files are out of sync!"
            echo ""
            echo "The active template (.github/ISSUE_TEMPLATE/10-openhands-system-wr.yml) and the portable"
            echo "copy (templates/issue-template/10-openhands-system-wr.yml) must be identical."
            echo ""
            echo "To fix: Copy the desired version to both locations and commit both files."
            exit 1
          else
            echo "10-openhands-system-wr.yml files are in sync"
          fi
      - name: Compare config.yml files
        run: |
          echo "Comparing .github/ISSUE_TEMPLATE/config.yml with templates/issue-template/config.yml..."
          if ! diff -u .github/ISSUE_TEMPLATE/config.yml templates/issue-template/config.yml; then
            echo "ERROR: config.yml files are out of sync!"
            echo ""
            echo "The active config (.github/ISSUE_TEMPLATE/config.yml) and the portable"
            echo "copy (templates/issue-template/config.yml) must be identical."
            echo ""
            echo "To fix: Copy the desired version to both locations and commit both files."
            exit 1
          else
            echo "config.yml files are in sync"
          fi
      - name: Success
        run: |
          echo "All template files are in sync!"
          echo ""
          echo "Active templates:"
          echo "  - .github/ISSUE_TEMPLATE/00-work-request.yml      (primary human form)"
          echo "  - .github/ISSUE_TEMPLATE/10-openhands-system-wr.yml   (lightweight system form)"
          echo "  - .github/ISSUE_TEMPLATE/config.yml"
          echo ""
          echo "Portable copies (for installing in other repos):"
          echo "  - templates/issue-template/00-work-request.yml"
          echo "  - templates/issue-template/10-openhands-system-wr.yml"
          echo "  - templates/issue-template/config.yml"
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
