name: Template Sync Check

# Ensures `.github/ISSUE_TEMPLATE/` (active) and `templates/issue-template/`
# (portable) stay identical. Triggered on any push that touches either location.

on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/issue.yml'
      - '.github/ISSUE_TEMPLATE/config.yml'
      - 'templates/issue-template/issue.yml'
      - 'templates/issue-template/config.yml'
  push:
    branches:
      - main
    paths:
      - '.github/ISSUE_TEMPLATE/issue.yml'
      - '.github/ISSUE_TEMPLATE/config.yml'
      - 'templates/issue-template/issue.yml'
      - 'templates/issue-template/config.yml'

permissions:
  contents: read

jobs:
  check-sync:
    name: Verify template files are in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare issue.yml files
        run: |
          echo "Comparing .github/ISSUE_TEMPLATE/issue.yml with templates/issue-template/issue.yml..."
          if ! diff -u .github/ISSUE_TEMPLATE/issue.yml templates/issue-template/issue.yml; then
            echo "❌ ERROR: issue.yml files are out of sync!"
            echo ""
            echo "The active template (.github/ISSUE_TEMPLATE/issue.yml) and the portable"
            echo "copy (templates/issue-template/issue.yml) must be identical."
            echo ""
            echo "To fix: Copy the desired version to both locations and commit both files."
            exit 1
          else
            echo "✅ issue.yml files are in sync"
          fi

      - name: Compare config.yml files
        run: |
          echo "Comparing .github/ISSUE_TEMPLATE/config.yml with templates/issue-template/config.yml..."
          if ! diff -u .github/ISSUE_TEMPLATE/config.yml templates/issue-template/config.yml; then
            echo "❌ ERROR: config.yml files are out of sync!"
            echo ""
            echo "The active config (.github/ISSUE_TEMPLATE/config.yml) and the portable"
            echo "copy (templates/issue-template/config.yml) must be identical."
            echo ""
            echo "To fix: Copy the desired version to both locations and commit both files."
            exit 1
          else
            echo "✅ config.yml files are in sync"
          fi

      - name: Success
        run: |
          echo "✅ All template files are in sync!"
          echo ""
          echo "Active templates:"
          echo "  - .github/ISSUE_TEMPLATE/issue.yml"
          echo "  - .github/ISSUE_TEMPLATE/config.yml"
          echo ""
          echo "Portable copies (for installing in other repos):"
          echo "  - templates/issue-template/issue.yml"
          echo "  - templates/issue-template/config.yml"
