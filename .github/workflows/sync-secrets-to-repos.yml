# Secrets Sync Workflow
# Syncs secrets from revvel-standards to other repos
name: Sync Secrets To...
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repo (owner/repo)'
        required: true
        type: string
      target_env:
        description: 'Target environment (dev/staging/prod)'
        required: false
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
permissions:
  contents: write
  issues: write
jobs:
  sync:
    name: Sync secrets to ${{ github.event.inputs.target_repo }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Fetch secrets from source
        run: |
          cd source
          echo "Fetching secrets from ${{ github.repository }}..."
          doppler secrets --plain > /tmp/source-secrets.txt
          cat /tmp/source-secrets.txt | grep -v '^#' > /tmp/secrets-clean.txt

      - name: Create PR on target repo
    env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Create branch and PR
          git clone https://$GH_TOKEN@github.com/${{ github.event.inputs.target_repo}}.git target
          cd target
          
          # Update .env.example from source
          sed 's/^/# /' /tmp/secrets-clean.txt > .env.example
          
          git checkout -b secrets-sync-$(date +%Y%m%d)
          git add .env.example
          git commit -m "sync: Update .env.example from revvel-standards"
          git push origin secrets-sync-$(date +%Y%m%d)
          
          # Create PR
          gh pr create \
            --title "sync: Update .env.example from revvel-standards" \
            --body "Automated secrets sync from revvel-standards. See source at $(echo $GITHUB_SHA | cut -c1-7)" \
            --base main

      - name: Comment on issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue }},
              body: '❌ Secrets sync failed. See workflow logs for details.'
            })
    timeout-minutes: 30