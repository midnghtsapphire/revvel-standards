# VEINS grounding gate (CuP = 100%): this check used to be an LLM vibe-scan of
# the diff that never ran the test suite and said "PASS — Ready to ship" over a
# broken pipeline for weeks (2026-07-08 incident; predicted by the owner's
# V.E.I.N.S. research as "Speculative Hallucination & Rule-Poisoning").
# The verdict now CONSUMES the real `npm test` result via
# scripts/ship-quality-verdict.js: a red suite is a hard FAIL, and an LLM
# opinion may WARN or BLOCK but can never establish a PASS on its own.
name: Intelligent Code Quality Scanner
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
permissions:
  contents: read
  pull-requests: write
# Serialize per PR and cancel superseded runs so a burst of edits/synchronize
# events doesn't post the "Ship Quality Check" review three times over.
concurrency:
  group: ship-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  scan:
    name: Ship Quality Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Grounding gate — run the REAL test suite. This is the stalk the verdict
      # is glued from; the LLM opinion below can only downgrade its result.
      - name: Grounding gate — run real test suite
        id: suite
        run: |
          npm ci --no-audit --no-fund
          if npm test; then
            echo "tests=pass" >> "$GITHUB_OUTPUT"
          else
            echo "tests=fail" >> "$GITHUB_OUTPUT"
          fi
      - name: Get diff
        id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff "origin/$BASE_REF"..HEAD -- '*.py' '*.js' '*.ts' '*.md' \
            | head -5000 > "$RUNNER_TEMP/pr-diff.txt"
          echo "diff_length=$(wc -c < "$RUNNER_TEMP/pr-diff.txt")" >> "$GITHUB_OUTPUT"
      - name: Analyze with AI
        # Spend gate (#17850): this bills OpenRouter. Runs only when the repository
        # variable REVVEL_LLM_ALLOW_CLOUD is set to "1". Unset = skip, so an idle
        # repo cannot spend. See docs/LOCAL_LLM_SETUP.md.
        if: (env.OPENROUTER_API_KEY != '' && steps.diff.outputs.diff_length > 0) && vars.REVVEL_LLM_ALLOW_CLOUD == '1'
        # Advisory only — this step's own prompt says "PASS is advisory only;
        # the real test suite gates the final verdict". So its *outage* must
        # not gate either. Without this, an OpenRouter error or an out-of-
        # credits response aborted the job before the verdict step ran, the
        # verdict output arrived empty, and the reviewer was told the grounding
        # gate had failed while npm test was green.
        continue-on-error: true
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Build the request with jq so the untrusted PR diff is JSON-escaped
          # (log-poisoning protection, S-MOS §4: never shell-interpolate
          # instruction-shaped strings from PR content).
          SYSTEM_PROMPT='You are a code quality reviewer. Analyze PR changes for:
          1. Real TODOs/FIXMEs that are incomplete code
          2. Placeholder code that needs implementation
          3. Phased implementation language in code

          IGNORE:
          - Documentation explaining rules (like AGENTS.md)
          - README and docs files
          - Comments about what NOT to do

          Respond with:
          - BLOCK only if there are real incomplete code TODOs
          - WARN for minor issues
          - PASS if code is ship-ready (note: PASS is advisory only; the real test suite gates the final verdict)

          Format: VERDICT: BLOCK|WARN|PASS
          Reason: one line exactly why'

          PAYLOAD=$(jq -n \
            --arg system "$SYSTEM_PROMPT" \
            --rawfile diff "$RUNNER_TEMP/pr-diff.txt" \
            '{model: "anthropic/claude-3.7-sonnet", messages: [
              {role: "system", content: $system},
              {role: "user", content: ("Here are the PR changes to review:\n\n" + $diff)}
            ]}')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Referer: https://github.com" \
            -d "$PAYLOAD" | jq -r '.choices[0].message.content')

          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"

          if echo "$RESPONSE" | grep -q "BLOCK"; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
          elif echo "$RESPONSE" | grep -q "WARN"; then
            echo "result=warn" >> "$GITHUB_OUTPUT"
          else
            echo "result=pass" >> "$GITHUB_OUTPUT"
          fi
      # Combine grounded suite result + AI opinion. The combiner enforces:
      # tests fail => FAIL always; no suite result => at most WARN; the LLM can
      # never upgrade to PASS. Seeded-test coverage: tests/ship-quality-verdict.test.js
      - name: Grounded verdict
        # Always compute a verdict once the suite has spoken. A skipped verdict
        # step is indistinguishable downstream from a BLOCK verdict, because
        # both leave steps.verdict.outputs.final empty — which is how an
        # unrelated step failure came to be reported as a red grounding gate.
        if: always()
        id: verdict
        env:
          TESTS_RESULT: ${{ steps.suite.outputs.tests }}
          AI_RESULT: ${{ steps.ai.outputs.result }}
        run: node scripts/ship-quality-verdict.js --tests "$TESTS_RESULT" --ai "$AI_RESULT"
      - name: Report
        if: always()
        env:
          RESULT: ${{ steps.verdict.outputs.final }}
          TESTS_RESULT: ${{ steps.suite.outputs.tests }}
        run: |
          echo "## 🧠 Intelligent Code Quality Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Grounding gate (\`npm test\`): **${TESTS_RESULT:-not run}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RESULT" = "pass" ]; then
            echo "✅ **PASS** - Test suite green and code is ship-ready" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RESULT" = "warn" ]; then
            echo "⚠️ **WARN** - Minor issues noted, merge allowed" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$RESULT" ]; then
            # No verdict at all is a different fact from a BLOCK verdict, and
            # saying "grounding gate red" here would assert something never
            # established (CLAUDE.md gotcha 6). Fail, but name the real cause.
            echo "❌ **ERROR** - No verdict was produced; a step before the verdict failed. The grounding gate reported: \`${TESTS_RESULT:-not run}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "❌ **BLOCK** - Grounding gate red or real scaffolding found" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Post as PR review
        if: always()
        env:
          RESULT: ${{ steps.verdict.outputs.final }}
          TESTS_RESULT: ${{ steps.suite.outputs.tests }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY="## Ship Quality Check"
          BODY="$BODY\n\nGrounding gate (\`npm test\`): **${TESTS_RESULT:-not run}**"

          if [ "$RESULT" = "pass" ]; then
            BODY="$BODY\n\n✅ **PASS** - Test suite green, ready to ship"
          elif [ "$RESULT" = "warn" ]; then
            BODY="$BODY\n\n⚠️ Warnings noted - merge allowed"
          elif [ -z "$RESULT" ]; then
            BODY="$BODY\n\n❌ No verdict produced — a step before the verdict failed (the AI analyzer is the usual cause and is advisory only). This is **not** a statement about the test suite; the grounding gate above reports its own result."
          else
            BODY="$BODY\n\n❌ Grounding gate failed - the real test suite (or a compile gate) is red. An LLM opinion cannot PASS over it."
          fi

          # This step reports the verdict; it does not decide it. The step
          # above already exits 1 on BLOCK, so a failure to *post* must never
          # turn a green gate red — on 2026-08-17 this job reported failure on
          # PR #17699 with RESULT=pass and TESTS_RESULT=pass, because a single
          # unretried `gh pr review` hit HTTP 503 from the GraphQL API and
          # `bash -e` killed the job. That is CLAUDE.md gotcha 6 inverted: the
          # exit code tracked whether a comment posted rather than whether the
          # gate held. It is also gotcha 2 — a bare API call with no retry.
          for attempt in 1 2 3; do
            if gh pr review --body "$BODY" --comment "$PR_NUMBER"; then
              exit 0
            fi
            echo "::warning::gh pr review failed (attempt $attempt/3); retrying"
            sleep $((attempt * 5))
          done

          # Still failing after retries: say so loudly, but leave the verdict
          # to the step that computed it. The step summary already carries the
          # full result, so the outcome is not lost.
          echo "::warning::Could not post the Ship Quality verdict to PR #${PR_NUMBER} after 3 attempts. Verdict was: ${RESULT:-unknown} (tests: ${TESTS_RESULT:-not run}). See the step summary."
    timeout-minutes: 30
