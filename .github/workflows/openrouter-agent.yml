name: OpenRouter Agent

# CANNOT reach LM Studio from this job. runs-on is ubuntu-latest (GitHub-hosted
# Azure VM). http://127.0.0.1:1234 and http://localhost:1234 here are the
# runner, not Audrey's laptop. Do not wire a localhost fallback in this YAML —
# it would always fail and look like a working fallback. Do not set
# REVVEL_LLM_ALLOW_CLOUD=1 in this job's env. The spend gate on the API step
# stays required until a runner that can actually see LM Studio exists. The
# Python script falls back to LM Studio only on a local CLI or a future
# self-hosted runner.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  openrouter-agent:
    name: Respond via OpenRouter
    runs-on: ubuntu-latest
    timeout-minutes: 60

    if: |
      github.event.sender.type != 'Bot' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@openrouter-agent')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@openrouter-agent')) ||
      (github.event_name == 'issues' && github.event.action == 'opened'))

    steps:
      - name: Checkout
        if: vars.REVVEL_LLM_ALLOW_CLOUD == '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: vars.REVVEL_LLM_ALLOW_CLOUD == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run OpenRouter agent
        # Spend gate (#17850): this step bills OpenRouter when the script takes
        # the cloud lane. It runs only when the repository variable
        # REVVEL_LLM_ALLOW_CLOUD is set to "1". Unset = skip. This job does
        # NOT set that variable in env, and it does NOT probe localhost:1234 —
        # ubuntu-latest cannot see the laptop LM Studio. See docs/LOCAL_LLM_SETUP.md.
        if: vars.REVVEL_LLM_ALLOW_CLOUD == '1'
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python .github/scripts/openrouter_agent.py

      - name: Post reply as comment
        if: ${{ always() && steps.ai.outputs.reply != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLY: ${{ steps.ai.outputs.reply }}
          LANE: ${{ steps.ai.outputs.lane }}
          MODEL: ${{ steps.ai.outputs.model }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          BODY=$(jq -n --arg body "> 🤖 **OpenRouter Agent**

          $REPLY

          ---
          *Powered by [OpenRouter](https://openrouter.ai) · lane: \`$LANE\` · model: \`$MODEL\`*" \
            '{ body: $body }')

          gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            --method POST \
            --input - <<< "$BODY"
