name: API Rate Limit Handler

on:
  workflow_run:
    types: [completed]
    workflows: ["*"]
  # Can also be called manually
  workflow_dispatch:
    inputs:
      failed_workflow:
        required: true
      error_message:
        required: true
      agent_used:
        required: true

jobs:
  handle-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      actions: write
      contents: read
    steps:
      - name: Check if rate limited
        id: check
        env:
          ERROR_MESSAGE: ${{ inputs.error_message }}
        run: |
          if [[ "$ERROR_MESSAGE" == *"rate"*limit* ]]; then
            echo "is_rate_limit=true" >> $GITHUB_OUTPUT
          else
            echo "is_rate_limit=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create WR if rate limited
        if: steps.check.outputs.is_rate_limit == 'true'
        env:
          FAILED_WORKFLOW: ${{ inputs.failed_workflow }}
          AGENT_USED: ${{ inputs.agent_used }}
          ERROR_MESSAGE: ${{ inputs.error_message }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          REPO: ${{ github.repository }}
        run: |
          # Prevent duplicate - check if WR already exists for this workflow
          EXISTING=$(gh search issues --repo "$REPO" \
            --state open --json number,title 2>/dev/null | \
            jq -r --arg failed "$FAILED_WORKFLOW" --arg rate "API rate limit" \
            '.[] | select(.title as $title | ($title | index($failed) and $title | index($rate))) | .number' | head -1 || echo "")
          
          if [[ -z "$EXISTING" ]]; then
            BODY=$(cat <<EOF
## Rate Limit Hit

**Failed Workflow:** $FAILED_WORKFLOW
**Agent:** $AGENT_USED
**Error:** $ERROR_MESSAGE
**When:** $RUN_STARTED_AT

## Required Action
- [ ] Re-run with different agent (OpenRouter fallback)
- [ ] Or wait and re-run later

## Label
/label automation-failure,rate-limit-failure
EOF
)
            gh issue create \
              --title "[RATE LIMIT] $FAILED_WORKFLOW - API rate limit hit" \
              --body "$BODY" \
              --label "automation-failure,needs-human"
          else
            echo "Duplicate WR #${EXISTING} already exists"
          fi
      
      - name: Trigger fallback agent
        if: steps.check.outputs.is_rate_limit == 'true'
        env:
          AGENT_USED: ${{ inputs.agent_used }}
        run: |
          # Trigger OpenRouter fallback workflow
          gh workflow run openrouter-coder.yml \
            -f issue_number="${{ github.event.workflow_run.pull_requests[0].number || 0 }}" \
            -f fallback_reason="rate_limit_from_${AGENT_USED}"
