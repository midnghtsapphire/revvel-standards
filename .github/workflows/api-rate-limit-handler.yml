name: API Rate Limit Handler

# IMPORTANT: This workflow is invoked ON DEMAND only.
# It used to listen on `workflow_run: workflows: ["*"]`, which fired on the
# completion of EVERY workflow in the repo. Because it then dispatches another
# workflow (openrouter-coder.yml), that completion re-triggered this handler,
# creating a self-amplifying loop across the whole fleet. The catch-all
# trigger has been removed — call this via workflow_dispatch (or
# `gh workflow run api-rate-limit-handler.yml`) when a rate limit is detected.
on:
  workflow_dispatch:
    inputs:
      failed_workflow:
        description: Name of the workflow that hit the rate limit
        required: true
      error_message:
        description: The error message (used to confirm it was a rate limit)
        required: true
      agent_used:
        description: The agent/model that was rate limited
        required: true

permissions:
  contents: read
  issues: write
  actions: write
env:
  # This workflow has no checkout, so gh cannot infer the repo from a git
  # remote; set it explicitly or gh issue/workflow calls fail with
  # "not a git repository" (CLAUDE.md gotcha #1).
  GH_REPO: ${{ github.repository }}
jobs:
  handle-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check if rate limited
        env:
          ERROR_MESSAGE: ${{ github.event.inputs.error_message }}
        id: check
        run: |
          if [[ "${ERROR_MESSAGE}" == *"rate"*limit* ]]; then
            echo "is_rate_limit=true" >> $GITHUB_OUTPUT
          else
            echo "is_rate_limit=false" >> $GITHUB_OUTPUT
          fi

      - name: Create WR if rate limited
        if: steps.check.outputs.is_rate_limit == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Prevent duplicate - check if WR already exists for this workflow
          EXISTING=$(gh search issues --repo ${{ github.repository }} \
            --state open --json number \
            -q ".[] | select(.title | contains(\"${{ inputs.failed_workflow }}\") and contains(title, \"API rate limit\")) | .number" 2>/dev/null || echo "")

          if [[ -z "$EXISTING" ]]; then
            cat > rate_limit_body.md <<'EOF'
          ## Rate Limit Hit

          **Failed Workflow:** ${{ inputs.failed_workflow }}
          **Agent:** ${{ inputs.agent_used }}
          **Error:** ${{ inputs.error_message }}

          ## Required Action
          - [ ] Re-run with different agent (OpenRouter fallback)
          - [ ] Or wait and re-run later
          EOF

            gh issue create \
              --title "[RATE LIMIT] ${{ inputs.failed_workflow }} - API rate limit hit" \
              --body-file rate_limit_body.md \
              --label "automation-failure,needs-human"
          else
            echo "Duplicate WR #${EXISTING} already exists"
          fi

      - name: Trigger fallback agent
        if: steps.check.outputs.is_rate_limit == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Trigger OpenRouter fallback workflow
          gh workflow run openrouter-coder.yml \
            -f issue_number="0" \
            -f fallback_reason="rate_limit_from_${{ inputs.agent_used }}"
