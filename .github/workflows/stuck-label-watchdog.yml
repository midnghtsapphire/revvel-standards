name: Stuck Label Watchdog
on:
  workflow_dispatch: null
permissions:
  pull-requests: write
  issues: write
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const now = new Date();
            const HOUR = 3600000;
            const DAY = 86400000;
            const AGENT_REPAIR_LABELS = ['agent-fallback', 'auto-fix', 'openrouter', 'role:orchestrator', 'bug'];
            let routingLabelSet;
            let openAgentRepairIssues;

            async function ensureRoutingLabelsExist(labels) {
              const palette = {
                'agent-fallback': { color: '6f42c1', description: 'Route issue to the agent fallback chain' },
                'auto-fix': { color: '0075ca', description: 'Created by auto-fix / Ralph Loop workflow' },
                'openrouter': { color: '6f42c1', description: 'Routed to the OpenRouter orchestrator (first line of sight)' },
                'role:orchestrator': { color: '6f42c1', description: 'OpenRouter agent is acting as orchestrator on this item' },
                'bug': { color: 'd73a4a', description: 'Something is broken' },
              };
              if (!routingLabelSet) {
                try {
                  const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
                  routingLabelSet = new Set(repoLabels.map(l => l.name));
                } catch (e) {
                  const rateLimited = e?.status === 403 && /rate limit/i.test(e?.message || '');
                  core.warning(`listLabelsForRepo failed${rateLimited ? ' (API rate limit exceeded — degrading gracefully)' : ''}: ${e.message}`);
                  routingLabelSet = new Set();
                }
              }
              for (const label of labels) {
                if (routingLabelSet.has(label) || !palette[label]) continue;
                try {
                  await github.rest.issues.createLabel({ owner, repo, name: label, ...palette[label] });
                  routingLabelSet.add(label);
                  core.info(`Created routing label: ${label}`);
                } catch (e) {
                  if ((e.message || '').toLowerCase().includes('already_exists') || (e.message || '').toLowerCase().includes('already exists')) {
                    routingLabelSet.add(label);
                    continue;
                  }
                  core.warning(`Could not create routing label ${label}: ${e.message}`);
                }
              }
              return labels.filter(label => routingLabelSet.has(label));
            }

            async function openAgentRepairIssue(pr, conflictKey, summary, appliedFix, agentTask) {
              const repairLabels = await ensureRoutingLabelsExist(AGENT_REPAIR_LABELS);
              const marker = `<!-- watchdog-agent-repair:pr-${pr.number}:${conflictKey} -->`;
              if (!openAgentRepairIssues) {
                openAgentRepairIssues = await github.paginate(github.rest.issues.listForRepo, {
                  owner,
                  repo,
                  state: 'open',
                  labels: 'agent-fallback',
                  per_page: 100,
                });
              }
              const existing = openAgentRepairIssues.find(issue => !issue.pull_request && issue.body && issue.body.includes(marker));
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `🔁 **Watchdog repeat:** ${summary} was detected again on PR #${pr.number} at ${now.toISOString()}.\n\nLatest applied fix: ${appliedFix}`,
                });
                return existing;
              }

              const body = [
                marker,
                '## Problem',
                `The Stuck Label Watchdog detected an automation inconsistency on PR #${pr.number}: ${summary}.`,
                '',
                '## Automated repair already applied',
                appliedFix,
                '',
                '## Agent assignment',
                'This issue is labeled `agent-fallback`, `auto-fix`, and `openrouter`, which routes it to the Agent Fallback Handler. The assigned agent should inspect the PR lifecycle/watchdog workflows and patch the root cause if this state can recur.',
                '',
                '## Target PR',
                `- PR: #${pr.number}`,
                `- URL: ${pr.html_url}`,
                `- Head SHA: \`${pr.head.sha}\``,
                `- Author: @${pr.user.login}`,
                '',
                '## Agent task',
                agentTask,
                '',
                '## Acceptance criteria',
                `- The conflicting/stuck label state is corrected on PR #${pr.number}.`,
                '- Any recurring workflow/config cause is patched or documented as already handled.',
                '- The repair is validated with workflow YAML parsing/tests.',
              ].join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title: `[AUTO-FIX] PR #${pr.number} watchdog repair — ${summary}`,
                body,
              });
              if (repairLabels.length > 0) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: repairLabels });
              }
              openAgentRepairIssues.push(issue);
              core.info(`Created agent repair issue #${issue.number} for PR #${pr.number}`);
              return issue;
            }

            async function closeLegacyStaleRepairIssues(prNumber, summary) {
              const title = `[AUTO-FIX] PR #${prNumber} watchdog repair — ${summary}`;
              if (!openAgentRepairIssues) {
                openAgentRepairIssues = await github.paginate(github.rest.issues.listForRepo, {
                  owner,
                  repo,
                  state: 'open',
                  labels: 'agent-fallback',
                  per_page: 100,
                });
              }

              const staleIssues = openAgentRepairIssues.filter(
                issue => !issue.pull_request && issue.title === title
              );
              for (const staleIssue of staleIssues) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: staleIssue.number,
                  body: '✅ This stale-state repair issue is now closed automatically by `stuck-label-watchdog.yml`. The watchdog keeps `lifecycle:stuck` on the PR and avoids opening duplicate stale repair issues.'
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: staleIssue.number,
                  state: 'closed',
                });
              }
              if (staleIssues.length > 0) {
                openAgentRepairIssues = openAgentRepairIssues.filter(
                  issue => !staleIssues.some(staleIssue => staleIssue.number === issue.number)
                );
              }
              return staleIssues.length;
            }

            // ─── SWEEP OPEN PRs ──────────────────────────────────────
            // This runs hourly across every open PR, so an installation
            // rate-limit 403 here must degrade gracefully instead of
            // hard-failing the whole job.
            let pulls = [];
            try {
              const res = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              pulls = res.data;
            } catch (e) {
              const rateLimited = e?.status === 403 && /rate limit/i.test(e?.message || '');
              core.warning(`pulls.list failed${rateLimited ? ' (API rate limit exceeded — degrading gracefully)' : ''}: ${e.message}`);
              pulls = [];
            }

            for (const pr of pulls) {
              const prNumber = pr.number;
              let labels;
              try {
                const res = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: prNumber });
                labels = res.data;
              } catch (e) {
                const rateLimited = e?.status === 403 && /rate limit/i.test(e?.message || '');
                core.warning(`listLabelsOnIssue for PR #${prNumber} failed${rateLimited ? ' (API rate limit exceeded — degrading gracefully)' : ''}: ${e.message}`);
                continue;
              }
              const labelNames = labels.map(l => l.name);
              const updatedAt = new Date(pr.updated_at);
              const age = now - updatedAt;
              let reviews = [];
              try {
                reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                });
              } catch (e) {
                const rateLimited = e?.status === 403 && /rate limit/i.test(e?.message || '');
                core.warning(`pulls.listReviews for PR #${prNumber} failed${rateLimited ? ' (API rate limit exceeded — degrading gracefully)' : ''}: ${e.message}`);
                reviews = [];
              }
              const latestHeadReviewByUser = new Map();
              for (const review of reviews) {
                if (!review.user?.login) continue;
                if (review.state === 'COMMENTED') continue;
                if (review.commit_id !== pr.head.sha) continue;
                const reviewTimestamp = review.submitted_at || review.updated_at;
                if (!reviewTimestamp) continue;
                const existing = latestHeadReviewByUser.get(review.user.login);
                const submittedAt = new Date(reviewTimestamp);
                const existingAt = existing ? new Date(existing.submitted_at || existing.updated_at) : null;
                if (!existing || submittedAt >= existingAt) {
                  latestHeadReviewByUser.set(review.user.login, review);
                }
              }
              const currentHeadReviewStates = Array.from(latestHeadReviewByUser.values()).map(review => review.state);
              const liveApprovedCurrentHead =
                currentHeadReviewStates.includes('APPROVED') &&
                !currentHeadReviewStates.includes('CHANGES_REQUESTED');

              // Fix conflicting labels: approved + needs-action
              if (labelNames.includes('approved') && labelNames.includes('needs-action')) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'needs-action' }).catch((err) => { if (err.status !== 404) throw err; });
                labelNames.splice(labelNames.indexOf('needs-action'), 1);
                if (!labelNames.includes('lifecycle:stuck')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['lifecycle:stuck'] });
                  labelNames.push('lifecycle:stuck');
                }
                const repairIssue = await openAgentRepairIssue(
                  pr,
                  'approved-needs-action',
                  '`approved` + `needs-action` conflict',
                  'Removed `needs-action`; `approved` takes precedence unless a fresh changes-requested review exists.',
                  'Re-read the latest PR reviews and lifecycle workflow events. If `needs-action` can be reintroduced after approval without a changes-requested review, patch that workflow path.'
                );
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                  body: `🔍 **Watchdog:** Detected conflicting labels (\`approved\` + \`needs-action\`). Removed \`needs-action\`. Routed follow-up to agent repair issue #${repairIssue.number}.` });
                continue;
              }

              // Fix conflicting labels: checks-passing + checks-failing — check actual CI
              if (labelNames.includes('checks-passing') && labelNames.includes('checks-failing')) {
                // Query actual CI status to decide which label to keep
                const { data: checkRuns } = await github.rest.checks.listForRef({
                  owner, repo, ref: pr.head.sha, per_page: 100,
                });
                const hasFailure = checkRuns.check_runs.some(r => r.conclusion === 'failure' || r.conclusion === 'timed_out');
                const removeLabel = hasFailure ? 'checks-passing' : 'checks-failing';
                const keepLabel = hasFailure ? 'checks-failing' : 'checks-passing';
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: removeLabel }).catch((err) => { if (err.status !== 404) throw err; });
                labelNames.splice(labelNames.indexOf(removeLabel), 1);
                if (hasFailure) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'ready-to-merge' }).catch((err) => { if (err.status !== 404) throw err; });
                }
                if (!labelNames.includes('lifecycle:stuck')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['lifecycle:stuck'] });
                  labelNames.push('lifecycle:stuck');
                }
                const repairIssue = await openAgentRepairIssue(
                  pr,
                  'checks-passing-checks-failing',
                  '`checks-passing` + `checks-failing` conflict',
                  `Checked actual CI, removed \`${removeLabel}\`, and kept \`${keepLabel}\`.`,
                  'Inspect check-suite/check-run label handlers for stale or racing CI label updates. Patch the handler if it can leave both check labels on one PR.'
                );
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                  body: `🔍 **Watchdog:** Detected conflicting labels (\`checks-passing\` + \`checks-failing\`). Checked actual CI — removed \`${removeLabel}\`, kept \`${keepLabel}\`. Routed follow-up to agent repair issue #${repairIssue.number}.` });
                continue;
              }

              // Fix stale/conflicting review labels when the current head is approved.
              // Approval on the current head SHA supersedes every "waiting for review"
              // signal. Strip the bare `awaiting-review` label AND its known synonyms
              // (`awaiting-approval`, `status:waiting-for-review`) that other workflows
              // apply through a parallel labeling vocabulary; otherwise the conflict
              // silently recurs because only the bare label was cleared.
              const STALE_REVIEW_SYNONYMS = ['awaiting-review', 'awaiting-approval', 'status:waiting-for-review'];
              if (labelNames.includes('awaiting-review') && (labelNames.includes('approved') || liveApprovedCurrentHead)) {
                // Step 1 — always apply the safe, complete repair. An approval on the
                // current head SHA supersedes every "waiting for review" signal, so strip
                // the bare `awaiting-review` label AND its known synonyms
                // (`awaiting-approval`, `status:waiting-for-review`) that the parallel
                // labeling vocabularies of pr-lifecycle / pr-review-status /
                // pr-state-orchestrator apply; otherwise the conflict silently recurs
                // because only the bare label was cleared.
                for (const staleReviewLabel of STALE_REVIEW_SYNONYMS) {
                  if (!labelNames.includes(staleReviewLabel)) continue;
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: staleReviewLabel }).catch((err) => { if (err.status !== 404) throw err; });
                  labelNames.splice(labelNames.indexOf(staleReviewLabel), 1);
                }
                if (!labelNames.includes('approved')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['approved'] });
                  labelNames.push('approved');
                }
                if (labelNames.includes('checks-passing') && !labelNames.includes('ready-to-merge')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['ready-to-merge'] });
                  labelNames.push('ready-to-merge');
                }

                // Step 2 — self-heal quietly, escalate only on real recurrence.
                // This conflict is almost always a transient race between the parallel
                // review-label workflows firing on the same approval, and Step 1 fully
                // heals it. Narrating every hourly self-heal with `lifecycle:stuck`, a
                // new agent-repair issue, and a PR comment is pure noise. So the FIRST
                // self-heal on a given head SHA is silent: we only drop a hidden marker
                // comment to remember we did it. We escalate to an assignable agent
                // repair ONLY if the same conflict returns on the SAME head SHA (no new
                // commit) — that proves a workflow path is actively re-adding the stale
                // label and needs a real code fix rather than another cosmetic sweep.
                const silentRepairMarker = `<!-- watchdog-silent-repair:awaiting-review-approved:${pr.head.sha} -->`;
                const prComments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
                const alreadySilentlyRepaired = prComments.some(c => c.body && c.body.includes(silentRepairMarker));

                if (!alreadySilentlyRepaired) {
                  // First occurrence on this head SHA → silent self-heal. No
                  // `lifecycle:stuck`, no repair issue, no visible comment. Record the
                  // hidden marker so a same-head recurrence is recognizable as a bug.
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: silentRepairMarker });
                  core.info(`Silently self-healed awaiting-review+approved on PR #${prNumber} (head ${pr.head.sha.slice(0, 7)}).`);
                  continue;
                }

                // Recurrence on the same head SHA → escalate for a real fix.
                if (!labelNames.includes('lifecycle:stuck')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['lifecycle:stuck'] });
                  labelNames.push('lifecycle:stuck');
                }
                const repairIssue = await openAgentRepairIssue(
                  pr,
                  'awaiting-review-approved',
                  '`awaiting-review` + `approved` conflict',
                  'Removed `awaiting-review` plus its synonyms (`awaiting-approval`, `status:waiting-for-review`) and restored the approval state from live reviews on the current head SHA; approval takes precedence until new commits invalidate it. This conflict returned on the same head SHA after a prior silent self-heal, so a workflow path is actively re-adding the stale label without a new commit/reopened event.',
                  'Inspect review, auto-approve, and synchronize event paths. If any "waiting for review" label (`awaiting-review`, `awaiting-approval`, `status:waiting-for-review`) can survive or be re-added after approval on the current head without a new commit/reopened event, patch that workflow path.'
                );
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                  body: `🔁 **Watchdog:** The \`awaiting-review\` + \`approved\` conflict returned on the same head SHA after a silent self-heal, so a workflow is actively re-adding the stale review label. Routed follow-up to agent repair issue #${repairIssue.number}.` });
                continue;
              }

              // Fix: ready-to-merge without approved
              if (labelNames.includes('ready-to-merge') && !labelNames.includes('approved')) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'ready-to-merge' }).catch((err) => { if (err.status !== 404) throw err; });
                labelNames.splice(labelNames.indexOf('ready-to-merge'), 1);
                if (!labelNames.includes('lifecycle:stuck')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['lifecycle:stuck'] });
                  labelNames.push('lifecycle:stuck');
                }
                const repairIssue = await openAgentRepairIssue(
                  pr,
                  'ready-to-merge-without-approved',
                  '`ready-to-merge` without `approved`',
                  'Removed `ready-to-merge`; a PR cannot be merge-ready without approval.',
                  'Inspect ready-to-merge promotion paths and ensure they require both approval and passing checks before adding the label.'
                );
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                  body: `🔍 **Watchdog:** PR has \`ready-to-merge\` but is missing \`approved\`. Removed \`ready-to-merge\`. Routed follow-up to agent repair issue #${repairIssue.number}.` });
                continue;
              }

              // awaiting-review for 24h+ → label the PR + comment ON THE PR.
              // No more new "agent repair" ISSUES for time-based stale states —
              // they piled up one-per-PR (#13934/35/36/41 etc.) and just added
              // noise that the agent processor (billing-blocked) never closed.
              // Logical-conflict cases below still file repair issues.
              if (labelNames.includes('awaiting-review') && age > 24 * HOUR) {
                const closedLegacyCount = await closeLegacyStaleRepairIssues(prNumber, '`awaiting-review` for 24+ hours');
                if (!labelNames.includes('lifecycle:stuck')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['lifecycle:stuck'] });
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                    body: `⏰ **Watchdog:** This PR has been \`awaiting-review\` for 24+ hours. Marked \`lifecycle:stuck\`.` });
                } else if (closedLegacyCount > 0) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                    body: `🧹 **Watchdog:** Closed ${closedLegacyCount} duplicate stale auto-fix issue(s) for \`awaiting-review\` and kept this PR marked \`lifecycle:stuck\`.` });
                }
              }

              // checks-failing for 12h+ → label the PR + comment ON THE PR (no new issue).
              if (labelNames.includes('checks-failing') && age > 12 * HOUR) {
                if (!labelNames.includes('lifecycle:stuck')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['lifecycle:stuck'] });
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                    body: `⏰ **Watchdog:** CI has been failing for 12+ hours. Marked \`lifecycle:stuck\`.` });
                }
              }

              // approved + checks-passing but missing ready-to-merge → fix
              if (labelNames.includes('approved') && labelNames.includes('checks-passing') && !labelNames.includes('ready-to-merge')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['ready-to-merge'] });
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                  body: '🔍 **Watchdog:** PR is approved and checks pass but was missing `ready-to-merge`. Fixed.' });
              }

              // Self-healing: clear lifecycle:stuck once the PR recovers.
              // Without this, lifecycle:stuck was only ever added and never
              // removed, leaving PRs marked stuck permanently even after the
              // conflicting/stale condition that triggered it was resolved.
              if (labelNames.includes('lifecycle:stuck')) {
                const stillStuck =
                  (labelNames.includes('approved') && labelNames.includes('needs-action')) ||
                  (labelNames.includes('checks-passing') && labelNames.includes('checks-failing')) ||
                  (labelNames.includes('awaiting-review') && (labelNames.includes('approved') || liveApprovedCurrentHead)) ||
                  (labelNames.includes('ready-to-merge') && !labelNames.includes('approved')) ||
                  (labelNames.includes('awaiting-review') && age > 24 * HOUR) ||
                  (labelNames.includes('checks-failing') && age > 12 * HOUR);
                if (!stillStuck) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'lifecycle:stuck' }).catch((err) => { if (err.status !== 404) throw err; });
                  labelNames.splice(labelNames.indexOf('lifecycle:stuck'), 1);
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber,
                    body: '✅ **Watchdog:** No stuck/conflicting label conditions remain. Removed `lifecycle:stuck`.' });
                }
              }
            }

            // ─── SWEEP OPEN ISSUES ───────────────────────────────────
            let issues = [];
            try {
              const res = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
              issues = res.data;
            } catch (e) {
              const rateLimited = e?.status === 403 && /rate limit/i.test(e?.message || '');
              core.warning(`issues.listForRepo failed${rateLimited ? ' (API rate limit exceeded — degrading gracefully)' : ''}: ${e.message}`);
              issues = [];
            }

            for (const issue of issues) {
              if (issue.pull_request) continue; // skip PRs
              const issueNumber = issue.number;
              const labelNames = issue.labels.map(l => l.name);
              const updatedAt = new Date(issue.updated_at);
              const age = now - updatedAt;

              // triage for 7+ days → mark stale
              if (labelNames.includes('triage') && age > 7 * DAY) {
                if (!labelNames.includes('issue:stale')) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['issue:stale'] });
                  await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber,
                    body: `⏰ **Watchdog:** This issue has been in \`triage\` for 7+ days with no activity. @${issue.user.login} — please classify or close if no longer relevant.` });
                }
              }

              // No lifecycle label at all → add triage
              const lifecycleLabels = ['triage', 'issue:in-progress', 'issue:done', 'issue:stale', 'blocked', 'in-review'];
              const typeLabels = ['bug', 'enhancement', 'documentation', 'security', 'design', 'dependencies', 'wontfix'];
              const hasLifecycle = labelNames.some(l => lifecycleLabels.includes(l));
              const hasType = labelNames.some(l => typeLabels.includes(l));
              if (!hasLifecycle && !hasType) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['triage'] });
              }
            }

            core.info('Watchdog sweep complete.');
    timeout-minutes: 45
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
