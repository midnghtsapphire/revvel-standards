name: migration-cron
on:
  schedule:
    - cron: 0 13 * * *
  workflow_dispatch: null
permissions:
  contents: read
  issues: read
  pull-requests: write
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - name: Quiet Mode gate
        id: quiet
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const active = issues.some(i => i.title.trim().toLowerCase() === 'exit-quiet-mode');
            core.setOutput('active', active ? 'true' : 'false');
      - name: Quiet Mode active; skipping
        if: steps.quiet.outputs.active != 'true'
        run: echo "Quiet Mode active; skipping"
      - name: Placeholder migration action
        if: steps.quiet.outputs.active == 'true'
        run: |
          echo "Quiet Mode exit signal detected."
          echo "TODO: Read inventory/migration-manifest.md and select next repo by tier."
          echo "TODO: Open a draft PR with migration dry-run details only."
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
