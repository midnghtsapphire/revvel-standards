# ═══════════════════════════════════════════════════════════════════════════════
# ANTI-SCAFFOLDING ENFORCER
# Who: Audrey Evans (midnghtsapphire)
# When: 2026-06-01
# Why: Fixed false positives — now scans only ADDED lines in the diff, not entire files.
#      Previously, touching a file caused the entire file to be scanned, flagging pre-existing
#      code that the PR author didn't write.
# What: Replaced whole-file grep with git-diff-based scanning of added lines only.
# NOTE: Workflow is kept active - owner PRs are still exempt
# ═══════════════════════════════════════════════════════════════════════════════════════


# Prevents PRs with scaffolding language from being merged
# Enforces the Prime Directive: Ship working code, not plans

name: Anti-Scaffolding Enforcer

# ═══════════════════════════════════════════════════════════════════════
# FALSE POSITIVE EXCLUSIONS (permanent list - update this when new ones found)
# - placeholder= (HTML form attributes)
# - ::placeholder (CSS pseudo-element)
# - placeholder values/attributes
# - alt="placeholder" (image alt text)
# - Search projects (UI placeholder text)
# - workflow name exclusion (prevents self-check)
# ═══════════════════════════════════════════════════════════════════════

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Emergency override - set to "true" to allow all PRs (e.g., when check has false positives)
  ALLOW_SCAFFOLDING_CHECK_FAIL: ${{ vars.ALLOW_SCAFFOLDING_CHECK_FAIL || 'false' }}

jobs:
  check-for-scaffolding:
    # Owner (@midnghtsapphire) writes WRs quickly off the top of their head — never block or scan them.
    # Scaffolding checks apply only to non-owner contributors and automated PRs.
    # Note: this checks the PR author (the account that opened the PR). Commits pushed by the owner
    # to someone else's PR are still governed by that PR's author check — which is the intended behavior.
    if: github.event.pull_request.user.login != 'midnghtsapphire'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan for scaffolding language
        id: scan
        run: |
          echo "🔍 Scanning ADDED lines only (not entire files) for scaffolding language..."
          
          git fetch origin ${{ github.event.pull_request.base.ref }}
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          
          # Extract only ADDED lines from the diff for code files (skip docs/config/lockfiles).
          # Format: "filename:line_content" so we can report which file triggered it.
          ADDED_LINES=$(git diff "$BASE"..HEAD --unified=0 --diff-filter=ACMR -- \
            '*.js' '*.ts' '*.jsx' '*.tsx' '*.py' \
            ':!*.json' ':!*.lock' ':!*.yaml' ':!*.yml' ':!*.md' \
            | awk '
              /^--- /{ next }
              /^\+\+\+ b\//{ file=substr($0,7); next }
              /^\+[^+]/{ print file ":" substr($0,2) }
            ')
          
          if [ -z "$ADDED_LINES" ]; then
            echo "✅ No code lines added — nothing to scan"
            echo "violations=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Write violations to a temp file to avoid subshell array-mutation bugs.
          VFILE=$(mktemp)
          
          # TODO without issue reference
          echo "$ADDED_LINES" | grep "TODO" | grep -v "TODO: See issue #" | grep -v "github.com.*issues" \
            | while IFS=: read -r f line; do echo "$f: Added line contains TODO without issue reference"; done >> "$VFILE"
          
          # FIXME
          echo "$ADDED_LINES" | grep "FIXME" \
            | while IFS=: read -r f line; do echo "$f: Added line contains FIXME"; done >> "$VFILE"
          
          # "scaffold" (exclude anti-scaffolding workflow references)
          echo "$ADDED_LINES" | grep -i "scaffold" | grep -v "scaffolding tools like npm init" | grep -v "anti-scaffolding" | grep -v "Anti-Scaffolding" \
            | while IFS=: read -r f line; do echo "$f: Added line contains 'scaffold' — ship complete code"; done >> "$VFILE"
          
          # "placeholder" (exclude valid HTML/CSS uses)
          echo "$ADDED_LINES" | grep -i "placeholder" | grep -v "placeholder=" | grep -v "::placeholder" | grep -v 'placeholder values' | grep -v 'alt="placeholder"' | grep -v 'Search projects' \
            | while IFS=: read -r f line; do echo "$f: Added line contains 'placeholder' — implement complete functionality"; done >> "$VFILE"
          
          # "// TODO: implement"
          echo "$ADDED_LINES" | grep "// TODO: implement" \
            | while IFS=: read -r f line; do echo "$f: Added line contains '// TODO: implement'"; done >> "$VFILE"
          
          # Phased implementation language
          echo "$ADDED_LINES" | grep -i "phase 1\|phase 2\|mvp first\|coming soon\|not yet implemented" \
            | while IFS=: read -r f line; do echo "$f: Added line contains phased implementation language"; done >> "$VFILE"
          
          # Output results
          VCOUNT=$(wc -l < "$VFILE" | tr -d ' ')
          if [ "$VCOUNT" -eq 0 ]; then
            echo "✅ No scaffolding language detected in added lines"
            echo "violations=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Found $VCOUNT violations in newly added code:"
            cat "$VFILE"
            echo "violations=true" >> $GITHUB_OUTPUT
            
            echo "VIOLATIONS<<EOF" >> $GITHUB_ENV
            cat "$VFILE" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
          rm -f "$VFILE"

      - name: Check PR title and description
        id: check_pr
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || '';
            
            const violations = [];
            
            // Strip workflow self-references and [WIP] (Copilot-prefixed PRs).
            // GitHub Draft PRs are identified by pull_request.draft, not the title —
            // keep 'draft' flaggable since it signals incomplete work.
            const titleLower = title.toLowerCase()
              .replace(/check-for-scaffolding/gi, '')
              .replace(/anti-scaffolding/gi, '')
              .replace(/\[wip\]/gi, '');       // Copilot often prefixes with [WIP]
            if (titleLower.includes('scaffold') || titleLower.includes('initial stub') || titleLower.includes('draft')) {
              violations.push('PR title contains scaffolding language: ' + title);
            }
            
            // Check body for concerning patterns
            const bodyLower = body.toLowerCase();
            const concerningPhrases = [
              'will implement later',
              'coming soon',
              'phase 1',
              'mvp first',
              'initial scaffold',
              'placeholder for',
              'stub implementation',
              'not yet implemented'
            ];
            
            for (const phrase of concerningPhrases) {
              if (bodyLower.includes(phrase)) {
                violations.push(`PR description contains: "${phrase}" - deliver complete work`);
              }
            }
            
            if (violations.length > 0) {
              core.setOutput('pr_violations', 'true');
              core.exportVariable('PR_VIOLATIONS', violations.join('\n'));
              console.log('PR violations found:');
              violations.forEach(v => console.log(v));
            } else {
              core.setOutput('pr_violations', 'false');
              console.log('✅ PR title and description look good');
            }

      - name: Post review comment if violations found
        if: steps.scan.outputs.violations == 'true' || steps.check_pr.outputs.pr_violations == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const violations = process.env.VIOLATIONS || '';
            const prViolations = process.env.PR_VIOLATIONS || '';
            
            const body = [
              '## 🚫 Scaffolding Language Detected',
              '',
              '**The Prime Directive:** Ship working, tested code — not plans, proposals, or scaffolding.',
              '',
              'This PR contains language that suggests incomplete or placeholder implementation:',
              '',
            ];
            
            if (violations) {
              body.push('### Code Violations');
              body.push('```');
              body.push(violations);
              body.push('```');
              body.push('');
            }
            
            if (prViolations) {
              body.push('### PR Metadata Violations');
              body.push('```');
              body.push(prViolations);
              body.push('```');
              body.push('');
            }
            
            body.push('### Required Actions');
            body.push('');
            body.push('Before this PR can be merged:');
            body.push('');
            body.push('1. **Replace TODOs with GitHub issues:** Convert `// TODO` to `// See issue #123`');
            body.push('2. **Implement all functionality:** Remove placeholder/stub code');
            body.push('3. **Complete all features:** No "Phase 1" or "MVP first" - deliver the full solution');
            body.push('4. **Add tests:** All new code must have tests');
            body.push('5. **Verify it works:** Test the functionality end-to-end');
            body.push('');
            body.push('### Why This Matters');
            body.push('');
            body.push('Per `docs/AGENTS.md`:');
            body.push('- "Ship code, not plans" (Prime Directive)');
            body.push('- "Do not create placeholder files with `// TODO: implement`"');
            body.push('- "Do not propose phases. Deliver the complete solution in one pass."');
            body.push('');
            body.push('Per code-quality standards (CodeRabbit + Semgrep):');
            body.push('- "No TODO or FIXME Left in Merged Code"');
            body.push('- "No Placeholder Escalation Labels Without Action"');
            body.push('');
            body.push('---');
            body.push('*This check enforces autonomous, complete implementation. See `.github/workflows/anti-scaffolding-enforcer.yml`*');
            
            // Check if we already posted this comment
            let comments = []; try { const { data } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            }); comments = data; } catch (e) { console.log(`⚠️ error getting comments: ${e.message}`); }
            
            const existingComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('🚫 Scaffolding Language Detected')
            );
            
            const commentBody = body.join('\n');
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              console.log('✅ Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
              console.log('✅ Posted new comment');
            }

      - name: Request changes if violations found
        if: steps.scan.outputs.violations == 'true' || steps.check_pr.outputs.pr_violations == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // Add label to PR
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['scaffolding-detected', 'needs-completion']
            });
            
            console.log('⚠️ PR requires completion before merge');
            core.setOutput('scaffolding-found', 'true');

      - name: Remove label if no violations
        if: steps.scan.outputs.violations == 'false' && steps.check_pr.outputs.pr_violations == 'false'
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'scaffolding-detected'
              });
              console.log('✅ Removed scaffolding-detected label');
            } catch (e) {
              // Label might not exist, that's OK
              console.log('ℹ️ Label not present or already removed');
            }
            
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'needs-completion'
              });
              console.log('✅ Removed needs-completion label');
            } catch (e) {
              console.log('ℹ️ Label not present or already removed');
            }
            
            console.log('✅ PR passes anti-scaffolding checks');

# FALLBACK ON FAILURE:
# If check fails unexpectedly, it will warn instead of block
# Set ALLOW_SCAFFOLDING_CHECK_FAIL=true to allow all (emergency override)
