name: Daily WR & PR Summary
on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   - cron: 0 23 * * *
  workflow_dispatch:
    inputs:
      date_override:
        description: Override date (YYYY-MM-DD) for testing
        required: false
        type: string
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  generate-summary:
    name: Generate daily WR & PR summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          # Install @octokit/rest for GitHub API access
          npm install --no-save @octokit/rest
      - name: Generate daily summary
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_OVERRIDE: ${{ inputs.date_override }}
        run: |
          node scripts/generate-daily-summary.js
      - name: Commit and push summary
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE="${{ steps.generate.outputs.date }}"

          # Add generated files
          git add wr/summaries/"${DATE}.md"
          git add wr/summaries/"${DATE}.html"

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add daily WR & PR summary for ${DATE}" \
                       -m "- Issues created: ${{ steps.generate.outputs.issues_count }}" \
                       -m "- PRs opened: ${{ steps.generate.outputs.prs_count }}" \
                       -m "Auto-generated by daily-wr-summary.yml"
            
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Summary committed and pushed"
          fi
      - name: Create summary in GitHub Actions
        run: |
          DATE="${{ steps.generate.outputs.date }}"
          ISSUES_COUNT="${{ steps.generate.outputs.issues_count }}"
          PRS_COUNT="${{ steps.generate.outputs.prs_count }}"

          echo "## Daily WR & PR Summary — ${DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📊 **Summary:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Issues created: ${ISSUES_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PRs opened: ${PRS_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📄 **Files generated:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Markdown: \`wr/summaries/${DATE}.md\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTML: \`wr/summaries/${DATE}.html\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
            echo "✅ Summary committed to repository" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ No new activity to report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Update index if needed
        if: steps.commit.outputs.committed == 'true'
        run: |
          # Generate an index of all summaries
          cat > wr/summaries/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Daily WR & PR Summaries</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 40px 20px;
              }
              .container {
                max-width: 900px;
                margin: 0 auto;
                background: white;
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                padding: 40px;
              }
              h1 {
                color: #667eea;
                margin-bottom: 30px;
                font-size: 2.5em;
              }
              .summary-list {
                list-style: none;
                padding: 0;
              }
              .summary-item {
                padding: 15px;
                margin: 10px 0;
                background: #f8f9fa;
                border-radius: 8px;
                transition: all 0.3s ease;
              }
              .summary-item:hover {
                background: #e9ecef;
                transform: translateX(5px);
              }
              .summary-item a {
                color: #667eea;
                text-decoration: none;
                font-weight: 600;
                font-size: 1.1em;
              }
              .summary-item a:hover {
                text-decoration: underline;
              }
              .date {
                color: #666;
                font-size: 0.9em;
                margin-left: 10px;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>📊 Daily WR & PR Summaries</h1>
              <ul class="summary-list">
          INDEXEOF

          # List all HTML summaries in reverse chronological order
          # Use find with proper filtering and validation
          find wr/summaries -name "*.html" -type f ! -name "index.html" | sort -r | while IFS= read -r file; do
            basename=$(basename "$file")
            # Validate filename matches YYYY-MM-DD.html pattern
            if [[ "$basename" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$ ]]; then
              date="${basename%.html}"
              # HTML-escape the date for safe injection
              echo "      <li class=\"summary-item\"><a href=\"$(printf '%s' "$basename" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')\">Summary for $date</a></li>" >> wr/summaries/index.html
            fi
          done

          cat >> wr/summaries/index.html << 'INDEXEOF'
              </ul>
            </div>
          </body>
          </html>
          INDEXEOF

          # Commit index
          git add wr/summaries/index.html
          if ! git diff --staged --quiet; then
            git commit -m "Update summaries index"
            git push
          fi
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
