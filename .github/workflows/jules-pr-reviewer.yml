name: Jules PR Reviewer
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: jules-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Jules PR review
    runs-on: ubuntu-latest
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Verify JULES_API_KEY is configured
        run: |
          if [ -z "${JULES_API_KEY}" ]; then
            echo "::warning::JULES_API_KEY is not set — skipping Jules PR Reviewer."
          else
            echo "JULES_API_KEY is configured."
          fi
      - name: Jules PR Review
        if: env.JULES_API_KEY != ''
        uses: sanjay3290/jules-pr-reviewer@v1
        continue-on-error: true
        timeout-minutes: 5
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on: never
          skip_drafts: true
          skip_forks: true
          bypass_label: jules-override
          status_context: jules/review
      - name: Finalize Jules advisory status
        if: always()
        uses: actions/github-script@v9.0.0
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'jules/review',
              description: 'Jules review is advisory; no blocking findings reported by this workflow.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.notice(`Finalized jules/review status for ${sha}`);
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
