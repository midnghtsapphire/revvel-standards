name: Jules PR Reviewer

# ── SILENCED 2026-05-28 — sanjay3290/jules-pr-reviewer@v1.0.0 action is broken ────
# JULES_API_KEY is set correctly (has been since Jules came to be), but this
# workflow keeps failing because it invokes `sanjay3290/jules-pr-reviewer@v1.0.0`
# — a single-author community action that appears broken or unmaintained. The
# OTHER Jules workflows (jules-feedback, jules-invoke, jules-pr-comment) use
# `BeksOmega/jules-*` actions and work fine.
#
# Per the standards: comment, don't delete. workflow_dispatch stays wired for
# manual re-attempts. To replace properly: swap the `uses:` below for a
# working BeksOmega/jules-* action, or rely on the other Jules workflows.
# To re-enable auto-triggers as-is: uncomment the pull_request: block below.
# ──────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: jules-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Jules PR review
    runs-on: ubuntu-latest
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Verify JULES_API_KEY is configured
        run: |
          if [ -z "${JULES_API_KEY}" ]; then
            echo "::warning::JULES_API_KEY is not set — skipping Jules PR Reviewer."
          else
            echo "JULES_API_KEY is configured."
          fi
      - name: Jules PR Review
        if: ${{ env.JULES_API_KEY != '' && env.JULES_API_KEY != null }}
        uses: sanjay3290/jules-pr-reviewer@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on: blocking
          skip_drafts: true
          skip_forks: true
          bypass_label: jules-override
          status_context: jules/review
      - name: Mark Jules review status as skipped
        if: ${{ env.JULES_API_KEY == '' || env.JULES_API_KEY == null }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              core.setFailed('Missing pull_request.head.sha; cannot publish jules/review status.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'jules/review',
              description: 'Skipped: JULES_API_KEY is not configured',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
    timeout-minutes: 10
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
