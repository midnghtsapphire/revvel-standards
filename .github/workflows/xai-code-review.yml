# xAI Code Review (active install)
#
# Marketplace: https://github.com/marketplace/actions/xai-code-review
# Action repo: https://github.com/tarmojussila/xai-code-review
# Template:    templates/cicd/xai-code-review.yml
# Issue:       #16876
#
# Advisory Grok review lane. Soft-skips when XAI_API_KEY is missing and uses
# continue-on-error so a vendor blip never blocks merge. Prefer BITO /
# Coderabbit for primary review signal (see docs/CODE_REVIEW_WORKFLOW_STATUS.md).
#
# Add `[skip-review]` to the PR title to bypass.
#
# Secrets: XAI_API_KEY (Vault path revvel/shared/llm/xai)
# Optional vars: XAI_MODEL, XAI_SYSTEM_PROMPT, XAI_REVIEWER_NAME
#
# CLAUDE.md #8 — third-party action pinned to full commit SHA of v0.1.0.

name: xAI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: xai-code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: xAI Grok review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.title, '[skip-review]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Verify XAI_API_KEY is configured
        run: |
          if [ -z "${XAI_API_KEY}" ]; then
            echo "::warning::XAI_API_KEY is not set — skipping xAI Code Review. Add it under Settings → Secrets and variables → Actions (Vault path revvel/shared/llm/xai)."
          else
            echo "XAI_API_KEY is configured."
          fi

      - name: xAI Code Review
        # Spend gate (#17850): this third-party action calls xAI with the key from
        # the job env, so the spend is real even though no provider URL appears in
        # this file. Runs only when REVVEL_LLM_ALLOW_CLOUD is "1".
        if: (env.XAI_API_KEY != '') && vars.REVVEL_LLM_ALLOW_CLOUD == '1'
        # Advisory only — never block merge on a transient xAI outage.
        continue-on-error: true
        # pin: tarmojussila/xai-code-review@v0.1.0
        uses: tarmojussila/xai-code-review@0a0ec8e6ae59ed29819ac73ba1b8a983f40ca255
        with:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-3' }}
          XAI_REVIEWER_NAME: ${{ vars.XAI_REVIEWER_NAME || 'xAI Code Review' }}
          XAI_SYSTEM_PROMPT: ${{ vars.XAI_SYSTEM_PROMPT || 'You are an expert code reviewer for the Revvel monorepo. Focus on bugs, security, broken automation, and missing tests. Skip pure style nits. Prefer concrete, actionable fixes. Never recommend blocking the PR.' }}
          EXCLUDE_PATTERNS: "*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml,**/node_modules/**,**/dist/**,docs/agents/**/transcripts/**"
          MAX_DIFF_CHARS: "200000"
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
