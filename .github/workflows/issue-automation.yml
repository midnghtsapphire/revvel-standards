# Issue Automation
#
# Automatically reviews newly opened issues for template completeness,
# potential duplicates, and assignment via AutomaticIssue action.
#
# See: https://github.com/Dtar380/AutomaticIssue

name: Issue Automation

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  automate-issue:
    name: Automate Issue Triage
    runs-on: ubuntu-latest

    steps:
      - name: Issue Automation
        # Pin to the full commit SHA for the upstream v2.0.0 release.
        uses: Dtar380/AutomaticIssue@<FULL_40_CHARACTER_COMMIT_SHA_FOR_V2_0_0>
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
