name: Issue State Machine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to transition'
        required: true
        type: string
      target_state:
        description: 'Target lifecycle state label'
        required: true
        type: string

jobs:
  transition-state:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove conflicting labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            const lifecycleLabels = [
              'state:triage',
              'state:in-progress',
              'state:blocked',
              'state:review',
              'state:done',
            ];

            for (const label of lifecycleLabels) {
              if (label === targetState) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (e) {
                console.log(`Skipping removal of ${label}: ${e.message}`);
              }
            }

      - name: Apply target state label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [targetState],
            });

      - name: Cleanup stale lifecycle labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            const staleLabels = [
              'needs-triage',
              'needs-review',
              'stuck',
            ];

            for (const label of staleLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (e) {
                console.log(`Skipping removal of ${label}: ${e.message}`);
              }
            }
