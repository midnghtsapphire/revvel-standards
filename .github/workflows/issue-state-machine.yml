name: Issue State Machine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to transition'
        required: true
        type: string
      target_state:
        description: 'Target lifecycle state'
        required: true
        type: choice
        options:
          - triage
          - accepted
          - in-progress
          - blocked
          - in-review
          - done

jobs:
  transition-state:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove conflicting labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            const lifecycleLabels = [
              'state:triage',
              'state:accepted',
              'state:in-progress',
              'state:blocked',
              'state:in-review',
              'state:done',
            ];
            const targetLabel = `state:${targetState}`;

            // Fetch existing labels on the issue
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));

            // Remove any lifecycle labels that are not the target
            for (const label of lifecycleLabels) {
              if (label === targetLabel) continue;
              if (!existing.includes(label)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
                console.log(`Removed conflicting label: ${label}`);
              } catch (e) {
                console.log(`Could not remove label ${label} (may not exist): ${e.message}`);
              }
            }

            // Add the target lifecycle label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [targetLabel],
            });
            console.log(`Applied target label: ${targetLabel}`);

      - name: Comment on transition
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🔄 Lifecycle state transitioned to **${targetState}** via manual workflow_dispatch.`,
            });
