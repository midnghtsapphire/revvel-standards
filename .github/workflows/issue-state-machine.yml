name: Issue State Machine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to transition'
        required: true
        type: string
      target_state:
        description: 'Target WR lifecycle state'
        required: true
        type: choice
        options:
          - triaged
          - in-progress
          - blocked
          - review
          - done

jobs:
  transition-state:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Remove conflicting labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            const lifecycleLabels = [
              'state:triaged',
              'state:in-progress',
              'state:blocked',
              'state:review',
              'state:done',
            ];
            const targetLabel = `state:${targetState}`;
            for (const label of lifecycleLabels) {
              if (label === targetLabel) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (e) {
                console.log(`Label ${label} not present on #${issueNumber} (or already removed): ${e.message}`);
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [targetLabel],
            });

      - name: Post transition comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🔄 Lifecycle state transitioned to \`state:${targetState}\` via manual workflow_dispatch.`,
            });

      - name: Cleanup stale labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            // When transitioning to done, clean up transient workflow labels
            const staleLabels = targetState === 'done'
              ? ['needs-triage', 'awaiting-response', 'in-review']
              : [];
            for (const label of staleLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (e) {
                console.log(`Label ${label} not present on #${issueNumber} (or already removed): ${e.message}`);
              }
            }
