name: Issue State Machine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to transition'
        required: true
        type: string
      target_state:
        description: 'Target lifecycle state'
        required: true
        type: choice
        options:
          - triage
          - in-progress
          - blocked
          - review
          - done

permissions:
  issues: write
  contents: read

jobs:
  transition-state:
    runs-on: ubuntu-latest
    steps:
      - name: Remove conflicting labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            const lifecycleLabels = [
              'state:triage',
              'state:in-progress',
              'state:blocked',
              'state:review',
              'state:done',
            ];
            const targetLabel = `state:${targetState}`;
            const toRemove = lifecycleLabels.filter((l) => l !== targetLabel);
            for (const label of toRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
                console.log(`Removed label ${label} from #${issueNumber}`);
              } catch (e) {
                console.log(`Skipping removal of ${label} on #${issueNumber}: ${e.message}`);
              }
            }

      - name: Apply target lifecycle label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            const targetLabel = `state:${targetState}`;
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [targetLabel],
              });
              console.log(`Applied label ${targetLabel} to #${issueNumber}`);
            } catch (e) {
              console.log(`Failed to apply ${targetLabel} to #${issueNumber}: ${e.message}`);
            }
