name: Issue State Machine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to transition'
        required: true
        type: string
      target_state:
        description: 'Target lifecycle state'
        required: true
        type: choice
        options:
          - triage
          - in-progress
          - blocked
          - review
          - done

jobs:
  transition-state:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove conflicting labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = parseInt('${{ inputs.issue_number }}', 10);
            const target = '${{ inputs.target_state }}';
            const lifecycleLabels = ['triage', 'in-progress', 'blocked', 'review', 'done'];
            const toRemove = lifecycleLabels.filter(l => l !== target);
            for (const label of toRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: label,
                });
              } catch (e) {
                console.log(`Could not remove label '${label}' (may not exist): ${e.message}`);
              }
            }

      - name: Add target label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = parseInt('${{ inputs.issue_number }}', 10);
            const target = '${{ inputs.target_state }}';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [target],
            });

      - name: Cleanup stale lifecycle labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = parseInt('${{ inputs.issue_number }}', 10);
            const target = '${{ inputs.target_state }}';
            const staleLabels = ['needs-triage', 'wip', 'awaiting-review'];
            for (const label of staleLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: label,
                });
              } catch (e) {
                console.log(`Could not remove stale label '${label}' (may not exist): ${e.message}`);
              }
            }
