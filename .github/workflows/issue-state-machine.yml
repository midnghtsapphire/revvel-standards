name: Issue State Machine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to transition'
        required: true
        type: string
      target_state:
        description: 'Target lifecycle state label'
        required: true
        type: string

jobs:
  transition-state:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Transition issue state
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';

            // Lifecycle labels that are mutually exclusive
            const lifecycleLabels = [
              'state:triage',
              'state:ready',
              'state:in-progress',
              'state:blocked',
              'state:review',
              'state:done',
            ];

            // Remove conflicting labels
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const currentLabels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            const toRemove = currentLabels.filter(
              name => lifecycleLabels.includes(name) && name !== targetState
            );

            for (const name of toRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch (e) {
                console.log(`removeLabel(${name}) failed (likely 404 race): ${e.message}`);
              }
            }

            // Add target state label
            if (!currentLabels.includes(targetState)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [targetState],
              });
            }

            console.log(`Transitioned issue #${issueNumber} to ${targetState}`);
