name: Issue State Machine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to transition'
        required: true
        type: string
      target_state:
        description: 'Target lifecycle state'
        required: true
        type: choice
        options:
          - triage
          - ready
          - in-progress
          - blocked
          - done

jobs:
  transition-state:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove conflicting labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            const stateLabels = ['triage', 'ready', 'in-progress', 'blocked', 'done'];
            for (const label of stateLabels) {
              if (label === targetState) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (e) {
                console.log(`Could not remove label ${label}: ${e.message}`);
              }
            }

      - name: Apply target state label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [targetState],
            });

      - name: Cleanup stale lifecycle labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            const staleLabels = ['stale', 'needs-review', 'wip'];
            for (const label of staleLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (e) {
                console.log(`Could not remove label ${label}: ${e.message}`);
              }
            }

      - name: Comment transition
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}', 10);
            const targetState = '${{ inputs.target_state }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Lifecycle state transitioned to **${targetState}** via workflow_dispatch.`,
            });
