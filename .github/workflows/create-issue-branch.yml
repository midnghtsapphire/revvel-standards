name: Create Issue Branch
on:
  issues:
    types:
      - opened
      - assigned
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - opened
      - closed
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  create-issue-branch:
    name: Create Issue Branch
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue Branch
        uses: robvanderleek/create-issue-branch@dfe19372d9a9198999c0fd8a81f0dbe00951afd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
