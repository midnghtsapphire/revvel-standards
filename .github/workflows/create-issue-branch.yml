# Create Issue Branch — GitHub Actions workflow
#
# This workflow implements the Create Issue Branch automation as a GitHub Action.
# It is an alternative to installing the paid GitHub Marketplace app and gives
# full control over when the automation runs.
#
# Configuration is read from .github/issue-branch.yml.
# Docs: https://github.com/robvanderleek/create-issue-branch
#
# Triggers:
#   • issues.opened   — "immediate" mode: branch is created on issue creation
#   • issues.assigned — "auto" mode fallback: branch is created on assignment
#   • issue_comment.created — "chatops" mode: /cib or /create-issue-branch
#   • pull_request events — needed for autoLinkIssue / autoDeleteBranch features

name: Create Issue Branch

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed]

permissions:
  contents: write      # create branches
  issues: write        # comment on issues
  pull-requests: write # link PRs to issues

jobs:
  create-issue-branch:
    name: Create Issue Branch
    runs-on: ubuntu-latest

    steps:
      - name: Create Issue Branch
        uses: robvanderleek/create-issue-branch@dfe19372d9a9198999c0fd8a81f0dbe00951afd9  # v1.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
