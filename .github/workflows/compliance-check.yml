name: Compliance Check
on:
  workflow_dispatch: null
  push:
    paths:
      - docs/COMPLIANCE_TRACKER.md
      - docs/MEDICAID_WATCHDOG.md
      - docs/GRANT_READINESS.md

permissions:
  contents: read
  issues: write

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Compliance Check
        run: |
          echo "=== Compliance Check Started ==="
          echo "Date: $(date)"

          # Check compliance tracker
          echo "=== Checking Compliance Status ==="
          if [ -f docs/COMPLIANCE_TRACKER.md ]; then
            echo "Compliance tracker found"
          fi

          # Check for urgent items
          echo "=== Checking Urgent Items ==="
          grep -i "URGENT\|May 2026\|CRITICAL" docs/*.md || echo "No urgent items found"

          # Check Medicaid status
          echo "=== Medicaid Watchdog ==="
          if [ -f docs/MEDICAID_WATCHDOG.md ]; then
            echo "Medicaid tracker active"
          fi

          # Check grant deadlines
          echo "=== Grant Deadlines ==="
          grep -i "due\|deadline\|expir" docs/GRANT_READINESS.md || echo "No upcoming deadlines"

          echo "=== Compliance Check Complete ==="
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠️ Compliance Check Failed",
              body: "The daily compliance check has failed. Please review the workflow logs."
            })
      - name: Create Issue on Urgent
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "🔴 URGENT: Compliance Item Detected";
            const content = fs.readFileSync('docs/COMPLIANCE_TRACKER.md', 'utf8');
            if (!(content.includes('URGENT') || content.includes('CRITICAL'))) {
              core.info('No urgent compliance items detected.');
              return;
            }
            // Deduplicate: the tracker always contains the words URGENT/CRITICAL,
            // so without this guard the daily schedule (and every push) would open
            // an endless stream of identical issues. Only open one when none is
            // already open. Mirror compliance-watcher.yml: fetch open issues and
            // match by title before creating.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            if (openIssues.some((issue) => !issue.pull_request && issue.title === title)) {
              core.info(`Existing open issue found, skipping creation: ${title}`);
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: "An urgent compliance item has been detected. Please review docs/COMPLIANCE_TRACKER.md"
            });
            core.info(`Opened issue: ${title}`);
    timeout-minutes: 30
  monthly-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Monthly Audit
        run: |
          echo "=== Monthly Audit ==="
          echo "Checking all business compliance..."
          echo "- SAM.gov CAGE Code"
          echo "- Colorado Secretary of State"
          echo "- Medicaid eligibility"
          echo "- Business licenses"
          echo "=== Complete ==="
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
