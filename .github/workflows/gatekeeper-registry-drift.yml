name: Gatekeeper — Registry Drift Check

# Daily check that every active registry entry with a Doppler path is
# actually present in Doppler. Entries outside the token's project/config
# scope are skipped (logged as INFO).
#
# Note: DOPPLER_TOKEN is a service token scoped to a single project/config.
# Entries from other Doppler projects are skipped (logged as INFO).
# For cross-project drift detection, use a workplace-scoped token.

on:
  schedule:
    - cron: '0 4 * * *'  # Daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    name: Detect registry vs Doppler drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        # ubuntu-latest includes jq; this step is a safety net for self-hosted or custom runners.
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q jq
          fi

      - name: Compare registry to Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN || secrets.DOPPLER_LOCAL_TOKEN || secrets.DOPPLER_API_KEY || secrets.DOPPLER_AGENT_ODIC }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT || 'revvel-standards' }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG || 'prd' }}
        run: |
          if [[ -z "${DOPPLER_TOKEN:-}" ]]; then
            echo "::error::None of DOPPLER_TOKEN, DOPPLER_LOCAL_TOKEN, DOPPLER_API_KEY, or DOPPLER_AGENT_ODIC is set — cannot check Doppler for drift"
            exit 1
          fi

          REGISTRY="docs/_GATEKEEPER_REGISTRY.json"
          if [[ ! -f "$REGISTRY" ]]; then
            echo "Registry file not found — skipping drift check"
            exit 0
          fi

          if ! jq empty "$REGISTRY" 2>/dev/null; then
            echo "::error::$REGISTRY is not valid JSON"
            exit 1
          fi

          DRIFT_COUNT=0
          SKIPPED=0
          REPORT=""

          # Check each registry entry with a Doppler path
          while IFS= read -r entry; do
            id=$(echo "$entry" | jq -r '.id')
            name=$(echo "$entry" | jq -r '.name')
            env_var=$(echo "$entry" | jq -r '.env_var // empty')
            doppler_path=$(echo "$entry" | jq -r '.doppler_path // empty')
            status=$(echo "$entry" | jq -r '.status')

            [[ "$status" != "active" ]] && continue
            [[ -z "$doppler_path" ]] && continue
            [[ -z "$env_var" ]] && continue

            # Parse project/config from doppler_path (format: project/config/name)
            IFS='/' read -r project config _secret_name <<< "$doppler_path"

            if [[ -z "$project" || -z "$config" ]]; then
              echo "⚠️  $id — malformed doppler_path: $doppler_path"
              continue
            fi

            # Skip entries outside the token's project scope to avoid false positives
            if [[ "$project" != "$DOPPLER_PROJECT" || "$config" != "$DOPPLER_CONFIG" ]]; then
              echo "ℹ️  SKIP: $name ($id) — $project/$config is outside token scope ($DOPPLER_PROJECT/$DOPPLER_CONFIG)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Check if secret exists in Doppler; prefer the name from doppler_path, fallback to env_var
            SECRET_NAME="${_secret_name:-$env_var}"
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              --get "https://api.doppler.com/v3/configs/config/secret" \
              --data-urlencode "project=$project" \
              --data-urlencode "config=$config" \
              --data-urlencode "name=$SECRET_NAME" \
              -H "Authorization: Bearer $DOPPLER_TOKEN" \
              -H "Accept: application/json" 2>/dev/null) || HTTP_CODE="000"

            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "✅ $name ($id) — present in Doppler"
            elif [[ "$HTTP_CODE" == "404" ]]; then
              echo "🔴 DRIFT: $name ($id) — $SECRET_NAME NOT found in Doppler $project/$config (404)"
              DRIFT_COUNT=$((DRIFT_COUNT + 1))
              REPORT="${REPORT}\n- **$name** (\`$SECRET_NAME\`): not found in Doppler \`$project/$config\`"
            elif [[ "$HTTP_CODE" == "401" || "$HTTP_CODE" == "403" ]]; then
              echo "::error::Doppler auth failed for $name ($id) — HTTP $HTTP_CODE. Verify DOPPLER_TOKEN is valid and scoped to $project/$config."
              exit 1
            else
              echo "::warning::Unexpected HTTP $HTTP_CODE checking $name ($id) in Doppler — skipping"
            fi
          done < <(jq -c '.entries[]' "$REGISTRY")

          echo ""
          echo "Drift check complete: $DRIFT_COUNT mismatches, $SKIPPED skipped (out of scope)"

          if [[ "$DRIFT_COUNT" -gt 0 ]]; then
            echo "::warning::Registry has $DRIFT_COUNT entries not found in Doppler"
            echo -e "\n## Drift Report\n$REPORT"
            exit 1
          fi
