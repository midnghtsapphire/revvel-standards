name: 🎛️ PR State Orchestrator
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - closed
      - labeled
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  check_run:
    types:
      - completed
  # Periodic drift repair: labels can drift when events are missed (API
  # outages, rate-limit storms, cancelled runs). The resync-all-prs job is
  # gated on github.event_name == 'schedule' — without this trigger that job
  # could NEVER run automatically.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-evaluate (leave blank to re-sync all open PRs)
        required: false
permissions:
  pull-requests: write
  contents: write
  issues: write
  checks: read
# Dedupe stacked runs: rapid check_run/check_suite events for the same SHA (or
# repeated events for the same PR) superseded each other anyway — each run
# re-reads full live state — but letting them all execute exhausted the
# installation API rate limit (5000/h) and caused unhandled 403 job failures.
concurrency:
  group: pr-state-orchestrator-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.check_suite.head_sha || github.event.check_run.head_sha || github.ref }}
  cancel-in-progress: true
jobs:
  # ---------------------------------------------------------------------------
  # METAL Scripts-as-CI (oaudrey governance/METAL principle #3): ALL logic lives
  # in scripts/ci/pr-state-orchestrator.js — versioned, reviewable, and runnable
  # identically on any runner, a laptop, or client infrastructure. These jobs
  # are thin invokers only.
  #
  # shell: cmd — CARESSE's PowerShell execution policy blocks runner temp
  # scripts (PSSecurityException); cmd has no execution policy.
  # runs-on: self-hosted (CARESSE) — METAL principle #1 (no GitHub-hosted
  # compute for governance we own) and immune to the 2026-11 GitHub-hosted
  # billing lock: self-hosted job dispatch still works while hosted minutes
  # are blocked (verified 2026-11-10, probe run 42686663155).
  # ---------------------------------------------------------------------------
  pr-lifecycle:
    name: 🔄 PR Lifecycle Labels
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: PR Lifecycle Labels
        shell: cmd
        run: node scripts/ci/pr-state-orchestrator.js lifecycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
  review-handler:
    name: 🔍 Review State Labels
    if: github.event_name == 'pull_request_review'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: Review State Labels
        shell: cmd
        run: node scripts/ci/pr-state-orchestrator.js review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
  check-suite-handler:
    name: ✅ CI Check Suite Labels
    if: github.event_name == 'check_suite'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: CI Check Suite Labels
        shell: cmd
        run: node scripts/ci/pr-state-orchestrator.js check-suite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
  check-run-handler:
    name: ✅ CI Check Run Labels
    if: github.event_name == 'check_run'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: CI Check Run Labels
        shell: cmd
        run: node scripts/ci/pr-state-orchestrator.js check-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
  resync-all-prs:
    name: 🔄 Re-sync All Open PRs
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: Re-sync All Open PRs
        shell: cmd
        run: node scripts/ci/pr-state-orchestrator.js resync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
  manual-reevaluate:
    name: 🔄 Manual Re-evaluate Single PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != ''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted scripts from the default branch, never event-SHA code,
          # on the self-hosted runner (a PR could otherwise ship its own
          # version of the script and have it execute with a write token).
          ref: main
      - name: Re-evaluate PR state from scratch
        shell: cmd
        run: node scripts/ci/pr-state-orchestrator.js reevaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
