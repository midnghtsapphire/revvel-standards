name: WR PR Creation
# quiet-mode 2026-07-25 (owner request): automatic triggers disabled;
# run manually via workflow_dispatch if needed.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to create a PR for"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
# Split the concurrency group by event/action so that label-churn `issues`
# runs cannot cancel the `workflow_dispatch` run that research-engine fires to
# actually create the PR. Previously all of them shared `wr-pr-<issue>`, and
# because runs sit pending under heavy queue load, each new labeled event
# cancelled the still-pending PR-creation run — so recent WR issues normalized
# their labels but never got a PR.
concurrency:
  group: wr-pr-${{ github.event.issue.number || github.event.inputs.issue_number }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: false
jobs:
  detect-completion:
    name: Detect WR issue / Jules research completion
    runs-on: ubuntu-latest
    if: |-
      !(github.event_name == 'issue_comment' &&
        github.event.issue.pull_request) &&
      !(github.event_name == 'issues' &&
        github.event.issue.user.login == 'github-actions[bot]' &&
        (startsWith(github.event.issue.title, '[FAILURE]') ||
         startsWith(github.event.issue.title, '[ALERT]')))
    outputs:
      should_create_pr: ${{ steps.check.outputs.should_create_pr }}
      should_notify_skip: ${{ steps.check.outputs.should_notify_skip }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
      issue_number: ${{ steps.check.outputs.issue_number }}
      issue_title: ${{ steps.check.outputs.issue_title }}
      issue_body: ${{ steps.check.outputs.issue_body }}
    steps:
      - name: Check if PR should be created
        id: check
        uses: actions/github-script@v9.0.0
        with:
          script: |
            // Parse issue number from multiple possible sources:
            // 1. context.payload.issue.number - for issue-triggered events
            // 2. context.payload.inputs.issue_number - for workflow_dispatch (string or number)
            // 3. Extract from run URL as last resort fallback
            let issueNumber = context.payload.issue?.number || context.payload.inputs?.issue_number;
            
            // Ensure we have a string for regex operations
            const rawIssueNumber = String(issueNumber || '');
            
            // If issue_number is in format "14569" (plain number string), use it directly
            // If it's in format "#14569" or "issue-14569", extract the numeric part
            const numericMatch = rawIssueNumber.match(/#?(\d+)/);
            if (numericMatch) {
              issueNumber = numericMatch[1];
            } else {
              // Try to extract from run URL as fallback (format: .../runs/27566386345/jobs/...)
              const runUrl = process.env.GITHUB_RUN_URL || '';
              const runIdMatch = runUrl.match(/\/runs\/(\d+)\//);
              if (runIdMatch) {
                core.warning(`Could not get issue number from event/inputs, falling back to run ID extraction`);
              }
            }
            
            function skip(reason, { notify = context.eventName !== 'issue_comment' } = {}) {
              core.info(`Skipping WR PR creation: ${reason}`);
              core.setOutput('should_create_pr', 'false');
              core.setOutput('should_notify_skip', notify ? 'true' : 'false');
              core.setOutput('skip_reason', reason);
            }

            if (!issueNumber) {
              core.notice('No issue number found');
              core.notice(`Raw inputs: ${JSON.stringify(context.payload.inputs)}`);
              core.notice(`Event: ${context.eventName}, Action: ${context.payload.action}`);
              skip('no_issue_number', { notify: false });
              return;
            }

            // Ignore label-churn from sibling workflows AND from this job's own
            // normalization step below (it adds work-request, weekly-research,
            // wr:in-progress, deep-research, openrouter, role:orchestrator —
            // each firing a fresh `labeled` event). Reacting to every one of
            // them piles redundant runs into the concurrency group and cancels
            // the real PR-creation run. Only labels that genuinely signal
            // research/WR completion should advance here; `opened`,
            // `issue_comment`, and `workflow_dispatch` paths are unaffected.
            // `wr:reset` is also allowed through — it is applied by the
            // self-heal system to force a fresh PR creation pass.
            if (context.eventName === 'issues' && context.payload.action === 'labeled') {
              const triggerLabel = context.payload.label?.name || '';
              const COMPLETION_LABELS = new Set(['research:complete', 'wr:complete', 'wr:research', 'wr:reset']);
              if (!COMPLETION_LABELS.has(triggerLabel)) {
                skip(`labeled_noise:${triggerLabel}`, { notify: false });
                return;
              }
            }

            const commentBody = context.payload.comment?.body || '';
            const commentAuthor = context.payload.comment?.user?.login || '';
            const operationalCommentMarkers = [
              'WR PR Creation Failed',
              'WR PR Creation: Skipped',
              'WR PR Created!',
            ];
            const isOperationalBotComment =
              context.eventName === 'issue_comment' &&
              commentAuthor === 'github-actions[bot]' &&
              operationalCommentMarkers.some(marker => commentBody.includes(marker));
            if (isOperationalBotComment) {
              skip('operational_bot_comment', { notify: false });
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const title = issue.title || '';
            const body = issue.body || '';
            const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
            const labelSet = new Set(labels);
            const rawIssueType = issue.type || context.payload.issue?.type;
            const issueType = typeof rawIssueType === 'string' ? rawIssueType : (rawIssueType?.name || '');
            const normalizedIssueType = issueType.trim().toLowerCase();
            // Check if this is a WR issue. GitHub issue templates, GitHub issue
            // types, API-created issues, and title-only intake do not always
            // arrive with the same labels, so accept every canonical WR signal
            // before normalizing labels.
            //
            // RECONSTRUCTED 2026-07-08 (standards/GREEN_MAIN_STANDARD.md): nine
            // overlapping fixes had interleaved here, redeclaring hasTitleRouteTag
            // four times — the block did not compile, and the gate that checks it
            // (tests/workflow-yaml-validation.test.js) was already red on main.
            // Route-tag detection is kept in three deliberate tiers, each pinned
            // by tests/work-request-form-sync.test.js:
            // 1. Canonical word-boundary tags — unconditional WR signal.
            const hasWrRouteTag = /#(?:app|apps|tool|tools|pdf|pdfs|doc|docs|api|apis|cli|mcp|skill|skills|website)\b/i.test(title);
            // 2. Extended alias set (web-app, documentation, video).
            const hasRouteTag = /(^|\s)#(app|web-app|tool|tools|pdf|docs?|documentation|api|cli|mcp|video|skill|skills|website)\b/i.test(title);
            // 3. Narrow core set, only trusted while the issue is still `wr:new`,
            //    so unrelated hashtagged issues do not enter the WR pipeline.
            const hasTitleRouteTag = /(?:^|\s)#(?:app|apps|tool|tools|cli|api|mcp|pdf|doc|docs|skill|skills|website)(?=\s|$)/i.test(title);
            const isWR =
              title.match(/^\[WR\]/i) ||
              hasWrRouteTag ||
              hasRouteTag ||
              labelSet.has('weekly-research') ||
              labelSet.has('work-request') ||
              (labelSet.has('wr:new') && hasTitleRouteTag) ||
              ['basic wr', 'wr', 'work request'].includes(normalizedIssueType);
            if (!isWR) {
              core.info(`Issue #${issueNumber} is not a WR issue`);
              skip('not_wr_issue');
              return;
            }

            // Do not (re)create skeleton PRs for finished WRs. A closed issue
            // has already been delivered; re-triggers here only spawn duplicate
            // skeleton PRs (this is what happened on #14451, which kept
            // generating new skeleton PRs every time a label changed after it
            // was closed).
            //
            // The state is what decides, NOT the `issue:done` label (#17750).
            // The label used to be trusted on its own, and that made it a trap:
            // a single spurious `Closes #N` in a merged PR body got the label
            // applied to an OPEN, undelivered issue, and from then on no WR PR
            // could ever be opened for it. Nothing could clear the label
            // either — issue-lifecycle.yml only removes it when a PR that links
            // the issue is opened, and the label is what prevented that. The
            // issue was alive, unfinished and unreachable, by construction.
            //
            // `issue:done` on an open issue is a contradiction, so it is
            // repaired here rather than obeyed. issue-lifecycle.yml no longer
            // applies it to an open issue, so this path only heals residue.
            if (issue.state === 'closed') {
              core.info(`Issue #${issueNumber} is closed; not creating a WR PR.`);
              skip('issue_closed_or_done', { notify: false });
              return;
            }

            if (labelSet.has('issue:done')) {
              core.warning(
                `Issue #${issueNumber} is open but labelled issue:done. ` +
                'The label contradicts the state; removing it and continuing.'
              );
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'issue:done',
              }).catch((err) => {
                if (err.status !== 404) throw err;
              });
              labelSet.delete('issue:done');
            }

            // Skip bot-created issues (defensive — bot-spam should be filtered
            // by the job-level `if:` already).
            if (issue.user && issue.user.login === 'github-actions[bot]') {
              core.info(`Issue #${issueNumber} is bot-created; skipping.`);
              skip('bot_created_issue');
              return;
            }

            // Normalize labels immediately so BASIC WR / issue-type intake cannot
            // get stuck waiting for another workflow to add the routing labels.
            // BATCH: add all missing labels in a single API call for efficiency.
            const requiredWrLabels = [
              'work-request',
              'weekly-research',
              'wr:in-progress',
              'deep-research',
              'openrouter',
              'role:orchestrator',
            ];
            const missingLabels = requiredWrLabels.filter(label => !labelSet.has(label));
            if (missingLabels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: missingLabels,
                });
                missingLabels.forEach(label => {
                  labelSet.add(label);
                  core.info(`Normalized missing WR label: ${label}`);
                });
              } catch (error) {
                core.notice(`Could not normalize WR labels: ${error.message}`);
              }
            }

            // Check if a WR-skeleton PR already exists for this issue.
            //
            // DEVIN-RESTRUCTURE 2026-05-06: tightened the dedup match. The
            // previous logic matched ANY open OR closed PR that mentioned
            // `Closes #${issueNumber}` ANYWHERE in its body, OR whose title
            // happened to contain the WR-stripped title substring. Both are
            // false-positive prone: a hardening PR that fixes a chronic
            // workflow bug can legitimately close a stuck-WR issue without
            // BEING the WR's skeleton PR (e.g. #13352 closed #13347 by
            // shipping the auto-heal fix; that does NOT mean a WR-skeleton
            // PR exists for #13347 — quite the opposite).
            //
            // The right signal: this exact workflow always applies the
            // labels `weekly-research`, `jules`, `documentation`,
            // `wr:in-progress` to its created PR (see the "Apply labels to
            // PR" step ~30 lines below). Match those instead. We require
            // BOTH the issue-reference AND the `weekly-research` label so
            // the dedup is correct even if a different workflow ever
            // applied one of the others.
            //
            // Search ALL PRs (open + closed) so we can tell apart the three
            // cases. An OPEN skeleton means one is already in flight — this
            // also closes the few-minutes race where two triggers fire before
            // either PR is visible (#14451 got #14497 and #14502 three minutes
            // apart this way). A MERGED skeleton means the WR doc already
            // shipped, so the WR is done — do not spawn another. Only a
            // CLOSED-but-unmerged skeleton (genuinely abandoned) leaves the
            // door open for a fresh re-trigger.
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });

            const issueRefRegex = new RegExp(
              `(closes|fixes|resolves)\\s+#${issueNumber}\\b`,
              'i'
            );
            const existingPR = prs.find(pr => {
              const prLabels = (pr.labels || []).map(l => typeof l === 'string' ? l : l.name);
              const isWrSkeleton =
                prLabels.includes('weekly-research') &&
                prLabels.includes('wr:in-progress');
              const refsThisIssue = pr.body && issueRefRegex.test(pr.body);
              // Block on an in-flight (open) or already-shipped (merged)
              // skeleton; allow re-trigger after an abandoned (closed-unmerged) one.
              const blocks = pr.state === 'open' || Boolean(pr.merged_at);
              return isWrSkeleton && refsThisIssue && blocks;
            });

            // `wr:reset` allows recovery after an abandoned (closed-unmerged)
            // skeleton PR. Open or merged skeleton PRs always block, even with
            // wr:reset, to prevent duplicate in-flight or re-shipped WRs.
            const isResetTriggered =
              (context.eventName === 'issues' &&
               context.payload.action === 'labeled' &&
               context.payload.label?.name === 'wr:reset') ||
              labelSet.has('wr:reset');

            if (existingPR) {
              // wr:reset forces a fresh PR even when a skeleton already exists.
              // This lets operators unblock a stuck WR without manual branch cleanup.
              if (labelSet.has('wr:reset')) {
                core.info(`wr:reset detected on issue #${issueNumber} — bypassing existing-PR guard (${existingPR.html_url})`);
              } else {
                core.info(`WR-skeleton PR already exists for issue #${issueNumber}: ${existingPR.html_url}`);
                skip('existing_wr_pr');
                return;
              }
            }

            const isComplete =
              isResetTriggered ||
              labelSet.has('wr:complete') ||
              labelSet.has('research:complete') ||
              labelSet.has('wr:reset') ||
              context.eventName === 'workflow_dispatch';

            // Treat both direct research findings and the research-engine handoff
            // packet comment as valid completion signals for WR generation.
            let researchReadyComment = false;
            if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment;
              const commentBody = comment?.body || '';
              if (
                commentBody.includes('Research Findings:') ||
                commentBody.includes('## Research Findings') ||
                commentBody.includes('## Research Engine Review Request') ||
                commentBody.includes('Research packet:')
              ) {
                researchReadyComment = true;
              }
            }

            const shouldCreate = isComplete || researchReadyComment;

            core.info(`Issue #${issueNumber}: "${title}"`);
            core.info(`Is WR: ${isWR}`);
            core.info(`Is Complete: ${isComplete}`);
            core.info(`Reset triggered: ${isResetTriggered}`);
            core.info(`Research-ready comment: ${researchReadyComment}`);
            core.info(`Should Create PR: ${shouldCreate}`);
            core.info(`Issue type: ${issueType || '(none)'}`);
            core.info(`Current labels: ${Array.from(labelSet).join(', ')}`);

            core.setOutput('should_create_pr', shouldCreate ? 'true' : 'false');
            core.setOutput('should_notify_skip', shouldCreate || context.eventName === 'issue_comment' ? 'false' : 'true');
            core.setOutput('skip_reason', shouldCreate ? '' : 'trigger_not_ready');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', title);
            core.setOutput('issue_body', body);
    timeout-minutes: 30
  notify-skip:
    name: Notify if PR creation was skipped
    needs: detect-completion
    if: needs.detect-completion.outputs.should_create_pr != 'true' && needs.detect-completion.outputs.should_notify_skip == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post skip notification
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.inputs?.issue_number;
            if (!issueNumber) {
              core.notice('No issue number - cannot post skip notification');
              return;
            }

            const comment = [
              '⏭️ **WR PR Creation: Skipped**',
              '',
              'The WR PR creation workflow ran but determined that no PR should be created at this time.',
              '',
              '**Possible reasons:**',
              '- Issue is not a WR (missing `[WR]` prefix, `work-request` / `weekly-research` label, or BASIC WR issue type)',
              '- A WR-skeleton PR already exists for this issue',
              '- Issue is bot-created',
              '- Trigger condition not met (no `wr:complete` / `research:complete` label, manual dispatch, or research-ready comment)',
              '',
              `**Workflow run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_See `.github/workflows/wr-pr-creation.yml` for PR creation logic._',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
              core.notice(`Posted skip notification on issue #${issueNumber}`);
            } catch (error) {
              core.warning(`Failed to post skip notification: ${error.message}`);
            }
    timeout-minutes: 5
  create-wr-pr:
    name: Create WR PR
    needs: detect-completion
    if: needs.detect-completion.outputs.should_create_pr == 'true'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.detect-completion.outputs.issue_number }}
      ISSUE_TITLE: ${{ needs.detect-completion.outputs.issue_title }}
      ISSUE_BODY: ${{ needs.detect-completion.outputs.issue_body }}
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log workflow trigger
        run: |
          echo "=== WR PR Creation Debug ==="
          echo "::notice::ISSUE_NUMBER: '${ISSUE_NUMBER}'"
          echo "::notice::Event: ${{ github.event_name }}"
          echo "::notice::Action: ${{ github.event.action }}"
          echo "::notice::Issue Title: '${ISSUE_TITLE}'"

          # Validate ISSUE_NUMBER is not empty
          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "::error::ISSUE_NUMBER is empty! This will cause failures downstream."
            echo "::error::Failing workflow to prevent partial execution."
            exit 1
          fi

          echo "=== Debug complete ==="
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Get issue comments for research findings
        id: get_findings
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            function findLatestComment(predicate) {
              for (let index = comments.length - 1; index >= 0; index -= 1) {
                if (predicate(comments[index])) {
                  return comments[index];
                }
              }
              return null;
            }

            // Prefer the newest direct findings comment when available.
            const findingsComment = findLatestComment(c => 
              c.body && (
                c.body.includes('Research Findings:') ||
                c.body.includes('## Research Findings') ||
                c.body.includes('Executive Summary')
              )
            );

            const findings = findingsComment ? findingsComment.body : '';
            let resolvedFindings = findings;

            if (!resolvedFindings) {
              const packetComment = findLatestComment(c =>
                c.body &&
                c.body.includes('## Research Engine Review Request') &&
                c.body.includes('Research packet:')
              );
              const packetPath = packetComment?.body?.match(/Research packet:\s*`([^`]+)`/)?.[1];

              if (packetPath) {
                try {
                  const { data: repoData } = await github.rest.repos.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                  });
                  const { data: packetFile } = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: packetPath,
                    ref: repoData.default_branch,
                  });
                  const packetText = Buffer.from(packetFile.content || '', 'base64').toString('utf8');
                  const SYNTHESIS_SECTION_REGEX = /## Synthesis[\s\S]*?(?=\n## Code Review Handoff\b|$)/;
                  // Keep only the packet synthesis block so the WR gets the
                  // decision-ready research summary without duplicating the
                  // handoff checklist footer. The packet structure is defined
                  // by `scripts/research-engine.js` and ends the synthesis
                  // section at `## Code Review Handoff`.
                  const synthesis = packetText.match(SYNTHESIS_SECTION_REGEX)?.[0]?.trim();
                  resolvedFindings = [
                    '## Research Findings',
                    '',
                    `_Imported from research packet \`${packetPath}\`._`,
                    '',
                    synthesis || packetText.trim(),
                  ].join('\n');
                  core.info(`Loaded research packet: ${packetPath}`);
                } catch (error) {
                  core.notice(`Could not load research packet "${packetPath}": ${error.message}`);
                }
              }
            }

            core.info(`Found research findings: ${resolvedFindings.length} characters`);

            // Save to file for next step
            const fs = require('fs');
            fs.writeFileSync('research-findings.md', resolvedFindings, 'utf8');

            return resolvedFindings.substring(0, 1000); // Return preview
      - name: Create WR branch
        id: create_branch
        run: |
          # Clean title for branch name
          CLEAN_TITLE=$(printf '%s' "${ISSUE_TITLE}" | sed 's/\[WR\]//gi' | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/^-*//;s/-*$//')
          BASE_BRANCH_NAME="wr/issue-${ISSUE_NUMBER}-${CLEAN_TITLE:0:50}"
          BRANCH_NAME="${BASE_BRANCH_NAME}"

          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            BRANCH_NAME="${BASE_BRANCH_NAME}-${GITHUB_RUN_ID}"
            echo "::notice::Base WR branch already exists; using ${BRANCH_NAME}"
          fi

          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH_NAME}"
          echo "Created branch: ${BRANCH_NAME}"
      - name: Generate WR document
        run: |
          # Create WR directory if it doesn't exist
          mkdir -p wr/issues

          # Generate WR filename
          CLEAN_TITLE=$(printf '%s' "${ISSUE_TITLE}" | sed 's/\[WR\]//gi' | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/^-*//;s/-*$//')
          WR_FILE="wr/issues/issue-${ISSUE_NUMBER}-${CLEAN_TITLE:0:50}.md"

          echo "WR_FILE=${WR_FILE}" >> "$GITHUB_ENV"

          # Classify the WR: bug/fix/chore/docs-style issues use the BASIC
          # template (no market-research sections); everything else uses FULL.
          # Previously every WR used FULL, so fix-class WRs tripped wr-lint
          # rule 4 ("product section in a bug WR") and the PR stuck. Mirrors the
          # classification in wr/scripts/generate-wr.sh (grep -wiE; ERE has no \b).
          if printf '%s' "${ISSUE_TITLE}" | grep -qiE '^[[:space:]]*(\[WR\][[:space:]]*)?/(dragnet(-fix)?|errorfix|perm-?fix)([^a-z0-9-]|$)'; then
            # The DRAGNET fix persona (/dragnet and its fix aliases) files
            # permanent bug fixes, so its WRs use the BASIC short-form template
            # like any other fix WR. A long-form template here just trips
            # wr-lint rule 4 and stalls the PR (issue #15122).
            TEMPLATE_PREF="wr/WR_TEMPLATE_BASIC.md"
          elif printf '%s' "${ISSUE_TITLE}" | grep -qiE '^[[:space:]]*(\[WR\][[:space:]]*)?/[a-z]'; then
            # Other persona slash-command WRs (e.g. research personas) always use
            # the FULL long-form template even when the title contains "fix".
            TEMPLATE_PREF="wr/WR_TEMPLATE_FULL.md"
          elif printf '%s' "${ISSUE_TITLE}" | grep -qwiE '(fix|bug|typo|lint|refactor|chore|docs?|remove|pin|normalize|standardize|unreachable|duplicate)'; then
            TEMPLATE_PREF="wr/WR_TEMPLATE_BASIC.md"
          else
            TEMPLATE_PREF="wr/WR_TEMPLATE_FULL.md"
          fi

          # Copy the canonical WR template. The old path, wr/WR_TEMPLATE.md,
          # was removed when the WR template set was split into BASIC/FULL.
          TEMPLATE_FILE=""
          for candidate in "$TEMPLATE_PREF" wr/WR_TEMPLATE_FULL.md wr/WR_TEMPLATE_BASIC.md WR_TEMPLATE_FULL.md WR_TEMPLATE_BASIC.md; do
            if [ -f "$candidate" ]; then
              TEMPLATE_FILE="$candidate"
              break
            fi
          done

          if [ -z "$TEMPLATE_FILE" ]; then
            echo "::error::No WR template found. Expected wr/WR_TEMPLATE_FULL.md or wr/WR_TEMPLATE_BASIC.md."
            exit 1
          fi

          cp "${TEMPLATE_FILE}" "${WR_FILE}"
          echo "Using WR template: ${TEMPLATE_FILE}"

          # Replace placeholders with actual values without depending on sed
          # delimiter escaping for issue titles/bodies.
          export WR_FILE ISSUE_TITLE ISSUE_BODY
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import re

          wr_file = pathlib.Path(os.environ["WR_FILE"])
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          clean_title = re.sub(r"^\[WR\]\s*", "", title, flags=re.IGNORECASE).strip() or title
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          replacements = {
              "{REPO_NAME}": "midnghtsapphire/revvel-standards",
              "{REPO_URL}": "https://github.com/midnghtsapphire/revvel-standards",
              "{REPO}": "midnghtsapphire/revvel-standards",
              "{CREATED_DATE}": today,
              "{UPDATED_DATE}": today,
              "{DATE}": today,
              "{RESEARCH_DATE}": today,
              "{PRIMARY_LANGUAGE}": "JavaScript",
              "{LANGUAGE}": "JavaScript",
              "{TITLE}": clean_title,
              "{DESCRIPTION}": body,
              "{ISSUE_BODY}": body or "_No issue body provided._",
              "{RESEARCHER}": "Jules (Google) + OpenRouter",
              "{STATUS}": "🟡 In Progress",
              "{IS_PRIVATE}": "No",
              "{IS_ARCHIVED}": "No",
              "{STARS}": "N/A",
              "{OPEN_ISSUES}": "N/A",
          }
          text = wr_file.read_text(encoding="utf8")
          for key, value in replacements.items():
              text = text.replace(key, value)
          # Long-form (FULL) template owns a dedicated "## Research Findings"
          # section via the {RESEARCH_FINDINGS} token. When the template carries
          # that token, fill it in place from the research-findings.md payload
          # (collected in the previous step) instead of prepending a second
          # findings block above the template body. This keeps a single,
          # standard-position Research Findings section and stops the structure
          # from diverging from the WR template (see issue #15101). BASIC WRs
          # have no such token and still receive findings via the prepend below.
          findings_consumed = False
          if "{RESEARCH_FINDINGS}" in text:
              findings_path = pathlib.Path("research-findings.md")
              findings_body = ""
              if findings_path.is_file():
                  findings_body = findings_path.read_text(encoding="utf8").strip()
              if findings_body:
                  # Drop the leading marker/heading the payload may already
                  # carry so the template's own "## Research Findings" heading
                  # is not duplicated.
                  findings_body = re.sub(
                      r"^\s*<!--\s*revvel-research-findings\s*-->\s*", "", findings_body
                  )
                  findings_body = re.sub(
                      r"^\s*#{1,6}\s*Research Findings\s*\n+", "", findings_body
                  ).strip()
                  text = text.replace("{RESEARCH_FINDINGS}", findings_body)
                  findings_consumed = True
              else:
                  text = text.replace("{RESEARCH_FINDINGS}", "N/A — pending Jules refinement")
          # Catch-all: any generator token still left (e.g. {EXECUTIVE_SUMMARY},
          # {DEEP_WEB_RESEARCH}, {RISKS}, {RECOMMENDATIONS}, {REQUIREMENTS},
          # {PRODUCT_SELECTIONS}, {TOKEN}) becomes an explicit N/A marker rather
          # than shipping a raw {TOKEN}. Unsubstituted tokens like {STARS},
          # {OPEN_ISSUES}, {IS_PRIVATE}, {IS_ARCHIVED} were failing wr-lint and
          # jamming every generated WR PR. Mirrors wr/scripts/generate-wr.sh.
          text = re.sub(r"\{[A-Z_]+\}", "N/A — pending Jules refinement", text)
          wr_file.write_text(text, encoding="utf8")
          if findings_consumed:
              # Signal the shell step below to skip the prepend so the findings
              # are not emitted twice.
              pathlib.Path(".wr-findings-consumed").write_text("1", encoding="utf8")
          PY

          # Insert issue information at the top
          cat > temp_header.md <<EOF
          # WR: ${ISSUE_TITLE}

          **Issue:** #${ISSUE_NUMBER}  
          **Repository:** [midnghtsapphire/revvel-standards](https://github.com/midnghtsapphire/revvel-standards)  
          **Created:** $(date -u +%Y-%m-%d)  
          **Research Date:** $(date -u +%Y-%m-%d)  
          **Researcher:** Jules (Google) + OpenRouter  
          **WR Status:** 🟡 In Progress

          ---

          EOF

          # Append research findings if they exist and were not already placed
          # into the template's dedicated Research Findings section above.
          if [ ! -f .wr-findings-consumed ] && [ -f research-findings.md ] && [ -s research-findings.md ]; then
            echo "" >> temp_header.md
            cat research-findings.md >> temp_header.md
            echo "" >> temp_header.md
            echo "---" >> temp_header.md
            echo "" >> temp_header.md
          fi
          rm -f .wr-findings-consumed

          OUTPUT_TYPE=$(printf '%s\n' "$ISSUE_BODY" | awk '/^### Output Type$/ { found=1; next } found && NF { print; exit }' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r')
          tail -n +10 "${WR_FILE}" >> temp_header.md

          mv temp_header.md "${WR_FILE}"

          # Read Output Type from issue body and skip app scaffolding if it's a PDF/doc
          OUTPUT_TYPE=$(printf '%s\n' "${ISSUE_BODY}" | awk '
            BEGIN { found = 0 }
            /(^|[ \t])### Output Type/ { found = 1; next }
            found && /(^|[ \t])### / { exit }
            found && NF { gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit }
          ' | tr -d '\r')
          if [ -z "$OUTPUT_TYPE" ]; then
            TITLE_TAG=$(printf '%s\n' "${ISSUE_TITLE}" | grep -oEi '#(tool|tools|app)\b' | head -n1 | tr '[:upper:]' '[:lower:]' || true)
            case "$TITLE_TAG" in
              '#tool'|'#tools')
                OUTPUT_TYPE='desktop-tool'
                ;;
              '#app')
                OUTPUT_TYPE='production-app'
                ;;
            esac
          fi

          if [[ -z "$OUTPUT_TYPE" ]]; then
            NORMALIZED_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]')
            if [[ "$NORMALIZED_TITLE" =~ (^|[^a-z0-9])#apps?([^a-z0-9]|$) ]]; then
              OUTPUT_TYPE="production-app"
            elif [[ "$NORMALIZED_TITLE" =~ (^|[^a-z0-9])#tools?([^a-z0-9]|$) ]]; then
              OUTPUT_TYPE="desktop-tool"
            elif [[ "$NORMALIZED_TITLE" =~ (^|[^a-z0-9])#pdf([^a-z0-9]|$) ]]; then
              OUTPUT_TYPE="sellable-pdf"
            elif [[ "$NORMALIZED_TITLE" =~ (^|[^a-z0-9])#api([^a-z0-9]|$) ]]; then
              OUTPUT_TYPE="api-product"
            elif [[ "$NORMALIZED_TITLE" =~ (^|[^a-z0-9])#cli([^a-z0-9]|$) ]]; then
              OUTPUT_TYPE="cli-product"
            elif [[ "$NORMALIZED_TITLE" =~ (^|[^a-z0-9])#mcp([^a-z0-9]|$) ]]; then
              OUTPUT_TYPE="mcp-product"
            elif [[ "$NORMALIZED_TITLE" =~ (^|[^a-z0-9])#docs?([^a-z0-9]|$) ]]; then
              OUTPUT_TYPE="technical-documentation"
            fi
          fi

          infer_output_type_from_title_tags() {
            local title_lower
            title_lower=$(printf '%s' "${ISSUE_TITLE:-}" | tr '[:upper:]' '[:lower:]')
            local tag_regex='#[a-z][a-z0-9-]*'
            local tags
            tags=$(printf '%s\n' "$title_lower" | grep -Eo "$tag_regex" || true)
            local tag
            while IFS= read -r tag; do
              case "$tag" in
                '#app'|'#apps') echo "production-app"; return 0 ;;
                '#tool'|'#tools') echo "desktop-tool"; return 0 ;;
                '#pdf') echo "sellable-pdf"; return 0 ;;
                '#docs'|'#doc') echo "technical-documentation"; return 0 ;;
                '#cli') echo "cli-product"; return 0 ;;
                '#api') echo "api-product"; return 0 ;;
                '#mcp') echo "mcp-product"; return 0 ;;
              esac
            done <<< "$tags"
            return 1
          }

          if [ -z "$OUTPUT_TYPE" ]; then
            TITLE_OUTPUT_TYPE="$(infer_output_type_from_title_tags || true)"
            if [ -n "$TITLE_OUTPUT_TYPE" ]; then
              OUTPUT_TYPE="$TITLE_OUTPUT_TYPE"
              echo "No Output Type section found — inferred from title tags: $OUTPUT_TYPE"
            fi
          fi

          if [[ "$OUTPUT_TYPE" == "sellable-pdf" || "$OUTPUT_TYPE" == "technical-documentation" || "$OUTPUT_TYPE" == "project-management-doc" ]]; then
            echo "Output Type is $OUTPUT_TYPE — stripping app deployment scaffolding from WR document."
            sed -i '/## Step 5: Deployment Verification/,/## Step 6: Documentation Requirements/{/## Step 6: Documentation Requirements/!d}' "${WR_FILE}"
            sed -i '/### Deployment Section/,/### Additional Documentation/{/### Additional Documentation/!d}' "${WR_FILE}"
          fi

          echo "Generated WR document: ${WR_FILE}"
      - name: Sanitize WR markdown (MD012/MD025/MD049 gate failures)
        # Pasted issue bodies / imported research packets carry their own H1s,
        # double blank lines, and asterisk emphasis, which failed the CircleCI
        # changed-Markdown gate on nearly every WR PR (issue #15604). Normalize
        # the stitched document before it is validated/committed. Playbook:
        # docs/WR_MARKDOWN_LINT_PLAYBOOK.md.
        run: node wr/scripts/sanitize-wr-markdown.mjs "${WR_FILE}"
      - name: Validate WR local references
        run: |
          export WR_FILE
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          wr_file = pathlib.Path(os.environ["WR_FILE"])
          repo_root = pathlib.Path.cwd()
          text = wr_file.read_text(encoding="utf8")
          missing = []

          for match in re.finditer(r'(?<!\!)\[[^\]]+\]\(([^)]+)\)', text):
              target = match.group(1).strip().strip('<>')
              if not target:
                  continue
              if re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:', target):
                  continue
              target = target.split('#', 1)[0]
              if not target:
                  continue
              resolved = (wr_file.parent / target).resolve()
              if not resolved.exists():
                  try:
                      display = resolved.relative_to(repo_root)
                  except ValueError:
                      display = resolved
                  missing.append(f'{target} -> {display}')

          if missing:
              print(f'::error::Missing local references in {wr_file}:')
              for item in missing:
                  print(f'::error::{item}')
              sys.exit(1)

          print(f'Validated local references in {wr_file}')
          PY
      - name: Auto-heal Markdown lint in generated WR
        # Generated WRs carry the issue body verbatim (setext headings,
        # asterisk bullets, stacked blank lines) plus a prepended `# WR:`
        # header above template bodies that may already contain an H1 — the
        # exact findings that turn the changed-Markdown gate red on every WR
        # PR. Heal them at generation time so the PR is born lint-clean.
        # (No npm ci in this job: heal-markdown falls back to a pinned
        # npx markdownlint-cli2 fetch.)
        run: node scripts/heal-markdown.js "${WR_FILE}"
      - name: Commit WR document
        run: |
          git add "${WR_FILE}"
          git add wr/issues/ || true

          git commit -m "docs(wr): create WR for issue #${{ env.ISSUE_NUMBER }}

          - Initial WR document created from template
          - Includes Jules research findings
          - Ready for refinement and implementation

          Issue: #${{ env.ISSUE_NUMBER }}"
      - name: Push branch
        id: push
        run: |
          git push -u origin "${{ steps.create_branch.outputs.BRANCH_NAME }}"
          echo "Pushed branch: ${{ steps.create_branch.outputs.BRANCH_NAME }}"
      - name: Create Pull Request
        id: create_pr
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const branchName = '${{ steps.create_branch.outputs.BRANCH_NAME }}';
            const issueTitle = (process.env.ISSUE_TITLE || '').replace(/^\[WR\]\s*/i, '');

            const prTitle = `[WR] ${issueTitle}`;

            const prBody = `## Weekly Research (WR) - Ready for Jules Rewrite

            This PR contains the initial WR (Weekly Research) document for issue #${issueNumber}.

            ### 📋 Research Summary

            The deep research phase has been completed by Jules and documented in this PR. The WR document includes:

            - ✅ Repository review (AGENTS.md, skills/, standards/, templates/, .github/)
            - ✅ Cross-repository consistency check
            - ✅ Skills vault review
            - ✅ External tools/extensions research
            - ✅ Compliance with Prime Directive

            ### 🎯 Next Steps

            **Jules:** Please review and rewrite this WR document to:
            1. Refine the research findings for clarity and actionability
            2. Ensure all recommendations are specific and implementable
            3. Add any missing context or considerations
            4. Structure the content for maximum impact

            ### 📁 Files Changed

            - \`${process.env.WR_FILE}\` - Initial WR document with research findings

            ### 🔗 Related

            Closes #${issueNumber}

            ---

            **Workflow:** \`.github/workflows/wr-pr-creation.yml\`
            **Jules Rewrite:** Requested via \`jules\` label
            **Status:** 🟡 Awaiting Jules refinement`;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: prTitle,
              body: prBody,
              head: branchName,
              base: 'main',
            });

            core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            core.setOutput('pr_number', pr.number);
            core.setOutput('pr_url', pr.html_url);

            return { number: pr.number, url: pr.html_url };
      - name: Apply labels to PR
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = parseInt('${{ env.ISSUE_NUMBER }}', 10);
            const prNumber = parseInt('${{ steps.create_pr.outputs.pr_number }}', 10);
            const normalizeLabel = (label) => typeof label === 'string' ? label : label.name;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const inferTitleOutputType = (title) => {
              const normalizedTitle = String(title || '').toLowerCase();
              if (/(?:^|[^a-z0-9])#apps?\b/.test(normalizedTitle)) return 'production-app';
              if (/(?:^|[^a-z0-9])#tools?\b/.test(normalizedTitle)) return 'desktop-tool';
              if (/(?:^|[^a-z0-9])#pdf\b/.test(normalizedTitle)) return 'sellable-pdf';
              if (/(?:^|[^a-z0-9])#api\b/.test(normalizedTitle)) return 'api-product';
              if (/(?:^|[^a-z0-9])#cli\b/.test(normalizedTitle)) return 'cli-product';
              if (/(?:^|[^a-z0-9])#mcp\b/.test(normalizedTitle)) return 'mcp-product';
              if (/(?:^|[^a-z0-9])#docs?\b/.test(normalizedTitle)) return 'technical-documentation';
              if (/(?:^|[^a-z0-9])#skills?\b/.test(normalizedTitle)) return 'internal-script-automation';
              if (/(?:^|[^a-z0-9])#website\b/.test(normalizedTitle)) return 'production-app';
              return '';
            };

            // Parse Output Type from issue body to determine deliver label.
            // Title-only intake can fall back to route tags like "#app" / "#tools".
            const outputTypeMatch = (issue.body || '').match(/###\s*Output Type[^\n]*\n+([^\n#]+)/i);
            // RECONSTRUCTED 2026-07-08 (standards/GREEN_MAIN_STANDARD.md): six
            // generations of this title-tag fallback were stacked here, redeclaring
            // outputTypeMatch/outputTypeRaw until the block did not compile. One
            // generation's real improvement is kept: issue forms render an empty
            // dropdown as the literal '_No response_', which must count as blank.
            const outputTypeFromBody = (outputTypeMatch?.[1] || '').trim().toLowerCase();
            const outputTypeRaw =
              outputTypeFromBody && outputTypeFromBody !== '_no response_'
                ? outputTypeFromBody
                : inferTitleOutputType(issue.title || '');
            const OUTPUT_TYPE_DELIVER_MAP = {
              'production-app': 'deliver:app',
              'desktop-tool': 'deliver:app',
              'app': 'deliver:app',
              'web-app': 'deliver:app',
              'sellable-pdf': 'deliver:pdf',
              'pdf': 'deliver:pdf',
              'technical-documentation': 'deliver:docs',
              'project-management-doc': 'deliver:docs',
              'invention-flow': 'deliver:docs',
              'docs': 'deliver:docs',
              'documentation': 'deliver:docs',
              'api-product': 'deliver:api',
              'api': 'deliver:api',
              'cli-product': 'deliver:cli',
              'cli-tool': 'deliver:cli',
              'internal-script-automation': 'deliver:cli',
              'cli': 'deliver:cli',
              'docker': 'deliver:docker',
              'client-code-task': 'deliver:package',
              'mcp-product': 'deliver:mcp',
              'mcp-server': 'deliver:mcp',
              'mcp': 'deliver:mcp',
              'video': 'deliver:video',
            };
            const deliverLabel = OUTPUT_TYPE_DELIVER_MAP[outputTypeRaw];
            if (deliverLabel) {
              core.info(`Output Type "${outputTypeRaw}" → auto-applying label: ${deliverLabel}`);
            } else if (outputTypeRaw) {
              core.info(`Output Type "${outputTypeRaw}" has no deliver label mapping — skipping auto-deliver label`);
            }

            const labels = Array.from(new Set([
              'documentation',
              ...(deliverLabel ? [deliverLabel] : []),
              ...((issue.labels || [])
                .map(normalizeLabel)
                .filter(label =>
                  label === 'weekly-research' ||
                  label === 'work-request' ||
                  label === 'deep-research' ||
                  label === 'openrouter' ||
                  label === 'role:orchestrator' ||
                  label === 'jules' ||
                  label === 'bito-ai' ||
                  label === 'awaiting-review' ||
                  label === 'wr:in-progress' ||
                  label === 'research-engine' ||
                  label.startsWith('research:')
                ))
            ]));

            // BATCH: add all labels in a single API call for efficiency
            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: labels,
                });
                core.info(`Added ${labels.length} labels to PR`);
              } catch (error) {
                core.notice(`Could not add labels: ${error.message}`);
              }
            }
      - name: Request Jules review
        if: env.JULES_API_KEY != ''
        uses: BeksOmega/jules-action@v1.0.0
        with:
          prompt: |
            Please review and rewrite the WR document in PR #${{ steps.create_pr.outputs.pr_number }}.

            Your task:
            1. Review the research findings already documented
            2. Refine and restructure the content for clarity
            3. Ensure all recommendations are actionable and specific
            4. Add implementation steps where appropriate
            5. Verify compliance with revvel-standards requirements
            6. Update the WR status to "✅ Complete" when done

            Follow the WR template structure and ensure the final document is ship-to-market ready.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ steps.create_branch.outputs.BRANCH_NAME }}
      - name: Comment on issue
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const prNumber = parseInt('${{ steps.create_pr.outputs.pr_number }}', 10);
            const prUrl = '${{ steps.create_pr.outputs.pr_url }}';

            const comment = `🎉 **WR PR Created!**

            I've created a pull request with the initial WR document based on the research findings.

            **PR:** #${prNumber}  
            **Branch:** \`${{ steps.create_branch.outputs.BRANCH_NAME }}\`  
            **Status:** 🟡 Awaiting Jules refinement

            ### What's next?

            1. **Jules will review and rewrite** the WR document to refine the research findings
            2. **You can review** the PR and provide feedback
            3. **Once approved**, the WR will be merged and marked as complete

            [View the PR →](${prUrl})

            ---

            _Automated by \`.github/workflows/wr-pr-creation.yml\`_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment,
            });
      - name: Update issue labels
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            // Add in-review label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['in-review'],
            });

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            // Remove completion and auto-healer labels once the PR exists so
            // the issue no longer appears stuck after recovery.
            // `wr:reset` is also removed here so it can be re-applied cleanly
            // on the next manual or self-heal reset.
            const labelsToRemove = currentLabels
              .map(label => label.name)
              .filter(name =>
                name === 'wr:complete' ||
                name === 'wr:reset' ||
                name === 'lifecycle:stuck' ||
                name === 'wr-stuck' ||
                name.startsWith('wr:retrigger-attempts-')
              );

            for (const name of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name,
              }).catch(err => { if (err.status !== 404) throw err; });
              core.info(`Removed recovered WR label: ${name}`);
            }
      - name: Handle workflow failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            
            const comment = [
              '❌ **WR PR Creation Failed**',
              '',
              `The WR PR creation workflow encountered an error while trying to create a PR for this issue.`,
              '',
              '**What happened:**',
              '- Workflow started successfully',
              '- One or more steps failed during PR creation',
              '',
              '**Next steps:**',
              `1. Check the [workflow run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details`,
              '2. Common issues:',
              '   - Branch name conflicts',
              '   - Git push failures',
              '   - API rate limits',
              '   - Missing permissions',
              '3. The stuck-WR detector will retry automatically',
              '',
              `**Workflow run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_This workflow will be retriggered by `.github/workflows/stuck-wr-detector.yml`._',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
              core.notice(`Posted failure notification on issue #${issueNumber}`);
            } catch (error) {
              core.warning(`Failed to post failure notification: ${error.message}`);
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
