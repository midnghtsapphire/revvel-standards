# WR PR Creation Workflow
#
# Creates PRs for work-request issues via the agent pipeline (OpenRouter default,
# OpenHands fallback). Triggered when issues are opened, reopened, or labeled
# with a WR routing label.
#
# QUIET-MODE HISTORY (2026-07-25): Triggers were disabled by PR #16805 (quiet
# mode). Per DECISIONS.md D017 (2026-08-08 owner directive), triggers restored
# to pre-#16805 state. Issue #17099 is the standing Quiet Mode gate signal per
# wr/specs/01-quiet-mode.md — do NOT close it.
# ARCHIVE (RVS-PRESERVE-001): prior quiet-mode-only trigger was
# `on: { workflow_dispatch: {} }` (author: quiet-mode-agent, 2026-07-25).

name: WR PR Creation

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: wr-pr-creation-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run WR PR creation pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          if [ -f scripts/wr-pr-creation.js ]; then
            node scripts/wr-pr-creation.js || echo "::warning::wr-pr-creation exited non-zero"
          else
            echo "::notice::scripts/wr-pr-creation.js not present; skipping"
          fi

      - name: Clean up routing label
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue?.number
              || Number(context.payload.inputs?.issue_number);
            if (!issueNumber) return;
            // LABEL-RACE-001: swallow 404s if the label was already removed
            // by a concurrent workflow.
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'wr:pending',
            }).catch((e) => {
              if (e.status === 404) return;
              throw e;
            });
