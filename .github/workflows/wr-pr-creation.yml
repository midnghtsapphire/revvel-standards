name: WR PR Creation
on:
  issue_comment:
    types:
      - created
  issues:
    types:
      - opened
      - reopened
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to create WR PR for
        required: true
        type: number
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: wr-pr-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false
jobs:
  detect-completion:
    name: Detect WR issue / Jules research completion
    runs-on: ubuntu-latest
    if: |-
      !(github.event_name == 'issue_comment' &&
        github.event.issue.pull_request) &&
      !(github.event_name == 'issues' &&
        github.event.issue.user.login == 'github-actions[bot]' &&
        (startsWith(github.event.issue.title, '[FAILURE]') ||
         startsWith(github.event.issue.title, '[ALERT]')))
    outputs:
      should_create_pr: ${{ steps.check.outputs.should_create_pr }}
      should_notify_skip: ${{ steps.check.outputs.should_notify_skip }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
      issue_number: ${{ steps.check.outputs.issue_number }}
      issue_title: ${{ steps.check.outputs.issue_title }}
      issue_body: ${{ steps.check.outputs.issue_body }}
    steps:
      - name: Check if PR should be created
        id: check
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.inputs?.issue_number;
            function skip(reason, { notify = context.eventName !== 'issue_comment' } = {}) {
              core.info(`Skipping WR PR creation: ${reason}`);
              core.setOutput('should_create_pr', 'false');
              core.setOutput('should_notify_skip', notify ? 'true' : 'false');
              core.setOutput('skip_reason', reason);
            }

            if (!issueNumber) {
              core.notice('No issue number found');
              skip('no_issue_number', { notify: false });
              return;
            }

            const commentBody = context.payload.comment?.body || '';
            const commentAuthor = context.payload.comment?.user?.login || '';
            const operationalCommentMarkers = [
              'WR PR Creation Failed',
              'WR PR Creation: Skipped',
              'WR PR Created!',
            ];
            const isOperationalBotComment =
              context.eventName === 'issue_comment' &&
              commentAuthor === 'github-actions[bot]' &&
              operationalCommentMarkers.some(marker => commentBody.includes(marker));
            if (isOperationalBotComment) {
              skip('operational_bot_comment', { notify: false });
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const title = issue.title || '';
            const body = issue.body || '';
            const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
            const labelSet = new Set(labels);
            const rawIssueType = issue.type || context.payload.issue?.type;
            const issueType = typeof rawIssueType === 'string' ? rawIssueType : (rawIssueType?.name || '');
            const normalizedIssueType = issueType.trim().toLowerCase();

            // Check if this is a WR issue. GitHub issue templates, GitHub issue
            // types, and API-created issues do not always arrive with the same
            // labels, so accept every canonical WR signal before normalizing labels.
            const isWR =
              title.match(/^\[WR\]/i) ||
              labelSet.has('weekly-research') ||
              labelSet.has('work-request') ||
              ['basic wr', 'wr', 'work request'].includes(normalizedIssueType);
            if (!isWR) {
              core.info(`Issue #${issueNumber} is not a WR issue`);
              skip('not_wr_issue');
              return;
            }

            // Skip bot-created issues (defensive — bot-spam should be filtered
            // by the job-level `if:` already).
            if (issue.user && issue.user.login === 'github-actions[bot]') {
              core.info(`Issue #${issueNumber} is bot-created; skipping.`);
              skip('bot_created_issue');
              return;
            }

            // Normalize labels immediately so BASIC WR / issue-type intake cannot
            // get stuck waiting for another workflow to add the routing labels.
            const requiredWrLabels = [
              'work-request',
              'weekly-research',
              'wr:in-progress',
              'deep-research',
              'openrouter',
              'role:orchestrator',
            ];
            for (const label of requiredWrLabels) {
              if (labelSet.has(label)) continue;
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label],
                });
                labelSet.add(label);
                core.info(`Normalized missing WR label: ${label}`);
              } catch (error) {
                core.notice(`Could not normalize WR label "${label}": ${error.message}`);
              }
            }

            // Check if a WR-skeleton PR already exists for this issue.
            //
            // DEVIN-RESTRUCTURE 2026-05-06: tightened the dedup match. The
            // previous logic matched ANY open OR closed PR that mentioned
            // `Closes #${issueNumber}` ANYWHERE in its body, OR whose title
            // happened to contain the WR-stripped title substring. Both are
            // false-positive prone: a hardening PR that fixes a chronic
            // workflow bug can legitimately close a stuck-WR issue without
            // BEING the WR's skeleton PR (e.g. #13352 closed #13347 by
            // shipping the auto-heal fix; that does NOT mean a WR-skeleton
            // PR exists for #13347 — quite the opposite).
            //
            // The right signal: this exact workflow always applies the
            // labels `weekly-research`, `jules`, `documentation`,
            // `wr:in-progress` to its created PR (see the "Apply labels to
            // PR" step ~30 lines below). Match those instead. We require
            // BOTH the issue-reference AND the `weekly-research` label so
            // the dedup is correct even if a different workflow ever
            // applied one of the others.
            //
            // Search OPEN PRs only — a previously-closed/merged WR-skeleton
            // PR doesn't block a fresh WR-skeleton PR; that's a re-trigger
            // of the same WR after the original was abandoned.
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const issueRefRegex = new RegExp(
              `(closes|fixes|resolves)\\s+#${issueNumber}\\b`,
              'i'
            );
            const existingPR = prs.find(pr => {
              const prLabels = (pr.labels || []).map(l => typeof l === 'string' ? l : l.name);
              const isWrSkeleton =
                prLabels.includes('weekly-research') &&
                prLabels.includes('wr:in-progress');
              const refsThisIssue = pr.body && issueRefRegex.test(pr.body);
              return isWrSkeleton && refsThisIssue;
            });

            if (existingPR) {
              core.info(`WR-skeleton PR already exists for issue #${issueNumber}: ${existingPR.html_url}`);
              skip('existing_wr_pr');
              return;
            }

            const isComplete =
              labelSet.has('wr:complete') ||
              labelSet.has('research:complete') ||
              context.eventName === 'workflow_dispatch';

            // Treat both direct research findings and the research-engine handoff
            // packet comment as valid completion signals for WR generation.
            let researchReadyComment = false;
            if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment;
              const commentBody = comment?.body || '';
              if (
                commentBody.includes('Research Findings:') ||
                commentBody.includes('## Research Findings') ||
                commentBody.includes('## Research Engine Review Request') ||
                commentBody.includes('Research packet:')
              ) {
                researchReadyComment = true;
              }
            }

            const shouldCreate = isComplete || researchReadyComment;

            core.info(`Issue #${issueNumber}: "${title}"`);
            core.info(`Is WR: ${isWR}`);
            core.info(`Is Complete: ${isComplete}`);
            core.info(`Research-ready comment: ${researchReadyComment}`);
            core.info(`Should Create PR: ${shouldCreate}`);
            core.info(`Issue type: ${issueType || '(none)'}`);
            core.info(`Current labels: ${Array.from(labelSet).join(', ')}`);

            core.setOutput('should_create_pr', shouldCreate ? 'true' : 'false');
            core.setOutput('should_notify_skip', shouldCreate || context.eventName === 'issue_comment' ? 'false' : 'true');
            core.setOutput('skip_reason', shouldCreate ? '' : 'trigger_not_ready');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', title);
            core.setOutput('issue_body', body);
    timeout-minutes: 30
  notify-skip:
    name: Notify if PR creation was skipped
    needs: detect-completion
    if: needs.detect-completion.outputs.should_create_pr != 'true' && needs.detect-completion.outputs.should_notify_skip == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post skip notification
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.inputs?.issue_number;
            if (!issueNumber) {
              core.notice('No issue number - cannot post skip notification');
              return;
            }

            const comment = [
              '⏭️ **WR PR Creation: Skipped**',
              '',
              'The WR PR creation workflow ran but determined that no PR should be created at this time.',
              '',
              '**Possible reasons:**',
              '- Issue is not a WR (missing `[WR]` prefix, `work-request` / `weekly-research` label, or BASIC WR issue type)',
              '- A WR-skeleton PR already exists for this issue',
              '- Issue is bot-created',
              '- Trigger condition not met (no `wr:complete` / `research:complete` label, manual dispatch, or research-ready comment)',
              '',
              `**Workflow run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_See `.github/workflows/wr-pr-creation.yml` for PR creation logic._',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
              core.notice(`Posted skip notification on issue #${issueNumber}`);
            } catch (error) {
              core.warning(`Failed to post skip notification: ${error.message}`);
            }
    timeout-minutes: 5
  create-wr-pr:
    name: Create WR PR
    needs: detect-completion
    if: needs.detect-completion.outputs.should_create_pr == 'true'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.detect-completion.outputs.issue_number }}
      ISSUE_TITLE: ${{ needs.detect-completion.outputs.issue_title }}
      ISSUE_BODY: ${{ needs.detect-completion.outputs.issue_body }}
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Log workflow trigger
        run: |
          echo "::notice::WR PR Creation triggered for issue #${{ env.ISSUE_NUMBER }}"
          echo "::notice::Event: ${{ github.event_name }}"
          echo "::notice::Action: ${{ github.event.action }}"
          echo "::notice::Issue Title: ${{ env.ISSUE_TITLE }}"
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
      - name: Get issue comments for research findings
        id: get_findings
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            let comments = []; try { const { data } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            }); comments = data; } catch (e) { console.log(`⚠️ error getting comments: ${e.message}`); }

            function findLatestComment(predicate) {
              for (let index = comments.length - 1; index >= 0; index -= 1) {
                if (predicate(comments[index])) {
                  return comments[index];
                }
              }
              return null;
            }

            // Prefer the newest direct findings comment when available.
            const findingsComment = findLatestComment(c => 
              c.body && (
                c.body.includes('Research Findings:') ||
                c.body.includes('## Research Findings') ||
                c.body.includes('Executive Summary')
              )
            );

            const findings = findingsComment ? findingsComment.body : '';
            let resolvedFindings = findings;

            if (!resolvedFindings) {
              const packetComment = findLatestComment(c =>
                c.body &&
                c.body.includes('## Research Engine Review Request') &&
                c.body.includes('Research packet:')
              );
              const packetPath = packetComment?.body?.match(/Research packet:\s*`([^`]+)`/)?.[1];

              if (packetPath) {
                try {
                  const { data: repoData } = await github.rest.repos.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                  });
                  const { data: packetFile } = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: packetPath,
                    ref: repoData.default_branch,
                  });
                  const packetText = Buffer.from(packetFile.content || '', 'base64').toString('utf8');
                  const SYNTHESIS_SECTION_REGEX = /## Synthesis[\s\S]*?(?=\n## Code Review Handoff\b|$)/;
                  // Keep only the packet synthesis block so the WR gets the
                  // decision-ready research summary without duplicating the
                  // handoff checklist footer. The packet structure is defined
                  // by `scripts/research-engine.js` and ends the synthesis
                  // section at `## Code Review Handoff`.
                  const synthesis = packetText.match(SYNTHESIS_SECTION_REGEX)?.[0]?.trim();
                  resolvedFindings = [
                    '## Research Findings',
                    '',
                    `_Imported from research packet \`${packetPath}\`._`,
                    '',
                    synthesis || packetText.trim(),
                  ].join('\n');
                  core.info(`Loaded research packet: ${packetPath}`);
                } catch (error) {
                  core.notice(`Could not load research packet "${packetPath}": ${error.message}`);
                }
              }
            }

            core.info(`Found research findings: ${resolvedFindings.length} characters`);

            // Save to file for next step
            const fs = require('fs');
            fs.writeFileSync('research-findings.md', resolvedFindings, 'utf8');

            return resolvedFindings.substring(0, 1000); // Return preview
      - name: Create WR branch
        id: create_branch
        run: |
          # Clean title for branch name
          CLEAN_TITLE=$(printf '%s' "${ISSUE_TITLE}" | sed 's/\[WR\]//gi' | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/^-*//;s/-*$//')
          BASE_BRANCH_NAME="wr/issue-${ISSUE_NUMBER}-${CLEAN_TITLE:0:50}"
          BRANCH_NAME="${BASE_BRANCH_NAME}"

          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            BRANCH_NAME="${BASE_BRANCH_NAME}-${GITHUB_RUN_ID}"
            echo "::notice::Base WR branch already exists; using ${BRANCH_NAME}"
          fi

          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH_NAME}"
          echo "Created branch: ${BRANCH_NAME}"
      - name: Generate WR document
        run: |
          # Create WR directory if it doesn't exist
          mkdir -p wr/issues

          # Generate WR filename
          CLEAN_TITLE=$(printf '%s' "${ISSUE_TITLE}" | sed 's/\[WR\]//gi' | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/^-*//;s/-*$//')
          WR_FILE="wr/issues/issue-${ISSUE_NUMBER}-${CLEAN_TITLE:0:50}.md"

          echo "WR_FILE=${WR_FILE}" >> "$GITHUB_ENV"

          # Copy the canonical WR template. The old path, wr/WR_TEMPLATE.md,
          # was removed when the WR template set was split into BASIC/FULL.
          TEMPLATE_FILE=""
          for candidate in wr/WR_TEMPLATE_FULL.md wr/WR_TEMPLATE_BASIC.md WR_TEMPLATE_FULL.md WR_TEMPLATE_BASIC.md; do
            if [ -f "$candidate" ]; then
              TEMPLATE_FILE="$candidate"
              break
            fi
          done

          if [ -z "$TEMPLATE_FILE" ]; then
            echo "::error::No WR template found. Expected wr/WR_TEMPLATE_FULL.md or wr/WR_TEMPLATE_BASIC.md."
            exit 1
          fi

          cp "${TEMPLATE_FILE}" "${WR_FILE}"
          echo "Using WR template: ${TEMPLATE_FILE}"

          # Replace placeholders with actual values without depending on sed
          # delimiter escaping for issue titles/bodies.
          export WR_FILE ISSUE_TITLE ISSUE_BODY
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import re

          wr_file = pathlib.Path(os.environ["WR_FILE"])
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          clean_title = re.sub(r"^\[WR\]\s*", "", title, flags=re.IGNORECASE).strip() or title
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          replacements = {
              "{REPO_NAME}": "midnghtsapphire/revvel-standards",
              "{REPO_URL}": "https://github.com/midnghtsapphire/revvel-standards",
              "{CREATED_DATE}": today,
              "{UPDATED_DATE}": today,
              "{RESEARCH_DATE}": today,
              "{PRIMARY_LANGUAGE}": "JavaScript",
              "{TITLE}": clean_title,
              "{DESCRIPTION}": body,
          }
          text = wr_file.read_text(encoding="utf8")
          for key, value in replacements.items():
              text = text.replace(key, value)
          wr_file.write_text(text, encoding="utf8")
          PY

          # Insert issue information at the top
          cat > temp_header.md <<EOF
          # WR: ${{ env.ISSUE_TITLE }}

          **Issue:** #${{ env.ISSUE_NUMBER }}  
          **Repository:** [midnghtsapphire/revvel-standards](https://github.com/midnghtsapphire/revvel-standards)  
          **Research Date:** $(date -u +%Y-%m-%d)  
          **Researcher:** Jules (Google) + OpenRouter  
          **WR Status:** 🟡 In Progress

          ---

          EOF

          # Append research findings if they exist
          if [ -f research-findings.md ] && [ -s research-findings.md ]; then
            echo "" >> temp_header.md
            cat research-findings.md >> temp_header.md
            echo "" >> temp_header.md
            echo "---" >> temp_header.md
            echo "" >> temp_header.md
          fi

          OUTPUT_TYPE=$(printf '%s\n' "$ISSUE_BODY" | awk '/^### Output Type$/ { found=1; next } found && NF { print; exit }' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r')
          tail -n +10 "${WR_FILE}" >> temp_header.md

          mv temp_header.md "${WR_FILE}"

          # Read Output Type from issue body and skip app scaffolding if it's a PDF/doc
          OUTPUT_TYPE=$(printf '%s\n' "${ISSUE_BODY}" | awk '
            BEGIN { found = 0 }
            /(^|[ \t])### Output Type/ { found = 1; next }
            found && /(^|[ \t])### / { exit }
            found && NF { gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit }
          ' | tr -d '\r')

          if [[ "$OUTPUT_TYPE" == "sellable-pdf" || "$OUTPUT_TYPE" == "technical-documentation" || "$OUTPUT_TYPE" == "project-management-doc" ]]; then
            echo "Output Type is $OUTPUT_TYPE — stripping app deployment scaffolding from WR document."
            sed -i '/## Step 5: Deployment Verification/,/## Step 6: Documentation Requirements/{/## Step 6: Documentation Requirements/!d}' "${WR_FILE}"
            sed -i '/### Deployment Section/,/### Additional Documentation/{/### Additional Documentation/!d}' "${WR_FILE}"
          fi

          echo "Generated WR document: ${WR_FILE}"
      - name: Commit WR document
        run: |
          git add "${WR_FILE}"
          git add wr/issues/ || true

          git commit -m "docs(wr): create WR for issue #${{ env.ISSUE_NUMBER }}

          - Initial WR document created from template
          - Includes Jules research findings
          - Ready for refinement and implementation

          Issue: #${{ env.ISSUE_NUMBER }}"
      - name: Push branch
        id: push
        run: |
          git push -u origin "${{ steps.create_branch.outputs.BRANCH_NAME }}"
          echo "Pushed branch: ${{ steps.create_branch.outputs.BRANCH_NAME }}"
      - name: Create Pull Request
        id: create_pr
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const branchName = '${{ steps.create_branch.outputs.BRANCH_NAME }}';
            const issueTitle = (process.env.ISSUE_TITLE || '').replace(/^\[WR\]\s*/i, '');

            const prTitle = `[WR] ${issueTitle}`;

            const prBody = `## Weekly Research (WR) - Ready for Jules Rewrite

            This PR contains the initial WR (Weekly Research) document for issue #${issueNumber}.

            ### 📋 Research Summary

            The deep research phase has been completed by Jules and documented in this PR. The WR document includes:

            - ✅ Repository review (AGENTS.md, skills/, standards/, templates/, .github/)
            - ✅ Cross-repository consistency check
            - ✅ Skills vault review
            - ✅ External tools/extensions research
            - ✅ Compliance with Prime Directive

            ### 🎯 Next Steps

            **Jules:** Please review and rewrite this WR document to:
            1. Refine the research findings for clarity and actionability
            2. Ensure all recommendations are specific and implementable
            3. Add any missing context or considerations
            4. Structure the content for maximum impact

            ### 📁 Files Changed

            - \`${process.env.WR_FILE}\` - Initial WR document with research findings

            ### 🔗 Related

            Closes #${issueNumber}

            ---

            **Workflow:** \`.github/workflows/wr-pr-creation.yml\`
            **Jules Rewrite:** Requested via \`jules\` label
            **Status:** 🟡 Awaiting Jules refinement`;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: prTitle,
              body: prBody,
              head: branchName,
              base: 'main',
            });

            core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            core.setOutput('pr_number', pr.number);
            core.setOutput('pr_url', pr.html_url);

            return { number: pr.number, url: pr.html_url };
      - name: Apply labels to PR
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = parseInt('${{ env.ISSUE_NUMBER }}', 10);
            const prNumber = parseInt('${{ steps.create_pr.outputs.pr_number }}', 10);
            const normalizeLabel = (label) => typeof label === 'string' ? label : label.name;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            // Parse Output Type from issue body to determine deliver label
            const outputTypeMatch = (issue.body || '').match(/###\s*Output Type[^\n]*\n+([^\n#]+)/i);
            const outputTypeRaw = (outputTypeMatch?.[1] || '').trim().toLowerCase();
            const OUTPUT_TYPE_DELIVER_MAP = {
              'production-app': 'deliver:app',
              'desktop-tool': 'deliver:app',
              'app': 'deliver:app',
              'web-app': 'deliver:app',
              'sellable-pdf': 'deliver:pdf',
              'pdf': 'deliver:pdf',
              'technical-documentation': 'deliver:docs',
              'project-management-doc': 'deliver:docs',
              'invention-flow': 'deliver:docs',
              'docs': 'deliver:docs',
              'documentation': 'deliver:docs',
              'api-product': 'deliver:api',
              'api': 'deliver:api',
              'cli-product': 'deliver:cli',
              'cli-tool': 'deliver:cli',
              'internal-script-automation': 'deliver:cli',
              'cli': 'deliver:cli',
              'docker': 'deliver:docker',
              'client-code-task': 'deliver:package',
              'mcp-product': 'deliver:mcp',
              'mcp-server': 'deliver:mcp',
              'mcp': 'deliver:mcp',
              'video': 'deliver:video',
            };
            const deliverLabel = OUTPUT_TYPE_DELIVER_MAP[outputTypeRaw];
            if (deliverLabel) {
              core.info(`Output Type "${outputTypeRaw}" → auto-applying label: ${deliverLabel}`);
            } else if (outputTypeRaw) {
              core.info(`Output Type "${outputTypeRaw}" has no deliver label mapping — skipping auto-deliver label`);
            }

            const labels = Array.from(new Set([
              'documentation',
              ...(deliverLabel ? [deliverLabel] : []),
              ...((issue.labels || [])
                .map(normalizeLabel)
                .filter(label =>
                  label === 'weekly-research' ||
                  label === 'work-request' ||
                  label === 'deep-research' ||
                  label === 'openrouter' ||
                  label === 'role:orchestrator' ||
                  label === 'jules' ||
                  label === 'bito-ai' ||
                  label === 'awaiting-review' ||
                  label === 'wr:in-progress' ||
                  label === 'research-engine' ||
                  label.startsWith('research:')
                ))
            ]));

            for (const label of labels) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: [label],
                });
                core.info(`Added label: ${label}`);
              } catch (error) {
                core.notice(`Could not add label "${label}": ${error.message}`);
              }
            }
      - name: Request Jules review
        if: env.JULES_API_KEY != ''
        uses: BeksOmega/jules-action@v1.0.0
        with:
          prompt: |
            Please review and rewrite the WR document in PR #${{ steps.create_pr.outputs.pr_number }}.

            Your task:
            1. Review the research findings already documented
            2. Refine and restructure the content for clarity
            3. Ensure all recommendations are actionable and specific
            4. Add implementation steps where appropriate
            5. Verify compliance with revvel-standards requirements
            6. Update the WR status to "✅ Complete" when done

            Follow the WR template structure and ensure the final document is ship-to-market ready.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ steps.create_branch.outputs.BRANCH_NAME }}
      - name: Comment on issue
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const prNumber = parseInt('${{ steps.create_pr.outputs.pr_number }}', 10);
            const prUrl = '${{ steps.create_pr.outputs.pr_url }}';

            const comment = `🎉 **WR PR Created!**

            I've created a pull request with the initial WR document based on the research findings.

            **PR:** #${prNumber}  
            **Branch:** \`${{ steps.create_branch.outputs.BRANCH_NAME }}\`  
            **Status:** 🟡 Awaiting Jules refinement

            ### What's next?

            1. **Jules will review and rewrite** the WR document to refine the research findings
            2. **You can review** the PR and provide feedback
            3. **Once approved**, the WR will be merged and marked as complete

            [View the PR →](${prUrl})

            ---

            _Automated by \`.github/workflows/wr-pr-creation.yml\`_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment,
            });
      - name: Update issue labels
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            // Add in-review label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['in-review'],
            });

            let currentLabels = []; try { const { data } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            }); currentLabels = data.map(l => l.name); } catch (e) { console.log(`⚠️ error getting labels: ${e.message}`); }

            // Remove completion and auto-healer labels once the PR exists so
            // the issue no longer appears stuck after recovery.
            const labelsToRemove = currentLabels
              .map(label => label.name)
              .filter(name =>
                name === 'wr:complete' ||
                name === 'lifecycle:stuck' ||
                name === 'wr-stuck' ||
                name.startsWith('wr:retrigger-attempts-')
              );

            for (const name of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name,
                });
                core.info(`Removed recovered WR label: ${name}`);
              } catch (error) {
                core.notice(`Could not remove label "${name}": ${error.message}`);
              }
            }
      - name: Handle workflow failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            
            const comment = [
              '❌ **WR PR Creation Failed**',
              '',
              `The WR PR creation workflow encountered an error while trying to create a PR for this issue.`,
              '',
              '**What happened:**',
              '- Workflow started successfully',
              '- One or more steps failed during PR creation',
              '',
              '**Next steps:**',
              `1. Check the [workflow run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details`,
              '2. Common issues:',
              '   - Branch name conflicts',
              '   - Git push failures',
              '   - API rate limits',
              '   - Missing permissions',
              '3. The stuck-WR detector will retry automatically',
              '',
              `**Workflow run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_This workflow will be retriggered by `.github/workflows/stuck-wr-detector.yml`._',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
              core.notice(`Posted failure notification on issue #${issueNumber}`);
            } catch (error) {
              core.warning(`Failed to post failure notification: ${error.message}`);
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
