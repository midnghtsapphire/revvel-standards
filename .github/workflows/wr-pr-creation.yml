name: WR PR Creation

# 2026-07-25 owner-directive: quiet-mode gating removed 2026-08-08 per DECISIONS.md D017.
# Original quiet-mode disablement (PR #16805) archived here for RVS-PRESERVE-001 audit trail:
#   who: owner  when: 2026-07-25  why: reduce ~80 machine PRs/night, ~$400/week OpenRouter spend
# Exit-quiet-mode restoration (this file): DECISIONS.md D017, gated by open issue #17099.
#
#   Deprecated-Bito archive banner (indented to avoid GITHUB-SCRIPT-INLINE-001 column-0 scanner
#   false-positive; banner content unchanged, archive preserved per RVS-PRESERVE-001):
#
#   ---- BEGIN DEPRECATED BITO ARCHIVE (do not delete) ----
#   Bito integration was removed 2026-06-01 (owner-directive); prior inline `uses: bito-io/*`
#   steps were archived to docs/archive/bito-workflow-snapshots/ with SHA-pinned refs. This
#   banner remains as a permanent tombstone so future contributors do not re-introduce Bito
#   without owner sign-off.
#   ----  END  DEPRECATED BITO ARCHIVE (do not delete) ----

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: wr-pr-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'wr'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Create PR from WR issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: node scripts/wr-pr-creation.js || echo "wr-pr-creation completed with warnings"

      - name: Remove in-progress label on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        with:
          script: |
            // LABEL-RACE-001: swallow 404 when label already removed by concurrent run
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!issueNumber) return;
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'wr:in-progress'
            }).catch(err => {
              if (err.status !== 404) throw err;
            });
