name: 🚀 Ship to Market
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: >
          Delivery channel to run
          (api | app | mobile | android | ios | pdf | cli | package | docker | mcp |
          docs | video | extension | vscode | action | openapi | migration |
          marketplace | all)
        required: true
        default: all
permissions:
  contents: read
  issues: write
  pull-requests: write
  packages: write
env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  PRIMARY_MODEL: anthropic/claude-3.7-sonnet
  FALLBACK_MODEL: google/gemini-pro-1.5
  BUDGET_MODEL: deepseek/deepseek-chat
jobs:
  gate:
    name: 🔒 Merge Gate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true)
    outputs:
      run_api: ${{ steps.labels.outputs.api }}
      run_app: ${{ steps.labels.outputs.app }}
      run_mobile: ${{ steps.labels.outputs.mobile }}
      run_android: ${{ steps.labels.outputs.android }}
      run_ios: ${{ steps.labels.outputs.ios }}
      run_pdf: ${{ steps.labels.outputs.pdf }}
      run_cli: ${{ steps.labels.outputs.cli }}
      run_package: ${{ steps.labels.outputs.package }}
      run_docker: ${{ steps.labels.outputs.docker }}
      run_mcp: ${{ steps.labels.outputs.mcp }}
      run_docs: ${{ steps.labels.outputs.docs }}
      run_video: ${{ steps.labels.outputs.video }}
      run_extension: ${{ steps.labels.outputs.extension }}
      run_vscode: ${{ steps.labels.outputs.vscode }}
      run_action: ${{ steps.labels.outputs.action }}
      run_openapi: ${{ steps.labels.outputs.openapi }}
      run_migration: ${{ steps.labels.outputs.migration }}
      run_marketplace: ${{ steps.labels.outputs.marketplace }}
      issue_num: ${{ steps.meta.outputs.issue_num }}
    steps:
      - name: Parse delivery labels / dispatch input
        id: labels
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            LABELS="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
          else
            LABELS=""
          fi
          INPUT="${{ github.event.inputs.channel }}"
          ALL="$([[ "$INPUT" == "all" || "$LABELS" == *"deliver:all"* ]] && echo true || echo false)"
          INPUT="${{ github.event.inputs.channel }}"

          # Only access PR labels if this is a pull_request event
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            LABELS="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
          else
            LABELS=""
          fi

          ALL="$([[ $INPUT == 'all' || $LABELS == *'deliver:all'* ]] && echo
          true || echo false)"


          check() {
            local ch=$1
            if [[ $ALL == 'true' || $INPUT == $ch || $LABELS == *"deliver:$ch"* ]]; then
              echo "true"
            else
              echo "false"
            fi
          }


          echo "api=$(check api)"               >> $GITHUB_OUTPUT

          echo "app=$(check app)"               >> $GITHUB_OUTPUT

          echo "mobile=$(check mobile)"         >> $GITHUB_OUTPUT

          echo "android=$(check android)"       >> $GITHUB_OUTPUT

          echo "ios=$(check ios)"               >> $GITHUB_OUTPUT

          echo "pdf=$(check pdf)"               >> $GITHUB_OUTPUT

          echo "cli=$(check cli)"               >> $GITHUB_OUTPUT

          echo "package=$(check package)"       >> $GITHUB_OUTPUT

          echo "docker=$(check docker)"         >> $GITHUB_OUTPUT

          echo "mcp=$(check mcp)"               >> $GITHUB_OUTPUT

          echo "docs=$(check docs)"             >> $GITHUB_OUTPUT

          echo "video=$(check video)"           >> $GITHUB_OUTPUT

          echo "extension=$(check extension)"   >> $GITHUB_OUTPUT

          echo "vscode=$(check vscode)"         >> $GITHUB_OUTPUT

          echo "action=$(check action)"         >> $GITHUB_OUTPUT

          echo "openapi=$(check openapi)"       >> $GITHUB_OUTPUT

          echo "migration=$(check migration)"   >> $GITHUB_OUTPUT

          echo "marketplace=$(check marketplace)" >> $GITHUB_OUTPUT
      - name: Extract linked issue number
        id: meta
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUE=$(echo "$PR_BODY" | grep -oP '(?<=Closes #|Fixes #|Resolves #)\d+' | head -1 || echo "")

          echo "issue_num=$ISSUE" >> $GITHUB_OUTPUT
    timeout-minutes: 30
  deliver-api:
    name: 🔌 Deliver → API
    needs: gate
    if: needs.gate.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --if-present
      - name: Run build
        run: npm run build --if-present
      - name: Deploy API (Railway / Fly / Render)
        id: deploy
        run: >
          if command -v railway &>/dev/null; then
            railway up --detach
            echo "url=$(railway status --json | jq -r '.url')" >> $GITHUB_OUTPUT
          elif [[ -n "${{ secrets.FLY_API_TOKEN }}" ]]; then
            curl -fsSL https://fly.io/install.sh | sh
            flyctl deploy --remote-only
            echo "url=https://$(flyctl info --json | jq -r '.Hostname')" >> $GITHUB_OUTPUT
          else
            echo "url=NOT_DEPLOYED—add_RAILWAY_TOKEN_or_FLY_API_TOKEN_secret" >> $GITHUB_OUTPUT
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke-test deployed URL
        if: steps.deploy.outputs.url != '' && !contains(steps.deploy.outputs.url,
          'NOT_DEPLOYED')
        run: >
          URL="${{ steps.deploy.outputs.url }}"

          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL/health" || curl
          -o /dev/null -s -w "%{http_code}" "$URL")

          echo "HTTP $STATUS for $URL"

          [[ "$STATUS" =~ ^[23] ]] || exit 1
      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v9
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL || '';

            const body = url && url.includes('NOT_DEPLOYED')
              ? '⚠️ **API deliver skipped** — add `RAILWAY_TOKEN` or `FLY_API_TOKEN` to repo secrets.'
              : '✅ **API deployed** → ' + url;
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0, body
            });
    timeout-minutes: 30
  deliver-app:
    name: 🌐 Deliver → App
    needs: gate
    if: needs.gate.outputs.run_app == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --if-present && npm run build --if-present
      - name: Deploy to Vercel
        id: vercel
        if: env.VERCEL_TOKEN != ''
        run: >
          npm i -g vercel

          URL=$(vercel --prod --yes --token $VERCEL_TOKEN 2>&1 | grep -oP
          'https://[^\s]+' | tail -1)

          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to Netlify (fallback)
        id: netlify
        if: env.VERCEL_TOKEN == '' && env.NETLIFY_AUTH_TOKEN != ''
        run: >
          npm i -g netlify-cli

          URL=$(netlify deploy --prod --auth $NETLIFY_AUTH_TOKEN --site
          $NETLIFY_SITE_ID --dir ./dist 2>&1 | grep -oP 'https://[^\s]+' | tail
          -1)

          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        env:
          VERCEL_URL: ${{ steps.vercel.outputs.url }}
          NETLIFY_URL: ${{ steps.netlify.outputs.url }}
        with:
          script: |
            const url = process.env.VERCEL_URL || process.env.NETLIFY_URL || '';

            const body = url
              ? '✅ **App deployed** → ' + url
              : '⚠️ **App deploy skipped** — add `VERCEL_TOKEN` or `NETLIFY_AUTH_TOKEN` to secrets.';
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0, body
            });
    timeout-minutes: 30
  deliver-pdf:
    name: 📄 Deliver → PDF
    needs: gate
    if: needs.gate.outputs.run_pdf == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc + LaTeX
        run: sudo apt-get update -qq && sudo apt-get install -y pandoc texlive-xetex
          texlive-fonts-recommended
      - name: Convert docs to PDF
        id: build_pdf
        run: >
          mkdir -p dist/pdf

          FOUND=0

          for f in docs/*.md README.md CHANGELOG.md; do
            [[ -f "$f" ]] || continue
            NAME=$(basename "$f" .md)
            pandoc "$f" -o "dist/pdf/$NAME.pdf" --pdf-engine=xelatex -V geometry:margin=1in -V fontsize=11pt --toc 2>/dev/null && FOUND=$((FOUND+1)) || true
          done

          echo "count=$FOUND" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pdfs-${{ github.run_id }}
          path: dist/pdf/*.pdf
          retention-days: 30
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: >
            const count = '${{ steps.build_pdf.outputs.count }}';

            const run = '${{ github.run_id }}';

            const body = count > 0
              ? `✅ **PDF(s) generated** (${count} file(s)) → [Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${run})`
              : '⚠️ **PDF deliver** — no .md docs found. Add files to /docs/ or update source glob.';
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0, body
            });
    timeout-minutes: 30
  deliver-cli:
    name: 🖥️ Deliver → CLI (npm)
    needs: gate
    if: needs.gate.outputs.run_cli == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci --if-present && npm run build --if-present
      - name: Publish to npm
        id: publish
        run: >
          if [[ -z "${{ secrets.NPM_TOKEN }}" ]]; then
            echo "result=SKIPPED — add NPM_TOKEN secret" >> $GITHUB_OUTPUT
          else
            npm publish --access public 2>&1 | tail -5
            PKG=$(node -p "require('./package.json').name + '@' + require('./package.json').version" 2>/dev/null || echo "unknown")
            echo "result=Published $PKG" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: >
            const result = '${{ steps.publish.outputs.result }}';

            const ok = !result.includes('SKIPPED');

            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: ok ? `✅ **CLI published** → \`${result}\`` : `⚠️ **CLI publish skipped** — ${result}`
            });
    timeout-minutes: 30
  deliver-docker:
    name: 🐳 Deliver → Docker
    needs: gate
    if: needs.gate.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: >
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: `✅ **Docker image pushed** → \`ghcr.io/${{ github.repository }}:${{ github.sha }}\``
            });
    timeout-minutes: 30
  deliver-mcp:
    name: 🤖 Deliver → MCP Server
    needs: gate
    if: needs.gate.outputs.run_mcp == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --if-present && (npm run build:mcp --if-present || npm run build
          --if-present)
      - name: Deploy MCP server
        id: deploy_mcp
        run: >
          if [[ -n "${{ secrets.RAILWAY_TOKEN }}" ]]; then
            railway up --service mcp --detach 2>/dev/null || railway up --detach
            URL=$(railway status --json 2>/dev/null | jq -r '.url // empty' || echo "")
            echo "url=$URL" >> $GITHUB_OUTPUT
          else
            echo "url=NOT_DEPLOYED—add_RAILWAY_TOKEN" >> $GITHUB_OUTPUT
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Smoke-test /mcp endpoint
        if: "!contains(steps.deploy_mcp.outputs.url, 'NOT_DEPLOYED') &&
          steps.deploy_mcp.outputs.url != ''"
        run: >
          URL="${{ steps.deploy_mcp.outputs.url }}"

          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL/mcp" || curl -o
          /dev/null -s -w "%{http_code}" "$URL")

          echo "MCP smoke test HTTP $STATUS"

          [[ "$STATUS" =~ ^[23] ]] || exit 1
      - name: Validate mcp.json manifest
        run: >
          if [[ -f mcp.json ]]; then
            node -e "
              const m = require('./mcp.json');
              console.assert(m.name, 'mcp.json missing name');
              console.assert(Array.isArray(m.tools), 'mcp.json tools must be array');
              console.log('MCP manifest OK:', m.name, '—', m.tools.length, 'tool(s)');
            "
          fi
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        env:
          MCP_URL: ${{ steps.deploy_mcp.outputs.url }}
        with:
          script: |
            const url = process.env.MCP_URL || '';
            const body = url && !url.includes('NOT_DEPLOYED')
              ? '✅ **MCP server deployed** → ' + url + '/mcp'
              : '⚠️ **MCP deploy skipped** — add `RAILWAY_TOKEN` secret.';
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0, body
            });
    timeout-minutes: 30
  deliver-docs:
    name: 📚 Deliver → Docs Site
    needs: gate
    if: needs.gate.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Detect framework and build
        id: build_docs
        run: >
          if [[ -f mkdocs.yml ]]; then
            pip install mkdocs mkdocs-material 2>/dev/null
            mkdocs build --site-dir ./site
            echo "dir=site" >> $GITHUB_OUTPUT
          elif [[ -f docusaurus.config.js || -f docusaurus.config.ts ]]; then
            npm ci && npm run build
            echo "dir=build" >> $GITHUB_OUTPUT
          elif [[ -d docs ]]; then
            echo "dir=docs" >> $GITHUB_OUTPUT
          else
            mkdir -p site
            echo '<h1>Docs</h1><p>Add mkdocs.yml, docusaurus.config.js, or a /docs folder.</p>' > site/index.html
            echo "dir=site" >> $GITHUB_OUTPUT
          fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ steps.build_docs.outputs.dir }}
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const repo = '${{ github.repository }}'.split('/');
            const pagesUrl = `https://${repo[0]}.github.io/${repo[1]}/`;
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: `✅ **Docs deployed** → ${pagesUrl}`
            });
    timeout-minutes: 30
  deliver-video:
    name: 🎬 Deliver → Video Recording
    needs: gate
    if: needs.gate.outputs.run_video == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --if-present && npx playwright install --with-deps chromium
          2>/dev/null || true
      - name: Run recording script
        id: record
        run: |
          if [[ -f scripts/record.ts || -f scripts/record.js ]]; then
            npx ts-node scripts/record.ts 2>/dev/null || node scripts/record.js
            echo "recorded=true" >> $GITHUB_OUTPUT
          else
            echo "recorded=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: steps.record.outputs.recorded == 'true'
        with:
          name: video-${{ github.run_id }}
          path: |
            videos/
            playwright-report/
          retention-days: 14
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: >
            const recorded = '${{ steps.record.outputs.recorded }}';

            const run = '${{ github.run_id }}';

            const body = recorded === 'true'
              ? `✅ **Video recorded** → [Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${run})`
              : `⚠️ **Video step** — no \`scripts/record.ts\` found. Create it with a Playwright script and re-run with \`deliver:video\`.`;
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0, body
            });
    timeout-minutes: 30
  deliver-mobile:
    name: 📱 Deliver → Mobile (iOS + Android)
    needs: gate
    if: >
      needs.gate.outputs.run_mobile == 'true' ||
      needs.gate.outputs.run_android == 'true' ||
      needs.gate.outputs.run_ios == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Dispatch auto-deploy-to-stores workflow
        id: dispatch
        uses: actions/github-script@v9
        with:
          script: |
            // Resolve which platforms are requested
            const wantsAndroid = '${{ needs.gate.outputs.run_android }}' === 'true' || '${{ needs.gate.outputs.run_mobile }}' === 'true';
            const wantsIos     = '${{ needs.gate.outputs.run_ios }}'     === 'true' || '${{ needs.gate.outputs.run_mobile }}' === 'true';
            const platform     = wantsAndroid && wantsIos ? 'both' : wantsAndroid ? 'android' : 'ios';

            const issueNumber = '${{ needs.gate.outputs.issue_num }}';

            core.info(`Dispatching auto-deploy-to-stores.yml — platform: ${platform}, issue: ${issueNumber || 'none'}`);

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'auto-deploy-to-stores.yml',
                ref: 'main',
                inputs: {
                  issue_number: issueNumber || '',
                  platform,
                  android_track: 'internal',
                  ios_environment: 'testflight',
                },
              });
              core.setOutput('dispatched', 'true');
            } catch (e) {
              core.warning('Could not dispatch auto-deploy-to-stores.yml: ' + e.message);
              core.setOutput('dispatched', 'false');
            }
      - name: Comment dispatch result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const dispatched = '${{ steps.dispatch.outputs.dispatched }}';
            const issueNumber = '${{ needs.gate.outputs.issue_num }}'.trim();
            const actionsUrl = `https://github.com/${{ github.repository }}/actions/workflows/auto-deploy-to-stores.yml`;
            const body = dispatched === 'true'
              ? `📱 **Mobile store deployment dispatched** → [View progress in auto-deploy-to-stores.yml](${actionsUrl})\n\n> Deployment enforces the **deep research gate** — the originating WR issue must have \`deep-research\` + \`research:complete\` labels before stores are updated.`
              : `⚠️ **Mobile dispatch failed** — could not start \`auto-deploy-to-stores.yml\`. [Trigger it manually](${actionsUrl}).`;

            if (!issueNumber) {
              core.info('No originating issue/PR number available; skipping dispatch result comment.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(issueNumber),
              body
            });
    timeout-minutes: 30
  deliver-package:
    name: 📦 Deliver → Package (npm / PyPI)
    needs: gate
    if: needs.gate.outputs.run_package == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci --if-present && npm run build --if-present
      - name: Publish package
        id: publish
        run: |
          if [[ -f setup.py || -f pyproject.toml ]]; then
            if [[ -z "${{ secrets.PYPI_TOKEN }}" ]]; then
              echo "result=SKIPPED — add PYPI_TOKEN secret" >> $GITHUB_OUTPUT
            else
              pip install build twine
              python -m build
              twine upload dist/* --non-interactive
              PKG=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['name']+'@'+d['project']['version'])" 2>/dev/null || echo "package")
              echo "result=Published Python $PKG to PyPI" >> $GITHUB_OUTPUT
            fi
          elif [[ -f package.json ]]; then
            if [[ -z "${{ secrets.NPM_TOKEN }}" ]]; then
              echo "result=SKIPPED — add NPM_TOKEN secret" >> $GITHUB_OUTPUT
            else
              npm publish --access public 2>&1 | tail -5
              PKG=$(node -p "require('./package.json').name + '@' + require('./package.json').version" 2>/dev/null || echo "unknown")
              echo "result=Published $PKG to npm" >> $GITHUB_OUTPUT
            fi
          else
            echo "result=SKIPPED — no package.json or pyproject.toml found" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_USERNAME: __token__
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const result = '${{ steps.publish.outputs.result }}';
            const ok = result && !result.includes('SKIPPED');
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: ok ? `✅ **Package published** → \`${result}\`` : `⚠️ **Package publish skipped** — ${result}`
            });
    timeout-minutes: 30
  deliver-extension:
    name: 🧩 Deliver → Extension (Chrome / VS Code)
    needs: gate
    if: >
      needs.gate.outputs.run_extension == 'true' ||
      needs.gate.outputs.run_vscode == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --if-present && npm run build --if-present
      - name: Publish Chrome extension
        id: chrome
        if: needs.gate.outputs.run_extension == 'true'
        run: |
          if [[ -f manifest.json ]]; then
            if [[ -z "${{ secrets.CHROME_CLIENT_SECRET }}" ]]; then
              echo "result=SKIPPED — add CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN secrets" >> $GITHUB_OUTPUT
            else
              npm install -g web-ext
              web-ext build --overwrite-dest
              echo "result=Chrome extension packaged — manual upload required (Chrome Web Store API limits automated publishing)" >> $GITHUB_OUTPUT
            fi
          else
            echo "result=SKIPPED — no manifest.json found" >> $GITHUB_OUTPUT
          fi
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      - name: Publish VS Code extension
        id: vscode
        if: needs.gate.outputs.run_vscode == 'true'
        run: |
          if [[ -f package.json ]] && node -e "const p=require('./package.json'); process.exit(p.engines?.vscode ? 0 : 1)" 2>/dev/null; then
            if [[ -z "${{ secrets.VSCE_TOKEN }}" ]]; then
              echo "result=SKIPPED — add VSCE_TOKEN secret" >> $GITHUB_OUTPUT
            else
              npm install -g @vscode/vsce
              vsce publish --pat "${{ secrets.VSCE_TOKEN }}"
              PKG=$(node -p "require('./package.json').name + '@' + require('./package.json').version" 2>/dev/null || echo "extension")
              echo "result=Published $PKG to VS Code Marketplace" >> $GITHUB_OUTPUT
            fi
          else
            echo "result=SKIPPED — no VS Code extension (package.json missing engines.vscode)" >> $GITHUB_OUTPUT
          fi
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        env:
          CHROME: ${{ steps.chrome.outputs.result }}
          VSCODE: ${{ steps.vscode.outputs.result }}
        with:
          script: |
            const chrome = process.env.CHROME || '';
            const vscode = process.env.VSCODE || '';
            const chrome = `${{ steps.chrome.outputs.result }}` || '';
            const vscode = `${{ steps.vscode.outputs.result }}` || '';
            const lines = [];
            if (chrome) lines.push(chrome.includes('SKIPPED') ? `⚠️ **Chrome** — ${chrome}` : `✅ **Chrome** — ${chrome}`);
            if (vscode) lines.push(vscode.includes('SKIPPED') ? `⚠️ **VS Code** — ${vscode}` : `✅ **VS Code** — ${vscode}`);
            if (!lines.length) return;
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: `🧩 **Extension delivery**\n\n${lines.join('\n')}`
            });
    timeout-minutes: 30
  deliver-action:
    name: ⚙️ Deliver → GitHub Action
    needs: gate
    if: needs.gate.outputs.run_action == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Validate action.yml
        id: validate
        run: |
          if [[ ! -f action.yml && ! -f action.yaml ]]; then
            echo "result=SKIPPED — no action.yml found. Create action.yml to publish a GitHub Action." >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "result=action.yml present — tag a release to publish to GitHub Marketplace" >> $GITHUB_OUTPUT
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const result = '${{ steps.validate.outputs.result }}';
            const ok = result && !result.includes('SKIPPED');
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: ok ? `✅ **GitHub Action** — ${result}` : `⚠️ **GitHub Action skipped** — ${result}`
            });
    timeout-minutes: 30
  deliver-openapi:
    name: 📋 Deliver → OpenAPI Spec
    needs: gate
    if: needs.gate.outputs.run_openapi == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --if-present
      - name: Generate / validate OpenAPI spec
        id: openapi
        run: |
          SPEC_FILE=""
          for f in openapi.yml openapi.yaml openapi.json docs/openapi.yml docs/openapi.yaml; do
            [[ -f "$f" ]] && SPEC_FILE="$f" && break
          done
          if [[ -z "$SPEC_FILE" ]]; then
            echo "result=SKIPPED — no openapi.yml / openapi.json found" >> $GITHUB_OUTPUT
            exit 0
          fi
          npm install -g @redocly/cli 2>/dev/null || true
          if command -v redocly &>/dev/null; then
            redocly lint "$SPEC_FILE" && echo "result=Spec validated: $SPEC_FILE" >> $GITHUB_OUTPUT || echo "result=FAILED — spec validation errors (see logs)" >> $GITHUB_OUTPUT
          else
            echo "result=Spec found: $SPEC_FILE (install @redocly/cli for validation)" >> $GITHUB_OUTPUT
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: steps.openapi.outputs.result != '' && !contains(steps.openapi.outputs.result, 'SKIPPED')
        with:
          name: openapi-spec-${{ github.run_id }}
          path: |
            openapi.yml
            openapi.yaml
            openapi.json
            docs/openapi.*
          retention-days: 30
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const result = '${{ steps.openapi.outputs.result }}';
            const ok = result && !result.includes('SKIPPED') && !result.includes('FAILED');
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: ok ? `✅ **OpenAPI spec** — ${result}` : `⚠️ **OpenAPI skipped/failed** — ${result}`
            });
    timeout-minutes: 30
  deliver-migration:
    name: 🗄️ Deliver → Database Migration
    needs: gate
    if: needs.gate.outputs.run_migration == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --if-present
      - name: Run database migration
        id: migrate
        run: |
          if [[ -f prisma/schema.prisma ]]; then
            echo "Detected Prisma schema"
            if [[ -z "${{ secrets.DATABASE_URL }}" ]]; then
              echo "result=SKIPPED — add DATABASE_URL secret" >> $GITHUB_OUTPUT
            else
              npx prisma migrate deploy
              echo "result=Prisma migration applied successfully" >> $GITHUB_OUTPUT
            fi
          elif command -v alembic &>/dev/null; then
            if [[ -z "${{ secrets.DATABASE_URL }}" ]]; then
              echo "result=SKIPPED — add DATABASE_URL secret" >> $GITHUB_OUTPUT
            else
              alembic upgrade head
              echo "result=Alembic migration applied successfully" >> $GITHUB_OUTPUT
            fi
          else
            echo "result=SKIPPED — no prisma/schema.prisma or alembic found. Add migration config and DATABASE_URL secret." >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const result = '${{ steps.migrate.outputs.result }}';
            const ok = result && !result.includes('SKIPPED') && !result.includes('FAILED');
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: ok ? `✅ **Migration** — ${result}` : `⚠️ **Migration skipped** — ${result}`
            });
    timeout-minutes: 30
  deliver-marketplace:
    name: 🏪 Deliver → Marketplace Listing (Draft)
    needs: gate
    if: needs.gate.outputs.run_marketplace == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Generate marketplace listing draft
        id: listing
        run: |
          mkdir -p dist/marketplace
          README=""
          [[ -f README.md ]] && README=$(head -100 README.md)
          TITLE=$(echo "$README" | head -1 | sed 's/^#\s*//')
          DESCRIPTION=$(echo "$README" | sed -n '/^$/,/^##/{/^##/q; p}' | head -10 | tr '\n' ' ')
          cat > dist/marketplace/listing-draft.md << EOF
          # Marketplace Listing Draft

          **Title:** ${TITLE:-$(basename "$PWD")}

          **Short Description:** ${DESCRIPTION:-See README.md for details.}

          **Categories:** (fill in — e.g., Developer Tools, Productivity, Utilities)

          **Screenshots:** (add 1280×800 screenshots to dist/marketplace/screenshots/)

          **Keywords:** (fill in SEO keywords)

          ---
          *Auto-generated draft — human review required before submitting to store.*
          EOF
          echo "result=Listing draft generated in dist/marketplace/listing-draft.md" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: marketplace-listing-${{ github.run_id }}
          path: dist/marketplace/
          retention-days: 30
      - name: Comment result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const run = '${{ github.run_id }}';
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? 0,
              body: `🏪 **Marketplace listing draft generated** — [Download artifact](https://github.com/${{ github.repository }}/actions/runs/${run})\n\n> ⚠️ Human review required before submitting to any store. Edit \`listing-draft.md\` with your actual title, description, screenshots, and keywords.`
            });
    timeout-minutes: 30
  ship-complete:
    name: ✅ Ship Complete
    needs:
      - gate
      - deliver-api
      - deliver-app
      - deliver-mobile
      - deliver-pdf
      - deliver-cli
      - deliver-package
      - deliver-docker
      - deliver-mcp
      - deliver-docs
      - deliver-video
      - deliver-extension
      - deliver-action
      - deliver-openapi
      - deliver-migration
      - deliver-marketplace
    if: always()
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check for failures
        id: check
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          if echo "$RESULTS" | grep -qw "failure"; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=ok" >> $GITHUB_OUTPUT
          fi
      - name: Label needs-human on failure
        if: steps.check.outputs.status == 'failed' && needs.gate.outputs.issue_num != ''
        uses: actions/github-script@v9
        with:
          script: >
            const issue = parseInt('${{ needs.gate.outputs.issue_num }}');

            if (!issue) return;

            const runUrl = `https://github.com/${{ github.repository
            }}/actions/runs/${{ github.run_id }}`;

            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue, labels: ['needs-human']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue,
              body: `🚨 **Ship to Market — delivery failure**\n\nOne or more delivery jobs failed. [View run logs](${runUrl})\n\nThis issue has been labeled \`needs-human\`.`
            });
      - name: Post success summary
        if: steps.check.outputs.status == 'ok'
        uses: actions/github-script@v9
        with:
          script: >
            const pr = context.payload.pull_request?.number;

            if (!pr) return;

            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr,
              body: `🎉 **All delivery channels shipped successfully.**\n\nCheck individual job comments above for URLs and artifact links.`
            });
    timeout-minutes: 30
