name: Deploy Music Video Creator

on:
  push:
    branches: [ "main" ]
    paths:
      - 'products/music-video-creator/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: products/music-video-creator/package-lock.json

      - name: Install Dependencies
        working-directory: products/music-video-creator
        run: npm ci || { echo "::warning::Task failed - creating WR" ; exit 1; }

      - name: Build Application
        working-directory: products/music-video-creator
        run: npm run build || { echo "::warning::Task failed - creating WR"; exit 1; }

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: products/music-video-creator
          vercel-args: '--prod'
        continue-on-error: true
        id: vercel

      - name: Handle Deployment Failure
        if: failure() || steps.vercel.outcome == 'failure'
        run: |
          echo "::warning::Task failed - creating WR"
          gh issue create --title "[WR] Deployment failed for Music Video Creator" \
            --body "Vercel deployment failed for products/music-video-creator." \
            --label "automation-failure" || echo "Failed to create issue"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}