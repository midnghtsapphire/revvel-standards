name: SAML SSO Registration Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-saml-identity:
    name: Verify SAML SSO Identity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Get SAML identity via GraphQL
        id: saml-identity
        uses: actions/github-script@v9.0.0
        env:
          ACTOR_LOGIN: ${{ github.event.pull_request.user.login }}
          ORG_LOGIN: ${{ github.repository_owner }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const login = process.env.ACTOR_LOGIN;
            const org = process.env.ORG_LOGIN;
            const query = `
              query($org: String!, $login: String!) {
                organization(login: $org) {
                  samlIdentityProvider {
                    externalIdentities(first: 1, userName: $login) {
                      nodes {
                        samlIdentity { nameId }
                        user { login }
                      }
                    }
                  }
                }
              }
            `;
            let identity = '';
            try {
              const result = await github.graphql(query, { org, login });
              const nodes = result?.organization?.samlIdentityProvider?.externalIdentities?.nodes || [];
              const match = nodes.find(n => n?.user?.login === login);
              if (match?.samlIdentity?.nameId) {
                identity = match.samlIdentity.nameId;
              }
            } catch (err) {
              core.warning(`SAML identity lookup failed (org may not have SAML IdP configured, or token lacks org-admin scope): ${err.message}`);
            }
            core.setOutput('identity', identity);
            return identity;

      - name: Report SAML identity result
        run: |
          if [ -n "${{ steps.saml-identity.outputs.identity }}" ]; then
            echo "::notice::SAML identity linked: ${{ steps.saml-identity.outputs.identity }}"
          else
            echo "::warning::SAML SSO identity not linked for ${{ github.event.pull_request.user.login }}"
          fi

      - name: Comment on PR if SAML identity not linked
        if: steps.saml-identity.outputs.identity == ''
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '### SAML SSO Identity Not Linked',
              '',
              `@${context.payload.pull_request.user.login}, your GitHub account does not appear to be linked to a SAML SSO identity for the \`${context.repo.owner}\` organization.`,
              '',
              'If this organization requires SAML SSO, please link your identity to ensure your contributions are properly attributed.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
