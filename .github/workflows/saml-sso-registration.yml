name: SAML SSO Registration Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-saml-identity:
    name: Verify SAML SSO Identity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Get SAML Identity
        id: saml-identity
        uses: actions/github-script@v9.0.0
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ORG_NAME: ${{ github.repository_owner }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const login = process.env.PR_AUTHOR;
            const org = process.env.ORG_NAME;
            try {
              const query = `
                query($org: String!, $login: String!) {
                  organization(login: $org) {
                    samlIdentityProvider {
                      externalIdentities(userName: $login, first: 1) {
                        nodes {
                          samlIdentity {
                            nameId
                          }
                          user {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { org, login });
              const idp = result.organization && result.organization.samlIdentityProvider;
              if (!idp) {
                core.warning(`No SAML IdP configured for org ${org} (or token lacks admin:org scope).`);
                core.setOutput('identity', '');
                return;
              }
              const nodes = (idp.externalIdentities && idp.externalIdentities.nodes) || [];
              const match = nodes.find(n => n && n.user && n.user.login === login);
              const nameId = match && match.samlIdentity && match.samlIdentity.nameId ? match.samlIdentity.nameId : '';
              core.setOutput('identity', nameId);
            } catch (err) {
              core.warning(`SAML identity lookup failed: ${err.message}`);
              core.setOutput('identity', '');
            }

      - name: Report SAML identity result
        run: |
          if [ -n "${{ steps.saml-identity.outputs.identity }}" ]; then
            echo "::notice::SAML identity linked for ${{ github.event.pull_request.user.login }}: ${{ steps.saml-identity.outputs.identity }}"
          else
            echo "::warning::SAML identity not linked for ${{ github.event.pull_request.user.login }}"
          fi

      - name: Comment on PR if SAML identity not linked
        if: steps.saml-identity.outputs.identity == ''
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '## ⚠️ SAML SSO Identity Not Linked',
              '',
              `@${context.payload.pull_request.user.login}, your GitHub account does not appear to have a linked SAML SSO identity for the \`${context.repo.owner}\` organization.`,
              '',
              'Please ensure your SAML SSO session is active and your identity is linked to continue.',
              '',
              '_This is an automated informational check and does not block merging._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
