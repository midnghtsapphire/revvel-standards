name: SAML SSO Registration

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-saml-identity:
    name: Verify SAML SSO Identity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check SAML SSO Identity
        id: saml-identity
        uses: actions/github-script@v9.0.0
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ORG_LOGIN: ${{ github.repository_owner }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const login = process.env.PR_AUTHOR;
            const org = process.env.ORG_LOGIN;
            let identity = '';
            try {
              const query = `
                query($org: String!, $login: String!) {
                  organization(login: $org) {
                    samlIdentityProvider {
                      externalIdentities(first: 1, userName: $login) {
                        edges {
                          node {
                            samlIdentity { nameId }
                            user { login }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { org, login });
              const edges = result?.organization?.samlIdentityProvider?.externalIdentities?.edges || [];
              if (edges.length > 0 && edges[0]?.node?.samlIdentity?.nameId) {
                identity = edges[0].node.samlIdentity.nameId;
              }
            } catch (err) {
              core.warning(`SAML identity lookup failed: ${err.message}`);
            }
            core.setOutput('identity', identity);
            return identity;

      - name: Report SAML identity result
        run: |
          if [ -n "${{ steps.saml-identity.outputs.identity }}" ]; then
            echo "::notice::SAML SSO identity linked for ${{ github.event.pull_request.user.login }}: ${{ steps.saml-identity.outputs.identity }}"
          else
            echo "::warning::SAML SSO identity not linked for ${{ github.event.pull_request.user.login }}"
          fi

      - name: Comment on PR if SAML not linked
        if: steps.saml-identity.outputs.identity == ''
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## SAML SSO Identity Not Linked\n\n` +
              `@${context.payload.pull_request.user.login}, your GitHub account does not appear to have a linked SAML SSO identity for the \`${context.repo.owner}\` organization.\n\n` +
              `If you are an org member, please ensure your SAML SSO session is active. External contributors can safely ignore this notice.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
