name: SAML SSO Registration Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-saml:
    name: Verify SAML SSO Identity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Get SAML identity
        id: saml-identity
        uses: actions/github-script@v9.0.0
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ORG_LOGIN: ${{ github.repository_owner }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const login = process.env.PR_AUTHOR;
            const org = process.env.ORG_LOGIN;
            const query = `
              query($org: String!, $login: String!) {
                organization(login: $org) {
                  samlIdentityProvider {
                    externalIdentities(first: 1, userName: $login) {
                      edges {
                        node {
                          samlIdentity { nameId }
                          user { login }
                        }
                      }
                    }
                  }
                }
              }
            `;
            let identity = '';
            try {
              const result = await github.graphql(query, { org, login });
              const idp = result.organization && result.organization.samlIdentityProvider;
              if (!idp) {
                core.warning(`No SAML IdP configured for org '${org}' (or token lacks admin:org scope).`);
              } else {
                const edges = (idp.externalIdentities && idp.externalIdentities.edges) || [];
                const match = edges.find(e => e.node && e.node.user && e.node.user.login === login);
                if (match && match.node.samlIdentity && match.node.samlIdentity.nameId) {
                  identity = match.node.samlIdentity.nameId;
                }
              }
            } catch (err) {
              core.warning(`SAML identity lookup failed: ${err.message}`);
            }
            core.setOutput('identity', identity);
            return identity;

      - name: Report SAML identity result
        run: |
          if [ -n "${{ steps.saml-identity.outputs.identity }}" ]; then
            echo "::notice::SAML identity linked: ${{ steps.saml-identity.outputs.identity }}"
          else
            echo "::warning::SAML SSO identity not linked for ${{ github.event.pull_request.user.login }}"
          fi

      - name: Comment on PR if SAML not linked
        if: steps.saml-identity.outputs.identity == ''
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## SAML SSO Identity Not Linked\n\n@${context.payload.pull_request.user.login}, your GitHub account does not appear to have a linked SAML SSO identity for this organization.\n\nPlease ensure your account is properly linked via SAML SSO to continue contributing.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
