name: SAML SSO Registration Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-saml-identity:
    name: Verify SAML SSO Identity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check SAML SSO Identity
        id: saml-identity
        uses: actions/github-script@v9.0.0
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ORG_LOGIN: ${{ github.repository_owner }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const org = process.env.ORG_LOGIN;
            const user = process.env.PR_AUTHOR;
            let identity = '';
            try {
              const query = `
                query($org: String!, $user: String!) {
                  organization(login: $org) {
                    samlIdentityProvider {
                      externalIdentities(first: 1, userName: $user) {
                        edges {
                          node {
                            samlIdentity {
                              nameId
                            }
                            user {
                              login
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { org, user });
              const edges = result?.organization?.samlIdentityProvider?.externalIdentities?.edges || [];
              if (edges.length > 0 && edges[0].node?.samlIdentity?.nameId) {
                identity = edges[0].node.samlIdentity.nameId;
              }
            } catch (err) {
              core.warning(`Unable to query SAML identity for ${user} in ${org}: ${err.message}`);
            }
            core.setOutput('identity', identity);
            return identity;

      - name: Report SAML identity result
        run: |
          if [ -z "${{ steps.saml-identity.outputs.identity }}" ]; then
            echo "::warning::PR author '${{ github.event.pull_request.user.login }}' has no SAML identity linked to org '${{ github.repository_owner }}'."
          else
            echo "::notice::PR author '${{ github.event.pull_request.user.login }}' SAML identity: ${{ steps.saml-identity.outputs.identity }}"
          fi

      - name: Comment on PR if SAML not linked
        if: steps.saml-identity.outputs.identity == ''
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '## SAML SSO Identity Not Linked',
              '',
              `PR author \`${context.payload.pull_request.user.login}\` does not appear to have a SAML identity linked to the \`${context.repo.owner}\` organization.`,
              '',
              'If you are a member of this organization, please ensure your GitHub account is linked via SAML SSO. Otherwise, this warning can be ignored for external contributors.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
