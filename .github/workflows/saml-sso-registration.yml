name: SAML SSO Registration

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-saml-identity:
    name: Verify SAML SSO Identity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check SAML SSO Identity
        id: saml-identity
        uses: actions/github-script@v9.0.0
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const org = context.repo.owner;
            const actor = context.actor;
            let identity = '';
            try {
              const query = `
                query($org: String!, $login: String!) {
                  organization(login: $org) {
                    samlIdentityProvider {
                      externalIdentities(first: 1, userName: $login) {
                        edges {
                          node {
                            samlIdentity { nameId }
                            user { login }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { org, login: actor });
              const idp = result.organization && result.organization.samlIdentityProvider;
              if (!idp) {
                core.warning(`Organization ${org} has no SAML IdP configured or token lacks org-admin scope; treating as not linked.`);
              } else {
                const edges = (idp.externalIdentities && idp.externalIdentities.edges) || [];
                const match = edges.find(e => e.node && e.node.user && e.node.user.login === actor);
                if (match && match.node.samlIdentity && match.node.samlIdentity.nameId) {
                  identity = match.node.samlIdentity.nameId;
                }
              }
            } catch (err) {
              core.warning(`SAML identity lookup failed: ${err.message}. Treating as not linked.`);
            }
            core.setOutput('identity', identity);
            return identity;

      - name: Report SAML identity result
        run: |
          if [ -n "${{ steps.saml-identity.outputs.identity }}" ]; then
            echo "::notice::SAML SSO identity linked: ${{ steps.saml-identity.outputs.identity }}"
          else
            echo "::warning::SAML SSO identity not linked for ${{ github.actor }}"
          fi

      - name: Comment on PR if SAML identity not linked
        if: steps.saml-identity.outputs.identity == ''
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '## SAML SSO Identity Not Linked',
              '',
              `@${context.actor} — your GitHub account does not appear to have a SAML SSO identity linked for the \`${context.repo.owner}\` organization.`,
              '',
              'Please link your SAML SSO identity to ensure your contributions are properly attributed and authorized.',
              '',
              'See: https://docs.github.com/en/enterprise-cloud@latest/authentication/authenticating-with-saml-single-sign-on'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
