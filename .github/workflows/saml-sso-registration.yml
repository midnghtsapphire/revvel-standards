name: SAML SSO Registration Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-saml:
    name: Verify SAML SSO Identity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Get SAML Identity
        id: saml-identity
        uses: actions/github-script@v9.0.0
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ORG_LOGIN: ${{ github.repository_owner }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const author = process.env.PR_AUTHOR;
            const org = process.env.ORG_LOGIN;
            let identity = '';
            try {
              const query = `
                query($org: String!, $login: String!) {
                  organization(login: $org) {
                    samlIdentityProvider {
                      externalIdentities(first: 1, login: $login) {
                        edges {
                          node {
                            samlIdentity { nameId }
                            user { login }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { org, login: author });
              const idp = result.organization && result.organization.samlIdentityProvider;
              if (!idp) {
                core.warning(`No SAML IdP configured for org ${org} (or token lacks admin:org scope).`);
              } else {
                const edges = (idp.externalIdentities && idp.externalIdentities.edges) || [];
                if (edges.length > 0 && edges[0].node && edges[0].node.samlIdentity) {
                  identity = edges[0].node.samlIdentity.nameId || '';
                }
              }
            } catch (err) {
              core.warning(`SAML identity lookup failed: ${err.message}`);
            }
            core.setOutput('identity', identity);
            return identity;

      - name: Report SAML identity result
        run: |
          if [ -n "${{ steps.saml-identity.outputs.identity }}" ]; then
            echo "::notice::SAML identity linked for ${{ github.event.pull_request.user.login }}: ${{ steps.saml-identity.outputs.identity }}"
          else
            echo "::warning::SAML identity NOT linked for ${{ github.event.pull_request.user.login }}"
          fi

      - name: Comment on PR if SAML not linked
        if: steps.saml-identity.outputs.identity == ''
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '## ⚠️ SAML SSO Identity Not Linked',
              '',
              `@${context.payload.pull_request.user.login} — your GitHub account does not appear to have a SAML SSO identity linked to this organization.`,
              '',
              'Please link your SAML identity to continue contributing:',
              '1. Visit your organization SSO settings',
              '2. Authorize your account via SAML',
              '3. Re-run the failed check',
              '',
              'If you believe this is an error, contact an org admin.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
