name: SAML SSO Registration

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-saml-identity:
    name: Verify SAML SSO Identity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Get SAML Identity
        id: saml-identity
        uses: actions/github-script@v9.0.0
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ORG_LOGIN: ${{ github.repository_owner }}
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const org = process.env.ORG_LOGIN;
            const user = process.env.PR_AUTHOR;
            let identity = '';
            try {
              const query = `
                query($org: String!, $user: String!) {
                  organization(login: $org) {
                    samlIdentityProvider {
                      externalIdentities(first: 1, userName: $user) {
                        edges {
                          node {
                            samlIdentity { nameId }
                            user { login }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { org, user });
              const edges = result?.organization?.samlIdentityProvider?.externalIdentities?.edges || [];
              const match = edges.find(e => e?.node?.user?.login === user);
              identity = match?.node?.samlIdentity?.nameId || '';
            } catch (err) {
              core.warning(`Could not query SAML identity for ${user} in ${org}: ${err.message}`);
              identity = '';
            }
            core.setOutput('identity', identity);
            return identity;

      - name: Report SAML identity result
        run: |
          if [ -n "${{ steps.saml-identity.outputs.identity }}" ]; then
            echo "::notice::SAML identity linked for ${{ github.event.pull_request.user.login }}: ${{ steps.saml-identity.outputs.identity }}"
          else
            echo "::warning::No SAML identity linked for ${{ github.event.pull_request.user.login }}"
          fi

      - name: Comment on PR if SAML not linked
        if: steps.saml-identity.outputs.identity == ''
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## ⚠️ SAML SSO Identity Not Linked\n\n` +
              `@${context.payload.pull_request.user.login}, your GitHub account does not have a SAML SSO identity linked to this organization.\n\n` +
              `Please ensure your account is properly registered with SAML SSO before your PR can be merged.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
