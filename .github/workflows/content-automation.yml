name: Content Automation

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 9 * * 0'  # Weekly Sunday 09:00 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: 'Content topic or title'
        required: true
      format:
        description: 'Output format'
        required: true
        default: 'blog'
        type: choice
        options:
          - blog
          - video
          - social
          - email
          - all
      urgency:
        description: 'Content urgency'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - final
          - publish
      target_audience:
        description: 'Target audience'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  trigger-content-automation:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && (
        contains(github.event.issue.labels.*.name, 'content-automation') ||
        contains(github.event.issue.labels.*.name, 'content') ||
        contains(github.event.issue.labels.*.name, 'writing') ||
        contains(github.event.issue.labels.*.name, 'blog') ||
        contains(github.event.issue.labels.*.name, 'seo-content')
      )) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Acknowledge issue trigger
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const comment = `🤖 **Content Automation Pipeline Activated**
            
            The content automation system is now processing your request. This will take approximately 10-15 minutes.
            
            **Pipeline Stages:**
            - [ ] Research & Topic Ideation (2-3 min)
            - [ ] Outline Generation (1 min)
            - [ ] Draft Generation (3-4 min)
            - [ ] Content Refinement (2-3 min)
            - [ ] Multi-Format Export (1 min)
            
            Results will be posted here when complete.
            
            *Powered by OpenRouter AI · Skill: content-automation*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: comment
            });

      - name: Extract content parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "topic=${{ github.event.inputs.topic }}" >> $GITHUB_OUTPUT
            echo "format=${{ github.event.inputs.format }}" >> $GITHUB_OUTPUT
            echo "urgency=${{ github.event.inputs.urgency }}" >> $GITHUB_OUTPUT
            echo "audience=${{ github.event.inputs.target_audience }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issues" ]; then
            # Sanitize issue title to prevent injection
            TOPIC=$(echo '${{ github.event.issue.title }}' | tr -d '\n\r' | head -c 200)
            echo "topic=${TOPIC}" >> $GITHUB_OUTPUT
            echo "format=blog" >> $GITHUB_OUTPUT
            echo "urgency=draft" >> $GITHUB_OUTPUT
            echo "audience=${{ vars.CONTENT_TARGET_AUDIENCE || 'general audience' }}" >> $GITHUB_OUTPUT
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            # Scheduled run - generate content calendar
            echo "topic=Weekly Content Calendar" >> $GITHUB_OUTPUT
            echo "format=calendar" >> $GITHUB_OUTPUT
            echo "urgency=draft" >> $GITHUB_OUTPUT
            echo "audience=${{ vars.CONTENT_TARGET_AUDIENCE || 'general audience' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run content automation script
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TUBEBUDDY_API_KEY: ${{ secrets.TUBEBUDDY_API_KEY }}
          VIDIQ_API_KEY: ${{ secrets.VIDIQ_API_KEY }}
          CONTENT_TOPIC: ${{ steps.params.outputs.topic }}
          CONTENT_FORMAT: ${{ steps.params.outputs.format }}
          CONTENT_URGENCY: ${{ steps.params.outputs.urgency }}
          CONTENT_AUDIENCE: ${{ steps.params.outputs.audience }}
          CONTENT_BRAND_VOICE: ${{ vars.CONTENT_BRAND_VOICE || 'professional yet approachable' }}
          CONTENT_PRIMARY_KEYWORDS: ${{ vars.CONTENT_PRIMARY_KEYWORDS || '' }}
          CONTENT_AUTO_PUBLISH: ${{ vars.CONTENT_AUTO_PUBLISH || 'false' }}
        run: |
          node scripts/content-automation.js
          
          # Capture output path
          if [ -f content-automation-output/latest-output-path.txt ]; then
            OUTPUT_PATH=$(cat content-automation-output/latest-output-path.txt)
            echo "output_path=${OUTPUT_PATH}" >> $GITHUB_OUTPUT
          fi

      - name: Commit generated content
        if: steps.generate.outputs.output_path != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add content-automation-output/
          git commit -m "🤖 Auto-generate content: ${{ steps.params.outputs.topic }}

          Generated via content-automation skill
          Format: ${{ steps.params.outputs.format }}
          Urgency: ${{ steps.params.outputs.urgency }}
          Audience: ${{ steps.params.outputs.audience }}" || echo "No changes to commit"

      - name: Push changes
        if: steps.generate.outputs.output_path != ''
        run: |
          git push origin ${{ github.ref_name }} || echo "Nothing to push"

      - name: Post results to issue
        if: github.event_name == 'issues' && steps.generate.outputs.output_path != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const outputPath = '${{ steps.generate.outputs.output_path }}';
            const metadataPath = path.join(outputPath, 'metadata.json');
            
            let metadata = {};
            if (fs.existsSync(metadataPath)) {
              metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
            }
            
            const comment = `✅ **Content Generation Complete!**
            
            **Generated Content:**
            - **Title:** ${metadata.title || '${{ steps.params.outputs.topic }}'}
            - **Format:** ${{ steps.params.outputs.format }}
            - **Word Count:** ${metadata.word_count || 'N/A'}
            - **SEO Score:** ${metadata.seo_score || 'N/A'}/100
            - **Readability:** ${metadata.readability_score || 'N/A'}/100
            
            **Output Location:** \`${outputPath}\`
            
            **Available Formats:**
            ${metadata.formats ? metadata.formats.map(f => `- ${f}`).join('\n') : '- See output directory'}
            
            **Next Steps:**
            1. Review the generated content in the output directory
            2. Make any necessary edits for brand voice and accuracy
            3. Add visuals and format for final publication
            4. Close this issue when content is published
            
            **Quality Gates:**
            - SEO: ${metadata.quality_gates?.seo?.passed ? '✅' : '⚠️'}
            - Readability: ${metadata.quality_gates?.readability?.passed ? '✅' : '⚠️'}
            - Structure: ${metadata.quality_gates?.structure?.passed ? '✅' : '⚠️'}
            - Technical: ${metadata.quality_gates?.technical?.passed ? '✅' : '⚠️'}
            
            *Generated in ~${metadata.generation_time_seconds || 'N/A'}s using ${metadata.models_used?.join(', ') || 'OpenRouter AI'}*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.params.outputs.issue_number }},
              body: comment
            });
            
            // Add completion label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.params.outputs.issue_number }},
              labels: ['content:draft']
            });

      - name: Handle errors
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if ('${{ github.event_name }}' === 'issues') {
              const comment = `❌ **Content Generation Failed**
              
              The content automation pipeline encountered an error. Please check the workflow logs for details.
              
              **Common issues:**
              - Missing or invalid OPENROUTER_API_KEY
              - Topic is too vague or unclear
              - API rate limits exceeded
              - Network connectivity issues
              
              **Next Steps:**
              1. Check workflow logs: ${context.payload.repository.html_url}/actions/runs/${context.runId}
              2. Verify API keys are configured correctly
              3. Try again with a more specific topic
              4. Contact support if the issue persists
              
              *Error occurred in: content-automation workflow*`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.params.outputs.issue_number || github.event.issue.number }},
                body: comment
              });
            }

  self-heal:
    runs-on: ubuntu-latest
    needs: trigger-content-automation
    if: failure()
    steps:
      - name: Retry with fallback model
        run: |
          echo "Primary generation failed, attempting fallback..."
          # Future: Implement fallback logic with alternative models
          
      - name: Create auto-error issue
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[AUTO-ERROR] Content Automation workflow failed',
              body: `The content-automation workflow failed multiple times.
              
              **Run:** ${context.payload.repository.html_url}/actions/runs/${context.runId}
              **Event:** ${context.eventName}
              **Trigger:** ${{ github.event_name }}
              
              Please investigate and fix the underlying issue.`,
              labels: ['auto-error', 'content-automation', 'needs-fix']
            });
