name: Host — decompose WR into agent-contract

# The Host reads a WR issue, decomposes it into a Grid of Blocks (Threads),
# validates the output against schemas/agent-contract.schema.json, and posts
# the contract back to the issue as a comment. Dispatch of individual Threads
# is left to agent-fallback.yml so this workflow stays focused and testable.
#
# See scripts/host.js for the deterministic decomposition logic and
# docs/AGENTS.md § Checkpoint-Gated Grids for the review semantics.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: WR issue number to decompose
        required: true
        type: number

concurrency:
  # `inputs` is not a valid context at workflow level; GitHub rejected the
  # whole file, so this workflow never ran.
  group: host-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  decompose:
    name: Decompose WR into agent-contract
    # Only fire when a WR-triggering label is applied. Do not run on every
    # labeled event or the Host would loop each time any label is touched.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'work-request' ||
      github.event.label.name == 'checkpoint-gated' ||
      github.event.label.name == 'high-stakes' ||
      github.event.label.name == 'owner-review-per-block'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Read WR issue
        id: wr
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json number,title,url,labels,body > wr-raw.json
          # Reshape to the input schema host.js expects: wr_number, wr_title,
          # wr_url, labels (string[]), body.
          node -e '
            const raw = require("./wr-raw.json");
            const out = {
              wr_number: raw.number,
              wr_title: raw.title,
              wr_url: raw.url,
              labels: (raw.labels || []).map((l) => l.name),
              body: raw.body || "",
            };
            require("fs").writeFileSync("wr.json", JSON.stringify(out, null, 2));
          '
          echo "wr_title=$(node -p 'require(\"./wr.json\").wr_title')" >> "$GITHUB_OUTPUT"

      - name: Run Host decomposer
        run: node scripts/host.js --wr-file wr.json --out contract.json

      - name: Post contract back to issue
        run: |
          set -euo pipefail
          {
            echo "## Host decomposition"
            echo ""
            echo "Generated by \`scripts/host.js\` for WR **${{ steps.wr.outputs.wr_title }}**."
            echo ""
            echo "Contract schema: \`schemas/agent-contract.schema.json\` v$(node -p 'require(\"./contract.json\").contract_version')"
            echo ""
            echo '```json'
            cat contract.json
            echo '```'
            echo ""
            echo "Next: agent-fallback.yml dispatches each Thread in order. When \`grid.checkpoint_gated\` is \`true\`, Block N+1 waits until Block N carries the \`checkpoint-approved\` label."
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md

      - name: Upload contract as artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-contract-${{ env.ISSUE_NUMBER }}
          path: contract.json
          retention-days: 30
