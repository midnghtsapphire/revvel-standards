name: Match Labels
on:
  pull_request:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - synchronize
      - ready_for_review
permissions:
  pull-requests: write
  issues: write
  contents: read
concurrency:
  group: match-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  match-labels:
    name: Match PR Labels
    runs-on: ubuntu-latest
    outputs:
      matched_labels: ${{ steps.match.outputs.matched_labels }}
      matched_labels_array: ${{ steps.match.outputs.matched_labels_array }}
      matched_labels_count: ${{ steps.match.outputs.matched_labels_count }}
    steps:
      - name: Match merge-control / routing labels
        id: match
        uses: binowork/match-labels@v0.1.1
        with:
          match_labels: |
            auto-merge
            won't-merge
            blocked
            auto-fix
            openrouter
            copilot
            needs-human
          default_label: triage
      - name: Summarise match result
        run: |
          echo "### Match Labels" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **matched_labels_count:** ${{ steps.match.outputs.matched_labels_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **matched_labels:** \`${{ steps.match.outputs.matched_labels }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **matched_labels_array:** \`${{ steps.match.outputs.matched_labels_array }}\`" >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
