#
# Local label matching replaces abandoned `binowork/match-labels@v0.1.1`
# (stale release + deprecated node16 runtime, WR #14884) so PR routing keeps
# running on maintained first-party actions.
name: Match Labels
on:
  pull_request:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - synchronize
      - ready_for_review
permissions:
  pull-requests: write
  issues: write
  contents: read
concurrency:
  group: match-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  match-labels:
    name: Match PR Labels
    runs-on: ubuntu-latest
    outputs:
      matched_labels: ${{ steps.match.outputs.matched_labels }}
      matched_labels_array: ${{ steps.match.outputs.matched_labels_array }}
      matched_labels_count: ${{ steps.match.outputs.matched_labels_count }}
    steps:
      - name: Match merge-control / routing labels
        id: match
        uses: actions/github-script@v9.0.0
        env:
          MATCH_LABELS: |
            auto-merge
            won't-merge
            blocked
            auto-fix
            openrouter
            copilot
            needs-human
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              throw new Error('This workflow only runs in a pull_request context');
            }
            const matchLabels = (process.env.MATCH_LABELS || '')
              .split(/\r?\n/)
              .map((label) => label.trim())
              .filter(Boolean);
            const currentLabels = (pullRequest.labels || []).map((label) => label.name);
            const matched = currentLabels.filter((label) => matchLabels.includes(label));

            core.setOutput('matched_labels', matched.join(','));
            core.setOutput('matched_labels_array', JSON.stringify(matched));
            core.setOutput('matched_labels_count', String(matched.length));
            core.info(`Matched labels: ${matched.join(',') || '(none)'}`);
      - name: Summarise match result
        run: |
          echo "### Match Labels" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **matched_labels_count:** ${{ steps.match.outputs.matched_labels_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **matched_labels:** \`${{ steps.match.outputs.matched_labels }}\`" >> "$GITHUB_STEP_SUMMARY"
          cat << 'END_OF_SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          - **matched_labels_array:** `${{ steps.match.outputs.matched_labels_array }}`
          END_OF_SUMMARY
    timeout-minutes: 15
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
