# Deep Search Research - R&D Engineering Framework
# Uses Sonnet 3.5 + OpenRouter Fusion with DOE Screening, TRIZ, MEErP, LCA, BNAT
# Based on Audrey's Master Prompt for rigorous R&D research

name: Deep Search Research

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to research
        required: false
        type: number
      research_query:
        description: Direct research query (if no issue)
        required: false
        type: string
      profile:
        description: Routing profile to use
        required: false
        default: deep_search
        type: string

permissions:
  issues: write
  contents: read

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  deep-research:
    name: Deep R&D Research (DOE/TRIZ/MEErP/LCA/BNAT)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       github.event.label.name == 'deep-search')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Deep Research
        id: research
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
          RESEARCH_QUERY: ${{ inputs.research_query || github.event.issue.title }}
          PROFILE: ${{ inputs.profile || 'deep_search' }}
        run: |
          node -e "
            const { callOpenRouter, ROUTING_PROFILES } = require('./scripts/openrouter-routing');

            const profile = ROUTING_PROFILES[process.env.PROFILE] || ROUTING_PROFILES.deep_search;
            const models = profile.models;

            const issueNumber = process.env.ISSUE_NUMBER;
            const repo = process.env.REPO;
            const query = process.env.RESEARCH_QUERY;

            const systemPrompt = [
              'You are an autonomous Lead Systems Engineer, Market Analyst, and R&D Director. You are conducting deep R&D research using rigorous engineering frameworks.',
              '',
              'NEVER accept the initial idea at face value. Your goal is to deconstruct the root problem, research the current state-of-the-art, and determine if the idea should be refined, repurposed, or completely pivoted.',
              '',
              'Walk through these frameworks:',
              '',
              '**Phase 1: Core Problem Deconstruction & Market Assessment**',
              '- Strip away the specific proposed solution. What is the fundamental problem?',
              '- What is the current Best Available Technology (BAT) solving this?',
              '- What emerging trends and paradigm shifts are disrupting this space?',
              '',
              '**Phase 2: TRIZ (Theory of Inventive Problem Solving)**',
              '- Identify contradictions in the idea',
              '- Find existing COTS components or cross-industry solutions that can be repurposed',
              '',
              '**Phase 3: DOE 5-Point Screening Analysis**',
              '1. Technological Feasibility - Is it viable based on current science?',
              '2. Practicability - Can it be manufactured/installed/serviced at scale?',
              '3. Utility Impacts - Does it negatively impact user experience?',
              '4. Safety - Any adverse health or environmental impacts?',
              '5. Proprietary Roadblocks - Does it rely on un-usable proprietary tech?',
              '',
              '**Phase 4: Life Cycle Assessment (LCA)**',
              '- Cradle-to-grave environmental impact',
              '- Resource depletion, energy efficiency, EoL recyclability',
              '- Sustainable material alternatives',
              '',
              '**Phase 5: BNAT (Best Not Yet Available Technology)**',
              '- Identify cutting-edge lab research, patents, and early development',
              '- If initial idea is obsolete, discard and explain the better paradigm',
              '',
              '**Phase 6: Final Verdict & Actionable Blueprint**',
              '- Refine, Repurpose, or Pivot?',
              '- Bill of Materials (BOM) and Cost-Benefit Analysis',
              '- Specific steps, components, and execution risks',
              '',
              'Output your research in structured markdown with clear headers for each phase.',
            ].join('\n');

            const userPrompt = [
              'Research this issue/request:',
              '',
              query,
              '',
              'Provide a comprehensive deep research report following all 6 phases above.',
            ].join('\n');

            async function run() {
              console.log('Starting deep research with profile:', process.env.PROFILE);
              console.log('Models:', models);

              const messages = [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userPrompt }
              ];

              try {
                const result = await callOpenRouter({
                  models: models,
                  messages: messages,
                  temperature: 0.7,
                  max_tokens: 8000
                });

                console.log('\\n=== RESEARCH RESULTS ===\\n');
                console.log(result);
                console.log('\\n=== END RESULTS ===\\n');

                // Save results
                require('fs').writeFileSync('/tmp/deep-research-results.md', result);

              } catch (err) {
                console.error('Research failed:', err.message);
                process.exit(1);
              }
            }

            run();
          "

      - name: Post research to issue
        if: env.ISSUE_NUMBER
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          if [ -f /tmp/deep-research-results.md ]; then
            {
              printf '## 🔬 Deep R&D Research Results\n\n'
              printf '> Using **Sonnet 3.5 + OpenRouter Fusion** with DOE Screening, TRIZ, MEErP, LCA, and BNAT frameworks.\n\n'
              cat /tmp/deep-research-results.md
              printf '\n\n---\n*Research powered by Deep Search with R&D Engineering Framework*\n'
            } > /tmp/deep-research-comment.md
            gh issue comment "$ISSUE_NUMBER" \
              --body-file /tmp/deep-research-comment.md
          fi

      - name: Update issue labels
        if: env.ISSUE_NUMBER
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "deep-search" \
            --add-label "deep-search:complete" \
            --add-label "needs-review" 2>/dev/null || true

      - name: Add to project
        if: env.ISSUE_NUMBER
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Research complete. Results posted to issue."
