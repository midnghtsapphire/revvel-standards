# Deep Search Research - R&D Engineering Framework
# Uses Sonnet 3.5 + OpenRouter Fusion with DOE Screening, TRIZ, MEErP, LCA, BNAT
# Based on Audrey's Master Prompt for rigorous R&D research
#
# The inline JS was extracted to scripts/deep-search-research.js to keep this
# YAML file valid (multi-line template literals inside run: blocks cause parse
# errors in strict YAML validators).

name: Deep Search Research

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to research
        required: false
        type: number
      research_query:
        description: Direct research query (if no issue)
        required: false
        type: string
      profile:
        description: Routing profile to use
        required: false
        default: deep_search
        type: string

permissions:
  issues: write
  contents: read

jobs:
  deep-research:
    name: Deep R&D Research (DOE/TRIZ/MEErP/LCA/BNAT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       github.event.label.name == 'deep-search')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run Deep Research
        id: research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Lane config (#17868): without these routedChat has nowhere to go —
          # Layer 0 resolves to the runner's own loopback and the paid lane is
          # refused by the spend gate. See docs/LOCAL_LLM_SETUP.md.
          LMSTUDIO_ENDPOINT: ${{ secrets.LMSTUDIO_ENDPOINT }}
          LMSTUDIO_API_KEY: ${{ secrets.LMSTUDIO_API_KEY }}
          LMSTUDIO_MODEL: ${{ vars.LMSTUDIO_MODEL }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          REVVEL_LLM_ALLOW_CLOUD: ${{ vars.REVVEL_LLM_ALLOW_CLOUD }}
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
          RESEARCH_QUERY: ${{ inputs.research_query || github.event.issue.title }}
          PROFILE: ${{ inputs.profile || 'deep_search' }}
        run: node scripts/deep-search-research.js

      - name: Post research to issue
        if: env.ISSUE_NUMBER
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          if [ -f /tmp/deep-research-results.md ]; then
            {
              printf '## 🔬 Deep R&D Research Results\n\n'
              printf '> Using **Sonnet 3.5 + OpenRouter Fusion** with DOE Screening, TRIZ, MEErP, LCA, and BNAT frameworks.\n\n'
              cat /tmp/deep-research-results.md
              printf '\n\n---\n*Research powered by Deep Search with R&D Engineering Framework*\n'
            } > /tmp/deep-research-comment.md
            gh issue comment "$ISSUE_NUMBER" \
              --body-file /tmp/deep-research-comment.md
          fi

      - name: Update issue labels
        if: ${{ github.event.issue.number || inputs.issue_number }}
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "deep-search" \
            --add-label "deep-search:complete" \
            --add-label "needs-review" 2>/dev/null || true
