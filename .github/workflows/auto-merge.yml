# Auto-Merge Workflow
#
# Enables auto-merge on PRs labeled `automerge` and disables it when the label
# is removed. Actual merge is gated on branch protection required checks.
#
# QUIET-MODE HISTORY (2026-07-25): Triggers were disabled by PR #16805 (quiet
# mode). Per DECISIONS.md D017 (2026-08-08 owner directive), triggers restored
# to pre-#16805 state. Issue #17099 is the standing Quiet Mode gate signal per
# wr/specs/01-quiet-mode.md — do NOT close it.
# ARCHIVE (RVS-PRESERVE-001): prior quiet-mode-only trigger was
# `on: { workflow_dispatch: {} }` (author: quiet-mode-agent, 2026-07-25).

name: Auto-Merge

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  toggle-automerge:
    if: github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable or disable auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action; // 'labeled' | 'unlabeled'
            core.info(`PR #${pr.number}: automerge label ${action}`);
            if (action === 'unlabeled') {
              core.info('Auto-merge label removed; nothing to do (branch protection governs merge).');
              return;
            }
            // Additional gating logic lives in scripts/enable-automerge.js if present.
