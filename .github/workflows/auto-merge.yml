name: Auto-Merge

# 2026-07-25 owner-directive: quiet-mode gating removed 2026-08-08 per DECISIONS.md D017.
# Original quiet-mode disablement (PR #16805) archived here for RVS-PRESERVE-001 audit trail:
#   who: owner  when: 2026-07-25  why: reduce ~80 machine PRs/night, ~$400/week OpenRouter spend
# Exit-quiet-mode restoration (this file): DECISIONS.md D017, gated by open issue #17099.

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'auto-merge' && github.event.action == 'labeled'
    steps:
      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
            } catch (err) {
              core.warning(`merge deferred: ${err.message}`);
            }

      - name: Remove auto-merge label on unlabel
        if: github.event.action == 'unlabeled' && github.event.label.name == 'auto-merge'
        uses: actions/github-script@v7
        with:
          script: |
            // LABEL-RACE-001: swallow 404 when label already removed by concurrent run
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'auto-merge'
            }).catch(err => {
              if (err.status !== 404) throw err;
            });
