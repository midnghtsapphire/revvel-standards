name: Auto-Merge on Approval
# quiet-mode 2026-07-25 (owner request): automatic triggers disabled;
# run manually via workflow_dispatch if needed.
on:
  workflow_dispatch: null

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  checks: read
jobs:
  enable-auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'labeled' &&
      github.event.label.name == 'auto-merge'
    steps:
      - name: Enable pull request auto-merge (squash)
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const pr     = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);

            // Safety check: don't enable if 'won't-merge' is also present
            if (labels.includes("won't-merge")) {
              core.warning(
                `PR #${pr.number} has both 'auto-merge' and 'won\\'t-merge' labels. ` +
                `Auto-merge NOT enabled — remove 'won\\'t-merge' first.`
              );
              return;
            }

            // VEINS grounding gate: never arm auto-merge over a red suite.
            // If the grounded Ship Quality Check has completed with a failure
            // on the current head SHA, refuse to enable — an LLM opinion (or
            // the absence of one) cannot merge a PR whose real tests fail.
            // Pending/queued checks are fine: GitHub's auto-merge waits for
            // required checks before merging.
            try {
              const { owner, repo } = context.repo;
              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              const groundedFailed = checks.check_runs.filter(r =>
                r.name.toLowerCase().includes('ship quality check') &&
                r.status === 'completed' &&
                !['success', 'skipped', 'neutral'].includes(r.conclusion)
              );
              if (groundedFailed.length > 0) {
                core.warning(
                  `PR #${pr.number}: grounded Ship Quality Check is RED on ` +
                  `${pr.head.sha.substring(0, 7)} — auto-merge NOT enabled. ` +
                  `Fix the failing test suite first (grounding gate, WR 14).`
                );
                return;
              }
            } catch (e) {
              core.warning(`Could not verify grounding gate for PR #${pr.number}: ${e.message}`);
            }

            try {
              await github.graphql(`
                mutation($prId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $prId
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number title }
                  }
                }
              `, { prId: pr.node_id });

              core.notice(
                `✅ Auto-merge ENABLED on PR #${pr.number} — ` +
                `will merge once required checks pass and approvals are in.`
              );
            } catch (e) {
              // Provide a clear, actionable error message
              if (e.message?.includes('auto merge is not allowed')) {
                core.error(
                  `Auto-merge is not allowed for PR #${pr.number}. ` +
                  `Branch protection rules may not be configured. ` +
                  `Go to Settings → Branches and enable required status checks + required reviews on 'main'.`
                );
              } else {
                core.error(`Failed to enable auto-merge on PR #${pr.number}: ${e.message}`);
              }
              throw e;
            }
    timeout-minutes: 30
  disable-auto-merge:
    name: Disable Auto-Merge
    runs-on: ubuntu-latest
    if: |
      (github.event.action == 'unlabeled' && github.event.label.name == 'auto-merge') ||
      (github.event.action == 'labeled'   && github.event.label.name == 'won''t-merge')
    steps:
      - name: Disable pull request auto-merge
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            try {
              await github.graphql(`
                mutation($prId: ID!) {
                  disablePullRequestAutoMerge(input: { pullRequestId: $prId }) {
                    pullRequest { number title }
                  }
                }
              `, { prId: pr.node_id });

              const reason = context.payload.label.name === "won't-merge"
                ? `'won\\'t-merge' label applied`
                : `'auto-merge' label removed`;

              core.notice(
                `⏸️  Auto-merge DISABLED on PR #${pr.number} (${reason}).`
              );
            } catch (e) {
              // If auto-merge was never enabled, the mutation will error — ignore quietly
              if (e.message?.includes('pull request does not have auto merge enabled')) {
                core.info(`PR #${pr.number} did not have auto-merge enabled — nothing to disable.`);
              } else {
                core.warning(`Could not disable auto-merge on PR #${pr.number}: ${e.message}`);
              }
            }
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
