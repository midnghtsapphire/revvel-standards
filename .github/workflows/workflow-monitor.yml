name: Workflow Monitor (Real-Time)
on:
  workflow_run:
    types:
      - requested
      - in_progress
      - completed
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: Specific workflow run ID to monitor
        type: string
        required: false
permissions:
  actions: write
  issues: write
  contents: read
jobs:
  monitor:
    name: Monitor workflow health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Monitor workflow
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowRunIdInput = context.payload.inputs?.workflow_run_id;
            let run = context.payload.workflow_run;

            // Configuration
            const MAX_DURATION_MS = 15 * 60 * 1000; // 15 minutes
            const ALERT_LABEL = 'workflow-stuck';
            const AUTO_FIX_LABEL = 'auto-fix';
            const NEEDS_HUMAN_LABEL = 'needs-human';

            if (!run && workflowRunIdInput) {
              try {
                const { data } = await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: Number(workflowRunIdInput),
                });
                run = data;
              } catch (error) {
                core.warning(`Could not load workflow run ${workflowRunIdInput}: ${error.message}`);
              }
            }
            if (!run) {
              core.info('No workflow run in payload and no valid workflow_run_id input; skipping monitoring');
              return;
            }

            const runId = run.id;
            const runName = run.name;
            const runStatus = run.status;
            const runConclusion = run.conclusion;
            const runUrl = run.html_url;
            const headBranch = run.head_branch;
            const headSha = run.head_sha;
            const createdAt = new Date(run.created_at);
            const duration = Date.now() - createdAt.getTime();
            const maxDuration = MAX_DURATION_MS;
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            const { execSync } = require('child_process');

            function emitSelfHealContract(component, errorMessage, actionName) {
              const outputPath = `/tmp/workflow-monitor-self-heal-contract-${runId}.json`;
              const args = [
                'node',
                'scripts/self-heal-contract.js',
                '--component', component,
                '--error', errorMessage,
                '--repo', `${owner}/${repo}`,
                '--workflow', 'workflow-monitor.yml',
                '--run-id', `${runId}`,
                '--action', actionName,
                '--verification', 'workflow-run-detection',
                '--output', outputPath,
              ];
              execSync(args.map((value) => `"${String(value).replace(/"/g, '\\"')}"`).join(' '), {
                stdio: 'inherit',
              });
            }

            async function verifyNewRunStarted(reasonLabel) {
              const delays = [5000, 10000, 20000, 30000];
              const rerunRequestTime = Date.now();

              for (const delay of delays) {
                await sleep(delay);
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: run.workflow_id,
                  branch: headBranch,
                  per_page: 20,
                });
                const found = (data.workflow_runs || []).find((candidate) => {
                  if (candidate.id === runId) return false;
                  if ((candidate.head_sha || '') !== (headSha || '')) return false;
                  const candidateCreatedAt = new Date(candidate.created_at || 0).getTime();
                  // 120000ms = 2 minutes of clock-skew tolerance around rerun request time.
                  return Number.isFinite(candidateCreatedAt) && candidateCreatedAt >= (rerunRequestTime - 120000);
                });
                if (found) {
                  core.info(`✅ Verified auto-retry run started (${reasonLabel}): ${found.html_url}`);
                  return { ok: true, runUrl: found.html_url };
                }
              }

              const verifyError = `${reasonLabel} rerun could not be verified after exponential backoff checks`;
              core.warning(`⚠️ ${verifyError}`);
              await github.rest.issues.create({
                owner,
                repo,
                title: `[FAILURE] ${runName} rerun verification failed`,
                body: [
                  '## ⚠️ Self-heal verification failed',
                  '',
                  `Workflow: ${runName}`,
                  `Run ID: ${runId}`,
                  `Branch: ${headBranch}`,
                  `Reason: ${verifyError}`,
                  '',
                  `[View Workflow Run](${runUrl})`,
                  '',
                  'A retry was requested, but the monitor could not verify a new run startup.',
                  'Manual intervention required.',
                  '',
                  '---',
                  `_Auto-generated by workflow-monitor.yml at ${new Date().toISOString()}_`,
                ].join('\n'),
                labels: [
                  'workflow-failure',
                  NEEDS_HUMAN_LABEL,
                  'priority-p1',
                ],
              });
              return { ok: false, runUrl: null };
            }

            core.info(`Monitoring: ${runName} (ID: ${runId})`);
            core.info(`Status: ${runStatus}, Conclusion: ${runConclusion || 'N/A'}`);
            core.info(`Duration: ${Math.round(duration / 60000)} minutes`);

            // ──────────────────────────────────────────────────────────────
            // Case 1: Workflow stuck (running too long)
            // ──────────────────────────────────────────────────────────────
            if (runStatus === 'in_progress' && duration > maxDuration) {
              core.warning(`⚠️ Workflow stuck: ${runName} running for ${Math.round(duration / 60000)} minutes`);
              
              // Check if alert already exists
              const existingAlerts = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue is:open label:"${ALERT_LABEL}" "${runName}" in:title`,
              });
              
              if (existingAlerts.data.total_count === 0) {
                // Create alert issue
                const issue = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `[ALERT] Workflow stuck: ${runName}`,
                  body: [
                    '## 🚨 Stuck Workflow Alert',
                    '',
                    `Workflow: ${runName}`,
                    `Run ID: ${runId}`,
                    `Duration: ${Math.round(duration / 60000)} minutes`,
                    `Status: ${runStatus}`,
                    `Branch: ${headBranch}`,
                    `Threshold: ${Math.round(maxDuration / 60000)} minutes`,
                    '',
                    '### Auto-Actions Taken',
                    '',
                    '- ✅ Alert issue created',
                    '- 🔄 Attempting workflow cancellation and retry',
                    '- 🔄 Circuit breaker activated if this is 3rd+ failure',
                    '',
                    '### Manual Investigation',
                    '',
                    `[View Workflow Run](${runUrl})`,
                    '',
                    '### Next Steps',
                    '',
                    '1. Check workflow logs for specific failure point',
                    '2. Review recent changes to workflow file',
                    '3. Check for external service outages (OpenRouter, GitHub, etc.)',
                    '4. Verify credentials and secrets are valid',
                    '',
                    '---',
                    '',
                    `_Auto-generated by workflow-monitor.yml at ${new Date().toISOString()}_`,
                  ].join('\n'),
                  labels: [
                    ALERT_LABEL,
                    AUTO_FIX_LABEL,
                    'priority-p0',
                  ],
                });
                
                core.info(`✅ Created alert issue #${issue.data.number}`);
              } else {
                core.info(`ℹ️ Alert issue already exists, skipping creation`);
              }
              
              // Cancel and retry workflow
              try {
                core.info('🔄 Cancelling stuck workflow...');
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: runId,
                });
                
                core.info('⏳ Waiting 10 seconds before retry...');
                await sleep(10000);
                
                core.info('🔄 Re-running workflow...');
                await github.rest.actions.reRunWorkflow({
                  owner,
                  repo,
                  run_id: runId,
                });
                
                const verifyResult = await verifyNewRunStarted('stuck-workflow');
                if (!verifyResult.ok) {
                  emitSelfHealContract(
                    'workflow-monitor/stuck-rerun',
                    'Rerun verification failed after stuck workflow cancel+rerun',
                    'cancel-and-rerun'
                  );
                }
                core.info('✅ Workflow cancelled and re-run triggered with verification');
              } catch (error) {
                core.warning(`⚠️ Could not cancel/retry workflow: ${error.message}`);
              }
            }

            // ──────────────────────────────────────────────────────────────
            // Case 2: Workflow failed
            // ──────────────────────────────────────────────────────────────
            if (runConclusion === 'failure') {
              core.warning(`❌ Workflow failed: ${runName}`);
              
              // Check if failure is transient
              let isTransient = false;
              try {
                const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: runId,
                });
                
                for (const job of jobs.jobs) {
                  if (job.conclusion === 'failure') {
                    // Check for transient error patterns in job name/logs
                    const jobName = job.name.toLowerCase();
                    if (jobName.includes('timeout') ||
                        jobName.includes('rate limit') ||
                        jobName.includes('503') ||
                        jobName.includes('502')) {
                      isTransient = true;
                      core.info(`  Transient failure detected in job: ${job.name}`);
                      break;
                    }
                  }
                }
              } catch (error) {
                core.warning(`⚠️ Could not check for transient failure: ${error.message}`);
              }
              
              if (isTransient) {
                core.info('🔄 Transient failure detected, triggering auto-retry');

                try {
                  await github.rest.actions.reRunWorkflow({
                    owner,
                    repo,
                    run_id: runId,
                  });
                  const verifyResult = await verifyNewRunStarted('transient-failure');
                  if (!verifyResult.ok) {
                    emitSelfHealContract(
                      'workflow-monitor/transient-retry',
                      'Transient retry dispatched but run start verification failed',
                      'rerun-on-transient-failure'
                    );
                  } else {
                    core.info(`✅ Transient retry verified: ${verifyResult.runUrl}`);
                  }
                } catch (error) {
                  core.warning(`⚠️ Auto-retry failed: ${error.message}`);
                  
                  // Fallback: create issue for manual intervention
                  await github.rest.issues.create({
                    owner,
                    repo,
                    title: `[FAILURE] ${runName} failed (auto-retry failed)`,
                    body: [
                      '## ❌ Workflow Failure',
                      '',
                      `Workflow: ${runName}`,
                      `Run ID: ${runId}`,
                      `Branch: ${headBranch}`,
                      'Failure Type: Transient (auto-retry attempted)',
                      '',
                      '### Auto-Retry Failed',
                      '',
                      'The automatic retry mechanism was unable to recover from this failure.',
                      'Manual investigation required.',
                      '',
                      `[View Workflow Run](${runUrl})`,
                      '',
                      '---',
                      '',
                      `_Auto-generated by workflow-monitor.yml at ${new Date().toISOString()}_`,
                    ].join('\n'),
                    labels: [
                      'workflow-failure',
                      NEEDS_HUMAN_LABEL,
                      'priority-p1',
                    ],
                  });
                }
              } else {
                core.info('❌ Non-transient failure, creating issue for human review');
                
                // Create issue for manual review
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: `[FAILURE] ${runName} failed`,
                  body: [
                    '## ❌ Workflow Failure',
                    '',
                    `Workflow: ${runName}`,
                    `Run ID: ${runId}`,
                    `Branch: ${headBranch}`,
                    'Failure Type: Non-transient (requires manual investigation)',
                    '',
                    '### Manual Investigation Required',
                    '',
                    'This workflow failed with a non-transient error that cannot be auto-recovered.',
                    '',
                    `[View Workflow Run](${runUrl})`,
                    '',
                    '### Next Steps',
                    '',
                    '1. Check workflow logs for error details',
                    '2. Review recent changes to workflow file',
                    '3. Verify all dependencies and secrets',
                    '4. Fix root cause and re-run manually',
                    '',
                    '---',
                    '',
                    `_Auto-generated by workflow-monitor.yml at ${new Date().toISOString()}_`,
                  ].join('\n'),
                  labels: [
                    'workflow-failure',
                    NEEDS_HUMAN_LABEL,
                    'priority-p2',
                  ],
                });
              }
            }

            // ──────────────────────────────────────────────────────────────
            // Case 3: Workflow succeeded (close any open alerts)
            // ──────────────────────────────────────────────────────────────
            if (runConclusion === 'success') {
              core.info('✅ Workflow succeeded');
              
              // Check for open alert issues for this workflow
              const openAlerts = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue is:open label:"${ALERT_LABEL}" "${runName}" in:title`,
              });
              
              for (const alert of openAlerts.data.items) {
                // Post recovery comment
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: [
                    '## ✅ Workflow Recovered',
                    '',
                    `The workflow ${runName} has successfully completed.`,
                    '',
                    `Run ID: ${runId}`,
                    `Branch: ${headBranch}`,
                    '',
                    `[View Successful Run](${runUrl})`,
                    '',
                    'Closing this alert.',
                    '',
                    '---',
                    '',
                    `_Auto-generated by workflow-monitor.yml at ${new Date().toISOString()}_`,
                  ].join('\n'),
                });
                
                // Close alert
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  state: 'closed',
                  labels: [
                    ...alert.labels.map(l => l.name),
                    'resolved',
                  ].filter(l => l !== ALERT_LABEL),
                });
                
                core.info(`✅ Closed alert issue #${alert.number}`);
              }
            }
      - name: Update summary
        if: always()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let run = context.payload.workflow_run;
            const inputRunId = context.payload.inputs?.workflow_run_id;
            if (!run && inputRunId) {
              try {
                const { data } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: Number(inputRunId),
                });
                run = data;
              } catch (error) {
                core.warning(`Could not load workflow run ${inputRunId} for summary: ${error.message}`);
              }
            }
            if (!run) return;

            core.summary
              .addHeading('Workflow Monitor Report')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Workflow', run.name],
                ['Run ID', String(run.id)],
                ['Status', run.status],
                ['Conclusion', run.conclusion || 'N/A'],
                ['Branch', run.head_branch],
                ['Duration', `${Math.round((Date.now() - new Date(run.created_at).getTime()) / 60000)} min`],
                ['URL', run.html_url],
              ]);

            await core.summary.write();
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
