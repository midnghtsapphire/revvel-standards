name: Blue Ocean SAR live run

# Manual only. Runs the real-data tools against live public sources for one
# case area. The build sandbox blocks these hosts; GitHub runners do not.
# Outputs, evidence logs and hashes are uploaded as a run artifact.
# The repository is public, so artifacts are visible to anyone who can see
# the repo. Do not add private records (Ring footage, licensed or
# legal-process data) to this workflow.

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Case ID used in file names and the evidence log
        required: true
        default: CASE-001
      lat:
        description: Centre latitude (decimal degrees)
        required: true
      lon:
        description: Centre longitude (decimal degrees)
        required: true
      radius_m:
        description: Radius in metres for imagery and terrain
        required: true
        default: "800"
      before:
        description: Sentinel-2 "before" window, "YYYY-MM-DD YYYY-MM-DD"
        required: true
        default: "2026-06-01 2026-07-31"
      after:
        description: Sentinel-2 "after" window, "YYYY-MM-DD YYYY-MM-DD"
        required: true
        default: "2026-08-15 2026-09-30"
      lpb_category:
        description: Lost-person category for the simulation (blank to skip)
        required: false
        default: hikers
      lpb_hours:
        description: Elapsed hours for the simulation
        required: false
        default: "24"
      usgs_sites:
        description: Comma-separated USGS gauge site numbers (blank to skip)
        required: false
        default: ""
      cams_country:
        description: OpenTrafficCamMap country file, e.g. USA (blank to skip)
        required: false
        default: USA

permissions:
  contents: read

concurrency:
  group: blue-ocean-sar-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CASE_ID: ${{ inputs.case_id }}
      LAT: ${{ inputs.lat }}
      LON: ${{ inputs.lon }}
      RADIUS_M: ${{ inputs.radius_m }}
      BEFORE: ${{ inputs.before }}
      AFTER: ${{ inputs.after }}
      LPB_CATEGORY: ${{ inputs.lpb_category }}
      LPB_HOURS: ${{ inputs.lpb_hours }}
      USGS_SITES: ${{ inputs.usgs_sites }}
      CAMS_COUNTRY: ${{ inputs.cams_country }}
      EVIDENCE_OPERATOR: github-actions:${{ github.actor }}
      # Optional repository secrets. Search works without them.
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      OUT: ${{ github.workspace }}/live-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate inputs
        run: |
          python3 - <<'EOF'
          import os, re, sys
          lat, lon, r = float(os.environ["LAT"]), float(os.environ["LON"]), float(os.environ["RADIUS_M"])
          assert -90 <= lat <= 90 and -180 <= lon <= 180 and 10 <= r <= 20000, "lat/lon/radius out of range"
          for k in ("BEFORE", "AFTER"):
              assert re.fullmatch(r"\d{4}-\d{2}-\d{2} \d{4}-\d{2}-\d{2}", os.environ[k]), f"{k} must be 'YYYY-MM-DD YYYY-MM-DD'"
          assert re.fullmatch(r"[A-Za-z0-9_.-]{1,40}", os.environ["CASE_ID"]), "case_id: letters, digits, _ . - only"
          assert re.fullmatch(r"[0-9,]*", os.environ["USGS_SITES"]), "usgs_sites: digits and commas only"
          assert re.fullmatch(r"[A-Za-z_]*", os.environ["CAMS_COUNTRY"]), "cams_country: letters only"
          assert re.fullmatch(r"[A-Za-z0-9_ -]*", os.environ["LPB_CATEGORY"]), "lpb_category: plain text only"
          float(os.environ["LPB_HOURS"] or 0)
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "rasterio>=1.3,<2" "scikit-learn>=1.3,<2" "cryptography>=42"

      - name: Run unit tests
        working-directory: docs/blue-ocean-sar
        run: |
          (cd realdata && python -m unittest discover -p 'test_*.py')
          (cd opendata && python -m unittest discover)
          (cd evidence && python -m unittest discover)

      - name: Prepare output folder and bounding box
        run: |
          mkdir -p "$OUT/evidence"
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import math, os
          lat, lon, r = float(os.environ["LAT"]), float(os.environ["LON"]), float(os.environ["RADIUS_M"])
          dlat = r / 111320.0
          dlon = r / (111320.0 * max(math.cos(math.radians(lat)), 1e-6))
          print(f"BBOX={lon - dlon:.6f},{lat - dlat:.6f},{lon + dlon:.6f},{lat + dlat:.6f}")
          EOF

      - name: Sentinel-2 scenes (Earth Search STAC)
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/opendata
        run: |
          read -r B0 B1 <<< "$BEFORE"; read -r A0 A1 <<< "$AFTER"
          python stac.py --catalog earth-search --collections sentinel-2-l2a --bbox "$BBOX" \
            --datetime "$B0/$A1" --max-cloud 30 --limit 50 \
            --evidence-log "$OUT/evidence" --operator "$EVIDENCE_OPERATOR" > "$OUT/stac_sentinel2.json"

      - name: GEDI canopy granules (NASA CMR)
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/opendata
        run: |
          python cmr.py --short-name GEDI02_A --bbox "$BBOX" \
            --evidence-log "$OUT/evidence" --operator "$EVIDENCE_OPERATOR" > "$OUT/cmr_gedi.json"

      - name: USGS 3DEP elevation (US only)
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/opendata
        run: |
          python usgs_3dep.py export --bbox "$BBOX" --resolution-m 1 --out-tif "$OUT/dem_3dep.tif" \
            --evidence-log "$OUT/evidence" --operator "$EVIDENCE_OPERATOR"

      - name: Terrain analysis (Copernicus GLO-30)
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/realdata
        run: |
          python dem_terrain.py --lat "$LAT" --lon "$LON" --radius-m "$RADIUS_M" --out-prefix "$OUT/terrain"

      - name: Sentinel-2 vegetation change (NDVI and red-edge)
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/realdata
        run: |
          read -r B0 B1 <<< "$BEFORE"; read -r A0 A1 <<< "$AFTER"
          python s2_change.py --lat "$LAT" --lon "$LON" --radius-m "$RADIUS_M" \
            --before "$B0" "$B1" --after "$A0" "$A1" --index ndre --out-dir "$OUT/s2_change"

      - name: OpenStreetMap drainage and access features
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/opendata
        run: |
          python osm.py overpass --lat "$LAT" --lon "$LON" --radius "$RADIUS_M" \
            --evidence-log "$OUT/evidence" --operator "$EVIDENCE_OPERATOR" > "$OUT/osm_features.geojson"

      - name: USGS gauges
        if: ${{ inputs.usgs_sites != '' }}
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/realdata
        run: |
          read -r A0 A1 <<< "$AFTER"
          python usgs_gauges.py --sites "$USGS_SITES" --start "${A0}T00:00Z" --end "${A1}T23:59Z" \
            --params 00060,00065,00010 --out-csv "$OUT/usgs_iv.csv" --out-json "$OUT/usgs_iv.json"

      - name: Public traffic cameras nearby
        if: ${{ inputs.cams_country != '' }}
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/opendata
        run: |
          python traffic_cams.py --country "$CAMS_COUNTRY" --lat "$LAT" --lon "$LON" --radius-km 10 --limit 25 \
            --evidence-log "$OUT/evidence" --operator "$EVIDENCE_OPERATOR" > "$OUT/traffic_cams.json"

      - name: Lost-person simulation on the 3DEP surface
        if: ${{ inputs.lpb_category != '' }}
        continue-on-error: true
        working-directory: docs/blue-ocean-sar/realdata
        run: |
          test -f "$OUT/dem_3dep.tif" || { echo "no 3DEP DEM (outside the US or export failed); skipping"; exit 0; }
          python lost_person_sim.py simulate --lat "$LAT" --lon "$LON" --category "$LPB_CATEGORY" \
            --hours "$LPB_HOURS" --dem "$OUT/dem_3dep.tif" --out "$OUT/lost_person_sim"

      - name: Verify evidence log and record its head
        if: always()
        working-directory: docs/blue-ocean-sar
        run: |
          if [ -f "$OUT/evidence/evidence.jsonl" ]; then
            python -m evidence verify --log "$OUT/evidence" --json > "$OUT/evidence_verify.json"
            python -m evidence head --log "$OUT/evidence" | tee "$OUT/evidence_head.txt"
            echo "Evidence head: $(cat "$OUT/evidence_head.txt")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No evidence log was written." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          echo "Files: $(wc -l < "$OUT/SHA256SUMS")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blue-ocean-sar-live-${{ inputs.case_id }}-${{ github.run_id }}
          path: live-out
          retention-days: 30
