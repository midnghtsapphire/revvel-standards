name: Deploy oAudrey Hub → DigitalOcean App Platform
on:
  push:
    branches:
      - main
    paths:
      - oaudrey/**
      - fieldwork/**
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: Force redeploy even if no file changes
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
jobs:
  deploy:
    name: Deploy to DigitalOcean App Platform
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check required secret
        id: check-secret
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::warning::DIGITALOCEAN_API_TOKEN is not set — skipping deploy."
            echo "See standards/OAUDREY_DEPLOYMENT_STANDARD.md for provisioning steps."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.check-secret.outputs.skip != 'true'
      - name: Install doctl
        if: steps.check-secret.outputs.skip != 'true'
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
      - name: Validate app spec
        if: steps.check-secret.outputs.skip != 'true'
        run: doctl apps spec validate oaudrey/.do/app.yaml
      - name: Get existing app ID (if any)
        id: app-lookup
        if: steps.check-secret.outputs.skip != 'true'
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header 2>/dev/null \
            | grep "oaudrey-hub" \
            | awk '{print $1}' \
            || true)
          echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"
      - name: Create app (first deploy)
        if: steps.check-secret.outputs.skip != 'true' && steps.app-lookup.outputs.app_id == ''
        run: |
          doctl apps create --spec oaudrey/.do/app.yaml --wait
          echo "::notice::oAudrey Hub app created on DigitalOcean App Platform."
      - name: Update app (subsequent deploys)
        if: steps.check-secret.outputs.skip != 'true' && steps.app-lookup.outputs.app_id != ''
        run: |
          doctl apps update "${{ steps.app-lookup.outputs.app_id }}" \
            --spec oaudrey/.do/app.yaml
          echo "::notice::oAudrey Hub app spec updated."
      - name: Wait for deployment to complete
        if: steps.check-secret.outputs.skip != 'true' && steps.app-lookup.outputs.app_id != ''
        run: |
          APP_ID="${{ steps.app-lookup.outputs.app_id }}"
          echo "Waiting up to 5 minutes for deployment..."
          for i in $(seq 1 30); do
            STATUS=$(doctl apps get "$APP_ID" --format ActiveDeployment.Phase --no-header 2>/dev/null || echo "UNKNOWN")
            echo "  Attempt $i/30 — phase: $STATUS"
            if [ "$STATUS" = "ACTIVE" ]; then
              echo "::notice::Deployment ACTIVE ✅"
              exit 0
            fi
            if [ "$STATUS" = "ERROR" ]; then
              echo "::error::Deployment entered ERROR state."
              doctl apps list-deployments "$APP_ID" --format ID,Phase,Progress --no-header | head -5
              exit 1
            fi
            sleep 10
          done
          echo "::warning::Deployment did not reach ACTIVE within 5 minutes — check DO dashboard."
      - name: Post success summary
        if: success() && steps.check-secret.outputs.skip != 'true'
        run: |
          echo "## oAudrey Deploy ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hub URL | https://oaudrey.com |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FieldWork | https://fieldwork.oaudrey.com |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
      - name: Post failure issue
        if: failure() && steps.check-secret.outputs.skip != 'true'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 oAudrey deploy FAILED — ${new Date().toISOString().split('T')[0]}`,
              body: [
                '## oAudrey Deploy Failure',
                '',
                `**Triggered by:** \`${context.actor}\``,
                `**Commit:** \`${context.sha}\``,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### Next steps',
                '1. Check the workflow run logs above',
                '2. Verify `DIGITALOCEAN_API_TOKEN` is set in repo secrets',
                '3. Review `oaudrey/.do/app.yaml` for spec errors',
                '4. See `standards/OAUDREY_DEPLOYMENT_STANDARD.md` for full troubleshooting guide',
              ].join('\n'),
              labels: ['deploy-failure', 'oaudrey'],
            });
    timeout-minutes: 30
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
