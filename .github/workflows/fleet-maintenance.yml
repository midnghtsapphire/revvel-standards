name: Fleet Maintenance Sweep

# Sweeps every repository in the owner account and, for a capped rotating subset
# each run, files a [WR] Work Request into revvel-standards. Everything flows
# through the existing pipeline: the issue triggers research-engine.yml (your
# research engine) → coder, which opens a draft PR on the target repo for review.
# This sweep never clones, modifies, or deletes any repo. See
# scripts/fleet-maintenance.js.
#
# Rollout: weekly + manual. Manual runs default to dry-run (log only). It no-ops
# if FLEET_TOKEN is not set.
#
# Token: uses ADMIN_GITHUB_TOKEN (a PAT with repo access across the org) only to
# LIST repos and open Work Requests. If your full-access PAT has a different name,
# change the FLEET_TOKEN mapping below.

on:
  # COST FREEZE 2026-08-21: scheduled runs disabled. ~496 scheduled runs/day
  # across 46 workflows drove the GitHub Actions bill. The trigger is preserved
  # below, commented, not deleted (RVS-AGENT-001). Re-enable by uncommenting.
  # Every workflow below keeps workflow_dispatch, so it still runs on demand.
  # schedule:
  #   # Mondays 09:00 UTC.
  #   - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log the plan without filing Work Requests'
        type: boolean
        default: true
      max_repos:
        description: 'Max repos to sweep this run'
        type: string
        default: '5'

permissions:
  contents: read
  issues: write

concurrency:
  group: fleet-maintenance
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Sweep repos and file Work Requests through revvel-standards
        env:
          FLEET_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN != '' && secrets.ADMIN_GITHUB_TOKEN || secrets.PROJECTS_PAT }}
          OWNER: ${{ github.repository_owner }}
          CENTRAL_REPO: ${{ github.repository }}
          # Scheduled runs file Work Requests; manual runs honor the dry_run
          # input (default true) so you can preview first.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MAX_REPOS: ${{ inputs.max_repos }}
        run: node scripts/fleet-maintenance.js
