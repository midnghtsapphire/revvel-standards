name: Set default Project v2 fields for new issues

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to backfill or re-run defaults for"
        required: false
        type: string

permissions:
  contents: read
  issues: read

jobs:
  preflight:
    # Probe whether BOTH GitHub App credentials are configured. We must use a
    # job step (not the job-level if:) because GitHub Actions does not permit
    # the secrets context in job-level if conditions; only step-level if and
    # env: / with: contexts can read secrets. The downstream job consumes the
    # boolean output via needs.preflight.outputs.has_creds.
    name: Check Project v2 App credentials
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - id: check
        env:
          APP_ID: ${{ vars.PROJECTS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "App credentials configured (PROJECTS_APP_ID + PROJECTS_APP_PRIVATE_KEY)."
          elif [ -n "${APP_ID}" ] || [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::App auth is half-configured: only one of PROJECTS_APP_ID / PROJECTS_APP_PRIVATE_KEY is set. Skipping default-field setter; configure both to enable, or unset both to silence this warning."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROJECTS_APP_ID and PROJECTS_APP_PRIVATE_KEY not configured; skipping App default-field setter."
          fi

  set-project-defaults:
    name: Add issue to Project v2 and set default fields
    # Skip silently when the GitHub App credentials are not configured. This
    # lets the App and PAT default-setter workflows coexist in the same repo
    # without one always failing on every issue when only one auth path is
    # provisioned. Manual workflow_dispatch always runs so operators can see
    # the actual configuration error if they invoke it intentionally.
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' || needs.preflight.outputs.has_creds == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Required Project v2 node ID. Example format: PVT_kwHOA...
      # Store this as a repository/org/environment variable named PROJECT_ID.
      PROJECT_ID: ${{ vars.PROJECT_ID }}

    steps:
      # Recommended for organization-owned Project v2 boards.
      # Create a GitHub App with:
      # - Organization permissions: Projects = Read and write
      # - Repository permissions: Issues = Read-only
      # Store the App ID in vars.PROJECTS_APP_ID and the private key in secrets.PROJECTS_APP_PRIVATE_KEY.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PROJECTS_APP_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}

      - name: Resolve issue node ID
        id: issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "ISSUE_NUMBER is required for workflow_dispatch runs."
            exit 1
          fi

          ISSUE_ID="$(
            gh api graphql \
              -f owner="${REPO%/*}" \
              -f name="${REPO#*/}" \
              -F number="${ISSUE_NUMBER}" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    issue(number: $number) {
                      id
                      title
                    }
                  }
                }
              ' \
              --jq '.data.repository.issue.id'
          )"

          if [ -z "${ISSUE_ID}" ] || [ "${ISSUE_ID}" = "null" ]; then
            echo "Could not resolve issue node ID for issue #${ISSUE_NUMBER}."
            exit 1
          fi

          echo "issue_id=${ISSUE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Add issue to project or get existing project item
        id: project-item
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_ID: ${{ steps.issue.outputs.issue_id }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            gh api graphql \
              -f project="${PROJECT_ID}" \
              -f content="${ISSUE_ID}" \
              -f query='
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {
                    projectId: $project
                    contentId: $content
                  }) {
                    item {
                      id
                    }
                  }
                }
              ' 2>&1
          )" || true

          ITEM_ID="$(printf '%s' "${RESPONSE}" | jq -r '.data.addProjectV2ItemById.item.id // empty' 2>/dev/null || true)"

          if [ -z "${ITEM_ID}" ]; then
            echo "addProjectV2ItemById did not return an item. The issue may already be in the project."
            echo "${RESPONSE}"
            echo "Looking up the existing item by issue content ID..."

            ITEM_ID="$(
              gh api graphql \
                -f issue="${ISSUE_ID}" \
                -f query='
                  query($issue: ID!) {
                    node(id: $issue) {
                      ... on Issue {
                        projectItems(first: 50) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                ' \
                --jq ".data.node.projectItems.nodes[] | select(.project.id == \"${PROJECT_ID}\") | .id" \
              | head -n 1
            )"
          fi

          if [ -z "${ITEM_ID}" ] || [ "${ITEM_ID}" = "null" ]; then
            echo "Could not add or find the Project v2 item for this issue."
            exit 1
          fi

          echo "item_id=${ITEM_ID}" >> "${GITHUB_OUTPUT}"

      - name: Set default Project v2 fields
        uses: actions/github-script@v7
        env:
          ITEM_ID: ${{ steps.project-item.outputs.item_id }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const script = require('./.github/scripts/set-project-fields.js');
            await script({ github, context, core });
