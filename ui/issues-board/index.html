<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #238636;
      border-color: #238636;
    }
    button:hover {
      background: #2ea043;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .issue-title {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      color: #8b949e;
      font-size: 12px;
      margin-top: 5px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: #30363d;
      color: #c9d1d9;
      margin-right: 4px;
    }
    .assignee {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: #1f6feb;
      color: #fff;
      margin-right: 4px;
    }
    #status {
      color: #8b949e;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input id="repo" type="text" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="status"></div>
  <div id="issues"></div>

  <script>
    // Escape HTML to prevent XSS attacks when rendering user-controlled
    // data (issue titles, labels, assignee logins, URLs) via innerHTML.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const statusEl = document.getElementById('status');
      const issuesEl = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        statusEl.textContent = 'Please enter a valid owner/repo';
        return;
      }

      statusEl.textContent = 'Loading...';
      issuesEl.innerHTML = '';

      try {
        const response = await fetch(
          `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`
        );

        if (!response.ok) {
          statusEl.textContent = `Error: ${response.status} ${response.statusText}`;
          return;
        }

        const issues = await response.json();
        // Filter out pull requests
        const filtered = issues.filter(i => !i.pull_request);

        statusEl.textContent = `Loaded ${filtered.length} issues`;

        issuesEl.innerHTML = filtered.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');

          return `
            <div class="issue">
              <a class="issue-title" href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
                #${escapeHTML(issue.number)} ${escapeHTML(issue.title)}
              </a>
              <div class="issue-meta">
                ${labels} ${assignees}
                <span>opened by @${escapeHTML(issue.user ? issue.user.login : 'unknown')}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        statusEl.textContent = `Error: ${escapeHTML(err.message)}`;
      }
    }
  </script>
</body>
</html>
