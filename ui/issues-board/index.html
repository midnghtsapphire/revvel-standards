<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 20px;
  }
  h1 { color: #58a6ff; margin-bottom: 8px; }
  .subtitle { color: #8b949e; margin-bottom: 24px; }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  input, select, button {
    background: #161b22;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
  }
  button {
    cursor: pointer;
    background: #238636;
    border-color: #2ea043;
  }
  button:hover { background: #2ea043; }
  .issues {
    display: grid;
    gap: 12px;
  }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
  }
  .issue-title {
    color: #58a6ff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
  }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta {
    color: #8b949e;
    font-size: 12px;
    margin-top: 6px;
  }
  .label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    margin-right: 4px;
    background: #21262d;
    border: 1px solid #30363d;
  }
  .status { color: #8b949e; margin: 12px 0; }
</style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <p class="subtitle">PRIME DIRECTIVE: $10k/mo → $10M in 3 years</p>

  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>

  <div id="status" class="status"></div>
  <div id="issues" class="issues"></div>

<script>
  // XSS mitigation: escape HTML-sensitive characters before injection.
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Only allow http(s) URLs to prevent javascript: URI injection.
  function safeUrl(url) {
    if (typeof url !== 'string') return '#';
    try {
      const parsed = new URL(url, window.location.origin);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
        return escapeHTML(parsed.href);
      }
    } catch (_) { /* fallthrough */ }
    return '#';
  }

  async function loadIssues() {
    const repo = document.getElementById('repo').value.trim();
    const state = document.getElementById('state').value;
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('issues');

    listEl.innerHTML = '';
    if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
      statusEl.textContent = 'Enter a valid owner/repo (e.g. octocat/hello-world).';
      return;
    }

    statusEl.textContent = 'Loading issues...';

    try {
      const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
      if (!res.ok) {
        statusEl.textContent = `Error: ${res.status} ${res.statusText}`;
        return;
      }
      const issues = await res.json();
      const real = issues.filter(i => !i.pull_request);
      statusEl.textContent = `${real.length} issue(s) loaded.`;

      listEl.innerHTML = real.map(issue => {
        const title = escapeHTML(issue.title);
        const url = safeUrl(issue.html_url);
        const number = escapeHTML(issue.number);
        const user = escapeHTML(issue.user && issue.user.login);
        const created = escapeHTML((issue.created_at || '').split('T')[0]);
        const labels = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');
        const assignees = (issue.assignees || [])
          .map(a => escapeHTML(a.login))
          .join(', ');

        return `
          <div class="issue">
            <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
            <div class="issue-meta">
              opened by ${user} on ${created}
              ${assignees ? ` · assigned to ${assignees}` : ''}
            </div>
            <div style="margin-top:8px">${labels}</div>
          </div>
        `;
      }).join('');
    } catch (err) {
      statusEl.textContent = `Failed to load: ${escapeHTML(err.message)}`;
    }
  }

  document.getElementById('load').addEventListener('click', loadIssues);
</script>
</body>
</html>
