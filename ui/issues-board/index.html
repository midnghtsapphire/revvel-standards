<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.5rem;
    }
    .controls {
      margin: 1rem 0;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
    }
    button {
      cursor: pointer;
      background: #238636;
      border-color: #238636;
      color: white;
    }
    button:hover { background: #2ea043; }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .issue-title {
      font-size: 1rem;
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover { text-decoration: underline; }
    .issue-meta {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 0.5rem;
    }
    .label {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      background: #30363d;
      font-size: 0.75rem;
      margin-right: 0.25rem;
      color: #c9d1d9;
    }
    .assignee {
      display: inline-block;
      margin-left: 0.5rem;
      color: #8b949e;
    }
    #status { color: #8b949e; font-style: italic; }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="status"></div>
  <div id="issues"></div>

  <script>
    // Escape HTML-sensitive characters to prevent XSS attacks
    // when rendering user-controlled data from the GitHub API.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const statusEl = document.getElementById('status');
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        statusEl.textContent = 'Please enter a valid owner/repo.';
        return;
      }

      statusEl.textContent = 'Loading...';
      container.innerHTML = '';

      try {
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          statusEl.textContent = 'No issues found.';
          return;
        }

        statusEl.textContent = `Loaded ${issues.length} issue(s).`;

        container.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const url = escapeHTML(issue.html_url);
          const number = escapeHTML(issue.number);
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');
          const createdAt = escapeHTML(issue.created_at);

          return `
            <div class="issue">
              <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              <div class="issue-meta">
                ${labels}
                ${assignees}
                <span> · opened ${createdAt}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        statusEl.textContent = `Error: ${escapeHTML(err.message)}`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
