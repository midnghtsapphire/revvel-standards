<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .filters {
      margin-bottom: 20px;
    }
    .filters input, .filters select {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      margin-right: 8px;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover { text-decoration: underline; }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      background: #21262d;
      color: #c9d1d9;
      margin-right: 4px;
    }
    .loading { color: #8b949e; }
    .error { color: #f85149; }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="filters">
    <input type="text" id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load</button>
  </div>
  <div id="issues"><p class="loading">Enter a repository to load issues.</p></div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS.
     * Any user-controlled data (issue titles, labels, usernames, URLs)
     * MUST be passed through this function before interpolation into HTML.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<p class="error">Please enter a valid owner/repo.</p>';
        return;
      }

      container.innerHTML = '<p class="loading">Loading...</p>';

      try {
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<p class="loading">No issues found.</p>';
          return;
        }

        container.innerHTML = issues.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => escapeHTML(a.login))
            .join(', ');
          return `
            <div class="issue">
              <a class="issue-title" href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
                #${escapeHTML(issue.number)} ${escapeHTML(issue.title)}
              </a>
              <div class="issue-meta">
                by ${escapeHTML(issue.user && issue.user.login)}
                ${assignees ? ` · assigned: ${assignees}` : ''}
                ${labels ? ` · ${labels}` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p class="error">Failed to load issues: ${escapeHTML(err.message)}</p>`;
      }
    }
  </script>
</body>
</html>
