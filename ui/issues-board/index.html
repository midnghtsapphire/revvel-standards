<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      margin-right: 8px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }
    .label {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      background: #30363d;
      font-size: 11px;
      margin-right: 4px;
    }
    .assignee {
      display: inline-block;
      background: #1f6feb;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-right: 4px;
    }
    .loading, .error {
      padding: 20px;
      text-align: center;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input type="text" id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="loadBtn">Load Issues</button>
  </div>
  <div id="issues">
    <div class="loading">Enter a repository (e.g., <code>octocat/hello-world</code>) and click Load Issues.</div>
  </div>

  <script>
    // 🛡️ Escape HTML to prevent XSS from user-controlled GitHub data
    // (issue titles, labels, usernames, URLs can all contain arbitrary text).
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Only allow safe http/https URLs; otherwise return '#'.
    function safeURL(url) {
      if (typeof url !== 'string') return '#';
      try {
        const u = new URL(url);
        if (u.protocol === 'http:' || u.protocol === 'https:') {
          return u.href;
        }
      } catch (_) { /* fallthrough */ }
      return '#';
    }

    async function loadIssues() {
      const repoInput = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repoInput || !/^[\w.-]+\/[\w.-]+$/.test(repoInput)) {
        container.innerHTML = '<div class="error">Please enter a valid repository in the form <code>owner/repo</code>.</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading issues...</div>';

      try {
        const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(repoInput.split('/')[0])}/${encodeURIComponent(repoInput.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }
        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="loading">No issues found.</div>';
          return;
        }

        // Filter out pull requests (GitHub API returns PRs in issues endpoint).
        const filtered = issues.filter(i => !i.pull_request);

        container.innerHTML = filtered.map(issue => {
          const title = escapeHTML(issue.title);
          const url = escapeHTML(safeURL(issue.html_url));
          const number = escapeHTML(issue.number);
          const user = escapeHTML(issue && issue.user && issue.user.login ? issue.user.login : 'unknown');
          const createdAt = escapeHTML(issue.created_at);

          const labels = Array.isArray(issue.labels)
            ? issue.labels.map(l => `<span class="label">${escapeHTML(l && l.name ? l.name : '')}</span>`).join('')
            : '';

          const assignees = Array.isArray(issue.assignees)
            ? issue.assignees.map(a => `<span class="assignee">@${escapeHTML(a && a.login ? a.login : '')}</span>`).join('')
            : '';

          return `
            <div class="issue">
              <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              <div class="issue-meta">
                Opened by @${user} on ${createdAt}
              </div>
              <div class="issue-meta">${labels}${assignees}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Failed to load issues: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('loadBtn').addEventListener('click', loadIssues);
  </script>
</body>
</html>
