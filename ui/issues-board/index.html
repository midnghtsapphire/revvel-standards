<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 24px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    .card h3 a { color: var(--accent); text-decoration: none; }
    .card h3 a:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .labels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .label {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #21262d;
      border: 1px solid var(--border);
    }
    .status-open { color: var(--green); }
    .status-closed { color: var(--red); }
    .empty { text-align: center; color: var(--muted); padding: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>📋 Issues Board</h1>
    <div class="controls">
      <input id="repo" placeholder="owner/repo" value="" />
      <select id="state">
        <option value="open">Open</option>
        <option value="closed">Closed</option>
        <option value="all">All</option>
      </select>
      <button id="load">Load</button>
    </div>
  </header>
  <div id="board" class="grid"></div>

  <script>
    // Escape HTML to prevent XSS from user-controlled fields
    // (issue titles, labels, usernames, URLs from GitHub API)
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const board = document.getElementById('board');

      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
        board.innerHTML = '<div class="empty">Enter a valid owner/repo</div>';
        return;
      }

      board.innerHTML = '<div class="empty">Loading...</div>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
        const issues = await res.json();

        // Filter out pull requests
        const filtered = issues.filter(i => !i.pull_request);

        if (filtered.length === 0) {
          board.innerHTML = '<div class="empty">No issues found</div>';
          return;
        }

        board.innerHTML = filtered.map(issue => {
          const title = escapeHTML(issue.title);
          const url = escapeHTML(issue.html_url);
          const number = escapeHTML(issue.number);
          const stateClass = issue.state === 'open' ? 'status-open' : 'status-closed';
          const stateLabel = escapeHTML(issue.state);
          const user = escapeHTML(issue.user && issue.user.login);
          const created = escapeHTML(new Date(issue.created_at).toLocaleDateString());

          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');

          const assignees = (issue.assignees || [])
            .map(a => escapeHTML(a.login))
            .join(', ');

          return `
            <div class="card">
              <h3><a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a></h3>
              <div class="meta">
                <span class="${stateClass}">● ${stateLabel}</span>
                &middot; by ${user} &middot; ${created}
                ${assignees ? `&middot; assigned: ${assignees}` : ''}
              </div>
              <div class="labels">${labels}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        board.innerHTML = `<div class="empty">Error: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
    document.getElementById('repo').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadIssues();
    });
  </script>
</body>
</html>
