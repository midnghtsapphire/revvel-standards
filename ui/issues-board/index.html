<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0d1117;
      color: #c9d1d9;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #238636;
      border-color: #2ea043;
    }
    button:hover { background: #2ea043; }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .issue-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .issue-title a {
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title a:hover { text-decoration: underline; }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: #1f6feb;
      color: white;
      margin-right: 4px;
    }
    .assignee {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      background: #30363d;
      margin-right: 4px;
    }
    #loading, #error { padding: 20px; text-align: center; }
    #error { color: #f85149; }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="issues"></div>
  <div id="loading" style="display:none;">Loading...</div>
  <div id="error" style="display:none;"></div>

  <script>
    // Escape HTML-sensitive characters to prevent XSS.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const issuesEl = document.getElementById('issues');
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');

      issuesEl.innerHTML = '';
      errorEl.style.display = 'none';

      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
        errorEl.textContent = 'Please enter a valid owner/repo';
        errorEl.style.display = 'block';
        return;
      }

      loadingEl.style.display = 'block';

      try {
        const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);
        const issues = await response.json();

        loadingEl.style.display = 'none';

        if (!Array.isArray(issues) || issues.length === 0) {
          issuesEl.innerHTML = '<div class="issue">No issues found.</div>';
          return;
        }

        issuesEl.innerHTML = issues.map(issue => {
          const labels = (issue.labels || []).map(l =>
            `<span class="label">${escapeHTML(l.name)}</span>`
          ).join('');
          const assignees = (issue.assignees || []).map(a =>
            `<span class="assignee">@${escapeHTML(a.login)}</span>`
          ).join('');
          return `
            <div class="issue">
              <div class="issue-title">
                <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">#${escapeHTML(issue.number)} ${escapeHTML(issue.title)}</a>
              </div>
              <div class="issue-meta">
                Opened by @${escapeHTML(issue.user && issue.user.login)} · ${escapeHTML(new Date(issue.created_at).toLocaleDateString())}
              </div>
              <div>${labels} ${assignees}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        loadingEl.style.display = 'none';
        errorEl.textContent = 'Error: ' + escapeHTML(err.message);
        errorEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
