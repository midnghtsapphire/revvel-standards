<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 2rem;
  }
  h1 {
    color: #58a6ff;
    border-bottom: 1px solid #30363d;
    padding-bottom: 0.5rem;
  }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .issue-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #58a6ff;
    text-decoration: none;
  }
  .issue-title:hover { text-decoration: underline; }
  .labels { margin-top: 0.5rem; }
  .label {
    display: inline-block;
    padding: 2px 8px;
    margin-right: 4px;
    border-radius: 12px;
    font-size: 0.75rem;
    background: #21262d;
    color: #c9d1d9;
  }
  .meta { font-size: 0.85rem; color: #8b949e; margin-top: 0.5rem; }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>📋 GitHub Issues Board</h1>
<div id="issues">Loading…</div>

<script>
// Escape HTML-sensitive characters to prevent XSS.
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Validate that a URL is safe (http/https only) to avoid javascript: URIs.
function safeURL(url) {
  try {
    const parsed = new URL(url, window.location.origin);
    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
      return parsed.href;
    }
  } catch (e) {
    // fall through
  }
  return '#';
}

async function loadIssues() {
  const container = document.getElementById('issues');
  try {
    const repo = (new URLSearchParams(window.location.search)).get('repo') || 'octocat/hello-world';
    // Basic sanity check on repo param
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) {
      throw new Error('Invalid repo parameter');
    }
    const res = await fetch(`https://api.github.com/repos/${repo}/issues?state=open&per_page=30`);
    if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
    const issues = await res.json();

    if (!Array.isArray(issues) || issues.length === 0) {
      container.textContent = 'No open issues found.';
      return;
    }

    container.innerHTML = issues.map(issue => {
      const title = escapeHTML(issue.title);
      const url = escapeHTML(safeURL(issue.html_url));
      const number = escapeHTML(issue.number);
      const labels = (issue.labels || [])
        .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
        .join('');
      const assignees = (issue.assignees || [])
        .map(a => escapeHTML(a.login))
        .join(', ');
      const author = escapeHTML(issue.user && issue.user.login);

      return `
        <div class="issue">
          <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">
            #${number} ${title}
          </a>
          <div class="labels">${labels}</div>
          <div class="meta">
            Opened by ${author}${assignees ? ' · Assigned: ' + assignees : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    container.innerHTML = `<div class="error">${escapeHTML(err.message)}</div>`;
  }
}

loadIssues();
</script>
</body>
</html>
