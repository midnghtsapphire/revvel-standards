<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #58a6ff;
    border-bottom: 1px solid #30363d;
    padding-bottom: 10px;
  }
  .controls {
    margin: 20px 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  input, select, button {
    background: #161b22;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 8px 12px;
    border-radius: 6px;
  }
  button {
    cursor: pointer;
    background: #238636;
    border-color: #238636;
  }
  button:hover { background: #2ea043; }
  .issues {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 15px;
  }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 15px;
  }
  .issue-title {
    font-weight: 600;
    margin-bottom: 8px;
  }
  .issue-title a {
    color: #58a6ff;
    text-decoration: none;
  }
  .issue-meta {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 8px;
  }
  .labels {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .label {
    background: #1f6feb;
    color: white;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
  }
  .assignees {
    font-size: 12px;
    color: #8b949e;
    margin-top: 6px;
  }
  .error {
    color: #f85149;
    padding: 10px;
    background: #490202;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="output" class="issues"></div>

  <script>
    // Escape HTML to prevent XSS from user-controlled GitHub fields
    // (title, label names, assignee logins, URLs, etc.)
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value).replace(/[&<>"']/g, function (ch) {
        switch (ch) {
          case '&': return '&amp;';
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '"': return '&quot;';
          case "'": return '&#39;';
        }
        return ch;
      });
    }

    // Only allow http(s) URLs — reject javascript:/data: schemes
    function safeURL(url) {
      try {
        const u = new URL(url, window.location.href);
        if (u.protocol === 'http:' || u.protocol === 'https:') {
          return u.href;
        }
      } catch (e) {
        // fall through
      }
      return '#';
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const output = document.getElementById('output');
      output.innerHTML = '';

      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
        output.innerHTML = '<div class="error">Enter a valid owner/repo</div>';
        return;
      }

      try {
        const res = await fetch(
          `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`
        );
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          output.innerHTML = '<div>No issues found.</div>';
          return;
        }

        output.innerHTML = issues.map(function (issue) {
          const title = escapeHTML(issue.title);
          const url = escapeHTML(safeURL(issue.html_url));
          const number = escapeHTML(issue.number);
          const userLogin = escapeHTML(issue.user && issue.user.login);
          const createdAt = escapeHTML(
            issue.created_at ? new Date(issue.created_at).toLocaleDateString() : ''
          );

          const labels = (issue.labels || []).map(function (l) {
            return '<span class="label">' + escapeHTML(l.name) + '</span>';
          }).join('');

          const assignees = (issue.assignees || []).map(function (a) {
            return escapeHTML(a.login);
          }).join(', ');

          return (
            '<div class="issue">' +
              '<div class="issue-title">' +
                '<a href="' + url + '" target="_blank" rel="noopener noreferrer">#' + number + ' ' + title + '</a>' +
              '</div>' +
              '<div class="issue-meta">by ' + userLogin + ' · ' + createdAt + '</div>' +
              (labels ? '<div class="labels">' + labels + '</div>' : '') +
              (assignees ? '<div class="assignees">👥 ' + assignees + '</div>' : '') +
            '</div>'
          );
        }).join('');
      } catch (err) {
        output.innerHTML = '<div class="error">Failed to load: ' + escapeHTML(err.message) + '</div>';
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
