<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f6f8fa;
      color: #24292f;
    }
    h1 {
      margin-top: 0;
    }
    .controls {
      margin-bottom: 20px;
    }
    .controls input {
      padding: 8px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      width: 300px;
    }
    .issue {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .issue-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .issue-title a {
      color: #0969da;
      text-decoration: none;
    }
    .issue-title a:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 12px;
      color: #57606a;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      margin-right: 4px;
      border-radius: 12px;
      background: #ddf4ff;
      color: #0969da;
      font-size: 11px;
    }
    .assignee {
      display: inline-block;
      margin-right: 6px;
      font-weight: 500;
    }
    .empty {
      text-align: center;
      color: #57606a;
      padding: 40px;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input type="text" id="repo" placeholder="owner/repo (e.g. octocat/hello-world)" />
    <button id="load">Load Issues</button>
  </div>
  <div id="issues"></div>

  <script>
    // Escape HTML special characters to prevent XSS when interpolating
    // user-controlled GitHub API data into innerHTML.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues(repo) {
      const container = document.getElementById('issues');
      container.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = await res.json();
        if (!issues.length) {
          container.innerHTML = '<div class="empty">No open issues 🎉</div>';
          return;
        }
        container.innerHTML = issues.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');
          return `
            <div class="issue">
              <div class="issue-title">
                <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">#${escapeHTML(issue.number)} ${escapeHTML(issue.title)}</a>
              </div>
              <div class="issue-meta">
                ${labels}
                ${assignees}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="empty">Error: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', () => {
      const repo = document.getElementById('repo').value.trim();
      if (repo.includes('/')) loadIssues(repo);
    });
  </script>
</body>
</html>
