<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.5rem;
    }
    .controls {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.5rem;
      border-radius: 6px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 0.3rem;
    }
    .label {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-right: 0.25rem;
      background: #21262d;
      border: 1px solid #30363d;
    }
    .loading, .error {
      padding: 1rem;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load</button>
  </div>
  <div id="issues"></div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS when interpolating
     * user-controlled data (issue titles, labels, usernames, URLs) into
     * the DOM via innerHTML.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<div class="error">Please enter a valid owner/repo.</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading issues…</div>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`GitHub API returned ${res.status}`);
        }
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="loading">No issues found.</div>';
          return;
        }

        // Filter out pull requests (GitHub's API returns PRs as issues too)
        const filtered = issues.filter(i => !i.pull_request);

        container.innerHTML = filtered.map(issue => {
          const title = escapeHTML(issue.title);
          const htmlUrl = escapeHTML(issue.html_url);
          const number = escapeHTML(issue.number);
          const userLogin = escapeHTML(issue.user && issue.user.login);
          const createdAt = escapeHTML(new Date(issue.created_at).toLocaleDateString());

          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');

          const assignees = (issue.assignees || [])
            .map(a => escapeHTML(a.login))
            .join(', ');

          return `
            <div class="issue">
              <a class="issue-title" href="${htmlUrl}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              <div class="issue-meta">
                Opened by ${userLogin} on ${createdAt}
                ${assignees ? ` · Assigned to ${assignees}` : ''}
              </div>
              <div class="issue-meta">${labels}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Failed to load issues: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
