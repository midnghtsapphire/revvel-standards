<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .controls { margin-bottom: 20px; }
  input, select, button { padding: 8px 12px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; margin-right: 8px; }
  button { cursor: pointer; }
  button:hover { background: #21262d; }
  .issue { border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 8px; background: #161b22; }
  .issue a { color: #58a6ff; text-decoration: none; font-weight: 600; }
  .issue a:hover { text-decoration: underline; }
  .meta { font-size: 12px; color: #8b949e; margin-top: 6px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #21262d; margin-right: 4px; }
  .stats { background: #161b22; padding: 12px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #30363d; }
  .error { color: #f85149; padding: 12px; background: #161b22; border-radius: 6px; border: 1px solid #f85149; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div class="controls">
  <input id="repo" placeholder="owner/repo" value="midnghtsapphire/omega-flame-forge" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button onclick="loadIssues()">Refresh</button>
</div>
<div id="stats" class="stats"></div>
<div id="issues">Loading...</div>
<script>
  // Escape HTML to prevent XSS from user-controlled GitHub data
  function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function loadIssues() {
    const repo = document.getElementById('repo').value.trim();
    const state = document.getElementById('state').value;
    const issuesDiv = document.getElementById('issues');
    const statsDiv = document.getElementById('stats');
    issuesDiv.textContent = 'Loading...';
    statsDiv.textContent = '';

    if (!repo || !repo.includes('/')) {
      issuesDiv.innerHTML = '<div class="error">Invalid repo format. Use owner/repo.</div>';
      return;
    }

    try {
      const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const issues = await res.json();

      // Filter out pull requests
      const realIssues = issues.filter(i => !i.pull_request);

      statsDiv.textContent = `Showing ${realIssues.length} ${state} issue(s) from ${repo}`;

      if (realIssues.length === 0) {
        issuesDiv.innerHTML = '<div class="issue">No issues found.</div>';
        return;
      }

      issuesDiv.innerHTML = realIssues.map(issue => {
        const labels = (issue.labels || []).map(l =>
          `<span class="label">${escapeHTML(l.name)}</span>`
        ).join('');
        const assignees = (issue.assignees || []).map(a =>
          escapeHTML(a.login)
        ).join(', ') || 'unassigned';
        return `
          <div class="issue">
            <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
              #${escapeHTML(issue.number)} — ${escapeHTML(issue.title)}
            </a>
            <div class="meta">
              by ${escapeHTML(issue.user && issue.user.login)} · assignees: ${assignees} ${labels}
            </div>
          </div>
        `;
      }).join('');
    } catch (err) {
      issuesDiv.innerHTML = `<div class="error">Error loading issues: ${escapeHTML(err.message)}</div>`;
    }
  }

  loadIssues();
</script>
</body>
</html>
