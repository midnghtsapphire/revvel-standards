<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .issue-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .issue-title a {
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title a:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 11px;
      margin-right: 4px;
    }
    .assignee {
      display: inline-block;
      margin-right: 6px;
      color: #7ee787;
    }
    #error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div id="status">Loading...</div>
  <div id="issues"></div>

  <script>
    // Escape HTML-sensitive characters to prevent XSS.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Validate URL to ensure it uses http(s) scheme to prevent javascript: URIs.
    function safeUrl(url) {
      if (!url) return '#';
      try {
        const parsed = new URL(url, window.location.origin);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
          return escapeHTML(parsed.href);
        }
      } catch (e) {
        // fall through
      }
      return '#';
    }

    async function loadIssues() {
      const statusEl = document.getElementById('status');
      const issuesEl = document.getElementById('issues');
      const repo = (new URLSearchParams(window.location.search)).get('repo') || 'midnghtsapphire/vibecoding';

      try {
        const resp = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const issues = await resp.json();

        statusEl.textContent = `Showing ${issues.length} open issues from ${repo}`;

        issuesEl.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const url = safeUrl(issue.html_url);
          const number = escapeHTML(issue.number);
          const user = escapeHTML(issue.user && issue.user.login);
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');

          return `
            <div class="issue">
              <div class="issue-title">
                <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              </div>
              <div class="issue-meta">
                by @${user} ${assignees ? '· ' + assignees : ''}
              </div>
              <div style="margin-top:8px;">${labels}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        statusEl.innerHTML = `<span id="error">Failed to load: ${escapeHTML(err.message)}</span>`;
      }
    }

    loadIssues();
  </script>
</body>
</html>
