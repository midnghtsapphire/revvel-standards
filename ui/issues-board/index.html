<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0d1117;
      color: #c9d1d9;
    }
    h1 { color: #58a6ff; }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
    }
    button { cursor: pointer; }
    button:hover { background: #21262d; }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .issue-title { font-weight: 600; color: #58a6ff; }
    .issue-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-right: 4px;
      background: #30363d;
      color: #c9d1d9;
    }
    .status { margin-top: 10px; color: #8b949e; }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load</button>
  </div>
  <div id="status" class="status"></div>
  <div id="issues"></div>

  <script>
    // Escape HTML-sensitive characters to prevent XSS from untrusted GitHub data.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const statusEl = document.getElementById('status');
      const issuesEl = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        statusEl.textContent = 'Please enter a valid owner/repo.';
        return;
      }

      statusEl.textContent = 'Loading...';
      issuesEl.innerHTML = '';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = await res.json();

        statusEl.textContent = `${issues.length} issue(s) loaded.`;

        issuesEl.innerHTML = issues.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => escapeHTML(a.login))
            .join(', ');
          const safeUrl = escapeHTML(issue.html_url);
          const safeTitle = escapeHTML(issue.title);
          const safeNumber = escapeHTML(issue.number);
          const safeState = escapeHTML(issue.state);

          return `
            <div class="issue">
              <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">
                #${safeNumber} ${safeTitle}
              </a>
              <div class="issue-meta">
                State: ${safeState}
                ${assignees ? ` · Assignees: ${assignees}` : ''}
              </div>
              <div>${labels}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        statusEl.textContent = `Error: ${escapeHTML(err.message)}`;
      }
    }
  </script>
</body>
</html>
