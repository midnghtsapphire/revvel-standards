<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f6f8fa;
      color: #24292e;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { margin: 0; }
    .controls {
      display: flex;
      gap: 10px;
    }
    input, select, button {
      padding: 8px 12px;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: #2ea44f;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #2c974b; }
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .issue {
      background: white;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      transition: box-shadow 0.2s;
    }
    .issue:hover {
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }
    .issue-title {
      font-weight: 600;
      margin-bottom: 8px;
    }
    .issue-title a {
      color: #0366d6;
      text-decoration: none;
    }
    .issue-meta {
      font-size: 12px;
      color: #586069;
      margin-bottom: 8px;
    }
    .labels {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      background: #e1e4e8;
      color: #24292e;
    }
    .assignees {
      margin-top: 8px;
      font-size: 12px;
      color: #586069;
    }
    .empty {
      text-align: center;
      padding: 40px;
      color: #586069;
    }
  </style>
</head>
<body>
  <header>
    <h1>Issues Board</h1>
    <div class="controls">
      <input id="repo" placeholder="owner/repo" />
      <button id="load">Load</button>
    </div>
  </header>
  <div id="board" class="board"></div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS.
     * All user-controlled data from the GitHub API MUST pass through this
     * before being interpolated into innerHTML.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues(repo) {
      const board = document.getElementById('board');
      board.innerHTML = '<div class="empty">Loading…</div>';
      try {
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = await res.json();
        renderIssues(issues);
      } catch (err) {
        board.innerHTML = `<div class="empty">Error: ${escapeHTML(err.message)}</div>`;
      }
    }

    function renderIssues(issues) {
      const board = document.getElementById('board');
      if (!issues.length) {
        board.innerHTML = '<div class="empty">No open issues.</div>';
        return;
      }
      board.innerHTML = issues.map(issue => {
        const title = escapeHTML(issue.title);
        const url = escapeHTML(issue.html_url);
        const number = escapeHTML(issue.number);
        const user = escapeHTML(issue.user && issue.user.login);
        const labels = (issue.labels || []).map(l =>
          `<span class="label">${escapeHTML(l.name)}</span>`
        ).join('');
        const assignees = (issue.assignees || []).map(a =>
          escapeHTML(a.login)
        ).join(', ');
        return `
          <div class="issue">
            <div class="issue-title">
              <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
            </div>
            <div class="issue-meta">by ${user}</div>
            <div class="labels">${labels}</div>
            ${assignees ? `<div class="assignees">Assigned: ${assignees}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    document.getElementById('load').addEventListener('click', () => {
      const repo = document.getElementById('repo').value.trim();
      if (repo && repo.includes('/')) loadIssues(repo);
    });
  </script>
</body>
</html>
