<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .filters { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .filters input, .filters select { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .issue-title { color: #58a6ff; text-decoration: none; font-weight: 600; font-size: 16px; }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta { color: #8b949e; font-size: 13px; margin-top: 6px; }
  .labels { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .label { padding: 2px 8px; border-radius: 12px; font-size: 12px; background: #30363d; color: #c9d1d9; }
  .assignees { margin-top: 8px; font-size: 13px; color: #8b949e; }
  .loading, .error { padding: 20px; text-align: center; }
  .error { color: #f85149; }
  .stats { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
</style>
</head>
<body>
<h1>🎯 Issues Board — $10M Mission Tracker</h1>
<div class="stats" id="stats">Loading stats...</div>
<div class="filters">
  <input type="text" id="search" placeholder="Search issues..." />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <input type="text" id="repo" placeholder="owner/repo" value="" />
  <button id="reload">Reload</button>
</div>
<div id="issues" class="loading">Enter a repo (owner/repo) and click Reload.</div>
<script>
// Escape HTML to prevent XSS from user-controlled GitHub data (titles, labels, usernames, URLs).
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function fetchIssues(repo, state) {
  const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=100`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
  return res.json();
}

function renderIssues(issues, filter) {
  const container = document.getElementById('issues');
  const q = (filter || '').toLowerCase();
  const filtered = issues.filter(i => !i.pull_request && (!q || (i.title || '').toLowerCase().includes(q)));
  if (!filtered.length) {
    container.innerHTML = '<div class="loading">No issues match.</div>';
    return;
  }
  container.className = '';
  container.innerHTML = filtered.map(issue => {
    const labels = (issue.labels || []).map(l =>
      `<span class="label">${escapeHTML(l.name)}</span>`
    ).join('');
    const assignees = (issue.assignees || []).map(a =>
      `@${escapeHTML(a.login)}`
    ).join(', ');
    return `
      <div class="issue">
        <a class="issue-title" href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">#${escapeHTML(issue.number)} ${escapeHTML(issue.title)}</a>
        <div class="issue-meta">State: ${escapeHTML(issue.state)} • Opened by @${escapeHTML(issue.user ? issue.user.login : 'unknown')}</div>
        ${labels ? `<div class="labels">${labels}</div>` : ''}
        ${assignees ? `<div class="assignees">Assignees: ${assignees}</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderStats(issues) {
  const open = issues.filter(i => i.state === 'open' && !i.pull_request).length;
  const closed = issues.filter(i => i.state === 'closed' && !i.pull_request).length;
  document.getElementById('stats').textContent = `Open: ${open} • Closed: ${closed} • Total: ${open + closed}`;
}

let allIssues = [];

async function load() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const container = document.getElementById('issues');
  if (!repo || !repo.includes('/')) {
    container.className = 'error';
    container.textContent = 'Please enter a valid owner/repo.';
    return;
  }
  container.className = 'loading';
  container.textContent = 'Loading...';
  try {
    allIssues = await fetchIssues(repo, state);
    renderStats(allIssues);
    renderIssues(allIssues, document.getElementById('search').value);
  } catch (e) {
    container.className = 'error';
    container.textContent = 'Error: ' + escapeHTML(e.message);
  }
}

document.getElementById('reload').addEventListener('click', load);
document.getElementById('search').addEventListener('input', e => renderIssues(allIssues, e.target.value));
document.getElementById('state').addEventListener('change', load);
</script>
</body>
</html>
