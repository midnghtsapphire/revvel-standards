<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      color: #8b949e;
      font-size: 0.85em;
      margin-top: 5px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75em;
      background: #388bfd26;
      color: #58a6ff;
      margin-right: 4px;
    }
    .assignee {
      color: #7ee787;
      margin-right: 6px;
    }
    .error {
      color: #f85149;
      padding: 10px;
      border: 1px solid #f85149;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="issues"></div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS when interpolating
     * user-controlled data into HTML templates.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<div class="error">Please enter a valid owner/repo</div>';
        return;
      }

      container.innerHTML = 'Loading...';

      try {
        const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }
        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div>No issues found.</div>';
          return;
        }

        container.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const url = escapeHTML(issue.html_url);
          const number = escapeHTML(issue.number);
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');
          const createdAt = escapeHTML(new Date(issue.created_at).toLocaleDateString());

          return `
            <div class="issue">
              <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number}: ${title}</a>
              <div class="issue-meta">
                Created ${createdAt} ${assignees}
              </div>
              <div style="margin-top: 6px;">${labels}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Error loading issues: ${escapeHTML(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
