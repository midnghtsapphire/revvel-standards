<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #58a6ff; }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover { text-decoration: underline; }
    .meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      font-size: 11px;
      margin-right: 4px;
    }
    .assignee {
      display: inline-block;
      padding: 2px 6px;
      background: #30363d;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 4px;
    }
    #loading, #error { padding: 20px; text-align: center; }
    #error { color: #f85149; }
  </style>
</head>
<body>
  <h1>📋 Open Issues Board</h1>
  <div id="loading">Loading issues…</div>
  <div id="error" style="display:none;"></div>
  <div id="issues"></div>

  <script>
    // Escape HTML to prevent XSS from user-controlled GitHub issue data.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const REPO = (new URLSearchParams(window.location.search).get('repo')) || 'zeroleaks-official/zeroleaks-official';

    async function loadIssues() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const issuesEl = document.getElementById('issues');
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/issues?state=open&per_page=50`);
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        const issues = await res.json();
        loadingEl.style.display = 'none';

        if (!Array.isArray(issues) || issues.length === 0) {
          issuesEl.innerHTML = '<p>No open issues 🎉</p>';
          return;
        }

        issuesEl.innerHTML = issues
          .filter(i => !i.pull_request)
          .map(issue => {
            const labels = (issue.labels || [])
              .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
              .join('');
            const assignees = (issue.assignees || [])
              .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
              .join('');
            const url = escapeHTML(issue.html_url);
            const title = escapeHTML(issue.title);
            const number = escapeHTML(issue.number);
            const user = escapeHTML(issue.user && issue.user.login);
            return `
              <div class="issue">
                <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
                <div class="meta">by @${user} ${labels} ${assignees}</div>
              </div>
            `;
          })
          .join('');
      } catch (err) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = `Failed to load issues: ${err.message}`;
      }
    }

    loadIssues();
  </script>
</body>
</html>
