<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issues Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 20px;
    min-height: 100vh;
  }
  h1 {
    color: #58a6ff;
    margin-bottom: 20px;
    border-bottom: 1px solid #30363d;
    padding-bottom: 10px;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  input, select, button {
    background: #161b22;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    background: #238636;
    border-color: #238636;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #2ea043; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 15px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 24px;
    font-weight: 700;
    color: #58a6ff;
  }
  .stat-card .label {
    font-size: 12px;
    color: #8b949e;
    text-transform: uppercase;
  }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 10px;
  }
  .issue-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .issue-title a {
    color: #58a6ff;
    text-decoration: none;
  }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta {
    font-size: 12px;
    color: #8b949e;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: #21262d;
    border: 1px solid #30363d;
    margin-right: 4px;
  }
  #status { color: #8b949e; font-size: 12px; }
</style>
</head>
<body>
  <h1>🎯 Issues Board — $10M Mission</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <input id="filter" placeholder="Filter by text..." />
    <button onclick="loadIssues()">Load</button>
    <span id="status"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div id="issues"></div>

<script>
// Escape HTML to prevent XSS from GitHub-supplied fields
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const status = document.getElementById('status');
  const container = document.getElementById('issues');
  const stats = document.getElementById('stats');

  if (!repo || !repo.includes('/')) {
    status.textContent = 'Enter a valid owner/repo';
    return;
  }

  status.textContent = 'Loading...';
  container.innerHTML = '';
  stats.innerHTML = '';

  try {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=100`);
    if (!res.ok) {
      status.textContent = `Error: ${res.status}`;
      return;
    }
    const data = await res.json();
    const issues = data.filter(i => !i.pull_request);
    const filter = document.getElementById('filter').value.toLowerCase();
    const filtered = filter
      ? issues.filter(i => (i.title || '').toLowerCase().includes(filter))
      : issues;

    // Stats
    const openCount = issues.filter(i => i.state === 'open').length;
    const closedCount = issues.filter(i => i.state === 'closed').length;
    stats.innerHTML = `
      <div class="stat-card"><div class="num">${issues.length}</div><div class="label">Total</div></div>
      <div class="stat-card"><div class="num">${openCount}</div><div class="label">Open</div></div>
      <div class="stat-card"><div class="num">${closedCount}</div><div class="label">Closed</div></div>
      <div class="stat-card"><div class="num">${filtered.length}</div><div class="label">Shown</div></div>
    `;

    container.innerHTML = filtered.map(issue => {
      const labels = (issue.labels || [])
        .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
        .join('');
      const assignees = (issue.assignees || [])
        .map(a => escapeHTML(a.login))
        .join(', ');
      const safeUrl = escapeHTML(issue.html_url || '#');
      const safeTitle = escapeHTML(issue.title || '(no title)');
      const safeNumber = escapeHTML(issue.number);
      const safeState = escapeHTML(issue.state);
      const safeUser = escapeHTML(issue.user && issue.user.login);
      return `
        <div class="issue">
          <div class="issue-title">
            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
          </div>
          <div class="issue-meta">
            <span>State: ${safeState}</span>
            <span>By: ${safeUser}</span>
            ${assignees ? `<span>Assignees: ${assignees}</span>` : ''}
            <span>${labels}</span>
          </div>
        </div>
      `;
    }).join('');

    status.textContent = `Loaded ${filtered.length} issue(s)`;
  } catch (e) {
    status.textContent = `Error: ${escapeHTML(e.message)}`;
  }
}
</script>
</body>
</html>
