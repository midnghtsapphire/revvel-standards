<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; }
  .issue a { color: #58a6ff; text-decoration: none; font-weight: 600; }
  .issue a:hover { text-decoration: underline; }
  .meta { font-size: 12px; color: #8b949e; margin-top: 6px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #21262d; color: #c9d1d9; font-size: 11px; margin-right: 4px; }
  .assignee { color: #7ee787; font-size: 12px; margin-right: 6px; }
  .error { color: #f85149; }
  .loading { color: #8b949e; font-style: italic; }
</style>
</head>
<body>
  <h1>📋 Open Issues</h1>
  <div id="controls">
    <label>Repo: <input id="repo" value="midnghtsapphire/starter-repo" style="background:#0d1117;color:#c9d1d9;border:1px solid #30363d;padding:4px 8px;border-radius:4px;"/></label>
    <button id="loadBtn" style="background:#238636;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">Load</button>
  </div>
  <div id="issues"><p class="loading">Click Load to fetch issues…</p></div>

<script>
  // XSS mitigation: escape HTML-sensitive characters before interpolation.
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Only allow safe http(s) URLs; otherwise return '#'.
  function safeUrl(url) {
    if (typeof url !== 'string') return '#';
    try {
      const parsed = new URL(url);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
        return parsed.href;
      }
    } catch (_) {}
    return '#';
  }

  async function loadIssues() {
    const repo = document.getElementById('repo').value.trim();
    const container = document.getElementById('issues');
    container.innerHTML = '<p class="loading">Loading…</p>';

    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) {
      container.innerHTML = '<p class="error">Invalid repo format. Use owner/name.</p>';
      return;
    }

    try {
      const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const issues = await res.json();

      if (!Array.isArray(issues) || issues.length === 0) {
        container.innerHTML = '<p>No open issues.</p>';
        return;
      }

      container.innerHTML = issues.map(issue => {
        const title = escapeHTML(issue.title);
        const number = escapeHTML(issue.number);
        const url = escapeHTML(safeUrl(issue.html_url));
        const labels = Array.isArray(issue.labels)
          ? issue.labels.map(l => `<span class="label">${escapeHTML(l && l.name)}</span>`).join('')
          : '';
        const assignees = Array.isArray(issue.assignees)
          ? issue.assignees.map(a => `<span class="assignee">@${escapeHTML(a && a.login)}</span>`).join('')
          : '';
        return `
          <div class="issue">
            <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
            <div class="meta">${assignees}${labels}</div>
          </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = `<p class="error">Failed to load: ${escapeHTML(err.message)}</p>`;
    }
  }

  document.getElementById('loadBtn').addEventListener('click', loadIssues);
</script>
</body>
</html>
