<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #58a6ff;
    }
    .issue {
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #161b22;
    }
    .issue a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
    }
    .issue a:hover {
      text-decoration: underline;
    }
    .labels {
      margin-top: 0.5rem;
    }
    .label {
      display: inline-block;
      background: #1f6feb;
      color: white;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      font-size: 0.75rem;
      margin-right: 0.25rem;
    }
    .assignee {
      display: inline-block;
      background: #238636;
      color: white;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      font-size: 0.75rem;
      margin-right: 0.25rem;
    }
    .meta {
      color: #8b949e;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    #controls {
      margin-bottom: 1rem;
    }
    input, select {
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div id="controls">
    <input type="text" id="repo" placeholder="owner/repo" value="midnghtsapphire/tools" />
    <button id="load">Load Issues</button>
  </div>
  <div id="issues"></div>

  <script>
    // Escape HTML-sensitive characters to prevent XSS from user-controlled
    // GitHub issue data (titles, labels, usernames, URLs, etc.).
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const container = document.getElementById('issues');
      container.innerHTML = 'Loading...';

      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
        container.textContent = 'Invalid repository format. Use owner/repo.';
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.textContent = 'No open issues found.';
          return;
        }

        container.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const url = escapeHTML(issue.html_url);
          const number = escapeHTML(issue.number);
          const user = escapeHTML(issue.user && issue.user.login);
          const createdAt = escapeHTML(issue.created_at);

          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');

          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');

          return `
            <div class="issue">
              <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              <div class="labels">${labels}${assignees}</div>
              <div class="meta">Opened by @${user} on ${createdAt}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.textContent = `Error loading issues: ${err.message}`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
    loadIssues();
  </script>
</body>
</html>
