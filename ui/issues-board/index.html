<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.5rem;
    }
    .filters {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filters input, .filters select {
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.5rem;
      border-radius: 6px;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      color: #8b949e;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    .label {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 10px;
      font-size: 0.75rem;
      background: #1f6feb;
      color: white;
      margin-right: 0.25rem;
    }
    .loading, .error {
      padding: 1rem;
      text-align: center;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Search issues..." />
    <select id="stateFilter">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <input type="text" id="repoInput" placeholder="owner/repo" value="" />
    <button id="loadBtn">Load</button>
  </div>
  <div id="issues" class="loading">Enter a repository and click Load.</div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS when interpolating
     * user-controlled data (issue titles, labels, usernames, URLs) into
     * innerHTML. Converts &, <, >, ", ' into their HTML entity equivalents.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repoInput').value.trim();
      const state = document.getElementById('stateFilter').value;
      const container = document.getElementById('issues');

      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
        container.className = 'error';
        container.textContent = 'Please enter a valid owner/repo.';
        return;
      }

      container.className = 'loading';
      container.textContent = 'Loading...';

      try {
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        const issues = await res.json();
        renderIssues(issues);
      } catch (err) {
        container.className = 'error';
        container.textContent = 'Failed to load issues: ' + err.message;
      }
    }

    function renderIssues(issues) {
      const container = document.getElementById('issues');
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = issues.filter(i => !i.pull_request && (
        !search || (i.title && i.title.toLowerCase().includes(search))
      ));

      if (filtered.length === 0) {
        container.className = 'loading';
        container.textContent = 'No issues found.';
        return;
      }

      container.className = '';
      // Safely build HTML by escaping all user-controlled fields.
      container.innerHTML = filtered.map(issue => {
        const title = escapeHTML(issue.title);
        const url = escapeHTML(issue.html_url);
        const number = escapeHTML(issue.number);
        const labels = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');
        const assignees = (issue.assignees || [])
          .map(a => escapeHTML(a.login))
          .join(', ');
        const user = escapeHTML(issue.user && issue.user.login);

        return `
          <div class="issue">
            <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">
              #${number} ${title}
            </a>
            <div class="issue-meta">
              Opened by ${user}
              ${assignees ? ` • Assigned: ${assignees}` : ''}
            </div>
            <div class="issue-meta">${labels}</div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('loadBtn').addEventListener('click', loadIssues);
    document.getElementById('searchInput').addEventListener('input', () => {
      // Re-fetch to keep behavior simple; alternatively, cache and re-render.
      const container = document.getElementById('issues');
      if (container.dataset.loaded) loadIssues();
    });
  </script>
</body>
</html>
