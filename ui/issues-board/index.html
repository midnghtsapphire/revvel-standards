<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issues Board</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
    h1 { color: #58a6ff; }
    .controls { margin-bottom: 20px; }
    input, select, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; margin-right: 8px; }
    button { cursor: pointer; }
    button:hover { background: #21262d; }
    .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
    .issue-title { color: #58a6ff; font-weight: 600; text-decoration: none; font-size: 16px; }
    .issue-title:hover { text-decoration: underline; }
    .issue-meta { color: #8b949e; font-size: 12px; margin-top: 6px; }
    .label { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 4px; background: #30363d; color: #c9d1d9; }
    .assignee { display: inline-block; margin-right: 6px; color: #7ee787; }
    .loading { color: #8b949e; font-style: italic; }
    .error { color: #f85149; }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input type="text" id="repoInput" placeholder="owner/repo" value="">
    <input type="text" id="tokenInput" placeholder="GitHub token (optional)">
    <select id="stateSelect">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="issues"><p class="loading">Enter a repo and click Load Issues.</p></div>

  <script>
    // Safely escape HTML-sensitive characters to prevent XSS.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repoInput').value.trim();
      const token = document.getElementById('tokenInput').value.trim();
      const state = document.getElementById('stateSelect').value;
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<p class="error">Please enter a valid owner/repo.</p>';
        return;
      }

      container.innerHTML = '<p class="loading">Loading...</p>';

      try {
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`, { headers });

        if (!response.ok) {
          container.innerHTML = `<p class="error">Error: ${escapeHTML(response.status)} ${escapeHTML(response.statusText)}</p>`;
          return;
        }

        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<p class="loading">No issues found.</p>';
          return;
        }

        container.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const url = escapeHTML(issue.html_url);
          const number = escapeHTML(issue.number);
          const userLogin = escapeHTML(issue.user && issue.user.login);
          const createdAt = escapeHTML(issue.created_at);

          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');

          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');

          return `
            <div class="issue">
              <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              <div class="issue-meta">
                Opened by @${userLogin} on ${createdAt}
              </div>
              <div style="margin-top: 8px;">${labels}</div>
              <div style="margin-top: 6px;">${assignees}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p class="error">Failed to load: ${escapeHTML(err.message)}</p>`;
      }
    }
  </script>
</body>
</html>
