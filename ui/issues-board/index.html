<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #238636;
      border-color: #238636;
    }
    button:hover {
      background: #2ea043;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .issue-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .issue-title a {
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title a:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: #30363d;
      color: #c9d1d9;
      margin-right: 4px;
    }
    .assignee {
      display: inline-block;
      margin-left: 4px;
      font-weight: 600;
    }
    .loading, .error {
      padding: 20px;
      text-align: center;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="">
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="issues"></div>

  <script>
    // Escape HTML to prevent XSS from user-controlled fields (issue titles,
    // label names, assignee logins, URLs, etc.)
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<div class="error">Please enter a valid owner/repo</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading...</div>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="loading">No issues found</div>';
          return;
        }

        // Build the DOM safely by escaping all user-controlled data.
        container.innerHTML = issues.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');
          return `
            <div class="issue">
              <div class="issue-title">
                <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
                  #${escapeHTML(issue.number)} ${escapeHTML(issue.title)}
                </a>
              </div>
              <div class="issue-meta">
                by @${escapeHTML(issue.user && issue.user.login)}
                · ${escapeHTML(issue.state)}
                · ${labels}
                ${assignees}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Failed to load: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
