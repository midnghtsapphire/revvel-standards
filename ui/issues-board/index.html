<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #58a6ff;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .issue-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    .issue-title a {
      color: #58a6ff;
      text-decoration: none;
    }
    .labels {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 0.5rem;
    }
    .label {
      background: #21262d;
      color: #c9d1d9;
      padding: 0.15rem 0.5rem;
      border-radius: 2em;
      font-size: 0.75rem;
    }
    .assignees {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>Issues Board</h1>
  <div id="issues">Loading...</div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS.
     * Converts &, <, >, ", ' into their HTML entity equivalents.
     * @param {any} value - The value to escape.
     * @returns {string} - The escaped string, safe for HTML interpolation.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Validate that a URL is safe to use in an href attribute.
     * Only allows http(s) schemes to prevent javascript: URIs.
     * @param {string} url
     * @returns {string} - safe URL or '#' if invalid
     */
    function safeURL(url) {
      if (typeof url !== 'string') return '#';
      try {
        const parsed = new URL(url, window.location.origin);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
          return parsed.href;
        }
      } catch (e) {
        return '#';
      }
      return '#';
    }

    async function loadIssues() {
      const container = document.getElementById('issues');
      try {
        const repo = (window.REPO_SLUG || 'octocat/hello-world');
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
        if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.textContent = 'No open issues found.';
          return;
        }

        container.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const url = escapeHTML(safeURL(issue.html_url));
          const number = escapeHTML(issue.number);

          const labels = Array.isArray(issue.labels)
            ? issue.labels.map(l => `<span class="label">${escapeHTML(l.name)}</span>`).join('')
            : '';

          const assignees = Array.isArray(issue.assignees) && issue.assignees.length > 0
            ? 'Assigned: ' + issue.assignees.map(a => escapeHTML(a.login)).join(', ')
            : 'Unassigned';

          return `
            <div class="issue">
              <div class="issue-title">
                <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              </div>
              <div class="labels">${labels}</div>
              <div class="assignees">${escapeHTML(assignees)}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Failed to load issues: ${escapeHTML(err.message)}</div>`;
      }
    }

    loadIssues();
  </script>
</body>
</html>
