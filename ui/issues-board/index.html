<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #58a6ff;
    }
    .controls {
      margin-bottom: 1rem;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 0.5rem;
      border-radius: 6px;
      margin-right: 0.5rem;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 0.25rem;
    }
    .label {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-size: 0.75rem;
      background: #21262d;
      color: #c9d1d9;
      margin-right: 0.25rem;
    }
    .assignee {
      display: inline-block;
      margin-right: 0.25rem;
      font-size: 0.8rem;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input id="repo" type="text" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="issues"></div>

  <script>
    // Escape HTML-sensitive characters to prevent XSS attacks
    // when rendering user-controlled data from the GitHub API.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !/^[^/\s]+\/[^/\s]+$/.test(repo)) {
        container.innerHTML = '<div class="error">Please enter a valid owner/repo.</div>';
        return;
      }

      container.textContent = 'Loading...';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.textContent = 'No issues found.';
          return;
        }

        container.innerHTML = issues
          .filter(issue => !issue.pull_request)
          .map(issue => {
            const labels = (issue.labels || [])
              .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
              .join('');
            const assignees = (issue.assignees || [])
              .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
              .join('');
            const safeUrl = escapeHTML(issue.html_url);
            const safeTitle = escapeHTML(issue.title);
            const safeNumber = escapeHTML(issue.number);
            const safeUser = escapeHTML(issue.user && issue.user.login);
            return `
              <div class="issue">
                <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
                <div class="issue-meta">
                  by @${safeUser} · ${labels} ${assignees}
                </div>
              </div>
            `;
          })
          .join('');
      } catch (err) {
        container.innerHTML = `<div class="error">${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
