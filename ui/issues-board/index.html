<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0d1117;
      color: #c9d1d9;
    }
    h1 {
      color: #58a6ff;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      margin-right: 8px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issues {
      display: grid;
      gap: 12px;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
      font-size: 16px;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 6px;
    }
    .labels {
      margin-top: 8px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-right: 4px;
      background: #30363d;
      color: #c9d1d9;
    }
    .assignees {
      margin-top: 6px;
      font-size: 12px;
      color: #8b949e;
    }
    .loading, .error {
      padding: 20px;
      text-align: center;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>🐛 Issues Board</h1>
  <div class="controls">
    <input type="text" id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="issues" class="issues"></div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS when interpolating
     * user-controlled data into HTML templates.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<div class="error">Please enter a valid repo (owner/repo).</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading...</div>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }

        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="loading">No issues found.</div>';
          return;
        }

        // Filter out pull requests
        const filteredIssues = issues.filter(i => !i.pull_request);

        container.innerHTML = filteredIssues.map(issue => {
          const safeTitle = escapeHTML(issue.title);
          const safeUrl = escapeHTML(issue.html_url);
          const safeNumber = escapeHTML(issue.number);
          const safeUser = escapeHTML(issue.user && issue.user.login);
          const safeCreated = escapeHTML(new Date(issue.created_at).toLocaleDateString());

          const labelsHTML = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');

          const assigneesHTML = (issue.assignees || []).length
            ? `Assigned: ${(issue.assignees || []).map(a => escapeHTML(a.login)).join(', ')}`
            : '';

          return `
            <div class="issue">
              <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">
                #${safeNumber} ${safeTitle}
              </a>
              <div class="issue-meta">Opened by ${safeUser} on ${safeCreated}</div>
              <div class="labels">${labelsHTML}</div>
              <div class="assignees">${assigneesHTML}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
