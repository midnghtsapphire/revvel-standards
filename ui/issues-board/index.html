<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      margin-right: 8px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .issue-title {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 6px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 11px;
      margin-right: 4px;
    }
    .assignee {
      display: inline-block;
      background: #1f6feb;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-right: 4px;
    }
    #loading, #error {
      padding: 20px;
      text-align: center;
    }
    #error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="loading" style="display:none;">Loading...</div>
  <div id="error" style="display:none;"></div>
  <div id="issues"></div>

  <script>
    /**
     * Escape HTML special characters to prevent XSS when injecting
     * user-controlled data into the DOM via innerHTML.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const issuesDiv = document.getElementById('issues');

      error.style.display = 'none';
      issuesDiv.innerHTML = '';

      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
        error.textContent = 'Please enter a valid owner/repo';
        error.style.display = 'block';
        return;
      }

      loading.style.display = 'block';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          issuesDiv.innerHTML = '<p>No issues found.</p>';
          return;
        }

        issuesDiv.innerHTML = issues
          .filter(issue => !issue.pull_request)
          .map(issue => {
            const labels = (issue.labels || [])
              .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
              .join('');
            const assignees = (issue.assignees || [])
              .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
              .join('');
            const safeUrl = escapeHTML(issue.html_url || '#');
            const safeTitle = escapeHTML(issue.title || '(untitled)');
            const safeNumber = escapeHTML(issue.number);
            const safeUser = escapeHTML(issue.user && issue.user.login);
            const safeState = escapeHTML(issue.state);
            return `
              <div class="issue">
                <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="issue-title">#${safeNumber} ${safeTitle}</a>
                <div class="issue-meta">
                  by @${safeUser} · ${safeState}
                </div>
                <div style="margin-top:8px;">${labels}${assignees}</div>
              </div>
            `;
          })
          .join('');
      } catch (err) {
        error.textContent = `Failed to load issues: ${err.message}`;
        error.style.display = 'block';
      } finally {
        loading.style.display = 'none';
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
