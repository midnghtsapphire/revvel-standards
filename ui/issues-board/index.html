<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
    h1 { color: #58a6ff; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    input, select, button { padding: 8px 12px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font-size: 14px; }
    button { cursor: pointer; }
    button:hover { background: #21262d; }
    .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; margin-bottom: 10px; }
    .issue-title { font-weight: 600; color: #58a6ff; text-decoration: none; }
    .issue-title:hover { text-decoration: underline; }
    .issue-meta { color: #8b949e; font-size: 12px; margin-top: 5px; }
    .label { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-right: 4px; background: #21262d; color: #c9d1d9; }
    .assignee { display: inline-block; margin-right: 6px; color: #8b949e; font-size: 12px; }
    .status { padding: 20px; text-align: center; color: #8b949e; }
  </style>
</head>
<body>
  <h1>📋 GitHub Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="issues"><div class="status">Enter a repo and click "Load Issues".</div></div>

  <script>
    // Escape HTML to prevent XSS from user-controlled GitHub data.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');
      if (!repo || !/^[^\/\s]+\/[^\/\s]+$/.test(repo)) {
        container.innerHTML = '<div class="status">Please enter a valid "owner/repo".</div>';
        return;
      }
      container.innerHTML = '<div class="status">Loading…</div>';
      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const issues = await res.json();
        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="status">No issues found.</div>';
          return;
        }
        // Filter out pull requests
        const filtered = issues.filter(i => !i.pull_request);
        container.innerHTML = filtered.map(renderIssue).join('');
      } catch (err) {
        container.innerHTML = `<div class="status">Error: ${escapeHTML(err.message)}</div>`;
      }
    }

    function renderIssue(issue) {
      const title = escapeHTML(issue.title);
      const number = escapeHTML(issue.number);
      const url = escapeHTML(issue.html_url);
      const user = escapeHTML(issue.user && issue.user.login);
      const createdAt = escapeHTML(issue.created_at);
      const labels = (issue.labels || []).map(l =>
        `<span class="label">${escapeHTML(l.name)}</span>`
      ).join('');
      const assignees = (issue.assignees || []).map(a =>
        `<span class="assignee">@${escapeHTML(a.login)}</span>`
      ).join('');
      return `
        <div class="issue">
          <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} — ${title}</a>
          <div class="issue-meta">
            Opened by @${user} on ${createdAt}
          </div>
          <div style="margin-top:8px;">${labels}</div>
          <div style="margin-top:4px;">${assignees}</div>
        </div>
      `;
    }

    document.getElementById('load').addEventListener('click', loadIssues);
    document.getElementById('repo').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadIssues();
    });
  </script>
</body>
</html>
