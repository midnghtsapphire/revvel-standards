<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .controls { margin-bottom: 20px; }
  input, select, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; }
  button { cursor: pointer; }
  button:hover { background: #21262d; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .issue-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .issue-title a { color: #58a6ff; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta { font-size: 12px; color: #8b949e; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-right: 4px; background: #30363d; color: #c9d1d9; }
  .assignee { display: inline-block; margin-right: 8px; font-size: 12px; color: #8b949e; }
  .status-open { color: #3fb950; }
  .status-closed { color: #f85149; }
  #status { margin-bottom: 16px; }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>🎯 Issues Board</h1>
<div class="controls">
  <input id="repo" placeholder="owner/repo" value="" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button onclick="loadIssues()">Load</button>
</div>
<div id="status"></div>
<div id="issues"></div>

<script>
// Escape HTML to prevent XSS from user-controlled GitHub data
// (issue.title, labels[].name, assignees[].login, html_url, etc.)
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const statusEl = document.getElementById('status');
  const container = document.getElementById('issues');

  if (!repo || !repo.includes('/')) {
    statusEl.innerHTML = '<span class="error">Please enter a valid owner/repo</span>';
    return;
  }

  statusEl.textContent = 'Loading...';
  container.innerHTML = '';

  try {
    const resp = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const issues = await resp.json();

    statusEl.textContent = `Loaded ${issues.length} issue(s)`;

    container.innerHTML = issues.map(issue => {
      const labels = (issue.labels || []).map(l =>
        `<span class="label">${escapeHTML(l.name)}</span>`
      ).join('');

      const assignees = (issue.assignees || []).map(a =>
        `<span class="assignee">@${escapeHTML(a.login)}</span>`
      ).join('');

      const stateClass = issue.state === 'open' ? 'status-open' : 'status-closed';

      return `
        <div class="issue">
          <div class="issue-title">
            <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
              #${escapeHTML(issue.number)} ${escapeHTML(issue.title)}
            </a>
          </div>
          <div class="issue-meta">
            <span class="${stateClass}">● ${escapeHTML(issue.state)}</span>
            &nbsp;by @${escapeHTML(issue.user && issue.user.login)}
            &nbsp;· ${labels}
            &nbsp;${assignees}
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    statusEl.innerHTML = `<span class="error">Error: ${escapeHTML(err.message)}</span>`;
  }
}
</script>
</body>
</html>
