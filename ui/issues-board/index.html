<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .issue a { color: #58a6ff; text-decoration: none; font-weight: 600; }
  .issue a:hover { text-decoration: underline; }
  .labels { margin-top: 8px; }
  .label { display: inline-block; padding: 2px 8px; margin-right: 4px; border-radius: 12px; background: #21262d; font-size: 12px; }
  .assignees { margin-top: 8px; font-size: 13px; color: #8b949e; }
  .meta { font-size: 12px; color: #8b949e; margin-top: 8px; }
  #status { padding: 12px; margin-bottom: 16px; background: #161b22; border-radius: 6px; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div id="status">Loading issues...</div>
<div class="board" id="board"></div>

<script>
// XSS mitigation: escape HTML-sensitive characters before interpolation.
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const status = document.getElementById('status');
  const board = document.getElementById('board');
  try {
    // Attempt to load from a local JSON snapshot first, then fall back to GitHub API.
    let issues = [];
    try {
      const localRes = await fetch('./issues.json', { cache: 'no-store' });
      if (localRes.ok) {
        issues = await localRes.json();
      }
    } catch (_) { /* ignore, will try API */ }

    if (!issues || issues.length === 0) {
      const repo = (window.ISSUES_REPO || 'octocat/hello-world');
      const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo)}/issues?state=open&per_page=50`);
      if (!res.ok) throw new Error('GitHub API request failed: ' + res.status);
      issues = await res.json();
    }

    if (!Array.isArray(issues) || issues.length === 0) {
      status.textContent = 'No open issues found.';
      return;
    }

    status.textContent = `Showing ${issues.length} open issue(s).`;

    board.innerHTML = issues.map(issue => {
      const title = escapeHTML(issue.title);
      const url = escapeHTML(issue.html_url);
      const number = escapeHTML(issue.number);
      const labels = Array.isArray(issue.labels)
        ? issue.labels.map(l => `<span class="label">${escapeHTML(l && l.name)}</span>`).join('')
        : '';
      const assignees = Array.isArray(issue.assignees)
        ? issue.assignees.map(a => escapeHTML(a && a.login)).filter(Boolean).join(', ')
        : '';
      const createdAt = escapeHTML(issue.created_at || '');

      return `
        <div class="issue">
          <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} — ${title}</a>
          <div class="labels">${labels}</div>
          ${assignees ? `<div class="assignees">👤 ${assignees}</div>` : ''}
          <div class="meta">Created: ${createdAt}</div>
        </div>
      `;
    }).join('');
  } catch (err) {
    status.textContent = 'Failed to load issues: ' + escapeHTML(err.message);
  }
}

loadIssues();
</script>
</body>
</html>
