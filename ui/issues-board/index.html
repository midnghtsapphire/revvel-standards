<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .controls { margin-bottom: 20px; }
  input, select, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; margin-right: 8px; }
  button { cursor: pointer; }
  button:hover { background: #21262d; }
  .issues { display: grid; gap: 12px; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .issue-title { font-weight: 600; color: #58a6ff; text-decoration: none; }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta { margin-top: 8px; font-size: 0.85em; color: #8b949e; }
  .labels { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .label { background: #1f6feb; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
  .assignees { margin-top: 6px; font-size: 0.85em; }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>🎯 Issues Board</h1>
<div class="controls">
  <input id="repo" placeholder="owner/repo" value="" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button onclick="loadIssues()">Load</button>
</div>
<div id="issues" class="issues"></div>
<script>
  // Escape HTML-sensitive characters to prevent XSS from user-controlled fields
  // (issue title, labels, assignee logins, URLs, etc.)
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function loadIssues() {
    const repo = document.getElementById('repo').value.trim();
    const state = document.getElementById('state').value;
    const container = document.getElementById('issues');
    container.innerHTML = '';

    if (!repo || !repo.includes('/')) {
      container.innerHTML = '<div class="error">Please enter a valid owner/repo</div>';
      return;
    }

    try {
      const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const issues = await res.json();

      if (!Array.isArray(issues) || issues.length === 0) {
        container.innerHTML = '<div>No issues found.</div>';
        return;
      }

      container.innerHTML = issues.map(issue => {
        const title = escapeHTML(issue.title);
        const url = escapeHTML(issue.html_url);
        const number = escapeHTML(issue.number);
        const userLogin = escapeHTML(issue.user && issue.user.login);
        const createdAt = escapeHTML(issue.created_at);

        const labels = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');

        const assignees = (issue.assignees || [])
          .map(a => escapeHTML(a.login))
          .join(', ');

        return `
          <div class="issue">
            <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
            <div class="labels">${labels}</div>
            <div class="assignees">Assignees: ${assignees || '<em>none</em>'}</div>
            <div class="issue-meta">Opened by ${userLogin} on ${createdAt}</div>
          </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="error">Error loading issues: ${escapeHTML(err.message)}</div>`;
    }
  }
</script>
</body>
</html>
