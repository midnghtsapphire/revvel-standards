<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .issue-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .issue-title a { color: #58a6ff; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta { font-size: 12px; color: #8b949e; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-right: 4px; background: #21262d; color: #c9d1d9; }
  .assignee { display: inline-block; margin-right: 8px; font-size: 12px; }
  #status { padding: 12px; margin-bottom: 16px; background: #161b22; border-radius: 6px; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div id="status">Loading issues...</div>
<div id="issues"></div>
<script>
/**
 * Escape HTML-sensitive characters to prevent XSS.
 * All user-controlled data from the GitHub API MUST pass through this
 * function before being interpolated into innerHTML.
 */
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const statusEl = document.getElementById('status');
  const issuesEl = document.getElementById('issues');
  try {
    // Repo can be overridden via ?repo=owner/name
    const params = new URLSearchParams(window.location.search);
    const repo = params.get('repo') || 'midnghtsapphire/repo';
    // Validate repo format strictly: owner/name, alphanumerics/-/_/.
    if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)) {
      statusEl.textContent = 'Invalid repo parameter.';
      return;
    }
    const res = await fetch(`https://api.github.com/repos/${repo}/issues?state=open&per_page=50`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const issues = await res.json();
    statusEl.textContent = `Showing ${issues.length} open issue(s) for ${repo}`;
    issuesEl.innerHTML = issues.map(renderIssue).join('');
  } catch (err) {
    statusEl.textContent = 'Failed to load issues: ' + escapeHTML(err.message);
  }
}

function renderIssue(issue) {
  const title = escapeHTML(issue.title);
  const url = escapeHTML(issue.html_url);
  const number = escapeHTML(issue.number);
  const user = escapeHTML(issue.user && issue.user.login);
  const created = escapeHTML(new Date(issue.created_at).toLocaleDateString());
  const labels = (issue.labels || [])
    .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
    .join('');
  const assignees = (issue.assignees || [])
    .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
    .join('');
  return `
    <div class="issue">
      <div class="issue-title"><a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a></div>
      <div class="issue-meta">Opened by @${user} on ${created}</div>
      <div style="margin-top:8px">${labels}</div>
      <div style="margin-top:4px">${assignees}</div>
    </div>
  `;
}

loadIssues();
</script>
</body>
</html>
