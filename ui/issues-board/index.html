<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; }
  .issue a { color: #58a6ff; text-decoration: none; font-weight: 600; }
  .issue a:hover { text-decoration: underline; }
  .meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #1f6feb; color: #fff; font-size: 11px; margin-right: 4px; }
  .assignee { display: inline-block; margin-right: 6px; color: #8b949e; font-size: 12px; }
  #error { color: #f85149; }
</style>
</head>
<body>
<h1>🎯 Issues Board — $10M Mission</h1>
<p>Live GitHub issues feed. Focus: Polar.sh, OSINT tools, automated product pipeline.</p>
<div id="issues">Loading…</div>
<div id="error"></div>

<script>
  // Escape HTML to prevent XSS when rendering user-controlled data
  function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Optionally set REPO via query param ?repo=owner/name
  const params = new URLSearchParams(window.location.search);
  const REPO = params.get('repo') || 'midnghtsapphire/gitcommshit';

  async function loadIssues() {
    const container = document.getElementById('issues');
    const errBox = document.getElementById('error');
    try {
      const resp = await fetch(`https://api.github.com/repos/${REPO}/issues?state=open&per_page=50`);
      if (!resp.ok) throw new Error(`GitHub API returned ${resp.status}`);
      const issues = await resp.json();
      if (!Array.isArray(issues) || issues.length === 0) {
        container.innerHTML = '<p>No open issues.</p>';
        return;
      }
      container.innerHTML = issues.map(issue => {
        const safeUrl = escapeHTML(issue.html_url);
        const safeTitle = escapeHTML(issue.title);
        const safeNumber = escapeHTML(issue.number);
        const labels = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');
        const assignees = (issue.assignees || [])
          .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
          .join('');
        return `
          <div class="issue">
            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
            <div class="meta">${labels} ${assignees}</div>
          </div>
        `;
      }).join('');
    } catch (e) {
      errBox.textContent = `Error loading issues: ${e.message}`;
      container.innerHTML = '';
    }
  }

  loadIssues();
</script>
</body>
</html>
