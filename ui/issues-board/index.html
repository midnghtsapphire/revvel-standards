<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #58a6ff;
    border-bottom: 1px solid #30363d;
    padding-bottom: 10px;
  }
  .controls {
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  input, select, button {
    background: #161b22;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    cursor: pointer;
    background: #238636;
    border-color: #238636;
    color: white;
  }
  button:hover { background: #2ea043; }
  .issues {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
    transition: transform 0.15s, border-color 0.15s;
  }
  .issue:hover {
    transform: translateY(-2px);
    border-color: #58a6ff;
  }
  .issue-title {
    color: #58a6ff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    display: block;
    margin-bottom: 8px;
  }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 8px;
  }
  .labels {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .label {
    background: #1f6feb;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
  }
  .assignees {
    margin-top: 8px;
    font-size: 12px;
    color: #8b949e;
  }
  .loading, .error {
    text-align: center;
    padding: 40px;
    color: #8b949e;
  }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>🎯 Issues Board</h1>
<div class="controls">
  <input type="text" id="repo" placeholder="owner/repo" value="" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button onclick="loadIssues()">Load Issues</button>
</div>
<div id="container" class="issues"></div>

<script>
  // Escape HTML to prevent XSS from user-controlled GitHub data
  // (issue titles, labels, usernames, etc. can contain arbitrary strings).
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function loadIssues() {
    const repo = document.getElementById('repo').value.trim();
    const state = document.getElementById('state').value;
    const container = document.getElementById('container');

    if (!repo || !repo.includes('/')) {
      container.innerHTML = '<div class="error">Please enter a valid owner/repo</div>';
      return;
    }

    container.innerHTML = '<div class="loading">Loading issues...</div>';

    try {
      const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`GitHub API returned ${response.status}`);
      }
      const issues = await response.json();

      if (!Array.isArray(issues) || issues.length === 0) {
        container.innerHTML = '<div class="loading">No issues found.</div>';
        return;
      }

      // Filter out pull requests (GitHub API includes PRs in issues endpoint)
      const filtered = issues.filter(i => !i.pull_request);

      container.innerHTML = filtered.map(issue => {
        const safeTitle = escapeHTML(issue.title);
        const safeUrl = escapeHTML(issue.html_url);
        const safeNumber = escapeHTML(issue.number);
        const safeUser = escapeHTML(issue.user && issue.user.login);
        const safeState = escapeHTML(issue.state);

        const labels = Array.isArray(issue.labels)
          ? issue.labels.map(l => `<span class="label">${escapeHTML(l.name)}</span>`).join('')
          : '';

        const assignees = Array.isArray(issue.assignees) && issue.assignees.length
          ? 'Assigned: ' + issue.assignees.map(a => escapeHTML(a.login)).join(', ')
          : '';

        return `
          <div class="issue">
            <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
            <div class="issue-meta">Opened by ${safeUser} • ${safeState}</div>
            <div class="labels">${labels}</div>
            <div class="assignees">${assignees}</div>
          </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
    }
  }
</script>
</body>
</html>
