<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .issue-title { font-weight: 600; color: #58a6ff; text-decoration: none; }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta { color: #8b949e; font-size: 12px; margin-top: 6px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #21262d; color: #c9d1d9; font-size: 11px; margin-right: 4px; }
  .assignee { display: inline-block; margin-right: 6px; color: #8b949e; font-size: 12px; }
  .loading, .error { padding: 20px; text-align: center; color: #8b949e; }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div id="issues-container"><div class="loading">Loading issues...</div></div>

<script>
  // Escape HTML-sensitive characters to prevent XSS from user-controlled fields
  // (issue.title, labels, assignees.login, html_url, etc.)
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Configure these for your repo
  const REPO_OWNER = 'midnghtsapphire';
  const REPO_NAME = 'polar-monetization';

  async function loadIssues() {
    const container = document.getElementById('issues-container');
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=open&per_page=50`);
      if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
      const issues = await res.json();

      if (!Array.isArray(issues) || issues.length === 0) {
        container.innerHTML = '<div class="loading">No open issues 🎉</div>';
        return;
      }

      container.innerHTML = issues.map(issue => {
        const safeUrl = escapeHTML(issue.html_url);
        const safeTitle = escapeHTML(issue.title);
        const safeNumber = escapeHTML(issue.number);
        const safeState = escapeHTML(issue.state);

        const labelsHTML = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');

        const assigneesHTML = (issue.assignees || [])
          .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
          .join('');

        return `
          <div class="issue">
            <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">
              #${safeNumber} — ${safeTitle}
            </a>
            <div class="issue-meta">
              State: ${safeState} ${assigneesHTML}
            </div>
            <div class="issue-meta">${labelsHTML}</div>
          </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="error">Failed to load issues: ${escapeHTML(err.message)}</div>`;
    }
  }

  loadIssues();
</script>
</body>
</html>
