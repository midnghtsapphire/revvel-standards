<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .controls { margin-bottom: 20px; }
  input, select, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; }
  button { cursor: pointer; }
  button:hover { background: #21262d; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .issue-title { font-size: 16px; font-weight: 600; color: #58a6ff; text-decoration: none; }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta { color: #8b949e; font-size: 12px; margin-top: 8px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-right: 4px; background: #30363d; color: #c9d1d9; }
  .assignee { display: inline-block; padding: 2px 8px; margin-right: 4px; background: #21262d; border-radius: 4px; }
  .error { color: #f85149; padding: 12px; background: #161b22; border: 1px solid #f85149; border-radius: 6px; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div class="controls">
  <input id="repo" placeholder="owner/repo" value="" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button onclick="loadIssues()">Load Issues</button>
</div>
<div id="issues"></div>

<script>
// Escape HTML to prevent XSS from untrusted GitHub data (titles, labels, usernames, URLs).
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const container = document.getElementById('issues');

  if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
    container.innerHTML = '<div class="error">Please enter a valid owner/repo.</div>';
    return;
  }

  container.innerHTML = 'Loading...';

  try {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
    if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
    const issues = await res.json();

    if (!Array.isArray(issues) || issues.length === 0) {
      container.innerHTML = '<p>No issues found.</p>';
      return;
    }

    container.innerHTML = issues.map(issue => {
      const title = escapeHTML(issue.title);
      const url = escapeHTML(issue.html_url);
      const number = escapeHTML(issue.number);
      const user = escapeHTML(issue.user && issue.user.login);
      const createdAt = escapeHTML(issue.created_at);

      const labels = (issue.labels || [])
        .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
        .join('');

      const assignees = (issue.assignees || [])
        .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
        .join('');

      return `
        <div class="issue">
          <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
          <div class="issue-meta">
            Opened by @${user} on ${createdAt}
          </div>
          <div style="margin-top:8px;">${labels}</div>
          <div style="margin-top:4px;">${assignees}</div>
        </div>
      `;
    }).join('');
  } catch (err) {
    container.innerHTML = `<div class="error">Failed to load issues: ${escapeHTML(err.message)}</div>`;
  }
}
</script>
</body>
</html>
