<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issues {
      display: grid;
      gap: 12px;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
      font-size: 16px;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      color: #8b949e;
      font-size: 12px;
      margin-top: 8px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      background: #1f6feb;
      color: white;
      margin-right: 4px;
    }
    .error {
      color: #f85149;
      padding: 12px;
      background: #161b22;
      border: 1px solid #f85149;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="output" class="issues"></div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS when interpolating
     * user-controlled data into the DOM via innerHTML.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const output = document.getElementById('output');

      if (!repo || !repo.includes('/')) {
        output.innerHTML = '<div class="error">Please enter a valid repo in the format owner/repo</div>';
        return;
      }

      output.innerHTML = '<div>Loading...</div>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }

        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          output.innerHTML = '<div>No issues found.</div>';
          return;
        }

        // Filter out pull requests (GitHub API returns PRs as issues too)
        const filtered = issues.filter(i => !i.pull_request);

        output.innerHTML = filtered.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => escapeHTML(a.login))
            .join(', ');
          const safeUrl = escapeHTML(issue.html_url);
          const safeTitle = escapeHTML(issue.title);
          const safeNumber = escapeHTML(issue.number);
          const safeUser = escapeHTML(issue.user && issue.user.login);
          const safeState = escapeHTML(issue.state);

          return `
            <div class="issue">
              <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
              <div>${labels}</div>
              <div class="issue-meta">
                Opened by ${safeUser} · State: ${safeState}
                ${assignees ? ` · Assigned: ${assignees}` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        output.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
