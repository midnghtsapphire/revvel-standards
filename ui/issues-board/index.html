<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
    h1 { color: #58a6ff; }
    .controls { margin-bottom: 20px; }
    input, select, button { padding: 8px 12px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; }
    button { cursor: pointer; }
    button:hover { background: #21262d; }
    .issue { border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 10px; background: #161b22; }
    .issue-title { font-weight: 600; color: #58a6ff; text-decoration: none; }
    .issue-title:hover { text-decoration: underline; }
    .issue-meta { font-size: 12px; color: #8b949e; margin-top: 6px; }
    .label { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #1f6feb; color: #fff; font-size: 11px; margin-right: 4px; }
    .assignee { display: inline-block; margin-right: 6px; }
    #status { margin: 10px 0; color: #8b949e; }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load</button>
  </div>
  <div id="status"></div>
  <div id="issues"></div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS when interpolating
     * user-controlled data (issue titles, labels, usernames, URLs) into HTML.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const statusEl = document.getElementById('status');
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        statusEl.textContent = 'Please enter a valid owner/repo';
        return;
      }

      statusEl.textContent = 'Loading...';
      container.innerHTML = '';

      try {
        const resp = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!resp.ok) {
          statusEl.textContent = `Error: ${resp.status} ${resp.statusText}`;
          return;
        }
        const issues = await resp.json();
        statusEl.textContent = `Loaded ${issues.length} issue(s)`;

        container.innerHTML = issues.map(issue => {
          const safeUrl = escapeHTML(issue.html_url);
          const safeTitle = escapeHTML(issue.title);
          const safeNumber = escapeHTML(issue.number);
          const safeUser = escapeHTML(issue.user && issue.user.login);
          const safeCreated = escapeHTML(issue.created_at);

          const labelsHtml = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');

          const assigneesHtml = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');

          return `
            <div class="issue">
              <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
              <div class="issue-meta">
                by ${safeUser} · ${safeCreated}
                <div>${labelsHtml}</div>
                <div>${assigneesHtml}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        statusEl.textContent = `Error: ${escapeHTML(err.message)}`;
      }
    }
  </script>
</body>
</html>
