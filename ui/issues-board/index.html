<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #58a6ff;
    border-bottom: 1px solid #30363d;
    padding-bottom: 10px;
  }
  .controls {
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  input, select, button {
    background: #161b22;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    cursor: pointer;
    background: #238636;
    border-color: #238636;
  }
  button:hover { background: #2ea043; }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 10px;
  }
  .issue-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 8px 0;
  }
  .issue-title a { color: #58a6ff; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta {
    font-size: 12px;
    color: #8b949e;
  }
  .label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    background: #21262d;
    margin-right: 4px;
  }
  .assignee {
    display: inline-block;
    margin-right: 6px;
    color: #d2a8ff;
  }
  #status { color: #8b949e; font-size: 13px; }
</style>
</head>
<body>
<h1>📋 GitHub Issues Board</h1>
<div class="controls">
  <input id="repo" placeholder="owner/repo" value="" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button onclick="loadIssues()">Load</button>
  <span id="status"></span>
</div>
<div id="issues"></div>

<script>
/**
 * Escape HTML-sensitive characters to prevent XSS.
 * All user-controlled data from the GitHub API must be passed through this
 * before being interpolated into innerHTML.
 */
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const status = document.getElementById('status');
  const container = document.getElementById('issues');

  if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
    status.textContent = 'Please enter a valid owner/repo';
    return;
  }

  status.textContent = 'Loading...';
  container.innerHTML = '';

  try {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
    if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
    const issues = await res.json();

    // Filter out pull requests (GitHub API returns PRs as issues too)
    const actual = issues.filter(i => !i.pull_request);
    status.textContent = `${actual.length} issue(s)`;

    container.innerHTML = actual.map(issue => {
      const labels = (issue.labels || [])
        .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
        .join('');
      const assignees = (issue.assignees || [])
        .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
        .join('');
      const safeUrl = escapeHTML(issue.html_url);
      const safeTitle = escapeHTML(issue.title);
      const safeNumber = escapeHTML(issue.number);
      const safeUser = escapeHTML(issue.user ? issue.user.login : 'unknown');
      const safeDate = escapeHTML(new Date(issue.created_at).toLocaleDateString());

      return `
        <div class="issue">
          <div class="issue-title">
            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
          </div>
          <div class="issue-meta">
            Opened by ${safeUser} on ${safeDate}
            ${labels ? '<br>' + labels : ''}
            ${assignees ? '<br>Assigned: ' + assignees : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    status.textContent = 'Error: ' + escapeHTML(err.message);
  }
}
</script>
</body>
</html>
