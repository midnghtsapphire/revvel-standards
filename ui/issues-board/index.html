<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 24px;
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 16px;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #238636;
      border-color: #238636;
      color: white;
    }
    button:hover {
      background: #2ea043;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .issue-title {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 6px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 11px;
      margin-right: 4px;
    }
    .status {
      color: #8b949e;
      font-size: 13px;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input id="repo" type="text" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="status" class="status"></div>
  <div id="issues"></div>

  <script>
    // Escape HTML entities to prevent XSS attacks when rendering user-controlled data.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const statusEl = document.getElementById('status');
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        statusEl.textContent = 'Please enter a repo in owner/repo format.';
        return;
      }

      statusEl.textContent = 'Loading...';
      container.innerHTML = '';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
        const issues = await res.json();

        if (!issues.length) {
          statusEl.textContent = 'No issues found.';
          return;
        }

        statusEl.textContent = `Loaded ${issues.length} issue(s).`;

        container.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const htmlUrl = escapeHTML(issue.html_url);
          const number = escapeHTML(issue.number);
          const userLogin = escapeHTML(issue.user && issue.user.login);
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => escapeHTML(a.login))
            .join(', ');

          return `
            <div class="issue">
              <a class="issue-title" href="${htmlUrl}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              <div class="issue-meta">
                by ${userLogin}${assignees ? ` · assigned: ${assignees}` : ''}
              </div>
              <div style="margin-top:8px;">${labels}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        statusEl.textContent = `Error: ${escapeHTML(err.message)}`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
