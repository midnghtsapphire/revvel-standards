<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  input, select, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; }
  button { cursor: pointer; }
  button:hover { background: #21262d; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 10px; }
  .issue-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .issue-title a { color: #58a6ff; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta { font-size: 12px; color: #8b949e; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #1f6feb; color: #fff; font-size: 11px; margin-right: 4px; }
  .assignee { display: inline-block; margin-right: 8px; }
  .loading { text-align: center; padding: 40px; color: #8b949e; }
  .error { background: #490202; color: #ff7b72; padding: 12px; border-radius: 6px; }
</style>
</head>
<body>
<h1>🗂️ GitHub Issues Board</h1>
<div class="controls">
  <input id="repo" placeholder="owner/repo" value="" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button id="load">Load Issues</button>
</div>
<div id="issues"><div class="loading">Enter a repo and click Load Issues</div></div>

<script>
// Escape HTML to prevent XSS from user-controlled GitHub data
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const container = document.getElementById('issues');

  if (!repo || !repo.includes('/')) {
    container.innerHTML = '<div class="error">Please enter a valid owner/repo</div>';
    return;
  }

  container.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const resp = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
    if (!resp.ok) throw new Error(`GitHub API returned ${resp.status}`);
    const issues = await resp.json();

    if (!Array.isArray(issues) || issues.length === 0) {
      container.innerHTML = '<div class="loading">No issues found</div>';
      return;
    }

    const html = issues
      .filter(i => !i.pull_request)
      .map(issue => {
        const labels = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');
        const assignees = (issue.assignees || [])
          .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
          .join('');
        return `
          <div class="issue">
            <div class="issue-title">
              <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">#${escapeHTML(issue.number)} ${escapeHTML(issue.title)}</a>
            </div>
            <div class="issue-meta">
              ${labels}
              ${assignees}
              <span>State: ${escapeHTML(issue.state)}</span>
            </div>
          </div>
        `;
      })
      .join('');

    container.innerHTML = html || '<div class="loading">No issues (only PRs found)</div>';
  } catch (err) {
    container.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
  }
}

document.getElementById('load').addEventListener('click', loadIssues);
</script>
</body>
</html>
