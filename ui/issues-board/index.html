<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#0d1117; color:#c9d1d9; margin:0; padding:20px; }
  h1 { color:#58a6ff; }
  .controls { margin-bottom:20px; }
  input, select, button { background:#161b22; color:#c9d1d9; border:1px solid #30363d; padding:8px 12px; border-radius:6px; margin-right:8px; }
  button { cursor:pointer; }
  button:hover { background:#238636; border-color:#238636; }
  .issue { background:#161b22; border:1px solid #30363d; border-radius:6px; padding:16px; margin-bottom:12px; }
  .issue-title { font-size:16px; font-weight:600; margin:0 0 8px; }
  .issue-title a { color:#58a6ff; text-decoration:none; }
  .issue-title a:hover { text-decoration:underline; }
  .issue-meta { font-size:12px; color:#8b949e; margin-bottom:8px; }
  .label { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; background:#30363d; color:#c9d1d9; margin-right:4px; }
  .assignee { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; background:#1f6feb; color:#fff; margin-right:4px; }
  .loading { text-align:center; padding:40px; color:#8b949e; }
  .error { color:#f85149; padding:16px; background:#161b22; border-radius:6px; border:1px solid #f85149; }
</style>
</head>
<body>
<h1>📋 GitHub Issues Board</h1>
<div class="controls">
  <input type="text" id="repo" placeholder="owner/repo" value="" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button onclick="loadIssues()">Load Issues</button>
</div>
<div id="issues"><div class="loading">Enter a repository (owner/repo) and click Load Issues.</div></div>

<script>
  // Escape HTML-sensitive characters to prevent XSS attacks.
  function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function loadIssues() {
    const repo = document.getElementById('repo').value.trim();
    const state = document.getElementById('state').value;
    const container = document.getElementById('issues');

    if (!repo || !repo.includes('/')) {
      container.innerHTML = '<div class="error">Please provide a valid repository in the format owner/repo.</div>';
      return;
    }

    container.innerHTML = '<div class="loading">Loading issues...</div>';

    try {
      const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const issues = await res.json();

      if (!Array.isArray(issues) || issues.length === 0) {
        container.innerHTML = '<div class="loading">No issues found.</div>';
        return;
      }

      // Build DOM safely with escaped values to prevent XSS.
      const html = issues.filter(i => !i.pull_request).map(issue => {
        const title = escapeHTML(issue.title);
        const url = escapeHTML(issue.html_url);
        const number = escapeHTML(issue.number);
        const user = escapeHTML(issue.user && issue.user.login);
        const createdAt = escapeHTML(new Date(issue.created_at).toLocaleDateString());
        const labels = (issue.labels || []).map(l => `<span class="label">${escapeHTML(l.name)}</span>`).join('');
        const assignees = (issue.assignees || []).map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`).join('');
        return `
          <div class="issue">
            <div class="issue-title"><a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a></div>
            <div class="issue-meta">Opened by ${user} on ${createdAt}</div>
            <div>${labels}${assignees}</div>
          </div>
        `;
      }).join('');

      container.innerHTML = html || '<div class="loading">No issues (only PRs found).</div>';
    } catch (err) {
      container.innerHTML = `<div class="error">Failed to load issues: ${escapeHTML(err.message)}</div>`;
    }
  }
</script>
</body>
</html>
