<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .controls {
      margin: 20px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #238636;
      border-color: #238636;
      color: white;
    }
    button:hover { background: #2ea043; }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin: 10px 0;
    }
    .issue-title {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover { text-decoration: underline; }
    .issue-meta {
      color: #8b949e;
      font-size: 12px;
      margin-top: 5px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-right: 4px;
      background: #30363d;
      color: #c9d1d9;
    }
    .assignee {
      display: inline-block;
      margin-left: 5px;
      color: #79c0ff;
    }
    .loading, .error { text-align: center; padding: 40px; color: #8b949e; }
    .error { color: #f85149; }
  </style>
</head>
<body>
  <h1>🎯 Issues Board — $10M Mission</h1>
  <div class="controls">
    <input type="text" id="repo" placeholder="owner/repo" value="">
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="issues"></div>

  <script>
    // Escape HTML to prevent XSS from user-controlled GitHub issue data.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !/^[^/\s]+\/[^/\s]+$/.test(repo)) {
        container.innerHTML = '<div class="error">Please enter a valid owner/repo</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading issues...</div>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="loading">No issues found.</div>';
          return;
        }

        container.innerHTML = issues.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');
          const safeUrl = escapeHTML(issue.html_url || '#');
          const safeTitle = escapeHTML(issue.title || '(no title)');
          const safeNumber = escapeHTML(issue.number);
          const safeUser = escapeHTML(issue.user && issue.user.login);

          return `
            <div class="issue">
              <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
              <div class="issue-meta">
                by ${safeUser} ${assignees}
              </div>
              <div style="margin-top:8px">${labels}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
