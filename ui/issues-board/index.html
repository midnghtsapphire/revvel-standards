<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #238636;
      border-color: #238636;
      color: #fff;
    }
    button:hover {
      background: #2ea043;
    }
    .issues {
      display: grid;
      gap: 12px;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      transition: border-color 0.2s;
    }
    .issue:hover {
      border-color: #58a6ff;
    }
    .issue-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .issue-title a {
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title a:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }
    .labels {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: #30363d;
      color: #c9d1d9;
    }
    .assignees {
      margin-top: 8px;
      font-size: 12px;
      color: #8b949e;
    }
    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input type="text" id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="issues" class="issues">
    <div class="loading">Enter a repository (owner/repo) and click Load Issues.</div>
  </div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS attacks.
     * Converts &, <, >, ", ' into their respective HTML entities.
     * Any non-string input is coerced to string first.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      const str = String(value);
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<div class="error">Please enter a valid repository (owner/repo).</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading issues...</div>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }
        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="loading">No issues found.</div>';
          return;
        }

        // Filter out pull requests (GitHub API returns them under /issues too)
        const onlyIssues = issues.filter(i => !i.pull_request);

        container.innerHTML = onlyIssues.map(issue => {
          const safeTitle = escapeHTML(issue.title);
          const safeUrl = escapeHTML(issue.html_url);
          const safeNumber = escapeHTML(issue.number);
          const safeUser = escapeHTML(issue.user && issue.user.login);
          const safeCreated = escapeHTML(new Date(issue.created_at).toLocaleDateString());

          const labelsHTML = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');

          const assigneesHTML = (issue.assignees || []).length
            ? `Assignees: ${(issue.assignees || []).map(a => escapeHTML(a.login)).join(', ')}`
            : 'Unassigned';

          return `
            <div class="issue">
              <div class="issue-title">
                <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
              </div>
              <div class="issue-meta">Opened by ${safeUser} on ${safeCreated}</div>
              <div class="labels">${labelsHTML}</div>
              <div class="assignees">${assigneesHTML}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Error loading issues: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
    document.getElementById('repo').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadIssues();
    });
  </script>
</body>
</html>
