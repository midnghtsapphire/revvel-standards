<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .issue-title { font-weight: 600; color: #f0f6fc; }
  .issue-title a { color: inherit; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta { color: #8b949e; font-size: 12px; margin-top: 4px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #30363d; color: #c9d1d9; font-size: 11px; margin-right: 4px; }
  .assignee { color: #58a6ff; }
  .error { color: #f85149; }
  .loading { color: #8b949e; }
  #controls { margin-bottom: 16px; }
  input, button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { background: #30363d; }
</style>
</head>
<body>
<h1>🐛 GitHub Issues Board</h1>
<div id="controls">
  <input type="text" id="repo" placeholder="owner/repo" value="" />
  <button onclick="loadIssues()">Load Issues</button>
</div>
<div id="issues" class="loading">Enter a repo and click Load Issues.</div>

<script>
/**
 * Escape HTML-sensitive characters to prevent XSS.
 * Applied to all user-controlled fields (title, labels, assignees, urls)
 * before interpolation into innerHTML.
 */
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repoInput = document.getElementById('repo').value.trim();
  const container = document.getElementById('issues');
  if (!repoInput || !/^[\w.-]+\/[\w.-]+$/.test(repoInput)) {
    container.className = 'error';
    container.textContent = 'Please enter a valid owner/repo.';
    return;
  }
  container.className = 'loading';
  container.textContent = 'Loading...';
  try {
    const resp = await fetch(`https://api.github.com/repos/${encodeURIComponent(repoInput.split('/')[0])}/${encodeURIComponent(repoInput.split('/')[1])}/issues?state=open&per_page=50`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const issues = await resp.json();
    if (!Array.isArray(issues) || issues.length === 0) {
      container.textContent = 'No open issues.';
      return;
    }
    container.className = '';
    container.innerHTML = issues.map(renderIssue).join('');
  } catch (err) {
    container.className = 'error';
    container.textContent = `Failed to load: ${err.message}`;
  }
}

function renderIssue(issue) {
  const title = escapeHTML(issue.title);
  const url = escapeHTML(issue.html_url);
  const number = escapeHTML(issue.number);
  const labels = (issue.labels || [])
    .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
    .join('');
  const assignees = (issue.assignees || [])
    .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
    .join(' ');
  return `
    <div class="issue">
      <div class="issue-title">
        <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
      </div>
      <div class="issue-meta">
        ${labels} ${assignees}
      </div>
    </div>
  `;
}
</script>
</body>
</html>
