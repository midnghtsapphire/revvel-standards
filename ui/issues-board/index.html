<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .controls { margin-bottom: 20px; }
  input, select, button { padding: 8px; margin-right: 8px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; }
  button { cursor: pointer; }
  button:hover { background: #21262d; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .issue-title { font-size: 16px; font-weight: 600; }
  .issue-title a { color: #58a6ff; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta { font-size: 12px; color: #8b949e; margin-top: 6px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 4px; background: #30363d; color: #c9d1d9; }
  .assignee { display: inline-block; margin-right: 6px; font-size: 12px; color: #58a6ff; }
  #status { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input type="text" id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="status">Enter a repo and click Load Issues.</div>
  <div id="issues"></div>

<script>
// Escape HTML-sensitive characters to prevent XSS from user-controlled
// GitHub issue data (titles, labels, usernames, URLs, etc.).
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const status = document.getElementById('status');
  const container = document.getElementById('issues');

  container.innerHTML = '';

  if (!repo || !/^[^\/\s]+\/[^\/\s]+$/.test(repo)) {
    status.textContent = 'Please enter a valid repo in owner/repo format.';
    return;
  }

  status.textContent = 'Loading...';
  try {
    const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
    const resp = await fetch(url);
    if (!resp.ok) {
      status.textContent = `Error: ${resp.status} ${resp.statusText}`;
      return;
    }
    const issues = await resp.json();
    if (!Array.isArray(issues) || issues.length === 0) {
      status.textContent = 'No issues found.';
      return;
    }
    status.textContent = `Loaded ${issues.length} issues.`;

    const html = issues
      .filter(issue => !issue.pull_request)
      .map(issue => {
        const labels = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');
        const assignees = (issue.assignees || [])
          .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
          .join('');
        return `
          <div class="issue">
            <div class="issue-title">
              <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
                #${escapeHTML(issue.number)} ${escapeHTML(issue.title)}
              </a>
            </div>
            <div class="issue-meta">
              by @${escapeHTML(issue.user && issue.user.login)} · ${labels} ${assignees}
            </div>
          </div>
        `;
      })
      .join('');
    container.innerHTML = html;
  } catch (err) {
    status.textContent = `Error: ${escapeHTML(err.message)}`;
  }
}
</script>
</body>
</html>
