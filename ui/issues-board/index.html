<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      margin-right: 8px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .issue a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
    }
    .issue a:hover {
      text-decoration: underline;
    }
    .meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      font-size: 11px;
      margin-right: 4px;
    }
    .assignee {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #238636;
      color: white;
      font-size: 11px;
      margin-right: 4px;
    }
    #status {
      color: #8b949e;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🗂 GitHub Issues Board</h1>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load</button>
    <span id="status"></span>
  </div>
  <div id="issues"></div>

  <script>
    /**
     * Escape HTML special characters to prevent XSS attacks.
     * All user-controlled fields from the GitHub API must be passed through
     * this function before being interpolated into HTML.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const status = document.getElementById('status');
      const container = document.getElementById('issues');

      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
        status.textContent = 'Enter a valid owner/repo';
        return;
      }

      status.textContent = 'Loading...';
      container.innerHTML = '';

      try {
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          status.textContent = 'No issues found';
          return;
        }

        status.textContent = `${issues.length} issue(s)`;

        container.innerHTML = issues.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');
          return `
            <div class="issue">
              <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
                #${escapeHTML(issue.number)} ${escapeHTML(issue.title)}
              </a>
              <div class="meta">
                ${labels} ${assignees}
                <span>by @${escapeHTML(issue.user && issue.user.login)}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        status.textContent = 'Error: ' + escapeHTML(err.message);
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
