<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board — $10M Mission</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 { color: var(--accent); margin-top: 0; }
    .mission {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .mission strong { color: var(--green); }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .issue {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .issue-title {
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .issue-title:hover { color: var(--accent); }
    .issue-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin-right: 4px;
      background: #21262d;
      border: 1px solid var(--border);
    }
    .error { color: var(--red); }
    .loading { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="mission">
    <strong>PRIME DIRECTIVE:</strong> $10k/month → $10M in 3 years.
    Track every issue that moves us closer to Polar.sh funding, OSINT tools, and automated pipelines.
  </div>

  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" style="flex:1;min-width:200px;"/>
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>

  <div id="issues"><p class="loading">Enter a repo and click "Load Issues".</p></div>

  <script>
    // SECURITY: Escape HTML to prevent XSS from GitHub-sourced data
    // (issue titles, labels, usernames, URLs can contain malicious payloads).
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<p class="error">Please enter a valid owner/repo.</p>';
        return;
      }

      container.innerHTML = '<p class="loading">Loading...</p>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<p class="loading">No issues found.</p>';
          return;
        }

        container.innerHTML = issues
          .filter(i => !i.pull_request) // exclude PRs
          .map(issue => {
            const labels = (issue.labels || [])
              .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
              .join('');
            const assignees = (issue.assignees || [])
              .map(a => escapeHTML(a.login))
              .join(', ');
            return `
              <div class="issue">
                <a class="issue-title" href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
                  #${escapeHTML(issue.number)} — ${escapeHTML(issue.title)}
                </a>
                <div class="issue-meta">
                  ${labels}
                  ${assignees ? `· Assigned: ${assignees}` : ''}
                  · State: ${escapeHTML(issue.state)}
                </div>
              </div>
            `;
          })
          .join('');
      } catch (err) {
        container.innerHTML = `<p class="error">Error: ${escapeHTML(err.message)}</p>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
    document.getElementById('repo').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadIssues();
    });
  </script>
</body>
</html>
