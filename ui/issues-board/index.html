<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      color: #8b949e;
      font-size: 12px;
      margin-top: 4px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      background: #1f6feb;
      color: white;
      margin-right: 4px;
    }
    .assignee {
      color: #7ee787;
      margin-right: 4px;
    }
    .error {
      color: #f85149;
      padding: 12px;
      background: #161b22;
      border: 1px solid #f85149;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="controls">
    <input id="repoInput" type="text" placeholder="owner/repo" value="" />
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="issues"></div>

  <script>
    /**
     * Escape HTML-sensitive characters to prevent XSS.
     * Applied to any user-controlled string before it is interpolated into innerHTML.
     */
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repoInput').value.trim();
      const container = document.getElementById('issues');
      if (!repo) {
        container.innerHTML = '<div class="error">Please enter a repository (owner/repo).</div>';
        return;
      }
      container.innerHTML = 'Loading...';
      try {
        const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }
        const issues = await response.json();
        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div>No open issues found.</div>';
          return;
        }
        container.innerHTML = issues.map(issue => {
          const safeTitle = escapeHTML(issue.title);
          const safeUrl = escapeHTML(issue.html_url);
          const safeNumber = escapeHTML(issue.number);
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');
          return `
            <div class="issue">
              <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
              <div class="issue-meta">
                ${labels}
                ${assignees}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
