<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    .controls {
      margin-bottom: 20px;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      margin-right: 8px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .issue-title {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title:hover {
      text-decoration: underline;
    }
    .issue-meta {
      color: #8b949e;
      font-size: 12px;
      margin-top: 8px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      background: #30363d;
      color: #c9d1d9;
      font-size: 11px;
      margin-right: 4px;
    }
    .assignee {
      color: #58a6ff;
      margin-right: 8px;
    }
    .loading {
      color: #8b949e;
      font-style: italic;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input type="text" id="repo-input" placeholder="owner/repo" value="" />
    <select id="state-filter">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button onclick="loadIssues()">Load Issues</button>
  </div>
  <div id="issues-container">
    <p class="loading">Enter a repo (e.g., owner/repo) and click Load Issues.</p>
  </div>

  <script>
    // Escape HTML to prevent XSS attacks from untrusted user content
    // (issue titles, labels, usernames, URLs, etc.)
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo-input').value.trim();
      const state = document.getElementById('state-filter').value;
      const container = document.getElementById('issues-container');

      if (!repo || !repo.includes('/')) {
        container.innerHTML = '<p class="error">Please enter a valid owner/repo.</p>';
        return;
      }

      container.innerHTML = '<p class="loading">Loading issues...</p>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`GitHub API error: ${response.status}`);
        }
        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<p class="loading">No issues found.</p>';
          return;
        }

        // Filter out pull requests (GitHub API includes them in issues)
        const filtered = issues.filter(i => !i.pull_request);

        container.innerHTML = filtered.map(issue => {
          const labels = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');
          const assignees = (issue.assignees || [])
            .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
            .join('');
          return `
            <div class="issue">
              <a class="issue-title" href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
                #${escapeHTML(issue.number)} ${escapeHTML(issue.title)}
              </a>
              <div class="issue-meta">
                ${labels}
                ${assignees}
                <span>State: ${escapeHTML(issue.state)}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p class="error">Error: ${escapeHTML(err.message)}</p>`;
      }
    }
  </script>
</body>
</html>
