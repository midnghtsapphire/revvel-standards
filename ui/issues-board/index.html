<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    #issues {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      transition: border-color 0.2s;
    }
    .issue:hover {
      border-color: #58a6ff;
    }
    .issue-title {
      font-weight: 600;
      color: #c9d1d9;
      margin: 0 0 8px 0;
      font-size: 14px;
    }
    .issue-title a {
      color: inherit;
      text-decoration: none;
    }
    .issue-title a:hover {
      color: #58a6ff;
    }
    .issue-meta {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }
    .labels {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      background: #1f6feb;
      color: white;
    }
    .assignees {
      margin-top: 8px;
      font-size: 12px;
      color: #8b949e;
    }
    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div id="issues"><div class="loading">Loading issues...</div></div>

  <script>
    // Escape HTML to prevent XSS attacks from user-controlled data
    // (issue titles, labels, assignee names, URLs, etc.)
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Only allow http(s) URLs to prevent javascript: URI XSS
    function safeURL(url) {
      if (!url) return '#';
      const str = String(url).trim();
      if (/^https?:\/\//i.test(str)) return escapeHTML(str);
      return '#';
    }

    async function loadIssues() {
      const container = document.getElementById('issues');
      try {
        const repo = (document.body.dataset.repo || 'midnghtsapphire/zeroday').trim();
        const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const issues = await response.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="loading">No open issues 🎉</div>';
          return;
        }

        container.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const url = safeURL(issue.html_url);
          const number = Number(issue.number) || 0;
          const user = escapeHTML(issue.user && issue.user.login);
          const labels = Array.isArray(issue.labels)
            ? issue.labels.map(l => `<span class="label">${escapeHTML(l.name)}</span>`).join('')
            : '';
          const assignees = Array.isArray(issue.assignees) && issue.assignees.length
            ? '👤 ' + issue.assignees.map(a => escapeHTML(a.login)).join(', ')
            : '';

          return `
            <div class="issue">
              <p class="issue-title"><a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a></p>
              <div class="issue-meta">Opened by ${user}</div>
              <div class="labels">${labels}</div>
              ${assignees ? `<div class="assignees">${assignees}</div>` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Failed to load issues: ${escapeHTML(err.message)}</div>`;
      }
    }

    loadIssues();
  </script>
</body>
</html>
