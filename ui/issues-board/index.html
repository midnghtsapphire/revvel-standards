<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .issue a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
    }
    .issue a:hover {
      text-decoration: underline;
    }
    .labels {
      margin-top: 6px;
    }
    .label {
      display: inline-block;
      background: #21262d;
      color: #c9d1d9;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-right: 4px;
    }
    .assignees {
      margin-top: 6px;
      font-size: 13px;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div id="issues">Loading…</div>

  <script>
    // Escape HTML to prevent XSS from user-controlled GitHub data
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Only allow http(s) URLs to avoid javascript: URI XSS
    function safeUrl(url) {
      try {
        const u = new URL(url, window.location.origin);
        if (u.protocol === 'http:' || u.protocol === 'https:') {
          return escapeHTML(u.href);
        }
      } catch (e) {
        /* invalid URL */
      }
      return '#';
    }

    async function loadIssues() {
      const container = document.getElementById('issues');
      try {
        const resp = await fetch(
          'https://api.github.com/repos/OWNER/REPO/issues?state=open&per_page=50'
        );
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const issues = await resp.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.textContent = 'No open issues.';
          return;
        }

        container.innerHTML = issues
          .map((issue) => {
            const url = safeUrl(issue.html_url);
            const title = escapeHTML(issue.title);
            const number = escapeHTML(issue.number);

            const labelsHtml = Array.isArray(issue.labels)
              ? issue.labels
                  .map(
                    (l) =>
                      `<span class="label">${escapeHTML(l.name)}</span>`
                  )
                  .join('')
              : '';

            const assigneesHtml = Array.isArray(issue.assignees) && issue.assignees.length
              ? `<div class="assignees">👤 ${issue.assignees
                  .map((a) => escapeHTML(a.login))
                  .join(', ')}</div>`
              : '';

            return `
              <div class="issue">
                <a href="${url}" target="_blank" rel="noopener noreferrer">
                  #${number} — ${title}
                </a>
                <div class="labels">${labelsHtml}</div>
                ${assigneesHtml}
              </div>
            `;
          })
          .join('');
      } catch (err) {
        container.innerHTML = '';
        const errDiv = document.createElement('div');
        errDiv.className = 'error';
        errDiv.textContent = 'Failed to load issues: ' + err.message;
        container.appendChild(errDiv);
      }
    }

    loadIssues();
  </script>
</body>
</html>
