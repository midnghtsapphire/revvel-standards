<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .issue-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
  .issue-title a { color: #58a6ff; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta { font-size: 12px; color: #8b949e; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #21262d; color: #c9d1d9; font-size: 11px; margin-right: 4px; }
  .assignee { display: inline-block; margin-right: 8px; font-size: 12px; }
  .loading, .error { padding: 20px; text-align: center; }
  .error { color: #f85149; }
</style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div id="issues" class="loading">Loading issues...</div>

<script>
// Escape HTML to prevent XSS from user-controlled fields (issue titles, labels, usernames, URLs)
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Additional URL sanitization - only allow http(s) URLs
function safeURL(url) {
  if (!url) return '#';
  const s = String(url).trim();
  if (/^https?:\/\//i.test(s)) return escapeHTML(s);
  return '#';
}

async function loadIssues() {
  const container = document.getElementById('issues');
  try {
    // Attempt to derive repo from URL params, fallback to a default
    const params = new URLSearchParams(window.location.search);
    const repo = params.get('repo') || 'midnghtsapphire/polar-bootstrap';
    const resp = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
    if (!resp.ok) throw new Error(`GitHub API error: ${resp.status}`);
    const issues = await resp.json();

    if (!Array.isArray(issues) || issues.length === 0) {
      container.className = '';
      container.innerHTML = '<p>No open issues found.</p>';
      return;
    }

    container.className = '';
    container.innerHTML = issues.map(issue => {
      const title = escapeHTML(issue.title);
      const url = safeURL(issue.html_url);
      const number = escapeHTML(issue.number);
      const labels = (issue.labels || []).map(l =>
        `<span class="label">${escapeHTML(l.name)}</span>`
      ).join('');
      const assignees = (issue.assignees || []).map(a =>
        `<span class="assignee">@${escapeHTML(a.login)}</span>`
      ).join('');
      const createdAt = escapeHTML(new Date(issue.created_at).toLocaleDateString());

      return `
        <div class="issue">
          <div class="issue-title">
            <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} - ${title}</a>
          </div>
          <div class="issue-meta">
            Created: ${createdAt} ${assignees}
          </div>
          <div>${labels}</div>
        </div>
      `;
    }).join('');
  } catch (err) {
    container.className = 'error';
    container.textContent = 'Failed to load issues: ' + err.message;
  }
}

loadIssues();
</script>
</body>
</html>
