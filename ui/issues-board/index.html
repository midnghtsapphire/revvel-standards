<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; margin-bottom: 10px; }
  .issue a { color: #58a6ff; text-decoration: none; font-weight: 600; }
  .issue a:hover { text-decoration: underline; }
  .labels { margin-top: 6px; }
  .label { display: inline-block; padding: 2px 8px; margin-right: 4px; border-radius: 10px; font-size: 12px; background: #21262d; color: #c9d1d9; }
  .assignees { color: #8b949e; font-size: 13px; margin-top: 4px; }
  .meta { color: #8b949e; font-size: 12px; margin-top: 4px; }
  #loading, #error { padding: 20px; text-align: center; }
  #error { color: #f85149; }
</style>
</head>
<body>
<h1>📋 Open Issues Board</h1>
<div id="loading">Loading issues…</div>
<div id="error" style="display:none"></div>
<div id="issues"></div>

<script>
  // Repository configuration — adjust as needed or wire via env at build time.
  const REPO = 'grahmo/UBOS.ai';
  const API = `https://api.github.com/repos/${REPO}/issues?state=open&per_page=50`;

  /**
   * Escape HTML-sensitive characters to prevent XSS when interpolating
   * untrusted GitHub-issue data into innerHTML.
   */
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function loadIssues() {
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const container = document.getElementById('issues');

    try {
      const res = await fetch(API, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const issues = await res.json();
      loadingEl.style.display = 'none';

      if (!Array.isArray(issues) || issues.length === 0) {
        container.innerHTML = '<p>No open issues 🎉</p>';
        return;
      }

      // Filter out PRs (GitHub returns them via the issues endpoint too).
      const onlyIssues = issues.filter(i => !i.pull_request);

      container.innerHTML = onlyIssues.map(issue => {
        const title = escapeHTML(issue.title);
        const url = escapeHTML(issue.html_url);
        const number = escapeHTML(issue.number);
        const labels = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');
        const assignees = (issue.assignees || [])
          .map(a => escapeHTML(a.login))
          .join(', ');
        const created = escapeHTML(new Date(issue.created_at).toLocaleDateString());

        return `
          <div class="issue">
            <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} — ${title}</a>
            <div class="labels">${labels}</div>
            ${assignees ? `<div class="assignees">Assignees: ${assignees}</div>` : ''}
            <div class="meta">Opened: ${created}</div>
          </div>
        `;
      }).join('');
    } catch (err) {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = `Failed to load issues: ${err.message}`;
    }
  }

  loadIssues();
</script>
</body>
</html>
