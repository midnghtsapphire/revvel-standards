<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .issue a { color: #58a6ff; text-decoration: none; font-weight: 600; }
  .issue a:hover { text-decoration: underline; }
  .labels { margin-top: 6px; }
  .label { display: inline-block; background: #1f6feb; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-right: 4px; }
  .assignees { color: #8b949e; font-size: 12px; margin-top: 4px; }
  .controls { margin-bottom: 20px; }
  input, button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px; border-radius: 6px; }
  button { cursor: pointer; }
  button:hover { background: #30363d; }
</style>
</head>
<body>
<h1>🎯 Issues Board</h1>
<div class="controls">
  <input id="repo" placeholder="owner/repo" value="midnghtsapphire/repo">
  <button onclick="loadIssues()">Load</button>
</div>
<div id="issues"></div>

<script>
// XSS mitigation: escape all user-controlled data before injecting into DOM.
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  if (!repo) return;
  const container = document.getElementById('issues');
  container.innerHTML = 'Loading...';
  try {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=open&per_page=50`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const issues = await res.json();
    container.innerHTML = issues.map(issue => {
      const labels = (issue.labels || []).map(l =>
        `<span class="label">${escapeHTML(l.name)}</span>`
      ).join('');
      const assignees = (issue.assignees || []).map(a =>
        escapeHTML(a.login)
      ).join(', ');
      return `
        <div class="issue">
          <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">#${escapeHTML(issue.number)} ${escapeHTML(issue.title)}</a>
          <div class="labels">${labels}</div>
          ${assignees ? `<div class="assignees">Assigned: ${assignees}</div>` : ''}
        </div>
      `;
    }).join('');
  } catch (e) {
    container.textContent = 'Error: ' + e.message;
  }
}

loadIssues();
</script>
</body>
</html>
