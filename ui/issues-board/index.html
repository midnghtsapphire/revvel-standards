<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  h1 { color: #58a6ff; }
  .filters { margin-bottom: 20px; }
  .filters input, .filters select { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 8px; border-radius: 6px; margin-right: 8px; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .issue-title { font-weight: bold; color: #58a6ff; text-decoration: none; }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta { color: #8b949e; font-size: 0.9em; margin-top: 4px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; margin-right: 4px; background: #30363d; color: #c9d1d9; }
  .assignee { color: #58a6ff; margin-left: 6px; }
  .loading, .error { padding: 20px; text-align: center; color: #8b949e; }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div class="filters">
  <input type="text" id="repo" placeholder="owner/repo" value="" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button id="load">Load Issues</button>
</div>
<div id="issues"><div class="loading">Enter a repository and click Load Issues.</div></div>

<script>
// Escape HTML to prevent XSS from user-controlled GitHub issue data.
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const container = document.getElementById('issues');
  if (!repo || !repo.includes('/')) {
    container.innerHTML = '<div class="error">Please enter a valid owner/repo.</div>';
    return;
  }
  container.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
    if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
    const issues = await res.json();
    if (!Array.isArray(issues) || issues.length === 0) {
      container.innerHTML = '<div class="loading">No issues found.</div>';
      return;
    }
    container.innerHTML = issues.filter(i => !i.pull_request).map(issue => {
      const labels = (issue.labels || []).map(l => `<span class="label">${escapeHTML(l.name)}</span>`).join('');
      const assignees = (issue.assignees || []).map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`).join('');
      return `
        <div class="issue">
          <a class="issue-title" href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">#${escapeHTML(issue.number)} ${escapeHTML(issue.title)}</a>
          <div class="issue-meta">
            by @${escapeHTML(issue.user && issue.user.login)} • ${labels} ${assignees}
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    container.innerHTML = `<div class="error">${escapeHTML(err.message)}</div>`;
  }
}

document.getElementById('load').addEventListener('click', loadIssues);
</script>
</body>
</html>
