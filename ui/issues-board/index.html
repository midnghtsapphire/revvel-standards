<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  input, select, button { padding: 8px 12px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font-size: 14px; }
  button { cursor: pointer; background: #238636; border-color: #238636; }
  button:hover { background: #2ea043; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; margin-bottom: 10px; }
  .issue-title { font-size: 16px; font-weight: 600; color: #58a6ff; text-decoration: none; }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta { font-size: 12px; color: #8b949e; margin-top: 5px; }
  .label { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 4px; background: #30363d; color: #c9d1d9; }
  .assignee { display: inline-block; margin-right: 6px; color: #7ee787; }
  .loading, .error { padding: 20px; text-align: center; }
  .error { color: #f85149; }
</style>
</head>
<body>
  <h1>📋 Issues Board</h1>
  <div class="controls">
    <input id="repo" type="text" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="issues"></div>

<script>
/**
 * Escape HTML-sensitive characters to prevent XSS.
 * @param {any} value
 * @returns {string}
 */
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Validate that a URL uses http(s) to avoid javascript: URIs.
 * @param {string} url
 * @returns {string}
 */
function safeURL(url) {
  try {
    const u = new URL(url);
    if (u.protocol === 'http:' || u.protocol === 'https:') {
      return u.href;
    }
  } catch (_) { /* noop */ }
  return '#';
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const container = document.getElementById('issues');

  if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
    container.innerHTML = '<div class="error">Please enter a valid owner/repo.</div>';
    return;
  }

  container.innerHTML = '<div class="loading">Loading issues…</div>';

  try {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
    if (!res.ok) {
      throw new Error(`GitHub API returned ${res.status}`);
    }
    const issues = await res.json();

    if (!Array.isArray(issues) || issues.length === 0) {
      container.innerHTML = '<div class="loading">No issues found.</div>';
      return;
    }

    container.innerHTML = issues.map(issue => {
      const title = escapeHTML(issue.title);
      const url = escapeHTML(safeURL(issue.html_url));
      const number = escapeHTML(issue.number);
      const user = escapeHTML(issue.user && issue.user.login);
      const created = escapeHTML(issue.created_at);

      const labels = (issue.labels || []).map(l =>
        `<span class="label">${escapeHTML(l.name)}</span>`
      ).join('');

      const assignees = (issue.assignees || []).map(a =>
        `<span class="assignee">@${escapeHTML(a.login)}</span>`
      ).join('');

      return `
        <div class="issue">
          <a class="issue-title" href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
          <div class="issue-meta">
            Opened by ${user} on ${created}
          </div>
          <div style="margin-top:8px;">${labels}</div>
          <div style="margin-top:4px;">${assignees}</div>
        </div>
      `;
    }).join('');
  } catch (err) {
    container.innerHTML = `<div class="error">Error loading issues: ${escapeHTML(err.message)}</div>`;
  }
}

document.getElementById('load').addEventListener('click', loadIssues);
</script>
</body>
</html>
