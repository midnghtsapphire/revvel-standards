<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 20px;
  }
  h1 { color: #58a6ff; }
  .filters {
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  input, select, button {
    background: #161b22;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover { background: #21262d; }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 10px;
  }
  .issue-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .issue-title a {
    color: #58a6ff;
    text-decoration: none;
  }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta {
    font-size: 12px;
    color: #8b949e;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    background: #21262d;
    font-size: 11px;
    margin-right: 4px;
  }
  .loading, .error { color: #8b949e; padding: 20px; text-align: center; }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div class="filters">
  <input type="text" id="repoInput" placeholder="owner/repo" value="" />
  <select id="stateSelect">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button id="loadBtn">Load Issues</button>
</div>
<div id="issues"><div class="loading">Enter a repository (owner/repo) and click Load Issues.</div></div>

<script>
  // Escape HTML-sensitive characters to prevent XSS from user-controlled
  // GitHub content (issue titles, label names, usernames, URLs, etc.).
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function loadIssues() {
    const repo = document.getElementById('repoInput').value.trim();
    const state = document.getElementById('stateSelect').value;
    const container = document.getElementById('issues');

    if (!repo || !/^[^/\s]+\/[^/\s]+$/.test(repo)) {
      container.innerHTML = '<div class="error">Please enter a valid owner/repo.</div>';
      return;
    }

    container.innerHTML = '<div class="loading">Loading issues…</div>';

    try {
      const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
      const issues = await res.json();

      if (!Array.isArray(issues) || issues.length === 0) {
        container.innerHTML = '<div class="loading">No issues found.</div>';
        return;
      }

      // Filter out pull requests (GitHub API returns PRs in issues endpoint).
      const filtered = issues.filter(i => !i.pull_request);

      container.innerHTML = filtered.map(issue => {
        const title = escapeHTML(issue.title);
        const htmlUrl = escapeHTML(issue.html_url);
        const number = escapeHTML(issue.number);
        const userLogin = escapeHTML(issue.user && issue.user.login);
        const createdAt = escapeHTML(issue.created_at);

        const labels = Array.isArray(issue.labels)
          ? issue.labels.map(l => `<span class="label">${escapeHTML(l.name)}</span>`).join('')
          : '';

        const assignees = Array.isArray(issue.assignees) && issue.assignees.length
          ? 'Assigned: ' + issue.assignees.map(a => escapeHTML(a.login)).join(', ')
          : '';

        return `
          <div class="issue">
            <div class="issue-title">
              <a href="${htmlUrl}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
            </div>
            <div class="issue-meta">
              <span>by ${userLogin}</span>
              <span>${createdAt}</span>
              <span>${labels}</span>
              <span>${assignees}</span>
            </div>
          </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="error">${escapeHTML(err.message)}</div>`;
    }
  }

  document.getElementById('loadBtn').addEventListener('click', loadIssues);
</script>
</body>
</html>
