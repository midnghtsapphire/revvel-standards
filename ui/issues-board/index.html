<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #58a6ff;
  }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }
  .issue a {
    color: #58a6ff;
    text-decoration: none;
    font-weight: 600;
  }
  .issue a:hover {
    text-decoration: underline;
  }
  .labels {
    margin-top: 6px;
  }
  .label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    background: #21262d;
    margin-right: 4px;
  }
  .assignees {
    font-size: 13px;
    color: #8b949e;
    margin-top: 4px;
  }
  #status {
    color: #8b949e;
  }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<p id="status">Loading issues...</p>
<div id="issues"></div>

<script>
  // Escape HTML to prevent XSS from user-controlled GitHub data
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function loadIssues() {
    const status = document.getElementById('status');
    const container = document.getElementById('issues');
    try {
      const repo = 'ProfullstackInc/profullstack'; // adjust if needed
      const res = await fetch(`https://api.github.com/repos/${repo}/issues?state=open&per_page=50`);
      if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
      const issues = await res.json();

      if (!Array.isArray(issues) || issues.length === 0) {
        status.textContent = 'No open issues.';
        return;
      }

      status.textContent = `Showing ${issues.length} open issues.`;

      container.innerHTML = issues.map(issue => {
        const title = escapeHTML(issue.title);
        const url = escapeHTML(issue.html_url);
        const number = escapeHTML(issue.number);
        const labels = (issue.labels || [])
          .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
          .join('');
        const assignees = (issue.assignees || [])
          .map(a => escapeHTML(a.login))
          .join(', ');

        return `
          <div class="issue">
            <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} — ${title}</a>
            <div class="labels">${labels}</div>
            ${assignees ? `<div class="assignees">Assigned: ${assignees}</div>` : ''}
          </div>
        `;
      }).join('');
    } catch (err) {
      status.textContent = `Error loading issues: ${escapeHTML(err.message)}`;
    }
  }

  loadIssues();
</script>
</body>
</html>
