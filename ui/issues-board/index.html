<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Issues Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  input, select, button { padding: 8px 12px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; }
  button { cursor: pointer; }
  button:hover { background: #21262d; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; margin-bottom: 10px; }
  .issue-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .issue-title a { color: #58a6ff; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta { font-size: 13px; color: #8b949e; }
  .label { display: inline-block; padding: 2px 8px; margin-right: 5px; border-radius: 12px; background: #21262d; font-size: 12px; }
  .assignee { display: inline-block; margin-right: 8px; }
  .stats { margin-bottom: 20px; padding: 10px; background: #161b22; border-radius: 6px; }
</style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <div class="stats" id="stats">Loading…</div>
  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <input id="filter" placeholder="Filter by title…" />
    <button id="load">Load</button>
  </div>
  <div id="issues"></div>

<script>
// Escape HTML-sensitive characters to prevent XSS when interpolating
// user-controlled data (issue titles, labels, usernames, URLs) into HTML.
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const filter = document.getElementById('filter').value.toLowerCase();
  const container = document.getElementById('issues');
  const stats = document.getElementById('stats');

  if (!repo || !/^[^/]+\/[^/]+$/.test(repo)) {
    container.innerHTML = '<p>Please enter a valid owner/repo.</p>';
    stats.textContent = '';
    return;
  }

  stats.textContent = 'Loading issues…';
  container.innerHTML = '';

  try {
    const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=100`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
    const issues = await res.json();

    // Filter out pull requests and apply title filter
    const filtered = issues
      .filter(i => !i.pull_request)
      .filter(i => !filter || (i.title || '').toLowerCase().includes(filter));

    stats.textContent = `Showing ${filtered.length} issue(s) from ${repo}`;

    if (filtered.length === 0) {
      container.innerHTML = '<p>No issues found.</p>';
      return;
    }

    container.innerHTML = filtered.map(issue => {
      const labels = (issue.labels || [])
        .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
        .join('');
      const assignees = (issue.assignees || [])
        .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
        .join('');
      return `
        <div class="issue">
          <div class="issue-title">
            <a href="${escapeHTML(issue.html_url)}" target="_blank" rel="noopener noreferrer">
              #${escapeHTML(issue.number)} — ${escapeHTML(issue.title)}
            </a>
          </div>
          <div class="issue-meta">
            ${labels}
            ${assignees}
            <span>state: ${escapeHTML(issue.state)}</span>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    stats.textContent = '';
    container.innerHTML = `<p>Error: ${escapeHTML(err.message)}</p>`;
  }
}

document.getElementById('load').addEventListener('click', loadIssues);
document.getElementById('filter').addEventListener('input', loadIssues);
</script>
</body>
</html>
