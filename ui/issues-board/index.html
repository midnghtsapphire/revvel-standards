<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #58a6ff;
    border-bottom: 1px solid #30363d;
    padding-bottom: 10px;
  }
  .controls {
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  input, select, button {
    background: #161b22;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    cursor: pointer;
    background: #238636;
    border-color: #238636;
    color: white;
  }
  button:hover { background: #2ea043; }
  .issue {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 10px;
  }
  .issue-title {
    font-weight: 600;
    color: #58a6ff;
    text-decoration: none;
    font-size: 16px;
  }
  .issue-title:hover { text-decoration: underline; }
  .issue-meta {
    color: #8b949e;
    font-size: 12px;
    margin-top: 5px;
  }
  .label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    margin-right: 5px;
    background: #30363d;
    color: #c9d1d9;
  }
  .assignee {
    display: inline-block;
    margin-left: 5px;
    color: #8b949e;
    font-size: 12px;
  }
  #status { color: #8b949e; font-style: italic; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div class="controls">
  <input type="text" id="repo" placeholder="owner/repo" value="midnghtsapphire/repo" />
  <select id="state">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
    <option value="all">All</option>
  </select>
  <button onclick="loadIssues()">Load Issues</button>
</div>
<div id="status"></div>
<div id="issues"></div>

<script>
/**
 * Escape HTML-sensitive characters to prevent XSS.
 * @param {*} value - Any value that will be coerced to a string.
 * @returns {string} - HTML-safe string.
 */
function escapeHTML(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadIssues() {
  const repo = document.getElementById('repo').value.trim();
  const state = document.getElementById('state').value;
  const statusEl = document.getElementById('status');
  const container = document.getElementById('issues');

  if (!repo || !repo.includes('/')) {
    statusEl.textContent = 'Please enter a valid owner/repo';
    return;
  }

  statusEl.textContent = 'Loading...';
  container.innerHTML = '';

  try {
    const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
    if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
    const issues = await response.json();

    if (!Array.isArray(issues) || issues.length === 0) {
      statusEl.textContent = 'No issues found.';
      return;
    }

    statusEl.textContent = `Loaded ${issues.length} issues.`;

    container.innerHTML = issues.map(issue => {
      const safeUrl = escapeHTML(issue.html_url);
      const safeTitle = escapeHTML(issue.title);
      const safeNumber = escapeHTML(issue.number);
      const safeState = escapeHTML(issue.state);
      const safeUser = escapeHTML(issue.user && issue.user.login);

      const labels = Array.isArray(issue.labels)
        ? issue.labels.map(l => `<span class="label">${escapeHTML(l.name)}</span>`).join('')
        : '';

      const assignees = Array.isArray(issue.assignees)
        ? issue.assignees.map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`).join('')
        : '';

      return `
        <div class="issue">
          <a class="issue-title" href="${safeUrl}" target="_blank" rel="noopener noreferrer">#${safeNumber} ${safeTitle}</a>
          <div class="issue-meta">
            State: ${safeState} • Opened by @${safeUser}
            ${labels ? '<br>' + labels : ''}
            ${assignees ? '<br>Assignees: ' + assignees : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    statusEl.textContent = `Error: ${escapeHTML(err.message)}`;
  }
}
</script>
</body>
</html>
