<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 24px;
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #8b949e;
      margin-bottom: 24px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #238636;
      border-color: #238636;
    }
    button:hover {
      background: #2ea043;
    }
    .issues {
      display: grid;
      gap: 12px;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }
    .issue-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .issue-title a {
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title a:hover {
      text-decoration: underline;
    }
    .issue-meta {
      color: #8b949e;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .labels {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .label {
      background: #1f6feb;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    .assignees {
      color: #8b949e;
      font-size: 12px;
      margin-top: 6px;
    }
    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>🎯 Issues Board</h1>
  <p class="subtitle">Track open issues across the repository</p>

  <div class="controls">
    <input id="repo" placeholder="owner/repo" value="" />
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>

  <div id="output" class="issues">
    <div class="loading">Enter a repo (owner/repo) and click Load Issues.</div>
  </div>

  <script>
    // Escape HTML-sensitive characters to prevent XSS when interpolating
    // user-controlled GitHub data (titles, labels, usernames, URLs) into HTML.
    function escapeHTML(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const output = document.getElementById('output');

      if (!repo || !repo.includes('/')) {
        output.innerHTML = '<div class="error">Please enter a valid repo (owner/repo).</div>';
        return;
      }

      output.innerHTML = '<div class="loading">Loading issues...</div>';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
        const issues = await res.json();

        // Filter out pull requests
        const realIssues = issues.filter(i => !i.pull_request);

        if (realIssues.length === 0) {
          output.innerHTML = '<div class="loading">No issues found.</div>';
          return;
        }

        output.innerHTML = realIssues.map(issue => {
          const title = escapeHTML(issue.title);
          const htmlUrl = escapeHTML(issue.html_url);
          const number = escapeHTML(issue.number);
          const userLogin = escapeHTML(issue.user && issue.user.login);
          const createdAt = escapeHTML(new Date(issue.created_at).toLocaleDateString());

          const labelsHTML = (issue.labels || [])
            .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
            .join('');

          const assigneesHTML = (issue.assignees && issue.assignees.length > 0)
            ? `<div class="assignees">Assigned: ${issue.assignees.map(a => escapeHTML(a.login)).join(', ')}</div>`
            : '';

          return `
            <div class="issue">
              <div class="issue-title">
                <a href="${htmlUrl}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              </div>
              <div class="issue-meta">Opened by ${userLogin} on ${createdAt}</div>
              <div class="labels">${labelsHTML}</div>
              ${assigneesHTML}
            </div>
          `;
        }).join('');
      } catch (err) {
        output.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
