<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues Board</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .filters { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .filters input, .filters select { padding: 8px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; }
  .issues { display: grid; gap: 12px; }
  .issue { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .issue-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
  .issue-title a { color: #58a6ff; text-decoration: none; }
  .issue-title a:hover { text-decoration: underline; }
  .issue-meta { font-size: 13px; color: #8b949e; }
  .label { display: inline-block; padding: 2px 8px; margin-right: 4px; border-radius: 12px; background: #1f6feb; color: white; font-size: 11px; }
  .assignee { display: inline-block; margin-right: 6px; font-size: 12px; color: #7ee787; }
  .status { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .status.open { background: #238636; color: white; }
  .status.closed { background: #8957e5; color: white; }
  .loading, .error { text-align: center; padding: 40px; color: #8b949e; }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>📋 Issues Board</h1>
<div class="filters">
  <input type="text" id="searchInput" placeholder="Search issues..." />
  <select id="stateFilter">
    <option value="all">All</option>
    <option value="open" selected>Open</option>
    <option value="closed">Closed</option>
  </select>
  <input type="text" id="repoInput" placeholder="owner/repo" value="" />
  <button id="loadBtn">Load</button>
</div>
<div id="issues" class="issues"><div class="loading">Enter a repo (owner/repo) and click Load.</div></div>

<script>
  /**
   * Escape HTML-sensitive characters to prevent XSS.
   * Converts &, <, >, ", ' into their respective HTML entities.
   */
  function escapeHTML(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  const issuesEl = document.getElementById('issues');
  const searchInput = document.getElementById('searchInput');
  const stateFilter = document.getElementById('stateFilter');
  const repoInput = document.getElementById('repoInput');
  const loadBtn = document.getElementById('loadBtn');

  let allIssues = [];

  async function loadIssues() {
    const repo = repoInput.value.trim();
    if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
      issuesEl.innerHTML = '<div class="error">Invalid repo. Use owner/repo format.</div>';
      return;
    }
    const state = stateFilter.value;
    issuesEl.innerHTML = '<div class="loading">Loading...</div>';
    try {
      const url = `https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allIssues = await res.json();
      render();
    } catch (err) {
      issuesEl.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
    }
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = allIssues
      .filter(i => !i.pull_request)
      .filter(i => !q || (i.title || '').toLowerCase().includes(q));

    if (filtered.length === 0) {
      issuesEl.innerHTML = '<div class="loading">No issues found.</div>';
      return;
    }

    issuesEl.innerHTML = filtered.map(issue => {
      const title = escapeHTML(issue.title);
      const url = escapeHTML(issue.html_url);
      const number = escapeHTML(issue.number);
      const state = escapeHTML(issue.state);
      const labels = (issue.labels || [])
        .map(l => `<span class="label">${escapeHTML(l.name)}</span>`)
        .join('');
      const assignees = (issue.assignees || [])
        .map(a => `<span class="assignee">@${escapeHTML(a.login)}</span>`)
        .join('');
      const user = escapeHTML(issue.user && issue.user.login);
      const created = escapeHTML(new Date(issue.created_at).toLocaleDateString());

      return `
        <div class="issue">
          <div class="issue-title">
            <a href="${url}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
            <span class="status ${state === 'open' ? 'open' : 'closed'}">${state}</span>
          </div>
          <div class="issue-meta">
            Opened by @${user} on ${created}
            ${assignees ? ' &middot; ' + assignees : ''}
          </div>
          <div style="margin-top:8px;">${labels}</div>
        </div>
      `;
    }).join('');
  }

  loadBtn.addEventListener('click', loadIssues);
  searchInput.addEventListener('input', render);
  stateFilter.addEventListener('change', loadIssues);
</script>
</body>
</html>
