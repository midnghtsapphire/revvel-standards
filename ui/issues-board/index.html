<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issues Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.5rem;
    }
    .controls {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .controls input, .controls select, .controls button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .controls button {
      cursor: pointer;
    }
    .controls button:hover {
      background: #21262d;
    }
    .issue {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .issue-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }
    .issue-title a {
      color: #58a6ff;
      text-decoration: none;
    }
    .issue-title a:hover {
      text-decoration: underline;
    }
    .issue-meta {
      font-size: 0.8rem;
      color: #8b949e;
    }
    .labels {
      display: inline-flex;
      gap: 0.25rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .label {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-size: 0.7rem;
      background: #30363d;
      color: #c9d1d9;
    }
    .loading, .error {
      padding: 1rem;
      text-align: center;
      color: #8b949e;
    }
    .error {
      color: #f85149;
    }
  </style>
</head>
<body>
  <h1>📋 GitHub Issues Board</h1>
  <div class="controls">
    <input type="text" id="repo" placeholder="owner/repo" value="">
    <select id="state">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <button id="load">Load Issues</button>
  </div>
  <div id="issues"></div>

  <script>
    // XSS mitigation: escape HTML-sensitive characters before interpolation.
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Validate URL to ensure it's safe (http/https only) before using in href.
    function safeURL(url) {
      try {
        const u = new URL(url);
        if (u.protocol === 'http:' || u.protocol === 'https:') {
          return u.toString();
        }
      } catch (e) {
        // invalid URL
      }
      return '#';
    }

    async function loadIssues() {
      const repo = document.getElementById('repo').value.trim();
      const state = document.getElementById('state').value;
      const container = document.getElementById('issues');

      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
        container.innerHTML = '<div class="error">Please enter a valid owner/repo.</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading...</div>';

      try {
        const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(repo.split('/')[0])}/${encodeURIComponent(repo.split('/')[1])}/issues?state=${encodeURIComponent(state)}&per_page=50`);
        if (!res.ok) {
          throw new Error(`GitHub API returned ${res.status}`);
        }
        const issues = await res.json();

        if (!Array.isArray(issues) || issues.length === 0) {
          container.innerHTML = '<div class="loading">No issues found.</div>';
          return;
        }

        container.innerHTML = issues.map(issue => {
          const title = escapeHTML(issue.title);
          const url = safeURL(issue.html_url);
          const number = escapeHTML(issue.number);
          const user = escapeHTML(issue.user && issue.user.login);
          const created = escapeHTML(issue.created_at);

          const labels = (issue.labels || []).map(l =>
            `<span class="label">${escapeHTML(l.name)}</span>`
          ).join('');

          const assignees = (issue.assignees || []).map(a =>
            escapeHTML(a.login)
          ).join(', ');

          return `
            <div class="issue">
              <div class="issue-title">
                <a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">#${number} ${title}</a>
              </div>
              <div class="issue-meta">
                Opened by ${user} on ${created}
                ${assignees ? ` · Assigned to ${assignees}` : ''}
              </div>
              <div class="labels">${labels}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="error">Error: ${escapeHTML(err.message)}</div>`;
      }
    }

    document.getElementById('load').addEventListener('click', loadIssues);
  </script>
</body>
</html>
