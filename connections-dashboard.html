<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Connections Dashboard</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;margin:1.5rem;color:#111}
  h1{margin:0 0 .25rem}
  .meta{color:#666;margin-bottom:1rem}
  .controls{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  input,select{padding:.4rem .5rem;font:inherit;border:1px solid #ccc;border-radius:6px}
  table{border-collapse:collapse;width:100%}
  th,td{border-bottom:1px solid #eee;padding:.4rem .55rem;text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:#fafafa;cursor:pointer}
  code{background:#f4f4f4;padding:.1rem .3rem;border-radius:4px}
  .v{color:#138000;font-weight:600}.u{color:#b06b00;font-weight:600}
  .tag{display:inline-block;background:#eef;border-radius:4px;padding:0 .35rem;margin:1px;font-size:12px}
</style>
</head>
<body>
<h1>🔌 Connections Dashboard</h1>
<div class="meta">Generated from <code>config/connections.yml</code> — on-demand, always fresh. Owner: midnghtsapphire · 2026-06-13</div>
<div class="controls">
  <input id="q" placeholder="filter by name / access / connects-to…" size="32"/>
  <select id="type"><option value="">all types</option></select>
  <select id="status"><option value="">all statuses</option><option value="verified">verified</option><option value="unverified">unverified</option></select>
  <span id="count" class="meta"></span>
</div>
<table id="t"><thead><tr>
  <th data-k="id">ID</th><th data-k="type">Type</th><th data-k="status">Status</th>
  <th data-k="auth">Auth</th><th>Access</th><th>Connects to</th><th>Used by</th><th>Notes</th>
</tr></thead><tbody></tbody></table>
<script>
const DATA = [{"id":"claude","name":"Claude (this assistant)","type":"agent","auth":"key","env":"ANTHROPIC_API_KEY","status":"verified","access":["code-gen","code-review","planning","repo-edit","pr-merge","orchestration"],"connects_to":["github","all-mcp-servers","bash","openrouter"],"used_by":["interactive-sessions","claude-code-on-web"],"note":"Drives sessions; can reach every wired MCP server + GitHub. Opus 4.8."},{"id":"openrouter","name":"OpenRouter","type":"agent","auth":"key","env":"OPENROUTER_API_KEY","status":"verified","access":["code-gen","pr-review","triage","swarms"],"connects_to":["github","anthropic","perplexity","deepseek"],"used_by":["agent-fallback.yml","openrouter-assignee.yml","ai-pr-review-openrouter.yml"],"note":"Primary coding agent. Fallback chain: OpenRouter -> OpenHands -> manual."},{"id":"openhands","name":"OpenHands","type":"agent","auth":"key","env":"OPENHANDS_API_KEY","status":"verified","access":["code-gen","issue-resolve","pr-create"],"connects_to":["github","openrouter"],"used_by":["agent-fallback.yml","openhands-resolver.yml"],"note":"Pre-paywall Devin-class agent, free quota. Now instantiated as free fallback (#14541)."},{"id":"jules","name":"Jules (Google)","type":"agent","auth":"key","env":"JULES_API_KEY","status":"verified","access":["code-gen","pr-review","coding-tasks"],"connects_to":["github"],"used_by":["jules-coding-agent.yml","jules-invoke.yml","jules-pr-reviewer.yml"],"note":"Owner says Jules has access to Roo + Gemini/Opus and may be recursive — sub-connections UNVERIFIED below."},{"id":"devin","name":"Devin","type":"agent","auth":"paid","env":"DEVIN_API_KEY","status":"verified","access":["code-gen","autonomous-tasks"],"connects_to":["github"],"used_by":[],"note":"API key present. Owner: strong at finding varied errors in one review."},{"id":"cursor","name":"Cursor","type":"agent","auth":"key","env":"CURSOR_API_KEY","status":"verified","access":["code-gen"],"connects_to":["github"],"used_by":[],"note":"Being retired from :"mcp","auth":"oauth","env":"NOTION_API_KEY","status":"verified","access":["pages","databases","search","comments"],"connects_to":["notion"],"note":"Owner: Notion links to everything — central hub. Good candidate as cross-tool index."},{"id":"mcp-slack","name":"Slack MCP","type":"mcp","auth":"oauth","status":"verified","access":["messages","channels","canvas","search"],"connects_to":["slack"]},{"id":"mcp-airtable","name":"Airtable MCP","type":"mcp","auth":"oauth","status":"verified","access":["bases","tables","records"],"connects_to":["airtable"]},{"id":"mcp-google","name":"Google Workspace MCP (Gmail / Calendar / Drive)","type":"mcp","auth":"oauth","status":"verified","access":["email","calendar","files"],"connects_to":["google"]},{"id":"mcp-hubspot","name":"HubSpot MCP","type":"mcp","auth":"oauth","status":"verified","access":["crm","campaigns","contacts"],"connects_to":["hubspot"]},{"id":"mcp-figma","name":"Figma MCP","type":"mcp","auth":"oauth","status":"verified","access":["design-read","design-write","code-connect"],"connects_to":["figma"]},{"id":"mcp-canva","name":"Canva MCP","type":"mcp","auth":"oauth","status":"verified","access":["design","export","brand-templates"],"connects_to":["canva"]},{"id":"mcp-clickup","name":"ClickUp MCP","type":"mcp","auth":"oauth","status":"verified","access":["tasks","docs","time-tracking"],"connects_to":["clickup"]},{"id":"mcp-monday","name":"monday.com MCP","type":"mcp","auth":"oauth","status":"verified","access":["boards","items","workflows","agents"],"connects_to":["monday"]},{"id":"mcp-zapier","name":"Zapier MCP","type":"mcp","auth":"oauth","status":"verified","access":["9000-plus-app-actions"],"connects_to":["zapier"],"note":"Gateway to 9,000+ apps — the broadest single connection."},{"id":"mcp-huggingface","name":"Hugging Face MCP","type":"mcp","auth":"oauth","status":"verified","access":["models","datasets","papers","spaces"],"connects_to":["huggingface"]},{"id":"mcp-sentry","name":"Sentry MCP","type":"mcp","auth":"oauth","status":"verified","access":["error-monitoring"],"connects_to":["sentry"]},{"id":"crewai","name":"CrewAI","type":"api","auth":"key","env":"CREWAI_API_KEY","status":"verified","access":["multi-agent-orchestration","workflow-automation"],"connects_to":["github"]},{"id":"xai","name":"xAI / Grok","type":"api","auth":"key","env":"XAI_API_KEY, GROK_API_KEY","status":"verified","access":["motu-bnat-controller","xai-code-review"],"connects_to":[],"used_by":["xai-code-review.yml"]},{"id":"tavily","name":"Tavily","type":"api","auth":"key","env":"TAVILY_API_KEY","status":"verified","access":["web-search"]},{"id":"firecrawl","name":"Firecrawl","type":"api","auth":"key","env":"FIRECRAWL_API_KEY","status":"verified","access":["web-scrape","crawl"]},{"id":"brave-search","name":"Brave Search","type":"api","auth":"key","env":"BRAVE_SEARCH_API_KEY","status":"verified","access":["web-search"]},{"id":"composio","name":"Composio","type":"api","auth":"key","env":"COMPOSIO_API_KEY","status":"verified","access":["tool-integrations"]},{"id":"amplitude","name":"Amplitude","type":"api","auth":"key","env":"AMPLITUDE_API_KEY","status":"verified","access":["product-analytics"],"connects_to":["notion"],"used_by":["amplitude-events.yml","amplitude-to-notion.yml"]},{"id":"neon","name":"Neon","type":"api","auth":"key","env":"NEON_API_KEY","status":"verified","access":["serverless-postgres","preview-branches"],"used_by":["neon-branch.yml"],"note":"Actions-only secret (plus vars.NEON_PROJECT_ID); creates/deletes per-PR preview branches. Not read by any app or MCP server."},{"id":"resend","name":"Resend","type":"api","auth":"key","env":"RESEND_API_KEY","status":"verified","access":["transactional-email"]},{"id":"revenuecat","name":"RevenueCat","type":"api","auth":"paid","env":"REVENUECAT_SECRET_API_KEY","status":"verified","access":["subscriptions","iap"]},{"id":"openai","name":"OpenAI","type":"api","auth":"paid","env":"OPENAI_API_KEY","status":"verified","access":["llm","embeddings"]},{"id":"groq","name":"Groq","type":"api","auth":"key","env":"GROQ_API_KEY","status":"verified","access":["fast-llm-inference"]},{"id":"noimosai","name":"NoimosAI","type":"api","auth":"key","env":"NOIMOSAI_API_KEY","status":"verified","access":["code-review"],"used_by":["noimosai.yml"]},{"id":"google-maps","name":"Google Maps","type":"api","auth":"key","env":"GOOGLE_MAPS_API_KEY","status":"verified","access":["geocoding","places"]},{"id":"namecheap","name":"Namecheap","type":"api","auth":"key","env":"NAMECHEAP_API_KEY","status":"verified","access":["domains","dns"],"connects_to":["digitalocean"]},{"id":"vader","name":"VADER (Valence Aware Dictionary and sEntiment Reasoner)","type":"library","auth":"free","status":"unverified","access":["sentiment-analysis"],"connects_to":[],"note":"Lexicon + rule-based sentiment analysis (cjhutto/vaderSentiment), forked as midnghtsapphire/vaderSentiment. Owner wants it wired in (social/review/chatter sentiment). Not yet referenced by any workflow — stays unverified until actually used; flip to verified + set used_by once wired."},{"id":"roo","name":"Roo (Roo Code?)","type":"agent","auth":"unknown","status":"unverified","access":["code-gen"],"connects_to":["jules","linear"],"note":"Owner: 'the one that starts with R' that creates/promotes WR/PR via Linear, and that Jules can reach. Confirm identity + how it's invoked."},{"id":"jules-subconnections","name":"Jules → Roo / Gemini / Opus (recursive?)","type":"agent","auth":"unknown","status":"unverified","connects_to":["roo","gemini","opus"],"note":"Owner: Jules has access to Roo and Gemini/Opus and may run recursively. Confirm which models + whether recursion is enabled."}];
const tbody = document.querySelector('#t tbody');
const typeSel = document.getElementById('type');
[...new Set(DATA.map(d=>d.type))].sort().forEach(t=>{const o=document.createElement('option');o.value=o.textContent=t;typeSel.appendChild(o);});
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;',
}[c]));
const tags = (a) => (a || []).map((x) => '<span class="tag">' + esc(x) + '</span>').join('') || '—';
let sortK='type', asc=true;
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const ty=typeSel.value, st=document.getElementById('status').value;
  let rows=DATA.filter(d=>{
    const hay=JSON.stringify(d).toLowerCase();
    return (!q||hay.includes(q))&&(!ty||d.type===ty)&&(!st||d.status===st);
  });
  rows.sort((a,b)=>((a[sortK]||'')+'').localeCompare((b[sortK]||'')+'')*(asc?1:-1));
  tbody.innerHTML=rows.map(d=>'<tr>'+
    '<td><code>'+esc(d.id)+'</code><br><small>'+(d.name?esc(d.name):'')+'</small></td>'+
    '<td>'+esc(d.type)+'</td>'+
    '<td class="'+(d.status==='verified'?'v':'u')+'">'+esc(d.status||'')+'</td>'+
    '<td>'+(d.auth?esc(d.auth):'')+'</td>'+
    '<td>'+tags(d.access)+'</td><td>'+tags(d.connects_to)+'</td><td>'+tags(d.used_by)+'</td>'+
    '<td>'+(d.note?esc(d.note):'')+'</td></tr>').join('');
  document.getElementById('count').textContent=rows.length+' / '+DATA.length+' shown';
}
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;asc=sortK===k?!asc:true;sortK=k;render();});
['q','type','status'].forEach(id=>document.getElementById(id).addEventListener('input',render));
render();
</script>
</body>
</html>
