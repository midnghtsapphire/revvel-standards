# Revvel Standards markdown rules — the single source of truth.
#
# Both gates load this file:
#   lint-md.yml   markdownlint-cli, config_file: .markdownlint.yaml
#   npm run lint  scripts/markdownlint-repo.mjs -> markdownlint-cli2
# and .markdownlint.jsonc exists only to point markdownlint-cli2 here.
#
# It did not used to work that way. Both CLIs auto-discover
# .markdownlint.jsonc from the repo root and that discovery BEATS an explicit
# --config/config_file, so this file was inert: lint-md.yml named it, its
# header claimed the repo mandated MD022/MD024/MD032, and the lenient jsonc
# copy is what actually ran. Turning those three on is a 572-file reformat plus
# 215 MD024 findings that are not auto-fixable, so the rules below are the ones
# that were genuinely in force all along — now written where the workflow
# actually reads them, instead of being contradicted by a second file.
#
# See https://github.com/DavidAnson/markdownlint for rule details.

default: true

# MD013: Line length - disabled for docs with long URLs and tables
MD013: false

# MD033: Inline HTML - allowed for badges, custom formatting
MD033: false

# MD041: First line in file should be a top level heading - disabled
# because some files have front matter or comments first
MD041: false

# MD024: Multiple headings with the same content - disabled because docs
# intentionally repeat section headers (What it does, When to use, How,
# Caveats) across multiple process entries in one file.
MD024: false

# MD046: Code block style - consistent fenced style
MD046:
  style: fenced

# MD060: Table column style - disabled because separator rows and
# content rows use different spacing by convention in our docs
MD060: false

# Relaxed rules for audit prompts and checklists
MD022:
  lines_above: 0
  lines_below: 0
MD031: false
MD032: false
MD036: false
MD040: true
MD009: false
MD026:
  punctuation: '.,:!?"'
MD058: false
